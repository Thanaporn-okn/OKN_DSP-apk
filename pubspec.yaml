name: okn_dsp_apk
description: OKN DSP BP1048P4 Controller App

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Bluetooth control BP1048P4
  flutter_blue_plus: 6.1.2

  # Permission Android Bluetooth
  permission_handler: ^11.3.1

  # Save settings
  shared_preferences: ^2.2.3


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0


flutter:

  uses-material-design: true
