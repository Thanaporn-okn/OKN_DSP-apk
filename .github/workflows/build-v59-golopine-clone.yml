      - name: Static V59 UI and fail-closed checks
        shell: bash
        run: |
          set -euo pipefail
          cd "$SRC_DIR"
          test "$(find app/src/main/assets/i18n -name '*.json' | wc -l)" -eq 17
          grep -q 'versionCode 1059' app/build.gradle
          grep -q "versionName '59.0.0-clone'" app/build.gradle
          grep -q 'UiResetBand' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -q 'UiOutputQuick' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -q '_mute' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -Fq '"UiPowerStageVoltage": "แรงดันภาคขยายกำลัง"' app/src/main/assets/i18n/th_TH.json
          grep -Fq '"UiMuteAll": "ปิดเสียงทั้งหมด"' app/src/main/assets/i18n/th_TH.json
          grep -q 'LIVE_BOARD_USB' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -q 'HOST_TO_DEVICE_USB' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -q 'FLASH_ERASE_WRITE' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -q 'FLASH_ALLOWED' app/src/main/java/com/okn/golopineclone/MainActivity.java
          ! grep -R -n '<uses-permission' app/src/main/AndroidManifest.xml
          ! grep -R -n 'android.bluetooth\|android.hardware.usb\|UsbManager\|BluetoothGatt\|HttpURLConnection\|java.net' app/src/main/java
          ! grep -R -n 'INTERNET\|BLUETOOTH_CONNECT\|BLUETOOTH_SCAN\|WRITE_EXTERNAL_STORAGE' app/src/main/AndroidManifest.xml
          echo 'V59 clone UI/fail-closed checks PASS'

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;${{ env.ANDROID_PLATFORM }}" "build-tools;${{ env.ANDROID_BUILD_TOOLS }}"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$SRC_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Package APK and source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$SRC_DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/out/OKN_GoloPine_Clone_V59-debug.apk"
          cd "$SRC_DIR"
          zip -qr "$GITHUB_WORKSPACE/out/OKN_GoloPine_Clone_V59_Source.zip" . -x 'app/build/*' '.gradle/*'
          cd "$GITHUB_WORKSPACE/out"
          sha256sum OKN_GoloPine_Clone_V59-debug.apk OKN_GoloPine_Clone_V59_Source.zip > SHA256.txt
          echo 'V59 batch refinement; PEQ reset; CH1-CH7 local mute; Thai UI fixes; fail-closed offline only.' > BUILD_SCOPE.txt

      - uses: actions/upload-artifact@v7
        with:
          name: OKN_GOLOPINE_CLONE_V59
          path: out/*
          if-no-files-found: error
