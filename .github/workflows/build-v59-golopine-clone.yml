          set -euo pipefail
          BASE=.github/workflows/build-v58-golopine-clone.yml
          test -f "$BASE"
          WORK="$GITHUB_WORKSPACE/v59-golopine-clone-src"
          rm -rf "$WORK" && mkdir -p "$WORK"
          awk '/<<.B64_EOF./{f=1;next} f && /B64_EOF/{exit} f{print}' "$BASE" | sed 's/^[[:space:]]*//' > "$RUNNER_TEMP/v58.b64"
          base64 -d "$RUNNER_TEMP/v58.b64" > "$RUNNER_TEMP/v58.tar.gz"
          tar -xzf "$RUNNER_TEMP/v58.tar.gz" -C "$WORK"
