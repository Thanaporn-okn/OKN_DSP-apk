name: OKN GoloPine Clone V59 APK

on:
  push:
    branches: [main, master]
    paths: ['.github/workflows/build-v59-golopine-clone.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.9'
  ANDROID_PLATFORM: 'android-35'
  ANDROID_BUILD_TOOLS: '35.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Restore V58 base and upgrade to V59
