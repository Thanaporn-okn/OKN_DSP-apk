name: R76B BP1048P4 Android boot probe permission crash fix

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R76B_BP1048P4_ANDROID_BOOT_PROBE_PERMISSION_CRASH_FIX.yml"

permissions:
  contents: read

concurrency:
  group: r76b-bp1048p4-android-mode-elevated-boot-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-probe:
    name: Build S25+ mode-elevated AA55 boot-entry probe / NO FLASH COMMANDS
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK without obsolete tools package
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Create R76 Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/com/okn/dsp/r76b

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "OKN_BP1048P4_R76B_Mode_Elevated_Boot_Probe"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.okn.dsp.r76b'
              compileSdk 35

              defaultConfig {
                  applicationId "com.okn.dsp.r76b"
                  minSdk 26
                  targetSdk 35
                  versionCode 76
                  versionName "76.0-mode-elevated-boot-probe"
              }

              buildTypes {
                  debug {
                      debuggable true
                  }
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature
                  android:name="android.hardware.usb.host"
                  android:required="true" />

              <application
                  android:allowBackup="false"
                  android:label="OKN Boot Probe R76"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/okn/dsp/r76b/MainActivity.java <<'EOF'
          package com.okn.dsp.r76b;

          import android.app.Activity;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.hardware.usb.UsbConstants;
          import android.hardware.usb.UsbDevice;
          import android.hardware.usb.UsbDeviceConnection;
          import android.hardware.usb.UsbInterface;
          import android.hardware.usb.UsbManager;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.CheckBox;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.util.ArrayList;
          import java.util.Comparator;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;

          public final class MainActivity extends Activity {
              private static final int NORMAL_VID = 0x6324;
              private static final int NORMAL_PID = 0x1719;
              private static final int REF_BOOT_VID = 0x0000;
              private static final int REF_BOOT_PID = 0x2244;

              private static final int CONTROL_IF = 4;

              // Runtime production Feature report shape already established:
              // SET_REPORT Feature: 21 09 wValue=0300 IF4 len=8
              // GET_REPORT Feature: A1 01 wValue=0300 IF4 len=8
              private static final int BM_SET_FEATURE = 0x21;
              private static final int B_SET_REPORT = 0x09;
              private static final int BM_GET_FEATURE = 0xA1;
              private static final int B_GET_REPORT = 0x01;
              private static final int WVALUE_FEATURE = 0x0300;
              private static final int FEATURE_LEN = 8;

              private static final String ACTION_USB_PERMISSION =
                      "com.okn.dsp.r76b.USB_PERMISSION";

              private UsbManager usbManager;
              private TextView statusView;
              private TextView logView;
              private CheckBox lineModeConfirmed;
              private Button probeButton;
              private final StringBuilder log = new StringBuilder();
              private final Handler handler = new Handler(Looper.getMainLooper());

              private final BroadcastReceiver usbReceiver = new BroadcastReceiver() {
                  @Override
                  public void onReceive(Context context, Intent intent) {
                      if (!ACTION_USB_PERMISSION.equals(intent.getAction())) return;
                      UsbDevice device = intent.getParcelableExtra(UsbManager.EXTRA_DEVICE);
                      boolean granted = intent.getBooleanExtra(
                              UsbManager.EXTRA_PERMISSION_GRANTED, false);
                      append("USB permission result=" + granted);
                      if (granted && device != null) {
                          runProbe(device);
                      } else {
                          statusView.setText("Status: USB PERMISSION DENIED");
                      }
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  usbManager = (UsbManager) getSystemService(Context.USB_SERVICE);
                  registerReceiver(
                          usbReceiver,
                          new IntentFilter(ACTION_USB_PERMISSION),
                          Context.RECEIVER_NOT_EXPORTED);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(24, 24, 24, 24);

                  TextView title = new TextView(this);
                  title.setText("OKN BP1048P4 — R76 Mode-Elevated Boot Entry Probe");
                  title.setTextSize(20);
                  root.addView(title);

                  TextView warning = new TextView(this);
                  warning.setText(
                          "This probe sends ONLY the already-known runtime Feature AA→GET. " +
                          "It does NOT send flashboot updater commands and does NOT erase/program flash.\n\n" +
                          "Before pressing PROBE: put the board in REAL LINE-IN mode " +
                          "(not Rest/Standby), keep USB-C connected, then tick the checkbox.");
                  warning.setPadding(0, 10, 0, 12);
                  root.addView(warning);

                  statusView = new TextView(this);
                  statusView.setTextSize(18);
                  statusView.setText("Status: not scanned");
                  statusView.setPadding(0, 6, 0, 12);
                  root.addView(statusView);

                  Button scan = new Button(this);
                  scan.setText("PASSIVE SCAN");
                  scan.setOnClickListener(v -> scanUsb());
                  root.addView(scan);

                  lineModeConfirmed = new CheckBox(this);
                  lineModeConfirmed.setText(
                          "I confirmed the board is in real LINE-IN mode now");
                  root.addView(lineModeConfirmed);

                  probeButton = new Button(this);
                  probeButton.setText("PROBE AA→55 + WAIT FOR RE-ENUMERATION");
                  probeButton.setOnClickListener(v -> startProbe());
                  root.addView(probeButton);

                  Button copy = new Button(this);
                  copy.setText("COPY LOG");
                  copy.setOnClickListener(v -> copyLog());
                  root.addView(copy);

                  logView = new TextView(this);
                  logView.setTextIsSelectable(true);

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(logView);
                  root.addView(
                          scroll,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));

                  setContentView(root);

                  append("R76 started.");
                  append("Normal runtime: 6324:1719");
                  append("Reference bootloader literal: 0000:2244");
                  append("Probe sequence: runtime IF4 Feature SET AA, Feature GET, passive rescan.");
                  append("FLASH COMMANDS PRESENT=NO");
                  scanUsb();
              }

              @Override
              protected void onDestroy() {
                  unregisterReceiver(usbReceiver);
                  super.onDestroy();
              }

              private void scanUsb() {
                  append("");
                  append("=== USB SCAN ===");

                  List<UsbDevice> devices =
                          new ArrayList<>(usbManager.getDeviceList().values());
                  devices.sort(
                          Comparator.comparingInt(UsbDevice::getVendorId)
                                  .thenComparingInt(UsbDevice::getProductId));

                  if (devices.isEmpty()) {
                      statusView.setText("Status: NO USB DEVICE");
                      append("No USB devices enumerated.");
                      return;
                  }

                  for (UsbDevice d : devices) {
                      dumpDevice(d);
                      if (isNormalRuntime(d)) {
                          statusView.setText("Status: NORMAL RUNTIME 6324:1719");
                      } else if (isReferenceBootCandidate(d)) {
                          statusView.setText(
                                  "Status: REFERENCE PCTOOL BOOTLOADER CANDIDATE");
                      }
                  }
              }

              private void startProbe() {
                  if (!lineModeConfirmed.isChecked()) {
                      statusView.setText("Status: CONFIRM LINE-IN MODE FIRST");
                      append("Probe blocked: Line-In confirmation checkbox is not set.");
                      return;
                  }

                  UsbDevice target = findNormalRuntime();
                  if (target == null) {
                      statusView.setText("Status: NORMAL RUNTIME NOT FOUND");
                      append("Probe blocked: 6324:1719 not found.");
                      return;
                  }

                  probeButton.setEnabled(false);

                  if (!usbManager.hasPermission(target)) {
                      append("Requesting Android USB permission for 6324:1719.");
                      // Android 14+ / targetSdk 34+ rejects a mutable PendingIntent
                      // backed by an implicit Intent.  R76 crashed here on S25+.
                      // Bind the custom permission broadcast to this package so the
                      // mutable PendingIntent is explicit enough for UsbManager to
                      // attach EXTRA_DEVICE / EXTRA_PERMISSION_GRANTED safely.
                      Intent permissionIntent =
                              new Intent(ACTION_USB_PERMISSION)
                                      .setPackage(getPackageName());

                      PendingIntent pi = PendingIntent.getBroadcast(
                              this,
                              76,
                              permissionIntent,
                              PendingIntent.FLAG_UPDATE_CURRENT |
                                      PendingIntent.FLAG_MUTABLE);
                      usbManager.requestPermission(target, pi);
                      return;
                  }

                  runProbe(target);
              }

              private void runProbe(UsbDevice d) {
                  append("");
                  append("=== MODE-ELEVATED BOOT ENTRY PROBE ===");
                  append("User-confirmed real Line-In mode=YES");

                  UsbInterface intf = findInterfaceById(d, CONTROL_IF);
                  if (intf == null) {
                      append("FAIL: runtime control IF4 not found.");
                      statusView.setText("Status: IF4 NOT FOUND");
                      probeButton.setEnabled(true);
                      return;
                  }

                  UsbDeviceConnection conn = usbManager.openDevice(d);
                  if (conn == null) {
                      append("FAIL: openDevice returned null.");
                      statusView.setText("Status: OPEN DEVICE FAILED");
                      probeButton.setEnabled(true);
                      return;
                  }

                  try {
                      boolean claimed = conn.claimInterface(intf, true);
                      append("claim IF4=" + claimed);
                      if (!claimed) {
                          statusView.setText("Status: CLAIM IF4 FAILED");
                          return;
                      }

                      byte[] baseline = new byte[FEATURE_LEN];
                      int baseRc = conn.controlTransfer(
                              BM_GET_FEATURE,
                              B_GET_REPORT,
                              WVALUE_FEATURE,
                              CONTROL_IF,
                              baseline,
                              baseline.length,
                              1000);
                      append("GET FEATURE baseline rc=" + baseRc +
                              " data=" + hex(baseline, baseRc));

                      byte[] set = new byte[FEATURE_LEN];
                      set[0] = (byte) 0xAA;

                      int setRc = conn.controlTransfer(
                              BM_SET_FEATURE,
                              B_SET_REPORT,
                              WVALUE_FEATURE,
                              CONTROL_IF,
                              set,
                              set.length,
                              1000);
                      append("SET FEATURE AA rc=" + setRc);

                      if (setRc != FEATURE_LEN) {
                          statusView.setText("Status: AA SET FAILED");
                          append("Probe stopped: SET AA did not transfer 8 bytes.");
                          return;
                      }

                      byte[] after = new byte[FEATURE_LEN];
                      int getRc = conn.controlTransfer(
                              BM_GET_FEATURE,
                              B_GET_REPORT,
                              WVALUE_FEATURE,
                              CONTROL_IF,
                              after,
                              after.length,
                              1000);
                      append("GET FEATURE after AA rc=" + getRc +
                              " data=" + hex(after, getRc));

                      if (getRc > 0 && (after[0] & 0xFF) == 0x55) {
                          append("AA55_LATCH_CONFIRMED=YES");
                          statusView.setText(
                                  "Status: GET55 RECEIVED — WAITING FOR USB RE-ENUMERATION");
                      } else {
                          append("AA55_LATCH_CONFIRMED=NO");
                          statusView.setText("Status: GET55 NOT OBSERVED");
                      }

                  } finally {
                      try {
                          conn.releaseInterface(intf);
                      } catch (Throwable ignored) {}
                      conn.close();
                  }

                  // Do not send anything else. Only observe enumeration.
                  append("No further USB commands will be sent.");
                  append("Waiting 1/2/4/8 seconds for passive re-enumeration...");

                  scheduleRescan(1000);
                  scheduleRescan(2000);
                  scheduleRescan(4000);
                  scheduleRescan(8000);

                  handler.postDelayed(
                          () -> probeButton.setEnabled(true),
                          9000);
              }

              private void scheduleRescan(long delayMs) {
                  handler.postDelayed(() -> {
                      append("");
                      append("=== PASSIVE RESCAN +" + delayMs + "ms ===");
                      UsbDevice normal = findNormalRuntime();
                      UsbDevice boot = findReferenceBootCandidate();

                      if (boot != null) {
                          append("BOOTLOADER_REENUMERATION_CANDIDATE=YES");
                          dumpDevice(boot);
                          statusView.setText(
                                  "Status: REFERENCE PCTOOL BOOTLOADER CANDIDATE DETECTED");
                      } else if (normal != null) {
                          append("NORMAL_RUNTIME_STILL_PRESENT=YES");
                          dumpDevice(normal);
                      } else {
                          append("TARGET_TEMPORARILY_NOT_ENUMERATED=YES");
                      }
                  }, delayMs);
              }

              private UsbDevice findNormalRuntime() {
                  for (UsbDevice d : usbManager.getDeviceList().values()) {
                      if (isNormalRuntime(d)) return d;
                  }
                  return null;
              }

              private UsbDevice findReferenceBootCandidate() {
                  for (UsbDevice d : usbManager.getDeviceList().values()) {
                      if (isReferenceBootCandidate(d)) return d;
                  }
                  return null;
              }

              private static boolean isNormalRuntime(UsbDevice d) {
                  return d.getVendorId() == NORMAL_VID &&
                          d.getProductId() == NORMAL_PID;
              }

              private static boolean isReferenceBootCandidate(UsbDevice d) {
                  if (d.getVendorId() != REF_BOOT_VID ||
                          d.getProductId() != REF_BOOT_PID) {
                      return false;
                  }
                  for (int i = 0; i < d.getInterfaceCount(); i++) {
                      UsbInterface f = d.getInterface(i);
                      if (f.getId() == 0 &&
                              f.getInterfaceClass() == UsbConstants.USB_CLASS_HID &&
                              f.getInterfaceSubclass() == 0 &&
                              f.getInterfaceProtocol() == 0 &&
                              f.getEndpointCount() == 0) {
                          return true;
                      }
                  }
                  return false;
              }

              private static UsbInterface findInterfaceById(UsbDevice d, int id) {
                  for (int i = 0; i < d.getInterfaceCount(); i++) {
                      UsbInterface f = d.getInterface(i);
                      if (f.getId() == id) return f;
                  }
                  return null;
              }

              private void dumpDevice(UsbDevice d) {
                  append(String.format(
                          Locale.US,
                          "DEVICE %04X:%04X name=%s class=%02X/%02X/%02X ifaces=%d",
                          d.getVendorId(),
                          d.getProductId(),
                          d.getDeviceName(),
                          d.getDeviceClass(),
                          d.getDeviceSubclass(),
                          d.getDeviceProtocol(),
                          d.getInterfaceCount()));

                  for (int i = 0; i < d.getInterfaceCount(); i++) {
                      UsbInterface f = d.getInterface(i);
                      append(String.format(
                              Locale.US,
                              "  IF[%d] id=%d alt=%d class=%02X/%02X/%02X eps=%d",
                              i,
                              f.getId(),
                              f.getAlternateSetting(),
                              f.getInterfaceClass(),
                              f.getInterfaceSubclass(),
                              f.getInterfaceProtocol(),
                              f.getEndpointCount()));
                  }
              }

              private static String hex(byte[] b, int len) {
                  if (len <= 0) return "";
                  int n = Math.min(len, b.length);
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < n; i++) {
                      if (i != 0) sb.append(' ');
                      sb.append(String.format(Locale.US, "%02X", b[i] & 0xFF));
                  }
                  return sb.toString();
              }

              private void copyLog() {
                  ClipboardManager cb =
                          (ClipboardManager) getSystemService(CLIPBOARD_SERVICE);
                  cb.setPrimaryClip(
                          ClipData.newPlainText(
                                  "OKN R76 Mode-Elevated Boot Probe Log",
                                  log.toString()));
                  append("Log copied.");
              }

              private void append(String line) {
                  log.append(line).append('\n');
                  if (logView != null) logView.setText(log.toString());
              }
          }
          EOF

      - name: Source safety and exact-transfer audit
        id: safety
        shell: bash
        run: |
          set -euo pipefail

          SRC=app/src/main/java/com/okn/dsp/r76b/MainActivity.java

          # Exact intended runtime feature traffic.
          grep -F 'CONTROL_IF = 4' "$SRC"
          grep -F 'BM_SET_FEATURE = 0x21' "$SRC"
          grep -F 'B_SET_REPORT = 0x09' "$SRC"
          grep -F 'BM_GET_FEATURE = 0xA1' "$SRC"
          grep -F 'B_GET_REPORT = 0x01' "$SRC"
          grep -F 'WVALUE_FEATURE = 0x0300' "$SRC"
          grep -F 'FEATURE_LEN = 8' "$SRC"
          grep -F 'set[0] = (byte) 0xAA' "$SRC"

          # R76B Android 14+/15+/16 permission crash regression gate:
          # mutable PendingIntent must not use an implicit custom Intent.
          grep -F 'Intent permissionIntent =' "$SRC"
          grep -F 'new Intent(ACTION_USB_PERMISSION)' "$SRC"
          grep -F '.setPackage(getPackageName())' "$SRC"
          grep -F 'PendingIntent.FLAG_MUTABLE' "$SRC"

          python3 - "$SRC" <<'PY'
          from pathlib import Path
          import sys
          t=Path(sys.argv[1]).read_text(encoding="utf-8")
          bad = '''PendingIntent.getBroadcast(
                              this,
                              76,
                              new Intent(ACTION_USB_PERMISSION),'''
          if bad in t:
              raise SystemExit(
                  "R76 crash pattern still present: mutable implicit PendingIntent"
              )
          if ".setPackage(getPackageName())" not in t:
              raise SystemExit("explicit package binding missing")
          print("R76B_MUTABLE_IMPLICIT_PENDING_INTENT_CRASH_PATTERN_PRESENT=NO")
          print("R76B_USB_PERMISSION_INTENT_PACKAGE_BOUND=YES")
          PY

          # Must only contain Feature transfers; no Output/Input report traffic.
          ! grep -F '0x0200' "$SRC"
          ! grep -F '0x0100' "$SRC"

          # Absolutely no flashboot updater commands.
          ! grep -Eai \
            'chiperas|codedata|bootdat|constdat|cnfgdat|btupdat|upinfo|cxxx' \
            "$SRC"

          # No raw flash operations.
          ! grep -Eai \
            'FlashErase|FlashProgram|FlashWrite|SpiFlash|chip erase|program flash' \
            "$SRC"

          # No reboot/reset API from Android side.
          ! grep -Eai \
            'Reset_McuSystem|ROM_SysReset|jump_fun|ADR_FLASH_BOOT_FLAGE' \
            "$SRC"

          # Control transfer sites: baseline GET, SET AA, GET after AA = exactly 3.
          COUNT="$(grep -c 'conn.controlTransfer(' "$SRC")"
          test "$COUNT" -eq 3

          cat > R76_SAFETY_AUDIT.txt <<EOF
          R76_CONTROL_TRANSFER_CALLS=$COUNT
          R76_RUNTIME_CONTROL_INTERFACE=4
          R76_FEATURE_REPORT_LENGTH=8
          R76_SET_FEATURE_AA_PRESENT=YES
          R76_GET_FEATURE_PRESENT=YES
          R76_OUTPUT_REPORT_PRESENT=NO
          R76_INPUT_REPORT_PRESENT=NO
          R76_FLASHBOOT_UPDATER_COMMAND_PRESENT=NO
          R76_FLASH_ERASE_PROGRAM_API_PRESENT=NO
          R76_RESET_API_PRESENT=NO
          R76_POST_GET55_ACTION=PASSIVE_RESCAN_ONLY
          R76B_PERMISSION_PENDING_INTENT_EXPLICIT_PACKAGE=YES
          R76B_MUTABLE_IMPLICIT_PENDING_INTENT_CRASH_PATTERN_PRESENT=NO
          R76_PRODUCTION_FIRST_BOOTSTRAP_PROVEN=NO
          FLASH_ALLOWED=NO
          EOF

          cat R76_SAFETY_AUDIT.txt

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug

      - name: Verify APK and package artifact
        shell: bash
        run: |
          set -euo pipefail

          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"

          cp "$APK" OKN_BP1048P4_R76B_MODE_ELEVATED_BOOT_ENTRY_PROBE.apk

          sha256sum OKN_BP1048P4_R76B_MODE_ELEVATED_BOOT_ENTRY_PROBE.apk \
            | tee OKN_BP1048P4_R76B_MODE_ELEVATED_BOOT_ENTRY_PROBE_SHA256.txt

          grep -F 'R76_CONTROL_TRANSFER_CALLS=3' R76_SAFETY_AUDIT.txt
          grep -F 'R76_FLASHBOOT_UPDATER_COMMAND_PRESENT=NO' R76_SAFETY_AUDIT.txt
          grep -F 'R76_FLASH_ERASE_PROGRAM_API_PRESENT=NO' R76_SAFETY_AUDIT.txt
          grep -F 'R76_POST_GET55_ACTION=PASSIVE_RESCAN_ONLY' R76_SAFETY_AUDIT.txt
          grep -F 'R76B_PERMISSION_PENDING_INTENT_EXPLICIT_PACKAGE=YES' R76_SAFETY_AUDIT.txt
          grep -F 'R76B_MUTABLE_IMPLICIT_PENDING_INTENT_CRASH_PATTERN_PRESENT=NO' R76_SAFETY_AUDIT.txt
          grep -F 'FLASH_ALLOWED=NO' R76_SAFETY_AUDIT.txt

      - name: Upload R76 APK
        uses: actions/upload-artifact@v4
        with:
          name: R76B-OKN-BP1048P4-MODE-ELEVATED-BOOT-ENTRY-PROBE
          path: |
            OKN_BP1048P4_R76B_MODE_ELEVATED_BOOT_ENTRY_PROBE.apk
            OKN_BP1048P4_R76B_MODE_ELEVATED_BOOT_ENTRY_PROBE_SHA256.txt
            R76_SAFETY_AUDIT.txt
          if-no-files-found: error
          retention-days: 30

      - name: R76 final gate
        shell: bash
        run: |
          set -euo pipefail

          test "${{ steps.safety.outcome }}" = "success"

          grep -F 'R76_CONTROL_TRANSFER_CALLS=3' R76_SAFETY_AUDIT.txt
          grep -F 'R76_SET_FEATURE_AA_PRESENT=YES' R76_SAFETY_AUDIT.txt
          grep -F 'R76_GET_FEATURE_PRESENT=YES' R76_SAFETY_AUDIT.txt
          grep -F 'R76_OUTPUT_REPORT_PRESENT=NO' R76_SAFETY_AUDIT.txt
          grep -F 'R76_INPUT_REPORT_PRESENT=NO' R76_SAFETY_AUDIT.txt
          grep -F 'R76_FLASHBOOT_UPDATER_COMMAND_PRESENT=NO' R76_SAFETY_AUDIT.txt
          grep -F 'R76_FLASH_ERASE_PROGRAM_API_PRESENT=NO' R76_SAFETY_AUDIT.txt
          grep -F 'R76_RESET_API_PRESENT=NO' R76_SAFETY_AUDIT.txt
          grep -F 'R76_POST_GET55_ACTION=PASSIVE_RESCAN_ONLY' R76_SAFETY_AUDIT.txt
          grep -F 'R76B_PERMISSION_PENDING_INTENT_EXPLICIT_PACKAGE=YES' R76_SAFETY_AUDIT.txt
          grep -F 'R76B_MUTABLE_IMPLICIT_PENDING_INTENT_CRASH_PATTERN_PRESENT=NO' R76_SAFETY_AUDIT.txt
          grep -F 'FLASH_ALLOWED=NO' R76_SAFETY_AUDIT.txt

