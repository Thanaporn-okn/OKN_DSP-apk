name: OKN DSP V91 Auto Build

on:
  push:
    paths:
      - '**/OKN_DSP_V*_Sources.zip'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-latest-version:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Locate latest OKN_DSP source ZIP
        id: src
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Locate source failed at line $LINENO: $BASH_COMMAND (exit $rc)"; exit $rc' ERR

          ZIP_FILE="$(python3 - <<'PY'
          from pathlib import Path
          import re

          found = []
          for p in Path('.').rglob('OKN_DSP_V*_Sources.zip'):
              m = re.fullmatch(r'OKN_DSP_V(\d+)_Sources\.zip', p.name)
              if m:
                  found.append((int(m.group(1)), str(p)))

          if found:
              print(max(found, key=lambda item: item[0])[1])
          PY
          )"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No OKN_DSP_V*_Sources.zip found anywhere in the repository."
            find . -maxdepth 3 -type f -print | sort | head -200 || true
            exit 1
          fi

          ZIP_NAME="$(basename "$ZIP_FILE")"
          VERSION="$(echo "$ZIP_NAME" | sed -E 's/^OKN_DSP_(V[0-9]+)_Sources\.zip$/\1/')"
          if [[ ! "$VERSION" =~ ^V[0-9]+$ ]]; then
            echo "::error::Could not parse version from $ZIP_NAME"
            exit 1
          fi

          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Selected source: $ZIP_FILE ($VERSION)"

      - name: Extract source and locate Gradle project
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Extract failed at line $LINENO: $BASH_COMMAND (exit $rc)"; exit $rc' ERR

          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -q "${{ steps.src.outputs.zip }}" -d buildsrc

          SETTINGS_FILE="$(find buildsrc -type f -name settings.gradle -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle not found after unzip."
            find buildsrc -maxdepth 5 -type f -print | sort | head -200 || true
            exit 1
          fi

          SRC_DIR="$(dirname "$SETTINGS_FILE")"
          if [ ! -f "$SRC_DIR/app/build.gradle" ]; then
            echo "::error::app/build.gradle not found under detected project: $SRC_DIR"
            find "$SRC_DIR" -maxdepth 3 -type f -print | sort | head -200 || true
            exit 1
          fi

          echo "SRC_DIR=$SRC_DIR" >> "$GITHUB_ENV"
          echo "Detected Gradle project: $SRC_DIR"

      - name: Verify source SHA256
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SHA256 verification failed at line $LINENO: $BASH_COMMAND (exit $rc)"; exit $rc' ERR

          cd "$SRC_DIR"
          if [ ! -f Sources/SHA256SUMS.txt ]; then
            echo "::error::Sources/SHA256SUMS.txt is missing"
            exit 1
          fi
          sha256sum -c Sources/SHA256SUMS.txt

      - name: Run packaged safety preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Safety preflight failed at line $LINENO: $BASH_COMMAND (exit $rc)"; exit $rc' ERR

          cd "$SRC_DIR"
          CHECKS=(
            Sources/validate_v38_gate.py
            Sources/validate_v39_reset.py
            Sources/validate_v91_eq_gain_buttons.py
          )
          for CHECK in "${CHECKS[@]}"; do
            if [ -f "$CHECK" ]; then
              echo "===== Running $CHECK ====="
              python3 "$CHECK"
            else
              echo "::error::Required safety check missing: $CHECK"
              exit 1
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Preinstalled Android SDK check failed at line $LINENO: $BASH_COMMAND (exit $rc)"; exit $rc' ERR

          : "${ANDROID_HOME:?ANDROID_HOME is not set on this runner}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found at $SDKMANAGER"
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$SDKMANAGER" --version

      - name: Install Android 35 packages
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Android SDK package install failed at line $LINENO: $BASH_COMMAND (exit $rc)"; exit $rc' ERR

          # Accept standard Android SDK licenses non-interactively. Under pipefail,
          # yes can receive SIGPIPE when sdkmanager finishes, so this line is tolerant;
          # the actual package install below remains strict and will fail the job on error.
          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          "$SDKMANAGER" --list_installed | grep -E 'platform-tools|platforms;android-35|build-tools;35.0.0' || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Build Debug APK
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Gradle build failed at line $LINENO: $BASH_COMMAND (exit $rc)"; exit $rc' ERR

          echo "Project: $SRC_DIR"
          java -version
          gradle --version
          gradle --no-daemon --stacktrace --console=plain -p "$SRC_DIR" :app:assembleDebug

      - name: Package APK and SHA256
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::APK packaging failed at line $LINENO: $BASH_COMMAND (exit $rc)"; exit $rc' ERR

          mkdir -p dist
          APK="$SRC_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::APK not found at expected path: $APK"
            find "$SRC_DIR/app/build/outputs" -maxdepth 6 -type f -print 2>/dev/null || true
            exit 1
          fi

          OUT="dist/OKN_DSP_${{ steps.src.outputs.version }}-debug.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "dist/OKN_DSP_${{ steps.src.outputs.version }}-debug.apk.sha256"
          cat "dist/OKN_DSP_${{ steps.src.outputs.version }}-debug.apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: OKN_DSP_${{ steps.src.outputs.version }}_APK
          path: |
            dist/OKN_DSP_${{ steps.src.outputs.version }}-debug.apk
            dist/OKN_DSP_${{ steps.src.outputs.version }}-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
