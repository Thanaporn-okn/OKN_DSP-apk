name: OKN BP1048P4 R51 CI

"on":
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: okn-r51-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r51-host-verify:
    name: R51 host verify / no-EQ-gain audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PROJECT_ZIP: OKN_BP1048P4_R51_CLEANROOM_FW.zip
      BUILD_DIR: build-ci
      ARTIFACT_NAME: OKN_BP1048P4_R51_CI_ARTIFACT

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            python3 \
            unzip \
            zip

      - name: Locate R51 project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "Makefile" && -d "firmware" && -d "host" ]]; then
            ROOT="$PWD"
          elif [[ -f "${PROJECT_ZIP}" ]]; then
            rm -rf _r51_unpack
            mkdir -p _r51_unpack
            unzip -q "${PROJECT_ZIP}" -d _r51_unpack

            ROOT="$(find "$PWD/_r51_unpack" -type f -name Makefile -print -quit | xargs -r dirname)"
            if [[ -z "${ROOT}" ]]; then
              echo "::error::Makefile not found inside ${PROJECT_ZIP}"
              exit 1
            fi
          else
            echo "::error::R51 project not found."
            echo "Expected either:"
            echo "  1) Makefile + firmware/ + host/ at repository root"
            echo "  2) ${PROJECT_ZIP} at repository root"
            exit 1
          fi

          echo "root=${ROOT}" >> "$GITHUB_OUTPUT"
          echo "R51 project root: ${ROOT}"

      - name: Verify required R51 files
        shell: bash
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          set -euo pipefail
          required=(
            "Makefile"
            "host/test_r51.c"
            "firmware/app/okn_r51.c"
            "firmware/dsp/okn_gain7.c"
            "firmware/dsp/okn_gain7.h"
            "firmware/dsp/okn_peq7.c"
            "firmware/dsp/okn_peq7.h"
            "firmware/audio/okn_router7.c"
            "firmware/control/okn_usb_proto.c"
            "firmware/control/okn_usb_proto.h"
            "tools/audit_no_eq_gain.py"
          )

          for f in "${required[@]}"; do
            [[ -f "$f" ]] || {
              echo "::error file=$f::Missing required R51 file"
              exit 1
            }
          done

      - name: Safety gate - boot jump must stay disabled
        shell: bash
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          p = Path("firmware/control/okn_usb_proto.c")
          s = p.read_text(encoding="utf-8", errors="replace")

          m = re.search(
              r"#ifndef\s+OKN_ENABLE_BOOT_JUMP\s*"
              r"#define\s+OKN_ENABLE_BOOT_JUMP\s+([01])",
              s,
              re.S,
          )

          if not m:
              print("FAIL: OKN_ENABLE_BOOT_JUMP default definition not found")
              sys.exit(1)

          if m.group(1) != "0":
              print("FAIL: OKN_ENABLE_BOOT_JUMP must default to 0")
              sys.exit(1)

          print("PASS: boot jump is disabled by default")
          PY

      - name: Static audit - Gain must not use EQ
        shell: bash
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          set -euo pipefail
          python3 tools/audit_no_eq_gain.py

      - name: Build and run normal host tests
        shell: bash
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          set -euo pipefail
          make clean
          make test

      - name: Build sanitizer test
        shell: bash
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          set -euo pipefail
          mkdir -p build

          gcc \
            -std=c11 \
            -O1 \
            -g \
            -Wall \
            -Wextra \
            -Werror \
            -fno-omit-frame-pointer \
            -fsanitize=address,undefined \
            -Ifirmware/include \
            -Ifirmware/dsp \
            -Ifirmware/audio \
            -Ifirmware/control \
            -Ifirmware/platform \
            firmware/app/okn_r51.c \
            firmware/dsp/okn_gain7.c \
            firmware/dsp/okn_peq7.c \
            firmware/audio/okn_router7.c \
            firmware/control/okn_usb_proto.c \
            host/test_r51.c \
            -o build/test_r51_san

      - name: Run sanitizer test
        shell: bash
        working-directory: ${{ steps.project.outputs.root }}
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          ./build/test_r51_san

      - name: Verify 7-channel constants
        shell: bash
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          candidates = [
              Path("firmware/include/okn_r51.h"),
              Path("firmware/dsp/okn_gain7.h"),
              Path("firmware/control/okn_usb_proto.h"),
          ]

          text = "\n".join(
              p.read_text(encoding="utf-8", errors="replace")
              for p in candidates
              if p.exists()
          )

          m = re.search(r"#define\s+OKN_R51_CHANNELS\s+(\d+)", text)
          if not m:
              print("FAIL: OKN_R51_CHANNELS not found")
              sys.exit(1)

          if int(m.group(1)) != 7:
              print(f"FAIL: expected 7 channels, got {m.group(1)}")
              sys.exit(1)

          print("PASS: OKN_R51_CHANNELS = 7")
          PY

      - name: Create CI report
        shell: bash
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          set -euo pipefail

          {
            echo "OKN BP1048P4 R51 CI"
            echo "===================="
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "runner=${RUNNER_OS}"
            echo "utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "PASS: 7-channel dedicated Gain design verified"
            echo "PASS: Gain executable code does not use EQ/PEQ"
            echo "PASS: PEQ is applied before dedicated channel Gain"
            echo "PASS: normal host tests"
            echo "PASS: ASan/UBSan host tests"
            echo "PASS: boot jump disabled by default"
            echo
            echo "NOTE:"
            echo "This CI does NOT erase, program, or flash a physical BP1048P4 board."
            echo "Target flashing stays disabled until boot-entry, image layout,"
            echo "readback and recovery are verified on real hardware."
          } | tee CI_REPORT.txt

      - name: Package verified R51 sources
        shell: bash
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          set -euo pipefail

          rm -rf "${BUILD_DIR}"
          mkdir -p "${BUILD_DIR}/${ARTIFACT_NAME}"

          for item in \
            firmware \
            host \
            tools \
            docs \
            Makefile \
            README_TH.md \
            STATUS_R51.txt \
            SHA256SUMS.txt \
            CI_REPORT.txt
          do
            if [[ -e "$item" ]]; then
              cp -a "$item" "${BUILD_DIR}/${ARTIFACT_NAME}/"
            fi
          done

          (
            cd "${BUILD_DIR}"
            zip -qr "${ARTIFACT_NAME}.zip" "${ARTIFACT_NAME}"
            sha256sum "${ARTIFACT_NAME}.zip" > "${ARTIFACT_NAME}.zip.sha256"
          )

          cat "${BUILD_DIR}/${ARTIFACT_NAME}.zip.sha256"

      - name: Upload verified CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN-BP1048P4-R51-verified
          path: |
            ${{ steps.project.outputs.root }}/build-ci/OKN_BP1048P4_R51_CI_ARTIFACT.zip
            ${{ steps.project.outputs.root }}/build-ci/OKN_BP1048P4_R51_CI_ARTIFACT.zip.sha256
            ${{ steps.project.outputs.root }}/CI_REPORT.txt
          if-no-files-found: error
          retention-days: 30
