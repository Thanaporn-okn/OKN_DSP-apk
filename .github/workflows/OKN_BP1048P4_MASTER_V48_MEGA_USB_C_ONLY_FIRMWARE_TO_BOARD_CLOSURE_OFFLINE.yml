          blockers=[k for k in required_for_first_flash if not gates[k]]
          flash_allowed=(len(blockers)==0)

          # Fail closed regardless of theoretical all-green result in this offline run.
          # A separate reviewed live workflow must be generated only after proof.
          flash_allowed=False

          final={
              "revision":"MASTER-V48",
              "required_phone":"Samsung Galaxy S25+",
              "required_physical_path":"Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only",
              "soldering_allowed":False,
              "board_modification_allowed":False,
              "external_programmer_allowed":False,
              "gates":gates,
              "blockers":blockers,
              "candidate_bundle_present":candidate_present,
              "candidate_bundle_sha256":candidate_sha,
              "candidate_classification":"SOURCE_OBJECT_NOT_FLASHABLE",
