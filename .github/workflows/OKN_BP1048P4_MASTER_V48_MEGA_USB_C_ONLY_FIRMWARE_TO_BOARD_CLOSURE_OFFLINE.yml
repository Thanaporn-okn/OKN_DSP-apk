          - runtime -> updater without 0x11/Feature: **{gates['runtime_to_updater_no_0x11_no_feature_proven']}**
          - production recovery identity: **{gates['production_recovery_identity_proven']}**
          - pure read-only stock backup command: **{gates['pure_read_only_stock_backup_command_proven']}**
          - stock backup completed: **{gates['production_stock_backup_completed']}**
