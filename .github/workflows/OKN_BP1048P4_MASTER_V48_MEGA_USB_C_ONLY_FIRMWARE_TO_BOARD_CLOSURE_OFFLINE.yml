name: OKN BP1048P4 MASTER V48 MEGA USB-C ONLY FIRMWARE-TO-BOARD CLOSURE OFFLINE

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/OKN_BP1048P4_MASTER_V48_MEGA_USB_C_ONLY_FIRMWARE_TO_BOARD_CLOSURE_OFFLINE.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  REQUIRED_PHONE: "Samsung Galaxy S25+"
  REQUIRED_PATH: "Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only"
  TARGET_SOC: "MVSilicon BP1048P4"
  TARGET_RUNTIME_VID_PID: "6324:1719"
  REFERENCE_RECOVERY_VID_PID: "0000:2244"

  V46_ARTIFACT_ID: "11302047314"
  V43_ARTIFACT_ID: "11301278054"
  V41_ARTIFACT_ID: "11301140892"
  V40_ARTIFACT_ID: "11299768486"
  V34_ARTIFACT_ID: "11298706866"
  V32_ARTIFACT_ID: "11298720275"
  V33_ARTIFACT_ID: "11298985578"

  R106_ARTIFACT_ID: "10711684891"
  V9_3_ARTIFACT_ID: "11233786540"
  UPDATER_V3_ARTIFACT_ID: "11139458303"
  RECOVERY_V13_ARTIFACT_ID: "11247972033"
  RECOVERY_V16_ARTIFACT_ID: "11251221570"
  RECOVERY_V17_ARTIFACT_ID: "11251820245"
  SDK_BOOT_USB_ARTIFACT_ID: "11045528884"
  FIRMWARE_CORE_ARTIFACT_ID: "10830737503"

  SDK_REPO: "https://github.com/leadercxn/bp1048_sdk_v0.1.12.git"
  SDK_COMMIT: "8105bd864b04995d81c9f9ae77cb158259f39015"

  OFFICIAL_WINDOWS_ZIP_URL: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-08.exe_.zip"
  EXPECTED_WINDOWS_EXE_SHA256: "3ca54171c53f7badd963ffe6851b8b3e2faf8aee8ba2afcb7040990e22ae09b2"

  LIVE_DSP_ALLOWED: "NO"
  HOST_TO_DSP_IO: "NO"
  FEATURE_REPORT_ALLOWED: "NO"
  NEW_LIVE_0X11_ALLOWED: "NO"
  STARTUP_COMMAND_ALLOWED: "NO"
  AUTH_REPLY_ALLOWED: "NO"
  FLASH_ALLOWED: "NO"
  ERASE_ALLOWED: "NO"
  WRITE_ALLOWED: "NO"
  BOARD_MODIFICATION_ALLOWED: "NO"
  SOLDERING_ALLOWED: "NO"
  EXTERNAL_PROGRAMMER_ALLOWED: "NO"

jobs:
  v48:
    name: One-pass production USB-C firmware-path closure OFFLINE
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - name: Gate 0 - immutable physical path and safety
        shell: bash
        run: |
          set -euo pipefail

          test "$REQUIRED_PHONE" = "Samsung Galaxy S25+"
          test "$REQUIRED_PATH" = "Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only"
          test "$TARGET_RUNTIME_VID_PID" = "6324:1719"

          test "$LIVE_DSP_ALLOWED" = "NO"
          test "$HOST_TO_DSP_IO" = "NO"
          test "$FEATURE_REPORT_ALLOWED" = "NO"
          test "$NEW_LIVE_0X11_ALLOWED" = "NO"
          test "$STARTUP_COMMAND_ALLOWED" = "NO"
          test "$AUTH_REPLY_ALLOWED" = "NO"
          test "$FLASH_ALLOWED" = "NO"
          test "$ERASE_ALLOWED" = "NO"
          test "$WRITE_ALLOWED" = "NO"

          test "$BOARD_MODIFICATION_ALLOWED" = "NO"
          test "$SOLDERING_ALLOWED" = "NO"
          test "$EXTERNAL_PROGRAMMER_ALLOWED" = "NO"

          rm -rf /tmp/v48
          mkdir -p /tmp/v48/{downloads,artifacts,sdk,official_windows,repo,evidence,out,candidate}

          cat > /tmp/v48/evidence/00_SCOPE.txt <<'EOF'
          REVISION=MASTER-V48
          MODE=MEGA_BATCH_OFFLINE_ONLY

          HARD PHYSICAL REQUIREMENT:
          Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only.

          ABSOLUTELY NOT ALLOWED:
          - soldering,
          - board modification,
          - JTAG / SDP / AICE / external programmer,
          - new live byte 0x11,
          - HID Feature reports,
          - startup/auth replay,
          - legacy destructive flash commands,
          - erase/write/flash until every production gate is proven.

          V48 COMBINES IN ONE RUN:
          1. exact official GoloPine Windows client USB/updater static mining,
          2. public-SDK USB updater gate reconciliation,
          3. recovery identity + stock-backup primitive search,
          4. production flash-layout/address reconciliation,
          5. firmware core + candidate-image feasibility audit,
          6. production channel/Gain-ID safety reconciliation,
          7. final S25+ USB-C-only readiness matrix and next executable step.

          FLASH_ALLOWED=NO
          EOF

      - name: Gate 1 - checkout project and acquire exact evidence set
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git clone -q "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/v48/repo/project || true

          get_artifact() {
            local id="$1"
            local name="$2"
            local dest="/tmp/v48/artifacts/$name"
            mkdir -p "$dest"
            curl -fL --retry 5 --retry-all-errors \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              -o "/tmp/v48/downloads/${name}.zip"
            unzip -q "/tmp/v48/downloads/${name}.zip" -d "$dest"
          }

          get_artifact "$V46_ARTIFACT_ID" v46
          get_artifact "$V43_ARTIFACT_ID" v43
          get_artifact "$V41_ARTIFACT_ID" v41
          get_artifact "$V40_ARTIFACT_ID" v40
          get_artifact "$V34_ARTIFACT_ID" v34
          get_artifact "$V32_ARTIFACT_ID" v32
          get_artifact "$V33_ARTIFACT_ID" v33
          get_artifact "$R106_ARTIFACT_ID" r106
          get_artifact "$V9_3_ARTIFACT_ID" v9_3
          get_artifact "$UPDATER_V3_ARTIFACT_ID" updater_v3
          get_artifact "$RECOVERY_V13_ARTIFACT_ID" recovery_v13
          get_artifact "$RECOVERY_V16_ARTIFACT_ID" recovery_v16
          get_artifact "$RECOVERY_V17_ARTIFACT_ID" recovery_v17
          get_artifact "$SDK_BOOT_USB_ARTIFACT_ID" sdk_boot_usb
          get_artifact "$FIRMWARE_CORE_ARTIFACT_ID" firmware_core

          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path("/tmp/v48/artifacts")
          seen=set()
          for _ in range(6):
              todo=[p for p in root.rglob("*.zip") if p not in seen]
              if not todo:
                  break
              for z in todo:
                  seen.add(z)
                  d=z.with_suffix(z.suffix+".unpacked")
                  d.mkdir(parents=True,exist_ok=True)
                  try:
                      with zipfile.ZipFile(z) as q:
                          q.extractall(d)
                  except Exception:
                      pass
          print("NESTED_ZIPS",len(seen))
          PY

          find /tmp/v48/artifacts -type f -printf '%P\n' | sort \
            > /tmp/v48/evidence/01_ARTIFACT_INVENTORY.txt

      - name: Gate 2 - clone pinned public SDK and inventory linker/flash material
        shell: bash
        run: |
          set -euo pipefail

          git clone -q "$SDK_REPO" /tmp/v48/sdk/repo
          cd /tmp/v48/sdk/repo
          git checkout -q "$SDK_COMMIT"
          test "$(git rev-parse HEAD)" = "$SDK_COMMIT"

          {
            echo "SDK_COMMIT=$(git rev-parse HEAD)"
            echo
            echo "=== linker scripts ==="
            find . -type f \( -iname '*.ld' -o -iname '*.lds' \) -print | sort
            echo
            echo "=== flash/update related files ==="
            find . -type f | grep -Ei 'flash|upgrade|boot|mva|hid|usb|communication' | sort || true
          } > /tmp/v48/evidence/02_SDK_INVENTORY.txt

      - name: Gate 3 - official GoloPine Windows client exact static mining
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 6 --retry-all-errors \
            "$OFFICIAL_WINDOWS_ZIP_URL" \
            -o /tmp/v48/downloads/official_windows.zip
          unzip -q /tmp/v48/downloads/official_windows.zip \
            -d /tmp/v48/official_windows/pkg

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil, os, re, subprocess

          root=Path("/tmp/v48/official_windows/pkg")
          expected=os.environ["EXPECTED_WINDOWS_EXE_SHA256"].lower()
          rows=[]
          chosen=None

          for p in sorted(root.rglob("*.exe")):
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              rows.append({
                  "path":str(p.relative_to(root)),
                  "size":p.stat().st_size,
                  "sha256":h,
                  "matches_expected":h==expected
              })
              if h==expected:
                  chosen=p

          Path("/tmp/v48/evidence/03_WINDOWS_EXE_CENSUS.json").write_text(
              json.dumps(rows,indent=2)+"\n")

          if chosen is None:
              raise SystemExit("exact official Windows EXE not found")

          dst=Path("/tmp/v48/official_windows/GoloPine_official.exe")
          shutil.copy2(chosen,dst)

          raw=dst.read_bytes()
          ascii_text=subprocess.run(
              ["strings","-a","-n","4",str(dst)],
              stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,check=False
          ).stdout.decode(errors="replace")
          utf16_text=subprocess.run(
              ["strings","-el","-n","4",str(dst)],
              stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,check=False
          ).stdout.decode(errors="replace")
          all_strings=ascii_text+"\n"+utf16_text
          Path("/tmp/v48/evidence/04_WINDOWS_ALL_STRINGS.txt").write_text(all_strings)

          keys=[
              "UsbHID","HIDInterface","DeviceCommunicationStream",
              "SendDeviceDescriptionRequest","SendDevTypeSwVersAuthenRequest",
              "boot","bootloader","upgrade","updater","recovery","firmware",
              "flash","erase","Feature","6324","1719","2244"
          ]
          census={k:len(re.findall(re.escape(k),all_strings,re.I)) for k in keys}

          legacy=[
              b"chiperas",b"codedata",b"bootdat",b"constdat",
              b"cnfgdat",b"btupdat",b"upinfo",b"cxxx"
          ]
          legacy_hits={x.decode():raw.lower().count(x) for x in legacy}

          result={
              "official_exe_sha256":expected,
              "official_exe_path":str(chosen.relative_to(root)),
              "keyword_census":census,
              "legacy_command_static_hits":legacy_hits,
              "classification":"STATIC_ONLY_NO_VENDOR_EXE_EXECUTION"
          }
          Path("/tmp/v48/evidence/05_WINDOWS_STATIC_CENSUS.json").write_text(
              json.dumps(result,indent=2)+"\n")
          print(json.dumps(result,indent=2))
          PY

          file /tmp/v48/official_windows/GoloPine_official.exe \
            > /tmp/v48/evidence/06_WINDOWS_FILE_TYPE.txt

          python3 -m pip install --quiet --disable-pip-version-check pefile dnfile >/dev/null 2>&1 || true

          python3 - <<'PY'
          from pathlib import Path
          import json,re

          exe=Path("/tmp/v48/official_windows/GoloPine_official.exe")
          result={"is_dotnet":False,"method_count":0,"interesting_methods":[]}

          try:
              import pefile
              pe=pefile.PE(str(exe),fast_load=False)
              result["is_dotnet"]=bool(
                  len(pe.OPTIONAL_HEADER.DATA_DIRECTORY)>14 and
                  pe.OPTIONAL_HEADER.DATA_DIRECTORY[14].VirtualAddress
              )
          except Exception as e:
              result["pe_error"]=repr(e)

          try:
              import dnfile
              dn=dnfile.dnPE(str(exe))
              methods=[]
              if dn.net and dn.net.mdtables.MethodDef:
                  for rid,row in enumerate(dn.net.mdtables.MethodDef.rows,1):
                      name=str(row.Name)
                      token=0x06000000|rid
                      methods.append({
                          "rid":rid,
                          "token":f"0x{token:08X}",
                          "name":name,
                          "rva":int(row.Rva or 0),
                      })
              result["method_count"]=len(methods)
              pat=re.compile(r'usb|hid|feature|send|write|auth|description|boot|loader|upgrade|update|recovery|flash|firmware|reset',re.I)
              result["interesting_methods"]=[m for m in methods if pat.search(m["name"])][:5000]
              Path("/tmp/v48/evidence/07_WINDOWS_METHODDEF_ALL.json").write_text(
                  json.dumps(methods,indent=2,ensure_ascii=False)+"\n")
          except Exception as e:
              result["dnfile_error"]=repr(e)

          Path("/tmp/v48/evidence/08_WINDOWS_METADATA_SUMMARY.json").write_text(
              json.dumps(result,indent=2,ensure_ascii=False)+"\n")
          PY

      - name: Gate 4 - public SDK USB updater entry proof and no-0x11 rule
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json,re

          root=Path("/tmp/v48/sdk/repo")
          p=root/"MVsB1_Base_SDK/driver/driver_api/src/otg/device/otg_device_standard_request.c"
          s=p.read_text(errors="replace")

          anchors={
              "feature_get":
                  'else if((Setup[3] == 0x03)&&(Setup[0] == 0xA1))//GetReport (Feature Report)',
              "feature_set":
                  'else if((Setup[3] == 0x03)&&(Setup[0] == 0x21))//SetReport (Feature Report)',
              "usb_start":
                  'start_up_grate(AppResourceUsbDevice);',
              "arm_55":
                  'if(Request[0] == 0x55)',
              "arm_aa":
                  'else if(Request[0] == 0xAA)',
          }
          missing=[k for k,v in anchors.items() if v not in s]
          if missing:
              raise SystemExit("missing SDK anchors: "+",".join(missing))

          # Exact conclusion from source structure.
          gf=s.index(anchors["feature_get"])
          sf=s.index(anchors["feature_set"])
          usb=s.index(anchors["usb_start"])
          a55=s.index(anchors["arm_55"])
          aaa=s.index(anchors["arm_aa"])

          feature_get_gates_usb = gf < usb < sf
          feature_set_contains_arms = sf < a55 and sf < aaa

          result={
              "source":str(p.relative_to(root)),
              "usb_start_up_grate_feature_get_gated":feature_get_gates_usb,
              "pc_upgrade_55_aa_feature_set_gated":feature_set_contains_arms,
              "public_sdk_non_feature_usb_updater_entry_proven":False,
              "new_live_0x11_allowed":False,
          }
          Path("/tmp/v48/evidence/09_PUBLIC_SDK_USB_UPDATER_GATE.json").write_text(
              json.dumps(result,indent=2)+"\n")
          print(json.dumps(result,indent=2))
          PY

      - name: Gate 5 - exhaustive stock-backup and recovery identity reconciliation
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re,json

          root=Path("/tmp/v48/artifacts")
          text=[]
          for p in root.rglob("*"):
              if not p.is_file():
                  continue
              try:
                  raw=p.read_bytes()
                  if b'\x00' not in raw[:4096]:
                      text.append(f"\n===== {p.relative_to(root)} =====\n")
                      text.append(raw.decode(errors="replace"))
              except Exception:
                  pass
          corpus="\n".join(text)

          read_terms=[
              r'arbitrary flash read',
              r'flash readback',
              r'stock backup',
              r'read flash',
              r'flash.*read.*host',
              r'read.*flash.*host',
              r'backup command',
          ]
          recovery_terms=[
              r'0000:2244',
              r'recovery identity',
              r'recovery vid',
              r'recovery pid',
              r'production recovery',
          ]

          read_hits={pat:len(re.findall(pat,corpus,re.I)) for pat in read_terms}
          recovery_hits={pat:len(re.findall(pat,corpus,re.I)) for pat in recovery_terms}

          # Strong proof flags are intentionally conservative.
          pure_readonly_backup_proven=bool(re.search(
              r'pure read-only.*stock backup.*proven\s*[:=]\s*(true|yes|pass)',
              corpus,re.I
          ))
          full_backup_completed=bool(re.search(
              r'(full|complete).*stock backup.*completed\s*[:=]\s*(true|yes|pass)',
              corpus,re.I
          ))
          prod_recovery_identity_proven=bool(re.search(
              r'production recovery identity.*proven\s*[:=]\s*(true|yes|pass)',
              corpus,re.I
          ))

          result={
              "readback_term_hits":read_hits,
              "recovery_term_hits":recovery_hits,
              "pure_read_only_complete_stock_backup_command_proven":pure_readonly_backup_proven,
              "production_stock_backup_completed":full_backup_completed,
              "production_recovery_identity_proven":prod_recovery_identity_proven,
              "reference_recovery_vid_pid":"0000:2244",
              "reference_identity_promoted_to_production":False,
          }
          Path("/tmp/v48/evidence/10_BACKUP_RECOVERY_RECONCILIATION.json").write_text(
              json.dumps(result,indent=2)+"\n")
          print(json.dumps(result,indent=2))
          PY

      - name: Gate 6 - production layout address and image feasibility audit
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re,json,hashlib,tarfile,os

          sdk=Path("/tmp/v48/sdk/repo")
          artifacts=Path("/tmp/v48/artifacts")
          project=Path("/tmp/v48/repo/project")

          # Collect all literal hex addresses from linker/config/source evidence.
          records=[]
          addr_re=re.compile(r'0x[0-9A-Fa-f]{5,8}')

          sources=[]
          for root in [sdk,artifacts,project]:
              if not root.exists():
                  continue
              for p in root.rglob("*"):
                  if not p.is_file():
                      continue
                  if p.stat().st_size > 5_000_000:
                      continue
                  try:
                      raw=p.read_bytes()
                      if b'\x00' in raw[:2048]:
                          continue
                      s=raw.decode(errors='replace')
                  except:
                      continue
                  hits=sorted(set(addr_re.findall(s)))
                  if hits:
                      records.append({
                          "root":root.name,
                          "path":str(p.relative_to(root)),
                          "addresses":hits[:200],
                      })

          Path("/tmp/v48/evidence/11_ADDRESS_CENSUS.json").write_text(
              json.dumps(records,indent=2)+"\n")

          corpus=json.dumps(records).lower()

          # Known unsafe/unproven staging values are recorded, never promoted.
          staging_100000="0x100000" in corpus
          staging_120000="0x120000" in corpus

          # Production proof requires explicit positive evidence, not mere addresses.
          all_text=[]
          for p in artifacts.rglob("*"):
              if p.is_file() and p.stat().st_size < 2_000_000:
                  try:
                      raw=p.read_bytes()
                      if b'\x00' not in raw[:2048]:
                          all_text.append(raw.decode(errors='replace'))
                  except:
                      pass
          txt="\n".join(all_text)

          prod_layout_proven=bool(re.search(
              r'production (flash|memory) layout.*proven\s*[:=]\s*(true|yes|pass)',
              txt,re.I
          ))
          prod_entry_proven=bool(re.search(
              r'production (entry point|entry).*proven\s*[:=]\s*(true|yes|pass)',
              txt,re.I
          ))
          bootable_image=bool(re.search(
              r'bootable production image.*(true|yes|pass)',
              txt,re.I
          ))

          result={
              "literal_address_record_count":len(records),
              "sdk_or_history_contains_0x100000":staging_100000,
              "sdk_or_history_contains_0x120000":staging_120000,
              "0x100000_promoted_to_production":False,
              "0x120000_promoted_to_production":False,
              "production_layout_proven":prod_layout_proven,
              "production_entry_point_proven":prod_entry_proven,
              "bootable_production_image_proven":bootable_image,
          }
          Path("/tmp/v48/evidence/12_LAYOUT_IMAGE_GATE.json").write_text(
              json.dumps(result,indent=2)+"\n")
          print(json.dumps(result,indent=2))
          PY

      - name: Gate 7 - firmware core channel mapping and Gain-ID safety
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re,json

          root=Path("/tmp/v48/artifacts")
          text=[]
          for p in root.rglob("*"):
              if p.is_file() and p.stat().st_size < 2_000_000:
                  try:
                      raw=p.read_bytes()
                      if b'\x00' not in raw[:2048]:
                          text.append(raw.decode(errors='replace'))
                  except:
                      pass
          corpus="\n".join(text)

          core_7ch=bool(re.search(r'TRUE\s*7[- ]?channel.*PASS|TRUE7CH.*PASS',corpus,re.I))
          peq_15=bool(re.search(r'15[- ]band PEQ.*PASS|7\s*x\s*15[- ]band PEQ.*PASS',corpus,re.I))
          gain=bool(re.search(r'dedicated.*Gain.*PASS',corpus,re.I))
          gain_ids=bool(re.search(r'Gain IDs?\s*(?:=|:)?\s*\*?\*?22\.\.28|Gain CH1\.\.CH7.*22\.\.28',corpus,re.I))

          ch1_6=bool(re.search(r'CH1\.\.CH6.*PROVEN|CH1\.\.CH6.*PASS',corpus,re.I))
          ch7_route=bool(re.search(r'CH7.*i2sout1R.*PASS|CH7 physical.*PROVEN',corpus,re.I))
          ch7_id17=bool(re.search(r'CH7.*ID17.*(?:exact|wire).*proof.*(?:true|yes|pass)',corpus,re.I))

          global_free=bool(re.search(
              r'(IDs?\s*22\.\.28|22\.\.28).*global[- ]free.*(?:true|yes|pass)',
              corpus,re.I
          ))

          result={
              "true_7ch_core_pass":core_7ch,
              "seven_by_15band_peq_pass":peq_15,
              "dedicated_post_peq_gain_pass":gain,
              "gain_ids_22_28_implemented":gain_ids,
              "ch1_ch6_mapping_proven":ch1_6,
              "ch7_i2sout1r_route_proven":ch7_route,
              "ch7_id17_exact_wire_proven":ch7_id17,
              "gain_ids_22_28_global_free_proven":global_free,
          }
          Path("/tmp/v48/evidence/13_FIRMWARE_MAPPING_GAIN_GATE.json").write_text(
              json.dumps(result,indent=2)+"\n")
          print(json.dumps(result,indent=2))
          PY

      - name: Gate 8 - candidate bundle and S25 USB-C-only final readiness matrix
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,shutil,tarfile,os,re

          ev=Path("/tmp/v48/evidence")
          public=json.loads((ev/"09_PUBLIC_SDK_USB_UPDATER_GATE.json").read_text())
          backup=json.loads((ev/"10_BACKUP_RECOVERY_RECONCILIATION.json").read_text())
          layout=json.loads((ev/"12_LAYOUT_IMAGE_GATE.json").read_text())
          fw=json.loads((ev/"13_FIRMWARE_MAPPING_GAIN_GATE.json").read_text())

          # Reuse V46 exact conclusion.
          v46=json.loads(Path("/tmp/v48/artifacts/v46/07_V46_FINAL_DECISION.json").read_text())

          # Locate V41 source/object candidate if present.
          candidates=list(Path("/tmp/v48/artifacts/v41").rglob(
              "OKN_BP1048P4_V41_PRODUCTION_CANDIDATE_NOT_FLASHABLE.tar.gz"
          ))
          candidate_present=bool(candidates)
          candidate_sha=None
          if candidates:
              src=candidates[0]
              dst=Path("/tmp/v48/candidate/OKN_BP1048P4_V48_SOURCE_OBJECT_CANDIDATE_NOT_FLASHABLE.tar.gz")
              shutil.copy2(src,dst)
              candidate_sha=hashlib.sha256(dst.read_bytes()).hexdigest()

          # Every required production gate for an actual S25+ direct flash.
          gates={
              "exact_runtime_fingerprint_proven":True,  # proven earlier on S25+
              "phone_usb_c_only_transport_required":True,
              "no_solder_no_board_mod":True,
              "runtime_to_updater_no_0x11_no_feature_proven":
                  bool(v46.get("production_safe_runtime_to_updater_no_0x11_no_feature_proven")),
