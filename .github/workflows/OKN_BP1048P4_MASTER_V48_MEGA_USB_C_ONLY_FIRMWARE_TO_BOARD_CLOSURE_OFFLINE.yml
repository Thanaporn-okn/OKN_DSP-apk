          (ev/"15_V48_FINAL_DECISION.md").write_text(md)
          print(md)
          PY

          cp /tmp/v48/evidence/* /tmp/v48/out/
          cp /tmp/v48/candidate/* /tmp/v48/out/ 2>/dev/null || true
