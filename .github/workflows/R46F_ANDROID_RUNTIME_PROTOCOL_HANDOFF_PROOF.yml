name: R46F Android Boot Entry Lab

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/R46F_ANDROID_RUNTIME_PROTOCOL_HANDOFF_PROOF.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK without setup-android
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$SDK"
          export ANDROID_HOME="$SDK"

          echo "Using Android SDK: $SDK"

          if [ -x "$SDK/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/16.0/bin/sdkmanager"
          elif [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          echo "sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Create R46F standalone Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/r46f
          mkdir -p /tmp/r46f/app/src/main/java/com/okn/r46f

          cat > /tmp/r46f/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'OKN_R46F_Boot_Entry_Lab'
          include ':app'
          EOF

          cat > /tmp/r46f/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > /tmp/r46f/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.okn.r46f'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.okn.r46f'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '46.6'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > /tmp/r46f/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.usb.host" android:required="true" />
              <application
                  android:allowBackup="false"
                  android:label="OKN R46F Boot Entry Lab"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > /tmp/r46f/app/src/main/java/com/okn/r46f/MainActivity.java <<'EOF'
          package com.okn.r46f;

          import android.app.Activity;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.hardware.usb.UsbConstants;
          import android.hardware.usb.UsbDevice;
          import android.hardware.usb.UsbDeviceConnection;
          import android.hardware.usb.UsbInterface;
          import android.hardware.usb.UsbManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.HashSet;
          import java.util.Locale;
          import java.util.Map;
          import java.util.Set;

          public class MainActivity extends Activity {
              private static final String ACTION_USB_PERMISSION = "com.okn.r46f.USB_PERMISSION";
              private static final int OBS_VID = 0x6324;
              private static final int OBS_PID = 0x1719;
              private static final int TARGET_IF = 4;

              private UsbManager usb;
              private TextView log;
              private Button bootButton;
              private UsbDevice candidate;
              private int armTap = 0;
              private final Handler ui = new Handler(Looper.getMainLooper());

              private final BroadcastReceiver usbReceiver = new BroadcastReceiver() {
                  @Override public void onReceive(Context context, Intent intent) {
                      if (!ACTION_USB_PERMISSION.equals(intent.getAction())) return;
                      UsbDevice d;
                      if (Build.VERSION.SDK_INT >= 33) {
                          d = intent.getParcelableExtra(UsbManager.EXTRA_DEVICE, UsbDevice.class);
                      } else {
                          d = intent.getParcelableExtra(UsbManager.EXTRA_DEVICE);
                      }
                      boolean granted = intent.getBooleanExtra(UsbManager.EXTRA_PERMISSION_GRANTED, false);
                      append("USB permission: " + granted + (d == null ? "" : "  " + id(d)));
                      scan();
                  }
              };

              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  usb = (UsbManager) getSystemService(Context.USB_SERVICE);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(24, 24, 24, 24);

                  TextView title = new TextView(this);
                  title.setText("OKN R46F — BP1048P4 Runtime Protocol Handoff Proof\nNO FLASH ERASE / NO PROGRAM");
                  title.setTextSize(20);
                  root.addView(title);

                  Button scanButton = new Button(this);
                  scanButton.setText("SCAN DSP USB");
                  scanButton.setOnClickListener(v -> scan());
                  root.addView(scanButton);

                  bootButton = new Button(this);
                  bootButton.setText("ARM BOOTLOADER TEST");
                  bootButton.setEnabled(false);
                  bootButton.setOnClickListener(v -> bootTap());
                  root.addView(bootButton);

                  ScrollView scroll = new ScrollView(this);
                  log = new TextView(this);
                  log.setTextSize(13);
                  log.setTextIsSelectable(true);
                  scroll.addView(log);
                  root.addView(scroll, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));

                  setContentView(root);

                  IntentFilter f = new IntentFilter(ACTION_USB_PERMISSION);
                  if (Build.VERSION.SDK_INT >= 33) {
                      registerReceiver(usbReceiver, f, Context.RECEIVER_NOT_EXPORTED);
                  } else {
                      registerReceiver(usbReceiver, f);
                  }

                  append("R46F proves runtime protocol before/after boot handoff. Writes are limited to two read-query frames plus explicit HID Feature AA.");
                  append("Expected observed board identity: VID:PID 6324:1719.");
                  append("Required signature: 7 descriptors, interface ID3 HID ep=1, ID4 HID ep=0.");
                  scan();
              }

              @Override protected void onDestroy() {
                  try { unregisterReceiver(usbReceiver); } catch (Exception ignored) {}
                  super.onDestroy();
              }

              private void scan() {
                  candidate = null;
                  append("--- scan ---");
                  Map<String, UsbDevice> list = usb.getDeviceList();
                  if (list.isEmpty()) append("No USB device.");
                  for (UsbDevice d : list.values()) {
                      append(describe(d));
                      if (matchesStockRuntime(d)) {
                          candidate = d;
                          append("TARGET_RUNTIME_FOUND " + id(d));
                      }
                  }
                  bootButton.setEnabled(candidate != null && usb.hasPermission(candidate));
                  if (candidate != null && !usb.hasPermission(candidate)) {
                      append("Requesting Android USB permission...");
                      requestPermission(candidate);
                  }
              }

              private UsbInterface findInterfaceById(UsbDevice d, int interfaceId) {
                  for (int i = 0; i < d.getInterfaceCount(); i++) {
                      UsbInterface f = d.getInterface(i);
                      if (f.getId() == interfaceId) return f;
                  }
                  return null;
              }

              private boolean matchesStockRuntime(UsbDevice d) {
                  if (d.getVendorId() != OBS_VID || d.getProductId() != OBS_PID) return false;
                  if (d.getInterfaceCount() != 7) return false;

                  UsbInterface f3 = findInterfaceById(d, 3);
                  UsbInterface f4 = findInterfaceById(d, 4);
                  if (f3 == null || f4 == null) return false;

                  boolean if3ok = f3.getInterfaceClass() == UsbConstants.USB_CLASS_HID
                          && f3.getEndpointCount() == 1;
                  boolean if4ok = f4.getInterfaceClass() == UsbConstants.USB_CLASS_HID
                          && f4.getEndpointCount() == 0;

                  return if3ok && if4ok;
              }

              private void requestPermission(UsbDevice d) {
                  int flags = PendingIntent.FLAG_UPDATE_CURRENT;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) flags |= PendingIntent.FLAG_MUTABLE;
                  PendingIntent pi = PendingIntent.getBroadcast(
                          this, 46, new Intent(ACTION_USB_PERMISSION).setPackage(getPackageName()), flags);
                  usb.requestPermission(d, pi);
              }

              private void bootTap() {
                  if (candidate == null || !usb.hasPermission(candidate)) {
                      append("Target/permission missing. Scan again.");
                      scan();
                      return;
                  }
                  if (armTap == 0) {
                      armTap = 1;
                      bootButton.setText("CONFIRM: SEND FEATURE AA");
                      append("ARMED. Tap the button once more to send SET_REPORT Feature AA, then GET_REPORT Feature.");
                      return;
                  }
                  armTap = 0;
                  bootButton.setText("ARM BOOTLOADER TEST");
                  bootButton.setEnabled(false);
                  final UsbDevice d = candidate;
                  new Thread(() -> bootProbe(d), "r46f-usb").start();
              }

              private UsbDevice findObservedVidPid() {
                  for (UsbDevice x : usb.getDeviceList().values()) {
                      if (x.getVendorId() == OBS_VID && x.getProductId() == OBS_PID) return x;
                  }
                  return null;
              }

              private String usbKey(UsbDevice d) {
                  return id(d)
                          + " name=" + d.getDeviceName()
                          + " devId=" + d.getDeviceId()
                          + " if=" + d.getInterfaceCount();
              }

              private Set<String> snapshot() {
                  Set<String> s = new HashSet<>();
                  for (UsbDevice d : usb.getDeviceList().values()) {
                      StringBuilder b = new StringBuilder(usbKey(d));
                      for (int i = 0; i < d.getInterfaceCount(); i++) {
                          UsbInterface f = d.getInterface(i);
                          b.append("|I").append(f.getId())
                                  .append(":c").append(f.getInterfaceClass())
                                  .append(":e").append(f.getEndpointCount());
                      }
                      s.add(b.toString());
                  }
                  return s;
              }

              private String readReportDescriptor(UsbDeviceConnection c, UsbInterface f) {
                  byte[] b = new byte[128];
                  int rc = c.controlTransfer(
                          0x81,   // Device->Host | Standard | Interface
                          0x06,   // GET_DESCRIPTOR
                          0x2200, // HID report descriptor
                          f.getId(),
                          b, b.length, 1200);
                  return "rc=" + rc + " data=" + hexN(b, rc);
              }

              private String readInput256(UsbDeviceConnection c, UsbInterface f) {
                  byte[] b = new byte[256];
                  int rc = c.controlTransfer(
                          0xA1,   // Device->Host | Class | Interface
                          0x01,   // GET_REPORT
                          0x0100, // Input report, ID 0
                          f.getId(),
                          b, b.length, 1200);
                  return "rc=" + rc + " data=" + hexN(b, rc);
              }


              private byte[] makeRuntimeQuery(int control) {
                  byte[] out = new byte[256];
                  out[0] = (byte) 0xA5;
                  out[1] = (byte) 0x5A;
                  out[2] = (byte) control;
                  out[3] = 0x00; // payload len = 0 => query/read path
                  out[4] = 0x16;
                  return out;
              }

              private int sendOutput256(UsbDeviceConnection c, UsbInterface f, byte[] out) {
                  return c.controlTransfer(
                          0x21, 0x09, 0x0200, f.getId(),
                          out, out.length, 1500);
              }

              private int getInput256(UsbDeviceConnection c, UsbInterface f, byte[] in) {
                  return c.controlTransfer(
                          0xA1, 0x01, 0x0100, f.getId(),
                          in, in.length, 1500);
              }

              private boolean runtimeQuery(UsbDeviceConnection c, UsbInterface f, int control, String tag) {
                  byte[] out = makeRuntimeQuery(control);
                  append(tag + "_OUT packet=" + hexN(out, 8));
                  int wr = sendOutput256(c, f, out);
                  append(tag + "_OUT rc=" + wr);
                  if (wr != 256) return false;

                  try { Thread.sleep(100); } catch (InterruptedException ignored) {}

                  byte[] in = new byte[256];
                  int rr = getInput256(c, f, in);
                  append(tag + "_IN rc=" + rr + " data=" + hexN(in, rr));

                  if (rr < 5) return false;
                  if ((in[0] & 0xFF) != 0xA5 || (in[1] & 0xFF) != 0x5A) return false;
                  if ((in[2] & 0xFF) != control) return false;
                  int plen = in[3] & 0xFF;
                  int end = 4 + plen;
                  return end < rr && (in[end] & 0xFF) == 0x16;
              }

              private void bootProbe(UsbDevice d) {
                  Set<String> before = snapshot();
                  String beforeName = d.getDeviceName();
                  int beforeDevId = d.getDeviceId();
                  append("PRE_DEVICE " + usbKey(d));
                  append("PRE_SNAPSHOT " + before);

                  UsbDeviceConnection c = null;
                  boolean claimed = false;
                  int setRc = Integer.MIN_VALUE;
                  int getRc = Integer.MIN_VALUE;
                  byte[] get = new byte[8];

                  try {
                      if (!matchesStockRuntime(d)) {
                          append("ABORT: target identity/interface changed before write.");
                          return;
                      }
                      c = usb.openDevice(d);
                      if (c == null) {
                          append("ABORT: openDevice returned null.");
                          return;
                      }
                      UsbInterface f = findInterfaceById(d, TARGET_IF);
                      if (f == null) {
                          append("ABORT: IF4 not found by interface ID.");
                          return;
                      }
                      claimed = c.claimInterface(f, true);
                      append("claim IF" + TARGET_IF + "=" + claimed);
                      if (!claimed) {
                          append("ABORT: claim failed. No write sent.");
                          return;
                      }

                      append("PRE_REPORT_DESCRIPTOR " + readReportDescriptor(c, f));
                      append("PRE_GET_REPORT_INPUT_256 " + readInput256(c, f));

                      boolean preVersion = runtimeQuery(c, f, 0x00, "PRE_RUNTIME_VERSION_QUERY");
                      boolean preSystem = runtimeQuery(c, f, 0x01, "PRE_RUNTIME_SYSTEM_QUERY");
                      append("PRE_RUNTIME_PROTOCOL="
                              + ((preVersion && preSystem) ? "CONFIRMED" : "NOT_CONFIRMED"));

                      byte[] aa = new byte[8];
                      aa[0] = (byte) 0xAA;

                      append("WRITE_ONCE: HID SET_REPORT Feature id0, IF" + f.getId()
                              + ", payload=" + hex(aa));
                      setRc = c.controlTransfer(
                              0x21,
                              0x09,
                              0x0300,
                              f.getId(),
                              aa, aa.length, 1500);
                      append("SET_REPORT rc=" + setRc);

                      try { Thread.sleep(80); } catch (InterruptedException ignored) {}

                      getRc = c.controlTransfer(
                              0xA1,
                              0x01,
                              0x0300,
                              f.getId(),
                              get, get.length, 1500);
                      append("GET_REPORT_FEATURE rc=" + getRc + " data=" + hex(get));
                  } catch (Throwable t) {
                      append("USB exception during handoff: "
                              + t.getClass().getSimpleName() + ": " + t.getMessage());
                  } finally {
                      if (c != null) {
                          try {
                              if (claimed) {
                                  UsbInterface rf = findInterfaceById(d, TARGET_IF);
                                  if (rf != null) c.releaseInterface(rf);
                              }
                          } catch (Throwable ignored) {}
                          try { c.close(); } catch (Throwable ignored) {}
                      }
                  }

                  boolean ack55 = getRc > 0 && (get[0] & 0xFF) == 0x55;
                  append("FEATURE_ACK_55=" + (ack55 ? "YES" : "NO"));

                  boolean sawMissing = false;
                  boolean addressChanged = false;
                  boolean reappeared = false;
                  UsbDevice after = null;

                  for (int i = 0; i < 100; i++) {
                      try { Thread.sleep(100); } catch (InterruptedException ignored) {}

                      UsbDevice now = findObservedVidPid();
                      if (now == null) {
                          if (!sawMissing) append("USB_DISAPPEARED=YES");
                          sawMissing = true;
                          continue;
                      }

                      after = now;
                      boolean nameChanged = !beforeName.equals(now.getDeviceName());
                      boolean devIdChanged = beforeDevId != now.getDeviceId();

                      if (nameChanged || devIdChanged) {
                          addressChanged = true;
                          append("USB_ADDRESS_CHANGED=YES  " + usbKey(now));
                      }

                      if (sawMissing) {
                          reappeared = true;
                          append("USB_REAPPEARED=YES  " + usbKey(now));
                      }

                      if (addressChanged || reappeared) break;
                  }

                  if (after == null) after = findObservedVidPid();

                  Set<String> afterSnap = snapshot();
                  append("POST_SNAPSHOT " + afterSnap);
                  append("SNAPSHOT_CHANGED=" + (!afterSnap.equals(before)));
                  append("BOOT_HANDOFF_USB_RESET_EVIDENCE="
                          + ((sawMissing || addressChanged || reappeared) ? "YES" : "UNPROVEN"));

                  if (after != null) {
                      append("POST_DEVICE " + usbKey(after));

                      if (!usb.hasPermission(after)) {
                          append("POST_PERMISSION=false; requesting permission...");
                          final UsbDevice postForPermission = after;
                          ui.post(() -> requestPermission(postForPermission));
                          for (int i = 0; i < 40 && !usb.hasPermission(after); i++) {
                              try { Thread.sleep(100); } catch (InterruptedException ignored) {}
                          }
                      }

                      append("POST_PERMISSION=" + usb.hasPermission(after));

                      if (usb.hasPermission(after)) {
                          UsbDeviceConnection c2 = null;
                          boolean claimed2 = false;
                          try {
                              c2 = usb.openDevice(after);
                              UsbInterface f4 = findInterfaceById(after, TARGET_IF);
                              if (c2 == null) {
                                  append("POST_OPEN=null");
                              } else if (f4 == null) {
                                  append("POST_IF4=missing");
                              } else {
                                  claimed2 = c2.claimInterface(f4, true);
                                  append("POST_CLAIM_IF4=" + claimed2);
                                  if (claimed2) {
                                      append("POST_REPORT_DESCRIPTOR " + readReportDescriptor(c2, f4));
                                      append("POST_GET_REPORT_INPUT_256 " + readInput256(c2, f4));

                                      boolean postVersion = runtimeQuery(
                                              c2, f4, 0x00, "POST_RUNTIME_VERSION_QUERY");
                                      boolean postSystem = runtimeQuery(
                                              c2, f4, 0x01, "POST_RUNTIME_SYSTEM_QUERY");

                                      boolean stillRuntime = postVersion && postSystem;
                                      append("POST_RUNTIME_PROTOCOL="
                                              + (stillRuntime ? "CONFIRMED" : "NOT_CONFIRMED"));

                                      if (stillRuntime) {
                                          append("R46F_DECISION=STILL_RUNTIME_AFTER_55");
                                      } else {
                                          append("R46F_DECISION=RUNTIME_PROTOCOL_DISAPPEARED_AFTER_55");
                                      }
                                  }
                              }
                          } catch (Throwable t) {
                              append("POST_FINGERPRINT_EXCEPTION "
                                      + t.getClass().getSimpleName() + ": " + t.getMessage());
                          } finally {
                              if (c2 != null) {
                                  try {
                                      if (claimed2) {
                                          UsbInterface f4 = findInterfaceById(after, TARGET_IF);
                                          if (f4 != null) c2.releaseInterface(f4);
                                      }
                                  } catch (Throwable ignored) {}
                                  try { c2.close(); } catch (Throwable ignored) {}
                              }
                          }
                      }
                  } else {
                      append("POST_DEVICE=NOT_PRESENT");
                  }

                  append("R46F_DONE. No reset/erase/program/MVA/flashboot ASCII command was sent.");

                  ui.post(() -> {
                      bootButton.setEnabled(true);
                      scan();
                  });
              }

              private String describe(UsbDevice d) {
                  StringBuilder b = new StringBuilder();
                  b.append(usbKey(d));
                  for (int i = 0; i < d.getInterfaceCount(); i++) {
                      UsbInterface f = d.getInterface(i);
                      b.append("\n  IF").append(f.getId())
                              .append(" cls=").append(f.getInterfaceClass())
                              .append(" sub=").append(f.getInterfaceSubclass())
                              .append(" proto=").append(f.getInterfaceProtocol())
                              .append(" ep=").append(f.getEndpointCount());
                  }
                  return b.toString();
              }

              private String id(UsbDevice d) {
                  return String.format(Locale.US, "%04X:%04X", d.getVendorId(), d.getProductId());
              }

              private String hex(byte[] a) {
                  return hexN(a, a.length);
              }

              private String hexN(byte[] a, int n) {
                  if (n < 0) return "<rc=" + n + ">";
                  int lim = Math.min(Math.min(n, a.length), 64);
                  StringBuilder b = new StringBuilder();
                  for (int i = 0; i < lim; i++) {
                      b.append(String.format(Locale.US, "%02X ", a[i] & 0xFF));
                  }
                  if (n > lim) b.append("...(").append(n).append(" bytes)");
                  return b.toString().trim();
              }

              private void append(String s) {
                  ui.post(() -> {
                      String ts = new SimpleDateFormat("HH:mm:ss.SSS", Locale.US).format(new Date());
                      log.append(ts + "  " + s + "\n");
                  });
              }
          }
          EOF

          cat > /tmp/r46f/README_R46F_TH.txt <<'EOF'
          OKN R46F — BP1048P4 Runtime Protocol Handoff Proof

          เป้าหมาย:
          - Samsung S25+ USB-C -> production board
          - ยืนยันการเข้า bootloader ก่อน flash
          - ไม่ erase / ไม่ program / ไม่ส่ง MVA

          เงื่อนไข production runtime ที่ต้องตรง:
          - VID:PID 6324:1719
          - มี 7 interfaces
          - IF3 เป็น HID และมี 1 endpoint
          - IF4 เป็น HID และมี 0 endpoints

          write เพียงรายการเดียวเมื่อกดปุ่มยืนยัน 2 ครั้ง:
          - HID SET_REPORT Feature, report ID 0, IF4, 8 bytes: AA 00 00 00 00 00 00 00
          จากนั้นอ่าน:
          - HID GET_REPORT Feature, report ID 0, IF4, 8 bytes

          R46F เพิ่ม runtime-protocol proof ก่อน/หลัง 0x55:
          - query 0x00 (version) และ 0x01 (system status) แบบ payload length 0 ก่อน/หลัง 0x55
          - query ทั้งสองเป็น read path ตาม communication.c
          - บันทึก USB deviceName / deviceId ก่อนและหลัง handoff
          - ตรวจ disappearance/reappearance แม้ VID/PID เดิม
          - อ่าน HID report descriptor แบบ read-only
          - GET_REPORT Input 256 bytes แบบ read-only ก่อน/หลังเพื่อเทียบ fingerprint

          ยังไม่ส่ง reset / chip erase / program / MVA / cxxx / upinfo / flashboot ASCII command
          EOF

          echo "R46F_PROJECT=/tmp/r46f" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$R46F_PROJECT"
          gradle --no-daemon :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Package evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/r46f_out
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp "$R46F_PROJECT/app/build/outputs/apk/debug/app-debug.apk" "$OUT/OKN_R46F_BOOT_ENTRY_LAB_debug.apk"
          cp "$R46F_PROJECT/README_R46F_TH.txt" "$OUT/"
          cp "$R46F_PROJECT/app/src/main/java/com/okn/r46f/MainActivity.java" "$OUT/MainActivity_R46F.java"
          cat > "$OUT/R46F_SAFETY_STATE.txt" <<'EOF'
          OBSERVED_RUNTIME_VID_PID=6324:1719
          TARGET_INTERFACE=4
          REQUIRED_IF_COUNT=7
          REQUIRED_IF3_HID_EP=1
          REQUIRED_IF4_HID_EP=0
          EXPECT_HID_NO_ENDPOINTS=YES
          FLASH_ERASE=NO
          FLASH_PROGRAM=NO
          MVA_SEND=NO
          UPINFO=NO
          RUNTIME_WRITE=HID_FEATURE_AA_ONLY
          DOUBLE_TAP_CONFIRM=YES
          PRE_POST_RUNTIME_QUERY_0X00_0X01=YES
          POST_55_USB_ADDRESS_AND_FINGERPRINT_PROBE=YES
          FLASH_WRITES_STILL_BLOCKED=YES
          EOF
          (cd "$OUT" && sha256sum * > SHA256SUMS.txt)

      - name: Upload R46F APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN_R46F_BOOT_ENTRY_LAB_APK
          path: /tmp/r46f_out/*
          if-no-files-found: error

      - name: Summary
        shell: bash
        run: |
          {
            echo '## R46F BP1048P4 boot-entry lab'
            echo '- Dedicated sacrificial-board boot-entry probe for Samsung S25+ USB host'
            echo '- The only runtime write is HID Feature AA, after explicit double confirmation'
            echo '- No erase, no code write, no MVA, no upinfo'
            echo '- Queries runtime version/system read paths before and after Feature AA/55'
            echo '- No runtime reset command and no flashboot ASCII command is sent'
            echo '- Flash erase/program remains blocked in this build'
          } >> "$GITHUB_STEP_SUMMARY"
