      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Verify generated V10 source identity
        shell: bash
        run: |
          set -euo pipefail
          echo "e40bac569ec09021a9eb5d7751784d2d74383aaa3ff6e3ab7fec7cbabc34dc10  app/src/main/java/com/okn/peramp/DspProtocol.java" | sha256sum -c -
          echo "733df6e8b32ab84de4d1304ce7b3dbf4a8c6580f77b6a74d86c923676f9ed257  app/src/main/java/com/okn/peramp/BleManager.java" | sha256sum -c -
          echo "66f70f4912f8ded9bf8a9a075c7ecc7706ca652f2155e93043bf9535b5a05303  app/src/main/java/com/okn/peramp/MainActivity.java" | sha256sum -c -
          echo "5ac801e6be1278f7e726ae432cae45751e2c17c5a1fe00909182d7e8bc37d70a  app/src/main/java/com/okn/peramp/DspView.java" | sha256sum -c -
          echo "c45e06acb5cff2f23540ae5e8ed2f0387a8df2b24403c3bf10b599bbb33c3052  app/src/main/java/com/okn/peramp/DspState.java" | sha256sum -c -
          echo "58a260166876a8b63f89ee62af871a6107235294c5579632cf1d06652d4abe76  Sources/validate_oknpv10.py" | sha256sum -c -

      - name: Validate V10 frozen hardware core, historical EQ proof and no-unknown-TX gate
        shell: bash
        run: |
          set -euo pipefail
          python3 Sources/validate_v38_gate.py
          python3 Sources/validate_v39_reset_v10.py
          python3 Sources/validate_oknpv10.py

      - name: Build Debug and Release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk OKNPV10-debug.apk
          cp app/build/outputs/apk/release/app-release.apk OKNPV10-release.apk

      - name: Verify APK identity and test signing
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging OKNPV10-debug.apk | tee OKNPV10-apk-badging.txt
          grep -q "package: name='com.okn.peramp' versionCode='10000' versionName='10.0.0'" OKNPV10-apk-badging.txt
          grep -q "application-label:'OKN Peramp'" OKNPV10-apk-badging.txt
          {
            echo 'V10 release signing status: TEST SIGNING ONLY - debug key configured in build.gradle.'
            echo 'A user-owned production key is still required for public production distribution.'
            "$APKSIGNER" verify --verbose --print-certs OKNPV10-release.apk
          } | tee OKNPV10-signing.txt

      - name: Package V10 source EQ evidence and checksums
        shell: bash
        run: |
          set -euo pipefail
          zip -qr OKNPV10-source.zip app Sources build.gradle settings.gradle gradle.properties -x '*/build/*' -x '.gradle/*'
          cp Sources/OKNPV10_REVERSE_CHECKPOINT.txt OKNPV10-REVERSE-CHECKPOINT.txt
          cp Sources/OKNPV10_BUILD_NOTES.txt OKNPV10-BUILD-NOTES.txt
          cp Sources/V10_EQ_EXPANSION_DISCOVERY_PLAN.txt OKNPV10-EQ-EXPANSION-DISCOVERY-PLAN.txt
          cp Sources/V10_HARDWARE_BASELINE_PROOF.txt OKNPV10-HARDWARE-BASELINE-PROOF.txt
          cp Sources/V10_OUTPUT_GAIN_STATIC_DISCOVERY.txt OKNPV10-OUTPUT-GAIN-STATIC-DISCOVERY.txt
          cp Sources/ProtocolEvidence/GoloPine_DeviceDescription_REAL_20260906_204555.json OKNPV10-HISTORICAL-SAME-HARDWARE-DESCRIPTOR.json
          sha256sum OKNPV10-debug.apk OKNPV10-release.apk OKNPV10-source.zip OKNPV10-REVERSE-CHECKPOINT.txt OKNPV10-BUILD-NOTES.txt OKNPV10-EQ-EXPANSION-DISCOVERY-PLAN.txt OKNPV10-HARDWARE-BASELINE-PROOF.txt OKNPV10-OUTPUT-GAIN-STATIC-DISCOVERY.txt OKNPV10-HISTORICAL-SAME-HARDWARE-DESCRIPTOR.json OKNPV10-signing.txt > OKNPV10-SHA256SUMS.txt
          cat OKNPV10-SHA256SUMS.txt

      - name: Upload OKNPV10 artifact
        uses: actions/upload-artifact@v7
        with:
          name: OKNPV10
          path: |
