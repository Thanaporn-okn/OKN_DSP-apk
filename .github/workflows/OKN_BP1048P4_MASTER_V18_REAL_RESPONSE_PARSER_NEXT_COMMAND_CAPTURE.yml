name: OKN BP1048P4 MASTER V18 REAL RESPONSE PARSER + NEXT COMMAND CAPTURE

"on":
  workflow_dispatch:

permissions:
  contents: read

env:
  GOLOPINE_WINDOWS_URL: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-08.exe_.zip"
  LIVE_DSP_CONNECTED: "NO"
  USB_TARGET_ACCESS: "NO"
  HOST_TO_DSP_IO: "NO"
  REAL_HID_OBJECT_ALLOWED: "NO"
  REAL_HID_CONNECT_ALLOWED: "NO"
  REAL_HID_SEND_ALLOWED: "NO"
  REAL_HID_READ_ALLOWED: "NO"
  REAL_HID_WRITE_ALLOWED: "NO"
  FEATURE_REPORT_ALLOWED: "NO"
  FLASH_ALLOWED: "NO"
  ERASE_ALLOWED: "NO"
  WRITE_ALLOWED: "NO"

jobs:
  master-v18:
    name: MASTER V18 replay V17 response into real vendor parser offline
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Safety gate and workspace
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          foreach($n in @(
            "LIVE_DSP_CONNECTED","USB_TARGET_ACCESS","HOST_TO_DSP_IO",
            "REAL_HID_OBJECT_ALLOWED","REAL_HID_CONNECT_ALLOWED",
            "REAL_HID_SEND_ALLOWED","REAL_HID_READ_ALLOWED","REAL_HID_WRITE_ALLOWED",
            "FEATURE_REPORT_ALLOWED","FLASH_ALLOWED","ERASE_ALLOWED","WRITE_ALLOWED"
          )){
            if((Get-Item "Env:$n").Value -ne "NO"){throw "$n must be NO"}
          }

          $root="C:\okn_v18"
          if(Test-Path $root){Remove-Item -Recurse -Force $root}
          New-Item -ItemType Directory -Force -Path `
            "$root\download","$root\pkg","$root\harness","$root\evidence","$root\out" | Out-Null

          @"
          MODE=OFFLINE_REPLAY_OF_V17_REAL_PHYSICAL_RESPONSE
          LIVE_DSP_CONNECTED=NO
          USB_TARGET_ACCESS=NO
          HOST_TO_DSP_IO=NO
          REAL_HID_OBJECT_ALLOWED=NO
          FEATURE_REPORT_ALLOWED=NO
          FLASH_ALLOWED=NO
          V17_RESPONSE_SEEN=true
          V17_INPUT_REPORT_RESULT=256
          V17_DECLARED_PAYLOAD_LENGTH=32
          V17_PAYLOAD_HEX=D024E38C410000004202B94C65A23F2C640C8F60E133784C7E47463A7A521056
          "@ | Set-Content "$root\evidence\00_SAFETY_AND_INPUT.txt"

      - name: Download untouched official GoloPine Windows client
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v18"

          curl.exe -fL --retry 6 --retry-all-errors --retry-delay 2 `
            --connect-timeout 20 --max-time 300 `
            $env:GOLOPINE_WINDOWS_URL -o "$root\download\vendor.zip"
          if($LASTEXITCODE -ne 0){throw "vendor download failed"}

          Expand-Archive -Force "$root\download\vendor.zip" "$root\pkg"

          $exe=Get-ChildItem "$root\pkg" -Recurse -File -Filter *.exe |
            Where-Object {$_.FullName -notmatch '\\__MACOSX\\' -and $_.Name -notlike '._*'} |
            Sort-Object Length -Descending | Select-Object -First 1

          if(-not $exe){throw "vendor EXE missing"}
          Copy-Item $exe.FullName "$root\vendor.exe" -Force

          $b=[IO.File]::ReadAllBytes("$root\vendor.exe")
          if($b.Length -lt 100000 -or $b[0] -ne 0x4D -or $b[1] -ne 0x5A){
            throw "bad vendor PE"
          }

          $sha=(Get-FileHash "$root\vendor.exe" -Algorithm SHA256).Hash
          if($sha -ne "3CA54171C53F7BADD963FFE6851B8B3E2FAF8AEE8BA2AFCB7040990E22AE09B2"){
            throw "official vendor EXE hash changed"
          }

          @"
          BYTES=$($b.Length)
          SHA256=$sha
          ORIGINAL_BINARY_MODIFIED=NO
          "@ | Set-Content "$root\evidence\01_VENDOR_IDENTITY.txt"

      - name: Build x86 fake-stream response replay probe
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v18"

          @'
          using System;
          using System.IO;
          using System.Linq;
          using System.Text;
          using System.Reflection;
          using System.Reflection.Emit;
          using System.Runtime.CompilerServices;
          using System.Collections;
          using System.Collections.Generic;
          using System.Threading;

          public static class CaptureSink
          {
              public static readonly List<byte[]> Writes=new List<byte[]>();

              public static void Clear()
              {
                  lock(Writes){ Writes.Clear(); }
              }

              public static void Record(byte[] b)
              {
                  lock(Writes)
                  {
                      Writes.Add(b==null ? null : (byte[])b.Clone());
                  }
              }

              public static byte[][] Snapshot()
              {
                  lock(Writes)
                  {
                      return Writes.Select(x=>x==null?null:(byte[])x.Clone()).ToArray();
                  }
              }
          }

          class ReplayProbe
          {
              static List<string> L=new List<string>();
              static string OutPath;

              static readonly string RAW256_HEX=
                  "";
              static readonly string LEN33_HEX=
                  "20D024E38C410000004202B94C65A23F2C640C8F60E133784C7E47463A7A521056";
              static readonly string PAYLOAD32_HEX=
                  "D024E38C410000004202B94C65A23F2C640C8F60E133784C7E47463A7A521056";
              static readonly string REPORTID_LEN34_HEX=
                  "0020D024E38C410000004202B94C65A23F2C640C8F60E133784C7E47463A7A521056";

              static void Log(string s)
              {
                  L.Add(s);
                  if(!String.IsNullOrEmpty(OutPath))
                      File.AppendAllText(OutPath,s+Environment.NewLine);
              }

              static string Hex(byte[] b)
              {
                  if(b==null)return "<NULL>";
                  return BitConverter.ToString(b).Replace("-","");
              }

              static byte[] HexToBytes(string s)
              {
                  byte[] b=new byte[s.Length/2];
                  for(int i=0;i<b.Length;i++)
                      b[i]=Convert.ToByte(s.Substring(i*2,2),16);
                  return b;
              }

              static string SafeValue(object v)
              {
                  if(v==null)return "<NULL>";
                  byte[] bb=v as byte[];
                  if(bb!=null)return "BYTE["+bb.Length+"]="+Hex(bb);
                  Array a=v as Array;
                  if(a!=null)
                  {
                      List<string> x=new List<string>();
                      int n=Math.Min(a.Length,32);
                      for(int i=0;i<n;i++)
                          x.Add(a.GetValue(i)==null?"<NULL>":a.GetValue(i).ToString());
                      return "ARRAY["+a.Length+"]="+String.Join(",",x.ToArray());
                  }
                  return v.ToString();
              }

              static object InvokeBounded(
                  MethodInfo m, object target, object[] args,
                  int timeoutMs, string label)
              {
                  object result=null;
                  Exception error=null;
                  Thread th=new Thread(delegate(){
                      try{ result=m.Invoke(target,args); }
                      catch(Exception ex){ error=ex; }
                  });
                  th.IsBackground=true;
                  th.Start();

                  if(!th.Join(timeoutMs))
                  {
                      Log(label+"_TIMEOUT_MS="+timeoutMs);
                      try{ th.Abort(); }catch{}
                      return null;
                  }

                  if(error!=null) throw error;
                  return result;
              }

              static void EmitDefaultReturn(ILGenerator il,Type ret)
              {
                  if(ret==typeof(void)){ il.Emit(OpCodes.Ret); return; }
                  if(ret.IsValueType)
                  {
                      LocalBuilder loc=il.DeclareLocal(ret);
                      il.Emit(OpCodes.Ldloca_S,loc);
                      il.Emit(OpCodes.Initobj,ret);
                      il.Emit(OpCodes.Ldloc,loc);
                      il.Emit(OpCodes.Ret);
                      return;
                  }
                  il.Emit(OpCodes.Ldnull);
                  il.Emit(OpCodes.Ret);
              }

              static MethodAttributes Visibility(MethodInfo m)
              {
                  MethodAttributes a=MethodAttributes.Virtual|MethodAttributes.HideBySig;
                  if(m.IsPublic)a|=MethodAttributes.Public;
                  else if(m.IsFamily)a|=MethodAttributes.Family;
                  else if(m.IsFamilyOrAssembly)a|=MethodAttributes.FamORAssem;
                  else if(m.IsAssembly)a|=MethodAttributes.Assembly;
                  else a|=MethodAttributes.Private;
                  if(m.IsSpecialName)a|=MethodAttributes.SpecialName;
                  return a;
              }

              static Type BuildCaptureStream(Type baseType)
              {
                  AssemblyName an=new AssemblyName("OKN_V18_CAPTURE_STREAM");
                  AssemblyBuilder ab=AppDomain.CurrentDomain.DefineDynamicAssembly(
                      an,AssemblyBuilderAccess.Run);
                  ModuleBuilder mb=ab.DefineDynamicModule("main");
                  TypeBuilder tb=mb.DefineType(
                      "OKN.CaptureDeviceCommunicationStream",
                      TypeAttributes.Public|TypeAttributes.Class,
                      baseType
                  );

                  ConstructorInfo bc=baseType.GetConstructor(
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance,
                      null,Type.EmptyTypes,null
                  );
                  if(bc==null)throw new Exception("DeviceCommunicationStream parameterless ctor missing");

                  ConstructorBuilder cb=tb.DefineConstructor(
                      MethodAttributes.Public,CallingConventions.Standard,Type.EmptyTypes
                  );
                  ILGenerator ci=cb.GetILGenerator();
                  ci.Emit(OpCodes.Ldarg_0);
                  ci.Emit(OpCodes.Call,bc);
                  ci.Emit(OpCodes.Ret);

                  MethodInfo[] all=baseType.GetMethods(
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance
                  );

                  MethodInfo[] selected=all.Where(m =>
                      m.IsVirtual && !m.IsFinal &&
                      (m.IsAbstract ||
                       m.Name=="Write" || m.Name=="WriteLine" ||
                       m.Name=="ReadBytes" || m.Name=="ReadLine" ||
                       m.Name=="Connect" || m.Name=="Disconnect")
                  ).GroupBy(m=>m.ToString()).Select(g=>g.First()).ToArray();

                  foreach(MethodInfo m in selected)
                  {
                      Type[] ps=m.GetParameters().Select(x=>x.ParameterType).ToArray();
                      MethodBuilder b=tb.DefineMethod(
                          m.Name,Visibility(m),m.ReturnType,ps
                      );
                      ILGenerator il=b.GetILGenerator();

                      if(m.Name=="Write" && ps.Length==1 && ps[0]==typeof(byte[]))
                      {
                          il.Emit(OpCodes.Ldarg_1);
                          il.Emit(OpCodes.Call,
                              typeof(CaptureSink).GetMethod(
                                  "Record",BindingFlags.Public|BindingFlags.Static));
                          EmitDefaultReturn(il,m.ReturnType);
                      }
                      else
                      {
                          EmitDefaultReturn(il,m.ReturnType);
                      }

                      tb.DefineMethodOverride(b,m);
                  }

                  return tb.CreateType();
              }

              static void SetConnected(object stream,Type baseType)
              {
                  Type et=baseType.GetNestedType(
                      "ConnectionStatus",
                      BindingFlags.Public|BindingFlags.NonPublic
                  );
                  if(et==null || !et.IsEnum)
                  {
                      Log("CONNECTION_STATUS_ENUM_MISSING=true");
                      return;
                  }

                  object connected=Enum.Parse(et,"Connected");
                  FieldInfo f=baseType.GetFields(
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance
                  ).FirstOrDefault(x=>x.FieldType==et);

                  if(f!=null)
                  {
                      f.SetValue(stream,connected);
                      Log("SET_CONNECTION_STATUS_FIELD="+f.Name+" VALUE=Connected");
                      return;
                  }

                  MethodInfo up=baseType.GetMethod(
                      "UpdateDeviceConnStatus",
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance
                  );
                  if(up!=null)
                  {
                      up.Invoke(stream,new object[]{connected});
                      Log("SET_CONNECTION_STATUS_METHOD=Connected");
                  }
              }

              static void DumpEnums(Assembly asm)
              {
                  foreach(string tn in new[]{
                      "DSTech_AudioDSP_Client.UFEHeader",
                      "DSTech_AudioDSP_Client.UFEStreamStatus"
                  })
                  {
                      Type t=asm.GetType(tn,false);
                      if(t==null || !t.IsEnum)continue;
                      foreach(object v in Enum.GetValues(t))
                          Log("ENUM|"+tn+"|"+Enum.GetName(t,v)+"=0x"+
                              Convert.ToInt64(v).ToString("X"));
                  }
              }

              static void DumpQueue(object bridge,Type bridgeType,string tag)
              {
                  FieldInfo q=bridgeType.GetFields(
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance
                  ).FirstOrDefault(f =>
                      f.FieldType.IsGenericType &&
                      f.FieldType.GetGenericTypeDefinition()==typeof(List<>)
                  );
                  if(q==null)
                  {
                      Log(tag+"_QUEUE_FIELD_MISSING=true");
                      return;
                  }

                  IEnumerable en=q.GetValue(bridge) as IEnumerable;
                  if(en==null)
                  {
                      Log(tag+"_QUEUE_NULL=true");
                      return;
                  }

                  int i=0;
                  foreach(object cmd in en)
                  {
                      if(cmd==null)continue;
                      MethodInfo tba=cmd.GetType().GetMethod(
                          "ToByteArray",
                          BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance,
                          null,Type.EmptyTypes,null
                      );
                      if(tba!=null)
                      {
                          try
                          {
                              byte[] b=tba.Invoke(cmd,null) as byte[];
                              Log(tag+"_QUEUE_"+i+"_TYPE="+cmd.GetType().FullName+
                                  " HEX="+Hex(b));
                          }
                          catch(Exception ex)
                          {
                              Log(tag+"_QUEUE_"+i+"_EXCEPTION="+ex.GetBaseException());
                          }
                      }
                      i++;
                  }
                  Log(tag+"_QUEUE_COUNT="+i);
              }

              static void DumpUFEDevice(object dev,string tag)
              {
                  if(dev==null)
                  {
                      Log(tag+"_REMOTE_DEVICE=<NULL>");
                      return;
                  }

                  Type t=dev.GetType();
                  Log(tag+"_REMOTE_DEVICE_TYPE="+t.FullName);

                  string[] wanted={
                      "name","typeID","swVersion","hwVersion","description",
                      "manufacturer","manufacturingSite","serviceTag","vendor",
                      "supportedCommunicationWay"
                  };

                  foreach(string n in wanted)
                  {
                      PropertyInfo p=t.GetProperty(
                          n,BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance
                      );
                      if(p==null || p.GetIndexParameters().Length!=0)continue;
                      MethodInfo g=p.GetGetMethod(true);
                      if(g==null)continue;
                      try
                      {
                          object v=InvokeBounded(g,dev,null,800,tag+"_PROP_"+n);
                          Log(tag+"_REMOTE_PROP_"+n+"="+SafeValue(v));
                      }
                      catch(Exception ex)
                      {
                          Log(tag+"_REMOTE_PROP_"+n+"_EXCEPTION="+
                              ex.GetBaseException().GetType().FullName+":"+
                              ex.GetBaseException().Message);
                      }
                  }
              }

              static void DumpBridgeState(object bridge,Type bridgeType,string tag)
              {
                  foreach(FieldInfo f in bridgeType.GetFields(
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance
                  ))
                  {
                      Type ft=f.FieldType;
                      bool simple=
                          ft.IsPrimitive || ft.IsEnum || ft==typeof(string) ||
                          ft==typeof(byte[]) ||
                          (ft.IsGenericType &&
                           ft.GetGenericTypeDefinition()==typeof(Nullable<>));

                      if(f.Name=="RemoteDevice")
                      {
                          try{ DumpUFEDevice(f.GetValue(bridge),tag); }
                          catch(Exception ex){ Log(tag+"_REMOTE_DEVICE_EXCEPTION="+ex.GetBaseException()); }
                      }
                      else if(simple)
                      {
                          try{ Log(tag+"_FIELD_"+f.Name+"="+SafeValue(f.GetValue(bridge))); }
                          catch(Exception ex){ Log(tag+"_FIELD_"+f.Name+"_EXCEPTION="+ex.GetBaseException()); }
                      }
                  }

                  foreach(string pn in new[]{"StreamStatus","DevDescriptionLength"})
                  {
                      PropertyInfo p=bridgeType.GetProperty(
                          pn,BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance
                      );
                      if(p==null)continue;
                      MethodInfo g=p.GetGetMethod(true);
                      if(g==null)continue;
                      try
                      {
                          object v=InvokeBounded(g,bridge,null,800,tag+"_GET_"+pn);
                          Log(tag+"_PROPERTY_"+pn+"="+SafeValue(v));
                      }
                      catch(Exception ex)
                      {
                          Log(tag+"_PROPERTY_"+pn+"_EXCEPTION="+ex.GetBaseException());
                      }
                  }
              }

              static object NewPreparedBridge(
                  Type baseType,Type captureType,Type bridgeType,
                  out object stream,string tag)
              {
                  stream=Activator.CreateInstance(captureType);
                  SetConnected(stream,baseType);

                  ConstructorInfo bc=bridgeType.GetConstructor(new[]{baseType});
                  if(bc==null)throw new Exception("UFEcommandBridge ctor missing");
                  object bridge=bc.Invoke(new[]{stream});

                  MethodInfo req=bridgeType.GetMethod(
                      "SendDevTypeSwVersAuthenRequest",
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance
                  );
                  if(req==null)throw new Exception("actual startup helper missing");

                  CaptureSink.Clear();
                  InvokeBounded(req,bridge,null,1500,tag+"_STARTUP_HELPER");
                  Thread.Sleep(150);

                  byte[][] baseline=CaptureSink.Snapshot();
                  for(int i=0;i<baseline.Length;i++)
                      Log(tag+"_BASELINE_HANDSHAKE_WRITE_"+i+"="+Hex(baseline[i]));

                  CaptureSink.Clear();
                  DumpBridgeState(bridge,bridgeType,tag+"_BEFORE_RESPONSE");
                  DumpQueue(bridge,bridgeType,tag+"_BEFORE_RESPONSE");
                  return bridge;
              }

              static void CaptureWrites(string tag)
              {
                  Thread.Sleep(250);
                  byte[][] w=CaptureSink.Snapshot();
                  Log(tag+"_FOLLOWUP_WRITE_COUNT="+w.Length);
                  for(int i=0;i<w.Length;i++)
                      Log(tag+"_FOLLOWUP_WRITE_"+i+"="+Hex(w[i]));
              }

              static void RunFblCase(
                  Type baseType,Type captureType,Type bridgeType,
                  byte[] data,string tag)
              {
                  object stream;
                  object bridge=NewPreparedBridge(
                      baseType,captureType,bridgeType,out stream,tag
                  );

                  MethodInfo fbl=bridgeType.GetMethod(
                      "FBL3HEmTva",
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance
                  );
                  if(fbl==null)throw new Exception("FBL3HEmTva parser event handler missing");

                  Log(tag+"_INPUT_LEN="+data.Length);
                  Log(tag+"_INPUT_HEX="+Hex(data));

                  try
                  {
                      InvokeBounded(
                          fbl,bridge,new object[]{stream,data,EventArgs.Empty},
                          2500,tag+"_FBL"
                      );
                      Log(tag+"_FBL_INVOKE=RETURNED");
                  }
                  catch(Exception ex)
                  {
                      Exception b=ex.GetBaseException();
                      Log(tag+"_FBL_EXCEPTION="+b.GetType().FullName+":"+b.Message);
                  }

                  CaptureWrites(tag);
                  DumpQueue(bridge,bridgeType,tag+"_AFTER_RESPONSE");
                  DumpBridgeState(bridge,bridgeType,tag+"_AFTER_RESPONSE");
              }

              static void RunYeaCase(
                  Type baseType,Type captureType,Type bridgeType,
                  byte[] data,string tag)
              {
                  object stream;
                  object bridge=NewPreparedBridge(
                      baseType,captureType,bridgeType,out stream,tag
                  );

                  MethodInfo yea=bridgeType.GetMethod(
                      "yEA33sF0N1",
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance
                  );
                  if(yea==null)throw new Exception("yEA33sF0N1 parser missing");

                  Log(tag+"_INPUT_LEN="+data.Length);
                  Log(tag+"_INPUT_HEX="+Hex(data));

                  try
                  {
                      object r=InvokeBounded(
                          yea,bridge,new object[]{data},
                          2500,tag+"_YEA"
                      );
                      Log(tag+"_YEA_RETURN="+SafeValue(r));
                  }
                  catch(Exception ex)
                  {
                      Exception b=ex.GetBaseException();
                      Log(tag+"_YEA_EXCEPTION="+b.GetType().FullName+":"+b.Message);
                  }

                  CaptureWrites(tag);
                  DumpQueue(bridge,bridgeType,tag+"_AFTER_RESPONSE");
                  DumpBridgeState(bridge,bridgeType,tag+"_AFTER_RESPONSE");
              }

              static void Main(string[] a)
              {
                  string exe=Path.GetFullPath(a[0]);
                  string outp=Path.GetFullPath(a[1]);
                  Directory.SetCurrentDirectory(Path.GetDirectoryName(exe));
                  OutPath=outp;
                  File.WriteAllText(OutPath,"");

                  Log("MODE=OFFLINE_V17_RESPONSE_REPLAY_ONLY");
                  Log("REAL_HID_OBJECT_CREATED=NO");
                  Log("REAL_HID_CONNECT_INVOKED=NO");
                  Log("REAL_HID_SEND_INVOKED=NO");
                  Log("REAL_HID_WRITE_INVOKED=NO");
                  Log("REAL_HID_READ_INVOKED=NO");
                  Log("HOST_TO_DSP_IO=NO");

                  try
                  {
                      Assembly asm=Assembly.LoadFile(exe);
                      RuntimeHelpers.RunModuleConstructor(asm.ManifestModule.ModuleHandle);
                      Log("MODULE_INITIALIZER=SUCCESS");

                      DumpEnums(asm);

                      Type baseType=asm.GetType(
                          "DSTech_AudioDSP_Client.DeviceCommunicationStream",true);
                      Type bridgeType=asm.GetType(
                          "DSTech_AudioDSP_Client.UFEcommandBridge",true);
                      Type captureType=BuildCaptureStream(baseType);
                      Log("CAPTURE_STREAM_TYPE="+captureType.FullName);

                      byte[] raw256=HexToBytes(RAW256_HEX);
                      byte[] len33=HexToBytes(LEN33_HEX);
                      byte[] payload32=HexToBytes(PAYLOAD32_HEX);
                      byte[] rid34=HexToBytes(REPORTID_LEN34_HEX);

                      RunFblCase(baseType,captureType,bridgeType,raw256,"FBL_RAW256");
                      RunFblCase(baseType,captureType,bridgeType,len33,"FBL_LEN33");
                      RunFblCase(baseType,captureType,bridgeType,payload32,"FBL_PAYLOAD32");
                      RunFblCase(baseType,captureType,bridgeType,rid34,"FBL_REPORTID_LEN34");

                      RunYeaCase(baseType,captureType,bridgeType,raw256,"YEA_RAW256");
                      RunYeaCase(baseType,captureType,bridgeType,len33,"YEA_LEN33");
                      RunYeaCase(baseType,captureType,bridgeType,payload32,"YEA_PAYLOAD32");
                      RunYeaCase(baseType,captureType,bridgeType,rid34,"YEA_REPORTID_LEN34");
                  }
                  catch(Exception ex)
                  {
                      Log("TOP_EXCEPTION="+ex.ToString());
                  }

                  Log("REPLAY_PROBE_MAIN_COMPLETE=true");
                  Environment.Exit(0);
              }
          }
          '@ | Set-Content "$root\harness\ReplayProbe.cs"

          $csc="$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          if(-not(Test-Path $csc)){throw "x86 csc missing"}

          & $csc /nologo /platform:x86 /target:exe `
            /out:"$root\harness\ReplayProbe.exe" "$root\harness\ReplayProbe.cs"
          if($LASTEXITCODE -ne 0){throw "ReplayProbe compile failed"}

      - name: Static safety audit response replay probe
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v18"
          $s=Get-Content "$root\harness\ReplayProbe.cs" -Raw

          foreach($bad in @(
            "HidD_SetOutputReport(","HidD_GetInputReport(",
            "HidD_SetFeature(","HidD_GetFeature(",
            "ReadFile(","WriteFile(","CreateFileW("
          )){
            if($s.Contains($bad)){throw "native/real HID call forbidden: $bad"}
          }

          foreach($required in @(
            "BuildCaptureStream",
            "SendDevTypeSwVersAuthenRequest",
            "FBL3HEmTva",
            "yEA33sF0N1",
            "D024E38C410000004202B94C65A23F2C640C8F60E133784C7E47463A7A521056",
            "REAL_HID_OBJECT_CREATED=NO",
            "HOST_TO_DSP_IO=NO"
          )){
            if(-not $s.Contains($required)){throw "required offline replay marker missing: $required"}
          }

          "STATIC_SAFETY_AUDIT=PASS" |
            Set-Content "$root\evidence\02_STATIC_SAFETY_AUDIT.txt"

      - name: Replay V17 physical response through vendor parser offline
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v18"

          $p=Start-Process `
            -FilePath "$root\harness\ReplayProbe.exe" `
            -ArgumentList @("$root\vendor.exe","$root\evidence\03_RESPONSE_REPLAY.txt") `
            -WorkingDirectory $root `
            -RedirectStandardOutput "$root\evidence\03A_STDOUT.txt" `
            -RedirectStandardError "$root\evidence\03B_STDERR.txt" `
            -PassThru

          if(-not $p.WaitForExit(30000)){
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw "response replay probe timed out"
          }

          if(-not(Test-Path "$root\evidence\03_RESPONSE_REPLAY.txt")){
            throw "response replay evidence missing"
          }

          $ev=Get-Content "$root\evidence\03_RESPONSE_REPLAY.txt" -Raw
          if($ev -notmatch 'REPLAY_PROBE_MAIN_COMPLETE=true'){
            throw "response replay incomplete"
          }

          Get-Content "$root\evidence\03_RESPONSE_REPLAY.txt"

      - name: Derive V18 parser and next-command verdict
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v18"

          @'
          from pathlib import Path
          import json,re

          ev=Path(r"C:\okn_v18\evidence")
          text=(ev/"03_RESPONSE_REPLAY.txt").read_text(errors="ignore")
          lines=text.splitlines()

          cases=[
              "FBL_RAW256","FBL_LEN33","FBL_PAYLOAD32","FBL_REPORTID_LEN34",
              "YEA_RAW256","YEA_LEN33","YEA_PAYLOAD32","YEA_REPORTID_LEN34"
          ]

          out={}
          for c in cases:
              d={
                  "followup_writes":[],
                  "queue_hex":[],
                  "remote_properties":{},
                  "stream_status":None,
                  "description_length":None,
                  "parser_return":None,
                  "exception":None
              }

              for line in lines:
                  if line.startswith(c+"_FOLLOWUP_WRITE_"):
                      m=re.search(r"=([0-9A-F]+|<NULL>)$",line)
                      if m:d["followup_writes"].append(m.group(1))
                  if line.startswith(c+"_AFTER_RESPONSE_QUEUE_") and " HEX=" in line:
                      m=re.search(r"HEX=([0-9A-F]+|<NULL>)",line)
                      if m:d["queue_hex"].append(m.group(1))
                  if line.startswith(c+"_AFTER_RESPONSE_REMOTE_PROP_"):
                      k,v=line.split("=",1)
                      prop=k.split("_REMOTE_PROP_",1)[1]
                      d["remote_properties"][prop]=v
                  if line.startswith(c+"_AFTER_RESPONSE_PROPERTY_StreamStatus="):
                      d["stream_status"]=line.split("=",1)[1]
                  if line.startswith(c+"_AFTER_RESPONSE_PROPERTY_DevDescriptionLength="):
                      d["description_length"]=line.split("=",1)[1]
                  if line.startswith(c+"_YEA_RETURN="):
                      d["parser_return"]=line.split("=",1)[1]
                  if line.startswith(c+"_FBL_EXCEPTION=") or line.startswith(c+"_YEA_EXCEPTION="):
                      d["exception"]=line.split("=",1)[1]
              out[c]=d

          enum_lines=[x for x in lines if x.startswith("ENUM|")]

          def score(c,d):
              s=0
              if d["followup_writes"]:s+=100
              if d["queue_hex"]:s+=50
              rp=d["remote_properties"]
              if rp.get("typeID") not in (None,"0"):s+=20
              if rp.get("swVersion") not in (None,"0"):s+=20
              if rp.get("name") not in (None,"","<NULL>"):s+=10
              if d["stream_status"] not in (None,"0","Undefined"):s+=10
              if d["parser_return"] not in (None,"-2","-1"):s+=5
              if d["exception"]:s-=30
              return s

          ranking=sorted(
              [{"case":c,"score":score(c,out[c])} for c in cases],
              key=lambda x:x["score"],reverse=True
          )

          facts={
              "revision":"MASTER-V18",
              "v17_physical_response_seen":True,
              "v17_declared_payload_length":32,
              "v17_payload_hex":"D024E38C410000004202B94C65A23F2C640C8F60E133784C7E47463A7A521056",
              "response_shapes_tested":cases,
              "results":out,
              "ranking":ranking,
              "ufe_enum_constants":enum_lines,
              "real_hid_invoked":False,
              "host_to_dsp_io":False,
              "feature_report_invoked":False,
              "flash_allowed":False
          }

          best=ranking[0]
          bd=out[best["case"]]
          if bd["followup_writes"]:
              facts["status"]="VENDOR_PARSER_ACCEPTED_RESPONSE_AND_EMITTED_NEXT_COMMAND"
              facts["next_command_hex"]=bd["followup_writes"][0]
          elif bd["queue_hex"]:
              facts["status"]="VENDOR_PARSER_ACCEPTED_RESPONSE_AND_QUEUED_NEXT_COMMAND"
              facts["next_command_hex"]=bd["queue_hex"][0]
          elif best["score"]>0:
              facts["status"]="VENDOR_PARSER_RESPONSE_STATE_CHANGE_RECOVERED_NO_NEXT_WRITE_YET"
          else:
              facts["status"]="PARSER_INPUT_SHAPE_OR_STATE_REQUIRES_MORE_OFFLINE_RECOVERY"

          (ev/"04_V18_FINAL_DECISION.json").write_text(
              json.dumps(facts,indent=2)+"\n"
          )

          md=f"""# MASTER V18 FINAL DECISION

          - V17 physical response seen: **YES**
          - V17 declared payload length: **32 bytes**
          - V17 payload: `D024E38C410000004202B94C65A23F2C640C8F60E133784C7E47463A7A521056`
          - Vendor parser replay cases: **{len(cases)}**
          - Best parser case: **{best['case']}** (score {best['score']})
          - Follow-up writes in best case: **{len(bd['followup_writes'])}**
          - Queued commands in best case: **{len(bd['queue_hex'])}**
          - Parser return in best case: **{bd['parser_return']}**
          - Stream status in best case: **{bd['stream_status']}**
          - Remote device properties: **{bd['remote_properties']}**
          - Next command: **{facts.get('next_command_hex','NONE')}**
          - Real HID invoked: **NO**
          - Host-to-DSP I/O: **NO**
          - Feature report invoked: **NO**
          - Flash allowed: **NO**

          Status: **{facts['status']}**

          Classification: **OFFLINE_REAL_RESPONSE_PARSER_REPLAY_NOT_FOR_FLASH**
          """
          (ev/"05_V18_FINAL_DECISION.md").write_text(md)
          print(md)
          '@ | Set-Content "$root\derive.py"

          python "$root\derive.py"
          Get-Content "$root\evidence\05_V18_FINAL_DECISION.md" >> $env:GITHUB_STEP_SUMMARY

      - name: Package V18 evidence
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v18"

          Copy-Item "$root\evidence\*" "$root\out\" -Force

          if(Test-Path "$root\out\vendor.exe"){throw "vendor EXE leak"}
          if(Test-Path "$root\out\ReplayProbe.exe"){throw "probe EXE leak"}

          Get-ChildItem "$root\out" -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content "$root\out\SHA256SUMS.txt"

      - name: Upload V18 evidence
        uses: actions/upload-artifact@v7
        with:
          name: OKN-BP1048P4-MASTER-V18-REAL-RESPONSE-PARSER-NEXT-COMMAND-EVIDENCE
          path: C:\okn_v18\out\*
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed assertion
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v18"

          foreach($n in @(
            "LIVE_DSP_CONNECTED","USB_TARGET_ACCESS","HOST_TO_DSP_IO",
            "REAL_HID_OBJECT_ALLOWED","REAL_HID_CONNECT_ALLOWED",
            "REAL_HID_SEND_ALLOWED","REAL_HID_READ_ALLOWED","REAL_HID_WRITE_ALLOWED",
            "FEATURE_REPORT_ALLOWED","FLASH_ALLOWED","ERASE_ALLOWED","WRITE_ALLOWED"
          )){
            if((Get-Item "Env:$n").Value -ne "NO"){throw "$n changed"}
          }

          $d=Get-Content "$root\evidence\04_V18_FINAL_DECISION.json" -Raw | ConvertFrom-Json
          if($d.real_hid_invoked -ne $false){throw "bad HID state"}
          if($d.host_to_dsp_io -ne $false){throw "bad host-to-DSP state"}
          if($d.feature_report_invoked -ne $false){throw "bad feature state"}
          if($d.flash_allowed -ne $false){throw "bad flash state"}
          if($d.v17_physical_response_seen -ne $true){throw "V17 response provenance missing"}

          "MASTER_V18=PASS"
          "REAL_HID_IO=NO"
          "HOST_TO_DSP_IO=NO"
          "FEATURE_REPORT=NO"
          "FLASH_ALLOWED=NO"
