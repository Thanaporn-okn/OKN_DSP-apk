name: Build OKN DSP Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter stable
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/flutter/flutter.git --depth 1 -b stable "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" config --no-analytics
          "$HOME/flutter/bin/flutter" --version

      - name: Flutter doctor
        shell: bash
        run: |
          set -euo pipefail
          flutter doctor -v

      - name: Ensure Android project exists
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            echo "android/ not found. Generating Android platform files..."
            flutter create --platforms=android --project-name okn_dsp_apk .
          else
            echo "android/ already exists."
          fi

      - name: Get Flutter packages
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug

      - name: Show APK files
        if: always()
        shell: bash
        run: |
          find build/app/outputs/flutter-apk -type f -name "*.apk" -print 2>/dev/null || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
