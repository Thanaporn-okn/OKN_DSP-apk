name: Build OKN DSP V51 Verified Live EQ 7CH

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_ANDROID_V51_VERIFIED_LIVE_EQ_7CH.zip'
      - '.github/workflows/build-okn-dsp-v51.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify V51 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/okn_v51
          mkdir -p /tmp/okn_v51
          unzip -q OKN_DSP_ANDROID_V51_VERIFIED_LIVE_EQ_7CH.zip -d /tmp/okn_v51

          check_file() { test -f "$1" || { echo "ERROR missing $1"; exit 1; }; echo "OK file: $1"; }
          check_text() { grep -Fq "$1" "$2" || { echo "ERROR missing marker '$1' in $2"; exit 1; }; echo "OK marker: $1"; }

          LIVE=/tmp/okn_v51/app/src/main/java/com/okn/dsp/LiveEqActivity.kt
          POLICY=/tmp/okn_v51/app/src/main/java/com/okn/dsp/protocol/LiveEqPolicy.kt
          GATE=/tmp/okn_v51/app/src/main/java/com/okn/dsp/protocol/WriteGate.kt
          MAP=/tmp/okn_v51/app/src/main/java/com/okn/dsp/protocol/ConfirmedDspMap.kt
          CODEC=/tmp/okn_v51/app/src/main/java/com/okn/dsp/protocol/EqBandCodec.kt
          MANIFEST=/tmp/okn_v51/app/src/main/AndroidManifest.xml
          GRADLE=/tmp/okn_v51/app/build.gradle.kts

          check_file "$LIVE"
          check_file "$POLICY"
          check_file "$GATE"
          check_file "$MAP"
          check_file "$CODEC"
          check_file "$MANIFEST"
          check_file "$GRADLE"
          check_file /tmp/okn_v51/README_V51.txt
          check_file /tmp/okn_v51/evidence/OKN_DSP_V50_ALL_7CH_RUNTIME_SUCCESS_CAPTURE.txt
          check_file /tmp/okn_v51/evidence/OKN_DSP_V51_LIVE_EQ_PLAN.txt
          check_file /tmp/okn_v51/evidence/OKN_DSP_V51_LIVE_EQ_PLAN.json

          check_text 'versionCode = 51' "$GRADLE"
          check_text '3.3.0-v51-verified-live-eq-7ch' "$GRADLE"
          check_text 'liveEqEditorEnabled: Boolean = true' "$GATE"
          check_text 'EQ_ACTUATOR_BY_CHANNEL = intArrayOf(4, 5, 6, 14, 15, 16, 17)' "$MAP"
          check_text 'const val BYTES = 48' "$CODEC"
          check_text 'const val SAMPLE_RATE_HZ = 44100.0' "$CODEC"
          check_text 'b.type == EqBandCodec.PEAKING_TYPE' "$POLICY"
          check_text 'abs(b.frequency2) <= ZERO_TOL' "$POLICY"
          check_text 'abs(b.gain) <= ZERO_TOL' "$POLICY"
          check_text 'abs(b.r) <= ZERO_TOL' "$POLICY"
          check_text 'V51_LIVE_EQ_WRITE_PLAIN=' "$LIVE"
          check_text 'V51_TARGET_DESCRIPTOR_VERIFY' "$LIVE"
          check_text 'V51_EQ_ROLLBACK_WRITE_PLAIN=' "$LIVE"
          check_text 'V51_ROLLBACK_DESCRIPTOR_VERIFY' "$LIVE"
          check_text 'V51_LIVE_EQ_WRITE_COMPLETE' "$LIVE"
          check_text 'persistence=RAM_ONLY' "$LIVE"
          check_text 'targetVerifyDelayMs = 3000L' "$LIVE"
          check_text 'restoreVerifyDelayMs = 3000L' "$LIVE"
          check_text 'V51_FAILSAFE_WINDOW_MS=45000' "$LIVE"
          check_text '.LiveEqActivity' "$MANIFEST"

          if grep -Fq 'UfeCodec.encodeWrite(7' "$LIVE" "$POLICY"; then
            echo 'ERROR: V51 contains SaveParams ID7 write'
            exit 1
          fi
          echo 'OK: V51 only exposes guarded PEAKING-band live writes and never sends SaveParams ID7'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/okn_v51
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and package artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn_v51/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          mkdir -p artifact
          cp "$APK" artifact/OKN_DSP_V51_VERIFIED_LIVE_EQ_7CH-debug.apk
          cp /tmp/okn_v51/README_V51.txt artifact/
          cp /tmp/okn_v51/evidence/OKN_DSP_V51_LIVE_EQ_PLAN.txt artifact/
          cp /tmp/okn_v51/evidence/OKN_DSP_V51_LIVE_EQ_PLAN.json artifact/
          sha256sum artifact/OKN_DSP_V51_VERIFIED_LIVE_EQ_7CH-debug.apk > artifact/OKN_DSP_V51_VERIFIED_LIVE_EQ_7CH-debug.sha256
          ls -lh artifact

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-V51-VERIFIED-LIVE-EQ-7CH-debug-apk
          path: artifact/
          if-no-files-found: error
          retention-days: 30
