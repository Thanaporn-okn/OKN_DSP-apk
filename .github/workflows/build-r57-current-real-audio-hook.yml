name: OKN R57 CURRENT Real Audio Hook Integration Gate

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-r57-current-real-audio-hook.yml"

permissions:
  contents: read

concurrency:
  group: okn-r57-current-real-audio-hook-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_REPO: https://github.com/leadercxn/bp1048_sdk_v0.1.12.git
  SDK_COMMIT: 8105bd864b04995d81c9f9ae77cb158259f39015
  TOOLCHAIN_REPO: https://github.com/xingrz/nds-builder.git
  TOOLCHAIN_COMMIT: 572969caccb1d0c576b2893c905fa7b3396815e4
  TOOLCHAIN_SHA256: a231682172de4af23ac94726c021a824f1ae7d1f7c72a4619093b90caa7de0e4
  SOURCE_ZIP_SHA256: b3d7ddfcac0343af4fec8433437ad633f31109e47daa2555aebf80e9e04d3eab
  LIVE_BOARD_USB: "NO"
  HOST_TO_DEVICE_USB: "NO"
  FLASH_ERASE_WRITE: "NO"
  FLASH_ALLOWED: "NO"
  FEATURE_SET_REPORT_ALLOWED: "NO"
  EXECUTE_VENDOR_EXE: "NO"

jobs:
  r57-current-audio-hook:
    name: Dedicated Gain + real-audio-hook evidence / offline only
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fail-closed safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$LIVE_BOARD_USB" = "NO"
          test "$HOST_TO_DEVICE_USB" = "NO"
          test "$FLASH_ERASE_WRITE" = "NO"
          test "$FLASH_ALLOWED" = "NO"
          test "$FEATURE_SET_REPORT_ALLOWED" = "NO"
          test "$EXECUTE_VENDOR_EXE" = "NO"
          echo "OFFLINE_ONLY=YES"
          echo "FLASH_ALLOWED=NO"

      - name: Restore exact R57 CURRENT source
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/R57_SOURCE.b64" <<'R57_B64'
          
          R57_B64
          sed 's/^          //' "$RUNNER_TEMP/R57_SOURCE.b64" | base64 -d > "$RUNNER_TEMP/R57_SOURCE.zip"
          echo "$SOURCE_ZIP_SHA256  $RUNNER_TEMP/R57_SOURCE.zip" | sha256sum -c -
          rm -rf "$RUNNER_TEMP/r57src"
          mkdir -p "$RUNNER_TEMP/r57src"
          unzip -q "$RUNNER_TEMP/R57_SOURCE.zip" -d "$RUNNER_TEMP/r57src"
          (cd "$RUNNER_TEMP/r57src" && sha256sum -c SOURCE_HASHES.txt)
          echo "R57_ROOT=$RUNNER_TEMP/r57src" >> "$GITHUB_ENV"

      - name: Prove Dedicated Gain is not EQ and production hook is locked
        shell: bash
        run: |
          set -euo pipefail
          cd "$R57_ROOT"
          python3 tools/audit_r57.py | tee "$RUNNER_TEMP/R57_AUDIT.txt"
          grep -q 'GAIN_VIA_EQ=NO' "$RUNNER_TEMP/R57_AUDIT.txt"
          grep -q 'DEDICATED_GAIN_ONLY=PASS' "$RUNNER_TEMP/R57_AUDIT.txt"
          grep -q 'REAL_7CH_OUTPUT_MAPPING_VERIFIED=NO' "$RUNNER_TEMP/R57_AUDIT.txt"
          grep -q 'CUSTOM_UFE_TRANSPORT_HOOK_VERIFIED=NO' "$RUNNER_TEMP/R57_AUDIT.txt"
          ! grep -RniE 'peq|biquad|equalizer|eq_apply|filter_gain' firmware/src/okn56_gain7.c firmware/src/okn56_runtime.c firmware/src/okn57_audio_hook.c

      - name: Host tests and sanitizers
        shell: bash
        run: |
          set -euo pipefail
          cd "$R57_ROOT"
          make clean
          make test | tee "$RUNNER_TEMP/HOST_TEST.log"
          make sanitize | tee "$RUNNER_TEMP/SANITIZE.log"
          grep -q 'PASS R57 CURRENT' "$RUNNER_TEMP/HOST_TEST.log"
          grep -q 'production mapping gate LOCKED' "$RUNNER_TEMP/HOST_TEST.log"

      - name: Pin public BP1048 SDK and extract audio routing evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/bp1048sdk"
          git init -q "$RUNNER_TEMP/bp1048sdk"
          git -C "$RUNNER_TEMP/bp1048sdk" remote add origin "$SDK_REPO"
          git -C "$RUNNER_TEMP/bp1048sdk" fetch -q --depth 1 origin "$SDK_COMMIT"
          git -C "$RUNNER_TEMP/bp1048sdk" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/bp1048sdk" rev-parse HEAD)" = "$SDK_COMMIT"
          mkdir -p "$RUNNER_TEMP/evidence"
          python3 "$R57_ROOT/tools/sdk_r57_probe.py" "$RUNNER_TEMP/bp1048sdk" "$RUNNER_TEMP/evidence"
          grep -q 'LOW_LEVEL_DUAL_I2S_API_PRESENT=YES' "$RUNNER_TEMP/evidence/R57_SDK_EVIDENCE.txt"
          grep -q 'NATIVE_GAIN_CONTROL_COUNT=5' "$RUNNER_TEMP/evidence/R57_SDK_EVIDENCE.txt"
          grep -q 'PUBLIC_SDK_PROVES_SIMULTANEOUS_7_OUTPUT_LANES=NO' "$RUNNER_TEMP/evidence/R57_SDK_EVIDENCE.txt"
          grep -q 'REAL_7CH_OUTPUT_MAPPING_VERIFIED=NO' "$RUNNER_TEMP/evidence/R57_SDK_EVIDENCE.txt"
          sha256sum "$RUNNER_TEMP/bp1048sdk/BT_Audio_APP/nds32-ae210p.ld" > "$RUNNER_TEMP/evidence/BT_AUDIO_LINKER_SHA256.txt"

      - name: Acquire pinned NDS32 D1088 toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libc6-i386 lib32z1 xz-utils
          rm -rf "$RUNNER_TEMP/nds-src" "$RUNNER_TEMP/nds"
          git init -q "$RUNNER_TEMP/nds-src"
          git -C "$RUNNER_TEMP/nds-src" remote add origin "$TOOLCHAIN_REPO"
          git -C "$RUNNER_TEMP/nds-src" fetch -q --depth 1 origin "$TOOLCHAIN_COMMIT"
          git -C "$RUNNER_TEMP/nds-src" checkout -q --detach FETCH_HEAD
          echo "$TOOLCHAIN_SHA256  $RUNNER_TEMP/nds-src/nds32le-elf-mculib-v3s.4.9.4.txz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/nds"
          tar -xJf "$RUNNER_TEMP/nds-src/nds32le-elf-mculib-v3s.4.9.4.txz" -C "$RUNNER_TEMP/nds"
          CC="$RUNNER_TEMP/nds/nds32le-elf-mculib-v3s/bin/nds32le-elf-gcc"
          "$CC" --version | tee "$RUNNER_TEMP/evidence/NDS32_COMPILER.txt"
          "$CC" -dumpmachine | tee "$RUNNER_TEMP/evidence/NDS32_TARGET.txt"

      - name: Target-compile R57 gain-only core and locked audio hook
        shell: bash
        run: |
          set -euo pipefail
          cd "$R57_ROOT"
          BIN="$RUNNER_TEMP/nds/nds32le-elf-mculib-v3s/bin"
          CC="$BIN/nds32le-elf-gcc"
          NM="$BIN/nds32le-elf-nm"
          READELF="$BIN/nds32le-elf-readelf"
          mkdir -p "$RUNNER_TEMP/target_obj"
          CFLAGS='-std=gnu11 -mcpu=d1088-spu -mext-dsp -Os -ffunction-sections -fdata-sections -Wall -Wextra -Werror'
          INC='-Ifirmware/include -Ifirmware/src'
          "$CC" $CFLAGS $INC -c firmware/src/okn56_gain7.c -o "$RUNNER_TEMP/target_obj/okn56_gain7.o"
          "$CC" $CFLAGS $INC -c firmware/src/okn56_runtime.c -o "$RUNNER_TEMP/target_obj/okn56_runtime.o"
          "$CC" $CFLAGS $INC -c firmware/src/okn57_audio_hook.c -o "$RUNNER_TEMP/target_obj/okn57_audio_hook.o"
          "$CC" -mcpu=d1088-spu -mext-dsp -r -nostdlib "$RUNNER_TEMP"/target_obj/okn56_gain7.o "$RUNNER_TEMP"/target_obj/okn56_runtime.o "$RUNNER_TEMP"/target_obj/okn57_audio_hook.o -o "$RUNNER_TEMP/OKN_R57_CURRENT_GAIN_AUDIO_HOOK_BP1048P4.o"
          "$READELF" -h "$RUNNER_TEMP/OKN_R57_CURRENT_GAIN_AUDIO_HOOK_BP1048P4.o" > "$RUNNER_TEMP/evidence/R57_TARGET_HEADER.txt"
          "$NM" -u "$RUNNER_TEMP/OKN_R57_CURRENT_GAIN_AUDIO_HOOK_BP1048P4.o" > "$RUNNER_TEMP/evidence/R57_TARGET_UNRESOLVED.txt" || true
          test -s "$RUNNER_TEMP/OKN_R57_CURRENT_GAIN_AUDIO_HOOK_BP1048P4.o"
          echo 'R57_TARGET_COMPILE_D1088=PASS' | tee "$RUNNER_TEMP/evidence/R57_TARGET_COMPILE.txt"

      - name: Compile dual-I2S SDK contract probe without executing it
        shell: bash
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/bp1048sdk"
          BIN="$RUNNER_TEMP/nds/nds32le-elf-mculib-v3s/bin"
          CC="$BIN/nds32le-elf-gcc"
          NM="$BIN/nds32le-elf-nm"
          : > "$RUNNER_TEMP/sdk_includes.rsp"
          for d in \
            "$S/MVsB1_Base_SDK/driver/driver_api/inc" \
            "$S/MVsB1_Base_SDK/driver/driver/inc" \
            "$S/BT_Audio_APP/bt_audio_app_src/inc"; do
            test -d "$d" && printf '%s\n' "-I$d" >> "$RUNNER_TEMP/sdk_includes.rsp"
          done
          find "$S/MVsB1_Base_SDK/driver" -type f -name '*.h' -printf '%h\n' | sort -u | while read -r d; do
            grep -Fxq -- "-I$d" "$RUNNER_TEMP/sdk_includes.rsp" || printf '%s\n' "-I$d" >> "$RUNNER_TEMP/sdk_includes.rsp"
          done
          "$CC" -std=gnu11 -mcpu=d1088-spu -mext-dsp -Os -Wall -Wextra -Werror \
            @"$RUNNER_TEMP/sdk_includes.rsp" \
            -c "$R57_ROOT/sdk_candidate/okn57_dual_i2s_contract.c" \
            -o "$RUNNER_TEMP/target_obj/okn57_dual_i2s_contract.o"
          "$NM" -u "$RUNNER_TEMP/target_obj/okn57_dual_i2s_contract.o" > "$RUNNER_TEMP/evidence/R57_DUAL_I2S_RELOCS.txt"
          for sym in AudioI2S0_DataSet AudioI2S1_DataSet AudioI2S0_DataSpaceLenGet AudioI2S1_DataSpaceLenGet; do
            grep -F "$sym" "$RUNNER_TEMP/evidence/R57_DUAL_I2S_RELOCS.txt" >/dev/null
          done
          echo 'R57_DUAL_I2S_SDK_CONTRACT_COMPILE=PASS' | tee "$RUNNER_TEMP/evidence/R57_DUAL_I2S_COMPILE.txt"
          echo 'DUAL_I2S_OBJECT_EXECUTED=NO' >> "$RUNNER_TEMP/evidence/R57_DUAL_I2S_COMPILE.txt"
          echo 'BOARD_PIN_MAPPING_PROVEN=NO' >> "$RUNNER_TEMP/evidence/R57_DUAL_I2S_COMPILE.txt"

      - name: Link against actual BT_Audio_APP memory layout smoke only
        shell: bash
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/bp1048sdk"
          BIN="$RUNNER_TEMP/nds/nds32le-elf-mculib-v3s/bin"
          CC="$BIN/nds32le-elf-gcc"
          SIZE="$BIN/nds32le-elf-size"
          cat > "$RUNNER_TEMP/r57_main.c" <<'C'
          #include "okn57_audio_hook.h"
          static okn56_runtime_t g;
          static int16_t d0[2], dx[1], i0[2], i1[2];
          int main(void){
              okn57_candidate_outputs_t o={d0,dx,i0,i1,1u};
              (void)okn56_runtime_init(&g,48000u,5u);
              (void)okn57_apply_production_outputs(&g,&o);
              for(;;){}
              return 0;
          }
          C
          "$CC" -std=gnu11 -mcpu=d1088-spu -mext-dsp -Os -I"$R57_ROOT/firmware/include" -I"$R57_ROOT/firmware/src" \
            -c "$RUNNER_TEMP/r57_main.c" -o "$RUNNER_TEMP/target_obj/r57_main.o"
          CRT="$S/MVsB1_Base_SDK/examples/Example_GPIO/Debug/startup"
          for x in crt0.o init-default.o interrupt.o retarget.o; do test -s "$CRT/$x"; done
          "$CC" -nostartfiles -static -mcmodel=medium -mext-dsp \
            -T"$S/BT_Audio_APP/nds32-ae210p.ld" -Wl,--gc-sections \
            "$CRT/crt0.o" "$CRT/init-default.o" "$CRT/interrupt.o" "$CRT/retarget.o" \
            "$RUNNER_TEMP/target_obj/r57_main.o" \
            "$RUNNER_TEMP/target_obj/okn56_gain7.o" "$RUNNER_TEMP/target_obj/okn56_runtime.o" "$RUNNER_TEMP/target_obj/okn57_audio_hook.o" \
            -Wl,--start-group \
            "$S/MVsB1_Base_SDK/middleware/audio/libAudioEffectLibrary.a" \
            "$S/MVsB1_Base_SDK/driver/driver/libDriver.a" \
            -lm -lc -lgcc -ldsp -Wl,--end-group \
            -Wl,-Map,"$RUNNER_TEMP/evidence/R57_BT_AUDIO_LAYOUT.map" \
            -o "$RUNNER_TEMP/OKN_R57_BT_AUDIO_LAYOUT_SMOKE_NOT_FOR_FLASH.adx" \
            > "$RUNNER_TEMP/evidence/R57_BT_AUDIO_LAYOUT_LINK.log" 2>&1
          echo 'BT_AUDIO_LAYOUT_LINK=PASS' | tee "$RUNNER_TEMP/evidence/R57_LAYOUT_RESULT.txt"
          "$SIZE" "$RUNNER_TEMP/OKN_R57_BT_AUDIO_LAYOUT_SMOKE_NOT_FOR_FLASH.adx" | tee "$RUNNER_TEMP/evidence/R57_LAYOUT_SIZE.txt"
          echo 'PRODUCTION_FLASH_IMAGE=NO' >> "$RUNNER_TEMP/evidence/R57_LAYOUT_RESULT.txt"
          echo 'FLASH_ALLOWED=NO' >> "$RUNNER_TEMP/evidence/R57_LAYOUT_RESULT.txt"

      - name: Package R57 CURRENT integration evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/r57_current_out"
          rm -rf "$OUT" && mkdir -p "$OUT"
          cp "$RUNNER_TEMP/R57_SOURCE.zip" "$OUT/OKN_R57_CURRENT_REAL_AUDIO_HOOK_SOURCE.zip"
          cp "$RUNNER_TEMP/OKN_R57_CURRENT_GAIN_AUDIO_HOOK_BP1048P4.o" "$OUT/"
          cp "$RUNNER_TEMP/target_obj/okn57_dual_i2s_contract.o" "$OUT/"
          cp "$RUNNER_TEMP/OKN_R57_BT_AUDIO_LAYOUT_SMOKE_NOT_FOR_FLASH.adx" "$OUT/"
          cp "$RUNNER_TEMP/HOST_TEST.log" "$OUT/"
          cp "$RUNNER_TEMP/SANITIZE.log" "$OUT/"
          cp "$RUNNER_TEMP/R57_AUDIT.txt" "$OUT/"
          cp "$RUNNER_TEMP/evidence"/* "$OUT/"
          cat > "$OUT/BUILD_SCOPE.txt" <<'SCOPE'
          OKN R57 CURRENT REAL AUDIO HOOK INTEGRATION GATE
          Dedicated Gain: YES, 7 independent channels
          Gain via EQ: NO
          Gain range: -70.0 .. +6.0 dB
          Gain step: 0.5 dB
          Custom firmware Gain IDs: 22..28
          Custom firmware identity: ID29 raw ASCII OKN6
          Candidate logical output shape: DAC0 L/R + DACX mono + I2S0 L/R + I2S1 L/R
          Low-level public SDK exposes separate I2S0/I2S1 queue APIs: YES
          Public SDK proves simultaneous production 7-lane routing: NO
          REAL_7CH_OUTPUT_MAPPING_VERIFIED=NO
          CUSTOM_UFE_TRANSPORT_HOOK_VERIFIED=NO
          This artifact is NOT a production flash image.
          LIVE_BOARD_USB=NO
          HOST_TO_DEVICE_USB=NO
          FLASH_ERASE_WRITE=NO
          FLASH_ALLOWED=NO
          SCOPE
          (cd "$OUT" && sha256sum * > SHA256SUMS.txt)

      - name: Upload R57 CURRENT artifact
        uses: actions/upload-artifact@v7
        with:
          name: OKN_R57_CURRENT_REAL_AUDIO_HOOK_GATE
          path: r57_current_out/*
          if-no-files-found: error
          retention-days: 30

      - name: Final fail-closed assertion
        shell: bash
        run: |
          set -euo pipefail
          test "$LIVE_BOARD_USB" = "NO"
          test "$HOST_TO_DEVICE_USB" = "NO"
          test "$FLASH_ERASE_WRITE" = "NO"
          test "$FLASH_ALLOWED" = "NO"
          grep -q 'GAIN_VIA_EQ=NO' r57_current_out/R57_AUDIT.txt
          grep -q 'REAL_7CH_OUTPUT_MAPPING_VERIFIED=NO' r57_current_out/R57_SDK_EVIDENCE.txt
          grep -q 'CUSTOM_UFE_TRANSPORT_HOOK_VERIFIED=NO' r57_current_out/R57_SDK_EVIDENCE.txt
          grep -q 'R57_DUAL_I2S_SDK_CONTRACT_COMPILE=PASS' r57_current_out/R57_DUAL_I2S_COMPILE.txt
          test -s r57_current_out/OKN_R57_CURRENT_GAIN_AUDIO_HOOK_BP1048P4.o
          if compgen -G 'r57_current_out/*.bin' > /dev/null; then
            echo 'Unexpected BIN output' >&2
            exit 1
          fi
          echo 'R57_CURRENT_INTEGRATION_GATE=PASS'
          echo 'GAIN_VIA_EQ=NO'
          echo 'REAL_7CH_OUTPUT_MAPPING_VERIFIED=NO'
          echo 'FLASH_ALLOWED=NO'
