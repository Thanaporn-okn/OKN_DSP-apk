      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: /tmp/okn_v28
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -f /tmp/okn_v28/app/build/outputs/apk/debug/app-debug.apk
          ls -lh /tmp/okn_v28/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-V28-SESSION-CRYPTO-CONFIRMED-debug-apk
          path: /tmp/okn_v28/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
