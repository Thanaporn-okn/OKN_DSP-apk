name: OKN BP1048P4 R67 FIXED ONE-FILE AUTO USB Resource Boot Gate Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/OKN_BP1048P4_R67_FIXED_ONE_FILE_AUTORUN_USB_RESOURCE_BOOT_GATE_AUDIT.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  TARGET_SOC: "MVSilicon BP1048P4"
  REQUIRED_PHONE: "Samsung Galaxy S25+"
  REQUIRED_PATH: "Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only"

  SDK_REPO: "https://github.com/leadercxn/bp1048_sdk_v0.1.12.git"
  SDK_COMMIT: "8105bd864b04995d81c9f9ae77cb158259f39015"

  R66_ARTIFACT_ID: "11306195330"

  LIVE_USB_ALLOWED: "NO"
  FEATURE_REPORT_ALLOWED: "NO"
  RUNTIME_0X11_ALLOWED: "NO"
  FLASH_READ_ALLOWED: "NO"
  FLASH_WRITE_ALLOWED: "NO"
  FLASH_ERASE_ALLOWED: "NO"
  FLASH_ALLOWED: "NO"

jobs:
  r67-usb-resource-boot-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Hard fail-closed gate
        shell: bash
        run: |
          set -euo pipefail

          test "$TARGET_SOC" = "MVSilicon BP1048P4"
          test "$REQUIRED_PHONE" = "Samsung Galaxy S25+"
          test "$REQUIRED_PATH" = "Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only"

          for v in LIVE_USB_ALLOWED FEATURE_REPORT_ALLOWED RUNTIME_0X11_ALLOWED FLASH_READ_ALLOWED FLASH_WRITE_ALLOWED FLASH_ERASE_ALLOWED FLASH_ALLOWED; do
            test "${!v}" = "NO"
          done

          rm -rf /tmp/r67
          mkdir -p /tmp/r67/{sdk,r66,evidence,out}

          cat > /tmp/r67/evidence/00_SCOPE.txt <<'EOF'
          REVISION=R67
          TARGET=MVSilicon BP1048P4
          REQUIRED_PATH=Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only

          PURPOSE:
          1) Close the R66 false-positive function parser.
          2) Prove the exact Feature AA/55 -> start_up_grate gating.
          3) Prove what ResourceValue(AppResourceUsbDevice) checks.
          4) Find every source path that registers/deregisters AppResourceUsbDevice.
          5) Decide whether USB resource readiness can explain AA->55 without re-enumeration.

          STATIC/OFFLINE ONLY.
          NO BOARD I/O.
          NO FEATURE REPORT.
          NO RESET.
          NO 0x11.
          NO FLASH READ/WRITE/ERASE.
          FLASH_ALLOWED=NO
          EOF

      - name: Download exact R66 evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          curl -fL --retry 5 --retry-all-errors \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${R66_ARTIFACT_ID}/zip" \
            -o /tmp/r67/R66.zip

          unzip -q /tmp/r67/R66.zip -d /tmp/r67/r66

          test -s /tmp/r67/r66/14_R66_FUNCTION_BRIDGE_AUDIT.json
          test -s /tmp/r67/r66/15_R66_FINAL_DECISION.json
          grep -q '"flash_allowed": false' /tmp/r67/r66/15_R66_FINAL_DECISION.json

      - name: Clone exact public SDK
        shell: bash
        run: |
          set -euo pipefail

          git clone --filter=blob:none --no-checkout "$SDK_REPO" /tmp/r67/sdk
          git -C /tmp/r67/sdk fetch --depth 1 origin "$SDK_COMMIT"
          git -C /tmp/r67/sdk checkout -q --detach "$SDK_COMMIT"

          test "$(git -C /tmp/r67/sdk rev-parse HEAD)" = "$SDK_COMMIT"
          echo "SDK_COMMIT_MATCH=YES" > /tmp/r67/evidence/01_SDK_IDENTITY.txt

      - name: Close R66 false-positive exactly
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json, re

          S=Path("/tmp/r67/sdk")
          E=Path("/tmp/r67/evidence")
          R=Path("/tmp/r67/r66")

          r66=json.loads((R/"14_R66_FUNCTION_BRIDGE_AUDIT.json").read_text())
          up=S/"BT_Audio_APP/bt_audio_app_src/device/upgrade.c"
          t=up.read_text(errors="replace")

          def extract_function_by_anchor(text, anchor):
              # Use an exact literal function signature anchor instead of a regex
              # declaration parser. This avoids treating macros/bitfield names as
              # functions and is robust to CRLF/newline placement before "{".
              pos=text.find(anchor)
              if pos < 0:
                  raise SystemExit(f"function anchor not found: {anchor}")
              brace=text.find("{",pos + len(anchor))
              if brace < 0:
                  raise SystemExit(f"opening brace not found after: {anchor}")
              depth=0
              for i in range(brace,len(text)):
                  if text[i]=="{":
                      depth+=1
                  elif text[i]=="}":
                      depth-=1
                      if depth==0:
                          return text[pos:i+1]
              raise SystemExit(f"unterminated function after anchor: {anchor}")

          report=extract_function_by_anchor(t,"void report_up_grate()")
          startup=extract_function_by_anchor(t,"void start_up_grate(uint32_t UpdateResource)")

          candidate_names=[
              x.get("function","")
              for x in r66.get("same_function_userregister_set_plus_boot_primitive",[])
          ]

          state={
              "r66_candidate_names":candidate_names,
              "r66_candidate_named_SREG_FLASH_BOOT_FLAGE":"SREG_FLASH_BOOT_FLAGE" in candidate_names,
              "SREG_FLASH_BOOT_FLAGE_is_macro_not_function":bool(re.search(
                  r'#define\s+SREG_FLASH_BOOT_FLAGE\b',t
              )),
              "report_up_grate_contains_ROM_UserRegisterSet":"ROM_UserRegisterSet" in report,
              "report_up_grate_contains_start_up_grate":"start_up_grate(" in report,
              "report_up_grate_contains_bootflag_write":bool(re.search(
                  r'SREG_FLASH_BOOT_FLAGE\.(?:PC|updata)\s*=',report
              )),
              "start_up_grate_contains_ROM_UserRegisterSet":"ROM_UserRegisterSet" in startup,
              "start_up_grate_contains_bootflag_pc_write":bool(re.search(
                  r'SREG_FLASH_BOOT_FLAGE\.PC\s*=\s*1',startup
              )),
              "start_up_grate_contains_bootflag_updata_write":bool(re.search(
                  r'SREG_FLASH_BOOT_FLAGE\.updata\s*=\s*1',startup
              )),
              "r66_bridge_candidate_is_parser_false_positive":False,
          }

          if "ROM_UserRegisterSet(clear_data);" not in report:
              raise SystemExit("report_up_grate extraction self-test failed")
          if "SREG_FLASH_BOOT_FLAGE.PC = 1" not in startup:
              raise SystemExit("start_up_grate extraction self-test failed: PC bit")
          if "SREG_FLASH_BOOT_FLAGE.updata = 1" not in startup:
              raise SystemExit("start_up_grate extraction self-test failed: updata bit")

          state["r66_bridge_candidate_is_parser_false_positive"]=(
              state["r66_candidate_named_SREG_FLASH_BOOT_FLAGE"]
              and state["SREG_FLASH_BOOT_FLAGE_is_macro_not_function"]
              and state["report_up_grate_contains_ROM_UserRegisterSet"]
              and not state["report_up_grate_contains_bootflag_write"]
              and not state["start_up_grate_contains_ROM_UserRegisterSet"]
          )

          if not state["r66_bridge_candidate_is_parser_false_positive"]:
              raise SystemExit("R67 could not close R66 bridge candidate safely")

          (E/"02_R66_FALSE_POSITIVE_CLOSURE.json").write_text(
              json.dumps(state,indent=2,ensure_ascii=False)+"\n"
          )
          print(json.dumps(state,indent=2,ensure_ascii=False))
          PY

      - name: Prove ROM UserRegister and real dual-bank request are separate APIs
        shell: bash
        run: |
          set -euo pipefail

          ROM=/tmp/r67/sdk/MVsB1_Base_SDK/driver/driver/inc/rom.h
          test -s "$ROM"

          grep -n -E \
            'ROM_UserRegister(Set|Clear|Get)|lost data if power off|hold the data after system reset|ROM_BankBUpgradeApply|ROM_SysReset|auto boot to dual bank upgrade' \
            "$ROM" \
            > /tmp/r67/evidence/03_ROM_API_SEMANTICS.txt

          cat /tmp/r67/evidence/03_ROM_API_SEMANTICS.txt

          python3 - <<'PY'
          from pathlib import Path
          import json

          t=Path("/tmp/r67/sdk/MVsB1_Base_SDK/driver/driver/inc/rom.h").read_text(errors="replace")
          state={
              "userregister_is_16bit": "This 16 bits Register" in t,
              "userregister_lost_on_poweroff": "lost data if power off" in t,
              "userregister_holds_across_system_or_mcu_reset": "hold the data after system reset or MCU reset" in t,
              "dualbank_request_api_present": "ROM_BankBUpgradeApply" in t,
              "dualbank_reset_api_present": "ROM_SysReset" in t,
              "rom_header_says_auto_boot_dualbank_after_reset": "auto boot to dual bank upgrade function after reset" in t,
              "userregister_is_documented_as_dualbank_request_api": False,
          }
          Path("/tmp/r67/evidence/04_ROM_API_CLASSIFICATION.json").write_text(
              json.dumps(state,indent=2)+"\n"
          )
          print(json.dumps(state,indent=2))
          PY

      - name: Prove public FlashBoot and PC-tool compile configuration
        shell: bash
        run: |
          set -euo pipefail

          H=/tmp/r67/sdk/BT_Audio_APP/bt_audio_app_src/inc/flash_boot.h
          test -s "$H"

          grep -n -E \
            '#define[[:space:]]+FLASH_BOOT_EN|#define[[:space:]]+PCTOOL_(ON|OFF)|#define[[:space:]]+UP_PORT|JUDGEMENT_STANDARD' \
            "$H" \
            > /tmp/r67/evidence/05_FLASHBOOT_CONFIG.txt

          cat /tmp/r67/evidence/05_FLASHBOOT_CONFIG.txt

          python3 - <<'PY'
          from pathlib import Path
          import re,json

          t=Path("/tmp/r67/sdk/BT_Audio_APP/bt_audio_app_src/inc/flash_boot.h").read_text(errors="replace")

          def macro(name):
              m=re.search(rf'(?m)^\s*#define\s+{re.escape(name)}\s+([^\r\n/]+)',t)
              return m.group(1).strip() if m else None

          state={
              "FLASH_BOOT_EN":macro("FLASH_BOOT_EN"),
              "PCTOOL_ON":macro("PCTOOL_ON"),
              "UP_PORT":macro("UP_PORT"),
              "JUDGEMENT_STANDARD":macro("JUDGEMENT_STANDARD"),
          }
          state["public_sdk_flashboot_enabled"]=(state["FLASH_BOOT_EN"]=="1")
          state["public_sdk_up_port_mentions_pctool_on"]="PCTOOL_ON" in (state["UP_PORT"] or "")

          Path("/tmp/r67/evidence/06_FLASHBOOT_CONFIG.json").write_text(
              json.dumps(state,indent=2)+"\n"
          )
          print(json.dumps(state,indent=2))
          PY

      - name: Extract exact Feature AA55 gate logic
        shell: bash
        run: |
          set -euo pipefail

          F=/tmp/r67/sdk/MVsB1_Base_SDK/driver/driver_api/src/otg/device/otg_device_standard_request.c
          test -s "$F"

          grep -n -E \
            'pc_upgrade|GetReport \(Feature Report\)|SetReport \(Feature Report\)|Setup\[0\] = 0x55|Request\[0\] == 0xAA|Request\[0\] == 0x55|FLASH_BOOT_EN|start_up_grate\(AppResourceUsbDevice\)' \
            "$F" \
            > /tmp/r67/evidence/07_FEATURE_AA55_SOURCE.txt

          cat /tmp/r67/evidence/07_FEATURE_AA55_SOURCE.txt

          python3 - <<'PY'
          from pathlib import Path
          import re,json

          t=Path("/tmp/r67/sdk/MVsB1_Base_SDK/driver/driver_api/src/otg/device/otg_device_standard_request.c").read_text(errors="replace")

          state={
              "aa_sets_pc_upgrade":bool(re.search(
                  r'Request\[0\]\s*==\s*0xAA.*?pc_upgrade\s*=\s*1',
                  t,re.S
              )),
              "armed_get_sets_response_55":bool(re.search(
                  r'if\s*\(\s*pc_upgrade\s*\).*?Setup\[0\]\s*=\s*0x55',
                  t,re.S
              )),
              "armed_get_startup_call_present":"start_up_grate(AppResourceUsbDevice)" in t,
              "startup_call_is_FLASH_BOOT_EN_gated":bool(re.search(
                  r'#if\s+FLASH_BOOT_EN\s*[\r\n]+[ \t]*start_up_grate\(AppResourceUsbDevice\)',
                  t
              )),
          }

          # Important: 0x55 response assignment is outside the inner #if FLASH_BOOT_EN,
          # so an ACK alone does not prove the jump body was compiled/executed.
          m=re.search(
              r'if\s*\(\s*pc_upgrade\s*\)\s*\{(.*?)\n\s*\}',
              t,re.S
          )
          armed=m.group(1) if m else ""
          response_pos=armed.find("Setup[0] = 0x55")
          gate_pos=armed.find("#if FLASH_BOOT_EN")
          state["response_55_occurs_before_flashboot_compile_gate"]=(
              response_pos >= 0 and gate_pos >= 0 and response_pos < gate_pos
          )

          Path("/tmp/r67/evidence/08_FEATURE_GATE_CLASSIFICATION.json").write_text(
              json.dumps(state,indent=2)+"\n"
          )
          print(json.dumps(state,indent=2))
          PY

      - name: Prove ResourceValue implementation and USB resource registration paths
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r67/sdk

          {
            echo "=== ResourceValue implementation ==="
            git grep -n -I -E \
              'ModeResourceReady|uint32_t ResourceValue|ResourceRegister|ResourceDeregister' \
              -- BT_Audio_APP/bt_audio_app_src || true

            echo
            echo "=== AppResourceUsbDevice all source xrefs ==="
            git grep -n -I -E \
              'AppResourceUsbDevice' \
              -- BT_Audio_APP MVsB1_Base_SDK || true

            echo
            echo "=== Exact register/deregister calls for USB device resource ==="
            git grep -n -I -E \
              'Resource(Register|Deregister)\s*\(\s*AppResourceUsbDevice\s*\)' \
              -- BT_Audio_APP MVsB1_Base_SDK || true

            echo
            echo "=== Exact USB link detector and event bits ==="
            git grep -n -I -E \
              'OTG_PortDeviceIsLink|USB_DEVICE_STATE_BIT|USB_DEVICE_EVENT_BIT|ResourceRegister\(AppResourceUsbDevice\)|ResourceDeregister\(AppResourceUsbDevice\)' \
              -- BT_Audio_APP MVsB1_Base_SDK || true

            echo
            echo "=== USB detect / plug / VBUS / enum related source ==="
            git grep -n -I -E \
              'USB.*(insert|remove|connect|disconnect|detect|plug|VBUS|vbus)|Usb.*(insert|remove|connect|disconnect|detect|plug)|MSG_.*USB|USB_DEVICE|UsbDevice' \
              -- BT_Audio_APP/bt_audio_app_src/device BT_Audio_APP/bt_audio_app_src/apps MVsB1_Base_SDK/driver/driver_api/src/otg || true
          } > /tmp/r67/evidence/09_USB_RESOURCE_CENSUS.txt

          git grep -n -I -E \
            'Resource(Register|Deregister)\s*\(\s*AppResourceUsbDevice\s*\)' \
            -- BT_Audio_APP MVsB1_Base_SDK \
            > /tmp/r67/evidence/10_USB_RESOURCE_REGISTER_XREFS.txt || true

          git grep -n -I -E \
            'AppResourceUsbDevice' \
            -- BT_Audio_APP MVsB1_Base_SDK \
            > /tmp/r67/evidence/11_USB_RESOURCE_ALL_XREFS.txt || true

          sed -n '1,1800p' /tmp/r67/evidence/09_USB_RESOURCE_CENSUS.txt

      - name: Build exact ResourceValue gate decision
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json,re

          S=Path("/tmp/r67/sdk")
          E=Path("/tmp/r67/evidence")

          mode=(S/"BT_Audio_APP/bt_audio_app_src/apps/mode_switch_api.c").read_text(errors="replace")
          up=(S/"BT_Audio_APP/bt_audio_app_src/device/upgrade.c").read_text(errors="replace")
          reg=(E/"10_USB_RESOURCE_REGISTER_XREFS.txt").read_text(errors="replace")
          allx=(E/"11_USB_RESOURCE_ALL_XREFS.txt").read_text(errors="replace")
          feature=json.loads((E/"08_FEATURE_GATE_CLASSIFICATION.json").read_text())
          cfg=json.loads((E/"06_FLASHBOOT_CONFIG.json").read_text())

          state={
              "ResourceValue_returns_ModeResourceReady_mask":bool(re.search(
                  r'uint32_t\s+ResourceValue\s*\([^)]*\)\s*\{[^}]*return\s+ModeResourceReady\s*&\s*Resources\s*;',
                  mode,re.S
              )),
              "start_up_grate_requires_usb_resource_ready":bool(re.search(
                  r'ResourceValue\s*\(\s*AppResourceUsbDevice\s*\)\s*&&\s*\(\s*UpdateResource\s*==\s*AppResourceUsbDevice\s*\)',
                  up,re.S
              )),
              "usb_resource_register_xrefs":[x for x in reg.splitlines() if x.strip()],
              "usb_resource_all_xref_count":len([x for x in allx.splitlines() if x.strip()]),
              "otg_device_link_detector_seen":"OTG_PortDeviceIsLink" in (E/"09_USB_RESOURCE_CENSUS.txt").read_text(errors="replace"),
              "usb_device_state_bit_seen":"USB_DEVICE_STATE_BIT" in (E/"09_USB_RESOURCE_CENSUS.txt").read_text(errors="replace"),
              "usb_device_event_bit_seen":"USB_DEVICE_EVENT_BIT" in (E/"09_USB_RESOURCE_CENSUS.txt").read_text(errors="replace"),
              "public_sdk_flashboot_enabled":cfg["public_sdk_flashboot_enabled"],
              "public_sdk_pctool_enabled_in_UP_PORT":cfg["public_sdk_up_port_mentions_pctool_on"],
              "aa_sets_pc_upgrade":feature["aa_sets_pc_upgrade"],
              "aa55_ack_before_inner_flashboot_gate":feature["response_55_occurs_before_flashboot_compile_gate"],
          }

          state["usb_resource_register_call_count"]=len(state["usb_resource_register_xrefs"])
          state["usb_resource_ready_is_real_runtime_gate"]=(
              state["ResourceValue_returns_ModeResourceReady_mask"]
              and state["start_up_grate_requires_usb_resource_ready"]
          )
          state["reference_usb_link_to_resource_registration_chain_seen"]=(
              state["otg_device_link_detector_seen"]
              and state["usb_device_state_bit_seen"]
              and state["usb_device_event_bit_seen"]
              and state["usb_resource_register_call_count"] > 0
          )

          # Do not claim production behavior from public source alone.
          state["production_usb_resource_ready_during_AA55_proven"]=False
          state["production_FLASH_BOOT_EN_proven"]=False
          state["production_start_up_grate_executed_proven"]=False

          # High-value interpretation of prior observation:
          # AA->55 proves latch/GET branch progressed at least to response construction,
          # but it does not prove the later ResourceValue gate set PC/updata or jump occurred.
          state["aa55_ack_alone_proves_boot_jump"]=False
          state["aa55_nonreenumeration_has_resource_gate_explanation_candidate"]=(
              state["usb_resource_ready_is_real_runtime_gate"]
          )

          state["flash_allowed"]=False

          Path("/tmp/r67/evidence/12_R67_RESOURCE_GATE_DECISION.json").write_text(
              json.dumps(state,indent=2,ensure_ascii=False)+"\n"
          )
          print(json.dumps(state,indent=2,ensure_ascii=False))
          PY

      - name: Classify exact USB resource registration sources
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json,re

          S=Path("/tmp/r67/sdk")
          E=Path("/tmp/r67/evidence")

          x=(E/"10_USB_RESOURCE_REGISTER_XREFS.txt").read_text(errors="replace").splitlines()

          rows=[]
          for line in x:
              if not line.strip():
                  continue
              parts=line.split(":",2)
              path=parts[0] if parts else ""
              lineno=parts[1] if len(parts)>1 else ""
              code=parts[2].strip() if len(parts)>2 else line.strip()
              rows.append({
                  "path":path,
                  "line":lineno,
                  "code":code,
                  "operation":"register" if "ResourceRegister" in code else "deregister"
              })

          # Gather surrounding context directly from local clone.
          enriched=[]
          for r in rows:
              p=S/r["path"]
              if not p.exists():
                  enriched.append(r)
                  continue
              ls=p.read_text(errors="replace").splitlines()
              try:
                  n=int(r["line"])
              except Exception:
                  n=1
              a=max(0,n-9)
              z=min(len(ls),n+8)
              rr=dict(r)
              rr["context"]="\n".join(
                  f"{i+1}: {ls[i]}" for i in range(a,z)
              )
              enriched.append(rr)

          result={
              "usb_resource_mutation_sites":enriched,
              "register_count":sum(1 for r in enriched if r["operation"]=="register"),
              "deregister_count":sum(1 for r in enriched if r["operation"]=="deregister"),
          }

          (E/"13_USB_RESOURCE_MUTATION_SITES.json").write_text(
              json.dumps(result,indent=2,ensure_ascii=False)+"\n"
          )

          with (E/"14_USB_RESOURCE_MUTATION_CONTEXT.txt").open("w") as f:
              for r in enriched:
                  f.write(f"===== {r['operation']} {r['path']}:{r['line']} =====\n")
                  f.write(r.get("context","")+"\n\n")

          print(json.dumps(result,indent=2,ensure_ascii=False))
          PY

          cat /tmp/r67/evidence/14_USB_RESOURCE_MUTATION_CONTEXT.txt

      - name: Build R67 final engineering decision
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json

          E=Path("/tmp/r67/evidence")
          fp=json.loads((E/"02_R66_FALSE_POSITIVE_CLOSURE.json").read_text())
          rom=json.loads((E/"04_ROM_API_CLASSIFICATION.json").read_text())
          gate=json.loads((E/"12_R67_RESOURCE_GATE_DECISION.json").read_text())
          sites=json.loads((E/"13_USB_RESOURCE_MUTATION_SITES.json").read_text())

          final={
              "revision":"R67",
              "r66_false_positive_closed":fp["r66_bridge_candidate_is_parser_false_positive"],
              "userregister_is_retention_status_not_proven_request":True,
              "real_dualbank_request_api":"ROM_BankBUpgradeApply",
              "real_dualbank_reset_api":"ROM_SysReset",
              "public_sdk_flashboot_enabled":gate["public_sdk_flashboot_enabled"],
              "public_sdk_pctool_enabled":gate["public_sdk_pctool_enabled_in_UP_PORT"],
              "feature_aa55_ack_does_not_prove_jump":True,
              "start_up_grate_usb_resource_gate_proven":gate["usb_resource_ready_is_real_runtime_gate"],
              "usb_resource_register_sites":sites["register_count"],
              "usb_resource_deregister_sites":sites["deregister_count"],
              "production_usb_resource_ready_at_probe_time_proven":False,
              "production_start_up_grate_execution_proven":False,
              "first_flash_unlocked":False,
              "flash_allowed":False,
          }

          if sites["register_count"] > 0:
              final["next_target"]="PROVE_PRODUCTION_USB_RESOURCE_REGISTRATION_STATE_NON_DESTRUCTIVELY"
          else:
              final["next_target"]="EXPLAIN_MISSING_USB_RESOURCE_REGISTRATION_IN_REFERENCE_BUILD"

          (E/"15_R67_FINAL_DECISION.json").write_text(
              json.dumps(final,indent=2,ensure_ascii=False)+"\n"
          )

          lines=[
              "# R67 BP1048P4 USB resource boot-gate audit",
              "",
              "Confirmed:",
              f"- R66 bridge candidate was parser false positive: **{final['r66_false_positive_closed']}**",
              "- `ROM_UserRegister` is retention/status state; the documented request API is separate.",
              "- Real dual-bank request API: `ROM_BankBUpgradeApply(...)`.",
              "- ROM reset API: `ROM_SysReset()`.",
              f"- Public SDK `FLASH_BOOT_EN=1`: **{final['public_sdk_flashboot_enabled']}**",
              f"- Public SDK PC-tool path enabled: **{final['public_sdk_pctool_enabled']}**",
              "- Feature AA/55 ACK occurs before successful FlashBoot handoff can be inferred.",
              f"- `start_up_grate(AppResourceUsbDevice)` has a real ResourceValue gate: **{final['start_up_grate_usb_resource_gate_proven']}**",
              f"- USB resource register sites found: **{final['usb_resource_register_sites']}**",
              f"- USB resource deregister sites found: **{final['usb_resource_deregister_sites']}**",
              "",
              "Production conclusion:",
              "- Existing AA->55 observation does NOT prove `PC + updata` were set.",
              "- It also does NOT prove the jump to address zero occurred.",
              "- The next decisive question is whether `AppResourceUsbDevice` was registered on the production board during the probe.",
              "",
              "No live USB/Feature/reset/flash action was executed.",
              "FLASH_ALLOWED=NO",
          ]

          (E/"16_R67_FINAL_REPORT.md").write_text("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY

          cat /tmp/r67/evidence/16_R67_FINAL_REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Package R67 evidence
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/r67/evidence/* /tmp/r67/out/
          (cd /tmp/r67/out && sha256sum * > SHA256SUMS.txt)

      - name: Upload R67 evidence
        uses: actions/upload-artifact@v4
        with:
          name: R67_BP1048P4_USB_RESOURCE_BOOT_GATE_AUDIT
          path: /tmp/r67/out/*
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed assertion
        shell: bash
        run: |
          set -euo pipefail

          for v in LIVE_USB_ALLOWED FEATURE_REPORT_ALLOWED RUNTIME_0X11_ALLOWED FLASH_READ_ALLOWED FLASH_WRITE_ALLOWED FLASH_ERASE_ALLOWED FLASH_ALLOWED; do
            test "${!v}" = "NO"
          done

          grep -q '"r66_false_positive_closed": true' /tmp/r67/evidence/15_R67_FINAL_DECISION.json
          grep -q '"start_up_grate_usb_resource_gate_proven": true' /tmp/r67/evidence/15_R67_FINAL_DECISION.json
          grep -q '"flash_allowed": false' /tmp/r67/evidence/15_R67_FINAL_DECISION.json

          echo "R67_USB_RESOURCE_BOOT_GATE_AUDIT=PASS"
          echo "FLASH_ALLOWED=NO"
