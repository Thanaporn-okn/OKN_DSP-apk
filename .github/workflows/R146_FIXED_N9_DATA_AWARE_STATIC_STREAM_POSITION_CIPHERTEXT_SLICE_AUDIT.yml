name: R146 FIXED N9 data-aware static stream position ciphertext slice audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R146_FIXED_N9_DATA_AWARE_STATIC_STREAM_POSITION_CIPHERTEXT_SLICE_AUDIT.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r146-fixed-n9-data-aware-static-${{ github.ref }}
  cancel-in-progress: true

env:
  FLASH_ALLOWED: "NO"
  R145_RUN_ID: "36004169630"
  R145_JOB_ID: "107647946960"
  R145_ARTIFACT_ID: "10810086100"
  R145_ARTIFACT_NAME: "R145-EXACT-OFFICIAL-WINDOWS-KEYIV-VALIDATION-FRAMING-STATIC-EVIDENCE"
  R145_ARTIFACT_DIGEST: "sha256:0e19fc3735d6bd5fec14b7086b3f6c94c35c39594ebacadb2652e1caf9e55567"
  H15_RESOURCE_NAME: "h15IL2i6yy2BZV8RqM.YuRwd1JALC4oy32W66"

jobs:
  static_trace:
    name: STATIC ONLY - fixed N9 state-slice stream trace - no execution - no USB - no board
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r146f/r145 /tmp/r146f/evidence
          cat > /tmp/r146f/evidence/R146_FIXED_SAFETY.txt <<'EOF'
          R146_FIXED_MODE=OFFLINE_STATIC_N9_DATA_AWARE_STREAM_TRACE_ONLY
          R146_FIXED_VENDOR_BINARY_EXECUTED=NO
          R146_FIXED_WINDOWS_EXE_EXECUTED=NO
          R146_FIXED_DLL_EXECUTED=NO
          R146_FIXED_APK_EXECUTED=NO
          R146_FIXED_USB_DEVICE_ACCESS=NO
          R146_FIXED_BOARD_CONTACT=NO
          R146_FIXED_AA55_SENT=NO
          R146_FIXED_LINEIN_AA55_SENT=NO
          R146_FIXED_RUNTIME_0X11_SENT=NO
          R146_FIXED_RUNTIME_0XFE_SENT=NO
          R146_FIXED_FLASHBOOT_COMMAND_SENT=NO
          R146_FIXED_FLASH_READ_EXECUTED=NO
          R146_FIXED_FLASH_ERASE_EXECUTED=NO
          R146_FIXED_FLASH_WRITE_EXECUTED=NO
          R146_FIXED_ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD=NO
          R146_FIXED_REFERENCE_EVIDENCE_IS_NOT_PRODUCTION_PROOF=YES
          HARDWARE_MODIFICATION=FORBIDDEN
          FLASH_ALLOWED=NO
          EOF

      - name: Download pinned R145 evidence
        uses: actions/download-artifact@v4
        with:
          name: R145-EXACT-OFFICIAL-WINDOWS-KEYIV-VALIDATION-FRAMING-STATIC-EVIDENCE
          path: /tmp/r146f/r145
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 36004169630

      - name: Verify and extract pinned R145 evidence
        shell: bash
        run: |
          set -euo pipefail
          OUTER="$(find /tmp/r146f/r145 -maxdepth 2 -type f -name 'R145_EXACT_OFFICIAL_WINDOWS_KEYIV_VALIDATION_FRAMING_STATIC_EVIDENCE.zip' -print -quit)"
          test -n "$OUTER"
          sha256sum "$OUTER" > /tmp/r146f/evidence/R146_FIXED_R145_INNER_ZIP.sha256
          unzip -q "$OUTER" -d /tmp/r146f/evidence/r145
          test -s /tmp/r146f/evidence/r145/R145_DECISION.json
          test -s /tmp/r146f/evidence/r145/r144/R144_PE32_CONCRETE_KEYIV_PATH.json
          test -s /tmp/r146f/evidence/r145/r144/r143/R143_N9_METHOD.il
          test -s /tmp/r146f/evidence/r145/r144/r143/r142/r141/r140/R140_FIXED_FULL.il
          test -s /tmp/r146f/evidence/r145/r144/r143/r142/R142_EXTRACTED_MANAGED_RESOURCES/02_h15IL2i6yy2BZV8RqM.YuRwd1JALC4oy32W66.bin
          grep -F '"R144_VALIDATOR_FALSE_NEGATIVE_CONFIRMED": true' /tmp/r146f/evidence/r145/R145_DECISION.json
          grep -F '"PE32_CREATEDECRYPTOR_KEYIV_STATICALLY_RECOVERED": true' /tmp/r146f/evidence/r145/R145_DECISION.json
          grep -F '"H15_PLAINTEXT_RECOVERED": false' /tmp/r146f/evidence/r145/R145_DECISION.json
          grep -F '"FLASH_ALLOWED": false' /tmp/r146f/evidence/r145/R145_DECISION.json

      - name: Prove BinaryReader and CryptoStream wrapper semantics from exact method bodies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          ev=Path('/tmp/r146f/evidence')
          full=(ev/'r145/r144/r143/r142/r141/r140/R140_FIXED_FULL.il').read_text(errors='replace')

          def body_top(name):
              marker=f'}} // end of method q71r2Rj8SiD9GF1BI50::{name}'
              end=full.find(marker)
              if end < 0:
                  return ''
              start=full.rfind('\n\t.method ',0,end)
              if start < 0:
                  start=full.rfind('\n\t\t.method ',0,end)
              return full[start:end+len(marker)] if start >= 0 else ''

          def body_nested(name):
              marker=f'}} // end of method Y7Uor8e58M9K22QZF7H::{name}'
              end=full.find(marker)
              if end < 0:
                  return ''
              start=full.rfind('\n\t\t.method ',0,end)
              return full[start:end+len(marker)] if start >= 0 else ''

          ctor=body_nested('.ctor')
          readbytes=body_nested('FtHelxtJIP')
          readint=body_nested('sXXetjyGMH')
          sw=body_top('sWg0PuN2fLSfxi2LB0D')
          qf=body_top('qfkv4ZNDynVciIciQy6')
          wr=body_top('RMHoOvNN1BGBrZfKGy1')
          ff=body_top('it3eekNKjtbEQVI5up2')
          ta=body_top('HVJrNANRJZcM7WNOuLw')
          dec=body_top('VnHlfpNorSGR6U9GUOp')

          facts={
            'custom_reader_ctor_uses_BinaryReader': 'System.IO.BinaryReader::.ctor(class [mscorlib]System.IO.Stream)' in ctor,
            'FtHelxtJIP_is_ReadBytes': 'System.IO.BinaryReader::ReadBytes(int32)' in readbytes,
            'sXXetjyGMH_is_ReadInt32': 'System.IO.BinaryReader::ReadInt32()' in readint,
            'sW_wrapper_reaches_FtHelxtJIP': 'Y7Uor8e58M9K22QZF7H::FtHelxtJIP(int32)' in sw,
            'qf_wrapper_reaches_sXXetjyGMH': 'Y7Uor8e58M9K22QZF7H::sXXetjyGMH()' in qf,
            'crypto_write_is_Stream_Write': 'System.IO.Stream::Write(uint8[], int32, int32)' in wr,
            'crypto_finalize_is_FlushFinalBlock': 'System.Security.Cryptography.CryptoStream::FlushFinalBlock()' in ff,
            'crypto_output_is_MemoryStream_ToArray': 'System.IO.MemoryStream::ToArray()' in ta,
            'create_decryptor_wrapper_exact': 'SymmetricAlgorithm::CreateDecryptor(uint8[], uint8[])' in dec,
          }
          required=list(facts)
          out={
            'validator_method':'exact method-body extraction by end-of-method marker; no whole-file order-sensitive regex',
            'facts':facts,
            'all_required_facts':all(facts[k] for k in required),
          }
          (ev/'R146_FIXED_WRAPPER_PROOF.json').write_text(json.dumps(out,indent=2)+'\n')
          if not out['all_required_facts']:
              raise SystemExit('required wrapper semantics not proven from exact method bodies')
          PY

      - name: Data-aware static execution over pinned R144 concrete N9 path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re,hashlib

          ev=Path('/tmp/r146f/evidence')
          n9=(ev/'r145/r144/r143/R143_N9_METHOD.il').read_text(errors='replace')
          r144=json.loads((ev/'r145/r144/R144_PE32_CONCRETE_KEYIV_PATH.json').read_text())
          h15=(ev/'r145/r144/r143/r142/R142_EXTRACTED_MANAGED_RESOURCES/02_h15IL2i6yy2BZV8RqM.YuRwd1JALC4oy32W66.bin').read_bytes()
          labels=r144.get('path_labels') or []
          states=r144.get('path_states') or []
          if not labels or len(labels)!=len(states) or len(labels)!=473:
              raise SystemExit('pinned R144 concrete path missing/inconsistent')

          # Parse every IL instruction. R146 original incorrectly treated each IL
          # label as a whole state block. Here each pinned state entry is expanded
          # linearly until the state returns to the flattened dispatcher.
          ins=[]
          for m in re.finditer(r'(?m)^\s*(IL_[0-9a-fA-F]{4}):\s*(.*)$',n9):
              ins.append((m.group(1),m.group(2).strip()))
          index={lab:i for i,(lab,_) in enumerate(ins)}

          def state_slice(entry):
              i=index[entry]
              out=[]
              for j in range(i,min(i+160,len(ins))):
                  lab,op=ins[j]
                  out.append((lab,op))
                  # Unconditional return to either dispatcher form.
                  if re.fullmatch(r'br(?:\.s)?\s+IL_00(?:0e|12)',op):
                      break
              return out

          slices=[]
          for step,(state,label) in enumerate(zip(states,labels)):
              seq=state_slice(label)
              slices.append({'step':step,'state':state,'entry':label,'instructions':seq})

          def text_of(s):
              return '\n'.join(f'{a}: {b}' for a,b in s['instructions'])

          # Exact h15 reader sequence proven on the pinned path.
          s21=text_of(slices[21]); s22=text_of(slices[22]); s23=text_of(slices[23])
          h15_reader_create=(
              states[21]==367 and
              f'ldstr "{__import__("os").environ["H15_RESOURCE_NAME"]}"' in s21 and
              '::gH6uphNOsYQyRXDZmHu(object, object)' in s21 and
              'Y7Uor8e58M9K22QZF7H::.ctor(class [mscorlib]System.IO.Stream)' in s21 and
              'stloc.s 114' in s21)
          h15_seek_zero=(
              states[22]==111 and 'ldloc.s 114' in s22 and 'ldc.i4.0' in s22 and
              '::uKbcISNmDSreine16Qp(object, int64)' in s22)
          h15_read_all=(
              states[23]==211 and 'ldloc.s 114' in s23 and
              '::B5fr4WNvBYuVpLZQQQQ(object)' in s23 and 'conv.i4' in s23 and
              '::sWg0PuN2fLSfxi2LB0D(object, int32)' in s23 and 'stloc.s 12' in s23)

          # Exact metadata reader sequence immediately before CreateDecryptor.
          s455=text_of(slices[455]); s456=text_of(slices[456])
          metadata_reader_from_local29=(
              states[455]==94 and 'ldloc.s 29' in s455 and
              'System.IO.MemoryStream::.ctor(uint8[])' in s455 and
              'Y7Uor8e58M9K22QZF7H::.ctor(class [mscorlib]System.IO.Stream)' in s455 and
              'stloc.s 114' in s455)
          metadata_seek_zero=(states[456]==52 and '::uKbcISNmDSreine16Qp(object, int64)' in s456 and 'ldc.i4.0' in s456)

          readint_steps=[]
          for step in range(457,472):
              txt=text_of(slices[step])
              if '::qfkv4ZNDynVciIciQy6(object)' in txt:
                  readint_steps.append(step)
          exact_six_int32=(readint_steps==[465,466,467,468,469,470])
          metadata_position_at_decryptor=24 if metadata_reader_from_local29 and metadata_seek_zero and exact_six_int32 else None

          s469=text_of(slices[469]); s470=text_of(slices[470]); s471=text_of(slices[471]); s472=text_of(slices[472])
          metadata_field5_to_local71=('stloc.s 71' in s469)
          metadata_field6_to_local28=('stloc.s 28' in s470)
          sixth_field_compared_to_4=('ldloc.s 28' in s471 and 'ldc.i4.4' in s471 and 'bne.un' in s471)
          create_decryptor_exact=(
              states[472]==402 and
              'ldloc.s 47' in s472 and 'ldloc.s 8' in s472 and
              '::VnHlfpNorSGR6U9GUOp(object, object, object)' in s472 and 'stloc.s 78' in s472)

          # Proven aliases/dataflow around local29. We deliberately do not infer
          # bytes that are not materialized by prior static evidence.
          local29_alias_step=None
          for s in slices:
              txt=text_of(s)
              if 'ldloc.s 37' in txt and 'stloc.s 29' in txt:
                  local29_alias_step={'step':s['step'],'state':s['state'],'entry':s['entry']}
                  break
          local37_alloc_step=None
          for s in slices:
              txt=text_of(s)
              if 'ldloc.s 27' in txt and 'ldlen' in txt and 'newarr [mscorlib]System.Byte' in txt and 'stloc.s 37' in txt:
                  local37_alloc_step={'step':s['step'],'state':s['state'],'entry':s['entry']}
                  break

          # Locate CryptoStream.Write wrapper callsites in full N9 for the next
          # dataflow stage. No callsite is assumed to consume h15 directly.
          write_calls=[]
          for lab,op in ins:
              if '::RMHoOvNN1BGBrZfKGy1(object, object, int32, int32)' in op:
                  i=index[lab]
                  pre=ins[max(0,i-8):i+1]
                  write_calls.append({'call_label':lab,'context':pre})

          all_core=all([
              h15_reader_create,h15_seek_zero,h15_read_all,
              metadata_reader_from_local29,metadata_seek_zero,exact_six_int32,
              metadata_field5_to_local71,metadata_field6_to_local28,
              sixth_field_compared_to_4,create_decryptor_exact,
              local29_alias_step is not None,local37_alloc_step is not None,
          ])
          if not all_core:
              raise SystemExit('pinned-path core stream semantics did not validate')

          out={
            'source':'R144 pinned concrete PE32 N9 path; R145 pinned static evidence',
            'path_state_count':len(states),
            'state_slicing_fix':'expand each pinned state entry through sequential IL until unconditional branch to IL_000e/IL_0012',
            'h15_length':len(h15),
            'h15_sha256':hashlib.sha256(h15).hexdigest(),
            'h15_reader_create_proven':h15_reader_create,
            'h15_reader_seek_zero_proven':h15_seek_zero,
            'h15_ReadBytes_count_is_resource_stream_length':h15_read_all,
            'h15_exact_bytes_consumed_by_first_reader':len(h15),
            'h15_first_reader_final_position':len(h15),
            'h15_first_reader_output_local':12,
            'metadata_reader_source_local':29,
            'metadata_reader_from_local29_proven':metadata_reader_from_local29,
            'metadata_reader_seek_zero_proven':metadata_seek_zero,
            'metadata_ReadInt32_steps':readint_steps,
            'metadata_six_consecutive_ReadInt32_proven':exact_six_int32,
            'metadata_position_at_CreateDecryptor':metadata_position_at_decryptor,
            'metadata_field5_stored_local71':metadata_field5_to_local71,
            'metadata_field6_stored_local28':metadata_field6_to_local28,
            'metadata_field6_compared_to_literal_4':sixth_field_compared_to_4,
            'local37_allocation_step':local37_alloc_step,
            'local29_alias_from_local37_step':local29_alias_step,
            'CreateDecryptor_state':402,
            'CreateDecryptor_uses_key_local47_iv_local8':create_decryptor_exact,
            'CryptoStream_Write_callsites':write_calls,
            'PROVEN_EXACT_CIPHERTEXT_SLICE':None,
            'PROVEN_CIPHERTEXT_BLOCK_ALIGNED':False,
            'DIRECT_AES_CBC_DECRYPTION_AUTHORIZED_BY_R146_FIXED_STATIC_TRACE':False,
            'H15_PLAINTEXT_RECOVERED':False,
            'important_interpretation':(
              'R146 FIXED proves exact stream consumption for the initial h15 reader and a 24-byte '
              'metadata-reader prefix before CreateDecryptor. It does not yet prove which bytes are '
              'later written to CryptoStream, so no ciphertext slice or AES padding/framing is guessed.'),
          }
          (ev/'R146_FIXED_N9_DATA_AWARE_STREAM_TRACE.json').write_text(json.dumps(out,indent=2)+'\n')
          PY

      - name: Build fail-closed R146 FIXED decision and report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          ev=Path('/tmp/r146f/evidence')
          t=json.loads((ev/'R146_FIXED_N9_DATA_AWARE_STREAM_TRACE.json').read_text())
          decision={
            'R146_ORIGINAL_RUN_ID':36008876669,
            'R146_ORIGINAL_FAILURE_CLASS':'validator/state-slicing tooling failure; not a reverse-engineering negative result',
            'R145_RUN_ID':36004169630,
            'R145_ARTIFACT_ID':10810086100,
            'R145_ARTIFACT_DIGEST':'sha256:0e19fc3735d6bd5fec14b7086b3f6c94c35c39594ebacadb2652e1caf9e55567',
            'N9_CONCRETE_PE32_PATH_REUSED':True,
            'N9_PATH_STATE_COUNT':t['path_state_count'],
            'H15_EXACT_FIRST_READER_BYTES_CONSUMED':t['h15_exact_bytes_consumed_by_first_reader'],
            'H15_FIRST_READER_OUTPUT_LOCAL':t['h15_first_reader_output_local'],
            'METADATA_READER_SOURCE_LOCAL':t['metadata_reader_source_local'],
            'METADATA_SIX_READINT32_PROVEN':t['metadata_six_consecutive_ReadInt32_proven'],
            'METADATA_POSITION_AT_CREATEDECRYPTOR':t['metadata_position_at_CreateDecryptor'],
            'METADATA_FIELD6_COMPARED_TO_4':t['metadata_field6_compared_to_literal_4'],
            'CREATEDECRYPTOR_USES_KEY_LOCAL47_IV_LOCAL8':t['CreateDecryptor_uses_key_local47_iv_local8'],
            'PROVEN_EXACT_CIPHERTEXT_SLICE':None,
            'PROVEN_CIPHERTEXT_BLOCK_ALIGNED':False,
            'DIRECT_AES_CBC_DECRYPTION_AUTHORIZED_BY_STATIC_FRAMING':False,
            'H15_PLAINTEXT_RECOVERED':False,
            'ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD':False,
            'AA55_LIVE_RETEST_ALLOWED':False,
            'RUNTIME_0X11_ALLOWED':False,
            'RUNTIME_0XFE_ALLOWED':False,
            'FLASH_ALLOWED':False,
            'NEXT':(
              'Continue static dataflow from initial h15 ReadBytes output local12 through locals feeding '
              'local27/local37/local29 and then from the post-CreateDecryptor states to the exact whole-array '
              'buffer passed to RMHoOvNN1BGBrZfKGy1/Stream.Write. Prove source offset and length before any offline decrypt.'),
          }
          (ev/'R146_FIXED_DECISION.json').write_text(json.dumps(decision,indent=2)+'\n')
          (ev/'R146_FIXED_REPORT_TH.md').write_text(
            '# R146 FIXED N9 data-aware static stream trace\n\n'
            f'- R146 เดิมล้มเพราะ tooling validator/state slicing: ใช่\n'
            f'- path states: {decision["N9_PATH_STATE_COUNT"]}\n'
            f'- h15 reader แรกอ่านครบ: {decision["H15_EXACT_FIRST_READER_BYTES_CONSUMED"]} bytes -> local12\n'
            f'- metadata reader ก่อน CreateDecryptor: 6 x ReadInt32 = {decision["METADATA_POSITION_AT_CREATEDECRYPTOR"]} bytes\n'
            f'- field ที่ 6 ถูกเทียบกับค่า 4: {decision["METADATA_FIELD6_COMPARED_TO_4"]}\n'
            f'- CreateDecryptor ใช้ key local47 / IV local8: {decision["CREATEDECRYPTOR_USES_KEY_LOCAL47_IV_LOCAL8"]}\n'
            '- exact ciphertext slice proven: False\n'
            '- H15 plaintext recovered: False\n'
            '- live/board authorization: False\n\n'
            f'NEXT: {decision["NEXT"]}\n\n'
            'FLASH_ALLOWED=NO\n')
          print(json.dumps(decision,indent=2))
          PY

      - name: Package R146 FIXED evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r146f/evidence
          zip -9 -r /tmp/R146_FIXED_N9_DATA_AWARE_STATIC_STREAM_POSITION_CIPHERTEXT_SLICE_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/R146_FIXED_N9_DATA_AWARE_STATIC_STREAM_POSITION_CIPHERTEXT_SLICE_EVIDENCE.zip \
            > /tmp/R146_FIXED_N9_DATA_AWARE_STATIC_STREAM_POSITION_CIPHERTEXT_SLICE_EVIDENCE.zip.sha256

      - name: Upload R146 FIXED evidence
        uses: actions/upload-artifact@v4
        with:
          name: R146-FIXED-N9-DATA-AWARE-STATIC-STREAM-POSITION-CIPHERTEXT-SLICE-EVIDENCE
          path: |
            /tmp/R146_FIXED_N9_DATA_AWARE_STATIC_STREAM_POSITION_CIPHERTEXT_SLICE_EVIDENCE.zip
            /tmp/R146_FIXED_N9_DATA_AWARE_STATIC_STREAM_POSITION_CIPHERTEXT_SLICE_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'R146_FIXED_VENDOR_BINARY_EXECUTED=NO' /tmp/r146f/evidence/R146_FIXED_SAFETY.txt
          grep -F 'R146_FIXED_USB_DEVICE_ACCESS=NO' /tmp/r146f/evidence/R146_FIXED_SAFETY.txt
          grep -F 'R146_FIXED_BOARD_CONTACT=NO' /tmp/r146f/evidence/R146_FIXED_SAFETY.txt
          grep -F 'R146_FIXED_AA55_SENT=NO' /tmp/r146f/evidence/R146_FIXED_SAFETY.txt
          grep -F 'R146_FIXED_RUNTIME_0X11_SENT=NO' /tmp/r146f/evidence/R146_FIXED_SAFETY.txt
          grep -F 'R146_FIXED_RUNTIME_0XFE_SENT=NO' /tmp/r146f/evidence/R146_FIXED_SAFETY.txt
          grep -F '"H15_PLAINTEXT_RECOVERED": false' /tmp/r146f/evidence/R146_FIXED_DECISION.json
          grep -F '"ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD": false' /tmp/r146f/evidence/R146_FIXED_DECISION.json
          grep -F '"FLASH_ALLOWED": false' /tmp/r146f/evidence/R146_FIXED_DECISION.json
          echo R146_FIXED_N9_DATA_AWARE_STATIC_TRACE_COMPLETE=YES
          echo FLASH_ALLOWED=NO
