name: R166 N9 local37 word producers static audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R166_N9_LOCAL37_WORD_PRODUCERS_STATIC_AUDIT.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: r166-static-${{ github.ref }}
  cancel-in-progress: true
env:
  FLASH_ALLOWED: "NO"
jobs:
  static_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          mkdir -p /tmp/r166/evidence
          cat > /tmp/r166/evidence/R166_SAFETY.txt <<'EOF'
          MODE=OFFLINE_STATIC_IL_TEXT_ONLY
          FLASH_ALLOWED=NO
          USB_OR_BOARD_CONTACT=NO
          VENDOR_EXE_DLL_APK_EXECUTED=NO
          OFFLINE_DECRYPT_EXECUTED=NO
          AA55_OR_LINEIN_AA55_SENT=NO
          RUNTIME_0X11_OR_0XFE_SENT=NO
          FLASH_READ_ERASE_WRITE_EXECUTED=NO
          ONE_BYTE_REPAIR_GUESS_ALLOWED=NO
          DISCOVERED_FRAME_LIVE_AUTHORIZED=NO
          HARDWARE_MODIFICATION=FORBIDDEN
          EOF
      - name: Download pinned R165 result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10828530133'
          path: /tmp/r166/r165
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 36045259234
      - name: Download pinned R157 raw evidence chain
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10820682068'
          path: /tmp/r166/r157
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 36028455796
      - name: Verify exact local dispatcher path without execution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib,json,re

          def audit(raw,full_raw,prior,out):
              assert prior['revision']=='R165'
              assert prior['FLASH_ALLOWED'] is False and prior['OFFLINE_DECRYPT_AUTHORIZED'] is False
              assert prior['UNACCOUNTED_CONDITIONAL_COUNT_AFTER_R165']==3
              assert hashlib.sha256(raw).hexdigest()==prior['N9_SHA256']
              assert hashlib.sha256(full_raw).hexdigest()=='aa1d369c8be7ee8d7b358fc5b0f6b0874f46711a9249fee70f413b900d234c66'
              s=raw.decode();assert s in full_raw.decode()
              rows=[]
              for line in s.splitlines():
                  m=re.match(r'\s*(IL_[0-9a-f]+):\s+(\S+)(?:\s+(.*))?$',line)
                  if m:rows.append((m[1],m[2],(m[3] or '').split(' //',1)[0].strip()))
              pos={x[0]:i for i,x in enumerate(rows)}
              def region(a,b):return rows[pos[a]:pos[b]+1]
              def expect(a,b,expected):
                  r=region(a,b);assert [x[1:] for x in r]==expected,(a,r)
                  return r
              facts={}
              facts['word_xor']=expect('IL_1172','IL_1177',[('ldloc.s','105'),('ldloc.s','82'),('xor',''),('stloc.s','24')])
              facts['remainder_xor']=expect('IL_1c97','IL_1c9c',[('ldloc.s','105'),('ldloc.s','82'),('xor',''),('stloc.s','22')])
              facts['output_index']=expect('IL_1940','IL_1944',[('ldloc.s','38'),('ldc.i4.4',''),('mul',''),('stloc.s','67')])
              facts['input_alias']=expect('IL_0fa8','IL_0faa',[('ldloc.s','12'),('stloc.s','27')])
              # Verify the four input byte assembly expression. Do not supply real bytes.
              expected=[]
              for k in [3,2,1,0]:
                  expected += [('ldloc.s','27'),('ldloc.s','76')]
                  if k:expected += [('ldc.i4.'+str(k),''),('add','')]
                  expected += [('ldelem.u1','')]
                  if k:expected += [('ldc.i4.8','') if k==1 else ('ldc.i4.s',str(8*k)),('shl','')]
                  if k<3:expected += [('or','')]
              expected += [('stloc.s','82')]
              facts['input_word']=expect('IL_61af','IL_61d4',expected)
              expected_stores={
                  24:['IL_1177'],22:['IL_1c9c'],27:['IL_0faa'],67:['IL_1944'],
                  76:['IL_21e0','IL_5444','IL_55e3'],
                  82:['IL_37c3','IL_3dd8','IL_53c1','IL_5a87','IL_61d4'],
                  105:['IL_2620','IL_47f6','IL_488e','IL_5d20','IL_611c']}
              inventory={}
              for local,expected_labels in expected_stores.items():
                  actual=[x[0] for x in rows if x[1] in ('stloc','stloc.s') and x[2]==str(local)]
                  assert actual==expected_labels,(local,actual)
                  assert not any(x[1] in ('ldloca','ldloca.s') and x[2]==str(local) for x in rows)
                  inventory[str(local)]=[rows[max(0,pos[label]-12):pos[label]+5] for label in actual]
              facts['input_index_alias']=expect('IL_5442','IL_5444',[('ldloc.s','67'),('stloc.s','76')])
              result={
                  'revision':'R166','R165_RUN_ID':36045259234,'R165_JOB_ID':107787122080,'R165_ARTIFACT_ID':10828530133,
                  'N9_SHA256':hashlib.sha256(raw).hexdigest(),
                  'STATIC_ASSIGNMENT_EQUATIONS':{
                      'IL_1177':'local24 = local105 XOR local82',
                      'IL_1c9c':'local22 = local105 XOR local82',
                      'IL_1944':'local67 = local38 * 4 (IL int32 arithmetic)',
                      'IL_0faa':'local27 = local12 (reference alias)',
                      'IL_61d4':'local82 = little-endian 32-bit word at local27[local76:local76+4]',
                      'IL_5444':'local76 = local67'},
                  'STORE_SITE_COUNTS':{str(k):len(v) for k,v in expected_stores.items()},
                  'LOCAL105_HAS_MULTIPLE_WRITES':True,
                  'LOCAL82_HAS_MULTIPLE_WRITES':True,
                  'STATIC_RELATIONS_DO_NOT_PROVE_RUNTIME_ORDER':True,
                  'CONDITIONAL_OFFSET20_DEPENDENCY':'If the four-byte write at local67=20 reaches the later reader without overwrite, and input-word assembly/alias sites are on that path, its word depends on local105 XOR the source word. Each path, index and reaching definition must still be proven.',
                  'OFFSET20_SOURCE_VALUE_COMPUTED':False,
                  'LOCAL37_FULL_RECONSTRUCTION_EXECUTED':False,
                  'RAW_H15_EQUALS_LOCAL29_PROVEN':False,
                  'LOCAL29_BYTES_AT_STATE94_PROVEN':False,
                  'UNACCOUNTED_CONDITIONAL_COUNT_AFTER_R166':3,
                  'remaining_unaccounted_conditionals':prior['remaining_unaccounted_conditionals'],
                  'INDEPENDENT_FULL_PATH_BRANCH_COVERAGE_PROVEN':False,
                  'OFFLINE_DECRYPT_AUTHORIZED':False,'H15_PLAINTEXT_RECOVERED':False,
                  'ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD':False,'FLASH_ALLOWED':False,
                  'NEXT':'Prove reaching definitions and intervening writes along the copy-route to state94, using prior loop evidence. These local equations alone do not resolve state292 or permit offline decryption.'}
              out.mkdir(parents=True,exist_ok=True)
              (out/'R166_DECISION.json').write_text(json.dumps(result,indent=2)+'\n')
              (out/'R166_SYMBOLIC_PRODUCER_EVIDENCE.json').write_text(json.dumps({'exact_relations':facts,'all_store_contexts':inventory},indent=2)+'\n')
              print(json.dumps(result,indent=2))

          import io,zipfile
          base=Path('/tmp/r166')
          def inner(folder,name,expected):
              data=(base/folder/name).read_bytes()
              assert hashlib.sha256(data).hexdigest()==expected, 'pinned inner digest mismatch'
              assert (base/folder/(name+'.sha256')).read_text().split()[0]==expected
              return zipfile.ZipFile(io.BytesIO(data))
          prior=inner('r165','R165_N9_EXCEPTION_SCOPE_LOCAL37_PROVENANCE_EVIDENCE.zip','0113183f9c19c58c93f41ea1b35f0de9f209323cfd716914d617056fb0ddca8b')
          decision=json.loads(prior.read('R165_DECISION.json'))
          chain=inner('r157','R157_N9_LOCAL29_LOCAL81_NONNULL_LOCAL93_LOOP_BRANCH_EVIDENCE.zip','f974c64c63eea5f2b940c76101f4ab6e769803f5630a2d87d21d08679c321609')
          prefix='r156/r155/r154/r153/r152/r151/r150/r149/r148/r147/r146/r145/r144/r143/'
          n9=chain.read(prefix+'R143_N9_METHOD.il')
          full=chain.read(prefix+'r142/r141/r140/R140_FIXED_FULL.il')
          assert hashlib.sha256(n9).hexdigest()=='5a3964c1f4bd8db455e6882a4ce6f90667e1a9abc6e1fafd10440b31006e4a33'
          audit(n9,full,decision,base/'evidence')
          (base/'evidence/R165_DECISION.json').write_bytes(prior.read('R165_DECISION.json'))
          result=json.loads((base/'evidence/R166_DECISION.json').read_text())
          assert result['FLASH_ALLOWED'] is False and result['OFFLINE_DECRYPT_AUTHORIZED'] is False
          assert result['UNACCOUNTED_CONDITIONAL_COUNT_AFTER_R166']==3
          PYCODE
      - name: Package evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r166/evidence
          zip -9 -r /tmp/R166_N9_LOCAL37_WORD_PRODUCERS_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/R166_N9_LOCAL37_WORD_PRODUCERS_EVIDENCE.zip > /tmp/R166_N9_LOCAL37_WORD_PRODUCERS_EVIDENCE.zip.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: R166-N9-LOCAL37-WORD-PRODUCERS-STATIC-EVIDENCE
          path: |
            /tmp/R166_N9_LOCAL37_WORD_PRODUCERS_EVIDENCE.zip
            /tmp/R166_N9_LOCAL37_WORD_PRODUCERS_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90
