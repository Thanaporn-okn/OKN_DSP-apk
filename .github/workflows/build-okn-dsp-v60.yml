name: Build OKN DSP V60 V59 RAM Dirty Import Recovery

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_ANDROID_V60_V59_RAM_DIRTY_IMPORT_RECOVERY.zip'
      - '.github/workflows/build-okn-dsp-v60.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify V60 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/okn_v60
          mkdir -p /tmp/okn_v60
          unzip -q OKN_DSP_ANDROID_V60_V59_RAM_DIRTY_IMPORT_RECOVERY.zip -d /tmp/okn_v60

          check_file() { test -f "$1" || { echo "ERROR missing $1"; exit 1; }; echo "OK file: $1"; }
          check_text() { grep -Fq "$1" "$2" || { echo "ERROR missing marker '$1' in $2"; exit 1; }; echo "OK marker: $1"; }

          SCALAR=/tmp/okn_v60/app/src/main/java/com/okn/dsp/ScalarControlActivity.kt
          LIVE=/tmp/okn_v60/app/src/main/java/com/okn/dsp/LiveEqActivity.kt
          POLICY=/tmp/okn_v60/app/src/main/java/com/okn/dsp/protocol/SaveParamsPolicy.kt
          SCALARPOL=/tmp/okn_v60/app/src/main/java/com/okn/dsp/protocol/VerifiedScalarControls.kt
          GATE=/tmp/okn_v60/app/src/main/java/com/okn/dsp/protocol/WriteGate.kt
          MAIN=/tmp/okn_v60/app/src/main/java/com/okn/dsp/MainActivity.kt
          GRADLE=/tmp/okn_v60/app/build.gradle.kts

          check_file "$SCALAR"
          check_file "$LIVE"
          check_file "$POLICY"
          check_file "$SCALARPOL"
          check_file "$GATE"
          check_file "$MAIN"
          check_file "$GRADLE"
          check_file /tmp/okn_v60/README_V60.txt
          check_file /tmp/okn_v60/evidence/OKN_DSP_V60_V59_RAM_DIRTY_IMPORT_RECOVERY_PLAN.txt
          check_file /tmp/okn_v60/evidence/OKN_DSP_V60_V59_RAM_DIRTY_IMPORT_RECOVERY_PLAN.json
          check_file /tmp/okn_v60/evidence/OKN_DSP_V45_LIVE_SCALAR_SUCCESS_CAPTURE.txt
          check_file /tmp/okn_v60/evidence/OKN_DSP_V57_SAVEPARAMS_PERSISTENCE_COMPLETE_CAPTURE.txt
          check_file /tmp/okn_v60/evidence/OKN_DSP_V58_LIVE_EQ_PERMANENT_SAVE_SUCCESS_CAPTURE.txt

          check_text 'versionCode = 60' "$GRADLE"
          check_text '4.2.0-v60-v59-ram-dirty-import-recovery' "$GRADLE"
          check_text 'verifiedScalarControlsEnabled: Boolean = true' "$GATE"
          check_text 'verifiedScalarPersistentSaveEnabled: Boolean = true' "$GATE"
          check_text 'liveEqEditorEnabled: Boolean = true' "$GATE"
          check_text 'liveEqPersistentSaveEnabled: Boolean = true' "$GATE"
          check_text 'const val enabled: Boolean = false' "$GATE"

          # SaveParams stays exactly the V57-proven trigger and is centralized.
          check_text 'const val ACTUATOR_ID = 7' "$POLICY"
          check_text 'UfeCodec.encodeWrite(ACTUATOR_ID, 0, byteArrayOf())' "$POLICY"
          check_text '570000000700000000' "$POLICY"

          # Six verified scalar controls only.
          for marker in \
            'VerifiedScalarControl(2, "MasterVolume"' \
            'VerifiedScalarControl(8, "BassVolume"' \
            'VerifiedScalarControl(9, "BassCutoff"' \
            'VerifiedScalarControl(10, "BassBoost"' \
            'VerifiedScalarControl(13, "MiddleBoost"' \
            'VerifiedScalarControl(11, "TrebleBoost"'; do
            check_text "$marker" "$SCALARPOL"
          done

          # Scalar APPLY is write -> descriptor verify -> RAM_DIRTY; restore on failure.
          check_text 'V60_SCALAR_WRITE_PLAIN=' "$SCALAR"
          check_text 'V60_TARGET_DESCRIPTOR_VERIFY' "$SCALAR"
          check_text 'V60_SCALAR_WRITE_COMPLETE' "$SCALAR"
          check_text 'persistence=RAM_DIRTY' "$SCALAR"
          check_text 'V60_FAILSAFE_RESTORE_PLAIN=' "$SCALAR"
          check_text 'V60_RESTORE_DESCRIPTOR_VERIFY' "$SCALAR"
          check_text 'values.size == expectedCount' "$SCALAR"

          # Permanent scalar SAVE is explicit and guarded.
          check_text 'SAVE VERIFIED GLOBAL CONTROLS TO DSP (PERMANENT) • GUARDED' "$SCALAR"
          check_text 'SaveParamsPolicy.triggerIsExact()' "$SCALAR"
          check_text '!unsavedVerifiedChanges || verifiedChangeCount <= 0' "$SCALAR"
          check_text 'saveInFlight || pendingId != null || descMode != null || waitingAuth' "$SCALAR"
          check_text 'V60_SCALAR_SAVEPARAMS_TRIGGER_PLAIN=' "$SCALAR"
          check_text 'TX_SAVEPARAMS_ID7_V60_SCALAR' "$SCALAR"
          check_text 'V60_SCALAR_SAVEPARAMS_GATT_RESULT' "$SCALAR"
          check_text 'saveCommitSettleMs = 5000L' "$SCALAR"
          check_text 'V60_SCALAR_PERSISTENT_SAVE_COMPLETE' "$SCALAR"
          check_text 'V60_SCALAR_PERSISTENT_SAVE_UNCONFIRMED' "$SCALAR"
          check_text 'persistenceBasis=V57_TWO_POWER_CYCLE_PROOF' "$SCALAR"
          check_text 'IMPORT V59 VERIFIED RAM-DIRTY PROOF (NO WRITE / NO SAVE)' "$SCALAR"
          check_text 'V60_V59_RAM_DIRTY_RECOVERY_CHECK' "$SCALAR"
          check_text 'V60_IMPORT_V59_VERIFIED_RAM_DIRTY_ACCEPTED' "$SCALAR"
          check_text 'noWrite=true noSave=true' "$SCALAR"

          # The V58-proven EQ module is retained under V60 labels.
          check_text 'V60_LIVE_EQ_WRITE_PLAIN=' "$LIVE"
          check_text 'V60_TARGET_DESCRIPTOR_VERIFY' "$LIVE"
          check_text 'V60_EQ_ROLLBACK_WRITE_PLAIN=' "$LIVE"
          check_text 'V60_PERSISTENT_SAVE_COMPLETE' "$LIVE"
          check_text 'เปิด V60 VERIFIED GLOBAL CONTROLS + PERMANENT SAVE' "$MAIN"
          check_text 'เปิด V60 LIVE EQ 7CH + PERMANENT SAVE' "$MAIN"

          # No direct SaveParams ID7 encoder outside the centralized policy.
          if grep -R -n -F 'UfeCodec.encodeWrite(7' /tmp/okn_v60/app/src/main/java/com/okn/dsp | grep -v 'SaveParamsPolicy.kt'; then
            echo 'ERROR: direct SaveParams ID7 write exists outside SaveParamsPolicy'
            exit 1
          fi

          # APPLY/verify paths must never auto-save.
          python3 - <<'PY'
          from pathlib import Path
          scalar = Path('/tmp/okn_v60/app/src/main/java/com/okn/dsp/ScalarControlActivity.kt').read_text()
          a = scalar[scalar.index('private fun sendScalarWrite'):scalar.index('private fun requestDescriptor')]
          b = scalar[scalar.index('private fun onDescriptorComplete'):scalar.index('private fun extractScalarValues')]
          for seg, name in [(a, 'sendScalarWrite'), (b, 'onDescriptorComplete')]:
              assert 'SaveParamsPolicy.encodeTrigger()' not in seg, name
              assert 'sendPermanentSave()' not in seg, name
          live = Path('/tmp/okn_v60/app/src/main/java/com/okn/dsp/LiveEqActivity.kt').read_text()
          seg = live[live.index('private fun verifyTarget'):live.index('private fun restorePrevious')]
          assert 'SaveParamsPolicy.encodeTrigger()' not in seg
          assert 'sendPermanentSave()' not in seg
          print('OK: scalar and EQ target-verify paths never auto-save')
          PY

          echo 'OK: V60 keeps generic writes locked and combines only proven scalar/EQ paths with explicit V57-proven permanent SAVE'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/okn_v60
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and package artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn_v60/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          mkdir -p artifact
          cp "$APK" artifact/OKN_DSP_V60_V59_RAM_DIRTY_IMPORT_RECOVERY-debug.apk
          cp /tmp/okn_v60/README_V60.txt artifact/
          cp /tmp/okn_v60/evidence/OKN_DSP_V60_V59_RAM_DIRTY_IMPORT_RECOVERY_PLAN.txt artifact/
          cp /tmp/okn_v60/evidence/OKN_DSP_V60_V59_RAM_DIRTY_IMPORT_RECOVERY_PLAN.json artifact/
          sha256sum artifact/OKN_DSP_V60_V59_RAM_DIRTY_IMPORT_RECOVERY-debug.apk > artifact/OKN_DSP_V60_V59_RAM_DIRTY_IMPORT_RECOVERY-debug.sha256
          ls -lh artifact

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-V60-V59-RAM-DIRTY-IMPORT-RECOVERY-debug-apk
          path: artifact/
          if-no-files-found: error
          retention-days: 30
