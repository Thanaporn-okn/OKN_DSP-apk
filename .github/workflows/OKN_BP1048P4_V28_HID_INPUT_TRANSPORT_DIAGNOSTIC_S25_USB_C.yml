name: OKN BP1048P4 V28 HID INPUT TRANSPORT DIAGNOSTIC S25 USB-C

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/OKN_BP1048P4_V28_HID_INPUT_TRANSPORT_DIAGNOSTIC_S25_USB_C.yml'

permissions:
  contents: read

env:
  REQUIRED_PATH: "Samsung Galaxy S25+ -> USB-C cable -> DSP USB-C port only"
  SOLDER_ALLOWED: "NO"
  BOARD_MOD_ALLOWED: "NO"
  JTAG_ALLOWED: "NO"
  SDP_ALLOWED: "NO"
  AICE_ALLOWED: "NO"
  HARDWARE_PROBE_ALLOWED: "NO"
  FLASHBOOT_AA_ALLOWED: "NO"
  FLASH_ERASE_ALLOWED: "NO"
  FLASH_WRITE_ALLOWED: "NO"
  ARBITRARY_HID_COMMAND_ALLOWED: "NO"

jobs:
  build:
    name: Build V28 HID input transport diagnostic APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: ONE CLICK - generate constrained transport diagnostic, safety-check, build APK
        shell: bash
        run: |
          set -euo pipefail

          test "$REQUIRED_PATH" = "Samsung Galaxy S25+ -> USB-C cable -> DSP USB-C port only"
          for v in SOLDER_ALLOWED BOARD_MOD_ALLOWED JTAG_ALLOWED SDP_ALLOWED AICE_ALLOWED HARDWARE_PROBE_ALLOWED FLASHBOOT_AA_ALLOWED FLASH_ERASE_ALLOWED FLASH_WRITE_ALLOWED ARBITRARY_HID_COMMAND_ALLOWED; do
            test "${!v}" = "NO"
          done

          rm -rf /tmp/v28
          mkdir -p \
            /tmp/v28/app/app/src/main/java/com/okn/bp1048p4v28 \
            /tmp/v28/app/app/src/main/res/xml \
            /tmp/v28/evidence \
            /tmp/v28/out

          A=/tmp/v28/app

          cat > /tmp/v28/evidence/V28_PURPOSE.txt <<'EOF'
          TARGET=MVSilicon BP1048P4
          PHONE=Samsung Galaxy S25+
          PATH=Samsung Galaxy S25+ -> USB-C cable -> DSP USB-C port only

          Purpose:
          Diagnose Android HID Input GET_REPORT transport on runtime 6324:1719 interface 4.

          V27 result on real board:
            SET_REPORT(Output) 256 = accepted
            GET_REPORT(Input) = 0

          V28 changes:
          1) claim interface 4 explicitly
          2) baseline GET_REPORT(Input) before any application command
          3) send exact version query ONCE:
               A5 5A 00 00 16
             zero padded to 256 bytes
          4) read Input report with controlled delays and lengths:
               64 bytes
               256 bytes
               64 bytes retry
          5) buffers are prefilled with 0xCC to detect mutation even if Android reports length 0

          No FlashBoot Feature SET_REPORT.
          No AA trigger.
          No recovery command.
          No erase/write.
          No arbitrary command UI.
          EOF

          cat > "$A/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'OKN_BP1048P4_V28_HID_INPUT'
          include ':app'
          EOF

          cat > "$A/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > "$A/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > "$A/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.okn.bp1048p4v28'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.okn.bp1048p4v28'
                  minSdk 29
                  targetSdk 35
                  versionCode 28
                  versionName '28.0'
              }
          }
          EOF

          cat > "$A/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature
                  android:name="android.hardware.usb.host"
                  android:required="true" />

              <application
                  android:allowBackup="false"
                  android:label="OKN BP1048P4 V28 HID DIAG"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED" />
                      </intent-filter>

                      <meta-data
                          android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED"
                          android:resource="@xml/device_filter" />
                  </activity>
              </application>
          </manifest>
          EOF

          cat > "$A/app/src/main/res/xml/device_filter.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <usb-device vendor-id="25380" product-id="5913" />
          </resources>
          EOF

          cat > "$A/app/src/main/java/com/okn/bp1048p4v28/MainActivity.java" <<'JAVA'
          package com.okn.bp1048p4v28;

          import android.app.Activity;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.hardware.usb.UsbDevice;
          import android.hardware.usb.UsbDeviceConnection;
          import android.hardware.usb.UsbInterface;
          import android.hardware.usb.UsbManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.SystemClock;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.Arrays;
          import java.util.Locale;
          import java.util.Map;

          public class MainActivity extends Activity {
              private static final String ACTION_USB_PERMISSION =
                  "com.okn.bp1048p4v28.USB_PERMISSION";

              private static final int VID = 0x6324;
              private static final int PID = 0x1719;
              private static final int HID_IFACE = 4;
              private static final int HID_CLASS = 3;

              private UsbManager usb;
              private UsbDevice selected;
              private TextView status;

              private final BroadcastReceiver permissionReceiver =
                  new BroadcastReceiver() {
                      @Override public void onReceive(Context context, Intent intent) {
                          if (!ACTION_USB_PERMISSION.equals(intent.getAction())) return;

                          UsbDevice d;
                          if (Build.VERSION.SDK_INT >= 33) {
                              d = intent.getParcelableExtra(
                                  UsbManager.EXTRA_DEVICE, UsbDevice.class);
                          } else {
                              d = intent.getParcelableExtra(UsbManager.EXTRA_DEVICE);
                          }

                          boolean granted = intent.getBooleanExtra(
                              UsbManager.EXTRA_PERMISSION_GRANTED, false);

                          log("USB permission=" + granted + dev(d));
                          if (granted && d != null) selected = d;
                      }
                  };

              @Override protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  usb = (UsbManager) getSystemService(Context.USB_SERVICE);

                  IntentFilter f = new IntentFilter(ACTION_USB_PERMISSION);
                  if (Build.VERSION.SDK_INT >= 33) {
                      registerReceiver(
                          permissionReceiver,
                          f,
                          Context.RECEIVER_NOT_EXPORTED);
                  } else {
                      registerReceiver(permissionReceiver, f);
                  }

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(28, 28, 28, 28);

                  TextView title = new TextView(this);
                  title.setText("OKN BP1048P4 • V28 HID INPUT DIAGNOSTIC");
                  title.setTextSize(20);
                  root.addView(title);

                  TextView note = new TextView(this);
                  note.setText(
                      "\nSamsung Galaxy S25+ → USB-C → DSP USB-C เท่านั้น\n" +
                      "ทดสอบ claim-interface / timing / GET_REPORT length\n" +
                      "ส่ง application command ได้เพียง A5 5A 00 00 16 ครั้งเดียว\n" +
                      "ไม่มี AA • ไม่มี FlashBoot • ไม่มี erase/write\n");
                  root.addView(note);

                  addButton(root, "1) สแกน DSP", v -> scan());
                  addButton(root, "2) ขอสิทธิ์ USB", v -> requestPermission());
                  addButton(root, "3) RUN V28 HID INPUT DIAGNOSTIC", v -> runDiagnostic());

                  status = new TextView(this);
                  status.setTextIsSelectable(true);
                  status.setText("\nLog:\n");
                  root.addView(status);

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(root);
                  setContentView(scroll);

                  scan();
              }

              private void addButton(
                  LinearLayout root,
                  String text,
                  View.OnClickListener listener) {

                  Button b = new Button(this);
                  b.setText(text);
                  b.setAllCaps(false);
                  b.setOnClickListener(listener);
                  root.addView(b);
              }

              private void log(String s) {
                  status.append(s + "\n");
              }

              private void toast(String s) {
                  Toast.makeText(this, s, Toast.LENGTH_SHORT).show();
                  log(s);
              }

              private String dev(UsbDevice d) {
                  if (d == null) return "";
                  return String.format(
                      Locale.US,
                      " [%04X:%04X id=%d name=%s]",
                      d.getVendorId(),
                      d.getProductId(),
                      d.getDeviceId(),
                      d.getDeviceName());
              }

              private boolean isRuntime(UsbDevice d) {
                  return d != null &&
                      d.getVendorId() == VID &&
                      d.getProductId() == PID;
              }

              private UsbInterface dataInterface(UsbDevice d) {
                  if (d == null) return null;

                  for (int i = 0; i < d.getInterfaceCount(); i++) {
                      UsbInterface x = d.getInterface(i);

                      if (x.getId() == HID_IFACE &&
                          x.getInterfaceClass() == HID_CLASS) {
                          return x;
                      }
                  }

                  return null;
              }

              private void scan() {
                  selected = null;

                  Map<String, UsbDevice> list = usb.getDeviceList();
                  log("USB devices=" + list.size());

                  for (UsbDevice d : list.values()) {
                      log("พบ" + dev(d));
                      if (isRuntime(d)) selected = d;
                  }

                  if (selected == null) {
                      log("ยังไม่พบ runtime 6324:1719");
                      return;
                  }

                  UsbInterface intf = dataInterface(selected);

                  log("selected" + dev(selected));
                  log("permission=" + usb.hasPermission(selected));
                  log("interface4.hid=" + (intf != null));
              }

              private void requestPermission() {
                  if (selected == null) scan();

                  if (selected == null) {
                      toast("ยังไม่พบ DSP runtime");
                      return;
                  }

                  if (usb.hasPermission(selected)) {
                      log("มีสิทธิ์ USB แล้ว");
                      return;
                  }

                  Intent i = new Intent(ACTION_USB_PERMISSION)
                      .setPackage(getPackageName());

                  PendingIntent pi = PendingIntent.getBroadcast(
                      this,
                      selected.getDeviceId(),
                      i,
                      PendingIntent.FLAG_UPDATE_CURRENT |
                          PendingIntent.FLAG_MUTABLE);

                  usb.requestPermission(selected, pi);
              }

              private int getInput(
                  UsbDeviceConnection conn,
                  int requestLength,
                  String label) {

                  byte[] in = new byte[requestLength];
                  Arrays.fill(in, (byte) 0xCC);

                  int ret = conn.controlTransfer(
                      0xA1,
                      0x01,
                      0x0100,
                      HID_IFACE,
                      in,
                      in.length,
                      1500);

                  log(label + ".result=" + ret);
                  log(label + ".first32=" + hex(in, Math.min(in.length, 32)));
                  log(label + ".changedFromCC=" + changedFromCC(in));

                  if (ret > 0) parseVersion(in, ret);

                  return ret;
              }

              private void runDiagnostic() {
                  if (selected == null) scan();

                  if (selected == null || !isRuntime(selected)) {
                      toast("ไม่พบ runtime 6324:1719");
                      return;
                  }

                  if (!usb.hasPermission(selected)) {
                      requestPermission();
                      return;
                  }

                  UsbInterface intf = dataInterface(selected);

                  if (intf == null) {
                      log("REFUSE: interface 4 HID ไม่ตรง fingerprint V26");
                      return;
                  }

                  UsbDeviceConnection conn = usb.openDevice(selected);

                  if (conn == null) {
                      log("openDevice failed");
                      return;
                  }

                  boolean claimed = false;

                  try {
                      log("=== V28 HID INPUT DIAGNOSTIC BEGIN ===");

                      claimed = conn.claimInterface(intf, true);
                      log("claimInterface4=" + claimed);

                      if (!claimed) {
                          log("STOP: claim interface 4 failed");
                          return;
                      }

                      // Baseline read-side test before any application command.
                      getInput(conn, 64, "BASELINE_GET64");

                      byte[] out = new byte[256];

                      // Exact and only allowed application request.
                      out[0] = (byte) 0xA5;
                      out[1] = (byte) 0x5A;
                      out[2] = (byte) 0x00;
                      out[3] = (byte) 0x00;
                      out[4] = (byte) 0x16;

                      log("TX logical=A5 5A 00 00 16");
                      log("TX reportBytes=256");

                      int set = conn.controlTransfer(
                          0x21,
                          0x09,
                          0x0200,
                          HID_IFACE,
                          out,
                          out.length,
                          1500);

                      log("SET_REPORT(Output).result=" + set);

                      if (set != 256) {
                          log("STOP: output report not accepted");
                          return;
                      }

                      SystemClock.sleep(20);
                      getInput(conn, 64, "GET64_AFTER_20MS");

                      SystemClock.sleep(100);
                      getInput(conn, 256, "GET256_AFTER_120MS");

                      SystemClock.sleep(250);
                      getInput(conn, 64, "GET64_AFTER_370MS");

                      log("=== V28 HID INPUT DIAGNOSTIC END ===");

                  } catch (Exception e) {
                      log("diagnostic error=" + e);
                  } finally {
                      if (claimed) {
                          try {
                              log("releaseInterface4=" + conn.releaseInterface(intf));
                          } catch (Exception e) {
                              log("releaseInterface4 error=" + e);
                          }
                      }

                      conn.close();
                  }
              }

              private boolean changedFromCC(byte[] b) {
                  for (byte x : b) {
                      if ((x & 0xff) != 0xCC) return true;
                  }
                  return false;
              }

              private void parseVersion(byte[] b, int len) {
                  if (len < 5) return;

                  if ((b[0] & 0xff) != 0xA5 ||
                      (b[1] & 0xff) != 0x5A ||
                      (b[2] & 0xff) != 0x00) {
                      return;
                  }

                  int payloadLen = b[3] & 0xff;
                  int end = 4 + payloadLen;

                  log("VERSION.headerValid=true");
                  log("VERSION.payloadLen=" + payloadLen);

                  if (end >= len || (b[end] & 0xff) != 0x16) {
                      log("VERSION.terminatorValid=false");
                      return;
                  }

                  log("VERSION.terminatorValid=true");

                  if (payloadLen >= 4 && len >= 8) {
                      log(String.format(
                          Locale.US,
                          "VERSION.chipFamilyTag=0x%02X",
                          b[4] & 0xff));

                      log(String.format(
                          Locale.US,
                          "VERSION.effect=%d.%d.%d",
                          b[5] & 0xff,
                          b[6] & 0xff,
                          b[7] & 0xff));
                  }

                  if (payloadLen >= 7 && len >= 11) {
                      log(String.format(
                          Locale.US,
                          "VERSION.audioLibBytes=%02X %02X %02X",
                          b[8] & 0xff,
                          b[9] & 0xff,
                          b[10] & 0xff));
                  }

                  log("VERSION_RESPONSE_VALID=true");
              }

              private static String hex(byte[] b, int len) {
                  StringBuilder s = new StringBuilder();
                  int n = Math.min(len, b.length);

                  for (int i = 0; i < n; i++) {
                      if (i > 0) s.append(' ');
                      s.append(String.format(
                          Locale.US,
                          "%02X",
                          b[i] & 0xff));
                  }

                  return s.toString();
              }

              @Override protected void onDestroy() {
                  try {
                      unregisterReceiver(permissionReceiver);
                  } catch (Exception ignored) {}

                  super.onDestroy();
              }
          }
          JAVA

          JAVA_SRC="$A/app/src/main/java/com/okn/bp1048p4v28/MainActivity.java"

          # Exact application command only.
          grep -q -F 'out[0] = (byte) 0xA5;' "$JAVA_SRC"
          grep -q -F 'out[1] = (byte) 0x5A;' "$JAVA_SRC"
          grep -q -F 'out[2] = (byte) 0x00;' "$JAVA_SRC"
          grep -q -F 'out[3] = (byte) 0x00;' "$JAVA_SRC"
          grep -q -F 'out[4] = (byte) 0x16;' "$JAVA_SRC"

          # Exactly one host-to-device control transfer in Java:
          # the version-query Output report.
          test "$(grep -c '0x21,' "$JAVA_SRC")" -eq 1
          test "$(grep -c '0x09,' "$JAVA_SRC")" -eq 1
          test "$(grep -c '0x0200,' "$JAVA_SRC")" -eq 1

          # Input reports are read-side only.
          grep -q -F '0xA1,' "$JAVA_SRC"
          grep -q -F '0x0100,' "$JAVA_SRC"

          # No FlashBoot / flash primitive.
          if grep -n -E '0x0300|0xAA|chiperas|bootdat|codedata|constdat|cnfgdat|btupdat|upinfo' "$JAVA_SRC"; then
            echo "FAIL: forbidden flash/upgrade primitive found"
            exit 1
          fi

          if grep -n -E 'EditText|ACTION_OPEN_DOCUMENT|FileInputStream|ContentResolver' "$JAVA_SRC"; then
            echo "FAIL: arbitrary command or firmware input unexpectedly exposed"
            exit 1
          fi

          cat > /tmp/v28/evidence/V28_STATUS.json <<'EOF'
          {
            "version": "28.0",
            "target": "MVSilicon BP1048P4",
            "required_phone": "Samsung Galaxy S25+",
            "required_path": "Samsung Galaxy S25+ -> USB-C cable -> DSP USB-C port only",
            "runtime_vid_pid": "6324:1719",
            "runtime_hid_interface": 4,
            "application_tx_count": 1,
            "application_request": "A5 5A 00 00 16",
            "claim_interface4": true,
            "baseline_get_report": true,
            "post_query_get_lengths": [64, 256, 64],
            "flashboot_AA_enabled": false,
            "recovery_commands_enabled": false,
            "flash_erase_enabled": false,
            "flash_write_enabled": false,
            "arbitrary_command_enabled": false
          }
          EOF

          SDKMAN="$(command -v sdkmanager || true)"
          if [ -n "$SDKMAN" ]; then
            set +o pipefail
            yes | "$SDKMAN" --licenses >/dev/null 2>&1 || true
            set -o pipefail
            "$SDKMAN" \
              "platforms;android-35" \
              "build-tools;35.0.0" \
              >/dev/null 2>&1 || true
          fi

          cd /tmp/v28
          curl -fL --retry 3 --connect-timeout 15 \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o gradle.zip

          unzip -q gradle.zip
          export PATH="/tmp/v28/gradle-8.9/bin:$PATH"

          cd "$A"
          gradle --no-daemon :app:assembleDebug

          cp \
            "$A/app/build/outputs/apk/debug/app-debug.apk" \
            /tmp/v28/out/OKN_BP1048P4_V28_HID_INPUT_TRANSPORT_DIAGNOSTIC.apk

          cd "$A"
          zip -9 -r \
            /tmp/v28/out/OKN_BP1048P4_V28_ANDROID_SOURCE.zip \
            . >/dev/null

          cp /tmp/v28/evidence/V28_PURPOSE.txt /tmp/v28/out/
          cp /tmp/v28/evidence/V28_STATUS.json /tmp/v28/out/

          sha256sum /tmp/v28/out/* \
            > /tmp/v28/out/SHA256SUMS.txt

          {
            echo "# BP1048P4 V28 HID INPUT TRANSPORT DIAGNOSTIC"
            echo
            echo "- Samsung Galaxy S25+ → USB-C → DSP USB-C only"
            echo "- claimInterface(4): enabled"
            echo "- baseline Input GET_REPORT: enabled"
            echo "- only application request: **A5 5A 00 00 16**, once"
            echo "- post-query Input reads: 64 / 256 / 64 bytes"
            echo "- FlashBoot AA: **DISABLED**"
            echo "- Recovery commands: **DISABLED**"
            echo "- Erase/write: **DISABLED**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload V28 APK + source + proof
        uses: actions/upload-artifact@v7
        with:
          name: OKN-BP1048P4-V28-HID-INPUT-TRANSPORT-DIAGNOSTIC
          path: /tmp/v28/out/*
          if-no-files-found: error
          retention-days: 90
