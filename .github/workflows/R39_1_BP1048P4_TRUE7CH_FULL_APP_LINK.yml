name: R39.1 BP1048P4 full app link candidate

on:
  workflow_dispatch:

jobs:
  r39-1-full-app-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack pinned R36 source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="OKN_BP1048P4_PHASE3_TRUE7CH_Source_R36.zip"
          test -f "$ZIP"
          echo "0edcc409352d7656ec0296b8416a55ea9f276299c396ed7fff6c8c5517cb3d82  $ZIP" | sha256sum -c -
          rm -rf /tmp/r36src
          mkdir -p /tmp/r36src
          unzip -q "$ZIP" -d /tmp/r36src
          ROOT="$(find /tmp/r36src -mindepth 1 -maxdepth 1 -type d -name 'OKN_BP1048P4_PHASE3_TRUE7CH_R36' | head -n1)"
          test -n "$ROOT"
          echo "R36_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Install host prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libc6-i386 lib32z1 git unzip

      - name: Fetch pinned public BP1048 SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/leadercxn/bp1048_sdk_v0.1.12.git /tmp/bp1048
          cd /tmp/bp1048
          git checkout 8105bd864b04995d81c9f9ae77cb158259f39015
          test "$(git rev-parse HEAD)" = "8105bd864b04995d81c9f9ae77cb158259f39015"

      - name: Fetch Andes NDS32 toolchain
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Ai-Thinker-Open/Andestech.git /tmp/andes
          echo "/tmp/andes/BSPv422/toolchains/nds32le-elf-mculib-v3s/bin" >> "$GITHUB_PATH"

      - name: Verify SDK fingerprints and select BP1048P4
        shell: bash
        run: |
          set -euo pipefail
          cd "$R36_ROOT"
          python3 experimental_r36/scripts/check_sdk_files.py /tmp/bp1048
          python3 experimental_r36/scripts/enable_bp1048p4.py /tmp/bp1048
          grep -a '^#define  CFG_CHIP_BP1048P4' /tmp/bp1048/BT_Audio_APP/bt_audio_app_src/inc/app_config.h
          if grep -a -q '^#define  CFG_CHIP_BP10128' /tmp/bp1048/BT_Audio_APP/bt_audio_app_src/inc/app_config.h; then
            echo 'BP10128 is still enabled' >&2
            exit 1
          fi

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          nds32le-elf-gcc --version
          nds32le-elf-ld --version
          nds32le-elf-objdump --version

      - name: Repair Windows-origin header case on Linux
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCASE'
          from pathlib import Path
          import re

          root = Path('/tmp/bp1048')
          bases = [
              root / 'BT_Audio_APP',
              root / 'MVsB1_Base_SDK' / 'driver',
              root / 'MVsB1_Base_SDK' / 'middleware',
              root / 'develop_lib',
          ]
          headers = []
          for base in bases:
              if base.exists():
                  headers.extend(p for p in base.rglob('*') if p.is_file() and p.suffix.lower() in {'.h', '.hpp'})
          by_lower = {}
          for p in headers:
              by_lower.setdefault(p.name.lower(), []).append(p)

          rx = re.compile(r'^\s*#\s*include\s*[<\"]([^\">]+)[\">]', re.M)
          spellings = set()
          for base in bases:
              if not base.exists():
                  continue
              for p in base.rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in {'.c', '.h', '.hpp', '.s'}:
                      continue
                  try:
                      text = p.read_bytes().decode('latin-1')
                  except OSError:
                      continue
                  for inc in rx.findall(text):
                      if '/' not in inc and '\\' not in inc:
                          spellings.add(inc)

          made = []
          for inc in sorted(spellings):
              for target in by_lower.get(inc.lower(), []):
                  alias = target.with_name(inc)
                  if alias.name == target.name or alias.exists():
                      continue
                  try:
                      alias.symlink_to(target.name)
                  except OSError:
                      alias.write_bytes(target.read_bytes())
                  made.append((str(alias.relative_to(root)), target.name))

          must = root / 'MVsB1_Base_SDK/middleware/rtos/freertos/inc/freertos.h'
          if not must.exists():
              raise SystemExit('failed to create freertos.h compatibility alias')
          print('Created', len(made), 'case aliases')
          PYCASE

      - name: Build production include path from BT_Audio_APP project order
        shell: bash
        run: |
          set -euo pipefail
          SDK=/tmp/bp1048
          : > /tmp/r38_includes.rsp
          for d in \
            "$SDK/BT_Audio_APP/bt_audio_app_src/audio" \
            "$SDK/develop_lib/util" \
            "$SDK/develop_lib" \
            "$SDK/develop_lib/trace" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/ai/md5" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/ai/speex/include/speex" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/ai/speex/include" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/ai/speex/libspeex" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/ai/speex" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/ai" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/inc" \
            "$SDK/MVsB1_Base_SDK/driver/driver_api/inc/otg" \
            "$SDK/MVsB1_Base_SDK/middleware/rtc/inc" \
            "$SDK/MVsB1_Base_SDK/middleware/fatfs/inc" \
            "$SDK/MVsB1_Base_SDK/middleware/user/inc" \
            "$SDK/MVsB1_Base_SDK/middleware/bluetooth/inc" \
            "$SDK/MVsB1_Base_SDK/middleware/audio/inc" \
            "$SDK/MVsB1_Base_SDK/driver/driver/inc" \
            "$SDK/MVsB1_Base_SDK/driver/driver_api/inc" \
            "$SDK/MVsB1_Base_SDK/middleware/mv_utils/inc" \
            "$SDK/MVsB1_Base_SDK/middleware/lrc/inc" \
            "$SDK/MVsB1_Base_SDK/middleware/rtos/rtos_api" \
            "$SDK/MVsB1_Base_SDK/middleware/rtos/freertos/inc" \
            "$SDK/MVsB1_Base_SDK/middleware/flashfs/inc" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/display" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/user" \
            "$SDK/MVsB1_Base_SDK/middleware/cec/inc" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/ble"; do
            test -d "$d" && printf '%s\n' "-I$d" >> /tmp/r38_includes.rsp
          done
          find "$SDK/BT_Audio_APP" \
               "$SDK/MVsB1_Base_SDK/driver" \
               "$SDK/MVsB1_Base_SDK/middleware" \
               "$SDK/develop_lib" \
               -type f -name '*.h' -printf '%h\n' | sort -u | while read -r d; do
            grep -Fxq -- "-I$d" /tmp/r38_includes.rsp || printf '%s\n' "-I$d" >> /tmp/r38_includes.rsp
          done
          printf '%s\n' "-I$R36_ROOT/firmware/include" >> /tmp/r38_includes.rsp
          head -50 /tmp/r38_includes.rsp

      - name: Patch runtime dispatcher for TRUE7CH controls 0x57 0x58
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYPATCH'
          from pathlib import Path

          p = Path('/tmp/bp1048/BT_Audio_APP/bt_audio_app_src/audio/communication.c')
          b = p.read_bytes()
          original = b

          def once(old: bytes, new: bytes, label: str):
              global b
              n = b.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {n}')
              b = b.replace(old, new, 1)

          once(
              b'#include "main_task.h"',
              b'#include "main_task.h"\r\n#include "okn_r36_sdk_bridge.h"',
              'include hook')

          once(
              b'void Communication_Effect_Init(void)\r\n{',
              b'void Communication_Effect_Init(void)\r\n{\r\n\tokn_r36_init();',
              'init hook')

          marker = b'void Communication_Effect_Config(uint8_t Control, uint8_t *buf, uint32_t len)\r\n{'
          helper = br'''/* OKN R38 TRUE7CH runtime bridge. Runtime-only; no flash write path. */
          static void OKN_Communication_0x57(uint8_t *buf, uint32_t len)
          {
              uint8_t req[13];
              if((buf == NULL) || (len != 12u)) return;
              req[0] = OKN_UFE_WRITE;
              memcpy(&req[1], buf, 12u);
              if(okn_r36_ufe_write_apply(req, sizeof(req)))
              {
                  memset(tx_buf, 0, sizeof(tx_buf));
                  tx_buf[0] = OKN_UFE_WRITE;
                  Communication_Effect_Send(tx_buf, 1u);
              }
          }
          
          static void OKN_Communication_0x58(uint8_t *buf, uint32_t len)
          {
              uint8_t req[9];
              uint8_t resp[13];
              size_t n;
              if((buf == NULL) || (len != 8u)) return;
              req[0] = OKN_UFE_READ;
              memcpy(&req[1], buf, 8u);
              n = okn_r36_ufe_read(req, sizeof(req), resp, sizeof(resp));
              if((n != 13u) || (resp[0] != OKN_UFE_READ_RESPONSE)) return;
              memset(tx_buf, 0, sizeof(tx_buf));
              tx_buf[0] = 0xA5u;
              tx_buf[1] = 0x5Au;
              tx_buf[2] = OKN_UFE_READ_RESPONSE;
              tx_buf[3] = (uint8_t)(n - 1u);
              memcpy(&tx_buf[4], &resp[1], n - 1u);
              tx_buf[3u + n] = 0x16u;
              Communication_Effect_Send(tx_buf, (uint32_t)(n + 4u));
          }
          
          '''
          once(marker, helper + marker, 'runtime helper insertion')

          once(
              b'\t\tcase 0x80:\r\n',
              b'\t\tcase 0x57:\r\n\t\t\tOKN_Communication_0x57(buf, len);\r\n\t\t\treturn;\r\n\r\n'
              b'\t\tcase 0x58:\r\n\t\t\tOKN_Communication_0x58(buf, len);\r\n\t\t\treturn;\r\n\r\n'
              b'\t\tcase 0x80:\r\n',
              'dispatcher cases')

          if b == original:
              raise SystemExit('patch made no changes')

          # The vendor SDK declares AudioEffectListJudge while `bool` is the
          # type.h macro `unsigned char`.  Later includes can change the meaning
          # of `bool` under the Linux/Andes standalone build.  Spell the return
          # type explicitly at the definition so it matches the original ABI.
          legacy_sig = b'bool  AudioEffectListJudge(uint16_t len, const uint8_t *pbuff)\r\n{'
          explicit_sig = b'unsigned char AudioEffectListJudge(uint16_t len, const uint8_t *pbuff)\r\n{'
          n = b.count(legacy_sig)
          if n != 1:
              raise SystemExit(f'AudioEffectListJudge definition: expected one match, got {n}')
          b = b.replace(legacy_sig, explicit_sig, 1)

          p.write_bytes(b)

          # Safety assertions: new runtime hooks are present and the destructive 0x11
          # branch remains separate/unmodified.
          text = b.decode('latin-1')
          for needle in ['OKN_Communication_0x57', 'OKN_Communication_0x58',
                         'case 0x57:', 'case 0x58:', 'okn_r36_init();',
                         'unsigned char AudioEffectListJudge']:
              if needle not in text:
                  raise SystemExit('missing patched token: ' + needle)
          if text.count('case 0x11:') != 1 or text.count('Communication_Effect_0x11(buf, len);') != 1:
              raise SystemExit('destructive 0x11 branch changed unexpectedly')

          Path('/tmp/R38_PATCHED_communication.c').write_bytes(b)
          Path('/tmp/R38_RUNTIME_PROTOCOL.txt').write_text(
              'R38.1 runtime protocol (experimental, RAM only)\n'
              'WRITE: A5 5A 57 0C <id32be><offset16be><len16be><float32le> 16\n'
              'READ : A5 5A 58 08 <id32be><offset16be><len16be> 16\n'
              'READ RESPONSE: A5 5A 60 0C <id32be><offset16be><len16be><float32le> 16\n'
              'IDs: CH1..CH7 = 22..28\n'
              'No SaveParams, erase, program, commit, reset, or Control 0x11 is used by this bridge.\n',
              encoding='utf-8')
          print('R38 communication runtime patch applied')
          PYPATCH

      - name: Build active source graph from vendor Eclipse project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYGRAPH'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          sdk = Path('/tmp/bp1048')
          app = sdk / 'BT_Audio_APP'
          project = ET.parse(app / '.project').getroot()
          cproject = ET.parse(app / '.cproject').getroot()

          # Eclipse source exclusions from the vendor Debug/Release configs.
          exclusions = set()
          for e in cproject.iter('entry'):
              raw = e.attrib.get('excluding', '')
              exclusions.update(x for x in raw.split('|') if x)

          sources = {}
          local = app / 'bt_audio_app_src'
          for p in local.rglob('*'):
              if p.is_file() and p.suffix.lower() in {'.c', '.s'}:
                  logical = p.relative_to(app).as_posix()
                  sources[p.resolve()] = logical

          # External sources are linked into the Eclipse project as file resources.
          for link in project.iter('link'):
              name = (link.findtext('name') or '').strip()
              typ = (link.findtext('type') or '').strip()
              uri = (link.findtext('locationURI') or '').strip().replace('&amp;', '&')
              if typ != '1' or not name.lower().endswith(('.c', '.s')):
                  continue
              if uri.startswith('PARENT-1-PROJECT_LOC/'):
                  p = sdk / uri[len('PARENT-1-PROJECT_LOC/'):]
              elif uri.startswith('WORKSPACE_LOC/'):
                  p = sdk / uri[len('WORKSPACE_LOC/'):]
              else:
                  continue
              if p.is_file():
                  sources[p.resolve()] = name

          def norm(s: str) -> str:
              # Eclipse project paths changed spelling/case over SDK revisions.
              s = s.replace('\\', '/').lower().replace('_', '')
              while '//' in s:
                  s = s.replace('//', '/')
              return s.strip('/')

          exn = sorted({norm(x) for x in exclusions})
          active=[]
          excluded=[]
          for physical, logical in sorted(sources.items(), key=lambda x: x[1].lower()):
              ln=norm(logical)
              matches=[e for e in exn if ln == e or ln.endswith('/'+e)]
              if matches:
                  excluded.append((str(physical), logical, matches[0]))
              else:
                  active.append((str(physical), logical))

          out=Path('/tmp/R39_ACTIVE_SOURCES.tsv')
          out.write_text(''.join(f'{p}\t{l}\n' for p,l in active), encoding='utf-8')
          Path('/tmp/R39_EXCLUDED_SOURCES.tsv').write_text(
              ''.join(f'{p}\t{l}\t{e}\n' for p,l,e in excluded), encoding='utf-8')
          Path('/tmp/R39_SOURCE_GRAPH_SUMMARY.txt').write_text(
              f'DISCOVERED={len(sources)}\nACTIVE={len(active)}\nEXCLUDED={len(excluded)}\n', encoding='ascii')
          print(Path('/tmp/R39_SOURCE_GRAPH_SUMMARY.txt').read_text(), end='')
          print('Excluded by vendor .cproject:')
          for _,logical,e in excluded:
              print(' ', logical, '<=', e)

          # Hard evidence from R38.1: both display files are excluded by the vendor project.
          expected={'bt_audio_app_src/display/seg_lcd_disp.c','bt_audio_app_src/display/sled_disp.c'}
          actual={l for _,l,_ in excluded}
          missing=expected-actual
          if missing:
              raise SystemExit('vendor exclusion mapping failed for: '+', '.join(sorted(missing)))
          PYGRAPH

      - name: Compile active BT_Audio_APP source graph
        id: compile_full
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          CC=nds32le-elf-gcc
          COMMON=(-Os -g3 -mcpu=d1088-spu -mcmodel=medium -mext-dsp -mext-zol -fsingle-precision-constant -ffunction-sections -fdata-sections)
          APP=(-DFUNC_OS_EN=1 -DCFG_APP_CONFIG -DHAVE_CONFIG_H)
          rm -rf /tmp/r39obj /tmp/r39compile
          mkdir -p /tmp/r39obj /tmp/r39compile
          : > /tmp/R39_COMPILE_RESULTS.tsv
          pass=0; fail=0; n=0
          while IFS=$'\t' read -r src logical; do
            test -n "$src" || continue
            n=$((n+1))
            rel="${logical%.*}.o"
            obj="/tmp/r39obj/$rel"
            log="/tmp/r39compile/${n}.log"
            mkdir -p "$(dirname "$obj")"
            set +e
            "$CC" "${COMMON[@]}" @/tmp/r38_includes.rsp "${APP[@]}" -c "$src" -o "$obj" >"$log" 2>&1
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              pass=$((pass+1)); printf 'PASS\t%s\t%s\n' "$logical" "$obj" >> /tmp/R39_COMPILE_RESULTS.tsv
            else
              fail=$((fail+1)); printf 'FAIL\t%s\t%s\n' "$logical" "$log" >> /tmp/R39_COMPILE_RESULTS.tsv
            fi
          done < /tmp/R39_ACTIVE_SOURCES.tsv
          printf 'TOTAL=%d\nPASS=%d\nFAIL=%d\n' "$n" "$pass" "$fail" | tee /tmp/R39_COMPILE_SUMMARY.txt
          : > /tmp/R39_FIRST_COMPILE_FAILURES.txt
          awk -F '\t' '$1=="FAIL" && n<20 {print $2"\t"$3; n++}' /tmp/R39_COMPILE_RESULTS.tsv | while IFS=$'\t' read -r logical log; do
            echo "===== $logical =====" >> /tmp/R39_FIRST_COMPILE_FAILURES.txt
            sed -n '1,100p' "$log" >> /tmp/R39_FIRST_COMPILE_FAILURES.txt
          done
          test "$fail" -eq 0

      - name: Compile TRUE7CH bridge objects
        id: compile_true7ch
        if: steps.compile_full.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$R36_ROOT"
          CC=nds32le-elf-gcc
          COMMON=(-Os -g3 -mcpu=d1088-spu -mcmodel=medium -mext-dsp -mext-zol -fsingle-precision-constant -ffunction-sections -fdata-sections)
          mkdir -p /tmp/r39_true7ch
          cd "$ROOT"
          "$CC" "${COMMON[@]}" @/tmp/r38_includes.rsp -c firmware/src/okn_gain7.c -o /tmp/r39_true7ch/okn_gain7.o
          "$CC" "${COMMON[@]}" @/tmp/r38_includes.rsp -c firmware/src/okn_ufe_gain7.c -o /tmp/r39_true7ch/okn_ufe_gain7.o
          "$CC" "${COMMON[@]}" @/tmp/r38_includes.rsp -DOKN_R36_VENDOR_SDK=1 -c firmware/src/okn_r36_sdk_bridge.c -o /tmp/r39_true7ch/okn_r36_sdk_bridge.o
          nds32le-elf-nm -a /tmp/r39_true7ch/*.o > /tmp/R39_TRUE7CH_OBJECT_SYMBOLS.txt

      - name: Provide public-SDK UART mutex storage compatibility
        id: compile_rtos_compat
        if: steps.compile_full.outcome == 'success' && steps.compile_true7ch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          CC=nds32le-elf-gcc
          COMMON=(-Os -g3 -mcpu=d1088-spu -mcmodel=medium -mext-dsp -mext-zol -fsingle-precision-constant -ffunction-sections -fdata-sections)
          APP=(-DFUNC_OS_EN=1 -DCFG_APP_CONFIG -DHAVE_CONFIG_H)
          cat > /tmp/r39_uart_mutex_compat.c <<'EOF'
          #include <stddef.h>
          #include "rtos_api.h"
          /* Public SDK v0.1.12 declares these as extern but does not ship a
           * definition in the active source graph. Weak storage preserves
           * vendor override semantics if a strong definition is ever present. */
          __attribute__((weak)) osMutexId UART0Mutex = NULL;
          __attribute__((weak)) osMutexId UART1Mutex = NULL;
          EOF
          "$CC" "${COMMON[@]}" @/tmp/r38_includes.rsp "${APP[@]}" \
            -c /tmp/r39_uart_mutex_compat.c -o /tmp/r39_true7ch/r39_uart_mutex_compat.o
          nds32le-elf-nm -a /tmp/r39_true7ch/r39_uart_mutex_compat.o > /tmp/R39_UART_MUTEX_COMPAT_SYMBOLS.txt
          grep -Eq '[[:space:]][VvWw][[:space:]]+UART0Mutex$' /tmp/R39_UART_MUTEX_COMPAT_SYMBOLS.txt || { cat /tmp/R39_UART_MUTEX_COMPAT_SYMBOLS.txt; exit 1; }
          grep -Eq '[[:space:]][VvWw][[:space:]]+UART1Mutex$' /tmp/R39_UART_MUTEX_COMPAT_SYMBOLS.txt || { cat /tmp/R39_UART_MUTEX_COMPAT_SYMBOLS.txt; exit 1; }

      - name: Full link BT_Audio_APP plus TRUE7CH
        id: full_link
        if: steps.compile_full.outcome == 'success' && steps.compile_true7ch.outcome == 'success' && steps.compile_rtos_compat.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          SDK=/tmp/bp1048
          CC=nds32le-elf-gcc
          ADX=/tmp/R39_BP1048P4_TRUE7CH_FULL_APP_NOT_FOR_FLASH.adx
          BIN=/tmp/R39_BP1048P4_TRUE7CH_FULL_APP_NOT_FOR_FLASH.bin
          MAP=/tmp/R39_BP1048P4_TRUE7CH_FULL_APP.map

          mapfile -t OBJS < <(find /tmp/r39obj -type f -name '*.o' | sort)
          test "${#OBJS[@]}" -gt 100
          printf '%s\n' "${OBJS[@]}" > /tmp/R39_OBJECT_LIST.txt

          LIBS=(
            "$SDK/MVsB1_Base_SDK/driver/driver/libDriver.a"
            "$SDK/MVsB1_Base_SDK/middleware/audio/libsra.a"
            "$SDK/MVsB1_Base_SDK/middleware/cec/libcec.a"
            "$SDK/MVsB1_Base_SDK/middleware/audio/libsbcenc.a"
            "$SDK/MVsB1_Base_SDK/middleware/audio/libVocalCut.a"
            "$SDK/MVsB1_Base_SDK/middleware/audio/libmp3enc.a"
            "$SDK/MVsB1_Base_SDK/middleware/audio/libAudioEffectLibrary.a"
            "$SDK/MVsB1_Base_SDK/middleware/audio/libresampler.a"
            "$SDK/MVsB1_Base_SDK/middleware/audio/libAudioDecoderLibrary.a"
            "$SDK/MVsB1_Base_SDK/middleware/bluetooth/libBtStack.a"
            "$SDK/MVsB1_Base_SDK/middleware/flashfs/libFlashFS.a"
            "$SDK/MVsB1_Base_SDK/middleware/lrc/libLrc.a"
            "$SDK/MVsB1_Base_SDK/middleware/fatfs/libfatfs.a"
            "$SDK/MVsB1_Base_SDK/middleware/rtc/libRTC.a"
            "$SDK/MVsB1_Base_SDK/middleware/audio/libcvsd_plc.a"
            "$SDK/MVsB1_Base_SDK/middleware/audio/libBlueAEC.a"
            "$SDK/MVsB1_Base_SDK/middleware/xmai/libxmauth.a"
            "$SDK/BT_Audio_APP/bt_audio_app_src/libopus/lib/libopus.a"
          )
          for lib in "${LIBS[@]}"; do test -f "$lib" || { echo "missing lib $lib" >&2; exit 1; }; done
          printf '%s\n' "${LIBS[@]}" > /tmp/R39_LIBRARY_LIST.txt

          set +e
          "$CC" -static -nostartfiles -g3 -mcpu=d1088-spu -mcmodel=medium -mext-dsp \
            -Wl,--gc-sections \
            -Wl,--wrap=AudioI2S0_DataSet \
            -Wl,--wrap=AudioI2S1_DataSet \
            -Wl,-Map,"$MAP" \
            -T "$SDK/BT_Audio_APP/nds32-ae210p.ld" \
            -o "$ADX" \
            "${OBJS[@]}" \
            /tmp/r39_true7ch/okn_gain7.o \
            /tmp/r39_true7ch/okn_ufe_gain7.o \
            /tmp/r39_true7ch/okn_r36_sdk_bridge.o \
            /tmp/r39_true7ch/r39_uart_mutex_compat.o \
            -Wl,--start-group "${LIBS[@]}" -ldsp -lm -Wl,--end-group \
            > /tmp/R39_LINK.log 2>&1
          rc=$?
          set -e
          echo "$rc" > /tmp/R39_LINK_RC.txt
          if [ "$rc" -ne 0 ]; then
            sed -n '1,300p' /tmp/R39_LINK.log > /tmp/R39_LINK_FIRST_ERRORS.txt
            exit "$rc"
          fi

          nds32le-elf-objcopy -O binary "$ADX" "$BIN"
          nds32le-elf-size "$ADX" > /tmp/R39_SIZE.txt
          nds32le-elf-readelf -h -S -l "$ADX" > /tmp/R39_READELF.txt
          nds32le-elf-nm -a -C "$ADX" > /tmp/R39_SYMBOLS.txt
          nds32le-elf-nm -u "$ADX" > /tmp/R39_UNRESOLVED.txt || true
          nds32le-elf-objdump -d "$ADX" > /tmp/R39_DISASM.txt
          sha256sum "$ADX" "$BIN" "$MAP" > /tmp/R39_IMAGE_SHA256.txt
          wc -c "$ADX" "$BIN" > /tmp/R39_IMAGE_SIZES.txt
          od -An -tx1 -N256 "$BIN" > /tmp/R39_BIN_HEAD_256.txt

          for sym in _start Communication_Effect_Config okn_r36_init okn_r36_ufe_write_apply okn_r36_ufe_read __wrap_AudioI2S0_DataSet __wrap_AudioI2S1_DataSet AudioCoreSinkVolSet; do
            grep -Eq "[[:space:]]${sym}$" /tmp/R39_SYMBOLS.txt || { echo "missing final symbol $sym" >&2; exit 1; }
          done
          test -s "$BIN"
          if grep -Eq '^[[:space:]]+U[[:space:]]' /tmp/R39_UNRESOLVED.txt; then
            echo 'unexpected unresolved symbols in final executable:' >&2
            cat /tmp/R39_UNRESOLVED.txt >&2
            exit 1
          fi

      - name: Analyze R39 image and runtime bridge safety
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYSAFE'
          from pathlib import Path
          out=[]
          p=Path('/tmp/R38_PATCHED_communication.c')
          if p.exists():
              s=p.read_bytes().decode('latin-1')
              start=s.find('/* OKN R38 TRUE7CH runtime bridge.')
              end=s.find('void Communication_Effect_Config', start)
              block=s[start:end] if start>=0 and end>start else ''
              forbidden=['Communication_Effect_0x11','SpiFlashErase','SpiFlashWrite','SaveParams','Reset_McuSystem']
              bad=[x for x in forbidden if x in block]
              out.append('RUNTIME_BRIDGE_FORBIDDEN=' + (','.join(bad) if bad else 'NONE'))
              out.append('RUNTIME_0x57=' + ('YES' if 'case 0x57:' in s else 'NO'))
              out.append('RUNTIME_0x58=' + ('YES' if 'case 0x58:' in s else 'NO'))
              out.append('VENDOR_0x11_STILL_PRESENT=' + ('YES' if 'case 0x11:' in s else 'NO'))
          else:
              out.append('PATCHED_COMMUNICATION=MISSING')

          adx=Path('/tmp/R39_BP1048P4_TRUE7CH_FULL_APP_NOT_FOR_FLASH.adx')
          binp=Path('/tmp/R39_BP1048P4_TRUE7CH_FULL_APP_NOT_FOR_FLASH.bin')
          out.append('FULL_LINK_ADX=' + ('YES' if adx.exists() and adx.stat().st_size else 'NO'))
          out.append('FULL_LINK_BIN=' + ('YES' if binp.exists() and binp.stat().st_size else 'NO'))
          out.append('FLASH_ALLOWED=NO')
          out.append('REASON=R39 proves full build/link only; production board flash layout and rollback are not proven.')
          Path('/tmp/R39_SAFETY_STATE.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          print('\n'.join(out))
          if any(x.startswith('RUNTIME_BRIDGE_FORBIDDEN=') and not x.endswith('NONE') for x in out):
              raise SystemExit('R39 runtime bridge safety audit failed')
          PYSAFE

      - name: Package R39 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r39_evidence
          for f in \
            /tmp/R39_ACTIVE_SOURCES.tsv \
            /tmp/R39_EXCLUDED_SOURCES.tsv \
            /tmp/R39_SOURCE_GRAPH_SUMMARY.txt \
            /tmp/R39_COMPILE_RESULTS.tsv \
            /tmp/R39_COMPILE_SUMMARY.txt \
            /tmp/R39_FIRST_COMPILE_FAILURES.txt \
            /tmp/R39_TRUE7CH_OBJECT_SYMBOLS.txt \
            /tmp/R39_UART_MUTEX_COMPAT_SYMBOLS.txt \
            /tmp/r39_uart_mutex_compat.c \
            /tmp/R39_OBJECT_LIST.txt \
            /tmp/R39_LIBRARY_LIST.txt \
            /tmp/R39_LINK.log \
            /tmp/R39_LINK_RC.txt \
            /tmp/R39_LINK_FIRST_ERRORS.txt \
            /tmp/R39_BP1048P4_TRUE7CH_FULL_APP.map \
            /tmp/R39_BP1048P4_TRUE7CH_FULL_APP_NOT_FOR_FLASH.adx \
            /tmp/R39_BP1048P4_TRUE7CH_FULL_APP_NOT_FOR_FLASH.bin \
            /tmp/R39_SIZE.txt \
            /tmp/R39_READELF.txt \
            /tmp/R39_SYMBOLS.txt \
            /tmp/R39_UNRESOLVED.txt \
            /tmp/R39_IMAGE_SHA256.txt \
            /tmp/R39_IMAGE_SIZES.txt \
            /tmp/R39_BIN_HEAD_256.txt \
            /tmp/R39_SAFETY_STATE.txt \
            /tmp/R38_PATCHED_communication.c \
            /tmp/R38_RUNTIME_PROTOCOL.txt; do
              test -f "$f" && cp "$f" /tmp/r39_evidence/
          done
          cat > /tmp/r39_evidence/README_R39.txt <<'EOF'
          R39.1 BP1048P4 TRUE7CH FULL APP LINK CANDIDATE
          - Builds the active source graph from vendor BT_Audio_APP .project/.cproject.
          - Applies BP1048P4 selection and R38.1 runtime-only TRUE7CH controls.
          - Links with the same prebuilt library families named by the vendor .cproject.
          - Preserves flash_boot.o basename so the vendor linker script can place it before vectors.
          - Adds only weak UART0Mutex/UART1Mutex storage missing from the public SDK active graph.
          - Any produced .adx/.bin is NOT FOR FLASH. R39.1 is a full-link/build proof only.
          EOF
          (cd /tmp/r39_evidence && sha256sum * > R39_EVIDENCE_SHA256.txt)

      - name: Upload R39 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R39_1_BP1048P4_TRUE7CH_FULL_APP_LINK
          path: /tmp/r39_evidence/

      - name: R39 final gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat /tmp/R39_SOURCE_GRAPH_SUMMARY.txt || true
          cat /tmp/R39_COMPILE_SUMMARY.txt || true
          cat /tmp/R39_SAFETY_STATE.txt || true
          test -f /tmp/R39_LINK_RC.txt
          test "$(cat /tmp/R39_LINK_RC.txt)" = "0"
          test -s /tmp/R39_BP1048P4_TRUE7CH_FULL_APP_NOT_FOR_FLASH.adx
          test -s /tmp/R39_BP1048P4_TRUE7CH_FULL_APP_NOT_FOR_FLASH.bin
          echo 'PASS R39.1 full app linked; output remains NOT FOR FLASH.'
