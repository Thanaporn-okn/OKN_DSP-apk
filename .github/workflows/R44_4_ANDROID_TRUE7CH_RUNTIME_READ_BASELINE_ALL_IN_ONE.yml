      - name: Safety gate - fixed UFE 0x58 read only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYSAFE'
          from pathlib import Path
          import re

          root=Path("/tmp/r44src/r44_android_source")
          k=(root/"android_template/MainActivity.kt.in").read_text()
          d=(root/"lib/usb_readonly.dart").read_text()
          main=(root/"lib/main.dart").read_text()
          proto=(root/"lib/ufe_protocol.dart").read_text()

          forbidden=[
              "bulkTransfer","UsbRequest","setConfiguration","setInterface",
              "writeCharacteristic","writeDescriptor","BluetoothGatt","BluetoothSocket",
              "SpiFlashErase","SpiFlashWrite","SaveParams","Reset_McuSystem",
          ]
          bad=[x for x in forbidden if x in k]
          if bad:
              raise SystemExit("forbidden runtime/write token(s): "+", ".join(bad))

          if k.count("controlTransfer(") != 3:
              raise SystemExit("R44.4 must have exactly GET_DESCRIPTOR + one conditional SET_REPORT + one GET_REPORT call site")

          required=[
              "READ_ONLY_REQUEST_TYPE",
              "GET_DESCRIPTOR = 0x06",
              "HID_REPORT_DESCRIPTOR = 0x22",
              "HID_SET_REPORT = 0x09",
              "HID_GET_REPORT = 0x01",
              "RUNTIME_SET_REPORT_REQUEST_TYPE",
              "UsbConstants.USB_DIR_OUT or UsbConstants.USB_TYPE_CLASS",
              "RUNTIME_GET_REPORT_REQUEST_TYPE",
              "UsbConstants.USB_DIR_IN or UsbConstants.USB_TYPE_CLASS",
              "0xA5.toByte(), 0x5A, 0x58, 0x08",
              "0x00, 0x00, 0x00, 0x02",
              "0x00, 0x00, 0x00, 0x04",
              '"runtimeReadId2"',
              "claimInterface(iface4, true)",
              "releaseInterface(iface4)",
              "val baselineSizes = listOf(1, 8, 64, 255, 256)",
              "baseline_unclaimed_no_set_report",
              "baseline_claimed_no_set_report",
              "val anyBaselineInput",
              "if (!anyBaselineInput)",
              "get_report_zero_before_set",
              "after_fixed_0x58",
          ]
          for token in required:
              if token not in k:
                  raise SystemExit("missing R44.4 proof token: "+token)

          if "HID_REPORT_TYPE_FEATURE" in k or "0x03 shl 8" in k:
              raise SystemExit("R44.4 must not use Feature Report transport")

          # SET_REPORT is allowed only after a positive pure GET_REPORT baseline.
          runtime_block=k[k.index("private fun runtimeReadId2"):k.index("private fun findRuntimeResponse")]
          baseline_guard=runtime_block.index("if (!anyBaselineInput)")
          set_call=runtime_block.index("val sent = connection.controlTransfer(")
          if set_call < baseline_guard:
              raise SystemExit("R44.4 regression: SET_REPORT appears before baseline guard")

          # Native runtime transport must never contain write-actuator or flash-control opcodes.
          for token in ["0x57","0x11"]:
              if token in k:
                  raise SystemExit("forbidden opcode leaked into native runtime transport: "+token)

          allowed_methods={"scanUsb","inspectHid","requestUsbPermission","runtimeReadId2"}
          calls=set(re.findall(r"invoke(?:List)?Method<[^>]+>\(\s*'([^']+)'", d))
          if calls != allowed_methods:
              raise SystemExit(f"unexpected Dart native methods: {sorted(calls)}")

          if "MethodChannel" in main:
              raise SystemExit("TRUE7CH 0x57 preview UI unexpectedly owns native transport")

          for token in ["writeControl = 0x57","gainIdFirst = 22","eqIdFirst = 30"]:
              if token not in proto:
                  raise SystemExit("R41 protocol regression: "+token)

          # R44.4 regression: claim/release belongs only to runtimeReadId2, not inspectHid.
          inspect_block=k[k.index("private fun inspectHid"):k.index("private fun runtimeReadId2")]
          runtime_block=k[k.index("private fun runtimeReadId2"):k.index("private fun findRuntimeResponse")]
          if "claimed" in inspect_block or "releaseInterface(iface4)" in inspect_block:
              raise SystemExit("R44.4 scope regression: inspectHid references runtime claim state")
          if "var claimed = false" not in runtime_block or "releaseInterface(iface4)" not in runtime_block:
              raise SystemExit("R44.4 scope regression: runtime claim/release pair missing")

          print("PASS R44.4 safety: pure GET_REPORT baseline before any conditional fixed 0x58; no 0x57/0x11/flash/reset")
          PYSAFE

      - name: HID R30 signature parser fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYHID'
          desc=bytes([
              0x06,0x00,0xFF,
              0x0A,0xAA,0x55,
              0xA1,0x01,
              0x75,0x08,
              0x96,0x00,0x01, 0x81,0x02,
              0x96,0x00,0x01, 0x91,0x02,
              0x95,0x08, 0xB1,0x02,
              0xC0,
          ])
          usage_page=0; report_size=0; report_count=0; report_id=0
          pages=set(); usages=set(); bits={}
          signature=False; i=0
          while i < len(desc):
              p=desc[i]
              if p==0xFE:
                  n=desc[i+1]; i += 3+n; continue
              sc=p&3; n=(0,1,2,4)[sc]
              typ=(p>>2)&3; tag=(p>>4)&15
              v=sum(desc[i+1+j]<<(8*j) for j in range(n))
              if typ==1:
                  if tag==0:
                      usage_page=v; pages.add(v)
                  elif tag==7:
                      report_size=v
                  elif tag==8:
                      report_id=v
                  elif tag==9:
                      report_count=v
              elif typ==2 and tag==0:
                  usage=(v & 0xFFFF) if n==4 else v
                  page=((v>>16)&0xFFFF) if n==4 else usage_page
                  pages.add(page); usages.add(usage)
                  signature |= page==0xFF00 and usage==0x55AA
              elif typ==0 and tag in (8,9,11):
                  kind={8:"Input",9:"Output",11:"Feature"}[tag]
                  bits[(kind,report_id)]=bits.get((kind,report_id),0)+report_size*report_count
              i += 1+n
          sizes={k:(v+7)//8 for k,v in bits.items()}
          assert signature
          assert sizes[("Input",0)]==256
          assert sizes[("Output",0)]==256
          assert sizes[("Feature",0)]==8
          print("PASS synthetic R30 HID fixture: FF00/55AA + Input256B Output256B Feature8B")
          PYHID

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android scaffold and overlay R44 runtime-read source
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          rm -rf /tmp/okn_r44_app
          flutter create --platforms=android --org com.okn.dsp --project-name okn_dsp_r44 /tmp/okn_r44_app

          rm -rf /tmp/okn_r44_app/lib /tmp/okn_r44_app/test
          cp -a "$R44_SRC/lib" /tmp/okn_r44_app/lib
          cp -a "$R44_SRC/test" /tmp/okn_r44_app/test
          cp "$R44_SRC/pubspec.yaml" /tmp/okn_r44_app/pubspec.yaml
          cp "$R44_SRC/analysis_options.yaml" /tmp/okn_r44_app/analysis_options.yaml
          cp "$R44_SRC/README_R44_TH.txt" /tmp/okn_r44_app/README_R44_TH.txt

          MAIN="$(find /tmp/okn_r44_app/android/app/src/main/kotlin -name MainActivity.kt | head -n1)"
          test -f "$MAIN"
          PKG="$(sed -n 's/^package[[:space:]]\+//p' "$MAIN" | head -n1)"
          test -n "$PKG"
          sed "s/^package __PACKAGE__$/package $PKG/"             "$R44_SRC/android_template/MainActivity.kt.in" > "$MAIN"

          MANIFEST=/tmp/okn_r44_app/android/app/src/main/AndroidManifest.xml
          python3 - <<'PYMAN'
          from pathlib import Path
          p=Path("/tmp/okn_r44_app/android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          marker="    <application"
          if marker not in s:
              raise SystemExit("AndroidManifest application marker missing")
          feature='    <uses-feature android:name="android.hardware.usb.host" android:required="false" />\n'
          s=s.replace(marker,feature+marker,1)
          p.write_text(s)
          PYMAN

          grep -q 'android.hardware.usb.host' "$MANIFEST"
          grep -q 'READ_ONLY_REQUEST_TYPE' "$MAIN"
          grep -q 'controlTransfer' "$MAIN"
          echo "R44_APP=/tmp/okn_r44_app" >> "$GITHUB_ENV"
          echo "R44_MAIN_ACTIVITY=$MAIN" >> "$GITHUB_ENV"

      - name: Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$R44_APP"
          flutter pub get

      - name: Protocol and regression unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$R44_APP"
          flutter test

      - name: Static analysis
        shell: bash
        run: |
          set -euo pipefail
          cd "$R44_APP"
          flutter analyze

      - name: Build Android debug APK with native USB host bridge
        shell: bash
        run: |
          set -euo pipefail
          cd "$R44_APP"
          flutter build apk --debug
          test -s build/app/outputs/flutter-apk/app-debug.apk

      - name: Post-build native safety audit
        shell: bash
        run: |
          set -euo pipefail
          K="$R44_MAIN_ACTIVITY"
          test "$(grep -c 'controlTransfer(' "$K")" = "3"
          ! grep -Eq 'bulkTransfer|UsbRequest|setConfiguration|setInterface|writeCharacteristic|writeDescriptor|BluetoothGatt|BluetoothSocket|SpiFlashErase|SpiFlashWrite|SaveParams|Reset_McuSystem' "$K"
          ! grep -q '0x57' "$K"
          ! grep -q '0x11' "$K"
          grep -q '0xA5.toByte(), 0x5A, 0x58, 0x08' "$K"
          grep -q 'HID_SET_REPORT = 0x09' "$K"
          grep -q 'HID_GET_REPORT = 0x01' "$K"
          grep -q 'RUNTIME_READ_INTERFACE = 4' "$K"
          grep -q 'claimInterface(iface4, true)' "$K"
          grep -q 'releaseInterface(iface4)' "$K"
          grep -q 'val baselineSizes = listOf(1, 8, 64, 255, 256)' "$K"
          grep -q 'baseline_unclaimed_no_set_report' "$K"
          grep -q 'baseline_claimed_no_set_report' "$K"
          grep -q 'if (!anyBaselineInput)' "$K"
          grep -q 'get_report_zero_before_set' "$K"
          grep -q 'after_fixed_0x58' "$K"
          echo 'PASS post-build R44.4: GET_REPORT baseline precedes conditional fixed 0x58; no mutating UFE/flash path'

      - name: Package APK and R44.4 source evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/r44_out
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp "$R44_APP/build/app/outputs/flutter-apk/app-debug.apk" "$OUT/OKN_DSP_R44_4_RUNTIME_READ_BASELINE_debug.apk"
          cp /tmp/OKN_DSP_R44_4_RUNTIME_READ_BASELINE_Source.zip "$OUT/OKN_DSP_R44_4_RUNTIME_READ_BASELINE_Source.zip"
          cp "$R44_APP/README_R44_TH.txt" "$OUT/README_R44_TH.txt"
          cp "$R44_MAIN_ACTIVITY" "$OUT/MainActivity_R44_4_RUNTIME_READ_BASELINE.kt"
          cp "$R44_APP/android/app/src/main/AndroidManifest.xml" "$OUT/AndroidManifest.xml"
          flutter --version > "$OUT/FLUTTER_VERSION.txt"
          cat > "$OUT/R44_4_BASELINE_SAFETY_STATE.txt" <<'EOF'
          USB_ENUMERATION=YES
          USB_PERMISSION_REQUEST=YES
          HID_REPORT_DESCRIPTOR=GET_DESCRIPTOR_IN_ONLY
          R30_SIGNATURE_REQUIRED=YES
          RUNTIME_INTERFACE=4
          RUNTIME_INTERFACE_CLAIM=YES
          GET_REPORT_BASELINE_BEFORE_ANY_SET_REPORT=YES
          BASELINE_GET_LENGTHS=1_8_64_255_256
          RUNTIME_TX_HID_REPORT=OUTPUT_256B_CONDITIONAL
          RUNTIME_TX_COMMAND=0x58_ONLY_IF_BASELINE_GET_IS_ALIVE
          RUNTIME_TX_ID=2
          RUNTIME_TX_OFFSET=0
          RUNTIME_TX_LENGTH=4
          RUNTIME_RX=GET_REPORT_INPUT_IF4_BASELINE_UNCLAIMED_AND_CLAIMED_THEN_AFTER_0x58_IF_ALIVE
          RUNTIME_EXPECT_RESPONSE=0x60
          OUTPUT_VARIANTS=FIXED_DIRECT_ONLY_AFTER_BASELINE_PASS
          FEATURE_REPORT_TRANSPORT=NO
                    UFE_0x57_TRANSMIT=NO
          CONTROL_0x11_TRANSMIT=NO
          FLASH_WRITE=NO
          RESET=NO
          EOF
          (cd "$OUT" && sha256sum * > SHA256SUMS.txt)

      - name: Upload R44.4 APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN_DSP_R44_4_RUNTIME_READ_BASELINE_APK
          path: /tmp/r44_out/*
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        shell: bash
        run: |
          {
            echo '## R44.4 Android TRUE7CH runtime read baseline-first diagnostic'
            echo '- Keeps R42/R43 TRUE7CH UI and R30 HID discovery'
            echo '- Requires confirmed R30 signature on IF4; tests pure GET_REPORT before and after claim'
            echo '- Sends no SET_REPORT at all unless pure GET_REPORT baseline returns data; then sends only fixed read-only 0x58 ID2/offset0/len4 once'
            echo '- Baseline probes IF4 GET_REPORT lengths 1/8/64/255/256 unclaimed and claimed; after 0x58 reads 256B at 0/50/250/1000 ms'
            echo '- No 0x57 actuator write, no control 0x11, no flash/reset path'
          } >> "$GITHUB_STEP_SUMMARY"
