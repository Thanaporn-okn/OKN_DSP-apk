name: OKN Phase3 TRUE7CH R3 Verify

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: okn-phase3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHASE3_ZIP: OKN_BP1048P4_PHASE3_TRUE7CH_Source_R3.zip
  PHASE3_DIR: .phase3_true7ch
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  host-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Extract Phase3 source package
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PHASE3_ZIP"
          rm -rf "$PHASE3_DIR"
          mkdir -p "$PHASE3_DIR"
          unzip -q "$PHASE3_ZIP" -d "$PHASE3_DIR"
          test -f "$PHASE3_DIR/tests/run_host_tests.sh"
          test -f "$PHASE3_DIR/firmware/src/okn_gain7.c"

      - name: Host tests + no-EQ-gain guard
        shell: bash
        run: |
          set -euo pipefail
          bash "$PHASE3_DIR/tests/run_host_tests.sh"

  android-readonly-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Extract Phase3 source package
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PHASE3_ZIP"
          rm -rf "$PHASE3_DIR"
          mkdir -p "$PHASE3_DIR"
          unzip -q "$PHASE3_ZIP" -d "$PHASE3_DIR"
          test -f "$PHASE3_DIR/android-usb-probe/settings.gradle"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK from hosted runner
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -111 | sort -V | tail -n1)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          rc=${PIPESTATUS[1]}
          set -o pipefail
          exit "$rc"

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle 8.10.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            https://services.gradle.org/distributions/gradle-8.10.2-bin.zip \
            -o /tmp/gradle-8.10.2-bin.zip
          sudo rm -rf /opt/gradle-8.10.2
          sudo unzip -q /tmp/gradle-8.10.2-bin.zip -d /opt
          echo "/opt/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Build read-only USB probe APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle -p "$PHASE3_DIR/android-usb-probe" \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          ls -lh "$PHASE3_DIR/android-usb-probe/app/build/outputs/apk/debug/"
          test -n "$(find "$PHASE3_DIR/android-usb-probe/app/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - uses: actions/upload-artifact@v5
        with:
          name: OKN_USB_Descriptor_Probe_R3_debug
          path: .phase3_true7ch/android-usb-probe/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
