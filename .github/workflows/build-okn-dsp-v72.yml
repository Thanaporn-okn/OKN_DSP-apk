name: Build OKN DSP V72 Production UI Migration

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_ANDROID_V72_PRODUCTION_UI_MIGRATION.zip'
      - '.github/workflows/build-okn-dsp-v72.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify V72 source
        shell: bash
        run: |
          set -euo pipefail
          echo '0b853dc02bf9b46213120461056b43106bc99227396a052063c1920e5029999a  OKN_DSP_ANDROID_V72_PRODUCTION_UI_MIGRATION.zip' | sha256sum -c -
          rm -rf /tmp/okn_v72
          mkdir -p /tmp/okn_v72
          unzip -q OKN_DSP_ANDROID_V72_PRODUCTION_UI_MIGRATION.zip -d /tmp/okn_v72
          ROOT=/tmp/okn_v72
          check_file() { test -f "$1" || { echo "ERROR missing $1"; exit 1; }; echo "OK file: $1"; }
          check_text() { grep -Fq "$1" "$2" || { echo "ERROR missing marker '$1' in $2"; exit 1; }; echo "OK marker: $1"; }

          MAIN="$ROOT/app/src/main/java/com/okn/dsp/MainActivity.kt"
          UNIFIED="$ROOT/app/src/main/java/com/okn/dsp/UnifiedControlActivity.kt"
          SCALAR="$ROOT/app/src/main/java/com/okn/dsp/ScalarControlActivity.kt"
          LIVE="$ROOT/app/src/main/java/com/okn/dsp/LiveEqActivity.kt"
          SAVEPOL="$ROOT/app/src/main/java/com/okn/dsp/protocol/SaveParamsPolicy.kt"
          EQPOL="$ROOT/app/src/main/java/com/okn/dsp/protocol/LiveEqPolicy.kt"
          EQCODEC="$ROOT/app/src/main/java/com/okn/dsp/protocol/EqBandCodec.kt"
          SCALARPOL="$ROOT/app/src/main/java/com/okn/dsp/protocol/VerifiedScalarControls.kt"
          GATE="$ROOT/app/src/main/java/com/okn/dsp/protocol/WriteGate.kt"
          GRADLE="$ROOT/app/build.gradle.kts"
          MANIFEST="$ROOT/app/src/main/AndroidManifest.xml"
          V71CAP="$ROOT/evidence/OKN_DSP_V71_STALE_GATT_RUNTIME_SUCCESS_CAPTURE.txt"

          for f in "$MAIN" "$UNIFIED" "$SCALAR" "$LIVE" "$SAVEPOL" "$EQPOL" "$EQCODEC" "$SCALARPOL" "$GATE" "$GRADLE" "$MANIFEST" "$V71CAP"; do check_file "$f"; done
          check_file "$ROOT/README_V72.txt"
          check_file "$ROOT/evidence/OKN_DSP_V72_PRODUCTION_UI_MIGRATION_PLAN.txt"
          check_file "$ROOT/evidence/OKN_DSP_V72_PRODUCTION_UI_MIGRATION_PLAN.json"

          check_text 'versionCode = 72' "$GRADLE"
          check_text '5.3.0-v72-production-ui' "$GRADLE"
          check_text 'android:label="OKN DSP"' "$MANIFEST"

          # V72 must launch directly into the real Unified production controller.
          check_text 'startActivity(Intent(this, UnifiedControlActivity::class.java))' "$MAIN"
          check_text 'finish()' "$MAIN"
          check_text 'V72 • PRODUCTION' "$UNIFIED"
          check_text 'DSP CONNECTION' "$UNIFIED"
          check_text 'START CONTROL SESSION' "$UNIFIED"
          check_text 'SYNC LIVE VALUES' "$UNIFIED"
          check_text '● GLOBAL' "$UNIFIED"
          check_text 'EQ 7CH' "$UNIFIED"
          check_text 'DSP STATUS' "$UNIFIED"
          check_text 'SAVE TO DSP • LOCKED' "$UNIFIED"
          check_text 'SHOW SESSION LOG' "$UNIFIED"
          check_text 'ADVANCED / EVIDENCE LAB' "$UNIFIED"

          # Write scope remains exactly the V71-qualified scope.
          check_text 'const val enabled: Boolean = false' "$GATE"
          check_text 'const val unifiedVerifiedScalarWritesEnabled: Boolean = true' "$GATE"
          check_text 'const val unifiedVerifiedEqWritesEnabled: Boolean = true' "$GATE"
          python3 - "$SCALARPOL" <<'PY'
          import re,sys
          from pathlib import Path
          s=Path(sys.argv[1]).read_text()
          ids=[int(x) for x in re.findall(r'VerifiedScalarControl\((\d+),',s)]
          assert ids==[2,3,8,9,10,13,11],ids
          print('OK: scalar allow-list exactly [2,3,8,9,10,13,11]')
          PY

          # Final V71 runtime evidence is embedded byte-for-byte.
          echo 'f10275ebfebade6aaf515f43d8749513e25e8737322fd621cf17e44cf462d29d  '"$V71CAP" | sha256sum -c -
          check_text 'V71_UNIFIED_CONNECT_START name=LE-GoloPine_DSP_A address=DC:E0:D9:88:C7:04 oldGattDetached=true' "$V71CAP"
          check_text 'V71_UNIFIED_ACTIVE_GATT_ASSIGNED callbackIdentityGuard=true' "$V71CAP"
          check_text 'V71_UNIFIED_LOAD mode=REFRESH scalarCount=7 expectedScalars=7 eqBands=105 expectedEqBands=105 writablePeakingBands=55 sensors=4 expectedSensors=4 ready=true' "$V71CAP"
          check_text 'V71_UNIFIED_REFRESH_COMPLETE refresh=1 elapsedMs=3027 scalarChanged=0 eqChanged=0 sensorChanged=2' "$V71CAP"

          # Production protocol modules remain byte-for-byte unchanged from V71.
          echo '01f6aca6f2131bd41ca4fd1d674d879cade425ccc7ddef77e63718e8e124ffed  '"$SCALAR" | sha256sum -c -
          echo '3240ca56c81b7960098ae9fb6ea7421d32e74b11e42810ce4c5b71b35d7ab8d0  '"$LIVE" | sha256sum -c -
          echo '88005dba77d2b84597f5bd5e23eaaacec7d25b59dc0f38b8affbde2d2cfbeb85  '"$SAVEPOL" | sha256sum -c -
          echo 'cfb046aa09acaf8429176a9b99e988ea06347f3daeea988b7c118d056400d2bc  '"$EQPOL" | sha256sum -c -
          echo '4f033a406e363b2418af9b39fa2e42a13674b09f9de2bb7acf1eb6ff1918cd58  '"$EQCODEC" | sha256sum -c -

          # Verified Unified pipeline and stale-GATT isolation must remain present.
          for marker in \
            'V72_UNIFIED_SCALAR_PREFLIGHT_START' \
            'V72_UNIFIED_TARGET_DESCRIPTOR_VERIFY' \
            'V72_UNIFIED_RESTORE_DESCRIPTOR_VERIFY' \
            'V72_UNIFIED_EQ_PREFLIGHT_START' \
            'V72_UNIFIED_EQ_TARGET_DESCRIPTOR_VERIFY' \
            'V72_UNIFIED_EQ_RESTORE_DESCRIPTOR_VERIFY' \
            'V72_UNIFIED_SAVE_PRECHECK_RESULT' \
            'V72_UNIFIED_SAVE_POSTCHECK_RESULT' \
            'V72_UNIFIED_PERSISTENT_SAVE_COMPLETE' \
            'V72_UNIFIED_POWER_CYCLE_PERSISTENCE_PROOF_RESULT' \
            'V72_UNIFIED_STALE_GATT_CALLBACK_IGNORED' \
            'sensorReadOnly=true' \
            'genericWrites=false'; do check_text "$marker" "$UNIFIED"; done

          check_text 'SaveParamsPolicy.encodeTrigger()' "$UNIFIED"
          check_text '570000000700000000' "$SAVEPOL"
          check_text 'LiveEqPolicy.isWritable(original)' "$UNIFIED"
          check_text 'payloadBytes=48' "$UNIFIED"

          python3 - "$UNIFIED" <<'PY'
          from pathlib import Path
          import sys
          u=Path(sys.argv[1]).read_text()
          assert u.count('UfeCodec.encodeFloat32Write')==2, u.count('UfeCodec.encodeFloat32Write')
          assert u.count('LiveEqPolicy.encodeWrite')==1, u.count('LiveEqPolicy.encodeWrite')
          assert u.count('LiveEqPolicy.encodeRestore')==1, u.count('LiveEqPolicy.encodeRestore')
          assert u.count('SaveParamsPolicy.encodeTrigger()')==1, u.count('SaveParamsPolicy.encodeTrigger()')
          assert u.count('UfeCodec.encodeWrite(')==0, u.count('UfeCodec.encodeWrite(')
          assert u.count('EqBandCodec.encode')==0, u.count('EqBandCodec.encode')
          labels=['onConnectionStateChange','onMtuChanged','onServicesDiscovered','onDescriptorWrite','onCharacteristicWrite','onCharacteristicChanged33','onCharacteristicChangedLegacy']
          for label in labels:
              needle=f'if (!isCurrentGatt(g, "{label}")) return'
              assert needle in u, needle
          assert u.count('if (!isCurrentGatt(g,')==7
          # Presentation-only invariants.
          for marker in ['globalSection.visibility','eqSection.visibility','systemSection.visibility','visibility = View.GONE','val logToggle = Button']:
              assert marker in u, marker
          print('OK: V72 writer surface unchanged, GATT guards 7/7, Production UI present')
          PY

          if grep -R -n -F 'UfeCodec.encodeWrite(7' "$ROOT/app/src/main/java/com/okn/dsp" | grep -v 'SaveParamsPolicy.kt'; then
            echo 'ERROR: direct SaveParams ID7 writer outside policy'; exit 1
          fi

          echo 'OK: V72 static preflight passed'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/okn_v72
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and package artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn_v72/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          mkdir -p artifact
          cp "$APK" artifact/OKN_DSP_V72_PRODUCTION_UI_MIGRATION-debug.apk
          cp /tmp/okn_v72/README_V72.txt artifact/
          cp /tmp/okn_v72/evidence/OKN_DSP_V72_PRODUCTION_UI_MIGRATION_PLAN.txt artifact/
          cp /tmp/okn_v72/evidence/OKN_DSP_V72_PRODUCTION_UI_MIGRATION_PLAN.json artifact/
          sha256sum artifact/OKN_DSP_V72_PRODUCTION_UI_MIGRATION-debug.apk > artifact/OKN_DSP_V72_PRODUCTION_UI_MIGRATION-debug.sha256
          ls -lh artifact

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-V72-PRODUCTION-UI-debug-apk
          path: artifact/
          if-no-files-found: error
          retention-days: 30
