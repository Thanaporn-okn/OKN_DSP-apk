name: OKN DSP HCI Analyzer V1

on:
  workflow_dispatch:
  push:
    paths:
      - '*.cfa'
      - '*.log'
      - 'OKN_DSP_HCI_ANALYZER_V1.zip'
      - '.github/workflows/analyze-okn-dsp-hci-analyzer-v1.yml'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate analyzer and captures
        shell: bash
        run: |
          set -e
          mkdir -p work
          if [ -f OKN_DSP_HCI_ANALYZER_V1.zip ]; then
            unzip -o OKN_DSP_HCI_ANALYZER_V1.zip -d work
          fi
          ANALYZER=$(find work . -path '*/tools/analyze_btsnoop.py' -type f | head -1 || true)
          COMPARE=$(find work . -path '*/tools/compare_btsnoop.py' -type f | head -1 || true)
          if [ -z "$ANALYZER" ]; then echo 'Analyzer not found'; exit 1; fi
          find . -maxdepth 1 -type f \( -name '*.cfa' -o -name '*.log' \) | sort > capture_list.txt
          if [ ! -s capture_list.txt ]; then echo 'No .cfa/.log capture found at repo root'; exit 1; fi
          echo "ANALYZER=$ANALYZER" >> "$GITHUB_ENV"
          echo "COMPARE=$COMPARE" >> "$GITHUB_ENV"
          echo "CAPTURE_COUNT=$(wc -l < capture_list.txt)" >> "$GITHUB_ENV"

      - name: Analyze first capture
        run: |
          LOG=$(sed -n '1p' capture_list.txt)
          python3 "$ANALYZER" "$LOG" --out analysis

      - name: Compare captures when two are present
        if: env.CAPTURE_COUNT == '2' && env.COMPARE != ''
        run: |
          BASE=$(sed -n '1p' capture_list.txt)
          ACT=$(sed -n '2p' capture_list.txt)
          python3 "$COMPARE" "$BASE" "$ACT" --out compare

      - name: Upload analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN_DSP_HCI_ANALYSIS
          path: |
            analysis/
            compare/
          if-no-files-found: warn
