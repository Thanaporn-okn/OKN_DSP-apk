name: OKN BP1048P4 R90 AUTO-RUN MVA ROM FlashBoot Header Miner

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/OKN_BP1048P4_R90_AUTO_RUN_MVA_ROM_FLASHBOOT_HEADER_MINER.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: okn-r90-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_REPO: "https://github.com/leadercxn/bp1048_sdk_v0.1.12.git"
  SDK_COMMIT: "8105bd864b04995d81c9f9ae77cb158259f39015"
  OUT: "/tmp/r90"
  BOARD_USB_ACCESS: "NO"
  HOST_TO_DEVICE_USB: "NO"
  FLASH_ERASE_WRITE: "NO"
  FLASH_ALLOWED: "NO"

jobs:
  mine:
    name: Mine ROM FlashBoot MVA header evidence / STATIC ONLY
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fail-closed scope gate
        shell: bash
        run: |
          set -euo pipefail
          test "$BOARD_USB_ACCESS" = "NO"
          test "$HOST_TO_DEVICE_USB" = "NO"
          test "$FLASH_ERASE_WRITE" = "NO"
          test "$FLASH_ALLOWED" = "NO"
          rm -rf "$OUT"
          mkdir -p "$OUT/evidence"
          cat > "$OUT/evidence/00_SCOPE.txt" <<'EOF'
          REVISION=R90
          MODE=OFFLINE_STATIC_ONLY
          TARGET=MVSilicon_BP1048P4
          BOARD_USB_ACCESS=NO
          LIVE_USB_COMMANDS=NO
          AA55_RETEST=NO
          CONTROL_0X11_LIVE=NO
          ERASE=NO
          WRITE=NO
          FLASH_ALLOWED=NO
          GOAL=Recover_MVA_magic_header_fields_from_precompiled_ROM_FlashBoot_or_public_source_evidence
          EOF

      - name: Pin exact SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone -q "$SDK_REPO" "$OUT/sdk"
          git -C "$OUT/sdk" checkout -q "$SDK_COMMIT"
          test "$(git -C "$OUT/sdk" rev-parse HEAD)" = "$SDK_COMMIT"
          printf 'SDK_COMMIT=%s\n' "$(git -C "$OUT/sdk" rev-parse HEAD)" \
            > "$OUT/evidence/01_PIN.txt"

      - name: Inventory precompiled files and recover strings symbols arrays
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re,json,hashlib,subprocess,collections

          root=Path(os.environ["OUT"])/"sdk"
          ev=Path(os.environ["OUT"])/"evidence"

          binary_ext={
            ".a",".o",".obj",".lib",".bin",".rom",".img",".fw",".elf",".axf",
            ".out",".hex",".dat",".pack",".mva"
          }
          name_tokens=("flash","boot","upgrade","update","rom","mva","bank")
          marker_tokens=[
            b"MVA",b"mva",b"bootdat",b"codedata",b"constdat",b"cnfgdat",
            b"btupdat",b"upinfo",b"cxxx",b"CRC",b"magic",b"MAGIC",
            b"BankB",b"Upgrade",b"upgrade"
          ]

          def sh(args,timeout=8):
              try:
                  p=subprocess.run(args,capture_output=True,text=True,errors="ignore",
                                   timeout=timeout,check=False)
                  return {"rc":p.returncode,"stdout":p.stdout[-200000:],
                          "stderr":p.stderr[-20000:]}
              except Exception as e:
                  return {"rc":-999,"stdout":"","stderr":repr(e)}

          inventory=[]
          string_hits=[]
          symbol_hits=[]
          byte_hits=[]

          files=[]
          for p in sorted(root.rglob("*")):
              if not p.is_file():
                  continue
              rel=str(p.relative_to(root))
              ext=p.suffix.lower()
              lowname=p.name.lower()
              if ext in binary_ext or any(t in lowname for t in name_tokens):
                  files.append(p)

          for p in files:
              rel=str(p.relative_to(root))
              try:data=p.read_bytes()
              except Exception:continue
              typ=sh(["file","-b",str(p)],3)
              row={
                "path":rel,
                "bytes":len(data),
                "sha256":hashlib.sha256(data).hexdigest(),
                "extension":p.suffix.lower(),
                "file_type":typ["stdout"].strip(),
              }
              inventory.append(row)

              # ASCII strings; keep only update/header-relevant rows.
              sr=sh(["strings","-a","-n","4",str(p)],6)
              if sr["rc"]==0:
                  for s in sr["stdout"].splitlines():
                      low=s.lower()
                      if any(k in low for k in (
                          "mva","flash","boot","upgrade","update","bank",
                          "crc","magic","code","const","config","header"
                      )):
                          string_hits.append({"path":rel,"string":s[:500]})

              # Symbols if the host binutils understand the file.
              for tool,args in (
                ("readelf",["readelf","-Ws",str(p)]),
                ("nm",["nm","-A","-C",str(p)]),
              ):
                  rr=sh(args,8)
                  if rr["rc"]==0:
                      keep=[]
                      for ln in rr["stdout"].splitlines():
                          low=ln.lower()
                          if any(k in low for k in (
                              "mva","upgrade","flash","bankb","crc","header","magic"
                          )):
                              keep.append(ln[:1000])
                      if keep:
                          symbol_hits.append({
                            "path":rel,"tool":tool,"lines":keep[:1000]
                          })

              # Byte windows around known ASCII markers.
              for marker in marker_tokens:
                  start=0
                  count=0
                  while True:
                      idx=data.find(marker,start)
                      if idx<0: break
                      lo=max(0,idx-64); hi=min(len(data),idx+len(marker)+128)
                      byte_hits.append({
                        "path":rel,
                        "marker":marker.decode("ascii",errors="ignore"),
                        "offset":idx,
                        "offset_hex":hex(idx),
                        "window_start":lo,
                        "window_hex":data[lo:hi].hex().upper(),
                      })
                      count+=1
                      if count>=30: break
                      start=idx+1

          # Find exact source definitions/usages of flash_data and MVA/ROM APIs.
          source_hits=[]
          source_patterns=[
            "flash_data","ROM_BankBUpgradeApply","ROM_CRC16",
            "MVA_HEADER_ERR","MVA_MAGIC_ERR","MVA_BOOT_LEN_ERR",
            "MVA_CODE_LEN_ERR","MVA_CONST_LEN_ERR","MVA_CONFIG_LEN_ERR",
            "MVA_CONST_OFFSET_ERR","MVA_CONFIG_OFFEST_ERR",
            "JUDGEMENT_STANDARD","FLASH_MVA_UPDATE_START_OFFSET",
          ]
          for p in sorted(root.rglob("*")):
              if not p.is_file() or p.suffix.lower() not in {
                ".c",".h",".s",".S",".ld",".lds",".map",".txt",".md",".mk"
              }:
                  continue
              try:lines=p.read_text(errors="ignore").splitlines()
              except Exception:continue
              rel=str(p.relative_to(root))
              for i,line in enumerate(lines):
                  hit=[q for q in source_patterns if q in line]
                  if not hit: continue
                  lo=max(0,i-5); hi=min(len(lines),i+12)
                  source_hits.append({
                    "path":rel,"line":i+1,"hits":hit,
                    "context":"\n".join(f"{j+1}: {lines[j]}" for j in range(lo,hi))
                  })

          # Reconstruct large C byte arrays whose names include flash/boot/mva/update.
          arrays=[]
          arr_re=re.compile(
              r'(?is)(?:const\s+)?(?:unsigned\s+char|uint8_t|char)\s+'
              r'([A-Za-z_]\w*(?:flash|boot|mva|update|upgrade)[A-Za-z_0-9]*)'
              r'\s*\[[^\]]*\]\s*=\s*\{(.*?)\};'
          )
          num_re=re.compile(r'0x[0-9A-Fa-f]+|\b\d+\b')
          for p in sorted(root.rglob("*")):
              if not p.is_file() or p.suffix.lower() not in {".c",".h"}:
                  continue
              try:t=p.read_text(errors="ignore")
              except Exception:continue
              rel=str(p.relative_to(root))
              for m in arr_re.finditer(t):
                  vals=[]
                  for tok in num_re.findall(m.group(2)):
                      try:
                          n=int(tok,0)
                      except Exception:
                          continue
                      if 0<=n<=255: vals.append(n)
                  if len(vals)<32: continue
                  b=bytes(vals)
                  markers=[
                    x.decode("ascii",errors="ignore")
                    for x in marker_tokens if x in b
                  ]
                  arrays.append({
                    "path":rel,
                    "line":t.count("\n",0,m.start())+1,
                    "name":m.group(1),
                    "bytes":len(b),
                    "sha256":hashlib.sha256(b).hexdigest(),
                    "first128_hex":b[:128].hex().upper(),
                    "ascii_markers":markers,
                  })
                  outp=ev/f"array_{len(arrays):03d}_{re.sub(r'[^A-Za-z0-9_.-]','_',m.group(1))}.bin"
                  outp.write_bytes(b)

          # Deduplicate string hits.
          seen=set(); uniq=[]
          for r in string_hits:
              k=(r["path"],r["string"])
              if k in seen: continue
              seen.add(k); uniq.append(r)

          summary={
            "candidate_precompiled_files":len(inventory),
            "relevant_string_hits":len(uniq),
            "symbol_file_hits":len(symbol_hits),
            "raw_marker_windows":len(byte_hits),
            "source_context_hits":len(source_hits),
            "reconstructed_arrays":len(arrays),
          }

          (ev/"02_PRECOMPILED_INVENTORY.json").write_text(
              json.dumps(inventory,indent=2,ensure_ascii=False)+'\n')
          (ev/"03_RELEVANT_STRINGS.json").write_text(
              json.dumps(uniq,indent=2,ensure_ascii=False)+'\n')
          (ev/"04_SYMBOL_HITS.json").write_text(
              json.dumps(symbol_hits,indent=2,ensure_ascii=False)+'\n')
          (ev/"05_RAW_MARKER_WINDOWS.json").write_text(
              json.dumps(byte_hits,indent=2,ensure_ascii=False)+'\n')
          (ev/"06_SOURCE_CONTEXTS.json").write_text(
              json.dumps(source_hits,indent=2,ensure_ascii=False)+'\n')
          (ev/"07_RECONSTRUCTED_ARRAYS.json").write_text(
              json.dumps(arrays,indent=2,ensure_ascii=False)+'\n')
          (ev/"08_LOCAL_MINER_SUMMARY.json").write_text(
              json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY

      - name: Best-effort public GitHub code search for hidden MVA format evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess, os, urllib.parse

          out=Path(os.environ["OUT"])/"evidence"
          queries=[
            '"ROM_BankBUpgradeApply"',
            '"MVA_HEADER_ERR"',
            '"MVA_MAGIC_ERR"',
            '"MVA_BOOT_LEN_ERR"',
            '"JUDGEMENT_STANDARD" "FLASH_BOOT_EN"',
            '"FLASH_MVA_UPDATE_START_OFFSET"',
          ]
          rows=[]
          for q in queries:
              cmd=["gh","api","search/code","-X","GET",
                   "-f",f"q={q}","-f","per_page=100",
                   "-H","Accept: application/vnd.github+json"]
              try:
                  p=subprocess.run(cmd,capture_output=True,text=True,errors="ignore",
                                   timeout=30,check=False,
                                   env={**os.environ,"GH_TOKEN":os.environ["GH_TOKEN"]})
                  rec={"query":q,"rc":p.returncode,
                       "stderr":p.stderr[-3000:],"items":[]}
                  if p.returncode==0:
                      j=json.loads(p.stdout)
                      for x in j.get("items",[])[:100]:
                          rec["items"].append({
                            "name":x.get("name"),
                            "path":x.get("path"),
                            "repository":(x.get("repository") or {}).get("full_name"),
                            "html_url":x.get("html_url"),
                            "sha":x.get("sha"),
                          })
                  rows.append(rec)
              except Exception as e:
                  rows.append({"query":q,"rc":-999,"stderr":repr(e),"items":[]})
          out.joinpath("09_PUBLIC_CODE_SEARCH.json").write_text(
              json.dumps(rows,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps([
            {"query":r["query"],"rc":r["rc"],"hits":len(r["items"])}
            for r in rows
          ],indent=2))
          PY

      - name: Rank MVA header evidence and decide next gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json,re

          ev=Path(os.environ["OUT"])/"evidence"
          inv=json.loads((ev/"02_PRECOMPILED_INVENTORY.json").read_text())
          strings=json.loads((ev/"03_RELEVANT_STRINGS.json").read_text())
          symbols=json.loads((ev/"04_SYMBOL_HITS.json").read_text())
          windows=json.loads((ev/"05_RAW_MARKER_WINDOWS.json").read_text())
          arrays=json.loads((ev/"07_RECONSTRUCTED_ARRAYS.json").read_text())
          public=json.loads((ev/"09_PUBLIC_CODE_SEARCH.json").read_text())

          high=[]
          for r in strings:
              s=r["string"].lower()
              score=0
              for k,w in (
                ("mva",5),("magic",4),("header",4),("bootdat",5),
                ("codedata",5),("constdat",5),("cnfgdat",5),
                ("bankb",3),("crc",2),("upgrade",1)
              ):
                  if k in s: score+=w
              if score>=5:
                  high.append({**r,"score":score})
          high.sort(key=lambda x:(-x["score"],x["path"],x["string"]))

          public_hits=[]
          for r in public:
              for x in r.get("items",[]):
                  public_hits.append({"query":r["query"],**x})

          decision={
            "precompiled_files":len(inv),
            "high_value_local_strings":high[:500],
            "raw_marker_windows":len(windows),
            "reconstructed_arrays":arrays,
            "public_code_hits":public_hits,
            "mva_header_magic_exactly_proven":False,
            "mva_header_field_offsets_exactly_proven":False,
            "production_image_present":False,
            "production_readback_proven":False,
            "flash_allowed":False,
          }

          # We deliberately do not auto-promote arbitrary strings to "proof".
          # Exact magic/offset proof requires a parser struct, explicit field access,
          # or a real MVA sample with independently consistent parsing/CRC.
          (ev/"10_RANKED_HEADER_EVIDENCE.json").write_text(
              json.dumps(high[:500],indent=2,ensure_ascii=False)+'\n')
          (ev/"11_DECISION.json").write_text(
              json.dumps(decision,indent=2,ensure_ascii=False)+'\n')

          md=[
            "# R90 MVA ROM / FlashBoot Header Miner","",
            f"- precompiled/name-matched files: **{len(inv)}**",
            f"- ranked local header strings: **{len(high)}**",
            f"- raw marker windows: **{len(windows)}**",
            f"- reconstructed C byte arrays: **{len(arrays)}**",
            f"- public code-search hits: **{len(public_hits)}**","",
            "## Highest-value local strings",
          ]
          for r in high[:40]:
              md.append(f"- score {r['score']} `{r['path']}`: `{r['string'][:180]}`")
          md += ["","## Public source matches"]
          if public_hits:
              for x in public_hits[:50]:
                  md.append(
                    f"- `{x.get('repository')}/{x.get('path')}` via `{x.get('query')}`"
                  )
          else:
              md.append("- none returned (or GitHub code search was unavailable to this token)")

          md += [
            "","## Gate",
            "- Exact MVA magic is **NOT PROVEN** unless explicit parser/field evidence is recovered.",
            "- Exact MVA header field offsets are **NOT PROVEN**.",
            "- No board USB traffic is generated.",
            "- No erase/write/flash is performed.",
            "- `FLASH_ALLOWED=NO`",
          ]
          (ev/"12_REPORT.md").write_text("\n".join(md)+'\n')
          print(json.dumps({
            "precompiled_files":len(inv),
            "ranked_strings":len(high),
            "public_hits":len(public_hits),
            "arrays":len(arrays),
            "flash_allowed":False
          },indent=2))
          PY

      - name: Fail-closed safety audit
        shell: bash
        run: |
          set -euo pipefail
          test "$BOARD_USB_ACCESS" = "NO"
          test "$HOST_TO_DEVICE_USB" = "NO"
          test "$FLASH_ERASE_WRITE" = "NO"
          test "$FLASH_ALLOWED" = "NO"
          python3 - <<'PY'
          from pathlib import Path
          import os,json
          ev=Path(os.environ["OUT"])/"evidence"
          d=json.loads((ev/"11_DECISION.json").read_text())
          assert d["production_readback_proven"] is False
          assert d["flash_allowed"] is False
          result={
            "offline_static_only":True,
            "board_usb_access":False,
            "host_to_device_usb":False,
            "aa55":False,
            "control_0x11_live":False,
            "erase":False,
            "write":False,
            "flash_allowed":False,
          }
          (ev/"13_SAFETY_AUDIT.json").write_text(json.dumps(result,indent=2)+'\n')
          print("R90_SAFETY_AUDIT=PASS",json.dumps(result))
          PY

      - name: Build evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          cd "$OUT"
          sha256sum evidence/* > SHA256SUMS.txt
          cp SHA256SUMS.txt evidence/
          zip -9 -r R90_MVA_ROM_FLASHBOOT_HEADER_MINER.zip evidence >/dev/null
          sha256sum R90_MVA_ROM_FLASHBOOT_HEADER_MINER.zip \
            | tee R90_MVA_ROM_FLASHBOOT_HEADER_MINER.zip.sha256

      - name: Publish summary
        shell: bash
        run: |
          set -euo pipefail
          {
            cat "$OUT/evidence/12_REPORT.md"
            echo
            cat "$OUT/R90_MVA_ROM_FLASHBOOT_HEADER_MINER.zip.sha256"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload R90 evidence
        uses: actions/upload-artifact@v7
        with:
          name: R90-MVA-ROM-FLASHBOOT-HEADER-MINER
          path: |
            /tmp/r90/R90_MVA_ROM_FLASHBOOT_HEADER_MINER.zip
            /tmp/r90/R90_MVA_ROM_FLASHBOOT_HEADER_MINER.zip.sha256
            /tmp/r90/evidence/**
          if-no-files-found: error
          retention-days: 30

  diagnose-r90:
    name: Capture R90 run diagnostics
    if: ${{ always() }}
    needs: mine
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Capture exact run state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.mine.result }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r90diag
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          AUTH=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          curl -fsSL "${AUTH[@]}" \
            "$API/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" \
            -o /tmp/r90diag/jobs.json

          curl -fsSL "${AUTH[@]}" \
            "$API/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            -o /tmp/r90diag/artifacts.json

          python3 - <<'PY'
          import json,os
          from pathlib import Path
          jobs=json.loads(Path('/tmp/r90diag/jobs.json').read_text()).get('jobs',[])
          build=next((x for x in jobs if x.get('name')=='Mine ROM FlashBoot MVA header evidence / STATIC ONLY'),None)
          report={
            'run_id':os.environ.get('GITHUB_RUN_ID'),
            'run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),
            'repository':os.environ.get('GITHUB_REPOSITORY'),
            'head_sha':os.environ.get('GITHUB_SHA'),
            'ref':os.environ.get('GITHUB_REF'),
            'event':os.environ.get('GITHUB_EVENT_NAME'),
            'build_result':os.environ.get('BUILD_RESULT'),
            'build_job':build,
          }
          Path('/tmp/r90diag/summary.json').write_text(
              json.dumps(report,indent=2,ensure_ascii=False)+'\n'
          )
          if build and build.get('id'):
              Path('/tmp/r90diag/build_job_id.txt').write_text(str(build['id']))
          PY

          : > /tmp/r90diag/build-log-tail.txt
          if [ -s /tmp/r90diag/build_job_id.txt ]; then
            JOB_ID="$(cat /tmp/r90diag/build_job_id.txt)"
            set +e
            curl -fsSL "${AUTH[@]}" "$API/actions/jobs/$JOB_ID/logs" \
              -o /tmp/r90diag/build.log
            RC=$?
            set -e
            if [ "$RC" -eq 0 ]; then
              tail -n 260 /tmp/r90diag/build.log > /tmp/r90diag/build-log-tail.txt
            else
              printf 'JOB_LOG_DOWNLOAD_FAILED rc=%s\n' "$RC" > /tmp/r90diag/build-log-tail.txt
            fi
          fi

          {
            echo '# R90 LAST GITHUB ACTIONS DIAGNOSTIC'
            echo
            echo "- Run ID: \`$GITHUB_RUN_ID\`"
            echo "- Attempt: \`$GITHUB_RUN_ATTEMPT\`"
            echo "- Event: \`$GITHUB_EVENT_NAME\`"
            echo "- Ref: \`$GITHUB_REF\`"
            echo "- Head SHA: \`$GITHUB_SHA\`"
            echo "- Result: \`$BUILD_RESULT\`"
            echo
            echo '## Job / step metadata'
            echo '~~~json'
            cat /tmp/r90diag/summary.json
            echo '~~~'
            echo
            echo '## Artifacts'
            echo '~~~json'
            cat /tmp/r90diag/artifacts.json
            echo '~~~'
            echo
            echo '## Job log tail'
            echo '~~~text'
            cat /tmp/r90diag/build-log-tail.txt
            echo '~~~'
          } > /tmp/r90diag/R90_LAST_DIAGNOSTIC.md

      - name: Persist diagnostic to main with race-safe rebase
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/r90diag/R90_LAST_DIAGNOSTIC.md .github/R90_LAST_DIAGNOSTIC.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/R90_LAST_DIAGNOSTIC.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record R90 Actions diagnostic [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Upload diagnostic
        uses: actions/upload-artifact@v7
        with:
          name: R90-RUN-DIAGNOSTIC
          path: |
            /tmp/r90diag/R90_LAST_DIAGNOSTIC.md
            /tmp/r90diag/summary.json
            /tmp/r90diag/jobs.json
            /tmp/r90diag/artifacts.json
            /tmp/r90diag/build-log-tail.txt
          if-no-files-found: error
          retention-days: 30
