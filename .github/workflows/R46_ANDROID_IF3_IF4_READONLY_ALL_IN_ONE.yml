      - name: R46 hard safety gate - control IN only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYSAFE'
          from pathlib import Path
          import re
          root=Path('/tmp/r46src/r46_android_source')
          k=(root/'android_template/MainActivity.kt.in').read_text()
          d=(root/'lib/usb_readonly.dart').read_text()

          forbidden=[
              'System.loadLibrary','nativeUsbfsControlTransfer',
              'HID_SET_REPORT','USB_DIR_OUT','bulkTransfer','UsbRequest',
              'setConfiguration','setInterface','SpiFlashErase','SpiFlashWrite',
              'SaveParams','Reset_McuSystem','0x58','0x57','0x11',
          ]
          bad=[x for x in forbidden if x in k]
          if bad:
              raise SystemExit('forbidden R46 runtime token(s): '+', '.join(bad))

          required=[
              'HID_CONTROL_INTERFACE = 3',
              'RUNTIME_READ_INTERFACE = 4',
              'HID_GET_REPORT = 0x01',
              'HID_REPORT_TYPE_INPUT = 0x01',
              'HID_REPORT_TYPE_FEATURE = 0x03',
              'IF4_INPUT_BEFORE_IF3_SIGNATURE',
              'IF4_FEATURE_PUBLIC_SDK_FINGERPRINT',
              'IF3_ANDROID_SIGNATURE_A1_01_00_01_03_00_01_00',
              'IF4_INPUT_AFTER_IF3_SIGNATURE',
              'IF4_INPUT_WINDOWS_STYLE_PREFIX0_OFFSET1',
              'featurePublicSdkFingerprint',
              'public_sdk_paths_match_if3_input_alive_if4_data_zero',
              'requestHex" to "NOT_SENT"',
          ]
          for token in required:
              if token not in k:
                  raise SystemExit('missing R46 proof token: '+token)

          # Allowed native Android calls are scan/permission/descriptor/read-only R46 only.
          allowed_methods={"scanUsb","inspectHid","requestUsbPermission","ep0Semantics"}
          calls=set(re.findall(r"invoke(?:List)?Method<[^>]+>\(\s*'([^']+)'", d))
          if calls != allowed_methods:
              raise SystemExit(f'unexpected Dart native methods: {sorted(calls)}')

          # MainActivity may only issue standard/class IN control transfers.
          if 'RUNTIME_GET_REPORT_REQUEST_TYPE' not in k or 'READ_ONLY_REQUEST_TYPE' not in k:
              raise SystemExit('IN request types missing')
          if k.count('controlTransfer(') != 3:
              raise SystemExit('R46 expects GET_DESCRIPTOR + Java direct + Java offset call sites only')
          print('PASS R46 safety: no OUT/SET_REPORT/UFE/native/flash/reset; targeted IF3/IF4 control-IN only')
          PYSAFE

      - name: Validate public-SDK fingerprint fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFIX'
          setup=bytearray([0xA1,0x01,0x00,0x03,0x04,0x00,0x08,0x00])
          setup[0]=0
          assert bytes(setup).hex(' ').upper() == '00 01 00 03 04 00 08 00'
          android_sig=bytes([0xA1,0x01,0x00,0x01,0x03,0x00,0x01,0x00])
          assert android_sig.hex(' ').upper() == 'A1 01 00 01 03 00 01 00'
          print('PASS R46 fixtures: IF4 Feature echo and exact IF3 Android-signature request')
          PYFIX

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android scaffold and overlay R46 source
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          rm -rf /tmp/okn_r46_app
          flutter create --platforms=android --org com.okn.dsp --project-name okn_dsp_r46 /tmp/okn_r46_app

          rm -rf /tmp/okn_r46_app/lib /tmp/okn_r46_app/test
          cp -a "$R46_SRC/lib" /tmp/okn_r46_app/lib
          cp -a "$R46_SRC/test" /tmp/okn_r46_app/test
          cp "$R46_SRC/pubspec.yaml" /tmp/okn_r46_app/pubspec.yaml
          cp "$R46_SRC/analysis_options.yaml" /tmp/okn_r46_app/analysis_options.yaml
          cp "$R46_SRC/README_R46_TH.txt" /tmp/okn_r46_app/README_R46_TH.txt

          MAIN="$(find /tmp/okn_r46_app/android/app/src/main/kotlin -name MainActivity.kt | head -n1)"
          test -f "$MAIN"
          PKG="$(sed -n 's/^package[[:space:]]\+//p' "$MAIN" | head -n1)"
          test -n "$PKG"
          sed "s/^package __PACKAGE__$/package $PKG/" "$R46_SRC/android_template/MainActivity.kt.in" > "$MAIN"

          MANIFEST=/tmp/okn_r46_app/android/app/src/main/AndroidManifest.xml
          python3 - <<'PYMAN'
          from pathlib import Path
          p=Path('/tmp/okn_r46_app/android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          marker='    <application'
          feature='    <uses-feature android:name="android.hardware.usb.host" android:required="false" />\n'
          if marker not in s:
              raise SystemExit('AndroidManifest application marker missing')
          if 'android.hardware.usb.host' not in s:
              s=s.replace(marker,feature+marker,1)
          p.write_text(s)
          PYMAN

          grep -q 'android.hardware.usb.host' "$MANIFEST"
          grep -q 'IF3_ANDROID_SIGNATURE_A1_01_00_01_03_00_01_00' "$MAIN"
          echo "R46_APP=/tmp/okn_r46_app" >> "$GITHUB_ENV"
          echo "R46_MAIN_ACTIVITY=$MAIN" >> "$GITHUB_ENV"

      - name: Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$R46_APP"
          flutter pub get

      - name: Protocol and regression unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$R46_APP"
          flutter test

      - name: Static analysis
        shell: bash
        run: |
          set -euo pipefail
          cd "$R46_APP"
          flutter analyze

      - name: Build Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$R46_APP"
          flutter build apk --debug --target-platform android-arm64
          test -s build/app/outputs/flutter-apk/app-debug.apk

      - name: Post-build R46 safety audit
        shell: bash
        run: |
          set -euo pipefail
          K="$R46_MAIN_ACTIVITY"
          ! grep -Eq 'System\.loadLibrary|nativeUsbfsControlTransfer|HID_SET_REPORT|USB_DIR_OUT|bulkTransfer|UsbRequest|setConfiguration|setInterface|SpiFlashErase|SpiFlashWrite|SaveParams|Reset_McuSystem|0x58|0x57|0x11' "$K"
          grep -q 'HID_CONTROL_INTERFACE = 3' "$K"
          grep -q 'RUNTIME_READ_INTERFACE = 4' "$K"
          grep -q 'IF4_FEATURE_PUBLIC_SDK_FINGERPRINT' "$K"
          grep -q 'IF3_ANDROID_SIGNATURE_A1_01_00_01_03_00_01_00' "$K"
          grep -q 'IF4_INPUT_WINDOWS_STYLE_PREFIX0_OFFSET1' "$K"
          grep -q 'public_sdk_paths_match_if3_input_alive_if4_data_zero' "$K"
          echo 'PASS post-build R46: targeted IF3/IF4 read-only isolation only'

      - name: Package R46 APK and evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/r46_out
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp "$R46_APP/build/app/outputs/flutter-apk/app-debug.apk" "$OUT/OKN_DSP_R46_IF3_IF4_READONLY_debug.apk"
          cp /tmp/OKN_DSP_R46_IF3_IF4_READONLY_Source.zip "$OUT/OKN_DSP_R46_IF3_IF4_READONLY_Source.zip"
          cp "$R46_APP/README_R46_TH.txt" "$OUT/README_R46_TH.txt"
          cp "$R46_MAIN_ACTIVITY" "$OUT/MainActivity_R46_IF3_IF4_READONLY.kt"
          cat > "$OUT/R46_SAFETY_STATE.txt" <<'EOF_STATE'
          R45_1_FEATURE_PUBLIC_SDK_FINGERPRINT_OBSERVED=YES
          RUNTIME_IF4=4
          HID_CONTROL_IF3=3
          R30_SIGNATURE_REQUIRED=YES
          CONTROL_IN_ONLY=YES
          SET_REPORT=NO
          UFE_COMMANDS=NO
          CONTROL_0x11=NO
          FLASH_ERASE_PROGRAM_COMMIT=NO
          RESET=NO
          IF4_INPUT_BEFORE_IF3=YES
          IF4_FEATURE_8B_FINGERPRINT=YES
          IF3_EXACT_ANDROID_SIGNATURE_GET_REPORT=YES
          IF4_INPUT_AFTER_IF3=YES
          IF4_WINDOWS_STYLE_PREFIX0_OFFSET1=YES
          NATIVE_USBFS=NO
          EOF_STATE
          (cd "$OUT" && sha256sum * > SHA256SUMS.txt)

      - name: Upload R46 APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN_DSP_R46_IF3_IF4_READONLY_APK
          path: /tmp/r46_out/*
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        shell: bash
        run: |
          {
            echo '## R46 Android IF3 -> IF4 read-only isolation'
            echo '- Triggered by R45.1: IF4 standard EP0 alive, Feature GET_REPORT 8B exactly matches public SDK setup echo, IF4 Input still 0B'
            echo '- Tests exact IF3 A1 01 00 01 03 00 01 00 GET_REPORT Input request from public SDK IsAndroid/HID_CTL path'
            echo '- Re-checks IF4 Input before/after IF3 request and with Windows-style report-ID-zero offset buffer'
            echo '- No SET_REPORT, no UFE command, no native JNI, no flash/reset'
          } >> "$GITHUB_STEP_SUMMARY"
