name: OKN DSP V47 Auto Build

on:
  push:
    paths:
      - 'OKN_DSP_V*_Sources.zip'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-latest-version:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Find latest OKN_DSP source ZIP
        id: src
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'OKN_DSP_V*_Sources.zip' -printf '%f\n' | sort -V | tail -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "No OKN_DSP_V*_Sources.zip found in repository root."
            exit 1
          fi
          VERSION="$(echo "$ZIP_FILE" | sed -E 's/^OKN_DSP_(V[0-9]+)_Sources\.zip$/\1/')"
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $ZIP_FILE ($VERSION)"

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q "${{ steps.src.outputs.zip }}" -d buildsrc
          SRC_DIR="$(find buildsrc -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [ -z "$SRC_DIR" ] || [ ! -f "$SRC_DIR/settings.gradle" ]; then
            echo "settings.gradle not found after unzip"
            find buildsrc -maxdepth 3 -type f | sort | head -100
            exit 1
          fi
          echo "SRC_DIR=$SRC_DIR" >> "$GITHUB_ENV"

      - name: Verify packaged source SHA256
        shell: bash
        run: |
          set -euo pipefail
          cd "$SRC_DIR"
          test -f Sources/SHA256SUMS.txt
          sha256sum -c Sources/SHA256SUMS.txt

      - name: Run V47 safety preflight
        shell: bash
        run: |
          set -euo pipefail
          cd "$SRC_DIR"
          python3 Sources/validate_v38_gate.py
          python3 Sources/validate_v39_reset.py
          python3 Sources/validate_v47_bass_volume_id8_plus24.py

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Skip setup-android's legacy default package list because it includes
          # the removed SDK package named "tools" on affected runners.
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Accept Android SDK licenses automatically
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          SDK_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$SDK_STATUS" -ne 0 ]; then
            echo "sdkmanager --licenses failed with exit code $SDK_STATUS"
            exit "$SDK_STATUS"
          fi
          echo "Android SDK licenses accepted."

      - name: Install Android 35 packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --version
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Build signed Debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p "$SRC_DIR" :app:assembleDebug

      - name: Package APK and SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$SRC_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          OUT="dist/OKN_DSP_${{ steps.src.outputs.version }}-debug.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "dist/OKN_DSP_${{ steps.src.outputs.version }}-debug.apk.sha256"
          cat "dist/OKN_DSP_${{ steps.src.outputs.version }}-debug.apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: OKN_DSP_${{ steps.src.outputs.version }}_APK
          path: |
            dist/OKN_DSP_${{ steps.src.outputs.version }}-debug.apk
            dist/OKN_DSP_${{ steps.src.outputs.version }}-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
