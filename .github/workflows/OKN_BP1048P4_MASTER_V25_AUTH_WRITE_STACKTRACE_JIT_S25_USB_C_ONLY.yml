name: OKN BP1048P4 MASTER V25 AUTH WRITE STACKTRACE JIT S25 USB-C ONLY

"on":
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/OKN_BP1048P4_MASTER_V25_AUTH_WRITE_STACKTRACE_JIT_S25_USB_C_ONLY.yml'

permissions:
  contents: read

env:
  GOLOPINE_WINDOWS_URL: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-08.exe_.zip"
  EXPECTED_VENDOR_SHA256: "3ca54171c53f7badd963ffe6851b8b3e2faf8aee8ba2afcb7040990e22ae09b2"
  REQUIRED_PHONE: "Samsung Galaxy S25+"
  REQUIRED_PATH: "Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only"
  LIVE_DSP_CONNECTED: "NO"
  USB_TARGET_ACCESS: "NO"
  HOST_TO_DSP_IO: "NO"
  REAL_HID_OBJECT_ALLOWED: "NO"
  REAL_HID_CONNECT_ALLOWED: "NO"
  REAL_HID_SEND_ALLOWED: "NO"
  REAL_HID_READ_ALLOWED: "NO"
  REAL_HID_WRITE_ALLOWED: "NO"
  FEATURE_REPORT_ALLOWED: "NO"
  FLASH_ALLOWED: "NO"
  ERASE_ALLOWED: "NO"
  WRITE_ALLOWED: "NO"

jobs:
  v25-auth-write-trace:
    name: Trace exact auth write stack and capture vendor JIT offline
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Immutable safety gate
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          foreach($n in @(
            "LIVE_DSP_CONNECTED","USB_TARGET_ACCESS","HOST_TO_DSP_IO",
            "REAL_HID_OBJECT_ALLOWED","REAL_HID_CONNECT_ALLOWED",
            "REAL_HID_SEND_ALLOWED","REAL_HID_READ_ALLOWED","REAL_HID_WRITE_ALLOWED",
            "FEATURE_REPORT_ALLOWED","FLASH_ALLOWED","ERASE_ALLOWED","WRITE_ALLOWED"
          )){
            if((Get-Item "Env:$n").Value -ne "NO"){ throw "$n must stay NO" }
          }

          $root="C:\okn_v25"
          if(Test-Path $root){Remove-Item -Recurse -Force $root}
          New-Item -ItemType Directory -Force -Path `
            "$root\download","$root\pkg","$root\harness","$root\evidence","$root\out" | Out-Null

          @"
          REVISION=MASTER_V25
          TARGET=MVSilicon_BP1048P4
          MODE=OFFLINE_AUTH_WRITE_STACKTRACE_AND_VENDOR_JIT
          REQUIRED_PHONE=Samsung Galaxy S25+
          REQUIRED_PATH=Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only
          SOLDERING_REQUIRED=NO
          BOARD_MODIFICATION_REQUIRED=NO
          REAL_HARDWARE_CONTACTED=NO
          FLASH_ALLOWED=NO
          ERASE_ALLOWED=NO
          WRITE_ALLOWED=NO
          "@ | Set-Content "$root\evidence\00_SAFETY_AND_SCOPE.txt"

      - name: Acquire exact official vendor binary and pin SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v25"
          curl.exe -fL --retry 6 --retry-all-errors --retry-delay 2 `
            --connect-timeout 20 --max-time 300 `
            $env:GOLOPINE_WINDOWS_URL -o "$root\download\vendor.zip"
          if($LASTEXITCODE -ne 0){throw "vendor download failed"}
          Expand-Archive -Force "$root\download\vendor.zip" "$root\pkg"
          $exe=Get-ChildItem "$root\pkg" -Recurse -File -Filter *.exe |
            Where-Object {$_.FullName -notmatch '\\__MACOSX\\' -and $_.Name -notlike '._*'} |
            Sort-Object Length -Descending | Select-Object -First 1
          if(-not $exe){throw "vendor EXE missing"}
          Copy-Item $exe.FullName "$root\vendor.exe" -Force
          $b=[IO.File]::ReadAllBytes("$root\vendor.exe")
          if($b.Length -lt 100000 -or $b[0] -ne 0x4D -or $b[1] -ne 0x5A){throw "bad vendor PE"}
          $sha=((Get-FileHash "$root\vendor.exe" -Algorithm SHA256).Hash).ToLowerInvariant()
          if($sha -ne $env:EXPECTED_VENDOR_SHA256){throw "official vendor EXE hash changed: $sha"}
          @"
          BYTES=$($b.Length)
          SHA256=$sha
          EXPECTED_SHA256=$env:EXPECTED_VENDOR_SHA256
          EXACT_VENDOR_BINARY=YES
          ORIGINAL_BINARY_MODIFIED=NO
          "@ | Set-Content "$root\evidence\01_VENDOR_IDENTITY.txt"

      - name: Build auth write-stack probe and runtime map probe
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v25"

          @'
          using System;
          using System.IO;
          using System.Linq;
          using System.Reflection;
          using System.Reflection.Emit;
          using System.Runtime.CompilerServices;
          using System.Collections.Generic;
          using System.Threading;
          using System.Diagnostics;

          public static class CaptureSink
          {
              public static readonly object Gate=new object();
              public static readonly List<byte[]> Writes=new List<byte[]>();
              public static string OutPath;
              public static string CurrentTag="NONE";
              public static bool Enabled=false;
              public static Module VendorModule=null;

              static string Safe(string s){return (s??"").Replace("|","/").Replace("\r"," ").Replace("\n"," ");}
              static void Log(string s){lock(Gate){File.AppendAllText(OutPath,s+Environment.NewLine);}}
              public static void Init(string path,Module vendor){OutPath=path;VendorModule=vendor;}
              public static void SetTag(string tag){lock(Gate){CurrentTag=tag;}}
              public static void Clear(){lock(Gate){Writes.Clear();}}
              public static byte[][] Snapshot(){lock(Gate){return Writes.Select(x=>x==null?null:(byte[])x.Clone()).ToArray();}}
              public static void Record(byte[] b)
              {
                  if(!Enabled)return;
                  byte[] c=b==null?null:(byte[])b.Clone();
                  int wi;
                  lock(Gate){wi=Writes.Count;Writes.Add(c);}
                  string hx=c==null?"<NULL>":BitConverter.ToString(c).Replace("-","");
                  Log("WRITE|"+CurrentTag+"|"+wi+"|"+(c==null?-1:c.Length)+"|"+hx);
                  try{
                      StackTrace st=new StackTrace(false);
                      StackFrame[] fs=st.GetFrames()??new StackFrame[0];
                      for(int i=0;i<fs.Length;i++)
                      {
                          MethodBase m=fs[i].GetMethod(); if(m==null)continue;
                          int tok=0; try{tok=m.MetadataToken;}catch{}
                          int isVendor=(VendorModule!=null && Object.ReferenceEquals(m.Module,VendorModule))?1:0;
                          string typ=m.DeclaringType==null?"":m.DeclaringType.FullName;
                          string sig=""; try{sig=m.ToString();}catch{}
                          Log("FRAME|"+CurrentTag+"|"+wi+"|"+i+"|"+tok.ToString("X8")+"|"+fs[i].GetNativeOffset()+"|"+fs[i].GetILOffset()+"|"+isVendor+"|"+Safe(typ)+"|"+Safe(m.Name)+"|"+Safe(sig));
                      }
                  }catch(Exception ex){Log("STACK_ERROR|"+CurrentTag+"|"+Safe(ex.GetBaseException().Message));}
              }
          }

          class AuthWriteTrace
          {
              static string OutPath;
              static readonly string BASE_HEX="D024E38C410000004202B94C65A23F2C640C8F60E133784C7E47463A7A521056";
              static void Log(string s){File.AppendAllText(OutPath,s+Environment.NewLine);}
              static string Hex(byte[] b){return b==null?"<NULL>":BitConverter.ToString(b).Replace("-","");}
              static byte[] H(string s){byte[] b=new byte[s.Length/2];for(int i=0;i<b.Length;i++)b[i]=Convert.ToByte(s.Substring(i*2,2),16);return b;}

              static object InvokeBounded(MethodInfo m,object target,object[] args,int ms,string label)
              {
                  object result=null; Exception err=null;
                  Thread th=new Thread(delegate(){try{result=m.Invoke(target,args);}catch(Exception ex){err=ex;}});
                  th.IsBackground=true; th.Start();
                  if(!th.Join(ms)){try{th.Abort();}catch{} throw new TimeoutException(label+" timeout");}
                  if(err!=null)throw err; return result;
              }
              static void EmitDefaultReturn(ILGenerator il,Type ret)
              {
                  if(ret==typeof(void)){il.Emit(OpCodes.Ret);return;}
                  if(ret.IsValueType){LocalBuilder x=il.DeclareLocal(ret);il.Emit(OpCodes.Ldloca_S,x);il.Emit(OpCodes.Initobj,ret);il.Emit(OpCodes.Ldloc,x);il.Emit(OpCodes.Ret);return;}
                  il.Emit(OpCodes.Ldnull);il.Emit(OpCodes.Ret);
              }
              static MethodAttributes Visibility(MethodInfo m)
              {
                  MethodAttributes a=MethodAttributes.Virtual|MethodAttributes.HideBySig;
                  if(m.IsPublic)a|=MethodAttributes.Public; else if(m.IsFamily)a|=MethodAttributes.Family;
                  else if(m.IsFamilyOrAssembly)a|=MethodAttributes.FamORAssem; else if(m.IsAssembly)a|=MethodAttributes.Assembly; else a|=MethodAttributes.Private;
                  if(m.IsSpecialName)a|=MethodAttributes.SpecialName; return a;
              }
              static Type BuildCaptureStream(Type baseType)
              {
                  AssemblyName an=new AssemblyName("OKN_V25_CAPTURE_STREAM");
                  AssemblyBuilder ab=AppDomain.CurrentDomain.DefineDynamicAssembly(an,AssemblyBuilderAccess.Run);
                  ModuleBuilder mb=ab.DefineDynamicModule("main");
                  TypeBuilder tb=mb.DefineType("OKN.V25CaptureDeviceCommunicationStream",TypeAttributes.Public|TypeAttributes.Class,baseType);
                  ConstructorInfo bc=baseType.GetConstructor(BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance,null,Type.EmptyTypes,null);
                  if(bc==null)throw new Exception("DeviceCommunicationStream parameterless ctor missing");
                  ConstructorBuilder cb=tb.DefineConstructor(MethodAttributes.Public,CallingConventions.Standard,Type.EmptyTypes);
                  ILGenerator ci=cb.GetILGenerator();ci.Emit(OpCodes.Ldarg_0);ci.Emit(OpCodes.Call,bc);ci.Emit(OpCodes.Ret);
                  MethodInfo[] all=baseType.GetMethods(BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance);
                  MethodInfo[] selected=all.Where(m=>m.IsVirtual&&!m.IsFinal&&(m.IsAbstract||m.Name=="Write"||m.Name=="WriteLine"||m.Name=="ReadBytes"||m.Name=="ReadLine"||m.Name=="Connect"||m.Name=="Disconnect"))
                      .GroupBy(m=>m.ToString()).Select(g=>g.First()).ToArray();
                  foreach(MethodInfo m in selected)
                  {
                      Type[] ps=m.GetParameters().Select(x=>x.ParameterType).ToArray();
                      MethodBuilder b=tb.DefineMethod(m.Name,Visibility(m),m.ReturnType,ps);ILGenerator il=b.GetILGenerator();
                      if(m.Name=="Write"&&ps.Length==1&&ps[0]==typeof(byte[]))
                      {il.Emit(OpCodes.Ldarg_1);il.Emit(OpCodes.Call,typeof(CaptureSink).GetMethod("Record",BindingFlags.Public|BindingFlags.Static));EmitDefaultReturn(il,m.ReturnType);}
                      else EmitDefaultReturn(il,m.ReturnType);
                      tb.DefineMethodOverride(b,m);
                  }
                  return tb.CreateType();
              }
              static void SetConnected(object stream,Type baseType)
              {
                  Type et=baseType.GetNestedType("ConnectionStatus",BindingFlags.Public|BindingFlags.NonPublic);
                  if(et==null||!et.IsEnum)return;
                  object connected=Enum.Parse(et,"Connected");
                  FieldInfo f=baseType.GetFields(BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance).FirstOrDefault(x=>x.FieldType==et);
                  if(f!=null){f.SetValue(stream,connected);return;}
                  MethodInfo up=baseType.GetMethod("UpdateDeviceConnStatus",BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance);
                  if(up!=null)up.Invoke(stream,new object[]{connected});
              }
              static object NewBridge(Type baseType,Type captureType,Type bridgeType,out object stream)
              {
                  stream=Activator.CreateInstance(captureType);SetConnected(stream,baseType);
                  ConstructorInfo bc=bridgeType.GetConstructor(new[]{baseType});if(bc==null)throw new Exception("UFEcommandBridge ctor missing");
                  object bridge=bc.Invoke(new[]{stream});
                  MethodInfo req=bridgeType.GetMethod("SendDevTypeSwVersAuthenRequest",BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance);
                  if(req==null)throw new Exception("startup helper missing");
                  CaptureSink.Enabled=false;CaptureSink.Clear();InvokeBounded(req,bridge,null,1600,"STARTUP");Thread.Sleep(100);CaptureSink.Clear();
                  return bridge;
              }
              static byte[] Mutate(byte[] src,int p)
              {
                  byte[] m=(byte[])src.Clone();uint s=0x9E3779B9u^unchecked((uint)p*0x45D9F3Bu);
                  for(int k=0;k<5;k++){s=unchecked(s*1664525u+1013904223u);int bi=8+(int)(s%24u);int bit=(int)((s>>8)&7u);m[bi]^=(byte)(1<<bit);}return m;
              }
              static void RunCase(Type baseType,Type captureType,Type bridgeType,string tag,byte[] input)
              {
                  object stream;object bridge=NewBridge(baseType,captureType,bridgeType,out stream);
                  MethodInfo fbl=bridgeType.GetMethod("FBL3HEmTva",BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance);
                  if(fbl==null)throw new Exception("FBL3HEmTva missing");
                  CaptureSink.Clear();CaptureSink.SetTag(tag);CaptureSink.Enabled=true;
                  try{InvokeBounded(fbl,bridge,new object[]{stream,(byte[])input.Clone(),EventArgs.Empty},3000,"FBL_"+tag);Thread.Sleep(250);}
                  finally{CaptureSink.Enabled=false;}
                  byte[][] w=CaptureSink.Snapshot();
                  byte[] a4=w.FirstOrDefault(x=>x!=null&&x.Length==4);
                  Log("CASE|"+tag+"|INPUT|"+Hex(input));
                  Log("CASE|"+tag+"|WRITE_COUNT|"+w.Length);
                  Log("CASE|"+tag+"|AUTH4|"+(a4==null?"<NONE>":Hex(a4)));
              }
              static void Main(string[] a)
              {
                  string exe=Path.GetFullPath(a[0]);OutPath=Path.GetFullPath(a[1]);Directory.SetCurrentDirectory(Path.GetDirectoryName(exe));File.WriteAllText(OutPath,"");
                  Log("MODE=OFFLINE_AUTH_WRITE_STACKTRACE");Log("REAL_HID_OBJECT_CREATED=NO");Log("HOST_TO_DSP_IO=NO");Log("FLASH_ALLOWED=NO");
                  try{
                      AppDomain.CurrentDomain.AssemblyResolve+=(s,e)=>{string n=new AssemblyName(e.Name).Name+".dll";string p=Path.Combine(Path.GetDirectoryName(exe),n);return File.Exists(p)?Assembly.LoadFrom(p):null;};
                      Assembly asm=Assembly.LoadFile(exe);RuntimeHelpers.RunModuleConstructor(asm.ManifestModule.ModuleHandle);Log("MODULE_INITIALIZER=SUCCESS");
                      CaptureSink.Init(OutPath,asm.ManifestModule);
                      Type baseType=asm.GetType("DSTech_AudioDSP_Client.DeviceCommunicationStream",true);
                      Type bridgeType=asm.GetType("DSTech_AudioDSP_Client.UFEcommandBridge",true);
                      Type captureType=BuildCaptureStream(baseType);
                      MethodInfo fbl=bridgeType.GetMethod("FBL3HEmTva",BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance);
                      Log("FBL_TOKEN="+(fbl==null?"MISSING":fbl.MetadataToken.ToString("X8")));
                      byte[] b=H(BASE_HEX);RunCase(baseType,captureType,bridgeType,"BASELINE",b);
                      for(int p=0;p<12;p++)RunCase(baseType,captureType,bridgeType,"PROBE_"+p.ToString("D2"),Mutate(b,p));
                      Log("AUTH_WRITE_TRACE_COMPLETE=true");
                  }catch(Exception ex){Log("TOP_EXCEPTION="+ex.ToString().Replace("|","/"));}
                  Log("REAL_HID_IO=NO");Log("HOST_TO_DSP_IO=NO");Log("FLASH_ALLOWED=NO");
                  Environment.Exit(0);
              }
          }
          '@ | Set-Content "$root\harness\AuthWriteTrace.cs"

          @'
          using System;
          using System.IO;
          using System.Linq;
          using System.Reflection;
          using System.Runtime.CompilerServices;
          using System.Collections.Generic;
          using System.Threading;

          class RuntimeMapProbe
          {
              static void Main(string[] a)
              {
                  string exe=Path.GetFullPath(a[0]);string outp=Path.GetFullPath(a[1]);Directory.SetCurrentDirectory(Path.GetDirectoryName(exe));
                  var L=new List<string>();L.Add("PID="+System.Diagnostics.Process.GetCurrentProcess().Id);
                  try{
                      AppDomain.CurrentDomain.AssemblyResolve+=(s,e)=>{string n=new AssemblyName(e.Name).Name+".dll";string p=Path.Combine(Path.GetDirectoryName(exe),n);return File.Exists(p)?Assembly.LoadFrom(p):null;};
                      Assembly asm=Assembly.LoadFile(exe);RuntimeHelpers.RunModuleConstructor(asm.ManifestModule.ModuleHandle);L.Add("MODULE_INITIALIZER=SUCCESS");
                      Type[] types;try{types=asm.GetTypes();}catch(ReflectionTypeLoadException ex){types=ex.Types.Where(x=>x!=null).ToArray();}
                      foreach(Type t in types)
                      foreach(MethodInfo m in t.GetMethods(BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Static|BindingFlags.Instance|BindingFlags.DeclaredOnly))
                      {
                          if(m.ContainsGenericParameters)continue;
                          try{RuntimeHelpers.PrepareMethod(m.MethodHandle);IntPtr p=m.MethodHandle.GetFunctionPointer();L.Add("MAP|"+m.MetadataToken.ToString("X8")+"|"+p.ToInt64().ToString("X")+"|"+(t.FullName??"")+"|"+m.Name+"|"+m.ToString().Replace("|","/"));}
                          catch(Exception ex){L.Add("PREPARE_FAIL|"+m.MetadataToken.ToString("X8")+"|"+(t.FullName??"")+"|"+m.Name+"|"+ex.GetBaseException().GetType().Name);}
                      }
                      File.WriteAllLines(outp,L.ToArray());Console.WriteLine("READY");Console.Out.Flush();Thread.Sleep(60000);
                  }catch(Exception ex){L.Add("TOP_EXCEPTION="+ex.ToString());try{File.WriteAllLines(outp,L.ToArray());}catch{}}
              }
          }
          '@ | Set-Content "$root\harness\RuntimeMapProbe.cs"

          $csc="$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          if(-not(Test-Path $csc)){throw "x86 csc missing"}
          & $csc /nologo /platform:x86 /target:exe /out:"$root\harness\AuthWriteTrace.exe" "$root\harness\AuthWriteTrace.cs"
          if($LASTEXITCODE -ne 0){throw "AuthWriteTrace compile failed"}
          & $csc /nologo /platform:x86 /target:exe /out:"$root\harness\RuntimeMapProbe.exe" "$root\harness\RuntimeMapProbe.cs"
          if($LASTEXITCODE -ne 0){throw "RuntimeMapProbe compile failed"}
          @"
          AUTH_WRITE_TRACE_SHA256=$((Get-FileHash "$root\harness\AuthWriteTrace.exe" -Algorithm SHA256).Hash)
          RUNTIME_MAP_PROBE_SHA256=$((Get-FileHash "$root\harness\RuntimeMapProbe.exe" -Algorithm SHA256).Hash)
          "@ | Set-Content "$root\evidence\02_HARNESS_HASHES.txt"

      - name: Static safety audit probes
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v25"
          $s=(Get-Content "$root\harness\AuthWriteTrace.cs" -Raw)+"`n"+(Get-Content "$root\harness\RuntimeMapProbe.cs" -Raw)
          foreach($bad in @("HidD_SetOutputReport(","HidD_GetInputReport(","HidD_SetFeature(","HidD_GetFeature(","WriteFile(","ReadFile(","CreateFileW(","EntryPoint.Invoke")){
            if($s.Contains($bad)){throw "real/native HID path forbidden: $bad"}
          }
          foreach($required in @("FBL3HEmTva","StackTrace","GetNativeOffset","VendorModule","BuildCaptureStream","REAL_HID_OBJECT_CREATED=NO","FLASH_ALLOWED=NO","Environment.Exit(0)")){
            if(-not $s.Contains($required)){throw "missing V25 marker: $required"}
          }
          "V25_STATIC_SAFETY_AUDIT=PASS" | Set-Content "$root\evidence\03_STATIC_SAFETY_AUDIT.txt"

      - name: Trace exact four-byte auth write and managed vendor stack offline
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v25"
          $p=Start-Process -FilePath "$root\harness\AuthWriteTrace.exe" `
            -ArgumentList @("$root\vendor.exe","$root\evidence\04_AUTH_WRITE_STACKTRACE.txt") `
            -WorkingDirectory $root -RedirectStandardOutput "$root\evidence\04A_TRACE_STDOUT.txt" `
            -RedirectStandardError "$root\evidence\04B_TRACE_STDERR.txt" -PassThru
          if(-not $p.WaitForExit(180000)){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue;throw "auth write trace timeout"}
          if(-not(Test-Path "$root\evidence\04_AUTH_WRITE_STACKTRACE.txt")){throw "auth trace evidence missing"}
          $t=Get-Content "$root\evidence\04_AUTH_WRITE_STACKTRACE.txt" -Raw
          if($t -notmatch 'AUTH_WRITE_TRACE_COMPLETE=true'){throw "auth write trace incomplete"}
          if($t -notmatch 'CASE\|BASELINE\|AUTH4\|3A5BADF3'){throw "baseline four-byte auth write did not reproduce 3A5BADF3"}
          Get-Content "$root\evidence\04_AUTH_WRITE_STACKTRACE.txt"

      - name: Map runtime and capture JIT for exact vendor frames on auth write stack
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v25"
          python -m pip install --disable-pip-version-check --quiet capstone

          @'
          from pathlib import Path
          import ctypes,sys,re,json,struct,time,collections
          from capstone import Cs,CS_ARCH_X86,CS_MODE_32
          from capstone.x86 import X86_OP_IMM,X86_OP_MEM,X86_REG_INVALID

          pid=int(sys.argv[1]); mp=Path(sys.argv[2]); tracep=Path(sys.argv[3]); ev=Path(sys.argv[4])
          lines=tracep.read_text(errors='ignore').splitlines()
          cases={}
          writes={}
          frames=collections.defaultdict(list)
          for line in lines:
              m=re.match(r'CASE\|([^|]+)\|AUTH4\|(.*)$',line)
              if m: cases[m.group(1)]=m.group(2)
              m=re.match(r'WRITE\|([^|]+)\|(\d+)\|(-?\d+)\|(.*)$',line)
              if m:writes[(m.group(1),int(m.group(2)))]={'len':int(m.group(3)),'hex':m.group(4)}
              m=re.match(r'FRAME\|([^|]+)\|(\d+)\|(\d+)\|([0-9A-F]{8})\|(-?\d+)\|(-?\d+)\|([01])\|([^|]*)\|([^|]*)\|(.*)$',line)
              if m:
                  frames[(m.group(1),int(m.group(2)))].append({'frame_index':int(m.group(3)),'token':m.group(4),'native_offset':int(m.group(5)),'il_offset':int(m.group(6)),'vendor':m.group(7)=='1','type':m.group(8),'name':m.group(9),'signature':m.group(10)})
          auth_keys=[k for k,v in writes.items() if v['len']==4]
          token_stats={}
          occurrences=[]
          for key in auth_keys:
              tag,wi=key
              for f in frames.get(key,[]):
                  if not f['vendor']:continue
                  tok=f['token']; s=token_stats.setdefault(tok,{'token':tok,'type':f['type'],'name':f['name'],'signature':f['signature'],'cases':set(),'occurrences':0,'native_offsets':set(),'il_offsets':set()})
                  s['cases'].add(tag);s['occurrences']+=1;s['native_offsets'].add(f['native_offset']);s['il_offsets'].add(f['il_offset'])
                  occurrences.append({'tag':tag,'write_index':wi,**f})
          for s in token_stats.values():
              s['cases']=sorted(s['cases']);s['case_count']=len(s['cases']);s['native_offsets']=sorted(s['native_offsets']);s['il_offsets']=sorted(s['il_offsets'])
          stats=sorted(token_stats.values(),key=lambda x:(-x['case_count'],-x['occurrences'],x['token']))
          (ev/'05_AUTH_WRITE_VENDOR_FRAMES.json').write_text(json.dumps({'cases':cases,'auth_write_keys':auth_keys,'occurrences':occurrences,'token_stats':stats},indent=2)+'\n')

          deadline=time.time()+12
          while not mp.exists() and time.time()<deadline:time.sleep(.1)
          if not mp.exists():raise SystemExit('runtime map missing')
          rows=[]
          for line in mp.read_text(errors='ignore').splitlines():
              if not line.startswith('MAP|'):continue
              p=line.split('|',5)
              if len(p)!=6:continue
              token,ptrhex,typ,name,sig=p[1:]
              rows.append({'token':token,'entry':int(ptrhex,16),'type':typ,'name':name,'signature':sig})
          if not rows:raise SystemExit('no runtime map rows')
          bytoken={r['token']:r for r in rows}
          strict_re=re.compile(r'(firmware|flash|bootloader|recovery|erase|burn|upgrade)',re.I)
          strict=[r for r in rows if strict_re.search(r['type']+' '+r['name']+' '+r['signature'])]
          (ev/'06_STRICT_FLASH_NAME_CANDIDATES.json').write_text(json.dumps(strict,indent=2)+'\n')

          k=ctypes.WinDLL('kernel32',use_last_error=True)
          k.OpenProcess.argtypes=[ctypes.c_uint32,ctypes.c_int,ctypes.c_uint32];k.OpenProcess.restype=ctypes.c_void_p
          k.ReadProcessMemory.argtypes=[ctypes.c_void_p,ctypes.c_void_p,ctypes.c_void_p,ctypes.c_size_t,ctypes.POINTER(ctypes.c_size_t)];k.ReadProcessMemory.restype=ctypes.c_int
          k.CloseHandle.argtypes=[ctypes.c_void_p];k.CloseHandle.restype=ctypes.c_int
          h=k.OpenProcess(0x0010|0x0400,False,pid)
          if not h:raise SystemExit('OpenProcess failed '+str(ctypes.get_last_error()))
          def rpm(addr,n):
              b=(ctypes.c_ubyte*n)();got=ctypes.c_size_t();ok=k.ReadProcessMemory(h,ctypes.c_void_p(addr),ctypes.byref(b),n,ctypes.byref(got));return bool(ok),bytes(b[:got.value])
          def u32(addr):
              ok,b=rpm(addr,4);return struct.unpack('<I',b)[0] if ok and len(b)==4 else None
          def follow(addr):
              cur=addr;chain=[]
              for _ in range(16):
                  ok,b=rpm(cur,32)
                  if not ok or len(b)<2:break
                  chain.append({'addr':cur,'first16':b[:16].hex().upper()})
                  if b[0]==0xE9 and len(b)>=5:cur=cur+5+struct.unpack_from('<i',b,1)[0];continue
                  if b[0]==0xEB and len(b)>=2:cur=cur+2+struct.unpack_from('<b',b,1)[0];continue
                  if b[:2]==b'\xFF\x25' and len(b)>=6:
                      slot=struct.unpack_from('<I',b,2)[0];n=u32(slot)
                      if n:cur=n;continue
                  if b[0]==0x68 and len(b)>=6 and b[5]==0xC3:cur=struct.unpack_from('<I',b,1)[0];continue
                  if b[0]==0xB8 and len(b)>=7 and b[5:7]==b'\xFF\xE0':cur=struct.unpack_from('<I',b,1)[0];continue
                  break
              return cur,chain

          # Capture every vendor token seen on a 4-byte auth write stack, prioritizing frames common to all cases.
          targets=[s['token'] for s in stats if s['token'] in bytoken][:24]
          if '06000795' in bytoken and '06000795' not in targets:targets.insert(0,'06000795')
          md=Cs(CS_ARCH_X86,CS_MODE_32);md.detail=True
          resolved_rows=[];addr_index={};dis=[];graphs=[]
          for tok in targets:
              r=dict(bytoken[tok]);resolved,chain=follow(r['entry']);r['resolved']=resolved;r['jump_chain']=chain;resolved_rows.append(r)
              addr_index.setdefault(r['entry'],[]).append(r);addr_index.setdefault(resolved,[]).append(r)
          for r in resolved_rows:
              ok,b=rpm(r['resolved'],8192)
              if not ok or not b:continue
              lines2=[];calls=[]
              for ins in md.disasm(b,r['resolved']):
                  lines2.append(f'{ins.address:08X}: {ins.mnemonic} {ins.op_str}'.rstrip())
                  if ins.mnemonic=='call' and ins.operands:
                      target=None;op=ins.operands[0]
                      if op.type==X86_OP_IMM:target=int(op.imm)&0xffffffff
                      elif op.type==X86_OP_MEM and op.mem.base==X86_REG_INVALID and op.mem.index==X86_REG_INVALID:target=u32(int(op.mem.disp)&0xffffffff)
                      matched=[] if target is None else [{'token':x['token'],'type':x['type'],'name':x['name'],'signature':x['signature']} for x in addr_index.get(target,[])]
                      calls.append({'at':ins.address,'target':target,'matched':matched})
                  if len(lines2)>=1800:break
              dis.append('\n===== '+r['token']+' '+r['type']+'.'+r['name']+' =====\n'+'\n'.join(lines2)+'\n')
              graphs.append({'root':r,'calls':calls})
          (ev/'07_RUNTIME_METHOD_COUNT.json').write_text(json.dumps({'runtime_method_count':len(rows),'target_tokens':targets,'strict_flash_name_candidate_count':len(strict)},indent=2)+'\n')
          (ev/'08_TARGET_JIT_INDEX.json').write_text(json.dumps(resolved_rows,indent=2)+'\n')
          (ev/'09_TARGET_JIT_DISASSEMBLY.txt').write_text(''.join(dis))
          (ev/'10_TARGET_CALLGRAPH.json').write_text(json.dumps(graphs,indent=2)+'\n')
          print(json.dumps({'runtime_method_count':len(rows),'auth_write_stack_tokens':len(stats),'jit_targets':len(targets),'strict_flash_name_candidate_count':len(strict)},indent=2))
          k.CloseHandle(h)
          '@ | Set-Content "$root\analyze.py"

          $map="$root\evidence\05_RUNTIME_MAP_RAW.txt"
          $p=Start-Process -FilePath "$root\harness\RuntimeMapProbe.exe" `
            -ArgumentList @("$root\vendor.exe",$map) -WorkingDirectory $root `
            -RedirectStandardOutput "$root\evidence\05A_RUNTIME_STDOUT.txt" `
            -RedirectStandardError "$root\evidence\05B_RUNTIME_STDERR.txt" -PassThru
          $ready=$false
          for($i=0;$i -lt 180;$i++){Start-Sleep -Milliseconds 100;if(Test-Path $map){$ready=$true;break};if($p.HasExited){break}}
          if(-not $ready){if(-not $p.HasExited){Stop-Process -Id $p.Id -Force};throw "runtime map did not appear"}
          python "$root\analyze.py" $p.Id $map "$root\evidence\04_AUTH_WRITE_STACKTRACE.txt" "$root\evidence" | Tee-Object "$root\evidence\10A_ANALYZER_STDOUT.txt"
          if($LASTEXITCODE -ne 0){if(-not $p.HasExited){Stop-Process -Id $p.Id -Force};throw "runtime analyzer failed"}
          if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}

      - name: Derive V25 decision
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v25"
          @'
          from pathlib import Path
          import json,re
          ev=Path(r"C:\okn_v25\evidence")
          txt=(ev/'04_AUTH_WRITE_STACKTRACE.txt').read_text(errors='ignore')
          auth={}
          for line in txt.splitlines():
              m=re.match(r'CASE\|([^|]+)\|AUTH4\|(.*)$',line)
              if m:auth[m.group(1)]=m.group(2)
          expected=['BASELINE']+[f'PROBE_{i:02d}' for i in range(12)]
          baseline_ok=auth.get('BASELINE')=='3A5BADF3'
          valid_auth4_count=sum(bool(re.fullmatch(r'[0-9A-F]{8}',auth.get(x,''))) for x in expected)
          all_cases_have_auth4=(valid_auth4_count==len(expected))
          fr=json.loads((ev/'05_AUTH_WRITE_VENDOR_FRAMES.json').read_text())
          rt=json.loads((ev/'07_RUNTIME_METHOD_COUNT.json').read_text())
          stats=fr.get('token_stats',[])
          common=[x for x in stats if x.get('case_count')==len(expected)]
          decision={
            'revision':'MASTER-V25',
            'classification':'OFFLINE_AUTH_WRITE_STACKTRACE_JIT_NOT_FOR_FLASH_YET',
            'required_phone':'Samsung Galaxy S25+',
            'required_path':'Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only',
            'soldering_required':False,'board_modification_required':False,
            'baseline_auth_reply':auth.get('BASELINE'),'expected_baseline_reply':'3A5BADF3','baseline_reproduced':baseline_ok,
            'case_count':len(expected),'all_cases_have_four_byte_auth_reply':all_cases_have_auth4,
            'vendor_stack_token_count':len(stats),'common_vendor_stack_tokens':common,
            'runtime_method_count':rt.get('runtime_method_count'),'jit_target_tokens':rt.get('target_tokens',[]),
            'strict_flash_name_candidate_count':rt.get('strict_flash_name_candidate_count'),
            'real_hid_invoked':False,'host_to_dsp_io':False,'flash_allowed':False,'erase_allowed':False,'write_allowed':False
          }
          if baseline_ok and all_cases_have_auth4 and stats:
              decision['status']='AUTH_WRITE_PATH_STACK_AND_JIT_CAPTURED_TRACE_REPLY_PRODUCER_NEXT'
          elif baseline_ok:
              decision['status']='BASELINE_AUTH_WRITE_REPRODUCED_STACK_CAPTURE_INCOMPLETE'
          else:
              decision['status']='BASELINE_AUTH_WRITE_FAILED_STOP'
          (ev/'11_V25_DECISION.json').write_text(json.dumps(decision,indent=2)+'\n')
          md=f'''# MASTER V25 FINAL DECISION

          - Required phone: **Samsung Galaxy S25+**
          - Physical path: **USB-C cable -> DSP board USB-C port only**
          - Soldering / board modification: **NO / NO**
          - Baseline four-byte auth reply: **{decision['baseline_auth_reply']}** (expected `3A5BADF3`)
          - Test cases with 4-byte auth reply: **{valid_auth4_count} / {len(expected)}**
          - Vendor methods seen on exact auth-write stack: **{decision['vendor_stack_token_count']}**
          - Vendor methods common to all auth writes: **{len(common)}**
          - Runtime methods mapped: **{decision['runtime_method_count']}**
          - JIT targets captured from actual auth-write stack: **{len(decision['jit_target_tokens'])}**
          - Strict firmware/flash/bootloader/recovery/erase/burn/upgrade name candidates: **{decision['strict_flash_name_candidate_count']}**
          - Real HID / hardware contact: **NO / NO**
          - Flash / erase / write: **NO / NO / NO**

          Status: **{decision['status']}**

          V25 traces the exact managed vendor stack at the instant the fake transport receives the 4-byte authentication reply. It does not guess an auth helper name and does not contact hardware.
          '''
          (ev/'12_V25_FINAL_DECISION.md').write_text(md)
          print(md)
          '@ | Set-Content "$root\derive.py"
          python "$root\derive.py"
          if($LASTEXITCODE -ne 0){throw "V25 derive failed"}
          Get-Content "$root\evidence\12_V25_FINAL_DECISION.md" >> $env:GITHUB_STEP_SUMMARY

      - name: Package V25 evidence
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference="Continue"
          $root="C:\okn_v25"
          if(Test-Path "$root\evidence"){
            Copy-Item "$root\evidence\*" "$root\out\" -Force -ErrorAction SilentlyContinue
            Get-ChildItem "$root\out" -File | ForEach-Object {"$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"} | Set-Content "$root\out\SHA256SUMS.txt"
          }

      - name: Upload V25 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OKN-BP1048P4-MASTER-V25-AUTH-WRITE-STACKTRACE-JIT-S25-USB-C-EVIDENCE
          path: C:\okn_v25\out\*
          if-no-files-found: warn
          retention-days: 90

      - name: Final fail-closed assertion
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          foreach($n in @(
            "LIVE_DSP_CONNECTED","USB_TARGET_ACCESS","HOST_TO_DSP_IO",
            "REAL_HID_OBJECT_ALLOWED","REAL_HID_CONNECT_ALLOWED","REAL_HID_SEND_ALLOWED","REAL_HID_READ_ALLOWED","REAL_HID_WRITE_ALLOWED",
            "FEATURE_REPORT_ALLOWED","FLASH_ALLOWED","ERASE_ALLOWED","WRITE_ALLOWED"
          )){if((Get-Item "Env:$n").Value -ne "NO"){throw "$n changed"}}
          $d="C:\okn_v25\evidence\11_V25_DECISION.json"
          if(Test-Path $d){
            $j=Get-Content $d -Raw | ConvertFrom-Json
            if($j.real_hid_invoked -ne $false -or $j.host_to_dsp_io -ne $false){throw "hardware safety state changed"}
            if($j.flash_allowed -ne $false -or $j.erase_allowed -ne $false -or $j.write_allowed -ne $false){throw "flash safety state changed"}
            if($j.baseline_reproduced -ne $true){throw "baseline auth write not reproduced"}
          }
          "MASTER_V25_SAFETY=PASS"
          "S25_USB_C_ONLY=YES"
          "SOLDERING=NO"
          "BOARD_MODIFICATION=NO"
          "FLASH_ALLOWED=NO"
