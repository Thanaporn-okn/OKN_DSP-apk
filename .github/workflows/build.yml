name: Build Android APK V47

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: "3.24.5"
        channel: stable


    - name: Create Flutter Android Project
      run: |
        flutter create --platforms android temp_app
        cp -r lib temp_app/
        cp pubspec.yaml temp_app/


    - name: Get Packages
      run: |
        cd temp_app
        flutter pub get


    - name: Build APK
      run: |
        cd temp_app
        flutter build apk --release


    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: OKN_DSP_APK
        path: temp_app/build/app/outputs/flutter-apk/app-release.apk
