name: OKN_DSP Auto Build APK V5

on:
  push:
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Extract ZIP
      run: |
        unzip -o OKN_DSP_V3_CLEAN_BUILD.zip -d extracted
        echo "ZIP extracted"


    - name: Find Flutter Project
      run: |
        PROJECT=$(find extracted -name pubspec.yaml | head -1 | xargs dirname)

        if [ -z "$PROJECT" ]; then
          echo "No Flutter project found"
          exit 1
        fi

        echo "PROJECT=$PROJECT" >> $GITHUB_ENV
        echo "Project:"
        echo $PROJECT


    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: stable


    - name: Repair Android Project
      run: |
        cd $PROJECT

        echo "Before repair"
        ls

        rm -rf android

        flutter create .

        echo "Android regenerated"


    - name: Get Packages
      run: |
        cd $PROJECT
        flutter pub get


    - name: Check MainActivity
      run: |
        cd $PROJECT
        find android -name MainActivity.kt -o -name MainActivity.java
        grep -R "FlutterActivity" android || true


    - name: Build APK
      run: |
        cd $PROJECT
        flutter build apk --release


    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: OKN_DSP_APK_V5
        path: |
          $PROJECT/build/app/outputs/flutter-apk/app-release.apk
