name: Build Android APK V40.9

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: stable
        cache: true


    - name: Check Project
      run: |
        echo "List files"
        ls -la
        echo "Find Flutter project"
        find . -name pubspec.yaml


    - name: Flutter Doctor
      run: |
        flutter doctor -v


    - name: Flutter Pub Get
      run: |
        cd OKN_DSP_BP1048P4_V39_AUTO
        flutter pub get


    - name: Flutter Clean
      run: |
        cd OKN_DSP_BP1048P4_V39_AUTO
        flutter clean


    - name: Build APK
      run: |
        cd OKN_DSP_BP1048P4_V39_AUTO
        flutter build apk --release


    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: OKN_DSP_BP1048P4_APK
        path: OKN_DSP_BP1048P4_V39_AUTO/build/app/outputs/flutter-apk/app-release.apk
