name: Build Android APK V45

on:
  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: "3.24.5"
        channel: stable
        cache: true


    - name: Check Project
      run: |
        echo "FILES"
        ls -la
        echo "PUBSPEC"
        cat pubspec.yaml


    - name: Create Android
      run: |
        if [ ! -d android ]; then
          flutter create \
          --platforms android \
          --project-name okn_dsp_apk .
        fi


    - name: Fix Android Config
      run: |

        sed -i \
        's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/g' \
        android/app/build.gradle || true


        sed -i \
        's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 35/g' \
        android/app/build.gradle || true


        sed -i \
        's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' \
        android/app/build.gradle || true


    - name: Flutter Clean
      run: |
        flutter clean


    - name: Flutter Pub Get
      run: |
        flutter pub get


    - name: Build APK
      run: |
        flutter build apk --release


    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:

        name: OKN_DSP_BP1048P4_APK

        path: |
          build/app/outputs/flutter-apk/app-release.apk
