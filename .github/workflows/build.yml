name: Build Android APK V40.9

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: stable
        cache: true


    - name: Find Flutter Project
      run: |
        echo "Searching..."
        PROJECT=$(find . -name pubspec.yaml -exec dirname {} \; | head -1)
        echo "PROJECT=$PROJECT"
        echo "PROJECT=$PROJECT" >> $GITHUB_ENV


    - name: Flutter Doctor
      run: flutter doctor -v


    - name: Flutter Pub Get
      run: |
        cd "$PROJECT"
        flutter pub get


    - name: Flutter Clean
      run: |
        cd "$PROJECT"
        flutter clean


    - name: Build APK
      run: |
        cd "$PROJECT"
        flutter build apk --release


    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: OKN_DSP_BP1048P4_APK
        path: ${{ env.PROJECT }}/build/app/outputs/flutter-apk/app-release.apk
