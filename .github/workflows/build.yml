name: Build Android APK V41

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: "3.24.5"
        channel: stable
        cache: true


    - name: Check files
      run: |
        ls
        echo "----"
        ls lib
        echo "----"
        cat pubspec.yaml


    - name: Flutter Doctor
      run: flutter doctor -v


    - name: Flutter Pub Get
      run: flutter pub get


    - name: Flutter Clean
      run: flutter clean


    - name: Build APK
      run: flutter build apk --release


    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: OKN_DSP_BP1048P4_APK
        path: build/app/outputs/flutter-apk/app-release.apk
