name: Build Android APK ZIP AUTO FIX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Find ZIP
      run: |
        unzip -o *.zip -d project

    - name: Find Flutter Project
      run: |
        PROJECT=$(find project -name pubspec.yaml -exec dirname {} \; | head -1)
        echo "PROJECT=$PROJECT" >> $GITHUB_ENV
        echo $PROJECT

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'

    - name: Upgrade Android Embedding
      run: |
        cd $PROJECT

        mkdir -p android/app/src/main/kotlin

        sed -i 's/io.flutter.app.FlutterActivity/io.flutter.embedding.android.FlutterActivity/g' android/app/src/main/kotlin/*/*.kt || true

        sed -i '/import io.flutter.app.FlutterActivity/d' android/app/src/main/kotlin/*/*.kt || true

        sed -i 's/FlutterActivity/FlutterActivity/g' android/app/src/main/kotlin/*/*.kt || true

        flutter clean

    - name: Pub Get
      run: |
        cd $PROJECT
        flutter pub get

    - name: Build APK
      run: |
        cd $PROJECT
        flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: OKN_DSP_APK
        path: |
          $PROJECT/build/app/outputs/flutter-apk/app-release.apk
