name: OKN_DSP Auto Build APK V3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Extract ZIP
      run: |
        unzip -o OKN_DSP_V3_CLEAN_BUILD.zip -d extracted

    - name: Find Flutter Project
      run: |
        PROJECT=$(find extracted -name pubspec.yaml | head -1 | xargs dirname)
        echo "PROJECT=$PROJECT" >> $GITHUB_ENV
        echo $PROJECT

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'

    - name: Build APK
      run: |
        cd $PROJECT
        flutter pub get
        flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: OKN_DSP_APK
        path: $PROJECT/build/app/outputs/flutter-apk/app-release.apk
