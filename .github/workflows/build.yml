name: OKN_DSP Auto Build APK V5

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Find ZIP
      id: zip
      run: |
        ZIP=$(find . -name "*.zip" | head -1)
        echo "ZIP=$ZIP" >> $GITHUB_ENV

    - name: Extract ZIP
      run: |
        mkdir app
        unzip -o "$ZIP" -d app

    - name: Find Flutter Project
      run: |
        PROJECT=$(find app -name pubspec.yaml | head -1 | xargs dirname)
        echo "PROJECT=$PROJECT" >> $GITHUB_ENV
        echo $PROJECT

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'

    - name: Repair Android Project
      run: |
        cd "$PROJECT"

        echo "Repair Android"

        rm -rf android

        flutter create \
        --project-name okn_dsp_project \
        .

    - name: Get Packages
      run: |
        cd "$PROJECT"
        flutter pub get

    - name: Build APK
      run: |
        cd "$PROJECT"
        flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: OKN_DSP_APK
        path: ${{ env.PROJECT }}/build/app/outputs/flutter-apk/app-release.apk
