name: OKN_DSP Auto Build APK V3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Show files
      run: |
        ls -la

    - - name: Find ZIP
  run: |
    unzip -o OKN_DSP_V3_CLEAN_BUILD.zip -d app

    - - name: Find Flutter Project
  run: |
    PROJECT=$(find extracted -name pubspec.yaml | while read f; do
      DIR=$(dirname "$f")
      if find "$DIR/android" -name "MainActivity.kt" | grep -q .; then
        echo "$DIR"
        break
      fi
    done)

    echo "PROJECT=$PROJECT" >> $GITHUB_ENV
    echo $PROJECT

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'

    - name: Build APK
      run: |
        cd $PROJECT
        flutter pub get
        flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: OKN_DSP_APK
        path: "**/app-release.apk"
