name: R3_OKN_STOCK_READ

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-stock-read-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app
          flutter create --platforms=android --org com.okn.dsp --project-name okn_r3_stock_read app
          rm -rf app/test

      - name: Install R3 UI
        shell: bash
        run: |
          set -euo pipefail
          cat > app/lib/main.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';

          void main() => runApp(const App());

          class App extends StatelessWidget {
            const App({super.key});
            @override
            Widget build(BuildContext context) => MaterialApp(
              debugShowCheckedModeBanner: false,
              title: 'OKN R3 STOCK READ',
              theme: ThemeData(
                colorScheme: ColorScheme.fromSeed(
                  seedColor: Colors.blue,
                  brightness: Brightness.dark,
                ),
                useMaterial3: true,
              ),
              home: const Home(),
            );
          }

          class Home extends StatefulWidget {
            const Home({super.key});
            @override
            State<Home> createState() => _HomeState();
          }

          class _HomeState extends State<Home> {
            static const usb = MethodChannel('com.okn.r3/usb');
            bool connected = false;
            bool busy = false;
            String status = 'ต่อ USB-C แล้วกด CONNECT';
            String log = 'ยังไม่มี LOG';

            Future<void> connect() async {
              setState(() { busy = true; status = 'ค้นหา 6324:1719...'; });
              try {
                final r = await usb.invokeMapMethod<String, dynamic>('connect');
                setState(() {
                  connected = r?['connected'] == true;
                  status = '${r?['message'] ?? 'UNKNOWN'}';
                  log = '${r?['summary'] ?? ''}';
                });
              } on PlatformException catch (e) {
                setState(() { connected = false; status = '${e.code}: ${e.message ?? ''}'; });
              } finally {
                if (mounted) setState(() => busy = false);
              }
            }

            Future<void> readId2() async {
              if (!connected) return;
              setState(() { busy = true; status = 'READ STOCK ID 2...'; log = 'RUNNING...'; });
              try {
                final r = await usb.invokeMapMethod<String, dynamic>('readStockId2');
                setState(() {
                  status = '${r?['status'] ?? 'DONE'}';
                  log = '${r?['log'] ?? 'NO LOG'}';
                });
              } on PlatformException catch (e) {
                setState(() {
                  status = '${e.code}: ${e.message ?? ''}';
                  log = '${e.details ?? ''}';
                });
              } finally {
                if (mounted) setState(() => busy = false);
              }
            }

            Future<void> copyLog() async {
              await Clipboard.setData(ClipboardData(text: log));
              if (mounted) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('คัดลอก LOG แล้ว')),
                );
              }
            }

            @override
            Widget build(BuildContext context) => Scaffold(
              appBar: AppBar(title: const Text('OKN • R3 STOCK READ')),
              body: SafeArea(
                child: Padding(
                  padding: const EdgeInsets.all(12),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.stretch,
                    children: [
                      Card(
                        child: Padding(
                          padding: const EdgeInsets.all(12),
                          child: Text(status),
                        ),
                      ),
                      const Text(
                        'READ-ONLY • 6324:1719 • IF4 HID • Stock ID 2 • '
                        'UFE READ 0x58 / response 0x60 • ไม่มี Gain WRITE',
                        style: TextStyle(fontSize: 12),
                      ),
                      const SizedBox(height: 10),
                      Row(children: [
                        Expanded(
                          child: FilledButton.icon(
                            onPressed: busy ? null : connect,
                            icon: const Icon(Icons.usb),
                            label: const Text('CONNECT'),
                          ),
                        ),
                        const SizedBox(width: 8),
                        Expanded(
                          child: FilledButton.icon(
                            onPressed: connected && !busy ? readId2 : null,
                            icon: const Icon(Icons.search),
                            label: const Text('READ ID 2'),
                          ),
                        ),
                      ]),
                      const SizedBox(height: 8),
                      OutlinedButton.icon(
                        onPressed: busy ? null : copyLog,
                        icon: const Icon(Icons.copy),
                        label: const Text('COPY LOG'),
                      ),
                      const SizedBox(height: 8),
                      Expanded(
                        child: Container(
                          padding: const EdgeInsets.all(10),
                          decoration: BoxDecoration(
                            color: Colors.black26,
                            borderRadius: BorderRadius.circular(12),
                          ),
                          child: SingleChildScrollView(
                            child: SelectableText(
                              log,
                              style: const TextStyle(fontFamily: 'monospace', fontSize: 12),
                            ),
                          ),
                        ),
                      ),
                    ],
                  ),
                ),
              ),
            );
          }
          DART

      - name: Install native R3 USB diagnostic
        shell: bash
        run: |
          set -euo pipefail
          KDIR="app/android/app/src/main/kotlin/com/okn/dsp/okn_r3_stock_read"
          mkdir -p "$KDIR"
          cat > "$KDIR/MainActivity.kt" <<'KOTLIN'
          package com.okn.dsp.okn_r3_stock_read

          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.hardware.usb.UsbConstants
          import android.hardware.usb.UsbDevice
          import android.hardware.usb.UsbDeviceConnection
          import android.hardware.usb.UsbInterface
          import android.hardware.usb.UsbManager
          import android.os.Build
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import kotlin.concurrent.thread

          class MainActivity : FlutterActivity() {
              companion object {
                  private const val CHANNEL = "com.okn.r3/usb"
                  private const val ACTION_USB_PERMISSION = "com.okn.r3.USB_PERMISSION"
                  private const val TARGET_VID = 0x6324
                  private const val TARGET_PID = 0x1719
                  private const val TARGET_IF = 4

                  private const val UFE_READ = 0x58
                  private const val UFE_RESPONSE = 0x60
                  private const val STOCK_ID = 2

                  private const val HID_GET_REPORT = 0x01
                  private const val HID_SET_REPORT = 0x09
                  private const val REPORT_INPUT = 1
                  private const val REPORT_OUTPUT = 2
                  private const val REPORT_FEATURE = 3
              }

              private lateinit var usb: UsbManager
              private var device: UsbDevice? = null
              private var pendingConnect: MethodChannel.Result? = null
              private var receiverRegistered = false

              private val receiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context, intent: Intent) {
                      if (intent.action != ACTION_USB_PERMISSION) return
                      val d: UsbDevice? = if (Build.VERSION.SDK_INT >= 33) {
                          intent.getParcelableExtra(UsbManager.EXTRA_DEVICE, UsbDevice::class.java)
                      } else {
                          @Suppress("DEPRECATION")
                          intent.getParcelableExtra(UsbManager.EXTRA_DEVICE)
                      }
                      val granted = intent.getBooleanExtra(
                          UsbManager.EXTRA_PERMISSION_GRANTED, false
                      )
                      val result = pendingConnect
                      pendingConnect = null

                      if (!granted || d == null || !isTarget(d)) {
                          result?.error("USB_PERMISSION_DENIED", "USB permission denied or wrong device", null)
                          return
                      }
                      device = d
                      result?.success(connectMap(d))
                  }
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  usb = getSystemService(Context.USB_SERVICE) as UsbManager
                  registerUsbReceiver()
                  MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger, CHANNEL
                  ).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "connect" -> connect(result)
                          "readStockId2" -> readStockId2(result)
                          else -> result.notImplemented()
                      }
                  }
              }

              override fun cleanUpFlutterEngine(flutterEngine: FlutterEngine) {
                  try {
                      if (receiverRegistered) unregisterReceiver(receiver)
                  } catch (_: Throwable) {}
                  receiverRegistered = false
                  pendingConnect = null
                  super.cleanUpFlutterEngine(flutterEngine)
              }

              private fun registerUsbReceiver() {
                  if (receiverRegistered) return
                  val filter = IntentFilter(ACTION_USB_PERMISSION)
                  if (Build.VERSION.SDK_INT >= 33) {
                      registerReceiver(receiver, filter, Context.RECEIVER_NOT_EXPORTED)
                  } else {
                      @Suppress("DEPRECATION")
                      registerReceiver(receiver, filter)
                  }
                  receiverRegistered = true
              }

              private fun isTarget(d: UsbDevice) =
                  d.vendorId == TARGET_VID && d.productId == TARGET_PID

              private fun findTarget(): UsbDevice? =
                  usb.deviceList.values.firstOrNull { isTarget(it) }

              private fun findInterface(d: UsbDevice, id: Int): UsbInterface? {
                  for (i in 0 until d.interfaceCount) {
                      val f = d.getInterface(i)
                      if (f.id == id) return f
                  }
                  return null
              }

              private fun connectMap(d: UsbDevice): Map<String, Any> {
                  val f4 = findInterface(d, TARGET_IF)
                  val ok = f4 != null && f4.interfaceClass == UsbConstants.USB_CLASS_HID
                  return mapOf(
                      "connected" to ok,
                      "message" to if (ok) "TARGET CONNECTED • IF4 HID FOUND"
                                    else "TARGET FOUND • IF4 HID NOT FOUND",
                      "summary" to descriptorSummary(d)
                  )
              }

              private fun connect(result: MethodChannel.Result) {
                  if (pendingConnect != null) {
                      result.error("CONNECT_PENDING", "USB permission already pending", null)
                      return
                  }

                  val d = findTarget()
                  if (d == null) {
                      result.error("TARGET_NOT_FOUND", "Target USB 6324:1719 not found", null)
                      return
                  }
                  device = d

                  if (usb.hasPermission(d)) {
                      result.success(connectMap(d))
                      return
                  }

                  var flags = PendingIntent.FLAG_UPDATE_CURRENT
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      flags = flags or PendingIntent.FLAG_MUTABLE
                  }
                  val pi = PendingIntent.getBroadcast(
                      this, 3,
                      Intent(ACTION_USB_PERMISSION).setPackage(packageName),
                      flags
                  )
                  pendingConnect = result
                  usb.requestPermission(d, pi)
              }

              private fun readStockId2(result: MethodChannel.Result) {
                  thread(name = "okn-r3-stock-read") {
                      val sb = StringBuilder()
                      try {
                          val d = device ?: findTarget()
                              ?: error("Target 6324:1719 not found")
                          require(isTarget(d)) { "USB target changed" }
                          require(usb.hasPermission(d)) { "USB permission missing" }

                          sb.appendLine("R3 OKN STOCK READ-ONLY PROBE")
                          sb.appendLine("Target: %04X:%04X".format(d.vendorId, d.productId))
                          sb.appendLine(descriptorSummary(d))
                          sb.appendLine()

                          val f4 = findInterface(d, TARGET_IF) ?: error("IF4 missing")
                          require(f4.interfaceClass == UsbConstants.USB_CLASS_HID) {
                              "IF4 is not HID"
                          }

                          val c = usb.openDevice(d) ?: error("openDevice failed")
                          var claimed = false
                          try {
                              claimed = c.claimInterface(f4, true)
                              check(claimed) { "claimInterface(IF4) failed" }

                              val feature = ByteArray(8)
                              val fn = c.controlTransfer(
                                  0xA1, HID_GET_REPORT,
                                  REPORT_FEATURE shl 8, f4.id,
                                  feature, feature.size, 1000
                              )
                              sb.appendLine("FEATURE GET_REPORT IF4 n=$fn")
                              if (fn > 0) sb.appendLine("FEATURE RX: ${hex(feature, fn)}")

                              val tx = makeReadFrame()
                              sb.appendLine()
                              sb.appendLine("TX logical: ${hex(tx, 13)}")
                              sb.appendLine("Expected: A5 5A 58 08 00 00 00 02 00 00 00 04 16")

                              val wn = c.controlTransfer(
                                  0x21, HID_SET_REPORT,
                                  REPORT_OUTPUT shl 8, f4.id,
                                  tx, tx.size, 1200
                              )
                              sb.appendLine("SET_REPORT Output IF4 n=$wn")
                              sb.appendLine(
                                  if (wn == 256) "READ REQUEST ACCEPTED"
                                  else "READ REQUEST NOT ACCEPTED"
                              )

                              var found = false
                              repeat(12) { attempt ->
                                  val rx = ByteArray(256)
                                  val rn = c.controlTransfer(
                                      0xA1, HID_GET_REPORT,
                                      REPORT_INPUT shl 8, f4.id,
                                      rx, rx.size, 500
                                  )
                                  sb.appendLine(
                                      "INPUT GET_REPORT #${attempt + 1} n=$rn" +
                                      if (rn > 0) " RX=${hex(rx, rn)}" else ""
                                  )
                                  if (!found && rn > 0 && isUfe60(rx, rn)) {
                                      found = true
                                      sb.appendLine("UFE 0x60 FOUND VIA GET_REPORT")
                                      decode(rx, rn, sb)
                                  }
                                  if (attempt != 11) Thread.sleep(20)
                              }

                              if (!found) {
                                  sb.appendLine()
                                  sb.appendLine("No 0x60 via GET_REPORT; poll IF4 IN endpoints")
                                  found = pollIn(c, f4, sb)
                              }

                              if (!found) {
                                  sb.appendLine("RESULT: NO UFE 0x60 RESPONSE FOUND")
                              }
                          } finally {
                              if (claimed) {
                                  try { c.releaseInterface(f4) } catch (_: Throwable) {}
                              }
                              c.close()
                          }

                          sb.appendLine()
                          sb.appendLine("Only UFE READ 0x58 for stock ID 2 was sent.")

                          val out = sb.toString()
                          runOnUiThread {
                              result.success(mapOf(
                                  "status" to "R3 STOCK READ FINISHED",
                                  "log" to out
                              ))
                          }
                      } catch (t: Throwable) {
                          sb.appendLine()
                          sb.appendLine("ERROR: ${t.javaClass.simpleName}: ${t.message}")
                          val out = sb.toString()
                          runOnUiThread {
                              result.error(
                                  "R3_READ_FAILED",
                                  t.message ?: t.javaClass.simpleName,
                                  out
                              )
                          }
                      }
                  }
              }

              private fun makeReadFrame(): ByteArray {
                  val b = ByteArray(256)
                  b[0] = 0xA5.toByte()
                  b[1] = 0x5A
                  b[2] = UFE_READ.toByte()
                  b[3] = 0x08
                  ByteBuffer.wrap(b, 4, 8).order(ByteOrder.BIG_ENDIAN).apply {
                      putInt(STOCK_ID)
                      putShort(0)
                      putShort(4)
                  }
                  b[12] = 0x16
                  return b
              }

              private fun isUfe60(b: ByteArray, n: Int): Boolean =
                  n >= 5 &&
                  b[0] == 0xA5.toByte() &&
                  b[1] == 0x5A.toByte() &&
                  (b[2].toInt() and 0xFF) == UFE_RESPONSE

              private fun decode(b: ByteArray, n: Int, sb: StringBuilder) {
                  val payloadLen = if (n > 3) b[3].toInt() and 0xFF else 0
                  sb.appendLine("Response payloadLen=$payloadLen")
                  if (n < 12 || payloadLen < 8) return

                  val id = ByteBuffer.wrap(b, 4, 4).order(ByteOrder.BIG_ENDIAN).int
                  val off = ByteBuffer.wrap(b, 8, 2).order(ByteOrder.BIG_ENDIAN)
                      .short.toInt() and 0xFFFF
                  val len = ByteBuffer.wrap(b, 10, 2).order(ByteOrder.BIG_ENDIAN)
                      .short.toInt() and 0xFFFF
                  sb.appendLine("Decoded: id=$id offset=$off len=$len")

                  if (len == 4 && n >= 16) {
                      val raw = b.copyOfRange(12, 16)
                      val f = ByteBuffer.wrap(raw).order(ByteOrder.LITTLE_ENDIAN).float
                      val u = ByteBuffer.wrap(raw).order(ByteOrder.LITTLE_ENDIAN)
                          .int.toLong() and 0xFFFFFFFFL
                      sb.appendLine("DATA4: ${hex(raw, 4)}")
                      sb.appendLine("as float LE=$f ; as u32 LE=$u")
                  }
              }

              private fun pollIn(
                  c: UsbDeviceConnection,
                  intf: UsbInterface,
                  sb: StringBuilder
              ): Boolean {
                  var found = false
                  for (i in 0 until intf.endpointCount) {
                      val ep = intf.getEndpoint(i)
                      if (ep.direction != UsbConstants.USB_DIR_IN) continue
                      if (ep.type != UsbConstants.USB_ENDPOINT_XFER_INT &&
                          ep.type != UsbConstants.USB_ENDPOINT_XFER_BULK) continue

                      sb.appendLine(
                          "IF4 EP 0x%02X IN type=${ep.type} max=${ep.maxPacketSize}"
                              .format(ep.address)
                      )
                      repeat(4) { attempt ->
                          val rx = ByteArray(maxOf(256, ep.maxPacketSize))
                          val rn = c.bulkTransfer(ep, rx, rx.size, 250)
                          sb.appendLine(
                              "EP 0x%02X read#${attempt + 1} n=$rn"
                                  .format(ep.address) +
                              if (rn > 0) " RX=${hex(rx, rn)}" else ""
                          )
                          if (!found && rn > 0 && isUfe60(rx, rn)) {
                              found = true
                              sb.appendLine(
                                  "UFE 0x60 FOUND VIA EP 0x%02X".format(ep.address)
                              )
                              decode(rx, rn, sb)
                          }
                      }
                  }
                  return found
              }

              private fun descriptorSummary(d: UsbDevice): String {
                  val sb = StringBuilder()
                  sb.appendLine("Device interfaces=${d.interfaceCount}")
                  for (i in 0 until d.interfaceCount) {
                      val f = d.getInterface(i)
                      sb.appendLine(
                          "IF id=${f.id} class=0x%02X subclass=0x%02X protocol=0x%02X eps=${f.endpointCount}"
                              .format(f.interfaceClass, f.interfaceSubclass, f.interfaceProtocol)
                      )
                      for (e in 0 until f.endpointCount) {
                          val ep = f.getEndpoint(e)
                          sb.appendLine(
                              "  EP=0x%02X dir=%s type=%d max=${ep.maxPacketSize}"
                                  .format(
                                      ep.address,
                                      if (ep.direction == UsbConstants.USB_DIR_IN) "IN" else "OUT",
                                      ep.type
                                  )
                          )
                      }
                  }
                  return sb.toString().trimEnd()
              }

              private fun hex(b: ByteArray, n: Int): String =
                  (0 until minOf(n, b.size)).joinToString(" ") {
                      "%02X".format(b[it].toInt() and 0xFF)
                  }
          }
          KOTLIN

      - name: Enable Android USB host
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/android/app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          if 'android.hardware.usb.host' not in s:
              s = s.replace(
                  '<application',
                  '    <uses-feature android:name="android.hardware.usb.host" android:required="true" />\n\n<application',
                  1
              )
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify R3 read-only guards
        shell: bash
        run: |
          set -euo pipefail
          J="app/android/app/src/main/kotlin/com/okn/dsp/okn_r3_stock_read/MainActivity.kt"

          grep -q 'TARGET_VID = 0x6324' "$J"
          grep -q 'TARGET_PID = 0x1719' "$J"
          grep -q 'TARGET_IF = 4' "$J"
          grep -q 'UFE_READ = 0x58' "$J"
          grep -q 'UFE_RESPONSE = 0x60' "$J"
          grep -q 'STOCK_ID = 2' "$J"
          grep -q 'b\[12\] = 0x16' "$J"

          if grep -Eqi \
            'private const val UFE_WRITE|"setGain"[[:space:]]*->|putFloat\(|eraseFlash|programFlash|flashWrite|enterBootloader' \
            "$J"; then
            echo "FAIL: active write/destructive path found"
            exit 1
          fi

          echo 'PASS: exact stock UFE READ only'

      - name: Flutter analyze
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze

      - name: Build release APK
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          flutter build apk --release

      - name: Package R3 artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/app/outputs/flutter-apk/app-release.apk out/OKN_R3_STOCK_READ.apk
          sha256sum out/OKN_R3_STOCK_READ.apk | tee out/OKN_R3_STOCK_READ.apk.sha256

          cat > out/R3_STATUS.txt <<'EOF'
          R3 OKN STOCK READ-ONLY DIAGNOSTIC
          Target: 6324:1719
          IF4 HID
          Exact logical request:
          A5 5A 58 08 00 00 00 02 00 00 00 04 16

          Captures:
          - USB descriptors/interfaces/endpoints
          - IF4 Feature GET_REPORT
          - IF4 Input GET_REPORT attempts
          - IF4 IN endpoint attempts
          - UFE 0x60 response if present

          DSP parameter writes: NONE
          Gain writes: NONE
          Purpose: prove stock runtime transport before first-install work.
          EOF

      - name: Upload R3 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: R3_OKN_STOCK_READ_APK
          path: out/
          if-no-files-found: error
          retention-days: 30
