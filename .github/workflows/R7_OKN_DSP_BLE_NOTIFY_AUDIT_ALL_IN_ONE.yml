      - name: Firmware host build and unit tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S /tmp/okn-r7-work/okn-r7/firmware -B /tmp/okn-r7-work/okn-r7/firmware/build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build /tmp/okn-r7-work/okn-r7/firmware/build
          ctest --test-dir /tmp/okn-r7-work/okn-r7/firmware/build --output-on-failure

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify R7 BLE notify safety gates
        shell: bash
        run: |
          set -euo pipefail
          APP=/tmp/okn-r7-work/okn-r7/android-app/app
          BT="$APP/src/main/java/com/okn/dsp/BluetoothInspector.java"

          grep -F 'applicationId = "com.okn.dsp.r7"' "$APP/build.gradle.kts"
          grep -F '0000ab02-0000-1000-8000-00805f9b34fb' "$BT"
          grep -F '0000ab03-0000-1000-8000-00805f9b34fb' "$BT"
          grep -F '00002902-0000-1000-8000-00805f9b34fb' "$BT"
          grep -F 'current.setCharacteristicNotification(characteristic, true)' "$BT"
          grep -F 'current.writeDescriptor(cccd)' "$BT"

          if grep -RInE '\.writeCharacteristic\(|getOutputStream\(' "$APP/src/main/java"; then
            echo "Forbidden characteristic/RFCOMM write path found"
            exit 1
          fi

          if grep -RInE 'chiperas|codedata|bootdat|constdat|cnfgdat|btupdat|upinfo|SpiFlashWrite|SpiFlashErase' "$APP/src/main/java"; then
            echo "Forbidden flash/update symbol found"
            exit 1
          fi

          grep -F 'OKN_RUNTIME_USB_TX_ENABLED", "false"' "$APP/build.gradle.kts"
          grep -F 'OKN_PRODUCTION_FLASH_ENABLED", "false"' "$APP/build.gradle.kts"
          echo "R7_SAFETY_GATE=PASS"

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build OKN-DSP R7 APK
        working-directory: /tmp/okn-r7-work/okn-r7/android-app
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn-r7-work/okn-r7/android-app/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          cp "$APK" /tmp/OKN-DSP-R7-v0.1.5-notify-audit.apk
          sha256sum /tmp/OKN-DSP-R7-v0.1.5-notify-audit.apk > /tmp/OKN-DSP-R7-v0.1.5-notify-audit.apk.sha256
          sha256sum /tmp/OKN-DSP-R7-v0.1.5-source.zip > /tmp/OKN-DSP-R7-v0.1.5-source.zip.sha256

      - name: Create phone instructions
        shell: bash
        run: |
          cat > /tmp/R7_NEXT_STEPS_TH.txt <<'EOF'
          OKN-DSP R7
          1. ติดตั้ง APK บน Samsung S25+
          2. เปิด Bluetooth และ R7
          3. กดค้นหา BLE GoloPine
          4. แตะ LE-GoloPine_DSP_Amp
          5. R7 จะเปิด NOTIFY เฉพาะ AB02/AB03 ด้วย CCCD 2902
          6. รอ 30 วินาทีจน R7_NOTIFY_COMPLETE=YES
          7. ส่งบรรทัด NOTIFY AB02 / AB03 และจำนวน events กลับมา

          AB01 write = forbidden
          characteristic write = forbidden
          DSP TX = locked
          flash = locked
          EOF

      - name: Upload OKN-DSP R7 package
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-R7-BLE-NOTIFY-AUDIT
          path: |
            /tmp/OKN-DSP-R7-v0.1.5-notify-audit.apk
            /tmp/OKN-DSP-R7-v0.1.5-notify-audit.apk.sha256
            /tmp/OKN-DSP-R7-v0.1.5-source.zip
            /tmp/OKN-DSP-R7-v0.1.5-source.zip.sha256
            /tmp/R7_NEXT_STEPS_TH.txt
          if-no-files-found: error
          retention-days: 30
