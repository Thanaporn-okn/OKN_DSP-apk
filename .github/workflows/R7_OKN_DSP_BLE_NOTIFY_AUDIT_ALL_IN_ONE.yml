name: OKN-DSP R7 ALL-IN-ONE BLE AB02 AB03 Notify Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/R7_OKN_DSP_BLE_NOTIFY_AUDIT_ALL_IN_ONE.yml'

permissions:
  contents: read

env:
  FLASH_ALLOWED: 'NO'
  DSP_TX_ALLOWED: 'NO'
  AB01_WRITE_ALLOWED: 'NO'
  CHARACTERISTIC_WRITE_ALLOWED: 'NO'
  CCCD_WRITE_WHITELIST: 'AB02:2902,AB03:2902'
  NOTIFY_WHITELIST: 'AB02,AB03'
  ANDROID_HOME: '/usr/local/lib/android/sdk'
  ANDROID_SDK_ROOT: '/usr/local/lib/android/sdk'

