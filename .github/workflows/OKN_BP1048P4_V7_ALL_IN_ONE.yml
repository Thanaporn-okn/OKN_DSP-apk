    steps:
    - name: Create analysis tools and evidence directory
      shell: python
      run: |
        from pathlib import Path
        import json
        base=Path('C:\\okn-v7')
        files=json.loads('{"tools/run_capture.py": "\\"\\"\\"Bound each Windows runtime probe and retain exit/stdout/stderr, including failure.\\"\\"\\"\\nimport argparse,json,subprocess,time\\nfrom pathlib import Path\\n\\ndef run(command,directory,label,timeout=300):\\n d=Path(directory);d.mkdir(parents=True,exist_ok=True);start=time.time();p=None;timed=False;error=None;code=None\\n with (d/(label+\'.stdout.log\')).open(\'wb\') as out,(d/(label+\'.stderr.log\')).open(\'wb\') as err:\\n  try:\\n   p=subprocess.Popen(command,stdout=out,stderr=err)\\n   code=p.wait(timeout=timeout)\\n  except subprocess.TimeoutExpired:\\n   timed=True\\n   subprocess.run([\'taskkill\',\'/PID\',str(p.pid),\'/T\',\'/F\'],stdout=out,stderr=err,timeout=30,check=False)\\n   code=p.wait(timeout=30)\\n  except Exception as ex:error=repr(ex)\\n result={\'command\':command,\'exit_code\':code,\'timed_out\':timed,\'error\':error,\'seconds\':round(time.time()-start,2)}\\n (d/(label+\'.exit.json\')).write_text(json.dumps(result,indent=2)+\'\\\\n\',encoding=\'utf-8\');print(json.dumps(result))\\n return result\\nif __name__==\'__main__\':\\n parser=argparse.ArgumentParser();parser.add_argument(\'runner\');parser.add_argument(\'target\');parser.add_argument(\'evidence\');a=parser.parse_args()\\n run([a.runner,\'--necrobit-body-dump-all\',a.target,str(Path(a.evidence)/\'NECROBIT_ALL.json\')],a.evidence,\'NECROBIT\')\\n run([a.runner,\'--standalone-check\',a.target],a.evidence,\'ORIGINAL_LOAD_CHECK\',180)\\n", "tools/build_direct.py": "from pathlib import Path\\nimport subprocess,zipfile,shutil\\nimport os\\nroot=Path(__file__).resolve().parents[1]\\nsdk=Path(os.environ[\'ANDROID_HOME\']);bt=sdk/\'build-tools/35.0.0\';jar=sdk/\'platforms/android-35/android.jar\'\\nbuild=root/\'direct-build\';build.mkdir(exist_ok=True);(build/\'classes\').mkdir(exist_ok=True);(build/\'dex\').mkdir(exist_ok=True)\\napp=root/\'android/app/src/main\';log=(build/\'build.log\').open(\'w\')\\ndef run(args):\\n r=subprocess.run([str(a) for a in args],stdout=log,stderr=subprocess.STDOUT)\\n log.flush()\\n if r.returncode:raise SystemExit(\'Failed: \'+str(args[0])+\' \'+str(r.returncode))\\nrun([\'java\',\'com.sun.tools.javac.Main\',\'-source\',\'8\',\'-target\',\'8\',\'-classpath\',jar,\'-d\',build/\'classes\',*app.rglob(\'*.java\')])\\nwith zipfile.ZipFile(build/\'classes.jar\',\'w\') as z:\\n for p in (build/\'classes\').rglob(\'*.class\'):z.write(p,p.relative_to(build/\'classes\'))\\nrun([bt/\'d8\',\'--lib\',jar,\'--min-api\',\'26\',\'--output\',build/\'dex\',build/\'classes.jar\'])\\nmanifest=(app/\'AndroidManifest.xml\').read_text().replace(\'<manifest \',\'<manifest package=\\"com.okn.bp1048reader\\" \',1)\\n(build/\'AndroidManifest.xml\').write_text(manifest)\\nrun([bt/\'aapt2\',\'link\',\'-I\',jar,\'--manifest\',build/\'AndroidManifest.xml\',\'--min-sdk-version\',\'26\',\'--target-sdk-version\',\'35\',\'--version-code\',\'7\',\'--version-name\',\'7.0-diagnostic\',\'-o\',build/\'unsigned.apk\'])\\nwith zipfile.ZipFile(build/\'unsigned.apk\',\'a\') as z:\\n for p in (build/\'dex\').glob(\'*.dex\'):z.write(p,p.name)\\nrun([bt/\'zipalign\',\'-f\',\'4\',build/\'unsigned.apk\',build/\'aligned.apk\'])\\nkey=root/\'development-signing/debug.keystore\'\\nkey.parent.mkdir(parents=True,exist_ok=True)\\nif not key.exists():run([\'keytool\',\'-genkeypair\',\'-keystore\',key,\'-storepass\',\'android\',\'-keypass\',\'android\',\'-alias\',\'androiddebugkey\',\'-keyalg\',\'RSA\',\'-keysize\',\'2048\',\'-validity\',\'10000\',\'-dname\',\'CN=OKN Development,O=OKN,C=TH\'])\\nout=root/\'OKN_BP1048_Reader_V7.apk\'\\nrun([bt/\'apksigner\',\'sign\',\'--ks\',key,\'--ks-key-alias\',\'androiddebugkey\',\'--ks-pass\',\'pass:android\',\'--key-pass\',\'pass:android\',\'--out\',out,build/\'aligned.apk\'])\\nrun([bt/\'apksigner\',\'verify\',\'--verbose\',out])\\nrun([bt/\'aapt2\',\'dump\',\'badging\',out])\\nprint(\'APK built and signature verified:\',out,out.stat().st_size)\\n", "tools/analyze_phone.py": "#!/usr/bin/env python3\\n\\"\\"\\"Summarize a V7 Android JSON without ever labelling USB replies as firmware.\\"\\"\\"\\nimport argparse,json,hashlib\\nfrom pathlib import Path\\n\\ndef summarize(path):\\n raw=Path(path).read_bytes();obj=json.loads(raw)\\n if obj.get(\'schema\')!=\'okn-bp1048-reader/7\':raise ValueError(\'Expected V7 phone JSON\')\\n rows=[]\\n for snapshot in obj.get(\'snapshots\',[]):\\n  p=snapshot.get(\'runtime_probe\',{})\\n  rows.append({\'vid_hex\':snapshot.get(\'vid\'),\'pid_hex\':snapshot.get(\'pid\'),\'usb_status\':snapshot.get(\'read_status\'),\\n   \'probe_status\':p.get(\'status\',\'not_requested\'),\'blocked_reason\':p.get(\'reason\'),\\n   \'effect_version_candidate\':p.get(\'effect_version_candidate\'),\'transfers\':len(p.get(\'transfers\',[])),\\n   \'freshness_verified\':False})\\n return {\'input_sha256\':hashlib.sha256(raw).hexdigest(),\'observations\':rows,\'firmware_dump_verified\':False,\\n         \'FLASH_ALLOWED\':\'NO\',\'next_step\':\'Review descriptor and raw transfers; a version response is not a flash-memory backup.\'}\\nif __name__==\'__main__\':\\n p=argparse.ArgumentParser();p.add_argument(\'report\');p.add_argument(\'--output\');a=p.parse_args()\\n text=json.dumps(summarize(a.report),indent=2,ensure_ascii=False)\\n if a.output:Path(a.output).write_text(text+\'\\\\n\',encoding=\'utf-8\')\\n print(text)\\n", "tools/BodyAudit/BodyAudit.csproj": "<Project Sdk=\\"Microsoft.NET.Sdk\\"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net8.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable></PropertyGroup></Project>\\n", "tools/BodyAudit/Program.cs": "using System;\\nusing System.Collections.Generic;\\nusing System.IO;\\nusing System.Linq;\\nusing System.Reflection;\\nusing System.Reflection.Emit;\\nusing System.Reflection.Metadata;\\nusing System.Reflection.Metadata.Ecma335;\\nusing System.Reflection.PortableExecutable;\\nusing System.Text.Json;\\nusing System.Text.RegularExpressions;\\n\\nclass Program {\\n static readonly Dictionary<ushort,OpCode> Ops=typeof(OpCodes).GetFields(BindingFlags.Public|BindingFlags.Static)\\n    .Where(f=>f.FieldType==typeof(OpCode)).Select(f=>(OpCode)f.GetValue(null)!).GroupBy(o=>(ushort)o.Value).ToDictionary(g=>g.Key,g=>g.First());\\n static string Name(MetadataReader md,int token) {\\n  try {\\n   var h=MetadataTokens.EntityHandle(token);\\n   if(h.Kind==HandleKind.MethodDefinition) {var m=md.GetMethodDefinition((MethodDefinitionHandle)h);var t=md.GetTypeDefinition(m.GetDeclaringType());return md.GetString(t.Namespace)+\\".\\"+md.GetString(t.Name)+\\"::\\"+md.GetString(m.Name);}\\n   if(h.Kind==HandleKind.MemberReference) {var m=md.GetMemberReference((MemberReferenceHandle)h);return Name(md,MetadataTokens.GetToken(m.Parent))+\\"::\\"+md.GetString(m.Name);}\\n   if(h.Kind==HandleKind.TypeReference) {var t=md.GetTypeReference((TypeReferenceHandle)h);return md.GetString(t.Namespace)+\\".\\"+md.GetString(t.Name);}\\n   if(h.Kind==HandleKind.TypeDefinition) {var t=md.GetTypeDefinition((TypeDefinitionHandle)h);return md.GetString(t.Namespace)+\\".\\"+md.GetString(t.Name);}\\n   if(h.Kind==HandleKind.MethodSpecification)return Name(md,MetadataTokens.GetToken(md.GetMethodSpecification((MethodSpecificationHandle)h).Method));\\n  }catch { }\\n  return \\"token:0x\\"+token.ToString(\\"X8\\");\\n }\\n static (List<string> lines,List<string> calls) Decode(byte[] il,MetadataReader md) {\\n  var lines=new List<string>();var calls=new List<string>();\\n  for(int p=0;p<il.Length;) {\\n   int start=p;ushort key=il[p++];if(key==0xfe) {if(p==il.Length)throw new Exception(\\"truncated opcode\\");key=(ushort)(0xfe00|il[p++]);}\\n   if(!Ops.TryGetValue(key,out var op))throw new Exception(\\"unknown opcode\\");\\n   int n=op.OperandType switch {\\n    OperandType.InlineNone=>0,\\n    OperandType.ShortInlineBrTarget or OperandType.ShortInlineI or OperandType.ShortInlineVar=>1,\\n    OperandType.InlineVar=>2,\\n    OperandType.InlineI8 or OperandType.InlineR=>8,\\n    OperandType.InlineSwitch=>-1,\\n    _=>4\\n   };\\n   if(n==-1) {if(p+4>il.Length)throw new Exception(\\"truncated switch\\");int c=BitConverter.ToInt32(il,p);if(c<0||c>(il.Length-p-4)/4)throw new Exception(\\"invalid switch\\");n=4+4*c;}\\n   if(p+n>il.Length)throw new Exception(\\"truncated operand\\");\\n   string operand=n==0?\\"\\":Convert.ToHexString(il,p,n);\\n   if(op.OperandType is OperandType.InlineMethod or OperandType.InlineField or OperandType.InlineType or OperandType.InlineTok)operand=Name(md,BitConverter.ToInt32(il,p));\\n   if(op.OperandType==OperandType.InlineI)operand=BitConverter.ToInt32(il,p).ToString();\\n   if(op.OperandType==OperandType.ShortInlineI)operand=((sbyte)il[p]).ToString();\\n   if(op==OpCodes.Call || op==OpCodes.Callvirt) {\\n    int token=BitConverter.ToInt32(il,p);\\n    var target=MetadataTokens.EntityHandle(token);\\n    if(target.Kind==HandleKind.MethodDefinition) {\\n     var def=md.GetMethodDefinition((MethodDefinitionHandle)target);\\n     if((def.Attributes & MethodAttributes.PinvokeImpl)!=0) {\\n      var import=def.GetImport();string module=md.GetString(md.GetModuleReference(import.Module).Name);\\n      string entry=md.GetString(import.Name);\\n      if((module.Equals(\\"hid.dll\\",StringComparison.OrdinalIgnoreCase)&&entry.StartsWith(\\"HidD_\\")) ||\\n         (module.Equals(\\"kernel32.dll\\",StringComparison.OrdinalIgnoreCase)&&(entry==\\"WriteFile\\"||entry==\\"ReadFile\\")))\\n       calls.Add(module+\\"::\\"+entry);\\n     }\\n    }\\n   }\\n   lines.Add($\\"IL_{start:X4}: {op.Name} {operand}\\");p+=n;\\n  }\\n  return (lines,calls);\\n }\\n static int Main(string[] args) {\\n  string dir=args[2];Directory.CreateDirectory(dir);\\n  var records=new List<object>();int changed=0,actualHidCalls=0,errors=0,captured=0;bool valid=false;\\n  try {\\n   using var stream=File.OpenRead(args[0]);using var pe=new PEReader(stream);var md=pe.GetMetadataReader();\\n   var metadata=md.MethodDefinitions.Select(h=>{var m=md.GetMethodDefinition(h);return new {token=\\"0x\\"+MetadataTokens.GetToken(h).ToString(\\"X8\\"),name=Name(md,MetadataTokens.GetToken(h)),rva=m.RelativeVirtualAddress,attributes=m.Attributes.ToString()};}).ToList();\\n   File.WriteAllText(Path.Combine(dir,\\"METHOD_METADATA.json\\"),JsonSerializer.Serialize(metadata,new JsonSerializerOptions{WriteIndented=true}));\\n   using var doc=JsonDocument.Parse(File.ReadAllText(args[1]));\\n   var methods=doc.RootElement.GetProperty(\\"Methods\\");if(methods.ValueKind!=JsonValueKind.Array)throw new Exception(\\"Methods must be an array\\");valid=true;\\n   var text=new System.Text.StringBuilder();\\n   foreach(var row in methods.EnumerateArray()) {\\n    captured++;\\n    try {\\n     string ts=row.GetProperty(\\"Token\\").GetString()!;int token=Convert.ToInt32(ts.Replace(\\"0x\\",\\"\\",StringComparison.OrdinalIgnoreCase),16);\\n     var h=MetadataTokens.EntityHandle(token);if(h.Kind!=HandleKind.MethodDefinition)throw new Exception(\\"not a MethodDef\\");\\n     var m=md.GetMethodDefinition((MethodDefinitionHandle)h);byte[] disk=m.RelativeVirtualAddress==0?Array.Empty<byte>():pe.GetMethodBody(m.RelativeVirtualAddress).GetILBytes()!;\\n     byte[] il=Convert.FromBase64String(row.GetProperty(\\"Base64\\").GetString()!);\\n     if(row.GetProperty(\\"Length\\").GetInt32()!=il.Length)throw new Exception(\\"body length mismatch\\");\\n     var decoded=Decode(il,md);bool diff=!disk.SequenceEqual(il);if(diff)changed++;\\n     string name=Name(md,token);\\n     var hid=decoded.calls.Where(s=>Regex.IsMatch(s,@\\"::(HidD_\\\\w+|WriteFile|ReadFile)$\\")).ToList();\\n     if(diff)actualHidCalls+=hid.Count;\\n     bool candidate=Regex.IsMatch(name,\\"hid|feature|flash|upgrade|firmware|usb|write|read\\",RegexOptions.IgnoreCase)||hid.Count>0;\\n     records.Add(new {token=ts,name,bytes=il.Length,changed_from_disk=diff,hid_api_calls=hid,candidate});\\n     if(diff||candidate) {text.AppendLine($\\"=== {ts} {name} changed={diff} ===\\");foreach(var line in decoded.lines)text.AppendLine(line);}\\n    }catch(Exception ex){errors++;records.Add(new {error=ex.Message,row=row.GetRawText()});}\\n   }\\n   File.WriteAllText(Path.Combine(dir,\\"CAPTURED_METHODS.il.txt\\"),text.ToString());\\n  }catch(Exception ex){errors++;File.WriteAllText(Path.Combine(dir,\\"AUDIT_ERROR.txt\\"),ex.ToString());}\\n  var status=new {schema=\\"okn-body-audit/7\\",json_valid=valid,captured_records=captured,changed_body_records=changed,decoded_hid_calls_in_changed_bodies=actualHidCalls,errors,\\n   protocol_recovered=false,firmware_read_verified=false,FLASH_ALLOWED=\\"NO\\",note=\\"Decoded calls are evidence candidates. No boot command, flash layout or live protocol is inferred.\\"};\\n  File.WriteAllText(Path.Combine(dir,\\"BODY_AUDIT_STATUS.json\\"),JsonSerializer.Serialize(status,new JsonSerializerOptions{WriteIndented=true}));\\n  File.WriteAllText(Path.Combine(dir,\\"BODY_AUDIT_RECORDS.json\\"),JsonSerializer.Serialize(records,new JsonSerializerOptions{WriteIndented=true}));\\n  File.WriteAllText(Path.Combine(dir,\\"V7_REPORT.md\\"),$\\"# V7 runtime body audit\\\\n\\\\nJSON valid: {valid}\\\\n\\\\nCaptured records: {captured}\\\\n\\\\nBodies different from original: {changed}\\\\n\\\\nDecoded HID calls in changed bodies: {actualHidCalls}\\\\n\\\\nErrors: {errors}\\\\n\\\\nThese counts do not prove an updater protocol or firmware read. FLASH_ALLOWED=NO.\\\\n\\");\\n  Console.WriteLine(JsonSerializer.Serialize(status));return valid&&captured>0&&errors==0?0:2;\\n }\\n}\\n"}')
        for name,text in files.items():
         p=base/name
         p.parent.mkdir(parents=True,exist_ok=True)
         p.write_text(text,encoding="utf-8")

        (base/"evidence").mkdir(parents=True,exist_ok=True)
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Download hash-pinned original client and preserve sibling dependencies
      shell: pwsh
      run: |-
        $ErrorActionPreference = "Stop"
        $e = 'C:\okn-v7\evidence'
        $url = 'https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-08.exe_.zip'
        Invoke-WebRequest -Uri $url -OutFile C:\okn-v7\client.zip
        $actual = (Get-FileHash C:\okn-v7\client.zip -Algorithm SHA256).Hash.ToLower()
        "actual=$actual" | Set-Content "$e\CLIENT_PIN.txt"
        if ($actual -ne 'f14b0c4baad70a8b0d5dc3b2783819cc2ef6e1a9c6ec2adcf17f1557059edd2a') { throw 'Client hash changed' }
        Expand-Archive C:\okn-v7\client.zip C:\okn-v7\client -Force
        $targets = @(Get-ChildItem C:\okn-v7\client -Recurse -File -Filter *.exe | Where-Object { $_.Name -eq 'golopine_audio_turning_release_2026-04-08.exe' })
        if ($targets.Count -ne 1) {
         $targets = @(Get-ChildItem C:\okn-v7\client -Recurse -File -Filter *.exe | Where-Object { $_.FullName -notmatch '__MACOSX' })
         if ($targets.Count -ne 1) { throw 'Ambiguous EXE selection; inspect archive rather than select the first' }
        }
        $targets[0].FullName | Set-Content "$e\TARGET_PATH.txt"
        (Get-FileHash $targets[0].FullName -Algorithm SHA256).Hash | Set-Content "$e\TARGET_SHA256.txt"
    - name: Build pinned runtime runner
      shell: pwsh
      run: |-
        $ErrorActionPreference = 'Stop'
        $src='C:\okn-v7\krypton'
        git init $src
        if ($LASTEXITCODE -ne 0) { throw 'git init failed' }
        git -C $src remote add origin https://github.com/dawwinci/krypton-devirtualizer.git
        git -C $src fetch --depth 1 origin b5b9193c3d43b326cbe48aa2fbbdcc8317e5cce8
        if ($LASTEXITCODE -ne 0) { throw 'pinned fetch failed' }
        git -C $src checkout --detach FETCH_HEAD
        if ($LASTEXITCODE -ne 0) { throw 'checkout failed' }
        $sha=git -C $src rev-parse HEAD
        $sha | Set-Content C:\okn-v7\evidence\KRYPTON_COMMIT.txt
        if ($sha -ne 'b5b9193c3d43b326cbe48aa2fbbdcc8317e5cce8') { throw 'runner revision mismatch' }
        dotnet build "$src\Krypton.Runner\Krypton.Runner.csproj" -c Release *> C:\okn-v7\evidence\RUNNER_BUILD.log
        if ($LASTEXITCODE -ne 0) { throw 'Runner build failed; see log' }
        $runner=@(Get-ChildItem "$src\Krypton.Runner\bin\Release" -Recurse -File -Filter Krypton.Runner.exe | Where-Object { $_.FullName -notmatch '\\ref\\' })
        if ($runner.Count -ne 1) { throw 'Runner output ambiguous' }
        $runner[0].FullName | Set-Content C:\okn-v7\evidence\RUNNER_PATH.txt
    - name: Capture method bodies and record bounded original-load diagnostics
      shell: pwsh
      run: |-
        $ErrorActionPreference='Stop'
        $runner=(Get-Content C:\okn-v7\evidence\RUNNER_PATH.txt -Raw).Trim()
        $target=(Get-Content C:\okn-v7\evidence\TARGET_PATH.txt -Raw).Trim()
        python C:\okn-v7\tools\run_capture.py $runner $target C:\okn-v7\evidence
        if ($LASTEXITCODE -ne 0) { throw 'Capture wrapper failed' }
    - name: Decode IL and compare captured bodies with original bytes
      if: always()
      shell: pwsh
      run: |-
        $ErrorActionPreference='Continue'
        $target='C:\okn-v7\missing.exe'
        if (Test-Path C:\okn-v7\evidence\TARGET_PATH.txt) { $target=(Get-Content C:\okn-v7\evidence\TARGET_PATH.txt -Raw).Trim() }
        dotnet run --project C:\okn-v7\tools\BodyAudit -c Release -- $target C:\okn-v7\evidence\NECROBIT_ALL.json C:\okn-v7\evidence *> C:\okn-v7\evidence\BODY_AUDIT_RUN.log
        "$LASTEXITCODE" | Set-Content C:\okn-v7\evidence\BODY_AUDIT_EXIT.txt
        exit 0
    - name: Summarize exact outcomes without claiming flash recovery
      if: always()
      shell: python
      run: |-
        from pathlib import Path
        import json,os
        p=Path(r'C:\okn-v7\evidence');p.mkdir(parents=True,exist_ok=True)
        s={'FLASH_ALLOWED':'NO','board_connected':False,'firmware_read_verified':False,'protocol_recovered':False}
        for name in ['NECROBIT.exit.json','ORIGINAL_LOAD_CHECK.exit.json','BODY_AUDIT_STATUS.json']:
         try:s[name]=json.loads((p/name).read_text(encoding='utf-8-sig'))
         except Exception as e:s[name]={'missing_or_invalid':str(e)}
        (p/'V7_RUN_STATUS.json').write_text(json.dumps(s,indent=2)+'\n',encoding='utf-8')
        with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
         f.write('# V7 capture result\n\n```json\n'+json.dumps(s,indent=2)+'\n```\n')
         f.write('Original load check is not a reconstructed-client test. APK compilation is a separate job.\n')
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: OKN-BP1048P4-V7-RUNTIME-EVIDENCE
        path: C:\okn-v7\evidence
        if-no-files-found: error
        retention-days: 30
    - name: Mark unsuccessful capture as failed after preserving evidence
      if: always()
      shell: python
      run: |-
        from pathlib import Path
        import json
        p=Path(r'C:\okn-v7\evidence')
        s=json.loads((p/'V7_RUN_STATUS.json').read_text())
        n=s.get('NECROBIT.exit.json',{});a=s.get('BODY_AUDIT_STATUS.json',{})
        if n.get('exit_code')!=0 or n.get('timed_out') or not a.get('json_valid') or a.get('captured_records',0)==0 or a.get('errors',1):
         raise SystemExit('Capture incomplete. Download RUNTIME-EVIDENCE; this does not prevent APK job.')
        print('Capture analyzed; updater/read protocol remains UNVERIFIED.')
