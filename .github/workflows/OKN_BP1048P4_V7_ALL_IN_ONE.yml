    - name: Install exact SDK packages; retain real sdkmanager exit
      shell: bash
      run: |-
        set -euo pipefail
        mkdir -p diagnostics
        python - <<'PYSDK'
        import os, pathlib, subprocess, sys
        root=pathlib.Path(os.environ['ANDROID_HOME'])
        manager=root/'cmdline-tools/latest/bin/sdkmanager'
        if not manager.exists(): raise SystemExit('sdkmanager missing from hosted runner')
        with open('diagnostics/sdk.log','w') as out:
         r=subprocess.run([str(manager),'--licenses'],input='y\n'*200,text=True,stdout=out,stderr=subprocess.STDOUT)
         if r.returncode: raise SystemExit(r.returncode)
         r=subprocess.run([str(manager),'platforms;android-35','build-tools;35.0.0'],input='y\n'*200,text=True,stdout=out,stderr=subprocess.STDOUT)
         raise SystemExit(r.returncode)
        PYSDK
    - name: Test framing, descriptor parsing and target restrictions
      shell: bash
      run: |-
        set -euo pipefail
        mkdir -p diagnostics/classes
        javac -d diagnostics/classes android/app/src/main/java/com/okn/bp1048reader/ReadProtocol.java android/tests/ProtocolTest.java
        java -cp diagnostics/classes ProtocolTest | tee diagnostics/protocol-tests.log
    - name: Build APK and Android lint
      shell: bash
      run: |-
        set -euo pipefail
        gradle -p android --no-daemon assembleDebug lintDebug 2>&1 | tee diagnostics/android-build.log
    - name: Verify signed APK and checksum
      shell: bash
      run: |-
        set -euo pipefail
        mkdir -p deliverables
        cp android/app/build/outputs/apk/debug/app-debug.apk deliverables/OKN_BP1048_Reader_V7.apk
        "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose deliverables/OKN_BP1048_Reader_V7.apk | tee diagnostics/signature.log
        (cd deliverables && sha256sum OKN_BP1048_Reader_V7.apk > SHA256.txt)
        printf '%s\n' 'APK compiled; hardware firmware read is NOT verified.' >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v4
      with:
        name: OKN-BP1048P4-V7-APK
        path: deliverables/
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: OKN-BP1048P4-V7-ANDROID-LOGS
        path: |-
          diagnostics/
          android/app/build/reports/
        if-no-files-found: warn
  runtime:
