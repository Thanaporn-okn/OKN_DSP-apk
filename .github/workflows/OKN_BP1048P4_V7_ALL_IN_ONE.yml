name: OKN BP1048P4 V7 - APK and Runtime Evidence
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/OKN_BP1048P4_V7_ALL_IN_ONE.yml
permissions:
  contents: read
jobs:
  android:
    name: Build Android diagnostic APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.11.1
    - name: Create complete Android source
      shell: python
      run: |
        from pathlib import Path
        import json
        base=Path(".")
        files=json.loads('{"android/settings.gradle": "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\\nrootProject.name = \'OKNUSBReader\'\\ninclude \':app\'\\n", "android/build.gradle": "plugins { id \'com.android.application\' version \'8.9.2\' apply false }\\n", "android/app/build.gradle": "plugins { id \'com.android.application\' }\\nandroid {\\n namespace \'com.okn.bp1048reader\'\\n compileSdk 35\\n buildToolsVersion \'35.0.0\'\\n defaultConfig { applicationId \'com.okn.bp1048reader\'; minSdk 26; targetSdk 35; versionCode 7; versionName \'7.0-diagnostic\' }\\n compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }\\n}\\n\\ndependencies { implementation \'androidx.core:core:1.15.0\' }\\n", "android/tests/ProtocolTest.java": "import com.okn.bp1048reader.ReadProtocol;\\nimport java.util.Arrays;\\npublic class ProtocolTest {\\n static int tests=0;\\n static void check(boolean x,String name) {tests++;if(!x)throw new AssertionError(name);}\\n public static void main(String[] args) {\\n  byte[] q=ReadProtocol.versionQuery();\\n  check(q.length==256 && ReadProtocol.hex(q,5).equals(\\"A55A000016\\"),\\"fixed query\\");\\n  for(int i=5;i<q.length;i++)check(q[i]==0,\\"zero padding\\");\\n  check(!ReadProtocol.versionFrame(q,256),\\"query echo is not response\\");\\n  byte[] v={(byte)0xa5,0x5a,0,7,0x30,1,2,3,4,5,6,0x16};\\n  check(ReadProtocol.versionFrame(v,12),\\"valid frame\\");\\n  check(ReadProtocol.sdkVersion(v,12).equals(\\"1.2.3\\"),\\"version decode\\");\\n  for(int n=-1;n<12;n++)check(!ReadProtocol.versionFrame(v,n),\\"truncated response\\");\\n  v[11]=0;check(!ReadProtocol.versionFrame(v,12),\\"wrong terminator\\");\\n  byte[] desc={6,0, (byte)0xff,0x75,8,(byte)0x96,0,1,(byte)0x81,2,(byte)0x91,2};\\n  check(ReadProtocol.checkReportDescriptor(desc).equals(\\"ok\\"),\\"unnumbered 256 bytes\\");\\n  check(!ReadProtocol.checkReportDescriptor(new byte[]{(byte)0x85,1}).equals(\\"ok\\"),\\"reject report ID\\");\\n  check(!ReadProtocol.checkReportDescriptor(new byte[]{(byte)0x96,0}).equals(\\"ok\\"),\\"truncated HID item\\");\\n  check(!ReadProtocol.checkReportDescriptor(new byte[]{(byte)0xb4}).equals(\\"ok\\"),\\"stack underflow\\");\\n  byte[] raw={9,4,4,0,0,3,0,0,0,9,0x21,0x11,1,0,1,0x22,12,0};\\n  check(ReadProtocol.reportDescriptorLength(raw,4)==12,\\"HID length\\");\\n  check(ReadProtocol.reportDescriptorLength(raw,3)==-1,\\"wrong interface\\");\\n  raw[0]=0;check(ReadProtocol.reportDescriptorLength(raw,4)==-1,\\"zero descriptor length\\");\\n  check(ReadProtocol.target(6324,1719,4,3,0),\\"decimal target\\");\\n  check(!ReadProtocol.target(0x6324,0x1719,4,3,0),\\"hex confusion rejected\\");\\n  check(!ReadProtocol.target(6324,2244,4,3,0),\\"unproven recovery rejected\\");\\n  System.out.println(\\"PASS \\"+tests+\\" checks\\");\\n }\\n}\\n", "android/app/src/main/AndroidManifest.xml": "<manifest xmlns:android=\\"http://schemas.android.com/apk/res/android\\">\\n <uses-feature android:name=\\"android.hardware.usb.host\\" android:required=\\"true\\"/>\\n <application android:label=\\"OKN BP1048 Reader V7\\" android:theme=\\"@android:style/Theme.Material.NoActionBar\\" android:allowBackup=\\"false\\" android:supportsRtl=\\"true\\">\\n  <activity android:name=\\".MainActivity\\" android:exported=\\"true\\" android:configChanges=\\"orientation|screenSize\\">\\n   <intent-filter><action android:name=\\"android.intent.action.MAIN\\"/><category android:name=\\"android.intent.category.LAUNCHER\\"/></intent-filter>\\n  </activity>\\n </application>\\n</manifest>\\n", "android/app/src/main/java/com/okn/bp1048reader/MainActivity.java": "package com.okn.bp1048reader;\\n\\nimport android.app.*;\\nimport android.content.*;\\nimport android.hardware.usb.*;\\nimport android.os.*;\\nimport android.view.*;\\nimport android.widget.*;\\nimport org.json.*;\\nimport java.io.*;\\nimport java.nio.charset.StandardCharsets;\\nimport java.util.*;\\nimport java.util.concurrent.*;\\n\\npublic class MainActivity extends Activity {\\n    private UsbManager usb;\\n    private LinearLayout devices;\\n    private TextView status, detail;\\n    private final Handler handler = new Handler(Looper.getMainLooper());\\n    private final ExecutorService worker = Executors.newSingleThreadExecutor();\\n    private JSONArray events = new JSONArray(), snapshots = new JSONArray();\\n    private String topology = \\"\\", exportText;\\n    private boolean busy, active, pendingQuery;\\n    private String pendingDevice;\\n    private volatile boolean cancelled;\\n    private static final String PERMISSION = \\"com.okn.bp1048reader.USB_PERMISSION\\";\\n    private final BroadcastReceiver permissionReceiver = new BroadcastReceiver() {\\n        public void onReceive(Context c, Intent i) {\\n            String name = i.getStringExtra(\\"selected_device\\");\\n            UsbDevice d = usb.getDeviceList().get(name);\\n            if (!PERMISSION.equals(i.getAction()) || !Objects.equals(name,pendingDevice)) return;\\n            pendingDevice=null;\\n            if (d != null && usb.hasPermission(d)) capture(d,pendingQuery);\\n            else { event(\\"permission_denied_or_detached\\", name); status.setText(\\"ไม่ได้รับสิทธิ์ หรือบอร์ดถูกถอดออก กดอ่านเพื่อลองใหม่\\"); }\\n        }\\n    };\\n    private final Runnable poll = new Runnable() {\\n        public void run() { if (active) { refresh(false); handler.postDelayed(this, 1000); } }\\n    };\\n    private void put(JSONObject o, String k, Object v) {\\n        try { o.put(k, v == null ? JSONObject.NULL : v); } catch (JSONException e) { throw new IllegalStateException(e); }\\n    }\\n    private String hex(int n) { return String.format(Locale.US, \\"%04X\\", n); }\\n    private TextView label(String text, int size) {\\n        TextView t = new TextView(this); t.setText(text); t.setTextSize(size);\\n        t.setTextColor(0xffe3edf6); t.setPadding(0, 12, 0, 12); return t;\\n    }\\n    private void button(LinearLayout parent, String text, View.OnClickListener click) {\\n        Button b = new Button(this); b.setText(text); b.setAllCaps(false); b.setOnClickListener(click); parent.addView(b);\\n    }\\n    public void onCreate(Bundle state) {\\n        super.onCreate(state);\\n        usb = (UsbManager)getSystemService(USB_SERVICE);\\n        load();\\n        if (state != null) exportText = state.getString(\\"export_text\\");\\n        ScrollView scroll = new ScrollView(this);\\n        LinearLayout root = new LinearLayout(this); root.setOrientation(LinearLayout.VERTICAL);\\n        root.setPadding(28, 28, 28, 28); root.setBackgroundColor(0xff111e2d);\\n        root.setOnApplyWindowInsetsListener((v, insets) -> {\\n            v.setPadding(28, 28 + insets.getSystemWindowInsetTop(), 28, 28 + insets.getSystemWindowInsetBottom()); return insets;\\n        });\\n        scroll.addView(root); setContentView(scroll);\\n        root.addView(label(\\"OKN BP1048 Reader V7\\", 24));\\n        root.addView(label(\\"เสียบ S25+ กับบอร์ดผ่านสาย USB-C ที่ส่งข้อมูลได้ แล้วกดอ่านข้อมูลของอุปกรณ์\\\\nอ่าน USB / ตรวจเวอร์ชัน • ยังดึงไฟล์เฟิร์มแวร์เต็มไม่ได้\\", 15));\\n        status = label(\\"กำลังตรวจอุปกรณ์…\\", 16); root.addView(status);\\n        button(root, \\"ค้นหาอุปกรณ์อีกครั้ง\\", v -> refresh(true));\\n        devices = new LinearLayout(this); devices.setOrientation(LinearLayout.VERTICAL); root.addView(devices);\\n        button(root, \\"หยุดการอ่าน\\", v -> { cancelled=true; status.setText(\\"กำลังหยุด…\\"); });\\n        button(root, \\"บันทึกรายงาน JSON\\", v -> export());\\n        button(root, \\"ล้างรายงานในแอป\\", v -> new AlertDialog.Builder(this).setMessage(\\"ล้างข้อมูลที่บันทึกในแอป?\\").setNegativeButton(\\"ยกเลิก\\", null).setPositiveButton(\\"ล้าง\\", (d,w) -> {\\n            if (busy) { status.setText(\\"รออ่านข้อมูลเสร็จก่อน\\"); return; }\\n            events = new JSONArray(); snapshots = new JSONArray(); event(\\"report_cleared\\", \\"\\"); detail.setText(\\"ล้างรายงานแล้ว\\");\\n        }).show());\\n        detail = label(\\"รายงานเก็บเฉพาะข้อมูล USB และเวลา ไม่เก็บ USB serial number\\", 13); detail.setTextIsSelectable(true); root.addView(detail);\\n        IntentFilter filter = new IntentFilter(PERMISSION);\\n        androidx.core.content.ContextCompat.registerReceiver(this, permissionReceiver, filter,\\n                androidx.core.content.ContextCompat.RECEIVER_NOT_EXPORTED);\\n        event(\\"app_open\\", Build.MANUFACTURER + \\" \\" + Build.MODEL);\\n    }\\n    protected void onResume() { super.onResume(); active = true; handler.removeCallbacks(poll); handler.post(poll); }\\n    protected void onPause() { cancelled=true; active = false; handler.removeCallbacks(poll); super.onPause(); }\\n    protected void onDestroy() { cancelled=true; unregisterReceiver(permissionReceiver); worker.shutdown(); super.onDestroy(); }\\n    protected void onSaveInstanceState(Bundle state) { super.onSaveInstanceState(state); state.putString(\\"export_text\\", exportText); }\\n    private void refresh(boolean force) {\\n        try {\\n            ArrayList<UsbDevice> list = new ArrayList<>(usb.getDeviceList().values());\\n            Collections.sort(list, (a,b) -> a.getDeviceName().compareTo(b.getDeviceName()));\\n            StringBuilder key = new StringBuilder();\\n            for (UsbDevice d : list) key.append(d.getDeviceName()).append(\':\').append(d.getVendorId()).append(\':\').append(d.getProductId()).append(\';\');\\n            if (busy) return;\\n            if (!force && key.toString().equals(topology) && devices.getChildCount() > 0) return;\\n            if (!key.toString().equals(topology)) { topology = key.toString(); event(\\"usb_topology\\", topology); }\\n            devices.removeAllViews();\\n            if (list.isEmpty()) {\\n                devices.addView(label(\\"ไม่พบอุปกรณ์ USB\\\\nตรวจไฟเลี้ยงบอร์ด สายข้อมูล และการเชื่อมต่อ USB Host ของโทรศัพท์\\", 16));\\n                status.setText(\\"ยังไม่พบอุปกรณ์ — ไม่ได้แปลว่าบอร์ดไม่มีช่องทางอัปเดต\\");\\n            } else {\\n                status.setText(\\"พบ \\" + list.size() + \\" อุปกรณ์\\");\\n                for (UsbDevice d : list) {\\n                    String id = hex(d.getVendorId()) + \\":\\" + hex(d.getProductId());\\n                    boolean known = d.getVendorId() == 0x18b4 && d.getProductId() == 0x06b7;\\n                    devices.addView(label(id + (known ? \\" • ตรงกับรหัส OKN ที่เคยบันทึก\\" : \\" • ยังไม่ยืนยันว่าเป็นบอร์ด OKN\\") + \\"\\\\nInterfaces: \\" + d.getInterfaceCount(), 16));\\n                    button(devices, \\"อ่านข้อมูล \\" + id, v -> request(d,false));\\n                    if(known) button(devices,\\"อ่านเวอร์ชัน (ไม่ใช่ dump firmware)\\",v -> request(d,true));\\n                }\\n            }\\n        } catch (Exception e) { status.setText(\\"ตรวจ USB ไม่สำเร็จ: \\" + e.getClass().getSimpleName()); }\\n    }\\n    private void request(UsbDevice d, boolean query) {\\n        if (busy || pendingDevice!=null) { status.setText(\\"กำลังอ่านหรือรอสิทธิ์ USB\\"); return; }\\n        try {\\n            if (usb.hasPermission(d)) capture(d,query);\\n            else {\\n                pendingDevice=d.getDeviceName(); pendingQuery=query;\\n                Intent i = new Intent(PERMISSION).setPackage(getPackageName()).putExtra(\\"selected_device\\", d.getDeviceName());\\n                PendingIntent pi = PendingIntent.getBroadcast(this, d.getDeviceId(), i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);\\n                usb.requestPermission(d, pi);\\n                status.setText(\\"กรุณาอนุญาตการเข้าถึง USB ในหน้าต่าง Android\\");\\n            }\\n        } catch (Exception e) { pendingDevice=null; event(\\"permission_error\\", e.toString()); status.setText(\\"ขอสิทธิ์ไม่สำเร็จ: \\" + e.getMessage()); }\\n    }\\n    private JSONObject describe(UsbDevice d) {\\n        JSONObject o = new JSONObject();\\n        put(o,\\"timestamp_utc\\", java.time.Instant.now().toString());\\n        put(o,\\"vid\\",hex(d.getVendorId())); put(o,\\"pid\\",hex(d.getProductId()));\\n        put(o,\\"device_class\\",d.getDeviceClass()); put(o,\\"device_subclass\\",d.getDeviceSubclass()); put(o,\\"device_protocol\\",d.getDeviceProtocol());\\n        put(o,\\"manufacturer\\",d.getManufacturerName()); put(o,\\"product\\",d.getProductName()); put(o,\\"usb_device_version\\",d.getVersion());\\n        put(o,\\"version_note\\",\\"USB bcdDevice string; not verified firmware version\\");\\n        JSONArray configs = new JSONArray();\\n        for(int c=0;c<d.getConfigurationCount();c++) {\\n            UsbConfiguration cfg=d.getConfiguration(c); JSONObject co=new JSONObject();\\n            put(co,\\"id\\",cfg.getId()); put(co,\\"max_power_ma\\",cfg.getMaxPower()); put(co,\\"self_powered\\",cfg.isSelfPowered());\\n            JSONArray interfaces=new JSONArray();\\n            for(int n=0;n<cfg.getInterfaceCount();n++) {\\n                UsbInterface it=cfg.getInterface(n); JSONObject io=new JSONObject();\\n                put(io,\\"id\\",it.getId()); put(io,\\"alternate_setting\\",it.getAlternateSetting());\\n                put(io,\\"class\\",it.getInterfaceClass()); put(io,\\"subclass\\",it.getInterfaceSubclass()); put(io,\\"protocol\\",it.getInterfaceProtocol());\\n                JSONArray eps=new JSONArray();\\n                for(int j=0;j<it.getEndpointCount();j++) {\\n                    UsbEndpoint ep=it.getEndpoint(j); JSONObject eo=new JSONObject();\\n                    put(eo,\\"address\\",ep.getAddress()); put(eo,\\"direction\\",ep.getDirection()==UsbConstants.USB_DIR_IN?\\"IN\\":\\"OUT\\");\\n                    put(eo,\\"type\\",ep.getType()); put(eo,\\"max_packet_size\\",ep.getMaxPacketSize()); put(eo,\\"interval\\",ep.getInterval()); eps.put(eo);\\n                }\\n                put(io,\\"endpoints\\",eps); interfaces.put(io);\\n            }\\n            put(co,\\"interfaces\\",interfaces); configs.put(co);\\n        }\\n        put(o,\\"configurations\\",configs); return o;\\n    }\\n    private void capture(UsbDevice d, boolean query) {\\n        if (busy) return;\\n        busy=true; cancelled=false; status.setText(\\"กำลังอ่าน USB descriptors…\\");\\n        worker.execute(() -> {\\n            JSONObject result=new JSONObject(); UsbDeviceConnection conn=null;\\n            try {\\n                result=describe(d);\\n                if (!usb.hasPermission(d)) throw new IOException(\\"USB permission missing\\");\\n                conn=usb.openDevice(d);\\n                if(conn==null) throw new IOException(\\"เปิดอุปกรณ์ไม่สำเร็จ หรือถูกถอดออก\\");\\n                byte[] raw=conn.getRawDescriptors();\\n                if(raw==null || raw.length==0) throw new IOException(\\"ไม่มี raw descriptors\\");\\n                StringBuilder h=new StringBuilder(); for(byte b:raw) h.append(String.format(Locale.US,\\"%02X\\", b & 255));\\n                put(result,\\"raw_descriptors_hex\\",h.toString()); put(result,\\"raw_descriptors_bytes\\",raw.length);\\n                put(result,\\"read_status\\",\\"ok\\");\\n                if(query) readVersion(d,conn,raw,result);\\n            } catch(Exception e) { put(result,\\"read_status\\",\\"error\\"); put(result,\\"error\\",e.toString()); }\\n            finally { if(conn!=null) conn.close(); }\\n            final JSONObject saved=result;\\n            handler.post(() -> {\\n                busy=false;\\n                snapshots.put(saved); snapshots=tail(snapshots,32); persist();\\n                if(isDestroyed()) return;\\n                status.setText(\\"ok\\".equals(saved.optString(\\"read_status\\")) ? \\"อ่านข้อมูลแล้ว กดบันทึกรายงาน JSON\\" : \\"อ่านไม่ครบ ดูรายละเอียดในรายงาน\\");\\n                try { detail.setText(saved.toString(2)); } catch(JSONException e) { detail.setText(saved.toString()); }\\n            });\\n        });\\n    }\\n    private void readVersion(UsbDevice d,UsbDeviceConnection conn,byte[] raw,JSONObject result) throws Exception {\\n        JSONObject probe=new JSONObject();put(result,\\"runtime_probe\\",probe);\\n        put(probe,\\"status\\",\\"blocked\\");put(probe,\\"firmware_dump\\",false);\\n        UsbInterface selected=null;\\n        for(int i=0;i<d.getInterfaceCount();i++) {\\n            UsbInterface it=d.getInterface(i);\\n            if(ReadProtocol.target(d.getVendorId(),d.getProductId(),it.getId(),it.getInterfaceClass(),it.getAlternateSetting())) selected=it;\\n        }\\n        if(selected==null) {put(probe,\\"reason\\",\\"target_interface_mismatch\\");return;}\\n        int length=ReadProtocol.reportDescriptorLength(raw,4);\\n        put(probe,\\"descriptor_expected_bytes\\",length);\\n        if(length<=0 || length>4096) {put(probe,\\"reason\\",\\"missing_or_invalid_HID_descriptor_length\\");return;}\\n        boolean claimed=false;\\n        try {\\n            if(cancelled) {put(probe,\\"status\\",\\"cancelled\\");return;}\\n            claimed=conn.claimInterface(selected,false);\\n            if(!claimed) {put(probe,\\"reason\\",\\"interface_busy_no_force_detach\\");return;}\\n            byte[] descriptor=new byte[length];\\n            int dn=conn.controlTransfer(0x81,0x06,0x2200,4,descriptor,length,700);\\n            put(probe,\\"report_descriptor_return\\",dn);put(probe,\\"report_descriptor_hex\\",ReadProtocol.hex(descriptor,dn));\\n            if(dn!=length) {put(probe,\\"reason\\",\\"report_descriptor_short_or_failed\\");return;}\\n            String check=ReadProtocol.checkReportDescriptor(descriptor);put(probe,\\"descriptor_check\\",check);\\n            if(!\\"ok\\".equals(check)) {put(probe,\\"reason\\",check);return;}\\n            if(cancelled) {put(probe,\\"status\\",\\"cancelled\\");return;}\\n            JSONArray transfers=new JSONArray();put(probe,\\"transfers\\",transfers);\\n            byte[] baseline=new byte[256];int bn=conn.controlTransfer(0xa1,1,0x0100,4,baseline,256,350);\\n            transfers.put(transfer(\\"baseline_get_input\\",0xa1,1,0x0100,baseline,bn));\\n            if(cancelled) {put(probe,\\"status\\",\\"cancelled\\");return;}\\n            byte[] tx=ReadProtocol.versionQuery();\\n            int sent=conn.controlTransfer(0x21,9,0x0200,4,tx,256,700);\\n            transfers.put(transfer(\\"version_set_output\\",0x21,9,0x0200,tx,sent));\\n            if(sent!=256) {put(probe,\\"status\\",\\"query_transfer_failed\\");return;}\\n            put(probe,\\"status\\",\\"no_valid_version_reply\\");\\n            long end=SystemClock.elapsedRealtime()+2400;\\n            for(int attempt=0;attempt<8 && SystemClock.elapsedRealtime()<end;attempt++) {\\n                if(cancelled) {put(probe,\\"status\\",\\"cancelled\\");return;}\\n                Thread.sleep(100);\\n                if(cancelled) {put(probe,\\"status\\",\\"cancelled\\");return;}\\n                byte[] rx=new byte[256];int n=conn.controlTransfer(0xa1,1,0x0100,4,rx,256,250);\\n                transfers.put(transfer(\\"get_input\\",0xa1,1,0x0100,rx,n));\\n                if(ReadProtocol.versionFrame(rx,n)) {\\n                    put(probe,\\"status\\",\\"sdk_shaped_version_reply\\");\\n                    put(probe,\\"version_interpretation\\",\\"SDK layout candidate; stock layout and freshness not independently verified\\");\\n                    put(probe,\\"effect_version_candidate\\",ReadProtocol.sdkVersion(rx,n));\\n                    put(probe,\\"same_as_baseline\\",bn==n && Arrays.equals(baseline,rx));\\n                    put(probe,\\"freshness_verified\\",false);\\n                    break;\\n                }\\n            }\\n        } finally { if(claimed)conn.releaseInterface(selected); }\\n    }\\n    private JSONObject transfer(String label,int type,int request,int value,byte[] data,int count) {\\n        JSONObject t=new JSONObject();put(t,\\"label\\",label);put(t,\\"timestamp_utc\\",java.time.Instant.now().toString());\\n        put(t,\\"bmRequestType\\",type);put(t,\\"bRequest\\",request);put(t,\\"wValue\\",value);put(t,\\"wIndex\\",4);\\n        put(t,\\"requested_bytes\\",256);put(t,\\"return_code\\",count);\\n        put(t,\\"data_hex\\",ReadProtocol.hex(data,type==0x21?data.length:count));return t;\\n    }\\n    private JSONArray tail(JSONArray input, int max) { JSONArray out=new JSONArray(); for(int n=Math.max(0,input.length()-max);n<input.length();n++) out.put(input.opt(n)); return out; }\\n    private void event(String type, String message) {\\n        JSONObject e=new JSONObject(); put(e,\\"timestamp_utc\\",java.time.Instant.now().toString()); put(e,\\"type\\",type); put(e,\\"detail\\",message);\\n        events.put(e); events=tail(events,256); persist();\\n    }\\n    private JSONObject report() {\\n        JSONObject r=new JSONObject(); put(r,\\"schema\\",\\"okn-bp1048-reader/7\\"); put(r,\\"app_version\\",\\"7.0-diagnostic\\");\\n        put(r,\\"phone_model\\",Build.MANUFACTURER+\\" \\"+Build.MODEL); put(r,\\"android_api\\",Build.VERSION.SDK_INT);\\n        put(r,\\"scope\\",\\"USB descriptors and opt-in fixed runtime version query. No firmware dump or flash. Never treats a HID reply as a firmware backup.\\");\\n        put(r,\\"observation\\",\\"Topology polling once per second while foreground; brief changes may be missed. No device history while app is closed.\\");\\n        put(r,\\"bootloader_status\\",\\"not_verified\\"); put(r,\\"firmware_dump_verified\\",false); put(r,\\"FLASH_ALLOWED\\",\\"NO\\"); put(r,\\"events\\",events); put(r,\\"snapshots\\",snapshots); return r;\\n    }\\n    private void persist() {\\n        android.util.AtomicFile f=new android.util.AtomicFile(new File(getFilesDir(),\\"report.json\\")); FileOutputStream stream=null;\\n        try { stream=f.startWrite(); stream.write(report().toString().getBytes(StandardCharsets.UTF_8)); f.finishWrite(stream); }\\n        catch(Exception e) { if(stream!=null) f.failWrite(stream); if(status!=null) status.setText(\\"บันทึกในแอปไม่สำเร็จ: \\"+e.getMessage()); }\\n    }\\n    private void load() {\\n        try(InputStream in=new android.util.AtomicFile(new File(getFilesDir(),\\"report.json\\")).openRead()) {\\n            ByteArrayOutputStream out=new ByteArrayOutputStream(); byte[] b=new byte[4096]; int n;\\n            while((n=in.read(b))!=-1) out.write(b,0,n);\\n            JSONObject r=new JSONObject(out.toString(\\"UTF-8\\"));\\n            if(r.optJSONArray(\\"events\\")!=null) events=tail(r.getJSONArray(\\"events\\"),256);\\n            if(r.optJSONArray(\\"snapshots\\")!=null) snapshots=tail(r.getJSONArray(\\"snapshots\\"),32);\\n        } catch(Exception ignored) { }\\n    }\\n    private void export() {\\n        if(busy) { status.setText(\\"รออ่านข้อมูลเสร็จก่อนบันทึก\\"); return; }\\n        try {\\n            exportText=report().toString(2);\\n            Intent i=new Intent(Intent.ACTION_CREATE_DOCUMENT).addCategory(Intent.CATEGORY_OPENABLE).setType(\\"application/json\\");\\n            i.putExtra(Intent.EXTRA_TITLE,\\"OKN_USB_Report_\\"+System.currentTimeMillis()+\\".json\\"); startActivityForResult(i,41);\\n        } catch(Exception e) { status.setText(\\"เปิดหน้าบันทึกไม่ได้: \\"+e.getMessage()); }\\n    }\\n    protected void onActivityResult(int request, int result, Intent data) {\\n        super.onActivityResult(request,result,data);\\n        if(request!=41 || result!=RESULT_OK || data==null || data.getData()==null) return;\\n        try(OutputStream out=getContentResolver().openOutputStream(data.getData(),\\"wt\\")) {\\n            if(out==null) throw new IOException(\\"เปิดไฟล์ปลายทางไม่ได้\\");\\n            out.write((exportText!=null?exportText:report().toString(2)).getBytes(StandardCharsets.UTF_8));\\n            status.setText(\\"บันทึกรายงานแล้ว แนบไฟล์ JSON กลับมาในแชตได้\\");\\n        } catch(Exception e) { status.setText(\\"บันทึกไม่สำเร็จ: \\"+e.getMessage()); }\\n    }\\n}\\n", "android/app/src/main/java/com/okn/bp1048reader/ReadProtocol.java": "package com.okn.bp1048reader;\\n\\nimport java.util.ArrayDeque;\\nimport java.util.Arrays;\\n\\n/** Fixed runtime version query only. No flash, arbitrary command or gain API. */\\npublic final class ReadProtocol {\\n    public static final int VID=6324, PID=1719, INTERFACE=4, REPORT_BYTES=256;\\n    private ReadProtocol() {}\\n    public static boolean target(int vid,int pid,int iface,int cls,int alt) {\\n        return vid==VID && pid==PID && iface==INTERFACE && cls==3 && alt==0;\\n    }\\n    public static byte[] versionQuery() {\\n        byte[] b=new byte[REPORT_BYTES];\\n        b[0]=(byte)0xa5;b[1]=0x5a;b[4]=0x16;\\n        return b;\\n    }\\n    public static String hex(byte[] b,int count) {\\n        StringBuilder s=new StringBuilder();\\n        for(int i=0;i<Math.max(0,Math.min(count,b.length));i++) s.append(String.format(java.util.Locale.ROOT,\\"%02X\\",b[i]&255));\\n        return s.toString();\\n    }\\n    /** Exact SDK response shape, NOT proof of firmware image or freshness. */\\n    public static boolean versionFrame(byte[] b,int n) {\\n        return b!=null && n>=12 && n<=b.length && (b[0]&255)==0xa5 && (b[1]&255)==0x5a\\n            && b[2]==0 && b[3]==7 && b[11]==0x16;\\n    }\\n    public static String sdkVersion(byte[] b,int n) {\\n        if(!versionFrame(b,n)) return \\"unverified\\";\\n        return (b[5]&255)+\\".\\"+(b[6]&255)+\\".\\"+(b[7]&255);\\n    }\\n    public static int reportDescriptorLength(byte[] raw,int wanted) {\\n        if(raw==null) return -1;\\n        int iface=-1,alt=-1;\\n        for(int p=0;p+2<=raw.length;) {\\n            int len=raw[p]&255,type=raw[p+1]&255;\\n            if(len<2 || p+len>raw.length) return -1;\\n            if(type==4 && len>=9) {iface=raw[p+2]&255;alt=raw[p+3]&255;}\\n            if(type==0x21 && iface==wanted && alt==0 && len>=9) {\\n                int entries=raw[p+5]&255;\\n                if(6+3*entries>len) return -1;\\n                for(int j=0;j<entries;j++) {\\n                    int q=p+6+3*j;\\n                    if((raw[q]&255)==0x22) return (raw[q+1]&255)|((raw[q+2]&255)<<8);\\n                }\\n            }\\n            p+=len;\\n        }\\n        return -1;\\n    }\\n    /** Conservative HID parser: reject numbered reports, long items and malformed stacks. */\\n    public static String checkReportDescriptor(byte[] b) {\\n        long size=0,count=0,in=0,out=0;\\n        boolean vendor=false;\\n        ArrayDeque<long[]> stack=new ArrayDeque<>();\\n        for(int p=0;p<b.length;) {\\n            int prefix=b[p++]&255;\\n            if(prefix==254) return \\"unsupported_long_item\\";\\n            int n=prefix&3;if(n==3)n=4;\\n            if(p+n>b.length) return \\"truncated_item\\";\\n            long value=0;for(int i=0;i<n;i++)value|=(long)(b[p+i]&255)<<(8*i);p+=n;\\n            int type=(prefix>>2)&3,tag=prefix>>4;\\n            if(type==1) {\\n                if(tag==0 && value>=0xff00 && value<=0xffff)vendor=true;\\n                if(tag==7)size=value;\\n                if(tag==8)return \\"numbered_reports_not_supported\\";\\n                if(tag==9)count=value;\\n                if(tag==10) {if(stack.size()>=32)return \\"global_stack_overflow\\";stack.push(new long[]{size,count});}\\n                if(tag==11) {if(stack.isEmpty())return \\"global_stack_underflow\\";long[] x=stack.pop();size=x[0];count=x[1];}\\n            }\\n            if(type==0 && (tag==8 || tag==9)) {\\n                if(size>2048 || count>2048)return \\"oversized_report\\";\\n                if(tag==8)in+=size*count;else out+=size*count;\\n            }\\n        }\\n        if(!stack.isEmpty())return \\"unbalanced_global_stack\\";\\n        return vendor && in==2048 && out==2048 ? \\"ok\\" : \\"requires_vendor_256_byte_input_and_output\\";\\n    }\\n}\\n", "android/gradle.properties": "android.useAndroidX=true\\n"}')
