name: R61 BP1048 b1_download fast4K CRC static reverse

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r61-bp1048-b1-download-fast4kcrc-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_REPO: https://github.com/leadercxn/bp1048_sdk_v0.1.12.git
  SDK_COMMIT: 8105bd864b04995d81c9f9ae77cb158259f39015
  B1_REL: MVsB1_Base_SDK/tools/b1_download_v1.7.exe
  README_REL: MVsB1_Base_SDK/tools/readme.txt
  SAMPLE_REL: MVsB1_Base_SDK/examples/Example_GPIO/Debug/output/Example_GPIO.bin
  FLASH_PREF_REL: BT_Audio_APP/.settings/com.andestech.ide.flash.ui.prefs

jobs:
  static-reverse:
    name: Reverse b1_download size + fast4K CRC / STATIC ONLY / NO FLASH
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout control repo
        uses: actions/checkout@v5

      - name: Install static reverse tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git file binutils python3 python3-pip
          python3 -m pip install --break-system-packages \
            pefile==2024.8.26 capstone==5.0.6

      - name: Fetch pinned public BP1048 SDK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/bp1048_r61
          git init -q /tmp/bp1048_r61
          cd /tmp/bp1048_r61
          git remote add origin "$SDK_REPO"
          git fetch -q --depth=1 origin "$SDK_COMMIT"
          git checkout -q --detach FETCH_HEAD

          test "$(git rev-parse HEAD)" = "$SDK_COMMIT"
          test -s "$B1_REL"
          test -s "$README_REL"
          test -s "$SAMPLE_REL"
          test -s "$FLASH_PREF_REL"

          {
            echo "SDK_COMMIT=$(git rev-parse HEAD)"
            sha256sum "$B1_REL"
            sha256sum "$README_REL"
            sha256sum "$SAMPLE_REL"
            wc -c "$B1_REL" "$SAMPLE_REL"
            file "$B1_REL" "$SAMPLE_REL"
          } | tee /tmp/R61_SOURCE_FINGERPRINTS.txt

      - name: Prove vendor documentation and Flash Burner binding
        id: vendor_contract
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/bp1048_r61

          # Keep original text plus a best-effort UTF-8 rendering.
          cp "$README_REL" /tmp/R61_VENDOR_TOOLS_README_RAW.txt
          iconv -f GB18030 -t UTF-8 "$README_REL" \
            > /tmp/R61_VENDOR_TOOLS_README_UTF8.txt 2>/dev/null || \
            cp "$README_REL" /tmp/R61_VENDOR_TOOLS_README_UTF8.txt

          grep -aF 'b1_download_v0.6.exe' "$README_REL"
          grep -aF 'b1_download_4k_crc_v0.4.exe' "$README_REL"

          # Exact v1.7 binding in the pinned BT_Audio_APP project.
          grep -aF 'b1_download_v1.7.exe' "$FLASH_PREF_REL"
          grep -aF '<addr>0x0</addr>' "$FLASH_PREF_REL"

          {
            echo "R61_VENDOR_DOC_FAST4KCRC=YES"
            echo "R61_VENDOR_DOC_ADDR0_ADDS_SIZE_AND_CRC=YES"
            echo "R61_PINNED_PROJECT_USES_B1_DOWNLOAD_V1_7=YES"
            echo "R61_PINNED_PROJECT_FLASH_ADDR=0x0"
          } | tee /tmp/R61_VENDOR_CONTRACT.txt

      - name: Prove SDK build bin still contains metadata placeholders
        id: sample_header
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/bp1048_r61

          python3 - <<'PY'
          from pathlib import Path

          p = Path("MVsB1_Base_SDK/examples/Example_GPIO/Debug/output/Example_GPIO.bin")
          b = p.read_bytes()

          def hx(a, z):
              return b[a:z].hex()

          state = {
              "SAMPLE_BYTES": len(b),
              "A4_A7": hx(0xA4, 0xA8),
              "BC_BF": hx(0xBC, 0xC0),
              "C0_C3": hx(0xC0, 0xC4),
              "CC_D3": hx(0xCC, 0xD4),
              "D4_D7": hx(0xD4, 0xD8),
              "E0_E3": hx(0xE0, 0xE4),
              "E4_EB": hx(0xE4, 0xEC),
          }

          assert b[0xC0:0xC4] == bytes.fromhex("c9 bd be b0")
          assert b[0xA4:0xA8] == b"\xff" * 4
          assert b[0xBC:0xC0] == b"\xff" * 4
          assert b[0xCC:0xD4] == b"\xff" * 8
          assert b[0xE0:0xE4] == b"\xff" * 4
          assert b[0xE4:0xEC] == b"\xff" * 8

          lines = [f"{k}={v}" for k, v in state.items()]
          lines += [
              "R61_SAMPLE_APP_MAGIC=PASS",
              "R61_SAMPLE_METADATA_PLACEHOLDERS=YES",
              "R61_SIZE_CRC_NOT_PREPATCHED_BY_BUILD=YES",
          ]
          Path("/tmp/R61_SAMPLE_HEADER.txt").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          print("\n".join(lines))
          PY

      - name: Extract PE metadata imports sections and all interesting strings
        id: pe_inventory
        shell: bash
        run: |
          set -euo pipefail
          EXE="/tmp/bp1048_r61/$B1_REL"

          objdump -x "$EXE" > /tmp/R61_B1_OBJDUMP_X.txt
          objdump -p "$EXE" > /tmp/R61_B1_OBJDUMP_P.txt
          objdump -h "$EXE" > /tmp/R61_B1_SECTIONS.txt
          objdump -d -Mintel "$EXE" > /tmp/R61_B1_DISASM_INTEL.txt

          strings -a -n 4 -t x "$EXE" > /tmp/R61_B1_STRINGS_ASCII_ALL.txt
          strings -a -el -n 4 -t x "$EXE" > /tmp/R61_B1_STRINGS_UTF16_ALL.txt || true

          {
            grep -Eai \
              'crc|4k|4096|size|code|flash|download|verify|address|addr|burn|erase|write|read' \
              /tmp/R61_B1_STRINGS_ASCII_ALL.txt || true
            grep -Eai \
              'crc|4k|4096|size|code|flash|download|verify|address|addr|burn|erase|write|read' \
              /tmp/R61_B1_STRINGS_UTF16_ALL.txt || true
          } | sort -u > /tmp/R61_B1_INTERESTING_STRINGS.txt

          sed -n '1,800p' /tmp/R61_B1_INTERESTING_STRINGS.txt

      - name: PE xref and CRC constant analysis
        id: static_reverse
        shell: bash
        run: |
          set -euo pipefail
          EXE="/tmp/bp1048_r61/$B1_REL"

          python3 - "$EXE" <<'PY'
          import json
          import re
          import struct
          import sys
          from pathlib import Path

          import pefile
          from capstone import Cs, CS_ARCH_X86, CS_MODE_32
          from capstone.x86 import X86_OP_IMM, X86_OP_MEM

          exe = Path(sys.argv[1])
          raw = exe.read_bytes()
          pe = pefile.PE(str(exe), fast_load=False)

          image_base = int(pe.OPTIONAL_HEADER.ImageBase)
          entry_rva = int(pe.OPTIONAL_HEADER.AddressOfEntryPoint)
          entry_va = image_base + entry_rva

          # -------- section inventory --------
          sections = []
          text_sec = None
          for sec in pe.sections:
              name = sec.Name.rstrip(b"\x00").decode("ascii", "replace")
              row = {
                  "name": name,
                  "rva": int(sec.VirtualAddress),
                  "vsize": int(sec.Misc_VirtualSize),
                  "raw_offset": int(sec.PointerToRawData),
                  "raw_size": int(sec.SizeOfRawData),
              }
              sections.append(row)
              if name == ".text":
                  text_sec = sec

          if text_sec is None:
              raise SystemExit("PE .text section not found")

          # -------- printable strings with file offset -> VA --------
          def ascii_strings(data, minimum=4):
              for m in re.finditer(rb"[\x20-\x7e]{%d,}" % minimum, data):
                  yield m.start(), m.group().decode("ascii", "replace")

          interesting_re = re.compile(
              r"crc|4k|4096|size|code|flash|download|verify|address|addr|burn|erase|write|read",
              re.I,
          )

          interesting = []
          for off, st in ascii_strings(raw):
              if not interesting_re.search(st):
                  continue
              try:
                  rva = pe.get_rva_from_offset(off)
                  va = image_base + rva
              except Exception:
                  rva = None
                  va = None
              interesting.append({
                  "file_offset": off,
                  "rva": rva,
                  "va": va,
                  "text": st[:500],
              })

          # -------- disassemble .text --------
          text_bytes = text_sec.get_data()
          text_va = image_base + int(text_sec.VirtualAddress)

          md = Cs(CS_ARCH_X86, CS_MODE_32)
          md.detail = True
          insns = list(md.disasm(text_bytes, text_va))

          interesting_vas = {
              x["va"]: x for x in interesting if x["va"] is not None
          }

          string_xrefs = []
          constant_hits = []

          constants = {
              0x1000: "FAST4K_SIZE",
              0x0: "FLASH_ADDR_ZERO",
              0xA4: "HDR_A4",
              0xA8: "HDR_A8",
              0xB8: "HDR_VERSION_B8",
              0xBC: "HDR_BC",
              0xC0: "HDR_MAGIC_C0",
              0xCC: "HDR_CC",
              0xD0: "HDR_D0",
              0xD4: "HDR_D4",
              0xE0: "HDR_LENGTH_E0",
              0xE3: "HDR_LENGTH_CHECK_E3",
              0xE4: "HDR_E4",
              0xE8: "HDR_E8",
              0xEC: "HDR_EC",
              0x1021: "CRC16_CCITT_POLY",
              0x04C11DB7: "CRC32_NORMAL_POLY",
              0xEDB88320: "CRC32_REFLECTED_POLY",
          }

          # Window helper by instruction index.
          def window(idx, radius=10):
              a = max(0, idx-radius)
              z = min(len(insns), idx+radius+1)
              return [
                  f"0x{x.address:08X}: {x.mnemonic} {x.op_str}"
                  for x in insns[a:z]
              ]

          for idx, ins in enumerate(insns):
              vals = []
              for op in ins.operands:
                  if op.type == X86_OP_IMM:
                      vals.append(int(op.imm) & 0xFFFFFFFF)
                  elif op.type == X86_OP_MEM:
                      vals.append(int(op.mem.disp) & 0xFFFFFFFF)

              for val in vals:
                  if val in constants:
                      constant_hits.append({
                          "address": ins.address,
                          "constant": f"0x{val:08X}",
                          "meaning": constants[val],
                          "instruction": f"{ins.mnemonic} {ins.op_str}",
                          "window": window(idx, 8),
                      })

                  if val in interesting_vas:
                      sx = interesting_vas[val]
                      string_xrefs.append({
                          "address": ins.address,
                          "instruction": f"{ins.mnemonic} {ins.op_str}",
                          "string_va": val,
                          "string": sx["text"],
                          "window": window(idx, 12),
                      })

          # -------- raw CRC-table fingerprints --------
          crc_patterns = {
              "CRC16_CCITT_TABLE_LE_PREFIX":
                  bytes.fromhex("0000211042206330"),
              "CRC32_IEEE_REFLECTED_TABLE_LE_PREFIX":
                  bytes.fromhex(
                      "00000000963007772c610eee"
                      "ba510999"
                  ),
              "CRC32_NORMAL_POLY_LE":
                  struct.pack("<I", 0x04C11DB7),
              "CRC32_REFLECTED_POLY_LE":
                  struct.pack("<I", 0xEDB88320),
              "CRC16_CCITT_POLY_LE":
                  struct.pack("<H", 0x1021),
          }

          raw_hits = {}
          for name, pat in crc_patterns.items():
              offs = []
              start = 0
              while True:
                  i = raw.find(pat, start)
                  if i < 0:
                      break
                  offs.append(i)
                  start = i + 1
                  if len(offs) >= 128:
                      break
              raw_hits[name] = offs

          # -------- imported APIs --------
          imports = []
          if hasattr(pe, "DIRECTORY_ENTRY_IMPORT"):
              for entry in pe.DIRECTORY_ENTRY_IMPORT:
                  dll = entry.dll.decode("ascii", "replace")
                  for imp in entry.imports:
                      nm = (
                          imp.name.decode("ascii", "replace")
                          if imp.name else f"ord:{imp.ordinal}"
                      )
                      imports.append({"dll": dll, "name": nm})

          report = {
              "file_size": len(raw),
              "image_base": image_base,
              "entry_rva": entry_rva,
              "entry_va": entry_va,
              "sections": sections,
              "interesting_strings": interesting,
              "string_xrefs": string_xrefs,
              "constant_hits": constant_hits,
              "crc_pattern_file_offsets": raw_hits,
              "imports": imports,
          }

          Path("/tmp/R61_PE_STATIC_REVERSE.json").write_text(
              json.dumps(report, indent=2) + "\n",
              encoding="utf-8",
          )

          with Path("/tmp/R61_PE_STATIC_REVERSE_SUMMARY.txt").open(
              "w", encoding="utf-8"
          ) as f:
              f.write(f"PE_BYTES={len(raw)}\n")
              f.write(f"IMAGE_BASE=0x{image_base:08X}\n")
              f.write(f"ENTRY_RVA=0x{entry_rva:08X}\n")
              f.write(f"INTERESTING_ASCII_STRINGS={len(interesting)}\n")
              f.write(f"INTERESTING_STRING_XREFS={len(string_xrefs)}\n")
              f.write(f"CONSTANT_HITS={len(constant_hits)}\n")
              for k, v in raw_hits.items():
                  f.write(f"{k}_HITS={len(v)}\n")
                  if v:
                      f.write(
                          f"{k}_OFFSETS=" +
                          ",".join(f"0x{x:X}" for x in v[:32]) +
                          "\n"
                      )

          print(Path("/tmp/R61_PE_STATIC_REVERSE_SUMMARY.txt").read_text(), end="")

          # Smaller human-readable xref report.
          with Path("/tmp/R61_XREF_WINDOWS.txt").open(
              "w", encoding="utf-8"
          ) as f:
              f.write("=== STRING XREFS ===\n")
              for x in string_xrefs[:300]:
                  f.write(
                      f"\n@0x{x['address']:08X} -> "
                      f"{x['string']!r}\n"
                  )
                  f.write("\n".join(x["window"]) + "\n")

              f.write("\n=== HEADER/CRC CONSTANT HITS ===\n")
              for x in constant_hits[:800]:
                  f.write(
                      f"\n@0x{x['address']:08X} "
                      f"{x['meaning']} {x['constant']} "
                      f"{x['instruction']}\n"
                  )
                  f.write("\n".join(x["window"]) + "\n")
          PY

          test -s /tmp/R61_PE_STATIC_REVERSE.json
          test -s /tmp/R61_PE_STATIC_REVERSE_SUMMARY.txt
          test -s /tmp/R61_XREF_WINDOWS.txt

      - name: Search disassembly for likely header writeback operations
        id: header_writeback_scan
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          src = Path("/tmp/R61_B1_DISASM_INTEL.txt").read_text(
              encoding="latin-1", errors="replace"
          ).splitlines()

          # Broad static candidates only.  These are evidence for follow-up
          # reverse engineering, not permission to write a device.
          pats = [
              r"\b0x1000\b",
              r"\b0xe0\b",
              r"\b0xe4\b",
              r"\b0xe8\b",
              r"\b0xec\b",
              r"\b0xa4\b",
              r"\b0xbc\b",
              r"\b0xcc\b",
              r"\b0xd4\b",
              r"\b0x1021\b",
              r"\b0x4c11db7\b",
              r"\bedb88320\b",
          ]

          hit_idx = []
          for i, line in enumerate(src):
              low = line.lower()
              if any(re.search(p, low) for p in pats):
                  hit_idx.append(i)

          ranges = []
          for i in hit_idx:
              a = max(0, i-8)
              z = min(len(src), i+9)
              if not ranges or a > ranges[-1][1]:
                  ranges.append([a, z])
              else:
                  ranges[-1][1] = max(ranges[-1][1], z)

          out = []
          for a, z in ranges[:500]:
              out.append(f"--- lines {a+1}..{z} ---")
              out.extend(src[a:z])

          Path("/tmp/R61_DISASM_HEADER_CONSTANT_WINDOWS.txt").write_text(
              "\n".join(out) + "\n",
              encoding="utf-8",
          )

          print(f"DISASM_CONSTANT_MATCH_LINES={len(hit_idx)}")
          print(f"DISASM_MERGED_WINDOWS={len(ranges)}")
          PY

      - name: Compute conservative R61 decision
        id: decision
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json

          d = json.loads(
              Path("/tmp/R61_PE_STATIC_REVERSE.json").read_text(
                  encoding="utf-8"
              )
          )

          crc_pattern_hits = sum(
              len(v) for v in d["crc_pattern_file_offsets"].values()
          )
          xrefs = len(d["string_xrefs"])
          consts = len(d["constant_hits"])

          # This checkpoint intentionally does not claim the algorithm or
          # storage field solely from constants/strings.  Those require
          # control-flow confirmation in the next reverse pass.
          lines = [
              "R61_B1_DOWNLOAD_V1_7_PRESENT=YES",
              "R61_VENDOR_DOC_ADDR0_ADDS_SIZE_AND_CRC=YES",
              "R61_VENDOR_DOC_FAST4KCRC=YES",
              "R61_BUILD_BIN_METADATA_PLACEHOLDER=YES",
              f"R61_STATIC_STRING_XREFS={xrefs}",
              f"R61_STATIC_HEADER_CRC_CONSTANT_HITS={consts}",
              f"R61_RAW_CRC_PATTERN_HITS={crc_pattern_hits}",
              "R61_DOWNLOADER_EXECUTED=NO",
              "R61_BOARD_USB_ACCESSED=NO",
              "R61_EXACT_FAST4KCRC_ALGORITHM_PROVEN=NO",
              "R61_EXACT_SIZE_CRC_WRITEBACK_OFFSETS_PROVEN=NO",
              "R61_FULL_APP_METADATA_READY=NO",
              "FLASH_ALLOWED=NO",
          ]

          Path("/tmp/R61_DECISION.txt").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          print("\n".join(lines))
          PY

      - name: Build R61 evidence bundle
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          OUT=/tmp/R61_BP1048_B1_DOWNLOAD_FAST4KCRC_STATIC_REVERSE_EVIDENCE
          rm -rf "$OUT"
          mkdir -p "$OUT"

          for f in \
            R61_SOURCE_FINGERPRINTS.txt \
            R61_VENDOR_TOOLS_README_RAW.txt \
            R61_VENDOR_TOOLS_README_UTF8.txt \
            R61_VENDOR_CONTRACT.txt \
            R61_SAMPLE_HEADER.txt \
            R61_B1_OBJDUMP_X.txt \
            R61_B1_OBJDUMP_P.txt \
            R61_B1_SECTIONS.txt \
            R61_B1_INTERESTING_STRINGS.txt \
            R61_PE_STATIC_REVERSE.json \
            R61_PE_STATIC_REVERSE_SUMMARY.txt \
            R61_XREF_WINDOWS.txt \
            R61_DISASM_HEADER_CONSTANT_WINDOWS.txt \
            R61_DECISION.txt; do
            test -f "/tmp/$f" && cp "/tmp/$f" "$OUT/"
          done

          # Do not upload the vendor EXE itself; artifact contains analysis only.
          test ! -e "$OUT/b1_download_v1.7.exe"

          cat > "$OUT/README.txt" <<'EOF'
          R61 BP1048 b1_download_v1.7 STATIC REVERSE

          Scope:
          - pinned public SDK commit only
          - proves vendor documentation that address-0 code programming adds
            size + fast-4K CRC in the downloader
          - compares a pinned prebuilt SDK .bin whose metadata fields are still
            FF before downloader processing
          - statically inventories PE imports, strings, xrefs and constants
          - does NOT execute the Windows flash driver
          - does NOT access USB hardware
          - does NOT erase/program/flash anything

          R61 is evidence gathering.  Constants or CRC tables alone are not
          sufficient to claim the exact algorithm/writeback field.
          EOF

          (
            cd /tmp
            zip -qr \
              R61_BP1048_B1_DOWNLOAD_FAST4KCRC_STATIC_REVERSE_EVIDENCE.zip \
              R61_BP1048_B1_DOWNLOAD_FAST4KCRC_STATIC_REVERSE_EVIDENCE
            sha256sum \
              R61_BP1048_B1_DOWNLOAD_FAST4KCRC_STATIC_REVERSE_EVIDENCE.zip \
              > R61_BP1048_B1_DOWNLOAD_FAST4KCRC_STATIC_REVERSE_EVIDENCE.zip.sha256
          )

          cat /tmp/R61_BP1048_B1_DOWNLOAD_FAST4KCRC_STATIC_REVERSE_EVIDENCE.zip.sha256

      - name: Upload R61 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R61-BP1048-B1-DOWNLOAD-FAST4KCRC-STATIC-REVERSE-EVIDENCE
          path: |
            /tmp/R61_BP1048_B1_DOWNLOAD_FAST4KCRC_STATIC_REVERSE_EVIDENCE.zip
            /tmp/R61_BP1048_B1_DOWNLOAD_FAST4KCRC_STATIC_REVERSE_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: R61 final gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          cat /tmp/R61_VENDOR_CONTRACT.txt 2>/dev/null || true
          cat /tmp/R61_SAMPLE_HEADER.txt 2>/dev/null || true
          cat /tmp/R61_PE_STATIC_REVERSE_SUMMARY.txt 2>/dev/null || true
          cat /tmp/R61_DECISION.txt 2>/dev/null || true

          test "${{ steps.vendor_contract.outcome }}" = "success"
          test "${{ steps.sample_header.outcome }}" = "success"
          test "${{ steps.pe_inventory.outcome }}" = "success"
          test "${{ steps.static_reverse.outcome }}" = "success"
          test "${{ steps.header_writeback_scan.outcome }}" = "success"
          test "${{ steps.decision.outcome }}" = "success"

          grep -F 'R61_B1_DOWNLOAD_V1_7_PRESENT=YES' /tmp/R61_DECISION.txt
          grep -F 'R61_VENDOR_DOC_ADDR0_ADDS_SIZE_AND_CRC=YES' /tmp/R61_DECISION.txt
          grep -F 'R61_BUILD_BIN_METADATA_PLACEHOLDER=YES' /tmp/R61_DECISION.txt
          grep -F 'R61_DOWNLOADER_EXECUTED=NO' /tmp/R61_DECISION.txt
          grep -F 'R61_BOARD_USB_ACCESSED=NO' /tmp/R61_DECISION.txt
          grep -F 'FLASH_ALLOWED=NO' /tmp/R61_DECISION.txt

          echo "R61_STATIC_REVERSE=PASS"
          echo "FLASH_ALLOWED=NO"
