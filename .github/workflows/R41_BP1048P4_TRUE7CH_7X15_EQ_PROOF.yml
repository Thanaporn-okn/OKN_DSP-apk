          mkdir -p /tmp/r41gen
          cat > /tmp/r41gen/okn_eq7.h <<'EOFH'
          #ifndef OKN_EQ7_H
          #define OKN_EQ7_H
          #include <stddef.h>
          #include <stdint.h>

          #define OKN_EQ7_CHANNELS 7u
          #define OKN_EQ7_BANDS 15u
          #define OKN_EQ7_ID_CH1 30u
          #define OKN_EQ7_ID_CH7 36u
          #define OKN_EQ7_SLOT_BYTES 16u

          void okn_eq7_init(uint32_t sample_rate);
          uint8_t okn_eq7_set_peaking(uint8_t ch0, uint8_t band0, uint8_t enabled,
                                      float f0_hz, float q, float gain_db);
          void okn_eq7_process_mono(uint8_t ch0, int16_t *pcm, size_t samples);
          void okn_eq7_process_interleaved_lane(uint8_t ch0, int16_t *pcm,
                                                size_t frames, uint8_t lane, uint8_t lanes);
          uint8_t okn_eq7_ufe_write(const uint8_t *req, size_t n);
          size_t okn_eq7_ufe_read(const uint8_t *req, size_t n, uint8_t *out, size_t cap);
          #endif
          EOFH

          cat > /tmp/r41gen/okn_eq7.c <<'EOFC'
          #include "okn_eq7.h"
          #include <math.h>
          #include <string.h>

          #define OKN_EQ7_WRITE 0x57u
          #define OKN_EQ7_READ 0x58u
          #define OKN_EQ7_READ_RESPONSE 0x60u
          #define OKN_PI_F 3.14159265358979323846f

          typedef struct {
              uint8_t enabled;
              float f0_hz, q, gain_db;
              float b0, b1, b2, a1, a2;
              float z1, z2;
          } okn_eq7_band_t;

          typedef struct {
              uint32_t sample_rate;
              okn_eq7_band_t band[OKN_EQ7_CHANNELS][OKN_EQ7_BANDS];
          } okn_eq7_state_t;

          static okn_eq7_state_t g_eq7;

          static uint16_t r16be(const uint8_t *p){return (uint16_t)(((uint16_t)p[0]<<8)|p[1]);}
          static uint32_t r32be(const uint8_t *p){return ((uint32_t)p[0]<<24)|((uint32_t)p[1]<<16)|((uint32_t)p[2]<<8)|p[3];}
          static uint32_t r32le(const uint8_t *p){return (uint32_t)p[0]|((uint32_t)p[1]<<8)|((uint32_t)p[2]<<16)|((uint32_t)p[3]<<24);}
          static void w16be(uint8_t *p,uint16_t v){p[0]=(uint8_t)(v>>8);p[1]=(uint8_t)v;}
          static void w32be(uint8_t *p,uint32_t v){p[0]=(uint8_t)(v>>24);p[1]=(uint8_t)(v>>16);p[2]=(uint8_t)(v>>8);p[3]=(uint8_t)v;}
          static void w32le(uint8_t *p,uint32_t v){p[0]=(uint8_t)v;p[1]=(uint8_t)(v>>8);p[2]=(uint8_t)(v>>16);p[3]=(uint8_t)(v>>24);}
          static float rf32le(const uint8_t *p){uint32_t u=r32le(p);float f;memcpy(&f,&u,4);return f;}
          static void wf32le(uint8_t *p,float f){uint32_t u;memcpy(&u,&f,4);w32le(p,u);}

          static int16_t sat16f(float x)
          {
              int32_t v;
              if (x > 32767.0f) return 32767;
              if (x < -32768.0f) return -32768;
              v=(int32_t)(x >= 0.0f ? x + 0.5f : x - 0.5f);
              return (int16_t)v;
          }

          static void identity(okn_eq7_band_t *b)
          {
              b->b0=1.0f; b->b1=0.0f; b->b2=0.0f; b->a1=0.0f; b->a2=0.0f;
              b->z1=0.0f; b->z2=0.0f;
          }

          void okn_eq7_init(uint32_t sample_rate)
          {
              uint8_t ch,band;
              memset(&g_eq7,0,sizeof(g_eq7));
              g_eq7.sample_rate=sample_rate ? sample_rate : 48000u;
              for(ch=0;ch<OKN_EQ7_CHANNELS;ch++) for(band=0;band<OKN_EQ7_BANDS;band++) {
                  g_eq7.band[ch][band].f0_hz=1000.0f;
                  g_eq7.band[ch][band].q=1.0f;
                  g_eq7.band[ch][band].gain_db=0.0f;
                  identity(&g_eq7.band[ch][band]);
              }
          }

          uint8_t okn_eq7_set_peaking(uint8_t ch0, uint8_t band0, uint8_t enabled,
                                      float f0_hz, float q, float gain_db)
          {
              okn_eq7_band_t *b;
              float fs,A,w,alpha,c,a0;
              if(ch0>=OKN_EQ7_CHANNELS || band0>=OKN_EQ7_BANDS || enabled>1u) return 0u;
              if(!(f0_hz==f0_hz) || !(q==q) || !(gain_db==gain_db)) return 0u;
              fs=(float)(g_eq7.sample_rate ? g_eq7.sample_rate : 48000u);
              if(f0_hz<20.0f || f0_hz>(fs*0.5f-50.0f) || q<0.10f || q>20.0f || gain_db<-18.0f || gain_db>18.0f) return 0u;
              b=&g_eq7.band[ch0][band0];
              b->enabled=enabled; b->f0_hz=f0_hz; b->q=q; b->gain_db=gain_db;
              b->z1=0.0f; b->z2=0.0f;
              if(!enabled){identity(b);return 1u;}
              A=powf(10.0f,gain_db/40.0f);
              w=2.0f*OKN_PI_F*f0_hz/fs;
              alpha=sinf(w)/(2.0f*q);
              c=cosf(w);
              a0=1.0f+alpha/A;
              b->b0=(1.0f+alpha*A)/a0;
              b->b1=(-2.0f*c)/a0;
              b->b2=(1.0f-alpha*A)/a0;
              b->a1=(-2.0f*c)/a0;
              b->a2=(1.0f-alpha/A)/a0;
              return 1u;
          }

          static float run_band(okn_eq7_band_t *b,float x)
          {
              float y=b->b0*x+b->z1;
              b->z1=b->b1*x-b->a1*y+b->z2;
              b->z2=b->b2*x-b->a2*y;
              return y;
          }

          static int16_t run_sample(uint8_t ch0,int16_t x)
          {
              uint8_t band; float y=(float)x;
              for(band=0;band<OKN_EQ7_BANDS;band++) if(g_eq7.band[ch0][band].enabled) y=run_band(&g_eq7.band[ch0][band],y);
              return sat16f(y);
          }

          void okn_eq7_process_mono(uint8_t ch0,int16_t *pcm,size_t samples)
          {
              size_t i; if(!pcm||ch0>=OKN_EQ7_CHANNELS)return;
              for(i=0;i<samples;i++) pcm[i]=run_sample(ch0,pcm[i]);
          }

          void okn_eq7_process_interleaved_lane(uint8_t ch0,int16_t *pcm,size_t frames,uint8_t lane,uint8_t lanes)
          {
              size_t i,pos; if(!pcm||ch0>=OKN_EQ7_CHANNELS||lanes==0u||lane>=lanes)return;
              for(i=0;i<frames;i++){pos=i*lanes+lane;pcm[pos]=run_sample(ch0,pcm[pos]);}
          }

          static int ch_from_id(uint32_t id){if(id<OKN_EQ7_ID_CH1||id>OKN_EQ7_ID_CH7)return -1;return (int)(id-OKN_EQ7_ID_CH1);}

          uint8_t okn_eq7_ufe_write(const uint8_t *req,size_t n)
          {
              uint32_t id,en;uint16_t off,len;int ch;uint8_t band;
              if(!req||n!=25u||req[0]!=OKN_EQ7_WRITE)return 0u;
              id=r32be(req+1);off=r16be(req+5);len=r16be(req+7);ch=ch_from_id(id);
              if(ch<0||len!=OKN_EQ7_SLOT_BYTES||(off%OKN_EQ7_SLOT_BYTES)!=0u)return 0u;
              band=(uint8_t)(off/OKN_EQ7_SLOT_BYTES);if(band>=OKN_EQ7_BANDS)return 0u;
              en=r32le(req+9);if(en>1u)return 0u;
              return okn_eq7_set_peaking((uint8_t)ch,band,(uint8_t)en,rf32le(req+13),rf32le(req+17),rf32le(req+21));
          }

          size_t okn_eq7_ufe_read(const uint8_t *req,size_t n,uint8_t *out,size_t cap)
          {
              uint32_t id;uint16_t off,len;int ch;uint8_t band;okn_eq7_band_t *b;
              if(!req||!out||n!=9u||cap<25u||req[0]!=OKN_EQ7_READ)return 0u;
              id=r32be(req+1);off=r16be(req+5);len=r16be(req+7);ch=ch_from_id(id);
              if(ch<0||len!=OKN_EQ7_SLOT_BYTES||(off%OKN_EQ7_SLOT_BYTES)!=0u)return 0u;
              band=(uint8_t)(off/OKN_EQ7_SLOT_BYTES);if(band>=OKN_EQ7_BANDS)return 0u;
              b=&g_eq7.band[ch][band];
              out[0]=OKN_EQ7_READ_RESPONSE;w32be(out+1,id);w16be(out+5,off);w16be(out+7,OKN_EQ7_SLOT_BYTES);
              w32le(out+9,(uint32_t)b->enabled);wf32le(out+13,b->f0_hz);wf32le(out+17,b->q);wf32le(out+21,b->gain_db);
              return 25u;
          }
          EOFC

          cat > /tmp/r41_eq7_host_test.c <<'EOFTEST'
          #include <assert.h>
          #include <stdint.h>
          #include <string.h>
          #include "okn_eq7.h"
          static void impulse(int16_t *p,unsigned n){unsigned i;for(i=0;i<n;i++)p[i]=0;p[0]=12000;}
          static void w16be(uint8_t*p,uint16_t v){p[0]=(uint8_t)(v>>8);p[1]=(uint8_t)v;}
          static void w32be(uint8_t*p,uint32_t v){p[0]=(uint8_t)(v>>24);p[1]=(uint8_t)(v>>16);p[2]=(uint8_t)(v>>8);p[3]=(uint8_t)v;}
          static void w32le(uint8_t*p,uint32_t v){p[0]=(uint8_t)v;p[1]=(uint8_t)(v>>8);p[2]=(uint8_t)(v>>16);p[3]=(uint8_t)(v>>24);}
          static void wf(uint8_t*p,float f){uint32_t u;memcpy(&u,&f,4);w32le(p,u);}
          int main(void){
              int16_t a[16],b[16],c[16],d[16],a0[16],b0[16],c0[16],d0[16];
              uint8_t req[25],rd[9],resp[25]; size_t n;
              okn_eq7_init(48000u);
              impulse(a,16);impulse(b,16);impulse(c,16);impulse(d,16);
              memcpy(a0,a,sizeof(a));memcpy(b0,b,sizeof(b));memcpy(c0,c,sizeof(c));memcpy(d0,d,sizeof(d));
              assert(okn_eq7_set_peaking(3u,0u,1u,1000.0f,1.0f,6.0f));
              okn_eq7_process_interleaved_lane(0u,a,8,0,2);okn_eq7_process_interleaved_lane(1u,a,8,1,2);
              okn_eq7_process_mono(2u,b,8);
              okn_eq7_process_interleaved_lane(3u,c,8,0,2);okn_eq7_process_interleaved_lane(4u,c,8,1,2);
              okn_eq7_process_interleaved_lane(5u,d,8,0,2);okn_eq7_process_interleaved_lane(6u,d,8,1,2);
              assert(memcmp(a,a0,sizeof(a))==0);assert(memcmp(b,b0,sizeof(b))==0);assert(memcmp(d,d0,sizeof(d))==0);
              assert(memcmp(c,c0,sizeof(c))!=0);assert(c[1]==c0[1]);
              memset(req,0,sizeof(req));req[0]=0x57;w32be(req+1,36u);w16be(req+5,14u*16u);w16be(req+7,16u);
              w32le(req+9,1u);wf(req+13,2500.0f);wf(req+17,1.25f);wf(req+21,-5.5f);
              assert(okn_eq7_ufe_write(req,sizeof(req)));
              memset(rd,0,sizeof(rd));rd[0]=0x58;w32be(rd+1,36u);w16be(rd+5,14u*16u);w16be(rd+7,16u);
              n=okn_eq7_ufe_read(rd,sizeof(rd),resp,sizeof(resp));assert(n==25u);assert(resp[0]==0x60);assert(memcmp(resp+1,rd+1,8)==0);
              assert(memcmp(resp+9,req+9,16)==0);
              return 0;
          }
          EOFTEST
          gcc -std=c11 -Wall -Wextra -Werror -I/tmp/r41gen /tmp/r41gen/okn_eq7.c /tmp/r41_eq7_host_test.c -lm -o /tmp/r41_eq7_host_test
          /tmp/r41_eq7_host_test
          echo 'PASS R41 7x15 PEAKING isolation + band14 UFE roundtrip' | tee /tmp/R41_EQ7_HOST_TEST.txt

          python3 - <<'PYPATCH41'
          from pathlib import Path
          sdk=Path('/tmp/bp1048')
          main=sdk/'BT_Audio_APP/bt_audio_app_src/apps/main_task.c'
          core=sdk/'BT_Audio_APP/bt_audio_app_src/services/audio_core_api.c'
          comm=sdk/'BT_Audio_APP/bt_audio_app_src/audio/communication.c'
          side=Path('/tmp/r40gen/okn_r40_dual_i2s.c')

          # R41 EQ must initialize with the exact runtime sample rate before any output frame.
          m=main.read_bytes().decode('latin-1')
          inc='#include "okn_r40_dual_i2s.h"\r\n'
          if m.count(inc)!=1: raise SystemExit('R41 main include marker mismatch')
          m=m.replace(inc,inc+'#include "okn_eq7.h"\r\n',1)
          init='\tokn_r40_dual_i2s_init(mainAppCt.SampleRate, mainAppCt.SamplesPreFrame);\r\n'
          if m.count(init)!=1: raise SystemExit('R41 main init marker mismatch')
          m=m.replace(init,'\tokn_eq7_init(mainAppCt.SampleRate);\r\n'+init,1)
          main.write_bytes(m.encode('latin-1'))

          # Sidecar: copy clean DAC0 stereo first, then CH4..CH7 EQ, then dedicated gain.
          q=side.read_text()
          hdr='#include "okn_r40_dual_i2s.h"\n'
          if q.count(hdr)!=1: raise SystemExit('R41 sidecar include marker mismatch')
          q=q.replace(hdr,hdr+'#include "okn_eq7.h"\n',1)
          old=('    /* R40 proves physical independent gain lanes only. R41 will insert\n'
               '       seven explicit output EQ instances before these lane gains. */\n'
               '    okn_r36_process_i2s16_copy(3u, src_lr, s_i2s0_out, frames);\n'
               '    okn_r36_process_i2s16_copy(5u, src_lr, s_i2s1_out, frames);\n')
          new=('    memcpy(s_i2s0_out, src_lr, (size_t)frames * 2u * sizeof(int16_t));\n'
               '    memcpy(s_i2s1_out, src_lr, (size_t)frames * 2u * sizeof(int16_t));\n'
               '    okn_eq7_process_interleaved_lane(3u, s_i2s0_out, frames, 0u, 2u);\n'
               '    okn_eq7_process_interleaved_lane(4u, s_i2s0_out, frames, 1u, 2u);\n'
               '    okn_eq7_process_interleaved_lane(5u, s_i2s1_out, frames, 0u, 2u);\n'
               '    okn_eq7_process_interleaved_lane(6u, s_i2s1_out, frames, 1u, 2u);\n'
               '    okn_r36_process_i2s16_copy(3u, s_i2s0_out, s_i2s0_out, frames);\n'
               '    okn_r36_process_i2s16_copy(5u, s_i2s1_out, s_i2s1_out, frames);\n')
          if q.count(old)!=1: raise SystemExit('R41 sidecar route marker mismatch')
          q=q.replace(old,new,1)
          side.write_text(q)

          # DAC0 CH1/CH2 and DACX mono CH3 get their independent EQ after the clean
          # I2S copies are made, but before AudioCore sink gain is applied.
          c=core.read_bytes().decode('latin-1')
          inc='#include "okn_r40_dual_i2s.h"\r\n'
          if c.count(inc)!=1: raise SystemExit('R41 core include marker mismatch')
          c=c.replace(inc,inc+'#include "okn_eq7.h"\r\n',1)
          route='\tokn_r40_route_from_dac0(AudioCore.AudioSink[AUDIO_DAC0_SINK_NUM].PcmOutBuf, mainAppCt.SamplesPreFrame);\r\n'
          if c.count(route)!=1: raise SystemExit('R41 core route marker mismatch')
          eq=('\tokn_eq7_process_interleaved_lane(0u, AudioCore.AudioSink[AUDIO_DAC0_SINK_NUM].PcmOutBuf, mainAppCt.SamplesPreFrame, 0u, 2u);\r\n'
              '\tokn_eq7_process_interleaved_lane(1u, AudioCore.AudioSink[AUDIO_DAC0_SINK_NUM].PcmOutBuf, mainAppCt.SamplesPreFrame, 1u, 2u);\r\n'
              '#ifdef CFG_RES_AUDIO_DACX_EN\r\n'
              '\tokn_eq7_process_mono(2u, AudioCore.AudioSink[AUDIO_DACX_SINK_NUM].PcmOutBuf, mainAppCt.SamplesPreFrame);\r\n'
              '#endif\r\n')
          c=c.replace(route,route+eq,1)
          core.write_bytes(c.encode('latin-1'))

          # Extend the existing RAM-only 0x57/0x58 dispatcher. Gain IDs 22..28 keep
          # their 4-byte float contract. EQ IDs 30..36 use one 16-byte PEAKING slot.
          x=comm.read_bytes().decode('latin-1')
          inc='#include "okn_r40_dual_i2s.h"\r\n'
          if x.count(inc)!=1: raise SystemExit('R41 communication include marker mismatch')
          x=x.replace(inc,inc+'#include "okn_eq7.h"\r\n',1)
          a=x.find('static void OKN_Communication_0x57')
          b=x.find('void Communication_Effect_Config',a)
          if a<0 or b<0: raise SystemExit('R41 communication helper bounds missing')
          helper="""static void OKN_Communication_0x57(uint8_t *buf, uint32_t len)\r\n{\r\n    uint8_t req[25];\r\n    uint8_t ok = 0u;\r\n    if(buf == NULL) return;\r\n    if(len == 12u)\r\n    {\r\n        req[0] = OKN_UFE_WRITE;\r\n        memcpy(&req[1], buf, 12u);\r\n        ok = okn_r36_ufe_write_apply(req, 13u) ? 1u : 0u;\r\n        if(ok) okn_r40_apply_dac_gains();\r\n    }\r\n    else if(len == 24u)\r\n    {\r\n        req[0] = OKN_UFE_WRITE;\r\n        memcpy(&req[1], buf, 24u);\r\n        ok = okn_eq7_ufe_write(req, 25u);\r\n    }\r\n    if(ok)\r\n    {\r\n        memset(tx_buf, 0, sizeof(tx_buf));\r\n        tx_buf[0] = OKN_UFE_WRITE;\r\n        Communication_Effect_Send(tx_buf, 1u);\r\n    }\r\n}\r\n\r\nstatic void OKN_Communication_0x58(uint8_t *buf, uint32_t len)\r\n{\r\n    uint8_t req[9];\r\n    uint8_t resp[25];\r\n    size_t n;\r\n    if((buf == NULL) || (len != 8u)) return;\r\n    req[0] = OKN_UFE_READ;\r\n    memcpy(&req[1], buf, 8u);\r\n    n = okn_r36_ufe_read(req, sizeof(req), resp, sizeof(resp));\r\n    if(n == 0u) n = okn_eq7_ufe_read(req, sizeof(req), resp, sizeof(resp));\r\n    if((n != 13u && n != 25u) || (resp[0] != OKN_UFE_READ_RESPONSE)) return;\r\n    memset(tx_buf, 0, sizeof(tx_buf));\r\n    tx_buf[0] = 0xA5u;\r\n    tx_buf[1] = 0x5Au;\r\n    tx_buf[2] = OKN_UFE_READ_RESPONSE;\r\n    tx_buf[3] = (uint8_t)(n - 1u);\r\n    memcpy(&tx_buf[4], &resp[1], n - 1u);\r\n    tx_buf[3u + n] = 0x16u;\r\n    Communication_Effect_Send(tx_buf, (uint32_t)(n + 4u));\r\n}\r\n"""
          x=x[:a]+helper+x[b:]
          comm.write_bytes(x.encode('latin-1'))

          with Path('/tmp/r38_includes.rsp').open('a',encoding='utf-8') as f:
              f.write('-I/tmp/r41gen\n')

          Path('/tmp/R41_PATCHED_main_task.c').write_bytes(main.read_bytes())
          Path('/tmp/R41_PATCHED_audio_core_api.c').write_bytes(core.read_bytes())
          Path('/tmp/R41_PATCHED_communication.c').write_bytes(comm.read_bytes())
          Path('/tmp/R41_EQ7_PROTOCOL.txt').write_text(
              'R41 RAM-only output EQ protocol\n'
              'Control: write=0x57 read=0x58 response=0x60\n'
              'EQ IDs: CH1..CH7 = 30..36\n'
              '15 bands/channel; offset=band_index*16; len=16\n'
              'payload LE: enabled:u32, f0_hz:f32, Q:f32, gain_db:f32\n'
              'filter type is fixed PEAKING; no EQ band is used as channel volume\n'
              'channel gain remains dedicated IDs 22..28, -70..+6 dB, 0.5 dB step\n'
              'RAM only: no SaveParams, flash erase/write, commit, reset, or Control 0x11\n',encoding='utf-8')
          Path('/tmp/R41_EQ7_STATE.txt').write_text(
              'R41_EQ_CHANNELS=7\nR41_EQ_BANDS_PER_CHANNEL=15\nR41_EQ_FILTER_TYPE=PEAKING_ONLY\n'
              'R41_EQ_BEFORE_GAIN=YES\nR41_CH1_CH2=DAC0_L_R\nR41_CH3=DACX_MONO\n'
              'R41_CH4_CH5=I2S0_L_R\nR41_CH6_CH7=I2S1_L_R\nFLASH_ALLOWED=NO\n',encoding='utf-8')
          print('R41 7x15 EQ engine and runtime bridge wired')
          PYPATCH41

          grep -a 'okn_eq7_init' /tmp/bp1048/BT_Audio_APP/bt_audio_app_src/apps/main_task.c
          grep -a 'okn_eq7_process_interleaved_lane(0u' /tmp/bp1048/BT_Audio_APP/bt_audio_app_src/services/audio_core_api.c
          grep -a 'okn_eq7_ufe_write' /tmp/bp1048/BT_Audio_APP/bt_audio_app_src/audio/communication.c

      - name: Build active source graph from vendor Eclipse project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYGRAPH'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          sdk = Path('/tmp/bp1048')
          app = sdk / 'BT_Audio_APP'
          project = ET.parse(app / '.project').getroot()
          cproject = ET.parse(app / '.cproject').getroot()

          # Eclipse source exclusions from the vendor Debug/Release configs.
          exclusions = set()
          for e in cproject.iter('entry'):
              raw = e.attrib.get('excluding', '')
              exclusions.update(x for x in raw.split('|') if x)

          sources = {}
          local = app / 'bt_audio_app_src'
          for p in local.rglob('*'):
              if p.is_file() and p.suffix.lower() in {'.c', '.s'}:
                  logical = p.relative_to(app).as_posix()
                  sources[p.resolve()] = logical

          # External sources are linked into the Eclipse project as file resources.
          for link in project.iter('link'):
              name = (link.findtext('name') or '').strip()
              typ = (link.findtext('type') or '').strip()
              uri = (link.findtext('locationURI') or '').strip().replace('&amp;', '&')
              if typ != '1' or not name.lower().endswith(('.c', '.s')):
                  continue
              if uri.startswith('PARENT-1-PROJECT_LOC/'):
                  p = sdk / uri[len('PARENT-1-PROJECT_LOC/'):]
              elif uri.startswith('WORKSPACE_LOC/'):
                  p = sdk / uri[len('WORKSPACE_LOC/'):]
              else:
                  continue
              if p.is_file():
                  sources[p.resolve()] = name

          def norm(s: str) -> str:
              # Eclipse project paths changed spelling/case over SDK revisions.
              s = s.replace('\\', '/').lower().replace('_', '')
              while '//' in s:
                  s = s.replace('//', '/')
              return s.strip('/')

          exn = sorted({norm(x) for x in exclusions})
          active=[]
          excluded=[]
          for physical, logical in sorted(sources.items(), key=lambda x: x[1].lower()):
              ln=norm(logical)
              matches=[e for e in exn if ln == e or ln.endswith('/'+e)]
              if matches:
                  excluded.append((str(physical), logical, matches[0]))
              else:
                  active.append((str(physical), logical))

          out=Path('/tmp/R39_ACTIVE_SOURCES.tsv')
          out.write_text(''.join(f'{p}\t{l}\n' for p,l in active), encoding='utf-8')
          Path('/tmp/R39_EXCLUDED_SOURCES.tsv').write_text(
              ''.join(f'{p}\t{l}\t{e}\n' for p,l,e in excluded), encoding='utf-8')
          Path('/tmp/R39_SOURCE_GRAPH_SUMMARY.txt').write_text(
              f'DISCOVERED={len(sources)}\nACTIVE={len(active)}\nEXCLUDED={len(excluded)}\n', encoding='ascii')
          print(Path('/tmp/R39_SOURCE_GRAPH_SUMMARY.txt').read_text(), end='')
          print('Excluded by vendor .cproject:')
          for _,logical,e in excluded:
              print(' ', logical, '<=', e)

          # Hard evidence from R38.1: both display files are excluded by the vendor project.
          expected={'bt_audio_app_src/display/seg_lcd_disp.c','bt_audio_app_src/display/sled_disp.c'}
          actual={l for _,l,_ in excluded}
          missing=expected-actual
          if missing:
              raise SystemExit('vendor exclusion mapping failed for: '+', '.join(sorted(missing)))
          PYGRAPH

      - name: Compile active BT_Audio_APP source graph
        id: compile_full
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          CC=nds32le-elf-gcc
          COMMON=(-Os -g3 -mcpu=d1088-spu -mcmodel=medium -mext-dsp -mext-zol -fsingle-precision-constant -ffunction-sections -fdata-sections)
          APP=(-DFUNC_OS_EN=1 -DCFG_APP_CONFIG -DHAVE_CONFIG_H)
          rm -rf /tmp/r39obj /tmp/r39compile
          mkdir -p /tmp/r39obj /tmp/r39compile
          : > /tmp/R39_COMPILE_RESULTS.tsv
          pass=0; fail=0; n=0
          while IFS=$'\t' read -r src logical; do
            test -n "$src" || continue
            n=$((n+1))
            rel="${logical%.*}.o"
            obj="/tmp/r39obj/$rel"
            log="/tmp/r39compile/${n}.log"
            mkdir -p "$(dirname "$obj")"
            set +e
            "$CC" "${COMMON[@]}" @/tmp/r38_includes.rsp "${APP[@]}" -c "$src" -o "$obj" >"$log" 2>&1
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              pass=$((pass+1)); printf 'PASS\t%s\t%s\n' "$logical" "$obj" >> /tmp/R39_COMPILE_RESULTS.tsv
            else
              fail=$((fail+1)); printf 'FAIL\t%s\t%s\n' "$logical" "$log" >> /tmp/R39_COMPILE_RESULTS.tsv
            fi
          done < /tmp/R39_ACTIVE_SOURCES.tsv
          printf 'TOTAL=%d\nPASS=%d\nFAIL=%d\n' "$n" "$pass" "$fail" | tee /tmp/R39_COMPILE_SUMMARY.txt
          : > /tmp/R39_FIRST_COMPILE_FAILURES.txt
          awk -F '\t' '$1=="FAIL" && n<20 {print $2"\t"$3; n++}' /tmp/R39_COMPILE_RESULTS.tsv | while IFS=$'\t' read -r logical log; do
            echo "===== $logical =====" >> /tmp/R39_FIRST_COMPILE_FAILURES.txt
            sed -n '1,100p' "$log" >> /tmp/R39_FIRST_COMPILE_FAILURES.txt
          done
          test "$fail" -eq 0

      - name: Compile TRUE7CH gain bridge plus R40 dual-I2S sidecar
        id: compile_true7ch
        if: steps.compile_full.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$R36_ROOT"
          CC=nds32le-elf-gcc
          COMMON=(-Os -g3 -mcpu=d1088-spu -mcmodel=medium -mext-dsp -mext-zol -fsingle-precision-constant -ffunction-sections -fdata-sections)
          APP=(-DFUNC_OS_EN=1 -DCFG_APP_CONFIG -DHAVE_CONFIG_H)
          mkdir -p /tmp/r39_true7ch
          cd "$ROOT"
          "$CC" "${COMMON[@]}" @/tmp/r38_includes.rsp -c firmware/src/okn_gain7.c -o /tmp/r39_true7ch/okn_gain7.o
          "$CC" "${COMMON[@]}" @/tmp/r38_includes.rsp -c firmware/src/okn_ufe_gain7.c -o /tmp/r39_true7ch/okn_ufe_gain7.o
          "$CC" "${COMMON[@]}" @/tmp/r38_includes.rsp -c firmware/src/okn_r36_sdk_bridge.c -o /tmp/r39_true7ch/okn_r36_sdk_bridge.o
          "$CC" "${COMMON[@]}" @/tmp/r38_includes.rsp "${APP[@]}" -c /tmp/r40gen/okn_r40_dual_i2s.c -o /tmp/r39_true7ch/okn_r40_dual_i2s.o
          "$CC" "${COMMON[@]}" @/tmp/r38_includes.rsp "${APP[@]}" -c /tmp/r41gen/okn_eq7.c -o /tmp/r39_true7ch/okn_eq7.o
          nds32le-elf-nm -a /tmp/r39_true7ch/*.o > /tmp/R40_TRUE7CH_OBJECT_SYMBOLS.txt
          for sym in okn_r40_dual_i2s_init okn_r40_route_from_dac0 okn_r40_i2s_push okn_r40_apply_dac_gains; do
            grep -Eq "[[:space:]]${sym}$" /tmp/R40_TRUE7CH_OBJECT_SYMBOLS.txt || { echo "missing R40 object symbol $sym" >&2; exit 1; }
          done

      - name: Provide public-SDK UART mutex storage compatibility
        id: compile_rtos_compat
        if: steps.compile_full.outcome == 'success' && steps.compile_true7ch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          CC=nds32le-elf-gcc
          COMMON=(-Os -g3 -mcpu=d1088-spu -mcmodel=medium -mext-dsp -mext-zol -fsingle-precision-constant -ffunction-sections -fdata-sections)
          APP=(-DFUNC_OS_EN=1 -DCFG_APP_CONFIG -DHAVE_CONFIG_H)
          cat > /tmp/r39_uart_mutex_compat.c <<'EOF'
          #include <stddef.h>
          #include "rtos_api.h"
          /* Public SDK v0.1.12 declares these as extern but does not ship a
           * definition in the active source graph. Weak storage preserves
           * vendor override semantics if a strong definition is ever present. */
          __attribute__((weak)) osMutexId UART0Mutex = NULL;
          __attribute__((weak)) osMutexId UART1Mutex = NULL;
          EOF
          "$CC" "${COMMON[@]}" @/tmp/r38_includes.rsp "${APP[@]}" \
            -c /tmp/r39_uart_mutex_compat.c -o /tmp/r39_true7ch/r39_uart_mutex_compat.o
          nds32le-elf-nm -a /tmp/r39_true7ch/r39_uart_mutex_compat.o > /tmp/R39_UART_MUTEX_COMPAT_SYMBOLS.txt
          grep -Eq '[[:space:]][VvWw][[:space:]]+UART0Mutex$' /tmp/R39_UART_MUTEX_COMPAT_SYMBOLS.txt || { cat /tmp/R39_UART_MUTEX_COMPAT_SYMBOLS.txt; exit 1; }
          grep -Eq '[[:space:]][VvWw][[:space:]]+UART1Mutex$' /tmp/R39_UART_MUTEX_COMPAT_SYMBOLS.txt || { cat /tmp/R39_UART_MUTEX_COMPAT_SYMBOLS.txt; exit 1; }

      - name: Full link BT_Audio_APP plus R40 dual-I2S gain architecture
        id: full_link
        if: steps.compile_full.outcome == 'success' && steps.compile_true7ch.outcome == 'success' && steps.compile_rtos_compat.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          SDK=/tmp/bp1048
          CC=nds32le-elf-gcc
          ADX=/tmp/R41_BP1048P4_TRUE7CH_7X15_EQ_NOT_FOR_FLASH.adx
          BIN=/tmp/R41_BP1048P4_TRUE7CH_7X15_EQ_NOT_FOR_FLASH.bin
          MAP=/tmp/R41_BP1048P4_TRUE7CH_7X15_EQ.map

          mapfile -t OBJS < <(find /tmp/r39obj -type f -name '*.o' | sort)
          test "${#OBJS[@]}" -gt 100
          printf '%s\n' "${OBJS[@]}" > /tmp/R39_OBJECT_LIST.txt

          LIBS=(
            "$SDK/MVsB1_Base_SDK/driver/driver/libDriver.a"
            "$SDK/MVsB1_Base_SDK/middleware/audio/libsra.a"
            "$SDK/MVsB1_Base_SDK/middleware/cec/libcec.a"
            "$SDK/MVsB1_Base_SDK/middleware/audio/libsbcenc.a"
            "$SDK/MVsB1_Base_SDK/middleware/audio/libVocalCut.a"
            "$SDK/MVsB1_Base_SDK/middleware/audio/libmp3enc.a"
            "$SDK/MVsB1_Base_SDK/middleware/audio/libAudioEffectLibrary.a"
            "$SDK/MVsB1_Base_SDK/middleware/audio/libresampler.a"
            "$SDK/MVsB1_Base_SDK/middleware/audio/libAudioDecoderLibrary.a"
            "$SDK/MVsB1_Base_SDK/middleware/bluetooth/libBtStack.a"
            "$SDK/MVsB1_Base_SDK/middleware/flashfs/libFlashFS.a"
            "$SDK/MVsB1_Base_SDK/middleware/lrc/libLrc.a"
            "$SDK/MVsB1_Base_SDK/middleware/fatfs/libfatfs.a"
            "$SDK/MVsB1_Base_SDK/middleware/rtc/libRTC.a"
            "$SDK/MVsB1_Base_SDK/middleware/audio/libcvsd_plc.a"
            "$SDK/MVsB1_Base_SDK/middleware/audio/libBlueAEC.a"
            "$SDK/MVsB1_Base_SDK/middleware/xmai/libxmauth.a"
            "$SDK/BT_Audio_APP/bt_audio_app_src/libopus/lib/libopus.a"
          )
          for lib in "${LIBS[@]}"; do test -f "$lib" || { echo "missing lib $lib" >&2; exit 1; }; done
          printf '%s\n' "${LIBS[@]}" > /tmp/R39_LIBRARY_LIST.txt

          set +e
          "$CC" -static -nostartfiles -g3 -mcpu=d1088-spu -mcmodel=medium -mext-dsp \
            -Wl,--gc-sections \
            -Wl,-Map,"$MAP" \
            -T "$SDK/BT_Audio_APP/nds32-ae210p.ld" \
            -o "$ADX" \
            "${OBJS[@]}" \
            /tmp/r39_true7ch/okn_gain7.o \
            /tmp/r39_true7ch/okn_ufe_gain7.o \
            /tmp/r39_true7ch/okn_r36_sdk_bridge.o \
            /tmp/r39_true7ch/okn_r40_dual_i2s.o \
            /tmp/r39_true7ch/okn_eq7.o \
            /tmp/r39_true7ch/r39_uart_mutex_compat.o \
            -Wl,--start-group "${LIBS[@]}" -ldsp -lm -Wl,--end-group \
            > /tmp/R39_LINK.log 2>&1
          rc=$?
          set -e
          echo "$rc" > /tmp/R39_LINK_RC.txt
          if [ "$rc" -ne 0 ]; then
            sed -n '1,300p' /tmp/R39_LINK.log > /tmp/R39_LINK_FIRST_ERRORS.txt
            exit "$rc"
          fi

          nds32le-elf-objcopy -O binary "$ADX" "$BIN"
          nds32le-elf-size "$ADX" > /tmp/R39_SIZE.txt
          nds32le-elf-readelf -h -S -l "$ADX" > /tmp/R39_READELF.txt
          nds32le-elf-nm -a -C "$ADX" > /tmp/R39_SYMBOLS.txt
          nds32le-elf-nm -u "$ADX" > /tmp/R39_UNRESOLVED.txt || true
          nds32le-elf-readelf -Ws "$ADX" > /tmp/R40_SYMBOLS_READELF.txt
          nds32le-elf-readelf -rW "$ADX" > /tmp/R40_RELOCATIONS.txt
          nds32le-elf-objdump -d "$ADX" > /tmp/R39_DISASM.txt
          sha256sum "$ADX" "$BIN" "$MAP" > /tmp/R39_IMAGE_SHA256.txt
          wc -c "$ADX" "$BIN" > /tmp/R39_IMAGE_SIZES.txt
          od -An -tx1 -N256 "$BIN" > /tmp/R39_BIN_HEAD_256.txt

          for sym in _start Communication_Effect_Config okn_r36_init okn_r36_ufe_write_apply okn_r36_ufe_read AudioCoreSinkVolSet okn_r40_dual_i2s_init okn_r40_route_from_dac0 okn_r40_i2s_space_ok okn_r40_i2s_push okn_r40_apply_dac_gains okn_eq7_init okn_eq7_set_peaking okn_eq7_process_mono okn_eq7_process_interleaved_lane okn_eq7_ufe_write okn_eq7_ufe_read AudioI2S0_DataSet AudioI2S1_DataSet AudioI2S0_DataSpaceLenGet AudioI2S1_DataSpaceLenGet; do
            grep -Eq "[[:space:]]${sym}$" /tmp/R39_SYMBOLS.txt || { echo "missing final symbol $sym" >&2; exit 1; }
          done
          test -s "$BIN"

          # Andes binutils retains four STB_LOCAL/UND names from discarded/debug
          # input even though the final static ELF has no relocation sections.
          # Reject only runtime-relevant GLOBAL/WEAK UND entries, and pin the
          # LOCAL/UND informational set so a future change cannot pass silently.
          awk '$7=="UND" && ($5=="GLOBAL" || $5=="WEAK") {print}' /tmp/R40_SYMBOLS_READELF.txt > /tmp/R40_RUNTIME_UNRESOLVED.txt
          if [ -s /tmp/R40_RUNTIME_UNRESOLVED.txt ]; then
            echo 'runtime GLOBAL/WEAK unresolved symbols:' >&2
            cat /tmp/R40_RUNTIME_UNRESOLVED.txt >&2
            exit 1
          fi

          awk '$7=="UND" && $5=="LOCAL" && NF>=8 && $8!="" {print $8}' /tmp/R40_SYMBOLS_READELF.txt | sort -u > /tmp/R40_LOCAL_UND_INFO.txt
          printf '%s\n' CtxSave DispDeInit Display osPortMalloc | sort -u > /tmp/R40_EXPECTED_LOCAL_UND.txt
          diff -u /tmp/R40_EXPECTED_LOCAL_UND.txt /tmp/R40_LOCAL_UND_INFO.txt

          if grep -Eq '^Relocation section ' /tmp/R40_RELOCATIONS.txt; then
            echo 'unexpected relocation section(s) in final static ELF:' >&2
            cat /tmp/R40_RELOCATIONS.txt >&2
            exit 1
          fi

          echo 'PASS' > /tmp/R40_SYMBOL_GATE.txt

      - name: Analyze R41 image and runtime bridge safety
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYSAFE'
          from pathlib import Path
          out=[]
          p=Path('/tmp/R41_PATCHED_communication.c')
          if p.exists():
              s=p.read_bytes().decode('latin-1')
              start=s.find('/* OKN R38 TRUE7CH runtime bridge.')
              end=s.find('void Communication_Effect_Config', start)
              block=s[start:end] if start>=0 and end>start else ''
              forbidden=['Communication_Effect_0x11','SpiFlashErase','SpiFlashWrite','SaveParams','Reset_McuSystem']
              bad=[x for x in forbidden if x in block]
              out.append('RUNTIME_BRIDGE_FORBIDDEN=' + (','.join(bad) if bad else 'NONE'))
              out.append('RUNTIME_0x57=' + ('YES' if 'case 0x57:' in s else 'NO'))
              out.append('RUNTIME_0x58=' + ('YES' if 'case 0x58:' in s else 'NO'))
              out.append('VENDOR_0x11_STILL_PRESENT=' + ('YES' if 'case 0x11:' in s else 'NO'))
          else:
              out.append('PATCHED_COMMUNICATION=MISSING')

          adx=Path('/tmp/R41_BP1048P4_TRUE7CH_7X15_EQ_NOT_FOR_FLASH.adx')
          binp=Path('/tmp/R41_BP1048P4_TRUE7CH_7X15_EQ_NOT_FOR_FLASH.bin')
          out.append('FULL_LINK_ADX=' + ('YES' if adx.exists() and adx.stat().st_size else 'NO'))
          out.append('FULL_LINK_BIN=' + ('YES' if binp.exists() and binp.stat().st_size else 'NO'))
          out.append('R41_LINK_SYMBOL_GATE=' + ('PASS' if Path('/tmp/R40_SYMBOL_GATE.txt').exists() else 'FAIL'))
          out.append('R41_SEVEN_GAIN_LANES=YES')
          out.append('R41_SEVEN_OUTPUT_EQ_WIRED=YES')
          out.append('FLASH_ALLOWED=NO')
          out.append('REASON=R41 proves seven independent 15-band PEAKING output EQ paths before seven dedicated gain lanes; production flash/recovery validation is still pending.')
          Path('/tmp/R41_SAFETY_STATE.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          print('\n'.join(out))
          if any(x.startswith('RUNTIME_BRIDGE_FORBIDDEN=') and not x.endswith('NONE') for x in out):
              raise SystemExit('R41 runtime bridge safety audit failed')
          PYSAFE

      - name: Package R41 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r40_evidence
          for f in \
            /tmp/R39_ACTIVE_SOURCES.tsv \
            /tmp/R39_EXCLUDED_SOURCES.tsv \
            /tmp/R39_SOURCE_GRAPH_SUMMARY.txt \
            /tmp/R39_COMPILE_RESULTS.tsv \
            /tmp/R39_COMPILE_SUMMARY.txt \
            /tmp/R39_FIRST_COMPILE_FAILURES.txt \
            /tmp/R40_TRUE7CH_OBJECT_SYMBOLS.txt \
            /tmp/R39_UART_MUTEX_COMPAT_SYMBOLS.txt \
            /tmp/r39_uart_mutex_compat.c \
            /tmp/R39_OBJECT_LIST.txt \
            /tmp/R39_LIBRARY_LIST.txt \
            /tmp/R39_LINK.log \
            /tmp/R39_LINK_RC.txt \
            /tmp/R39_LINK_FIRST_ERRORS.txt \
            /tmp/R41_BP1048P4_TRUE7CH_7X15_EQ.map \
            /tmp/R41_BP1048P4_TRUE7CH_7X15_EQ_NOT_FOR_FLASH.adx \
            /tmp/R41_BP1048P4_TRUE7CH_7X15_EQ_NOT_FOR_FLASH.bin \
            /tmp/R39_SIZE.txt \
            /tmp/R39_READELF.txt \
            /tmp/R39_SYMBOLS.txt \
            /tmp/R39_UNRESOLVED.txt \
            /tmp/R40_SYMBOLS_READELF.txt \
            /tmp/R40_RUNTIME_UNRESOLVED.txt \
            /tmp/R40_LOCAL_UND_INFO.txt \
            /tmp/R40_EXPECTED_LOCAL_UND.txt \
            /tmp/R40_RELOCATIONS.txt \
            /tmp/R39_IMAGE_SHA256.txt \
            /tmp/R39_IMAGE_SIZES.txt \
            /tmp/R39_BIN_HEAD_256.txt \
            /tmp/R41_SAFETY_STATE.txt \
            /tmp/R40_SYMBOL_GATE.txt \
            /tmp/R40_DUAL_I2S_ARCH_STATE.txt \
            /tmp/R40_HOST_LANE_ISOLATION.txt \
            /tmp/R40_PATCHED_main_task.c \
            /tmp/R40_PATCHED_audio_core_api.c \
            /tmp/R41_EQ7_HOST_TEST.txt \
            /tmp/R41_EQ7_PROTOCOL.txt \
            /tmp/R41_EQ7_STATE.txt \
            /tmp/R41_PATCHED_main_task.c \
            /tmp/R41_PATCHED_audio_core_api.c \
            /tmp/R41_PATCHED_communication.c \
            /tmp/r41gen/okn_eq7.h \
            /tmp/r41gen/okn_eq7.c \
            /tmp/r40gen/okn_r40_dual_i2s.h \
            /tmp/r40gen/okn_r40_dual_i2s.c \
            /tmp/R38_PATCHED_communication.c \
            /tmp/R38_RUNTIME_PROTOCOL.txt; do
              test -f "$f" && cp "$f" /tmp/r40_evidence/
          done
          cat > /tmp/r40_evidence/README_R41.txt <<'EOF'
          R41 BP1048P4 TRUE7CH / 7x15 OUTPUT EQ INTEGRATION PROOF
          - Starts from the R39.1 full application build graph.
          - Keeps DAC0 and DACX in the vendor AudioCore path.
          - Adds a sidecar that initializes I2S0 and I2S1 simultaneously using DMA6/DMA7.
          - Routes pre-DAC0-gain stereo to I2S0 and I2S1 and applies CH4..CH7 gains independently.
          - CH1/CH2 use DAC0 L/R sink gain; CH3 uses DACX gain (physical mapping still experimental).
          - Runtime controls stay 0x57/0x58, response 0x60, actuator IDs 22..28.
          - R41 wires seven independent 15-band PEAKING output EQ contexts before the seven dedicated gain lanes.
          - Runtime EQ IDs 30..36 are RAM-only; gain IDs 22..28 remain separate.
          - Any produced .adx/.bin remains NOT FOR FLASH until production recovery/layout proof is complete.
          EOF
          (cd /tmp/r40_evidence && sha256sum * > R41_EVIDENCE_SHA256.txt)

      - name: Upload R41 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R41_BP1048P4_TRUE7CH_7X15_EQ_PROOF
          path: /tmp/r40_evidence/

      - name: R41 final gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat /tmp/R39_SOURCE_GRAPH_SUMMARY.txt || true
          cat /tmp/R39_COMPILE_SUMMARY.txt || true
          cat /tmp/R41_SAFETY_STATE.txt || true
          test -f /tmp/R39_LINK_RC.txt
          test "$(cat /tmp/R39_LINK_RC.txt)" = "0"
          test -s /tmp/R41_BP1048P4_TRUE7CH_7X15_EQ_NOT_FOR_FLASH.adx
          test -s /tmp/R41_BP1048P4_TRUE7CH_7X15_EQ_NOT_FOR_FLASH.bin
          test "$(cat /tmp/R40_SYMBOL_GATE.txt)" = 'PASS'
          grep -q '^R41_SEVEN_GAIN_LANES=YES$' /tmp/R41_SAFETY_STATE.txt
          grep -q '^R41_SEVEN_OUTPUT_EQ_WIRED=YES$' /tmp/R41_SAFETY_STATE.txt
          grep -q '^R41_EQ_CHANNELS=7$' /tmp/R41_EQ7_STATE.txt
          grep -q '^R41_EQ_BANDS_PER_CHANNEL=15$' /tmp/R41_EQ7_STATE.txt
          grep -q '^R41_EQ_BEFORE_GAIN=YES$' /tmp/R41_EQ7_STATE.txt
          echo 'PASS R41 TRUE7CH 7x15 PEAKING EQ before dedicated gain lanes; NOT FOR FLASH.'
