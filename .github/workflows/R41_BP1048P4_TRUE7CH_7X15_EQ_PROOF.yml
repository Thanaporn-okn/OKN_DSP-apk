          c=c.replace(inc,inc+'#include "okn_r40_dual_i2s.h"\r\n',1)

          fn_start=c.find('static bool AudioCoreSinkDataSet(void)')
          fn_end=c.find('\r\nvoid AudioCoreSourcePcmFormatConfig',fn_start)
