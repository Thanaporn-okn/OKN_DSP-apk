name: R41 BP1048P4 TRUE7CH 7x15 output EQ proof

on:
  workflow_dispatch:

jobs:
  r41-true7ch-eq-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack pinned R36 source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="OKN_BP1048P4_PHASE3_TRUE7CH_Source_R36.zip"
          test -f "$ZIP"
          echo "0edcc409352d7656ec0296b8416a55ea9f276299c396ed7fff6c8c5517cb3d82  $ZIP" | sha256sum -c -
          rm -rf /tmp/r36src
          mkdir -p /tmp/r36src
          unzip -q "$ZIP" -d /tmp/r36src
          ROOT="$(find /tmp/r36src -mindepth 1 -maxdepth 1 -type d -name 'OKN_BP1048P4_PHASE3_TRUE7CH_R36' | head -n1)"
          test -n "$ROOT"
          echo "R36_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Host 7CH lane-isolation regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$R36_ROOT"
          cat > /tmp/r40_lane_isolation_test.c <<'EOF'
          #include <assert.h>
          #include <stdint.h>
          #include <string.h>
          #include "okn_gain7.h"

          static void fill(int16_t *p, unsigned n, int16_t v) { unsigned i; for(i=0;i<n;i++) p[i]=v; }
          int main(void)
          {
              okn_gain7_state_t s;
              okn_gain7_topology_t t;
              int16_t main_lr[8], bass[4], i2s0[8], i2s1[8];
              int16_t main0[8], bass0[4], i2s00[8], i2s10[8];
              unsigned i;

              okn_gain7_init(&s);
              fill(main_lr,8,12000); fill(bass,4,12000); fill(i2s0,8,12000); fill(i2s1,8,12000);
              memcpy(main0,main_lr,sizeof(main_lr)); memcpy(bass0,bass,sizeof(bass));
              memcpy(i2s00,i2s0,sizeof(i2s0)); memcpy(i2s10,i2s1,sizeof(i2s1));
              assert(okn_gain7_set_db(&s,3u,-6.0f)); /* CH4 only */
              t.main_lr=main_lr; t.bass_mono=bass; t.i2s0_lr=i2s0; t.i2s1_lr=i2s1; t.frames=4u;
              okn_gain7_process_topology(&s,&t);
              assert(memcmp(main_lr,main0,sizeof(main_lr))==0);
              assert(memcmp(bass,bass0,sizeof(bass))==0);
              assert(memcmp(i2s1,i2s10,sizeof(i2s1))==0);
              for(i=0;i<4;i++) { assert(i2s0[2*i] != i2s00[2*i]); assert(i2s0[2*i+1] == i2s00[2*i+1]); }

              okn_gain7_init(&s);
              fill(main_lr,8,12000); fill(bass,4,12000); fill(i2s0,8,12000); fill(i2s1,8,12000);
              memcpy(main0,main_lr,sizeof(main_lr)); memcpy(bass0,bass,sizeof(bass));
              memcpy(i2s00,i2s0,sizeof(i2s0)); memcpy(i2s10,i2s1,sizeof(i2s1));
              assert(okn_gain7_set_db(&s,6u,-12.0f)); /* CH7 only */
              okn_gain7_process_topology(&s,&t);
              assert(memcmp(main_lr,main0,sizeof(main_lr))==0);
              assert(memcmp(bass,bass0,sizeof(bass))==0);
              assert(memcmp(i2s0,i2s00,sizeof(i2s0))==0);
              for(i=0;i<4;i++) { assert(i2s1[2*i] == i2s10[2*i]); assert(i2s1[2*i+1] != i2s10[2*i+1]); }
              return 0;
          }
          EOF
          gcc -std=c11 -Wall -Wextra -Werror -Ifirmware/include \
            firmware/src/okn_gain7.c /tmp/r40_lane_isolation_test.c -lm -o /tmp/r40_lane_test
          /tmp/r40_lane_test
          echo 'PASS R40 host lane isolation CH4 and CH7' | tee /tmp/R40_HOST_LANE_ISOLATION.txt

      - name: Install host prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libc6-i386 lib32z1 git unzip

      - name: Fetch pinned public BP1048 SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/leadercxn/bp1048_sdk_v0.1.12.git /tmp/bp1048
          cd /tmp/bp1048
          git checkout 8105bd864b04995d81c9f9ae77cb158259f39015
          test "$(git rev-parse HEAD)" = "8105bd864b04995d81c9f9ae77cb158259f39015"

      - name: Fetch Andes NDS32 toolchain
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Ai-Thinker-Open/Andestech.git /tmp/andes
          echo "/tmp/andes/BSPv422/toolchains/nds32le-elf-mculib-v3s/bin" >> "$GITHUB_PATH"

      - name: Verify SDK fingerprints and select BP1048P4
        shell: bash
        run: |
          set -euo pipefail
          cd "$R36_ROOT"
          python3 experimental_r36/scripts/check_sdk_files.py /tmp/bp1048
          python3 experimental_r36/scripts/enable_bp1048p4.py /tmp/bp1048
          grep -a '^#define  CFG_CHIP_BP1048P4' /tmp/bp1048/BT_Audio_APP/bt_audio_app_src/inc/app_config.h
          if grep -a -q '^#define  CFG_CHIP_BP10128' /tmp/bp1048/BT_Audio_APP/bt_audio_app_src/inc/app_config.h; then
            echo 'BP10128 is still enabled' >&2
            exit 1
          fi

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          nds32le-elf-gcc --version
          nds32le-elf-ld --version
          nds32le-elf-objdump --version

      - name: Repair Windows-origin header case on Linux
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCASE'
          from pathlib import Path
          import re

          root = Path('/tmp/bp1048')
          bases = [
              root / 'BT_Audio_APP',
              root / 'MVsB1_Base_SDK' / 'driver',
              root / 'MVsB1_Base_SDK' / 'middleware',
              root / 'develop_lib',
          ]
          headers = []
          for base in bases:
              if base.exists():
                  headers.extend(p for p in base.rglob('*') if p.is_file() and p.suffix.lower() in {'.h', '.hpp'})
          by_lower = {}
          for p in headers:
              by_lower.setdefault(p.name.lower(), []).append(p)

          rx = re.compile(r'^\s*#\s*include\s*[<\"]([^\">]+)[\">]', re.M)
          spellings = set()
          for base in bases:
              if not base.exists():
                  continue
              for p in base.rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in {'.c', '.h', '.hpp', '.s'}:
                      continue
                  try:
                      text = p.read_bytes().decode('latin-1')
                  except OSError:
                      continue
                  for inc in rx.findall(text):
                      if '/' not in inc and '\\' not in inc:
                          spellings.add(inc)

          made = []
          for inc in sorted(spellings):
              for target in by_lower.get(inc.lower(), []):
                  alias = target.with_name(inc)
                  if alias.name == target.name or alias.exists():
                      continue
                  try:
                      alias.symlink_to(target.name)
                  except OSError:
                      alias.write_bytes(target.read_bytes())
                  made.append((str(alias.relative_to(root)), target.name))

          must = root / 'MVsB1_Base_SDK/middleware/rtos/freertos/inc/freertos.h'
          if not must.exists():
              raise SystemExit('failed to create freertos.h compatibility alias')
          print('Created', len(made), 'case aliases')
          PYCASE

      - name: Build production include path from BT_Audio_APP project order
        shell: bash
        run: |
          set -euo pipefail
          SDK=/tmp/bp1048
          : > /tmp/r38_includes.rsp
          for d in \
            "$SDK/BT_Audio_APP/bt_audio_app_src/audio" \
            "$SDK/develop_lib/util" \
            "$SDK/develop_lib" \
            "$SDK/develop_lib/trace" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/ai/md5" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/ai/speex/include/speex" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/ai/speex/include" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/ai/speex/libspeex" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/ai/speex" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/ai" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/inc" \
            "$SDK/MVsB1_Base_SDK/driver/driver_api/inc/otg" \
            "$SDK/MVsB1_Base_SDK/middleware/rtc/inc" \
            "$SDK/MVsB1_Base_SDK/middleware/fatfs/inc" \
            "$SDK/MVsB1_Base_SDK/middleware/user/inc" \
            "$SDK/MVsB1_Base_SDK/middleware/bluetooth/inc" \
            "$SDK/MVsB1_Base_SDK/middleware/audio/inc" \
            "$SDK/MVsB1_Base_SDK/driver/driver/inc" \
            "$SDK/MVsB1_Base_SDK/driver/driver_api/inc" \
            "$SDK/MVsB1_Base_SDK/middleware/mv_utils/inc" \
            "$SDK/MVsB1_Base_SDK/middleware/lrc/inc" \
            "$SDK/MVsB1_Base_SDK/middleware/rtos/rtos_api" \
            "$SDK/MVsB1_Base_SDK/middleware/rtos/freertos/inc" \
            "$SDK/MVsB1_Base_SDK/middleware/flashfs/inc" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/display" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/user" \
            "$SDK/MVsB1_Base_SDK/middleware/cec/inc" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/ble"; do
            test -d "$d" && printf '%s\n' "-I$d" >> /tmp/r38_includes.rsp
          done
          find "$SDK/BT_Audio_APP" \
               "$SDK/MVsB1_Base_SDK/driver" \
               "$SDK/MVsB1_Base_SDK/middleware" \
               "$SDK/develop_lib" \
               -type f -name '*.h' -printf '%h\n' | sort -u | while read -r d; do
            grep -Fxq -- "-I$d" /tmp/r38_includes.rsp || printf '%s\n' "-I$d" >> /tmp/r38_includes.rsp
          done
          printf '%s\n' "-I$R36_ROOT/firmware/include" >> /tmp/r38_includes.rsp
          head -50 /tmp/r38_includes.rsp

      - name: Patch runtime dispatcher for TRUE7CH controls 0x57 0x58
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYPATCH'
          from pathlib import Path

          p = Path('/tmp/bp1048/BT_Audio_APP/bt_audio_app_src/audio/communication.c')
          b = p.read_bytes()
          original = b

          def once(old: bytes, new: bytes, label: str):
              global b
              n = b.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {n}')
              b = b.replace(old, new, 1)

          once(
              b'#include "main_task.h"',
              b'#include "main_task.h"\r\n#include "okn_r36_sdk_bridge.h"\r\n#include "okn_r40_dual_i2s.h"',
              'include hook')

          once(
              b'void Communication_Effect_Init(void)\r\n{',
              b'void Communication_Effect_Init(void)\r\n{\r\n\tokn_r36_init();',
              'init hook')

          marker = b'void Communication_Effect_Config(uint8_t Control, uint8_t *buf, uint32_t len)\r\n{'
          helper = br'''/* OKN R38 TRUE7CH runtime bridge. Runtime-only; no flash write path. */
          static void OKN_Communication_0x57(uint8_t *buf, uint32_t len)
          {
              uint8_t req[13];
              if((buf == NULL) || (len != 12u)) return;
              req[0] = OKN_UFE_WRITE;
              memcpy(&req[1], buf, 12u);
              if(okn_r36_ufe_write_apply(req, sizeof(req)))
              {
                  okn_r40_apply_dac_gains();
                  memset(tx_buf, 0, sizeof(tx_buf));
                  tx_buf[0] = OKN_UFE_WRITE;
                  Communication_Effect_Send(tx_buf, 1u);
              }
          }
          
          static void OKN_Communication_0x58(uint8_t *buf, uint32_t len)
          {
              uint8_t req[9];
              uint8_t resp[13];
              size_t n;
              if((buf == NULL) || (len != 8u)) return;
              req[0] = OKN_UFE_READ;
              memcpy(&req[1], buf, 8u);
              n = okn_r36_ufe_read(req, sizeof(req), resp, sizeof(resp));
              if((n != 13u) || (resp[0] != OKN_UFE_READ_RESPONSE)) return;
              memset(tx_buf, 0, sizeof(tx_buf));
              tx_buf[0] = 0xA5u;
              tx_buf[1] = 0x5Au;
              tx_buf[2] = OKN_UFE_READ_RESPONSE;
              tx_buf[3] = (uint8_t)(n - 1u);
              memcpy(&tx_buf[4], &resp[1], n - 1u);
              tx_buf[3u + n] = 0x16u;
              Communication_Effect_Send(tx_buf, (uint32_t)(n + 4u));
          }
          
          '''
          once(marker, helper + marker, 'runtime helper insertion')

          once(
              b'\t\tcase 0x80:\r\n',
              b'\t\tcase 0x57:\r\n\t\t\tOKN_Communication_0x57(buf, len);\r\n\t\t\treturn;\r\n\r\n'
              b'\t\tcase 0x58:\r\n\t\t\tOKN_Communication_0x58(buf, len);\r\n\t\t\treturn;\r\n\r\n'
              b'\t\tcase 0x80:\r\n',
              'dispatcher cases')

          if b == original:
              raise SystemExit('patch made no changes')

          # The vendor SDK declares AudioEffectListJudge while `bool` is the
          # type.h macro `unsigned char`.  Later includes can change the meaning
          # of `bool` under the Linux/Andes standalone build.  Spell the return
          # type explicitly at the definition so it matches the original ABI.
          legacy_sig = b'bool  AudioEffectListJudge(uint16_t len, const uint8_t *pbuff)\r\n{'
          explicit_sig = b'unsigned char AudioEffectListJudge(uint16_t len, const uint8_t *pbuff)\r\n{'
          n = b.count(legacy_sig)
          if n != 1:
              raise SystemExit(f'AudioEffectListJudge definition: expected one match, got {n}')
          b = b.replace(legacy_sig, explicit_sig, 1)

          p.write_bytes(b)

          # Safety assertions: new runtime hooks are present and the destructive 0x11
          # branch remains separate/unmodified.
          text = b.decode('latin-1')
          for needle in ['OKN_Communication_0x57', 'OKN_Communication_0x58',
                         'case 0x57:', 'case 0x58:', 'okn_r36_init();',
                         'unsigned char AudioEffectListJudge']:
              if needle not in text:
                  raise SystemExit('missing patched token: ' + needle)
          if text.count('case 0x11:') != 1 or text.count('Communication_Effect_0x11(buf, len);') != 1:
              raise SystemExit('destructive 0x11 branch changed unexpectedly')

          Path('/tmp/R38_PATCHED_communication.c').write_bytes(b)
          Path('/tmp/R38_RUNTIME_PROTOCOL.txt').write_text(
              'R38.1 runtime protocol (experimental, RAM only)\n'
              'WRITE: A5 5A 57 0C <id32be><offset16be><len16be><float32le> 16\n'
              'READ : A5 5A 58 08 <id32be><offset16be><len16be> 16\n'
              'READ RESPONSE: A5 5A 60 0C <id32be><offset16be><len16be><float32le> 16\n'
              'IDs: CH1..CH7 = 22..28\n'
              'No SaveParams, erase, program, commit, reset, or Control 0x11 is used by this bridge.\n',
              encoding='utf-8')
          print('R38 communication runtime patch applied')
          PYPATCH

      - name: Patch R40 dual-I2S sidecar and physical 7CH gain lanes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r40gen
          cat > /tmp/r40gen/okn_r40_dual_i2s.h <<'EOFH'
          #ifndef OKN_R40_DUAL_I2S_H
          #define OKN_R40_DUAL_I2S_H
          #include <stdint.h>
          void okn_r40_dual_i2s_init(uint32_t sample_rate, uint16_t frames);
          void okn_r40_apply_dac_gains(void);
          void okn_r40_route_from_dac0(const int16_t *src_lr, uint16_t frames);
          uint8_t okn_r40_i2s_space_ok(uint16_t frames);
          uint8_t okn_r40_i2s_push(uint16_t frames);
          #endif
          EOFH
          cat > /tmp/r40gen/okn_r40_dual_i2s.c <<'EOFC'
          #include <stdint.h>
          #include <stddef.h>
          #include <string.h>
          #include "app_config.h"
          #include "audio_core_api.h"
          #include "i2s_interface.h"
          #include "dma.h"
          #include "gpio.h"
          #include "okn_r40_dual_i2s.h"

          /* Keep this translation unit on the vendor SDK's unsigned-char bool ABI.
             Only the two bool-free R36 helpers are needed here. */
          extern uint16_t okn_r36_gain_q12(uint8_t ch0);
          extern void okn_r36_process_i2s16_copy(uint8_t first_ch0,
                                                  const int16_t *src,
                                                  int16_t *dst,
                                                  size_t frames);

          #define OKN_R40_MAX_FRAMES 512u
          static uint32_t s_i2s0_fifo[OKN_R40_MAX_FRAMES * 2u];
          static uint32_t s_i2s1_fifo[OKN_R40_MAX_FRAMES * 2u];
          static int16_t  s_i2s0_out[OKN_R40_MAX_FRAMES * 2u];
          static int16_t  s_i2s1_out[OKN_R40_MAX_FRAMES * 2u];
          static uint16_t s_frames;
          static uint8_t s_ready;

          static void okn_r40_i2s0_pins(void)
          {
              GPIO_PortAModeSet(GPIOA0, 9); /* mclk */
              GPIO_PortAModeSet(GPIOA1, 6); /* lrclk */
              GPIO_PortAModeSet(GPIOA2, 5); /* bclk */
              GPIO_PortAModeSet(GPIOA3, 7); /* dout */
              GPIO_PortAModeSet(GPIOA4, 1); /* din */
          }

          static void okn_r40_i2s1_pins(void)
          {
              GPIO_PortAModeSet(GPIOA7, 5);  /* mclk */
              GPIO_PortAModeSet(GPIOA8, 1);  /* lrclk */
              GPIO_PortAModeSet(GPIOA9, 2);  /* bclk */
              GPIO_PortAModeSet(GPIOA10, 4); /* dout */
              GPIO_PortAModeSet(GPIOA11, 2); /* din */
          }

          static void okn_r40_init_one(I2S_MODULE module, uint8_t peripheral,
                                       void *fifo, uint32_t sample_rate, uint16_t frames)
          {
              I2SParamCt p;
              memset(&p, 0, sizeof(p));
              p.IsMasterMode = 0u;
              p.SampleRate = sample_rate;
              p.I2sFormat = I2S_FORMAT_I2S;
              p.I2sBits = I2S_LENGTH_16BITS;
              p.I2sTxRxEnable = 1u;
              p.TxPeripheralID = peripheral;
              p.TxBuf = fifo;
              p.TxLen = (uint16_t)(frames * 8u); /* vendor: two stereo DMA frames */
              AudioI2S_Init(module, &p);
          }

          void okn_r40_apply_dac_gains(void)
          {
              AudioCoreSinkVolSet(AUDIO_DAC0_SINK_NUM,
                                  okn_r36_gain_q12(0u), okn_r36_gain_q12(1u));
          #ifdef CFG_RES_AUDIO_DACX_EN
              /* CH3 physical lane. Both DACX lanes carry the same gain until R41 routing. */
              AudioCoreSinkVolSet(AUDIO_DACX_SINK_NUM,
                                  okn_r36_gain_q12(2u), okn_r36_gain_q12(2u));
          #endif
          }

          void okn_r40_dual_i2s_init(uint32_t sample_rate, uint16_t frames)
          {
              if ((frames == 0u) || (frames > OKN_R40_MAX_FRAMES)) {
                  s_ready = 0u;
                  return;
              }
              s_frames = frames;
              memset(s_i2s0_fifo, 0, sizeof(s_i2s0_fifo));
              memset(s_i2s1_fifo, 0, sizeof(s_i2s1_fifo));
              memset(s_i2s0_out, 0, sizeof(s_i2s0_out));
              memset(s_i2s1_out, 0, sizeof(s_i2s1_out));
              okn_r40_i2s0_pins();
              okn_r40_i2s1_pins();
              okn_r40_init_one(I2S0_MODULE, PERIPHERAL_ID_I2S0_TX,
                               s_i2s0_fifo, sample_rate, frames);
              okn_r40_init_one(I2S1_MODULE, PERIPHERAL_ID_I2S1_TX,
                               s_i2s1_fifo, sample_rate, frames);
              s_ready = 1u;
              okn_r40_apply_dac_gains();
          }

          void okn_r40_route_from_dac0(const int16_t *src_lr, uint16_t frames)
          {
              if (!s_ready || !src_lr || frames != s_frames) return;
              /* R40 proves physical independent gain lanes only. R41 will insert
                 seven explicit output EQ instances before these lane gains. */
              okn_r36_process_i2s16_copy(3u, src_lr, s_i2s0_out, frames);
              okn_r36_process_i2s16_copy(5u, src_lr, s_i2s1_out, frames);
          }

          uint8_t okn_r40_i2s_space_ok(uint16_t frames)
          {
              if (!s_ready) return 1u;
              if (frames != s_frames) return 0u;
              return AudioI2S0_DataSpaceLenGet() >= frames &&
                     AudioI2S1_DataSpaceLenGet() >= frames;
          }

          uint8_t okn_r40_i2s_push(uint16_t frames)
          {
              if (!s_ready) return 1u;
              if (!okn_r40_i2s_space_ok(frames)) return 0u;
              AudioI2S0_DataSet(s_i2s0_out, frames);
              AudioI2S1_DataSet(s_i2s1_out, frames);
              return 1u;
          }
          EOFC

          python3 - <<'PYPATCH40'
          from pathlib import Path
          import re
          sdk=Path('/tmp/bp1048')
          main=sdk/'BT_Audio_APP/bt_audio_app_src/apps/main_task.c'
          core=sdk/'BT_Audio_APP/bt_audio_app_src/services/audio_core_api.c'
          app=sdk/'BT_Audio_APP/bt_audio_app_src/inc/app_config.h'

          app_text=app.read_bytes().decode('latin-1')
          if re.search(r'(?m)^\s*#\s*define\s+CFG_COMMUNICATION_BY_UART\b', app_text):
              raise SystemExit('R40 refuses dual I2S DMA6/7 while UART communication is enabled')

          m=main.read_bytes().decode('latin-1')
          old=m
          if '#include "okn_r40_dual_i2s.h"' not in m:
              marker='#include "i2s_interface.h"\r\n'
              if m.count(marker)!=1: raise SystemExit('main include marker mismatch')
              m=m.replace(marker, marker+'#include "okn_r40_dual_i2s.h"\r\n',1)

          # Public SDK maps only one selected I2S TX to DMA7. R40 reserves
          # DMA6 for I2S0 TX and DMA7 for I2S1 TX. UART tuning is guarded off above.
          pat0=(r'#if[^\r\n]*CFG_RES_AUDIO_I2SOUT_EN[^\r\n]*CFG_RES_I2S_PORT==0[^\r\n]*\r?\n'
                r'\s*7,//PERIPHERAL_ID_I2S0_TX[^\r\n]*\r?\n'
                r'#else[^\r\n]*\r?\n'
                r'\s*255,//PERIPHERAL_ID_I2S0_TX[^\r\n]*\r?\n'
                r'#endif[^\r\n]*\r?\n')
