name: OKN BP1048P4 MASTER V36 READ-ONLY USB TOPOLOGY + HID DESCRIPTOR DUMP S25 USB-C ONLY

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/OKN_BP1048P4_MASTER_V36_READ_ONLY_USB_TOPOLOGY_HID_DESCRIPTOR_DUMP_S25_USB_C_ONLY.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FLASH_ALLOWED: "NO"
  ERASE_ALLOWED: "NO"
  WRITE_ALLOWED: "NO"
  FEATURE_REPORT_ALLOWED: "NO"
  HOST_OUTPUT_ALLOWED: "NO"
  STARTUP_COMMAND_ALLOWED: "NO"
  AUTH_REPLY_ALLOWED: "NO"

jobs:
  build-v36:
    name: Build read-only USB topology + HID descriptor dump APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          test "$ERASE_ALLOWED" = "NO"
          test "$WRITE_ALLOWED" = "NO"
          test "$FEATURE_REPORT_ALLOWED" = "NO"
          test "$HOST_OUTPUT_ALLOWED" = "NO"
          test "$STARTUP_COMMAND_ALLOWED" = "NO"
          test "$AUTH_REPLY_ALLOWED" = "NO"

          rm -rf /tmp/v36
          mkdir -p /tmp/v36/app/app/src/main/java/com/okn/bp1048p4v36
          mkdir -p /tmp/v36/app/app/src/main/res/xml
          mkdir -p /tmp/v36/evidence /tmp/v36/out

          cat > /tmp/v36/evidence/00_SCOPE.txt <<'EOF'
          REVISION=MASTER-V36
          MODE=READ_ONLY_USB_TOPOLOGY_AND_HID_DESCRIPTOR_DUMP
          REQUIRED_PHONE=Samsung Galaxy S25+
          REQUIRED_PATH=Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only

          HOST_APPLICATION_OUTPUT_COUNT=0
          STARTUP_COMMAND_SENT=NO
          AUTH_REPLY_SENT=NO
          FEATURE_REPORT=NO
          FLASH_ALLOWED=NO
          ERASE_ALLOWED=NO
          WRITE_ALLOWED=NO

          PURPOSE:
          V35 Fixed V2 proved the exact production runtime fingerprint but aborted
          because HID interface 4 exposes no interrupt-IN endpoint to Android.
          V36 inventories every USB interface/endpoint and dumps the exact HID
          report descriptor bytes for interfaces 3 and 4 using control-IN only.
          EOF

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail
          A=/tmp/v36/app

          cat > "$A/settings.gradle" <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name='OKN_BP1048P4_V36_USB_TOPOLOGY'
          include ':app'
          EOF

          cat > "$A/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > "$A/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > "$A/app/build.gradle" <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.okn.bp1048p4v36'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.okn.bp1048p4v36'
                  minSdk 29
                  targetSdk 35
                  versionCode 36
                  versionName '36.0'
              }
          }
          EOF

          cat > "$A/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.usb.host" android:required="true"/>

              <application
                  android:allowBackup="false"
                  android:label="OKN BP1048P4 V36 USB Topology">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED"/>
                      </intent-filter>

                      <meta-data
                          android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED"
                          android:resource="@xml/device_filter"/>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > "$A/app/src/main/res/xml/device_filter.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <usb-device vendor-id="25380" product-id="5913"/>
          </resources>
          EOF

          cat > "$A/app/src/main/java/com/okn/bp1048p4v36/MainActivity.java" <<'JAVA'
          package com.okn.bp1048p4v36;

          import android.app.Activity;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.hardware.usb.UsbConstants;
          import android.hardware.usb.UsbDevice;
          import android.hardware.usb.UsbDeviceConnection;
          import android.hardware.usb.UsbEndpoint;
          import android.hardware.usb.UsbInterface;
          import android.hardware.usb.UsbManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.SystemClock;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import java.security.MessageDigest;
          import java.util.Arrays;
          import java.util.HashMap;
          import java.util.Locale;
          import java.util.Map;

          @SuppressWarnings("deprecation")
          public class MainActivity extends Activity {
              private static final int VID=0x6324;
              private static final int PID=0x1719;
              private static final int SAVE_EVIDENCE=136;
              private static final String USB_PERMISSION=
                  "com.okn.bp1048p4v36.USB_PERMISSION";

              private static final String RAW_SHA=
                  "C7E861A6F28EB832E16450D3A35B64C557BEA4E0CC15FF1EB94C45E348C84001";
              private static final String IF3_SHA=
                  "BAFE7C0E6A251EB36B11362B18106DFF3DC0010A831A3B8B6CD49DBF4A9AE2C3";
              private static final String IF4_SHA=
                  "78510751B31DCC204CD6CA2FE023F05CF84B75227A279E8E1FBAF7D6C3A21B6F";

              private UsbManager usb;
              private TextView log;
              private final StringBuilder evidence=new StringBuilder();
              private long t0;
              private boolean exactFingerprint=false;

              private final BroadcastReceiver permissionRx=new BroadcastReceiver() {
                  @Override public void onReceive(Context c, Intent i) {
                      if(!USB_PERMISSION.equals(i.getAction())) return;
                      UsbDevice d=getDevice(i);
                      boolean ok=i.getBooleanExtra(
                          UsbManager.EXTRA_PERMISSION_GRANTED,false);
                      line("USB_PERMISSION_RESULT="+ok+dev(d));
                      if(ok && runtime(d)) inspect(d);
                  }
              };

              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  t0=SystemClock.elapsedRealtime();
                  usb=(UsbManager)getSystemService(Context.USB_SERVICE);

                  evidence.append("EVIDENCE_FORMAT=OKN_BP1048P4_V36_READ_ONLY_USB_TOPOLOGY\n");
                  evidence.append("REQUIRED_PHONE=Samsung Galaxy S25+\n");
                  evidence.append("REQUIRED_PATH=Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only\n");
                  evidence.append("EXPECTED_RUNTIME_VID_PID=6324:1719\n");
                  evidence.append("HOST_APPLICATION_OUTPUT_COUNT=0\n");
                  evidence.append("STARTUP_COMMAND_SENT=false\n");
                  evidence.append("AUTH_REPLY_SENT=false\n");
                  evidence.append("FEATURE_REPORT_USED=false\n");
                  evidence.append("FLASH_WRITE_ERASE_RECOVERY=false\n");

                  IntentFilter pf=new IntentFilter(USB_PERMISSION);
                  if(Build.VERSION.SDK_INT>=33) {
                      registerReceiver(permissionRx,pf,Context.RECEIVER_NOT_EXPORTED);
                  } else {
                      registerReceiver(permissionRx,pf);
                  }

                  LinearLayout root=new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(28,28,28,28);

                  TextView title=new TextView(this);
                  title.setText("OKN BP1048P4 V36 — Read-only USB topology");
                  title.setTextSize(20);
                  root.addView(title);

                  TextView note=new TextView(this);
                  note.setText(
                      "\nรอบนี้อ่าน topology/descriptor เท่านั้น\n"+
                      "• ไม่ส่ง startup\n"+
                      "• ไม่ส่ง auth reply\n"+
                      "• ไม่มี Output/Feature report\n"+
                      "• ไม่ flash/erase/write\n\n"+
                      "กด INSPECT แล้ว SAVE FULL EVIDENCE REPORT\n");
                  root.addView(note);

                  add(root,"REQUEST USB PERMISSION + INSPECT EXACT BOARD",v->scan(true));
                  add(root,"SAVE FULL EVIDENCE REPORT",v->saveEvidence());

                  log=new TextView(this);
                  log.setTextIsSelectable(true);
                  log.setText("\nLog:\n");
                  root.addView(log);

                  ScrollView sv=new ScrollView(this);
                  sv.addView(root);
                  setContentView(sv);

                  scan(false);
              }

              private Button add(
                  LinearLayout root,
                  String text,
                  android.view.View.OnClickListener listener) {

                  Button b=new Button(this);
                  b.setAllCaps(false);
                  b.setText(text);
                  b.setOnClickListener(listener);
                  root.addView(b);
                  return b;
              }

              private void line(String s) {
                  long ms=SystemClock.elapsedRealtime()-t0;
                  String row=String.format(Locale.US,"[%06dms] %s\n",ms,s);
                  evidence.append(row);
                  runOnUiThread(()->{
                      if(log!=null)log.append(row);
                  });
              }

              private UsbDevice getDevice(Intent i) {
                  if(Build.VERSION.SDK_INT>=33)
                      return i.getParcelableExtra(
                          UsbManager.EXTRA_DEVICE,UsbDevice.class);
                  return i.getParcelableExtra(UsbManager.EXTRA_DEVICE);
              }

              private boolean runtime(UsbDevice d) {
                  return d!=null && d.getVendorId()==VID && d.getProductId()==PID;
              }

              private String dev(UsbDevice d) {
                  if(d==null)return " device=<NULL>";
                  return String.format(
                      Locale.US,
                      " vid=%04X pid=%04X id=%d ifaces=%d",
                      d.getVendorId(),d.getProductId(),
                      d.getDeviceId(),d.getInterfaceCount());
              }

              private void scan(boolean requestPermission) {
                  UsbDevice target=null;

                  for(UsbDevice d:usb.getDeviceList().values()) {
                      line("USB_DEVICE="+dev(d)+" permission="+usb.hasPermission(d));
                      if(runtime(d))target=d;
                  }

                  if(target==null) {
                      line("RUNTIME_TARGET_FOUND=false");
                      return;
                  }

                  line("RUNTIME_TARGET_FOUND=true");

                  if(!usb.hasPermission(target)) {
                      line("USB_PERMISSION=false");

                      if(requestPermission) {
                          Intent intent=new Intent(USB_PERMISSION)
                              .setPackage(getPackageName());

                          PendingIntent pi=PendingIntent.getBroadcast(
                              this,target.getDeviceId(),intent,
                              PendingIntent.FLAG_UPDATE_CURRENT|
                              PendingIntent.FLAG_MUTABLE);

                          usb.requestPermission(target,pi);
                          line("USB_PERMISSION_REQUESTED=true");
                      }

                      return;
                  }

                  inspect(target);
              }

              private Map<Integer,Integer> hidLengths(byte[] raw) {
                  Map<Integer,Integer> out=new HashMap<>();
                  int p=0,currentIf=-1,currentClass=-1;

                  while(raw!=null && p+2<=raw.length) {
                      int len=raw[p]&255;
                      int type=raw[p+1]&255;

                      if(len<2 || p+len>raw.length)break;

                      if(type==0x04 && len>=9) {
                          currentIf=raw[p+2]&255;
                          currentClass=raw[p+5]&255;

                      } else if(type==0x21 &&
                                currentClass==3 &&
                                currentIf>=0 &&
                                len>=9) {

                          int n=raw[p+5]&255;
                          int q=p+6;

                          for(int k=0;k<n && q+2<p+len;k++,q+=3) {
                              int dtype=raw[q]&255;
                              int dlen=(raw[q+1]&255)|((raw[q+2]&255)<<8);

                              if(dtype==0x22 && dlen>0) {
                                  out.put(currentIf,dlen);
                                  break;
                              }
                          }
                      }

                      p+=len;
                  }

                  return out;
              }

              private byte[] readReportDescriptor(
                  UsbDeviceConnection c,
                  UsbInterface x,
                  int expected,
                  String phase) {

                  byte[] b=new byte[expected];

                  int r=c.controlTransfer(
                      0x81,0x06,0x2200,x.getId(),
                      b,b.length,1500);

                  line(
                      "IF"+x.getId()+"_"+phase+
                      "_REPORT_DESCRIPTOR_RESULT="+r);

                  if(r<=0)return null;

                  byte[] exact=Arrays.copyOf(b,r);

                  line(
                      "IF"+x.getId()+
                      "_REPORT_DESCRIPTOR_BYTES="+r);
                  line(
                      "IF"+x.getId()+
                      "_REPORT_DESCRIPTOR_SHA256="+sha256(exact));
                  line(
                      "IF"+x.getId()+
                      "_REPORT_DESCRIPTOR_HEX="+hex(exact));

                  return exact;
              }

              private byte[] recoverIf3Descriptor(
                  UsbDeviceConnection c,
                  UsbInterface if3,
                  int expected) {

                  byte[] h3=readReportDescriptor(c,if3,expected,"UNCLAIMED");

                  if(h3!=null && IF3_SHA.equals(sha256(h3)))
                      return h3;

                  boolean cl=c.claimInterface(if3,false);
                  line("IF3_TEMP_CLAIM_FORCE_FALSE="+cl);

                  if(cl) {
                      try {
                          h3=readReportDescriptor(c,if3,expected,"CLAIM_FALSE");
                      } finally {
                          line("IF3_TEMP_RELEASE_FORCE_FALSE="+
                              c.releaseInterface(if3));
                      }
                  }

                  if(h3!=null && IF3_SHA.equals(sha256(h3)))
                      return h3;

                  boolean clf=c.claimInterface(if3,true);
                  line("IF3_TEMP_CLAIM_FORCE_TRUE="+clf);

                  if(clf) {
                      try {
                          h3=readReportDescriptor(c,if3,expected,"CLAIM_TRUE");
                      } finally {
                          line("IF3_TEMP_RELEASE_FORCE_TRUE="+
                              c.releaseInterface(if3));
                      }
                  }

                  return h3;
              }

              private static String dirName(int d) {
                  return d==UsbConstants.USB_DIR_IN ? "IN" : "OUT";
              }

              private static String typeName(int t) {
                  switch(t) {
                      case UsbConstants.USB_ENDPOINT_XFER_CONTROL:return "CONTROL";
                      case UsbConstants.USB_ENDPOINT_XFER_ISOC:return "ISO";
                      case UsbConstants.USB_ENDPOINT_XFER_BULK:return "BULK";
                      case UsbConstants.USB_ENDPOINT_XFER_INT:return "INTERRUPT";
                      default:return "UNKNOWN_"+t;
                  }
              }

              private void inspect(UsbDevice d) {
                  exactFingerprint=false;

                  UsbDeviceConnection c=usb.openDevice(d);
                  if(c==null) {
                      line("INSPECT_OPEN_NULL=true");
                      return;
                  }

                  try {
                      byte[] raw=c.getRawDescriptors();

                      if(raw==null || raw.length==0) {
                          line("RAW_DESCRIPTOR_EMPTY=true");
                          return;
                      }

                      String rawSha=sha256(raw);
                      line("RAW_DESCRIPTOR_BYTES="+raw.length);
                      line("RAW_DESCRIPTOR_SHA256="+rawSha);
                      line("RAW_DESCRIPTOR_HEX="+hex(raw));

                      Map<Integer,Integer> lens=hidLengths(raw);
                      line("HID_REPORT_DESCRIPTOR_LENGTHS="+lens);

                      UsbInterface if3=null,if4=null;

                      for(int i=0;i<d.getInterfaceCount();i++) {
                          UsbInterface x=d.getInterface(i);

                          line(
                              "INTERFACE_INDEX="+i+
                              " ID="+x.getId()+
                              " CLASS="+x.getInterfaceClass()+
                              " SUBCLASS="+x.getInterfaceSubclass()+
                              " PROTOCOL="+x.getInterfaceProtocol()+
                              " ENDPOINT_COUNT="+x.getEndpointCount());

                          for(int e=0;e<x.getEndpointCount();e++) {
                              UsbEndpoint ep=x.getEndpoint(e);

                              line(
                                  "ENDPOINT IF="+x.getId()+
                                  " INDEX="+e+
                                  " ADDRESS="+ep.getAddress()+
                                  " NUMBER="+ep.getEndpointNumber()+
                                  " DIRECTION="+dirName(ep.getDirection())+
                                  " TYPE="+typeName(ep.getType())+
                                  " MAX_PACKET="+ep.getMaxPacketSize()+
                                  " INTERVAL="+ep.getInterval());
                          }

                          if(x.getInterfaceClass()==3 && x.getId()==3)if3=x;
                          if(x.getInterfaceClass()==3 && x.getId()==4)if4=x;
                      }

                      if(if3==null || if4==null) {
                          line("REQUIRED_HID_INTERFACES_MISSING=true");
                          return;
                      }

                      int if4Expected=lens.containsKey(4)?lens.get(4):36;
                      int if3Expected=lens.containsKey(3)?lens.get(3):33;

                      byte[] h4=readReportDescriptor(
                          c,if4,if4Expected,"UNCLAIMED");

                      byte[] h3=recoverIf3Descriptor(
                          c,if3,if3Expected);

                      boolean rawOk=RAW_SHA.equals(rawSha);
                      boolean if3Ok=h3!=null && IF3_SHA.equals(sha256(h3));
                      boolean if4Ok=h4!=null && IF4_SHA.equals(sha256(h4));

                      line("RAW_FINGERPRINT_OK="+rawOk);
                      line("IF3_FINGERPRINT_OK="+if3Ok);
                      line("IF4_FINGERPRINT_OK="+if4Ok);

                      exactFingerprint=rawOk && if3Ok && if4Ok;

                      line("V36_EXACT_RUNTIME_FINGERPRINT_OK="+exactFingerprint);

                      int interruptInCount=0;

                      for(int i=0;i<d.getInterfaceCount();i++) {
                          UsbInterface x=d.getInterface(i);

                          for(int e=0;e<x.getEndpointCount();e++) {
                              UsbEndpoint ep=x.getEndpoint(e);

                              if(ep.getDirection()==UsbConstants.USB_DIR_IN &&
                                 ep.getType()==UsbConstants.USB_ENDPOINT_XFER_INT) {
                                  interruptInCount++;
                                  line(
                                      "INTERRUPT_IN_CANDIDATE IF="+x.getId()+
                                      " EP="+ep.getEndpointNumber()+
                                      " MAX_PACKET="+ep.getMaxPacketSize()+
                                      " INTERVAL="+ep.getInterval());
                              }
                          }
                      }

                      line("TOTAL_INTERRUPT_IN_ENDPOINTS="+interruptInCount);
                      line("HOST_APPLICATION_OUTPUT_COUNT=0");
                      line("STARTUP_COMMAND_SENT=false");
                      line("AUTH_REPLY_SENT=false");
                      line("FEATURE_REPORT_USED=false");
                      line("FLASH_WRITE_ERASE_RECOVERY=false");
                      line("INSPECTION_COMPLETE=true");

                  } finally {
                      c.close();
                  }
              }

              private void saveEvidence() {
                  Intent i=new Intent(Intent.ACTION_CREATE_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("text/plain");
                  i.putExtra(
                      Intent.EXTRA_TITLE,
                      "OKN_BP1048P4_V36_READ_ONLY_USB_TOPOLOGY_EVIDENCE.txt");
                  startActivityForResult(i,SAVE_EVIDENCE);
              }

              @Override protected void onActivityResult(
                  int requestCode,int resultCode,Intent data) {

                  super.onActivityResult(requestCode,resultCode,data);

                  if(requestCode==SAVE_EVIDENCE &&
                     resultCode==RESULT_OK &&
                     data!=null) {

                      try(OutputStream os=
                          getContentResolver().openOutputStream(data.getData())) {

                          String footer=
                              "\nEXPORT_EXACT_RUNTIME_FINGERPRINT_OK="+exactFingerprint+
                              "\nEXPORT_HOST_APPLICATION_OUTPUT_COUNT=0"+
                              "\nEXPORT_STARTUP_COMMAND_SENT=false"+
                              "\nEXPORT_AUTH_REPLY_SENT=false"+
                              "\nEXPORT_FEATURE_REPORT_USED=false"+
                              "\nEXPORT_FLASH_WRITE_ERASE_RECOVERY=false"+
                              "\nEXPORT_FLASH_ALLOWED=NO\n";

                          os.write(
                              (evidence.toString()+footer)
                              .getBytes(StandardCharsets.UTF_8));

                          line("EVIDENCE_EXPORT_OK=true");

                      } catch(Exception ex) {
                          line("EVIDENCE_EXPORT_ERROR="+ex);
                      }
                  }
              }

              private static String hex(byte[] b) {
                  StringBuilder s=new StringBuilder(b.length*2);
                  for(byte x:b)
                      s.append(String.format(Locale.US,"%02X",x&255));
                  return s.toString();
              }

              private static String sha256(byte[] b) {
                  try {
                      MessageDigest md=MessageDigest.getInstance("SHA-256");
                      return hex(md.digest(b));
                  } catch(Exception e) {
                      return "SHA256_ERROR";
                  }
              }

              @Override protected void onDestroy() {
                  try{unregisterReceiver(permissionRx);}catch(Exception ignored){}
                  super.onDestroy();
              }
          }
          JAVA

      - name: Static zero-output safety audit
        shell: bash
        run: |
          set -euo pipefail

          SRC=/tmp/v36/app/app/src/main/java/com/okn/bp1048p4v36/MainActivity.java

          python3 - <<'PY'
          from pathlib import Path

          t=Path(
              "/tmp/v36/app/app/src/main/java/com/okn/bp1048p4v36/MainActivity.java"
          ).read_text()

          required=[
              "RAW_DESCRIPTOR_HEX=",
              "REPORT_DESCRIPTOR_HEX=",
              "INTERFACE_INDEX=",
              "ENDPOINT IF=",
              "TOTAL_INTERRUPT_IN_ENDPOINTS=",
              "V36_EXACT_RUNTIME_FINGERPRINT_OK=",
              "HOST_APPLICATION_OUTPUT_COUNT=0",
              "STARTUP_COMMAND_SENT=false",
              "AUTH_REPLY_SENT=false",
              "FEATURE_REPORT_USED=false",
              "FLASH_WRITE_ERASE_RECOVERY=false"
          ]

          missing=[x for x in required if x not in t]
          if missing:
              raise SystemExit("missing required token(s): "+repr(missing))

          forbidden=[
              "USB_DIR_OUT",
              "bulkTransfer(",
              "UsbRequest",
              "0x21,0x09",
              "0x21, 0x09",
              "0xA1,0x09",
              "HidD_SetOutputReport",
              "HidD_SetFeature",
              "FLASH_BOOT_EN",
              "chiperas",
              "codedata",
              "bootdat",
              "constdat",
              "cnfgdat",
              "btupdat",
              "upinfo",
              "cxxx",
              "STARTUP_PREFIX",
              "AUTH_ANDROID_WIRE"
          ]

          bad=[x for x in forbidden if x in t]
          if bad:
              raise SystemExit("forbidden output/destructive token(s): "+repr(bad))

          if t.count("controlTransfer(") != 1:
              raise SystemExit(
                  "expected exactly one controlTransfer call site for HID descriptor control-IN")

          if "0x81,0x06,0x2200" not in t:
              raise SystemExit("HID report descriptor control-IN read missing")

          print("V36_STATIC_ZERO_OUTPUT_AUDIT=PASS")
          PY

          cp "$SRC" /tmp/v36/evidence/MainActivity.java
          sha256sum "$SRC" > /tmp/v36/evidence/01_MAINACTIVITY_SHA256.txt

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          SDKMAN="$(command -v sdkmanager || true)"
          if [ -n "$SDKMAN" ]; then
            set +o pipefail
            yes | "$SDKMAN" --licenses >/dev/null 2>&1 || true
            set -o pipefail
            "$SDKMAN" "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true
          fi

          cd /tmp/v36

          curl -fL --retry 4 --retry-all-errors \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o gradle.zip

          unzip -q gradle.zip
          export PATH="/tmp/v36/gradle-8.9/bin:$PATH"

          cd /tmp/v36/app

          gradle --no-daemon --stacktrace :app:assembleDebug \
            | tee /tmp/v36/evidence/02_GRADLE_BUILD.txt

          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"

          cp "$APK" /tmp/v36/out/OKN_BP1048P4_V36_READ_ONLY_USB_TOPOLOGY.apk
          sha256sum "$APK" > /tmp/v36/evidence/03_APK_SHA256.txt

      - name: Final build decision
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/v36/evidence/04_V36_FINAL_DECISION.md <<'EOF'
          # MASTER V36 FINAL DECISION

          V36 is a zero-output read-only USB topology diagnostic.

          It performs only:
          - exact production runtime fingerprint verification,
          - raw USB descriptor read from Android,
          - HID report-descriptor control-IN reads,
          - interface/endpoint metadata enumeration.

          It sends no:
          - application Output report,
          - startup command,
          - authentication reply,
          - Feature report,
          - updater/recovery command,
          - firmware/flash/erase/write command.

          Classification:
          READ_ONLY_USB_TOPOLOGY_AND_HID_DESCRIPTOR_DUMP_NOT_FOR_FLASH
          EOF

          cp /tmp/v36/evidence/* /tmp/v36/out/
          (cd /tmp/v36/out && sha256sum * > SHA256SUMS.txt)

          cat /tmp/v36/evidence/04_V36_FINAL_DECISION.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload V36 APK
        uses: actions/upload-artifact@v7
        with:
          name: OKN-BP1048P4-MASTER-V36-READ-ONLY-USB-TOPOLOGY-APK
          path: /tmp/v36/out/*
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed assertion
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          test "$ERASE_ALLOWED" = "NO"
          test "$WRITE_ALLOWED" = "NO"
          test "$FEATURE_REPORT_ALLOWED" = "NO"
          test "$HOST_OUTPUT_ALLOWED" = "NO"
          test "$STARTUP_COMMAND_ALLOWED" = "NO"
          test "$AUTH_REPLY_ALLOWED" = "NO"

          echo "MASTER_V36=PASS"
          echo "HOST_APPLICATION_OUTPUT_COUNT=0"
          echo "STARTUP_COMMAND_SENT=NO"
          echo "AUTH_REPLY_SENT=NO"
          echo "FEATURE_REPORT=NO"
          echo "FLASH_ALLOWED=NO"
