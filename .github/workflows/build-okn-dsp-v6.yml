name: Build OKN DSP V6 Reference UI Verified Realtime

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_ANDROID_V6_REFERENCE_UI_VERIFIED_REALTIME.zip'
      - 'OKN_DSP_V6_SHA256.txt'
      - '.github/workflows/build-okn-dsp-v6.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and unpack V6 source
        shell: bash
        run: |
          set -euo pipefail
          echo 'f1502160c5a8fb3260770ebf9fd6db6301ace204661fa32f17cfc736a9c0d9df  OKN_DSP_ANDROID_V6_REFERENCE_UI_VERIFIED_REALTIME.zip' | sha256sum -c -
          unzip -tq OKN_DSP_ANDROID_V6_REFERENCE_UI_VERIFIED_REALTIME.zip
          rm -rf /tmp/okn_dsp_v6
          mkdir -p /tmp/okn_dsp_v6
          unzip -q OKN_DSP_ANDROID_V6_REFERENCE_UI_VERIFIED_REALTIME.zip -d /tmp/okn_dsp_v6
          test -f /tmp/okn_dsp_v6/preflight_v6.py
          test -f /tmp/okn_dsp_v6/app/src/main/res/drawable-nodpi/ui_home_reference.jpg
          test -f /tmp/okn_dsp_v6/app/src/main/res/drawable-nodpi/ui_eq_reference.jpg

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run V6 preflight and verify stable signing identity
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/okn_dsp_v6
          python3 preflight_v6.py
          echo 'ba1c52f2607c09953c52fdd79c5f72026aaf0adb8aa44bcba277f7d9b49d9511  app/okn_dsp_stable_debug.keystore' | sha256sum -c -
          CERT=$(keytool -list -v -keystore app/okn_dsp_stable_debug.keystore -storepass android -alias androiddebugkey | awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr 'A-F' 'a-f')
          test "$CERT" = 'c3da85af2e978dbd0ed9bb695e5c79a263189595c116ad93a1ded75a2eb98397'
          echo "Stable debug signing certificate SHA-256: $CERT"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build stable-signed V6 APK
        working-directory: /tmp/okn_dsp_v6
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK identity and signer
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn_dsp_v6/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools/35.0.0" -maxdepth 1 -name aapt2 -o -name aapt | head -1)
          test -n "$AAPT"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          SIGNER=$($APKSIGNER verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' | tr 'A-F' 'a-f')
          test "$SIGNER" = 'c3da85af2e978dbd0ed9bb695e5c79a263189595c116ad93a1ded75a2eb98397'
          echo "APK signer certificate SHA-256: $SIGNER"
          mkdir -p /tmp/out
          cp "$APK" /tmp/out/OKN_DSP_V6_REFERENCE_UI_VERIFIED_REALTIME-debug.apk
          sha256sum /tmp/out/OKN_DSP_V6_REFERENCE_UI_VERIFIED_REALTIME-debug.apk | tee /tmp/out/OKN_DSP_V6_APK_SHA256.txt

      - name: Upload installable V6 APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-V6-REFERENCE-UI-VERIFIED-REALTIME-APK
          path: /tmp/out/*
          if-no-files-found: error
          retention-days: 30
