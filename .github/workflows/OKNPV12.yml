      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Verify generated V12 source identity
        shell: bash
        run: |
          set -euo pipefail
          echo "0c6ce8736865f303d6062ddabdd53f8b8d3f354baca68892ef1e30c1f83839b7  app/src/main/java/com/okn/peramp/DspProtocol.java" | sha256sum -c -
          echo "41f0ab4c83df8c1da8d3d59d44ef754f7faa7f5929c0c3cce6e5b4495f509c86  app/src/main/java/com/okn/peramp/BleManager.java" | sha256sum -c -
          echo "af46421edaed325bd7d56c90bd0cb6f12529d334fa97a2ea1cb8246fbd389926  app/src/main/java/com/okn/peramp/MainActivity.java" | sha256sum -c -
          echo "b3b782d568b6532d437164e200a0955a0268499b35b9013daaba171f360194a8  app/src/main/java/com/okn/peramp/DspView.java" | sha256sum -c -
          echo "18f5a0f7a7845e4a6600c05501bcee2d383db547ee002eda0c13f663ebf49797  app/src/main/java/com/okn/peramp/DspState.java" | sha256sum -c -
          echo "3c3223e57cdef9d31bc2e129fdc647b0d3cfd1d3f8814d050d67d8d95f267446  app/src/main/java/com/okn/peramp/CleanRoomDspEngine.java" | sha256sum -c -
          echo "d7b5bd49199d45c9fc2bc216c1794996570a8a35be297c3c52e724d05b57e3b9  app/src/main/java/com/okn/peramp/CleanRoomBiquadCodec.java" | sha256sum -c -
          echo "871271f22603e2d54add9d82b8add618802fbb959ef0d98fcc9e91b371f719f1  Sources/validate_oknpv12.py" | sha256sum -c -
          echo "f8c1abf12a87b863078957ad0c4a33addee91ecbf651f16e4c754d491ccd2069  Sources/V12FullPeqSelfTest.java" | sha256sum -c -
          echo "b59ebd0300b92cfe329abdeb54860a3927c15d28b0aa5d1ac0fa8457d46616ee  Sources/V12_FULL_PEQ_PROOF.txt" | sha256sum -c -
          echo "70cf1fd3d89456e8ee7808180b4c034fc0506830dc80c7371d2fdebf823229cb  Sources/OKNPV12_BUILD_NOTES.txt" | sha256sum -c -

      - name: Validate V12 full PEQ math, 92-slot gate and no-unknown-TX policy
        shell: bash
        run: |
          set -euo pipefail
          python3 Sources/validate_v38_gate.py
          python3 Sources/validate_oknpv12.py

      - name: Build Debug and Release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk OKNPV12-debug.apk
          cp app/build/outputs/apk/release/app-release.apk OKNPV12-release.apk

      - name: Verify APK identity and test signing
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging OKNPV12-debug.apk | tee OKNPV12-apk-badging.txt
          grep -q "package: name='com.okn.peramp' versionCode='12000' versionName='12.0.0'" OKNPV12-apk-badging.txt
          grep -q "application-label:'OKN Peramp'" OKNPV12-apk-badging.txt
          {
            echo 'V12 release signing status: TEST SIGNING ONLY - debug key configured in build.gradle.'
            echo 'A user-owned production key is still required for public production distribution.'
            "$APKSIGNER" verify --verbose --print-certs OKNPV12-release.apk
          } | tee OKNPV12-signing.txt

      - name: Package V12 source, PEQ proof and checksums
        shell: bash
        run: |
          set -euo pipefail
          zip -qr OKNPV12-source.zip app Sources build.gradle settings.gradle gradle.properties -x '*/build/*' -x '.gradle/*'
          cp Sources/OKNPV12_BUILD_NOTES.txt OKNPV12-BUILD-NOTES.txt
          cp Sources/V12_FULL_PEQ_PROOF.txt OKNPV12-FULL-PEQ-PROOF.txt
          cp Sources/V11_ORIGINAL_APP_STATIC_REVERSE.txt OKNPV12-ORIGINAL-APP-STATIC-REVERSE.txt
          cp Sources/V10_HARDWARE_BASELINE_PROOF.txt OKNPV12-HARDWARE-BASELINE-PROOF.txt
