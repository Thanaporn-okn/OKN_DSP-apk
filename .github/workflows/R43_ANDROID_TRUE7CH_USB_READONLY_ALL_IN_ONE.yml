          set -euo pipefail
          python3 - <<'PYSAFE'
          from pathlib import Path
          import re

          root=Path("/tmp/r43src/r43_android_source")
          k=(root/"android_template/MainActivity.kt.in").read_text()
          d=(root/"lib/usb_readonly.dart").read_text()
          main=(root/"lib/main.dart").read_text()
          proto=(root/"lib/ufe_protocol.dart").read_text()

          forbidden_native=[
              "USB_DIR_OUT","bulkTransfer","UsbRequest","claimInterface",
              "releaseInterface","setConfiguration","setInterface",
              "writeCharacteristic","writeDescriptor","BluetoothGatt",
              "BluetoothSocket","SpiFlashErase","SpiFlashWrite","SaveParams",
              "Reset_McuSystem","Communication_Effect_0x11",
          ]
          bad=[x for x in forbidden_native if x in k]
          if bad:
              raise SystemExit("forbidden native USB/write token(s): "+", ".join(bad))

          if k.count("controlTransfer(") != 1:
              raise SystemExit("expected exactly one USB controlTransfer read path")

          required=[
              "UsbConstants.USB_DIR_IN",
              "UsbConstants.USB_TYPE_STANDARD",
              "USB_RECIP_INTERFACE = 0x01",
              "GET_DESCRIPTOR = 0x06",
              "HID_REPORT_DESCRIPTOR = 0x22",
              "READ_ONLY_REQUEST_TYPE",
          ]
          for token in required:
              if token not in k:
                  raise SystemExit("missing read-only proof token: "+token)

          for token in ["0x57","0x58","0x60","gainWriteFrame","eqWriteFrame"]:
              if token in k:
                  raise SystemExit("runtime UFE token leaked into native USB transport: "+token)

          allowed_methods={"scanUsb","inspectHid","requestUsbPermission"}
          calls=set(re.findall(r"invoke(?:List)?Method<[^>]+>\(\s*'([^']+)'", d))
          if calls != allowed_methods:
              raise SystemExit(f"unexpected Dart native methods: {sorted(calls)}")

          if "MethodChannel" in main:
              raise SystemExit("TRUE7CH control UI unexpectedly owns a native transport")

          for token in ["writeControl = 0x57","gainIdFirst = 22","eqIdFirst = 30"]:
              if token not in proto:
                  raise SystemExit("R41 protocol regression: "+token)

          print("PASS R43 safety: USB native path is enumeration + permission + GET_DESCRIPTOR IN only")
          PYSAFE

      - name: HID R30 signature parser fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYHID'
          desc=bytes([
              0x06,0x00,0xFF,
              0x0A,0xAA,0x55,
              0xA1,0x01,
              0x75,0x08,
              0x96,0x00,0x01, 0x81,0x02,
              0x96,0x00,0x01, 0x91,0x02,
              0x95,0x08, 0xB1,0x02,
              0xC0,
          ])
          usage_page=0; report_size=0; report_count=0; report_id=0
          pages=set(); usages=set(); bits={}
          signature=False; i=0
          while i < len(desc):
              p=desc[i]
              if p==0xFE:
                  n=desc[i+1]; i += 3+n; continue
              sc=p&3; n=(0,1,2,4)[sc]
              typ=(p>>2)&3; tag=(p>>4)&15
              v=sum(desc[i+1+j]<<(8*j) for j in range(n))
              if typ==1:
                  if tag==0:
                      usage_page=v; pages.add(v)
                  elif tag==7:
                      report_size=v
                  elif tag==8:
                      report_id=v
                  elif tag==9:
                      report_count=v
              elif typ==2 and tag==0:
                  usage=(v & 0xFFFF) if n==4 else v
                  page=((v>>16)&0xFFFF) if n==4 else usage_page
                  pages.add(page); usages.add(usage)
                  signature |= page==0xFF00 and usage==0x55AA
              elif typ==0 and tag in (8,9,11):
                  kind={8:"Input",9:"Output",11:"Feature"}[tag]
                  bits[(kind,report_id)]=bits.get((kind,report_id),0)+report_size*report_count
              i += 1+n
          sizes={k:(v+7)//8 for k,v in bits.items()}
          assert signature
          assert sizes[("Input",0)]==256
          assert sizes[("Output",0)]==256
          assert sizes[("Feature",0)]==8
          print("PASS synthetic R30 HID fixture: FF00/55AA + Input256B Output256B Feature8B")
          PYHID

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android scaffold and overlay R43 source
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          rm -rf /tmp/okn_r43_app
          flutter create --platforms=android --org com.okn.dsp --project-name okn_dsp_r43 /tmp/okn_r43_app

          rm -rf /tmp/okn_r43_app/lib /tmp/okn_r43_app/test
          cp -a "$R43_SRC/lib" /tmp/okn_r43_app/lib
          cp -a "$R43_SRC/test" /tmp/okn_r43_app/test
          cp "$R43_SRC/pubspec.yaml" /tmp/okn_r43_app/pubspec.yaml
          cp "$R43_SRC/analysis_options.yaml" /tmp/okn_r43_app/analysis_options.yaml
          cp "$R43_SRC/README_R43_TH.txt" /tmp/okn_r43_app/README_R43_TH.txt

          MAIN="$(find /tmp/okn_r43_app/android/app/src/main/kotlin -name MainActivity.kt | head -n1)"
          test -f "$MAIN"
          PKG="$(sed -n 's/^package[[:space:]]\+//p' "$MAIN" | head -n1)"
          test -n "$PKG"
          sed "s/^package __PACKAGE__$/package $PKG/"             "$R43_SRC/android_template/MainActivity.kt.in" > "$MAIN"

          MANIFEST=/tmp/okn_r43_app/android/app/src/main/AndroidManifest.xml
          python3 - <<'PYMAN'
          from pathlib import Path
          p=Path("/tmp/okn_r43_app/android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          marker="    <application"
          if marker not in s:
              raise SystemExit("AndroidManifest application marker missing")
          feature='    <uses-feature android:name="android.hardware.usb.host" android:required="false" />\n'
          s=s.replace(marker,feature+marker,1)
          p.write_text(s)
          PYMAN

          grep -q 'android.hardware.usb.host' "$MANIFEST"
          grep -q 'READ_ONLY_REQUEST_TYPE' "$MAIN"
          grep -q 'controlTransfer' "$MAIN"
          echo "R43_APP=/tmp/okn_r43_app" >> "$GITHUB_ENV"
          echo "R43_MAIN_ACTIVITY=$MAIN" >> "$GITHUB_ENV"

      - name: Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$R43_APP"
          flutter pub get

      - name: Protocol and regression unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$R43_APP"
          flutter test

      - name: Static analysis
        shell: bash
        run: |
          set -euo pipefail
          cd "$R43_APP"
          flutter analyze

      - name: Build Android debug APK with native USB host bridge
        shell: bash
        run: |
          set -euo pipefail
          cd "$R43_APP"
          flutter build apk --debug
          test -s build/app/outputs/flutter-apk/app-debug.apk

      - name: Post-build native safety audit
        shell: bash
        run: |
          set -euo pipefail
          K="$R43_MAIN_ACTIVITY"
          test "$(grep -c 'controlTransfer(' "$K")" = "1"
          ! grep -Eq 'USB_DIR_OUT|bulkTransfer|UsbRequest|claimInterface|writeCharacteristic|writeDescriptor|BluetoothGatt|BluetoothSocket' "$K"
          grep -q 'UsbConstants.USB_DIR_IN' "$K"
          grep -q 'GET_DESCRIPTOR = 0x06' "$K"
          grep -q 'HID_REPORT_DESCRIPTOR = 0x22' "$K"
          echo 'PASS post-build R43 native USB read-only audit'

      - name: Package APK and R43 source evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/r43_out
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp "$R43_APP/build/app/outputs/flutter-apk/app-debug.apk" "$OUT/OKN_DSP_R43_USB_READONLY_debug.apk"
          cp /tmp/OKN_DSP_R43_USB_READONLY_Source.zip "$OUT/OKN_DSP_R43_USB_READONLY_Source.zip"
          cp "$R43_APP/README_R43_TH.txt" "$OUT/README_R43_TH.txt"
          cp "$R43_MAIN_ACTIVITY" "$OUT/MainActivity_READONLY.kt"
          cp "$R43_APP/android/app/src/main/AndroidManifest.xml" "$OUT/AndroidManifest.xml"
          flutter --version > "$OUT/FLUTTER_VERSION.txt"
          cat > "$OUT/R43_SAFETY_STATE.txt" <<'EOF'
          USB_ENUMERATION=YES
          USB_PERMISSION_REQUEST=YES
          USB_RAW_DESCRIPTORS=READ_ONLY
          HID_REPORT_DESCRIPTOR=GET_DESCRIPTOR_IN_ONLY
          HID_USAGE_PAGE_TARGET=0xFF00
          HID_USAGE_TARGET=0x55AA
          HID_INTERFACE_TARGET=4
          HID_INPUT_TARGET_BYTES=256
          HID_OUTPUT_TARGET_BYTES=256
          HID_FEATURE_TARGET_BYTES=8
          UFE_0x57_TRANSMIT=NO
          BULK_OUT=NO
          HID_OUTPUT_REPORT_TRANSMIT=NO
          FLASH_WRITE=NO
          RESET=NO
          EOF
          (cd "$OUT" && sha256sum * > SHA256SUMS.txt)

      - name: Upload R43 APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN_DSP_R43_USB_READONLY_APK
          path: /tmp/r43_out/*
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        shell: bash
        run: |
          {
            echo '## R43 Android TRUE7CH + USB read-only discovery'
            echo '- Keeps R42.1 TRUE7CH gain/EQ UI'
            echo '- Enumerates Android USB Host devices/interfaces/endpoints'
            echo '- Reads HID report descriptor only with standard GET_DESCRIPTOR IN'
            echo '- Detects R30 signature: IF4 + FF00/55AA + 256B IN/OUT + 8B Feature'
            echo '- No runtime 0x57 transmit; no USB OUT; no flash/reset path'
          } >> "$GITHUB_STEP_SUMMARY"
