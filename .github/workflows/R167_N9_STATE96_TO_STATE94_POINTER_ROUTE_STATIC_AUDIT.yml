name: R167 N9 state96 to state94 pointer route static audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R167_N9_STATE96_TO_STATE94_POINTER_ROUTE_STATIC_AUDIT.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r167-static-${{ github.ref }}
  cancel-in-progress: true

env:
  FLASH_ALLOWED: "NO"

jobs:
  static_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          mkdir -p /tmp/r167/evidence
          cat > /tmp/r167/evidence/R167_SAFETY.txt <<'EOF'
          MODE=OFFLINE_STATIC_IL_TEXT_ONLY
          FLASH_ALLOWED=NO
          USB_OR_BOARD_CONTACT=NO
          VENDOR_EXE_DLL_APK_EXECUTED=NO
          OFFLINE_DECRYPT_EXECUTED=NO
          AA55_OR_LINEIN_AA55_SENT=NO
          RUNTIME_0X11_OR_0XFE_SENT=NO
          FLASH_READ_ERASE_WRITE_EXECUTED=NO
          DISCOVERED_FRAME_LIVE_AUTHORIZED=NO
          HARDWARE_MODIFICATION=FORBIDDEN
          EOF

      - name: Download pinned R166 evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: "10828019626"
          path: /tmp/r167/r166
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 36045985545

      - name: Download pinned R157 raw evidence chain
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: "10820682068"
          path: /tmp/r167/r157
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 36028455796

      - name: Prove state96 to state94 route and pointer mutation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib, io, json, re, zipfile

          base = Path("/tmp/r167")
          out = base / "evidence"
          out.mkdir(parents=True, exist_ok=True)

          def open_inner(folder, name, expected_sha):
              p = base / folder / name
              data = p.read_bytes()
              got = hashlib.sha256(data).hexdigest()
              assert got == expected_sha, (name, got, expected_sha)
              sha_file = p.with_name(p.name + ".sha256")
              assert sha_file.exists(), f"missing {sha_file.name}"
              assert sha_file.read_text().split()[0] == expected_sha
              return zipfile.ZipFile(io.BytesIO(data))

          r166 = open_inner(
              "r166",
              "R166_N9_LOCAL37_WORD_PRODUCERS_EVIDENCE.zip",
              "41d13d835b97a81582c3bcecaca8cdc1e3310ed76af3328a08715e85dcca3285",
          )
          r166_decision = json.loads(r166.read("R166_DECISION.json"))
          assert r166_decision["revision"] == "R166"
          assert r166_decision["FLASH_ALLOWED"] is False
          assert r166_decision["OFFLINE_DECRYPT_AUTHORIZED"] is False
          assert r166_decision["UNACCOUNTED_CONDITIONAL_COUNT_AFTER_R166"] == 3

          r157 = open_inner(
              "r157",
              "R157_N9_LOCAL29_LOCAL81_NONNULL_LOCAL93_LOOP_BRANCH_EVIDENCE.zip",
              "f974c64c63eea5f2b940c76101f4ab6e769803f5630a2d87d21d08679c321609",
          )

          prefix = "r156/r155/r154/r153/r152/r151/r150/r149/r148/r147/r146/r145/r144/r143/"
          raw = r157.read(prefix + "R143_N9_METHOD.il")
          assert hashlib.sha256(raw).hexdigest() == "5a3964c1f4bd8db455e6882a4ce6f90667e1a9abc6e1fafd10440b31006e4a33"
          text = raw.decode()

          # Parse instruction rows.
          rows = []
          for line in text.splitlines():
              m = re.match(r"\s*(IL_[0-9a-f]+):\s+(\S+)(?:\s+(.*))?$", line)
              if m:
                  rows.append((m.group(1), m.group(2), (m.group(3) or "").split(" //", 1)[0].strip()))
          pos = {lab: i for i, (lab, _, _) in enumerate(rows)}

          # Parse the 689-state flattened dispatcher.
          sm = re.search(r"IL_0012:\s+switch \((.*?)\)\n", text, re.S)
          assert sm, "dispatcher switch not found"
          targets = [x.strip() for x in sm.group(1).split(",")]
          assert len(targets) == 689
          state_of = {lab: i for i, lab in enumerate(targets)}

          expected_state_labels = {
              94: "IL_51f2",
              96: "IL_658f",
              110: "IL_554f",
              162: "IL_129d",
              179: "IL_4952",
              206: "IL_2687",
              281: "IL_65d1",
              444: "IL_44aa",
              464: "IL_3d59",
              487: "IL_3c66",
              510: "IL_2955",
              655: "IL_1265",
              667: "IL_6710",
              668: "IL_4031",
          }
          for st, lab in expected_state_labels.items():
              assert targets[st] == lab, (st, targets[st], lab)

          # Build exact physical state blocks.
          target_positions = sorted((pos[lab], st, lab) for st, lab in enumerate(targets))
          blocks = {}
          for i, (p0, st, lab) in enumerate(target_positions):
              p1 = target_positions[i + 1][0] if i + 1 < len(target_positions) else len(rows)
              blocks[st] = rows[p0:p1]

          def exact_block(st, expected):
              got = [(op, arg) for _, op, arg in blocks[st]]
              assert got == expected, (st, got)
              return blocks[st]

          # R165/R166 provenance: local37 is allocated once, then state96 aliases it to local29.
          local37_stores = [r for r in rows if r[1] in ("stloc", "stloc.s") and r[2] == "37"]
          assert local37_stores == [("IL_403a", "stloc.s", "37")]

          local29_stores = [r for r in rows if r[1] in ("stloc", "stloc.s") and r[2] == "29"]
          assert local29_stores == [
              ("IL_6591", "stloc.s", "29"),
              ("IL_65fc", "stloc.s", "29"),
          ]

          exact_block(96, [
              ("ldloc.s", "37"),
              ("stloc.s", "29"),
              ("ldc.i4", "206"),
              ("br", "IL_0012"),
          ])

          exact_block(206, [
              ("ldloc.s", "29"),
              ("ldlen", ""),
              ("conv.i4", ""),
              ("ldc.i4.8", ""),
              ("div", ""),
              ("stloc.s", "7"),
              ("ldc.i4", "510"),
              ("br", "IL_0012"),
          ])

          # R157 already proves local29 is non-null and has length 607967 here.
          b510 = blocks[510]
          assert b510[:4] == [
              ("IL_2955", "ldloc.s", "29"),
              ("IL_2957", "dup", ""),
              ("IL_2958", "stloc.s", "81"),
              ("IL_295a", "brtrue", "IL_1265"),
          ]
          b655 = blocks[655]
          assert b655[:4] == [
              ("IL_1265", "ldloc.s", "81"),
              ("IL_1267", "ldlen", ""),
              ("IL_1268", "conv.i4", ""),
              ("IL_1269", "brtrue", "IL_44aa"),
          ]

          exact_block(444, [
              ("ldloc.s", "81"),
              ("ldc.i4.0", ""),
              ("ldelema", "[mscorlib]System.Byte"),
              ("conv.u", ""),
              ("stloc.s", "50"),
              ("ldc.i4", "487"),
              ("br", "IL_0012"),
          ])

          exact_block(487, [
              ("ldc.i4.0", ""),
              ("stloc.s", "93"),
              ("ldc.i4", "162"),
              ("br", "IL_0012"),
          ])

          exact_block(162, [
              ("br", "IL_6710"),
              ("ldc.i4", "179"),
              ("br", "IL_0012"),
          ])

          # State667 is the proven visit-index loop gate.
          b667 = blocks[667]
          assert b667 == [
              ("IL_6710", "ldloc.s", "93"),
              ("IL_6712", "ldloc.s", "7"),
              ("IL_6714", "blt", "IL_4952"),
              ("IL_6719", "ldc.i4", "464"),
              ("IL_671e", "call", "bool Q9Wet0jLP4YxXSyJBiC.q71r2Rj8SiD9GF1BI50::zfos5ENLukrcbiO4qNQ()"),
              ("IL_6723", "brtrue", "IL_0012"),
              ("IL_6728", "pop", ""),
              ("IL_6729", "ldc.i4", "287"),
              ("IL_672e", "br", "IL_0012"),
          ]

          # Exact in-place pointer mutation of each 8-byte chunk.
          b179 = blocks[179]
          assert b179[:13] == [
              ("IL_4952", "ldloc.s", "50"),
              ("IL_4954", "ldloc.s", "93"),
              ("IL_4956", "ldc.i4.8", ""),
              ("IL_4957", "mul", ""),
              ("IL_4958", "add", ""),
              ("IL_4959", "conv.u", ""),
              ("IL_495a", "dup", ""),
              ("IL_495b", "ldind.i8", ""),
              ("IL_495c", "ldc.i4", "939576589"),
              ("IL_4961", "conv.i8", ""),
              ("IL_4962", "xor", ""),
              ("IL_4963", "stind.i8", ""),
              ("IL_4964", "ldc.i4", "38"),
          ]
          # zfos is already statically proven literal true in the prior chain,
          # therefore this block takes the state110 path after mutation.
          assert b179[13:] == [
              ("IL_4969", "call", "bool Q9Wet0jLP4YxXSyJBiC.q71r2Rj8SiD9GF1BI50::zfos5ENLukrcbiO4qNQ()"),
              ("IL_496e", "brfalse", "IL_0012"),
              ("IL_4973", "pop", ""),
              ("IL_4974", "ldc.i4", "110"),
              ("IL_4979", "br", "IL_0012"),
          ]

          exact_block(110, [
              ("ldloc.s", "93"),
              ("ldc.i4.1", ""),
              ("add", ""),
              ("stloc.s", "93"),
              ("ldc.i4", "667"),
              ("br", "IL_0012"),
          ])

          # On loop exit, zfos literal true selects state464.
          exact_block(464, [
              ("ldnull", ""),
              ("stloc.s", "81"),
              ("ldc.i4", "94"),
              ("br", "IL_0012"),
          ])

          exact_block(94, [
              ("ldloc.s", "29"),
              ("newobj", "instance void [mscorlib]System.IO.MemoryStream::.ctor(uint8[])"),
              ("newobj", "instance void Q9Wet0jLP4YxXSyJBiC.q71r2Rj8SiD9GF1BI50/Y7Uor8e58M9K22QZF7H::.ctor(class [mscorlib]System.IO.Stream)"),
              ("stloc.s", "114"),
              ("ldc.i4", "52"),
              ("br", "IL_0012"),
          ])

          length = 607967
          iterations = length // 8
          covered = iterations * 8
          remainder = length - covered
          assert iterations == 75995
          assert covered == 607960
          assert remainder == 7
          xor_mask = 939576589
          assert xor_mask == 0x3800CD0D

          # No local29 variable reassignment occurs in the exact route after state96.
          route_states = [96, 206, 510, 655, 444, 487, 162, 667, 179, 110, 464, 94]
          reassign = []
          calls = []
          for st in route_states[1:]:
              for lab, op, arg in blocks[st]:
                  if op in ("stloc", "stloc.s") and arg == "29":
                      reassign.append((st, lab))
                  if op == "call":
                      calls.append((st, lab, arg))
          assert reassign == []

          result = {
              "revision": "R167",
              "R166_RUN_ID": 36045985545,
              "R166_JOB_ID": 107789531886,
              "R166_ARTIFACT_ID": 10828019626,
              "R166_ARTIFACT_DIGEST": "sha256:955b30040ebb34868c8c6f022906aeda75a64b0dccd8cf795fc5f734f11fcb87",
              "R166_INNER_SHA256": "41d13d835b97a81582c3bcecaca8cdc1e3310ed76af3328a08715e85dcca3285",
              "N9_SHA256": hashlib.sha256(raw).hexdigest(),
              "STATE94_LABEL": targets[94],
              "STATE96_LABEL": targets[96],
              "STATE96_LOCAL29_ALIAS_LOCAL37_PROVEN": True,
              "STATE96_TO_STATE94_ROUTE_PREFIX_PROVEN": True,
              "PROVEN_ROUTE": "96 -> 206 -> 510(non-null) -> 655(len>0) -> 444 -> 487 -> 162 -> 667(loop) -> 179 -> 110 -> 667 ... -> 464 -> 94",
              "LOCAL29_VARIABLE_REASSIGNMENT_ON_ROUTE": False,
              "STATE94_MEMORYSTREAM_INPUT_IS_LOCAL29": True,
              "LOCAL29_ALIASES_LOCAL37_AT_STATE94": True,
              "POINTER_ALIAS_SOURCE": "state444 pins local81, and local81 aliases local29 from state510",
              "POINTER_XOR_LOOP_PROVEN": True,
              "POINTER_XOR_MASK_INT32": xor_mask,
              "POINTER_XOR_MASK_HEX": "0x000000003800CD0D",
              "POINTER_XOR_ITERATION_COUNT": iterations,
              "POINTER_XOR_BYTES_COVERED": covered,
              "POINTER_XOR_REMAINDER_BYTES": remainder,
              "POINTER_XOR_DESCRIPTION": "for i=0..75994: *(u64*)(local29 + i*8) ^= 0x000000003800CD0D; final 7 bytes are outside this loop",
              "LOCAL37_FULL_RECONSTRUCTION_EXECUTED": False,
              "LOCAL29_BYTES_AT_STATE94_PROVEN": False,
              "WHY_NOT_YET": "R167 proves alias/route/pointer mutation, but R166 still has unresolved reaching definitions/runtime ordering for local105/local82/local67/local76 and exact local37 production.",
              "UNACCOUNTED_CONDITIONAL_COUNT_AFTER_R167": 3,
              "remaining_unaccounted_conditionals": r166_decision["remaining_unaccounted_conditionals"],
              "INDEPENDENT_FULL_PATH_BRANCH_COVERAGE_PROVEN": False,
              "OFFLINE_DECRYPT_AUTHORIZED": False,
              "H15_PLAINTEXT_RECOVERED": False,
              "ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD": False,
              "FLASH_ALLOWED": False,
              "NEXT": "R168: prove reaching definitions and intervening writes for local105/local82/local67/local76 on the local37 production loops, then combine those exact local37 bytes with the R167 pointer-XOR pass to determine local29 bytes at state94. Do not decrypt until that byte provenance is proven."
          }

          (out / "R167_DECISION.json").write_text(json.dumps(result, indent=2) + "\n")
          (out / "R167_ROUTE_AND_POINTER_PROOF.json").write_text(json.dumps({
              "route_states": route_states,
              "state_labels": {str(st): targets[st] for st in route_states},
              "pointer_block": b179,
              "calls_on_route": calls,
          }, indent=2) + "\n")
          (out / "R166_DECISION.json").write_text(json.dumps(r166_decision, indent=2) + "\n")
          print(json.dumps(result, indent=2))
          PYCODE

      - name: Package R167 evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r167/evidence
          zip -9 -r /tmp/R167_N9_STATE96_TO_STATE94_POINTER_ROUTE_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/R167_N9_STATE96_TO_STATE94_POINTER_ROUTE_EVIDENCE.zip \
            > /tmp/R167_N9_STATE96_TO_STATE94_POINTER_ROUTE_EVIDENCE.zip.sha256

      - name: Upload R167 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: R167-N9-STATE96-TO-STATE94-POINTER-ROUTE-STATIC-EVIDENCE
          path: |
            /tmp/R167_N9_STATE96_TO_STATE94_POINTER_ROUTE_EVIDENCE.zip
            /tmp/R167_N9_STATE96_TO_STATE94_POINTER_ROUTE_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          grep -F '"STATE96_LOCAL29_ALIAS_LOCAL37_PROVEN": true' /tmp/r167/evidence/R167_DECISION.json
          grep -F '"POINTER_XOR_LOOP_PROVEN": true' /tmp/r167/evidence/R167_DECISION.json
          grep -F '"LOCAL29_BYTES_AT_STATE94_PROVEN": false' /tmp/r167/evidence/R167_DECISION.json
          grep -F '"OFFLINE_DECRYPT_AUTHORIZED": false' /tmp/r167/evidence/R167_DECISION.json
          grep -F '"FLASH_ALLOWED": false' /tmp/r167/evidence/R167_DECISION.json
          echo R167_STATE96_TO_STATE94_POINTER_ROUTE_AUDIT_COMPLETE=YES
          echo FLASH_ALLOWED=NO
