name: Build OKN DSP V63 Remind Sound ID3 Guarded Proof

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_ANDROID_V63_REMIND_SOUND_ID3_GUARDED_PROOF.zip'
      - '.github/workflows/build-okn-dsp-v63.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify V63 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/okn_v63
          mkdir -p /tmp/okn_v63
          unzip -q OKN_DSP_ANDROID_V63_REMIND_SOUND_ID3_GUARDED_PROOF.zip -d /tmp/okn_v63

          check_file() { test -f "$1" || { echo "ERROR missing $1"; exit 1; }; echo "OK file: $1"; }
          check_text() { grep -Fq "$1" "$2" || { echo "ERROR missing marker '$1' in $2"; exit 1; }; echo "OK marker: $1"; }

          MAIN=/tmp/okn_v63/app/src/main/java/com/okn/dsp/MainActivity.kt
          SCALAR=/tmp/okn_v63/app/src/main/java/com/okn/dsp/ScalarControlActivity.kt
          LIVE=/tmp/okn_v63/app/src/main/java/com/okn/dsp/LiveEqActivity.kt
          ID3=/tmp/okn_v63/app/src/main/java/com/okn/dsp/RemindSoundProofActivity.kt
          POLICY=/tmp/okn_v63/app/src/main/java/com/okn/dsp/protocol/SaveParamsPolicy.kt
          SCALARPOL=/tmp/okn_v63/app/src/main/java/com/okn/dsp/protocol/VerifiedScalarControls.kt
          GATE=/tmp/okn_v63/app/src/main/java/com/okn/dsp/protocol/WriteGate.kt
          MANIFEST=/tmp/okn_v63/app/src/main/AndroidManifest.xml
          GRADLE=/tmp/okn_v63/app/build.gradle.kts

          for f in "$MAIN" "$SCALAR" "$LIVE" "$ID3" "$POLICY" "$SCALARPOL" "$GATE" "$MANIFEST" "$GRADLE"; do check_file "$f"; done
          check_file /tmp/okn_v63/README_V63.txt
          check_file /tmp/okn_v63/evidence/OKN_DSP_V63_REMIND_SOUND_ID3_GUARDED_PROOF_PLAN.txt
          check_file /tmp/okn_v63/evidence/OKN_DSP_V63_REMIND_SOUND_ID3_GUARDED_PROOF_PLAN.json
          check_file /tmp/okn_v63/evidence/OKN_DSP_V62_GLOBAL_CONTROLS_PRODUCTION_SUCCESS_CAPTURE.txt
          check_file /tmp/okn_v63/evidence/OKN_DSP_V62_LIVE_EQ_PRODUCTION_SUCCESS_CAPTURE.txt

          check_text 'versionCode = 63' "$GRADLE"
          check_text '4.4.0-v63-remind-sound-id3-guarded-proof' "$GRADLE"

          # Production hub stays real-control only; V63 adds only a dedicated proof entry.
          check_text 'OKN DSP V63 — PRODUCTION VERIFIED CONTROL HUB' "$MAIN"
          check_text 'REAL DSP CONTROLS ONLY • NO MOCK EQ • NO LOCAL PRESET WRITE • GENERIC WRITES LOCKED' "$MAIN"
          check_text 'ScalarControlActivity::class.java' "$MAIN"
          check_text 'LiveEqActivity::class.java' "$MAIN"
          check_text 'RemindSoundProofActivity::class.java' "$MAIN"
          check_text 'REMIND SOUND VOLUME ID3 • GUARDED PROOF • AUTO-RESTORE • NO SAVE' "$MAIN"
          check_text '.RemindSoundProofActivity' "$MANIFEST"
          if grep -Eq 'SeekBar|LOCAL EQ PRESETS|renderPresets|savePreset\(|loadPreset\(|pendingChanges' "$MAIN"; then
            echo 'ERROR: mock/local launcher controls present'
            exit 1
          fi

          # Generic writes stay locked; ID3 gets only its dedicated proof gate.
          check_text 'const val enabled: Boolean = false' "$GATE"
          check_text 'verifiedScalarControlsEnabled: Boolean = true' "$GATE"
          check_text 'liveEqEditorEnabled: Boolean = true' "$GATE"
          check_text 'const val remindSoundVolumeProofEnabled: Boolean = true' "$GATE"

          # Exact SaveParams policy remains centralized for the already-proven production modules.
          check_text 'const val ACTUATOR_ID = 7' "$POLICY"
          check_text 'UfeCodec.encodeWrite(ACTUATOR_ID, 0, byteArrayOf())' "$POLICY"
          check_text '570000000700000000' "$POLICY"
          if grep -R -n -F 'UfeCodec.encodeWrite(7' /tmp/okn_v63/app/src/main/java/com/okn/dsp | grep -v 'SaveParamsPolicy.kt'; then
            echo 'ERROR: direct SaveParams ID7 write exists outside SaveParamsPolicy'
            exit 1
          fi

          # Production scalar allow-list remains exactly the six proven controls; ID3 must not be promoted yet.
          for marker in \
            'VerifiedScalarControl(2, "MasterVolume"' \
            'VerifiedScalarControl(8, "BassVolume"' \
            'VerifiedScalarControl(9, "BassCutoff"' \
            'VerifiedScalarControl(10, "BassBoost"' \
            'VerifiedScalarControl(13, "MiddleBoost"' \
            'VerifiedScalarControl(11, "TrebleBoost"'; do
            check_text "$marker" "$SCALARPOL"
          done
          if grep -Fq 'VerifiedScalarControl(3,' "$SCALARPOL"; then
            echo 'ERROR: ID3 must remain outside Production Global Controls until V63 runtime proof succeeds'
            exit 1
          fi

          # Dedicated ID3 proof invariants.
          check_text 'const val ID = 3' "$ID3"
          check_text 'const val NAME = "RemindSoundVolume"' "$ID3"
          check_text 'const val MIN_DB = -70.0f' "$ID3"
          check_text 'const val MAX_DB = 6.0f' "$ID3"
          check_text 'const val DELTA_DB = 1.0f' "$ID3"
          check_text 'V63_ID3_PREFLIGHT' "$ID3"
          check_text 'V63_ID3_WRITE_PLAIN=' "$ID3"
          check_text 'V63_ID3_TARGET_DESCRIPTOR_VERIFY' "$ID3"
          check_text 'V63_ID3_RESTORE_WRITE_PLAIN=' "$ID3"
          check_text 'V63_ID3_RESTORE_DESCRIPTOR_VERIFY' "$ID3"
          check_text 'V63_REMIND_SOUND_ID3_PROOF_COMPLETE' "$ID3"
          check_text 'saveParamsSent=false' "$ID3"
          check_text 'persistence=RAM_ONLY' "$ID3"
          check_text 'UfeCodec.encodeFloat32Write(ID, target)' "$ID3"
          check_text 'UfeCodec.encodeFloat32Write(ID, base)' "$ID3"
          if grep -Fq 'SaveParamsPolicy.encodeTrigger()' "$ID3"; then
            echo 'ERROR: V63 ID3 proof must never call SaveParams'
            exit 1
          fi
          if grep -Fq 'UfeCodec.encodeWrite(7' "$ID3"; then
            echo 'ERROR: V63 ID3 proof contains direct SaveParams write'
            exit 1
          fi

          # V63 production scalar/live modules retain V62-proven semantics, with V63 log/UI labels.
          check_text 'V63_SCALAR_WRITE_PLAIN=' "$SCALAR"
          check_text 'V63_TARGET_DESCRIPTOR_VERIFY' "$SCALAR"
          check_text 'V63_SCALAR_WRITE_COMPLETE' "$SCALAR"
          check_text 'V63_FAILSAFE_RESTORE_PLAIN=' "$SCALAR"
          check_text 'V63_RESTORE_DESCRIPTOR_VERIFY' "$SCALAR"
          check_text 'V63_SCALAR_SAVEPARAMS_TRIGGER_PLAIN=' "$SCALAR"
          check_text 'V63_SCALAR_PERSISTENT_SAVE_COMPLETE' "$SCALAR"
          check_text 'handler.post { onDescriptorComplete(mode, obj) }' "$SCALAR"

          check_text 'V63_LIVE_EQ_WRITE_PLAIN=' "$LIVE"
          check_text 'V63_TARGET_DESCRIPTOR_VERIFY' "$LIVE"
          check_text 'V63_EQ_ROLLBACK_WRITE_PLAIN=' "$LIVE"
          check_text 'V63_ROLLBACK_DESCRIPTOR_VERIFY' "$LIVE"
          check_text 'V63_SAVEPARAMS_TRIGGER_PLAIN=' "$LIVE"
          check_text 'V63_PERSISTENT_SAVE_COMPLETE' "$LIVE"
          check_text 'handler.post { onDescriptorComplete(mode, obj) }' "$LIVE"

          # Ensure the proof path has no permanent-save vocabulary/calls beyond explanatory text.
          python3 - <<'PY'
          from pathlib import Path
          s = Path('/tmp/okn_v63/app/src/main/java/com/okn/dsp/RemindSoundProofActivity.kt').read_text()
          assert 'SaveParamsPolicy.encodeTrigger()' not in s
          assert 'sendPermanentSave(' not in s
          assert 'UfeCodec.encodeWrite(7' not in s
          assert s.count('UfeCodec.encodeFloat32Write(ID,') == 2
          print('OK: V63 ID3 proof has exactly target+restore FLOAT32 writes and no SaveParams call')
          PY

          echo 'OK: V63 guarded ID3 proof invariants verified'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/okn_v63
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and package artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn_v63/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          mkdir -p artifact
          cp "$APK" artifact/OKN_DSP_V63_REMIND_SOUND_ID3_GUARDED_PROOF-debug.apk
          cp /tmp/okn_v63/README_V63.txt artifact/
          cp /tmp/okn_v63/evidence/OKN_DSP_V63_REMIND_SOUND_ID3_GUARDED_PROOF_PLAN.txt artifact/
          cp /tmp/okn_v63/evidence/OKN_DSP_V63_REMIND_SOUND_ID3_GUARDED_PROOF_PLAN.json artifact/
          sha256sum artifact/OKN_DSP_V63_REMIND_SOUND_ID3_GUARDED_PROOF-debug.apk > artifact/OKN_DSP_V63_REMIND_SOUND_ID3_GUARDED_PROOF-debug.sha256
          ls -lh artifact

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-V63-REMIND-SOUND-ID3-GUARDED-PROOF-debug-apk
          path: artifact/
          if-no-files-found: error
          retention-days: 30
