name: Build OKN_DSP Auto Version

on:
  push:
    paths:
      - 'OKN_DSP_ANDROID_V*.zip'
      - '.github/workflows/build-okn-dsp-auto.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: okn-dsp-auto-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ZIP=''
          if [ "${{ github.event_name }}" = 'push' ]; then
            ZIP=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" \
              | grep -E '^OKN_DSP_ANDROID_V[0-9][^/]*\.zip$' \
              | tail -1 || true)
          fi
          if [ -z "${ZIP:-}" ]; then
            ZIP=$(find . -maxdepth 1 -type f -name 'OKN_DSP_ANDROID_V*.zip' -printf '%f\n' \
              | sort -V | tail -1)
          fi
          test -n "${ZIP:-}" || { echo 'No OKN_DSP source ZIP found.'; exit 1; }
          test -f "$ZIP"
          unzip -tq "$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Selected source: $ZIP"
          sha256sum "$ZIP"

      - name: Extract and validate source
        id: project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/okn_unpack
          mkdir -p /tmp/okn_unpack
          unzip -q "${{ steps.source.outputs.zip }}" -d /tmp/okn_unpack

          if [ -f /tmp/okn_unpack/app/build.gradle.kts ]; then
            ROOT=/tmp/okn_unpack
          else
            BUILD=$(find /tmp/okn_unpack -mindepth 2 -maxdepth 4 -type f -path '*/app/build.gradle.kts' | head -1)
            test -n "${BUILD:-}" || { echo 'app/build.gradle.kts not found'; exit 1; }
            ROOT=$(dirname "$(dirname "$BUILD")")
          fi

          PREFLIGHT=$(find "$ROOT" -maxdepth 1 -type f -name 'preflight_v*.py' -printf '%f\n' | sort -V | tail -1)
          test -n "${PREFLIGHT:-}" || { echo 'preflight_v*.py not found'; exit 1; }
          python3 "$ROOT/$PREFLIGHT"

          BUILD_FILE="$ROOT/app/build.gradle.kts"
          VERSION_CODE=$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*\([0-9][0-9]*\).*/\1/p' "$BUILD_FILE" | head -1)
          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$BUILD_FILE" | head -1)
          APP_ID=$(sed -n 's/^[[:space:]]*applicationId[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$BUILD_FILE" | head -1)
          test "$APP_ID" = 'com.okn.dsp'
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Building OKN_DSP V$VERSION_CODE ($VERSION_NAME)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify stable signing identity
        shell: bash
        run: |
          set -euo pipefail
          ROOT='${{ steps.project.outputs.root }}'
          KEY="$ROOT/app/okn_dsp_stable_debug.keystore"
          echo 'ba1c52f2607c09953c52fdd79c5f72026aaf0adb8aa44bcba277f7d9b49d9511  '"$KEY" | sha256sum -c -
          CERT=$(keytool -list -v -keystore "$KEY" -storepass android -alias androiddebugkey \
            | awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr 'A-F' 'a-f')
          test "$CERT" = 'c3da85af2e978dbd0ed9bb695e5c79a263189595c116ad93a1ded75a2eb98397'
          echo "Stable signer certificate: $CERT"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build stable-signed APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p '${{ steps.project.outputs.root }}' :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK and prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          ROOT='${{ steps.project.outputs.root }}'
          VERSION='${{ steps.project.outputs.version_code }}'
          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -f "$APK"
          "$APKSIGNER" verify --verbose "$APK"
          CERT=$($APKSIGNER verify --print-certs "$APK" \
            | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' | tr 'A-F' 'a-f')
          test "$CERT" = 'c3da85af2e978dbd0ed9bb695e5c79a263189595c116ad93a1ded75a2eb98397'

          mkdir -p /tmp/okn_artifact
          cp "$APK" "/tmp/okn_artifact/OKN_DSP_V${VERSION}.apk"
          sha256sum "/tmp/okn_artifact/OKN_DSP_V${VERSION}.apk" > "/tmp/okn_artifact/OKN_DSP_V${VERSION}.apk.sha256"
          printf '%s\n' "$CERT" > "/tmp/okn_artifact/OKN_DSP_V${VERSION}_CERT_SHA256.txt"
          cp "$ROOT"/README_V*.txt /tmp/okn_artifact/ 2>/dev/null || true

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN_DSP_V${{ steps.project.outputs.version_code }}_APK
          path: /tmp/okn_artifact/
          if-no-files-found: error
          retention-days: 30
