              'evidence/APK_EXE_REPORT_TH.md': '96a62c7ed75a0f5e29e460e6c63a189fce31532fd542426d5bbd346dda527a11',
              'evidence/COMBINED_EVIDENCE.md': '4e0bade6126e40261bde136d24a0d26350c269a529ebe1ab373fea4b0f12b248',
              'evidence/FULLDATA_COMPACT_NOTES.md': '82f0be05b3fe353ac8454d4ac263cdaab8476fc4e5b35c57de7ce4089fff3bfb',
              'evidence/GoloPine_DeviceDescription_REAL_20260906_204555.json': 'c4be7b923f14d59d9567d5586857a67c43334299edd51524fdcb8425934d2870',
              'evidence/OKN_DSP_V35_PROTOCOL_PROOF.txt': '8d75474e77e958e6815dba98199886ea91d1258aa4616ec51ee8ba09fcf73f93',
              'gradle.properties': 'cc38bc495ca4e4d7fa2fe7c9c1112f36af7a63fbf4fc3e7a088e215942403385',
              'settings.gradle': '012973fa1527eda16c0cb00eaece6186f54d4b40dd19f92702c0f8306c602d0e',
              'tools/validate_preamp_okn_v1.py': '2fcd6e0345eccd28a3a2c373b7d03d6a063f169f79dabb29ce2b18fc8cfebbdb',
          }
          for rel, parts in files.items():
              data = base64.b64decode(''.join(parts))
              target = root / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              got = hashlib.sha256(data).hexdigest()
              if got != expected[rel]:
                  raise SystemExit(f'SHA256 mismatch: {rel}: {got} != {expected[rel]}')
              print(f'OK {got}  {rel}')
          manifest = root / 'ALL_IN_ONE_SHA256SUMS.txt'
          manifest.write_text(''.join(f'{expected[p]}  {p}\n' for p in sorted(expected)), encoding='utf-8')
          print(f'Reconstructed {len(files)} verified files at {root}')
          PY
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Validate decoded GoloPine DSP data and safety gate
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          sha256sum -c ALL_IN_ONE_SHA256SUMS.txt
          python3 tools/validate_preamp_okn_v1.py
          # GitHub has already accepted this workflow (<500 KB).
          # Do not read it from GITHUB_WORKSPACE here: this self-contained build intentionally skips checkout.

      - name: Package reconstructed FullData source
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          zip -qr "$RUNNER_TEMP/Preamp_OKN_v1.0.0_FullData_Compact_Source.zip" . -x '.gradle/*' 'app/build/*'
          sha256sum "$RUNNER_TEMP/Preamp_OKN_v1.0.0_FullData_Compact_Source.zip" | tee "$RUNNER_TEMP/Preamp_OKN_v1.0.0_FullData_Compact_Source.zip.sha256"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android SDK 35 and Build Tools 35.0.0
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n1 || true)"
          fi
          test -x "$SDKMANAGER"
          echo "Using sdkmanager: $SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          set -o pipefail
          "$SDKMANAGER" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build Preamp_OKN FullData release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK identity and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          OUT="$RUNNER_TEMP/Preamp_OKN_v1.0.0_FullData.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee "$RUNNER_TEMP/Preamp_OKN_v1.0.0_FullData.apk.sha256"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          AAPT="$SDK/build-tools/${ANDROID_BUILD_TOOLS}/aapt"
          "$AAPT" dump badging "$OUT" | head -20 | tee "$RUNNER_TEMP/apk_badging.txt"
          grep -q "package: name='com.okn.preamp'" "$RUNNER_TEMP/apk_badging.txt"
          grep -q "versionName='1.0.0'" "$RUNNER_TEMP/apk_badging.txt"
          grep -q "application-label:'Preamp_OKN'" "$RUNNER_TEMP/apk_badging.txt"

      - name: Upload Preamp_OKN FullData APK
        uses: actions/upload-artifact@v6
        with:
          name: Preamp_OKN-v1.0.0-FullData-APK
          path: |
            ${{ runner.temp }}/Preamp_OKN_v1.0.0_FullData.apk
            ${{ runner.temp }}/Preamp_OKN_v1.0.0_FullData.apk.sha256
            ${{ runner.temp }}/apk_badging.txt
          if-no-files-found: error

      - name: Upload reconstructed FullData source
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Preamp_OKN-v1.0.0-FullData-Source
          path: |
            ${{ runner.temp }}/Preamp_OKN_v1.0.0_FullData_Compact_Source.zip
            ${{ runner.temp }}/Preamp_OKN_v1.0.0_FullData_Compact_Source.zip.sha256
          if-no-files-found: warn
