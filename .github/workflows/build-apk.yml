          class Strip extends StatelessWidget {
            final String name, sub;
            final Color color;
            final double value; // 0..100
            final bool muted;
            final double meter; // 0..1
            final ValueChanged<double> onChanged;
            final VoidCallback onMute;
            const Strip({
              super.key,
              required this.name,
              required this.sub,
              required this.color,
              required this.value,
              required this.muted,
              required this.meter,
              required this.onChanged,
              required this.onMute,
            });

            @override
            Widget build(BuildContext context) {
              return Container(
                width: 78,
                padding: const EdgeInsets.all(5),
                decoration: BoxDecoration(
                  color: panel,
                  border: Border.all(color: line),
                  borderRadius: BorderRadius.circular(8),
                ),
                child: Column(children: [
                  Container(
                    width: double.infinity,
                    padding: const EdgeInsets.symmetric(vertical: 6),
                    decoration: BoxDecoration(
                      color: const Color(0xFF22303A),
                      border: Border(top: BorderSide(color: color, width: 3)),
                      borderRadius: BorderRadius.circular(4),
                    ),
                    child: Column(children: [
                      Text(name, style: const TextStyle(fontSize: 13), overflow: TextOverflow.ellipsis),
                      Text(sub, style: const TextStyle(fontSize: 10, color: Colors.white54)),
                    ]),
                  ),
                  const SizedBox(height: 6),
                  SizedBox(
                    width: double.infinity,
                    height: 34,
                    child: FilledButton(
                      style: FilledButton.styleFrom(
                        padding: EdgeInsets.zero,
                        backgroundColor: muted ? const Color(0xFFE24B4A) : const Color(0xFF2A353D),
                        foregroundColor: Colors.white,
                        shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(6)),
                      ),
                      onPressed: onMute,
                      child: Text(tr('mute'), style: const TextStyle(fontSize: 12)),
                    ),
                  ),
                  const SizedBox(height: 6),
                  Expanded(
                    child: Row(crossAxisAlignment: CrossAxisAlignment.stretch, children: [
                      Expanded(
                        child: LayoutBuilder(
                          builder: (context, c) => SizedBox(
                            height: c.maxHeight,
                            child: RotatedBox(
                              quarterTurns: 3,
                              child: Slider(value: value.clamp(0.0, 100.0).toDouble(), min: 0, max: 100, onChanged: onChanged),
                            ),
                          ),
                        ),
                      ),
                      Meter(level: muted ? 0 : meter),
                    ]),
                  ),
                  Container(
                    width: double.infinity,
                    margin: const EdgeInsets.only(top: 4),
                    padding: const EdgeInsets.symmetric(vertical: 4),
                    color: const Color(0xFF0F1418),
                    child: Text('${value.round()}%', textAlign: TextAlign.center, style: const TextStyle(fontSize: 12)),
                  ),
                ]),
              );
            }
          }

          class Meter extends StatelessWidget {
            final double level;
            const Meter({super.key, required this.level});
            @override
            Widget build(BuildContext context) {
              const n = 14;
              final on = (level.clamp(0.0, 1.0) * n).round();
              return SizedBox(
                width: 8,
                child: Column(children: [
                  for (var i = n - 1; i >= 0; i--)
                    Expanded(
                      child: Container(
                        margin: const EdgeInsets.only(bottom: 1),
                        color: i < on
                            ? (i > 11 ? const Color(0xFFE24B4A) : i > 8 ? const Color(0xFFE0C02E) : const Color(0xFF2FD06A))
                            : const Color(0xFF243038),
                      ),
                    ),
                ]),
              );
            }
          }

          // ───────────── EQ tab ─────────────
          class EqTab extends StatefulWidget {
            final DspState s;
            final Ble ble;
            const EqTab({super.key, required this.s, required this.ble});
            @override
            State<EqTab> createState() => _EqTabState();
          }

          class _EqTabState extends State<EqTab> {
            int ch = 0;

            String name(int c) => switch (c) {
                  0 => tr('left'),
                  1 => tr('right'),
                  2 => tr('bass'),
                  _ => '${tr('ch')} ${c - 2}',
                };

            @override
            Widget build(BuildContext context) {
              final s = widget.s;
              final count = 3 + s.nCh;
              if (ch >= count) ch = 0;
              return ListView(padding: const EdgeInsets.all(12), children: [
                Wrap(spacing: 6, runSpacing: 6, children: [
                  for (var c = 0; c < count; c++)
                    ChoiceChip(label: Text(name(c)), selected: ch == c, onSelected: (_) => setState(() => ch = c)),
                ]),
                const SizedBox(height: 8),
                for (var b = 0; b < kBands; b++) band(s, ch, b),
              ]);
            }

            Widget band(DspState s, int c, int b) {
              final bq = s.eq[c][b];
              void push() {
                s.poke();
                widget.ble.sendBiquad(c, b);
              }

              Widget row(String label, double v, double min, double max, ValueChanged<double> on) =>
                  Row(children: [
                    SizedBox(width: 78, child: Text(label, style: const TextStyle(fontSize: 12))),
                    Expanded(
                      child: Slider(
                        value: v.clamp(min, max).toDouble(),
                        min: min,
                        max: max,
                        onChanged: on,
                        onChangeEnd: (_) => push(),
                      ),
                    ),
                    SizedBox(
                        width: 52,
                        child: Text(v.toStringAsFixed(v.abs() >= 100 ? 0 : 1),
                            textAlign: TextAlign.right, style: const TextStyle(fontSize: 12))),
                  ]);

              return Card(
                color: panel,
                child: Padding(
                  padding: const EdgeInsets.all(10),
                  child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                    Row(children: [
                      Text('#${b + 1}', style: const TextStyle(color: cyan)),
                      const SizedBox(width: 12),
                      DropdownButton<BiquadType>(
                        value: bq.type,
                        underline: const SizedBox(),
                        items: [for (final t in BiquadType.values) DropdownMenuItem(value: t, child: Text(t.name))],
                        onChanged: (t) {
                          if (t != null) {
                            bq.type = t;
                            push();
                          }
                        },
                      ),
                    ]),
                    row(tr('freq'), bq.freq, 20, 20000, (v) {
                      bq.freq = v;
                      s.poke();
                    }),
                    row(tr('q'), bq.q, 0.1, 10, (v) {
                      bq.q = v;
                      s.poke();
                    }),
                    row(tr('gain'), bq.gainDb, -15, 15, (v) {
                      bq.gainDb = v;
                      s.poke();
                    }),
                  ]),
                ),
              );
            }
          }

          // ───────────── effects tab (knobs) ─────────────
          class EffectsTab extends StatelessWidget {
            final DspState s;
            final Ble ble;
            const EffectsTab({super.key, required this.s, required this.ble});
            @override
            Widget build(BuildContext context) {
              return GridView.count(
                crossAxisCount: 2,
                padding: const EdgeInsets.all(12),
                mainAxisSpacing: 12,
                crossAxisSpacing: 12,
                children: [
                  Knob(label: tr('bassCut'), unit: 'Hz', value: s.bassCut, min: 40, max: 200, onChanged: (v) {
                    s.bassCut = v;
                    s.poke();
                    ble.setF(Proto.cmdBassCut, v);
                  }),
                  Knob(label: tr('bassBoost'), unit: 'dB', value: s.bassBoost, min: 0, max: 12, onChanged: (v) {
                    s.bassBoost = v;
                    s.poke();
                    ble.setF(Proto.cmdBassBoost, v);
                  }),
                  Knob(label: tr('trebleBoost'), unit: 'dB', value: s.trebleBoost, min: 0, max: 12, onChanged: (v) {
                    s.trebleBoost = v;
                    s.poke();
                    ble.setF(Proto.cmdTrebleBoost, v);
                  }),
                  Knob(label: tr('virtSurr'), unit: '%', value: s.virt, min: 0, max: 100, onChanged: (v) {
                    s.virt = v;
                    s.poke();
                    ble.setF(Proto.cmdVirt, v);
                  }),
                ],
