# ─────────────────────────────────────────────────────────────────────
# GoloPine DSP AudioTurning (clone) – single-file APK builder
# Put this file at  .github/workflows/build-apk.yml  in an (even empty)
# GitHub repo, then run Actions -> "Build DSP APK" -> Run workflow.
# The whole Flutter project is generated by the steps below.
#
# TODO before it talks to your board: edit class Proto in lib/core.dart
# (service/characteristic UUIDs, command ids, frame layout) – the values
# embedded here are placeholders.
# ─────────────────────────────────────────────────────────────────────
name: Build DSP APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project
        run: |
          flutter create --platforms=android --org com.golopine --project-name golopine_dsp --overwrite .

      - name: Write app source
        run: |
          mkdir -p lib tools
          cat > pubspec.yaml <<'PUBSPEC_EOF'
          name: golopine_dsp
          description: BLE controller for a DSP audio board (mixer-style UI).
          publish_to: "none"
          version: 1.0.0+1

          environment:
            sdk: ">=3.3.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            flutter_blue_plus: ^1.32.12
            permission_handler: ^11.3.1
            shared_preferences: ^2.2.3

          flutter:
            uses-material-design: true
          PUBSPEC_EOF
          cat > lib/core.dart <<'CORE_EOF'
          import 'dart:async';
          import 'dart:convert';
          import 'dart:typed_data';
          import 'dart:ui' show PlatformDispatcher;
          import 'package:flutter/foundation.dart';
          import 'package:flutter_blue_plus/flutter_blue_plus.dart';

          // ───────────────────────── strings ─────────────────────────
          const _en = {
            'title': 'GoloPine DSP AudioTurning',
            'mixer': 'Mixer',
            'eq': 'EQ',
            'effects': 'Effects',
            'presets': 'Presets',
            'device': 'Device',
            'master': 'Master',
            'remind': 'Remind',
            'bass': 'Bass',
            'left': 'Left',
            'right': 'Right',
            'ch': 'Ch',
            'mute': 'MUTE',
            'bassCut': 'Bass crossover',
            'bassBoost': 'Bass boost',
            'trebleBoost': 'Treble boost',
            'virtSurr': 'Virtual surround',
            'save': 'Save Params',
            'saved': 'Parameters saved',
            'voltage': 'Power stage voltage',
            'temp': 'Temperature',
            'cpu': 'CPU load %',
            'front': 'Front audio input plugged in',
            'rear': 'Rear audio input plugged in',
            'na': 'not available',
            'btOff': 'Bluetooth adapter is off',
            'btNeed': 'This software needs Bluetooth turned on',
            'permReq': 'Requesting Bluetooth permissions',
            'permRetry': 'Retry requesting permissions',
            'permWhy':
                'Bluetooth, Location and Nearby Devices permission is needed for this app to function',
            'permErr': 'Permission request error: ',
            'scan': 'Scan and connect',
            'connecting': 'Connecting…',
            'disconnect': 'Disconnect',
            'noDevice': 'No device found',
            'boardCh': 'Board channels',
            'freq': 'Freq (Hz)',
            'q': 'Q',
            'gain': 'Gain (dB)',
          };
          const _th = {
            'title': 'ซอฟต์แวร์ปรับเสียง GoloPine DSP',
            'mixer': 'มิกเซอร์',
            'eq': 'อีคิว',
            'effects': 'เอฟเฟกต์',
            'presets': 'พรีเซ็ต',
            'device': 'อุปกรณ์',
            'master': 'เสียงหลัก',
            'remind': 'เสียงเตือน',
            'bass': 'เบส',
            'left': 'ซ้าย',
            'right': 'ขวา',
            'ch': 'ช่อง',
            'mute': 'MUTE',
            'bassCut': 'จุดตัดเบส',
            'bassBoost': 'เพิ่มเบส',
            'trebleBoost': 'เพิ่มทรีเบิล',
            'virtSurr': 'เซอร์ราวด์เสมือน',
            'save': 'บันทึกพารามิเตอร์',
            'saved': 'บันทึกแล้ว',
            'voltage': 'แรงดันขั้วไฟ',
            'temp': 'อุณหภูมิ',
            'cpu': 'โหลด CPU %',
            'front': 'เสียบแจ็คอินพุตหน้าอยู่',
            'rear': 'เสียบแจ็คอินพุตหลังอยู่',
            'na': 'ไม่พร้อมใช้งาน',
            'btOff': 'บลูทูธปิดอยู่',
            'btNeed': 'ซอฟต์แวร์นี้ต้องเปิดบลูทูธ',
            'permReq': 'กำลังขออนุญาตบลูทูธ',
            'permRetry': 'ขออนุญาตอีกครั้ง',
            'permWhy': 'ต้องการสิทธิ์บลูทูธ ตำแหน่ง และอุปกรณ์ใกล้เคียงเพื่อให้แอปทำงาน',
            'permErr': 'ขออนุญาตไม่สำเร็จ: ',
            'scan': 'สแกนและเชื่อมต่อ',
            'connecting': 'กำลังเชื่อมต่อ…',
            'disconnect': 'ตัดการเชื่อมต่อ',
            'noDevice': 'ไม่พบอุปกรณ์',
            'boardCh': 'จำนวนช่องของบอร์ด',
            'freq': 'ความถี่ (Hz)',
            'q': 'Q',
            'gain': 'เกน (dB)',
          };

          String tr(String k) {
            final m = PlatformDispatcher.instance.locale.languageCode == 'th' ? _th : _en;
            return m[k] ?? _en[k] ?? k;
          }

          // ───────────────────────── model ─────────────────────────
          enum BiquadType { peak, lowShelf, highShelf, lowPass, highPass }

          class Biquad {
            BiquadType type;
            double freq;
            double q;
            double gainDb;
            Biquad({this.type = BiquadType.peak, this.freq = 1000, this.q = 1.0, this.gainDb = 0});

            Map<String, dynamic> toJson() => {'t': type.index, 'f': freq, 'q': q, 'g': gainDb};

            static Biquad fromJson(Map<String, dynamic> j) => Biquad(
                  type: BiquadType.values[(j['t'] as num).toInt()],
                  freq: (j['f'] as num).toDouble(),
                  q: (j['q'] as num).toDouble(),
                  gainDb: (j['g'] as num).toDouble(),
                );
          }

          const kBands = 5;
          const kEqChannels = 10; // Left, Right, Bass, Ch1..Ch7

          class DspState extends ChangeNotifier {
            int nCh = 5; // board variant: 3 / 5 / 7
            bool connected = false;

            double master = 70, remind = 40, bass = 60;
            bool masterMute = false, remindMute = false, bassMute = false;
            double bassCut = 80, bassBoost = 0, trebleBoost = 0, virt = 0;

            final chLevel = List<double>.filled(7, 70);
            final chMute = List<bool>.filled(7, false);
            final meters = List<double>.filled(11, 0); // 0..1 from device

            double volt = 0, temp = 0, cpu = 0;
            bool front = false, rear = false;

            final List<List<Biquad>> eq = List.generate(
              kEqChannels,
              (_) => List.generate(kBands, (i) => Biquad(freq: 62.5 * (1 << (i * 2)))),
            );

            void poke() => notifyListeners();

            Map<String, dynamic> toJson() => {
                  'nCh': nCh,
                  'master': master,
                  'remind': remind,
                  'bass': bass,
                  'bassCut': bassCut,
                  'bassBoost': bassBoost,
                  'trebleBoost': trebleBoost,
                  'virt': virt,
                  'chLevel': chLevel,
                  'eq': [
                    for (final c in eq) [for (final b in c) b.toJson()]
                  ],
                };

            void loadJson(Map<String, dynamic> j) {
              double d(String k, double def) => (j[k] as num?)?.toDouble() ?? def;
              nCh = (j['nCh'] as num?)?.toInt() ?? nCh;
              master = d('master', master);
              remind = d('remind', remind);
              bass = d('bass', bass);
              bassCut = d('bassCut', bassCut);
              bassBoost = d('bassBoost', bassBoost);
              trebleBoost = d('trebleBoost', trebleBoost);
              virt = d('virt', virt);
              final lv = j['chLevel'] as List?;
              if (lv != null) {
                for (var i = 0; i < 7 && i < lv.length; i++) {
                  chLevel[i] = (lv[i] as num).toDouble();
                }
              }
              final e = j['eq'] as List?;
              if (e != null) {
                for (var c = 0; c < kEqChannels && c < e.length; c++) {
                  final bands = e[c] as List;
                  for (var b = 0; b < kBands && b < bands.length; b++) {
                    eq[c][b] = Biquad.fromJson(Map<String, dynamic>.from(bands[b] as Map));
                  }
                }
              }
              notifyListeners();
            }

            String encode() => jsonEncode(toJson());
          }

          // ───────────────────────── protocol (PLACEHOLDER) ─────────────────────────
          // Replace UUIDs / command ids / layouts with the real ones from your board firmware.
          class Proto {
            static final serviceUuid = Guid('0000ffe0-0000-1000-8000-00805f9b34fb');
            static final charUuid = Guid('0000ffe1-0000-1000-8000-00805f9b34fb');
            static const nameHint = 'GoloPine';

            static const cmdMaster = 0x01,
                cmdRemind = 0x02,
                cmdBass = 0x03,
                cmdBassCut = 0x04,
                cmdBassBoost = 0x05,
                cmdTrebleBoost = 0x06,
                cmdVirt = 0x07,
                cmdMasterMute = 0x08,
                cmdRemindMute = 0x09,
                cmdBassMute = 0x0A,
                cmdBiquad = 0x10,
                cmdChLevel = 0x30,
                cmdChMute = 0x31,
                cmdSave = 0x20,
                cmdTelemetry = 0x80,
                cmdMeters = 0x81;

            /// [0xAA, cmd, len, payload..., xor]
            static Uint8List frame(int cmd, List<int> payload) {
              final b = <int>[0xAA, cmd, payload.length, ...payload];
              var x = 0;
              for (final v in b) {
                x ^= v;
              }
              return Uint8List.fromList([...b, x]);
            }

            static List<int> f32(double v) =>
                (ByteData(4)..setFloat32(0, v, Endian.little)).buffer.asUint8List();
          }

          // ───────────────────────── BLE ─────────────────────────
          class Ble {
            final DspState s;
            Ble(this.s);

            BluetoothDevice? _dev;
            BluetoothCharacteristic? _ch;
            StreamSubscription? _rxSub;
            StreamSubscription? _connSub;
            final _rx = <int>[];
            final _timers = <int, Timer>{};

            Future<BluetoothDevice?> scan() async {
              BluetoothDevice? found;
              final sub = FlutterBluePlus.scanResults.listen((list) {
                for (final r in list) {
                  final n = r.device.platformName + r.advertisementData.advName;
                  if (n.contains(Proto.nameHint) ||
                      r.advertisementData.serviceUuids.contains(Proto.serviceUuid)) {
                    found = r.device;
                  }
                }
              });
              await FlutterBluePlus.startScan(timeout: const Duration(seconds: 6));
              await FlutterBluePlus.isScanning.where((v) => v == false).first;
              await sub.cancel();
              return found;
            }

            Future<void> connect(BluetoothDevice d) async {
              await d.connect(timeout: const Duration(seconds: 12));
              _dev = d;
              _connSub = d.connectionState.listen((st) {
                if (st == BluetoothConnectionState.disconnected) {
                  s.connected = false;
                  s.poke();
                }
              });
              final services = await d.discoverServices();
              for (final sv in services) {
                if (sv.uuid == Proto.serviceUuid) {
                  for (final c in sv.characteristics) {
                    if (c.uuid == Proto.charUuid) _ch = c;
                  }
                }
              }
              if (_ch == null) throw Exception('Characteristic not found');
              await _ch!.setNotifyValue(true);
              _rxSub = _ch!.onValueReceived.listen(_onData);
              s.connected = true;
              s.poke();
            }

            Future<void> disconnect() async {
              await _rxSub?.cancel();
              await _connSub?.cancel();
              await _dev?.disconnect();
              _dev = null;
              _ch = null;
              s.connected = false;
              s.poke();
            }

            void _onData(List<int> chunk) {
              _rx.addAll(chunk);
              while (_rx.length >= 4) {
                if (_rx[0] != 0xAA) {
                  _rx.removeAt(0);
                  continue;
                }
                final len = _rx[2];
                if (_rx.length < 4 + len) return;
                final f = _rx.sublist(0, 4 + len);
                _rx.removeRange(0, 4 + len);
                var x = 0;
                for (final v in f.sublist(0, f.length - 1)) {
                  x ^= v;
                }
                if (x != f.last) continue;
                final p = f.sublist(3, 3 + len);
                if (f[1] == Proto.cmdTelemetry && p.length >= 10) {
                  final d = ByteData.sublistView(Uint8List.fromList(p));
                  s.volt = d.getFloat32(0, Endian.little);
                  s.temp = d.getFloat32(4, Endian.little);
                  s.cpu = d.getUint8(8).toDouble();
                  final fl = d.getUint8(9);
                  s.front = fl & 1 != 0;
                  s.rear = fl & 2 != 0;
                  s.poke();
                } else if (f[1] == Proto.cmdMeters) {
                  for (var i = 0; i < p.length && i < s.meters.length; i++) {
                    s.meters[i] = p[i] / 255.0;
                  }
                  s.poke();
                }
              }
            }

            Future<void> _send(int cmd, List<int> payload) async {
              final c = _ch;
              if (c == null) return;
              try {
                await c.write(Proto.frame(cmd, payload), withoutResponse: true);
              } catch (_) {}
            }

            /// Throttled float send; [key] groups updates of the same control.
            void setF(int cmd, double v, {int idx = 0}) {
              final key = cmd * 256 + idx;
              _timers[key]?.cancel();
              _timers[key] = Timer(const Duration(milliseconds: 40), () {
                if (cmd == Proto.cmdChLevel) {
                  _send(cmd, [idx, ...Proto.f32(v)]);
                } else {
                  _send(cmd, Proto.f32(v));
                }
              });
            }

            void setBool(int cmd, bool v, {int? idx}) =>
                _send(cmd, [if (idx != null) idx, v ? 1 : 0]);

            void sendBiquad(int ch, int band) {
              final b = s.eq[ch][band];
              _send(Proto.cmdBiquad,
                  [ch, band, b.type.index, ...Proto.f32(b.freq), ...Proto.f32(b.q), ...Proto.f32(b.gainDb)]);
            }

            void save() => _send(Proto.cmdSave, const []);
          }
          CORE_EOF
          cat > lib/main.dart <<'MAIN_EOF'
          import 'dart:convert';
          import 'dart:math' as math;
          import 'package:flutter/material.dart';
          import 'package:flutter_blue_plus/flutter_blue_plus.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'core.dart';

          const cyan = Color(0xFF18C0E8);
          const panel = Color(0xFF171F25);
          const panel2 = Color(0xFF1B242B);
          const line = Color(0xFF2A353D);

          void main() => runApp(const App());

          class App extends StatelessWidget {
            const App({super.key});
            @override
            Widget build(BuildContext context) => MaterialApp(
                  title: tr('title'),
                  debugShowCheckedModeBanner: false,
                  theme: ThemeData(
                    brightness: Brightness.dark,
                    colorSchemeSeed: cyan,
                    scaffoldBackgroundColor: const Color(0xFF11161A),
                    useMaterial3: true,
                  ),
                  home: const Gate(),
                );
          }

          // ───────────── permission + adapter gate ─────────────
          class Gate extends StatefulWidget {
            const Gate({super.key});
            @override
            State<Gate> createState() => _GateState();
          }

          class _GateState extends State<Gate> {
            bool busy = true, ok = false;
            String? err;

            @override
            void initState() {
              super.initState();
              ask();
            }

            Future<void> ask() async {
              setState(() {
                busy = true;
                err = null;
              });
              try {
                final r = await [
                  Permission.bluetoothScan,
                  Permission.bluetoothConnect,
                  Permission.locationWhenInUse,
                ].request();
                ok = r.values.every((x) => x.isGranted || x.isLimited);
              } catch (e) {
                err = e.toString();
              }
              if (mounted) setState(() => busy = false);
            }

            Widget msg(String t, {bool spin = false, Widget? action}) => Scaffold(
                  body: Center(
                    child: Padding(
                      padding: const EdgeInsets.all(24),
                      child: Column(mainAxisSize: MainAxisSize.min, children: [
                        if (spin) const CircularProgressIndicator(),
                        if (spin) const SizedBox(height: 16),
                        Text(t, textAlign: TextAlign.center),
                        if (action != null) ...[const SizedBox(height: 16), action],
                      ]),
                    ),
                  ),
                );

            @override
            Widget build(BuildContext context) {
              if (busy) return msg(tr('permReq'), spin: true);
              if (!ok) {
                return msg(
                  '${tr('permWhy')}${err != null ? '\n${tr('permErr')}$err' : ''}',
                  action: FilledButton(onPressed: ask, child: Text(tr('permRetry'))),
                );
              }
              return StreamBuilder<BluetoothAdapterState>(
                stream: FlutterBluePlus.adapterState,
                initialData: BluetoothAdapterState.unknown,
                builder: (context, snap) {
                  if (snap.data != BluetoothAdapterState.on) {
                    return msg('${tr('btOff')}\n${tr('btNeed')}');
                  }
                  return const Home();
                },
              );
            }
          }

          // ───────────── home with top tabs ─────────────
          class Home extends StatefulWidget {
            const Home({super.key});
            @override
            State<Home> createState() => _HomeState();
          }

          class _HomeState extends State<Home> {
            final s = DspState();
            late final ble = Ble(s);
            int tab = 0;

            @override
            void initState() {
              super.initState();
              SharedPreferences.getInstance().then((p) {
                final j = p.getString('params');
                if (j != null) {
                  try {
                    s.loadJson(jsonDecode(j) as Map<String, dynamic>);
                  } catch (_) {}
                }
              });
            }

            @override
            void dispose() {
              ble.disconnect();
              s.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              final tabs = [
                (Icons.tune, tr('mixer')),
                (Icons.graphic_eq, tr('eq')),
                (Icons.surround_sound, tr('effects')),
                (Icons.bookmarks_outlined, tr('presets')),
                (Icons.bluetooth, tr('device')),
              ];
              return Scaffold(
                body: SafeArea(
                  child: Column(children: [
                    Container(
                      color: const Color(0xFF0C1013),
                      padding: const EdgeInsets.all(6),
                      child: Row(children: [
                        for (var i = 0; i < tabs.length; i++)
                          Expanded(
                            child: GestureDetector(
                              onTap: () => setState(() => tab = i),
                              child: Container(
                                margin: const EdgeInsets.symmetric(horizontal: 2),
                                padding: const EdgeInsets.symmetric(vertical: 8),
                                decoration: BoxDecoration(
                                  color: tab == i ? const Color(0xFF26323A) : panel2,
                                  borderRadius: BorderRadius.circular(6),
                                ),
                                child: Column(children: [
                                  Icon(tabs[i].$1, size: 22, color: tab == i ? cyan : Colors.white54),
                                  const SizedBox(height: 2),
                                  Text(tabs[i].$2,
                                      style: TextStyle(
                                          fontSize: 11, color: tab == i ? cyan : Colors.white54)),
                                ]),
                              ),
                            ),
                          ),
                      ]),
                    ),
                    Expanded(
                      child: ListenableBuilder(
                        listenable: s,
                        builder: (context, _) => switch (tab) {
                          0 => MixerTab(s: s, ble: ble),
                          1 => EqTab(s: s, ble: ble),
                          2 => EffectsTab(s: s, ble: ble),
                          3 => PresetsTab(s: s, ble: ble),
                          _ => DeviceTab(s: s, ble: ble),
                        },
                      ),
                    ),
                  ]),
                ),
              );
            }
          }

          // ───────────── mixer tab ─────────────
          class MixerTab extends StatelessWidget {
            final DspState s;
            final Ble ble;
            const MixerTab({super.key, required this.s, required this.ble});

            @override
            Widget build(BuildContext context) {
              final strips = <Widget>[
                for (var i = 0; i < s.nCh; i++)
                  Strip(
                    name: '${tr('ch')} ${i + 1}',
                    sub: 'OUT ${i + 1}',
                    color: [
                      const Color(0xFFE0A82E),
                      const Color(0xFFE07A2E),
                      const Color(0xFF639922),
                      const Color(0xFF1D9E75),
                      const Color(0xFF7F77DD),
                      const Color(0xFFD4537E),
                      const Color(0xFF378ADD),
                    ][i % 7],
                    value: s.chLevel[i],
                    muted: s.chMute[i],
                    meter: s.meters[i],
                    onChanged: (v) {
                      s.chLevel[i] = v;
                      s.poke();
                      ble.setF(Proto.cmdChLevel, v, idx: i);
                    },
                    onMute: () {
                      s.chMute[i] = !s.chMute[i];
                      s.poke();
                      ble.setBool(Proto.cmdChMute, s.chMute[i], idx: i);
                    },
                  ),
                Strip(
                  name: tr('bass'),
                  sub: 'SUB',
                  color: const Color(0xFF378ADD),
                  value: s.bass,
                  muted: s.bassMute,
                  meter: s.meters[8],
                  onChanged: (v) {
                    s.bass = v;
                    s.poke();
                    ble.setF(Proto.cmdBass, v);
                  },
                  onMute: () {
                    s.bassMute = !s.bassMute;
                    s.poke();
                    ble.setBool(Proto.cmdBassMute, s.bassMute);
                  },
                ),
                Strip(
                  name: tr('remind'),
                  sub: 'ALERT',
                  color: const Color(0xFFD4537E),
                  value: s.remind,
                  muted: s.remindMute,
                  meter: 0,
                  onChanged: (v) {
                    s.remind = v;
                    s.poke();
                    ble.setF(Proto.cmdRemind, v);
                  },
                  onMute: () {
                    s.remindMute = !s.remindMute;
                    s.poke();
                    ble.setBool(Proto.cmdRemindMute, s.remindMute);
                  },
                ),
              ];
              final masterStrip = Strip(
                name: tr('master'),
                sub: 'ALL',
                color: const Color(0xFFE24B4A),
                value: s.master,
                muted: s.masterMute,
                meter: s.meters[9],
                onChanged: (v) {
                  s.master = v;
                  s.poke();
                  ble.setF(Proto.cmdMaster, v);
                },
                onMute: () {
                  s.masterMute = !s.masterMute;
                  s.poke();
                  ble.setBool(Proto.cmdMasterMute, s.masterMute);
                },
              );
              return Column(children: [
                StatusBar(s: s),
                Expanded(
                  child: Padding(
                    padding: const EdgeInsets.fromLTRB(8, 4, 8, 8),
                    child: Row(children: [
                      Expanded(
                        child: ListView(
                          scrollDirection: Axis.horizontal,
                          children: [for (final w in strips) Padding(padding: const EdgeInsets.only(right: 6), child: w)],
                        ),
                      ),
                      const SizedBox(width: 6),
                      masterStrip,
                    ]),
                  ),
                ),
              ]);
            }
          }

          class StatusBar extends StatelessWidget {
            final DspState s;
            const StatusBar({super.key, required this.s});
            @override
            Widget build(BuildContext context) {
              final t = s.connected
                  ? '${s.volt.toStringAsFixed(1)} V · ${s.temp.toStringAsFixed(0)} °C · CPU ${s.cpu.toStringAsFixed(0)}%'
