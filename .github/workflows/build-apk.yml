name: Build Android APK

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37 build-tools;37.0.0'
          accept-android-sdk-licenses: 'yes'
          log-accepted-android-sdk-licenses: 'false'

      # Install Gradle explicitly so CI does not depend on gradle-wrapper.jar being present.
      # Keep this in sync only when the project itself requires a newer Gradle major/minor.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6'
          cache-provider: basic

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare build.apk
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" build.apk
          sha256sum build.apk > build.apk.sha256
          ls -lh build.apk build.apk.sha256

      - name: Upload build.apk
        uses: actions/upload-artifact@v7
        with:
          path: build.apk
          archive: false
          retention-days: 30

      - name: Upload checksum
        uses: actions/upload-artifact@v7
        with:
          path: build.apk.sha256
          archive: false
          retention-days: 30
