            }
          }

          class Knob extends StatelessWidget {
            final String label, unit;
            final double value, min, max;
            final ValueChanged<double> onChanged;
            const Knob({
              super.key,
              required this.label,
              required this.unit,
              required this.value,
              required this.min,
              required this.max,
              required this.onChanged,
            });

            @override
            Widget build(BuildContext context) {
              final f = ((value - min) / (max - min)).clamp(0.0, 1.0).toDouble();
              return GestureDetector(
                onPanUpdate: (d) => onChanged((value - d.delta.dy / 180 * (max - min)).clamp(min, max).toDouble()),
                child: Container(
                  decoration: BoxDecoration(color: panel, border: Border.all(color: line), borderRadius: BorderRadius.circular(12)),
                  child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [
                    CustomPaint(size: const Size(96, 96), painter: _KnobPainter(f)),
                    const SizedBox(height: 8),
                    Text(label, style: const TextStyle(fontSize: 13)),
                    Text('${value.toStringAsFixed(max <= 12 ? 1 : 0)} $unit',
                        style: const TextStyle(fontSize: 12, color: Colors.white60)),
                  ]),
                ),
              );
            }
          }

          class _KnobPainter extends CustomPainter {
            final double f;
            _KnobPainter(this.f);
            @override
            void paint(Canvas canvas, Size size) {
              final c = size.center(Offset.zero);
              final r = size.width / 2 - 8;
              final rect = Rect.fromCircle(center: c, radius: r);
              final bg = Paint()
                ..style = PaintingStyle.stroke
                ..strokeWidth = 8
                ..strokeCap = StrokeCap.round
                ..color = const Color(0xFF2A353D);
              final fg = Paint()
                ..style = PaintingStyle.stroke
                ..strokeWidth = 8
                ..strokeCap = StrokeCap.round
                ..color = cyan;
              const start = 0.75 * math.pi;
              const sweep = 1.5 * math.pi;
              canvas.drawArc(rect, start, sweep, false, bg);
              canvas.drawArc(rect, start, sweep * f, false, fg);
              canvas.drawCircle(c, r - 14, Paint()..color = panel2);
              final a = start + sweep * f;
              canvas.drawLine(c + Offset(math.cos(a), math.sin(a)) * (r - 26),
                  c + Offset(math.cos(a), math.sin(a)) * (r - 16), Paint()..color = Colors.white..strokeWidth = 3);
            }

            @override
            bool shouldRepaint(_KnobPainter old) => old.f != f;
          }

          // ───────────── presets tab ─────────────
          class PresetsTab extends StatelessWidget {
            final DspState s;
            final Ble ble;
            const PresetsTab({super.key, required this.s, required this.ble});

            Future<void> save(BuildContext context) async {
              final p = await SharedPreferences.getInstance();
              await p.setString('params', s.encode());
              ble.save();
              if (context.mounted) {
                ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(tr('saved'))));
              }
            }

            @override
            Widget build(BuildContext context) => Center(
                  child: FilledButton.icon(
                    onPressed: () => save(context),
                    icon: const Icon(Icons.save),
                    label: Text(tr('save')),
                  ),
                );
          }

          // ───────────── device tab ─────────────
          class DeviceTab extends StatefulWidget {
            final DspState s;
            final Ble ble;
            const DeviceTab({super.key, required this.s, required this.ble});
            @override
            State<DeviceTab> createState() => _DeviceTabState();
          }

          class _DeviceTabState extends State<DeviceTab> {
            bool busy = false;

            Future<void> toggle() async {
              final s = widget.s, ble = widget.ble;
              if (s.connected) {
                await ble.disconnect();
                return;
              }
              setState(() => busy = true);
              try {
                final d = await ble.scan();
                if (d == null) {
                  if (mounted) {
                    ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(tr('noDevice'))));
                  }
                } else {
                  await ble.connect(d);
                }
              } catch (e) {
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('$e')));
                }
              }
              if (mounted) setState(() => busy = false);
            }

            @override
            Widget build(BuildContext context) {
              final s = widget.s;
              String v(double x, String u) => s.connected ? '${x.toStringAsFixed(1)} $u' : tr('na');
              Widget row(String k, String val) => Padding(
                    padding: const EdgeInsets.symmetric(vertical: 4),
                    child: Row(mainAxisAlignment: MainAxisAlignment.spaceBetween, children: [Text(k), Text(val)]),
                  );
              return ListView(padding: const EdgeInsets.all(12), children: [
                FilledButton(
                  onPressed: busy ? null : toggle,
                  child: Text(busy ? tr('connecting') : s.connected ? tr('disconnect') : tr('scan')),
                ),
                const SizedBox(height: 16),
                Text(tr('boardCh')),
                const SizedBox(height: 6),
                SegmentedButton<int>(
                  segments: const [
                    ButtonSegment(value: 3, label: Text('3')),
                    ButtonSegment(value: 5, label: Text('5')),
                    ButtonSegment(value: 7, label: Text('7')),
                  ],
                  selected: {s.nCh},
                  onSelectionChanged: (x) {
                    s.nCh = x.first;
                    s.poke();
                  },
                ),
                const SizedBox(height: 16),
                Card(
                  color: panel,
                  child: Padding(
                    padding: const EdgeInsets.all(12),
                    child: Column(children: [
                      row(tr('voltage'), v(s.volt, 'V')),
                      row(tr('temp'), v(s.temp, '°C')),
                      row(tr('cpu'), v(s.cpu, '%')),
                      row(tr('front'), s.front ? '●' : '○'),
                      row(tr('rear'), s.rear ? '●' : '○'),
                    ]),
                  ),
                ),
              ]);
            }
          }
          MAIN_EOF
          cat > tools/patch_manifest.py <<'PATCH_EOF'
          import re, pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          perms = """    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation"/>
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-feature android:name="android.hardware.bluetooth_le" android:required="true"/>
          """
          if "BLUETOOTH_CONNECT" not in s:
              s = s.replace("<application", perms + "    <application", 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="GoloPine DSP AudioTurning"', s, count=1)
          p.write_text(s)
          print("manifest patched")
          PATCH_EOF

      - name: Patch AndroidManifest permissions
        run: python3 tools/patch_manifest.py

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: golopine-dsp-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
