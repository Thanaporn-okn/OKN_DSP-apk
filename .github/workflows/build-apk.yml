name: Build Android APK from ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "android-project.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ZIP: android-project.zip
  GRADLE_VERSION: "8.9"
  ANDROID_PLATFORM_PACKAGE: "platforms;android-35"
  ANDROID_BUILD_TOOLS_PACKAGE: "build-tools;35.0.0"

jobs:
  build:
    name: Unzip and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Locate project ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "${PROJECT_ZIP}" ]]; then
            ZIP_PATH="${PROJECT_ZIP}"
          else
            mapfile -t ZIP_FILES < <(find . -maxdepth 1 -type f -name "*.zip" -print | sort)
            if [[ "${#ZIP_FILES[@]}" -ne 1 ]]; then
              echo "::error::Expected ${PROJECT_ZIP}, or exactly one .zip file in repository root."
              echo "ZIP files found: ${#ZIP_FILES[@]}"
              printf '%s\n' "${ZIP_FILES[@]:-}"
              exit 1
            fi
            ZIP_PATH="${ZIP_FILES[0]}"
          fi

          echo "ZIP_PATH=${ZIP_PATH}" >> "$GITHUB_ENV"
          echo "Using project archive: ${ZIP_PATH}"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          SRC_ROOT="${RUNNER_TEMP}/android-src"
          rm -rf "${SRC_ROOT}"
          mkdir -p "${SRC_ROOT}"
          unzip -q "${ZIP_PATH}" -d "${SRC_ROOT}"

          SETTINGS_FILE="$(
            find "${SRC_ROOT}" \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -not -path "*/__MACOSX/*" \
              -print \
              | head -n 1
          )"

          if [[ -z "${SETTINGS_FILE}" ]]; then
            echo "::error::No settings.gradle or settings.gradle.kts found inside ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "${SETTINGS_FILE}")"
          echo "PROJECT_DIR=${PROJECT_DIR}" >> "$GITHUB_ENV"
          echo "Android project root: ${PROJECT_DIR}"

      - name: Install Android SDK packages and accept licenses
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "${SDKMANAGER}" && -n "${ANDROID_HOME:-}" ]]; then
            SDKMANAGER="$(
              find "${ANDROID_HOME}/cmdline-tools" \
                -type f -name sdkmanager -print 2>/dev/null \
                | sort -V \
                | tail -n 1
            )"
          fi

          if [[ -z "${SDKMANAGER}" || ! -x "${SDKMANAGER}" ]]; then
            echo "::error::sdkmanager was not found on the GitHub runner."
            exit 1
          fi

          echo "sdkmanager: ${SDKMANAGER}"

          # Do not let `yes` + pipefail turn a successful license step into exit 141.
          set +o pipefail
          yes | "${SDKMANAGER}" --licenses >/dev/null 2>&1 || true
          set -o pipefail

          "${SDKMANAGER}" \
            "${ANDROID_PLATFORM_PACKAGE}" \
            "${ANDROID_BUILD_TOOLS_PACKAGE}"

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          if [[ -f "./gradlew" ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace clean assembleDebug
          else
            gradle --no-daemon --stacktrace clean assembleDebug
          fi

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="${RUNNER_TEMP}/apk-output"
          rm -rf "${OUT_DIR}"
          mkdir -p "${OUT_DIR}"

          mapfile -t APKS < <(
            find "${PROJECT_DIR}" \
              -type f \
              -path "*/build/outputs/apk/*" \
              -name "*.apk" \
              -print \
              | sort
          )

          if [[ "${#APKS[@]}" -eq 0 ]]; then
            echo "::error::Gradle completed but no APK was found."
            exit 1
          fi

          for APK in "${APKS[@]}"; do
            BASENAME="$(basename "${APK}")"
            cp "${APK}" "${OUT_DIR}/${BASENAME}"
            echo "APK: ${APK}"
          done

          # Friendly fixed filename for the usual debug app APK.
          DEBUG_APK="$(
            find "${PROJECT_DIR}" \
              -type f \
              -path "*/build/outputs/apk/debug/*.apk" \
              -name "*.apk" \
              -print \
              | head -n 1
          )"

          if [[ -n "${DEBUG_APK}" ]]; then
            cp "${DEBUG_APK}" "${OUT_DIR}/NearbyProduct-debug.apk"
          fi

          echo "APK_OUT_DIR=${OUT_DIR}" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NearbyProduct-APK-${{ github.run_number }}
          path: ${{ env.APK_OUT_DIR }}/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Android APK build"
            echo ""
            echo "- Source ZIP: \`${ZIP_PATH:-not found}\`"
            echo "- Gradle: \`${GRADLE_VERSION}\`"
            echo "- Java: \`17\`"
            echo "- Android platform: \`${ANDROID_PLATFORM_PACKAGE}\`"
            echo ""
            echo "When the job succeeds, download the APK from the **Artifacts** section of this workflow run."
          } >> "$GITHUB_STEP_SUMMARY"
