name: R77 BP1048P4 runtime read-only resource/mode exposure audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R77_BP1048P4_RUNTIME_READONLY_RESOURCE_MODE_EXPOSURE_AUDIT.yml"

permissions:
  contents: read

concurrency:
  group: r77-bp1048p4-runtime-readonly-exposure-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_REPO: https://github.com/leadercxn/bp1048_sdk_v0.1.12.git
  SDK_COMMIT: 8105bd864b04995d81c9f9ae77cb158259f39015

jobs:
  static-audit:
    name: Runtime read-only mode/resource exposure audit / NO USB / NO FLASH
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch pinned SDK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/bp1048_r77
          git init -q /tmp/bp1048_r77
          cd /tmp/bp1048_r77
          git remote add origin "$SDK_REPO"
          git fetch -q --depth=1 origin "$SDK_COMMIT"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SDK_COMMIT"
          echo "R77_SDK_COMMIT=$(git rev-parse HEAD)" | tee /tmp/R77_SDK_STATE.txt

      - name: Locate real mode and resource state definitions
        id: state_defs
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/bp1048_r77

          {
            echo "=== GetSystemMode ==="
            grep -RIn --include='*.c' --include='*.h' 'GetSystemMode' "$ROOT" || true
            echo
            echo "=== appCurrentMode ==="
            grep -RIn --include='*.c' --include='*.h' 'appCurrentMode' "$ROOT" || true
            echo
            echo "=== ResourceValue ==="
            grep -RIn --include='*.c' --include='*.h' 'ResourceValue' "$ROOT" || true
            echo
            echo "=== AppResourceUsbDevice ==="
            grep -RIn --include='*.c' --include='*.h' 'AppResourceUsbDevice' "$ROOT" || true
            echo
            echo "=== ModeResourceReady / resource bitmask candidates ==="
            grep -RIn --include='*.c' --include='*.h' \
              -E 'ModeResourceReady|ResourceReady|modeResource|resourceReady' "$ROOT" || true
          } | tee /tmp/R77_STATE_REFERENCES.txt

          grep -q 'GetSystemMode' /tmp/R77_STATE_REFERENCES.txt
          grep -q 'AppResourceUsbDevice' /tmp/R77_STATE_REFERENCES.txt

          echo "R77_REAL_MODE_SYMBOL_FOUND=YES" | tee /tmp/R77_STATE_DEFS.txt
          echo "R77_USB_RESOURCE_SYMBOL_FOUND=YES" | tee -a /tmp/R77_STATE_DEFS.txt

      - name: Audit communication protocol for direct real-mode exposure
        id: mode_exposure
        shell: bash
        run: |
          set -euo pipefail

          COMM=/tmp/bp1048_r77/BT_Audio_APP/bt_audio_app_src/audio/communication.c

          python3 - "$COMM" <<'PY'
          from pathlib import Path
          import sys, re

          text=Path(sys.argv[1]).read_text(encoding="latin-1", errors="replace")
          lines=text.splitlines()

          send_funcs=[]
          current=None
          buf=[]
          for line in lines:
              m=re.match(r'\s*(?:void|bool|int32_t|uint32_t)\s+([A-Za-z0-9_]+)\s*\(', line)
              if m:
                  if current:
                      send_funcs.append((current, "\n".join(buf)))
                  current=m.group(1)
                  buf=[line]
              elif current:
                  buf.append(line)
          if current:
              send_funcs.append((current, "\n".join(buf)))

          real_mode_refs=[]
          for name, body in send_funcs:
              if "GetSystemMode(" in body or "appCurrentMode" in body:
                  real_mode_refs.append((name, body))

          # Classify whether any response serialization copies the actual mode value.
          exposing=[]
          conditional_only=[]
          for name, body in real_mode_refs:
              if "Communication_Effect_Send" not in body:
                  continue
              if re.search(r'memcpy\s*\([^;]*(GetSystemMode|appCurrentMode)', body):
                  exposing.append(name)
              elif re.search(r'tx_buf\[[^\]]+\]\s*=\s*[^;]*(GetSystemMode|appCurrentMode)', body):
                  exposing.append(name)
              else:
                  conditional_only.append(name)

          out=[
              f"R77_COMM_FUNCTIONS_REFERENCING_REAL_MODE={len(real_mode_refs)}",
              "R77_COMM_DIRECT_REAL_MODE_RESPONSE_FUNCTIONS="
              + ",".join(exposing),
              "R77_COMM_REAL_MODE_CONDITIONAL_ONLY_FUNCTIONS="
              + ",".join(conditional_only),
              "R77_COMM_EXPOSES_GETSYSTEMMODE_VALUE_DIRECTLY="
              + ("YES" if exposing else "NO"),
          ]

          Path("/tmp/R77_MODE_EXPOSURE.txt").write_text(
              "\n".join(out)+"\n", encoding="utf-8"
          )

          with Path("/tmp/R77_MODE_REF_SNIPPETS.txt").open("w", encoding="utf-8") as f:
              for name, body in real_mode_refs:
                  f.write(f"=== {name} ===\n{body}\n\n")

          print("\n".join(out))
          PY

      - name: Audit communication protocol for resource-mask exposure
        id: resource_exposure
        shell: bash
        run: |
          set -euo pipefail

          ROOT=/tmp/bp1048_r77
          COMM="$ROOT/BT_Audio_APP/bt_audio_app_src/audio/communication.c"

          python3 - "$ROOT" "$COMM" <<'PY'
          from pathlib import Path
          import sys, re

          root=Path(sys.argv[1])
          comm=Path(sys.argv[2]).read_text(encoding="latin-1", errors="replace")

          # Find names of likely resource mask/state symbols from full SDK.
          candidates=set()
          for p in root.rglob("*"):
              if p.suffix.lower() not in {".c",".h"}:
                  continue
              try:
                  t=p.read_text(encoding="latin-1", errors="replace")
              except Exception:
                  continue
              for m in re.finditer(r'\b(?:ModeResourceReady|[A-Za-z0-9_]*ResourceReady[A-Za-z0-9_]*)\b', t):
                  candidates.add(m.group(0))

          comm_hits=[]
          tokens=["ResourceValue(", "AppResourceUsbDevice"] + sorted(candidates)
          for token in tokens:
              if token and token in comm:
                  comm_hits.append(token)

          out=[
              "R77_RESOURCE_STATE_CANDIDATES=" + ",".join(sorted(candidates)),
              "R77_COMM_RESOURCE_STATE_REFERENCES=" + ",".join(comm_hits),
              "R77_COMM_EXPOSES_RESOURCE_STATE_DIRECTLY="
              + ("YES" if comm_hits else "NO"),
          ]

          Path("/tmp/R77_RESOURCE_EXPOSURE.txt").write_text(
              "\n".join(out)+"\n", encoding="utf-8"
          )
          print("\n".join(out))
          PY

      - name: Prove 0x01 sys_mode is not real app mode
        id: sys_mode
        shell: bash
        run: |
          set -euo pipefail

          COMM=/tmp/bp1048_r77/BT_Audio_APP/bt_audio_app_src/audio/communication.c
          MAIN=/tmp/bp1048_r77/BT_Audio_APP/bt_audio_app_src/apps/main_task.c

          grep -F 'memcpy(&tx_buf[5],  &gCtrlVars.sys_mode, 2);' "$COMM"
          grep -F 'return mainAppCt.appCurrentMode;' "$MAIN"

          if grep -F 'gCtrlVars.sys_mode' "$MAIN" | grep -q 'GetSystemMode'; then
            echo "unexpected sys_mode linkage"
            exit 1
          fi

          cat > /tmp/R77_SYS_MODE_DISTINCTION.txt <<'EOF'
          R77_PROTOCOL_0X01_READS_GCTRLVARS_SYS_MODE=YES
          R77_GETSYSTEMMODE_RETURNS_APP_CURRENT_MODE=YES
          R77_PROTOCOL_0X01_IS_NOT_REAL_APP_MODE_READBACK=YES
          EOF

          cat /tmp/R77_SYS_MODE_DISTINCTION.txt

      - name: Prove 0x02 status fields do not expose mode/resource
        id: status02
        shell: bash
        run: |
          set -euo pipefail

          COMM=/tmp/bp1048_r77/BT_Audio_APP/bt_audio_app_src/audio/communication.c

          python3 - "$COMM" <<'PY'
          from pathlib import Path
          import sys

          lines=Path(sys.argv[1]).read_text(encoding="latin-1", errors="replace").splitlines()
          start=next(i for i,x in enumerate(lines) if "void Communication_Effect_0x02" in x)
          end=next(i for i in range(start+1,len(lines)) if lines[i].startswith("void ") and "Communication_Effect_0x02" not in lines[i])
          block="\n".join(lines[start:end])

          required=[
              "gCtrlVars.UsedRamSize",
              "gCtrlVars.cpu_mips",
              "gCtrlVars.AutoRefresh",
              "gCtrlVars.CpuMaxFreq",
              "gCtrlVars.CpuMaxRamSize",
          ]
          for x in required:
              if x not in block:
                  raise SystemExit("missing expected 0x02 field "+x)

          forbidden=[
              "GetSystemMode(",
              "appCurrentMode",
              "ResourceValue(",
              "AppResourceUsbDevice",
          ]
          bad=[x for x in forbidden if x in block]
          if bad:
              raise SystemExit("0x02 unexpectedly exposes mode/resource: "+",".join(bad))

          Path("/tmp/R77_STATUS02_BLOCK.txt").write_text(block+"\n", encoding="utf-8")
          print("R77_PROTOCOL_0X02_EXPOSES_REAL_MODE=NO")
          print("R77_PROTOCOL_0X02_EXPOSES_USB_RESOURCE=NO")
          PY

      - name: Build R77 decision
        id: decision
        shell: bash
        run: |
          set -euo pipefail

          MODE="$(
            grep '^R77_COMM_EXPOSES_GETSYSTEMMODE_VALUE_DIRECTLY=' \
              /tmp/R77_MODE_EXPOSURE.txt | cut -d= -f2
          )"

          RES="$(
            grep '^R77_COMM_EXPOSES_RESOURCE_STATE_DIRECTLY=' \
              /tmp/R77_RESOURCE_EXPOSURE.txt | cut -d= -f2
          )"

          cat > /tmp/R77_DECISION.txt <<EOF
          R77_RUNTIME_READONLY_REAL_MODE_EXPOSURE=$MODE
          R77_RUNTIME_READONLY_USB_RESOURCE_EXPOSURE=$RES

          R77_PROTOCOL_0X01_IS_NOT_REAL_APP_MODE_READBACK=YES
          R77_PROTOCOL_0X02_EXPOSES_REAL_MODE=NO
          R77_PROTOCOL_0X02_EXPOSES_USB_RESOURCE=NO

          R77_R76B_AA55_LATCH_CONFIRMED=YES
          R77_R76B_BOOTLOADER_REENUMERATION_OBSERVED=NO

          R77_REPEAT_AA55_REQUIRED=NO
          R77_REPEAT_LINE_MODE_PROBE_REQUIRED=NO

          R77_PRODUCTION_RESOURCE_BIT_PROVEN=NO
          R77_PRODUCTION_FLASH_BOOT_EN_PROVEN=NO
          R77_PRODUCTION_FIRST_BOOTSTRAP_PROVEN=NO

          R77_BOARD_USB_ACCESSED=NO
          R77_FLASH_WRITE_EXECUTED=NO
          R77_FLASH_ERASE_EXECUTED=NO
          FLASH_ALLOWED=NO
          EOF

          cat /tmp/R77_DECISION.txt

      - name: Build R77 evidence bundle
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          OUT=/tmp/R77_BP1048P4_RUNTIME_READONLY_EXPOSURE_EVIDENCE
          rm -rf "$OUT"
          mkdir -p "$OUT"

          for f in \
            R77_SDK_STATE.txt \
            R77_STATE_REFERENCES.txt \
            R77_STATE_DEFS.txt \
            R77_MODE_EXPOSURE.txt \
            R77_MODE_REF_SNIPPETS.txt \
            R77_RESOURCE_EXPOSURE.txt \
            R77_SYS_MODE_DISTINCTION.txt \
            R77_STATUS02_BLOCK.txt \
            R77_DECISION.txt; do
            test -f "/tmp/$f" && cp "/tmp/$f" "$OUT/"
          done

          cat > "$OUT/README.txt" <<'EOF'
          R77 determines whether the stock runtime tuning/status protocol exposes
          either the real application mode used by GetSystemMode() or the USB
          resource state used by start_up_grate(AppResourceUsbDevice).

          This is static-only. It intentionally performs no live USB command and
          no flash operation.
          EOF

          (
            cd /tmp
            zip -qr R77_BP1048P4_RUNTIME_READONLY_EXPOSURE_EVIDENCE.zip \
              R77_BP1048P4_RUNTIME_READONLY_EXPOSURE_EVIDENCE
            sha256sum R77_BP1048P4_RUNTIME_READONLY_EXPOSURE_EVIDENCE.zip \
              > R77_BP1048P4_RUNTIME_READONLY_EXPOSURE_EVIDENCE.zip.sha256
          )

          cat /tmp/R77_BP1048P4_RUNTIME_READONLY_EXPOSURE_EVIDENCE.zip.sha256

      - name: Upload R77 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R77-BP1048P4-RUNTIME-READONLY-EXPOSURE-EVIDENCE
          path: |
            /tmp/R77_BP1048P4_RUNTIME_READONLY_EXPOSURE_EVIDENCE.zip
            /tmp/R77_BP1048P4_RUNTIME_READONLY_EXPOSURE_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: R77 final gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          cat /tmp/R77_MODE_EXPOSURE.txt 2>/dev/null || true
          cat /tmp/R77_RESOURCE_EXPOSURE.txt 2>/dev/null || true
          cat /tmp/R77_SYS_MODE_DISTINCTION.txt 2>/dev/null || true
          cat /tmp/R77_DECISION.txt 2>/dev/null || true

          test "${{ steps.state_defs.outcome }}" = "success"
          test "${{ steps.mode_exposure.outcome }}" = "success"
          test "${{ steps.resource_exposure.outcome }}" = "success"
          test "${{ steps.sys_mode.outcome }}" = "success"
          test "${{ steps.status02.outcome }}" = "success"
          test "${{ steps.decision.outcome }}" = "success"

          grep -F 'R77_PROTOCOL_0X01_IS_NOT_REAL_APP_MODE_READBACK=YES' \
            /tmp/R77_SYS_MODE_DISTINCTION.txt
          grep -F 'R77_REPEAT_AA55_REQUIRED=NO' /tmp/R77_DECISION.txt
          grep -F 'R77_REPEAT_LINE_MODE_PROBE_REQUIRED=NO' /tmp/R77_DECISION.txt
          grep -F 'R77_BOARD_USB_ACCESSED=NO' /tmp/R77_DECISION.txt
          grep -F 'FLASH_ALLOWED=NO' /tmp/R77_DECISION.txt

          echo "R77_RUNTIME_READONLY_RESOURCE_MODE_EXPOSURE_AUDIT=PASS"
          echo "FLASH_ALLOWED=NO"
