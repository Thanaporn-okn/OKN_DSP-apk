name: OKN GoloPine Clone V55 APK

on:
  push:
    branches: [main, master]
    paths: ['.github/workflows/build-v55-golopine-clone.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.9'
  ANDROID_PLATFORM: 'android-35'
  ANDROID_BUILD_TOOLS: '35.0.0'

