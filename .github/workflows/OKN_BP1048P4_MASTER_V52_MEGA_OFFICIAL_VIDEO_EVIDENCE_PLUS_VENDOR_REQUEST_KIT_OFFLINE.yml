name: OKN BP1048P4 MASTER V52 MEGA OFFICIAL VIDEO EVIDENCE + VENDOR REQUEST KIT OFFLINE

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/OKN_BP1048P4_MASTER_V52_MEGA_OFFICIAL_VIDEO_EVIDENCE_PLUS_VENDOR_REQUEST_KIT_OFFLINE.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  REQUIRED_PHONE: "Samsung Galaxy S25+"
  REQUIRED_PATH: "Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only"

  V51_ARTIFACT_ID: "11303351544"

  GOLOPINE_HOME: "https://golodsp.com/"
  GOLOPINE_PAGE: "https://golodsp.com/7%E9%80%9A%E9%81%93%E9%9F%B3%E9%A2%91%E5%89%8D%E7%BA%A7/"
  VIDEO_ZIP_1: "https://golodsp.com/wp-content/uploads/2026/02/Videos-for-software-instruction.zip"
  VIDEO_ZIP_2: "https://golodsp.com/wp-content/uploads/2026/02/Videos-for-software-instruction-1.zip"

  LIVE_DSP_ALLOWED: "NO"
  HOST_TO_DSP_IO: "NO"
  FEATURE_REPORT_ALLOWED: "NO"
  NEW_LIVE_0X11_ALLOWED: "NO"
  STARTUP_COMMAND_ALLOWED: "NO"
  AUTH_REPLY_ALLOWED: "NO"
  FLASH_ALLOWED: "NO"
  ERASE_ALLOWED: "NO"
  WRITE_ALLOWED: "NO"
  SOLDERING_ALLOWED: "NO"
  BOARD_MODIFICATION_ALLOWED: "NO"
  EXTERNAL_PROGRAMMER_ALLOWED: "NO"

jobs:
  v52:
    name: Analyze official instruction videos and build exact vendor evidence request kit OFFLINE
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Gate 0 - immutable safety and path
        shell: bash
        run: |
          set -euo pipefail

          test "$REQUIRED_PHONE" = "Samsung Galaxy S25+"
          test "$REQUIRED_PATH" = "Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only"

          test "$LIVE_DSP_ALLOWED" = "NO"
          test "$HOST_TO_DSP_IO" = "NO"
          test "$FEATURE_REPORT_ALLOWED" = "NO"
          test "$NEW_LIVE_0X11_ALLOWED" = "NO"
          test "$STARTUP_COMMAND_ALLOWED" = "NO"
          test "$AUTH_REPLY_ALLOWED" = "NO"
          test "$FLASH_ALLOWED" = "NO"
          test "$ERASE_ALLOWED" = "NO"
          test "$WRITE_ALLOWED" = "NO"

          test "$SOLDERING_ALLOWED" = "NO"
          test "$BOARD_MODIFICATION_ALLOWED" = "NO"
          test "$EXTERNAL_PROGRAMMER_ALLOWED" = "NO"

          rm -rf /tmp/v52
          mkdir -p /tmp/v52/{downloads,v51,videos,frames,contacts,evidence,out}

          cat > /tmp/v52/evidence/00_SCOPE.txt <<'EOF'
          REVISION=MASTER-V52
          MODE=MEGA_OFFLINE_ONLY

          REQUIRED PHYSICAL PATH:
          Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only

          PURPOSE:
          1. Analyze official GoloPine software-instruction videos that V51 downloaded
             but could not semantically inspect from text alone.
          2. Extract scene/key frames, media metadata, and embedded subtitle tracks.
          3. Discover official contact channels from GoloPine pages/doc corpus.
          4. Build an exact bilingual vendor request kit for the remaining production
             blockers identified by V51/V50.
          5. Produce one consolidated artifact for immediate review.

          NO live DSP I/O.
          NO APK.
          NO vendor EXE execution.
          NO 0x11.
          NO HID Feature report.
          NO soldering/board modification/external programmer.
          NO flash/erase/write.
          FLASH_ALLOWED=NO
          EOF

      - name: Gate 1 - acquire V51 exact evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          curl -fL --retry 5 --retry-all-errors \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V51_ARTIFACT_ID}/zip" \
            -o /tmp/v52/downloads/v51.zip

          unzip -q /tmp/v52/downloads/v51.zip -d /tmp/v52/v51

          test -s /tmp/v52/v51/14_V51_FINAL_MATRIX.json
          cp /tmp/v52/v51/14_V51_FINAL_MATRIX.json \
             /tmp/v52/evidence/01_V51_INPUT_MATRIX.json

      - name: Gate 2 - download and unpack official software-instruction videos
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 5 --retry-all-errors "$VIDEO_ZIP_1" \
            -o /tmp/v52/downloads/videos_1.zip
          curl -fL --retry 5 --retry-all-errors "$VIDEO_ZIP_2" \
            -o /tmp/v52/downloads/videos_2.zip

          mkdir -p /tmp/v52/videos/zip1 /tmp/v52/videos/zip2
          unzip -q /tmp/v52/downloads/videos_1.zip -d /tmp/v52/videos/zip1 || true
          unzip -q /tmp/v52/downloads/videos_2.zip -d /tmp/v52/videos/zip2 || true

          sha256sum /tmp/v52/downloads/videos_*.zip \
            > /tmp/v52/evidence/02_VIDEO_ZIP_SHA256.txt

          find /tmp/v52/videos -type f -printf '%P %s bytes\n' | sort \
            > /tmp/v52/evidence/03_VIDEO_FILE_INVENTORY.txt

      - name: Gate 3 - ffprobe all media and extract subtitle tracks if present
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v ffprobe >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi

          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json,re,os

          root=Path("/tmp/v52/videos")
          media_ext={".mp4",".mov",".mkv",".avi",".webm",".m4v",".wmv",".flv"}
          rows=[]

          for p in sorted(x for x in root.rglob("*") if x.is_file() and x.suffix.lower() in media_ext):
              cp=subprocess.run(
                  ["ffprobe","-v","quiet","-print_format","json","-show_format","-show_streams",str(p)],
                  stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=False
              )
              try:
                  meta=json.loads(cp.stdout.decode(errors="replace"))
              except Exception:
                  meta={"parse_error":cp.stderr.decode(errors="replace")}

              streams=meta.get("streams",[])
              row={
                  "path":str(p.relative_to(root)),
                  "size":p.stat().st_size,
                  "duration":(meta.get("format") or {}).get("duration"),
                  "format_name":(meta.get("format") or {}).get("format_name"),
                  "video_streams":sum(1 for s in streams if s.get("codec_type")=="video"),
                  "audio_streams":sum(1 for s in streams if s.get("codec_type")=="audio"),
                  "subtitle_streams":sum(1 for s in streams if s.get("codec_type")=="subtitle"),
                  "streams":streams,
              }
              rows.append(row)

              # Extract embedded subtitle streams to text/SRT when possible.
              sub_idx=0
              for s in streams:
                  if s.get("codec_type")!="subtitle":
                      continue
                  dest=Path("/tmp/v52/evidence")/f"subtitle_{len(rows):02d}_{sub_idx:02d}.srt"
                  subprocess.run(
                      ["ffmpeg","-y","-v","error","-i",str(p),"-map",f"0:s:{sub_idx}",str(dest)],
                      stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,check=False
                  )
                  sub_idx+=1

          Path("/tmp/v52/evidence/04_VIDEO_FFPROBE.json").write_text(
              json.dumps(rows,indent=2,ensure_ascii=False)+"\n")
          print("MEDIA_FILES",len(rows))
          print("TOTAL_SUBTITLE_STREAMS",sum(x["subtitle_streams"] for x in rows))
          PY

      - name: Gate 4 - extract bounded representative and scene-change frames
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json,math,re,os,shutil

          root=Path("/tmp/v52/videos")
          frame_root=Path("/tmp/v52/frames")
          media_ext={".mp4",".mov",".mkv",".avi",".webm",".m4v",".wmv",".flv"}
          records=[]

          for idx,p in enumerate(sorted(x for x in root.rglob("*") if x.is_file() and x.suffix.lower() in media_ext),1):
              d=frame_root/f"video_{idx:02d}"
              d.mkdir(parents=True,exist_ok=True)

              # Uniform samples: max about 12 images/video.
              probe=subprocess.run(
                  ["ffprobe","-v","quiet","-show_entries","format=duration","-of","csv=p=0",str(p)],
                  stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,check=False
              ).stdout.decode().strip()
              try:
                  dur=float(probe)
              except Exception:
                  dur=0.0

              sample_times=[]
              if dur>0:
                  n=min(12,max(4,int(dur//30)+1))
                  sample_times=[dur*(i+1)/(n+1) for i in range(n)]

              uniform=[]
              for j,t in enumerate(sample_times,1):
                  out=d/f"uniform_{j:02d}_{t:.1f}s.jpg"
                  cp=subprocess.run(
                      ["ffmpeg","-y","-v","error","-ss",f"{t:.3f}","-i",str(p),
                       "-frames:v","1","-vf","scale='min(960,iw)':-2","-q:v","4",str(out)],
                      stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,check=False
                  )
                  if out.exists() and out.stat().st_size>0:
                      uniform.append(str(out.relative_to(frame_root)))

              # Scene-change samples. Keep first 16 only.
              scene_dir=d/"scenes"
              scene_dir.mkdir(exist_ok=True)
              subprocess.run(
                  ["ffmpeg","-y","-v","error","-i",str(p),
                   "-vf","select='gt(scene,0.35)',scale='min(960,iw)':-2",
                   "-vsync","vfr","-frames:v","16","-q:v","4",str(scene_dir/"scene_%02d.jpg")],
                  stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,check=False
              )
              scenes=[str(x.relative_to(frame_root)) for x in sorted(scene_dir.glob("*.jpg"))[:16]]

              records.append({
                  "video_index":idx,
                  "path":str(p.relative_to(root)),
                  "duration_seconds":dur,
                  "uniform_frames":uniform,
                  "scene_frames":scenes,
              })

          Path("/tmp/v52/evidence/05_FRAME_EXTRACTION_MANIFEST.json").write_text(
              json.dumps(records,indent=2,ensure_ascii=False)+"\n")
          print("VIDEOS_FRAMED",len(records))
          print("TOTAL_FRAMES",sum(len(x["uniform_frames"])+len(x["scene_frames"]) for x in records))
          PY

      - name: Gate 5 - build compact contact sheets for rapid human/vision review
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install --quiet --disable-pip-version-check pillow >/dev/null 2>&1 || true

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageOps,ImageDraw
          import json,math

          frame_root=Path("/tmp/v52/frames")
          manifest=json.loads(Path("/tmp/v52/evidence/05_FRAME_EXTRACTION_MANIFEST.json").read_text())

          out_rows=[]
          for rec in manifest:
              paths=[]
              for rel in rec["uniform_frames"]+rec["scene_frames"]:
                  p=frame_root/rel
                  if p.exists():
                      paths.append(p)
              # de-duplicate identical-looking exact bytes by hash
              import hashlib
              uniq=[]; seen=set()
              for p in paths:
                  h=hashlib.sha256(p.read_bytes()).hexdigest()
                  if h in seen: continue
                  seen.add(h); uniq.append(p)
              paths=uniq[:24]

              if not paths:
                  continue

              thumb_w,thumb_h=480,270
              cols=4
              rows=math.ceil(len(paths)/cols)
              sheet=Image.new("RGB",(cols*thumb_w,rows*(thumb_h+30)),"white")
              draw=ImageDraw.Draw(sheet)

              for i,p in enumerate(paths):
                  im=Image.open(p).convert("RGB")
                  im.thumbnail((thumb_w,thumb_h))
                  canvas=Image.new("RGB",(thumb_w,thumb_h),"black")
                  x=(thumb_w-im.width)//2
                  y=(thumb_h-im.height)//2
                  canvas.paste(im,(x,y))
                  cx=(i%cols)*thumb_w
                  cy=(i//cols)*(thumb_h+30)
                  sheet.paste(canvas,(cx,cy))
                  draw.text((cx+4,cy+thumb_h+5),p.name,fill="black")

              dest=Path("/tmp/v52/out")/f"V52_VIDEO_{rec['video_index']:02d}_CONTACT_SHEET.jpg"
              sheet.save(dest,quality=82)
              out_rows.append({
                  "video_index":rec["video_index"],
                  "video_path":rec["path"],
                  "contact_sheet":dest.name,
                  "frame_count_used":len(paths),
              })

          Path("/tmp/v52/evidence/06_CONTACT_SHEET_MANIFEST.json").write_text(
              json.dumps(out_rows,indent=2,ensure_ascii=False)+"\n")
          print("CONTACT_SHEETS",len(out_rows))
          PY

      - name: Gate 6 - discover official contact channels
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 3 --retry-all-errors "$GOLOPINE_HOME" \
            -o /tmp/v52/contacts/home.html || true
          curl -fL --retry 3 --retry-all-errors "$GOLOPINE_PAGE" \
            -o /tmp/v52/contacts/product.html || true

          # Fetch obvious contact/about pages linked from homepage.
          python3 - <<'PY'
          from pathlib import Path
          import re,urllib.parse,json

          home=Path("/tmp/v52/contacts/home.html").read_text(errors="replace") if Path("/tmp/v52/contacts/home.html").exists() else ""
          urls=[]
          for href in re.findall(r'href=["\']([^"\']+)["\']',home,re.I):
              u=urllib.parse.urljoin("https://golodsp.com/",href)
              if u.startswith("https://golodsp.com/") and re.search(r'contact|about|support|service',u,re.I):
                  if u not in urls:
                      urls.append(u)
          Path("/tmp/v52/contacts/contact_urls.txt").write_text("\n".join(urls[:20])+"\n")
          print("CONTACT_PAGE_CANDIDATES",len(urls[:20]))
          PY

          n=0
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            n=$((n+1))
            curl -fL --retry 2 --retry-all-errors "$url" \
              -o "/tmp/v52/contacts/page_${n}.html" || true
          done < /tmp/v52/contacts/contact_urls.txt

          python3 - <<'PY'
          from pathlib import Path
          import re,json,html,urllib.parse

          text=[]
          for p in Path("/tmp/v52/contacts").glob("*.html"):
              try:
                  s=p.read_text(errors="replace")
              except:
                  continue
              text.append(f"\n===== {p.name} =====\n{s}")
          s="\n".join(text)

          emails=sorted(set(re.findall(r'[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}',s,re.I)))
          phones=sorted(set(re.findall(r'(?:\+?\d[\d\s().-]{7,}\d)',s)))
          mailtos=sorted(set(re.findall(r'mailto:([^"\'?<>\s]+)',s,re.I)))
          tels=sorted(set(re.findall(r'tel:([^"\'?<>\s]+)',s,re.I)))
          social=sorted(set(re.findall(r'https?://[^"\'<>\s]+(?:whatsapp|wechat|facebook|youtube|instagram|linkedin)[^"\'<>\s]*',s,re.I)))

          result={
              "emails":emails[:100],
              "mailto":mailtos[:100],
              "phones":phones[:100],
              "tel_links":tels[:100],
              "social_or_messaging_links":social[:100],
          }
          Path("/tmp/v52/evidence/07_OFFICIAL_CONTACT_CHANNELS.json").write_text(
              json.dumps(result,indent=2,ensure_ascii=False)+"\n")
          print(json.dumps(result,indent=2,ensure_ascii=False))
          PY

      - name: Gate 7 - build exact bilingual vendor production-evidence request kit
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json,textwrap

          v51=json.loads(Path("/tmp/v52/v51/14_V51_FINAL_MATRIX.json").read_text())
          blockers=v51["remaining_blockers"]

          req={
              "runtime_to_updater_no_0x11_no_feature_proven":
                  "Exact production command/frame or official procedure for entering firmware updater/recovery from runtime USB VID:PID 6324:1719 without HID Feature reports and without transmitting byte 0x11.",
              "production_recovery_identity_proven":
                  "Exact USB VID:PID/interface/endpoint identity of the production updater/recovery mode for this GoloPine BP1048P4 board.",
              "pure_read_only_stock_backup_command_proven":
                  "Vendor-supported complete firmware/flash readback or backup procedure that is read-only and does not erase/write the board.",
              "production_stock_backup_completed":
                  "A vendor-supported method that lets the Samsung S25+ USB-C host save a complete stock backup before any first flash.",
              "production_flash_layout_proven":
                  "Exact production flash map/partition layout for this board; public SDK/reference staging addresses are not sufficient.",
              "production_entry_point_proven":
                  "Exact production load address/entry point or official signed image metadata that removes the need to infer it.",
              "bootable_production_image_proven":
                  "Official production firmware image/package format, signing/checksum rules, header fields, and validation procedure.",
              "ch7_id17_exact_wire_proven":
                  "Complete production Device Description/schema showing BiquadCascade7thChannel / i2sout1R and its exact numeric ID.",
              "gain_ids_22_28_global_free_proven":
                  "Complete production Device Description/schema or official allocation table confirming whether IDs 22 through 28 are unused and available.",
          }

          questions=[req[b] for b in blockers]

          en=[
              "Subject: BP1048P4 GoloPine DSP — request for production USB-C firmware/recovery documentation",
              "",
              "Hello GoloPine / JMDSTECH support,",
              "",
              "We are developing firmware for a GoloPine/JMDSTECH DSP board based on MVSilicon BP1048P4.",
              "",
              "Our required physical path is strictly:",
              "Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only.",
              "",
              "We cannot solder, modify the PCB, or use JTAG/SDP/AICE/external programmers.",
              "The production runtime USB identity observed on the board is VID:PID 6324:1719.",
              "",
              "Before any firmware write, we need the following official production information:",
          ]
          en += [f"{i+1}. {q}" for i,q in enumerate(questions)]
          en += [
              "",
              "We specifically need production-board documentation/packages, not reference SDK/example-board assumptions.",
              "If available, please provide the official signed firmware/update package, updater/recovery protocol documentation, complete Device Description/schema, and stock-backup/rollback procedure.",
              "",
              "For safety, we will not use HID Feature reports or transmit byte 0x11 in new live experiments.",
              "",
              "Thank you.",
          ]

          th=[
              "เรื่อง: ขอข้อมูล Production สำหรับการอัปเดต/กู้คืน Firmware ของ GoloPine DSP BP1048P4 ผ่าน USB-C",
              "",
              "เรียน GoloPine / JMDSTECH Support",
              "",
              "กำลังพัฒนาเฟิร์มแวร์สำหรับบอร์ด GoloPine/JMDSTECH DSP ที่ใช้ MVSilicon BP1048P4",
              "",
              "เงื่อนไขการเชื่อมต่อที่ต้องใช้เท่านั้น:",
              "Samsung Galaxy S25+ -> สาย USB-C -> พอร์ต USB-C ของบอร์ด DSP",
              "",
              "ไม่สามารถบัดกรี แก้ไข PCB หรือใช้ JTAG/SDP/AICE/programmer ภายนอกได้",
              "USB runtime ของบอร์ดที่ตรวจพบจริงคือ VID:PID 6324:1719",
              "",
              "ก่อนเขียนเฟิร์มแวร์ใด ๆ ต้องการข้อมูล production อย่างเป็นทางการดังต่อไปนี้:",
          ]
          th += [f"{i+1}. {q}" for i,q in enumerate(questions)]
          th += [
              "",
              "ต้องการข้อมูลของบอร์ด production จริง ไม่ใช่เพียง reference SDK/example board",
              "หากมี กรุณาส่ง signed firmware/update package, เอกสาร updater/recovery protocol, Device Description/schema แบบเต็ม และขั้นตอน stock backup/rollback",
              "",
              "เพื่อความปลอดภัย จะไม่ใช้ HID Feature report และจะไม่ส่ง byte 0x11 ในการทดลอง live ใหม่",
              "",
              "ขอบคุณครับ",
          ]

          Path("/tmp/v52/evidence/08_VENDOR_REQUEST_EN.txt").write_text("\n".join(en)+"\n")
          Path("/tmp/v52/evidence/09_VENDOR_REQUEST_TH.txt").write_text("\n".join(th)+"\n")
          Path("/tmp/v52/evidence/10_VENDOR_REQUEST_REQUIREMENTS.json").write_text(
              json.dumps({
                  "remaining_blockers":blockers,
                  "questions":questions,
                  "required_path":"Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only",
                  "runtime_vid_pid":"6324:1719",
                  "no_solder":True,
                  "no_board_mod":True,
                  "no_external_programmer":True,
                  "no_new_live_0x11":True,
                  "no_hid_feature":True,
                  "flash_allowed":False,
              },indent=2,ensure_ascii=False)+"\n"
          )
          PY

      - name: Gate 8 - final V52 decision
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json

          v51=json.loads(Path("/tmp/v52/v51/14_V51_FINAL_MATRIX.json").read_text())
          frames=json.loads(Path("/tmp/v52/evidence/05_FRAME_EXTRACTION_MANIFEST.json").read_text())
          contacts=json.loads(Path("/tmp/v52/evidence/07_OFFICIAL_CONTACT_CHANNELS.json").read_text())

          total_frames=sum(len(x["uniform_frames"])+len(x["scene_frames"]) for x in frames)
          contact_channels=(
              len(contacts.get("emails",[]))+
              len(contacts.get("mailto",[]))+
              len(contacts.get("phones",[]))+
              len(contacts.get("tel_links",[]))+
              len(contacts.get("social_or_messaging_links",[]))
          )

          final={
              "revision":"MASTER-V52",
              "official_instruction_video_count":len(frames),
              "representative_frame_count":total_frames,
              "contact_channel_candidate_count":contact_channels,
              "vendor_request_kit_generated":True,
              "remaining_blockers":v51["remaining_blockers"],
              "production_flash_path_proven":False,
              "new_live_0x11_allowed":False,
              "feature_report_live_allowed":False,
              "host_to_dsp_io":False,
              "flash_allowed":False,
              "next_allowed_action":
                  "REVIEW_OFFICIAL_VIDEO_CONTACT_SHEETS_AND_SEND_VENDOR_REQUEST_IF_NO_NEW_UPDATER_EVIDENCE_IS_VISIBLE"
          }

          Path("/tmp/v52/evidence/11_V52_FINAL_MATRIX.json").write_text(
              json.dumps(final,indent=2)+"\n")

          md=f"""# MASTER V52 FINAL DECISION

          Official software-instruction video evidence has been converted into
          bounded contact sheets for rapid visual review.

          - official video files analyzed: **{len(frames)}**
          - representative/scene frames extracted: **{total_frames}**
          - official contact-channel candidates found: **{contact_channels}**
          - bilingual vendor production-evidence request kit generated: **True**

          V51 blockers remain fail-closed until either:
