name: R130 exact PCTools read-only identify recovery USB static reverse

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R130_EXACT_PCTOOLS_READONLY_IDENTIFY_RECOVERY_USB_STATIC_REVERSE.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r130-pctools-readonly-identify-recovery-usb-static-${{ github.ref }}
  cancel-in-progress: true

env:
  FLASH_ALLOWED: "NO"
  R127_RUN_ID: "35865759674"
  R127_ACQUIRED_ARTIFACT_NAME: "R127-ACQUIRED-PUBLIC-FILES"
  R127_ACQUIRED_ARTIFACT_ID: "10751533100"
  R127_ACQUIRED_ARTIFACT_DIGEST: "sha256:43f60bf724744c488d3c3b0da147666b4091b7d74d3be6ebec6712e4b1b6983a"
  R127_INNER_ZIP_SHA256: "d217dff170352179ee3d6a70b8e3a58b98b41ef2d365a4551daff4124ce21be6"
  BT_NAME_RAR_SHA256: "c6b1fcb4d0e430c86c50e9ddf1007fa110f416c0570888060d693819164eccb8"
  PCTOOLS_SHA256: "0e13801b29070f805869823e6db4ad56d70494b2621fb63c330cea1d69e9ca33"
  UPGRADE_FLASH_SHA256: "bebb887b04fc724e1c459cce15d4395c78df3e098c54f06369ffe78b50aec073"
  R129_RUN_ID: "35880758844"
  R129_JOB_ID: "107248289374"
  R129_EVIDENCE_ARTIFACT_NAME: "R129-EXACT-PCTOOLS-AA55-HID-CALLGRAPH-STATIC-EVIDENCE"
  R129_EVIDENCE_ARTIFACT_ID: "10761375614"
  R129_EVIDENCE_DIGEST: "sha256:0978854828650425d0025acfca8156232842f60f6688955054db0337f0e49810"

jobs:
  readonly_static:
    name: STATIC ONLY - isolate identify/version/SN and recovery identity - no execution - no USB - no board
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r130/input /tmp/r130/r129 /tmp/r130/acquired /tmp/r130/unpacked/bt /tmp/r130/evidence
          cat > /tmp/r130/evidence/R130_SAFETY.txt <<'EOF'
          R130_MODE=READ_ONLY_IDENTIFY_RECOVERY_USB_DEEP_STATIC_ONLY
          R130_VENDOR_BINARY_EXECUTED=NO
          R130_INSTALLER_EXECUTED=NO
          R130_USB_DEVICE_ACCESS=NO
          R130_BOARD_CONTACT=NO
          R130_AA55_SENT=NO
          R130_RUNTIME_0X11_SENT=NO
          R130_RUNTIME_0XFE_SENT=NO
          R130_FLASHBOOT_COMMAND_SENT=NO
          R130_FLASH_READ_EXECUTED=NO
          R130_FLASH_ERASE_EXECUTED=NO
          R130_FLASH_WRITE_EXECUTED=NO
          R130_ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD=NO
          R130_ANALYSIS_TARGET=OFFLINE_TOOL_IDENTIFY_SN_VERSION_AND_RECOVERY_USB_SELECTION
          REFERENCE_OR_TOOL_EVIDENCE_IS_NOT_PRODUCTION_PROOF=YES
          FINAL_REQUIRED_TRANSPORT=SAMSUNG_S25_PLUS_USB_C_DIRECT_TO_DSP_USB_C
          HARDWARE_MODIFICATION=FORBIDDEN
          FLASH_ALLOWED=NO
          EOF

      - name: Download pinned R127 acquired files as inert data
        uses: actions/download-artifact@v4
        with:
          name: R127-ACQUIRED-PUBLIC-FILES
          path: /tmp/r130/input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 35865759674

      - name: Download pinned R129 evidence for continuity only
        uses: actions/download-artifact@v4
        with:
          name: R129-EXACT-PCTOOLS-AA55-HID-CALLGRAPH-STATIC-EVIDENCE
          path: /tmp/r130/r129
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 35880758844

      - name: Install static analysis tooling only
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            file unzip p7zip-full binutils jq python3-pip >/dev/null
          python3 -m pip install --disable-pip-version-check --no-input \
            pefile capstone >/dev/null

      - name: Verify pinned R127 files and extract as inert data
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r130/input
          test -f R127_ACQUIRED_PUBLIC_FILES.zip
          echo "${R127_INNER_ZIP_SHA256}  R127_ACQUIRED_PUBLIC_FILES.zip" | sha256sum -c -
          unzip -q R127_ACQUIRED_PUBLIC_FILES.zip -d /tmp/r130/acquired

          BT_RAR="$(find /tmp/r130/acquired -type f -name '*.rar' -path '*BT_NAME_TOOL*' -print -quit)"
          test -n "$BT_RAR"
          echo "${BT_NAME_RAR_SHA256}  ${BT_RAR}" | sha256sum -c -
          7z x -y -o/tmp/r130/unpacked/bt "$BT_RAR" >/tmp/r130/evidence/R130_7Z_BT_EXTRACT.txt

          PCTOOLS="$(find /tmp/r130/unpacked/bt -type f -name 'MV_AP82xx_BP10xx_PC_Tools_V2.2.8_20210205.exe' -print -quit)"
          UPGRADE="$(find /tmp/r130/unpacked/bt -type f -name 'upgrade_flash.exe' -print -quit)"
          test -n "$PCTOOLS" -a -n "$UPGRADE"
          echo "${PCTOOLS_SHA256}  ${PCTOOLS}" | sha256sum -c -
          echo "${UPGRADE_FLASH_SHA256}  ${UPGRADE}" | sha256sum -c -
          printf '%s\n' "$PCTOOLS" > /tmp/r130/PCTOOLS_PATH
          printf '%s\n' "$UPGRADE" > /tmp/r130/UPGRADE_PATH

      - name: Record R129 continuity decision
        shell: bash
        run: |
          set -euo pipefail
          find /tmp/r130/r129 -maxdepth 2 -type f -printf '%p\n' | sort > /tmp/r130/evidence/R130_R129_ARTIFACT_FILES.txt
          python3 - <<'PY'
          from pathlib import Path
          import json, zipfile
          root=Path('/tmp/r130/r129')
          zips=list(root.rglob('*.zip'))
          out={'artifact_files':[str(p) for p in sorted(root.rglob('*')) if p.is_file()]}
          for z in zips:
              try:
                  with zipfile.ZipFile(z) as f:
                      out.setdefault('zip_entries',{})[z.name]=f.namelist()
                      for n in f.namelist():
                          if n.endswith('R129_DECISION.json'):
                              out['R129_DECISION']=json.loads(f.read(n))
              except Exception as e:
                  out.setdefault('errors',[]).append({'path':str(z),'error':str(e)})
          Path('/tmp/r130/evidence/R130_R129_CONTINUITY.json').write_text(json.dumps(out,indent=2)+'\n')
          PY

      - name: Inventory identify SN version USB strings with exact offsets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re,hashlib

          paths={
              'pctools':Path(Path('/tmp/r130/PCTOOLS_PATH').read_text().strip()),
              'upgrade_flash':Path(Path('/tmp/r130/UPGRADE_PATH').read_text().strip()),
          }
          rx=re.compile(
              r'READSN|READ SN|ReadSN|Serial|SerialNumber|SN\b|S/N|version|firmware version|'
              r'device version|device info|device information|identify|identity|chip id|chipid|'
              r'UID|unique id|VID_|PID_|USB|HID|flashboot|bootloader|recovery|upgrade',re.I)
          out=[]
          for label,p in paths.items():
              data=p.read_bytes(); hits=[]
              for enc,pat in [('ascii',rb'[\x20-\x7e]{4,}'),('utf16le',rb'(?:[\x20-\x7e]\x00){4,}')]:
                  for m in re.finditer(pat,data):
                      s=m.group().decode('latin1','replace') if enc=='ascii' else m.group().decode('utf-16le','replace')
                      if rx.search(s):
                          hits.append({'encoding':enc,'file_offset':m.start(),'text':s[:1000]})
              out.append({'label':label,'path':str(p),'size':len(data),'sha256':hashlib.sha256(data).hexdigest(),'hits':hits})
          Path('/tmp/r130/evidence/R130_IDENTIFY_STRINGS.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          PY

      - name: Recover code xrefs and bounded functions for identify strings and HID reads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re,pefile
          from capstone import Cs,CS_ARCH_X86,CS_MODE_32
          from capstone.x86 import X86_OP_IMM,X86_OP_MEM

          READ_APIS={'HidD_GetFeature','HidD_GetInputReport','ReadFile'}
          WRITE_APIS={'HidD_SetFeature','HidD_SetOutputReport','WriteFile'}
          ENUM_APIS={'HidD_GetAttributes','HidP_GetCaps','SetupDiGetClassDevsA','SetupDiGetClassDevsW',
                     'SetupDiEnumDeviceInterfaces','SetupDiGetDeviceInterfaceDetailA','SetupDiGetDeviceInterfaceDetailW',
                     'CreateFileA','CreateFileW'}
          TARGET_RX=re.compile(r'READSN|READ SN|serial|SN\b|S/N|version|device info|identify|identity|chip.?id|UID|unique.?id',re.I)

          paths={
              'pctools':Path(Path('/tmp/r130/PCTOOLS_PATH').read_text().strip()),
              'upgrade_flash':Path(Path('/tmp/r130/UPGRADE_PATH').read_text().strip()),
          }
          allout=[]
          for label,p in paths.items():
              data=p.read_bytes(); pe=pefile.PE(str(p),fast_load=False); ib=pe.OPTIONAL_HEADER.ImageBase
              iat={}
              for e in getattr(pe,'DIRECTORY_ENTRY_IMPORT',[]):
                  for imp in e.imports:
                      if imp.name:
                          iat[imp.address]=imp.name.decode('latin1','replace')

              strings=[]
              for enc,pat in [('ascii',rb'[\x20-\x7e]{4,}'),('utf16le',rb'(?:[\x20-\x7e]\x00){4,}')]:
                  for m in re.finditer(pat,data):
                      s=m.group().decode('latin1','replace') if enc=='ascii' else m.group().decode('utf-16le','replace')
                      if TARGET_RX.search(s):
                          try: va=ib+pe.get_rva_from_offset(m.start())
                          except Exception: continue
                          strings.append({'va':va,'file_offset':m.start(),'encoding':enc,'text':s[:500]})
              str_by_va={x['va']:x for x in strings}

              md=Cs(CS_ARCH_X86,CS_MODE_32); md.detail=True
              ins=[]
              for sec in pe.sections:
                  if sec.Characteristics & 0x20000000:
                      ins.extend(md.disasm(sec.get_data(),ib+sec.VirtualAddress))
              ins=sorted(ins,key=lambda x:x.address)

              # Approximate function boundaries by common x86 prologues and RETs.
              starts=set()
              for i,x in enumerate(ins):
                  if x.mnemonic=='push' and x.op_str=='ebp' and i+1<len(ins):
                      y=ins[i+1]
                      if y.mnemonic=='mov' and y.op_str=='ebp, esp': starts.add(x.address)
              starts=sorted(starts)
              def fn_start_for(addr):
                  prior=[s for s in starts if s<=addr]
                  return prior[-1] if prior else None
              def fn_slice(addr):
                  s=fn_start_for(addr)
                  if s is None: return []
                  start_idx=next((i for i,x in enumerate(ins) if x.address==s),None)
                  if start_idx is None: return []
                  out=[]
                  for x in ins[start_idx:min(len(ins),start_idx+2500)]:
                      out.append(x)
                      if x.mnemonic.startswith('ret') and x.address>=addr: break
                  return out

              xrefs=[]
              for x in ins:
                  vals=[]
                  for op in x.operands:
                      if op.type==X86_OP_IMM: vals.append(op.imm & 0xffffffff)
                      elif op.type==X86_OP_MEM and op.mem.disp: vals.append(op.mem.disp & 0xffffffff)
                  for v in vals:
                      if v in str_by_va:
                          ss=str_by_va[v]
                          fs=fn_start_for(x.address)
                          xrefs.append({'insn_va':hex(x.address),'instruction':f'{x.mnemonic} {x.op_str}',
                                       'function_start':hex(fs) if fs else None,**{k:(hex(vv) if k=='va' else vv) for k,vv in ss.items()}})

              # Analyze each function containing an identify-like string.
              funcs={}
              for xr in xrefs:
                  fs=xr['function_start']
                  if not fs: continue
                  funcs.setdefault(fs,{'function_start':fs,'strings':[]})['strings'].append(xr)
              rows=[]
              for fs,row in funcs.items():
                  faddr=int(fs,16); body=fn_slice(faddr)
                  apis=[]; calls=[]
                  for x in body:
                      vals=[]
                      for op in x.operands:
                          if op.type==X86_OP_IMM: vals.append(op.imm & 0xffffffff)
                          elif op.type==X86_OP_MEM and op.mem.disp: vals.append(op.mem.disp & 0xffffffff)
                      names=sorted({iat[v] for v in vals if v in iat})
                      if names:
                          apis.extend(names); calls.append({'va':hex(x.address),'instruction':f'{x.mnemonic} {x.op_str}','imports':names})
                  aset=set(apis)
                  rows.append({
                      **row,
                      'read_apis':sorted(aset & READ_APIS),
                      'write_apis':sorted(aset & WRITE_APIS),
                      'enum_apis':sorted(aset & ENUM_APIS),
                      'all_relevant_import_calls':calls,
                      'tool_readonly_candidate':bool(aset & READ_APIS) and not bool(aset & WRITE_APIS),
                  })

              allout.append({'label':label,'path':str(p),'string_xrefs':xrefs,'identify_functions':rows,
                             'interpretation':'Function boundaries are static heuristics. A tool-side read-only candidate is not production authorization.'})
          Path('/tmp/r130/evidence/R130_IDENTIFY_FUNCTIONS.json').write_text(json.dumps(allout,indent=2,ensure_ascii=False)+'\n')
          PY

      - name: Enumerate USB VID PID textual and code comparison candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re,struct,pefile
          from capstone import Cs,CS_ARCH_X86,CS_MODE_32
          from capstone.x86 import X86_OP_IMM

          paths={
              'pctools':Path(Path('/tmp/r130/PCTOOLS_PATH').read_text().strip()),
              'upgrade_flash':Path(Path('/tmp/r130/UPGRADE_PATH').read_text().strip()),
          }
          pinned={
              'production_runtime':(0x18B4,0x06B7),
              'reference_flashboot_literal':(0x0000,0x2244),
              # R107 recorded textual identities 0633:5322 and 0288:7966 without proving
              # whether that notation was hexadecimal or decimal. Search both interpretations;
              # do not promote either interpretation to production evidence.
              'programmer_A_literal_hex_interpretation':(0x0633,0x5322),
              'programmer_B_literal_hex_interpretation':(0x0288,0x7966),
              'programmer_A_decimal_interpretation':(0x0279,0x14CA),
              'programmer_B_decimal_interpretation':(0x0120,0x1F1E),
          }
          out=[]
          for label,p in paths.items():
              data=p.read_bytes(); pe=pefile.PE(str(p),fast_load=False); ib=pe.OPTIONAL_HEADER.ImageBase
              textual=[]
              for enc,pat in [('ascii',rb'[\x20-\x7e]{5,}'),('utf16le',rb'(?:[\x20-\x7e]\x00){5,}')]:
                  for m in re.finditer(pat,data):
                      s=m.group().decode('latin1','replace') if enc=='ascii' else m.group().decode('utf-16le','replace')
                      if re.search(r'VID[_:= -]?[0-9A-Fa-f]{4}|PID[_:= -]?[0-9A-Fa-f]{4}|vid&pid|vendor.?id|product.?id',s,re.I):
                          textual.append({'file_offset':m.start(),'encoding':enc,'text':s[:500]})

              md=Cs(CS_ARCH_X86,CS_MODE_32); md.detail=True
              ins=[]
              for sec in pe.sections:
                  if sec.Characteristics & 0x20000000:
                      ins.extend(md.disasm(sec.get_data(),ib+sec.VirtualAddress))
              ins=sorted(ins,key=lambda x:x.address)
              interesting_values={v for pair in pinned.values() for v in pair if v}
              code=[]
              for i,x in enumerate(ins):
                  vals=[op.imm & 0xffffffff for op in x.operands if op.type==X86_OP_IMM]
                  hits=[v for v in vals if v in interesting_values]
                  if hits:
                      lo=max(0,i-18); hi=min(len(ins),i+19)
                      code.append({'va':hex(x.address),'instruction':f'{x.mnemonic} {x.op_str}','hits':[hex(v) for v in hits],
                                   'context':[{'va':hex(y.address),'text':f'{y.mnemonic} {y.op_str}'} for y in ins[lo:hi]]})

              raw={}
              for name,(vid,pid) in pinned.items():
                  vv=struct.pack('<H',vid) if vid else b'\x00\x00'; pp=struct.pack('<H',pid)
                  vo=[m.start() for m in re.finditer(re.escape(vv),data)] if vid else []
                  po=[m.start() for m in re.finditer(re.escape(pp),data)]
                  near=[{'vid_offset':a,'pid_offset':b,'distance':abs(a-b)} for a in vo for b in po if abs(a-b)<=32]
                  raw[name]={'vid_hex':hex(vid),'pid_hex':hex(pid),'vid_count':len(vo),'pid_count':len(po),'near_pairs_32_bytes':near[:200]}
              out.append({'label':label,'path':str(p),'textual_usb_ids':textual,'pinned_raw_hits':raw,'pinned_code_immediate_contexts':code})
          Path('/tmp/r130/evidence/R130_USB_ID_SELECTION.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          PY

      - name: Isolate HID read-call contexts without write authorization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,pefile
          from capstone import Cs,CS_ARCH_X86,CS_MODE_32
          from capstone.x86 import X86_OP_IMM,X86_OP_MEM

          paths={
              'pctools':Path(Path('/tmp/r130/PCTOOLS_PATH').read_text().strip()),
              'upgrade_flash':Path(Path('/tmp/r130/UPGRADE_PATH').read_text().strip()),
          }
          wanted={'HidD_GetFeature','HidD_GetInputReport','HidD_GetAttributes','HidP_GetCaps'}
          out=[]
          for label,p in paths.items():
              pe=pefile.PE(str(p),fast_load=False); ib=pe.OPTIONAL_HEADER.ImageBase
              iat={}
              for e in getattr(pe,'DIRECTORY_ENTRY_IMPORT',[]):
                  for imp in e.imports:
                      if imp.name:
                          n=imp.name.decode('latin1','replace')
                          if n in wanted: iat[imp.address]=n
              md=Cs(CS_ARCH_X86,CS_MODE_32); md.detail=True
              ins=[]
              for sec in pe.sections:
                  if sec.Characteristics & 0x20000000:
                      ins.extend(md.disasm(sec.get_data(),ib+sec.VirtualAddress))
              ins=sorted(ins,key=lambda x:x.address)
              calls=[]
              for i,x in enumerate(ins):
                  vals=[]
                  for op in x.operands:
                      if op.type==X86_OP_IMM: vals.append(op.imm & 0xffffffff)
                      elif op.type==X86_OP_MEM and op.mem.disp: vals.append(op.mem.disp & 0xffffffff)
                  names=sorted({iat[v] for v in vals if v in iat})
                  if names:
                      lo=max(0,i-60); hi=min(len(ins),i+90)
                      calls.append({'call_va':hex(x.address),'imports':names,
                                    'context':[{'va':hex(y.address),'text':f'{y.mnemonic} {y.op_str}'} for y in ins[lo:hi]]})
              out.append({'label':label,'iat':{hex(k):v for k,v in iat.items()},'read_calls':calls})
          Path('/tmp/r130/evidence/R130_HID_READ_CONTEXTS.json').write_text(json.dumps(out,indent=2)+'\n')
          PY

      - name: Build fail-closed R130 decision and Thai report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          ev=Path('/tmp/r130/evidence')
          funcs=json.loads((ev/'R130_IDENTIFY_FUNCTIONS.json').read_text())
          usb=json.loads((ev/'R130_USB_ID_SELECTION.json').read_text())
          reads=json.loads((ev/'R130_HID_READ_CONTEXTS.json').read_text())
          ids=json.loads((ev/'R130_IDENTIFY_STRINGS.json').read_text())

          candidates=[]
          for f in funcs:
              for r in f['identify_functions']:
                  if r.get('tool_readonly_candidate'):
                      candidates.append({'binary':f['label'],**r})

          prod_exact_text=[]
          ref2244_text=[]
          for r in usb:
              for x in r['textual_usb_ids']:
                  t=x['text'].lower()
                  if '18b4' in t and '06b7' in t: prod_exact_text.append({'binary':r['label'],**x})
                  if '2244' in t: ref2244_text.append({'binary':r['label'],**x})

          decision={
              'R129_RUN_ID':35880758844,
              'R129_JOB_ID':107248289374,
              'R129_EVIDENCE_ARTIFACT_ID':10761375614,
              'PCTOOLS_SHA256':'0e13801b29070f805869823e6db4ad56d70494b2621fb63c330cea1d69e9ca33',
              'UPGRADE_FLASH_SHA256':'bebb887b04fc724e1c459cce15d4395c78df3e098c54f06369ffe78b50aec073',
              'TOOL_IDENTIFY_SN_VERSION_STRING_COUNT':sum(len(x['hits']) for x in ids),
              'TOOL_READONLY_IDENTIFY_FUNCTION_CANDIDATE_COUNT':len(candidates),
              'TOOL_READONLY_IDENTIFY_FUNCTION_CANDIDATES':candidates[:50],
              'PRODUCTION_RUNTIME_18B4_06B7_EXACT_TEXTUAL_PAIR_COUNT':len(prod_exact_text),
              'REFERENCE_2244_TEXTUAL_CONTEXT_COUNT':len(ref2244_text),
              'HID_READ_CALL_COUNT':sum(len(x['read_calls']) for x in reads),
              'IMPORTANT_INTERPRETATION':'A tool-side static read-only candidate does not prove the production GoloPine board accepts it, and no discovered frame is authorized for live transmission.',
              'READ_ONLY_IDENTIFY_PATH_STATICALLY_PROVEN_FOR_PRODUCTION':False,
              'SAFE_READ_ONLY_STOCK_BACKUP_PROVEN':False,
              'PRODUCTION_BOOTSTRAP_BRIDGE_PROVEN':False,
              'PRODUCTION_RECOVERY_USB_IDENTITY_PROVEN':False,
              'MVA_ACCEPTANCE_FOR_PRODUCTION_PROVEN':False,
              'ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD':False,
              'AA55_LIVE_RETEST_ALLOWED':False,
              'RUNTIME_0X11_ALLOWED':False,
              'RUNTIME_0XFE_ALLOWED':False,
              'VENDOR_BINARY_EXECUTED':False,
              'USB_DEVICE_ACCESSED':False,
              'BOARD_CONTACTED':False,
              'FLASH_ALLOWED':False,
              'NEXT':'If strict tool-side read-only identify candidates exist, inspect their exact packet construction and response checks statically, then separately test whether their device-selection logic matches production identity using offline evidence only. Do not send any frame to the board.'
          }
          (ev/'R130_DECISION.json').write_text(json.dumps(decision,indent=2,ensure_ascii=False)+'\n')

          report=[
              '# R130 read-only identify / recovery USB static reverse',
              '',
              f'- identify/SN/version strings: {decision["TOOL_IDENTIFY_SN_VERSION_STRING_COUNT"]}',
              f'- strict tool-side read-only identify function candidates: {len(candidates)}',
              f'- exact textual production VID/PID pair 18B4:06B7 contexts: {len(prod_exact_text)}',
              f'- reference 2244 textual contexts: {len(ref2244_text)}',
              f'- HID read call contexts inspected: {decision["HID_READ_CALL_COUNT"]}',
              '',
              '## Safety',
              '- Offline static analysis only.',
              '- No vendor EXE executed.',
              '- No USB or board accessed.',
              '- No AA55 live retest.',
              '- 0x11 / 0xFE / erase / program / flash remain blocked.',
              '- Tool/reference evidence is not production proof.',
              '- FLASH_ALLOWED=NO',
          ]
          (ev/'R130_REPORT_TH.md').write_text('\n'.join(report)+'\n')
          print(json.dumps(decision,indent=2,ensure_ascii=False))
          PY

      - name: Package R130 evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r130/evidence
          zip -9 -r /tmp/R130_EXACT_PCTOOLS_READONLY_IDENTIFY_RECOVERY_USB_STATIC_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/R130_EXACT_PCTOOLS_READONLY_IDENTIFY_RECOVERY_USB_STATIC_EVIDENCE.zip \
            > /tmp/R130_EXACT_PCTOOLS_READONLY_IDENTIFY_RECOVERY_USB_STATIC_EVIDENCE.zip.sha256

      - name: Upload R130 evidence
        uses: actions/upload-artifact@v4
        with:
          name: R130-EXACT-PCTOOLS-READONLY-IDENTIFY-RECOVERY-USB-STATIC-EVIDENCE
          path: |
            /tmp/R130_EXACT_PCTOOLS_READONLY_IDENTIFY_RECOVERY_USB_STATIC_EVIDENCE.zip
            /tmp/R130_EXACT_PCTOOLS_READONLY_IDENTIFY_RECOVERY_USB_STATIC_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'R130_VENDOR_BINARY_EXECUTED=NO' /tmp/r130/evidence/R130_SAFETY.txt
          grep -F 'R130_USB_DEVICE_ACCESS=NO' /tmp/r130/evidence/R130_SAFETY.txt
          grep -F 'R130_BOARD_CONTACT=NO' /tmp/r130/evidence/R130_SAFETY.txt
          grep -F 'R130_AA55_SENT=NO' /tmp/r130/evidence/R130_SAFETY.txt
          grep -F 'R130_RUNTIME_0X11_SENT=NO' /tmp/r130/evidence/R130_SAFETY.txt
          grep -F 'R130_RUNTIME_0XFE_SENT=NO' /tmp/r130/evidence/R130_SAFETY.txt
          grep -F '"FLASH_ALLOWED": false' /tmp/r130/evidence/R130_DECISION.json
          echo R130_READONLY_STATIC_REVERSE_COMPLETE=YES
