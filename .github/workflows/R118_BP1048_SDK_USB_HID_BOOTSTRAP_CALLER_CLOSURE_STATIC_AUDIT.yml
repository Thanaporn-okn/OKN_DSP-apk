name: R118 BP1048 SDK USB-HID bootstrap caller closure static audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R118_BP1048_SDK_USB_HID_BOOTSTRAP_CALLER_CLOSURE_STATIC_AUDIT.yml"

permissions:
  contents: read

concurrency:
  group: r118-bp1048-usb-hid-bootstrap-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_REPO: "leadercxn/bp1048_sdk_v0.1.12"
  SDK_COMMIT: "8105bd864b04995d81c9f9ae77cb158259f39015"
  FLASH_ALLOWED: "NO"

jobs:
  static-audit:
    name: STATIC ONLY - exact whole-SDK caller closure - no execution - no USB - no board
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r118/sdk /tmp/r118/evidence
          cat > /tmp/r118/evidence/R118_SAFETY.txt <<'EOF'
          R118_MODE=STATIC_SOURCE_AND_BINARY_SYMBOL_AUDIT_ONLY
          R118_VENDOR_FIRMWARE_EXECUTED=NO
          R118_TOOL_BINARY_EXECUTED=NO
          R118_USB_DEVICE_ACCESS=NO
          R118_BOARD_CONTACT=NO
          R118_AA55_SENT=NO
          R118_RUNTIME_0X11_SENT=NO
          R118_CONTROL_0XFE_SENT=NO
          R118_FLASHBOOT_COMMAND_SENT=NO
          R118_FLASH_READ_EXECUTED=NO
          R118_FLASH_ERASE_EXECUTED=NO
          R118_FLASH_WRITE_EXECUTED=NO
          R118_ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD=NO
          FINAL_REQUIRED_TRANSPORT=SAMSUNG_S25_PLUS_USB_C_DIRECT_TO_DSP_USB_C
          HARDWARE_MODIFICATION=FORBIDDEN
          FLASH_ALLOWED=NO
          EOF

      - name: Install static tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            curl unzip file binutils jq >/dev/null

      - name: Acquire exact SDK commit
        shell: bash
        run: |
          set -euo pipefail
          URL="https://codeload.github.com/${SDK_REPO}/zip/${SDK_COMMIT}"
          curl --fail --location --retry 5 --retry-all-errors \
            "$URL" -o /tmp/r118/sdk.zip
          unzip -q /tmp/r118/sdk.zip -d /tmp/r118/sdk
          ROOT="$(find /tmp/r118/sdk -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$ROOT"
          echo "$ROOT" > /tmp/r118/sdk_root.txt
          {
            echo "SDK_REPO=$SDK_REPO"
            echo "SDK_COMMIT=$SDK_COMMIT"
            echo "ARCHIVE_SHA256=$(sha256sum /tmp/r118/sdk.zip | awk '{print $1}')"
            echo "ARCHIVE_SIZE=$(stat -c '%s' /tmp/r118/sdk.zip)"
          } > /tmp/r118/evidence/R118_SDK_PIN.txt

      - name: Correct R117 0x11 flash-write false negative
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,json

          root=Path(Path("/tmp/r118/sdk_root.txt").read_text().strip())
          p=root/"BT_Audio_APP"/"bt_audio_app_src"/"audio"/"communication.c"
          t=p.read_text(errors="replace")

          def extract(name):
              # Match arbitrary C return type and exact function name.
              m=re.search(
                  r'(?m)^[ \t]*(?!extern\b)(?!static\s+inline\b)'
                  r'[A-Za-z_][\w\s\*\(\)]*?\b'+re.escape(name)+
                  r'\s*\([^;]*?\)\s*\{',
                  t
              )
              if not m:
                  return ""
              b=t.find("{",m.start())
              depth=0
              for i in range(b,len(t)):
                  if t[i]=="{": depth+=1
                  elif t[i]=="}":
                      depth-=1
                      if depth==0:
                          return t[m.start():i+1]
              return ""

          funcs={
              "MV_UserWriteData":extract("MV_UserWriteData"),
              "Communication_Effect_0x11":extract("Communication_Effect_0x11"),
              "HIDUsb_Rx":extract("HIDUsb_Rx"),
              "UsbLoadAudioMode":extract("UsbLoadAudioMode"),
              "Communication_Effect_Send":extract("Communication_Effect_Send"),
          }

          for k,v in funcs.items():
              Path(f"/tmp/r118/evidence/R118_FUNC_{k}.txt").write_text(v+"\n")

          mv=funcs["MV_UserWriteData"]
          u11=funcs["Communication_Effect_0x11"]
          hid=funcs["HIDUsb_Rx"]
          load=funcs["UsbLoadAudioMode"]

          d={
              "MV_USER_WRITE_DATA_FOUND":bool(mv),
              "MV_USER_WRITE_DATA_HAS_SPIFLASHREAD":"SpiFlashRead" in mv,
              "MV_USER_WRITE_DATA_HAS_SPIFLASHERASE":"SpiFlashErase" in mv,
              "MV_USER_WRITE_DATA_HAS_SPIFLASHWRITE":"SpiFlashWrite" in mv,
              "CONTROL_0X11_FOUND":bool(u11),
              "CONTROL_0X11_CALLS_MV_USER_WRITE_DATA":"MV_UserWriteData" in u11,
              "CONTROL_0X11_CALLS_START_UP_GRATE":"start_up_grate" in u11,
              "CONTROL_0X11_HAS_VERSION_RESPONSE":bool(re.search(r'tx_buf\s*\[\s*2\s*\]\s*=\s*0x11',u11,re.I)),
              "HIDUSB_RX_FOUND":bool(hid),
              "HIDUSB_RX_CALLS_USBLOADAUDIOMODE":"UsbLoadAudioMode" in hid,
              "USBLOADAUDIOMODE_FOUND":bool(load),
              "USBLOADAUDIOMODE_REQUIRES_A5_5A_FRAME":("0xa5" in load.lower() and "0x5a" in load.lower()),
              "USBLOADAUDIOMODE_REQUIRES_0X16_TAIL":"0x16" in load.lower(),
              "USBLOADAUDIOMODE_DISPATCHES_COMMUNICATION_EFFECT_CONFIG":"Communication_Effect_Config" in load,
              "USBLOADAUDIOMODE_CALLS_START_UP_GRATE":"start_up_grate" in load,
              "USBLOADAUDIOMODE_TOUCHES_BOOT_FLAG":"FLASH_BOOT_FLAGE" in load or "ADR_FLASH_BOOT_FLAGE" in load,
          }
          Path("/tmp/r118/evidence/R118_EXACT_RUNTIME_PATH_FACTS.json").write_text(
              json.dumps(d,indent=2,ensure_ascii=False)+"\n"
          )
          print(json.dumps(d,indent=2))
          PY

      - name: Whole SDK exact call-site inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,json

          root=Path(Path("/tmp/r118/sdk_root.txt").read_text().strip())
          exts={".c",".h",".cpp",".cc",".s",".S"}
          files=[p for p in root.rglob("*") if p.is_file() and p.suffix in exts]

          call_names=[
              "start_up_grate",
              "HIDUsb_Rx",
              "HIDUsb_Tx",
              "UsbLoadAudioMode",
              "Communication_Effect_0x11",
              "MV_UserWriteData",
          ]

          rows=[]
          for p in files:
              t=p.read_text(errors="replace")
              lines=t.splitlines()
              for name in call_names:
                  for i,line in enumerate(lines):
                      if name not in line:
                          continue
                      rows.append({
                          "symbol":name,
                          "path":str(p.relative_to(root)),
                          "line":i+1,
                          "text":line.strip(),
                          "context":"\n".join(
                              f"{n+1}: {lines[n]}"
                              for n in range(max(0,i-5),min(len(lines),i+7))
                          )
                      })

          Path("/tmp/r118/evidence/R118_WHOLE_SDK_SYMBOL_REFERENCES.json").write_text(
              json.dumps(rows,indent=2,ensure_ascii=False)+"\n"
          )

          calls=[]
          for r in rows:
              if r["symbol"]!="start_up_grate":
                  continue
              s=r["text"].replace(" ","").replace("\t","")
              if "start_up_grate(" not in s:
                  continue
              definition=bool(re.search(r'\bvoid\s+start_up_grate\s*\(',r["text"]))
              arg=None
              m=re.search(r'start_up_grate\s*\(\s*([^)]+)\)',r["text"])
              if m: arg=m.group(1).strip()
              calls.append({**r,"definition":definition,"argument":arg})

          Path("/tmp/r118/evidence/R118_START_UP_GRATE_CALLS.json").write_text(
              json.dumps(calls,indent=2,ensure_ascii=False)+"\n"
          )
          PY

      - name: Trace AppResourceUsbDevice flow across whole SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          root=Path(Path("/tmp/r118/sdk_root.txt").read_text().strip())
          rows=[]
          for p in root.rglob("*"):
              if not p.is_file() or p.suffix.lower() not in (".c",".h",".cpp",".cc"):
                  continue
              t=p.read_text(errors="replace")
              lines=t.splitlines()
              for i,line in enumerate(lines):
                  if "AppResourceUsbDevice" in line:
                      rows.append({
                          "path":str(p.relative_to(root)),
                          "line":i+1,
                          "text":line.strip(),
                          "context":"\n".join(
                              f"{n+1}: {lines[n]}"
                              for n in range(max(0,i-8),min(len(lines),i+10))
                          )
                      })

          Path("/tmp/r118/evidence/R118_APPRESOURCE_USBDEVICE_REFERENCES.json").write_text(
              json.dumps(rows,indent=2,ensure_ascii=False)+"\n"
          )

          direct=[
              r for r in rows
              if re.search(r'start_up_grate\s*\(\s*AppResourceUsbDevice\s*\)',r["text"])
          ]
          Path("/tmp/r118/evidence/R118_DIRECT_USBDEVICE_BOOTSTRAP_CALLS.json").write_text(
              json.dumps(direct,indent=2,ensure_ascii=False)+"\n"
          )
          PY

      - name: Audit USB HID report and Feature-report source surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,json

          root=Path(Path("/tmp/r118/sdk_root.txt").read_text().strip())
          terms=[
              "GET_REPORT","SET_REPORT","get_report","set_report",
              "FeatureReport","FEATURE_REPORT","feature report",
              "HID_REPORT","ReportDescriptor","report descriptor",
              "hid_tx_buf","hid_rx_buf","HIDUsb_Rx","HIDUsb_Tx",
              "CFG_COMMUNICATION_BY_USB"
          ]

          rows=[]
          for p in root.rglob("*"):
              if not p.is_file() or p.suffix.lower() not in (".c",".h",".cpp",".cc",".s"):
                  continue
              t=p.read_text(errors="replace")
              lines=t.splitlines()
              for term in terms:
                  for i,line in enumerate(lines):
                      if term.lower() not in line.lower():
                          continue
                      rows.append({
                          "term":term,
                          "path":str(p.relative_to(root)),
                          "line":i+1,
                          "text":line.strip(),
                          "context":"\n".join(
                              f"{n+1}: {lines[n]}"
                              for n in range(max(0,i-6),min(len(lines),i+8))
                          )
                      })

          Path("/tmp/r118/evidence/R118_USB_HID_REPORT_SURFACE.json").write_text(
              json.dumps(rows,indent=2,ensure_ascii=False)+"\n"
          )
          PY

      - name: Re-evaluate AA55 only when USB/HID semantics are nearby
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,json

          root=Path(Path("/tmp/r118/sdk_root.txt").read_text().strip())
          usbpat=re.compile(
              r'USB|HID|REPORT|FEATURE|UsbLoadAudioMode|HIDUsb_Rx|HIDUsb_Tx|'
              r'AppResourceUsbDevice|start_up_grate',
              re.I
          )
          bytepat=re.compile(r'0x0*(AA|55)\b',re.I)

          hits=[]
          for p in root.rglob("*"):
              if not p.is_file() or p.suffix.lower() not in (".c",".h",".cpp",".cc",".s"):
                  continue
              t=p.read_text(errors="replace")
              for m in bytepat.finditer(t):
                  lo=max(0,m.start()-1800); hi=min(len(t),m.end()+1800)
                  ctx=t[lo:hi]
                  if usbpat.search(ctx):
                      hits.append({
                          "path":str(p.relative_to(root)),
                          "token":m.group(0),
                          "offset":m.start(),
                          "context":ctx
                      })
                      if len(hits)>=1000:
                          break

          Path("/tmp/r118/evidence/R118_AA55_USB_NEARBY_HITS.json").write_text(
              json.dumps(hits,indent=2,ensure_ascii=False)+"\n"
          )
          PY

      - name: Precompiled archives symbol and relocation audit
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat /tmp/r118/sdk_root.txt)"

          : > /tmp/r118/evidence/R118_NM_ALL_INTERESTING.txt
          : > /tmp/r118/evidence/R118_READELF_SYMBOLS_INTERESTING.txt
          : > /tmp/r118/evidence/R118_STRINGS_INTERESTING.txt

          while IFS= read -r -d '' f; do
            echo "===== $f =====" >> /tmp/r118/evidence/R118_NM_ALL_INTERESTING.txt
            nm -A "$f" 2>/dev/null | \
              grep -Ei 'start_up_grate|HIDUsb_Rx|HIDUsb_Tx|UsbLoadAudioMode|AppResourceUsbDevice|flash.?boot|upgrade' \
              >> /tmp/r118/evidence/R118_NM_ALL_INTERESTING.txt || true

            echo "===== $f =====" >> /tmp/r118/evidence/R118_READELF_SYMBOLS_INTERESTING.txt
            readelf -Ws "$f" 2>/dev/null | \
              grep -Ei 'start_up_grate|HIDUsb_Rx|HIDUsb_Tx|UsbLoadAudioMode|AppResourceUsbDevice|flash.?boot|upgrade' \
              >> /tmp/r118/evidence/R118_READELF_SYMBOLS_INTERESTING.txt || true

            echo "===== $f =====" >> /tmp/r118/evidence/R118_STRINGS_INTERESTING.txt
            strings -a "$f" 2>/dev/null | \
              grep -Ei 'start_up_grate|HIDUsb_Rx|HIDUsb_Tx|UsbLoadAudioMode|AppResourceUsbDevice|GET_REPORT|SET_REPORT|flash.?boot|upgrade' \
              >> /tmp/r118/evidence/R118_STRINGS_INTERESTING.txt || true
          done < <(find "$ROOT" -type f \( -name '*.a' -o -name '*.o' -o -name '*.elf' -o -name '*.out' \) -print0)

      - name: Build closure decision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          ev=Path("/tmp/r118/evidence")
          rt=json.loads((ev/"R118_EXACT_RUNTIME_PATH_FACTS.json").read_text())
          calls=json.loads((ev/"R118_START_UP_GRATE_CALLS.json").read_text())
          direct=json.loads((ev/"R118_DIRECT_USBDEVICE_BOOTSTRAP_CALLS.json").read_text())
          hid=json.loads((ev/"R118_USB_HID_REPORT_SURFACE.json").read_text())
          aa=json.loads((ev/"R118_AA55_USB_NEARBY_HITS.json").read_text())
          nm=(ev/"R118_NM_ALL_INTERESTING.txt").read_text(errors="replace")
          rs=(ev/"R118_READELF_SYMBOLS_INTERESTING.txt").read_text(errors="replace")
          st=(ev/"R118_STRINGS_INTERESTING.txt").read_text(errors="replace")

          nondef=[x for x in calls if not x.get("definition")]
          args=[x.get("argument") for x in nondef]

          archive_usb_bridge=bool(re.search(
              r'start_up_grate|HIDUsb_Rx|UsbLoadAudioMode',
              nm+"\n"+rs+"\n"+st,
              re.I
          ))

          d={
              "SDK_COMMIT":"8105bd864b04995d81c9f9ae77cb158259f39015",

              "R117_FALSE_NEGATIVE_CORRECTED":True,
              "MV_USER_WRITE_DATA_READS_FLASH":rt["MV_USER_WRITE_DATA_HAS_SPIFLASHREAD"],
              "MV_USER_WRITE_DATA_ERASES_FLASH":rt["MV_USER_WRITE_DATA_HAS_SPIFLASHERASE"],
              "MV_USER_WRITE_DATA_WRITES_FLASH":rt["MV_USER_WRITE_DATA_HAS_SPIFLASHWRITE"],

              "0X11_CALLS_BOOTSTRAP":rt["CONTROL_0X11_CALLS_START_UP_GRATE"],
              "0X11_CLASSIFICATION":"version-query OR destructive custom flash-sector update; not bootstrap",

              "HIDUSB_RX_CALLS_USBLOADAUDIOMODE":rt["HIDUSB_RX_CALLS_USBLOADAUDIOMODE"],
              "USBLOADAUDIOMODE_ACCEPTS_FRAMED_RUNTIME_PROTOCOL":(
                  rt["USBLOADAUDIOMODE_REQUIRES_A5_5A_FRAME"]
                  and rt["USBLOADAUDIOMODE_REQUIRES_0X16_TAIL"]
              ),
              "USBLOADAUDIOMODE_DISPATCHES_RUNTIME_CONTROL":rt["USBLOADAUDIOMODE_DISPATCHES_COMMUNICATION_EFFECT_CONFIG"],
              "USBLOADAUDIOMODE_CALLS_BOOTSTRAP":rt["USBLOADAUDIOMODE_CALLS_START_UP_GRATE"],

              "START_UP_GRATE_NONDEFINITION_CALL_COUNT":len(nondef),
              "START_UP_GRATE_CALL_ARGUMENTS":args,
              "SOURCE_CALLS_START_UP_GRATE_USBDEVICE_COUNT":len(direct),
              "SOURCE_HAS_START_UP_GRATE_USBDEVICE_CALL":len(direct)>0,

              "USB_HID_REPORT_SURFACE_HIT_COUNT":len(hid),
              "AA55_WITH_NEARBY_USB_HID_CONTEXT_COUNT":len(aa),
              "PRECOMPILED_BINARY_HAS_RELEVANT_SYMBOL_OR_STRING":archive_usb_bridge,

              "REFERENCE_SDK_CONCLUSION":[
                  "The visible runtime USB tuning path is HIDUsb_Rx -> UsbLoadAudioMode -> A5 5A framed Communication_Effect_Config.",
                  "That visible path does not invoke start_up_grate and does not touch the flashboot flag.",
                  "All visible source calls to start_up_grate use Card or UDisk; no visible source call uses AppResourceUsbDevice.",
                  "The start_up_grate function nevertheless contains an AppResourceUsbDevice PC-upgrade branch, so some trigger was intended but is absent from the visible call graph.",
                  "Therefore the PC bootstrap caller is omitted, compiled elsewhere, or belongs to a different SDK/production branch."
              ],

              "PRODUCTION_IF4_AA55_MATCH_PROVEN":False,
              "PRODUCTION_BOOTSTRAP_TRIGGER_PROVEN":False,
              "PRODUCTION_RECOVERY_USB_IDENTITY_PROVEN":False,
              "SAFE_READ_ONLY_STOCK_BACKUP_PROVEN":False,
              "ANY_LIVE_BOOTSTRAP_TEST_AUTHORIZED":False,

              "NEXT":(
                  "If no exact AppResourceUsbDevice caller or meaningful AA55 USB/HID handler is recovered here, stop treating the visible reference SDK as sufficient for the production bootstrap. "
                  "The next evidence source must be production firmware/updater code or a vendor PCTools binary that contains the missing PC-upgrade trigger; do not infer live bytes from the reference implementation."
              ),
              "FLASH_ALLOWED":False
          }

          (ev/"R118_DECISION.json").write_text(
              json.dumps(d,indent=2,ensure_ascii=False)+"\n"
          )

          report=[
              "# R118 — BP1048 USB/HID bootstrap caller closure",
              "",
              "## Main result",
              "",
              "- Corrects the R117 parser false-negative: MV_UserWriteData performs SpiFlashRead + SpiFlashErase + SpiFlashWrite.",
              "- 0x11 is therefore dangerous in its write form and remains blocked.",
              "- Visible USB runtime path: HIDUsb_Rx -> UsbLoadAudioMode -> framed runtime-control dispatcher.",
              "- Visible UsbLoadAudioMode does not invoke start_up_grate.",
              "- Visible start_up_grate callers are classified by argument; production PC/USB-device caller must be proven separately.",
              "",
              "No live command is authorized.",
              "",
              "FLASH_ALLOWED=NO"
          ]
          (ev/"R118_REPORT_TH.md").write_text("\n".join(report)+"\n")

          print(json.dumps(d,indent=2,ensure_ascii=False))
          PY

      - name: Fail-closed assertions
        shell: bash
        run: |
          set -euo pipefail
          D=/tmp/r118/evidence/R118_DECISION.json
          grep -F '"MV_USER_WRITE_DATA_ERASES_FLASH": true' "$D"
          grep -F '"MV_USER_WRITE_DATA_WRITES_FLASH": true' "$D"
          grep -F '"0X11_CALLS_BOOTSTRAP": false' "$D"
          grep -F '"USBLOADAUDIOMODE_CALLS_BOOTSTRAP": false' "$D"
          grep -F '"ANY_LIVE_BOOTSTRAP_TEST_AUTHORIZED": false' "$D"
          grep -F '"FLASH_ALLOWED": false' "$D"

      - name: Package evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r118/evidence
          zip -9 -r /tmp/R118_BP1048_USB_HID_BOOTSTRAP_CALLER_CLOSURE_EVIDENCE.zip .
          sha256sum /tmp/R118_BP1048_USB_HID_BOOTSTRAP_CALLER_CLOSURE_EVIDENCE.zip \
            > /tmp/R118_BP1048_USB_HID_BOOTSTRAP_CALLER_CLOSURE_EVIDENCE.zip.sha256

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: R118-BP1048-USB-HID-BOOTSTRAP-CALLER-CLOSURE-EVIDENCE
          path: |
            /tmp/R118_BP1048_USB_HID_BOOTSTRAP_CALLER_CLOSURE_EVIDENCE.zip
            /tmp/R118_BP1048_USB_HID_BOOTSTRAP_CALLER_CLOSURE_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final safety gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'R118_USB_DEVICE_ACCESS=NO' /tmp/r118/evidence/R118_SAFETY.txt
          grep -F 'R118_RUNTIME_0X11_SENT=NO' /tmp/r118/evidence/R118_SAFETY.txt
          grep -F 'R118_AA55_SENT=NO' /tmp/r118/evidence/R118_SAFETY.txt
          grep -F 'R118_ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD=NO' /tmp/r118/evidence/R118_SAFETY.txt
          echo R118_STATIC_CALLER_CLOSURE_COMPLETE=YES
          echo FLASH_ALLOWED=NO
