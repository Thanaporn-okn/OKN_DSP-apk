name: Build OKN DSP V80 Persistent Last-DSP Reconnect

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_ANDROID_V80_PERSISTENT_LAST_DSP_RECONNECT.zip'
      - '.github/workflows/build-okn-dsp-v80.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify V80 source
        shell: bash
        run: |
          set -euo pipefail
          echo 'fecc8c08236e574f3c481dfc20aa37470ce7b87e8684adefdb78d8d29579453e  OKN_DSP_ANDROID_V80_PERSISTENT_LAST_DSP_RECONNECT.zip' | sha256sum -c -
          rm -rf /tmp/okn_v80
          mkdir -p /tmp/okn_v80
          unzip -q OKN_DSP_ANDROID_V80_PERSISTENT_LAST_DSP_RECONNECT.zip -d /tmp/okn_v80
          cd /tmp/okn_v80
          python3 preflight_v80.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/okn_v80
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and package artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn_v80/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          mkdir -p artifact
          cp "$APK" artifact/OKN_DSP_V80_PERSISTENT_LAST_DSP_RECONNECT-debug.apk
          cp /tmp/okn_v80/README_V80.txt artifact/
          cp /tmp/okn_v80/evidence/OKN_DSP_V80_PERSISTENT_LAST_DSP_RECONNECT_PLAN.txt artifact/
          cp /tmp/okn_v80/evidence/OKN_DSP_V80_PERSISTENT_LAST_DSP_RECONNECT_PLAN.json artifact/
          cp /tmp/okn_v80/evidence/OKN_DSP_V79_PRODUCTION_SAFE_RUNTIME_SUCCESS_CAPTURE.txt artifact/
          sha256sum artifact/OKN_DSP_V80_PERSISTENT_LAST_DSP_RECONNECT-debug.apk > artifact/OKN_DSP_V80_PERSISTENT_LAST_DSP_RECONNECT-debug.sha256
          ls -lh artifact

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-V80-PERSISTENT-LAST-DSP-RECONNECT-debug-apk
          path: artifact/
          if-no-files-found: error
          retention-days: 30
