name: OKN BP1048P4 FlashData Deep Extract - All In One

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: okn-bp1048p4-flashdata-deep-${{ github.ref }}
  cancel-in-progress: true

env:
  FLASH_ALLOWED: "NO"

jobs:
  deep_extract:
    name: Deep extract flash_boot.c flash_data - NO USB - NO FLASH
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          mkdir -p /tmp/fd/evidence
          cat > /tmp/fd/evidence/SAFETY.txt <<'EOF'
          MODE=OFFLINE_STATIC_FLASH_DATA_DEEP_ANALYSIS_ONLY
          TARGET=MVSilicon_BP1048P4
          USB_OR_BOARD_CONTACT=NO
          VENDOR_BINARY_EXECUTED=NO
          FEATURE_55_SENT=NO
          FEATURE_AA_SENT=NO
          FLASH_READ_EXECUTED=NO
          FLASH_ERASE_EXECUTED=NO
          FLASH_WRITE_EXECUTED=NO
          HARDWARE_MODIFICATION=FORBIDDEN
          FLASH_ALLOWED=NO
          EOF

      - name: Checkout public BP1048 SDK
        uses: actions/checkout@v4
        with:
          repository: leadercxn/bp1048_sdk_v0.1.12
          ref: master
          path: bp1048-sdk
          fetch-depth: 1

      - name: Deep analyze flash_boot.c and flash_data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import collections, hashlib, json, math, re, shutil, subprocess

          ROOT = Path("bp1048-sdk")
          OUT = Path("/tmp/fd/evidence")
          OUT.mkdir(parents=True, exist_ok=True)

          commit = subprocess.check_output(
              ["git","-C",str(ROOT),"rev-parse","HEAD"], text=True
          ).strip()

          target = ROOT / "BT_Audio_APP/bt_audio_app_src/device/flash_boot.c"
          if not target.exists():
              raise SystemExit(f"missing target source: {target}")

          text = target.read_text(errors="replace")
          lines = text.splitlines()

          # Locate flash_data declaration and parse exact bytes.
          arr_rx = re.compile(
              r"(?:static\s+|const\s+|unsigned\s+|signed\s+)*"
              r"(?:char|uint8_t|uint8|u8|BYTE)\s+"
              r"(flash_data)\s*\[\s*([^\]]*)\s*\]\s*=\s*\{(?P<body>.*?)\};",
              re.I | re.S
          )
          m = arr_rx.search(text)
          if not m:
              raise SystemExit("flash_data array declaration not found")

          declared = m.group(2).strip()
          vals = [int(x,16) for x in re.findall(r"0x([0-9A-Fa-f]{1,2})", m.group("body"))]
          raw = bytes(vals)
          if len(raw) < 60000:
              raise SystemExit(f"unexpected flash_data length: {len(raw)}")

          bin_path = OUT / "flash_data.bin"
          bin_path.write_bytes(raw)
          sha = hashlib.sha256(raw).hexdigest()

          decl_line = text.count("\n",0,m.start()) + 1

          # All direct references to flash_data excluding declaration.
          refs=[]
          for i,line in enumerate(lines,1):
              if "flash_data" in line and not (decl_line <= i <= text.count("\n",0,m.end())+1):
                  refs.append({"line":i,"text":line.strip()[:1200]})

          # Context around every reference and around start_up_grate.
          contexts=[]
          needles=["flash_data","start_up_grate","AppResourceUsbDevice",
                   "FlashChipErase","FlashChipWrite","FlashChipRead",
                   "0x55","0xAA","SET_REPORT","GET_REPORT"]
          for i,line in enumerate(lines,1):
              if any(n.lower() in line.lower() for n in needles):
                  lo=max(0,i-12); hi=min(len(lines),i+16)
                  contexts.append({
                      "line":i,
                      "needle_line":line.strip()[:1000],
                      "context":"\n".join(lines[lo:hi])[:9000]
                  })

          # Function parser and flash_data call/use graph in this source file.
          fn_hdr=re.compile(
              r"(?m)^[ \t]*(?:(?:static|inline|extern|const|volatile)\s+)*"
              r"(?:[A-Za-z_][\w\s\*\(\)]*?[ \t]+)?"
              r"([A-Za-z_]\w*)\s*\(([^;{}]{0,500})\)\s*\{"
          )
          funcs=[]
          for fm in fn_hdr.finditer(text):
              name=fm.group(1)
              if name in {"if","for","while","switch"}:
                  continue
              brace=text.find("{",fm.start(),fm.end()+2)
              if brace<0:
                  continue
              depth=0; end=None
              for j in range(brace,len(text)):
                  c=text[j]
                  if c=="{": depth+=1
                  elif c=="}":
                      depth-=1
                      if depth==0:
                          end=j+1; break
              if end is None:
                  continue
              body=text[fm.start():end]
              funcs.append({
                  "name":name,
                  "line":text.count("\n",0,fm.start())+1,
                  "uses_flash_data":"flash_data" in body,
                  "mentions_upgrade":bool(re.search(r"upgrade|grate|boot|flash",body,re.I)),
                  "body":body[:12000],
              })

          # Search the whole SDK for flash_data symbol and same SHA/size arrays.
          whole_refs=[]
          duplicate_arrays=[]
          array_rx=re.compile(
              r"(?:static\s+|const\s+|unsigned\s+|signed\s+)*"
              r"(?:char|uint8_t|uint8|u8|BYTE)\s+"
              r"([A-Za-z_]\w*)\s*\[\s*([^\]]*)\s*\]\s*=\s*\{(?P<body>.*?)\};",
              re.I | re.S
          )
          for p in ROOT.rglob("*"):
              if not p.is_file() or ".git" in p.parts or p.stat().st_size > 5_000_000:
                  continue
              try:
                  t=p.read_text(errors="replace")
              except Exception:
                  continue
              rel=str(p.relative_to(ROOT))
              if "flash_data" in t:
                  whole_refs.append(rel)
              if p.suffix.lower() not in {".c",".h",".cpp",".hpp"}:
                  continue
              for am in array_rx.finditer(t):
                  hv=re.findall(r"0x([0-9A-Fa-f]{1,2})",am.group("body"))
                  if len(hv) < 60000:
                      continue
                  b=bytes(int(x,16) for x in hv)
                  duplicate_arrays.append({
                      "file":rel,
                      "name":am.group(1),
                      "declared":am.group(2).strip(),
                      "len":len(b),
                      "sha256":hashlib.sha256(b).hexdigest(),
                      "same_as_flash_data":hashlib.sha256(b).hexdigest()==sha,
                  })

          # Binary structural diagnostics.
          def entropy(data):
              if not data: return 0.0
              cnt=collections.Counter(data)
              e=0.0
              for n in cnt.values():
                  q=n/len(data); e-=q*math.log2(q)
              return e

          # Examine first/last pages and 4-byte word distribution.
          first256=raw[:256]
          last256=raw[-256:]
          words=[int.from_bytes(raw[i:i+4],"little") for i in range(0,len(raw)-3,4)]
          word_counts=collections.Counter(words)
          common_words=[{"word":f"0x{k:08X}","count":v} for k,v in word_counts.most_common(30)]

          # Search for ASCII strings in embedded binary itself.
          ascii_strings=[]
          start=None
          for i,b in enumerate(raw+b"\x00"):
              if 32 <= b <= 126:
                  if start is None: start=i
              else:
                  if start is not None and i-start>=4:
                      s=raw[start:i].decode("ascii",errors="replace")
                      ascii_strings.append({"offset":start,"text":s[:500]})
                  start=None

          # High-value strings only.
          hv_strings=[x for x in ascii_strings if re.search(
              r"flash|boot|usb|hid|upgrade|upgrata|chip|erase|write|read|crc|version|error|ok",
              x["text"],re.I
          )]

          # Descriptor scan only inside exact flash_data.
          usb_desc=[]
          for off in range(0,max(0,len(raw)-18)):
              if raw[off]==0x12 and raw[off+1]==0x01:
                  bcd=int.from_bytes(raw[off+2:off+4],"little")
                  mps=raw[off+7]
                  vid=int.from_bytes(raw[off+8:off+10],"little")
                  pid=int.from_bytes(raw[off+10:off+12],"little")
                  # Keep all plausible descriptor-shaped structures, not only common bcdUSB.
                  if mps in (8,16,32,64):
                      usb_desc.append({
                          "offset":off,"bcdUSB":f"0x{bcd:04X}",
                          "vid":f"0x{vid:04X}","pid":f"0x{pid:04X}",
                          "ep0":mps,"raw18":raw[off:off+18].hex(" ")
                      })

          # Search for report descriptor signatures.
          marker_patterns={
              "UsagePageVendorFF00":bytes.fromhex("06 00 FF"),
              "Usage55":bytes.fromhex("09 55"),
              "UsageAA":bytes.fromhex("09 AA"),
              "ReportCount255":bytes.fromhex("26 FF 00"),
              "A5_5A":bytes.fromhex("A5 5A"),
              "55_AA":bytes.fromhex("55 AA"),
              "5A_FF":bytes.fromhex("5A FF"),
          }
          markers=[]
          for name,pat in marker_patterns.items():
              pos=0; n=0
              while True:
                  off=raw.find(pat,pos)
                  if off<0: break
                  markers.append({
                      "name":name,"offset":off,
                      "context":raw[max(0,off-24):min(len(raw),off+96)].hex(" ")
                  })
                  pos=off+1; n+=1
                  if n>=100: break

          # Compare source-defined length with 64 KiB.
          gap_64k=65536-len(raw)

          # Try host objdump only as a diagnostic; never execute vendor code.
          objdump_info=""
          try:
              objdump_info=subprocess.check_output(
                  ["objdump","-i"],text=True,stderr=subprocess.STDOUT
              )[:20000]
          except Exception as e:
              objdump_info=str(e)
          (OUT/"HOST_OBJDUMP_TARGETS.txt").write_text(objdump_info)

          # Copy exact source for artifact review.
          shutil.copy2(target, OUT/"flash_boot.c")

          decision={
              "revision":"FLASH_DATA_DEEP_V1",
              "sdk_commit":commit,
              "source_file":str(target.relative_to(ROOT)),
              "flash_data_decl_line":decl_line,
              "flash_data_declared_expr":declared,
              "flash_data_len":len(raw),
              "flash_data_gap_to_65536":gap_64k,
              "flash_data_sha256":sha,
              "flash_data_entropy":round(entropy(raw),5),
              "flash_data_first256":first256.hex(" "),
              "flash_data_last256":last256.hex(" "),
              "flash_data_refs":refs,
              "source_contexts":contexts[:200],
              "functions":funcs,
              "whole_sdk_flash_data_symbol_files":whole_refs,
              "large_array_candidates":duplicate_arrays,
              "common_u32_words":common_words,
              "high_value_ascii_strings":hv_strings[:300],
              "usb_descriptor_candidates":usb_desc[:300],
              "marker_candidates":markers[:700],
              "EXACT_FLASH_DATA_EXTRACTED":True,
              "FLASH_DATA_NEAR_64K":60000 <= len(raw) <= 65536,
              "FLASH_DATA_EXACTLY_65532":len(raw)==65532,
              "FLASH_DATA_REFERENCE_FOUND":bool(refs),
              "USB_DESCRIPTOR_INSIDE_FLASH_DATA_PROVEN":bool(usb_desc),
              "PRODUCTION_RECOVERY_USB_IDENTITY_PROVEN":False,
              "FLASHBOOT_WIRE_PROTOCOL_PROVEN":False,
              "LIVE_BOOT_ENTRY_AUTHORIZED":False,
              "LIVE_FLASH_AUTHORIZED":False,
              "USB_OR_BOARD_CONTACTED":False,
              "FLASH_ALLOWED":False,
          }
          (OUT/"FLASH_DATA_DECISION.json").write_text(
              json.dumps(decision,indent=2,ensure_ascii=False)+"\n"
          )

          # Human summary with only high-signal results.
          md=[
              "# BP1048P4 flash_data deep extraction",
              "",
              f"SDK commit: `{commit}`",
              f"Source: `{decision['source_file']}`",
              "",
              "## Exact flash_data",
              f"- declaration line: **{decl_line}**",
              f"- declared expression: `{declared}`",
              f"- parsed length: **{len(raw)} bytes**",
              f"- gap to 64 KiB: **{gap_64k} bytes**",
              f"- SHA256: `{sha}`",
              f"- entropy: `{decision['flash_data_entropy']}`",
              "",
              "## Direct source references",
          ]
          if refs:
              for x in refs[:30]:
                  md.append(f"- line {x['line']}: `{x['text']}`")
          else:
              md.append("- none outside declaration")

          md += ["","## Functions in flash_boot.c that use flash_data"]
          used=[x for x in funcs if x["uses_flash_data"]]
          if used:
              for x in used[:30]:
                  md.append(f"- `{x['name']}()` at line {x['line']}")
          else:
              md.append("- none parsed")

          md += ["","## USB descriptors inside exact flash_data"]
          if usb_desc:
              for x in usb_desc[:20]:
                  md.append(
                      f"- offset `0x{x['offset']:X}` VID `{x['vid']}` PID `{x['pid']}` "
                      f"bcdUSB `{x['bcdUSB']}` EP0 `{x['ep0']}`"
                  )
          else:
              md.append("- no plausible standard USB device descriptor parsed")

          md += ["","## High-value ASCII strings inside exact flash_data"]
          if hv_strings:
              for x in hv_strings[:40]:
                  md.append(f"- `0x{x['offset']:X}` — `{x['text']}`")
          else:
              md.append("- none")

          md += ["","## Marker counts"]
          mc=collections.Counter(x["name"] for x in markers)
          for k,v in sorted(mc.items()):
              md.append(f"- {k}: {v}")

          md += [
              "",
              "## Decision",
              "- This run isolates the exact embedded `flash_data`; unrelated app/tool false positives are excluded.",
              "- No live packet is authorized from these results.",
              "- USB/board contacted: **NO**",
              "- Flash read/erase/write: **NO**",
              "- `FLASH_ALLOWED=NO`",
          ]
          (OUT/"FLASH_DATA_SUMMARY.md").write_text("\n".join(md)+"\n")
          print("\n".join(md))
          PYCODE

      - name: Publish deep summary
        shell: bash
        run: |
          set -euo pipefail
          cat /tmp/fd/evidence/FLASH_DATA_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Package evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/fd/evidence
          zip -9 -r /tmp/OKN_BP1048P4_FLASH_DATA_DEEP_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/OKN_BP1048P4_FLASH_DATA_DEEP_EVIDENCE.zip \
            > /tmp/OKN_BP1048P4_FLASH_DATA_DEEP_EVIDENCE.zip.sha256

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: OKN-BP1048P4-FLASH-DATA-DEEP-EVIDENCE
          path: |
            /tmp/OKN_BP1048P4_FLASH_DATA_DEEP_EVIDENCE.zip
            /tmp/OKN_BP1048P4_FLASH_DATA_DEEP_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          grep -F '"EXACT_FLASH_DATA_EXTRACTED": true' \
            /tmp/fd/evidence/FLASH_DATA_DECISION.json
          grep -F '"USB_OR_BOARD_CONTACTED": false' \
            /tmp/fd/evidence/FLASH_DATA_DECISION.json
          grep -F '"LIVE_FLASH_AUTHORIZED": false' \
            /tmp/fd/evidence/FLASH_DATA_DECISION.json
          grep -F '"FLASH_ALLOWED": false' \
            /tmp/fd/evidence/FLASH_DATA_DECISION.json
          echo FLASH_DATA_DEEP_EXTRACTION_COMPLETE=YES
          echo FLASH_ALLOWED=NO
