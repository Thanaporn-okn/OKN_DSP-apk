name: Build OKN DSP New UI

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.9'
  ANDROID_PLATFORM: 'android-35'
  ANDROID_BUILD_TOOLS: '35.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Restore Android source
        shell: bash
        run: |
          set -euo pipefail
          SRC_DIR="$RUNNER_TEMP/okn-dsp-newui-src"
          rm -rf "$SRC_DIR"
          mkdir -p "$SRC_DIR"
          unzip -q "$GITHUB_WORKSPACE/OKN_DSP_NewUI_alpha01_Source.zip" -d "$SRC_DIR"
          test -f "$SRC_DIR/settings.gradle"
          test -f "$SRC_DIR/build.gradle"
          test -f "$SRC_DIR/app/build.gradle"
          echo "SRC_DIR=$SRC_DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build debug APK
        shell: bash
        run: gradle -p "$SRC_DIR" --no-daemon --stacktrace :app:assembleDebug

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$SRC_DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/out/OKN_DSP_NewUI-debug.apk"
          cd "$GITHUB_WORKSPACE/out"
          sha256sum OKN_DSP_NewUI-debug.apk > SHA256.txt

      - uses: actions/upload-artifact@v7
        with:
          name: OKN_DSP_NewUI
          path: out/*
          if-no-files-found: error
