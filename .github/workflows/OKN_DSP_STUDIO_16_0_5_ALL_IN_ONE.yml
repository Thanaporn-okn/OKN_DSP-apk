name: OKN DSP Studio 16.0.5 - Single File Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/OKN_DSP_STUDIO_16_0.yml'

permissions:
  contents: read

concurrency:
  group: okn-dsp-studio-1605-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Extract embedded source and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout single-file workflow
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract embedded OKN DSP Studio source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app Sources build.gradle settings.gradle gradle.properties CROSSOVER_HARDWARE_IMPLEMENTATION.md BUILD_APK_TH.md payload.tar.gz payload.tar.gz.b64
