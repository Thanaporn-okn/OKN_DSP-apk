      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate source and protocol safety checks
        shell: bash
        run: |
          set -euo pipefail
          python3 Sources/validate_studio.py

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk OKN_DSP_Studio_16_0_5-debug.apk

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging OKN_DSP_Studio_16_0_5-debug.apk | tee OKN_DSP_Studio_16_0_5-apk-badging.txt
          grep -q "package: name='com.okn.dspstudio' versionCode='16005' versionName='16.0.5'" OKN_DSP_Studio_16_0_5-apk-badging.txt

      - name: Package embedded source and checksums
        shell: bash
        run: |
          set -euo pipefail
          zip -qr OKN_DSP_Studio_16_0_5-source.zip app Sources build.gradle settings.gradle gradle.properties CROSSOVER_HARDWARE_IMPLEMENTATION.md BUILD_APK_TH.md -x '*/build/*' -x '.gradle/*'
          sha256sum OKN_DSP_Studio_16_0_5-debug.apk OKN_DSP_Studio_16_0_5-source.zip OKN_DSP_Studio_16_0_5-apk-badging.txt > OKN_DSP_Studio_16_0_5-SHA256SUMS.txt
          cat OKN_DSP_Studio_16_0_5-SHA256SUMS.txt

      - name: Upload APK and source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-Studio-16.0.5
          path: |
            OKN_DSP_Studio_16_0_5-debug.apk
            OKN_DSP_Studio_16_0_5-source.zip
            OKN_DSP_Studio_16_0_5-apk-badging.txt
            OKN_DSP_Studio_16_0_5-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
