name: Build BP1048P4 USB Probe App

on:
  workflow_dispatch:
    inputs:
      run_usb_probe:
        description: "Run read-only USB probe on a self-hosted Linux runner connected to the real board"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-android-app:
    name: Build Android USB Probe APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Avoid the common "SDK package licenses not accepted" failure.
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # This workflow intentionally creates a READ-ONLY first-stage app.
      # It enumerates USB descriptors/endpoints but does NOT erase, write,
      # unlock, flash, or send undocumented firmware commands.
      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/com/okn/bp1048probe

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BP1048UsbProbe"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.okn.bp1048probe'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.okn.bp1048probe'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '0.1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature
                  android:name="android.hardware.usb.host"
                  android:required="true" />

              <application
                  android:allowBackup="false"
                  android:label="BP1048 USB Probe"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/okn/bp1048probe/MainActivity.java <<'EOF'
          package com.okn.bp1048probe;

          import android.app.Activity;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.hardware.usb.UsbConstants;
          import android.hardware.usb.UsbDevice;
          import android.hardware.usb.UsbDeviceConnection;
          import android.hardware.usb.UsbEndpoint;
          import android.hardware.usb.UsbInterface;
          import android.hardware.usb.UsbManager;
          import android.os.Bundle;
          import android.text.method.ScrollingMovementMethod;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.Locale;
          import java.util.Map;

          public class MainActivity extends Activity {
              private static final String ACTION_USB_PERMISSION =
                      "com.okn.bp1048probe.USB_PERMISSION";

              private UsbManager usbManager;
              private TextView output;
              private UsbDevice pendingDevice;

              private final BroadcastReceiver usbReceiver = new BroadcastReceiver() {
                  @Override
                  public void onReceive(Context context, Intent intent) {
                      if (!ACTION_USB_PERMISSION.equals(intent.getAction())) return;

                      UsbDevice device = intent.getParcelableExtra(UsbManager.EXTRA_DEVICE);
                      boolean granted = intent.getBooleanExtra(
                              UsbManager.EXTRA_PERMISSION_GRANTED, false);

                      if (granted && device != null) {
                          append("\n[permission granted]\n");
                          append(fullReport(device, true));
                      } else {
                          append("\n[permission denied]\n");
                      }
                      pendingDevice = null;
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  usbManager = (UsbManager) getSystemService(Context.USB_SERVICE);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(24, 24, 24, 24);

                  TextView title = new TextView(this);
                  title.setText("BP1048P4 USB Probe — READ ONLY");
                  title.setTextSize(20f);
                  root.addView(title);

                  TextView note = new TextView(this);
                  note.setText(
                          "ขั้นแรก: เสียบโทรศัพท์ Android แบบ USB-OTG เข้าพอร์ต USB-C ของบอร์ด แล้วกด Scan USB\\n" +
                          "แอปนี้อ่านเฉพาะ descriptor / interface / endpoint และ raw descriptor เท่านั้น ไม่เขียน Flash");
                  note.setPadding(0, 12, 0, 12);
                  root.addView(note);

                  Button scan = new Button(this);
                  scan.setText("SCAN USB");
                  root.addView(scan);

                  Button permission = new Button(this);
                  permission.setText("REQUEST USB PERMISSION + RAW DESCRIPTOR");
                  root.addView(permission);

                  Button copy = new Button(this);
                  copy.setText("COPY REPORT");
                  root.addView(copy);

                  output = new TextView(this);
                  output.setTextIsSelectable(true);
                  output.setMovementMethod(new ScrollingMovementMethod());
                  output.setText("Ready.\\n");

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(output);
                  root.addView(scroll, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f));

                  setContentView(root);

                  IntentFilter filter = new IntentFilter(ACTION_USB_PERMISSION);
                  registerReceiver(usbReceiver, filter, Context.RECEIVER_NOT_EXPORTED);

                  scan.setOnClickListener(v -> scanUsb());
                  permission.setOnClickListener(v -> requestPermissionForFirstDevice());
                  copy.setOnClickListener(v -> copyReport());
              }

              private void scanUsb() {
                  output.setText("");
                  Map<String, UsbDevice> devices = usbManager.getDeviceList();

                  append("USB devices: " + devices.size() + "\n\n");
                  if (devices.isEmpty()) {
                      append("ไม่พบ USB device\n");
                      append("ตรวจสาย USB-C/OTG, ไฟเลี้ยงบอร์ด และลองสลับสายที่รองรับ DATA\n");
                      return;
                  }

                  for (UsbDevice device : devices.values()) {
                      append(fullReport(device, false));
                      append("\n----------------------------------------\n");
                  }
              }

              private void requestPermissionForFirstDevice() {
                  Map<String, UsbDevice> devices = usbManager.getDeviceList();
                  if (devices.isEmpty()) {
                      Toast.makeText(this, "ไม่พบ USB device", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  UsbDevice device = devices.values().iterator().next();
                  pendingDevice = device;

                  if (usbManager.hasPermission(device)) {
                      append("\n[permission already granted]\n");
                      append(fullReport(device, true));
                      return;
                  }

                  PendingIntent pi = PendingIntent.getBroadcast(
                          this,
                          0,
                          new Intent(ACTION_USB_PERMISSION),
                          PendingIntent.FLAG_MUTABLE);
                  usbManager.requestPermission(device, pi);
              }

              private String fullReport(UsbDevice d, boolean includeRaw) {
                  StringBuilder s = new StringBuilder();

                  s.append("DeviceName: ").append(d.getDeviceName()).append('\n');
                  s.append(String.format(Locale.US,
                          "VID:PID = %04X:%04X%n", d.getVendorId(), d.getProductId()));
                  s.append("DeviceClass/Subclass/Protocol = ")
                          .append(d.getDeviceClass()).append("/")
                          .append(d.getDeviceSubclass()).append("/")
                          .append(d.getDeviceProtocol()).append('\n');
                  s.append("ConfigCount: ").append(d.getConfigurationCount()).append('\n');
                  s.append("InterfaceCount: ").append(d.getInterfaceCount()).append('\n');

                  if (android.os.Build.VERSION.SDK_INT >= 23) {
                      s.append("Version: ").append(d.getVersion()).append('\n');
                      s.append("Manufacturer: ").append(safe(d.getManufacturerName())).append('\n');
                      s.append("Product: ").append(safe(d.getProductName())).append('\n');
                  }

                  for (int i = 0; i < d.getInterfaceCount(); i++) {
                      UsbInterface intf = d.getInterface(i);
                      s.append("\nInterface ").append(i)
                              .append(" id=").append(intf.getId())
                              .append(" class=").append(intf.getInterfaceClass())
                              .append(" subclass=").append(intf.getInterfaceSubclass())
                              .append(" protocol=").append(intf.getInterfaceProtocol())
                              .append(" endpoints=").append(intf.getEndpointCount())
                              .append('\n');

                      for (int e = 0; e < intf.getEndpointCount(); e++) {
                          UsbEndpoint ep = intf.getEndpoint(e);
                          s.append("  EP").append(e)
                                  .append(" addr=0x")
                                  .append(String.format(Locale.US, "%02X", ep.getAddress()))
                                  .append(" dir=")
                                  .append(ep.getDirection() == UsbConstants.USB_DIR_IN ? "IN" : "OUT")
                                  .append(" type=").append(endpointType(ep.getType()))
                                  .append(" maxPacket=").append(ep.getMaxPacketSize())
                                  .append(" interval=").append(ep.getInterval())
                                  .append('\n');
                      }
                  }

                  if (includeRaw) {
                      if (!usbManager.hasPermission(d)) {
                          s.append("\nRaw descriptor: permission required\n");
                      } else {
                          UsbDeviceConnection c = usbManager.openDevice(d);
                          if (c == null) {
                              s.append("\nRaw descriptor: openDevice failed\n");
                          } else {
                              try {
                                  byte[] raw = c.getRawDescriptors();
                                  s.append("\nRaw descriptor (hex):\n");
                                  s.append(hex(raw)).append('\n');
                              } finally {
                                  c.close();
                              }
                          }
                      }
                  }

                  s.append("\nInterpretation hint:\n");
                  s.append("  class 01 = USB Audio\n");
                  s.append("  class 02 = CDC/serial control\n");
                  s.append("  class 03 = HID\n");
                  s.append("  class 08 = Mass Storage\n");
                  s.append("  class FF = vendor-specific (ต้องรู้ protocol ก่อนส่งคำสั่ง)\n");

                  return s.toString();
              }

              private static String endpointType(int type) {
                  switch (type) {
                      case UsbConstants.USB_ENDPOINT_XFER_CONTROL: return "CONTROL";
                      case UsbConstants.USB_ENDPOINT_XFER_ISOC: return "ISO";
                      case UsbConstants.USB_ENDPOINT_XFER_BULK: return "BULK";
                      case UsbConstants.USB_ENDPOINT_XFER_INT: return "INTERRUPT";
                      default: return "UNKNOWN(" + type + ")";
                  }
              }

              private static String safe(String value) {
                  return value == null ? "(null)" : value;
              }

              private static String hex(byte[] data) {
                  if (data == null) return "(null)";
                  StringBuilder b = new StringBuilder();
                  for (int i = 0; i < data.length; i++) {
                      if (i > 0 && i % 16 == 0) b.append('\n');
                      b.append(String.format(Locale.US, "%02X ", data[i] & 0xFF));
                  }
                  return b.toString();
              }

              private void append(String text) {
                  output.append(text);
              }

              private void copyReport() {
                  ClipboardManager cm =
                          (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                  cm.setPrimaryClip(ClipData.newPlainText("BP1048 USB report", output.getText()));
                  Toast.makeText(this, "คัดลอกรายงานแล้ว", Toast.LENGTH_SHORT).show();
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  unregisterReceiver(usbReceiver);
              }
          }
          EOF

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/BP1048-USB-Probe-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BP1048-USB-Probe-APK
          path: dist/BP1048-USB-Probe-debug.apk
          if-no-files-found: error
          retention-days: 30

  # GitHub-hosted runners cannot see a USB board plugged into your own PC.
  # Enable this only after installing a GitHub self-hosted Linux runner
  # on the PC physically connected to the BP1048P4 board.
  usb-readonly-probe:
    name: Probe real BP1048P4 board via USB
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_usb_probe == true }}
    runs-on:
      - self-hosted
      - linux
    timeout-minutes: 10

    steps:
      - name: Capture USB information (read-only)
        shell: bash
        run: |
          set -u
          mkdir -p usb-report

          {
            echo "=== date ==="
            date -Is
            echo
            echo "=== uname ==="
            uname -a
            echo
            echo "=== lsusb ==="
            lsusb 2>&1 || true
            echo
            echo "=== usb-devices ==="
            usb-devices 2>&1 || true
            echo
            echo "=== serial devices ==="
            ls -l /dev/ttyACM* /dev/ttyUSB* 2>&1 || true
            echo
            echo "=== block devices ==="
            lsblk -o NAME,MODEL,VENDOR,SERIAL,TRAN,FSTYPE,SIZE,MOUNTPOINTS 2>&1 || true
            echo
            echo "=== recent kernel USB log ==="
            dmesg 2>&1 | tail -n 250 || true
          } | tee usb-report/usb-summary.txt

          if command -v lsusb >/dev/null 2>&1; then
            lsusb -v > usb-report/lsusb-verbose.txt 2>&1 || true
          fi

      - name: Upload USB report
        uses: actions/upload-artifact@v4
        with:
          name: BP1048-real-board-usb-report
          path: usb-report/
          if-no-files-found: error
          retention-days: 30
