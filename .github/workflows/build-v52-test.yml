      - name: Safety invariants
        shell: bash
        run: |
          set -euo pipefail
          cd "$SRC_DIR"
          grep -Fq "applicationId 'com.okn.dsp.v52test'" app/build.gradle
          grep -Fq "versionName '52.0.0-test'" app/build.gradle
          grep -Fq 'android:label="OKN DSP V52 Test"' app/src/main/AndroidManifest.xml
          grep -Fq 'void startReadOnlyDiscoveryScan()' app/src/main/java/com/okn/dsp/BleManager.java
          grep -Fq 'DISCOVERY START • READ ONLY UFE 0x58 • ID0..63' app/src/main/java/com/okn/dsp/BleManager.java
          grep -Fq 'WRITE GATE • normal scalar/EQ/CH writes BLOCKED' app/src/main/java/com/okn/dsp/BleManager.java
          grep -Fq 'DISCOVERY END • responses=' app/src/main/java/com/okn/dsp/BleManager.java
          grep -Fq 'SCAN ID 0–63' app/src/main/java/com/okn/dsp/DspView.java
          grep -Fq 'copyTransportLogToClipboard()' app/src/main/java/com/okn/dsp/DspView.java
          awk '/void startReadOnlyDiscoveryScan\(\)/,/\/\*\* V50 user-triggered/' app/src/main/java/com/okn/dsp/BleManager.java > "$RUNNER_TEMP/v52-discovery.txt"
          if grep -E 'encodeWrite|encodeFloatWrite|setChannelGainExperimental|CMD_WRITE_ACTUATOR' "$RUNNER_TEMP/v52-discovery.txt"; then
            echo 'Unsafe write reference found inside V52 discovery block' >&2
            exit 1
          fi
          grep -Fq 'if (discoveryScanActive) return;' app/src/main/java/com/okn/dsp/BleManager.java
          if grep -R -nE 'UsbManager|UsbDevice|usb[.]host|FLASH_ERASE_WRITE|firmware flash' app/src/main/java app/src/main/AndroidManifest.xml; then exit 1; fi
          echo V52_DISCOVERY_READ_ONLY_STATIC_GATE_PASS

      - name: Protocol self-test
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/protocol-test"; mkdir -p "$T"
          javac -d "$T" "$SRC_DIR"/app/src/main/java/com/okn/dsp/protocol/*.java
          cat > "$T/RunSelfTest.java" <<'JAVA_EOF'
          import com.okn.dsp.protocol.ProtocolSelfTest;
          public final class RunSelfTest { public static void main(String[] args) { ProtocolSelfTest.runOrThrow(); System.out.println("PROTOCOL_SELFTEST_PASS"); } }
          JAVA_EOF
          javac -cp "$T" -d "$T" "$T/RunSelfTest.java"
          java -cp "$T" RunSelfTest

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n1)"; fi
          "$SDKMANAGER" "platforms;$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/v52-gradle.log"
          for attempt in 1 2 3; do
            set +e
            gradle -p "$SRC_DIR" --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee "$LOG"
            rc=${PIPESTATUS[0]}; set -e
            [[ "$rc" -eq 0 ]] && exit 0
            if [[ "$attempt" -lt 3 ]] && grep -Eqi '429|Too Many Requests|HTTP 5[0-9][0-9]|timed out|Connection reset' "$LOG"; then sleep $((attempt*20)); else exit "$rc"; fi
          done

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$SRC_DIR/app/build/outputs/apk/debug/app-debug.apk"; test -s "$APK"
          cp "$APK" dist/OKN_DSP_V52_52.0.0-test-debug.apk
          sha256sum dist/OKN_DSP_V52_52.0.0-test-debug.apk > dist/OKN_DSP_V52_52.0.0-test-debug.apk.sha256
          cat > dist/TEST_SCOPE.txt <<'TXT'
          OKN DSP V52 Read-Only Discovery trial build
          BLE only: AB00 service / AB01 TX / AB02 RX.
          SCAN ID 0-63 sends only verified UFE 0x58 read requests with length 4.
          During discovery, normal scalar/EQ/CH writers and persistent Save are blocked.
          Discovery log records timestamped TX plaintext/ciphertext and RX ciphertext/plaintext plus decoded 0x60 responses.
