name: R70 BP1048P4 PCTOOL USB descriptor and command xref static reverse

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R70_BP1048P4_PCTOOL_USB_DESCRIPTOR_COMMAND_XREF_STATIC_REVERSE.yml"

permissions:
  contents: read

concurrency:
  group: r70-bp1048p4-pctool-usb-reverse-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_REPO: https://github.com/leadercxn/bp1048_sdk_v0.1.12.git
  SDK_COMMIT: 8105bd864b04995d81c9f9ae77cb158259f39015
  ANDES_REPO: https://github.com/Ai-Thinker-Open/Andestech.git
  ANDES_COMMIT: eb189accd6dc601a93272f714e0f959d597ead66
  FLASH_BOOT_C: BT_Audio_APP/bt_audio_app_src/device/flash_boot.c
  FLASH_BOOT_H: BT_Audio_APP/bt_audio_app_src/inc/flash_boot.h
  EXPECTED_FLASHBOOT_SHA256: 6b632435152478ecd6a8c3697b044caf253630f70923b27c8cbe8baa509148a6

jobs:
  static-reverse:
    name: PCTOOL USB descriptor command reverse / STATIC ONLY / NO FLASH
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install host prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git gcc python3 file binutils libc6-i386 lib32z1

      - name: Fetch pinned SDK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/bp1048_r70
          git init -q /tmp/bp1048_r70
          cd /tmp/bp1048_r70
          git remote add origin "$SDK_REPO"
          git fetch -q --depth=1 origin "$SDK_COMMIT"
          git checkout -q --detach FETCH_HEAD

          test "$(git rev-parse HEAD)" = "$SDK_COMMIT"
          test -s "$FLASH_BOOT_C"
          test -s "$FLASH_BOOT_H"

          echo "R70_SDK_COMMIT=$(git rev-parse HEAD)" \
            | tee /tmp/R70_SDK_STATE.txt

      - name: Fetch pinned Andes NDS32 objdump
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/andes_r70
          git init -q /tmp/andes_r70
          cd /tmp/andes_r70
          git remote add origin "$ANDES_REPO"
          git config core.sparseCheckout true
          mkdir -p .git/info
          cat > .git/info/sparse-checkout <<'EOF'
          /BSPv422/toolchains/nds32le-elf-mculib-v3s/
          EOF
          git fetch -q --depth=1 origin "$ANDES_COMMIT"
          git checkout -q --detach FETCH_HEAD

          test "$(git rev-parse HEAD)" = "$ANDES_COMMIT"

          TOOLROOT=/tmp/andes_r70/BSPv422/toolchains/nds32le-elf-mculib-v3s
          OBJDUMP="$TOOLROOT/bin/nds32le-elf-objdump"
          test -x "$OBJDUMP"

          "$OBJDUMP" --version | head -n 2 \
            | tee /tmp/R70_NDS32_OBJDUMP_VERSION.txt
          "$OBJDUMP" -i \
            > /tmp/R70_NDS32_OBJDUMP_TARGETS.txt

          grep -Eai 'nds32|binary' /tmp/R70_NDS32_OBJDUMP_TARGETS.txt \
            | head -n 100

          {
            echo "R70_ANDES_COMMIT=$(git rev-parse HEAD)"
            echo "R70_NDS32_OBJDUMP=$OBJDUMP"
          } | tee /tmp/R70_ANDES_STATE.txt

      - name: Extract exact embedded 64KiB flashboot blob
        id: blob_extract
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/bp1048_r70
          SRC="$ROOT/$FLASH_BOOT_C"

          find "$ROOT" -type d -print0 |
          while IFS= read -r -d '' d; do
            printf -- '-I%s\n' "$d"
          done > /tmp/R70_INCLUDE_DIRS.rsp

          gcc -E -P \
            @/tmp/R70_INCLUDE_DIRS.rsp \
            -DFUNC_OS_EN=1 \
            -DCFG_APP_CONFIG \
            -DHAVE_CONFIG_H \
            "$SRC" > /tmp/R70_FLASH_BOOT_PREPROCESSED.c

          python3 - <<'PY'
          from pathlib import Path
          import ast
          import re

          text = Path("/tmp/R70_FLASH_BOOT_PREPROCESSED.c").read_text(
              encoding="latin-1", errors="replace"
          )

          m = re.search(
              r"const\s+unsigned\s+char\s+flash_data\s*\[\s*65536\s*\]\s*=\s*\{(.*?)\}\s*;",
              text,
              re.S,
          )
          if not m:
              raise SystemExit("flash_data[65536] initializer not found")

          body = m.group(1)

          toks=[]
          cur=[]
          depth=0
          for ch in body:
              if ch == '(':
                  depth += 1
              elif ch == ')':
                  depth -= 1
              if ch == ',' and depth == 0:
                  t=''.join(cur).strip()
                  if t:
                      toks.append(t)
                  cur=[]
              else:
                  cur.append(ch)
          tail=''.join(cur).strip()
          if tail:
              toks.append(tail)

          def safe_eval(expr):
              expr = re.sub(r'(?<=\d)[uUlL]+\b', '', expr)
              node = ast.parse(expr, mode="eval")
              allowed = (
                  ast.Expression, ast.Constant, ast.BinOp, ast.UnaryOp,
                  ast.Add, ast.Sub, ast.Mult, ast.FloorDiv, ast.Mod,
                  ast.LShift, ast.RShift, ast.BitOr, ast.BitAnd, ast.BitXor,
                  ast.UAdd, ast.USub, ast.Invert,
              )
              for n in ast.walk(node):
                  if not isinstance(n, allowed):
                      raise ValueError(
                          f"unsupported node {type(n).__name__} in {expr!r}"
                      )
              return int(eval(
                  compile(node, "<flash_data>", "eval"),
                  {"__builtins__": {}}, {}
              ))

          vals=[]
          for i,t in enumerate(toks):
              try:
                  v=safe_eval(t)
              except Exception as e:
                  raise SystemExit(
                      f"token {i} cannot be evaluated: {t!r}: {e}"
                  )
              if not 0 <= v <= 255:
                  raise SystemExit(
                      f"token {i} is outside byte range: {t!r} -> {v}"
                  )
              vals.append(v)

          if len(vals) != 65536:
              raise SystemExit(
                  f"flashboot size mismatch: {len(vals)} != 65536"
              )

          Path("/tmp/R70_FLASHBOOT_64K.bin").write_bytes(bytes(vals))
          PY

          echo "${EXPECTED_FLASHBOOT_SHA256}  /tmp/R70_FLASHBOOT_64K.bin" \
            | sha256sum -c -

          {
            echo "R70_FLASHBOOT_BYTES=$(wc -c < /tmp/R70_FLASHBOOT_64K.bin)"
            echo "R70_FLASHBOOT_SHA256=$EXPECTED_FLASHBOOT_SHA256"
            echo "R70_FLASHBOOT_SOURCE_MATCHES_R69=YES"
          } | tee /tmp/R70_FLASHBOOT_STATE.txt

      - name: Disassemble raw flashboot as NDS32 n1h_v3m
        id: disasm
        shell: bash
        run: |
          set -euo pipefail

          TOOLROOT=/tmp/andes_r70/BSPv422/toolchains/nds32le-elf-mculib-v3s
          OBJDUMP="$TOOLROOT/bin/nds32le-elf-objdump"

          "$OBJDUMP" \
            -D \
            -b binary \
            -m n1h_v3m \
            /tmp/R70_FLASHBOOT_64K.bin \
            > /tmp/R70_FLASHBOOT_NDS32_DISASM.txt

          test -s /tmp/R70_FLASHBOOT_NDS32_DISASM.txt

          sed -n '1,80p' /tmp/R70_FLASHBOOT_NDS32_DISASM.txt

          {
            echo "R70_NDS32_RAW_DISASSEMBLY=YES"
            echo "R70_NDS32_MACHINE=n1h_v3m"
            echo "R70_DISASM_LINES=$(wc -l < /tmp/R70_FLASHBOOT_NDS32_DISASM.txt)"
          } | tee /tmp/R70_DISASM_STATE.txt

      - name: Decode USB device config interface endpoint and string descriptors
        id: usb_descriptors
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json
          import struct

          b = Path("/tmp/R70_FLASHBOOT_64K.bin").read_bytes()

          device=[]
          configs=[]
          strings=[]

          # Device descriptor candidates.
          for o in range(0, len(b)-18):
              if b[o] != 18 or b[o+1] != 1:
                  continue

              bcd_usb = b[o+2] | (b[o+3] << 8)
              maxpkt = b[o+7]
              ncfg = b[o+17]

              if maxpkt not in {8,16,32,64}:
                  continue
              if not (1 <= ncfg <= 8):
                  continue

              # Accept USB 1.x/2.x/3.x BCD-like values only.
              major = (bcd_usb >> 8) & 0xFF
              if major not in {0x01,0x02,0x03}:
                  continue

              row={
                  "offset": o,
                  "bcdUSB": f"0x{bcd_usb:04X}",
                  "class": b[o+4],
                  "subclass": b[o+5],
                  "protocol": b[o+6],
                  "max_packet0": maxpkt,
                  "vid": f"0x{b[o+8] | (b[o+9]<<8):04X}",
                  "pid": f"0x{b[o+10] | (b[o+11]<<8):04X}",
                  "bcdDevice": f"0x{b[o+12] | (b[o+13]<<8):04X}",
                  "iManufacturer": b[o+14],
                  "iProduct": b[o+15],
                  "iSerial": b[o+16],
                  "num_configs": ncfg,
              }
              device.append(row)

          # Configuration trees.
          for o in range(0, len(b)-9):
              if b[o] != 9 or b[o+1] != 2:
                  continue
              total = b[o+2] | (b[o+3] << 8)
              nif = b[o+4]
              attrs = b[o+7]
              if total < 9 or total > 2048:
                  continue
              if o + total > len(b):
                  continue
              if not (1 <= nif <= 16):
                  continue
              if not (attrs & 0x80):
                  continue

              pos=o
              end=o+total
              desc=[]
              valid=True
              while pos+2 <= end:
                  ln=b[pos]
                  tp=b[pos+1]
                  if ln < 2 or pos+ln > end:
                      valid=False
                      break
                  item={
                      "offset":pos,
                      "length":ln,
                      "type":tp,
                      "raw":b[pos:pos+ln].hex(),
                  }
                  if tp == 4 and ln >= 9:
                      item.update({
                          "kind":"interface",
                          "number":b[pos+2],
                          "alt":b[pos+3],
                          "endpoints":b[pos+4],
                          "class":b[pos+5],
                          "subclass":b[pos+6],
                          "protocol":b[pos+7],
                          "iInterface":b[pos+8],
                      })
                  elif tp == 5 and ln >= 7:
                      item.update({
                          "kind":"endpoint",
                          "address":f"0x{b[pos+2]:02X}",
                          "attributes":f"0x{b[pos+3]:02X}",
                          "max_packet":b[pos+4] | (b[pos+5]<<8),
                          "interval":b[pos+6],
                      })
                  elif tp == 0x21 and ln >= 9:
                      item["kind"]="hid"
                  desc.append(item)
                  pos += ln

              if valid and pos == end:
                  configs.append({
                      "offset":o,
                      "total_length":total,
                      "interfaces_declared":nif,
                      "value":b[o+5],
                      "iConfiguration":b[o+6],
                      "attributes":f"0x{attrs:02X}",
                      "max_power_ma":b[o+8]*2,
                      "descriptors":desc,
                  })

          # USB UTF-16LE string descriptor candidates.
          for o in range(0, len(b)-4):
              ln=b[o]
              if ln < 4 or ln > 126 or (ln % 2) != 0:
                  continue
              if b[o+1] != 3 or o+ln > len(b):
                  continue
              raw=b[o+2:o+ln]
              try:
                  txt=raw.decode("utf-16le")
              except UnicodeDecodeError:
                  continue
              printable=sum(ch.isprintable() for ch in txt)
              if not txt or printable < max(1, int(len(txt)*0.8)):
                  continue
              strings.append({
                  "offset":o,
                  "text":txt,
                  "raw":b[o:o+ln].hex(),
              })

          Path("/tmp/R70_USB_DESCRIPTOR_SCAN.json").write_text(
              json.dumps(
                  {
                      "device_descriptors":device,
                      "configurations":configs,
                      "string_descriptors":strings,
                  },
                  indent=2,
                  ensure_ascii=False,
              ) + "\n",
              encoding="utf-8",
          )

          def interface_summary(cfg):
              rows=[]
              for d in cfg["descriptors"]:
                  if d.get("kind") == "interface":
                      rows.append(
                          f"if{d['number']}/alt{d['alt']}:"
                          f"class=0x{d['class']:02X},"
                          f"sub=0x{d['subclass']:02X},"
                          f"proto=0x{d['protocol']:02X},"
                          f"eps={d['endpoints']}"
                      )
              return ";".join(rows)

          lines=[
              f"R70_USB_DEVICE_DESCRIPTOR_CANDIDATES={len(device)}",
              f"R70_USB_CONFIGURATION_CANDIDATES={len(configs)}",
              f"R70_USB_STRING_DESCRIPTOR_CANDIDATES={len(strings)}",
          ]

          for i,d in enumerate(device[:16]):
              lines.append(
                  f"R70_USB_DEVICE_{i}="
                  f"off=0x{d['offset']:04X},"
                  f"vid={d['vid']},pid={d['pid']},"
                  f"bcdUSB={d['bcdUSB']},"
                  f"class=0x{d['class']:02X},"
                  f"maxpkt0={d['max_packet0']},"
                  f"configs={d['num_configs']}"
              )

          for i,cfg in enumerate(configs[:16]):
              lines.append(
                  f"R70_USB_CONFIG_{i}="
                  f"off=0x{cfg['offset']:04X},"
                  f"total={cfg['total_length']},"
                  f"interfaces={cfg['interfaces_declared']},"
                  + interface_summary(cfg)
              )

          for i,x in enumerate(strings[:32]):
              safe=x["text"].replace("\n"," ").replace("\r"," ")
              lines.append(
                  f"R70_USB_STRING_{i}=off=0x{x['offset']:04X},text={safe}"
              )

          Path("/tmp/R70_USB_DESCRIPTOR_STATE.txt").write_text(
              "\n".join(lines)+"\n",
              encoding="utf-8",
          )

          print("\n".join(lines))
          PY

      - name: Map updater command strings and NDS32 code xrefs
        id: command_xrefs
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          blob = Path("/tmp/R70_FLASHBOOT_64K.bin").read_bytes()
          dis_lines = Path("/tmp/R70_FLASHBOOT_NDS32_DISASM.txt").read_text(
              encoding="latin-1", errors="replace"
          ).splitlines()

          commands = [
              "chiperas",
              "codedata",
              "bootdat",
              "constdat",
              "cnfgdat",
              "btupdat",
              "upinfo",
              "cxxx",
          ]

          command_offsets={}
          for cmd in commands:
              hits=[]
              start=0
              needle=cmd.encode("ascii")
              while True:
                  i=blob.find(needle,start)
                  if i < 0:
                      break
                  hits.append(i)
                  start=i+1
              command_offsets[cmd]=hits

          # Also map important USB debug strings.
          debug_needles = [
              "USB_DT_INTERFACE",
              "USB_DT_ENDPOINT",
              "cmd_cxxx :",
              "cmd_cxxx ACK",
              "FLASHBOOT CRC",
          ]
          debug_offsets={}
          for x in debug_needles:
              hits=[]
              start=0
              needle=x.encode("ascii")
              while True:
                  i=blob.find(needle,start)
                  if i < 0:
                      break
                  hits.append(i)
                  start=i+1
              debug_offsets[x]=hits

          # Find direct absolute/immediate textual references in disassembly.
          # NDS32 objdump prints targets/immediates in hex; direct matches give
          # high-confidence xrefs.  Split high/low address construction is
          # recorded separately as not yet proven.
          all_targets={}
          for label,hits in {**command_offsets, **debug_offsets}.items():
              target_rows=[]
              for off in hits:
                  pats=[
                      re.compile(rf"(?<![0-9a-f])0x{off:x}(?![0-9a-f])", re.I),
                      re.compile(rf"(?<![0-9a-f]){off:x}(?![0-9a-f])", re.I),
                  ]
                  idxs=[]
                  for i,line in enumerate(dis_lines):
                      low=line.lower()
                      if any(p.search(low) for p in pats):
                          idxs.append(i)

                  windows=[]
                  for idx in idxs[:64]:
                      a=max(0,idx-10)
                      z=min(len(dis_lines),idx+11)
                      windows.append("\n".join(dis_lines[a:z]))

                  target_rows.append({
                      "offset":off,
                      "direct_xref_count":len(idxs),
                      "line_indices":idxs[:128],
                      "windows":windows,
                  })
              all_targets[label]=target_rows

          Path("/tmp/R70_COMMAND_XREFS.json").write_text(
              json.dumps(
                  {
                      "command_offsets":command_offsets,
                      "debug_offsets":debug_offsets,
                      "xrefs":all_targets,
                  },
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          lines=[]
          direct_total=0
          for cmd in commands:
              offs=command_offsets[cmd]
              lines.append(
                  f"R70_CMD_{cmd.upper()}_OFFSETS=" +
                  (",".join(f"0x{x:04X}" for x in offs) if offs else "NONE")
              )
              xsum=sum(
                  r["direct_xref_count"]
                  for r in all_targets.get(cmd,[])
              )
              direct_total += xsum
              lines.append(
                  f"R70_CMD_{cmd.upper()}_DIRECT_XREFS={xsum}"
              )

          for name,hits in debug_offsets.items():
              key=re.sub(r"[^A-Z0-9]+","_",name.upper()).strip("_")
              lines.append(
                  f"R70_DEBUG_{key}_OFFSETS=" +
                  (",".join(f"0x{x:04X}" for x in hits) if hits else "NONE")
              )

          lines += [
              f"R70_COMMAND_DIRECT_XREFS_TOTAL={direct_total}",
              "R70_COMMAND_SPLIT_HI_LO_XREFS_FULLY_PROVEN=NO",
          ]

          Path("/tmp/R70_COMMAND_XREF_STATE.txt").write_text(
              "\n".join(lines)+"\n",
              encoding="utf-8",
          )
          print("\n".join(lines))

          with Path("/tmp/R70_COMMAND_XREF_WINDOWS.txt").open(
              "w", encoding="utf-8"
          ) as f:
              for label,rows in all_targets.items():
                  for row in rows:
                      if not row["windows"]:
                          continue
                      f.write(
                          f"\n===== {label} @ 0x{row['offset']:04X} =====\n"
                      )
                      for w in row["windows"]:
                          f.write(w+"\n---\n")
          PY

      - name: Identify likely USB descriptor tree and bootloader identity conservatively
        id: identity
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json

          o=json.loads(
              Path("/tmp/R70_USB_DESCRIPTOR_SCAN.json").read_text(
                  encoding="utf-8"
              )
          )

          dev=o["device_descriptors"]
          cfg=o["configurations"]
          strings=o["string_descriptors"]

          # Prefer device descriptors with a plausible configuration tree
          # physically nearby in the same readonly data neighborhood.
          ranked=[]
          for d in dev:
              near=[
                  c for c in cfg
                  if 0 < c["offset"]-d["offset"] <= 4096
              ]
              score=0
              if near:
                  score += 20
              if d["vid"] not in {"0x0000","0xFFFF"}:
                  score += 10
              if d["pid"] not in {"0x0000","0xFFFF"}:
                  score += 10
              if d["bcdUSB"] in {"0x0110","0x0200","0x0210"}:
                  score += 5
              ranked.append((score,d,near))

          ranked.sort(key=lambda x:(-x[0],x[1]["offset"]))

          lines=[]
          if ranked:
              score,d,near=ranked[0]
              lines += [
                  "R70_BOOTLOADER_USB_DEVICE_DESCRIPTOR_FOUND=YES",
                  f"R70_BOOTLOADER_USB_DEVICE_DESCRIPTOR_SCORE={score}",
                  f"R70_BOOTLOADER_USB_DEVICE_DESCRIPTOR_OFFSET=0x{d['offset']:04X}",
                  f"R70_BOOTLOADER_USB_VID={d['vid']}",
                  f"R70_BOOTLOADER_USB_PID={d['pid']}",
                  f"R70_BOOTLOADER_USB_BCDUSB={d['bcdUSB']}",
                  f"R70_BOOTLOADER_USB_DEVICE_CLASS=0x{d['class']:02X}",
                  f"R70_BOOTLOADER_USB_MAX_PACKET0={d['max_packet0']}",
                  f"R70_BOOTLOADER_USB_NUM_CONFIGS={d['num_configs']}",
                  "R70_BOOTLOADER_USB_IDENTITY_UNIQUE_PROVEN="
                  + ("YES" if len(ranked)==1 else "NO"),
              ]
              if near:
                  c=near[0]
                  ifaces=[
                      x for x in c["descriptors"]
                      if x.get("kind")=="interface"
                  ]
                  eps=[
                      x for x in c["descriptors"]
                      if x.get("kind")=="endpoint"
                  ]
                  lines += [
                      f"R70_NEAR_CONFIG_OFFSET=0x{c['offset']:04X}",
                      f"R70_NEAR_CONFIG_INTERFACES={len(ifaces)}",
                      f"R70_NEAR_CONFIG_ENDPOINTS={len(eps)}",
                  ]
                  for i,x in enumerate(ifaces[:16]):
                      lines.append(
                          f"R70_NEAR_IF_{i}="
                          f"num={x['number']},alt={x['alt']},"
                          f"class=0x{x['class']:02X},"
                          f"sub=0x{x['subclass']:02X},"
                          f"proto=0x{x['protocol']:02X},"
                          f"eps={x['endpoints']}"
                      )
                  for i,x in enumerate(eps[:32]):
                      lines.append(
                          f"R70_NEAR_EP_{i}="
                          f"addr={x['address']},"
                          f"attr={x['attributes']},"
                          f"maxpkt={x['max_packet']},"
                          f"interval={x['interval']}"
                      )
              else:
                  lines.append("R70_NEAR_CONFIGURATION_FOUND=NO")
          else:
              lines += [
                  "R70_BOOTLOADER_USB_DEVICE_DESCRIPTOR_FOUND=NO",
                  "R70_BOOTLOADER_USB_IDENTITY_UNIQUE_PROVEN=NO",
              ]

          # String descriptors are supporting evidence only.
          lines.append(
              "R70_BOOTLOADER_USB_STRING_DESCRIPTORS_FOUND="
              + ("YES" if strings else "NO")
          )

          # Never promote to production-safe just because a descriptor exists.
          lines += [
              "R70_PCTOOL_USB_TRANSPORT_EXACTLY_PROVEN=NO",
              "R70_PCTOOL_SAFE_READBACK_RECOVERY_PROVEN=NO",
          ]

          Path("/tmp/R70_BOOTLOADER_IDENTITY.txt").write_text(
              "\n".join(lines)+"\n",
              encoding="utf-8",
          )
          print("\n".join(lines))
          PY

      - name: Build R70 decision
        id: decision
        shell: bash
        run: |
          set -euo pipefail

          DEVICE_FOUND="$(
            grep -E '^R70_BOOTLOADER_USB_DEVICE_DESCRIPTOR_FOUND=' \
              /tmp/R70_BOOTLOADER_IDENTITY.txt | cut -d= -f2
          )"

          cat > /tmp/R70_DECISION.txt <<EOF
          R70_FLASHBOOT_NDS32_DISASSEMBLED=YES
          R70_USB_DESCRIPTOR_STATIC_SCAN_COMPLETED=YES
          R70_COMMAND_STRING_XREF_SCAN_COMPLETED=YES
          R70_BOOTLOADER_USB_DEVICE_DESCRIPTOR_FOUND=$DEVICE_FOUND

          R70_PCTOOL_USB_TRANSPORT_EXACTLY_PROVEN=NO
          R70_PCTOOL_SAFE_READBACK_RECOVERY_PROVEN=NO
          R70_PRODUCTION_FIRST_BOOTSTRAP_PROVEN=NO

          R70_VENDOR_CODE_EXECUTED=NO
          R70_BOARD_USB_ACCESSED=NO
          R70_FLASH_WRITE_EXECUTED=NO
          R70_FLASH_ERASE_EXECUTED=NO
          FLASH_ALLOWED=NO
          EOF

          cat /tmp/R70_DECISION.txt

      - name: Remove extracted flashboot binary before evidence upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/R70_FLASHBOOT_64K.bin
          test ! -e /tmp/R70_FLASHBOOT_64K.bin
          echo "R70_FLASHBOOT_BINARY_RETAINED=NO" \
            | tee /tmp/R70_TRANSIENT_STATE.txt

      - name: Build R70 evidence bundle
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          OUT=/tmp/R70_BP1048P4_PCTOOL_USB_STATIC_REVERSE_EVIDENCE
          rm -rf "$OUT"
          mkdir -p "$OUT"

          for f in \
            R70_SDK_STATE.txt \
            R70_ANDES_STATE.txt \
            R70_NDS32_OBJDUMP_VERSION.txt \
            R70_NDS32_OBJDUMP_TARGETS.txt \
            R70_FLASHBOOT_STATE.txt \
            R70_DISASM_STATE.txt \
            R70_USB_DESCRIPTOR_SCAN.json \
            R70_USB_DESCRIPTOR_STATE.txt \
            R70_COMMAND_XREFS.json \
            R70_COMMAND_XREF_STATE.txt \
            R70_COMMAND_XREF_WINDOWS.txt \
            R70_BOOTLOADER_IDENTITY.txt \
            R70_DECISION.txt \
            R70_TRANSIENT_STATE.txt; do
            test -f "/tmp/$f" && cp "/tmp/$f" "$OUT/"
          done

          # Preserve only targeted disassembly snippets, not the raw blob.
          python3 - <<'PY'
          from pathlib import Path
          src=Path("/tmp/R70_FLASHBOOT_NDS32_DISASM.txt")
          if src.exists():
              lines=src.read_text(
                  encoding="latin-1", errors="replace"
              ).splitlines()
              Path(
                  "/tmp/R70_BP1048P4_PCTOOL_USB_STATIC_REVERSE_EVIDENCE/"
                  "R70_DISASM_HEAD.txt"
              ).write_text(
                  "\n".join(lines[:500])+"\n",
                  encoding="utf-8"
              )
          PY

          test ! -e "$OUT/R70_FLASHBOOT_64K.bin"

          cat > "$OUT/README.txt" <<'EOF'
          R70 statically reverses the exact 64KiB embedded PCTOOL flashboot.

          It uses the pinned Andes NDS32 objdump and raw-binary machine mode
          n1h_v3m, scans USB device/config/interface/endpoint/string descriptors,
          maps updater command strings, and searches NDS32 disassembly for
          direct xrefs.

          A descriptor candidate does not by itself prove the production board
          enters this bootloader.  Safe readback/recovery and exact live USB
          transport remain closed until independently proven.

          No vendor code execution.
          No board USB access.
          No erase/program/flash.
          EOF

          (
            cd /tmp
            zip -qr \
              R70_BP1048P4_PCTOOL_USB_STATIC_REVERSE_EVIDENCE.zip \
              R70_BP1048P4_PCTOOL_USB_STATIC_REVERSE_EVIDENCE
            sha256sum \
              R70_BP1048P4_PCTOOL_USB_STATIC_REVERSE_EVIDENCE.zip \
              > R70_BP1048P4_PCTOOL_USB_STATIC_REVERSE_EVIDENCE.zip.sha256
          )

          cat /tmp/R70_BP1048P4_PCTOOL_USB_STATIC_REVERSE_EVIDENCE.zip.sha256

      - name: Upload R70 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R70-BP1048P4-PCTOOL-USB-STATIC-REVERSE-EVIDENCE
          path: |
            /tmp/R70_BP1048P4_PCTOOL_USB_STATIC_REVERSE_EVIDENCE.zip
            /tmp/R70_BP1048P4_PCTOOL_USB_STATIC_REVERSE_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: R70 final gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          cat /tmp/R70_FLASHBOOT_STATE.txt 2>/dev/null || true
          cat /tmp/R70_DISASM_STATE.txt 2>/dev/null || true
          cat /tmp/R70_USB_DESCRIPTOR_STATE.txt 2>/dev/null || true
          cat /tmp/R70_COMMAND_XREF_STATE.txt 2>/dev/null || true
          cat /tmp/R70_BOOTLOADER_IDENTITY.txt 2>/dev/null || true
          cat /tmp/R70_DECISION.txt 2>/dev/null || true

          test "${{ steps.blob_extract.outcome }}" = "success"
          test "${{ steps.disasm.outcome }}" = "success"
          test "${{ steps.usb_descriptors.outcome }}" = "success"
          test "${{ steps.command_xrefs.outcome }}" = "success"
          test "${{ steps.identity.outcome }}" = "success"
          test "${{ steps.decision.outcome }}" = "success"

          grep -F 'R70_FLASHBOOT_SOURCE_MATCHES_R69=YES' /tmp/R70_FLASHBOOT_STATE.txt
          grep -F 'R70_NDS32_RAW_DISASSEMBLY=YES' /tmp/R70_DISASM_STATE.txt
          grep -F 'R70_USB_DESCRIPTOR_STATIC_SCAN_COMPLETED=YES' /tmp/R70_DECISION.txt
          grep -F 'R70_COMMAND_STRING_XREF_SCAN_COMPLETED=YES' /tmp/R70_DECISION.txt
          grep -F 'R70_VENDOR_CODE_EXECUTED=NO' /tmp/R70_DECISION.txt
          grep -F 'R70_BOARD_USB_ACCESSED=NO' /tmp/R70_DECISION.txt
          grep -F 'R70_FLASH_WRITE_EXECUTED=NO' /tmp/R70_DECISION.txt
          grep -F 'FLASH_ALLOWED=NO' /tmp/R70_DECISION.txt
          grep -F 'R70_FLASHBOOT_BINARY_RETAINED=NO' /tmp/R70_TRANSIENT_STATE.txt

          echo "R70_PCTOOL_USB_STATIC_REVERSE=PASS"
          echo "FLASH_ALLOWED=NO"
