name: R2_OKN_APK_R55

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-r55-usb-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android app
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          rm -rf app
          flutter create \
            --platforms=android \
            --org com.okn.dsp \
            --project-name okn_r55_usb \
            app
          rm -rf app/test

      - name: Install R55 USB controller UI
        shell: bash
        run: |
          set -euo pipefail
          cat > app/lib/main.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';

          void main() => runApp(const OknR55App());

          class OknR55App extends StatelessWidget {
            const OknR55App({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'OKN R55 USB',
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: const Color(0xff1565c0),
                    brightness: Brightness.dark,
                  ),
                  useMaterial3: true,
                ),
                home: const R55Home(),
              );
            }
          }

          class R55Home extends StatefulWidget {
            const R55Home({super.key});

            @override
            State<R55Home> createState() => _R55HomeState();
          }

          class _R55HomeState extends State<R55Home> {
            static const usb = MethodChannel('com.okn.r55/usb');
            final gains = List<double>.filled(7, 0.0);
            bool connected = false;
            bool busy = false;
            String status = 'ต่อ USB-C เข้าบอร์ด แล้วกด CONNECT';

            Future<void> connect() async {
              setState(() {
                busy = true;
                status = 'กำลังค้นหา 6324:1719 / IF4 HID...';
              });
              try {
                final r = await usb.invokeMapMethod<String, dynamic>('connect');
                final ok = r?['connected'] == true;
                setState(() {
                  connected = ok;
                  status = (r?['message'] ?? 'UNKNOWN').toString();
                });
              } on PlatformException catch (e) {
                setState(() {
                  connected = false;
                  status = '${e.code}: ${e.message ?? ''}';
                });
              } finally {
                if (mounted) setState(() => busy = false);
              }
            }

            Future<void> readAll() async {
              if (!connected) return;
              setState(() {
                busy = true;
                status = 'READ CH1..CH7';
              });
              try {
                final r = await usb.invokeListMethod<dynamic>('readAll');
                if (r == null || r.length != 7) {
                  throw PlatformException(code: 'BAD_READBACK');
                }
                setState(() {
                  for (var i = 0; i < 7; i++) {
                    gains[i] = (r[i] as num).toDouble();
                  }
                  status = 'R55 TRUE7CH READBACK OK';
                });
              } on PlatformException catch (e) {
                setState(() => status = '${e.code}: ${e.message ?? ''}');
              } finally {
                if (mounted) setState(() => busy = false);
              }
            }

            Future<void> setGain(int index, double db) async {
              if (!connected) return;
              final q = ((db * 2).round() / 2.0).clamp(-70.0, 6.0).toDouble();
              try {
                await usb.invokeMethod('setGain', {
                  'channel': index + 1,
                  'db': q,
                });
                if (mounted) {
                  setState(() {
                    gains[index] = q;
                    status = 'CH${index + 1} = ${q.toStringAsFixed(1)} dB';
                  });
                }
              } on PlatformException catch (e) {
                if (mounted) {
                  setState(() => status = '${e.code}: ${e.message ?? ''}');
                }
              }
            }

            Widget channel(int i) {
              final v = gains[i];
              return Card(
                child: Padding(
                  padding: const EdgeInsets.fromLTRB(14, 10, 14, 8),
                  child: Column(
                    children: [
                      Row(
                        children: [
                          Text(
                            'CH${i + 1}',
                            style: const TextStyle(
                              fontSize: 18,
                              fontWeight: FontWeight.bold,
                            ),
                          ),
                          const Spacer(),
                          Text('${v.toStringAsFixed(1)} dB'),
                        ],
                      ),
                      Slider(
                        min: -70,
                        max: 6,
                        divisions: 152,
                        value: v.clamp(-70.0, 6.0).toDouble(),
                        onChanged: connected && !busy
                            ? (x) => setState(() => gains[i] = x)
                            : null,
                        onChangeEnd: connected && !busy
                            ? (x) => setGain(i, x)
                            : null,
                      ),
                      Row(
                        children: [
                          TextButton(
                            onPressed: connected && !busy
                                ? () => setGain(i, gains[i] - 0.5)
                                : null,
                            child: const Text('-0.5'),
                          ),
                          const Spacer(),
                          TextButton(
                            onPressed: connected && !busy
                                ? () => setGain(i, gains[i] + 0.5)
                                : null,
                            child: const Text('+0.5'),
                          ),
                        ],
                      ),
                    ],
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('OKN DSP • R55 TRUE7CH'),
                ),
                body: SafeArea(
                  child: Column(
                    children: [
                      Padding(
                        padding: const EdgeInsets.all(12),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.stretch,
                          children: [
                            Container(
                              padding: const EdgeInsets.all(10),
                              decoration: BoxDecoration(
                                borderRadius: BorderRadius.circular(12),
                                color: connected
                                    ? Colors.green.withValues(alpha: 0.16)
                                    : Colors.orange.withValues(alpha: 0.16),
                              ),
                              child: Text(status),
                            ),
                            const SizedBox(height: 8),
                            const Text(
                              'R55 runtime only • Dedicated Gain IDs 22–28 • ไม่ใช้ EQ ทำ Gain • ไม่มี Flash/Erase/Bootloader',
                              style: TextStyle(fontSize: 12),
                            ),
                            const SizedBox(height: 10),
                            Row(
                              children: [
                                Expanded(
                                  child: FilledButton.icon(
                                    onPressed: busy ? null : connect,
                                    icon: const Icon(Icons.usb),
                                    label: const Text('CONNECT USB'),
                                  ),
                                ),
                                const SizedBox(width: 8),
                                Expanded(
                                  child: OutlinedButton.icon(
                                    onPressed: connected && !busy ? readAll : null,
                                    icon: const Icon(Icons.refresh),
                                    label: const Text('READ ALL'),
                                  ),
                                ),
                              ],
                            ),
                          ],
                        ),
                      ),
                      Expanded(
                        child: ListView.builder(
                          padding: const EdgeInsets.fromLTRB(8, 0, 8, 16),
                          itemCount: 7,
                          itemBuilder: (_, i) => channel(i),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          DART

      - name: Install native R55 USB HID bridge
        shell: bash
        run: |
          set -euo pipefail
          KDIR="app/android/app/src/main/kotlin/com/okn/dsp/okn_r55_usb"
          mkdir -p "$KDIR"
          cat > "$KDIR/MainActivity.kt" <<'KOTLIN'
          package com.okn.dsp.okn_r55_usb

          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.hardware.usb.UsbConstants
          import android.hardware.usb.UsbDevice
          import android.hardware.usb.UsbDeviceConnection
          import android.hardware.usb.UsbInterface
          import android.hardware.usb.UsbManager
          import android.os.Build
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodCall
          import io.flutter.plugin.common.MethodChannel
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import kotlin.concurrent.thread
          import kotlin.math.roundToInt

          class MainActivity : FlutterActivity() {
              companion object {
                  private const val CHANNEL = "com.okn.r55/usb"
                  private const val ACTION_USB_PERMISSION = "com.okn.r55.USB_PERMISSION"

                  private const val TARGET_VID = 0x6324
                  private const val TARGET_PID = 0x1719
                  private const val TARGET_IF = 4

                  private const val UFE_WRITE = 0x57
                  private const val UFE_READ = 0x58
                  private const val UFE_RESPONSE = 0x60

                  private const val HID_GET_REPORT = 0x01
                  private const val HID_SET_REPORT = 0x09
                  private const val REPORT_INPUT = 1
                  private const val REPORT_OUTPUT = 2
              }

              private lateinit var usb: UsbManager
              private var device: UsbDevice? = null
              private var pendingConnect: MethodChannel.Result? = null
              private var receiverRegistered = false

              private val receiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context, intent: Intent) {
                      if (intent.action != ACTION_USB_PERMISSION) return
                      val d: UsbDevice? = if (Build.VERSION.SDK_INT >= 33) {
                          intent.getParcelableExtra(UsbManager.EXTRA_DEVICE, UsbDevice::class.java)
                      } else {
                          @Suppress("DEPRECATION")
                          intent.getParcelableExtra(UsbManager.EXTRA_DEVICE)
                      }
                      val granted = intent.getBooleanExtra(
                          UsbManager.EXTRA_PERMISSION_GRANTED, false
                      )
                      val result = pendingConnect
                      pendingConnect = null

                      if (!granted || d == null || !isTarget(d)) {
                          result?.error(
                              "USB_PERMISSION_DENIED",
                              "USB permission denied or wrong device",
                              null
                          )
                          return
                      }

                      device = d
                      val hid = getTargetInterface(d)
                      if (hid == null) {
                          result?.error(
                              "IF4_HID_MISSING",
                              "6324:1719 found but IF4 HID is missing",
                              null
                          )
                          return
                      }
                      result?.success(statusMap(true, d, hid, "USB CONNECTED"))
                  }
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  usb = getSystemService(Context.USB_SERVICE) as UsbManager
                  registerUsbReceiver()

                  MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      CHANNEL
                  ).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "connect" -> connect(result)
                          "setGain" -> setGain(call, result)
                          "readAll" -> readAll(result)
                          else -> result.notImplemented()
                      }
                  }
              }

              override fun cleanUpFlutterEngine(flutterEngine: FlutterEngine) {
                  try {
                      if (receiverRegistered) unregisterReceiver(receiver)
                  } catch (_: Throwable) {
                  }
                  receiverRegistered = false
                  pendingConnect?.error("ENGINE_STOPPED", "Flutter engine stopped", null)
                  pendingConnect = null
                  super.cleanUpFlutterEngine(flutterEngine)
              }

              private fun registerUsbReceiver() {
                  if (receiverRegistered) return
                  val filter = IntentFilter(ACTION_USB_PERMISSION)
                  if (Build.VERSION.SDK_INT >= 33) {
                      registerReceiver(receiver, filter, Context.RECEIVER_NOT_EXPORTED)
                  } else {
                      @Suppress("DEPRECATION")
                      registerReceiver(receiver, filter)
                  }
                  receiverRegistered = true
              }

              private fun isTarget(d: UsbDevice): Boolean =
                  d.vendorId == TARGET_VID && d.productId == TARGET_PID

              private fun findTarget(): UsbDevice? =
                  usb.deviceList.values.firstOrNull { isTarget(it) }

              private fun getTargetInterface(d: UsbDevice): UsbInterface? {
                  for (i in 0 until d.interfaceCount) {
                      val f = d.getInterface(i)
                      if (f.id == TARGET_IF &&
                          f.interfaceClass == UsbConstants.USB_CLASS_HID) {
                          return f
                      }
                  }
                  return null
              }

              private fun statusMap(
                  connected: Boolean,
                  d: UsbDevice,
                  hid: UsbInterface?,
                  message: String
              ): Map<String, Any> = mapOf(
                  "connected" to connected,
                  "message" to message,
                  "vid" to d.vendorId,
                  "pid" to d.productId,
                  "interface" to (hid?.id ?: -1)
              )

              private fun connect(result: MethodChannel.Result) {
                  if (pendingConnect != null) {
                      result.error("CONNECT_PENDING", "USB permission request already pending", null)
                      return
                  }

                  val d = findTarget()
                  if (d == null) {
                      result.error(
                          "TARGET_NOT_FOUND",
                          "Target USB 6324:1719 not found",
                          null
                      )
                      return
                  }
                  device = d
                  val hid = getTargetInterface(d)
                  if (hid == null) {
                      result.error(
                          "IF4_HID_MISSING",
                          "Target found but IF4 HID is missing",
                          null
                      )
                      return
                  }

                  if (usb.hasPermission(d)) {
                      result.success(statusMap(true, d, hid, "USB CONNECTED"))
                      return
                  }

                  var flags = PendingIntent.FLAG_UPDATE_CURRENT
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      flags = flags or PendingIntent.FLAG_MUTABLE
                  }
                  val pi = PendingIntent.getBroadcast(
                      this,
                      55,
                      Intent(ACTION_USB_PERMISSION).setPackage(packageName),
                      flags
                  )
                  pendingConnect = result
                  usb.requestPermission(d, pi)
              }

              private fun setGain(call: MethodCall, result: MethodChannel.Result) {
                  val ch = call.argument<Int>("channel")
                  val db = call.argument<Double>("db")
                  if (ch == null || db == null || ch !in 1..7 || db < -70.0 || db > 6.0) {
                      result.error("BAD_ARGUMENT", "channel=1..7, db=-70..+6", null)
                      return
                  }

                  thread(name = "okn-r55-set") {
                      try {
                          withConnection { c, hid ->
                              runtimeSetGain(c, hid, ch, db.toFloat())
                          }
                          runOnUiThread { result.success(true) }
                      } catch (t: Throwable) {
                          runOnUiThread {
                              result.error("USB_WRITE_FAILED", t.message ?: t.javaClass.simpleName, null)
                          }
                      }
                  }
              }

              private fun readAll(result: MethodChannel.Result) {
                  thread(name = "okn-r55-read") {
                      try {
                          val values = withConnection { c, hid ->
                              (1..7).map { runtimeReadGain(c, hid, it).toDouble() }
                          }
                          runOnUiThread { result.success(values) }
                      } catch (t: Throwable) {
                          runOnUiThread {
                              result.error("USB_READ_FAILED", t.message ?: t.javaClass.simpleName, null)
                          }
                      }
                  }
              }

              private fun <T> withConnection(
                  block: (UsbDeviceConnection, UsbInterface) -> T
              ): T {
                  val d = device ?: findTarget() ?: error("Target 6324:1719 not found")
                  require(isTarget(d)) { "USB target changed" }
                  require(usb.hasPermission(d)) { "USB permission missing" }
                  val hid = getTargetInterface(d) ?: error("IF4 HID missing")
                  val c = usb.openDevice(d) ?: error("openDevice failed")
                  var claimed = false
                  try {
                      claimed = c.claimInterface(hid, true)
                      check(claimed) { "claimInterface(IF4) failed" }
                      return block(c, hid)
                  } finally {
                      if (claimed) {
                          try {
                              c.releaseInterface(hid)
                          } catch (_: Throwable) {
                          }
                      }
                      c.close()
                  }
              }

              private fun frame(control: Int, payload: ByteArray): ByteArray {
                  require(payload.size <= 251)
                  val b = ByteArray(256)
                  b[0] = 0xA5.toByte()
                  b[1] = 0x5A
                  b[2] = control.toByte()
                  b[3] = payload.size.toByte()
                  System.arraycopy(payload, 0, b, 4, payload.size)
                  b[4 + payload.size] = 0x16
                  return b
              }

              private fun setReport(
                  c: UsbDeviceConnection,
                  hid: UsbInterface,
                  b: ByteArray
              ): Int = c.controlTransfer(
                  0x21,
                  HID_SET_REPORT,
                  REPORT_OUTPUT shl 8,
                  hid.id,
                  b,
                  256,
                  1200
              )

              private fun getReport(
                  c: UsbDeviceConnection,
                  hid: UsbInterface,
                  retries: Int = 5
              ): ByteArray {
                  repeat(retries) { attempt ->
                      val b = ByteArray(256)
                      val n = c.controlTransfer(
                          0xA1,
                          HID_GET_REPORT,
                          REPORT_INPUT shl 8,
                          hid.id,
                          b,
                          256,
                          1200
                      )
                      if (n >= 17) return b
                      if (attempt + 1 < retries) Thread.sleep(15)
                  }
                  error("HID GET_REPORT returned no valid 17-byte R55 frame")
              }

              private fun validateResponse(r: ByteArray, expectedControl: Int) {
                  require(r.size == 256)
                  require(r[0] == 0xA5.toByte() && r[1] == 0x5A.toByte()) {
                      "Bad R55 frame header"
                  }
                  require((r[2].toInt() and 0xFF) == expectedControl) {
                      "Unexpected R55 control"
                  }
                  val n = r[3].toInt() and 0xFF
                  require(n <= 251 && r[4 + n] == 0x16.toByte()) {
                      "Bad R55 frame length/end"
                  }
              }

              private fun runtimeSetGain(
                  c: UsbDeviceConnection,
                  hid: UsbInterface,
                  channel: Int,
                  db: Float
              ) {
                  require(channel in 1..7 && db.isFinite() && db in -70f..6f)
                  val qDb = (db * 2f).roundToInt() / 2f
                  val p = ByteArray(12)
                  ByteBuffer.wrap(p).order(ByteOrder.BIG_ENDIAN).apply {
                      putInt(channel + 21)
                      putShort(0)
                      putShort(4)
                  }
                  ByteBuffer.wrap(p, 8, 4)
                      .order(ByteOrder.LITTLE_ENDIAN)
                      .putFloat(qDb)
                  check(setReport(c, hid, frame(UFE_WRITE, p)) == 256) {
                      "SET_REPORT did not accept 256 bytes"
                  }
              }

              private fun runtimeReadGain(
                  c: UsbDeviceConnection,
                  hid: UsbInterface,
                  channel: Int
              ): Float {
                  require(channel in 1..7)
                  val p = ByteArray(8)
                  ByteBuffer.wrap(p).order(ByteOrder.BIG_ENDIAN).apply {
                      putInt(channel + 21)
                      putShort(0)
                      putShort(4)
                  }
                  check(setReport(c, hid, frame(UFE_READ, p)) == 256) {
                      "READ SET_REPORT did not accept 256 bytes"
                  }
                  Thread.sleep(15)
                  val r = getReport(c, hid)
                  validateResponse(r, UFE_RESPONSE)
                  val id = ByteBuffer.wrap(r, 4, 4)
                      .order(ByteOrder.BIG_ENDIAN)
                      .int
                  require(id == channel + 21) { "Readback ID mismatch" }
                  return ByteBuffer.wrap(r, 12, 4)
                      .order(ByteOrder.LITTLE_ENDIAN)
                      .float
              }
          }
          KOTLIN

      - name: Enable Android USB host
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/android/app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          marker = '<application'
          feature = '    <uses-feature android:name="android.hardware.usb.host" android:required="true" />\n\n'
          if 'android.hardware.usb.host' not in s:
              s = s.replace(marker, feature + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
          cat app/android/app/src/main/AndroidManifest.xml

      - name: Verify R55 protocol guards
        shell: bash
        run: |
          set -euo pipefail
          J="app/android/app/src/main/kotlin/com/okn/dsp/okn_r55_usb/MainActivity.kt"
          D="app/lib/main.dart"
          grep -q 'TARGET_VID = 0x6324' "$J"
          grep -q 'TARGET_PID = 0x1719' "$J"
          grep -q 'TARGET_IF = 4' "$J"
          grep -q 'UFE_WRITE = 0x57' "$J"
          grep -q 'UFE_READ = 0x58' "$J"
          grep -q 'UFE_RESPONSE = 0x60' "$J"
          grep -q 'putInt(channel + 21)' "$J"
          grep -q 'db in -70f..6f' "$J"
          grep -q 'divisions: 152' "$D"
          ! grep -Eqi 'erase|program.?flash|bootloader|flash.?write|0xAA.*0x55' "$J"
          echo 'PASS: R55 runtime gain only; no flash/erase/bootloader path'

      - name: Flutter analyze
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze

      - name: Build release APK
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          flutter build apk --release

      - name: Package R2 artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/app/outputs/flutter-apk/app-release.apk out/OKN_R55_USB.apk
          sha256sum out/OKN_R55_USB.apk | tee out/OKN_R55_USB.apk.sha256
          cat > out/R2_STATUS.txt <<'EOF'
          R2 OKN R55 Android USB runtime controller
          Target: MVSilicon BP1048P4 board USB 6324:1719
          Interface: IF4 HID
          Runtime framing: 256-byte HID A5 5A ... 16
          Dedicated Gain CH1..CH7: UFE IDs 22..28
          Gain range: -70.0..+6.0 dB, 0.5 dB step
          Gain via EQ: NO
          Flash/erase/bootloader: NOT INCLUDED
          Purpose: R55-compatible runtime control and readback from Android USB-C host
          IMPORTANT: this APK does not install R55 onto stock firmware.
          EOF

      - name: Upload R2 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: R2_OKN_R55_USB_APK
          path: out/
          if-no-files-found: error
          retention-days: 30
