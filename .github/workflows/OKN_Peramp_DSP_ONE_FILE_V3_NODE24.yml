      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'false'
          log-accepted-android-sdk-licenses: 'false'
          packages: ''

      - name: Install required Android SDK 35 only
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          echo "sdkmanager=$SDKMANAGER"

          # Do NOT run `sdkmanager --licenses` here. That command asks for every
          # optional license installed on the hosted image (Google TV/XR, etc.).
          # Feed 'yes' only to the packages this app actually requires.
          set +o pipefail
          yes | "$SDKMANAGER" \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"
          SDK_RC=${PIPESTATUS[1]}
          set -o pipefail
          test "$SDK_RC" -eq 0

          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -d "$SDK_ROOT/platforms/${ANDROID_PLATFORM}"
          test -x "$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}/aapt2"
          test -x "$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          echo "Android SDK: PASS"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Preflight project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          java -version
          gradle --version
          gradle --version | grep -q 'Gradle 8.9'

          echo 'Node24 action stack: setup-java@v6 / setup-android@v4 / setup-gradle@v6 / upload-artifact@v7'

          # Compile blocker found in the previous one-file workflow.
          grep -q '^import androidx.compose.foundation.layout.weight$' \
            app/src/main/java/com/okn/perampdsp/ui/PerampApp.kt

          grep -q 'compileSdk = 35' app/build.gradle.kts
          grep -q 'id("com.android.application") version "8.7.3"' build.gradle.kts
          grep -q 'id("org.jetbrains.kotlin.android") version "2.0.21"' build.gradle.kts
          grep -q 'kotlinx-coroutines-android:1.9.0' app/build.gradle.kts
          grep -q 'Build.VERSION.SDK_INT >= Build.VERSION_CODES.M' \
            app/src/main/java/com/okn/perampdsp/ble/BleTransport.kt
          grep -q 'connectGatt(context, false, callback)' \
            app/src/main/java/com/okn/perampdsp/ble/BleTransport.kt
          echo "Project preflight: PASS"

      - name: Build debug APK
        shell: bash
        run: |
          set -uo pipefail
          cd "$PROJECT_DIR"
          BUILD_LOG="$RUNNER_TEMP/gradle-build.log"
          set +e
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --console=plain 2>&1 | tee "$BUILD_LOG"
          GRADLE_RC=${PIPESTATUS[0]}
          set -e
          if [ "$GRADLE_RC" -ne 0 ]; then
            echo "Gradle build failed with exit code $GRADLE_RC"
            echo "----- last 250 build-log lines -----"
            tail -n 250 "$BUILD_LOG" || true
            exit "$GRADLE_RC"
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          AAPT2="$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}/aapt2"
          APKSIGNER="$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"

          test -s "$APK"
          "$AAPT2" dump badging "$APK" | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -q "package: name='com.okn.perampdsp'" "$RUNNER_TEMP/apk-badging.txt"
          "$APKSIGNER" verify --verbose "$APK"

          rm -rf "$GITHUB_WORKSPACE/dist"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/OKN-Peramp-DSP-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/dist/OKN-Peramp-DSP-debug.apk" \
            > "$GITHUB_WORKSPACE/dist/OKN-Peramp-DSP-debug.apk.sha256"
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: OKN-Peramp-DSP-debug
          path: |
            dist/OKN-Peramp-DSP-debug.apk
            dist/OKN-Peramp-DSP-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          DIAG="$GITHUB_WORKSPACE/diagnostics"
          mkdir -p "$DIAG"
          [ -f "$RUNNER_TEMP/gradle-build.log" ] && cp "$RUNNER_TEMP/gradle-build.log" "$DIAG/gradle-build.log"
          {
            echo "Workflow: OKN Peramp DSP V3 NODE24"
            echo "Runner: $RUNNER_OS / $RUNNER_ARCH"
            echo "Java:"
            java -version 2>&1 || true
            echo
            echo "Gradle:"
            gradle --version 2>&1 || true
            echo
            echo "sdkmanager: $(command -v sdkmanager || true)"
            echo "ANDROID_HOME=${ANDROID_HOME:-}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
            echo "PROJECT_DIR=${PROJECT_DIR:-}"
            if [ -n "${PROJECT_DIR:-}" ] && [ -d "$PROJECT_DIR" ]; then
              echo
              echo "Embedded project files:"
              find "$PROJECT_DIR" -maxdepth 4 -type f | sort
              echo
              echo "Gradle source versions:"
              grep -nE 'com.android.application|org.jetbrains.kotlin|compileSdk|targetSdk|versionName|kotlinx-coroutines' \
                "$PROJECT_DIR/build.gradle.kts" "$PROJECT_DIR/app/build.gradle.kts" || true
            fi
          } > "$DIAG/environment.txt"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: OKN-Peramp-DSP-V3-build-diagnostics
          path: diagnostics/*
          if-no-files-found: warn
          retention-days: 30

      - name: Build summary
        if: success()
        shell: bash
        run: |
          {
            echo '## OKN Peramp DSP V3 NODE24 - Build PASS'
            echo ''
            echo '- Compose `weight` import: PASS'
            echo '- Java: 17'
            echo '- Gradle: 8.9 (matched to AGP 8.7.3)'
            echo '- Android: API 35 / Build Tools 35.0.0'
            echo '- Global optional-license prompt: skipped'
            echo '- Android 5/5.1 BLE connectGatt compatibility: fixed'
            echo '- Explicit kotlinx-coroutines Android dependency: added'
            echo '- GitHub Actions runtime: Node 24-compatible actions'
            echo '- setup-java: v6'
            echo '- setup-android: v4 (global license acceptance disabled)'
            echo '- setup-gradle: v6'
            echo '- upload-artifact: v7'
            echo '- Failure diagnostic artifact: enabled'
            echo '- APK package/signature verification: PASS'
            echo '- Artifact: OKN-Peramp-DSP-debug'
          } >> "$GITHUB_STEP_SUMMARY"
