name: R90 BP1048 SDK OBEX dual-bank implementation and layout audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r90-bp1048-obex-dualbank-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_REPO: https://github.com/leadercxn/bp1048_sdk_v0.1.12.git
  SDK_COMMIT: 8105bd864b04995d81c9f9ae77cb158259f39015
  FLASH_ALLOWED: 'NO'

jobs:
  offline-dualbank-audit:
    name: OFFLINE OBEX dual-bank implementation/layout audit - no execution/no USB/no board/no flash
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/R90_SAFETY.txt <<'EOF'
          R90_STATIC_ONLY=YES
          SOURCE=PUBLIC_BP1048_SDK_EXACT_COMMIT
          SDK_COMMIT=8105bd864b04995d81c9f9ae77cb158259f39015
          BOARD_CONTACT=NO
          USB_DEVICE_ACCESS=NO
          BLUETOOTH_DEVICE_ACCESS=NO
          VENDOR_BINARY_EXECUTION=NO
          SEND_AA55=NO
          SEND_0X11=NO
          SEND_CHIPERAS_CODEDATA_BOOTDAT_CONSTDAT_CNFGDAT_BTUPDAT_UPINFO_CXXX=NO
          R79_PHYSICAL_REPLUG_AUTORUN=NO
          ERASE_PROGRAM_FLASH=NO
          PRODUCTION_LAYOUT_ASSUMPTION=FORBIDDEN
          REFERENCE_SDK_EQUALS_PRODUCTION=NO
          FLASH_ALLOWED=NO
          PURPOSE=RECOVER_REFERENCE_OBEX_DUAL_BANK_UPDATE_IMPLEMENTATION_IMAGE_LAYOUT_METADATA_AND_COMMIT_REBOOT_STATE_MACHINE
          EOF
          cat /tmp/R90_SAFETY.txt

      - name: Install static tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils file unzip xxd
          python3 -m venv /tmp/r90-venv
          /tmp/r90-venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir pyelftools
          echo "/tmp/r90-venv/bin" >> "$GITHUB_PATH"

      - name: Clone exact SDK commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r90/evidence
          git clone --filter=blob:none --no-checkout "$SDK_REPO" /tmp/r90/sdk
          cd /tmp/r90/sdk
          git fetch --depth=1 origin "$SDK_COMMIT"
          git checkout --detach "$SDK_COMMIT"
          HEAD="$(git rev-parse HEAD)"
          test "$HEAD" = "$SDK_COMMIT"
          printf 'SDK_COMMIT_MATCH=YES\nSDK_HEAD=%s\n' "$HEAD" \
            | tee /tmp/r90/evidence/R90_SDK_GATE.txt

      - name: Source inventory and exact symbol search
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r90/sdk

          find . -type f -printf '%P\t%s\n' | sort \
            > /tmp/r90/evidence/R90_ALL_FILES.tsv

          grep -RInaE \
            'ObexUpdateProc|ObexUpgradeStart|ObexUpgradeEnd|DualBankUpdateReboot|MVA_BT_OBEX_UPDATE_FUNC_SUPPORT|DualBank|dual.?bank|bank.?update|upgrade.?reboot|boot.?flag|upgrade.?flag|update.?flag|firmware.?update|image.?size|image.?crc|app.?crc|flash.?addr|flash.?address|backup.?bank|active.?bank|target.?bank|swap.?bank|commit.?upgrade' \
            --exclude-dir=.git . \
            > /tmp/r90/evidence/R90_SOURCE_HITS.txt || true

          grep -RInaE \
            '#define[[:space:]]+.*(FLASH|BOOT|BANK|UPDATE|UPGRADE|APP|CODE|CONST|CONFIG).*0x[0-9A-Fa-f]+' \
            --include='*.h' --include='*.c' --include='*.s' --include='*.S' \
            --exclude-dir=.git . \
            > /tmp/r90/evidence/R90_ADDRESS_DEFINE_HITS.txt || true

          grep -RInaE \
            'MVA_BT_OBEX_UPDATE_FUNC_SUPPORT|BT_OBEX_SUPPORT|ObexUpdateProc|ObexUpgradeStart|ObexUpgradeEnd' \
            BT_Audio_APP MVsB1_Base_SDK 2>/dev/null \
            > /tmp/r90/evidence/R90_OBEX_CALL_SITES.txt || true

          sed -n '1,500p' /tmp/r90/evidence/R90_SOURCE_HITS.txt
          echo '--- address defines ---'
          sed -n '1,500p' /tmp/r90/evidence/R90_ADDRESS_DEFINE_HITS.txt

      - name: Locate source implementation and build references
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r90/sdk

          find . -type f \( \
              -iname '*obex*upgrade*' -o \
              -iname '*upgrade*' -o \
              -iname '*update*' -o \
              -iname '*flashboot*' -o \
              -iname '*boot*' \
            \) -printf '%P\t%s\n' | sort \
            > /tmp/r90/evidence/R90_UPGRADE_RELATED_FILES.tsv || true

          grep -RInaE \
            'bt_obex_upgrade|ObexUpdateProc|ObexUpgradeStart|ObexUpgradeEnd|DualBankUpdateReboot' \
            --include='CMakeLists.txt' --include='Makefile' --include='*.mk' --include='*.cmake' \
            --exclude-dir=.git . \
            > /tmp/r90/evidence/R90_BUILD_REFERENCE_HITS.txt || true

          cat /tmp/r90/evidence/R90_UPGRADE_RELATED_FILES.tsv
          echo '--- build refs ---'
          cat /tmp/r90/evidence/R90_BUILD_REFERENCE_HITS.txt

      - name: Scan binaries archives and objects for hidden implementation
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r90/sdk

          find . -type f \( \
              -name '*.a' -o -name '*.o' -o -name '*.so' -o \
              -name '*.lib' -o -name '*.bin' -o -name '*.elf' \
            \) -printf '%P\t%s\n' | sort \
            > /tmp/r90/evidence/R90_BINARY_FILES.tsv || true

          : > /tmp/r90/evidence/R90_BINARY_STRING_HITS.txt
          : > /tmp/r90/evidence/R90_NM_SYMBOL_HITS.txt
          : > /tmp/r90/evidence/R90_ARCHIVE_MEMBERS.tsv

          while IFS=$'\t' read -r rel size; do
            [ -n "$rel" ] || continue
            f="./$rel"

            strings -a -t x "$f" 2>/dev/null \
              | grep -Ei \
                'ObexUpdateProc|ObexUpgradeStart|ObexUpgradeEnd|DualBankUpdateReboot|MVA_BT_OBEX_UPDATE_FUNC_SUPPORT|DualBank|upgrade|update|bank|bootflag|crc|flash' \
              | sed "s#^#$rel\t#" \
              >> /tmp/r90/evidence/R90_BINARY_STRING_HITS.txt || true

            nm -A "$f" 2>/dev/null \
              | grep -Ei \
                'ObexUpdateProc|ObexUpgradeStart|ObexUpgradeEnd|DualBankUpdateReboot|DualBank|Upgrade|Update|Flash|Boot' \
              >> /tmp/r90/evidence/R90_NM_SYMBOL_HITS.txt || true

            if file -b "$f" 2>/dev/null | grep -qi 'current ar archive'; then
              ar t "$f" 2>/dev/null \
                | sed "s#^#$rel\t#" \
                >> /tmp/r90/evidence/R90_ARCHIVE_MEMBERS.tsv || true
            fi
          done < /tmp/r90/evidence/R90_BINARY_FILES.tsv

          echo '--- binary string hits ---'
          sed -n '1,1000p' /tmp/r90/evidence/R90_BINARY_STRING_HITS.txt
          echo '--- nm symbol hits ---'
          sed -n '1,1000p' /tmp/r90/evidence/R90_NM_SYMBOL_HITS.txt

      - name: Extract archives and inspect member symbols and strings
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r90/sdk
          mkdir -p /tmp/r90/archive_extract
          : > /tmp/r90/evidence/R90_EXTRACTED_MEMBER_HITS.txt
          : > /tmp/r90/evidence/R90_EXTRACTED_MEMBER_FILETYPES.tsv

          n=0
          while IFS=$'\t' read -r rel size; do
            [ -n "$rel" ] || continue
            f="./$rel"
            if ! file -b "$f" 2>/dev/null | grep -qi 'current ar archive'; then
              continue
            fi

            n=$((n+1))
            d="/tmp/r90/archive_extract/a$n"
            mkdir -p "$d"
            cp "$f" "$d/archive.a"
            (
              cd "$d"
              ar x archive.a 2>/dev/null || exit 0

              for m in *; do
                [ -f "$m" ] || continue
                [ "$m" = archive.a ] && continue
                typ="$(file -b "$m" 2>/dev/null || true)"
                printf '%s\t%s\t%s\n' "$rel" "$m" "$typ" \
                  >> /tmp/r90/evidence/R90_EXTRACTED_MEMBER_FILETYPES.tsv

                strings -a -t x "$m" 2>/dev/null \
                  | grep -Ei \
                    'ObexUpdateProc|ObexUpgradeStart|ObexUpgradeEnd|DualBankUpdateReboot|DualBank|upgrade|update|bank|bootflag|crc|flash' \
                  | sed "s#^#$rel\t$m\t#" \
                  >> /tmp/r90/evidence/R90_EXTRACTED_MEMBER_HITS.txt || true

                nm -A "$m" 2>/dev/null \
                  | grep -Ei \
                    'ObexUpdateProc|ObexUpgradeStart|ObexUpgradeEnd|DualBankUpdateReboot|DualBank|Upgrade|Update|Flash|Boot' \
                  | sed "s#^#$rel\t$m\t#" \
                  >> /tmp/r90/evidence/R90_EXTRACTED_MEMBER_HITS.txt || true
              done
            )
          done < /tmp/r90/evidence/R90_BINARY_FILES.tsv

          sed -n '1,1500p' /tmp/r90/evidence/R90_EXTRACTED_MEMBER_HITS.txt

      - name: Static binary context extraction around upgrade symbols
        shell: bash
        run: |
          set -euo pipefail
          /tmp/r90-venv/bin/python - <<'PY'
          from pathlib import Path
          import hashlib, json, re

          root=Path('/tmp/r90/sdk')
          out=Path('/tmp/r90/evidence')
          needles=[
              b'ObexUpdateProc', b'ObexUpgradeStart', b'ObexUpgradeEnd',
              b'DualBankUpdateReboot', b'MVA_BT_OBEX_UPDATE_FUNC_SUPPORT',
              b'DualBank', b'dual bank', b'upgrade', b'Upgrade'
          ]

          records=[]
          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts:
                  continue
              try:
                  b=p.read_bytes()
              except Exception:
                  continue
              if len(b)>100_000_000:
                  continue
              lower=b.lower()
              for needle in needles:
                  start=0
                  nlow=needle.lower()
                  while True:
                      i=lower.find(nlow,start)
                      if i<0:
                          break
                      lo=max(0,i-256); hi=min(len(b),i+len(needle)+512)
                      chunk=b[lo:hi]
                      printable=''.join(chr(x) if 32<=x<127 else '.' for x in chunk)
                      records.append({
                          'path':str(p.relative_to(root)),
                          'file_size':len(b),
                          'sha256':hashlib.sha256(b).hexdigest(),
                          'needle':needle.decode(errors='ignore'),
                          'offset':i,
                          'context_ascii':printable,
                      })
                      start=i+1
                      if len(records)>=20000:
                          break
                  if len(records)>=20000:
                      break
              if len(records)>=20000:
                  break

          out.joinpath('R90_BINARY_CONTEXTS.json').write_text(
              json.dumps(records,indent=2,ensure_ascii=False)+'\n'
          )
          print('BINARY_CONTEXT_COUNT',len(records))
          PY

      - name: Build conservative decision
        shell: bash
        run: |
          set -euo pipefail
          /tmp/r90-venv/bin/python - <<'PY'
          from pathlib import Path
          import json,re

          p=Path('/tmp/r90/evidence')
          source=(p/'R90_SOURCE_HITS.txt').read_text(errors='ignore')
          build=(p/'R90_BUILD_REFERENCE_HITS.txt').read_text(errors='ignore')
          bstr=(p/'R90_BINARY_STRING_HITS.txt').read_text(errors='ignore')
          nm=(p/'R90_NM_SYMBOL_HITS.txt').read_text(errors='ignore')
          ext=(p/'R90_EXTRACTED_MEMBER_HITS.txt').read_text(errors='ignore')
          addr=(p/'R90_ADDRESS_DEFINE_HITS.txt').read_text(errors='ignore')

          combined='\n'.join([source,build,bstr,nm,ext])
          impl_evidence=bool(re.search(
              r'ObexUpdateProc|ObexUpgradeStart|ObexUpgradeEnd|DualBankUpdateReboot',
              '\n'.join([nm,ext]),
              re.I
          ))
          dualbank_evidence=bool(re.search(r'DualBank|Dual.?Bank',combined,re.I))
          numeric_layout=bool(re.search(
              r'(FLASH|BOOT|BANK|UPDATE|UPGRADE|APP|CODE|CONST|CONFIG).*0x[0-9A-Fa-f]+',
              addr,
              re.I
          ))

          decision={
              'SDK_COMMIT_MATCH':True,
              'OBEX_UPDATE_DECLARATIONS_PRESENT':all(x in source for x in [
                  'ObexUpdateProc','ObexUpgradeStart','ObexUpgradeEnd'
              ]),
              'MVA_BT_OBEX_UPDATE_CALLSITE_PRESENT':'MVA_BT_OBEX_UPDATE_FUNC_SUPPORT' in source,
              'DUAL_BANK_TERM_PRESENT':dualbank_evidence,
              'COMPILED_OBEX_UPDATE_IMPLEMENTATION_SYMBOL_EVIDENCE':impl_evidence,
              'REFERENCE_NUMERIC_LAYOUT_DEFINE_EVIDENCE':numeric_layout,
              'REFERENCE_DUAL_BANK_UPDATE_LOGIC_RECOVERED':impl_evidence,
              'REFERENCE_LAYOUT_EQUALS_PRODUCTION':False,
              'PHONE_DIRECT_USB_BOOTSTRAP_PROVEN_FROM_R90':False,
              'PRODUCTION_FLASH_LAYOUT_PROVEN_FROM_R90':False,
              'PRODUCTION_BACKUP_RECOVERY_PROVEN_FROM_R90':False,
              'LIVE_BOARD_TEST_ALLOWED_FROM_R90':False,
              'FLASH_ALLOWED':False,
          }
          p.joinpath('R90_DECISION.json').write_text(json.dumps(decision,indent=2)+'\n')
          print(json.dumps(decision,indent=2))

          lines=[
              '# R90 BP1048 reference SDK OBEX dual-bank implementation/layout audit',
              '',
              'OFFLINE/STATIC ONLY. No vendor binary execution, no USB/Bluetooth/board access, no flash.',
              '',
              '## Decision',
              '```json',json.dumps(decision,indent=2),'```','',
              '## High-value source hits',
          ]
          for line in source.splitlines()[:1000]:
              if re.search(r'ObexUpdate|ObexUpgrade|DualBank|MVA_BT_OBEX_UPDATE|upgrade|bank',line,re.I):
                  lines.append('- '+line[:1500])

          lines += ['','## High-value compiled symbol/string hits']
          count=0
          for line in (nm+'\n'+ext+'\n'+bstr).splitlines():
              if re.search(r'ObexUpdate|ObexUpgrade|DualBank|upgrade|bank|flash|boot',line,re.I):
                  lines.append('- '+line[:1500])
                  count+=1
                  if count>=1000: break

          lines += ['','## Reference address/layout define hits']
          for line in addr.splitlines()[:1200]:
              lines.append('- '+line[:1500])

          lines += [
              '',
              '## Interpretation gate',
              '- This transport is Bluetooth OBEX in the public reference SDK and is NOT the required final Samsung S25+ USB-C transport.',
              '- Its value is only to recover reference dual-bank image/layout/commit semantics that may inform later comparison.',
              '- Reference SDK addresses or metadata must not be copied to the production GoloPine board without independent production proof.',
              '- No live test follows from R90.',
              '- FLASH_ALLOWED=NO.',
          ]
          p.joinpath('R90_REPORT.md').write_text('\n'.join(lines)+'\n')
          PY
          sed -n '1,800p' /tmp/r90/evidence/R90_REPORT.md

      - name: Package evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/R90_SAFETY.txt /tmp/r90/evidence/ || true
          (cd /tmp/r90/evidence && zip -9 -r /tmp/R90_BP1048_REFERENCE_OBEX_DUALBANK_LAYOUT_EVIDENCE.zip .)
          sha256sum /tmp/R90_BP1048_REFERENCE_OBEX_DUALBANK_LAYOUT_EVIDENCE.zip \
            > /tmp/R90_BP1048_REFERENCE_OBEX_DUALBANK_LAYOUT_EVIDENCE.zip.sha256

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R90-BP1048-REFERENCE-OBEX-DUALBANK-LAYOUT-EVIDENCE
          path: |
            /tmp/R90_BP1048_REFERENCE_OBEX_DUALBANK_LAYOUT_EVIDENCE.zip
            /tmp/R90_BP1048_REFERENCE_OBEX_DUALBANK_LAYOUT_EVIDENCE.zip.sha256
          if-no-files-found: error
