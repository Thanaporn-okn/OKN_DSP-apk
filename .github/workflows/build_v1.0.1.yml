\
name: OKN DSP - Auto Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: okn-dsp-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Locate newest OKN DSP source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ZIP="$(find . -maxdepth 1 -type f -name 'OKN_DSP_v*_source.zip' -printf '%f\n' | sort -V | tail -n 1)"
          if [ -z "$SOURCE_ZIP" ]; then
            echo "No OKN_DSP_v*_source.zip found in repository root."
            exit 1
          fi
          echo "zip=$SOURCE_ZIP" >> "$GITHUB_OUTPUT"
          echo "Using $SOURCE_ZIP"

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _build
          mkdir -p _build Sources
          unzip -q "${{ steps.source.outputs.zip }}" -d _build
          PROJECT_DIR="$(dirname "$(find _build -name pubspec.yaml -print -quit)")"
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/pubspec.yaml" ]; then
            echo "pubspec.yaml not found after extracting source ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Initialize persistent VERSION
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f VERSION ]; then
            python "$PROJECT_DIR/scripts/version_manager.py" read \
              --pubspec "$PROJECT_DIR/pubspec.yaml" > VERSION
          fi
          echo "Persistent version before this run: $(cat VERSION)"

      - name: Select build version
        shell: bash
        run: |
          set -euo pipefail
          COMMIT_MSG="$(git log -1 --pretty=%s)"
          if [[ "$COMMIT_MSG" == fix:* ]] || [[ "$COMMIT_MSG" == bug:* ]] || [[ "$COMMIT_MSG" == *"[bugfix]"* ]]; then
            python "$PROJECT_DIR/scripts/version_manager.py" bump-patch-build \
              --version-file VERSION
          else
            python "$PROJECT_DIR/scripts/version_manager.py" bump-build \
              --version-file VERSION
          fi

          python "$PROJECT_DIR/scripts/version_manager.py" sync \
            --pubspec "$PROJECT_DIR/pubspec.yaml" \
            --version-file VERSION

          echo "Build version: $(cat VERSION)"

      - name: Flutter validate and build
        id: pipeline
        shell: bash
        run: |
          set +e

          LOG="$GITHUB_WORKSPACE/Sources/build.log"
          : > "$LOG"

          STATUS=0
          FAILED_STAGE=""

          run_stage() {
            STAGE="$1"
            shift
            echo "" | tee -a "$LOG"
            echo "========== $STAGE ==========" | tee -a "$LOG"
            "$@" 2>&1 | tee -a "$LOG"
            CODE=${PIPESTATUS[0]}
            if [ "$CODE" -ne 0 ]; then
              STATUS="$CODE"
              FAILED_STAGE="$STAGE"
              return "$CODE"
            fi
            return 0
          }

          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            run_stage "flutter_create_android" \
              flutter create --platforms=android --org com.okn --project-name okn_dsp .
          fi

          # Defensive cleanup for the stock Flutter test if an older source
          # archive ever reaches CI. Our source package includes a correct
          # widget_test.dart, so this normally does nothing.
          if [ -f test/widget_test.dart ] && grep -q "MyApp" test/widget_test.dart; then
            echo "Removing generated stock widget_test.dart that references MyApp." | tee -a "$LOG"
            rm -f test/widget_test.dart
          fi

          if [ "$STATUS" -eq 0 ]; then
            run_stage "flutter_pub_get" flutter pub get
          fi

          if [ "$STATUS" -eq 0 ]; then
            run_stage "flutter_analyze" flutter analyze
          fi

          if [ "$STATUS" -eq 0 ]; then
            run_stage "flutter_test" flutter test
          fi

          if [ "$STATUS" -eq 0 ]; then
            run_stage "flutter_build_apk" flutter build apk --release
          fi

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "failed_stage=$FAILED_STAGE" >> "$GITHUB_OUTPUT"

          # Always let later success/error-record steps execute.
          exit 0

      - name: SHA-256 and build metadata
        if: steps.pipeline.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          python "$PROJECT_DIR/scripts/write_sha256.py" \
            "$APK" \
            --out Sources/sha256.txt

          {
            echo "version=$(cat VERSION)"
            echo "commit=${GITHUB_SHA}"
            echo "source_zip=${{ steps.source.outputs.zip }}"
            echo "built_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > Sources/build_info.txt

          cp "$APK" "OKN_DSP_$(cat VERSION | tr '+' '_').apk"

          printf "%s | BUILD SUCCESS | %s\n" \
            "$(cat VERSION)" "$GITHUB_SHA" >> Sources/version_history.log

      - name: Error handling and automatic next version
        if: steps.pipeline.outputs.status != '0'
        shell: bash
        run: |
          set -euo pipefail

          FAILED_VERSION="$(cat VERSION)"
          FAILED_STAGE="${{ steps.pipeline.outputs.failed_stage }}"
          NEXT_VERSION="$(python "$PROJECT_DIR/scripts/version_manager.py" bump-patch-build --version-file VERSION)"

          {
            echo "# OKN DSP build failure"
            echo
            echo "- failed_version: $FAILED_VERSION"
            echo "- failed_stage: $FAILED_STAGE"
            echo "- next_version: $NEXT_VERSION"
            echo "- commit: $GITHUB_SHA"
            echo "- source_zip: ${{ steps.source.outputs.zip }}"
            echo "- time_utc: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "The next build will automatically use $NEXT_VERSION."
          } > Sources/error_log.md

          {
            echo "BUILD_FAILED_NO_APK"
            echo "failed_version=$FAILED_VERSION"
            echo "failed_stage=$FAILED_STAGE"
            echo "next_version=$NEXT_VERSION"
            echo "commit=$GITHUB_SHA"
          } > Sources/sha256.txt

          printf "%s | BUILD FAILED at %s -> next %s | %s\n" \
            "$FAILED_VERSION" "$FAILED_STAGE" "$NEXT_VERSION" "$GITHUB_SHA" \
            >> Sources/version_history.log

      - name: Persist VERSION and build records
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add VERSION Sources/

          if git diff --cached --quiet; then
            echo "No generated records to commit."
          else
            git commit -m "ci: persist DSP build records [skip ci]"
            git push
          fi

      - name: Upload APK artifact
        if: steps.pipeline.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-APK-${{ github.run_number }}
          path: |
            OKN_DSP_*.apk
            Sources/sha256.txt
            Sources/build_info.txt
            Sources/build.log
          if-no-files-found: error

      - name: Upload failure logs
        if: steps.pipeline.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-BUILD-ERROR-${{ github.run_number }}
          path: |
            Sources/build.log
            Sources/error_log.md
            Sources/sha256.txt
            Sources/version_history.log
            VERSION
          if-no-files-found: warn

      - name: Mark workflow failed when validation/build failed
        if: steps.pipeline.outputs.status != '0'
        shell: bash
        run: |
          echo "DSP pipeline failed at: ${{ steps.pipeline.outputs.failed_stage }}"
          exit 1
