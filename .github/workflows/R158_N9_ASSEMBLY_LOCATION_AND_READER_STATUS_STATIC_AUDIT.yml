name: R158 N9 assembly location and reader status static audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R158_N9_ASSEMBLY_LOCATION_AND_READER_STATUS_STATIC_AUDIT.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r158-static-${{ github.ref }}
  cancel-in-progress: true

env:
  FLASH_ALLOWED: "NO"
  R157_RUN_ID: "36028455796"
  R157_JOB_ID: "107730862275"
  R157_ARTIFACT_ID: "10820682068"
  R157_ARTIFACT_DIGEST: "sha256:8e5cafb812f4a5a4ec8eda76d552d5e201f6654a6f7b1b9d4b1893312b28bc50"

jobs:
  static_audit:
    name: STATIC ONLY - classify remaining branches - no vendor execution or board
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r158/input /tmp/r158/evidence
          cat > /tmp/r158/evidence/R158_SAFETY.txt <<'EOF'
          MODE=OFFLINE_STATIC_IL_AND_EVIDENCE_REVIEW_ONLY
          VENDOR_EXE_DLL_APK_EXECUTED=NO
          USB_OR_BOARD_CONTACT=NO
          AA55_OR_LINEIN_AA55_SENT=NO
          RUNTIME_0X11_OR_0XFE_SENT=NO
          FLASH_READ_ERASE_WRITE_EXECUTED=NO
          OFFLINE_DECRYPT_EXECUTED=NO
          ONE_BYTE_REPAIR_GUESS_ALLOWED=NO
          DISCOVERED_FRAME_LIVE_AUTHORIZED=NO
          HARDWARE_MODIFICATION=FORBIDDEN
          FLASH_ALLOWED=NO
          EOF

      - name: Download pinned R157 evidence
        uses: actions/download-artifact@v4
        with:
          name: R157-N9-LOCAL29-LOCAL81-NONNULL-LOCAL93-LOOP-BRANCH-EVIDENCE
          path: /tmp/r158/input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 36028455796

      - name: Verify evidence and trace exact raw IL
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re,zipfile
          inp=Path('/tmp/r158/input'); ev=Path('/tmp/r158/evidence')
          name='R157_N9_LOCAL29_LOCAL81_NONNULL_LOCAL93_LOOP_BRANCH_EVIDENCE.zip'
          z=inp/name; checksum=inp/(name+'.sha256')
          assert z.is_file() and checksum.is_file(), 'R157 inner evidence absent'
          digest=hashlib.sha256(z.read_bytes()).hexdigest()
          assert digest==checksum.read_text().split()[0], 'R157 inner ZIP checksum mismatch'
          with zipfile.ZipFile(z) as archive:
            decision=json.loads(archive.read('R157_DECISION.json'))
            model=json.loads(archive.read('R157_LOCAL29_LOCAL81_NONNULL_LOCAL93_LOOP_BRANCH_MODEL.json'))
            prefix='r156/r155/r154/r153/r152/r151/r150/r149/r148/r147/r146/r145/r144/r143/'
            n9=archive.read(prefix+'R143_N9_METHOD.il').decode('utf-8','replace')
            full=archive.read(prefix+'r142/r141/r140/R140_FIXED_FULL.il').decode('utf-8','replace')
          assert decision['UNACCOUNTED_CONDITIONAL_COUNT_AFTER_R157']==3
          remaining=decision['remaining_unaccounted_conditionals']
          assert [x['state'] for x in remaining]==[246,605,292], 'remaining branch order changed'
          assert [x['branch_line'] for x in remaining]==[
            'IL_22e1: brtrue IL_1fbf','IL_1fce: brtrue IL_5d2c','IL_59b4: bne.un IL_5d8f']
          assert decision['FLASH_ALLOWED'] is False and decision['OFFLINE_DECRYPT_AUTHORIZED'] is False
          assert model['LOCAL29_LENGTH_PREDECRYPT']==607967
          facts={
            'own_assembly_stored_in_static_field':r'IL_0015: callvirt instance class \[mscorlib\]System\.Reflection\.Assembly \[mscorlib\]System\.Type::get_Assembly\(\)\s*\n\s*IL_001a: stsfld object .*::lWgjKLKxo2',
            'location_wrapper_calls_assembly_location':r'object KIoEb3NS3a1HTR21GpN \(.*?IL_0004: callvirt instance string \[mscorlib\]System\.Reflection\.Assembly::get_Location\(\)\s*\n\s*IL_0009: ret',
            'length_wrapper_calls_string_length':r'int32 SMPFNLNr5St51O5T1Ai \(.*?IL_0004: callvirt instance int32 \[mscorlib\]System\.String::get_Length\(\)\s*\n\s*IL_0009: ret',
            'reader_wrapper_calls_read_int32':r'int32 qfkv4ZNDynVciIciQy6 \(.*?IL_0004: callvirt instance int32 .*::sXXetjyGMH\(\)\s*\n\s*IL_0009: ret',
            'reader_method_calls_binaryreader_readint32':r'instance int32 sXXetjyGMH \(\).*?System\.IO\.BinaryReader::ReadInt32\(\)',
          }
          checked={k:bool(re.search(v,full,re.S)) for k,v in facts.items()}
          checked.update({
            'state246_tests_assembly_location':bool(re.search(r'IL_22d7: ldsfld object .*::lWgjKLKxo2\s*\n\s*IL_22dc: call object .*::KIoEb3NS3a1HTR21GpN\(object\)\s*\n\s*IL_22e1: brtrue IL_1fbf',n9)),
            'state605_tests_location_length':bool(re.search(r'IL_1fbf: ldsfld object .*::lWgjKLKxo2\s*\n\s*IL_1fc4: call object .*::KIoEb3NS3a1HTR21GpN\(object\)\s*\n\s*IL_1fc9: call int32 .*::SMPFNLNr5St51O5T1Ai\(object\)\s*\n\s*IL_1fce: brtrue IL_5d2c',n9)),
            'state292_tests_reader_int32_against_four':bool(re.search(r'IL_1969: ldloc\.s 114\s*\n\s*IL_196b: call int32 .*::qfkv4ZNDynVciIciQy6\(object\)\s*\n\s*IL_1970: stloc\.s 28.*?IL_59b1: ldloc\.s 28\s*\n\s*IL_59b3: ldc\.i4\.4\s*\n\s*IL_59b4: bne\.un IL_5d8f',n9,re.S)),
          })
          assert all(checked.values()), {k:v for k,v in checked.items() if not v}
          result={
            'R157_RUN_ID':36028455796,'R157_JOB_ID':107730862275,
            'R157_ARTIFACT_ID':10820682068,'R157_INNER_ZIP_SHA256':digest,
            'RAW_IL_AND_WRAPPER_FACTS':checked,
            'STATE246_SOURCE':'Assembly.Location; actual loaded assembly environment/path requires independent proof',
            'STATE605_SOURCE':'Assembly.Location.Length; path length requires independent proof',
            'STATE292_SOURCE':'BinaryReader.ReadInt32 from local114; input bytes, cursor, and reachability require independent proof',
            'R158_RESOLVED_CONDITIONAL_COUNT':0,
            'UNACCOUNTED_CONDITIONAL_COUNT_AFTER_R158':3,
            'remaining_unaccounted_conditionals':remaining,
            'INDEPENDENT_FULL_PATH_BRANCH_COVERAGE_PROVEN':False,
            'OFFLINE_DECRYPT_AUTHORIZED':False,'H15_PLAINTEXT_RECOVERED':False,
            'ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD':False,
            'FLASH_ALLOWED':False,
            'NEXT':'Prove the exact production own-assembly load context and the local114 reader input/cursor from pinned bytes; keep all three predicates unresolved until direct static evidence supports a branch value.'
          }
          (ev/'R158_DECISION.json').write_text(json.dumps(result,indent=2)+'\n')
          (ev/'R158_REPORT_TH.md').write_text('# R158 static branch provenance\n\nState 246 and 605 depend on Assembly.Location and its length. State 292 depends on BinaryReader.ReadInt32. No branch value is assumed; three remain unresolved.\n\nFLASH_ALLOWED=NO\n')
          print(json.dumps(result,indent=2))
          PY

      - name: Package and upload evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r158/evidence
          zip -9 -r /tmp/R158_N9_ASSEMBLY_LOCATION_AND_READER_STATUS_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/R158_N9_ASSEMBLY_LOCATION_AND_READER_STATUS_EVIDENCE.zip > /tmp/R158_N9_ASSEMBLY_LOCATION_AND_READER_STATUS_EVIDENCE.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: R158-N9-ASSEMBLY-LOCATION-AND-READER-STATUS-STATIC-EVIDENCE
          path: |
            /tmp/R158_N9_ASSEMBLY_LOCATION_AND_READER_STATUS_EVIDENCE.zip
            /tmp/R158_N9_ASSEMBLY_LOCATION_AND_READER_STATUS_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F '"UNACCOUNTED_CONDITIONAL_COUNT_AFTER_R158": 3' /tmp/r158/evidence/R158_DECISION.json
          grep -F '"OFFLINE_DECRYPT_AUTHORIZED": false' /tmp/r158/evidence/R158_DECISION.json
          grep -F '"FLASH_ALLOWED": false' /tmp/r158/evidence/R158_DECISION.json
          grep -Fx 'FLASH_ALLOWED=NO' /tmp/r158/evidence/R158_SAFETY.txt
