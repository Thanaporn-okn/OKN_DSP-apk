name: R100 AP82xx 8P100 YouTube Google Drive tool acquisition and static audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r100-ap82xx-youtube-drive-static-${{ github.ref }}
  cancel-in-progress: true

env:
  VIDEO_URL: https://www.youtube.com/watch?v=oSIWbddW7Rc
  FLASH_ALLOWED: 'NO'

jobs:
  public-static-audit:
    name: PUBLIC/OFFLINE AP82xx tool acquisition and static audit - no execution/no USB/no board/no flash
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r100/evidence /tmp/r100/download /tmp/r100/extracted
          cat > /tmp/r100/evidence/R100_SAFETY.txt <<'EOF'
          R100_PUBLIC_SOURCE_ONLY=YES
          BOARD_CONTACT=NO
          USB_DEVICE_ACCESS=NO
          PHONE_LIVE_TEST=NO
          VENDOR_BINARY_EXECUTION=NO
          WINE_EXECUTION=NO
          SEND_AA55=NO
          SEND_0X11=NO
          SEND_CHIPERAS_CODEDATA_BOOTDAT_CONSTDAT_CNFGDAT_BTUPDAT_UPINFO_CXXX=NO
          R79_PHYSICAL_REPLUG_AUTORUN=NO
          ERASE_PROGRAM_FLASH=NO
          FINAL_REQUIRED_TRANSPORT=SAMSUNG_S25_PLUS_USB_C_DIRECT_TO_DSP_USB_C
          HARDWARE_MODIFICATION=FORBIDDEN
          FLASH_ALLOWED=NO
          PURPOSE=RECOVER_PUBLIC_GOOGLE_DRIVE_LINK_FOR_MY_AP82XX_8P100_PC_TOOLS_AND_STATICALLY_AUDIT_FOR_USB_BOOT_UPGRADE_PATH
          EOF
          cat /tmp/r100/evidence/R100_SAFETY.txt

      - name: Install public metadata and static analysis tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq file unzip p7zip-full binutils curl jq
          python3 -m venv /tmp/r100-venv
          /tmp/r100-venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir \
            yt-dlp requests beautifulsoup4 lxml pefile
          echo "/tmp/r100-venv/bin" >> "$GITHUB_PATH"

      - name: Acquire YouTube metadata description and public comments
        shell: bash
        continue-on-error: true
        run: |
          set -u
          cd /tmp/r100/evidence

          yt-dlp \
            --skip-download \
            --write-info-json \
            --write-comments \
            --no-playlist \
            -o 'R100_YOUTUBE.%(ext)s' \
            "$VIDEO_URL" \
            > R100_YTDLP_STDOUT.txt 2> R100_YTDLP_STDERR.txt || true

          # Independent lightweight metadata fallback.
          curl -L --fail --retry 3 \
            "https://www.youtube.com/oembed?url=${VIDEO_URL}&format=json" \
            -o R100_OEMBED.json || true

          ls -la
          sed -n '1,500p' R100_YTDLP_STDERR.txt || true

      - name: Extract candidate URLs from video metadata and comments
        shell: bash
        run: |
          set -euo pipefail
          /tmp/r100-venv/bin/python - <<'PY'
          from pathlib import Path
          import json,re,html
          from urllib.parse import unquote

          ev=Path('/tmp/r100/evidence')
          urls=[]
          texts=[]

          infos=list(ev.glob('R100_YOUTUBE*.info.json'))
          parsed=[]
          for p in infos:
              try:
                  obj=json.loads(p.read_text(errors='ignore'))
                  parsed.append(obj)
              except Exception:
                  continue

          for obj in parsed:
              for key in ('title','description','webpage_url'):
                  v=obj.get(key)
                  if isinstance(v,str):
                      texts.append(f'{key}: {v}')
              for c in obj.get('comments') or []:
                  txt=c.get('text') or ''
                  author=c.get('author') or ''
                  cid=c.get('id') or ''
                  texts.append(f'COMMENT {cid} {author}: {txt}')

          blob='\n'.join(texts)
          ev.joinpath('R100_YOUTUBE_TEXT.txt').write_text(blob+'\n',encoding='utf-8')

          # URL forms commonly present in YouTube text.
          rx=re.compile(r'https?://[^\s<>"\']+',re.I)
          for m in rx.findall(blob):
              u=html.unescape(m).rstrip(').,]}')
              urls.append(u)

          # Also recover escaped JSON URLs if needed.
          raw='\n'.join(p.read_text(errors='ignore') for p in infos)
          raw=raw.replace('\\u0026','&').replace('\\/','/')
          for m in rx.findall(raw):
              u=html.unescape(m).rstrip(').,]}')
              urls.append(u)

          urls=list(dict.fromkeys(urls))
          drive=[u for u in urls if 'drive.google.com' in u.lower() or 'docs.google.com' in u.lower()]
          ap82=[line for line in blob.splitlines()
                if re.search(r'AP82|8P100|PC[_ ]?Tools|google\s*drive|drive\.google',line,re.I)]

          ev.joinpath('R100_ALL_URLS.txt').write_text('\n'.join(urls)+'\n')
          ev.joinpath('R100_GOOGLE_DRIVE_URLS.txt').write_text('\n'.join(drive)+'\n')
          ev.joinpath('R100_AP82_CONTEXT.txt').write_text('\n'.join(ap82)+'\n')

          print(json.dumps({
              'info_json_count':len(infos),
              'parsed_info_count':len(parsed),
              'all_url_count':len(urls),
              'google_drive_url_count':len(drive),
              'ap82_context_line_count':len(ap82),
          },indent=2))
          print('--- DRIVE URLS ---')
          print('\n'.join(drive))
          print('--- AP82 CONTEXT ---')
          print('\n'.join(ap82[:200]))
          PY

      - name: Resolve and download public Google Drive files without executing
        shell: bash
        continue-on-error: true
        run: |
          set -u
          /tmp/r100-venv/bin/python - <<'PY'
          from pathlib import Path
          import requests,re,json,hashlib,os
          from urllib.parse import urlparse,parse_qs,unquote

          ev=Path('/tmp/r100/evidence')
          out=Path('/tmp/r100/download')
          urls=[x.strip() for x in (ev/'R100_GOOGLE_DRIVE_URLS.txt').read_text(errors='ignore').splitlines() if x.strip()]

          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 R100-static-audit'})
          records=[]

          def drive_id(u):
              pats=[
                  r'/file/d/([A-Za-z0-9_-]+)',
                  r'[?&]id=([A-Za-z0-9_-]+)',
                  r'/d/([A-Za-z0-9_-]+)',
              ]
              for p in pats:
                  m=re.search(p,u)
                  if m: return m.group(1)
              return None

          for i,u in enumerate(urls):
              rec={'source_url':u}
              fid=drive_id(u)
              rec['drive_id']=fid
              try:
                  candidates=[]
                  if fid:
                      candidates += [
                          f'https://drive.usercontent.google.com/download?id={fid}&export=download&confirm=t',
                          f'https://drive.google.com/uc?export=download&id={fid}',
                      ]
                  candidates.append(u)

                  response=None
                  used=None
                  for cu in candidates:
                      r=s.get(cu,timeout=60,allow_redirects=True)
                      if r.status_code==200 and len(r.content)>0:
                          response=r; used=cu
                          # Prefer non-HTML downloads.
                          if 'text/html' not in (r.headers.get('content-type','').lower()):
                              break

                  if response is None:
                      raise RuntimeError('no successful response')

                  data=response.content
                  rec['request_url']=used
                  rec['final_url']=response.url
                  rec['status']=response.status_code
                  rec['content_type']=response.headers.get('content-type','')
                  rec['content_disposition']=response.headers.get('content-disposition','')
                  rec['size']=len(data)
                  rec['sha256']=hashlib.sha256(data).hexdigest()

                  cd=rec['content_disposition']
                  name=None
                  m=re.search(r'filename\*?=(?:UTF-8\'\')?"?([^";]+)',cd,re.I)
                  if m: name=unquote(m.group(1))
                  if not name:
                      name=os.path.basename(unquote(urlparse(response.url).path)) or f'drive_{i}.bin'
                  safe=re.sub(r'[^A-Za-z0-9._-]+','_',name)
                  dst=out/f'{i:02d}_{safe}'
                  dst.write_bytes(data)
                  rec['local_path']=str(dst)
              except Exception as e:
                  rec['error']=repr(e)
              records.append(rec)

          ev.joinpath('R100_DRIVE_DOWNLOADS.json').write_text(
              json.dumps(records,indent=2,ensure_ascii=False)+'\n'
          )
          print(json.dumps(records,indent=2,ensure_ascii=False))
          PY

      - name: Static inspect downloaded files and nested archives
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/r100/evidence/R100_FILE_INVENTORY.tsv
          : > /tmp/r100/evidence/R100_ARCHIVE_LISTINGS.txt
          : > /tmp/r100/evidence/R100_INTERESTING_STRINGS.txt

          find /tmp/r100/download -type f -maxdepth 1 -print0 | while IFS= read -r -d '' f; do
            name="$(basename "$f")"
            size="$(stat -c '%s' "$f")"
            sha="$(sha256sum "$f" | awk '{print $1}')"
            typ="$(file -b "$f" || true)"
            printf '%s\t%s\t%s\t%s\n' "$name" "$size" "$sha" "$typ" \
              >> /tmp/r100/evidence/R100_FILE_INVENTORY.tsv

            7z l "$f" 2>/dev/null \
              | sed "s#^#$name\t#" \
              >> /tmp/r100/evidence/R100_ARCHIVE_LISTINGS.txt || true

            strings -a -t x "$f" 2>/dev/null \
              | grep -Ei \
                'MY_AP82|AP82|8P100|BP1048|BP1048P4|sdk usb device|usb device linked|usb device unlinked|HID|WinUSB|SetupDi|HidD_|CreateFile|ReadFile|WriteFile|DeviceIoControl|upgrade|update|boot|bootloader|flash|flashboot|MVA|burn|program|firmware|recovery|reset|VID|PID|6324|1719|chiperas|codedata|bootdat|constdat|cnfgdat|btupdat|upinfo' \
              | sed "s#^#$name\t#" \
              >> /tmp/r100/evidence/R100_INTERESTING_STRINGS.txt || true
          done

          cat /tmp/r100/evidence/R100_FILE_INVENTORY.tsv
          sed -n '1,2000p' /tmp/r100/evidence/R100_ARCHIVE_LISTINGS.txt
          sed -n '1,2400p' /tmp/r100/evidence/R100_INTERESTING_STRINGS.txt

      - name: Extract archives safely and inspect PE imports/resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r100/extracted

          idx=0
          find /tmp/r100/download -type f -maxdepth 1 -print0 | while IFS= read -r -d '' f; do
            d="/tmp/r100/extracted/$idx"
            mkdir -p "$d"
            7z x -y -o"$d" "$f" >/dev/null 2>&1 || true
            idx=$((idx+1))
          done

          /tmp/r100-venv/bin/python - <<'PY'
          from pathlib import Path
          import json,re,hashlib

          root=Path('/tmp/r100/extracted')
          ev=Path('/tmp/r100/evidence')
          records=[]

          try:
              import pefile
          except Exception:
              pefile=None

          for p in root.rglob('*'):
              if not p.is_file():
                  continue
              data=p.read_bytes()
              rec={
                  'path':str(p.relative_to(root)),
                  'size':len(data),
                  'sha256':hashlib.sha256(data).hexdigest(),
                  'pe':False,
                  'imports':[],
                  'transport_imports':[],
              }
              if data[:2]==b'MZ' and pefile:
                  try:
                      pe=pefile.PE(data=data,fast_load=False)
                      rec['pe']=True
                      imports=[]
                      for ent in getattr(pe,'DIRECTORY_ENTRY_IMPORT',[]):
                          dll=ent.dll.decode(errors='ignore')
                          for imp in ent.imports:
                              name=imp.name.decode(errors='ignore') if imp.name else f'ordinal_{imp.ordinal}'
                              imports.append({'dll':dll,'name':name})
                      rec['imports']=imports
                      needles=('hid','winusb','setupapi','usb','createfile','readfile','writefile',
                               'deviceiocontrol','ftdi','ft232')
                      rec['transport_imports']=[
                          x for x in imports
                          if any(n in (x['dll']+'!'+x['name']).lower() for n in needles)
                      ]
                  except Exception as e:
                      rec['pe_error']=repr(e)
              records.append(rec)

          ev.joinpath('R100_EXTRACTED_FILE_AUDIT.json').write_text(
              json.dumps(records,indent=2,ensure_ascii=False)+'\n'
          )

          print('EXTRACTED_FILES',len(records))
          print('PE_FILES',sum(1 for x in records if x['pe']))
          for x in records:
              if x['pe']:
                  print(json.dumps({
                      'path':x['path'],
                      'size':x['size'],
                      'sha256':x['sha256'],
                      'transport_imports':x['transport_imports'],
                  },ensure_ascii=False))
          PY

      - name: Search extracted payloads for updater firmware and bootstrap evidence
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/r100/evidence/R100_EXTRACTED_NAME_HITS.txt
          : > /tmp/r100/evidence/R100_EXTRACTED_STRING_HITS.txt

          find /tmp/r100/extracted -type f | while read -r f; do
            rel="${f#/tmp/r100/extracted/}"
            echo "$rel" | grep -Ei \
              'firmware|upgrade|update|boot|flash|mva|bin|hex|img|rom|fw|recovery|burn|download' \
              >> /tmp/r100/evidence/R100_EXTRACTED_NAME_HITS.txt || true

            strings -a "$f" 2>/dev/null \
              | grep -Ei \
                'BP1048P4|BP1048|MY_AP82|8P100|sdk usb device|HidD_|WinUSB|SetupDi|upgrade|update|bootloader|flashboot|MVA|firmware|recovery|reset|jump|ROM_SysReset|chiperas|codedata|bootdat|constdat|cnfgdat|btupdat|upinfo|6324|1719' \
              | sed "s#^#$rel\t#" \
              >> /tmp/r100/evidence/R100_EXTRACTED_STRING_HITS.txt || true
          done

          sed -n '1,1800p' /tmp/r100/evidence/R100_EXTRACTED_NAME_HITS.txt
          sed -n '1,2600p' /tmp/r100/evidence/R100_EXTRACTED_STRING_HITS.txt

      - name: Build conservative decision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          p=Path('/tmp/r100/evidence')
          drive=[x for x in (p/'R100_GOOGLE_DRIVE_URLS.txt').read_text(errors='ignore').splitlines() if x.strip()]
          downloads=json.loads((p/'R100_DRIVE_DOWNLOADS.json').read_text()) if (p/'R100_DRIVE_DOWNLOADS.json').exists() else []
          extracted=json.loads((p/'R100_EXTRACTED_FILE_AUDIT.json').read_text()) if (p/'R100_EXTRACTED_FILE_AUDIT.json').exists() else []
          sh=(p/'R100_EXTRACTED_STRING_HITS.txt').read_text(errors='ignore')
          nh=(p/'R100_EXTRACTED_NAME_HITS.txt').read_text(errors='ignore')

          successful=[x for x in downloads if x.get('local_path')]
          pe=[x for x in extracted if x.get('pe')]
          direct_usb_import=any(x.get('transport_imports') for x in pe)
          upgrade_words=bool(re.search(r'upgrade|update|bootloader|flashboot|firmware|recovery',sh,re.I))
          firmware_payload_name=bool(re.search(r'\.(mva|bin|hex|img|rom|fw)\b',nh,re.I))

          decision={
              'YOUTUBE_VIDEO_ID':'oSIWbddW7Rc',
              'PUBLIC_COMMENT_OR_DESCRIPTION_GOOGLE_DRIVE_URL_COUNT':len(drive),
              'PUBLIC_DRIVE_DOWNLOAD_SUCCESS_COUNT':len(successful),
              'EXTRACTED_FILE_COUNT':len(extracted),
              'PE_FILE_COUNT':len(pe),
              'STATIC_DIRECT_USB_HOST_IMPORT_EVIDENCE_PRESENT':direct_usb_import,
              'STATIC_UPGRADE_BOOT_FLASH_VOCABULARY_PRESENT':upgrade_words,
              'FIRMWARE_PAYLOAD_FILENAME_PRESENT':firmware_payload_name,
              'AP82XX_TOOL_PROVEN_TO_FLASH_BP1048P4':False,
              'AP82XX_TOOL_PROVEN_TO_ENTER_BP1048P4_BOOTLOADER':False,
              'AP82XX_TOOL_PROVEN_COMPATIBLE_WITH_GOLOPINE_DAS84014_UPDATE_PATH':False,
              'PHONE_DIRECT_S25_USB_C_BOOTSTRAP_PROVEN_FROM_R100':False,
              'PRODUCTION_RECOVERY_USB_IDENTITY_PROVEN':False,
              'READ_ONLY_PRODUCTION_BACKUP_PATH_PROVEN':False,
              'LIVE_BOARD_TEST_ALLOWED_FROM_R100':False,
              'FLASH_ALLOWED':False,
          }

          p.joinpath('R100_DECISION.json').write_text(json.dumps(decision,indent=2)+'\n')
          lines=[
              '# R100 AP82xx/8P100 public tool acquisition and static audit',
              '',
              'PUBLIC ACQUISITION + STATIC INSPECTION ONLY. No executable was run and no board was accessed.',
              '',
              '## Decision',
              '```json',json.dumps(decision,indent=2),'```','',
              '## Interpretation',
              '- This is a distinct tool branch from the already-closed GoloPine Windows 2025/2026 tuning-client reverse.',
              '- Community evidence says the visible AP82xx tool workflow was used for BT/BLE naming and was not shown to flash/create firmware; R100 independently checks the binary/package for hidden update/bootstrap surfaces.',
              '- USB/HID imports or words alone do not prove a bootloader path.',
              '- No live test follows unless an explicit, non-destructive production-compatible bootstrap/read-only path is proven.',
              '- Final accepted programming path remains Samsung S25+ -> USB-C -> DSP USB-C only.',
              '- FLASH_ALLOWED=NO.',
          ]
          p.joinpath('R100_REPORT.md').write_text('\n'.join(lines)+'\n')
          print(json.dumps(decision,indent=2))
          PY

          cat /tmp/r100/evidence/R100_REPORT.md

      - name: Package evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/r100/evidence && zip -9 -r /tmp/R100_AP82XX_8P100_PUBLIC_TOOL_STATIC_EVIDENCE.zip .)
          sha256sum /tmp/R100_AP82XX_8P100_PUBLIC_TOOL_STATIC_EVIDENCE.zip \
            > /tmp/R100_AP82XX_8P100_PUBLIC_TOOL_STATIC_EVIDENCE.zip.sha256

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R100-AP82XX-8P100-PUBLIC-TOOL-STATIC-EVIDENCE
          path: |
            /tmp/R100_AP82XX_8P100_PUBLIC_TOOL_STATIC_EVIDENCE.zip
            /tmp/R100_AP82XX_8P100_PUBLIC_TOOL_STATIC_EVIDENCE.zip.sha256
          if-no-files-found: error
