name: R133 exact PCTools GetInputReport report-ID response static reverse

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R133_EXACT_PCTOOLS_GETINPUTREPORT_REPORTID_RESPONSE_STATIC_REVERSE.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r133-getinputreport-reportid-response-${{ github.ref }}
  cancel-in-progress: true

env:
  FLASH_ALLOWED: "NO"
  R127_RUN_ID: "35865759674"
  R127_ACQUIRED_ARTIFACT_NAME: "R127-ACQUIRED-PUBLIC-FILES"
  R127_INNER_ZIP_SHA256: "d217dff170352179ee3d6a70b8e3a58b98b41ef2d365a4551daff4124ce21be6"
  BT_NAME_RAR_SHA256: "c6b1fcb4d0e430c86c50e9ddf1007fa110f416c0570888060d693819164eccb8"
  PCTOOLS_SHA256: "0e13801b29070f805869823e6db4ad56d70494b2621fb63c330cea1d69e9ca33"
  R132_RUN_ID: "35891070650"
  R132_JOB_ID: "107283366709"
  R132_EVIDENCE_ARTIFACT_ID: "10765116628"
  R132_EVIDENCE_ARTIFACT_NAME: "R132-EXACT-PCTOOLS-GETINPUTREPORT-FUNCTION-DATAFLOW-STATIC-EVIDENCE"
  R132_EVIDENCE_DIGEST: "sha256:5eace7cd9744c899276fd4520caf525f98778eced289af3df12fa2f8fde8fe9a"

jobs:
  static_reverse:
    name: STATIC ONLY - report ID and response bytes - no execution - no USB - no board
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r133/input /tmp/r133/acquired /tmp/r133/unpacked/bt /tmp/r133/r132 /tmp/r133/evidence
          cat > /tmp/r133/evidence/R133_SAFETY.txt <<'EOF'
          R133_MODE=TARGETED_GETINPUTREPORT_REPORTID_RESPONSE_STATIC_ONLY
          R133_VENDOR_BINARY_EXECUTED=NO
          R133_INSTALLER_EXECUTED=NO
          R133_USB_DEVICE_ACCESS=NO
          R133_BOARD_CONTACT=NO
          R133_AA55_SENT=NO
          R133_RUNTIME_0X11_SENT=NO
          R133_RUNTIME_0XFE_SENT=NO
          R133_FLASHBOOT_COMMAND_SENT=NO
          R133_FLASH_READ_EXECUTED=NO
          R133_FLASH_ERASE_EXECUTED=NO
          R133_FLASH_WRITE_EXECUTED=NO
          R133_ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD=NO
          FINAL_REQUIRED_TRANSPORT=SAMSUNG_S25_PLUS_USB_C_DIRECT_TO_DSP_USB_C
          HARDWARE_MODIFICATION=FORBIDDEN
          REFERENCE_OR_TOOL_EVIDENCE_IS_NOT_PRODUCTION_PROOF=YES
          FLASH_ALLOWED=NO
          EOF

      - name: Download pinned R127 acquired files as inert data
        uses: actions/download-artifact@v4
        with:
          name: R127-ACQUIRED-PUBLIC-FILES
          path: /tmp/r133/input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 35865759674

      - name: Download pinned R132 evidence for continuity only
        uses: actions/download-artifact@v4
        with:
          name: R132-EXACT-PCTOOLS-GETINPUTREPORT-FUNCTION-DATAFLOW-STATIC-EVIDENCE
          path: /tmp/r133/r132
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 35891070650

      - name: Install static tooling only
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq file unzip p7zip-full python3-pip >/dev/null
          python3 -m pip install --disable-pip-version-check --no-input pefile capstone pyyaml >/dev/null

      - name: Verify pinned hashes and extract inert PCTools
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r133/input
          test -f R127_ACQUIRED_PUBLIC_FILES.zip
          echo "${R127_INNER_ZIP_SHA256}  R127_ACQUIRED_PUBLIC_FILES.zip" | sha256sum -c -
          unzip -q R127_ACQUIRED_PUBLIC_FILES.zip -d /tmp/r133/acquired
          BT_RAR="$(find /tmp/r133/acquired -type f -name '*.rar' -path '*BT_NAME_TOOL*' -print -quit)"
          test -n "$BT_RAR"
          echo "${BT_NAME_RAR_SHA256}  ${BT_RAR}" | sha256sum -c -
          7z x -y -o/tmp/r133/unpacked/bt "$BT_RAR" >/tmp/r133/evidence/R133_7Z_BT_EXTRACT.txt
          PCTOOLS="$(find /tmp/r133/unpacked/bt -type f -name 'MV_AP82xx_BP10xx_PC_Tools_V2.2.8_20210205.exe' -print -quit)"
          test -n "$PCTOOLS"
          echo "${PCTOOLS_SHA256}  ${PCTOOLS}" | sha256sum -c -
          printf '%s\n' "$PCTOOLS" > /tmp/r133/PCTOOLS_PATH
          find /tmp/r133/r132 -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/r133/evidence/R133_R132_ARTIFACT_FILES.txt

      - name: Recover exact report buffer initialization and response-byte checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re,pefile
          from capstone import Cs,CS_ARCH_X86,CS_MODE_32
          from capstone.x86 import X86_OP_IMM,X86_OP_MEM,X86_OP_REG,X86_REG_EBP,X86_REG_ESP

          p=Path(Path('/tmp/r133/PCTOOLS_PATH').read_text().strip())
          pe=pefile.PE(str(p),fast_load=False); ib=pe.OPTIONAL_HEADER.ImageBase
          data=p.read_bytes()
          TARGETS={
              0x40af3e:(0x40a920,0x40b35c,-0x1f4),
              0x40d146:(0x40cb24,0x40d7a4,-0x218),
              0x40de10:(0x40d7d4,0x40e4bc,-0x1fc),
          }
          EXPECTED_LEN=0x101

          imports={}
          for e in getattr(pe,'DIRECTORY_ENTRY_IMPORT',[]):
              for imp in e.imports:
                  if imp.name:
                      imports[imp.address]=imp.name.decode('latin1','replace')

          strings={}
          for enc,pat in [('ascii',rb'[\x20-\x7e]{5,}'),('utf16le',rb'(?:[\x20-\x7e]\x00){5,}')]:
              for m in re.finditer(pat,data):
                  try:
                      txt=m.group().decode('latin1' if enc=='ascii' else 'utf-16le','replace')
                      va=ib+pe.get_rva_from_offset(m.start())
                  except Exception:
                      continue
                  strings[va]={'encoding':enc,'text':txt[:500],'file_offset':m.start()}

          md=Cs(CS_ARCH_X86,CS_MODE_32); md.detail=True
          ins=[]
          for s in pe.sections:
              if s.Characteristics & 0x20000000:
                  ins.extend(md.disasm(s.get_data(),ib+s.VirtualAddress))
          ins=sorted(ins,key=lambda x:x.address)
          by_va={x.address:i for i,x in enumerate(ins)}

          def vals(x):
              out=[]
              for op in x.operands:
                  if op.type==X86_OP_IMM: out.append(op.imm & 0xffffffff)
                  elif op.type==X86_OP_MEM and op.mem.disp: out.append(op.mem.disp & 0xffffffff)
              return out

          def operand_text(x): return f'{x.mnemonic} {x.op_str}'

          results=[]
          for target,(fn_start,fn_end,expected_disp) in TARGETS.items():
              ti=by_va.get(target)
              if ti is None:
                  results.append({'target_va':hex(target),'found':False}); continue
              x=ins[ti]
              api=sorted({imports[v] for v in vals(x) if v in imports})
              fn=[z for z in ins if fn_start <= z.address < fn_end]
              pre=[z for z in fn if z.address < target]
              post=[z for z in fn if z.address > target]

              # Re-derive length and buffer pointer from the final argument setup.
              length_candidates=[]
              buf_candidates=[]
              reg_to_stack={}
              for z in pre[-100:]:
                  # Track LEA reg,[ebp+disp].
                  if z.mnemonic=='lea' and len(z.operands)==2 and z.operands[0].type==X86_OP_REG and z.operands[1].type==X86_OP_MEM:
                      m=z.operands[1].mem
                      if m.base==X86_REG_EBP:
                          reg_to_stack[z.operands[0].reg]=m.disp
                  if z.mnemonic=='mov' and len(z.operands)==2 and z.operands[0].type==X86_OP_MEM:
                      m=z.operands[0].mem
                      if m.base==X86_REG_ESP and m.disp==8 and z.operands[1].type==X86_OP_IMM:
                          length_candidates.append({'va':hex(z.address),'value':int(z.operands[1].imm),'text':operand_text(z)})
                      if m.base==X86_REG_ESP and m.disp==4 and z.operands[1].type==X86_OP_REG:
                          rr=z.operands[1].reg
                          if rr in reg_to_stack:
                              buf_candidates.append({'va':hex(z.address),'disp':int(reg_to_stack[rr]),'text':operand_text(z)})
              length=length_candidates[-1]['value'] if length_candidates else None
              bufdisp=buf_candidates[-1]['disp'] if buf_candidates else None

              # Direct writes into the report buffer before GetInputReport.
              writes=[]
              if bufdisp is not None and length:
                  for z in pre:
                      if len(z.operands)<1 or z.operands[0].type!=X86_OP_MEM: continue
                      m=z.operands[0].mem
                      if m.base!=X86_REG_EBP: continue
                      off=m.disp-bufdisp
                      if not (0 <= off < length): continue
                      src=''
                      imm=None
                      if len(z.operands)>=2:
                          if z.operands[1].type==X86_OP_IMM:
                              imm=int(z.operands[1].imm) & ((1<<(8*z.operands[0].size))-1 if z.operands[0].size else 0xffffffff)
                              src=hex(imm)
                          elif z.operands[1].type==X86_OP_REG:
                              src=z.reg_name(z.operands[1].reg)
                          else:
                              src=str(z.operands[1].type)
                      writes.append({'va':hex(z.address),'offset':int(off),'width':int(z.operands[0].size),'immediate':imm,'source':src,'text':operand_text(z)})
              first_byte_writes=[w for w in writes if w['offset']==0]
              last_first_byte=first_byte_writes[-1] if first_byte_writes else None

              # Buffer comparisons / byte uses after the call.
              checks=[]; reads=[]
              if bufdisp is not None and length:
                  for z in post:
                      for oi,op in enumerate(z.operands):
                          if op.type!=X86_OP_MEM or op.mem.base!=X86_REG_EBP: continue
                          off=op.mem.disp-bufdisp
                          if not (0 <= off < length): continue
                          reads.append({'va':hex(z.address),'offset':int(off),'width':int(op.size),'text':operand_text(z)})
                          if z.mnemonic in {'cmp','test'}:
                              imm=None
                              for op2 in z.operands:
                                  if op2.type==X86_OP_IMM: imm=int(op2.imm)
                              checks.append({'va':hex(z.address),'offset':int(off),'width':int(op.size),'immediate':imm,'text':operand_text(z)})

              # APIs and string refs within the containing function, to infer tool-side role without executing it.
              apis=[]; strrefs=[]
              for z in fn:
                  for v in vals(z):
                      if v in imports:
                          apis.append({'va':hex(z.address),'api':imports[v],'text':operand_text(z)})
                      if v in strings:
                          strrefs.append({'va':hex(z.address),**strings[v]})
              unique_strings=[]; seen=set()
              for s in strrefs:
                  k=s['text']
                  if k not in seen:
                      seen.add(k); unique_strings.append(s)

              results.append({
                  'target_va':hex(target),'found':True,'import_targets':api,
                  'function_start':hex(fn_start),'function_end':hex(fn_end),
                  'derived_length':length,'expected_length':EXPECTED_LEN,'length_matches':length==EXPECTED_LEN,
                  'derived_buffer_ebp_disp':bufdisp,'expected_buffer_ebp_disp':expected_disp,'buffer_matches':bufdisp==expected_disp,
                  'first_byte_direct_writes_before_call':first_byte_writes[-20:],
                  'last_first_byte_direct_write_before_call':last_first_byte,
                  'report_id_immediate_statically_proven':bool(last_first_byte and last_first_byte.get('immediate') is not None),
                  'all_direct_buffer_writes_last_80':writes[-80:],
                  'post_call_buffer_checks':checks[:200],
                  'post_call_buffer_reads_first_250':reads[:250],
                  'function_import_calls':apis[:300],
                  'function_string_refs':unique_strings[:300],
                  'interpretation':'Offline static evidence about the Windows tool only. Report-ID or response-byte recovery does not authorize live board use.'
              })

          Path('/tmp/r133/evidence/R133_REPORTID_RESPONSE_DATAFLOW.json').write_text(json.dumps({'pctools_sha256':'0e13801b29070f805869823e6db4ad56d70494b2621fb63c330cea1d69e9ca33','targets':results},indent=2,ensure_ascii=False)+'\n')
          PY

      - name: Build cross-target semantic comparison and fail-closed decision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          ev=Path('/tmp/r133/evidence')
          d=json.loads((ev/'R133_REPORTID_RESPONSE_DATAFLOW.json').read_text())
          rows=[r for r in d['targets'] if r.get('found')]
          id_proven=[r for r in rows if r.get('report_id_immediate_statically_proven')]
          check_summary={}
          for r in rows:
              check_summary[r['target_va']]=[
                  {'offset':x['offset'],'width':x['width'],'immediate':x['immediate'],'va':x['va']}
                  for x in r['post_call_buffer_checks'][:80]
              ]
          semantic_terms=re.compile(r'sn|serial|version|vid|pid|device|firmware|chip|usb|hid',re.I)
          semantic={}
          for r in rows:
              semantic[r['target_va']]=[
                  x['text'] for x in r['function_string_refs'] if semantic_terms.search(x['text'])
              ][:100]
          decision={
              'R132_RUN_ID':35891070650,
              'R132_JOB_ID':107283366709,
              'R132_EVIDENCE_ARTIFACT_ID':10765116628,
              'PCTOOLS_SHA256':'0e13801b29070f805869823e6db4ad56d70494b2621fb63c330cea1d69e9ca33',
              'TARGET_GETINPUTREPORT_CALL_COUNT':len(rows),
              'ALL_TARGET_LENGTHS_0X101':all(r.get('derived_length')==0x101 for r in rows),
              'REPORT_ID_IMMEDIATE_STATICALLY_PROVEN_COUNT':len(id_proven),
              'REPORT_ID_IMMEDIATE_STATICALLY_PROVEN_TARGETS':[{'target_va':r['target_va'],'write':r['last_first_byte_direct_write_before_call']} for r in id_proven],
              'POST_CALL_BUFFER_CHECK_SUMMARY':check_summary,
              'FUNCTION_SEMANTIC_STRING_SUMMARY':semantic,
              'IMPORTANT_INTERPRETATION':'R133 is targeted offline static analysis. A recovered report ID, length, or response byte in the tool is not production protocol proof and does not authorize transmission.',
              'READ_ONLY_IDENTIFY_PATH_STATICALLY_PROVEN_FOR_PRODUCTION':False,
              'SAFE_READ_ONLY_STOCK_BACKUP_PROVEN':False,
              'PRODUCTION_BOOTSTRAP_BRIDGE_PROVEN':False,
              'PRODUCTION_RECOVERY_USB_IDENTITY_PROVEN':False,
              'ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD':False,
              'AA55_LIVE_RETEST_ALLOWED':False,
              'RUNTIME_0X11_ALLOWED':False,
              'RUNTIME_0XFE_ALLOWED':False,
              'VENDOR_BINARY_EXECUTED':False,
              'USB_DEVICE_ACCESSED':False,
              'BOARD_CONTACTED':False,
              'FLASH_ALLOWED':False,
              'NEXT':'Use the exact report-ID/buffer initialization and response offsets to determine whether these three calls are descriptor/status reads, updater handshake reads, or identify/version reads. Keep all live transmission blocked. If no production identity linkage is established, close PCTools as a safe production read-only route.'
          }
          (ev/'R133_DECISION.json').write_text(json.dumps(decision,indent=2,ensure_ascii=False)+'\n')
          report=[
              '# R133 PCTools GetInputReport Report-ID/response static reverse','',
              f'- targets analyzed: {len(rows)}',
              f'- all derived lengths are 0x101: {decision["ALL_TARGET_LENGTHS_0X101"]}',
              f'- immediate Report-ID writes proven: {len(id_proven)}','',
              '## Safety','- Offline static only.','- No vendor EXE executed.','- No USB/board access.',
              '- AA55 / 0x11 / 0xFE / erase / program / flash remain blocked.','- FLASH_ALLOWED=NO']
          (ev/'R133_REPORT_TH.md').write_text('\n'.join(report)+'\n')
          print(json.dumps(decision,indent=2,ensure_ascii=False))
          PY

      - name: Package R133 evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r133/evidence
          zip -9 -r /tmp/R133_EXACT_PCTOOLS_GETINPUTREPORT_REPORTID_RESPONSE_STATIC_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/R133_EXACT_PCTOOLS_GETINPUTREPORT_REPORTID_RESPONSE_STATIC_EVIDENCE.zip > /tmp/R133_EXACT_PCTOOLS_GETINPUTREPORT_REPORTID_RESPONSE_STATIC_EVIDENCE.zip.sha256

      - name: Upload R133 evidence
        uses: actions/upload-artifact@v4
        with:
          name: R133-EXACT-PCTOOLS-GETINPUTREPORT-REPORTID-RESPONSE-STATIC-EVIDENCE
          path: |
            /tmp/R133_EXACT_PCTOOLS_GETINPUTREPORT_REPORTID_RESPONSE_STATIC_EVIDENCE.zip
            /tmp/R133_EXACT_PCTOOLS_GETINPUTREPORT_REPORTID_RESPONSE_STATIC_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'R133_VENDOR_BINARY_EXECUTED=NO' /tmp/r133/evidence/R133_SAFETY.txt
          grep -F 'R133_USB_DEVICE_ACCESS=NO' /tmp/r133/evidence/R133_SAFETY.txt
          grep -F 'R133_BOARD_CONTACT=NO' /tmp/r133/evidence/R133_SAFETY.txt
          grep -F 'R133_AA55_SENT=NO' /tmp/r133/evidence/R133_SAFETY.txt
          grep -F 'R133_RUNTIME_0X11_SENT=NO' /tmp/r133/evidence/R133_SAFETY.txt
          grep -F 'R133_RUNTIME_0XFE_SENT=NO' /tmp/r133/evidence/R133_SAFETY.txt
          grep -F '"FLASH_ALLOWED": false' /tmp/r133/evidence/R133_DECISION.json
          echo R133_TARGETED_STATIC_REVERSE_COMPLETE=YES
          echo FLASH_ALLOWED=NO
