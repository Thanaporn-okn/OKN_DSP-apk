name: OKN BP1048P4 MASTER V22 DIRECT AUTH METHOD ORACLE VALIDATION

"on":
  workflow_dispatch:

permissions:
  contents: read

env:
  GOLOPINE_WINDOWS_URL: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-08.exe_.zip"
  EXPECTED_VENDOR_SHA256: "3CA54171C53F7BADD963FFE6851B8B3E2FAF8AEE8BA2AFCB7040990E22AE09B2"
  LIVE_DSP_CONNECTED: "NO"
  USB_TARGET_ACCESS: "NO"
  HOST_TO_DSP_IO: "NO"
  REAL_HID_OBJECT_ALLOWED: "NO"
  REAL_HID_CONNECT_ALLOWED: "NO"
  REAL_HID_SEND_ALLOWED: "NO"
  REAL_HID_READ_ALLOWED: "NO"
  REAL_HID_WRITE_ALLOWED: "NO"
  FEATURE_REPORT_ALLOWED: "NO"
  FLASH_ALLOWED: "NO"
  ERASE_ALLOWED: "NO"
  WRITE_ALLOWED: "NO"

jobs:
  master-v22:
    name: Validate private yEA auth method against parser oracle OFFLINE
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Safety gate and workspace
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          foreach($n in @(
            "LIVE_DSP_CONNECTED","USB_TARGET_ACCESS","HOST_TO_DSP_IO",
            "REAL_HID_OBJECT_ALLOWED","REAL_HID_CONNECT_ALLOWED",
            "REAL_HID_SEND_ALLOWED","REAL_HID_READ_ALLOWED","REAL_HID_WRITE_ALLOWED",
            "FEATURE_REPORT_ALLOWED","FLASH_ALLOWED","ERASE_ALLOWED","WRITE_ALLOWED"
          )){
            if((Get-Item "Env:$n").Value -ne "NO"){ throw "$n must remain NO" }
          }

          $root="C:\okn_v22"
          if(Test-Path $root){ Remove-Item -Recurse -Force $root }
          New-Item -ItemType Directory -Force -Path `
            "$root\download","$root\pkg","$root\harness","$root\evidence","$root\out" | Out-Null

          @"
          MODE=OFFLINE_DIRECT_PRIVATE_AUTH_METHOD_ORACLE_VALIDATION
          V21_RESULT=STATIC_BODIES_PROTECTED_OR_STUBBED
          TARGET_PRIVATE_METHOD=yEA33sF0N1
          TARGET_PARSER=FBL3HEmTva
          BASELINE_CHALLENGE=D024E38C410000004202B94C65A23F2C640C8F60E133784C7E47463A7A521056
          EXPECTED_BASELINE_PARSER_WRITE=3A5BADF3
          LIVE_DSP_CONNECTED=NO
          USB_TARGET_ACCESS=NO
          HOST_TO_DSP_IO=NO
          REAL_HID_IO=NO
          FEATURE_REPORT_ALLOWED=NO
          FLASH_ALLOWED=NO
          "@ | Set-Content "$root\evidence\00_V22_SAFETY_AND_INPUT.txt"

      - name: Acquire exact official vendor binary and pin SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v22"

          curl.exe -fL --retry 6 --retry-all-errors --retry-delay 2 `
            --connect-timeout 20 --max-time 300 `
            $env:GOLOPINE_WINDOWS_URL -o "$root\download\vendor.zip"
          if($LASTEXITCODE -ne 0){ throw "vendor download failed" }

          Expand-Archive -Force "$root\download\vendor.zip" "$root\pkg"

          $exe=Get-ChildItem "$root\pkg" -Recurse -File -Filter *.exe |
            Where-Object {$_.FullName -notmatch '\\__MACOSX\\' -and $_.Name -notlike '._*'} |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if(-not $exe){ throw "vendor EXE missing" }
          Copy-Item $exe.FullName "$root\vendor.exe" -Force

          $sha=(Get-FileHash "$root\vendor.exe" -Algorithm SHA256).Hash.ToUpperInvariant()
          if($sha -ne $env:EXPECTED_VENDOR_SHA256){
            throw "official vendor EXE hash changed: $sha"
          }

          @"
          SHA256=$sha
          BYTES=$((Get-Item "$root\vendor.exe").Length)
          ORIGINAL_BINARY_MODIFIED=NO
          VENDOR_UI_EXECUTED=NO
          "@ | Set-Content "$root\evidence\01_VENDOR_IDENTITY.txt"

      - name: Build x86 direct auth oracle probe
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v22"

          @'
          using System;
          using System.IO;
          using System.Linq;
          using System.Reflection;
          using System.Reflection.Emit;
          using System.Runtime.CompilerServices;
          using System.Runtime.InteropServices;
          using System.Collections.Generic;
          using System.Threading;

          public static class CaptureSink
          {
              public static readonly List<byte[]> Writes=new List<byte[]>();

              public static void Clear()
              {
                  lock(Writes){ Writes.Clear(); }
              }

              public static void Record(byte[] b)
              {
                  lock(Writes)
                  {
                      Writes.Add(b==null ? null : (byte[])b.Clone());
                  }
              }

              public static byte[][] Snapshot()
              {
                  lock(Writes)
                  {
                      return Writes.Select(x=>x==null?null:(byte[])x.Clone()).ToArray();
                  }
              }
          }

          public class Probe
          {
              static string OutPath;

              static readonly string BASELINE_HEX=
                  "D024E38C410000004202B94C65A23F2C640C8F60E133784C7E47463A7A521056";

              static void Log(string s)
              {
                  Console.WriteLine(s);
                  File.AppendAllText(OutPath,s+Environment.NewLine);
              }

              static string Hex(byte[] b)
              {
                  if(b==null)return "<NULL>";
                  return BitConverter.ToString(b).Replace("-","");
              }

              static byte[] FromHex(string s)
              {
                  byte[] b=new byte[s.Length/2];
                  for(int i=0;i<b.Length;i++)
                      b[i]=Convert.ToByte(s.Substring(i*2,2),16);
                  return b;
              }

              static object InvokeBounded(
                  MethodInfo m,object target,object[] args,int timeoutMs,string label)
              {
                  object result=null;
                  Exception error=null;
                  Thread th=new Thread(delegate(){
                      try{ result=m.Invoke(target,args); }
                      catch(Exception ex){ error=ex; }
                  });
                  th.IsBackground=true;
                  th.Start();

                  if(!th.Join(timeoutMs))
                  {
                      Log(label+"_TIMEOUT_MS="+timeoutMs);
                      try{ th.Abort(); }catch{}
                      return null;
                  }

                  if(error!=null) throw error;
                  return result;
              }

              static void EmitDefaultReturn(ILGenerator il,Type ret)
              {
                  if(ret==typeof(void)){ il.Emit(OpCodes.Ret); return; }
                  if(ret.IsValueType)
                  {
                      LocalBuilder loc=il.DeclareLocal(ret);
                      il.Emit(OpCodes.Ldloca_S,loc);
                      il.Emit(OpCodes.Initobj,ret);
                      il.Emit(OpCodes.Ldloc,loc);
                      il.Emit(OpCodes.Ret);
                      return;
                  }
                  il.Emit(OpCodes.Ldnull);
                  il.Emit(OpCodes.Ret);
              }

              static MethodAttributes Visibility(MethodInfo m)
              {
                  MethodAttributes a=MethodAttributes.Virtual|MethodAttributes.HideBySig;
                  if(m.IsPublic)a|=MethodAttributes.Public;
                  else if(m.IsFamily)a|=MethodAttributes.Family;
                  else if(m.IsFamilyOrAssembly)a|=MethodAttributes.FamORAssem;
                  else if(m.IsAssembly)a|=MethodAttributes.Assembly;
                  else a|=MethodAttributes.Private;
                  if(m.IsSpecialName)a|=MethodAttributes.SpecialName;
                  return a;
              }

              static Type BuildCaptureStream(Type baseType)
              {
                  AssemblyName an=new AssemblyName("OKN_V22_CAPTURE_STREAM");
                  AssemblyBuilder ab=AppDomain.CurrentDomain.DefineDynamicAssembly(
                      an,AssemblyBuilderAccess.Run);
                  ModuleBuilder mb=ab.DefineDynamicModule("main");
                  TypeBuilder tb=mb.DefineType(
                      "OKN.CaptureDeviceCommunicationStream",
                      TypeAttributes.Public|TypeAttributes.Class,
                      baseType
                  );

                  ConstructorInfo bc=baseType.GetConstructor(
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance,
                      null,Type.EmptyTypes,null
                  );
                  if(bc==null)
                      throw new Exception("DeviceCommunicationStream parameterless ctor missing");

                  ConstructorBuilder cb=tb.DefineConstructor(
                      MethodAttributes.Public,CallingConventions.Standard,Type.EmptyTypes
                  );
                  ILGenerator ci=cb.GetILGenerator();
                  ci.Emit(OpCodes.Ldarg_0);
                  ci.Emit(OpCodes.Call,bc);
                  ci.Emit(OpCodes.Ret);

                  MethodInfo[] selected=baseType.GetMethods(
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance
                  ).Where(m =>
                      m.IsVirtual && !m.IsFinal &&
                      (m.IsAbstract ||
                       m.Name=="Write" || m.Name=="WriteLine" ||
                       m.Name=="ReadBytes" || m.Name=="ReadLine" ||
                       m.Name=="Connect" || m.Name=="Disconnect")
                  ).GroupBy(m=>m.ToString()).Select(g=>g.First()).ToArray();

                  foreach(MethodInfo m in selected)
                  {
                      Type[] ps=m.GetParameters().Select(x=>x.ParameterType).ToArray();
                      MethodBuilder b=tb.DefineMethod(
                          m.Name,Visibility(m),m.ReturnType,ps);
                      ILGenerator il=b.GetILGenerator();

                      if(m.Name=="Write" && ps.Length==1 && ps[0]==typeof(byte[]))
                      {
                          il.Emit(OpCodes.Ldarg_1);
                          il.Emit(OpCodes.Call,
                              typeof(CaptureSink).GetMethod(
                                  "Record",BindingFlags.Public|BindingFlags.Static));
                          EmitDefaultReturn(il,m.ReturnType);
                      }
                      else
                      {
                          EmitDefaultReturn(il,m.ReturnType);
                      }

                      tb.DefineMethodOverride(b,m);
                  }

                  return tb.CreateType();
              }

              static void SetConnected(object stream,Type baseType)
              {
                  Type et=baseType.GetNestedType(
                      "ConnectionStatus",
                      BindingFlags.Public|BindingFlags.NonPublic);
                  if(et==null || !et.IsEnum)
                      throw new Exception("ConnectionStatus enum missing");

                  object connected=Enum.Parse(et,"Connected");

                  FieldInfo f=baseType.GetFields(
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance
                  ).FirstOrDefault(x=>x.FieldType==et);

                  if(f!=null)
                  {
                      f.SetValue(stream,connected);
                      return;
                  }

                  MethodInfo up=baseType.GetMethod(
                      "UpdateDeviceConnStatus",
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance);
                  if(up!=null)
                  {
                      up.Invoke(stream,new object[]{connected});
                      return;
                  }

                  throw new Exception("cannot set fake stream connected");
              }

              static object NewPreparedBridge(
                  Type baseType,Type captureType,Type bridgeType,out object stream)
              {
                  stream=Activator.CreateInstance(captureType);
                  SetConnected(stream,baseType);

                  ConstructorInfo bc=bridgeType.GetConstructor(new[]{baseType});
                  if(bc==null)throw new Exception("UFEcommandBridge ctor missing");
                  object bridge=bc.Invoke(new[]{stream});

                  MethodInfo req=bridgeType.GetMethod(
                      "SendDevTypeSwVersAuthenRequest",
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance);
                  if(req==null)throw new Exception("startup helper missing");

                  CaptureSink.Clear();
                  InvokeBounded(req,bridge,null,1500,"STARTUP");
                  Thread.Sleep(80);
                  CaptureSink.Clear();
                  return bridge;
              }

              static byte[] ParserOracle(
                  Type baseType,Type captureType,Type bridgeType,byte[] data,string tag)
              {
                  object stream;
                  object bridge=NewPreparedBridge(
                      baseType,captureType,bridgeType,out stream);

                  MethodInfo fbl=bridgeType.GetMethod(
                      "FBL3HEmTva",
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance);
                  if(fbl==null)throw new Exception("FBL3HEmTva missing");

                  CaptureSink.Clear();
                  InvokeBounded(
                      fbl,bridge,new object[]{stream,(byte[])data.Clone(),EventArgs.Empty},
                      2500,tag+"_FBL");
                  Thread.Sleep(120);

                  byte[][] w=CaptureSink.Snapshot();
                  Log(tag+"_PARSER_WRITE_COUNT="+w.Length);
                  for(int i=0;i<w.Length;i++)
                      Log(tag+"_PARSER_WRITE_"+i+"="+Hex(w[i]));
                  return w.Length>0?w[0]:null;
              }

              static int? DirectOracle(
                  Type baseType,Type captureType,Type bridgeType,byte[] data,string tag)
              {
                  object stream;
                  object bridge=NewPreparedBridge(
                      baseType,captureType,bridgeType,out stream);

                  MethodInfo yea=bridgeType.GetMethod(
                      "yEA33sF0N1",
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance);
                  if(yea==null)throw new Exception("yEA33sF0N1 missing");

                  if(yea.ReturnType!=typeof(int))
                      throw new Exception("yEA33sF0N1 return type changed");
                  ParameterInfo[] pp=yea.GetParameters();
                  if(pp.Length!=1 || pp[0].ParameterType!=typeof(byte[]))
                      throw new Exception("yEA33sF0N1 signature changed");

                  object r=InvokeBounded(
                      yea,bridge,new object[]{(byte[])data.Clone()},
                      2500,tag+"_YEA");
                  if(r==null)return null;

                  int v=(int)r;
                  byte[] le=BitConverter.GetBytes(v);
                  byte[] be=(byte[])le.Clone();
                  Array.Reverse(be);

                  Log(tag+"_DIRECT_INT_SIGNED="+v);
                  Log(tag+"_DIRECT_INT_HEX="+unchecked((uint)v).ToString("X8"));
                  Log(tag+"_DIRECT_BYTES_LE="+Hex(le));
                  Log(tag+"_DIRECT_BYTES_BE="+Hex(be));
                  return v;
              }

              static void DumpMethodRuntime(MethodInfo m,string tag)
              {
                  try
                  {
                      byte[] il=null;
                      MethodBody b=m.GetMethodBody();
                      if(b!=null)il=b.GetILAsByteArray();
                      Log(tag+"_METADATA_TOKEN=0x"+m.MetadataToken.ToString("X8"));
                      Log(tag+"_DECLARING_TYPE="+m.DeclaringType.FullName);
                      Log(tag+"_RAW_IL="+Hex(il));

                      RuntimeHelpers.PrepareMethod(m.MethodHandle);
                      IntPtr p=m.MethodHandle.GetFunctionPointer();
                      Log(tag+"_FUNCTION_PTR=0x"+p.ToInt64().ToString("X"));

                      byte[] native=new byte[128];
                      Marshal.Copy(p,native,0,native.Length);
                      Log(tag+"_NATIVE128="+Hex(native));
                  }
                  catch(Exception ex)
                  {
                      Log(tag+"_RUNTIME_DUMP_EXCEPTION="+ex.GetBaseException());
                  }
              }

              static byte[] DeterministicVector(int idx)
              {
                  byte[] b=new byte[32];

                  if(idx==0)
                      return FromHex(BASELINE_HEX);
                  if(idx==1)
                      return b;
                  if(idx==2)
                  {
                      for(int i=0;i<32;i++)b[i]=0xFF;
                      return b;
                  }
                  if(idx==3)
                  {
                      for(int i=0;i<32;i++)b[i]=(byte)i;
                      return b;
                  }
                  if(idx==4)
                  {
                      for(int i=0;i<32;i++)b[i]=(byte)(31-i);
                      return b;
                  }

                  uint s=unchecked(0xA5C31E27u + (uint)idx*0x9E3779B9u);
                  for(int i=0;i<32;i++)
                  {
                      s=unchecked(s*1664525u+1013904223u);
                      b[i]=(byte)(s>>24);
                  }
                  return b;
              }

              static string MatchEndian(int v,byte[] parser)
              {
                  if(parser==null || parser.Length!=4)return "NONE";

                  byte[] le=BitConverter.GetBytes(v);
                  byte[] be=(byte[])le.Clone();
                  Array.Reverse(be);

                  if(parser.SequenceEqual(le))return "LE";
                  if(parser.SequenceEqual(be))return "BE";
                  return "NONE";
              }

              public static void Main(string[] args)
              {
                  string exe=Path.GetFullPath(args[0]);
                  OutPath=Path.GetFullPath(args[1]);
                  File.WriteAllText(OutPath,"");
                  Directory.SetCurrentDirectory(Path.GetDirectoryName(exe));

                  Log("MODE=OFFLINE_V22_DIRECT_AUTH_METHOD_ORACLE_VALIDATION");
                  Log("REAL_HID_OBJECT_CREATED=NO");
                  Log("REAL_HID_CONNECT_INVOKED=NO");
                  Log("REAL_HID_SEND_INVOKED=NO");
                  Log("REAL_HID_READ_INVOKED=NO");
                  Log("REAL_HID_WRITE_INVOKED=NO");
                  Log("HOST_TO_DSP_IO=NO");
                  Log("FEATURE_REPORT_INVOKED=NO");
                  Log("FLASH_ALLOWED=NO");

                  try
                  {
                      Assembly asm=Assembly.LoadFile(exe);
                      RuntimeHelpers.RunModuleConstructor(asm.ManifestModule.ModuleHandle);
                      Log("MODULE_INITIALIZER=SUCCESS");

                      Type baseType=asm.GetType(
                          "DSTech_AudioDSP_Client.DeviceCommunicationStream",true);
                      Type bridgeType=asm.GetType(
                          "DSTech_AudioDSP_Client.UFEcommandBridge",true);
                      Type captureType=BuildCaptureStream(baseType);

                      MethodInfo yea=bridgeType.GetMethod(
                          "yEA33sF0N1",
                          BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance);
                      MethodInfo fbl=bridgeType.GetMethod(
                          "FBL3HEmTva",
                          BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance);

                      DumpMethodRuntime(yea,"YEA_PRE");
                      DumpMethodRuntime(fbl,"FBL_PRE");

                      int total=16;
                      int directValid=0;
                      int parserValid=0;
                      int leMatch=0;
                      int beMatch=0;
                      int noMatch=0;

                      for(int i=0;i<total;i++)
                      {
                          string tag="CASE_"+i.ToString("D2");
                          byte[] v=DeterministicVector(i);
                          Log(tag+"_INPUT_HEX="+Hex(v));

                          int? direct=null;
                          byte[] parser=null;

                          try
                          {
                              direct=DirectOracle(
                                  baseType,captureType,bridgeType,v,tag);
                              if(direct.HasValue)directValid++;
                          }
                          catch(Exception ex)
                          {
                              Log(tag+"_DIRECT_EXCEPTION="+ex.GetBaseException());
                          }

                          try
                          {
                              parser=ParserOracle(
                                  baseType,captureType,bridgeType,v,tag);
                              if(parser!=null && parser.Length==4)parserValid++;
                          }
                          catch(Exception ex)
                          {
                              Log(tag+"_PARSER_EXCEPTION="+ex.GetBaseException());
                          }

                          string m="NONE";
                          if(direct.HasValue)m=MatchEndian(direct.Value,parser);

                          Log(tag+"_DIRECT_PARSER_ENDIAN_MATCH="+m);
                          if(m=="LE")leMatch++;
                          else if(m=="BE")beMatch++;
                          else noMatch++;
                      }

                      // Re-run the exact same baseline repeatedly to distinguish a
                      // deterministic transform from hidden mutable state.
                      List<string> repeated=new List<string>();
                      for(int i=0;i<8;i++)
                      {
                          int? x=DirectOracle(
                              baseType,captureType,bridgeType,
                              FromHex(BASELINE_HEX),"REPEAT_"+i.ToString("D2"));
                          repeated.Add(x.HasValue
                              ? unchecked((uint)x.Value).ToString("X8")
                              : "<NULL>");
                      }

                      DumpMethodRuntime(yea,"YEA_POST");
                      DumpMethodRuntime(fbl,"FBL_POST");

                      Log("SUMMARY_TOTAL_CASES="+total);
                      Log("SUMMARY_DIRECT_VALID="+directValid);
                      Log("SUMMARY_PARSER_VALID="+parserValid);
                      Log("SUMMARY_LE_MATCH="+leMatch);
                      Log("SUMMARY_BE_MATCH="+beMatch);
                      Log("SUMMARY_NO_MATCH="+noMatch);
                      Log("SUMMARY_REPEAT_DIRECT="+String.Join(",",repeated.ToArray()));
                      Log("PROBE_COMPLETE=true");
                  }
                  catch(Exception ex)
                  {
                      Log("TOP_EXCEPTION="+ex.ToString());
                      Log("PROBE_COMPLETE=false");
                  }

                  Environment.Exit(0);
              }
          }
          '@ | Set-Content "$root\harness\Probe.cs"

          $csc="$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          if(-not(Test-Path $csc)){ throw "x86 csc missing" }

          & $csc /nologo /platform:x86 /target:exe `
            /out:"$root\harness\Probe.exe" "$root\harness\Probe.cs"
          if($LASTEXITCODE -ne 0){ throw "Probe compile failed" }

      - name: Static safety audit
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v22"
          $s=Get-Content "$root\harness\Probe.cs" -Raw

          foreach($bad in @(
            "HidD_SetOutputReport(","HidD_GetInputReport(",
            "HidD_SetFeature(","HidD_GetFeature(",
            "ReadFile(","WriteFile(","CreateFileW("
          )){
            if($s.Contains($bad)){ throw "native/real HID call forbidden: $bad" }
          }

          foreach($required in @(
            "yEA33sF0N1","FBL3HEmTva","BuildCaptureStream",
            "REAL_HID_OBJECT_CREATED=NO","HOST_TO_DSP_IO=NO",
            "D024E38C410000004202B94C65A23F2C640C8F60E133784C7E47463A7A521056"
          )){
            if(-not $s.Contains($required)){ throw "required V22 marker missing: $required" }
          }

          "STATIC_SAFETY_AUDIT=PASS" |
            Set-Content "$root\evidence\02_STATIC_SAFETY_AUDIT.txt"

      - name: Run private method and parser oracle comparison
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v22"

          $p=Start-Process `
            -FilePath "$root\harness\Probe.exe" `
            -ArgumentList @("$root\vendor.exe","$root\evidence\03_V22_ORACLE.txt") `
            -WorkingDirectory $root `
            -RedirectStandardOutput "$root\evidence\03A_V22_STDOUT.txt" `
            -RedirectStandardError "$root\evidence\03B_V22_STDERR.txt" `
            -PassThru

          if(-not $p.WaitForExit(240000)){
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw "V22 oracle probe timed out"
          }

          if(-not(Test-Path "$root\evidence\03_V22_ORACLE.txt")){
            throw "V22 evidence missing"
          }

          $ev=Get-Content "$root\evidence\03_V22_ORACLE.txt" -Raw
          if($ev -notmatch 'PROBE_COMPLETE=true'){
            throw "V22 probe incomplete"
          }

          Get-Content "$root\evidence\03_V22_ORACLE.txt"

      - name: Derive V22 decision
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v22"

          @'
          from pathlib import Path
          import json,re

          ev=Path(r"C:\okn_v22\evidence")
          lines=(ev/"03_V22_ORACLE.txt").read_text(errors="ignore").splitlines()

          def one(prefix):
              for line in lines:
                  if line.startswith(prefix+"="):
                      return line.split("=",1)[1]
              return None

          total=int(one("SUMMARY_TOTAL_CASES") or -1)
          direct_valid=int(one("SUMMARY_DIRECT_VALID") or -1)
          parser_valid=int(one("SUMMARY_PARSER_VALID") or -1)
          le=int(one("SUMMARY_LE_MATCH") or 0)
          be=int(one("SUMMARY_BE_MATCH") or 0)
          no=int(one("SUMMARY_NO_MATCH") or 0)
          repeats=(one("SUMMARY_REPEAT_DIRECT") or "").split(",")

          case0_parser=one("CASE_00_PARSER_WRITE_0")
          case0_direct=one("CASE_00_DIRECT_INT_HEX")
          case0_match=one("CASE_00_DIRECT_PARSER_ENDIAN_MATCH")

          deterministic=(
              len(repeats)==8 and
              all(x and x!="<NULL>" for x in repeats) and
              len(set(repeats))==1
          )

          endian=None
          exact=False
          if total==16 and direct_valid==16 and parser_valid==16 and no==0:
              if le==16 and be==0:
                  endian="LE"
                  exact=True
              elif be==16 and le==0:
                  endian="BE"
                  exact=True

          baseline_parser_ok=(case0_parser=="3A5BADF3")
          direct_method_oracle_proven=(
              exact and deterministic and baseline_parser_ok
          )

          if direct_method_oracle_proven:
              status="DIRECT_YEA_AUTH_TRANSFORM_PROVEN_AGAINST_16_PARSER_VECTORS"
              nxt="LIFT_OR_PORT_YEA_RUNTIME_TRANSFORM_OFFLINE_AND_VALIDATE_1000_ORACLE_VECTORS"
          elif direct_valid==16 and deterministic and not exact:
              status="YEA_IS_CALLABLE_AND_DETERMINISTIC_BUT_NOT_THE_COMPLETE_PARSER_REPLY_TRANSFORM"
              nxt="TRACE_RUNTIME_CALLERS_AND_CAPTURE_INTERMEDIATE_AUTH_VALUES_OFFLINE"
          else:
              status="DIRECT_YEA_ORACLE_NOT_YET_PROVEN"
              nxt="RUNTIME_TRACE_PROTECTED_AUTH_PATH_OFFLINE"

          model={
              "revision":"MASTER-V22",
              "classification":"OFFLINE_AUTH_ORACLE_VALIDATION_NOT_FOR_FLASH",
              "total_cases":total,
              "direct_valid":direct_valid,
              "parser_valid":parser_valid,
              "little_endian_matches":le,
              "big_endian_matches":be,
              "no_matches":no,
              "selected_endian":endian,
              "repeat_outputs":repeats,
              "direct_method_deterministic":deterministic,
              "baseline_parser_output":case0_parser,
              "baseline_direct_int_hex":case0_direct,
              "baseline_direct_parser_match":case0_match,
              "baseline_parser_expected":"3A5BADF3",
              "baseline_parser_ok":baseline_parser_ok,
              "direct_method_oracle_proven":direct_method_oracle_proven,
              "real_hid_invoked":False,
              "host_to_dsp_io":False,
              "feature_report_invoked":False,
              "flash_allowed":False,
              "status":status,
              "next":nxt
          }

          (ev/"04_V22_MODEL.json").write_text(json.dumps(model,indent=2)+"\n")

          md=f"""# MASTER V22 FINAL DECISION

          - Private yEA method callable: **{direct_valid} / {total}**
          - Parser oracle valid: **{parser_valid} / {total}**
          - LE matches: **{le} / {total}**
          - BE matches: **{be} / {total}**
          - No matches: **{no} / {total}**
          - Baseline parser reply: **{case0_parser}**
          - Expected baseline parser reply: **3A5BADF3**
          - Repeated direct baseline deterministic: **{deterministic}**
          - Direct yEA transform proven against parser: **{direct_method_oracle_proven}**
          - Real HID invoked: **NO**
          - Host-to-DSP I/O: **NO**
          - Feature report invoked: **NO**
          - Flash allowed: **NO**

          Status: **{status}**

          Next: **{nxt}**

          Classification: **OFFLINE_AUTH_ORACLE_VALIDATION_NOT_FOR_FLASH**
          """
          (ev/"05_V22_FINAL_DECISION.md").write_text(md)
          print(md)
          '@ | Set-Content "$root\derive.py"

          python "$root\derive.py"
          if($LASTEXITCODE -ne 0){ throw "V22 derive failed" }

          Get-Content "$root\evidence\05_V22_FINAL_DECISION.md" >> $env:GITHUB_STEP_SUMMARY

      - name: Package evidence
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v22"

          Copy-Item "$root\evidence\*" "$root\out\" -Force

          if(Test-Path "$root\out\vendor.exe"){ throw "vendor EXE leak" }
          if(Test-Path "$root\out\Probe.exe"){ throw "probe EXE leak" }

          Get-ChildItem "$root\out" -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content "$root\out\SHA256SUMS.txt"

      - name: Upload V22 evidence
        uses: actions/upload-artifact@v7
        with:
          name: OKN-BP1048P4-MASTER-V22-DIRECT-AUTH-METHOD-ORACLE-VALIDATION-EVIDENCE
          path: C:\okn_v22\out\*
          if-no-files-found: error
          retention-days: 90

      - name: Final fail closed assertion
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v22"

          foreach($n in @(
            "LIVE_DSP_CONNECTED","USB_TARGET_ACCESS","HOST_TO_DSP_IO",
            "REAL_HID_OBJECT_ALLOWED","REAL_HID_CONNECT_ALLOWED",
            "REAL_HID_SEND_ALLOWED","REAL_HID_READ_ALLOWED","REAL_HID_WRITE_ALLOWED",
            "FEATURE_REPORT_ALLOWED","FLASH_ALLOWED","ERASE_ALLOWED","WRITE_ALLOWED"
          )){
            if((Get-Item "Env:$n").Value -ne "NO"){ throw "$n changed" }
          }

          $d=Get-Content "$root\evidence\04_V22_MODEL.json" -Raw | ConvertFrom-Json
          if($d.real_hid_invoked -ne $false){ throw "bad HID state" }
          if($d.host_to_dsp_io -ne $false){ throw "bad host-to-DSP state" }
          if($d.feature_report_invoked -ne $false){ throw "bad feature state" }
          if($d.flash_allowed -ne $false){ throw "bad flash state" }

          "MASTER_V22=PASS"
          "REAL_HID_IO=NO"
          "HOST_TO_DSP_IO=NO"
          "FEATURE_REPORT=NO"
          "FLASH_ALLOWED=NO"
