name: R36 ZIP Andes compile

on:
  workflow_dispatch:

jobs:
  unpack-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate and unpack R36 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="OKN_BP1048P4_PHASE3_TRUE7CH_Source_R36.zip"
          test -f "$ZIP"
          rm -rf /tmp/r36src
          mkdir -p /tmp/r36src
          unzip -q "$ZIP" -d /tmp/r36src
          ROOT="$(find /tmp/r36src -mindepth 1 -maxdepth 1 -type d -name 'OKN_BP1048P4_PHASE3_TRUE7CH_R36' | head -n1)"
          test -n "$ROOT"
          echo "R36_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Host R36 tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$R36_ROOT"
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ifirmware/include \
            firmware/src/okn_gain7.c \
            firmware/src/okn_ufe_gain7.c \
            firmware/src/okn_r36_sdk_bridge.c \
            tests/test_r36_bridge.c -o /tmp/r36_bridge
          /tmp/r36_bridge
          python3 tools/check_r36_experimental_guard.py

      - name: Install 32-bit runtime
        run: sudo apt-get update && sudo apt-get install -y libc6-i386 lib32z1 git

      - name: Fetch pinned public BP1048 SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/leadercxn/bp1048_sdk_v0.1.12.git /tmp/bp1048
          cd /tmp/bp1048
          git checkout 8105bd864b04995d81c9f9ae77cb158259f39015
          test "$(git rev-parse HEAD)" = "8105bd864b04995d81c9f9ae77cb158259f39015"

      - name: Fetch Andes NDS32 toolchain
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Ai-Thinker-Open/Andestech.git /tmp/andes
          echo "/tmp/andes/BSPv422/toolchains/nds32le-elf-mculib-v3s/bin" >> "$GITHUB_PATH"

      - name: Verify pinned SDK inputs and select BP1048P4
        shell: bash
        run: |
          set -euo pipefail
          cd "$R36_ROOT"
          python3 experimental_r36/scripts/check_sdk_files.py /tmp/bp1048
          python3 experimental_r36/scripts/enable_bp1048p4.py /tmp/bp1048

      - name: Verify toolchain
        run: nds32le-elf-gcc --version

      - name: Compile R36 bridge for NDS32 against real SDK headers
        shell: bash
        run: |
          set -euo pipefail
          cd "$R36_ROOT"
          SDK=/tmp/bp1048
          CC=nds32le-elf-gcc
          : > /tmp/r36_includes.rsp
          find "$SDK" -type f -name '*.h' -printf '%h\n' | sort -u | while read -r d; do
            printf '%s\n' "-I$d" >> /tmp/r36_includes.rsp
          done
          printf '%s\n' "-I$R36_ROOT/firmware/include" >> /tmp/r36_includes.rsp
          COMMON=(-Os -mcmodel=medium -mcpu=d1088-spu -mext-dsp -mext-zol -ffunction-sections -fdata-sections)
          "$CC" "${COMMON[@]}" @/tmp/r36_includes.rsp -c firmware/src/okn_gain7.c -o /tmp/okn_gain7.o
          "$CC" "${COMMON[@]}" @/tmp/r36_includes.rsp -c firmware/src/okn_ufe_gain7.c -o /tmp/okn_ufe_gain7.o
          "$CC" "${COMMON[@]}" @/tmp/r36_includes.rsp -DOKN_R36_VENDOR_SDK=1 -c firmware/src/okn_r36_sdk_bridge.c -o /tmp/okn_r36_sdk_bridge.o
          nds32le-elf-size /tmp/okn_gain7.o /tmp/okn_ufe_gain7.o /tmp/okn_r36_sdk_bridge.o | tee R36_NDS32_SIZE.txt
          nds32le-elf-nm -C /tmp/okn_r36_sdk_bridge.o | tee R36_NDS32_SYMBOLS.txt
          cp /tmp/okn_gain7.o .
          cp /tmp/okn_ufe_gain7.o .
          cp /tmp/okn_r36_sdk_bridge.o .

      - name: Upload R36 ABI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: R36_NDS32_ABI_OBJECTS
          path: |
            ${{ env.R36_ROOT }}/R36_NDS32_SIZE.txt
            ${{ env.R36_ROOT }}/R36_NDS32_SYMBOLS.txt
            ${{ env.R36_ROOT }}/okn_gain7.o
            ${{ env.R36_ROOT }}/okn_ufe_gain7.o
            ${{ env.R36_ROOT }}/okn_r36_sdk_bridge.o
