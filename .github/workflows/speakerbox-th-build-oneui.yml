          @Composable
          fun SpeakerBoxGraphic(modifier:Modifier=Modifier,compact:Boolean=false,ported:Boolean=true) {
              Canvas(modifier) {
                  val m=min(size.width,size.height); val left=size.width*.15f; val top=size.height*.18f; val w=size.width*.63f; val h=size.height*.62f; val dx=size.width*.12f; val dy=size.height*.08f
                  val front=Path().apply{moveTo(left,top);lineTo(left+w,top);lineTo(left+w,top+h);lineTo(left,top+h);close()}
                  val side=Path().apply{moveTo(left+w,top);lineTo(left+w+dx,top-dy);lineTo(left+w+dx,top+h-dy);lineTo(left+w,top+h);close()}
                  val topP=Path().apply{moveTo(left,top);lineTo(left+dx,top-dy);lineTo(left+w+dx,top-dy);lineTo(left+w,top);close()}
                  drawPath(side,Color(0xFF2A2D33)); drawPath(topP,Color(0xFF4A4E55)); drawPath(front,Color(0xFF34373C))
                  val c=Offset(left+w*.48f,top+h*.52f); val sr=min(w,h)*(if(compact).24f else .31f)
                  drawCircle(Color(0xFF111317),sr,c);drawCircle(Color(0xFF5B6068),sr*.86f,c);drawCircle(Color(0xFF0B0C0E),sr*.66f,c);drawCircle(Color(0xFF292C31),sr*.46f,c);drawCircle(Color(0xFF090A0B),sr*.24f,c)
                  if(ported){drawRoundRect(Color(0xFF0B0B0C),Offset(left+w*.80f,top+h*.20f),Size(w*.11f,h*.60f),cornerRadius=androidx.compose.ui.geometry.CornerRadius(8f,8f))}
              }
          }

