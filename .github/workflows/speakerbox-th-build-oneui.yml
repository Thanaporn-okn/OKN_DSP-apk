          @Composable
          fun ResponseGraph(sp:Speaker,r:DesignResult,modifier:Modifier) {
              Canvas(modifier.clip(RoundedCornerShape(16.dp)).background(CardBg).padding(14.dp)) {
                  val pad=20f; val w=size.width-pad*2; val h=size.height-pad*2
                  repeat(6){i-> val y=pad+h*i/5; drawLine(Line,Offset(pad,y),Offset(pad+w,y),1f)}
                  repeat(7){i-> val x=pad+w*i/6; drawLine(Line,Offset(x,pad),Offset(x,pad+h),1f)}
                  fun response(f:Double,ported:Boolean):Double {
                      val knee=if(ported) (r.fbHz?:35.0) else max(28.0,sp.fs*.85)
                      val low=1.0/(1.0+(knee/f).pow(if(ported)4.0 else 2.2))
                      val high=1.0/(1.0+(f/700.0).pow(1.2))
                      return 55 + 48*low*high
                  }
                  val p1=Path(); val p2=Path()
                  for(i in 0..120){ val t=i/120.0; val f=10*10.0.pow(t*2.0); val x=pad+w*t.toFloat(); val y1=pad+h-(response(f,true)-55).toFloat()/50f*h; val y2=pad+h-(response(f,false)-55).toFloat()/50f*h; if(i==0){p1.moveTo(x,y1);p2.moveTo(x,y2)}else{p1.lineTo(x,y1);p2.lineTo(x,y2)} }
                  drawPath(p2,Color.Gray,style=Stroke(3f,cap=StrokeCap.Round)); drawPath(p1,SamsungBlue,style=Stroke(4f,cap=StrokeCap.Round))
              }
          }

          @Composable
          fun ExcursionGraph(sp:Speaker,r:DesignResult,modifier:Modifier) {
              Canvas(modifier.clip(RoundedCornerShape(16.dp)).background(CardBg).padding(14.dp)) {
                  val pad=20f; val w=size.width-pad*2; val h=size.height-pad*2
                  repeat(6){i-> val y=pad+h*i/5; drawLine(Line,Offset(pad,y),Offset(pad+w,y),1f)}
                  val maxY=max(20.0,sp.xmaxMm*3.5)
                  val xmaxY=pad+h-(sp.xmaxMm/maxY*h).toFloat(); drawLine(Color(0xFFE85A4F),Offset(pad,xmaxY),Offset(pad+w,xmaxY),2f)
                  val path=Path()
                  for(i in 0..120){ val t=i/120.0; val f=10*10.0.pow(t*2.0); val ex=(sp.xmaxMm*2.5/(1+(f/(r.fbHz?:45.0)).pow(2.1)))+0.8; val x=pad+w*t.toFloat(); val y=pad+h-(ex/maxY*h).toFloat(); if(i==0)path.moveTo(x,y) else path.lineTo(x,y)}
                  drawPath(path,SamsungBlue,style=Stroke(4f,cap=StrokeCap.Round))
              }
          }

