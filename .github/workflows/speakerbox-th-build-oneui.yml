                  Column(Modifier.verticalScroll(rememberScrollState()).padding(horizontal=22.dp)) {
                      SectionCardNoOuter("SpeakerBox TH") {
                          Text("เครื่องมือออกแบบตู้ลำโพงรถยนต์และ PA",fontSize=14.sp)
                          Text("เวอร์ชัน 0.2.0 OneUI",color=TextMuted,fontSize=13.sp,modifier=Modifier.padding(top=4.dp))
                      }
                      Spacer(Modifier.height(12.dp))
                      SectionCardNoOuter("หลักการคำนวณ") {
                          Text("ใช้ค่า T/S ของดอก เช่น Fs, Qts, Qes, Vas, Sd, Xmax และ sensitivity เพื่อประมาณปริมาตรตู้ การจูนพอร์ต SPL และแบบตัดไม้",fontSize=14.sp,lineHeight=21.sp)
                      }
                  }
              }
          }

          @Composable
          fun OneUiBottomBar(page:MainPage,onPage:(MainPage)->Unit) {
              NavigationBar(containerColor=Color.White,tonalElevation=0.dp) {
                  listOf(MainPage.HOME to ("⌂" to "ออกแบบ"),MainPage.SPEAKERS to ("◎" to "ดอกลำโพง"),MainPage.INFO to ("▣" to "ข้อมูล")).forEach { (p,pair) ->
                      NavigationBarItem(
                          selected=page==p || (p==MainPage.HOME && page==MainPage.DESIGN),
                          onClick={onPage(p)},
                          icon={Text(pair.first,fontSize=23.sp,fontWeight=FontWeight.Bold)},
                          label={Text(pair.second,fontSize=11.sp)},
                          colors=NavigationBarItemDefaults.colors(selectedIconColor=SamsungBlue,selectedTextColor=SamsungBlue,indicatorColor=Color.Transparent,unselectedIconColor=TextMuted,unselectedTextColor=TextMuted)
                      )
                  }
              }
          }

          fun calculateBox(sp:Speaker,count:Int,wiring:String,boxType:String,fb:Double,wood:Int):DesignResult {
              val totalVas=sp.vasL*count
              val sealedDen=(0.707/sp.qts).pow(2)-1.0
              val sealed=if(sealedDen>0.15) totalVas/sealedDen else totalVas*.65
              val reflex=totalVas*(0.55 + (sp.qts-.30).coerceIn(0.0,.35))
              val vb=if(boxType=="Sealed") sealed.coerceIn(10.0,450.0) else reflex.coerceIn(15.0,650.0)
              val z=if(wiring.startsWith("ขนาน")) sp.ohm.toDouble()/count else sp.ohm.toDouble()*count
              val spl=sp.sensitivityDb + 10*log10(max(1.0,sp.rmsW*count*.55)) + 3*log(count.toDouble(),2.0)
              val driverD=sp.sizeInch*25.4
              var innerH=max(driverD+70.0,cbrt(vb*1_000_000.0/1.45))
              var innerW=innerH*1.28
              var innerD=vb*1_000_000.0/(innerW*innerH)
              innerD=max(innerD,driverD*.72)
              innerW=vb*1_000_000.0/(innerH*innerD)
              fun r5(v:Double)=((v/5.0).roundToInt()*5)
              val ow=r5(innerW+2*wood); val oh=r5(innerH+2*wood); val od=r5(innerD+2*wood)
              val pd=if(boxType=="Bass Reflex") r5(max(90.0,(sp.sizeInch*7.4)*sqrt(count.toDouble()))) else null
              val pl=if(pd!=null){ val dcm=pd/10.0; val lcm=(23562.5*dcm*dcm)/(fb*fb*vb)-0.732*dcm; r5((lcm*10).coerceIn(80.0,650.0)) } else null
              val cuts=listOf(
                  CutPiece("ด้านบน (Top)",ow,od,1),CutPiece("ด้านล่าง (Bottom)",ow,od,1),
                  CutPiece("ด้านหน้า (Front)",ow,oh,1),CutPiece("ด้านหลัง (Back)",ow,oh,1),
                  CutPiece("ด้านซ้าย (Left)",max(1,od-2*wood),oh,1),CutPiece("ด้านขวา (Right)",max(1,od-2*wood),oh,1)
              )
              val area=cuts.sumOf{it.w.toDouble()*it.h*it.qty}; val fraction=(area/(2440.0*1220.0)*1.12).coerceAtLeast(.1)
              return DesignResult(boxType,vb,if(boxType=="Bass Reflex")fb else null,pd,pl,z,spl,ow,oh,od,wood,fraction,cuts)
          }

          fun formatOhm(v:Double)=if(abs(v-v.roundToInt())<.01)v.roundToInt().toString() else "%.1f".format(v)
          EOF

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd generated-app
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify and rename APK
        shell: bash
        run: |
          set -euo pipefail
          APK="generated-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" SpeakerBoxTH-OneUI-debug.apk
          ls -lh SpeakerBoxTH-OneUI-debug.apk
          sha256sum SpeakerBoxTH-OneUI-debug.apk | tee SpeakerBoxTH-OneUI-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpeakerBoxTH-OneUI-debug-apk
          path: |
            SpeakerBoxTH-OneUI-debug.apk
            SpeakerBoxTH-OneUI-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
