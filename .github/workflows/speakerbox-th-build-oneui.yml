name: Build SpeakerBox TH OneUI

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/speakerbox-th-build.yml'
      - '.github/workflows/speakerbox-th-oneui.yml'

permissions:
  contents: read

env:
  APP_NAME: SpeakerBoxTH
  PACKAGE_NAME: com.okn.speakerboxth
  COMPILE_SDK: '35'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-${COMPILE_SDK}" "build-tools;35.0.0" "platform-tools"

      - name: Generate SpeakerBox TH Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf generated-app
          mkdir -p generated-app/app/src/main/java/com/okn/speakerboxth
          mkdir -p generated-app/app/src/main/res/values

          cat > generated-app/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SpeakerBoxTH"
          include(":app")
          EOF

          cat > generated-app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > generated-app/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat > generated-app/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.okn.speakerboxth"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.okn.speakerboxth"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 2
                  versionName = "0.2.0-oneui"
              }

              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }

              packaging {
                  resources.excludes += "/META-INF/{AL2.0,LGPL2.1}"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.10.01")
              implementation(composeBom)
              androidTestImplementation(composeBom)
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF

          cat > generated-app/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="SpeakerBox TH"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.SpeakerBoxTH">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > generated-app/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.SpeakerBoxTH" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#F7F8FA</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:windowLightNavigationBar">true</item>
              </style>
          </resources>
          EOF

          cat > generated-app/app/src/main/java/com/okn/speakerboxth/MainActivity.kt <<'EOF'
          package com.okn.speakerboxth

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.horizontalScroll
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.LazyRow
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.geometry.Size
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.Path
          import androidx.compose.ui.graphics.StrokeCap
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.KeyboardType
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlin.math.*

          private val SamsungBlue = Color(0xFF0A6CF5)
          private val SamsungBlue2 = Color(0xFF287BFF)
          private val Bg = Color(0xFFF6F7F9)
          private val CardBg = Color(0xFFFFFFFF)
          private val Soft = Color(0xFFF0F2F5)
          private val TextMain = Color(0xFF101317)
          private val TextMuted = Color(0xFF6F7782)
          private val Line = Color(0xFFE5E8EC)
          private val Good = Color(0xFF1A9C54)
          private val Warning = Color(0xFFF3A400)

          data class Speaker(
              val brand: String,
              val model: String,
              val sizeInch: Int,
              val type: String,
              val rmsW: Int,
              val ohm: Int,
              val fs: Double,
              val qts: Double,
              val qes: Double,
              val vasL: Double,
              val re: Double,
              val sdCm2: Double,
              val xmaxMm: Double,
              val sensitivityDb: Double,
              val thailand: Boolean = true
          ) { val fullName get() = "$brand $model" }

          data class DesignResult(
              val boxType: String,
              val netVolumeL: Double,
              val fbHz: Double?,
              val portDiameterMm: Int?,
              val portLengthMm: Int?,
              val impedanceOhm: Double,
              val splDb: Double,
              val outerWmm: Int,
              val outerHmm: Int,
              val outerDmm: Int,
              val woodMm: Int,
              val sheetFraction: Double,
              val cutList: List<CutPiece>
          )

          data class CutPiece(val name: String, val w: Int, val h: Int, val qty: Int)
          enum class MainPage { HOME, SPEAKERS, DESIGN, RESULT, INFO }
          enum class ResultTab { SUMMARY, CUT, THREE_D, GRAPH, PORT }

          private val speakers = listOf(
              Speaker("P.Audio", "P150/2226 v3", 15, "Subwoofer", 800, 8, 54.0, .50, .56, 72.45, 5.4, 855.0, 5.5, 97.0),
              Speaker("P.Audio", "SN-15MB", 15, "Mid Bass", 600, 8, 48.0, .33, .36, 96.0, 5.3, 855.0, 5.0, 98.0),
              Speaker("Eminence", "Kappa Pro-15A", 15, "Woofer", 500, 8, 39.0, .38, .41, 117.0, 5.1, 856.0, 4.8, 101.0),
              Speaker("Eminence", "Delta-12A", 12, "Woofer", 400, 8, 55.0, .43, .47, 61.0, 5.0, 532.0, 4.8, 98.3),
              Speaker("Lavoce", "SAF184.03", 18, "Subwoofer", 1200, 8, 38.0, .35, .37, 210.0, 5.2, 1210.0, 9.5, 97.5),
              Speaker("KANE", "12W500", 12, "Woofer", 500, 8, 45.0, .42, .46, 68.0, 5.6, 530.0, 5.0, 96.0),
              Speaker("KANE", "15W800", 15, "Subwoofer", 800, 8, 42.0, .39, .43, 118.0, 5.4, 855.0, 7.0, 97.0)
          )

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(
                          colorScheme = lightColorScheme(
                              primary = SamsungBlue,
                              background = Bg,
                              surface = CardBg,
                              onSurface = TextMain
                          )
                      ) { SpeakerBoxApp() }
                  }
              }
          }

          @Composable
          fun SpeakerBoxApp() {
              var page by remember { mutableStateOf(MainPage.HOME) }
              var selected by remember { mutableStateOf(speakers.first()) }
              var mode by remember { mutableStateOf("รถยนต์") }
              var count by remember { mutableIntStateOf(1) }
              var wiring by remember { mutableStateOf("ขนาน (Parallel)") }
              var boxType by remember { mutableStateOf("Bass Reflex") }
              var fb by remember { mutableFloatStateOf(35f) }
              var wood by remember { mutableIntStateOf(18) }
              var resultTab by remember { mutableStateOf(ResultTab.SUMMARY) }

              val result = remember(selected, count, wiring, boxType, fb, wood) {
                  calculateBox(selected, count, wiring, boxType, fb.toDouble(), wood)
              }

              Scaffold(
                  containerColor = Bg,
                  contentWindowInsets = WindowInsets.safeDrawing,
                  bottomBar = {
                      if (page != MainPage.RESULT) {
                          OneUiBottomBar(page) { page = it }
                      }
                  }
              ) { inner ->
                  Box(Modifier.padding(inner).fillMaxSize()) {
                      when (page) {
                          MainPage.HOME -> HomeScreen(
                              onCar = { mode = "รถยนต์"; page = MainPage.SPEAKERS },
                              onPa = { mode = "PA"; page = MainPage.SPEAKERS },
                              onProject = { page = MainPage.DESIGN }
                          )
                          MainPage.SPEAKERS -> SpeakerScreen(selected) { sp ->
                              selected = sp
                              page = MainPage.DESIGN
                          }
                          MainPage.DESIGN -> DesignScreen(
                              selected, mode, count, wiring, boxType, fb, wood,
                              onMode = { mode = it },
                              onCount = { count = it.coerceIn(1, 8) },
                              onWiring = { wiring = it },
                              onBoxType = { boxType = it },
                              onFb = { fb = it },
                              onWood = { wood = it },
                              onChangeSpeaker = { page = MainPage.SPEAKERS },
                              onCalculate = { resultTab = ResultTab.SUMMARY; page = MainPage.RESULT }
                          )
                          MainPage.RESULT -> ResultScreen(
                              selected, count, wiring, result, resultTab,
                              onTab = { resultTab = it },
                              onBack = { page = MainPage.DESIGN }
                          )
                          MainPage.INFO -> InfoScreen()
                      }
                  }
              }
          }

          @Composable
          fun OneUiHeader(title: String, subtitle: String? = null, back: (() -> Unit)? = null) {
              Row(
                  Modifier.fillMaxWidth().padding(horizontal = 22.dp, vertical = 14.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  if (back != null) {
                      Text("‹", fontSize = 38.sp, modifier = Modifier.clickable { back() }.padding(end = 8.dp))
                  }
                  Column(Modifier.weight(1f)) {
                      Text(title, fontSize = 26.sp, fontWeight = FontWeight.Bold, color = TextMain)
                      if (subtitle != null) Text(subtitle, fontSize = 14.sp, color = TextMuted, modifier = Modifier.padding(top = 2.dp))
                  }
              }
          }

          @Composable
          fun HomeScreen(onCar: () -> Unit, onPa: () -> Unit, onProject: () -> Unit) {
              LazyColumn(
                  modifier = Modifier.fillMaxSize(),
                  contentPadding = PaddingValues(bottom = 24.dp)
              ) {
                  item {
                      Column(Modifier.padding(horizontal = 22.dp, vertical = 14.dp)) {
                          Text("SpeakerBox TH", fontSize = 30.sp, fontWeight = FontWeight.Bold)
                          Text("ออกแบบตู้ลำโพงรถยนต์และ PA\nคำนวณขนาดตัดไม้ พร้อมใช้งานจริง", fontSize = 16.sp, color = TextMain, lineHeight = 23.sp)
                      }
                  }
                  item { ModeHero("รถยนต์", "ตู้ซับ ตู้กลาง ตู้แยกชิ้น\nออกแบบง่าย สำหรับติดตั้งในรถ", true, onCar) }
                  item { Spacer(Modifier.height(12.dp)); ModeHero("PA / เครื่องเสียง", "ตู้ซับ ตู้กลาง ตู้เสียงแหลม\nสำหรับงานเวที และใช้งานทั่วไป", false, onPa) }
                  item {
                      Row(Modifier.fillMaxWidth().padding(horizontal = 22.dp, vertical = 20.dp), verticalAlignment = Alignment.CenterVertically) {
                          Text("โปรเจกล่าสุด", fontSize = 20.sp, fontWeight = FontWeight.Bold, modifier = Modifier.weight(1f))
                          Text("ดูทั้งหมด ›", color = SamsungBlue, fontWeight = FontWeight.SemiBold)
                      }
                  }
                  item { RecentProject("ตู้ซับ 12\" รถเก๋ง", "1 ต.ค. 2026", true, onProject) }
                  item { Spacer(Modifier.height(10.dp)); RecentProject("ตู้ซับ 15\" PA", "28 ก.ย. 2026", false, onProject) }
              }
          }

          @Composable
          fun ModeHero(title: String, sub: String, car: Boolean, onClick: () -> Unit) {
              val brush = if (car) Brush.linearGradient(listOf(Color(0xFF0757B9), Color(0xFF0F83EA)))
              else Brush.linearGradient(listOf(Color(0xFF3A1A8E), Color(0xFF172F96), Color(0xFF6B2CC4)))
              Box(
                  Modifier.padding(horizontal = 22.dp).fillMaxWidth().height(126.dp)
                      .clip(RoundedCornerShape(22.dp)).background(brush).clickable { onClick() }
              ) {
                  Column(Modifier.align(Alignment.CenterStart).padding(start = 22.dp)) {
                      Text(title, color = Color.White, fontSize = 24.sp, fontWeight = FontWeight.Bold)
                      Text(sub, color = Color.White.copy(alpha = .96f), fontSize = 14.sp, lineHeight = 20.sp)
                  }
                  Box(Modifier.align(Alignment.CenterEnd).padding(end = 8.dp).size(138.dp, 108.dp)) {
                      if (car) CarIllustration() else PaIllustration()
                  }
                  Box(Modifier.align(Alignment.CenterEnd).padding(end = 14.dp).size(38.dp).clip(CircleShape).background(Color.White.copy(alpha=.16f)), contentAlignment = Alignment.Center) {
                      Text("→", color = Color.White, fontSize = 22.sp)
                  }
              }
          }

          @Composable
          fun CarIllustration() {
              Canvas(Modifier.fillMaxSize()) {
                  val w = size.width; val h = size.height
                  drawOval(Color(0x55000000), topLeft = Offset(w*.12f,h*.72f), size = Size(w*.76f,h*.17f))
                  val p = Path().apply {
                      moveTo(w*.08f,h*.63f); lineTo(w*.19f,h*.44f); lineTo(w*.42f,h*.31f); lineTo(w*.69f,h*.34f)
                      lineTo(w*.89f,h*.52f); lineTo(w*.94f,h*.68f); lineTo(w*.13f,h*.68f); close()
                  }
                  drawPath(p, Color(0xFF0B2E57))
                  drawPath(p, Color(0xFF147FE4), style = Stroke(width=3f))
                  drawCircle(Color(0xFF0D1117), w*.115f, Offset(w*.28f,h*.68f)); drawCircle(Color(0xFF0D1117), w*.115f, Offset(w*.76f,h*.68f))
                  drawCircle(Color(0xFF9ABFE6), w*.052f, Offset(w*.28f,h*.68f)); drawCircle(Color(0xFF9ABFE6), w*.052f, Offset(w*.76f,h*.68f))
              }
          }

          @Composable
          fun PaIllustration() {
              Canvas(Modifier.fillMaxSize()) {
                  val w=size.width; val h=size.height
                  repeat(3) { r -> repeat(if(r==0) 1 else 2) { c ->
                      val boxW=w*.25f; val boxH=h*.25f
                      val x=if(r==0) w*.51f else w*(.36f+c*.29f)
                      val y=h*(.08f+r*.25f)
                      drawRoundRect(Color(0xFF0E132A), Offset(x,y), Size(boxW,boxH), cornerRadius=androidx.compose.ui.geometry.CornerRadius(8f,8f))
                      drawCircle(Color(0xFF111111), boxW*.27f, Offset(x+boxW*.5f,y+boxH*.53f))
                      drawCircle(Color(0xFF4E5A8D), boxW*.20f, Offset(x+boxW*.5f,y+boxH*.53f), style=Stroke(2f))
                  }}
              }
          }

          @Composable
          fun RecentProject(title: String, date: String, car: Boolean, onClick: () -> Unit) {
              Row(
                  Modifier.padding(horizontal = 22.dp).fillMaxWidth().clip(RoundedCornerShape(18.dp)).background(CardBg)
                      .clickable { onClick() }.padding(14.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Box(Modifier.size(66.dp).clip(RoundedCornerShape(14.dp)).background(Soft), contentAlignment = Alignment.Center) {
                      if (car) MiniBoxGraphic() else MiniPaStack()
                  }
                  Column(Modifier.weight(1f).padding(start = 14.dp)) {
                      Text(title, fontSize = 16.sp, fontWeight = FontWeight.Bold)
                      Text(date, fontSize = 13.sp, color = TextMuted)
                  }
                  Text("›", fontSize = 28.sp, color = TextMuted)
              }
          }

          @Composable fun MiniBoxGraphic() { SpeakerBoxGraphic(Modifier.size(54.dp), compact=true) }
          @Composable fun MiniPaStack() { PaIllustration() }

          @Composable
          fun SpeakerScreen(selected: Speaker, onSelect: (Speaker)->Unit) {
              var query by remember { mutableStateOf("") }
              var brand by remember { mutableStateOf("ทั้งหมด") }
              val brands = listOf("ทั้งหมด","P.Audio","Eminence","Lavoce","KANE")
              val filtered = speakers.filter { (brand=="ทั้งหมด" || it.brand==brand) && (query.isBlank() || it.fullName.contains(query, true) || it.sizeInch.toString().contains(query)) }
              Column(Modifier.fillMaxSize()) {
                  OneUiHeader("เลือกดอกลำโพง")
                  OutlinedTextField(
                      value = query, onValueChange = { query=it },
                      placeholder = { Text("ค้นหายี่ห้อ / รุ่น / ขนาด (เช่น P.Audio 12\")") },
                      leadingIcon = { Text("⌕", fontSize=24.sp) },
                      shape = RoundedCornerShape(18.dp),
                      colors = OutlinedTextFieldDefaults.colors(unfocusedBorderColor = Color.Transparent, focusedBorderColor = SamsungBlue, unfocusedContainerColor = Soft, focusedContainerColor = Soft),
                      singleLine = true,
                      modifier = Modifier.fillMaxWidth().padding(horizontal=22.dp)
                  )
                  LazyRow(contentPadding=PaddingValues(horizontal=22.dp, vertical=12.dp), horizontalArrangement=Arrangement.spacedBy(8.dp)) {
                      items(brands) { b -> Pill(b, brand==b) { brand=b } }
                  }
                  LazyColumn(contentPadding=PaddingValues(start=22.dp,end=22.dp,bottom=24.dp), verticalArrangement=Arrangement.spacedBy(10.dp)) {
                      items(filtered) { sp -> SpeakerCard(sp, selected==sp) { onSelect(sp) } }
                  }
              }
          }

          @Composable
          fun Pill(text: String, selected: Boolean, onClick:()->Unit) {
              Box(
                  Modifier.clip(RoundedCornerShape(16.dp)).background(if(selected) SamsungBlue else CardBg).clickable { onClick() }
                      .padding(horizontal=16.dp, vertical=9.dp)
              ) { Text(text, color=if(selected) Color.White else TextMain, fontSize=13.sp, fontWeight=FontWeight.SemiBold) }
          }

          @Composable
          fun SpeakerCard(sp: Speaker, chosen: Boolean, onClick:()->Unit) {
              Row(
                  Modifier.fillMaxWidth().clip(RoundedCornerShape(20.dp)).background(CardBg)
                      .clickable { onClick() }.padding(12.dp), verticalAlignment=Alignment.CenterVertically
              ) {
                  SpeakerGraphic(Modifier.size(96.dp))
                  Column(Modifier.weight(1f).padding(start=10.dp)) {
                      Text(sp.fullName, fontWeight=FontWeight.Bold, fontSize=15.sp, maxLines=1, overflow=TextOverflow.Ellipsis)
                      Text("${sp.sizeInch}\" ${sp.type}", fontSize=13.sp, color=TextMuted)
                      Text("${sp.rmsW} W AES • ${sp.ohm}Ω", fontSize=13.sp, color=TextMain)
                      Text("Fs ${sp.fs.roundToInt()} Hz • Qts ${"%.2f".format(sp.qts)}", fontSize=12.sp, color=TextMuted)
                      if(sp.thailand) Box(Modifier.padding(top=4.dp).clip(RoundedCornerShape(8.dp)).background(Color(0xFFE6F7EC)).padding(horizontal=8.dp, vertical=3.dp)) {
                          Text("● มีขายในไทย", color=Good, fontSize=11.sp, fontWeight=FontWeight.SemiBold)
                      }
                  }
                  Text(if(chosen) "♥" else "♡", fontSize=23.sp, color=if(chosen) SamsungBlue else TextMuted)
              }
          }

          @Composable
          fun SpeakerGraphic(modifier: Modifier = Modifier) {
              Canvas(modifier) {
                  val c=Offset(size.width/2,size.height/2); val r=min(size.width,size.height)*.43f
                  drawCircle(Color(0xFF17191E),r,c)
                  drawCircle(Color(0xFF3A3E46),r*.82f,c)
                  drawCircle(Color(0xFF090A0D),r*.68f,c)
                  drawCircle(Color(0xFF252933),r*.48f,c)
                  drawCircle(Color(0xFF07080A),r*.27f,c)
                  drawCircle(Color(0xFF626A76),r,c,style=Stroke(r*.06f))
                  repeat(8) { i ->
                      val a=i*PI/4; val x=c.x+cos(a).toFloat()*r*.9f; val y=c.y+sin(a).toFloat()*r*.9f
                      drawCircle(Color(0xFFBFC5CC), r*.035f, Offset(x,y))
                  }
              }
          }

          @Composable
          fun DesignScreen(
              sp: Speaker, mode:String, count:Int, wiring:String, boxType:String, fb:Float, wood:Int,
              onMode:(String)->Unit, onCount:(Int)->Unit, onWiring:(String)->Unit, onBoxType:(String)->Unit,
              onFb:(Float)->Unit, onWood:(Int)->Unit, onChangeSpeaker:()->Unit, onCalculate:()->Unit
          ) {
              Column(Modifier.fillMaxSize().verticalScroll(rememberScrollState())) {
                  OneUiHeader("ออกแบบตู้ลำโพง")
                  Segmented(listOf("รถยนต์","PA"), mode, onMode)
                  SectionCard("ดอกลำโพง") {
                      Row(verticalAlignment=Alignment.CenterVertically) {
                          SpeakerGraphic(Modifier.size(96.dp))
                          Column(Modifier.weight(1f).padding(start=12.dp)) {
                              Text(sp.fullName, fontWeight=FontWeight.Bold, fontSize=16.sp)
                              Text("${sp.sizeInch}\" ${sp.type}", color=TextMuted, fontSize=13.sp)
