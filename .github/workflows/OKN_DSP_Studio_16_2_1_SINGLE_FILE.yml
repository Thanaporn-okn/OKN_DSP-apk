OKN_SOURCE_BASE64
          base64 --decode "$RUNNER_TEMP/okn_payload/source.zip.b64" > "$RUNNER_TEMP/okn_payload/source.zip"
          mkdir -p "$GITHUB_WORKSPACE"
          unzip -q "$RUNNER_TEMP/okn_payload/source.zip" -d "$GITHUB_WORKSPACE"
          test -f "$GITHUB_WORKSPACE/okn_source_recovered/settings.gradle"
          test -f "$GITHUB_WORKSPACE/okn_source_recovered/app/build.gradle"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run source safety validators
        working-directory: okn_source_recovered
        shell: bash
        run: |
          python3 Sources/validate_studio.py
          python3 Sources/validate_v38_gate.py

      - name: Build debug APK
        working-directory: okn_source_recovered
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK and source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-Studio-16.2.1-build
          path: |
            okn_source_recovered/app/build/outputs/apk/debug/*.apk
            okn_source_recovered/
          if-no-files-found: warn
          retention-days: 14
