name: Build OKN DSP V78 Direct Reconnect Epoch Binding

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_ANDROID_V78_DIRECT_RECONNECT_EPOCH_BINDING.zip'
      - '.github/workflows/build-okn-dsp-v78.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify V78 source
        shell: bash
        run: |
          set -euo pipefail
          echo '0a78f7371b8d3ac37a8ba2e1cdeeb158116fca5396b69d59ba475a9a55609323  OKN_DSP_ANDROID_V78_DIRECT_RECONNECT_EPOCH_BINDING.zip' | sha256sum -c -
          rm -rf /tmp/okn_v78
          mkdir -p /tmp/okn_v78
          unzip -q OKN_DSP_ANDROID_V78_DIRECT_RECONNECT_EPOCH_BINDING.zip -d /tmp/okn_v78
          cd /tmp/okn_v78
          python3 preflight_v78.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/okn_v78
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and package artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn_v78/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          mkdir -p artifact
          cp "$APK" artifact/OKN_DSP_V78_DIRECT_RECONNECT_EPOCH_BINDING-debug.apk
          cp /tmp/okn_v78/README_V78.txt artifact/
          cp /tmp/okn_v78/evidence/OKN_DSP_V78_RUNTIME_SCAN_RECONNECT_FIX.txt artifact/
          cp /tmp/okn_v78/evidence/OKN_DSP_V78_DIRECT_RECONNECT_EPOCH_BINDING_PLAN.txt artifact/
          cp /tmp/okn_v78/evidence/OKN_DSP_V78_DIRECT_RECONNECT_EPOCH_BINDING_PLAN.json artifact/
          sha256sum artifact/OKN_DSP_V78_DIRECT_RECONNECT_EPOCH_BINDING-debug.apk > artifact/OKN_DSP_V78_DIRECT_RECONNECT_EPOCH_BINDING-debug.sha256
          ls -lh artifact

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-V78-DIRECT-RECONNECT-EPOCH-BINDING-debug-apk
          path: artifact/
          if-no-files-found: error
          retention-days: 30
