name: OKN BP1048P4 V29 ONE CLICK FINAL DIAGNOSTIC S25 USB-C ONLY

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/OKN_BP1048P4_V29_ONE_CLICK_FINAL_DIAGNOSTIC_S25_USB_C_ONLY.yml'

permissions:
  contents: read

env:
  REQUIRED_PHONE: "Samsung Galaxy S25+"
  REQUIRED_PATH: "Samsung Galaxy S25+ -> USB-C cable -> DSP USB-C port only"
  SOLDER_ALLOWED: "NO"
  BOARD_MOD_ALLOWED: "NO"
  JTAG_ALLOWED: "NO"
  SDP_ALLOWED: "NO"
  AICE_ALLOWED: "NO"
  HARDWARE_PROBE_ALLOWED: "NO"
  FLASHBOOT_AA_ALLOWED: "NO"
  RECOVERY_COMMAND_ALLOWED: "NO"
  FLASH_ERASE_ALLOWED: "NO"
  FLASH_WRITE_ALLOWED: "NO"
  ARBITRARY_HID_COMMAND_ALLOWED: "NO"

jobs:
  build:
    name: Build V29 one-click final diagnostic APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: ONE CLICK - generate, safety-check, build APK, package
        shell: bash
        run: |
          set -euo pipefail

          test "$REQUIRED_PHONE" = "Samsung Galaxy S25+"
          test "$REQUIRED_PATH" = "Samsung Galaxy S25+ -> USB-C cable -> DSP USB-C port only"

          for v in SOLDER_ALLOWED BOARD_MOD_ALLOWED JTAG_ALLOWED SDP_ALLOWED AICE_ALLOWED HARDWARE_PROBE_ALLOWED FLASHBOOT_AA_ALLOWED RECOVERY_COMMAND_ALLOWED FLASH_ERASE_ALLOWED FLASH_WRITE_ALLOWED ARBITRARY_HID_COMMAND_ALLOWED; do
            test "${!v}" = "NO"
          done

          rm -rf /tmp/v29
          mkdir -p \
            /tmp/v29/app/app/src/main/java/com/okn/bp1048p4v29 \
            /tmp/v29/app/app/src/main/res/xml \
            /tmp/v29/evidence \
            /tmp/v29/out

          A=/tmp/v29/app

          cat > /tmp/v29/evidence/V29_SCOPE.txt <<'EOF'
          OKN BP1048P4 V29 ONE CLICK FINAL DIAGNOSTIC

          REQUIRED PHONE:
            Samsung Galaxy S25+

          REQUIRED PATH:
            Samsung Galaxy S25+ -> USB-C cable -> DSP USB-C port only

          REAL-BOARD FACTS ALREADY PROVEN BEFORE V29:
            runtime VID:PID = 6324:1719
            runtime HID data interface = 4
            V26 report descriptor = 36 bytes
            runtime Output report 256 bytes accepted
            runtime Feature report 8 bytes works
            AA arm receives 0x55 but board does not re-enumerate
            cold boot while USB attached returns to runtime 6324:1719
            recovery 0000:2244 has not been physically observed

          V29 ONE-CLICK SAFE SEQUENCE:
            1. scan USB and prefer recovery if present
            2. request Android USB permission if needed
            3. capture device/config/interface/endpoint descriptors
            4. capture raw descriptors + SHA-256
            5. read standard HID report descriptor on interface 4
            6. claim interface 4
            7. baseline GET_REPORT(Input)
            8. send exactly one online-tuning version query:
                 A5 5A 00 00 16
               zero-padded to 256 bytes
            9. GET_REPORT(Input) at controlled lengths/delays
           10. release interface
           11. monitor USB attach/detach for 60 seconds
               User may power-cycle DSP once during this window.
           12. print automatic summary.

          V29 DOES NOT:
            - send AA
            - send Feature SET_REPORT
            - enter FlashBoot
            - send any recovery protocol command
            - erase flash
            - write flash
            - accept arbitrary HID commands
            - open a firmware file
          EOF

          cat > "$A/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'OKN_BP1048P4_V29'
          include ':app'
          EOF

          cat > "$A/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > "$A/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > "$A/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.okn.bp1048p4v29'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.okn.bp1048p4v29'
                  minSdk 29
                  targetSdk 35
                  versionCode 29
                  versionName '29.0'
              }
          }
          EOF

          cat > "$A/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature
                  android:name="android.hardware.usb.host"
                  android:required="true" />

              <application
                  android:allowBackup="false"
                  android:label="OKN BP1048P4 V29 FINAL DIAG"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED" />
                      </intent-filter>

                      <meta-data
                          android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED"
                          android:resource="@xml/device_filter" />
                  </activity>
              </application>
          </manifest>
          EOF

          cat > "$A/app/src/main/res/xml/device_filter.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <usb-device vendor-id="25380" product-id="5913" />
              <usb-device vendor-id="0" product-id="8772" />
          </resources>
          EOF

          cat > "$A/app/src/main/java/com/okn/bp1048p4v29/MainActivity.java" <<'JAVA'
          package com.okn.bp1048p4v29;

          import android.app.Activity;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.hardware.usb.UsbConfiguration;
          import android.hardware.usb.UsbDevice;
          import android.hardware.usb.UsbDeviceConnection;
          import android.hardware.usb.UsbEndpoint;
          import android.hardware.usb.UsbInterface;
          import android.hardware.usb.UsbManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.SystemClock;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.security.MessageDigest;
          import java.util.Arrays;
          import java.util.Locale;
          import java.util.Map;

          public class MainActivity extends Activity {
              private static final String ACTION_USB_PERMISSION =
                  "com.okn.bp1048p4v29.USB_PERMISSION";

              private static final int RUNTIME_VID = 0x6324;
              private static final int RUNTIME_PID = 0x1719;
              private static final int RECOVERY_VID = 0x0000;
              private static final int RECOVERY_PID = 0x2244;

              private static final int HID_DATA_IFACE = 4;
              private static final int HID_CLASS = 3;

              private static final long MONITOR_MS = 60000L;

              private UsbManager usb;
              private UsbDevice selected;
              private TextView status;
              private Button runButton;
              private final Handler handler = new Handler(Looper.getMainLooper());

              private long appT0;
              private boolean runRequested = false;
              private boolean diagnosticsDone = false;
              private boolean monitoring = false;

              private boolean sawRuntime = false;
              private boolean sawRecovery = false;
              private boolean sawDetach = false;
              private boolean sawRuntimeReattach = false;

              private int lastRuntimeDeviceId = -1;

              private final BroadcastReceiver receiver =
                  new BroadcastReceiver() {
                      @Override public void onReceive(Context context, Intent intent) {
                          String action = intent.getAction();

                          if (ACTION_USB_PERMISSION.equals(action)) {
                              UsbDevice d = getUsbDevice(intent);
                              boolean granted = intent.getBooleanExtra(
                                  UsbManager.EXTRA_PERMISSION_GRANTED, false);

                              log("USB permission=" + granted + dev(d));

                              if (granted && d != null) {
                                  selected = d;
                                  if (runRequested) runSelected();
                              }
                              return;
                          }

                          if (UsbManager.ACTION_USB_DEVICE_ATTACHED.equals(action)) {
                              UsbDevice d = getUsbDevice(intent);
                              log("USB ATTACHED" + dev(d));

                              if (isRecovery(d)) {
                                  sawRecovery = true;
                                  selected = d;
                                  log("RECOVERY_SEEN=true");
                                  inspectRecoveryPassive(d);
                              } else if (isRuntime(d)) {
                                  if (sawDetach) sawRuntimeReattach = true;
                                  sawRuntime = true;
                                  lastRuntimeDeviceId = d.getDeviceId();
                                  selected = d;
                              }
                              return;
                          }

                          if (UsbManager.ACTION_USB_DEVICE_DETACHED.equals(action)) {
                              UsbDevice d = getUsbDevice(intent);
                              log("USB DETACHED" + dev(d));
                              if (isRuntime(d) || isRecovery(d)) sawDetach = true;
                          }
                      }
                  };

              @Override protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  appT0 = SystemClock.elapsedRealtime();
                  usb = (UsbManager) getSystemService(Context.USB_SERVICE);

                  IntentFilter f = new IntentFilter();
                  f.addAction(ACTION_USB_PERMISSION);
                  f.addAction(UsbManager.ACTION_USB_DEVICE_ATTACHED);
                  f.addAction(UsbManager.ACTION_USB_DEVICE_DETACHED);

                  if (Build.VERSION.SDK_INT >= 33) {
                      registerReceiver(receiver, f, Context.RECEIVER_NOT_EXPORTED);
                  } else {
                      registerReceiver(receiver, f);
                  }

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(28, 28, 28, 28);

                  TextView title = new TextView(this);
                  title.setText("OKN BP1048P4 • V29 ONE-CLICK FINAL DIAGNOSTIC");
                  title.setTextSize(20);
                  root.addView(title);

                  TextView note = new TextView(this);
                  note.setText(
                      "\nSamsung Galaxy S25+ → USB-C → DSP USB-C เท่านั้น\n" +
                      "กด RUN ALL ครั้งเดียว\n" +
                      "หลัง diagnostic เสร็จ แอปจะ monitor USB 60 วินาที\n" +
                      "ระหว่างนั้นปิด-เปิดไฟ DSP 1 ครั้งได้\n" +
                      "ไม่มี AA • ไม่มี recovery command • ไม่มี erase/write\n");
                  root.addView(note);

                  runButton = new Button(this);
                  runButton.setText("RUN ALL SAFE DIAGNOSTIC");
                  runButton.setAllCaps(false);
                  runButton.setOnClickListener(v -> runAll());
                  root.addView(runButton);

                  status = new TextView(this);
                  status.setTextIsSelectable(true);
                  status.setText("\nLog:\n");
                  root.addView(status);

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(root);
                  setContentView(scroll);

                  scanOnly();
              }

              private UsbDevice getUsbDevice(Intent intent) {
                  if (Build.VERSION.SDK_INT >= 33) {
                      return intent.getParcelableExtra(
                          UsbManager.EXTRA_DEVICE, UsbDevice.class);
                  }
                  return intent.getParcelableExtra(UsbManager.EXTRA_DEVICE);
              }

              private void log(String s) {
                  long ms = SystemClock.elapsedRealtime() - appT0;
                  status.append(String.format(Locale.US, "[%06dms] %s\n", ms, s));
              }

              private void toast(String s) {
                  Toast.makeText(this, s, Toast.LENGTH_SHORT).show();
                  log(s);
              }

              private String dev(UsbDevice d) {
                  if (d == null) return "";
                  return String.format(
                      Locale.US,
                      " [%04X:%04X id=%d name=%s]",
                      d.getVendorId(),
                      d.getProductId(),
                      d.getDeviceId(),
                      d.getDeviceName());
              }

              private boolean isRuntime(UsbDevice d) {
                  return d != null &&
                      d.getVendorId() == RUNTIME_VID &&
                      d.getProductId() == RUNTIME_PID;
              }

              private boolean isRecovery(UsbDevice d) {
                  return d != null &&
                      d.getVendorId() == RECOVERY_VID &&
                      d.getProductId() == RECOVERY_PID;
              }

              private void scanOnly() {
                  selected = null;

                  Map<String, UsbDevice> list = usb.getDeviceList();
                  log("USB devices=" + list.size());

                  UsbDevice runtime = null;
                  UsbDevice recovery = null;

                  for (UsbDevice d : list.values()) {
                      log("พบ" + dev(d));

                      if (isRecovery(d)) recovery = d;
                      else if (isRuntime(d)) runtime = d;
                  }

                  if (recovery != null) {
                      selected = recovery;
                      sawRecovery = true;
                      log("selected=RECOVERY" + dev(recovery));
                      inspectRecoveryPassive(recovery);
                      return;
                  }

                  if (runtime != null) {
                      selected = runtime;
                      sawRuntime = true;
                      lastRuntimeDeviceId = runtime.getDeviceId();
                      log("selected=RUNTIME" + dev(runtime));
                      log("permission=" + usb.hasPermission(runtime));
                      return;
                  }

                  log("ยังไม่พบ BP1048P4 runtime/recovery");
              }

              private void runAll() {
                  if (diagnosticsDone || monitoring) {
                      log("RUN already completed/monitoring");
                      return;
                  }

                  runRequested = true;
                  runButton.setEnabled(false);

                  log("=== V29 RUN ALL BEGIN ===");
                  scanOnly();

                  if (selected == null) {
                      log("STOP: ยังไม่พบ DSP");
                      runButton.setEnabled(true);
                      return;
                  }

                  if (isRecovery(selected)) {
                      log("RECOVERY already present; passive inspection only");
                      beginMonitor();
                      return;
                  }

                  if (!usb.hasPermission(selected)) {
                      requestPermission(selected);
                      return;
                  }

                  runSelected();
              }

              private void requestPermission(UsbDevice d) {
                  Intent i = new Intent(ACTION_USB_PERMISSION)
                      .setPackage(getPackageName());

                  PendingIntent pi = PendingIntent.getBroadcast(
                      this,
                      d.getDeviceId(),
                      i,
                      PendingIntent.FLAG_UPDATE_CURRENT |
                          PendingIntent.FLAG_MUTABLE);

                  log("request USB permission" + dev(d));
                  usb.requestPermission(d, pi);
              }

              private void runSelected() {
                  if (selected == null) {
                      log("STOP: selected=null");
                      runButton.setEnabled(true);
                      return;
                  }

                  if (isRecovery(selected)) {
                      inspectRecoveryPassive(selected);
                      beginMonitor();
                      return;
                  }

                  if (!isRuntime(selected)) {
                      log("STOP: selected device is not expected runtime/recovery");
                      runButton.setEnabled(true);
                      return;
                  }

                  if (!usb.hasPermission(selected)) {
                      requestPermission(selected);
                      return;
                  }

                  runRuntimeDiagnostics(selected);
              }

              private UsbInterface findInterface(
                  UsbDevice d,
                  int id,
                  int requiredClass) {

                  for (int i = 0; i < d.getInterfaceCount(); i++) {
                      UsbInterface x = d.getInterface(i);
                      if (x.getId() == id &&
                          x.getInterfaceClass() == requiredClass) {
                          return x;
                      }
                  }
                  return null;
              }

              private void dumpDescriptors(UsbDevice d) {
                  log("manufacturer=" + safe(() -> d.getManufacturerName()));
                  log("product=" + safe(() -> d.getProductName()));
                  log("serial=" + safe(() -> d.getSerialNumber()));
                  log("deviceVersion=" + safe(() -> d.getVersion()));
                  log("deviceClass=" + d.getDeviceClass());
                  log("deviceSubclass=" + d.getDeviceSubclass());
                  log("deviceProtocol=" + d.getDeviceProtocol());
                  log("configurationCount=" + d.getConfigurationCount());
                  log("interfaceCount=" + d.getInterfaceCount());

                  for (int c = 0; c < d.getConfigurationCount(); c++) {
                      UsbConfiguration cfg = d.getConfiguration(c);

                      log(String.format(
                          Locale.US,
                          "CFG[%d] id=%d maxPower=%dmA selfPowered=%s remoteWakeup=%s interfaces=%d",
                          c,
                          cfg.getId(),
                          cfg.getMaxPower(),
                          cfg.isSelfPowered(),
                          cfg.isRemoteWakeup(),
                          cfg.getInterfaceCount()));
                  }

                  for (int n = 0; n < d.getInterfaceCount(); n++) {
                      UsbInterface intf = d.getInterface(n);

                      log(String.format(
                          Locale.US,
                          "IF[%d] id=%d alt=%d class=%d sub=%d proto=%d eps=%d",
                          n,
                          intf.getId(),
                          intf.getAlternateSetting(),
                          intf.getInterfaceClass(),
                          intf.getInterfaceSubclass(),
                          intf.getInterfaceProtocol(),
                          intf.getEndpointCount()));

                      for (int e = 0; e < intf.getEndpointCount(); e++) {
                          UsbEndpoint ep = intf.getEndpoint(e);

                          log(String.format(
                              Locale.US,
                              " EP[%d] addr=0x%02X dir=%d type=%d maxPacket=%d interval=%d",
                              e,
                              ep.getAddress(),
                              ep.getDirection(),
                              ep.getType(),
                              ep.getMaxPacketSize(),
                              ep.getInterval()));
                      }
                  }
              }

              private void runRuntimeDiagnostics(UsbDevice d) {
                  diagnosticsDone = true;

                  log("=== RUNTIME DIAGNOSTIC BEGIN ===");
                  dumpDescriptors(d);

                  UsbInterface intf =
                      findInterface(d, HID_DATA_IFACE, HID_CLASS);

                  if (intf == null) {
                      log("STOP: interface 4 HID fingerprint mismatch");
                      beginMonitor();
                      return;
                  }

                  UsbDeviceConnection conn = usb.openDevice(d);

                  if (conn == null) {
                      log("openDevice failed");
                      beginMonitor();
                      return;
                  }

                  boolean claimed = false;

                  try {
                      byte[] raw = conn.getRawDescriptors();

                      if (raw != null) {
                          log("rawDescriptorBytes=" + raw.length);
                          log("rawDescriptorSHA256=" + sha256(raw));
                          log("rawDescriptorHex=" + hex(raw, Math.min(raw.length, 512)));
                      } else {
                          log("rawDescriptorBytes=null");
                      }

                      // Standard GET_DESCRIPTOR for HID report descriptor.
                      byte[] report = new byte[1024];
                      Arrays.fill(report, (byte) 0xCC);

                      int reportLen = conn.controlTransfer(
                          0x81,
                          0x06,
                          0x2200,
                          HID_DATA_IFACE,
                          report,
                          report.length,
                          1500);

                      log("IF4 GET_DESCRIPTOR(REPORT).result=" + reportLen);
                      if (reportLen > 0) {
                          byte[] exact = Arrays.copyOf(report, reportLen);
                          log("IF4 reportSHA256=" + sha256(exact));
                          log("IF4 reportHex=" + hex(exact, exact.length));
                      }

                      claimed = conn.claimInterface(intf, true);
                      log("claimInterface4=" + claimed);

                      if (!claimed) {
                          log("STOP: claim interface 4 failed");
                          return;
                      }

                      getInput(conn, 64, "BASELINE_GET64");

                      // Exact and only application-level command:
                      // A5 5A 00 00 16 = online-tuning version query control 0x00.
                      byte[] out = new byte[256];
                      out[0] = (byte) 0xA5;
                      out[1] = (byte) 0x5A;
                      out[2] = (byte) 0x00;
                      out[3] = (byte) 0x00;
                      out[4] = (byte) 0x16;

                      log("TX logical=A5 5A 00 00 16");
                      log("TX count=ONE");

                      int set = conn.controlTransfer(
                          0x21,
                          0x09,
                          0x0200,
                          HID_DATA_IFACE,
                          out,
                          out.length,
                          1500);

                      log("SET_REPORT(Output).result=" + set);

                      if (set == 256) {
                          SystemClock.sleep(20);
                          getInput(conn, 64, "GET64_AFTER_20MS");

                          SystemClock.sleep(100);
                          getInput(conn, 256, "GET256_AFTER_120MS");

                          SystemClock.sleep(250);
                          getInput(conn, 64, "GET64_AFTER_370MS");
                      } else {
                          log("Version query output was not accepted; no retries");
                      }

                  } catch (Exception e) {
                      log("runtime diagnostic error=" + e);
                  } finally {
                      if (claimed) {
                          try {
                              log("releaseInterface4=" +
                                  conn.releaseInterface(intf));
                          } catch (Exception e) {
                              log("releaseInterface4 error=" + e);
                          }
                      }
                      conn.close();
                      log("=== RUNTIME DIAGNOSTIC END ===");
                      beginMonitor();
                  }
              }

              private int getInput(
                  UsbDeviceConnection conn,
                  int requestLength,
                  String label) {

                  byte[] in = new byte[requestLength];
                  Arrays.fill(in, (byte) 0xCC);

                  int ret = conn.controlTransfer(
                      0xA1,
                      0x01,
                      0x0100,
                      HID_DATA_IFACE,
                      in,
                      in.length,
                      1500);

                  log(label + ".result=" + ret);
                  log(label + ".first32=" +
                      hex(in, Math.min(in.length, 32)));
                  log(label + ".changedFromCC=" + changedFromCC(in));

                  if (ret > 0) parseVersion(in, ret);
                  return ret;
              }

              private void inspectRecoveryPassive(UsbDevice d) {
                  log("=== PASSIVE RECOVERY INSPECTION ===");
                  log("recovery.device=" + dev(d));
                  log("recovery.permission=" + usb.hasPermission(d));
                  log("recovery.interfaces=" + d.getInterfaceCount());

                  for (int i = 0; i < d.getInterfaceCount(); i++) {
                      UsbInterface x = d.getInterface(i);
                      log(String.format(
                          Locale.US,
                          " RECOVERY IF[%d] id=%d class=%d sub=%d proto=%d eps=%d",
                          i,
                          x.getId(),
                          x.getInterfaceClass(),
                          x.getInterfaceSubclass(),
                          x.getInterfaceProtocol(),
                          x.getEndpointCount()));
                  }

                  log("RECOVERY_COMMAND_SENT=false");
              }

              private void beginMonitor() {
                  if (monitoring) return;

                  monitoring = true;
                  log("=== USB MONITOR 60s BEGIN ===");
                  log("ACTION: ระหว่าง 60 วินาทีนี้ ปิด-เปิดไฟ DSP 1 ครั้งได้");
                  log("ห้ามถอดสาย USB-C ระหว่าง power-cycle");

                  handler.postDelayed(() -> {
                      monitoring = false;
                      printSummary();
                      runButton.setEnabled(true);
                  }, MONITOR_MS);
              }

              private void printSummary() {
                  scanOnly();

                  log("=== V29 FINAL SUMMARY ===");
                  log("sawRuntime=" + sawRuntime);
                  log("sawRecovery0000_2244=" + sawRecovery);
                  log("sawUsbDetach=" + sawDetach);
                  log("sawRuntimeReattach=" + sawRuntimeReattach);
                  log("runtimeLastDeviceId=" + lastRuntimeDeviceId);

                  if (sawRecovery) {
                      log("RESULT=RECOVERY_PHYSICALLY_OBSERVED");
                  } else if (sawDetach && sawRuntimeReattach) {
                      log("RESULT=COLD_BOOT_RETURNED_TO_RUNTIME_NO_RECOVERY");
                  } else {
                      log("RESULT=NO_RECOVERY_OBSERVED_IN_MONITOR_WINDOW");
                  }

                  log("FLASH_ERASE_SENT=false");
                  log("FLASH_WRITE_SENT=false");
                  log("FLASHBOOT_AA_SENT=false");
                  log("RECOVERY_COMMAND_SENT=false");
                  log("=== V29 RUN ALL END ===");
              }

              private void parseVersion(byte[] b, int len) {
                  if (len < 5) return;

                  if ((b[0] & 0xff) != 0xA5 ||
                      (b[1] & 0xff) != 0x5A ||
                      (b[2] & 0xff) != 0x00) {
                      return;
                  }

                  int payloadLen = b[3] & 0xff;
                  int end = 4 + payloadLen;

                  log("VERSION.headerValid=true");
                  log("VERSION.payloadLen=" + payloadLen);

                  if (end >= len || (b[end] & 0xff) != 0x16) {
                      log("VERSION.terminatorValid=false");
                      return;
                  }

                  log("VERSION.terminatorValid=true");

                  if (payloadLen >= 4 && len >= 8) {
                      log(String.format(
                          Locale.US,
                          "VERSION.chipFamilyTag=0x%02X",
                          b[4] & 0xff));

                      log(String.format(
                          Locale.US,
                          "VERSION.effect=%d.%d.%d",
                          b[5] & 0xff,
                          b[6] & 0xff,
                          b[7] & 0xff));
                  }

                  if (payloadLen >= 7 && len >= 11) {
                      log(String.format(
                          Locale.US,
                          "VERSION.audioLibBytes=%02X %02X %02X",
                          b[8] & 0xff,
                          b[9] & 0xff,
                          b[10] & 0xff));
                  }

                  log("VERSION_RESPONSE_VALID=true");
              }

              private boolean changedFromCC(byte[] b) {
                  for (byte x : b) {
                      if ((x & 0xff) != 0xCC) return true;
                  }
                  return false;
              }

              private interface StringCall {
                  String get() throws Exception;
              }

              private String safe(StringCall call) {
                  try {
                      String v = call.get();
                      return v == null ? "<null>" : v;
                  } catch (Exception e) {
                      return "<error:" + e.getClass().getSimpleName() + ">";
                  }
              }

              private static String sha256(byte[] b) {
                  try {
                      MessageDigest md =
                          MessageDigest.getInstance("SHA-256");

                      byte[] d = md.digest(b);
                      StringBuilder s = new StringBuilder();

                      for (byte x : d) {
                          s.append(String.format(
                              Locale.US, "%02X", x & 0xff));
                      }
                      return s.toString();
                  } catch (Exception e) {
                      return "<sha-error>";
                  }
              }

              private static String hex(byte[] b, int len) {
                  StringBuilder s = new StringBuilder();
                  int n = Math.min(len, b.length);

                  for (int i = 0; i < n; i++) {
                      if (i > 0) s.append(' ');
                      s.append(String.format(
                          Locale.US, "%02X", b[i] & 0xff));
                  }
                  return s.toString();
              }

              @Override protected void onDestroy() {
                  handler.removeCallbacksAndMessages(null);

                  try {
                      unregisterReceiver(receiver);
                  } catch (Exception ignored) {}

                  super.onDestroy();
              }
          }
