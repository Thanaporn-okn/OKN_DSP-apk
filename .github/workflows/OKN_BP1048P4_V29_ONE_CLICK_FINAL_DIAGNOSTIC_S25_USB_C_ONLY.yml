          JAVA_SRC="$A/app/src/main/java/com/okn/bp1048p4v29/MainActivity.java"

          # Permanent path/phone constraint must be visible in source.
          grep -q -F 'Samsung Galaxy S25+' "$JAVA_SRC"
          grep -q -F 'USB-C' "$JAVA_SRC"

          # Exact and only application TX frame.
          grep -q -F 'out[0] = (byte) 0xA5;' "$JAVA_SRC"
          grep -q -F 'out[1] = (byte) 0x5A;' "$JAVA_SRC"
          grep -q -F 'out[2] = (byte) 0x00;' "$JAVA_SRC"
          grep -q -F 'out[3] = (byte) 0x00;' "$JAVA_SRC"
          grep -q -F 'out[4] = (byte) 0x16;' "$JAVA_SRC"

          # Exactly one host-to-device HID class request in the Java source.
          test "$(grep -c '0x21,' "$JAVA_SRC")" -eq 1
          test "$(grep -c '0x09,' "$JAVA_SRC")" -eq 1
          test "$(grep -c '0x0200,' "$JAVA_SRC")" -eq 1

          # No FlashBoot Feature report path or AA trigger.
          if grep -n -E '0x0300|0xAA' "$JAVA_SRC"; then
