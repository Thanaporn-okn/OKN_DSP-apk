name: OKN BP1048P4 R56 Full Firmware Integration Gate

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-r56-fullfw-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SDK_REPO: "https://github.com/leadercxn/bp1048_sdk_v0.1.12.git"
  SDK_COMMIT: "8105bd864b04995d81c9f9ae77cb158259f39015"
  TOOLCHAIN_REPO: "https://github.com/xingrz/nds-builder.git"
  TOOLCHAIN_COMMIT: "572969caccb1d0c576b2893c905fa7b3396815e4"
  TOOLCHAIN_SHA256: "a231682172de4af23ac94726c021a824f1ae7d1f7c72a4619093b90caa7de0e4"
  SOURCE_ZIP_SHA256: "b9048b7b77378b687bf46b247ab0fc7be5f4e2b24d60f36adad4e351bb7405dd"
  LIVE_BOARD_USB: "NO"
  HOST_TO_DEVICE_USB: "NO"
  FLASH_ERASE_WRITE: "NO"
  FLASH_ALLOWED: "NO"
  FEATURE_SET_REPORT_ALLOWED: "NO"
  EXECUTE_VENDOR_EXE: "NO"

jobs:
  integrate:
    name: R56 gain-only core + BP1048P4 BT_Audio_APP layout
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fail-closed safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$LIVE_BOARD_USB" = "NO"
          test "$HOST_TO_DEVICE_USB" = "NO"
          test "$FLASH_ERASE_WRITE" = "NO"
          test "$FLASH_ALLOWED" = "NO"
          test "$FEATURE_SET_REPORT_ALLOWED" = "NO"
          test "$EXECUTE_VENDOR_EXE" = "NO"
          echo "OFFLINE_ONLY=YES"
          echo "FLASH_ALLOWED=NO"

      - name: Restore exact R56 source
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/R56_SOURCE.b64" <<'R56_B64'
          
          R56_B64
          sed 's/^          //' "$RUNNER_TEMP/R56_SOURCE.b64" | base64 -d > "$RUNNER_TEMP/R56_SOURCE.zip"
          echo "$SOURCE_ZIP_SHA256  $RUNNER_TEMP/R56_SOURCE.zip" | sha256sum -c -
          rm -rf "$RUNNER_TEMP/r56src"
          mkdir -p "$RUNNER_TEMP/r56src"
          unzip -q "$RUNNER_TEMP/R56_SOURCE.zip" -d "$RUNNER_TEMP/r56src"
          echo "R56_ROOT=$RUNNER_TEMP/r56src" >> "$GITHUB_ENV"

      - name: Prove Dedicated Gain is not EQ
        shell: bash
        run: |
          set -euo pipefail
          cd "$R56_ROOT"
          python3 tools/audit.py | tee "$RUNNER_TEMP/R56_AUDIT.txt"
          grep -q 'GAIN_VIA_EQ=NO' "$RUNNER_TEMP/R56_AUDIT.txt"
          ! grep -RniE 'peq|biquad|equalizer|eq_apply|filter_gain' firmware
          grep -q '#define OKN56_GAIN_ID_FIRST 22u' firmware/include/okn56_runtime.h
          grep -q '#define OKN56_GAIN_ID_LAST 28u' firmware/include/okn56_runtime.h
          grep -q '#define OKN56_IDENTITY_ID 29u' firmware/include/okn56_runtime.h
          echo "DEDICATED_GAIN_NOT_EQ=PASS"
          echo "CUSTOM_FW_IDENTITY=ID29:OKN6"

      - name: Host tests and sanitizers
        shell: bash
        run: |
          set -euo pipefail
          cd "$R56_ROOT"
          make clean
          make test | tee "$RUNNER_TEMP/HOST_TEST.log"
          make sanitize | tee "$RUNNER_TEMP/SANITIZE.log"
          grep -q 'PASS R56: gain-only post-EQ stage' "$RUNNER_TEMP/HOST_TEST.log"
          grep -q 'identity OKN6' "$RUNNER_TEMP/HOST_TEST.log"

      - name: Pin public BP1048 SDK and inventory exact integration points
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/bp1048sdk"
          git init -q "$RUNNER_TEMP/bp1048sdk"
          git -C "$RUNNER_TEMP/bp1048sdk" remote add origin "$SDK_REPO"
          git -C "$RUNNER_TEMP/bp1048sdk" fetch -q --depth 1 origin "$SDK_COMMIT"
          git -C "$RUNNER_TEMP/bp1048sdk" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/bp1048sdk" rev-parse HEAD)" = "$SDK_COMMIT"
          mkdir -p "$RUNNER_TEMP/evidence"
          python3 "$R56_ROOT/tools/sdk_probe.py" "$RUNNER_TEMP/bp1048sdk" "$RUNNER_TEMP/evidence"
          test -s "$RUNNER_TEMP/bp1048sdk/BT_Audio_APP/nds32-ae210p.ld"
          sha256sum "$RUNNER_TEMP/bp1048sdk/BT_Audio_APP/nds32-ae210p.ld" > "$RUNNER_TEMP/evidence/BT_AUDIO_LINKER_SHA256.txt"
          find "$RUNNER_TEMP/bp1048sdk/BT_Audio_APP/bt_audio_app_src" -type f -name '*.c' | sort > "$RUNNER_TEMP/evidence/BT_AUDIO_C_SOURCES.txt"
          echo "BT_AUDIO_C_SOURCE_COUNT=$(wc -l < $RUNNER_TEMP/evidence/BT_AUDIO_C_SOURCES.txt)" | tee "$RUNNER_TEMP/evidence/BT_AUDIO_SOURCE_COUNT.txt"
          grep -Rni --include='*.c' --include='*.h' 'Communication_Effect_' "$RUNNER_TEMP/bp1048sdk/BT_Audio_APP" > "$RUNNER_TEMP/evidence/COMMUNICATION_EFFECT_HITS.txt" || true
          grep -Rni --include='*.c' --include='*.h' -E 'DAC0|DAC1|I2S0|I2S1|AudioCoreSink' "$RUNNER_TEMP/bp1048sdk/BT_Audio_APP/bt_audio_app_src" > "$RUNNER_TEMP/evidence/OUTPUT_HOOK_CANDIDATES.txt" || true
          grep -n 'Gain_Control' "$RUNNER_TEMP/bp1048sdk/BT_Audio_APP/bt_audio_app_src/audio/music_parameter/Music.c" > "$RUNNER_TEMP/evidence/NATIVE_GAIN_CONTROL_LINES.txt"

      - name: Acquire pinned NDS32 D1088 toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libc6-i386 lib32z1 xz-utils
          rm -rf "$RUNNER_TEMP/nds-src" "$RUNNER_TEMP/nds"
          git init -q "$RUNNER_TEMP/nds-src"
          git -C "$RUNNER_TEMP/nds-src" remote add origin "$TOOLCHAIN_REPO"
          git -C "$RUNNER_TEMP/nds-src" fetch -q --depth 1 origin "$TOOLCHAIN_COMMIT"
          git -C "$RUNNER_TEMP/nds-src" checkout -q --detach FETCH_HEAD
          echo "$TOOLCHAIN_SHA256  $RUNNER_TEMP/nds-src/nds32le-elf-mculib-v3s.4.9.4.txz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/nds"
          tar -xJf "$RUNNER_TEMP/nds-src/nds32le-elf-mculib-v3s.4.9.4.txz" -C "$RUNNER_TEMP/nds"
          CC="$RUNNER_TEMP/nds/nds32le-elf-mculib-v3s/bin/nds32le-elf-gcc"
          "$CC" --version | tee "$RUNNER_TEMP/evidence/NDS32_COMPILER.txt"
          "$CC" -dumpmachine | tee "$RUNNER_TEMP/evidence/NDS32_TARGET.txt"

      - name: Target-compile R56 gain-only core
        shell: bash
        run: |
          set -euo pipefail
          cd "$R56_ROOT"
          CC="$RUNNER_TEMP/nds/nds32le-elf-mculib-v3s/bin/nds32le-elf-gcc"
          NM="$RUNNER_TEMP/nds/nds32le-elf-mculib-v3s/bin/nds32le-elf-nm"
          READELF="$RUNNER_TEMP/nds/nds32le-elf-mculib-v3s/bin/nds32le-elf-readelf"
          mkdir -p "$RUNNER_TEMP/target_obj"
          CFLAGS='-mcpu=d1088-spu -mext-dsp -Os -ffunction-sections -fdata-sections -Wall -Wextra -Werror'
          INC='-Ifirmware/include -Ifirmware/src'
          "$CC" $CFLAGS $INC -c firmware/src/okn56_gain7.c -o "$RUNNER_TEMP/target_obj/okn56_gain7.o"
          "$CC" $CFLAGS $INC -c firmware/src/okn56_runtime.c -o "$RUNNER_TEMP/target_obj/okn56_runtime.o"
          "$CC" -mcpu=d1088-spu -mext-dsp -r -nostdlib "$RUNNER_TEMP"/target_obj/*.o -o "$RUNNER_TEMP/OKN_R56_TRUE7CH_GAIN_ONLY_BP1048P4.o"
          "$READELF" -h "$RUNNER_TEMP/OKN_R56_TRUE7CH_GAIN_ONLY_BP1048P4.o" > "$RUNNER_TEMP/evidence/TARGET_HEADER.txt"
          "$NM" -u "$RUNNER_TEMP/OKN_R56_TRUE7CH_GAIN_ONLY_BP1048P4.o" > "$RUNNER_TEMP/evidence/TARGET_UNRESOLVED.txt" || true
          test -s "$RUNNER_TEMP/OKN_R56_TRUE7CH_GAIN_ONLY_BP1048P4.o"
          echo "TARGET_COMPILE_D1088=PASS"

      - name: Link against actual BT_Audio_APP memory layout (smoke, not for flash)
        shell: bash
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/bp1048sdk"
          CC="$RUNNER_TEMP/nds/nds32le-elf-mculib-v3s/bin/nds32le-elf-gcc"
          OBJCOPY="$RUNNER_TEMP/nds/nds32le-elf-mculib-v3s/bin/nds32le-elf-objcopy"
          SIZE="$RUNNER_TEMP/nds/nds32le-elf-mculib-v3s/bin/nds32le-elf-size"
          cat > "$RUNNER_TEMP/r56_main.c" <<'C'
          #include "okn56_runtime.h"
          static okn56_runtime_t g_r56;
          int main(void){
              (void)okn56_runtime_init(&g_r56,48000u,5u);
              for(;;) { }
              return 0;
          }
          C
          INC="-I$R56_ROOT/firmware/include -I$R56_ROOT/firmware/src"
          "$CC" -mcpu=d1088-spu -mext-dsp -Os $INC -c "$RUNNER_TEMP/r56_main.c" -o "$RUNNER_TEMP/target_obj/r56_main.o"
          CRT="$S/MVsB1_Base_SDK/examples/Example_GPIO/Debug/startup"
          for x in crt0.o init-default.o interrupt.o retarget.o; do test -s "$CRT/$x"; done
          set +e
          "$CC" -nostartfiles -static -mcmodel=medium -mext-dsp             -T"$S/BT_Audio_APP/nds32-ae210p.ld" -Wl,--gc-sections             "$CRT/crt0.o" "$CRT/init-default.o" "$CRT/interrupt.o" "$CRT/retarget.o"             "$RUNNER_TEMP/target_obj/r56_main.o" "$RUNNER_TEMP/target_obj/okn56_gain7.o" "$RUNNER_TEMP/target_obj/okn56_runtime.o"             -Wl,--start-group             "$S/MVsB1_Base_SDK/middleware/audio/libAudioEffectLibrary.a"             "$S/MVsB1_Base_SDK/driver/driver/libDriver.a"             -lm -lc -lgcc -ldsp             -Wl,--end-group             -Wl,-Map,"$RUNNER_TEMP/evidence/R56_BT_AUDIO_LAYOUT.map"             -o "$RUNNER_TEMP/OKN_R56_BT_AUDIO_LAYOUT_SMOKE_NOT_FOR_FLASH.adx"             > "$RUNNER_TEMP/evidence/R56_BT_AUDIO_LAYOUT_LINK.log" 2>&1
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            echo 'BT_AUDIO_LAYOUT_LINK=PASS' | tee "$RUNNER_TEMP/evidence/LAYOUT_RESULT.txt"
            "$SIZE" "$RUNNER_TEMP/OKN_R56_BT_AUDIO_LAYOUT_SMOKE_NOT_FOR_FLASH.adx" | tee "$RUNNER_TEMP/evidence/LAYOUT_SIZE.txt"
            "$OBJCOPY" -S -O binary "$RUNNER_TEMP/OKN_R56_BT_AUDIO_LAYOUT_SMOKE_NOT_FOR_FLASH.adx" "$RUNNER_TEMP/OKN_R56_BT_AUDIO_LAYOUT_SMOKE_NOT_FOR_FLASH.bin"
          else
            echo 'BT_AUDIO_LAYOUT_LINK=NEEDS_INTEGRATION_WORK' | tee "$RUNNER_TEMP/evidence/LAYOUT_RESULT.txt"
            echo "LINK_RC=$RC" >> "$RUNNER_TEMP/evidence/LAYOUT_RESULT.txt"
          fi
          echo 'PRODUCTION_FLASH_IMAGE=NO' >> "$RUNNER_TEMP/evidence/LAYOUT_RESULT.txt"
          echo 'FLASH_ALLOWED=NO' >> "$RUNNER_TEMP/evidence/LAYOUT_RESULT.txt"
          cat "$RUNNER_TEMP/evidence/LAYOUT_RESULT.txt"

      - name: Package R56 integration evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/r56_fullfw_out"
          rm -rf "$OUT" && mkdir -p "$OUT"
          cp "$RUNNER_TEMP/R56_SOURCE.zip" "$OUT/OKN_R56_FULLFW_INTEGRATION_SOURCE.zip"
          cp "$RUNNER_TEMP/OKN_R56_TRUE7CH_GAIN_ONLY_BP1048P4.o" "$OUT/"
          cp "$RUNNER_TEMP/HOST_TEST.log" "$OUT/"
          cp "$RUNNER_TEMP/SANITIZE.log" "$OUT/"
          cp "$RUNNER_TEMP/R56_AUDIT.txt" "$OUT/"
          cp "$RUNNER_TEMP/evidence"/* "$OUT/" 2>/dev/null || true
          cp "$RUNNER_TEMP/OKN_R56_BT_AUDIO_LAYOUT_SMOKE_NOT_FOR_FLASH.adx" "$OUT/" 2>/dev/null || true
          cp "$RUNNER_TEMP/OKN_R56_BT_AUDIO_LAYOUT_SMOKE_NOT_FOR_FLASH.bin" "$OUT/" 2>/dev/null || true
          cat > "$OUT/BUILD_SCOPE.txt" <<'SCOPE'
          OKN R56 BP1048P4 FULL-FIRMWARE INTEGRATION GATE
          Dedicated Gain: YES, 7 independent channels
          Gain via EQ: NO
          Gain range: -70.0 .. +6.0 dB
          Gain step: 0.5 dB
          Custom firmware Gain IDs: 22..28
          Custom firmware identity: ID29 raw ASCII OKN6
          App must verify ID29=OKN6 before Gain writes.
          Target compile: NDS32 d1088-spu
          Linker probe: actual public BT_Audio_APP/nds32-ae210p.ld
          This artifact is NOT a production flash image.
          LIVE_BOARD_USB=NO
          HOST_TO_DEVICE_USB=NO
          FLASH_ERASE_WRITE=NO
          FLASH_ALLOWED=NO
          SCOPE
          (cd "$OUT" && sha256sum * > SHA256SUMS.txt)

      - name: Upload R56 full-firmware integration artifact
        uses: actions/upload-artifact@v7
        with:
          name: OKN_R56_TRUE7CH_FULLFW_INTEGRATION_GATE
          path: r56_fullfw_out/*
          if-no-files-found: error
          retention-days: 30

      - name: Final fail-closed assertion
        shell: bash
        run: |
          set -euo pipefail
          test "$LIVE_BOARD_USB" = "NO"
          test "$HOST_TO_DEVICE_USB" = "NO"
          test "$FLASH_ERASE_WRITE" = "NO"
          test "$FLASH_ALLOWED" = "NO"
          grep -q 'GAIN_VIA_EQ=NO' r56_fullfw_out/R56_AUDIT.txt
          grep -q 'identity OKN6' r56_fullfw_out/HOST_TEST.log
          test -s r56_fullfw_out/OKN_R56_TRUE7CH_GAIN_ONLY_BP1048P4.o
          echo "R56_INTEGRATION_GATE=PASS"
          echo "GAIN_VIA_EQ=NO"
          echo "FLASH_ALLOWED=NO"
