      - name: R45.1 hard safety and launch gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYSAFE'
          from pathlib import Path
          root=Path('/tmp/r45_1src/r45_1_src')
          k=(root/'android_template/MainActivity.kt.in').read_text()
          c=(root/'android_template/usbfs_diag.cpp.in').read_text()
          d=(root/'lib/usb_readonly.dart').read_text()

          forbidden=[
              'HID_SET_REPORT','USB_DIR_OUT','bulkTransfer','UsbRequest',
              'setConfiguration','setInterface','SpiFlashErase','SpiFlashWrite',
              'SaveParams','Reset_McuSystem','0x58','0x57','0x11',
          ]
          bad=[x for x in forbidden if x in k]
          if bad:
              raise SystemExit('forbidden R45.1 native token(s): '+', '.join(bad))

          required=[
              'HID_GET_REPORT = 0x01','HID_GET_IDLE = 0x02',
              'HID_REPORT_TYPE_INPUT = 0x01','HID_REPORT_TYPE_FEATURE = 0x03',
              'USB_GET_STATUS = 0x00','USB_GET_INTERFACE = 0x0A',
              'RUNTIME_GET_REPORT_REQUEST_TYPE','RUNTIME_STANDARD_INTERFACE_IN',
              'nativeUsbfsControlTransfer','connection.fileDescriptor',
              'ep0_unclaimed','ep0_claimed','claimInterface(iface4, true)',
              'ensureNativeLibraryLoaded','nativeLoadAttempted','nativeLoadError',
              'native_usbfs_unavailable','NOT_SENT'
          ]
          for token in required:
              if token not in k:
                  raise SystemExit('missing R45.1 proof token: '+token)

          # Critical launch regression guard: native library may not be loaded by a class/companion initializer.
          compact=''.join(k.split())
          if 'init{System.loadLibrary("usbfsdiag")}' in compact:
              raise SystemExit('R45.1 regression: eager System.loadLibrary still present at app startup')
          if 'try{System.loadLibrary("usbfsdiag")' not in compact:
              raise SystemExit('R45.1 lazy load try/catch missing')

          if 'USBDEVFS_CONTROL' not in c:
              raise SystemExit('native usbfs control path missing')
          if any(x in c for x in ['USBDEVFS_SUBMITURB','USBDEVFS_BULK','USBDEVFS_RESET']):
              raise SystemExit('forbidden usbfs operation')
          if "'ep0Semantics'" not in d:
              raise SystemExit('Dart EP0 method missing')
          print('PASS R45.1 safety: launch-safe lazy JNI + read-only EP0 only')
          PYSAFE

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android scaffold and overlay R45.1 source
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          rm -rf /tmp/okn_r45_1_app
          flutter create --platforms=android --org com.okn.dsp --project-name okn_dsp_r45_1 /tmp/okn_r45_1_app

          rm -rf /tmp/okn_r45_1_app/lib /tmp/okn_r45_1_app/test
          cp -a "$R45_1_SRC/lib" /tmp/okn_r45_1_app/lib
          cp -a "$R45_1_SRC/test" /tmp/okn_r45_1_app/test
          cp "$R45_1_SRC/pubspec.yaml" /tmp/okn_r45_1_app/pubspec.yaml
          cp "$R45_1_SRC/analysis_options.yaml" /tmp/okn_r45_1_app/analysis_options.yaml
          cp "$R45_1_SRC/README_R45_TH.txt" /tmp/okn_r45_1_app/README_R45_1_TH.txt

          MAIN="$(find /tmp/okn_r45_1_app/android/app/src/main/kotlin -name MainActivity.kt | head -n1)"
          test -f "$MAIN"
          PKG="$(sed -n 's/^package[[:space:]]\+//p' "$MAIN" | head -n1)"
          test -n "$PKG"
          sed "s/^package __PACKAGE__$/package $PKG/" "$R45_1_SRC/android_template/MainActivity.kt.in" > "$MAIN"

          MANIFEST=/tmp/okn_r45_1_app/android/app/src/main/AndroidManifest.xml
          python3 - <<'PYMAN'
          from pathlib import Path
          p=Path('/tmp/okn_r45_1_app/android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          marker='    <application'
          feature='    <uses-feature android:name="android.hardware.usb.host" android:required="false" />\n'
          if marker not in s:
              raise SystemExit('AndroidManifest application marker missing')
          if 'android.hardware.usb.host' not in s:
              s=s.replace(marker,feature+marker,1)
          p.write_text(s)
          PYMAN

          # Native bridge stays optional at runtime and is linked for 16 KiB page-size devices.
          NDK="$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          test -n "$NDK"
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++"
          test -x "$CLANG"
          CPPDIR=/tmp/okn_r45_1_app/android/app/src/main/cpp
          JNIDIR=/tmp/okn_r45_1_app/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$CPPDIR" "$JNIDIR"
          PKG_JNI="$(python3 - "$PKG" <<'PYJNI'
          import sys
          pkg=sys.argv[1]
          print(pkg.replace('_','_1').replace('.','_')+'_MainActivity')
          PYJNI
          )"
          sed "s/__JNI_CLASS__/$PKG_JNI/g" "$R45_1_SRC/android_template/usbfs_diag.cpp.in" > "$CPPDIR/usbfs_diag.cpp"
          "$CLANG" -std=c++17 -shared -fPIC -O2 \
            -Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384 \
            "$CPPDIR/usbfs_diag.cpp" -o "$JNIDIR/libusbfsdiag.so"
          test -s "$JNIDIR/libusbfsdiag.so"
          file "$JNIDIR/libusbfsdiag.so"
          readelf -lW "$JNIDIR/libusbfsdiag.so" | grep ' LOAD '
          python3 - "$JNIDIR/libusbfsdiag.so" <<'PYELF'
          import subprocess,sys,re
          out=subprocess.check_output(['readelf','-lW',sys.argv[1]],text=True)
          aligns=[]
          for line in out.splitlines():
              if line.lstrip().startswith('LOAD '):
                  token=line.split()[-1]
                  aligns.append(int(token,16))
          if not aligns or min(aligns) < 16384:
              raise SystemExit(f'ELF LOAD alignment is not 16 KiB safe: {aligns}')
          print('PASS native ELF LOAD alignment:', aligns)
          PYELF

          echo "R45_1_APP=/tmp/okn_r45_1_app" >> "$GITHUB_ENV"
          echo "R45_1_MAIN_ACTIVITY=$MAIN" >> "$GITHUB_ENV"
          echo "R45_1_NATIVE_CPP=$CPPDIR/usbfs_diag.cpp" >> "$GITHUB_ENV"

      - name: Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$R45_1_APP"
          flutter pub get

      - name: Protocol and regression unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$R45_1_APP"
          flutter test

      - name: Static analysis
        shell: bash
        run: |
          set -euo pipefail
          cd "$R45_1_APP"
          flutter analyze

      - name: Build arm64 Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$R45_1_APP"
          flutter build apk --debug --target-platform android-arm64
          test -s build/app/outputs/flutter-apk/app-debug.apk
          unzip -l build/app/outputs/flutter-apk/app-debug.apk | grep -q 'lib/arm64-v8a/libusbfsdiag.so'

      - name: Post-build R45.1 launch and safety audit
        shell: bash
        run: |
          set -euo pipefail
          K="$R45_1_MAIN_ACTIVITY"
          C="$R45_1_NATIVE_CPP"
          ! grep -Eq 'HID_SET_REPORT|USB_DIR_OUT|bulkTransfer|UsbRequest|setConfiguration|setInterface|SpiFlashErase|SpiFlashWrite|SaveParams|Reset_McuSystem|0x58|0x57|0x11' "$K"
          grep -q 'ensureNativeLibraryLoaded' "$K"
          grep -q 'native_usbfs_unavailable' "$K"
          grep -q 'System.loadLibrary("usbfsdiag")' "$K"
          ! python3 - "$K" <<'PYEAGER'
          from pathlib import Path
          import sys
          k=''.join(Path(sys.argv[1]).read_text().split())
          raise SystemExit(0 if 'init{System.loadLibrary("usbfsdiag")}' in k else 1)
          PYEAGER
          grep -q 'USBDEVFS_CONTROL' "$C"
          ! grep -Eq 'USBDEVFS_SUBMITURB|USBDEVFS_BULK|USBDEVFS_RESET' "$C"
          echo 'PASS post-build R45.1: no eager JNI load; read-only EP0 only'

      - name: Package R45.1 APK and evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/r45_1_out
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp "$R45_1_APP/build/app/outputs/flutter-apk/app-debug.apk" "$OUT/OKN_DSP_R45_1_EP0_HID_LAUNCHSAFE_debug.apk"
          cp /tmp/OKN_DSP_R45_1_EP0_HID_LAUNCHSAFE_Source.zip "$OUT/OKN_DSP_R45_1_EP0_HID_LAUNCHSAFE_Source.zip"
          cp "$R45_1_APP/README_R45_1_TH.txt" "$OUT/README_R45_1_TH.txt"
          cp "$R45_1_MAIN_ACTIVITY" "$OUT/MainActivity_R45_1.kt"
          cp "$R45_1_NATIVE_CPP" "$OUT/usbfs_diag_R45_1.cpp"
          cat > "$OUT/R45_1_SAFETY_STATE.txt" <<'EOF'
          R44_4_BASELINE_ZERO_CONFIRMED_ON_REAL_BOARD=YES
          R45_PREVIOUS_APK_LAUNCH_FAILURE_REPORTED=YES
          EAGER_NATIVE_LIBRARY_LOAD=NO
          NATIVE_LIBRARY_LOAD=LAZY_TRY_CATCH
          NATIVE_16K_PAGE_LINKING=YES
          RUNTIME_INTERFACE=4
          R30_SIGNATURE_REQUIRED=YES
          SET_REPORT=NO
          UFE_COMMANDS=NO
          CONTROL_0x11=NO
          FLASH_ERASE_PROGRAM_COMMIT=NO
          RESET=NO
          JAVA_CONTROLTRANSFER_DIRECT=YES
          JAVA_CONTROLTRANSFER_OFFSET1=YES
          NATIVE_USBDEVFS_CONTROL=OPTIONAL_LAZY
          TEST_BEFORE_AND_AFTER_CLAIM_IF4=YES
          EOF
          (cd "$OUT" && sha256sum * > SHA256SUMS.txt)

      - name: Upload R45.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN_DSP_R45_1_EP0_HID_LAUNCHSAFE_APK
          path: /tmp/r45_1_out/*
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        shell: bash
        run: |
          {
            echo '## R45.1 Android EP0/HID launch-safe read-only diagnostic'
            echo '- Fixes R45 launch risk: no System.loadLibrary during Activity/companion initialization'
            echo '- Native usbfs is loaded lazily inside the diagnostic and load/JNI errors are caught'
            echo '- Native library is linked with 16 KiB ELF page alignment for modern Android devices'
            echo '- Java EP0 diagnostics remain usable even if native loading fails'
            echo '- No SET_REPORT, no 0x58/0x57/0x11, no flash/reset path'
          } >> "$GITHUB_STEP_SUMMARY"
