name: OKN BP1048P4 R86 AUTO-RUN Recover R85 Actions Status

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/OKN_BP1048P4_R86_AUTO_RUN_R85_STATUS_RECOVERY.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: okn-r86-${{ github.ref }}
  cancel-in-progress: true

env:
  R85_HEAD_SHA: "911216c59e253d7c80c48a603ec86089b64eb3e2"
  R85_WORKFLOW_FILE: "OKN_BP1048P4_R85_AUTO_RUN_FLASH_READBACK_REVERSE_CALLGRAPH.yml"

jobs:
  recover:
    name: Recover exact R85 run status
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Query GitHub Actions for R85 by exact head SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r86
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          AUTH=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          # Query all workflow runs for the exact R85 commit SHA.
          curl -fsSL "${AUTH[@]}" \
            "$API/actions/runs?head_sha=$R85_HEAD_SHA&per_page=100" \
            -o /tmp/r86/runs.json

          python3 - <<'PY'
          import json, os
          from pathlib import Path

          runs = json.loads(Path('/tmp/r86/runs.json').read_text()).get('workflow_runs', [])
          target = [
              r for r in runs
              if r.get('head_sha') == os.environ['R85_HEAD_SHA']
              and (
                  r.get('path','').endswith(os.environ['R85_WORKFLOW_FILE'])
                  or 'R85' in (r.get('name') or '')
              )
          ]

          # Prefer the newest exact R85 run.
          target.sort(key=lambda x: x.get('created_at',''), reverse=True)
          run = target[0] if target else None

          result = {
              'r85_head_sha': os.environ['R85_HEAD_SHA'],
              'r85_workflow_file': os.environ['R85_WORKFLOW_FILE'],
              'matching_run_count': len(target),
              'run': run,
          }
          Path('/tmp/r86/selected_run.json').write_text(
              json.dumps(result, indent=2, ensure_ascii=False) + '\n'
          )

          if run and run.get('id'):
              Path('/tmp/r86/run_id.txt').write_text(str(run['id']))
          PY

          : > /tmp/r86/jobs.json
          : > /tmp/r86/artifacts.json
          : > /tmp/r86/main-job-log-tail.txt

          if [ -s /tmp/r86/run_id.txt ]; then
            RUN_ID="$(cat /tmp/r86/run_id.txt)"

            curl -fsSL "${AUTH[@]}" \
              "$API/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" \
              -o /tmp/r86/jobs.json

            curl -fsSL "${AUTH[@]}" \
              "$API/actions/runs/$RUN_ID/artifacts?per_page=100" \
              -o /tmp/r86/artifacts.json

            python3 - <<'PY'
          import json
          from pathlib import Path

          jobs = json.loads(Path('/tmp/r86/jobs.json').read_text()).get('jobs', [])
          main = next(
              (j for j in jobs
               if j.get('name') == 'Reverse callgraph from every SpiFlashRead / STATIC ONLY / NO USB / NO FLASH'),
              None
          )
          if main and main.get('id'):
              Path('/tmp/r86/main_job_id.txt').write_text(str(main['id']))
          PY

            if [ -s /tmp/r86/main_job_id.txt ]; then
              JOB_ID="$(cat /tmp/r86/main_job_id.txt)"
              set +e
              curl -fsSL "${AUTH[@]}" "$API/actions/jobs/$JOB_ID/logs" \
                -o /tmp/r86/main-job.log
              RC=$?
              set -e
              if [ "$RC" -eq 0 ]; then
                tail -n 300 /tmp/r86/main-job.log > /tmp/r86/main-job-log-tail.txt
              else
                printf 'JOB_LOG_NOT_AVAILABLE rc=%s\n' "$RC" \
                  > /tmp/r86/main-job-log-tail.txt
              fi
            fi
          fi

      - name: Build R85 status report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          sel = json.loads(Path('/tmp/r86/selected_run.json').read_text())
          run = sel.get('run')
          jobs = {}
          artifacts = {}

          if Path('/tmp/r86/jobs.json').stat().st_size:
              try: jobs = json.loads(Path('/tmp/r86/jobs.json').read_text())
              except Exception: jobs = {}

          if Path('/tmp/r86/artifacts.json').stat().st_size:
              try: artifacts = json.loads(Path('/tmp/r86/artifacts.json').read_text())
              except Exception: artifacts = {}

          lines = [
              '# R86 — R85 GitHub Actions Status Recovery',
              '',
              f"- R85 head SHA: `{sel['r85_head_sha']}`",
              f"- Matching R85 runs: **{sel['matching_run_count']}**",
          ]

          if not run:
              lines += [
                  '- Result: **NO_R85_RUN_FOUND**',
                  '- Meaning: GitHub API returned no R85 workflow run for the exact uploaded commit.',
                  '- Next action: inspect workflow parse/trigger validity; do not touch the DSP board.',
              ]
          else:
              lines += [
                  f"- Run ID: `{run.get('id')}`",
                  f"- Status: **{run.get('status')}**",
                  f"- Conclusion: **{run.get('conclusion')}**",
                  f"- Event: `{run.get('event')}`",
                  f"- Created: `{run.get('created_at')}`",
                  f"- Updated: `{run.get('updated_at')}`",
                  '',
                  '## Jobs',
              ]
              for j in jobs.get('jobs', []):
                  lines.append(
                      f"- `{j.get('name')}` — status=`{j.get('status')}`, "
                      f"conclusion=`{j.get('conclusion')}`, id=`{j.get('id')}`"
                  )
              lines += ['', '## Artifacts']
              arts = artifacts.get('artifacts', [])
              if arts:
                  for a in arts:
                      lines.append(
                          f"- `{a.get('name')}` — id=`{a.get('id')}`, "
                          f"size=`{a.get('size_in_bytes')}`, expired=`{a.get('expired')}`"
                      )
              else:
                  lines.append('- none')

          lines += [
              '',
              '## Main job log tail',
              '~~~text',
              Path('/tmp/r86/main-job-log-tail.txt').read_text(errors='ignore'),
              '~~~',
              '',
              '## Safety',
              '- R86 only calls GitHub REST API.',
              '- No DSP USB access.',
              '- No AA55.',
              '- No 0x11.',
              '- No erase/write/flash.',
          ]

          Path('/tmp/r86/R86_R85_STATUS.md').write_text('\n'.join(lines) + '\n')
          PY

          cat /tmp/r86/R86_R85_STATUS.md >> "$GITHUB_STEP_SUMMARY"

      - name: Persist R85 status to main
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/r86/R86_R85_STATUS.md .github/R86_R85_STATUS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/R86_R85_STATUS.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record R86 R85 status [skip ci]"
          git push origin HEAD:main

      - name: Upload status evidence
        uses: actions/upload-artifact@v7
        with:
          name: R86-R85-STATUS-RECOVERY
          path: |
            /tmp/r86/R86_R85_STATUS.md
            /tmp/r86/selected_run.json
            /tmp/r86/runs.json
            /tmp/r86/jobs.json
            /tmp/r86/artifacts.json
            /tmp/r86/main-job-log-tail.txt
          if-no-files-found: error
          retention-days: 30
