name: Build OKN DSP Auto Version

on:
  push:
    paths:
      - 'OKN_DSP_ANDROID_V*.zip'
      - '.github/workflows/build-okn-dsp-v1.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect latest OKN_DSP source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 1 -type f -name 'OKN_DSP_ANDROID_V*.zip' -printf '%f\n' | sort -V | tail -1)
          if [ -z "${ZIP:-}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No OKN_DSP_ANDROID_V*.zip found. Workflow is installed and waiting for a source ZIP."
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Selected source: $ZIP"
          sha256sum "$ZIP"

      - name: Verify and extract Sources
        if: steps.source.outputs.present == 'true'
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          ZIP='${{ steps.source.outputs.zip }}'
          unzip -tq "$ZIP"
          rm -rf /tmp/okn_build
          mkdir -p /tmp/okn_build
          unzip -q "$ZIP" -d /tmp/okn_build
          test -d /tmp/okn_build/Sources
          cd /tmp/okn_build/Sources
          MANIFEST=$(find . -maxdepth 1 -type f -name 'OKN_DSP_V*_SHA256.txt' -printf '%f\n' | sort -V | tail -1)
          test -n "$MANIFEST"
          sha256sum -c "$MANIFEST"
          echo "manifest=$MANIFEST" >> "$GITHUB_OUTPUT"

      - name: Read app version
        if: steps.source.outputs.present == 'true'
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          FILE=/tmp/okn_build/Sources/app/build.gradle.kts
          VERSION_CODE=$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*\([0-9][0-9]*\).*/\1/p' "$FILE" | head -1)
          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$FILE" | head -1)
          APP_ID=$(sed -n 's/^[[:space:]]*applicationId[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$FILE" | head -1)
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          test "$APP_ID" = 'com.okn.dsp'
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"
          echo "Building $APP_ID versionCode=$VERSION_CODE versionName=$VERSION_NAME"

      - name: Set up JDK 17
        if: steps.source.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run source preflight
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/okn_build/Sources
          PREFLIGHT=$(find . -maxdepth 1 -type f -name 'preflight_v*.py' -printf '%f\n' | sort -V | tail -1)
          if [ -n "${PREFLIGHT:-}" ]; then
            python3 "$PREFLIGHT"
          fi
          if [ -f app/okn_dsp_stable_debug.keystore ]; then
            echo 'ba1c52f2607c09953c52fdd79c5f72026aaf0adb8aa44bcba277f7d9b49d9511  app/okn_dsp_stable_debug.keystore' | sha256sum -c -
            CERT=$(keytool -list -v -keystore app/okn_dsp_stable_debug.keystore -storepass android -alias androiddebugkey | awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr 'A-F' 'a-f')
            test "$CERT" = 'c3da85af2e978dbd0ed9bb695e5c79a263189595c116ad93a1ded75a2eb98397'
          fi

      - name: Set up Android SDK
        if: steps.source.outputs.present == 'true'
        uses: android-actions/setup-android@v3

      - name: Install Android 35 packages
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        if: steps.source.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        if: steps.source.outputs.present == 'true'
        working-directory: /tmp/okn_build/Sources
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK and prepare artifact
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VC='${{ steps.meta.outputs.version_code }}'
          VN='${{ steps.meta.outputs.version_name }}'
          APK=/tmp/okn_build/Sources/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          CERT=$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' /tmp/apksigner.txt | tr -d ':' | tr 'A-F' 'a-f')
          test "$CERT" = 'c3da85af2e978dbd0ed9bb695e5c79a263189595c116ad93a1ded75a2eb98397'
          BADGING=$($AAPT dump badging "$APK" | head -1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='com.okn.dsp'"
          echo "$BADGING" | grep -q "versionCode='$VC'"
          echo "$BADGING" | grep -q "versionName='$VN'"

          ART=/tmp/okn_artifact
          rm -rf "$ART"
          mkdir -p "$ART/Sources"
          OUT="$ART/OKN_DSP_V${VC}-debug.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$ART/Sources/OKN_DSP_V${VC}_APK_SHA256.txt"
          sha256sum '${{ steps.source.outputs.zip }}' > "$ART/Sources/OKN_DSP_V${VC}_SOURCE_ZIP_SHA256.txt"
          cp "/tmp/okn_build/Sources/${{ steps.extract.outputs.manifest }}" "$ART/Sources/"
          printf 'applicationId=com.okn.dsp\nversionCode=%s\nversionName=%s\nsignerSHA256=%s\nsourceZip=%s\n' \
            "$VC" "$VN" "$CERT" '${{ steps.source.outputs.zip }}' > "$ART/Sources/OKN_DSP_V${VC}_BUILD_INFO.txt"

      - name: Upload APK artifact
        if: steps.source.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-V${{ steps.meta.outputs.version_code }}-APK
          path: /tmp/okn_artifact/**
          if-no-files-found: error
          retention-days: 30
