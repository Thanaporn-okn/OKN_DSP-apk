name: Build OKN DSP V1 Reference Realtime

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_ANDROID_V1_REFERENCE_REALTIME.zip'
      - 'OKN_DSP_V1_SHA256.txt'
      - '.github/workflows/build-okn-dsp-v1.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and extract V1 source
        shell: bash
        run: |
          set -euo pipefail
          echo '2a1e60ab1fb67b24b9dc33e40a598c3262542b4d7019aca65f0eb1289f834d64  OKN_DSP_ANDROID_V1_REFERENCE_REALTIME.zip' | sha256sum -c -
          rm -rf /tmp/okn_v1
          mkdir -p /tmp/okn_v1
          unzip -q OKN_DSP_ANDROID_V1_REFERENCE_REALTIME.zip -d /tmp/okn_v1
          test -f /tmp/okn_v1/preflight_v1.py
          test -f /tmp/okn_v1/evidence/OKN_DSP_V1_UI_MASTER_REFERENCE.png

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run V1 preflight and verify signing identity
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/okn_v1
          python3 preflight_v1.py
          echo 'ba1c52f2607c09953c52fdd79c5f72026aaf0adb8aa44bcba277f7d9b49d9511  app/okn_dsp_stable_debug.keystore' | sha256sum -c -
          CERT=$(keytool -list -v -keystore app/okn_dsp_stable_debug.keystore -storepass android -alias androiddebugkey | awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr 'A-F' 'a-f')
          test "$CERT" = 'c3da85af2e978dbd0ed9bb695e5c79a263189595c116ad93a1ded75a2eb98397'
          echo "Stable signing certificate SHA-256: $CERT"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build V1 stable-signed debug APK
        working-directory: /tmp/okn_v1
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK identity and signer
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn_v1/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          CERT=$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' /tmp/apksigner.txt | tr -d ':' | tr 'A-F' 'a-f')
          test "$CERT" = 'c3da85af2e978dbd0ed9bb695e5c79a263189595c116ad93a1ded75a2eb98397'
          BADGING=$("$AAPT" dump badging "$APK" | head -1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='com.okn.dsp'"
          echo "$BADGING" | grep -q "versionCode='1'"
          echo "$BADGING" | grep -q "versionName='1.0.0-v1'"
          mkdir -p /tmp/artifact
          cp "$APK" /tmp/artifact/OKN_DSP_V1_REFERENCE_REALTIME-debug.apk
          sha256sum /tmp/artifact/OKN_DSP_V1_REFERENCE_REALTIME-debug.apk | tee /tmp/artifact/OKN_DSP_V1_APK_SHA256.txt

      - name: Upload V1 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-V1-REFERENCE-REALTIME-debug-apk
          path: /tmp/artifact/*
          if-no-files-found: error
