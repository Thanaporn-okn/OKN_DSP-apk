name: Build OKN DSP V1

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect V1 source ZIP
        id: source
        shell: bash
        run: |
          if [ -f OKN_DSP_V1_Sources.zip ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "OKN_DSP V1 source found — automatic build starts now."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "OKN_DSP_V1_Sources.zip is not in repository root yet."
            echo "Upload the ZIP; the next push will start this workflow automatically."
          fi

      - name: Verify V1 ZIP and Sources SHA256
        if: steps.source.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo 'c4ba97333ffbb4ce2724ef63d931b1b2e0c66417f5be1fbc14e7fb693a16c013  OKN_DSP_V1_Sources.zip' | sha256sum -c -
          unzip -tq OKN_DSP_V1_Sources.zip
          rm -rf /tmp/okn_dsp_v1
          mkdir -p /tmp/okn_dsp_v1
          unzip -q OKN_DSP_V1_Sources.zip -d /tmp/okn_dsp_v1
          test -d /tmp/okn_dsp_v1/Sources
          cd /tmp/okn_dsp_v1/Sources
          test -s OKN_DSP_V1_SHA256.txt
          sha256sum -c OKN_DSP_V1_SHA256.txt
          python3 preflight_v1.py

      - name: Set up JDK 17
        if: steps.source.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify stable signing identity
        if: steps.source.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/okn_dsp_v1/Sources
          echo 'ba1c52f2607c09953c52fdd79c5f72026aaf0adb8aa44bcba277f7d9b49d9511  app/okn_dsp_stable_debug.keystore' | sha256sum -c -
          CERT=$(keytool -list -v \
            -keystore app/okn_dsp_stable_debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            | awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr 'A-F' 'a-f')
          test "$CERT" = 'c3da85af2e978dbd0ed9bb695e5c79a263189595c116ad93a1ded75a2eb98397'
          echo "Stable signer certificate SHA-256: $CERT"

      - name: Set up Android SDK
        if: steps.source.outputs.available == 'true'
        uses: android-actions/setup-android@v3

      - name: Install Android 35 packages
        if: steps.source.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        if: steps.source.outputs.available == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build V1 stable-signed APK
        if: steps.source.outputs.available == 'true'
        working-directory: /tmp/okn_dsp_v1/Sources
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK package, version and signer
        if: steps.source.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/okn_dsp_v1/Sources/app/build/outputs/apk/debug/app-debug.apk
          test -s "$SRC"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$SRC" | grep -F "package: name='com.okn.dsp' versionCode='1' versionName='1.0.0'"
          "$APKSIGNER" verify --verbose "$SRC"
          CERT=$($APKSIGNER verify --print-certs "$SRC" \
            | awk -F': ' '/certificate SHA-256 digest:/{print $2; exit}' \
            | tr -d ':' | tr 'A-F' 'a-f')
          test "$CERT" = 'c3da85af2e978dbd0ed9bb695e5c79a263189595c116ad93a1ded75a2eb98397'
          echo "APK signer certificate SHA-256: $CERT"

      - name: Prepare V1 artifact
        if: steps.source.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/okn_dsp_v1/out
          cp /tmp/okn_dsp_v1/Sources/app/build/outputs/apk/debug/app-debug.apk /tmp/okn_dsp_v1/out/OKN_DSP_V1.apk
          cd /tmp/okn_dsp_v1/out
          sha256sum OKN_DSP_V1.apk > OKN_DSP_V1_APK_SHA256.txt
          cp /tmp/okn_dsp_v1/Sources/OKN_DSP_V1_SHA256.txt ./OKN_DSP_V1_Sources_SHA256.txt
          cat OKN_DSP_V1_APK_SHA256.txt

      - name: Upload installable V1 APK
        if: steps.source.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-V1-APK
          path: /tmp/okn_dsp_v1/out/
          if-no-files-found: error
          retention-days: 30
