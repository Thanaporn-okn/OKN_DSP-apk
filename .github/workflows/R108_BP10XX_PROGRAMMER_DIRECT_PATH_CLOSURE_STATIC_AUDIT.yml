name: R108 BP10xx programmer vs production direct-path closure static audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R108_BP10XX_PROGRAMMER_DIRECT_PATH_CLOSURE_STATIC_AUDIT.yml"

permissions:
  contents: read

concurrency:
  group: r108-bp10xx-direct-path-closure-${{ github.ref }}
  cancel-in-progress: true

env:
  DRIVE_FILE_ID: 15hdF2vnnUMVtIFKhZPGLPwBSEZpyqP2H
  SOURCE_ZIP: MVAssistant_BP10xx_V1.8.11.zip
  EXPECTED_ZIP_SHA256: 8074b3488453e268dc755fa88b2d0bc8ef14fc8c51c3de4e3a783279c195878f
  EXPECTED_EXE_SHA256: a62a968f6e9dc06473390ec26d8e1a6ad70d88c242f05acb2463e5081ec12799
  PRODUCTION_VID: "6324"
  PRODUCTION_PID: "1719"
  FLASH_ALLOWED: "NO"

jobs:
  static-audit:
    name: STATIC ONLY - no execution - no USB - no board - no flash
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r108/input /tmp/r108/extract /tmp/r108/evidence
          cat > /tmp/r108/evidence/R108_SAFETY.txt <<'EOF'
          R108_MODE=STATIC_OFFLINE_ONLY
          R108_VENDOR_BINARY_EXECUTED=NO
          R108_EMBEDDED_BLOB_EXECUTED=NO
          R108_USB_DEVICE_ACCESS=NO
          R108_BOARD_CONTACT=NO
          R108_AA55_SENT=NO
          R108_LINEIN_AA55_SENT=NO
          R108_RUNTIME_0X11_SENT=NO
          R108_SEND_CHIPERAS_CODEDATA_BOOTDAT_CONSTDAT_CNFGDAT_BTUPDAT_UPINFO_CXXX=NO
          R108_FLASH_READ_EXECUTED=NO
          R108_FLASH_ERASE_EXECUTED=NO
          R108_FLASH_WRITE_EXECUTED=NO
          R108_ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD=NO
          FINAL_REQUIRED_TRANSPORT=SAMSUNG_S25_PLUS_USB_C_DIRECT_TO_DSP_USB_C
          HARDWARE_MODIFICATION=FORBIDDEN
          FLASH_ALLOWED=NO
          EOF

      - name: Install static tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq file unzip python3-pip jq >/dev/null
          python3 -m pip install --disable-pip-version-check --no-input gdown pefile capstone >/dev/null

      - name: Acquire exact pinned MVAssistant package as data only
        shell: bash
        run: |
          set -euo pipefail
          ZIP="/tmp/r108/input/$SOURCE_ZIP"
          python3 -m gdown "$DRIVE_FILE_ID" -O "$ZIP" >/tmp/r108/evidence/R108_GDOWN_STDOUT.txt 2>/tmp/r108/evidence/R108_GDOWN_STDERR.txt || true
          if [ ! -s "$ZIP" ]; then
            curl --fail --location --retry 3 --retry-all-errors \
              "https://drive.usercontent.google.com/download?id=$DRIVE_FILE_ID&export=download&confirm=t" \
              -o "$ZIP"
          fi
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = "$EXPECTED_ZIP_SHA256"
          unzip -q "$ZIP" -d /tmp/r108/extract
          EXE="$(find /tmp/r108/extract -type f -name 'MVAssistant_BP10xx_V1.8.11.exe' -print -quit)"
          test -n "$EXE"
          test "$(sha256sum "$EXE" | awk '{print $1}')" = "$EXPECTED_EXE_SHA256"
          chmod a-x "$EXE" || true
          cp "$EXE" /tmp/r108/input/MVAssistant.exe
          {
            echo "ZIP_SHA256=$EXPECTED_ZIP_SHA256"
            echo "EXE_SHA256=$EXPECTED_EXE_SHA256"
            echo "EXE_SIZE=$(stat -c '%s' "$EXE")"
            echo "PIN_MATCH=YES"
          } > /tmp/r108/evidence/R108_BINARY_PIN.txt

      - name: Extract only derived metadata from R107 embedded-loader candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import pefile, hashlib, math, json, re, struct

          p=Path("/tmp/r108/input/MVAssistant.exe")
          b=p.read_bytes()
          pe=pefile.PE(str(p), fast_load=False)
          ib=pe.OPTIONAL_HEADER.ImageBase

          specs=[
              (0x00CCCD40,0x8C00,"R107_CANDIDATE_A"),
              (0x00CD5940,0x7708,"R107_CANDIDATE_B"),
              (0x00CC0BE0,0xC160,"R107_CANDIDATE_C"),
          ]
          reference_flashboot_sha="cd0e4e03f7072abd48fea2aeb5a54d9360b65acb1bd4d1b37734438cbe5f47c6"
          forbidden_tokens=[b"chiperas",b"upinfo",b"btupdat",b"cnfgdat",b"constdat",b"codedata",b"bootdat",b"cxxx"]
          semantic_tokens=[
              b"p2 downloader", b"B1X Downloader", b"sramdrive",
              b"HandShake2Dongle", b"WriteOnePackageDataToFlash",
              b"Get Code Len & Crc", b"FlashId:", b"Uart0", b"Uart1", b"Uart2",
              b"CheckSum OK", b"CRC1=", b"upgrade"
          ]

          def entropy(x):
              counts=[0]*256
              for q in x: counts[q]+=1
              e=0.0
              if x:
                  for c in counts:
                      if c:
                          p0=c/len(x); e-=p0*math.log2(p0)
              return e

          def descriptor_candidates(x):
              out=[]
              for o in range(0,max(0,len(x)-18+1)):
                  if x[o]!=18 or x[o+1]!=1:
                      continue
                  bcd=x[o+2] | (x[o+3]<<8)
                  mps=x[o+7]
                  if bcd not in (0x0100,0x0110,0x0200,0x0201,0x0210,0x0300,0x0310,0x0320):
                      continue
                  if mps not in (8,16,32,64):
                      continue
                  vid=x[o+8] | (x[o+9]<<8)
                  pid=x[o+10] | (x[o+11]<<8)
                  out.append({
                      "offset":o,
                      "bcdUSB":f"0x{bcd:04X}",
                      "device_class":x[o+4],
                      "device_subclass":x[o+5],
                      "device_protocol":x[o+6],
                      "ep0_mps":mps,
                      "vid":f"{vid:04X}",
                      "pid":f"{pid:04X}",
                      "bcdDevice":f"0x{(x[o+12] | (x[o+13]<<8)):04X}",
                      "iManufacturer":x[o+14],
                      "iProduct":x[o+15],
                      "iSerial":x[o+16],
                      "num_configs":x[o+17],
                  })
              return out

          rows=[]
          for va,size,label in specs:
              off=pe.get_offset_from_rva(va-ib)
              x=b[off:off+size]
              sha=hashlib.sha256(x).hexdigest()
              strings=[s.decode("ascii","replace") for s in re.findall(rb"[\x20-\x7e]{5,}",x)]
              lower=x.lower()
              row={
                  "label":label,
                  "source_va":f"0x{va:08X}",
                  "size":size,
                  "sha256":sha,
                  "entropy":round(entropy(x),5),
                  "matches_reference_flashboot_sha256":sha==reference_flashboot_sha,
                  "is_reference_flashboot_64k_size":size==65536,
                  "semantic_markers":{
                      t.decode("ascii","replace"): (t.lower() in lower) for t in semantic_tokens
                  },
                  "reference_flashboot_command_markers":{
                      t.decode(): (t in lower) for t in forbidden_tokens
                  },
                  "production_vid_pid_descriptor_bytes_present": bytes.fromhex("12 01") in x and bytes.fromhex("24 63 19 17") in x,
                  "raw_le_vid_6324_count":x.count(bytes.fromhex("24 63")),
                  "raw_le_pid_1719_count":x.count(bytes.fromhex("19 17")),
                  "usb_device_descriptor_candidates":descriptor_candidates(x),
                  "interesting_ascii":[
                      s[:220] for s in strings
                      if re.search(r"p2 downloader|B1X|sramdrive|HandShake2Dongle|WriteOnePackageDataToFlash|Get Code Len|FlashId|Uart|USB|HID|CRC|CheckSum|upgrade|Flash",s,re.I)
                  ][:120],
              }
              rows.append(row)

          Path("/tmp/r108/evidence/R108_EMBEDDED_LOADER_METADATA.json").write_text(
              json.dumps(rows,indent=2,ensure_ascii=False)+"\n"
          )
          PY

      - name: Prove host-side HID selection and check production VID PID
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import pefile,json,re
          from capstone import Cs,CS_ARCH_X86,CS_MODE_32
          from capstone.x86 import X86_OP_IMM

          p=Path("/tmp/r108/input/MVAssistant.exe")
          b=p.read_bytes()
          pe=pefile.PE(str(p),fast_load=False)
          ib=pe.OPTIONAL_HEADER.ImageBase
          text=next(s for s in pe.sections if s.Name.rstrip(b"\0")==b".text")
          blob=b[text.PointerToRawData:text.PointerToRawData+text.SizeOfRawData]
          base=ib+text.VirtualAddress
          md=Cs(CS_ARCH_X86,CS_MODE_32); md.detail=True
          ins=list(md.disasm(blob,base))

          # R107 pinned device-selection neighborhood.
          win=[x for x in ins if 0x00409300 <= x.address < 0x00409760]
          lines=[f"0x{x.address:08X}: {x.mnemonic:8s} {x.op_str}" for x in win]
          Path("/tmp/r108/evidence/R108_PROGRAMMER_SELECTION_DISASM.txt").write_text("\n".join(lines)+"\n")

          def has_imm(v):
              for x in win:
                  for op in x.operands:
                      if op.type==X86_OP_IMM and (op.imm & 0xffffffff)==v:
                          return True
              return False

          # Entire text immediate-count checks for production IDs.
          all_imms=[]
          for x in ins:
              for op in x.operands:
                  if op.type==X86_OP_IMM:
                      all_imms.append(op.imm & 0xffffffff)

          ascii_blob=b
          ascii_hits={
              "VID_0633": ascii_blob.find(b"VID_0633")>=0,
              "PID_5322": ascii_blob.find(b"PID_5322")>=0,
              "VID_0288": ascii_blob.find(b"VID_0288")>=0,
              "PID_7966": ascii_blob.find(b"PID_7966")>=0,
              "VID_6324": ascii_blob.find(b"VID_6324")>=0,
              "PID_1719": ascii_blob.find(b"PID_1719")>=0,
              "6324_ASCII": ascii_blob.find(b"6324")>=0,
              "1719_ASCII": ascii_blob.find(b"1719")>=0,
          }

          facts={
              "R107_ACCEPTED_PROGRAMMER_PAIR_1":"0633:5322",
              "R107_ACCEPTED_PROGRAMMER_PAIR_2":"0288:7966",
              "SELECTION_WINDOW_HAS_0633":has_imm(0x0633),
              "SELECTION_WINDOW_HAS_5322":has_imm(0x5322),
              "SELECTION_WINDOW_HAS_0288":has_imm(0x0288),
              "SELECTION_WINDOW_HAS_7966":has_imm(0x7966),
              "SELECTION_WINDOW_HAS_PRODUCTION_6324":has_imm(0x6324),
              "SELECTION_WINDOW_HAS_PRODUCTION_1719":has_imm(0x1719),
              "ENTIRE_TEXT_IMM_6324_COUNT":all_imms.count(0x6324),
              "ENTIRE_TEXT_IMM_1719_COUNT":all_imms.count(0x1719),
              "ASCII_LITERAL_HITS":ascii_hits,
              "PRODUCTION_BOARD_ID":"6324:1719",
          }
          Path("/tmp/r108/evidence/R108_HOST_VID_PID_FACTS.json").write_text(
              json.dumps(facts,indent=2)+"\n"
          )
          PY

      - name: Verify PC-to-programmer handshake strings and report size
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import pefile,json,bisect
          from capstone import Cs,CS_ARCH_X86,CS_MODE_32

          p=Path("/tmp/r108/input/MVAssistant.exe")
          pe=pefile.PE(str(p),fast_load=False)
          b=p.read_bytes(); ib=pe.OPTIONAL_HEADER.ImageBase
          s=next(x for x in pe.sections if x.Name.rstrip(b"\0")==b".text")
          md=Cs(CS_ARCH_X86,CS_MODE_32)
          ins=list(md.disasm(b[s.PointerToRawData:s.PointerToRawData+s.SizeOfRawData],ib+s.VirtualAddress))
          lines=[f"0x{x.address:08X}: {x.mnemonic:8s} {x.op_str}" for x in ins if 0x42DDAC <= x.address < 0x42E0DA]
          Path("/tmp/r108/evidence/R108_PC_PROGRAMMER_HANDSHAKE_DISASM.txt").write_text("\n".join(lines)+"\n")
          facts={
              "SEND_1":"ISOK?FLASH",
              "SEND_1_LENGTH":64,
              "EXPECT_1_PREFIX":"ISOK!",
              "SEND_2_PREFIX":"PSOK?",
              "SEND_2_APPENDS_FOUR_BYTES":True,
              "SEND_2_LENGTH":64,
              "EXPECT_2_PREFIX":"PSOK!",
              "ROLE":"PC_TO_EXTERNAL_PROGRAMMER_HID",
              "NOT_AUTHORIZED_FOR_PRODUCTION_DSP":True,
          }
          Path("/tmp/r108/evidence/R108_PC_PROGRAMMER_HANDSHAKE_FACTS.json").write_text(
              json.dumps(facts,indent=2)+"\n"
          )
          PY

      - name: Build direct-path closure decision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          ev=Path("/tmp/r108/evidence")
          host=json.loads((ev/"R108_HOST_VID_PID_FACTS.json").read_text())
          blobs=json.loads((ev/"R108_EMBEDDED_LOADER_METADATA.json").read_text())
          hs=json.loads((ev/"R108_PC_PROGRAMMER_HANDSHAKE_FACTS.json").read_text())

          selection_programmer_ok=all([
              host["SELECTION_WINDOW_HAS_0633"],
              host["SELECTION_WINDOW_HAS_5322"],
              host["SELECTION_WINDOW_HAS_0288"],
              host["SELECTION_WINDOW_HAS_7966"],
          ])
          selection_prod_hit=host["SELECTION_WINDOW_HAS_PRODUCTION_6324"] or host["SELECTION_WINDOW_HAS_PRODUCTION_1719"]

          blob_roles=[]
          for x in blobs:
              m=x["semantic_markers"]
              role="UNKNOWN_EMBEDDED_LOADER"
              if m.get("p2 downloader") or any("p2 downloader" in s.lower() for s in x.get("interesting_ascii",[])):
                  role="P2_DOWNLOADER_STYLE_TARGET_LOADER"
              elif m.get("B1X Downloader") or any("b1x downloader" in s.lower() for s in x.get("interesting_ascii",[])):
                  role="B1X_DOWNLOADER_STYLE_TARGET_LOADER"
              elif m.get("HandShake2Dongle") or any("handshake2dongle" in s.lower() for s in x.get("interesting_ascii",[])):
                  role="DONGLE_TRANSFER_LOADER"
              blob_roles.append({
                  "label":x["label"],"sha256":x["sha256"],"size":x["size"],"role":role,
                  "usb_descriptor_candidates":x["usb_device_descriptor_candidates"],
                  "production_descriptor_bytes_present":x["production_vid_pid_descriptor_bytes_present"],
              })

          any_prod_descriptor=any(x["production_vid_pid_descriptor_bytes_present"] for x in blobs)
          any_reference_commands=any(any(v for v in x["reference_flashboot_command_markers"].values()) for x in blobs)

          d={
              "PINNED_MVASSISTANT_BP10XX_EXE":True,
              "PROGRAMMER_SELECTION_0633_5322_AND_0288_7966_CONFIRMED":selection_programmer_ok,
              "PRODUCTION_6324_1719_PRESENT_IN_PROGRAMMER_SELECTION_WINDOW":selection_prod_hit,
              "PC_TO_PROGRAMMER_ISOK_PSOK_HANDSHAKE_CONFIRMED":True,
              "EMBEDDED_BLOB_ROLES":blob_roles,
              "ANY_EMBEDDED_BLOB_HAS_PRODUCTION_6324_1719_DESCRIPTOR_BYTES":any_prod_descriptor,
              "ANY_EMBEDDED_BLOB_HAS_REFERENCE_FLASHBOOT_COMMAND_VOCABULARY":any_reference_commands,
              "MVASSISTANT_PC_PATH_IS_EXTERNAL_PROGRAMMER_MEDIATED":selection_programmer_ok and not selection_prod_hit,
              "MVASSISTANT_DIRECT_S25_TO_PRODUCTION_DSP_PATH_PROVEN":False,
              "DONGLE_TO_DSP_PROTOCOL_PROVEN":False,
              "PRODUCTION_FIRST_BOOTSTRAP_PROVEN":False,
              "PRODUCTION_RECOVERY_USB_IDENTITY_PROVEN":False,
              "SAFE_READ_ONLY_STOCK_BACKUP_PROVEN":False,
              "DISCOVERED_PC_DONGLE_FRAMES_AUTHORIZED_FOR_PRODUCTION_BOARD":False,
              "NEXT":"PIVOT_TO_PRODUCTION_GOLOPINE_SPECIFIC_BOOT_ENTRY_OR_UPDATER_EVIDENCE; DO_NOT_PORT ISOK/PSOK TO THE BOARD",
              "FLASH_ALLOWED":False
          }

          (ev/"R108_DECISION.json").write_text(json.dumps(d,indent=2,ensure_ascii=False)+"\n")
          report=[
              "# R108 BP10xx MVAssistant direct-path closure",
              "",
              "STATIC/OFFLINE ONLY. No vendor binary or embedded loader is executed.",
              "",
              "## Decision",
              "```json",json.dumps(d,indent=2,ensure_ascii=False),"```",
              "",
              "## Interpretation",
              "- The pinned MVAssistant BP10xx host path selects external programmer HID identities 0633:5322 / 0288:7966.",
              "- The production GoloPine runtime identity is 6324:1719 and is not treated as an authorized target merely because a programmer can service BP10xx.",
              "- ISOK?/PSOK? belongs to PC-to-programmer transport, not Samsung-to-production-DSP transport.",
              "- Embedded candidates contain downloader/UART/flash-transfer semantics; they remain offline evidence only.",
              "- Do not adapt or transmit any discovered programmer frame to the production board.",
              "- Continue toward production-specific boot-entry/recovery/backup evidence.",
              "- FLASH_ALLOWED=NO.",
          ]
          (ev/"R108_REPORT.md").write_text("\n".join(report)+"\n")
          print(json.dumps(d,indent=2,ensure_ascii=False))
          PY

      - name: Package evidence only
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r108/evidence
          zip -9 -r /tmp/R108_BP10XX_DIRECT_PATH_CLOSURE_STATIC_EVIDENCE.zip .
          sha256sum /tmp/R108_BP10XX_DIRECT_PATH_CLOSURE_STATIC_EVIDENCE.zip \
            > /tmp/R108_BP10XX_DIRECT_PATH_CLOSURE_STATIC_EVIDENCE.zip.sha256

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: R108-BP10XX-DIRECT-PATH-CLOSURE-STATIC-EVIDENCE
          path: |
            /tmp/R108_BP10XX_DIRECT_PATH_CLOSURE_STATIC_EVIDENCE.zip
            /tmp/R108_BP10XX_DIRECT_PATH_CLOSURE_STATIC_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'R108_VENDOR_BINARY_EXECUTED=NO' /tmp/r108/evidence/R108_SAFETY.txt
          grep -F 'R108_USB_DEVICE_ACCESS=NO' /tmp/r108/evidence/R108_SAFETY.txt
          grep -F 'R108_ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD=NO' /tmp/r108/evidence/R108_SAFETY.txt
          grep -F '"FLASH_ALLOWED": false' /tmp/r108/evidence/R108_DECISION.json
          cat /tmp/r108/evidence/R108_DECISION.json
          echo R108_STATIC_AUDIT_COMPLETE=YES
          echo FLASH_ALLOWED=NO
