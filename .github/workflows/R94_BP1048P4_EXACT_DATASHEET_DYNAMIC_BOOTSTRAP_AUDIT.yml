name: R94 BP1048P4 exact datasheet dynamic acquisition and bootstrap audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r94-bp1048p4-datasheet-bootstrap-${{ github.ref }}
  cancel-in-progress: true

env:
  DOWNLOAD_PAGE: https://www.wolftech-radio.com/jrwm
  TARGET_TITLE: BP1048P4数据手册_V0.8.pdf
  FLASH_ALLOWED: 'NO'

jobs:
  exact-datasheet-audit:
    name: OFFLINE/public-doc exact P4 datasheet acquisition - no USB/no board/no flash
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r94/evidence /tmp/r94/downloads
          cat > /tmp/r94/evidence/R94_SAFETY.txt <<'EOF'
          R94_PUBLIC_DOCUMENT_ONLY=YES
          BOARD_CONTACT=NO
          USB_DEVICE_ACCESS=NO
          BLUETOOTH_DEVICE_ACCESS=NO
          VENDOR_BINARY_EXECUTION=NO
          SEND_AA55=NO
          SEND_0X11=NO
          SEND_CHIPERAS_CODEDATA_BOOTDAT_CONSTDAT_CNFGDAT_BTUPDAT_UPINFO_CXXX=NO
          R79_PHYSICAL_REPLUG_AUTORUN=NO
          ERASE_PROGRAM_FLASH=NO
          BP1048B2_EQUALS_BP1048P4=NO
          FLASH_ALLOWED=NO
          PURPOSE=DOWNLOAD_EXACT_BP1048P4_V0_8_DATASHEET_AND_AUDIT_DOCUMENTED_BOOT_USB_PROGRAMMING_AND_STRAP_PINS
          EOF
          cat /tmp/r94/evidence/R94_SAFETY.txt

      - name: Install browser and PDF tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils file
          mkdir -p /tmp/r94/pw
          cd /tmp/r94/pw
          npm init -y >/dev/null 2>&1
          npm install playwright@latest >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Render dynamic page and capture exact P4 download
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r94/pw/acquire.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const pageUrl = process.env.DOWNLOAD_PAGE;
          const targetTitle = process.env.TARGET_TITLE;
          const evDir = '/tmp/r94/evidence';
          const dlDir = '/tmp/r94/downloads';

          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({
            acceptDownloads:true,
            userAgent:'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          });
          const page = await context.newPage();

          const net = [];
          const candidateResponses = [];

          page.on('response', async resp => {
            const url = resp.url();
            const headers = await resp.allHeaders().catch(()=>({}));
            const ct = (headers['content-type'] || '').toLowerCase();
            const interesting =
              /bp1048p4|1048|\.pdf(?:$|\?)/i.test(url) ||
              /download|file|attachment|upload/i.test(url) ||
              ct.includes('application/pdf');

            if (interesting) {
              net.push({
                url,
                status:resp.status(),
                content_type:ct,
                content_disposition:headers['content-disposition'] || ''
              });
            }

            if (ct.includes('application/pdf')) {
              try {
                const body = await resp.body();
                const path = `${dlDir}/response_${candidateResponses.length}.pdf`;
                fs.writeFileSync(path, body);
                candidateResponses.push({url,path,size:body.length});
              } catch {}
            }

            // Preserve small JSON/text responses that mention BP1048P4 or the exact title.
            if ((ct.includes('json') || ct.includes('text')) && interesting) {
              try {
                const body = await resp.text();
                if (body.length < 2_000_000 &&
                    (/bp1048p4/i.test(body) || body.includes(targetTitle))) {
                  const idx = candidateResponses.length;
                  const path = `${evDir}/R94_network_text_${idx}.txt`;
                  fs.writeFileSync(path, body);
                  candidateResponses.push({url,path,size:body.length,kind:'text'});
                }
              } catch {}
            }
          });

          const result = {
            page_url:pageUrl,
            target_title:targetTitle,
            goto_ok:false,
            target_text_count:0,
            target_elements:[],
            all_candidate_links:[],
            click_attempts:[],
            downloaded_files:[],
            errors:[]
          };

          try {
            const resp = await page.goto(pageUrl,{waitUntil:'domcontentloaded',timeout:60000});
            result.goto_ok = !!resp;
            result.goto_status = resp ? resp.status() : null;
            await page.waitForTimeout(8000);
          } catch (e) {
            result.errors.push(`goto:${e}`);
          }

          fs.writeFileSync(`${evDir}/R94_RENDERED_PAGE.html`, await page.content());
          fs.writeFileSync(`${evDir}/R94_RENDERED_TEXT.txt`, await page.locator('body').innerText().catch(()=>''));          

          // Collect every likely PDF/download link after JS rendering.
          const links = await page.locator('a').evaluateAll((as) =>
            as.map(a => ({
              text:(a.innerText||a.textContent||'').trim(),
              href:a.href||'',
              title:a.getAttribute('title')||'',
              download:a.getAttribute('download')||'',
              onclick:a.getAttribute('onclick')||'',
              data:[...a.attributes]
                .filter(x=>x.name.startsWith('data-'))
                .reduce((o,x)=>(o[x.name]=x.value,o),{})
            }))
          ).catch(()=>[]);
          result.all_candidate_links = links.filter(x =>
            /bp1048p4|1048|\.pdf|download/i.test(
              `${x.text} ${x.href} ${x.title} ${x.download} ${x.onclick} ${JSON.stringify(x.data)}`
            )
          );

          const loc = page.getByText(/BP1048P4.*V0\.8\.pdf/i);
          result.target_text_count = await loc.count().catch(()=>0);

          for (let i=0;i<result.target_text_count;i++) {
            const el = loc.nth(i);
            try {
              const info = await el.evaluate(node => {
                const chain=[];
                let p=node;
                for(let n=0;p && n<8;n++,p=p.parentElement){
                  chain.push({
                    tag:p.tagName,
                    text:(p.innerText||p.textContent||'').trim().slice(0,500),
                    href:p.href||'',
                    onclick:p.getAttribute?.('onclick')||'',
                    role:p.getAttribute?.('role')||'',
                    cls:p.className?.toString?.()||'',
                    attrs:[...(p.attributes||[])].reduce((o,a)=>(o[a.name]=a.value,o),{})
                  });
                }
                return chain;
              });
              result.target_elements.push(info);
            } catch(e) {
              result.errors.push(`inspect_target_${i}:${e}`);
            }
          }

          async function saveDownload(download, label) {
            const suggested = download.suggestedFilename();
            const path = `${dlDir}/${label}_${suggested.replace(/[^A-Za-z0-9._-]+/g,'_')}`;
            await download.saveAs(path);
            const stat = fs.statSync(path);
            result.downloaded_files.push({path,suggested,size:stat.size});
          }

          // First try any direct candidate hrefs.
          for (const [idx,x] of result.all_candidate_links.entries()) {
            if (!x.href) continue;
            if (!/bp1048p4|1048|\.pdf/i.test(`${x.text} ${x.href}`)) continue;
            try {
              const r = await context.request.get(x.href,{timeout:30000});
              const body = await r.body();
              const ct = (r.headers()['content-type']||'').toLowerCase();
              if (body.slice(0,4).toString() === '%PDF' || ct.includes('application/pdf')) {
                const path = `${dlDir}/direct_${idx}.pdf`;
                fs.writeFileSync(path,body);
                result.downloaded_files.push({path,source:x.href,size:body.length});
              }
            } catch(e) {
              result.errors.push(`direct_${idx}:${e}`);
            }
          }

          // Then click exact title/ancestor if no PDF saved yet.
          if (result.target_text_count > 0 && result.downloaded_files.length === 0) {
            for (let i=0;i<Math.min(result.target_text_count,5);i++) {
              const el = loc.nth(i);
              try {
                const clickable = el.locator('xpath=ancestor-or-self::a[1] | ancestor-or-self::button[1]').first();
                let target = (await clickable.count()) ? clickable : el;

                const attempt={index:i,before_url:page.url()};
                try {
                  const downloadPromise = page.waitForEvent('download',{timeout:12000});
                  await target.click({timeout:10000});
                  const download = await downloadPromise;
                  await saveDownload(download,`click_${i}`);
                  attempt.download=true;
                } catch(e) {
                  attempt.download=false;
                  attempt.download_error=String(e);
                  await page.waitForTimeout(4000);
                }
                attempt.after_url=page.url();
                result.click_attempts.push(attempt);
                if(result.downloaded_files.length) break;
              } catch(e) {
                result.errors.push(`click_${i}:${e}`);
              }
            }
          }

          // Capture final DOM/network after interaction.
          fs.writeFileSync(`${evDir}/R94_NETWORK.json`, JSON.stringify(net,null,2));
          fs.writeFileSync(`${evDir}/R94_BROWSER_RESULT.json`, JSON.stringify(result,null,2));
          fs.writeFileSync(`${evDir}/R94_RESPONSE_CAPTURE.json`, JSON.stringify(candidateResponses,null,2));

          await browser.close();
          JS

          cd /tmp/r94/pw
          node acquire.mjs
          cat /tmp/r94/evidence/R94_BROWSER_RESULT.json
          echo '--- network candidates ---'
          sed -n '1,1200p' /tmp/r94/evidence/R94_NETWORK.json

      - name: Validate downloaded PDFs and extract text
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/r94/evidence/R94_PDF_INVENTORY.tsv
          : > /tmp/r94/evidence/R94_PDF_TERM_HITS.txt

          n=0
          for f in /tmp/r94/downloads/*; do
            [ -f "$f" ] || continue
            n=$((n+1))
            typ="$(file -b "$f" || true)"
            sha="$(sha256sum "$f" | awk '{print $1}')"
            size="$(stat -c '%s' "$f")"
            printf '%s\t%s\t%s\t%s\n' "$(basename "$f")" "$size" "$sha" "$typ" \
              >> /tmp/r94/evidence/R94_PDF_INVENTORY.tsv

            if head -c 4 "$f" | grep -q '%PDF'; then
              pdf="/tmp/r94/evidence/R94_candidate_${n}.pdf"
              txt="/tmp/r94/evidence/R94_candidate_${n}.txt"
              cp "$f" "$pdf"
              pdftotext -layout "$pdf" "$txt" || true

              grep -InaE \
                'BP1048P4|boot|bootloader|ROM|download|burn|burner|program|programmer|upgrade|recovery|USB|OTG|SW_CLK|SW_D|debug|JTAG|SDP|strap|boot.?pin|POWERKEY|OTP|EFUSE|reset|pin.?map|pin.?description|GPIO|flash' \
                "$txt" \
                | sed "s#^#$(basename "$txt"):#" \
                >> /tmp/r94/evidence/R94_PDF_TERM_HITS.txt || true
            fi
          done

          cat /tmp/r94/evidence/R94_PDF_INVENTORY.tsv
          echo '--- exact-document term hits ---'
          sed -n '1,1600p' /tmp/r94/evidence/R94_PDF_TERM_HITS.txt

      - name: Build conservative decision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          p=Path('/tmp/r94/evidence')
          browser=json.loads((p/'R94_BROWSER_RESULT.json').read_text())
          inventory=(p/'R94_PDF_INVENTORY.tsv').read_text(errors='ignore')
          hits=(p/'R94_PDF_TERM_HITS.txt').read_text(errors='ignore')
          rendered=(p/'R94_RENDERED_TEXT.txt').read_text(errors='ignore')

          pdf_count=sum(1 for x in inventory.splitlines() if x.strip())
          exact_title_rendered='BP1048P4' in rendered and 'V0.8' in rendered
          exact_p4_text=bool(re.search(r'BP1048P4',hits,re.I))

          decision={
              'DYNAMIC_PAGE_RENDERED':browser.get('goto_ok',False),
              'EXACT_TITLE_VISIBLE_AFTER_JS_RENDER':exact_title_rendered,
              'TARGET_TEXT_ELEMENT_COUNT':browser.get('target_text_count',0),
              'DOWNLOADED_PDF_COUNT':pdf_count,
              'DOWNLOADED_PDF_CONTAINS_BP1048P4_TEXT':exact_p4_text,
              'DATASHEET_USB_OTG_TERM_PRESENT':bool(re.search(r'USB|OTG',hits,re.I)),
              'DATASHEET_BOOT_ROM_TERM_PRESENT':bool(re.search(r'boot|ROM',hits,re.I)),
              'DATASHEET_PROGRAM_BURN_TERM_PRESENT':bool(re.search(r'program|burn',hits,re.I)),
              'DATASHEET_DEBUG_SWD_JTAG_TERM_PRESENT':bool(re.search(r'SW_CLK|SW_D|JTAG|debug',hits,re.I)),
              'DATASHEET_STRAP_BOOTPIN_TERM_PRESENT':bool(re.search(r'strap|boot.?pin|download.?mode',hits,re.I)),
              'DEDICATED_POWERON_ROM_USB_BOOTSTRAP_PROVEN_FROM_R94':False,
              'HARDWARE_STRAP_TO_USB_ROM_LOADER_PROVEN_FROM_R94':False,
              'BP1048P4_PHONE_DIRECT_FIRST_BOOTSTRAP_PROVEN_FROM_R94':False,
              'PRODUCTION_RECOVERY_USB_IDENTITY_PROVEN_FROM_R94':False,
              'READ_ONLY_PRODUCTION_BACKUP_PATH_PROVEN_FROM_R94':False,
              'LIVE_BOARD_TEST_ALLOWED_FROM_R94':False,
              'FLASH_ALLOWED':False,
          }
          p.joinpath('R94_DECISION.json').write_text(json.dumps(decision,indent=2)+'\n')

          lines=[
              '# R94 exact BP1048P4 datasheet dynamic acquisition/bootstrap audit',
              '',
              'PUBLIC DOCUMENT ACQUISITION ONLY. No board/USB access and no flash.',
              '',
              '## Decision',
              '```json',json.dumps(decision,indent=2),'```','',
              '## Browser acquisition',
              '```json',json.dumps(browser,indent=2,ensure_ascii=False),'```','',
              '## PDF inventory',
          ]
          lines.extend('- '+x for x in inventory.splitlines() if x.strip())
          lines += ['','## Exact datasheet term hits']
          if hits.strip():
              lines.extend('- '+x[:1800] for x in hits.splitlines()[:900])
          else:
              lines.append('- none / exact PDF was not captured')

          lines += [
              '',
              '## Gate',
              '- A datasheet mentioning USB, ROM, programming, or debug does not by itself prove a phone-direct bootloader.',
              '- A live test requires an explicit documented power-on/reset condition plus transport identity/protocol evidence.',
              '- No AA55 repeat, no R79 autorun, no flash.',
              '- FLASH_ALLOWED=NO.',
          ]
          p.joinpath('R94_REPORT.md').write_text('\n'.join(lines)+'\n')
          print(json.dumps(decision,indent=2))
          PY

          sed -n '1,1100p' /tmp/r94/evidence/R94_REPORT.md

      - name: Package evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/r94/evidence && zip -9 -r /tmp/R94_BP1048P4_EXACT_DATASHEET_BOOTSTRAP_EVIDENCE.zip .)
          sha256sum /tmp/R94_BP1048P4_EXACT_DATASHEET_BOOTSTRAP_EVIDENCE.zip \
            > /tmp/R94_BP1048P4_EXACT_DATASHEET_BOOTSTRAP_EVIDENCE.zip.sha256

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R94-BP1048P4-EXACT-DATASHEET-BOOTSTRAP-EVIDENCE
          path: |
            /tmp/R94_BP1048P4_EXACT_DATASHEET_BOOTSTRAP_EVIDENCE.zip
            /tmp/R94_BP1048P4_EXACT_DATASHEET_BOOTSTRAP_EVIDENCE.zip.sha256
          if-no-files-found: error
