name: R105 Flash Burner Lite SPI dump USB descriptor and Cortex-M3 static reverse

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R105_FLASH_BURNER_LITE_SPI_DUMP_STATIC_REVERSE.yml"

permissions:
  contents: read

concurrency:
  group: r105-flash-burner-lite-spi-dump-${{ github.ref }}
  cancel-in-progress: true

env:
  MEGA_URL: https://mega.nz/folder/WVc3kSLD#LFVFW_v28gN-NCKhjdjxIg
  EXPECTED_DUMP_SIZE: "8388608"
  EXPECTED_DUMP_SHA256: d360f9dd6e80edd11ff897ad383bb11708a919fd1b22e01103eddb5942a9a373
  FLASH_ALLOWED: "NO"

jobs:
  static-reverse:
    name: SPI dump STATIC ONLY - NO EXECUTION - NO USB - NO BOARD - NO FLASH
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r105/download /tmp/r105/extract /tmp/r105/evidence
          cat > /tmp/r105/evidence/R105_SAFETY.txt <<'EOF'
          R105_MODE=STATIC_OFFLINE_ONLY
          R105_DOWNLOADED_CODE_EXECUTED=NO
          R105_USB_DEVICE_ACCESS=NO
          R105_BOARD_CONTACT=NO
          R105_AA55_SENT=NO
          R105_LINEIN_AA55_SENT=NO
          R105_RUNTIME_0X11_SENT=NO
          R105_SEND_CHIPERAS_CODEDATA_BOOTDAT_CONSTDAT_CNFGDAT_BTUPDAT_UPINFO_CXXX=NO
          R105_FLASH_READ_EXECUTED=NO
          R105_FLASH_ERASE_EXECUTED=NO
          R105_FLASH_WRITE_EXECUTED=NO
          R105_ANY_DISCOVERED_PACKET_AUTHORIZED_FOR_BP1048P4=NO
          R105_DUMP_ASSUMED_PRODUCTION_BP1048P4=NO
          FINAL_REQUIRED_TRANSPORT=SAMSUNG_S25_PLUS_USB_C_DIRECT_TO_DSP_USB_C
          HARDWARE_MODIFICATION=FORBIDDEN
          FLASH_ALLOWED=NO
          EOF
          cat /tmp/r105/evidence/R105_SAFETY.txt

      - name: Install static tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            megatools unzip p7zip-full file binutils python3-pip jq poppler-utils >/dev/null
          python3 -m pip install --disable-pip-version-check --no-input capstone >/dev/null
          {
            megadl --version 2>&1 | head -n3 || true
            python3 - <<'PY'
          import capstone
          print("capstone="+capstone.__version__)
          PY
          } > /tmp/r105/evidence/R105_TOOL_VERSIONS.txt

      - name: Acquire exact public dump source
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s megadl --path /tmp/r105/download "$MEGA_URL" \
            > /tmp/r105/evidence/R105_MEGA_STDOUT.txt \
            2> /tmp/r105/evidence/R105_MEGA_STDERR.txt

          ZIP="$(find /tmp/r105/download -type f -name 'GD25Q64$CSIG.zip' -print -quit)"
          test -n "$ZIP" -a -f "$ZIP"
          unzip -q "$ZIP" -d /tmp/r105/extract

          DUMP=""
          while IFS= read -r -d '' f; do
            sz="$(stat -c '%s' "$f")"
            sha="$(sha256sum "$f" | awk '{print $1}')"
            if [ "$sz" = "$EXPECTED_DUMP_SIZE" ] && [ "$sha" = "$EXPECTED_DUMP_SHA256" ]; then
              DUMP="$f"
              break
            fi
          done < <(find /tmp/r105/extract -type f -print0)

          test -n "$DUMP" -a -f "$DUMP"
          cp "$DUMP" /tmp/r105/dongle_spi_8m.bin
          chmod a-x /tmp/r105/dongle_spi_8m.bin || true

          {
            echo "DUMP_SIZE=$(stat -c '%s' /tmp/r105/dongle_spi_8m.bin)"
            echo "DUMP_SHA256=$(sha256sum /tmp/r105/dongle_spi_8m.bin | awk '{print $1}')"
            echo "EXPECTED_DUMP_SIZE=$EXPECTED_DUMP_SIZE"
            echo "EXPECTED_DUMP_SHA256=$EXPECTED_DUMP_SHA256"
            echo "DUMP_PIN_MATCH=YES"
          } > /tmp/r105/evidence/R105_DUMP_PIN.txt
          cat /tmp/r105/evidence/R105_DUMP_PIN.txt

      - name: Extract included AP8048A datasheet facts without OCR
        shell: bash
        run: |
          set -euo pipefail
          PDF="$(find /tmp/r105/download -type f -iname 'MVSILICON AP8048A.pdf' -print -quit || true)"
          if [ -n "$PDF" ] && [ -f "$PDF" ]; then
            pdftotext -layout "$PDF" /tmp/r105/ap8048a.txt || true
            grep -Ein -C 2 \
              'Cortex-M3|128K|SRAM|SPI-flash|code encryption|OTG|USB full-speed|USB disk|firmware' \
              /tmp/r105/ap8048a.txt \
              | head -n 500 > /tmp/r105/evidence/R105_AP8048A_DATASHEET_CONTEXT.txt || true
          else
            echo "AP8048A_DATASHEET_NOT_FOUND_IN_SOURCE" > /tmp/r105/evidence/R105_AP8048A_DATASHEET_CONTEXT.txt
          fi

      - name: Map flash entropy fill patterns and long erased runs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import math, json

          b=Path("/tmp/r105/dongle_spi_8m.bin").read_bytes()
          win=4096
          rows=[]
          for off in range(0,len(b),win):
              x=b[off:off+win]
              counts=[0]*256
              for v in x: counts[v]+=1
              ent=0.0
              for c in counts:
                  if c:
                      p=c/len(x); ent -= p*math.log2(p)
              rows.append({
                  "offset":off,
                  "size":len(x),
                  "entropy":round(ent,5),
                  "ff_ratio":round(counts[0xff]/len(x),5),
                  "zero_ratio":round(counts[0]/len(x),5),
              })
          Path("/tmp/r105/evidence/R105_ENTROPY_4K.json").write_text(json.dumps(rows,indent=2)+"\n")

          # Coalesce near-empty / high-entropy windows.
          for kind,pred in [
              ("ERASED_FF",lambda r:r["ff_ratio"]>=0.98),
              ("ZERO_FILLED",lambda r:r["zero_ratio"]>=0.98),
              ("HIGH_ENTROPY",lambda r:r["entropy"]>=7.65),
              ("LOW_ENTROPY",lambda r:r["entropy"]<=1.0),
          ]:
              spans=[]; start=None; end=None
              for r in rows:
                  yes=pred(r)
                  if yes and start is None: start=r["offset"]; end=r["offset"]+r["size"]
                  elif yes: end=r["offset"]+r["size"]
                  elif start is not None:
                      spans.append((start,end)); start=end=None
              if start is not None: spans.append((start,end))
              Path(f"/tmp/r105/evidence/R105_{kind}_SPANS.txt").write_text(
                  "\n".join(f"0x{a:08X}-0x{z:08X} size=0x{z-a:X}" for a,z in spans)+"\n"
              )
          PY

      - name: Validate USB descriptor structures and report exact VID PID trees
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct, json

          b=Path("/tmp/r105/dongle_spi_8m.bin").read_bytes()

          def u16(o): return struct.unpack_from("<H",b,o)[0]
          devices=[]
          for o in range(len(b)-18):
              if b[o:o+2] != b"\x12\x01": continue
              bcd=u16(o+2)
              mps=b[o+7]
              vid=u16(o+8); pid=u16(o+10); dev=u16(o+12)
              ncfg=b[o+17]
              plausible=(
                  bcd in (0x0100,0x0110,0x0200,0x0201,0x0210,0x0300,0x0310,0x0320)
                  and mps in (8,16,32,64)
                  and 1 <= ncfg <= 8
                  and vid not in (0x0000,0xffff)
                  and pid not in (0x0000,0xffff)
              )
              if plausible:
                  devices.append({
                    "offset":o,"bcdUSB":f"0x{bcd:04X}",
                    "class":b[o+4],"subclass":b[o+5],"protocol":b[o+6],
                    "ep0_max_packet":mps,
                    "vid":f"0x{vid:04X}","pid":f"0x{pid:04X}",
                    "bcdDevice":f"0x{dev:04X}",
                    "iManufacturer":b[o+14],"iProduct":b[o+15],"iSerial":b[o+16],
                    "num_configs":ncfg,
                    "hex":b[o:o+18].hex(" ")
                  })

          configs=[]
          for o in range(len(b)-9):
              if b[o:o+2] != b"\x09\x02": continue
              total=u16(o+2)
              nif=b[o+4]
              if total < 9 or total > 2048 or nif > 32 or o+total>len(b):
                  continue
              pos=o; parsed=[]; ok=True
              while pos < o+total:
                  if pos+2 > o+total: ok=False; break
                  ln=b[pos]; typ=b[pos+1]
                  if ln < 2 or pos+ln > o+total: ok=False; break
                  parsed.append({
                    "offset":pos,"length":ln,"type":typ,
                    "hex":b[pos:pos+ln].hex(" ")
                  })
                  pos += ln
              if not ok or pos != o+total: continue
              interfaces=sum(1 for x in parsed if x["type"]==4)
              endpoints=sum(1 for x in parsed if x["type"]==5)
              hid=sum(1 for x in parsed if x["type"]==0x21)
              # Require at least one interface and descriptor count consistent enough to reject random bytes.
              if interfaces < 1 or interfaces < min(nif,1): continue
              configs.append({
                  "offset":o,"total_length":total,"declared_interfaces":nif,
                  "parsed_interfaces":interfaces,"endpoints":endpoints,"hid_descriptors":hid,
                  "configuration_value":b[o+5],"attributes":f"0x{b[o+7]:02X}",
                  "max_power_2mA":b[o+8],"descriptors":parsed
              })

          Path("/tmp/r105/evidence/R105_VALID_USB_DEVICE_DESCRIPTORS.json").write_text(
              json.dumps(devices,indent=2)+"\n"
          )
          Path("/tmp/r105/evidence/R105_VALID_USB_CONFIG_TREES.json").write_text(
              json.dumps(configs,indent=2)+"\n"
          )

          # Bounded raw contexts only; no executable packet generation.
          ctx=[]
          offsets=sorted(set([x["offset"] for x in devices]+[x["offset"] for x in configs]))
          for o in offsets[:100]:
              a=max(0,o-64); z=min(len(b),o+512)
              ctx.append(f"===== offset=0x{o:X} context=0x{a:X}-0x{z:X} =====")
              for q in range(a,z,16):
                  chunk=b[q:min(q+16,z)]
                  ctx.append(f"{q:08X}: {chunk.hex(' ')}")
          Path("/tmp/r105/evidence/R105_USB_DESCRIPTOR_CONTEXT_HEX.txt").write_text("\n".join(ctx)+"\n")

          vids=sorted(set((x["vid"],x["pid"]) for x in devices))
          Path("/tmp/r105/evidence/R105_USB_VID_PID_LIST.txt").write_text(
              "\n".join(f"{v}:{p}" for v,p in vids)+"\n"
          )
          print("VALID_DEVICE_DESC_COUNT",len(devices))
          print("VALID_CONFIG_TREE_COUNT",len(configs))
          print("VID_PID",vids)
          PY

      - name: Find Cortex-M3 vector tables and infer possible flash mapping
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct,json

          b=Path("/tmp/r105/dongle_spi_8m.bin").read_bytes()
          SRAM_LO=0x20000000
          SRAM_HI=0x20020000  # 128 KiB AP8048A SRAM upper bound from datasheet
          cands=[]
          for o in range(0,len(b)-64,4):
              sp,reset=struct.unpack_from("<II",b,o)
              if not (SRAM_LO <= sp <= SRAM_HI and (reset & 1)):
                  continue
              vec=struct.unpack_from("<16I",b,o)
              # Score exception vectors: zero or Thumb addresses, excluding initial SP.
              score=0
              for x in vec[1:]:
                  if x==0 or (x&1): score+=1
              if score < 10: continue
              cands.append({
                "offset":o,"initial_sp":f"0x{sp:08X}",
                "reset":f"0x{reset:08X}","thumb_vector_score":score,
                "vectors":[f"0x{x:08X}" for x in vec]
              })
              if len(cands)>=500: break

          Path("/tmp/r105/evidence/R105_CORTEX_M3_VECTOR_CANDIDATES.json").write_text(
              json.dumps(cands,indent=2)+"\n"
          )

          bases=[0x00000000,0x08000000,0x10000000,0x18000000,0x1A000000,0x60000000]
          maps=[]
          for c in cands:
              reset=int(c["reset"],16)&~1
              for base in bases:
                  fo=reset-base
                  if 0 <= fo < len(b):
                      maps.append({
                        "vector_offset":c["offset"],
                        "initial_sp":c["initial_sp"],
                        "reset":c["reset"],
                        "candidate_flash_base":f"0x{base:08X}",
                        "reset_file_offset":fo,
                        "score":c["thumb_vector_score"]
                      })
          Path("/tmp/r105/evidence/R105_VECTOR_RESET_MAPPING_CANDIDATES.json").write_text(
              json.dumps(maps,indent=2)+"\n"
          )
          print("VECTOR_CANDIDATES",len(cands))
          print("MAPPED_RESET_CANDIDATES",len(maps))
          PY

      - name: Thumb disassembly only for mapped reset candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          from capstone import Cs, CS_ARCH_ARM, CS_MODE_THUMB, CS_MODE_LITTLE_ENDIAN

          b=Path("/tmp/r105/dongle_spi_8m.bin").read_bytes()
          maps=json.loads(Path("/tmp/r105/evidence/R105_VECTOR_RESET_MAPPING_CANDIDATES.json").read_text())
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN)
          md.detail=False
          out=[]
          for m in maps[:80]:
              fo=m["reset_file_offset"]
              addr=int(m["reset"],16)&~1
              blob=b[fo:min(fo+768,len(b))]
              ins=list(md.disasm(blob,addr))
              # Conservative plausibility metrics only.
              covered=sum(i.size for i in ins[:160])
              branch=sum(1 for i in ins[:160] if i.mnemonic.startswith("b") or i.mnemonic in ("bl","blx","bx"))
              loadstore=sum(1 for i in ins[:160] if i.mnemonic.startswith(("ldr","str","ldm","stm")))
              out.append(
                f"===== vector_off=0x{m['vector_offset']:X} base={m['candidate_flash_base']} "
                f"reset={m['reset']} file_off=0x{fo:X} score={m['score']} "
                f"decoded={len(ins[:160])} covered={covered} branches={branch} loadstore={loadstore} ====="
              )
              for i in ins[:160]:
                  out.append(f"0x{i.address:08X}: {i.mnemonic:8s} {i.op_str}")
          Path("/tmp/r105/evidence/R105_MAPPED_RESET_THUMB_DISASSEMBLY.txt").write_text("\n".join(out)+"\n")
          PY

      - name: Search dump strings and exact legacy family markers
        shell: bash
        run: |
          set -euo pipefail
          strings -a -t x -n 4 /tmp/r105/dongle_spi_8m.bin > /tmp/r105/ascii_strings.txt
          strings -el -t x -n 4 /tmp/r105/dongle_spi_8m.bin > /tmp/r105/utf16_strings.txt || true
          cat /tmp/r105/ascii_strings.txt /tmp/r105/utf16_strings.txt |
            grep -Ei \
              'AP8048A|BP1048P4|BP1048|BP10|Flash Burner|Burner Lite|dongle|Hummingbird|USB|OTG|HOST|HID|MSC|Mass Storage|device|descriptor|VID|PID|endpoint|control|setup|flashboot|bootloader|upgrade|erase|program|verify|CRC|MVA|chiperas|codedata|bootdat|constdat|cnfgdat|btupdat|upinfo|dual.?bank|unique.?id|encrypt|key' \
              > /tmp/r105/evidence/R105_DUMP_KEYWORD_STRINGS.txt || true

          {
            echo "ASCII_STRING_COUNT=$(wc -l < /tmp/r105/ascii_strings.txt)"
            echo "UTF16_STRING_COUNT=$(wc -l < /tmp/r105/utf16_strings.txt)"
            echo "KEYWORD_STRING_COUNT=$(wc -l < /tmp/r105/evidence/R105_DUMP_KEYWORD_STRINGS.txt)"
          } > /tmp/r105/evidence/R105_STRING_COUNTS.txt
          cat /tmp/r105/evidence/R105_STRING_COUNTS.txt

      - name: Cross-reference validated USB descriptor addresses under candidate mappings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,struct

          b=Path("/tmp/r105/dongle_spi_8m.bin").read_bytes()
          dev=json.loads(Path("/tmp/r105/evidence/R105_VALID_USB_DEVICE_DESCRIPTORS.json").read_text())
          cfg=json.loads(Path("/tmp/r105/evidence/R105_VALID_USB_CONFIG_TREES.json").read_text())
          offs=sorted(set([x["offset"] for x in dev]+[x["offset"] for x in cfg]))
          bases=[0x00000000,0x08000000,0x10000000,0x18000000,0x1A000000,0x60000000]
          rows=[]
          for base in bases:
              for target_off in offs:
                  value=base+target_off
                  needle=struct.pack("<I",value)
                  pos=0; hits=[]
                  while True:
                      q=b.find(needle,pos)
                      if q<0: break
                      hits.append(q); pos=q+1
                      if len(hits)>=100: break
                  if hits:
                      rows.append({
                        "base":f"0x{base:08X}",
                        "target_offset":target_off,
                        "pointer_value":f"0x{value:08X}",
                        "pointer_file_offsets":hits
                      })
          Path("/tmp/r105/evidence/R105_USB_DESCRIPTOR_POINTER_XREFS.json").write_text(
              json.dumps(rows,indent=2)+"\n"
          )
          print("USB_DESCRIPTOR_POINTER_XREF_ROWS",len(rows))
          PY

      - name: Build fail-closed R105 decision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          ev=Path("/tmp/r105/evidence")
          dev=json.loads((ev/"R105_VALID_USB_DEVICE_DESCRIPTORS.json").read_text())
          cfg=json.loads((ev/"R105_VALID_USB_CONFIG_TREES.json").read_text())
          vec=json.loads((ev/"R105_CORTEX_M3_VECTOR_CANDIDATES.json").read_text())
          maps=json.loads((ev/"R105_VECTOR_RESET_MAPPING_CANDIDATES.json").read_text())
          xrefs=json.loads((ev/"R105_USB_DESCRIPTOR_POINTER_XREFS.json").read_text())
          kw=(ev/"R105_DUMP_KEYWORD_STRINGS.txt").read_text(errors="replace")

          decision={
            "DONGLE_SPI_DUMP_PINNED": True,
            "DUMP_SHA256": "d360f9dd6e80edd11ff897ad383bb11708a919fd1b22e01103eddb5942a9a373",
            "DUMP_SIZE_BYTES": 8388608,
            "AP8048A_REFERENCE_ARCHITECTURE": "ARM_CORTEX_M3_128K_SRAM_USB_FS_OTG",
            "VALID_USB_DEVICE_DESCRIPTOR_COUNT": len(dev),
            "VALID_USB_CONFIG_TREE_COUNT": len(cfg),
            "VALID_USB_VID_PID_LIST": sorted(set(f"{x['vid']}:{x['pid']}" for x in dev)),
            "CORTEX_M3_VECTOR_TABLE_CANDIDATE_COUNT": len(vec),
            "RESET_TO_FILE_MAPPING_CANDIDATE_COUNT": len(maps),
            "USB_DESCRIPTOR_POINTER_XREF_ROW_COUNT": len(xrefs),
            "BP1048P4_LITERAL_PRESENT_IN_DUMP": bool(re.search(r"BP1048P4",kw,re.I)),
            "BP1048_OR_BP10_LITERAL_PRESENT_IN_DUMP": bool(re.search(r"BP1048|BP10",kw,re.I)),
            "FLASH_BURNER_LITERAL_PRESENT_IN_DUMP": bool(re.search(r"Flash Burner|Burner Lite",kw,re.I)),
            "TARGET_SIDE_USB_HOST_PROTOCOL_PROVEN": False,
            "DONGLE_DEVICE_SIDE_IDENTITY_PROVEN": bool(dev and cfg),
            "PRODUCTION_GOLOPINE_BP1048P4_COMPATIBILITY_PROVEN": False,
            "PHONE_DIRECT_S25_USB_C_BOOTSTRAP_PROVEN": False,
            "PRODUCTION_RECOVERY_USB_IDENTITY_PROVEN": False,
            "SAFE_READ_ONLY_PRODUCTION_BACKUP_PROVEN": False,
            "ANY_PACKET_AUTHORIZED_FOR_BOARD": False,
            "NEXT": "OFFLINE_INTERPRET_VALID_DESCRIPTOR_VECTOR_AND_XREF_EVIDENCE_BEFORE_ANY_LIVE_STEP",
            "FLASH_ALLOWED": False
          }
          (ev/"R105_DECISION.json").write_text(json.dumps(decision,indent=2)+"\n")
          report=[
            "# R105 Flash Burner Lite SPI dump static reverse",
            "",
            "STATIC/OFFLINE ONLY. The SPI dump is analyzed as data and is never executed.",
            "",
            "## Decision",
            "```json",json.dumps(decision,indent=2),"```",
            "",
            "## Interpretation gate",
            "- A valid USB descriptor in the dongle dump may describe the dongle's PC-facing DEVICE role; it does not by itself prove the dongle-to-target HOST protocol.",
            "- Cortex-M3 vector/reset candidates are not accepted as executable-code proof unless reset mapping and Thumb structure are coherent.",
            "- No descriptor, byte sequence, command or packet discovered here is authorized for the production BP1048P4 board.",
            "- Final route remains Samsung S25+ -> USB-C -> DSP USB-C with no hardware modification.",
            "- No AA55 repeat, no runtime 0x11, no legacy flash commands.",
            "- FLASH_ALLOWED=NO."
          ]
          (ev/"R105_REPORT.md").write_text("\n".join(report)+"\n")
          print(json.dumps(decision,indent=2))
          PY

      - name: Package evidence only - exclude the 8 MiB dump
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r105/evidence
          zip -9 -r /tmp/R105_FLASH_BURNER_LITE_SPI_DUMP_STATIC_EVIDENCE.zip .
          sha256sum /tmp/R105_FLASH_BURNER_LITE_SPI_DUMP_STATIC_EVIDENCE.zip \
            > /tmp/R105_FLASH_BURNER_LITE_SPI_DUMP_STATIC_EVIDENCE.zip.sha256
          cat /tmp/R105_FLASH_BURNER_LITE_SPI_DUMP_STATIC_EVIDENCE.zip.sha256

      - name: Upload R105 evidence
        uses: actions/upload-artifact@v4
        with:
          name: R105-FLASH-BURNER-LITE-SPI-DUMP-STATIC-EVIDENCE
          path: |
            /tmp/R105_FLASH_BURNER_LITE_SPI_DUMP_STATIC_EVIDENCE.zip
            /tmp/R105_FLASH_BURNER_LITE_SPI_DUMP_STATIC_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'R105_DOWNLOADED_CODE_EXECUTED=NO' /tmp/r105/evidence/R105_SAFETY.txt
          grep -F 'R105_USB_DEVICE_ACCESS=NO' /tmp/r105/evidence/R105_SAFETY.txt
          grep -F 'R105_ANY_DISCOVERED_PACKET_AUTHORIZED_FOR_BP1048P4=NO' /tmp/r105/evidence/R105_SAFETY.txt
          grep -F 'FLASH_ALLOWED=NO' /tmp/r105/evidence/R105_SAFETY.txt
          cat /tmp/r105/evidence/R105_DECISION.json
          echo R105_STATIC_REVERSE_COMPLETE=YES
          echo FLASH_ALLOWED=NO
