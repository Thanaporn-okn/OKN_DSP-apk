name: Build OKN DSP V70 Power Cycle Reconnect Persistence Proof

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_ANDROID_V70_POWER_CYCLE_RECONNECT_PERSISTENCE_PROOF.zip'
      - '.github/workflows/build-okn-dsp-v70.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify V70 source
        shell: bash
        run: |
          set -euo pipefail
          echo '5dcae6dc2e69b3701f2ba270e21ebe2a2579ea5c93dbd7f49dee575c77404398  OKN_DSP_ANDROID_V70_POWER_CYCLE_RECONNECT_PERSISTENCE_PROOF.zip' | sha256sum -c -
          rm -rf /tmp/okn_v70
          mkdir -p /tmp/okn_v70
          unzip -q OKN_DSP_ANDROID_V70_POWER_CYCLE_RECONNECT_PERSISTENCE_PROOF.zip -d /tmp/okn_v70
          ROOT=/tmp/okn_v70
          check_file() { test -f "$1" || { echo "ERROR missing $1"; exit 1; }; echo "OK file: $1"; }
          check_text() { grep -Fq "$1" "$2" || { echo "ERROR missing marker '$1' in $2"; exit 1; }; echo "OK marker: $1"; }
          MAIN="$ROOT/app/src/main/java/com/okn/dsp/MainActivity.kt"
          UNIFIED="$ROOT/app/src/main/java/com/okn/dsp/UnifiedControlActivity.kt"
          SCALAR="$ROOT/app/src/main/java/com/okn/dsp/ScalarControlActivity.kt"
          LIVE="$ROOT/app/src/main/java/com/okn/dsp/LiveEqActivity.kt"
          SAVEPOL="$ROOT/app/src/main/java/com/okn/dsp/protocol/SaveParamsPolicy.kt"
          EQPOL="$ROOT/app/src/main/java/com/okn/dsp/protocol/LiveEqPolicy.kt"
          EQCODEC="$ROOT/app/src/main/java/com/okn/dsp/protocol/EqBandCodec.kt"
          SCALARPOL="$ROOT/app/src/main/java/com/okn/dsp/protocol/VerifiedScalarControls.kt"
          GATE="$ROOT/app/src/main/java/com/okn/dsp/protocol/WriteGate.kt"
          GRADLE="$ROOT/app/build.gradle.kts"
          MANIFEST="$ROOT/app/src/main/AndroidManifest.xml"
          V69CAP="$ROOT/evidence/OKN_DSP_V69_SAVE_STATE_HARDENING_RUNTIME_SUCCESS_CAPTURE.txt"
          for f in "$MAIN" "$UNIFIED" "$SCALAR" "$LIVE" "$SAVEPOL" "$EQPOL" "$EQCODEC" "$SCALARPOL" "$GATE" "$GRADLE" "$MANIFEST" "$V69CAP"; do check_file "$f"; done
          check_file "$ROOT/README_V70.txt"
          check_file "$ROOT/evidence/OKN_DSP_V70_POWER_CYCLE_RECONNECT_PERSISTENCE_PROOF_PLAN.txt"
          check_file "$ROOT/evidence/OKN_DSP_V70_POWER_CYCLE_RECONNECT_PERSISTENCE_PROOF_PLAN.json"
          
          check_text 'versionCode = 70' "$GRADLE"
          check_text '5.1.0-v70-power-cycle-reconnect-persistence-proof' "$GRADLE"
          check_text 'OKN DSP V70 — POWER-CYCLE / RECONNECT PERSISTENCE PROOF' "$MAIN"
          check_text 'UNIFIED V70 • V69 VERIFIED WRITES + POWER-CYCLE PERSISTENCE PROOF' "$MAIN"
          check_text 'UnifiedControlActivity::class.java' "$MAIN"
          check_text '.UnifiedControlActivity' "$MANIFEST"
          
          check_text 'const val enabled: Boolean = false' "$GATE"
          check_text 'const val unifiedVerifiedScalarWritesEnabled: Boolean = true' "$GATE"
          check_text 'const val unifiedVerifiedEqWritesEnabled: Boolean = true' "$GATE"
          python3 - "$SCALARPOL" <<'PY'
          import re,sys
          from pathlib import Path
          s=Path(sys.argv[1]).read_text()
          ids=[int(x) for x in re.findall(r'VerifiedScalarControl\((\d+),',s)]
          assert ids==[2,3,8,9,10,13,11],ids
          print('OK: scalar allow-list exactly [2,3,8,9,10,13,11]')
          PY
          
          # V69 qualified runtime evidence embedded byte-for-byte.
          echo 'dcd74329985f4a15a5df83056c15e4f7304521c653de843e59d02fa05109dc81  '"$V69CAP" | sha256sum -c -
          check_text 'V69_UNIFIED_SAVE_PRECHECK_RESULT verified=true countsOk=true scalarMismatch=0 eqMismatch=0' "$V69CAP"
          check_text 'V69_UNIFIED_SAVE_POSTCHECK_RESULT verified=true countsOk=true scalarMismatch=0 eqMismatch=0' "$V69CAP"
          check_text 'V69_UNIFIED_PERSISTENT_SAVE_COMPLETE' "$V69CAP"
          check_text 'precheck=true postcheck=true' "$V69CAP"
          
          # Production modules remain unchanged from V69/V68.
          echo '01f6aca6f2131bd41ca4fd1d674d879cade425ccc7ddef77e63718e8e124ffed  '"$SCALAR" | sha256sum -c -
          echo '3240ca56c81b7960098ae9fb6ea7421d32e74b11e42810ce4c5b71b35d7ab8d0  '"$LIVE" | sha256sum -c -
          echo '88005dba77d2b84597f5bd5e23eaaacec7d25b59dc0f38b8affbde2d2cfbeb85  '"$SAVEPOL" | sha256sum -c -
          echo 'cfb046aa09acaf8429176a9b99e988ea06347f3daeea988b7c118d056400d2bc  '"$EQPOL" | sha256sum -c -
          echo '4f033a406e363b2418af9b39fa2e42a13674b09f9de2bb7acf1eb6ff1918cd58  '"$EQCODEC" | sha256sum -c -
          
          # Existing V69 scalar/EQ write + rollback + save-state guards remain.
          for marker in \
            'V70_UNIFIED_SCALAR_PREFLIGHT_START' \
            'V70_UNIFIED_SCALAR_PREFLIGHT_OK' \
            'V70_UNIFIED_TARGET_DESCRIPTOR_VERIFY' \
            'V70_UNIFIED_RESTORE_DESCRIPTOR_VERIFY' \
            'V70_UNIFIED_EQ_PREFLIGHT_START' \
            'V70_UNIFIED_EQ_PREFLIGHT_OK' \
            'V70_UNIFIED_EQ_TARGET_DESCRIPTOR_VERIFY' \
            'V70_UNIFIED_EQ_RESTORE_DESCRIPTOR_VERIFY' \
            'V70_UNIFIED_SAVE_PRECHECK_START' \
            'V70_UNIFIED_SAVE_PRECHECK_RESULT' \
            'V70_UNIFIED_SAVE_POSTCHECK_START' \
            'V70_UNIFIED_SAVE_POSTCHECK_RESULT' \
            'V70_UNIFIED_PERSISTENT_SAVE_COMPLETE' \
            'V70_UNIFIED_TX_STREAM_UNCERTAIN' \
            'REFRESH ALL • SAME SESSION' \
            'V70_UNIFIED_REFRESH_COMPLETE' \
            'sensorReadOnly=true' \
            'genericWrites=false'; do check_text "$marker" "$UNIFIED"; done
          check_text 'SaveParamsPolicy.encodeTrigger()' "$UNIFIED"
          check_text '570000000700000000' "$SAVEPOL"
          check_text 'LiveEqPolicy.isWritable(original)' "$UNIFIED"
          check_text 'payloadBytes=48' "$UNIFIED"
          check_text 'eqTargetVerifyDelayMs = 3000L' "$UNIFIED"
          check_text 'eqRestoreVerifyDelayMs = 3000L' "$UNIFIED"
          
          # V70 proof must be read-only and compare the full exposed post-save state.
          for marker in \
            'V70_UNIFIED_PERSISTENCE_SNAPSHOT_STORED' \
            'scalarSnapshot=${scalarValues.size} eqSnapshot=$eqCount' \
            'V70_UNIFIED_POWER_CYCLE_PROOF_ARMED' \
            'disconnectRequired=true writesSent=0' \
            'V70_UNIFIED_POWER_CYCLE_PROOF_DISCONNECT_OBSERVED' \
            'V70_UNIFIED_POWER_CYCLE_PERSISTENCE_PROOF_RESULT' \
            'scalarMismatch=$scalarMismatch eqMismatch=$eqMismatch' \
            'disconnectObserved=true userArmed=true' \
            'freshAuthSession=true writesSent=0 sensorsCompared=false' \
            'snapshot.scalarExpected.size == 7' \
            'snapshot.eqExpected.size == 105' \
            'POWER-CYCLE / RECONNECT PROOF • 7 + 105 SNAPSHOT'; do check_text "$marker" "$UNIFIED"; done
          
          python3 - "$UNIFIED" <<'PY'
          from pathlib import Path
          import sys
          u=Path(sys.argv[1]).read_text()
          assert u.count('UfeCodec.encodeFloat32Write')==2, u.count('UfeCodec.encodeFloat32Write')
          assert u.count('LiveEqPolicy.encodeWrite')==1, u.count('LiveEqPolicy.encodeWrite')
          assert u.count('LiveEqPolicy.encodeRestore')==1, u.count('LiveEqPolicy.encodeRestore')
          assert u.count('SaveParamsPolicy.encodeTrigger()')==1, u.count('SaveParamsPolicy.encodeTrigger()')
          assert u.count('UfeCodec.encodeWrite(')==0, u.count('UfeCodec.encodeWrite(')
          assert u.count('EqBandCodec.encode')==0, u.count('EqBandCodec.encode')
          assert 'noteProofDisconnectObserved()' in u
          assert 'maybeVerifyArmedPersistenceProof(eqCount)' in u
          assert 'storePostSavePersistenceSnapshot()' in u
          assert 'sensorsCompared=false' in u
          print('OK: V70 writer surface unchanged; persistence proof is read-only')
          PY
          
          if grep -R -n -F 'UfeCodec.encodeWrite(7' "$ROOT/app/src/main/java/com/okn/dsp" | grep -v 'SaveParamsPolicy.kt'; then
            echo 'ERROR: direct SaveParams ID7 writer outside policy'; exit 1
          fi
          
          echo 'OK: V70 static preflight passed'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/okn_v70
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and package artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn_v70/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          mkdir -p artifact
          cp "$APK" artifact/OKN_DSP_V70_POWER_CYCLE_RECONNECT_PERSISTENCE_PROOF-debug.apk
          cp /tmp/okn_v70/README_V70.txt artifact/
          cp /tmp/okn_v70/evidence/OKN_DSP_V70_POWER_CYCLE_RECONNECT_PERSISTENCE_PROOF_PLAN.txt artifact/
          cp /tmp/okn_v70/evidence/OKN_DSP_V70_POWER_CYCLE_RECONNECT_PERSISTENCE_PROOF_PLAN.json artifact/
          sha256sum artifact/OKN_DSP_V70_POWER_CYCLE_RECONNECT_PERSISTENCE_PROOF-debug.apk > artifact/OKN_DSP_V70_POWER_CYCLE_RECONNECT_PERSISTENCE_PROOF-debug.sha256
          ls -lh artifact

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-V70-POWER-CYCLE-RECONNECT-PERSISTENCE-PROOF-debug-apk
          path: artifact/
          if-no-files-found: error
          retention-days: 30
