name: OKN BP1048P4 Flashboot Runtime Map Handler Graph V5 - All In One

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: okn-bp1048p4-runtime-map-handler-graph-v5-${{ github.ref }}
  cancel-in-progress: true

env:
  FLASH_ALLOWED: "NO"

jobs:
  runtime_map:
    name: Recover runtime base + command handler call graph - NO USB - NO FLASH
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          mkdir -p /tmp/v5/evidence
          cat > /tmp/v5/evidence/SAFETY.txt <<'EOF'
          MODE=OFFLINE_STATIC_RUNTIME_MAP_AND_HANDLER_GRAPH_ONLY
          TARGET=MVSilicon_BP1048P4
          USB_OR_BOARD_CONTACT=NO
          TARGET_FIRMWARE_EXECUTED=NO
          FLASH_READ_EXECUTED=NO
          FLASH_ERASE_EXECUTED=NO
          FLASH_WRITE_EXECUTED=NO
          LIVE_BOOT_ENTRY_AUTHORIZED=NO
          LIVE_FLASH_AUTHORIZED=NO
          FLASH_ALLOWED=NO
          EOF

      - name: Checkout public BP1048 SDK
        uses: actions/checkout@v4
        with:
          repository: leadercxn/bp1048_sdk_v0.1.12
          ref: master
          path: bp1048-sdk
          fetch-depth: 1

      - name: Reconstruct exact 64 KiB image
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib,json,re,subprocess

          ROOT=Path("bp1048-sdk")
          OUT=Path("/tmp/v5/evidence")
          src=ROOT/"BT_Audio_APP/bt_audio_app_src/device/flash_boot.c"
          text=src.read_text(errors="replace")

          m=re.search(
              r"(?:static\s+|const\s+|unsigned\s+|signed\s+)*"
              r"(?:char|uint8_t|uint8|u8|BYTE)\s+flash_data\s*"
              r"\[\s*(?P<n>\d+)\s*\]\s*=\s*\{(?P<body>.*?)\};",
              text,re.I|re.S
          )
          assert m
          declared=int(m.group("n"))
          body=re.sub(r"/\*.*?\*/","",m.group("body"),flags=re.S)
          body=re.sub(r"//[^\r\n]*","",body)
          vals=[int(x,16) for x in re.findall(
              r"0[xX]([0-9A-Fa-f]{1,2})\b",body
          )]
          assert declared==65536 and len(vals)==65520
          raw=bytes(vals)+bytes(declared-len(vals))
          (OUT/"flash_data_65536.bin").write_bytes(raw)

          commit=subprocess.check_output(
              ["git","-C",str(ROOT),"rev-parse","HEAD"],text=True
          ).strip()

          meta={
              "sdk_commit":commit,
              "sha256":hashlib.sha256(raw).hexdigest(),
              "size":len(raw),
              "explicit":len(vals),
              "zero_fill":declared-len(vals),
              "USB_OR_BOARD_CONTACTED":False,
              "LIVE_FLASH_AUTHORIZED":False,
              "FLASH_ALLOWED":False
          }
          (OUT/"IMAGE_META.json").write_text(json.dumps(meta,indent=2)+"\n")
          PYCODE

      - name: Build GNU NDS32 objdump
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/v5/toolchain /tmp/v5/build
          cd /tmp/v5/toolchain
          URL="https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz"
          if curl -fL --retry 3 --connect-timeout 20 "$URL" -o binutils-2.44.tar.xz; then
            tar -xf binutils-2.44.tar.xz
            cd /tmp/v5/build
            if ../toolchain/binutils-2.44/configure \
                --target=nds32le-elf \
                --disable-nls --disable-werror --disable-gdb \
                --disable-gprofng --disable-gas --disable-ld --disable-gold \
                >/tmp/v5/evidence/NDS32_BUILD.log 2>&1 &&
               make -j2 all-binutils >>/tmp/v5/evidence/NDS32_BUILD.log 2>&1; then
              find /tmp/v5/build -type f -name '*objdump' -perm -111 -print \
                > /tmp/v5/evidence/OBJDUMP_CANDIDATES.txt
              echo BUILD_STATUS=SUCCESS > /tmp/v5/evidence/NDS32_BUILD_STATUS.txt
            else
              echo BUILD_STATUS=FAILED > /tmp/v5/evidence/NDS32_BUILD_STATUS.txt
            fi
          else
            echo BUILD_STATUS=DOWNLOAD_FAILED > /tmp/v5/evidence/NDS32_BUILD_STATUS.txt
          fi
          exit 0

      - name: Disassemble exact image
        shell: bash
        run: |
          set -euo pipefail
          OBJDUMP="$(find /tmp/v5/build -type f -name '*objdump' -perm -111 | head -1 || true)"
          test -n "$OBJDUMP"
          "$OBJDUMP" -D -b binary -m nds32 --adjust-vma=0 \
            /tmp/v5/evidence/flash_data_65536.bin \
            > /tmp/v5/evidence/NDS32_DISASSEMBLY.txt \
            2>/tmp/v5/evidence/NDS32_DISASSEMBLY.stderr.txt

      - name: Recover runtime mapping string xrefs and call graph
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import collections,json,re

          OUT=Path("/tmp/v5/evidence")
          raw=(OUT/"flash_data_65536.bin").read_bytes()
          meta=json.loads((OUT/"IMAGE_META.json").read_text())
          lines=(OUT/"NDS32_DISASSEMBLY.txt").read_text(errors="replace").splitlines()

          row_rx=re.compile(
              r"^\s*([0-9A-Fa-f]+):\s+(?:[0-9A-Fa-f]{2,8}\s+)+(.+?)\s*$"
          )
          ins=[]
          for n,line in enumerate(lines,1):
              m=row_rx.match(line)
              if m:
                  ins.append({
                      "line":n,
                      "addr":int(m.group(1),16),
                      "text":m.group(2).strip(),
                      "raw":line
                  })

          def pint(s):
              try:
                  return int(s.strip().replace("#",""),0)
              except Exception:
                  return None

          # Recover exact GP initializer from the executable instructions.
          sethi_gp=re.compile(
              r"\bsethi\s+\$gp\s*,\s*#?(0x[0-9a-fA-F]+|\d+)",re.I
          )
          ori_gp=re.compile(
              r"\bori\s+\$gp\s*,\s*\$gp\s*,\s*#?(0x[0-9a-fA-F]+|\d+)",re.I
          )
          gp_inits=[]
          for i,x in enumerate(ins):
              sm=sethi_gp.search(x["text"])
              if not sm:
                  continue
              hi=pint(sm.group(1))
              for y in ins[i+1:i+5]:
                  om=ori_gp.search(y["text"])
                  if om:
                      lo=pint(om.group(1))
                      gp=((hi & 0xfffff)<<12) | (lo & 0x7fff)
                      gp_inits.append({
                          "sethi_addr":x["addr"],
                          "ori_addr":y["addr"],
                          "runtime_gp":gp,
                          "runtime_gp_hex":f"0x{gp:08X}",
                          "sethi":x["text"],
                          "ori":y["text"]
                      })
                      break

          assert gp_inits, "no GP initializer recovered"
          # Prefer the earliest explicit GP initializer.
          GP=sorted(gp_inits,key=lambda x:x["sethi_addr"])[0]["runtime_gp"]

          # Printable strings.
          strings={}
          st=None
          for i,b in enumerate(raw+b"\x00"):
              if 32<=b<=126:
                  if st is None: st=i
              else:
                  if st is not None and i-st>=3:
                      strings[st]=raw[st:i].decode("ascii",errors="replace")
                  st=None

          command_names=[
              "chiperas","upinfo","btupdat","cnfgdat","constdat","codedata","cxxx"
          ]
          cmd_off={}
          for name in command_names:
              hits=[off for off,s in strings.items() if s==name]
              assert len(hits)==1,(name,hits)
              cmd_off[name]=hits[0]

          # addi.gp semantics: rt = GP + signed imm19.
          addigp_rx=re.compile(
              r"\baddi\.gp\s+(\$[A-Za-z0-9]+)\s*,\s*#?"
              r"(-?0x[0-9A-Fa-f]+|-?\d+)",re.I
          )

          addigp=[]
          base_votes=collections.Counter()
          command_refs=[]
          for idx,x in enumerate(ins):
              m=addigp_rx.search(x["text"])
              if not m: continue
              reg,imm_s=m.groups()
              imm=pint(imm_s)
              if imm is None: continue
              runtime=(GP+imm)&0xffffffff
              rec={
                  "idx":idx,"addr":x["addr"],"reg":reg,"imm":imm,
                  "runtime":runtime,"text":x["text"]
              }

              # For every known exact command string, derive image load base.
              for name,off in cmd_off.items():
                  base=(runtime-off)&0xffffffff
                  # Candidate runtime image bases should be word aligned and
                  # shared by independent command references.
                  if base%4==0:
                      base_votes[base]+=1

              addigp.append(rec)

          # Score bases by exact mapping of addi.gp runtime addresses to strings.
          candidates=[]
          for base,_ in base_votes.most_common():
              refs=[]
              all_string_refs=[]
              for a in addigp:
                  off=(a["runtime"]-base)&0xffffffff
                  if off in strings:
                      r={**a,"file_offset":off,"string":strings[off]}
                      all_string_refs.append(r)
                      if off in cmd_off.values():
                          name=next(k for k,v in cmd_off.items() if v==off)
                          refs.append({**r,"command":name})
              commands=sorted(set(x["command"] for x in refs))
              if commands:
                  candidates.append({
                      "runtime_base":base,
                      "runtime_base_hex":f"0x{base:08X}",
                      "commands":commands,
                      "command_ref_count":len(refs),
                      "printable_string_ref_count":len(all_string_refs),
                      "command_refs":refs,
                      "all_string_refs":all_string_refs
                  })

          candidates.sort(
              key=lambda x:(-len(x["commands"]),-x["command_ref_count"],
                            -x["printable_string_ref_count"],x["runtime_base"])
          )
          assert candidates,"no runtime base candidates"
          best=candidates[0]
          BASE=best["runtime_base"]
          GP_FILE_OFF=(GP-BASE)&0xffffffff

          # Require the known six independent command references to agree.
          must={"chiperas","upinfo","btupdat","cnfgdat","constdat","codedata"}
          recovered=set(best["commands"])
          assert must.issubset(recovered),(must,recovered)
          assert BASE==0x2001A9A8, hex(BASE)
          assert GP_FILE_OFF==0xC308, hex(GP_FILE_OFF)

          # Map every addi.gp to an exact printable-string xref using the recovered
          # runtime base.
          string_xrefs=[]
          for a in addigp:
              off=(a["runtime"]-BASE)&0xffffffff
              if off in strings:
                  string_xrefs.append({
                      **a,
                      "file_offset":off,
                      "runtime_string_address":a["runtime"],
                      "string":strings[off]
                  })

          # Decode direct JAL targets (objdump already prints file-offset target).
          jal_rx=re.compile(r"\bjal\s+(?:0x)?([0-9A-Fa-f]+)\b",re.I)
          calls=[]
          call_targets=set()
          for idx,x in enumerate(ins):
              m=jal_rx.search(x["text"])
              if m:
                  target=int(m.group(1),16)
                  calls.append({
                      "idx":idx,"caller_insn":x["addr"],"target":target,
                      "text":x["text"]
                  })
                  call_targets.add(target)

          # Add 0 and all direct call targets as conservative function starts.
          starts=sorted({0}|{x for x in call_targets if 0<=x<len(raw)})

          # Also use push25 instructions as likely function starts.
          for x in ins:
              if re.search(r"\bpush25\b",x["text"],re.I):
                  starts.append(x["addr"])
          starts=sorted(set(starts))

          def containing_function(addr):
              prior=[s for s in starts if s<=addr]
              if not prior: return 0
              return max(prior)

          # Assign string xrefs to inferred functions.
          fxrefs=collections.defaultdict(list)
          for x in string_xrefs:
              f=containing_function(x["addr"])
              fxrefs[f].append(x)

          # Direct call graph between inferred functions.
          graph=collections.defaultdict(set)
          for c in calls:
              caller=containing_function(c["caller_insn"])
              callee=containing_function(c["target"])
              graph[caller].add(callee)

          # High-value diagnostics.
          high_terms=[
              "UPGRADE:Flash data command,prepare to unlock & chip erase all",
              "pc upgrata code","pc upgrata const","pc upgrata config",
              "code MAGIC error","codeCRC different, need to upgrade",
              "Version different, need to upgrade",
              "jump_to_code_addr","check_user_code",
              "cmd_cxxx :","cmd_cxxx ACK",
              "PC IS OK","UDisk IS OK"
          ]
          diag_xrefs=[]
          for x in string_xrefs:
              if any(t.lower() in x["string"].lower() for t in high_terms):
                  diag_xrefs.append({
                      **x,
                      "function":containing_function(x["addr"])
                  })

          # Command xrefs and their inferred functions.
          command_xrefs=[]
          for x in string_xrefs:
              name=next((k for k,v in cmd_off.items() if v==x["file_offset"]),None)
              if name:
                  command_xrefs.append({
                      **x,"command":name,
                      "function":containing_function(x["addr"])
                  })

          # Reachability to destructive diagnostic functions.
          destructive_functions=set(
              x["function"] for x in diag_xrefs
              if ("chip erase all" in x["string"].lower()
                  or "pc upgrata code" in x["string"].lower()
                  or "pc upgrata const" in x["string"].lower()
                  or "pc upgrata config" in x["string"].lower())
          )

          def reachable(src,limit=8):
              seen={src}
              frontier={src}
              for _ in range(limit):
                  nxt=set()
                  for f in frontier:
                      nxt |= graph.get(f,set())
                  nxt -= seen
                  if not nxt: break
                  seen |= nxt
                  frontier=nxt
              return seen

          command_safety=[]
          for name in command_names:
              funcs=sorted(set(x["function"] for x in command_xrefs if x["command"]==name))
              for f in funcs:
                  reach=reachable(f)
                  destr=sorted(reach & destructive_functions)
                  command_safety.append({
                      "command":name,
                      "xref_function":f,
                      "reachable_destructive_functions":destr,
                      "destructive_path_found":bool(destr)
                  })

          # Save targeted disassembly windows for known interesting locations.
          windows=[
              ("REGISTRATION_4B80_4D20",0x4B80,0x4D20),
              ("UPINFO_54E0_5600",0x54E0,0x5600),
              ("CHIPERAS_56C0_57C0",0x56C0,0x57C0),
              ("GP_INIT_1AE0_1B80",0x1AE0,0x1B80),
          ]
          for name,lo,hi in windows:
              rows=[x["raw"] for x in ins if lo<=x["addr"]<=hi]
              (OUT/f"{name}.asm").write_text("\n".join(rows)+"\n")

          result={
              "revision":"RUNTIME_MAP_HANDLER_GRAPH_V5",
              "runtime_gp":GP,
              "runtime_gp_hex":f"0x{GP:08X}",
              "runtime_image_base":BASE,
              "runtime_image_base_hex":f"0x{BASE:08X}",
              "gp_file_offset":GP_FILE_OFF,
              "gp_file_offset_hex":f"0x{GP_FILE_OFF:04X}",
              "gp_initializers":gp_inits,
              "runtime_base_candidates":candidates[:20],
              "command_offsets":cmd_off,
              "command_xrefs":command_xrefs,
              "diagnostic_xrefs":diag_xrefs,
              "inferred_function_starts":starts,
              "direct_call_graph":{
                  f"0x{k:04X}":[f"0x{x:04X}" for x in sorted(v)]
                  for k,v in graph.items()
              },
              "destructive_functions":[f"0x{x:04X}" for x in sorted(destructive_functions)],
              "command_reachability":command_safety,
              "USB_OR_BOARD_CONTACTED":False,
              "LIVE_FLASH_AUTHORIZED":False,
              "FLASH_ALLOWED":False
          }
          (OUT/"RUNTIME_MAP_HANDLER_GRAPH.json").write_text(
              json.dumps(result,indent=2,ensure_ascii=False)+"\n"
          )

          md=[
              "# BP1048P4 Runtime Map + Handler Graph V5",
              "",
              f"64 KiB SHA256: `{meta['sha256']}`",
              "",
              "## Runtime address reconstruction",
              f"- recovered `$gp`: **`0x{GP:08X}`**",
              f"- recovered image runtime base: **`0x{BASE:08X}`**",
              f"- `$gp` corresponds to file offset: **`0x{GP_FILE_OFF:04X}`**",
              "",
              "### GP initializer",
          ]
          for g in gp_inits:
              md.append(
                  f"- `0x{g['sethi_addr']:04X}` `{g['sethi']}`; "
                  f"`0x{g['ori_addr']:04X}` `{g['ori']}` "
                  f"→ `{g['runtime_gp_hex']}`"
              )

          md+=["","## Exact command xrefs under recovered mapping"]
          for x in command_xrefs:
              md.append(
                  f"- **{x['command']}** file `0x{x['file_offset']:04X}` "
                  f"runtime `0x{x['runtime_string_address']:08X}` "
                  f"referenced at code `0x{x['addr']:04X}` "
                  f"(function ≈ `0x{x['function']:04X}`) via `{x['text']}`"
              )

          md+=["","## High-value diagnostic string xrefs"]
          if diag_xrefs:
              for x in diag_xrefs[:100]:
                  md.append(
                      f"- code `0x{x['addr']:04X}` function ≈ `0x{x['function']:04X}` "
                      f"→ file `0x{x['file_offset']:04X}` `{x['string']}`"
                  )
          else:
              md.append("- none recovered")

          md+=["","## Functions containing destructive diagnostics"]
          if destructive_functions:
              for f in sorted(destructive_functions):
                  md.append(f"- `0x{f:04X}`")
          else:
              md.append("- none recovered")

          md+=["","## Command-function reachability to destructive functions"]
          for x in command_safety:
              destr=", ".join(f"`0x{d:04X}`" for d in x["reachable_destructive_functions"])
              md.append(
                  f"- **{x['command']}** xref function `0x{x['xref_function']:04X}`: "
                  + (f"destructive function reachable {destr}" if x["destructive_path_found"]
                     else "no destructive function reached in bounded direct-call graph")
              )

          md+=["","## Decision"]
          md.append("- Runtime mapping is accepted only because six independent command-string references converge on the same image base.")
          md.append("- A missing path in this direct-call graph is **not** proof of safety; indirect calls and inferred function boundaries can still hide paths.")
          md.append("- `upinfo`/`cxxx` remain blocked from live use until their exact handler semantics and reply framing are recovered.")
          md.append("- USB/board contacted: **NO**")
          md.append("- Flash read/erase/write: **NO**")
          md.append("- `FLASH_ALLOWED=NO`")

          (OUT/"RUNTIME_MAP_HANDLER_GRAPH_SUMMARY.md").write_text(
              "\n".join(md)+"\n"
          )
          PYCODE

      - name: Publish summary
        shell: bash
        run: |
          set -euo pipefail
          cat /tmp/v5/evidence/RUNTIME_MAP_HANDLER_GRAPH_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Package evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v5/evidence
          zip -9 -r /tmp/OKN_BP1048P4_RUNTIME_MAP_HANDLER_GRAPH_V5_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/OKN_BP1048P4_RUNTIME_MAP_HANDLER_GRAPH_V5_EVIDENCE.zip \
            > /tmp/OKN_BP1048P4_RUNTIME_MAP_HANDLER_GRAPH_V5_EVIDENCE.zip.sha256

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: OKN-BP1048P4-RUNTIME-MAP-HANDLER-GRAPH-V5-EVIDENCE
          path: |
            /tmp/OKN_BP1048P4_RUNTIME_MAP_HANDLER_GRAPH_V5_EVIDENCE.zip
            /tmp/OKN_BP1048P4_RUNTIME_MAP_HANDLER_GRAPH_V5_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/v5/evidence/RUNTIME_MAP_HANDLER_GRAPH.json"))
          assert d["runtime_gp"] == 0x20026CB0
          assert d["runtime_image_base"] == 0x2001A9A8
          assert d["gp_file_offset"] == 0xC308
          assert d["USB_OR_BOARD_CONTACTED"] is False
          assert d["LIVE_FLASH_AUTHORIZED"] is False
          assert d["FLASH_ALLOWED"] is False
          print("RUNTIME_MAP_HANDLER_GRAPH_V5_GATE=PASS")
          PY
          echo FLASH_ALLOWED=NO
