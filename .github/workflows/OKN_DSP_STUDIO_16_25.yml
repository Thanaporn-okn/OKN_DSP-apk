      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Validate protocol identity, UI gating and pure-Java self tests
        shell: bash
        run: |
          set -euo pipefail
          python3 Sources/validate_v38_gate.py
          python3 Sources/validate_studio.py

      - name: Prepare release signing (optional, from GitHub Secrets)
        shell: bash
        env:
          OKN_KEYSTORE_BASE64: ${{ secrets.OKN_KEYSTORE_BASE64 }}
          OKN_KEYSTORE_PASSWORD: ${{ secrets.OKN_KEYSTORE_PASSWORD }}
          OKN_KEY_ALIAS: ${{ secrets.OKN_KEY_ALIAS }}
          OKN_KEY_PASSWORD: ${{ secrets.OKN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${OKN_KEYSTORE_BASE64:-}" ] && [ -n "${OKN_KEYSTORE_PASSWORD:-}" ] && [ -n "${OKN_KEY_ALIAS:-}" ] && [ -n "${OKN_KEY_PASSWORD:-}" ]; then
            printf '%s' "$OKN_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/okn-release.jks"
            echo "OKN_KEYSTORE_FILE=$RUNNER_TEMP/okn-release.jks" >> "$GITHUB_ENV"
            echo "OKN_RELEASE_SIGNING=PRODUCTION" >> "$GITHUB_ENV"
            echo "Release will be signed with the production key from GitHub Secrets."
          else
            echo "OKN_RELEASE_SIGNING=DEBUG" >> "$GITHUB_ENV"
            echo "::notice::No release keystore secrets found. The release APK falls back to the debug key (test signing only)."
          fi

      - name: Build Debug and Release APK
        shell: bash
        env:
          OKN_KEYSTORE_PASSWORD: ${{ secrets.OKN_KEYSTORE_PASSWORD }}
          OKN_KEY_ALIAS: ${{ secrets.OKN_KEY_ALIAS }}
          OKN_KEY_PASSWORD: ${{ secrets.OKN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --version
          gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk OKN_DSP_Studio_16_25-debug.apk
          cp app/build/outputs/apk/release/app-release.apk OKN_DSP_Studio_16_25-release.apk

      - name: Verify APK identity and test signing
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging OKN_DSP_Studio_16_25-debug.apk | tee OKN_DSP_Studio_16_25-apk-badging.txt
          grep -q "package: name='com.okn.dspstudio' versionCode='16100' versionName='16.1.0'" OKN_DSP_Studio_16_25-apk-badging.txt
          grep -q "application-label:'OKN DSP Studio'" OKN_DSP_Studio_16_25-apk-badging.txt
          {
            if [ "${OKN_RELEASE_SIGNING:-DEBUG}" = "PRODUCTION" ]; then
              echo 'Release signing status: PRODUCTION KEY from GitHub Secrets.'
            else
              echo 'Release signing status: TEST SIGNING ONLY - debug key (no signing secrets configured).'
              echo 'Add the four OKN_* secrets described in Sources/SIGNING_SETUP.txt for a production key.'
            fi
            "$APKSIGNER" verify --verbose --print-certs OKN_DSP_Studio_16_25-release.apk
          } | tee OKN_DSP_Studio_16_25-signing.txt
          if [ "${OKN_RELEASE_SIGNING:-DEBUG}" = "PRODUCTION" ] && grep -qi "Android Debug" OKN_DSP_Studio_16_25-signing.txt; then
            echo "Release APK is still debug-signed although secrets were provided" >&2
            exit 1
          fi

      - name: Package source and checksums
        shell: bash
        run: |
          set -euo pipefail
          zip -qr OKN_DSP_Studio_16_25-source.zip app Sources build.gradle settings.gradle gradle.properties CROSSOVER_HARDWARE_IMPLEMENTATION.md -x '*/build/*' -x '.gradle/*'
          cp Sources/DSP_STUDIO_NOTES.txt OKN_DSP_Studio_16_25-NOTES.txt
          sha256sum OKN_DSP_Studio_16_25-debug.apk OKN_DSP_Studio_16_25-release.apk OKN_DSP_Studio_16_25-source.zip OKN_DSP_Studio_16_25-NOTES.txt OKN_DSP_Studio_16_25-signing.txt > OKN_DSP_Studio_16_25-SHA256SUMS.txt
          cat OKN_DSP_Studio_16_25-SHA256SUMS.txt

      - name: Upload OKN DSP Studio artifact
        uses: actions/upload-artifact@v7
        with:
          name: OKN_DSP_Studio_16_25
          path: |
            OKN_DSP_Studio_16_25-debug.apk
            OKN_DSP_Studio_16_25-release.apk
            OKN_DSP_Studio_16_25-source.zip
            OKN_DSP_Studio_16_25-SHA256SUMS.txt
            OKN_DSP_Studio_16_25-apk-badging.txt
            OKN_DSP_Studio_16_25-signing.txt
            OKN_DSP_Studio_16_25-NOTES.txt
          if-no-files-found: error
          retention-days: 30
