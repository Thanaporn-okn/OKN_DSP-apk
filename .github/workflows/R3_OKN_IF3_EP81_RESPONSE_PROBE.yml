name: R3_OKN_IF3_EP81_RESPONSE_PROBE

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/R3_OKN_IF3_EP81_RESPONSE_PROBE.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/okn/dsp/r3

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "R3_OKN_IF3_EP81_RESPONSE_PROBE"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.okn.dsp.r3'
              compileSdk 35

              defaultConfig {
                  applicationId "com.okn.dsp.r3"
                  minSdk 26
                  targetSdk 35
                  versionCode 3
                  versionName "3.0-if3-ep81"
              }

              buildTypes {
                  debug { debuggable true }
                  release { minifyEnabled false }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.usb.host" android:required="true"/>
              <application
                  android:allowBackup="false"
                  android:label="R3 OKN IF3 EP81"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/okn/dsp/r3/MainActivity.java <<'EOF'
          package com.okn.dsp.r3;

          import android.app.Activity;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.hardware.usb.UsbConstants;
          import android.hardware.usb.UsbDevice;
          import android.hardware.usb.UsbDeviceConnection;
          import android.hardware.usb.UsbEndpoint;
          import android.hardware.usb.UsbInterface;
          import android.hardware.usb.UsbManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.text.method.ScrollingMovementMethod;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.util.Locale;
          import java.util.Map;

          public final class MainActivity extends Activity {
              private static final String ACTION_USB_PERMISSION =
                      "com.okn.dsp.r3.USB_PERMISSION";

              private static final int VID = 0x6324;
              private static final int PID = 0x1719;
              private static final int IF3_ID = 3;
              private static final int IF4_ID = 4;
              private static final int EP81 = 0x81;

              private UsbManager usb;
              private UsbDevice dev;
              private TextView logView;
              private final StringBuilder log = new StringBuilder();

              private final BroadcastReceiver receiver = new BroadcastReceiver() {
                  @Override public void onReceive(Context c, Intent i) {
                      if (!ACTION_USB_PERMISSION.equals(i.getAction())) return;
                      UsbDevice d;
                      if (Build.VERSION.SDK_INT >= 33) {
                          d = i.getParcelableExtra(UsbManager.EXTRA_DEVICE, UsbDevice.class);
                      } else {
                          @SuppressWarnings("deprecation")
                          UsbDevice old = i.getParcelableExtra(UsbManager.EXTRA_DEVICE);
                          d = old;
                      }
                      boolean ok = i.getBooleanExtra(
                              UsbManager.EXTRA_PERMISSION_GRANTED, false);
                      append("USB permission=" + ok);
                      if (ok && d != null && target(d)) {
                          dev = d;
                          baseline();
                      }
                  }
              };

              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  usb = (UsbManager)getSystemService(Context.USB_SERVICE);

                  IntentFilter f = new IntentFilter(ACTION_USB_PERMISSION);
                  if (Build.VERSION.SDK_INT >= 33) {
                      registerReceiver(receiver, f, Context.RECEIVER_NOT_EXPORTED);
                  } else {
                      registerReceiver(receiver, f);
                  }

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(24,24,24,24);

                  TextView title = new TextView(this);
                  title.setText("R3 OKN — IF3 EP81 RESPONSE PROBE");
                  title.setTextSize(20);
                  root.addView(title);

                  TextView safety = new TextView(this);
                  safety.setText(
                          "One IF4 UFE READ 0x58 ID2 only. " +
                          "Then read IF3 interrupt-IN EP81. " +
                          "No 0x57, no 0x11, no Feature SET_REPORT, no flash/reset.");
                  root.addView(safety);

                  Button scan = new Button(this);
                  scan.setText("1. SCAN + BASELINE");
                  scan.setOnClickListener(v -> scan());
                  root.addView(scan);

                  Button run = new Button(this);
                  run.setText("2. SEND READ ID2 + CAPTURE EP81");
                  run.setOnClickListener(v -> runOnce());
                  root.addView(run);

                  Button copy = new Button(this);
                  copy.setText("3. COPY LOG");
                  copy.setOnClickListener(v -> copy());
                  root.addView(copy);

                  logView = new TextView(this);
                  logView.setTextIsSelectable(true);
                  logView.setMovementMethod(new ScrollingMovementMethod());
                  ScrollView sv = new ScrollView(this);
                  sv.addView(logView);
                  root.addView(sv, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));

                  setContentView(root);
                  append("R3 IF3 EP81 read-only response-path probe");
                  scan();
              }

              @Override protected void onDestroy() {
                  try { unregisterReceiver(receiver); } catch (Throwable ignored) {}
                  super.onDestroy();
              }

              private boolean target(UsbDevice d) {
                  return d.getVendorId()==VID && d.getProductId()==PID;
              }

              private void scan() {
                  dev = null;
                  append("");
                  append("=== SCAN ===");
                  for (Map.Entry<String,UsbDevice> e: usb.getDeviceList().entrySet()) {
                      UsbDevice d = e.getValue();
                      append(String.format(Locale.US,
                              "%04X:%04X ifaces=%d",
                              d.getVendorId(), d.getProductId(),
                              d.getInterfaceCount()));
                      if (target(d)) dev = d;
                  }
                  if (dev == null) {
                      append("Target 6324:1719 not found.");
                      return;
                  }
                  append("Exact target found.");
                  if (!usb.hasPermission(dev)) {
                      int flags = PendingIntent.FLAG_UPDATE_CURRENT;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                          flags |= PendingIntent.FLAG_MUTABLE;
                      }
                      PendingIntent pi = PendingIntent.getBroadcast(
                              this,0,new Intent(ACTION_USB_PERMISSION)
                                      .setPackage(getPackageName()),flags);
                      append("Requesting USB permission...");
                      usb.requestPermission(dev,pi);
                  } else {
                      baseline();
                  }
              }

              private UsbInterface findIf(int id) {
                  if (dev == null) return null;
                  for (int i=0;i<dev.getInterfaceCount();i++) {
                      UsbInterface f = dev.getInterface(i);
                      if (f.getId()==id) return f;
                  }
                  return null;
              }

              private UsbEndpoint findEp81(UsbInterface f) {
                  if (f == null) return null;
                  for (int i=0;i<f.getEndpointCount();i++) {
                      UsbEndpoint ep=f.getEndpoint(i);
                      if (ep.getAddress()==EP81 &&
                          ep.getDirection()==UsbConstants.USB_DIR_IN &&
                          ep.getType()==UsbConstants.USB_ENDPOINT_XFER_INT) {
                          return ep;
                      }
                  }
                  return null;
              }

              private void baseline() {
                  UsbInterface f3=findIf(IF3_ID);
                  UsbInterface f4=findIf(IF4_ID);
                  UsbEndpoint ep=findEp81(f3);
                  append("");
                  append("=== BASELINE ===");
                  append("IF3=" + describe(f3));
                  append("IF4=" + describe(f4));
                  append("EP81=" + (ep==null ? "<missing>" :
                          "addr=0x81 maxPacket="+ep.getMaxPacketSize()+
                          " interval="+ep.getInterval()));

                  if (f4 == null || f4.getInterfaceClass()!=UsbConstants.USB_CLASS_HID) {
                      append("REFUSED: IF4 HID missing.");
                      return;
                  }

                  UsbDeviceConnection c=usb.openDevice(dev);
                  if (c==null) {
                      append("openDevice failed.");
                      return;
                  }
                  try {
                      byte[] feat=new byte[8];
                      int fr=c.controlTransfer(
                              0xA1,0x01,0x0300,IF4_ID,
                              feat,8,1000);
                      append("Feature8 IF4 rc="+fr+" data="+hex(feat,fr));
                  } finally {
                      c.close();
                  }
              }

              private void runOnce() {
                  if (dev==null) scan();
                  if (dev==null) return;
                  if (!usb.hasPermission(dev)) {
                      append("USB permission missing.");
                      return;
                  }
                  if (!target(dev)) {
                      append("REFUSED: target changed.");
                      return;
                  }

                  UsbInterface f3=findIf(IF3_ID);
                  UsbInterface f4=findIf(IF4_ID);
                  UsbEndpoint ep81=findEp81(f3);

                  if (f3==null || f4==null || ep81==null) {
                      append("REFUSED: IF3/IF4/EP81 topology mismatch.");
                      return;
                  }

                  byte[] frame=readId2();
                  append("");
                  append("=== ONE READ + EP81 CAPTURE ===");
                  append("TX="+hex(frame,13));

                  if ((frame[0]&0xff)!=0xA5 ||
                      (frame[1]&0xff)!=0x5A ||
                      (frame[2]&0xff)!=0x58 ||
                      (frame[3]&0xff)!=0x08 ||
                      (frame[12]&0xff)!=0x16) {
                      append("REFUSED: frame guard failed.");
                      return;
                  }

                  UsbDeviceConnection c=usb.openDevice(dev);
                  if (c==null) {
                      append("openDevice failed.");
                      return;
                  }

                  boolean c3=false,c4=false;
                  try {
                      c3=c.claimInterface(f3,true);
                      c4=c.claimInterface(f4,true);
                      append("claim IF3="+c3+" IF4="+c4);
                      if (!c3 || !c4) {
                          append("STOP: could not claim both interfaces.");
                          return;
                      }

                      byte[] pre=new byte[64];
                      int preRc=c.bulkTransfer(ep81,pre,pre.length,120);
                      append("PRE EP81 rc="+preRc+" data="+hex(pre,preRc));

                      int out=c.controlTransfer(
                              0x21,0x09,0x0200,IF4_ID,
                              frame,256,1500);
                      append("IF4 SET_REPORT Output rc="+out);
                      if (out!=256) {
                          append("STOP: output not accepted as 256.");
                          return;
                      }

                      for (int i=1;i<=6;i++) {
                          byte[] rx=new byte[64];
                          int rc=c.bulkTransfer(ep81,rx,rx.length,250);
                          append("EP81 read "+i+" rc="+rc+" data="+hex(rx,rc));
                          if (rc>0) {
                              parseCandidate(rx,rc);
                          }
                      }

                      byte[] in4=new byte[256];
                      int inRc=c.controlTransfer(
                              0xA1,0x01,0x0100,IF4_ID,
                              in4,256,1000);
                      append("POST IF4 GET_REPORT Input rc="+inRc+
                              " data="+hex(in4,inRc));

                      byte[] feat=new byte[8];
                      int fr=c.controlTransfer(
                              0xA1,0x01,0x0300,IF4_ID,
                              feat,8,1000);
                      append("POST Feature8 IF4 rc="+fr+
                              " data="+hex(feat,fr));

                  } finally {
                      if (c4) try { c.releaseInterface(f4); } catch(Throwable ignored) {}
                      if (c3) try { c.releaseInterface(f3); } catch(Throwable ignored) {}
                      c.close();
                  }
              }

              private static byte[] readId2() {
                  byte[] x=new byte[256];
                  x[0]=(byte)0xA5; x[1]=(byte)0x5A; x[2]=(byte)0x58; x[3]=0x08;
                  x[4]=0; x[5]=0; x[6]=0; x[7]=2;
                  x[8]=0; x[9]=0; x[10]=0; x[11]=4;
                  x[12]=0x16;
                  return x;
              }

              private void parseCandidate(byte[] b,int n) {
                  for (int off=0;off+4<=n;off++) {
                      if ((b[off]&0xff)==0xA5 && (b[off+1]&0xff)==0x5A) {
                          append(String.format(Locale.US,
                                  "Candidate UFE frame at offset=%d control=0x%02X len=%d",
                                  off,b[off+2]&0xff,b[off+3]&0xff));
                      }
                  }
              }

              private String describe(UsbInterface f) {
                  if (f==null) return "<missing>";
                  return "id="+f.getId()+" class="+f.getInterfaceClass()+
                          " sub="+f.getInterfaceSubclass()+
                          " proto="+f.getInterfaceProtocol()+
                          " eps="+f.getEndpointCount();
              }

              private void copy() {
                  ClipboardManager cb=(ClipboardManager)getSystemService(CLIPBOARD_SERVICE);
                  cb.setPrimaryClip(ClipData.newPlainText("R3 OKN log",log.toString()));
                  append("Log copied.");
              }

              private void append(String s) {
                  log.append(s).append('\n');
                  if (logView!=null) logView.setText(log.toString());
              }

              private static String hex(byte[] a,int n) {
                  if (n<=0) return "<none>";
                  int lim=Math.min(Math.min(n,a.length),64);
                  StringBuilder b=new StringBuilder();
                  for(int i=0;i<lim;i++) {
                      if(i>0)b.append(' ');
                      b.append(String.format(Locale.US,"%02X",a[i]&0xff));
                  }
                  return b.toString();
              }
          }
          EOF

      - name: Safety audit
        shell: bash
        run: |
          set -euo pipefail
          J=app/src/main/java/com/okn/dsp/r3/MainActivity.java

          grep -q 'VID = 0x6324' "$J"
          grep -q 'PID = 0x1719' "$J"
          grep -q 'IF3_ID = 3' "$J"
          grep -q 'IF4_ID = 4' "$J"
          grep -q 'EP81 = 0x81' "$J"
          grep -q 'x\[2\]=(byte)0x58' "$J"

          ! grep -Eq '0x57|0x11|SpiFlashErase|SpiFlashWrite|Reset_McuSystem|chiperas|codedata|bootdat|upinfo|btupdat|cnfgdat|constdat' "$J"
          ! grep -q '0x0300,IF4_ID,.*frame' "$J"

          echo "PASS R3: one 0x58 ID2 request on IF4; capture-only IF3 EP81; no flash/write/reset path"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" R3_OKN_IF3_EP81_RESPONSE_PROBE.apk
          sha256sum R3_OKN_IF3_EP81_RESPONSE_PROBE.apk \
            | tee R3_OKN_IF3_EP81_RESPONSE_PROBE_SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: R3_OKN_IF3_EP81_RESPONSE_PROBE
          path: |
            R3_OKN_IF3_EP81_RESPONSE_PROBE.apk
            R3_OKN_IF3_EP81_RESPONSE_PROBE_SHA256.txt
          if-no-files-found: error
          retention-days: 30
