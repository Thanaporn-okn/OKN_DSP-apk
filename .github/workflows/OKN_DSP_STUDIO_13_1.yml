name: OKN DSP Studio 13.1 - new UI on verified V12.1 transport

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/OKN_DSP_STUDIO_13_1.yml'

permissions:
  contents: read

concurrency:
  group: okn-dsp-studio-131-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build OKN DSP Studio 13.1.0
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 35 non-interactively
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Generate OKN DSP Studio project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app Sources build.gradle settings.gradle gradle.properties payload.tar.gz payload.tar.gz.b64
