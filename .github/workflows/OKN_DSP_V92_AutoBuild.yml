name: OKN DSP V92 Auto Build + Channel Volume AOT Discovery

on:
  push:
    paths:
      - '**/OKN_DSP_V*_Sources.zip'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-latest-version:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Locate latest OKN_DSP source ZIP
        id: src
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Locate source failed at line $LINENO: $BASH_COMMAND (exit $rc)"; exit $rc' ERR

          ZIP_FILE="$(python3 - <<'PY'
          from pathlib import Path
          import re

          found = []
          for p in Path('.').rglob('OKN_DSP_V*_Sources.zip'):
              m = re.fullmatch(r'OKN_DSP_V(\d+)_Sources\.zip', p.name)
              if m:
                  found.append((int(m.group(1)), str(p)))

          if found:
              print(max(found, key=lambda item: item[0])[1])
          PY
          )"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No OKN_DSP_V*_Sources.zip found anywhere in the repository."
            find . -maxdepth 3 -type f -print | sort | head -200 || true
            exit 1
          fi

          ZIP_NAME="$(basename "$ZIP_FILE")"
          VERSION="$(echo "$ZIP_NAME" | sed -E 's/^OKN_DSP_(V[0-9]+)_Sources\.zip$/\1/')"
          if [[ ! "$VERSION" =~ ^V[0-9]+$ ]]; then
            echo "::error::Could not parse version from $ZIP_NAME"
            exit 1
          fi

          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Selected source: $ZIP_FILE ($VERSION)"

      - name: Extract source and locate Gradle project
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Extract failed at line $LINENO: $BASH_COMMAND (exit $rc)"; exit $rc' ERR

          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -q "${{ steps.src.outputs.zip }}" -d buildsrc

          SETTINGS_FILE="$(find buildsrc -type f -name settings.gradle -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle not found after unzip."
            find buildsrc -maxdepth 5 -type f -print | sort | head -200 || true
            exit 1
          fi

          SRC_DIR="$(dirname "$SETTINGS_FILE")"
          if [ ! -f "$SRC_DIR/app/build.gradle" ]; then
            echo "::error::app/build.gradle not found under detected project: $SRC_DIR"
            find "$SRC_DIR" -maxdepth 3 -type f -print | sort | head -200 || true
            exit 1
          fi

          echo "SRC_DIR=$SRC_DIR" >> "$GITHUB_ENV"
          echo "Detected Gradle project: $SRC_DIR"

      - name: Verify source SHA256
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SHA256 verification failed at line $LINENO: $BASH_COMMAND (exit $rc)"; exit $rc' ERR

          cd "$SRC_DIR"
          if [ ! -f Sources/SHA256SUMS.txt ]; then
            echo "::error::Sources/SHA256SUMS.txt is missing"
            exit 1
          fi
          sha256sum -c Sources/SHA256SUMS.txt

      - name: Run packaged safety preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Safety preflight failed at line $LINENO: $BASH_COMMAND (exit $rc)"; exit $rc' ERR

          cd "$SRC_DIR"
          CHECKS=(
            Sources/validate_v38_gate.py
            Sources/validate_v39_reset.py
            Sources/validate_v92_channel_volume_discovery.py
          )
          for CHECK in "${CHECKS[@]}"; do
            if [ -f "$CHECK" ]; then
              echo "===== Running $CHECK ====="
              python3 "$CHECK"
            else
              echo "::error::Required safety check missing: $CHECK"
              exit 1
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Preinstalled Android SDK check failed at line $LINENO: $BASH_COMMAND (exit $rc)"; exit $rc' ERR

          : "${ANDROID_HOME:?ANDROID_HOME is not set on this runner}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found at $SDKMANAGER"
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$SDKMANAGER" --version

      - name: Install Android 35 packages
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Android SDK package install failed at line $LINENO: $BASH_COMMAND (exit $rc)"; exit $rc' ERR

          # Accept standard Android SDK licenses non-interactively. Under pipefail,
          # yes can receive SIGPIPE when sdkmanager finishes, so this line is tolerant;
          # the actual package install below remains strict and will fail the job on error.
          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          "$SDKMANAGER" --list_installed | grep -E 'platform-tools|platforms;android-35|build-tools;35.0.0' || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Build Debug APK
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Gradle build failed at line $LINENO: $BASH_COMMAND (exit $rc)"; exit $rc' ERR

          echo "Project: $SRC_DIR"
          java -version
          gradle --version
          gradle --no-daemon --stacktrace --console=plain -p "$SRC_DIR" :app:assembleDebug

      - name: Package APK and SHA256
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::APK packaging failed at line $LINENO: $BASH_COMMAND (exit $rc)"; exit $rc' ERR

          mkdir -p dist
          APK="$SRC_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::APK not found at expected path: $APK"
            find "$SRC_DIR/app/build/outputs" -maxdepth 6 -type f -print 2>/dev/null || true
            exit 1
          fi

          OUT="dist/OKN_DSP_${{ steps.src.outputs.version }}-debug.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "dist/OKN_DSP_${{ steps.src.outputs.version }}-debug.apk.sha256"
          cat "dist/OKN_DSP_${{ steps.src.outputs.version }}-debug.apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: OKN_DSP_${{ steps.src.outputs.version }}_APK
          path: |
            dist/OKN_DSP_${{ steps.src.outputs.version }}-debug.apk
            dist/OKN_DSP_${{ steps.src.outputs.version }}-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

  aot-channel-volume-discovery:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Locate and extract latest V92+ source
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::AOT source restore failed at line $LINENO: $BASH_COMMAND (exit $rc)"; exit $rc' ERR

          ZIP_FILE="$(python3 - <<'PY'
          from pathlib import Path
          import re
          found=[]
          for p in Path('.').rglob('OKN_DSP_V*_Sources.zip'):
              m=re.fullmatch(r'OKN_DSP_V(\d+)_Sources\.zip', p.name)
              if m: found.append((int(m.group(1)), str(p)))
          if found: print(max(found, key=lambda x:x[0])[1])
          PY
          )"
          test -n "$ZIP_FILE"
          rm -rf aot_src target blutter_pkg blutter_out artifact
          mkdir -p aot_src target artifact
          unzip -q "$ZIP_FILE" -d aot_src
          SETTINGS="$(find aot_src -type f -name settings.gradle -print -quit)"
          test -n "$SETTINGS"
          SRC_DIR="$(dirname "$SETTINGS")"
          test -f "$SRC_DIR/tools/reference/golopine_250401.apk"
          test -f "$SRC_DIR/tools/aot/analyze_channel_volume_aot.py"
          echo "AOT_SRC_DIR=$SRC_DIR" >> "$GITHUB_ENV"
          echo "Reference source=$SRC_DIR"

      - name: Verify authentic GoloPine 250401 APK and extract AOT
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Reference APK verification failed at line $LINENO: $BASH_COMMAND (exit $rc)"; exit $rc' ERR

          APK="$AOT_SRC_DIR/tools/reference/golopine_250401.apk"
          echo 'b1700436077aa0dcebf3fd8bc509a7a377c2eb9b62c9cb96980a5fe0bbd0fddb  '"$APK" | sha256sum -c -
          unzip -j "$APK" 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d target
          echo '3328c279046a2527d9f11a24fed270dfcd5de39df279c535099a6026174da7b6  target/libapp.so' | sha256sum -c -
          echo 'e5a55e7277079b4c1148709a7af82b45c38e9d431787f034d3d4ad212899d593  target/libflutter.so' | sha256sum -c -
          sha256sum target/libapp.so target/libflutter.so | tee target/SHA256SUMS.txt
          strings target/libflutter.so | grep -E '^[0-9]+\.[0-9]+\.[0-9]+ \(stable\)' | head -n 3 | tee target/dart_runtime.txt
          strings -t x target/libapp.so | grep -Ei 'WriteActuatorPeriperalCommand|ReadActuatorPeriperalCommand|DSPAmplifierConfig|SpeakerEQAddresses|SpeakerDRCAddresses|Volume|Gain|Output|Channel' | tee target/static_control_strings.txt || true
          grep -q '^3\.6\.0 (stable)' target/dart_runtime.txt

      - name: Download pinned Blutter standalone ARM64 bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Blutter download failed at line $LINENO: $BASH_COMMAND (exit $rc)"; exit $rc' ERR

          curl -fL --retry 4 --retry-delay 3 \
            'https://github.com/AcE77505/blutter-standalone/releases/download/v1.0/blutter_android.zip' \
            -o blutter_android.zip
          echo 'e65497ccb569a72bf4995de6ad718532812889e27cc92811ad2e55cf0ed43035  blutter_android.zip' | sha256sum -c -
          mkdir -p blutter_pkg
          unzip -q blutter_android.zip -d blutter_pkg
          find blutter_pkg -type f -name 'blutter_dartvm*_android_arm64' -printf '%f\n' | sort | tee target/blutter_supported_versions.txt
          find blutter_pkg -type f \( -name 'libcapstone.so*' -o -name 'ld-linux-aarch64.so.1' \) -print | sort | tee target/blutter_runtime_files.txt

      - name: Run exact Dart-runtime Blutter
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Blutter execution setup failed at line $LINENO: $BASH_COMMAND (exit $rc)"; exit $rc' ERR

          DARTVER="$(grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' target/dart_runtime.txt | head -n 1)"
          test -n "$DARTVER"
          : > target/blutter_run.log
          echo "Detected Dart runtime=$DARTVER" | tee -a target/blutter_run.log

          BINARY="$(find blutter_pkg -type f -name "blutter_dartvm${DARTVER}_android_arm64" | head -n 1)"
          LOADER="$(find blutter_pkg -type f -path '*/lib/ld-linux-aarch64.so.1' | head -n 1)"
          CAPSTONE="$(find blutter_pkg -type f -name 'libcapstone.so.4' | head -n 1)"
          test -n "$BINARY"
          test -n "$LOADER"
          test -n "$CAPSTONE"
          LIBDIR="$(dirname "$LOADER")"
          chmod +x "$BINARY" "$LOADER"
          echo "BINARY=$BINARY" | tee -a target/blutter_run.log
          echo "LOADER=$LOADER" | tee -a target/blutter_run.log
          echo "LIBDIR=$LIBDIR" | tee -a target/blutter_run.log
          echo "CAPSTONE=$CAPSTONE" | tee -a target/blutter_run.log

          set +e
          env -u LD_LIBRARY_PATH "$LOADER" --library-path "$LIBDIR" "$BINARY" \
            -i "$GITHUB_WORKSPACE/target/libapp.so" \
            -o "$GITHUB_WORKSPACE/blutter_out" 2>&1 | tee -a target/blutter_run.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "blutter_rc=$RC" | tee -a target/blutter_run.log
          if [ -f blutter_out/pp.txt ]; then echo 'pp.txt=present' | tee -a target/blutter_run.log; else echo 'pp.txt=missing' | tee -a target/blutter_run.log; fi
          if [ -f blutter_out/objs.txt ]; then echo 'objs.txt=present' | tee -a target/blutter_run.log; else echo 'objs.txt=missing' | tee -a target/blutter_run.log; fi
          if [ -d blutter_out/asm ]; then echo 'asm=present' | tee -a target/blutter_run.log; else echo 'asm=missing' | tee -a target/blutter_run.log; fi
          # Do not fail before uploading evidence; the report will preserve the exact RC/output.
          exit 0

      - name: Extract channel-volume AOT evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::AOT evidence extraction failed at line $LINENO: $BASH_COMMAND (exit $rc)"; exit $rc' ERR

          python3 "$AOT_SRC_DIR/tools/aot/analyze_channel_volume_aot.py" \
            --root blutter_out --target target --out artifact
          cp target/SHA256SUMS.txt artifact/
          cp target/dart_runtime.txt artifact/
          cp target/static_control_strings.txt artifact/ || true
          cp target/blutter_run.log artifact/
          cp target/blutter_supported_versions.txt artifact/
          cp target/blutter_runtime_files.txt artifact/
          if [ -f blutter_out/pp.txt ]; then cp blutter_out/pp.txt artifact/; fi
          if [ -f blutter_out/objs.txt ]; then cp blutter_out/objs.txt artifact/; fi
          if [ -d blutter_out/asm ]; then tar -czf artifact/blutter_asm.tar.gz -C blutter_out asm; fi
          sha256sum artifact/* 2>/dev/null | tee artifact/ARTIFACT_SHA256.txt || true
          ls -lh artifact/

      - name: Upload CH1-CH7 Output Volume AOT proof artifact
        uses: actions/upload-artifact@v6
        with:
          name: OKN-DSP-V92-CHANNEL-VOLUME-AOT-PROOF
          path: artifact/
          if-no-files-found: error
          retention-days: 30
