      - name: Firmware host build and unit tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S /tmp/okn-r6-work/okn-r6/firmware                 -B /tmp/okn-r6-work/okn-r6/firmware/build                 -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build /tmp/okn-r6-work/okn-r6/firmware/build
          ctest --test-dir /tmp/okn-r6-work/okn-r6/firmware/build --output-on-failure

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify R6 BLE safety gates
        shell: bash
        run: |
          set -euo pipefail
          APP=/tmp/okn-r6-work/okn-r6/android-app/app
          BT="$APP/src/main/java/com/okn/dsp/BluetoothInspector.java"

          grep -F 'applicationId = "com.okn.dsp.r6"' "$APP/build.gradle.kts"
          grep -F '00002a00-0000-1000-8000-00805f9b34fb' "$BT"
          grep -F '0000ab01-0000-1000-8000-00805f9b34fb' "$BT"
          grep -F 'readCharacteristic(ch)' "$BT"

          if grep -RInE             '\.writeCharacteristic\(|\.writeDescriptor\(|\.setCharacteristicNotification\(|getOutputStream\('             "$APP/src/main/java"; then
            echo "Forbidden write/subscription path found"
            exit 1
          fi

          if grep -RInE             'chiperas|codedata|bootdat|constdat|cnfgdat|btupdat|upinfo|SpiFlashWrite|SpiFlashErase'             "$APP/src/main/java"; then
            echo "Forbidden flash/update symbol found"
            exit 1
          fi

          grep -F 'OKN_RUNTIME_USB_TX_ENABLED", "false"' "$APP/build.gradle.kts"
          grep -F 'OKN_PRODUCTION_FLASH_ENABLED", "false"' "$APP/build.gradle.kts"
          echo "R6_SAFETY_GATE=PASS"

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build OKN-DSP R6 APK
        working-directory: /tmp/okn-r6-work/okn-r6/android-app
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn-r6-work/okn-r6/android-app/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          cp "$APK" /tmp/OKN-DSP-R6-v0.1.4-ab01-readonly.apk
          sha256sum /tmp/OKN-DSP-R6-v0.1.4-ab01-readonly.apk             > /tmp/OKN-DSP-R6-v0.1.4-ab01-readonly.apk.sha256
          sha256sum /tmp/OKN-DSP-R6-v0.1.4-source.zip             > /tmp/OKN-DSP-R6-v0.1.4-source.zip.sha256

      - name: Create R6 phone steps
        shell: bash
        run: |
          cat > /tmp/R6_NEXT_STEPS_TH.txt <<'EOF'
          OKN-DSP R6

          1. ติดตั้ง OKN-DSP-R6-v0.1.4-ab01-readonly.apk
          2. เปิด Bluetooth
          3. เปิดแอป R6 และอนุญาต Bluetooth
          4. กดค้นหา BLE
          5. แตะ LE-GoloPine_DSP_A
          6. รอ R6_READ_COMPLETE=YES
          7. ส่งผล READ 2A00 และ READ AB01:
             LEN
             HEX
             ASCII

          R6 เขียนข้อมูลไม่ได้:
          - no characteristic write
          - no CCCD write
          - no notification subscription
          - no DSP TX
          - no flash
          EOF

      - name: Upload OKN-DSP R6 package
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-R6-BLE-AB01-READONLY
          path: |
            /tmp/OKN-DSP-R6-v0.1.4-ab01-readonly.apk
            /tmp/OKN-DSP-R6-v0.1.4-ab01-readonly.apk.sha256
            /tmp/OKN-DSP-R6-v0.1.4-source.zip
            /tmp/OKN-DSP-R6-v0.1.4-source.zip.sha256
            /tmp/R6_NEXT_STEPS_TH.txt
          if-no-files-found: error
          retention-days: 30
