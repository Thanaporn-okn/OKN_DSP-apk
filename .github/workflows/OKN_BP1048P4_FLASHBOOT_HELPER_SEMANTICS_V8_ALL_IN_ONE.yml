name: OKN BP1048P4 Flashboot Helper Semantics V8 - All In One

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: okn-bp1048p4-helper-semantics-v8-${{ github.ref }}
  cancel-in-progress: true

env:
  FLASH_ALLOWED: "NO"

jobs:
  helper_semantics:
    name: Classify command helpers and call arguments - NO USB - NO FLASH
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          mkdir -p /tmp/v8/evidence
          cat > /tmp/v8/evidence/SAFETY.txt <<'EOF'
          MODE=OFFLINE_STATIC_HELPER_SEMANTICS_ONLY
          TARGET=MVSilicon_BP1048P4
          USB_OR_BOARD_CONTACT=NO
          TARGET_FIRMWARE_EXECUTED=NO
          FLASH_READ_EXECUTED=NO
          FLASH_ERASE_EXECUTED=NO
          FLASH_WRITE_EXECUTED=NO
          LIVE_BOOT_ENTRY_AUTHORIZED=NO
          LIVE_FLASH_AUTHORIZED=NO
          FLASH_ALLOWED=NO
          EOF

      - name: Checkout public BP1048 SDK
        uses: actions/checkout@v4
        with:
          repository: leadercxn/bp1048_sdk_v0.1.12
          ref: master
          path: bp1048-sdk
          fetch-depth: 1

      - name: Reconstruct exact image
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib,json,re,subprocess

          ROOT=Path("bp1048-sdk")
          OUT=Path("/tmp/v8/evidence")
          src=ROOT/"BT_Audio_APP/bt_audio_app_src/device/flash_boot.c"
          text=src.read_text(errors="replace")

          m=re.search(
              r"(?:static\s+|const\s+|unsigned\s+|signed\s+)*"
              r"(?:char|uint8_t|uint8|u8|BYTE)\s+flash_data\s*"
              r"\[\s*(?P<n>\d+)\s*\]\s*=\s*\{(?P<body>.*?)\};",
              text,re.I|re.S
          )
          assert m
          body=re.sub(r"/\*.*?\*/","",m.group("body"),flags=re.S)
          body=re.sub(r"//[^\r\n]*","",body)
          vals=[int(x,16) for x in re.findall(
              r"0[xX]([0-9A-Fa-f]{1,2})\b",body
          )]
          assert int(m.group("n"))==65536 and len(vals)==65520

          raw=bytes(vals)+bytes(65536-len(vals))
          (OUT/"flash_data_65536.bin").write_bytes(raw)

          meta={
              "commit":subprocess.check_output(
                  ["git","-C",str(ROOT),"rev-parse","HEAD"],text=True
              ).strip(),
              "sha256":hashlib.sha256(raw).hexdigest(),
              "runtime_gp":0x20026CB0,
              "runtime_base":0x2001A9A8,
              "USB_OR_BOARD_CONTACTED":False,
              "LIVE_FLASH_AUTHORIZED":False,
              "FLASH_ALLOWED":False
          }
          (OUT/"META.json").write_text(json.dumps(meta,indent=2)+"\n")
          PYCODE

      - name: Build GNU NDS32 objdump
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/v8/toolchain /tmp/v8/build
          cd /tmp/v8/toolchain
          URL="https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz"
          if curl -fL --retry 3 --connect-timeout 20 "$URL" -o binutils-2.44.tar.xz; then
            tar -xf binutils-2.44.tar.xz
            cd /tmp/v8/build
            if ../toolchain/binutils-2.44/configure \
                --target=nds32le-elf \
                --disable-nls --disable-werror --disable-gdb \
                --disable-gprofng --disable-gas --disable-ld --disable-gold \
                >/tmp/v8/evidence/NDS32_BUILD.log 2>&1 &&
               make -j2 all-binutils >>/tmp/v8/evidence/NDS32_BUILD.log 2>&1; then
              find /tmp/v8/build -type f -name '*objdump' -perm -111 -print \
                > /tmp/v8/evidence/OBJDUMP_CANDIDATES.txt
              echo BUILD_STATUS=SUCCESS > /tmp/v8/evidence/NDS32_BUILD_STATUS.txt
            else
              echo BUILD_STATUS=FAILED > /tmp/v8/evidence/NDS32_BUILD_STATUS.txt
            fi
          else
            echo BUILD_STATUS=DOWNLOAD_FAILED > /tmp/v8/evidence/NDS32_BUILD_STATUS.txt
          fi
          exit 0

      - name: Disassemble
        shell: bash
        run: |
          set -euo pipefail
          OBJDUMP="$(find /tmp/v8/build -type f -name '*objdump' -perm -111 | head -1 || true)"
          test -n "$OBJDUMP"
          "$OBJDUMP" -D -b binary -m nds32 --adjust-vma=0 \
            /tmp/v8/evidence/flash_data_65536.bin \
            > /tmp/v8/evidence/NDS32_DISASSEMBLY.txt \
            2>/tmp/v8/evidence/NDS32_DISASSEMBLY.stderr.txt

      - name: Classify helpers and reconstruct call arguments
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import collections,json,re

          OUT=Path("/tmp/v8/evidence")
          raw=(OUT/"flash_data_65536.bin").read_bytes()
          meta=json.loads((OUT/"META.json").read_text())
          GP=meta["runtime_gp"]
          BASE=meta["runtime_base"]

          dlines=(OUT/"NDS32_DISASSEMBLY.txt").read_text(errors="replace").splitlines()
          row_rx=re.compile(
              r"^\s*([0-9A-Fa-f]+):\s+(?:[0-9A-Fa-f]{2,8}\s+)+(.+?)\s*$"
          )
          ins=[]
          for line_no,line in enumerate(dlines,1):
              m=row_rx.match(line)
              if m:
                  ins.append({
                      "line":line_no,
                      "addr":int(m.group(1),16),
                      "text":m.group(2).strip(),
                      "raw":line
                  })
          by_addr={x["addr"]:i for i,x in enumerate(ins)}

          def pint(s):
              try:
                  return int(s.strip().replace("#",""),0)
              except Exception:
                  return None

          strings={}
          st=None
          for i,b in enumerate(raw+b"\x00"):
              if 32<=b<=126:
                  if st is None: st=i
              else:
                  if st is not None and i-st>=3:
                      strings[st]=raw[st:i].decode("ascii",errors="replace")
                  st=None

          cmd_names=[
              "chiperas","upinfo","btupdat","cnfgdat","constdat","codedata","cxxx"
          ]
          command_by_off={}
          for n in cmd_names:
              hits=[o for o,s in strings.items() if s==n]
              assert len(hits)==1,(n,hits)
              command_by_off[hits[0]]=n

          addigp_rx=re.compile(
              r"\baddi\.gp\s+(\$[A-Za-z0-9]+)\s*,\s*#?"
              r"(-?0x[0-9A-Fa-f]+|-?\d+)",re.I
          )
          movi_rx=re.compile(
              r"\bmovi(?:55)?\s+(\$[A-Za-z0-9]+)\s*,\s*#?"
              r"(-?0x[0-9A-Fa-f]+|-?\d+)",re.I
          )
          sethi_rx=re.compile(
              r"\bsethi\s+(\$[A-Za-z0-9]+)\s*,\s*#?"
              r"(-?0x[0-9A-Fa-f]+|-?\d+)",re.I
          )
          ori_rx=re.compile(
              r"\bori\s+(\$[A-Za-z0-9]+)\s*,\s*(\$[A-Za-z0-9]+)\s*,\s*#?"
              r"(-?0x[0-9A-Fa-f]+|-?\d+)",re.I
          )
          addi_rx=re.compile(
              r"\baddi\s+(\$[A-Za-z0-9]+)\s*,\s*(\$[A-Za-z0-9]+)\s*,\s*#?"
              r"(-?0x[0-9A-Fa-f]+|-?\d+)",re.I
          )
          mov_rx=re.compile(
              r"\b(?:mov55|mov|movi55)\s+"
              r"(\$[A-Za-z0-9]+)\s*,\s*(\$[A-Za-z0-9]+)\b",re.I
          )
          or_zero_rx=re.compile(
              r"\bor\s+(\$[A-Za-z0-9]+)\s*,\s*(\$[A-Za-z0-9]+)\s*,\s*\$r0\b",
              re.I
          )
          jal_rx=re.compile(r"\bjal\s+(?:0x)?([0-9A-Fa-f]+)\b",re.I)
          ret_rx=re.compile(r"\b(ret|ret5|jr\s+\$lp|pop25)\b",re.I)
          memload_rx=re.compile(
              r"\b(?P<op>lbi|lbsi|lhi|lhsi|lwi)(?:\.[A-Za-z0-9]+)?\s+"
              r"(?P<dst>\$[A-Za-z0-9]+)\s*,\s*"
              r"\[(?P<base>\$[A-Za-z0-9]+)",
              re.I
          )
          branch_rx=re.compile(
              r"\b(beq|bne|beqz|bnez|bgez|bltz|bgtz|blez)\b",re.I
          )

          refs=[]
          for x in ins:
              m=addigp_rx.search(x["text"])
              if not m: continue
              reg,imm_s=m.groups()
              imm=pint(imm_s)
              if imm is None: continue
              runtime=(GP+imm)&0xffffffff
              off=(runtime-BASE)&0xffffffff
              cmd=command_by_off.get(off)
              if cmd:
                  refs.append({
                      "addr":x["addr"],"reg":reg,"imm":imm,
                      "runtime":runtime,"file_offset":off,
                      "command":cmd,"text":x["text"]
                  })

          helper_targets=[0x0DFE,0x0FC0,0xAC50,0x40F0,0xABEC,0xAC80,0xACBC,0xAD0C,0x4AC0]

          call_sites=[]
          for idx,x in enumerate(ins):
              jm=jal_rx.search(x["text"])
              if not jm: continue
              target=int(jm.group(1),16)
              if target in helper_targets:
                  call_sites.append({
                      "idx":idx,"addr":x["addr"],"target":target,"text":x["text"]
                  })

          def classify_value(v):
              if not isinstance(v,int):
                  return None
              off=(v-BASE)&0xffffffff
              if off in strings:
                  return {
                      "runtime":v,
                      "file_offset":off,
                      "string":strings[off],
                      "command":command_by_off.get(off)
                  }
              return None

          reconstructed_calls=[]
          for cs in call_sites:
              lo=max(0,cs["idx"]-28)
              regs={}
              for x in ins[lo:cs["idx"]]:
                  t=x["text"]

                  m=addigp_rx.search(t)
                  if m:
                      rd,imm_s=m.groups()
                      imm=pint(imm_s)
                      if imm is not None:
                          regs[rd]=(GP+imm)&0xffffffff
                      continue

                  m=movi_rx.search(t)
                  if m:
                      rd,imm_s=m.groups()
                      imm=pint(imm_s)
                      if imm is not None:
                          regs[rd]=imm&0xffffffff
                      continue

                  m=sethi_rx.search(t)
                  if m:
                      rd,imm_s=m.groups()
                      imm=pint(imm_s)
                      if imm is not None:
                          regs[rd]=((imm&0xfffff)<<12)&0xffffffff
                      continue

                  m=ori_rx.search(t)
                  if m:
                      rd,ra,imm_s=m.groups()
                      imm=pint(imm_s)
                      if ra in regs and imm is not None:
                          regs[rd]=(regs[ra] | (imm&0x7fff))&0xffffffff
                      else:
                          regs.pop(rd,None)
                      continue

                  m=addi_rx.search(t)
                  if m:
                      rd,ra,imm_s=m.groups()
                      imm=pint(imm_s)
                      if ra in regs and imm is not None:
                          regs[rd]=(regs[ra]+imm)&0xffffffff
                      else:
                          regs.pop(rd,None)
                      continue

                  m=mov_rx.search(t)
                  if m:
                      rd,ra=m.groups()
                      if ra in regs:
                          regs[rd]=regs[ra]
                      else:
                          regs.pop(rd,None)
                      continue

                  m=or_zero_rx.search(t)
                  if m:
                      rd,ra=m.groups()
                      if ra in regs:
                          regs[rd]=regs[ra]
                      else:
                          regs.pop(rd,None)
                      continue

              reg_strings={}
              for reg,v in sorted(regs.items()):
                  c=classify_value(v)
                  if c:
                      reg_strings[reg]=c

              pre_rows=ins[max(0,cs["idx"]-12):cs["idx"]+1]
              reconstructed_calls.append({
                  **cs,
                  "register_string_values":reg_strings,
                  "known_register_values":{
                      k:f"0x{v:08X}" for k,v in sorted(regs.items())
                  },
                  "context":"\n".join(x["raw"] for x in pre_rows)
              })

          helpers=[]
          for target in helper_targets:
              idx=by_addr.get(target)
              if idx is None:
                  helpers.append({"target":target,"found":False})
                  continue

              end=min(len(ins)-1,idx+220)
              ret_indices=[
                  j for j in range(idx,min(len(ins),idx+220))
                  if ret_rx.search(ins[j]["text"])
              ]
              if ret_indices:
                  end=ret_indices[0]

              rows=ins[idx:end+1]
              load_bases=collections.Counter()
              byte_load_bases=collections.Counter()
              direct_calls=[]
              branch_count=0
              gp_string_refs=[]

              for x in rows:
                  mm=memload_rx.search(x["text"])
                  if mm:
                      base=mm.group("base")
                      op=mm.group("op").lower()
                      load_bases[base]+=1
                      if op in ("lbi","lbsi"):
                          byte_load_bases[base]+=1

                  if branch_rx.search(x["text"]):
                      branch_count+=1

                  jm=jal_rx.search(x["text"])
                  if jm:
                      direct_calls.append({
                          "addr":x["addr"],"target":int(jm.group(1),16),
                          "text":x["text"]
                      })

                  gm=addigp_rx.search(x["text"])
                  if gm:
                      reg,imm_s=gm.groups()
                      imm=pint(imm_s)
                      if imm is not None:
                          runtime=(GP+imm)&0xffffffff
                          c=classify_value(runtime)
                          if c:
                              gp_string_refs.append({
                                  "addr":x["addr"],"reg":reg,
                                  "runtime":runtime,**c,"text":x["text"]
                              })

              two_pointer_byte_walk=(
                  byte_load_bases.get("$r0",0)>0
                  and byte_load_bases.get("$r1",0)>0
                  and branch_count>0
              )

              helper={
                  "target":target,
                  "found":True,
                  "start":rows[0]["addr"],
                  "end":rows[-1]["addr"],
                  "instruction_count":len(rows),
                  "load_bases":dict(load_bases),
                  "byte_load_bases":dict(byte_load_bases),
                  "branch_count":branch_count,
                  "direct_calls":direct_calls,
                  "gp_string_refs":gp_string_refs,
                  "two_pointer_byte_walk_candidate":two_pointer_byte_walk,
              }
              helpers.append(helper)

              (OUT/f"HELPER_{target:04X}.asm").write_text(
                  "\n".join(x["raw"] for x in rows)+"\n"
              )

          command_windows=[]
          for n,r in enumerate(refs):
              idx=by_addr.get(r["addr"])
              if idx is None: continue
              rows=ins[max(0,idx-8):min(len(ins),idx+18)]
              text="\n".join(x["raw"] for x in rows)
              command_windows.append({
                  "command":r["command"],"addr":r["addr"],"text":text
              })
              (OUT/f"COMMAND_{n:02d}_{r['command']}_{r['addr']:04X}.asm").write_text(
                  text+"\n"
              )

          result={
              "revision":"HELPER_SEMANTICS_V8",
              "runtime_gp":GP,
              "runtime_base":BASE,
              "command_refs":refs,
              "target_helpers":helper_targets,
              "reconstructed_calls":reconstructed_calls,
              "helper_analysis":helpers,
              "command_windows":command_windows,
              "USB_OR_BOARD_CONTACTED":False,
              "LIVE_FLASH_AUTHORIZED":False,
              "FLASH_ALLOWED":False
          }
          (OUT/"HELPER_SEMANTICS.json").write_text(
              json.dumps(result,indent=2,ensure_ascii=False)+"\n"
          )

          md=[
              "# BP1048P4 Helper Semantics V8",
              "",
              f"64 KiB SHA256: `{meta['sha256']}`",
              f"runtime `$gp`: `0x{GP:08X}`",
              f"runtime image base: `0x{BASE:08X}`",
              "",
              "## Helper body classification",
          ]

          for h in helpers:
              if not h.get("found"):
                  md.append(f"- `0x{h['target']:04X}`: not found")
                  continue
              b=", ".join(f"{k}:{v}" for k,v in sorted(h["byte_load_bases"].items())) or "-"
              calls=", ".join(
                  f"0x{x['addr']:04X}→0x{x['target']:04X}"
                  for x in h["direct_calls"][:12]
              ) or "none"
              md.append(
                  f"- `0x{h['target']:04X}` region `0x{h['start']:04X}–0x{h['end']:04X}`; "
                  f"byte-load bases `{b}`; branches `{h['branch_count']}`; "
                  f"two-pointer-byte-walk `{h['two_pointer_byte_walk_candidate']}`; "
                  f"direct calls {calls}"
              )

          md+=["","## Reconstructed string arguments at helper calls"]
          interesting=0
          for c in reconstructed_calls:
              if not c["register_string_values"]:
                  continue
              interesting+=1
              vals=[]
              for reg,v in c["register_string_values"].items():
                  suffix=f" **COMMAND={v['command']}**" if v.get("command") else ""
                  vals.append(
                      f"`{reg}`=`0x{v['runtime']:08X}` → `{v['string']}`{suffix}"
                  )
              md.append(
                  f"- call `0x{c['addr']:04X} → 0x{c['target']:04X}`: "
                  + "; ".join(vals)
              )
          if not interesting:
              md.append("- no printable-string register values reconstructed")

          md+=["","## Exact focus: calls near upinfo/chiperas"]
          for c in reconstructed_calls:
              if 0x5500<=c["addr"]<=0x5800:
                  vals=[]
                  for reg,v in c["register_string_values"].items():
                      vals.append(f"{reg}→{v['string']}")
                  md.append(
                      f"- `0x{c['addr']:04X} → 0x{c['target']:04X}`; "
                      f"strings: `{', '.join(vals) or 'none reconstructed'}`"
                  )

          md+=["","## Helper-internal printable string xrefs"]
          count=0
          for h in helpers:
              for x in h.get("gp_string_refs",[]):
                  count+=1
                  md.append(
                      f"- helper `0x{h['target']:04X}` code `0x{x['addr']:04X}` "
                      f"→ `{x['string']}`"
                  )
          if not count:
              md.append("- none")

          md+=["","## Interpretation"]
          md.append("- `two-pointer-byte-walk=True` is only a structural signature; it is not automatically labeled `strcmp`.")
          md.append("- A reconstructed command literal in `$r0/$r1` at a helper call is strong evidence that the helper consumes or compares that command string.")
          md.append("- This run prints exact helper bodies as artifacts so the next decision can use instructions rather than region-level heuristics.")
          md.append("- No helper is considered safe merely because it lacks destructive strings.")
          md.append("- USB/board contacted: **NO**")
          md.append("- Flash read/erase/write: **NO**")
          md.append("- `FLASH_ALLOWED=NO`")

          (OUT/"HELPER_SEMANTICS_SUMMARY.md").write_text("\n".join(md)+"\n")
          PYCODE

      - name: Publish summary
        shell: bash
        run: |
          set -euo pipefail
          cat /tmp/v8/evidence/HELPER_SEMANTICS_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Package evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v8/evidence
          zip -9 -r /tmp/OKN_BP1048P4_HELPER_SEMANTICS_V8_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/OKN_BP1048P4_HELPER_SEMANTICS_V8_EVIDENCE.zip \
            > /tmp/OKN_BP1048P4_HELPER_SEMANTICS_V8_EVIDENCE.zip.sha256

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: OKN-BP1048P4-HELPER-SEMANTICS-V8-EVIDENCE
          path: |
            /tmp/OKN_BP1048P4_HELPER_SEMANTICS_V8_EVIDENCE.zip
            /tmp/OKN_BP1048P4_HELPER_SEMANTICS_V8_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/v8/evidence/HELPER_SEMANTICS.json"))
          assert d["runtime_gp"] == 0x20026CB0
          assert d["runtime_base"] == 0x2001A9A8
          assert d["USB_OR_BOARD_CONTACTED"] is False
          assert d["LIVE_FLASH_AUTHORIZED"] is False
          assert d["FLASH_ALLOWED"] is False
          print("HELPER_SEMANTICS_V8_GATE=PASS")
          PY
          echo FLASH_ALLOWED=NO
