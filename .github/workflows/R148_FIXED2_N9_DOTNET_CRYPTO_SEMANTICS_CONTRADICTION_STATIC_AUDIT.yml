name: R148 FIXED2 N9 .NET crypto semantics contradiction static audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R148_FIXED2_N9_DOTNET_CRYPTO_SEMANTICS_CONTRADICTION_STATIC_AUDIT.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r148-n9-dotnet-crypto-semantics-static-${{ github.ref }}
  cancel-in-progress: true

env:
  FLASH_ALLOWED: "NO"
  R147_RUN_ID: "36011246037"
  R147_JOB_ID: "107672209478"
  R147_ARTIFACT_ID: "10811948525"
  R147_ARTIFACT_NAME: "R147-N9-EXACT-CRYPTOSTREAM-INPUT-SLICE-STATIC-EVIDENCE"
  R147_ARTIFACT_DIGEST: "sha256:653c149c20ed6de6d6a28d86a4c257acd3b61155c953bbcb2724d8105b7dd3f6"
  REFSOURCE_COMMIT: "ec9fa9ae770d522a5b5f0607898044b7478574a3"
  H15_RESOURCE_NAME: "h15IL2i6yy2BZV8RqM.YuRwd1JALC4oy32W66"

jobs:
  static_audit:
    name: STATIC ONLY - .NET CryptoStream final-block semantics - no vendor execution - no USB - no board
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r148/r147 /tmp/r148/evidence/reference_source
          cat > /tmp/r148/evidence/R148_SAFETY.txt <<'EOF'
          R148_MODE=OFFLINE_STATIC_DOTNET_CRYPTO_SEMANTICS_CONTRADICTION_AUDIT_ONLY
          R148_VENDOR_BINARY_EXECUTED=NO
          R148_WINDOWS_EXE_EXECUTED=NO
          R148_DLL_EXECUTED=NO
          R148_APK_EXECUTED=NO
          R148_USB_DEVICE_ACCESS=NO
          R148_BOARD_CONTACT=NO
          R148_AA55_SENT=NO
          R148_LINEIN_AA55_SENT=NO
          R148_RUNTIME_0X11_SENT=NO
          R148_RUNTIME_0XFE_SENT=NO
          R148_FLASHBOOT_COMMAND_SENT=NO
          R148_FLASH_READ_EXECUTED=NO
          R148_FLASH_ERASE_EXECUTED=NO
          R148_FLASH_WRITE_EXECUTED=NO
          R148_ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD=NO
          R148_ONE_BYTE_REPAIR_GUESS_ALLOWED=NO
          R148_OFFLINE_DECRYPT_ALLOWED_UNTIL_SEMANTICS_RESOLVED=NO
          R148_REFERENCE_SOURCE_IS_PLATFORM_SEMANTICS_NOT_PRODUCTION_DSP_PROOF=YES
          HARDWARE_MODIFICATION=FORBIDDEN
          FLASH_ALLOWED=NO
          EOF

      - name: Download pinned R147 evidence
        uses: actions/download-artifact@v4
        with:
          name: R147-N9-EXACT-CRYPTOSTREAM-INPUT-SLICE-STATIC-EVIDENCE
          path: /tmp/r148/r147
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 36011246037

      - name: Verify and extract pinned R147 evidence
        shell: bash
        run: |
          set -euo pipefail
          OUTER="$(find /tmp/r148/r147 -maxdepth 2 -type f -name 'R147_N9_EXACT_CRYPTOSTREAM_INPUT_SLICE_STATIC_EVIDENCE.zip' -print -quit)"
          SUM="$(find /tmp/r148/r147 -maxdepth 2 -type f -name 'R147_N9_EXACT_CRYPTOSTREAM_INPUT_SLICE_STATIC_EVIDENCE.zip.sha256' -print -quit)"
          test -n "$OUTER"
          test -n "$SUM"
          EXPECTED="$(awk '{print $1}' "$SUM")"
          ACTUAL="$(sha256sum "$OUTER" | awk '{print $1}')"
          test "$EXPECTED" = "$ACTUAL"
          cp "$OUTER" /tmp/r148/evidence/R147_INNER.zip
          cp "$SUM" /tmp/r148/evidence/R147_INNER.zip.sha256.source
          printf '%s  %s\n' "$ACTUAL" R147_INNER.zip > /tmp/r148/evidence/R148_R147_INNER_ZIP.sha256
          unzip -q "$OUTER" -d /tmp/r148/evidence/r147
          test -s /tmp/r148/evidence/r147/R147_DECISION.json
          test -s /tmp/r148/evidence/r147/R147_EXACT_CRYPTOSTREAM_INPUT_SLICE_PROOF.json
          test -s /tmp/r148/evidence/r147/r146/r145/r144/R144_PE32_CONCRETE_KEYIV_PATH.json
          test -s /tmp/r148/evidence/r147/r146/r145/r144/r143/R143_N9_METHOD.il
          test -s /tmp/r148/evidence/r147/r146/r145/r144/r143/r142/r141/r140/R140_FIXED_FULL.il
          test -s /tmp/r148/evidence/r147/r146/r145/r144/r143/r142/r141/R141_FIXED_ASCII_STRINGS.txt
          test -s /tmp/r148/evidence/r147/r146/r145/r144/r143/r142/R142_PROXY_TOKEN_RESOLUTION.json
          test -s /tmp/r148/evidence/r147/r146/r145/r144/r143/r142/R142_EXTRACTED_MANAGED_RESOURCES/02_h15IL2i6yy2BZV8RqM.YuRwd1JALC4oy32W66.bin
          grep -F '"PROVEN_EXACT_CIPHERTEXT_SLICE_BOOL": true' /tmp/r148/evidence/r147/R147_DECISION.json
          grep -F '"CRYPTOSTREAM_WRITE_LENGTH": 607967' /tmp/r148/evidence/r147/R147_DECISION.json
          grep -F '"OFFLINE_DECRYPT_AUTHORIZED": false' /tmp/r148/evidence/r147/R147_DECISION.json
          grep -F '"H15_PLAINTEXT_RECOVERED": false' /tmp/r148/evidence/r147/R147_DECISION.json
          grep -F '"FLASH_ALLOWED": false' /tmp/r148/evidence/r147/R147_DECISION.json

      - name: Checkout pinned Microsoft .NET Framework Reference Source
        uses: actions/checkout@v4
        with:
          repository: microsoft/referencesource
          ref: ec9fa9ae770d522a5b5f0607898044b7478574a3
          path: reference-source
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            mscorlib/system/security/cryptography
            System.Core/System/Security/Cryptography
          sparse-checkout-cone-mode: true

      - name: Pin and snapshot exact platform source evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C reference-source rev-parse HEAD)" = "$REFSOURCE_COMMIT"
          SRC=/tmp/r148/evidence/reference_source
          files=(
            mscorlib/system/security/cryptography/symmetricalgorithm.cs
            mscorlib/system/security/cryptography/aes.cs
            mscorlib/system/security/cryptography/rijndael.cs
            mscorlib/system/security/cryptography/rijndaelmanaged.cs
            mscorlib/system/security/cryptography/rijndaelmanagedtransform.cs
            mscorlib/system/security/cryptography/cryptostream.cs
            mscorlib/system/security/cryptography/crypto.cs
            System.Core/System/Security/Cryptography/AesCryptoServiceProvider.cs
            System.Core/System/Security/Cryptography/CapiSymmetricAlgorithm.cs
          )
          : > /tmp/r148/evidence/R148_REFERENCE_SOURCE_GIT_BLOBS.txt
          echo "REFSOURCE_COMMIT=$REFSOURCE_COMMIT" >> /tmp/r148/evidence/R148_REFERENCE_SOURCE_GIT_BLOBS.txt
          : > /tmp/r148/evidence/R148_REFERENCE_SOURCE_SNAPSHOT_SHA256.txt
          for f in "${files[@]}"; do
            test -s "reference-source/$f"
            git -C reference-source cat-file -e "HEAD:$f"
            blob="$(git -C reference-source rev-parse "HEAD:$f")"
            printf '%s  %s\n' "$blob" "$f" >> /tmp/r148/evidence/R148_REFERENCE_SOURCE_GIT_BLOBS.txt
            cp "reference-source/$f" "$SRC/$(basename "$f")"
            sha256sum "$SRC/$(basename "$f")" >> /tmp/r148/evidence/R148_REFERENCE_SOURCE_SNAPSHOT_SHA256.txt
          done
          test "$(wc -l < /tmp/r148/evidence/R148_REFERENCE_SOURCE_GIT_BLOBS.txt)" -eq 10
          test "$(wc -l < /tmp/r148/evidence/R148_REFERENCE_SOURCE_SNAPSHOT_SHA256.txt)" -eq 9
          grep -F "REFSOURCE_COMMIT=$REFSOURCE_COMMIT" /tmp/r148/evidence/R148_REFERENCE_SOURCE_GIT_BLOBS.txt
          grep -F 'mscorlib/system/security/cryptography/cryptostream.cs' /tmp/r148/evidence/R148_REFERENCE_SOURCE_GIT_BLOBS.txt
          grep -F 'System.Core/System/Security/Cryptography/CapiSymmetricAlgorithm.cs' /tmp/r148/evidence/R148_REFERENCE_SOURCE_GIT_BLOBS.txt

      - name: Prove concrete N9 path reaches exact CryptoStream block
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          ev=Path('/tmp/r148/evidence')
          n9=(ev/'r147/r146/r145/r144/r143/R143_N9_METHOD.il').read_text(errors='replace')
          full=(ev/'r147/r146/r145/r144/r143/r142/r141/r140/R140_FIXED_FULL.il').read_text(errors='replace')
          r144=json.loads((ev/'r147/r146/r145/r144/R144_PE32_CONCRETE_KEYIV_PATH.json').read_text())
          r147=json.loads((ev/'r147/R147_DECISION.json').read_text())
          ascii_strings=(ev/'r147/r146/r145/r144/r143/r142/r141/R141_FIXED_ASCII_STRINGS.txt').read_text(errors='replace')
          proxy=json.loads((ev/'r147/r146/r145/r144/r143/r142/R142_PROXY_TOKEN_RESOLUTION.json').read_text())

          sw=re.search(r'IL_0012:\s*switch\s*\((.*?)\)\s*',n9,re.S)
          if not sw:
              raise SystemExit('N9 switch table not found')
          labels=re.findall(r'IL_[0-9a-fA-F]{4}',sw.group(1))
          if len(labels) <= 402:
              raise SystemExit('N9 switch table unexpectedly short')

          def body(name):
              marker=f'}} // end of method q71r2Rj8SiD9GF1BI50::{name}'
              end=full.find(marker)
              if end < 0:
                  return ''
              start=max(full.rfind('\n\t.method ',0,end), full.rfind('\n\t\t.method ',0,end))
              return full[start:end+len(marker)] if start >= 0 else ''

          def ordered(text,snippets):
              p=-1
              for x in snippets:
                  p=text.find(x,p+1)
                  if p < 0:
                      return False
              return True

          state_map_ok=(labels[402]=='IL_23ed' and labels[40]=='IL_26d7' and labels[281]=='IL_65d1')
          state402_to40=ordered(n9,[
            'IL_23ed: call object Q9Wet0jLP4YxXSyJBiC.q71r2Rj8SiD9GF1BI50::trEuKPNkgB3p5fLuROn()',
            'IL_23f3: ldc.i4.1',
            'IL_23f4: call void Q9Wet0jLP4YxXSyJBiC.q71r2Rj8SiD9GF1BI50::Q2CVcdNXO7dpP5ufbGy',
            'IL_23f9: ldloc.s 47',
            'IL_23fb: ldloc.s 8',
            'IL_23fd: call object Q9Wet0jLP4YxXSyJBiC.q71r2Rj8SiD9GF1BI50::VnHlfpNorSGR6U9GUOp',
            'IL_2402: stloc.s 78',
            'IL_2404: ldc.i4 40',
            'IL_2409: br IL_0012',
          ])
          zfos_true=(r144.get('proven_opaque_predicates',{}).get('zfos5ENLukrcbiO4qNQ') is True)
          state40_to281=ordered(n9,[
            'IL_26d7: ldloc.s 47',
            'IL_26de: call void Q9Wet0jLP4YxXSyJBiC.q71r2Rj8SiD9GF1BI50::VdpxeBN91DReLWMTEcv',
            'IL_26e3: ldc.i4 281',
            'IL_26e8: call bool Q9Wet0jLP4YxXSyJBiC.q71r2Rj8SiD9GF1BI50::zfos5ENLukrcbiO4qNQ()',
            'IL_26ed: brtrue IL_0012',
          ]) and zfos_true
          state281_crypto=ordered(n9,[
            'IL_65d1: newobj instance void [mscorlib]System.IO.MemoryStream::.ctor()',
            'IL_65d7: ldloc.s 78',
            'IL_65d9: ldc.i4.1',
            'IL_65da: newobj instance void [mscorlib]System.Security.Cryptography.CryptoStream::.ctor',
            'IL_65e3: ldloc.s 12',
            'IL_65e5: ldc.i4.0',
            'IL_65e6: ldloc.s 12',
            'IL_65e8: ldlen',
            'IL_65ea: call void Q9Wet0jLP4YxXSyJBiC.q71r2Rj8SiD9GF1BI50::RMHoOvNN1BGBrZfKGy1',
            'IL_65f1: call void Q9Wet0jLP4YxXSyJBiC.q71r2Rj8SiD9GF1BI50::it3eekNKjtbEQVI5up2',
            'IL_65f7: call object Q9Wet0jLP4YxXSyJBiC.q71r2Rj8SiD9GF1BI50::HVJrNANRJZcM7WNOuLw',
            'IL_65fc: stloc.s 29',
          ])

          factory=body('t2QjAoPE2q')
          make=body('trEuKPNkgB3p5fLuROn')
          mode=body('Q2CVcdNXO7dpP5ufbGy')
          dec=body('VnHlfpNorSGR6U9GUOp')
          write=body('RMHoOvNN1BGBrZfKGy1')
          flush=body('it3eekNKjtbEQVI5up2')
          array=body('HVJrNANRJZcM7WNOuLw')

          factory_candidates={
            'AesCryptoServiceProvider':'AesCryptoServiceProvider::.ctor()' in factory,
            'RijndaelManaged':'RijndaelManaged::.ctor()' in factory,
          }
          wrapper_facts={
            'make_calls_factory':'::t2QjAoPE2q()' in make,
            'mode_calls_set_Mode':'SymmetricAlgorithm::set_Mode' in mode,
            'decryptor_calls_CreateDecryptor':'SymmetricAlgorithm::CreateDecryptor(uint8[], uint8[])' in dec,
            'write_calls_Stream_Write':'System.IO.Stream::Write(uint8[], int32, int32)' in write,
            'flush_calls_FlushFinalBlock':'CryptoStream::FlushFinalBlock()' in flush,
            'array_calls_ToArray':'MemoryStream::ToArray()' in array,
          }

          crypto_setup=n9[n9.find('IL_23ed:'):n9.find('IL_240e:')]
          no_padding_setter_in_setup=('set_Padding' not in crypto_setup and 'wsqbUvCK7N' not in crypto_setup)
          padding_pair=next((x for x in proxy.get('resolved_proxy_pairs',[]) if x.get('field_name')=='wsqbUvCK7N'),None)
          padding_proxy_resolves=(padding_pair is not None and padding_pair.get('target_name')=='set_Padding')
          padding_proxy_not_referenced_in_n9=('wsqbUvCK7N' not in n9)

          framework_facts={
            'clr_v4_string':'v4.0.30319' in ascii_strings,
            'target_framework_v471_string':'.NETFramework,Version=v4.7.1' in ascii_strings,
          }

          out={
            'R144_PE32_ASSUMPTION':r144.get('concrete_runtime_assumption'),
            'R144_PATH_REACHES_STATE402':r144.get('path_reaches_crypto_state_402') is True,
            'R144_ZFOS_OPAQUE_PREDICATE_PROVEN_TRUE':zfos_true,
            'switch_state_count':len(labels),
            'state402_label':labels[402],
            'state40_label':labels[40],
            'state281_label':labels[281],
            'STATE_MAP_402_40_281_PROVEN':state_map_ok,
            'STATE402_TO_STATE40_PROVEN':state402_to40,
            'STATE40_TO_STATE281_PROVEN_UNDER_R144_ZFOS_TRUE':state40_to281,
            'STATE281_EXACT_CRYPTOSTREAM_BLOCK_PROVEN':state281_crypto,
            'CONCRETE_PATH_402_TO40_TO281_PROVEN':all([state_map_ok,state402_to40,state40_to281,state281_crypto]),
            'factory_candidates':factory_candidates,
            'wrapper_facts':wrapper_facts,
            'ONLY_OBSERVED_PRE_CREATEDECRYPTOR_ALGORITHM_PROPERTY_SETTER_IS_MODE':no_padding_setter_in_setup,
            'GLOBAL_PADDING_PROXY_RESOLVES_TO_set_Padding':padding_proxy_resolves,
            'GLOBAL_PADDING_PROXY_NOT_REFERENCED_IN_N9':padding_proxy_not_referenced_in_n9,
            'framework_facts':framework_facts,
            'R147_EXACT_SLICE_STILL_PINNED':r147.get('PROVEN_EXACT_CIPHERTEXT_SLICE_BOOL') is True,
            'important_interpretation':(
              'Under the same concrete PE32 assumptions already used by R144, state 402 creates the decryptor, '
              'state 40 follows the already-proven zfos=true branch to state 281, and state 281 writes the complete '
              'R147-proven h15 slice into CryptoStream then calls FlushFinalBlock. This remains static evidence only.'),
          }
          (ev/'R148_N9_CONCRETE_CRYPTO_PATH_PROOF.json').write_text(json.dumps(out,indent=2)+'\n')
          required=[
            out['R144_PATH_REACHES_STATE402'],out['R144_ZFOS_OPAQUE_PREDICATE_PROVEN_TRUE'],
            out['CONCRETE_PATH_402_TO40_TO281_PROVEN'],all(factory_candidates.values()),
            all(wrapper_facts.values()),no_padding_setter_in_setup,padding_proxy_resolves,
            padding_proxy_not_referenced_in_n9,all(framework_facts.values()),out['R147_EXACT_SLICE_STILL_PINNED'],
          ]
          if not all(required):
              raise SystemExit('concrete N9 crypto path proof incomplete')
          PY

      - name: Prove pinned .NET Framework crypto defaults and final-block semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          ev=Path('/tmp/r148/evidence')
          rs=ev/'reference_source'
          sym=(rs/'symmetricalgorithm.cs').read_text(errors='replace')
          aes=(rs/'aes.cs').read_text(errors='replace')
          rij=(rs/'rijndael.cs').read_text(errors='replace')
          rijm=(rs/'rijndaelmanaged.cs').read_text(errors='replace')
          rijt=(rs/'rijndaelmanagedtransform.cs').read_text(errors='replace')
          cs=(rs/'cryptostream.cs').read_text(errors='replace')
          cm=(rs/'crypto.cs').read_text(errors='replace')
          aescsp=(rs/'AesCryptoServiceProvider.cs').read_text(errors='replace')
          capi=(rs/'CapiSymmetricAlgorithm.cs').read_text(errors='replace')

          facts={
            'SymmetricAlgorithm_default_mode_CBC':'ModeValue = CipherMode.CBC;' in sym,
            'SymmetricAlgorithm_default_padding_PKCS7':'PaddingValue = PaddingMode.PKCS7;' in sym,
            'CipherMode_CBC_numeric_1':bool(re.search(r'\bCBC\s*=\s*1\b',cm)),
            'Aes_inherits_SymmetricAlgorithm':'class Aes : SymmetricAlgorithm' in aes,
            'Aes_default_block_bits_128':'BlockSizeValue = 128;' in aes,
            'Aes_default_mode_CBC':'ModeValue = CipherMode.CBC;' in aes,
            'AesCSP_inherits_Aes':'class AesCryptoServiceProvider : Aes' in aescsp,
            'Rijndael_inherits_SymmetricAlgorithm':'class Rijndael : SymmetricAlgorithm' in rij,
            'Rijndael_default_block_bits_128':'BlockSizeValue = 128;' in rij,
            'RijndaelManaged_inherits_Rijndael':'class RijndaelManaged : Rijndael' in rijm,
            'RijndaelManaged_CreateDecryptor_uses_BlockSizeValue':'BlockSizeValue' in rijm and 'CreateDecryptor' in rijm,
            'RijndaelManaged_CreateDecryptor_uses_PaddingValue':'PaddingValue' in rijm and 'CreateDecryptor' in rijm,
            'AesCSP_CreateDecryptor_uses_BlockSizeValue':'CreateDecryptor' in aescsp and 'BlockSizeValue' in aescsp,
            'AesCSP_CreateDecryptor_uses_PaddingValue':'CreateDecryptor' in aescsp and 'PaddingValue' in aescsp,
            'CryptoStream_constructor_gets_transform_InputBlockSize':'_InputBlockSize = _Transform.InputBlockSize;' in cs,
            'CryptoStream_Write_buffers_remainder':'_InputBufferIndex += bytesToWrite;' in cs,
            'CryptoStream_FlushFinalBlock_calls_TransformFinalBlock':bool(re.search(r'FlushFinalBlock\s*\(\).*?TransformFinalBlock\(_InputBuffer,\s*0,\s*_InputBufferIndex\)',cs,re.S)),
            'RijndaelTransform_rejects_partial_final_decrypt':bool(re.search(r'if\s*\(inputCount\s*%\s*InputBlockSize\s*!=\s*0\)',rijt)),
            'Capi_InputBlockSize_is_blockSize_div8':'return m_blockSize / 8;' in capi,
            'Capi_TransformFinalBlock_rejects_partial_decrypt':bool(re.search(r'TransformFinalBlock\s*\(.*?if\s*\(inputCount\s*%\s*InputBlockSize\s*!=\s*0\).*?Cryptography_PartialBlock',capi,re.S)),
          }

          # Derived algorithm sources contain no direct PaddingValue assignment that overrides
          # the SymmetricAlgorithm constructor default before the explicit N9 CreateDecryptor call.
          derived_padding_assignments={
            'aes.cs':len(re.findall(r'PaddingValue\s*=',aes)),
            'rijndael.cs':len(re.findall(r'PaddingValue\s*=',rij)),
            'rijndaelmanaged.cs':len(re.findall(r'PaddingValue\s*=',rijm)),
            'AesCryptoServiceProvider.cs':len(re.findall(r'PaddingValue\s*=',aescsp)),
          }
          no_derived_padding_override=all(v==0 for v in derived_padding_assignments.values())

          out={
            'reference_source_commit':'ec9fa9ae770d522a5b5f0607898044b7478574a3',
            'facts':facts,
            'derived_padding_assignment_counts':derived_padding_assignments,
            'NO_DERIVED_PADDINGVALUE_OVERRIDE_ASSIGNMENT_FOUND':no_derived_padding_override,
            'DEFAULT_REACHABLE_ALGORITHM_BLOCK_BITS':128,
            'DEFAULT_REACHABLE_TRANSFORM_INPUT_BLOCK_BYTES':16,
            'DEFAULT_PADDING_UNDER_PINNED_REFERENCE_SOURCE':'PKCS7',
            'important_interpretation':(
              'For both concrete algorithm families reachable from the recovered factory, the pinned .NET Framework '
              'source starts from a 128-bit block size and the SymmetricAlgorithm PKCS7 default. CryptoStream buffers '
              'a non-whole-block remainder and supplies that remainder to TransformFinalBlock; both recovered candidate '
              'decrypt transforms reject a non-whole final ciphertext block.'),
          }
          (ev/'R148_DOTNET_REFERENCE_SOURCE_SEMANTICS.json').write_text(json.dumps(out,indent=2)+'\n')
          if not all(facts.values()) or not no_derived_padding_override:
              raise SystemExit('pinned .NET Framework crypto semantics proof incomplete')
          PY

      - name: Resolve R147 final-block contradiction without guessing bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib

          ev=Path('/tmp/r148/evidence')
          path=json.loads((ev/'R148_N9_CONCRETE_CRYPTO_PATH_PROOF.json').read_text())
          dotnet=json.loads((ev/'R148_DOTNET_REFERENCE_SOURCE_SEMANTICS.json').read_text())
          r147=json.loads((ev/'r147/R147_DECISION.json').read_text())
          h15=(ev/'r147/r146/r145/r144/r143/r142/R142_EXTRACTED_MANAGED_RESOURCES/02_h15IL2i6yy2BZV8RqM.YuRwd1JALC4oy32W66.bin').read_bytes()

          length=len(h15)
          block_bytes=dotnet['DEFAULT_REACHABLE_TRANSFORM_INPUT_BLOCK_BYTES']
          whole=(length//block_bytes)*block_bytes
          remainder=length%block_bytes

          exact=r147.get('PROVEN_EXACT_CIPHERTEXT_SLICE') or {}
          exact_still_matches=(
            exact.get('offset')==0 and exact.get('length')==length and
            exact.get('sha256')==hashlib.sha256(h15).hexdigest()
          )
          partial_final_input=(remainder != 0)
          both_branches_reject=(
            dotnet['facts']['RijndaelTransform_rejects_partial_final_decrypt'] and
            dotnet['facts']['Capi_TransformFinalBlock_rejects_partial_decrypt']
          )
          contradiction=all([
            path['CONCRETE_PATH_402_TO40_TO281_PROVEN'],
            exact_still_matches,
            block_bytes==16,
            partial_final_input,
            both_branches_reject,
            dotnet['facts']['CryptoStream_FlushFinalBlock_calls_TransformFinalBlock'],
          ])

          out={
            'R147_EXACT_H15_INPUT_SLICE_REVERIFIED':exact_still_matches,
            'H15_SHA256':hashlib.sha256(h15).hexdigest(),
            'H15_LENGTH':length,
            'REACHABLE_DEFAULT_BLOCK_BITS':128,
