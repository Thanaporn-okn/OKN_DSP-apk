      - name: Static V62 UI and fail-closed checks
        shell: bash
        run: |
          set -euo pipefail
          cd "$SRC_DIR"
          test "$(find app/src/main/assets/i18n -name '*.json' | wc -l)" -eq 17
          grep -q 'rootProject.name = "OKN_GoloPine_Clone_V62"' settings.gradle
          grep -q 'versionCode 1062' app/build.gradle
          grep -q "versionName '62.0.0-clone'" app/build.gradle
          grep -q 'WindowInsets.Type.systemBars()' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -q 'private int legacyTopInset' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -q 'private int legacyBottomInset' app/src/main/java/com/okn/golopineclone/MainActivity.java
          ! grep -q 'getWindow().setStatusBarColor' app/src/main/java/com/okn/golopineclone/MainActivity.java
          ! grep -q 'getWindow().setNavigationBarColor' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -q 'LIVE_BOARD_USB' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -q 'HOST_TO_DEVICE_USB' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -q 'FLASH_ERASE_WRITE' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -q 'FLASH_ALLOWED' app/src/main/java/com/okn/golopineclone/MainActivity.java
          ! grep -R -n '<uses-permission' app/src/main/AndroidManifest.xml
          ! grep -R -n 'android.bluetooth\|android.hardware.usb\|UsbManager\|BluetoothGatt\|HttpURLConnection\|java.net\|SET_REPORT' app/src/main/java
          ! grep -R -n 'INTERNET\|BLUETOOTH_CONNECT\|BLUETOOTH_SCAN\|WRITE_EXTERNAL_STORAGE' app/src/main/AndroidManifest.xml
          grep -Fq '"UiHeaderVersion": "OKN V62 • ภายในเครื่อง"' app/src/main/assets/i18n/th_TH.json
          echo 'V62 clone UI/fail-closed checks PASS'

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$SRC_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Package APK and source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$SRC_DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/out/OKN_GoloPine_Clone_V62-debug.apk"
          cd "$SRC_DIR"
          zip -qr "$GITHUB_WORKSPACE/out/OKN_GoloPine_Clone_V62_Source.zip" . -x 'app/build/*' '.gradle/*'
          cd "$GITHUB_WORKSPACE/out"
          sha256sum OKN_GoloPine_Clone_V62-debug.apk OKN_GoloPine_Clone_V62_Source.zip > SHA256.txt
          cat > BUILD_SCOPE.txt <<'EOF'
          V62 continuous refinement from successful V61 artifact:
          - Gradle root project residue corrected to OKN_GoloPine_Clone_V62.
          - Android 11+ uses WindowInsets.Type.systemBars().
          - Android 8-10 retain isolated legacy inset fallback.
          - HOME / PEQ / OUTPUT / SET behavior retained.
          - Fail-closed: no Bluetooth/USB/network permission or host-to-device transport.
          EOF
          sed -i 's/^[[:space:]]*//' BUILD_SCOPE.txt

      - name: Upload V62 artifact
        uses: actions/upload-artifact@v7
        with:
          name: OKN_GOLOPINE_CLONE_V62
          path: out/*
          if-no-files-found: error
