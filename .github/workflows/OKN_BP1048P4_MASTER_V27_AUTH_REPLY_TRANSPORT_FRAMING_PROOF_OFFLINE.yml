name: OKN BP1048P4 MASTER V27 AUTH REPLY TRANSPORT FRAMING PROOF OFFLINE

"on":
  workflow_dispatch:

permissions:
  contents: read

env:
  GOLOPINE_WINDOWS_URL: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-08.exe_.zip"
  EXPECTED_VENDOR_SHA256: "3ca54171c53f7badd963ffe6851b8b3e2faf8aee8ba2afcb7040990e22ae09b2"
  V25_CHALLENGE_HEX: "D024E38C410000004202B94C65A23F2CD2828A4EEEC40C46C317060DDBB49C39"
  V26_AUTH_REPLY_HEX: "7427956A"

  LIVE_DSP_CONNECTED: "NO"
  USB_TARGET_ACCESS: "NO"
  HOST_TO_DSP_IO: "NO"
  REAL_HID_OBJECT_ALLOWED: "NO"
  FEATURE_REPORT_ALLOWED: "NO"
  FLASH_ALLOWED: "NO"
  ERASE_ALLOWED: "NO"
  WRITE_ALLOWED: "NO"

jobs:
  master-v27:
    name: Recover exact vendor transport framing for 4-byte auth reply OFFLINE
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          for n in LIVE_DSP_CONNECTED USB_TARGET_ACCESS HOST_TO_DSP_IO \
                   REAL_HID_OBJECT_ALLOWED FEATURE_REPORT_ALLOWED \
                   FLASH_ALLOWED ERASE_ALLOWED WRITE_ALLOWED
          do
            test "${!n}" = "NO"
          done

          rm -rf /tmp/v27
          mkdir -p /tmp/v27/{download,pkg,tools,evidence,decomp,out}

          cat > /tmp/v27/evidence/00_SCOPE.txt <<EOF
          REVISION=MASTER-V27
          MODE=OFFLINE_AUTH_REPLY_TRANSPORT_FRAMING_PROOF
          V25_CHALLENGE_HEX=$V25_CHALLENGE_HEX
          V26_AUTH_REPLY_HEX=$V26_AUTH_REPLY_HEX
          REAL_HID_IO=NO
          HOST_TO_DSP_IO=NO
          FEATURE_REPORT=NO
          FLASH_ALLOWED=NO
          ERASE_ALLOWED=NO
          WRITE_ALLOWED=NO
          EOF

      - name: Acquire exact official vendor binary
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 6 --retry-all-errors --retry-delay 2 \
            --connect-timeout 20 --max-time 300 \
            "$GOLOPINE_WINDOWS_URL" -o /tmp/v27/download/vendor.zip

          unzip -q /tmp/v27/download/vendor.zip -d /tmp/v27/pkg

          EXE="$(find /tmp/v27/pkg -type f -iname '*.exe' \
            ! -path '*/__MACOSX/*' ! -name '._*' \
            -printf '%s %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"

          test -n "$EXE"
          cp "$EXE" /tmp/v27/vendor.exe

          ACTUAL="$(sha256sum /tmp/v27/vendor.exe | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED_VENDOR_SHA256"

          {
            echo "SHA256=$ACTUAL"
            echo "ORIGINAL_BINARY_MODIFIED=NO"
          } > /tmp/v27/evidence/01_VENDOR_IDENTITY.txt

      - name: Install ILSpy and list transport types
        shell: bash
        run: |
          set -euo pipefail

          dotnet tool install ilspycmd --tool-path /tmp/v27/tools
          TOOL=/tmp/v27/tools/ilspycmd

          "$TOOL" --version | tee /tmp/v27/evidence/02_ILSPY_VERSION.txt
          "$TOOL" -l c /tmp/v27/vendor.exe \
            > /tmp/v27/evidence/03_CLASS_LIST.txt 2>&1 || true

          python3 - <<'PY'
          from pathlib import Path
          import re,json

          ev=Path('/tmp/v27/evidence')
          t=(ev/'03_CLASS_LIST.txt').read_text(errors='ignore')

          names=[]
          for line in t.splitlines():
              m=re.search(r'^(?:Class|Struct|Interface|Enum)\s+(.+)$',line.strip())
              if m:
                  n=m.group(1).strip()
                  if n and n not in names:
                      names.append(n)

          keys=('usbhid','hidinterface','devicecommunicationstream','hid.')
          selected=[n for n in names if any(k in n.lower() for k in keys)]

          # Keep likely exact names even if class-list formatting changes.
          for n in [
            'DSTech_AudioDSP_Client.DeviceCommunicationStream',
            'DSTech_AudioDSP_Client.USBHID',
            'DSTech_AudioDSP_Client.HIDInterface'
          ]:
              if n not in selected:
                  selected.insert(0,n)

          out=[]
          for n in selected:
              if n not in out:
                  out.append(n)

          (ev/'04_SELECTED_TRANSPORT_TYPES.txt').write_text('\n'.join(out[:80])+'\n')
          (ev/'04_SELECTED_TRANSPORT_TYPES.json').write_text(json.dumps(out[:80],indent=2)+'\n')
          print('selected',len(out[:80]))
          PY

      - name: Decompile transport types to C sharp and IL
        shell: bash
        run: |
          set -euo pipefail
          TOOL=/tmp/v27/tools/ilspycmd

          while IFS= read -r TYPE; do
            [ -n "$TYPE" ] || continue
            SAFE="$(printf '%s' "$TYPE" | tr -c 'A-Za-z0-9._+-' '_')"

            "$TOOL" -t "$TYPE" /tmp/v27/vendor.exe \
              > "/tmp/v27/decomp/${SAFE}.cs.txt" 2>&1 || true

            if ! "$TOOL" -il -t "$TYPE" /tmp/v27/vendor.exe \
              > "/tmp/v27/decomp/${SAFE}.il.txt" 2>&1; then
              "$TOOL" --ilcode -t "$TYPE" /tmp/v27/vendor.exe \
                > "/tmp/v27/decomp/${SAFE}.il.txt" 2>&1 || true
            fi
          done < /tmp/v27/evidence/04_SELECTED_TRANSPORT_TYPES.txt

          find /tmp/v27/decomp -type f -maxdepth 1 -printf '%f\n' | sort \
            > /tmp/v27/evidence/05_DECOMPILED_FILES.txt

      - name: Extract exact Write Send framing contexts
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/v27/analyze.py <<'PY'
          from pathlib import Path
          import re,json

          root=Path('/tmp/v27')
          ev=root/'evidence'
          dc=root/'decomp'

          blobs={}
          for p in dc.glob('*.txt'):
              blobs[p.name]=p.read_text(errors='ignore')

          all_text='\n'.join(blobs.values())
          lines=all_text.splitlines()

          terms=[
              'Write(byte[]',
              'Write(Byte[]',
              'Send(byte[]',
              'Send(Byte[]',
              'Array.Copy',
              'Buffer.BlockCopy',
              'input.Length + 1',
              'input.Length+1',
              'Length + 1',
              'Length+1',
              'reportID',
              'ReportId',
              'Hid.Write',
              'DeviceCommunicationStream'
          ]

          chunks=[]
          counts={}
          for term in terms:
              hits=[i for i,x in enumerate(lines) if term.lower() in x.lower()]
              counts[term]=len(hits)
              for i in hits[:18]:
                  a=max(0,i-35); b=min(len(lines),i+85)
                  chunks.append(
                      f'===== TERM={term} HIT={i+1} RANGE={a+1}-{b} =====\n'+
                      '\n'.join(f'{j+1:06d}: {lines[j]}' for j in range(a,b))
                  )

          (ev/'06_TRANSPORT_FRAMING_CONTEXTS.txt').write_text('\n\n'.join(chunks))

          # Capture IL constants and array operations near methods called Write/Send.
          il_chunks=[]
          for fn,txt in blobs.items():
              if not fn.endswith('.il.txt'):
                  continue
              ll=txt.splitlines()
              for i,x in enumerate(ll):
                  if re.search(r'\b(Write|Send)\s*\(',x,re.I):
                      a=max(0,i-50); b=min(len(ll),i+220)
                      il_chunks.append(
                          f'===== FILE={fn} METHOD_HIT={i+1} =====\n'+
                          '\n'.join(f'{j+1:06d}: {ll[j]}' for j in range(a,b))
                      )
          (ev/'07_WRITE_SEND_IL_CONTEXTS.txt').write_text('\n\n'.join(il_chunks))

          # Search for the known V17 framing facts in transport code:
          # raw 16 -> USBHID prefix 0x10 -> lower layer 0x11.
          evidence={
              'revision':'MASTER-V27',
              'classification':'OFFLINE_AUTH_REPLY_TRANSPORT_FRAMING_PROOF_NOT_FOR_FLASH',
              'v25_challenge_hex':'D024E38C410000004202B94C65A23F2CD2828A4EEEC40C46C317060DDBB49C39',
              'v26_auth_reply_hex':'7427956A',
              'term_counts':counts,
              'transport_decompiled_file_count':len(blobs),
              'real_hid_invoked':False,
              'host_to_dsp_io':False,
              'feature_report_invoked':False,
              'flash_allowed':False
          }

          # Conservative candidate only: a 4-byte bridge write commonly becomes
          # [outer length=5][inner length=4][4 payload bytes].  We do not mark it
          # proven unless transport source contains both nested +1 length operations.
          low=all_text.lower()
          length_plus_one_hits=(
              low.count('length + 1')+
              low.count('length+1')
          )
          copy_hits=low.count('array.copy')+low.count('buffer.blockcopy')

          evidence['length_plus_one_hits']=length_plus_one_hits
          evidence['array_copy_hits']=copy_hits
          evidence['candidate_android_wire_prefix_hex']='05047427956A'
          evidence['candidate_only']=True
          evidence['exact_wire_framing_proven']=False

          if length_plus_one_hits>=2 and copy_hits>=2:
              evidence['status']='NESTED_LENGTH_FRAMING_STATIC_EVIDENCE_PRESENT_REVIEW_CONTEXTS'
          else:
              evidence['status']='TRANSPORT_CONTEXTS_RECOVERED_MANUAL_REVIEW_REQUIRED'

          (ev/'08_V27_DECISION.json').write_text(json.dumps(evidence,indent=2)+'\n')

          md=f"""# MASTER V27 FINAL DECISION

          - V25 real dynamic challenge: **{evidence['v25_challenge_hex']}**
          - V26 vendor-oracle reply: **{evidence['v26_auth_reply_hex']}**
          - Transport decompiled files: **{len(blobs)}**
          - `Length + 1` style hits: **{length_plus_one_hits}**
          - Array-copy style hits: **{copy_hits}**
          - Candidate Android wire bytes for a 4-byte bridge write: **05 04 74 27 95 6A**
          - Candidate is proven for live use: **NO**
          - Real HID invoked: **NO**
          - Host-to-DSP I/O: **NO**
          - Feature report invoked: **NO**
          - Flash/erase/write: **NO / NO / NO**

          Status: **{evidence['status']}**

          Review `06_TRANSPORT_FRAMING_CONTEXTS.txt` and `07_WRITE_SEND_IL_CONTEXTS.txt`
          before constructing any same-session Android auth-reply test.

          Classification:
          **OFFLINE_AUTH_REPLY_TRANSPORT_FRAMING_PROOF_NOT_FOR_FLASH**
          """
          (ev/'09_V27_FINAL_DECISION.md').write_text(md)
          print(md)
          PY

          python /tmp/v27/analyze.py
          cat /tmp/v27/evidence/09_V27_FINAL_DECISION.md >> "$GITHUB_STEP_SUMMARY"

      - name: Package V27 evidence
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/v27/evidence/* /tmp/v27/out/

          test ! -e /tmp/v27/out/vendor.exe

          (
            cd /tmp/v27/out
            sha256sum * > SHA256SUMS.txt
          )

      - name: Upload V27 evidence
        uses: actions/upload-artifact@v7
        with:
          name: OKN-BP1048P4-MASTER-V27-AUTH-REPLY-TRANSPORT-FRAMING-EVIDENCE
          path: /tmp/v27/out/*
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed assertion
        shell: bash
        run: |
          set -euo pipefail

          for n in LIVE_DSP_CONNECTED USB_TARGET_ACCESS HOST_TO_DSP_IO \
                   REAL_HID_OBJECT_ALLOWED FEATURE_REPORT_ALLOWED \
                   FLASH_ALLOWED ERASE_ALLOWED WRITE_ALLOWED
          do
            test "${!n}" = "NO"
          done

          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/v27/evidence/08_V27_DECISION.json'))
          assert d['real_hid_invoked'] is False
          assert d['host_to_dsp_io'] is False
          assert d['feature_report_invoked'] is False
          assert d['flash_allowed'] is False
          assert d['exact_wire_framing_proven'] is False
          print('MASTER_V27=PASS')
          print('REAL_HID_IO=NO')
          print('HOST_TO_DSP_IO=NO')
          print('FLASH_ALLOWED=NO')
          PY
