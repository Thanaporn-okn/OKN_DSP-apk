name: OKNPV6.1 - Build OKN Peramp V6.1 Descriptor-Precision Round-Trip Verifier

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/OKNPV6.1.yml'

permissions:
  contents: read

concurrency:
  group: oknpv61-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build OKN Peramp 6.1.0
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 35 non-interactively
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Generate OKN Peramp V6.1 project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app Sources build.gradle settings.gradle gradle.properties payload.tar.gz payload.tar.gz.b64
