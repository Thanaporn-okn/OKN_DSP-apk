        run: |
          set -euo pipefail
          echo "e40bac569ec09021a9eb5d7751784d2d74383aaa3ff6e3ab7fec7cbabc34dc10  app/src/main/java/com/okn/peramp/DspProtocol.java" | sha256sum -c -
          echo "741f121ea30ae9c2250d6845c3b81fc6a6f0b6d8c3da1f12036ca848a53f92d1  app/src/main/java/com/okn/peramp/BleManager.java" | sha256sum -c -

      - name: Validate PEQ safety reset and V6.1 no-unknown-TX gate
        shell: bash
        run: |
          set -euo pipefail
          python3 Sources/validate_v38_gate.py
          python3 Sources/validate_v39_reset_v61.py
          python3 Sources/validate_oknpv61.py

      - name: Build Debug and Release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk OKNPV61-debug.apk
          cp app/build/outputs/apk/release/app-release.apk OKNPV61-release.apk

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging OKNPV61-debug.apk | tee OKNPV61-apk-badging.txt
          grep -q "package: name='com.okn.peramp' versionCode='6100' versionName='6.1.0'" OKNPV61-apk-badging.txt
          grep -q "application-label:'OKN Peramp'" OKNPV61-apk-badging.txt

      - name: Package generated source evidence and checksums
        shell: bash
        run: |
          set -euo pipefail
          zip -qr OKNPV61-source.zip app Sources build.gradle settings.gradle gradle.properties -x '*/build/*' -x '.gradle/*'
          cp Sources/OKNPV61_REVERSE_CHECKPOINT.txt OKNPV61-REVERSE-CHECKPOINT.txt
          cp Sources/OKNPV61_BUILD_NOTES.txt OKNPV61-BUILD-NOTES.txt
          sha256sum OKNPV61-debug.apk OKNPV61-release.apk OKNPV61-source.zip OKNPV61-REVERSE-CHECKPOINT.txt OKNPV61-BUILD-NOTES.txt > OKNPV61-SHA256SUMS.txt
          cat OKNPV61-SHA256SUMS.txt

      - name: Upload OKNPV6.1 artifact
        uses: actions/upload-artifact@v7
        with:
          name: OKNPV61
          path: |
            OKNPV61-debug.apk
            OKNPV61-release.apk
            OKNPV61-source.zip
            OKNPV61-SHA256SUMS.txt
            OKNPV61-apk-badging.txt
            OKNPV61-REVERSE-CHECKPOINT.txt
            OKNPV61-BUILD-NOTES.txt
          if-no-files-found: error
          retention-days: 30
