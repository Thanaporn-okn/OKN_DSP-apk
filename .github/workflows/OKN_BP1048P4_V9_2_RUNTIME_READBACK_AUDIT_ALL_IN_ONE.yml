      - name: Prove FlashBoot flash-read data never reaches host Input report
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          python3 - <<'PY2'
          from pathlib import Path
          import json,re

          E=Path('/tmp/v92/evidence')
          raw=(E/'R2_CODE_DISASSEMBLY.txt').read_text(errors='replace')
          clean=re.sub(r'\x1b\[[0-9;]*m','',raw)
          (E/'R2_CODE_DISASSEMBLY_CLEAN.txt').write_text(clean)
          lines=clean.splitlines()

          ins={}
          for line in lines:
              m=re.search(r'0x([0-9A-Fa-f]{8})\s+[0-9A-Fa-f]+\s+(.+)$',line)
              if m:
                  ins[int(m.group(1),16)]=m.group(2).strip()

          def need(addr,*parts):
              t=ins.get(addr,'')
              if not t:
                  raise RuntimeError(f'missing instruction 0x{addr:08X}')
              low=t.lower()
              for x in parts:
                  if str(x).lower() not in low:
                      raise RuntimeError(f'0x{addr:08X}: expected {parts}, got {t}')
              return t

          # NDS32 radare2 prints wrapped negative PC-relative JAL targets with 0x100000000 added.
          def jal_sites(target):
              want={f'0x{target:08x}',f'0x{target+0x100000000:x}'}
              out=[]
              for a,t in ins.items():
                  lo=t.lower()
                  if not lo.startswith('jal '): continue
                  if any(w in lo for w in want): out.append(a)
              return sorted(out)

          flash_read=jal_sites(0x00000E0E)
          host_reply=jal_sites(0x00004AD0)
          receive_4k=jal_sites(0x00004B2E)
          flash_write=jal_sites(0x00000FD0)
          flash_erase=jal_sites(0x00004100)

          if len(flash_read)!=24:
              raise RuntimeError(f'expected 24 SpiFlashRead call sites, got {len(flash_read)}: {flash_read}')
          if len(host_reply)!=14:
              raise RuntimeError(f'expected 14 GET_REPORT reply-helper calls, got {len(host_reply)}: {host_reply}')
          if any(not (0x4B64 <= a <= 0x56A6) for a in host_reply):
              raise RuntimeError('host reply helper has caller outside PC dispatcher: '+repr(host_reply))

          dispatcher_flash_reads=[a for a in flash_read if 0x4B64 <= a <= 0x56A6]
          expected_dispatcher_reads=[0x515E,0x52A6,0x5544,0x5606]
          if dispatcher_flash_reads != expected_dispatcher_reads:
              raise RuntimeError(f'dispatcher flash-read sites changed: {dispatcher_flash_reads}')

          # Boot-data verify: read flash to GP+6276, compare against report/data buffer GP+2180,
          # then return only ACK/status from GP+2180.
          need(0x5156,'addi.gp','a1','6276')
          need(0x515A,'movi','a2','4096')
          need(0x515E,'jal','0x100000e0e')
          need(0x5162,'addi.gp','a0','2180')
          need(0x5166,'addi.gp','a1','6276')
          need(0x516A,'movi','a2','4096')
          need(0x516E,'jal','0x0000abfc')
          need(0x5174,'addi.gp','a0','2180')
          need(0x517E,'jal','0x100004ad0')
          need(0x5192,'addi.gp','a0','2180')
          need(0x519E,'jal','0x100004ad0')

          # Code-data verify follows the same pattern.
          need(0x529E,'addi.gp','a1','6276')
          need(0x52A2,'movi','a2','4096')
          need(0x52A6,'jal','0x100000e0e')
          need(0x52AA,'addi.gp','a0','2180')
          need(0x52AE,'addi.gp','a1','6276')
          need(0x52B2,'movi','a2','4096')
          need(0x52B6,'jal','0x0000abfc')
          need(0x52DE,'addi.gp','a0','2180')
          need(0x52E2,'jal','0x100004ad0')

          # btupdat is an internal read-modify-write: flash -> GP+6276, erase, modify, write,
          # read back into GP+6276, compare 92 bytes, then send only GP+2180 ACK/status.
          need(0x553A,'addi.gp','a1','6276')
          need(0x553E,'movi','a2','4096')
          need(0x5544,'jal','0x100000e0e')
          need(0x5572,'jal','0x100004100')
          need(0x5576,'addi.gp','s2','6276')
          need(0x55C8,'jal','0x100000fd0')
          need(0x55FE,'mov55','a1','s2')
          need(0x5600,'movi','a2','4096')
          need(0x5606,'jal','0x100000e0e')
          need(0x560A,'mov55','a0','s3')
          need(0x560C,'mov55','a1','s2')
          need(0x560E,'movi','a2','92')
          need(0x5612,'jal','0x0000abfc')
          need(0x5618,'addi.gp','s0','2180')
          need(0x562C,'mov55','a0','s0')
          need(0x562E,'jal','0x100004ad0')
          need(0x5634,'addi.gp','a0','2180')
          need(0x563E,'jal','0x100004ad0')

          # Enumerate every host reply call with its local feeder instructions for review.
          contexts=[]
          keys=sorted(ins)
          index={a:i for i,a in enumerate(keys)}
          for call in host_reply:
              i=index[call]
              before=keys[max(0,i-10):i+1]
              contexts.append({
                  'call_site':f'0x{call:08X}',
                  'instructions':[{'address':f'0x{a:08X}','text':ins[a]} for a in before]
              })

          # All 14 reply sites are known status/ACK paths. None uses the GP+6276 flash buffer.
          reply_labels={
              0x4F0A:'cxxx status/result', 0x503C:'chiperas progress',
              0x50E0:'bootdat write failure',0x5100:'bootdat write ACK',
              0x517E:'bootdat verify failure',0x519E:'bootdat verify ACK',
              0x5248:'codedata write ACK/status',0x52E2:'codedata verify ACK/status',
              0x5380:'constdat write ACK/status',0x53E6:'constdat final ACK/status',
              0x5484:'cnfgdat write ACK/status',0x54EA:'cnfgdat final ACK/status',
              0x562E:'btupdat verify ACK',0x563E:'btupdat verify failure'
          }
          if set(reply_labels)!=set(host_reply):
              raise RuntimeError('reply-site classification is incomplete')

          result={
              'flash_read_helper':'0x00000E0E',
              'flash_read_call_sites_total':len(flash_read),
              'flash_read_call_sites':[f'0x{x:08X}' for x in flash_read],
              'host_get_report_reply_helper':'0x00004AD0',
              'host_reply_call_sites_total':len(host_reply),
              'host_reply_call_sites':[{'site':f'0x{x:08X}','meaning':reply_labels[x]} for x in host_reply],
              'host_reply_call_sites_outside_pc_dispatcher':0,
              'dispatcher_flash_read_call_sites':[f'0x{x:08X}' for x in dispatcher_flash_reads],
              'flash_data_buffer_gp_offset':6276,
              'host_reply_buffer_gp_offset':2180,
              'receive_4k_call_sites':[f'0x{x:08X}' for x in receive_4k],
              'flash_write_call_sites_total':len(flash_write),
              'flash_erase_call_sites_total':len(flash_erase),
              'generic_flash_data_to_host_get_report_path_found':False,
              'flashboot_generic_readback_proven_absent_in_pc_dispatcher':True,
              'FLASH_ALLOWED':False
          }
          (E/'V9_2_READBACK_DATAFLOW_AUDIT.json').write_text(json.dumps(result,indent=2)+'\n')
          (E/'V9_2_HOST_REPLY_CONTEXTS.json').write_text(json.dumps(contexts,indent=2)+'\n')

          md=[
              '# V9.2 FlashBoot flash-read -> host-return dataflow audit','',
              f"- SpiFlashRead helper callers in entire 64K FlashBoot: **{len(flash_read)}**",
              f"- SpiFlashRead callers inside PC command dispatcher: **{len(dispatcher_flash_reads)}** — " + ', '.join(f'`0x{x:08X}`' for x in dispatcher_flash_reads),
              f"- GET_REPORT reply-helper callers: **{len(host_reply)}**, all inside PC dispatcher",
              '- Flash-read/verify buffer: **GP+6276**',
              '- Host Input-report ACK/status buffer: **GP+2180**',
              '- `bootdat` and `codedata` read Flash only to compare it with received data, then return ACK/status.',
              '- `btupdat` reads Flash for read-modify-write and verification, then returns ACK/status only.',
              '- No caller passes the GP+6276 flash buffer to the GET_REPORT reply helper.',
              '- Therefore the proven FlashBoot PC dispatcher has **no generic firmware/flash readback path**.',
              '- `FLASH_ALLOWED=NO`; no hardware command is executed.'
          ]
          (E/'V9_2_READBACK_DATAFLOW_AUDIT.md').write_text('\n'.join(md)+'\n')
          PY2

          cat /tmp/v92/evidence/V9_2_READBACK_DATAFLOW_AUDIT.md >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"

      - name: Search SDK and bundled tools for alternate non-FlashBoot read paths
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          OUT=/tmp/v92/evidence/SDK_ALTERNATE_READ_PATH_SEARCH.txt
          : > "$OUT"
          {
            echo '=== source-level read/memory/debug candidates ==='
            grep -RInaE --exclude-dir=.git --include='*.c' --include='*.h' --include='*.cpp' --include='*.cs' --include='*.py' \
              '(SpiFlashRead|FlashRead|read[ _-]*flash|flash[ _-]*read|readback|dump[ _-]*(flash|rom|memory)|memory[ _-]*read|mem[ _-]*read|peek|upload[ _-]*(flash|rom|memory)|GetInputReport|GET_REPORT)' \
              /tmp/v92/sdk-src || true
            echo
            echo '=== printable candidates in bundled binaries/libraries/tools ==='
            find /tmp/v92/sdk-src -type f \
              \( -iname '*.a' -o -iname '*.lib' -o -iname '*.bin' -o -iname '*.exe' -o -iname '*.dll' -o -iname '*.elf' \) -print0 \
              | while IFS= read -r -d '' f; do
                  hits="$(strings -a "$f" 2>/dev/null | grep -iE '(flash.?read|read.?flash|readback|dump.?flash|dump.?rom|memory.?read|mem.?read|peek|upload.?flash|upload.?rom|GetInputReport)' | head -80 || true)"
                  if [ -n "$hits" ]; then
                    echo "===== $f ====="
                    printf '%s\n' "$hits"
                  fi
                done
          } >> "$OUT"

      - name: Search SDK for host-facing flash readback candidates
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          {
            echo '=== SpiFlashReadWpr references ==='
            grep -RIn --exclude-dir=.git 'SpiFlashReadWpr' /tmp/v92/sdk-src || true
            echo
            echo '=== likely host/readback terms ==='
            grep -RInE --exclude-dir=.git '(readback|flash[ _-]*read|read[ _-]*flash|dump[ _-]*flash|upload[ _-]*flash)' /tmp/v92/sdk-src || true
            echo
            echo '=== proven FlashBoot command names ==='
            grep -RInE --exclude-dir=.git '(chiperas|upinfo|btupdat|cnfgdat|constdat|codedata|bootdat|cxxx)' /tmp/v92/sdk-src/BT_Audio_APP/bt_audio_app_src || true
          } > /tmp/v92/evidence/SDK_FLASH_READBACK_SEARCH.txt


      - name: Prove stock runtime protocol has no generic flash readback path
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          python3 - <<'PY2'
          from pathlib import Path
          import json, re

          ROOT=Path('/tmp/v92/sdk-src')
          E=Path('/tmp/v92/evidence')
          p=ROOT/'BT_Audio_APP/bt_audio_app_src/audio/communication.c'
          c=p.read_text(errors='replace')

          def extract_function(text, name):
              # Find a C function by exact name and balance braces. This is enough for the
              # pinned SDK source and avoids depending on external parsers.
              m=re.search(r'\b'+re.escape(name)+r'\s*\([^;{}]*\)\s*\{', text, re.S)
              if not m:
                  raise RuntimeError('function not found: '+name)
              start=m.start(); brace=text.find('{',m.start())
              depth=0
              i=brace
              in_s=in_d=False; esc=False
              while i < len(text):
                  ch=text[i]
                  if in_s:
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch=="'": in_s=False
                  elif in_d:
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch=='"': in_d=False
                  else:
                      if ch=="'": in_s=True
                      elif ch=='"': in_d=True
                      elif ch=='{': depth+=1
                      elif ch=='}':
                          depth-=1
                          if depth==0:
                              return text[start:i+1]
                  i+=1
              raise RuntimeError('unbalanced function: '+name)

          cfg=extract_function(c,'Communication_Effect_Config')
          proc=extract_function(c,'Communication_Effect_Process')
          u11=extract_function(c,'Communication_Effect_0x11')
          uw=extract_function(c,'MV_UserWriteData')
          ufc=extract_function(c,'Communication_Effect_0xfc')
          uart=extract_function(c,'UART1_Communication_Receive_Process')
          hid=extract_function(c,'HIDUsb_Rx')

          # Exact runtime frame parser.
          for needle in ['communic_buf[i] == 0xA5','communic_buf[i+1] == 0x5A',
                         'packet_len = communic_buf[i+3]',
                         'communic_buf[i+4+packet_len] == 0x16',
                         'Communication_Effect_Config(communic_buf[i+2], &communic_buf[i+4], communic_buf[i+3])']:
              if needle not in proc:
                  raise RuntimeError('runtime frame assertion missing: '+needle)

          # Fixed top-level controls exposed by this stock runtime parser.
          cases=[]
          for x in re.findall(r'\bcase\s+(0x[0-9A-Fa-f]+|[0-9]+)\s*:',cfg):
              cases.append(int(x,0))
          expected=[0x00,0x01,0x02,0x03,0x04,0x06,0x07,0x08,0x09,0x0A,0x0B,0x0C,0x0D,0x11,0x80,0xFC,0xFF]
          if cases != expected:
              raise RuntimeError(f'unexpected runtime fixed-control set/order: {cases!r}')
          if not (re.search(r'Control\s*>=\s*0x81',cfg) and re.search(r'Control\s*<\s*0xfe',cfg,re.I)):
              raise RuntimeError('dynamic effect-control range 0x81..0xFD not proven')

          # 0x11 is a custom WRITE command. Address is three incoming bytes, length is
          # one byte, up to 32 bytes are copied, and only OK/NG status is returned.
          need_u11=[
              'buf[0]==0x01',
              '(uint32_t) buf[1]<<16',
              '(uint32_t) buf[2]<<8',
              '(uint32_t) buf[3]',
              'user_rLen  = buf[4]',
              'user_rx_data[sLen]= buf[sLen+5]',
              'ret = MV_UserWriteData()',
              'tx_buf[sLen++]  = 0x4f',
              'tx_buf[sLen++]  = 0x4b',
              'tx_buf[sLen++]  = 0x4e',
              'tx_buf[sLen++]  = 0x47',
          ]
          for needle in need_u11:
              if needle not in u11:
                  raise RuntimeError('0x11 write semantics assertion missing: '+needle)
          if 'pUserData' in u11 or 'SpiFlashRead(' in u11:
              raise RuntimeError('unexpected direct flash-buffer exposure in Communication_Effect_0x11')

          # All runtime flash reads in communication.c are confined to the destructive
          # read-modify-write helper. They never copy pUserData into tx_buf or call the
          # host-send helper.
          if c.count('SpiFlashRead(') != 2:
              raise RuntimeError(f'communication.c SpiFlashRead count changed: {c.count("SpiFlashRead(")}')
          if uw.count('SpiFlashRead(') != 2:
              raise RuntimeError('both communication.c flash reads are not confined to MV_UserWriteData')
          for needle in ['SpiFlashRead(user_offset,  pUserData, 4096, 1)',
                         'SpiFlashErase(SECTOR_ERASE, user_offset/4096, 1)',
                         'SpiFlashWrite(user_offset, pUserData, 4096, 1)',
                         'SpiFlashRead(user_offset,  pUserData, 128, 1)',
                         'memcmp(pUserData,user_rx_data,user_rLen)']:
              if needle not in uw:
                  raise RuntimeError('MV_UserWriteData assertion missing: '+needle)
          if 'Communication_Effect_Send' in uw or 'tx_buf' in uw:
              raise RuntimeError('MV_UserWriteData unexpectedly has a host-return path')

          # The user-defined 0xFC hook is a fixed demo reply, not a memory primitive.
          if 'SpiFlashRead' in ufc or 'memcpy' in ufc:
              raise RuntimeError('0xFC semantics changed; re-audit required')
          for v in ['tx_buf[5]  = 1','tx_buf[6]  = 2','tx_buf[7]  = 3','tx_buf[8]  = 4']:
              if v not in ufc:
                  raise RuntimeError('0xFC fixed payload assertion missing: '+v)

          # UART runtime input feeds the exact same parser. USB routes through
          # UsbLoadAudioMode; collect its definition/references for evidence.
          if 'Communication_Effect_Process(communic_buf_w + len)' not in uart:
              raise RuntimeError('UART runtime route no longer feeds Communication_Effect_Process')
          if 'UsbLoadAudioMode(len,buf)' not in hid.replace(' ','') and 'UsbLoadAudioMode(len, buf)' not in hid:
              # whitespace-tolerant fallback
              if not re.search(r'UsbLoadAudioMode\s*\(\s*len\s*,\s*buf\s*\)',hid):
                  raise RuntimeError('HIDUsb_Rx -> UsbLoadAudioMode route not found')

          usb_refs=[]
          for fp in ROOT.rglob('*'):
              if fp.suffix.lower() not in {'.c','.h','.cpp'}: continue
              try: txt=fp.read_text(errors='replace')
              except Exception: continue
              if 'UsbLoadAudioMode' in txt:
                  for no,line in enumerate(txt.splitlines(),1):
                      if 'UsbLoadAudioMode' in line or ('Communication_Effect_Process' in line and 'communication.c' not in str(fp)):
                          usb_refs.append({'file':str(fp.relative_to(ROOT)),'line':no,'text':line.strip()})
          (E/'V9_2_USB_RUNTIME_ROUTE_SEARCH.json').write_text(json.dumps(usb_refs,indent=2)+'\n')

          # Function-level audit: no function in communication.c both reads flash and
          # transmits a response. This rules out a hidden direct runtime flash-return path
          # in the examined stock SDK source.
          defs=[]
          for m in re.finditer(r'(?m)^[A-Za-z_][\w\s\*]*?\b([A-Za-z_]\w*)\s*\([^;{}]*\)\s*\{',c):
              name=m.group(1)
              try: body=extract_function(c,name)
              except Exception: continue
              if 'SpiFlashRead(' in body or 'Communication_Effect_Send' in body:
                  defs.append({
                      'name':name,
                      'spi_flash_read_calls':body.count('SpiFlashRead('),
                      'host_send_calls':body.count('Communication_Effect_Send'),
                      'mentions_tx_buf':'tx_buf' in body,
                      'mentions_pUserData':'pUserData' in body,
                  })
          both=[x for x in defs if x['spi_flash_read_calls'] and x['host_send_calls']]
          if both:
              raise RuntimeError('function contains both SpiFlashRead and host send: '+repr(both))

          result={
              'sdk_commit':(E/'SDK_COMMIT.txt').read_text().strip(),
              'runtime_frame':'A5 5A CONTROL LEN PAYLOAD 16',
              'fixed_controls':[f'0x{x:02X}' for x in cases],
              'dynamic_effect_control_range':'0x81..0xFD',
              'control_0x11_role':'custom flash write/read-modify-write verification',
              'control_0x11_flash_address_encoding':'24-bit big-endian from payload bytes 1..3',
              'control_0x11_data_length_byte':'payload[4]',
              'control_0x11_max_copied_data_bytes':32,
              'control_0x11_host_response':'OK/NG status only; no flash bytes',
              'communication_c_spi_flash_read_calls_total':c.count('SpiFlashRead('),
              'communication_c_spi_flash_reads_confined_to_MV_UserWriteData':True,
              'runtime_function_with_both_flash_read_and_host_send_found':False,
              'control_0xFC_role':'fixed demo/user tag reply 01 02 03 04',
              'runtime_generic_flash_readback_found':False,
              'runtime_full_firmware_dump_path_found':False,
              'runtime_control_0x11_write_execution_enabled':False,
              'FLASH_ALLOWED':False,
              'function_audit':defs,
          }
          (E/'V9_2_RUNTIME_READBACK_AUDIT.json').write_text(json.dumps(result,indent=2)+'\n')

          # Merge into top-level status generated by the earlier V9.2 report step.
          sp=E/'V9_2_STATUS.json'
          status=json.loads(sp.read_text()) if sp.exists() else {}
          status.update({
              'runtime_protocol_audited':True,
              'runtime_control_0x11_write_only_proven':True,
              'runtime_generic_flash_readback_proven':False,
              'runtime_full_firmware_dump_path_found':False,
              'runtime_write_enabled':False,
              'examined_stock_flashboot_and_runtime_usb_paths_no_generic_readback':True,
          })
          sp.write_text(json.dumps(status,indent=2)+'\n')

          md=[
              '# V9.2 stock runtime protocol readback audit','',
              '- Runtime parser is exactly `A5 5A CONTROL LEN PAYLOAD 16`.',
              '- Fixed controls: '+', '.join(f'`0x{x:02X}`' for x in cases)+'.',
              '- Dynamic effect controls are `0x81..0xFD`.',
              '- `0x11` is a **destructive custom flash-write** path: 24-bit address + length + up to 32 data bytes.',
              '- `MV_UserWriteData` reads a 4K sector, erases it, rewrites it, then reads 128 B only for verification.',
              '- The flash buffer is never copied to `tx_buf` and `MV_UserWriteData` never calls `Communication_Effect_Send`.',
              '- The `0x11` response contains only `OK`/`NG`; its alternate branch returns version information.',
              '- `0xFC` returns the fixed bytes `01 02 03 04`; it is not a memory-read primitive.',
              '- No function in `communication.c` both calls `SpiFlashRead` and sends a host response.',
              '- Therefore the examined stock runtime protocol also has **no generic flash/firmware readback path**.',
              '- Combined with the V9.1 FlashBoot audit, both exposed stock USB protocol families lack a proven generic firmware dump command.',
              '- `FLASH_ALLOWED=NO`; the 0x11 write path remains disabled.'
          ]
          (E/'V9_2_RUNTIME_READBACK_AUDIT.md').write_text('\n'.join(md)+'\n')
          PY2

          cat /tmp/v92/evidence/V9_2_RUNTIME_READBACK_AUDIT.md >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"

