name: OKN BP1048P4 MASTER V47 OFFICIAL GOLOPINE WINDOWS NATIVE USB ENTRY XREF OFFLINE

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/OKN_BP1048P4_MASTER_V47_OFFICIAL_GOLOPINE_WINDOWS_NATIVE_USB_ENTRY_XREF_OFFLINE.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  V46_ARTIFACT_ID: "11302047314"
  V28_ARTIFACT_ID: "11296454861"
  V23_ARTIFACT_ID: "11295516550"

  OFFICIAL_WINDOWS_ZIP_URL: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-08.exe_.zip"
  EXPECTED_WINDOWS_EXE_SHA256: "3ca54171c53f7badd963ffe6851b8b3e2faf8aee8ba2afcb7040990e22ae09b2"

  LIVE_DSP_ALLOWED: "NO"
  HOST_TO_DSP_IO: "NO"
  FEATURE_REPORT_ALLOWED: "NO"
  NEW_LIVE_0X11_ALLOWED: "NO"
  STARTUP_COMMAND_ALLOWED: "NO"
  AUTH_REPLY_ALLOWED: "NO"
  FLASH_ALLOWED: "NO"
  ERASE_ALLOWED: "NO"
  WRITE_ALLOWED: "NO"

jobs:
  v47:
    name: Mine official GoloPine Windows client for alternate USB updater entry OFFLINE
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Gate 0 - hard fail-closed safety
        shell: bash
        run: |
          set -euo pipefail
          test "$LIVE_DSP_ALLOWED" = "NO"
          test "$HOST_TO_DSP_IO" = "NO"
          test "$FEATURE_REPORT_ALLOWED" = "NO"
          test "$NEW_LIVE_0X11_ALLOWED" = "NO"
          test "$STARTUP_COMMAND_ALLOWED" = "NO"
          test "$AUTH_REPLY_ALLOWED" = "NO"
          test "$FLASH_ALLOWED" = "NO"
          test "$ERASE_ALLOWED" = "NO"
          test "$WRITE_ALLOWED" = "NO"

          rm -rf /tmp/v47
          mkdir -p /tmp/v47/{downloads,v46,v28,v23,official,pkg,decompiled,evidence,out,tools}

          cat > /tmp/v47/evidence/00_SCOPE.txt <<'EOF'
          REVISION=MASTER-V47
          MODE=OFFLINE_ONLY

          PURPOSE:
          Search the exact official GoloPine Windows tuning client for any
          runtime-to-updater/recovery USB path that is distinct from the public
          SDK Feature-report gate and does not require new live byte 0x11.

          This workflow:
          - verifies the official EXE SHA256,
          - performs PE/.NET metadata and string analysis,
          - attempts ILSpy static decompilation without executing the vendor EXE,
          - maps known V28 transport methods/tokens against the official client,
          - searches callers and upstream methods for boot/update/recovery entry,
          - refuses to promote keyword proximity into a production live command.

          No vendor executable is run.
          No USB I/O.
          No APK.
          No live frame.
          No flash/erase/write.
          FLASH_ALLOWED=NO
          EOF

      - name: Gate 1 - acquire exact evidence set
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          get_artifact() {
            local id="$1"
            local name="$2"
            mkdir -p "/tmp/v47/$name"
            curl -fL --retry 5 --retry-all-errors \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              -o "/tmp/v47/downloads/${name}.zip"
            unzip -q "/tmp/v47/downloads/${name}.zip" -d "/tmp/v47/$name"
          }

          get_artifact "$V46_ARTIFACT_ID" v46
          get_artifact "$V28_ARTIFACT_ID" v28
          get_artifact "$V23_ARTIFACT_ID" v23

          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          for base in [Path("/tmp/v47/v28"), Path("/tmp/v47/v23")]:
              seen=set()
              for _ in range(5):
                  todo=[p for p in base.rglob("*.zip") if p not in seen]
                  if not todo: break
                  for z in todo:
                      seen.add(z)
                      d=z.with_suffix(z.suffix+".unpacked")
                      d.mkdir(parents=True,exist_ok=True)
                      try:
                          with zipfile.ZipFile(z) as q:
                              q.extractall(d)
                      except Exception:
                          pass
          PY

      - name: Gate 2 - download official Windows package and select exact pinned EXE
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 6 --retry-all-errors \
            "$OFFICIAL_WINDOWS_ZIP_URL" \
            -o /tmp/v47/downloads/official_windows.zip

          unzip -q /tmp/v47/downloads/official_windows.zip -d /tmp/v47/pkg

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil, os

          root=Path("/tmp/v47/pkg")
          expected=os.environ["EXPECTED_WINDOWS_EXE_SHA256"].lower()

          rows=[]
          chosen=None
          for p in sorted(root.rglob("*.exe")):
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              rows.append({
                  "path":str(p.relative_to(root)),
                  "size":p.stat().st_size,
                  "sha256":h,
                  "matches_expected":h==expected,
              })
              if h==expected:
                  chosen=p

          Path("/tmp/v47/evidence/01_WINDOWS_PACKAGE_EXE_CENSUS.json").write_text(
              json.dumps(rows,indent=2)+"\n")

          if chosen is None:
              raise SystemExit("exact pinned official EXE SHA256 not found")

          shutil.copy2(chosen,"/tmp/v47/official/GoloPine_official.exe")
          Path("/tmp/v47/evidence/02_OFFICIAL_WINDOWS_IDENTITY.txt").write_text(
              f"EXE_SOURCE={chosen.relative_to(root)}\n"
              f"EXE_SHA256={expected}\n"
              f"EXE_SIZE={chosen.stat().st_size}\n"
          )
          PY

          test "$(sha256sum /tmp/v47/official/GoloPine_official.exe | awk '{print $1}')" = "$EXPECTED_WINDOWS_EXE_SHA256"
          file /tmp/v47/official/GoloPine_official.exe \
            > /tmp/v47/evidence/03_OFFICIAL_WINDOWS_FILE.txt

          strings -a -n 4 -t x /tmp/v47/official/GoloPine_official.exe \
            > /tmp/v47/evidence/04_ASCII_STRINGS.txt
          strings -el -n 4 -t x /tmp/v47/official/GoloPine_official.exe \
            > /tmp/v47/evidence/05_UTF16LE_STRINGS.txt || true
          cat /tmp/v47/evidence/04_ASCII_STRINGS.txt \
              /tmp/v47/evidence/05_UTF16LE_STRINGS.txt \
            > /tmp/v47/evidence/06_ALL_STRINGS.txt

      - name: Gate 3 - PE and CLR metadata inventory
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install --quiet --disable-pip-version-check pefile dnfile >/dev/null 2>&1 || true

          python3 - <<'PY'
          from pathlib import Path
          import json, os, re, subprocess

          exe=Path("/tmp/v47/official/GoloPine_official.exe")
          result={
              "pefile_available":False,
              "dnfile_available":False,
              "is_dotnet":False,
              "method_count":0,
              "interesting_methods":[],
              "imports":[],
          }

          try:
              import pefile
              result["pefile_available"]=True
              pe=pefile.PE(str(exe),fast_load=False)
              result["is_dotnet"]=bool(
                  len(pe.OPTIONAL_HEADER.DATA_DIRECTORY) > 14 and
                  pe.OPTIONAL_HEADER.DATA_DIRECTORY[14].VirtualAddress
              )
              imports=[]
              if hasattr(pe,"DIRECTORY_ENTRY_IMPORT"):
                  for ent in pe.DIRECTORY_ENTRY_IMPORT:
                      dll=(ent.dll or b'').decode(errors='replace')
                      for imp in ent.imports:
                          imports.append({
                              "dll":dll,
                              "name":(imp.name or b'').decode(errors='replace') if imp.name else None,
                              "ordinal":imp.ordinal,
                          })
              result["imports"]=imports
          except Exception as e:
              result["pe_error"]=repr(e)

          try:
              import dnfile
              result["dnfile_available"]=True
              dn=dnfile.dnPE(str(exe))
              methods=[]
              if dn.net and dn.net.mdtables.MethodDef:
                  for rid,row in enumerate(dn.net.mdtables.MethodDef.rows,1):
                      name=str(row.Name)
                      token=0x06000000|rid
                      methods.append({
                          "rid":rid,
                          "token":f"0x{token:08X}",
                          "name":name,
                          "rva":int(row.Rva or 0),
                      })
              result["method_count"]=len(methods)
              pat=re.compile(r'usb|hid|feature|write|send|device|auth|description|boot|loader|upgrade|update|recovery|flash|firmware|reset|transport|stream',re.I)
              result["interesting_methods"]=[m for m in methods if pat.search(m["name"])][:4000]
              Path("/tmp/v47/evidence/07_METHODDEF_ALL.json").write_text(
                  json.dumps(methods,indent=2,ensure_ascii=False)+"\n")
          except Exception as e:
              result["dnfile_error"]=repr(e)

          Path("/tmp/v47/evidence/08_PE_CLR_METADATA_SUMMARY.json").write_text(
              json.dumps(result,indent=2,ensure_ascii=False)+"\n")
          print(json.dumps({k:v for k,v in result.items() if k!="imports"},indent=2))
          PY

      - name: Gate 4 - attempt ILSpy static decompilation without executing vendor EXE
        shell: bash
        run: |
          set -euo pipefail

          DECOMPILER_AVAILABLE=false
          if command -v dotnet >/dev/null 2>&1; then
            dotnet tool install --tool-path /tmp/v47/tools ilspycmd \
              > /tmp/v47/evidence/09_ILSPY_INSTALL.txt 2>&1 || true
            if [ -x /tmp/v47/tools/ilspycmd ]; then
              DECOMPILER_AVAILABLE=true
              /tmp/v47/tools/ilspycmd \
                -p \
                -o /tmp/v47/decompiled \
                /tmp/v47/official/GoloPine_official.exe \
                > /tmp/v47/evidence/10_ILSPY_RUN.txt 2>&1 || true
            fi
          fi

          echo "ILSPY_AVAILABLE=$DECOMPILER_AVAILABLE" \
            > /tmp/v47/evidence/11_ILSPY_STATUS.txt

          find /tmp/v47/decompiled -type f -printf '%P\n' | sort \
            > /tmp/v47/evidence/12_DECOMPILED_FILE_INVENTORY.txt || true

      - name: Gate 5 - exact known-transport token and name reconciliation
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json, re

          evidence_root=Path("/tmp/v47")
          all_text=[]

          for base in [Path("/tmp/v47/v28"), Path("/tmp/v47/v23")]:
              for p in base.rglob("*"):
                  if not p.is_file(): continue
                  try:
                      raw=p.read_bytes()
                      if b'\x00' not in raw[:2048]:
                          all_text.append(raw.decode('utf-8',errors='replace'))
                  except Exception:
                      pass
          prior="\n".join(all_text)

          known_names=[
              "DeviceCommunicationStream.Write",
              "HIDInterface.Send",
              "SendDeviceDescriptionRequest",
              "SendDevTypeSwVersAuthenRequest",
              "UFEcommandBridge",
              "UsbHID",
              "DeviceCommunicationStream",
              "HIDInterface",
          ]
          known_tokens=[
              "0600043A",
              "06000453",
              "06000496",
              "06000783",
              "06000784",
              "06000795",
          ]

          decomp=""
          for p in Path("/tmp/v47/decompiled").rglob("*"):
              if p.is_file():
                  try: decomp += "\n"+p.read_text(errors='replace')
                  except: pass

          strings=Path("/tmp/v47/evidence/06_ALL_STRINGS.txt").read_text(errors='replace')
          meth=[]
          mp=Path("/tmp/v47/evidence/07_METHODDEF_ALL.json")
          if mp.exists():
              try: meth=json.loads(mp.read_text())
              except: pass

          method_names={x.get("name","") for x in meth}

          result={
              "prior_evidence_known_names":{n:(n in prior) for n in known_names},
              "prior_evidence_known_tokens":{t:(t.lower() in prior.lower()) for t in known_tokens},
              "official_strings_name_hits":{n:(n in strings) for n in known_names},
              "official_metadata_method_name_hits":{n:any(n.split(".")[-1]==m for m in method_names) for n in known_names},
              "official_decompiled_name_hits":{n:(n in decomp) for n in known_names},
          }
          Path("/tmp/v47/evidence/13_KNOWN_TRANSPORT_RECONCILIATION.json").write_text(
              json.dumps(result,indent=2)+"\n")
          print(json.dumps(result,indent=2))
          PY

      - name: Gate 6 - mine source-level callers and updater/recovery contexts
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re, json

          roots=list(Path("/tmp/v47/decompiled").rglob("*.cs"))
          records=[]

          transport_terms=[
              "DeviceCommunicationStream.Write",
              "HIDInterface.Send",
              ".Write(",
              ".Send(",
              "Write(",
              "Send(",
          ]
          entry_terms=re.compile(
              r'boot|bootloader|loader|upgrade|updater|update|recovery|firmware|flash|reset|dfu',
              re.I
          )
          feature_terms=re.compile(r'feature|setfeature|getfeature|SET_REPORT|GET_REPORT',re.I)
          auth_terms=re.compile(r'SendDevTypeSwVersAuthenRequest|auth|challenge',re.I)
          desc_terms=re.compile(r'SendDeviceDescriptionRequest|description',re.I)

          def method_blocks(text):
              # Deliberately conservative C# heuristic; records contexts, not proof.
              sig=re.compile(
                  r'(?m)^\s*(?:public|private|protected|internal|static|virtual|override|sealed|async|\s)+'
                  r'[\w<>\[\],.?]+\s+([\w<>]+)\s*\([^;{}]*\)\s*\{'
              )
              for m in sig.finditer(text):
                  i=text.find("{",m.end()-1)
                  if i<0: continue
                  depth=0
                  end=None
                  for j in range(i,len(text)):
                      if text[j]=="{": depth+=1
                      elif text[j]=="}":
                          depth-=1
                          if depth==0:
                              end=j+1
                              break
                  if end:
                      yield m.group(1),text[m.start():end]

          for p in roots:
              try: s=p.read_text(errors='replace')
              except: continue
              for name,body in method_blocks(s):
                  has_transport=any(t in body for t in transport_terms)
                  has_entry=bool(entry_terms.search(name+" "+body))
                  if not (has_transport or has_entry):
                      continue
                  records.append({
                      "file":str(p.relative_to("/tmp/v47/decompiled")),
                      "method":name,
                      "has_transport_write_or_send":has_transport,
                      "has_updater_boot_recovery_term":has_entry,
                      "has_feature_term":bool(feature_terms.search(body)),
                      "has_auth_term":bool(auth_terms.search(body)),
                      "has_description_term":bool(desc_terms.search(body)),
                      "body":body[:12000],
                  })

          candidates=[
              r for r in records
              if r["has_transport_write_or_send"]
              and r["has_updater_boot_recovery_term"]
              and not r["has_feature_term"]
              and not r["has_auth_term"]
          ]

          Path("/tmp/v47/evidence/14_DECOMPILED_TRANSPORT_ENTRY_METHODS.json").write_text(
              json.dumps(records,indent=2,ensure_ascii=False)+"\n")
          Path("/tmp/v47/evidence/15_NON_FEATURE_NON_AUTH_ENTRY_CANDIDATES.json").write_text(
              json.dumps(candidates,indent=2,ensure_ascii=False)+"\n")

          print("DECOMPILED_METHOD_RECORDS",len(records))
          print("NON_FEATURE_NON_AUTH_ENTRY_CANDIDATES",len(candidates))
          PY

      - name: Gate 7 - raw binary keyword and frame-shape census
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re, json

          strings=Path("/tmp/v47/evidence/06_ALL_STRINGS.txt").read_text(errors='replace')
          keywords=[
              "boot","bootloader","loader","upgrade","updater","update","recovery",
              "firmware","flash","erase","feature","hid","usb","6324","1719","2244",
              "SendDevTypeSwVersAuthenRequest","SendDeviceDescriptionRequest",
              "DeviceCommunicationStream","HIDInterface","UsbHID"
          ]
          census={k:len(re.findall(re.escape(k),strings,re.I)) for k in keywords}

          # Search raw EXE for known legacy command vocabulary only as static inventory.
          raw=Path("/tmp/v47/official/GoloPine_official.exe").read_bytes()
          legacy=[b"chiperas",b"codedata",b"bootdat",b"constdat",b"cnfgdat",b"btupdat",b"upinfo",b"cxxx"]
          legacy_hits={x.decode():raw.lower().count(x) for x in legacy}

          result={
              "keyword_census":census,
              "legacy_command_static_hits":legacy_hits,
              "classification":"STATIC_CENSUS_ONLY_NOT_LIVE_AUTHORIZATION"
          }
          Path("/tmp/v47/evidence/16_BINARY_KEYWORD_CENSUS.json").write_text(
              json.dumps(result,indent=2)+"\n")
          PY

      - name: Gate 8 - final production-path decision
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json, re

          v46=json.loads(Path("/tmp/v47/v46/07_V46_FINAL_DECISION.json").read_text())
          known=json.loads(Path("/tmp/v47/evidence/13_KNOWN_TRANSPORT_RECONCILIATION.json").read_text())
          candidates=json.loads(Path("/tmp/v47/evidence/15_NON_FEATURE_NON_AUTH_ENTRY_CANDIDATES.json").read_text())
          meta=json.loads(Path("/tmp/v47/evidence/08_PE_CLR_METADATA_SUMMARY.json").read_text())
          census=json.loads(Path("/tmp/v47/evidence/16_BINARY_KEYWORD_CENSUS.json").read_text())

          # A source-level keyword candidate is not production proof. Promotion requires:
          # 1) exact callable method,
          # 2) exact outgoing frame recovered,
          # 3) frame contains no 0x11,
          # 4) no Feature path,
          # 5) exact 6324:1719 -> production updater identity transition documented.
          # V47 deliberately does not synthesize a live frame from incomplete static evidence.
          exact_frame_recovered=False
          exact_transition_identity_recovered=False
          safe_production_entry_proven=False

          if candidates:
              status="WINDOWS_STATIC_ENTRY_CANDIDATES_FOUND_BUT_NO_EXACT_SAFE_PRODUCTION_FRAME"
              next_action="V48_EXACT_CANDIDATE_METHOD_TOKEN_AND_FRAME_RECOVERY_OFFLINE"
          else:
              status="OFFICIAL_WINDOWS_CLIENT_HAS_NO_STATIC_NON_FEATURE_NON_AUTH_UPDATER_ENTRY"
              next_action="V48_WINDOWS_PROTECTED_METHOD_JIT_EVIDENCE_RECONCILIATION_OFFLINE"

          final={
              "revision":"MASTER-V47",
              "official_exe_sha256": "3ca54171c53f7badd963ffe6851b8b3e2faf8aee8ba2afcb7040990e22ae09b2",
              "is_dotnet":meta.get("is_dotnet"),
              "method_count":meta.get("method_count"),
              "source_level_non_feature_non_auth_entry_candidate_count":len(candidates),
              "exact_safe_outgoing_entry_frame_recovered":exact_frame_recovered,
              "exact_production_updater_identity_transition_recovered":exact_transition_identity_recovered,
              "production_safe_runtime_to_updater_no_0x11_no_feature_proven":safe_production_entry_proven,
              "v46_public_sdk_usb_updater_feature_gated":
                  v46["public_sdk_usb_updater_requires_feature_get"],
              "new_live_0x11_allowed":False,
              "feature_report_live_allowed":False,
              "host_to_dsp_io":False,
              "flash_allowed":False,
              "status":status,
              "next_allowed_action":next_action,
          }

          Path("/tmp/v47/evidence/17_V47_FINAL_DECISION.json").write_text(
              json.dumps(final,indent=2)+"\n")

          md=f"""# MASTER V47 FINAL DECISION

          Exact official GoloPine Windows client was analyzed statically.

          - official EXE SHA256: `{final['official_exe_sha256']}`
          - .NET metadata detected: **{final['is_dotnet']}**
          - MethodDef count: **{final['method_count']}**
          - non-Feature/non-auth source-level updater-entry candidates:
            **{final['source_level_non_feature_non_auth_entry_candidate_count']}**
          - exact safe outgoing updater-entry frame recovered:
            **{final['exact_safe_outgoing_entry_frame_recovered']}**
          - exact production updater identity transition recovered:
            **{final['exact_production_updater_identity_transition_recovered']}**
          - production-safe runtime -> updater without 0x11/Feature proven:
            **{final['production_safe_runtime_to_updater_no_0x11_no_feature_proven']}**

          V46 remains authoritative that the public-SDK USB updater path is
          Feature-gated.

          - new live byte 0x11: **NOT ALLOWED**
          - Feature report live use: **NO**
          - host-to-DSP I/O in V47: **NO**
          - flash/erase/write: **NO / NO / NO**
          - `FLASH_ALLOWED = NO`

          Status:
          **{status}**

          Next allowed action:
          **{next_action}**
          """
          Path("/tmp/v47/evidence/18_V47_FINAL_DECISION.md").write_text(md)
          print(md)
          PY

          cp /tmp/v47/evidence/* /tmp/v47/out/
          (cd /tmp/v47/out && sha256sum * > SHA256SUMS.txt)

      - name: Upload V47 evidence
        uses: actions/upload-artifact@v7
        with:
          name: OKN-BP1048P4-MASTER-V47-OFFICIAL-WINDOWS-USB-ENTRY-XREF-EVIDENCE
          path: /tmp/v47/out/*
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed assertion
        shell: bash
        run: |
          set -euo pipefail
          test "$LIVE_DSP_ALLOWED" = "NO"
          test "$HOST_TO_DSP_IO" = "NO"
          test "$FEATURE_REPORT_ALLOWED" = "NO"
          test "$NEW_LIVE_0X11_ALLOWED" = "NO"
          test "$FLASH_ALLOWED" = "NO"
          test "$ERASE_ALLOWED" = "NO"
          test "$WRITE_ALLOWED" = "NO"
          grep -q '"flash_allowed": false' /tmp/v47/evidence/17_V47_FINAL_DECISION.json
          echo "MASTER_V47=PASS"
          echo "FLASH_ALLOWED=NO"
