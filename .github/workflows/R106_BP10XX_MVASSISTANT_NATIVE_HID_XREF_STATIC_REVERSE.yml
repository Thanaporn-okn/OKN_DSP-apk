name: R106 BP10xx MVAssistant native HID xref and packet-builder static reverse

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R106_BP10XX_MVASSISTANT_NATIVE_HID_XREF_STATIC_REVERSE.yml"

permissions:
  contents: read

concurrency:
  group: r106-bp10xx-native-hid-xref-${{ github.ref }}
  cancel-in-progress: true

env:
  DRIVE_FILE_ID: 15hdF2vnnUMVtIFKhZPGLPwBSEZpyqP2H
  SOURCE_ZIP: MVAssistant_BP10xx_V1.8.11.zip
  EXPECTED_ZIP_SHA256: 8074b3488453e268dc755fa88b2d0bc8ef14fc8c51c3de4e3a783279c195878f
  EXPECTED_EXE_SHA256: a62a968f6e9dc06473390ec26d8e1a6ad70d88c242f05acb2463e5081ec12799
  FLASH_ALLOWED: "NO"

jobs:
  static-reverse:
    name: Native PE xref STATIC ONLY - NO EXECUTION - NO USB - NO BOARD - NO FLASH
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r106/input /tmp/r106/extract /tmp/r106/evidence
          cat > /tmp/r106/evidence/R106_SAFETY.txt <<'EOF'
          R106_MODE=STATIC_OFFLINE_ONLY
          R106_VENDOR_BINARY_EXECUTED=NO
          R106_WINE_MONO_DOTNET_TARGET_EXECUTION=NO
          R106_USB_DEVICE_ACCESS=NO
          R106_BOARD_CONTACT=NO
          R106_AA55_SENT=NO
          R106_LINEIN_AA55_SENT=NO
          R106_RUNTIME_0X11_SENT=NO
          R106_SEND_CHIPERAS_CODEDATA_BOOTDAT_CONSTDAT_CNFGDAT_BTUPDAT_UPINFO_CXXX=NO
          R106_FLASH_READ_EXECUTED=NO
          R106_FLASH_ERASE_EXECUTED=NO
          R106_FLASH_WRITE_EXECUTED=NO
          R106_ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BP1048P4=NO
          FINAL_REQUIRED_TRANSPORT=SAMSUNG_S25_PLUS_USB_C_DIRECT_TO_DSP_USB_C
          HARDWARE_MODIFICATION=FORBIDDEN
          FLASH_ALLOWED=NO
          EOF
          cat /tmp/r106/evidence/R106_SAFETY.txt

      - name: Install static tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            file unzip binutils python3-pip jq >/dev/null
          python3 -m pip install --disable-pip-version-check --no-input \
            gdown pefile capstone >/dev/null
          {
            file --version | head -n1
            objdump --version | head -n1
            python3 - <<'PY'
          import pefile,capstone,gdown
          print("pefile="+pefile.__version__)
          print("capstone="+capstone.__version__)
          print("gdown="+gdown.__version__)
          PY
          } > /tmp/r106/evidence/R106_TOOL_VERSIONS.txt

      - name: Acquire and pin exact BP10xx package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="/tmp/r106/input/$SOURCE_ZIP"
          python3 -m gdown "$DRIVE_FILE_ID" -O "$ZIP" \
            > /tmp/r106/evidence/R106_GDOWN_STDOUT.txt \
            2> /tmp/r106/evidence/R106_GDOWN_STDERR.txt || true
          if [ ! -s "$ZIP" ]; then
            curl --fail --location --retry 3 --retry-all-errors \
              "https://drive.usercontent.google.com/download?id=$DRIVE_FILE_ID&export=download&confirm=t" \
              -o "$ZIP"
          fi
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = "$EXPECTED_ZIP_SHA256"
          unzip -q "$ZIP" -d /tmp/r106/extract
          EXE="$(find /tmp/r106/extract -type f -name 'MVAssistant_BP10xx_V1.8.11.exe' -print -quit)"
          test -n "$EXE" -a -f "$EXE"
          test "$(sha256sum "$EXE" | awk '{print $1}')" = "$EXPECTED_EXE_SHA256"
          chmod a-x "$EXE" || true
          cp "$EXE" /tmp/r106/input/MVAssistant.exe
          {
            echo "ZIP_SHA256=$(sha256sum "$ZIP" | awk '{print $1}')"
            echo "EXE_SHA256=$(sha256sum "$EXE" | awk '{print $1}')"
            echo "EXE_SIZE=$(stat -c '%s' "$EXE")"
            echo "SOURCE_PIN_MATCH=YES"
          } > /tmp/r106/evidence/R106_BINARY_PIN.txt
          cat /tmp/r106/evidence/R106_BINARY_PIN.txt

      - name: Parse PE layout imports and exact string offsets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import pefile,json,hashlib,re

          p=Path("/tmp/r106/input/MVAssistant.exe")
          b=p.read_bytes()
          pe=pefile.PE(str(p),fast_load=False)
          ib=pe.OPTIONAL_HEADER.ImageBase

          sections=[]
          for s in pe.sections:
              sections.append({
                "name":s.Name.rstrip(b"\0").decode("ascii","replace"),
                "rva":s.VirtualAddress,
                "va":ib+s.VirtualAddress,
                "raw":s.PointerToRawData,
                "raw_size":s.SizeOfRawData,
                "virtual_size":s.Misc_VirtualSize,
                "entropy":round(s.get_entropy(),5),
              })

          imports={}
          if hasattr(pe,"DIRECTORY_ENTRY_IMPORT"):
              for ent in pe.DIRECTORY_ENTRY_IMPORT:
                  dll=ent.dll.decode(errors="replace")
                  for imp in ent.imports:
                      name=imp.name.decode(errors="replace") if imp.name else f"ord:{imp.ordinal}"
                      imports[f"{dll}!{name}"]={"iat_va":imp.address,"iat_rva":imp.address-ib}

          targets=[
            "HandShake2Dongle OK, Goto Transfer Flash Data!",
            "RD: PID VID Err,370,HidSendCommand!",
            "RD: PID VID Err,421,HidRead!",
            "Flash Burner Lite USB has connected! Ver:",
            "WriteOnePackageDataToFlash OK",
            "Device's flash init ok",
            "Download OK, and Checking the flash data...",
            "Flashboot Size is More than 384K,pls check!",
            "flashboot",
            "MCU-BP10",
            "Activation_ShengJiXiaZaiData.bin",
            "Handshake NG with Flash Burner(ShengJiGou)!!!",
            "VID_(\\w+)&PID_(\\w+)",
            "BP10",
          ]

          strings=[]
          for t in targets:
              tb=t.encode("ascii","ignore")
              pos=0
              while True:
                  o=b.find(tb,pos)
                  if o<0: break
                  rva=pe.get_rva_from_offset(o)
                  strings.append({"text":t,"raw":o,"rva":rva,"va":ib+rva})
                  pos=o+1

          out={
            "image_base":ib,
            "entry_rva":pe.OPTIONAL_HEADER.AddressOfEntryPoint,
            "sections":sections,
            "imports":imports,
            "target_strings":strings,
          }
          Path("/tmp/r106/evidence/R106_PE_MAP.json").write_text(
              json.dumps(out,indent=2,ensure_ascii=False)+"\n"
          )
          print("TARGET_STRING_INSTANCES",len(strings))
          PY

      - name: Xref target strings and HID file IAT calls from x86 code
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import pefile,json,struct,re
          from capstone import Cs,CS_ARCH_X86,CS_MODE_32
          from capstone.x86 import *

          p=Path("/tmp/r106/input/MVAssistant.exe")
          b=p.read_bytes()
          pe=pefile.PE(str(p),fast_load=False)
          ib=pe.OPTIONAL_HEADER.ImageBase
          meta=json.loads(Path("/tmp/r106/evidence/R106_PE_MAP.json").read_text())

          textsec=next((s for s in pe.sections if s.Name.rstrip(b"\0")==b".text"),None)
          if textsec is None: raise SystemExit("no .text")
          raw0=textsec.PointerToRawData
          raw1=raw0+textsec.SizeOfRawData
          textb=b[raw0:raw1]
          textva=ib+textsec.VirtualAddress

          md=Cs(CS_ARCH_X86,CS_MODE_32)
          md.detail=True
          ins=list(md.disasm(textb,textva))
          by_addr={x.address:x for x in ins}

          # Track target-string references through absolute immediates/displacements.
          target_vas={x["va"]:x for x in meta["target_strings"]}
          string_xrefs=[]
          iat_names={}
          for k,v in meta["imports"].items():
              if any(n.lower() in k.lower() for n in [
                  "readfile","writefile","deviceiocontrol",
                  "hidd_getattributes","hidd_gethidguid","hidd_getindexedstring",
                  "hidd_getpreparseddata","hidp_getcaps",
                  "setupdienumdeviceinterfaces","setupdigetclassdevs",
                  "setupdigetdeviceinterfacedetail","createfile"
              ]):
                  iat_names[v["iat_va"]]=k

          iat_calls=[]
          direct_calls=[]
          for x in ins:
              refs=set()
              for op in x.operands:
                  if op.type==X86_OP_IMM:
                      refs.add(op.imm & 0xffffffff)
                  elif op.type==X86_OP_MEM and op.mem.base==0 and op.mem.index==0:
                      refs.add(op.mem.disp & 0xffffffff)
              for va in refs:
                  if va in target_vas:
                      string_xrefs.append({
                          "insn_va":x.address,
                          "mnemonic":x.mnemonic,
                          "op_str":x.op_str,
                          "target":target_vas[va],
                      })
              if x.mnemonic=="call":
                  op=x.operands[0] if x.operands else None
                  if op and op.type==X86_OP_MEM and op.mem.base==0 and op.mem.index==0:
                      va=op.mem.disp & 0xffffffff
                      if va in iat_names:
                          iat_calls.append({
                              "insn_va":x.address,"import":iat_names[va],
                              "mnemonic":x.mnemonic,"op_str":x.op_str
                          })
                  elif op and op.type==X86_OP_IMM:
                      direct_calls.append({"from":x.address,"to":op.imm & 0xffffffff})

          Path("/tmp/r106/evidence/R106_STRING_XREFS.json").write_text(
              json.dumps(string_xrefs,indent=2,ensure_ascii=False)+"\n"
          )
          Path("/tmp/r106/evidence/R106_HID_IO_IAT_CALLS.json").write_text(
              json.dumps(iat_calls,indent=2,ensure_ascii=False)+"\n"
          )
          Path("/tmp/r106/evidence/R106_DIRECT_CALLS.json").write_text(
              json.dumps(direct_calls,indent=2)+"\n"
          )
          print("STRING_XREF_COUNT",len(string_xrefs))
          print("HID_IO_IAT_CALL_COUNT",len(iat_calls))
          print("DIRECT_CALL_COUNT",len(direct_calls))
          PY

      - name: Build bounded function windows around xrefs and IAT calls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import pefile,json,bisect
          from capstone import Cs,CS_ARCH_X86,CS_MODE_32

          p=Path("/tmp/r106/input/MVAssistant.exe")
          b=p.read_bytes()
          pe=pefile.PE(str(p),fast_load=False)
          ib=pe.OPTIONAL_HEADER.ImageBase
          s=next(x for x in pe.sections if x.Name.rstrip(b"\0")==b".text")
          raw=s.PointerToRawData
          blob=b[raw:raw+s.SizeOfRawData]
          base=ib+s.VirtualAddress

          md=Cs(CS_ARCH_X86,CS_MODE_32)
          ins=list(md.disasm(blob,base))
          addrs=[x.address for x in ins]

          sx=json.loads(Path("/tmp/r106/evidence/R106_STRING_XREFS.json").read_text())
          ic=json.loads(Path("/tmp/r106/evidence/R106_HID_IO_IAT_CALLS.json").read_text())
          points=[]
          for x in sx:
              points.append((x["insn_va"],"STR:"+x["target"]["text"]))
          for x in ic:
              points.append((x["insn_va"],"IAT:"+x["import"]))

          # Conservative bounded windows; not pretending to recover exact function boundaries.
          groups=[]
          for va,label in points:
              idx=bisect.bisect_left(addrs,va)
              a=max(0,idx-80); z=min(len(ins),idx+121)
              groups.append((va,label,a,z))

          out=[]
          for va,label,a,z in groups:
              out.append(f"===== anchor=0x{va:08X} {label} =====")
              for x in ins[a:z]:
                  mark=">>" if x.address==va else "  "
                  out.append(f"{mark} 0x{x.address:08X}: {x.mnemonic:8s} {x.op_str}")
              out.append("")
          Path("/tmp/r106/evidence/R106_XREF_DISASM_WINDOWS.txt").write_text(
              "\n".join(out)+"\n"
          )
          PY

      - name: Heuristically link target-string sites to nearby HID ReadFile WriteFile calls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          sx=json.loads(Path("/tmp/r106/evidence/R106_STRING_XREFS.json").read_text())
          ic=json.loads(Path("/tmp/r106/evidence/R106_HID_IO_IAT_CALLS.json").read_text())

          rows=[]
          for s in sx:
              near=[]
              for c in ic:
                  delta=c["insn_va"]-s["insn_va"]
                  if abs(delta) <= 0x3000:
                      near.append({
                          "delta":delta,
                          "call_va":c["insn_va"],
                          "import":c["import"]
                      })
              near.sort(key=lambda x:abs(x["delta"]))
              rows.append({
                  "string":s["target"]["text"],
                  "string_ref_va":s["insn_va"],
                  "nearby_hid_io_calls":near[:30]
              })

          Path("/tmp/r106/evidence/R106_STRING_TO_HID_IO_NEIGHBORS.json").write_text(
              json.dumps(rows,indent=2,ensure_ascii=False)+"\n"
          )
          PY

      - name: Extract likely static packet-building constants from anchor windows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,json

          txt=Path("/tmp/r106/evidence/R106_XREF_DISASM_WINDOWS.txt").read_text(errors="replace")
          blocks=re.split(r"(?=^===== anchor=)",txt,flags=re.M)
          out=[]
          for block in blocks:
              if not block.startswith("====="): continue
              head=block.splitlines()[0]
              if not re.search(r"HandShake2Dongle|HidSendCommand|HidRead|Flash Burner Lite|WriteOnePackageDataToFlash|flashboot|MCU-BP10",head,re.I):
                  continue
              constants=[]
              byte_stores=[]
              pushes=[]
              for line in block.splitlines()[1:]:
                  m=re.search(r"\b(?:cmp|mov|and|or|xor|test)\s+[^,]+,\s*(0x[0-9a-fA-F]+|\d+)\b",line)
                  if m: constants.append({"line":line.strip(),"imm":m.group(1)})
                  if re.search(r"\bmov\s+byte ptr \[[^\]]+\],\s*(?:0x[0-9a-fA-F]+|\d+)",line,re.I):
                      byte_stores.append(line.strip())
                  if re.search(r"\bpush\s+(?:0x[0-9a-fA-F]+|\d+)\b",line,re.I):
                      pushes.append(line.strip())
              out.append({
                  "anchor":head,
                  "constants":constants[:120],
                  "byte_stores":byte_stores[:120],
                  "immediate_pushes":pushes[:120]
              })
          Path("/tmp/r106/evidence/R106_PACKET_BUILDER_CONSTANTS.json").write_text(
              json.dumps(out,indent=2,ensure_ascii=False)+"\n"
          )
          PY

      - name: Search for dongle VID PID comparison candidates near HidD_GetAttributes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          windows=Path("/tmp/r106/evidence/R106_XREF_DISASM_WINDOWS.txt").read_text(errors="replace")
          blocks=re.split(r"(?=^===== anchor=)",windows,flags=re.M)
          out=[]
          for block in blocks:
              if "HidD_GetAttributes" not in block and "VID_(\\w+)&PID_(\\w+)" not in block:
                  continue
              cmps=[x.strip() for x in block.splitlines()
                    if re.search(r"\bcmp\b.*(?:0x[0-9a-fA-F]{3,8}|\b\d{3,6}\b)",x)]
              out.append({
                  "anchor":block.splitlines()[0] if block.splitlines() else "",
                  "compare_candidates":cmps[:100],
                  "window":block[:18000]
              })
          Path("/tmp/r106/evidence/R106_VID_PID_COMPARE_CANDIDATES.json").write_text(
              json.dumps(out,indent=2,ensure_ascii=False)+"\n"
          )
          PY

      - name: Build fail-closed R106 decision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          ev=Path("/tmp/r106/evidence")
          sx=json.loads((ev/"R106_STRING_XREFS.json").read_text())
          ic=json.loads((ev/"R106_HID_IO_IAT_CALLS.json").read_text())
          nb=json.loads((ev/"R106_STRING_TO_HID_IO_NEIGHBORS.json").read_text())
          pb=json.loads((ev/"R106_PACKET_BUILDER_CONSTANTS.json").read_text())
          vp=json.loads((ev/"R106_VID_PID_COMPARE_CANDIDATES.json").read_text())

          names={x["target"]["text"] for x in sx}
          decision={
            "PINNED_BP10XX_NATIVE_EXE": True,
            "EXE_SHA256": "a62a968f6e9dc06473390ec26d8e1a6ad70d88c242f05acb2463e5081ec12799",
            "TARGET_STRING_XREF_COUNT": len(sx),
            "HID_IO_IMPORT_CALL_SITE_COUNT": len(ic),
            "HANDSHAKE2DONGLE_XREF_PRESENT": any("HandShake2Dongle" in x for x in names),
            "HIDSENDCOMMAND_ERROR_XREF_PRESENT": any("HidSendCommand" in x for x in names),
            "HIDREAD_ERROR_XREF_PRESENT": any("HidRead" in x for x in names),
            "FLASHBOOT_XREF_PRESENT": any(x=="flashboot" for x in names),
            "MCU_BP10_XREF_PRESENT": any(x=="MCU-BP10" for x in names),
            "PACKET_BUILDER_ANCHOR_COUNT": len(pb),
            "VID_PID_COMPARE_WINDOW_COUNT": len(vp),
            "PC_TO_DONGLE_FRAME_FORMAT_PROVEN": False,
            "DONGLE_TO_TARGET_USB_PROTOCOL_PROVEN": False,
            "PRODUCTION_GOLOPINE_BP1048P4_COMPATIBILITY_PROVEN": False,
            "PHONE_DIRECT_S25_USB_C_BOOTSTRAP_PROVEN": False,
            "PRODUCTION_RECOVERY_USB_IDENTITY_PROVEN": False,
            "SAFE_READ_ONLY_PRODUCTION_BACKUP_PROVEN": False,
            "ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD": False,
            "NEXT": "MANUALLY_INTERPRET_XREF_DISASSEMBLY_AND_PACKET_BUILDER_CONSTANTS_OFFLINE",
            "FLASH_ALLOWED": False
          }
          (ev/"R106_DECISION.json").write_text(json.dumps(decision,indent=2)+"\n")
          report=[
            "# R106 BP10xx MVAssistant native HID xref static reverse",
            "",
            "STATIC/OFFLINE ONLY. The native Windows EXE is parsed and disassembled as data; it is never executed.",
            "",
            "## Decision",
            "```json",json.dumps(decision,indent=2),"```",
            "",
            "## Gate",
            "- Xrefs and constants are reverse-engineering evidence only; they are not authorized USB frames.",
            "- PC-to-dongle protocol is not automatically the dongle-to-target DSP protocol.",
            "- No board contact, no AA55 repeat, no runtime 0x11, no legacy flash commands.",
            "- Final accepted path remains Samsung S25+ -> USB-C -> DSP USB-C, no hardware modification.",
            "- FLASH_ALLOWED=NO."
          ]
          (ev/"R106_REPORT.md").write_text("\n".join(report)+"\n")
          print(json.dumps(decision,indent=2))
          PY

      - name: Package evidence only - exclude vendor EXE
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r106/evidence
          zip -9 -r /tmp/R106_BP10XX_NATIVE_HID_XREF_STATIC_EVIDENCE.zip .
          sha256sum /tmp/R106_BP10XX_NATIVE_HID_XREF_STATIC_EVIDENCE.zip \
            > /tmp/R106_BP10XX_NATIVE_HID_XREF_STATIC_EVIDENCE.zip.sha256
          cat /tmp/R106_BP10XX_NATIVE_HID_XREF_STATIC_EVIDENCE.zip.sha256

      - name: Upload R106 evidence
        uses: actions/upload-artifact@v4
        with:
          name: R106-BP10XX-NATIVE-HID-XREF-STATIC-EVIDENCE
          path: |
            /tmp/R106_BP10XX_NATIVE_HID_XREF_STATIC_EVIDENCE.zip
            /tmp/R106_BP10XX_NATIVE_HID_XREF_STATIC_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'R106_VENDOR_BINARY_EXECUTED=NO' /tmp/r106/evidence/R106_SAFETY.txt
          grep -F 'R106_USB_DEVICE_ACCESS=NO' /tmp/r106/evidence/R106_SAFETY.txt
          grep -F 'R106_ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BP1048P4=NO' /tmp/r106/evidence/R106_SAFETY.txt
          grep -F 'FLASH_ALLOWED=NO' /tmp/r106/evidence/R106_SAFETY.txt
          cat /tmp/r106/evidence/R106_DECISION.json
          echo R106_STATIC_REVERSE_COMPLETE=YES
          echo FLASH_ALLOWED=NO
