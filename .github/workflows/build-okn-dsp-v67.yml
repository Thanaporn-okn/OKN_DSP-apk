name: Build OKN DSP V67 Unified Verified Global Write Migration

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_ANDROID_V67_UNIFIED_VERIFIED_GLOBAL_WRITE_MIGRATION.zip'
      - '.github/workflows/build-okn-dsp-v67.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify V67 source
        shell: bash
        run: |
          set -euo pipefail
          echo 'eefd150b5d484f333a192b03b8418bc197e96d8fbac356c01342f50812e1068b  OKN_DSP_ANDROID_V67_UNIFIED_VERIFIED_GLOBAL_WRITE_MIGRATION.zip' | sha256sum -c -
          rm -rf /tmp/okn_v67
          mkdir -p /tmp/okn_v67
          unzip -q OKN_DSP_ANDROID_V67_UNIFIED_VERIFIED_GLOBAL_WRITE_MIGRATION.zip -d /tmp/okn_v67

          check_file() { test -f "$1" || { echo "ERROR missing $1"; exit 1; }; echo "OK file: $1"; }
          check_text() { grep -Fq "$1" "$2" || { echo "ERROR missing marker '$1' in $2"; exit 1; }; echo "OK marker: $1"; }

          MAIN=/tmp/okn_v67/app/src/main/java/com/okn/dsp/MainActivity.kt
          UNIFIED=/tmp/okn_v67/app/src/main/java/com/okn/dsp/UnifiedControlActivity.kt
          SCALAR=/tmp/okn_v67/app/src/main/java/com/okn/dsp/ScalarControlActivity.kt
          LIVE=/tmp/okn_v67/app/src/main/java/com/okn/dsp/LiveEqActivity.kt
          POLICY=/tmp/okn_v67/app/src/main/java/com/okn/dsp/protocol/SaveParamsPolicy.kt
          SCALARPOL=/tmp/okn_v67/app/src/main/java/com/okn/dsp/protocol/VerifiedScalarControls.kt
          GATE=/tmp/okn_v67/app/src/main/java/com/okn/dsp/protocol/WriteGate.kt
          GRADLE=/tmp/okn_v67/app/build.gradle.kts
          MANIFEST=/tmp/okn_v67/app/src/main/AndroidManifest.xml

          for f in "$MAIN" "$UNIFIED" "$SCALAR" "$LIVE" "$POLICY" "$SCALARPOL" "$GATE" "$GRADLE" "$MANIFEST"; do check_file "$f"; done
          check_file /tmp/okn_v67/README_V67.txt
          check_file /tmp/okn_v67/evidence/OKN_DSP_V67_UNIFIED_VERIFIED_GLOBAL_WRITE_MIGRATION_PLAN.txt
          check_file /tmp/okn_v67/evidence/OKN_DSP_V67_UNIFIED_VERIFIED_GLOBAL_WRITE_MIGRATION_PLAN.json

          check_text 'versionCode = 67' "$GRADLE"
          check_text '4.8.0-v67-unified-verified-global-write-migration' "$GRADLE"
          check_text 'OKN DSP V67 — PRODUCTION VERIFIED CONTROL HUB' "$MAIN"
          check_text 'UNIFIED V67 • VERIFIED GLOBAL WRITES + EQ/SENSORS READ ONLY' "$MAIN"
          check_text 'UnifiedControlActivity::class.java' "$MAIN"
          check_text '.UnifiedControlActivity' "$MANIFEST"

          # Exact verified scalar allow-list and generic gate policy.
          check_text 'const val enabled: Boolean = false' "$GATE"
          check_text 'const val unifiedVerifiedScalarWritesEnabled: Boolean = true' "$GATE"
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('/tmp/okn_v67/app/src/main/java/com/okn/dsp/protocol/VerifiedScalarControls.kt').read_text()
          ids=[int(x) for x in re.findall(r'VerifiedScalarControl\((\d+),', s)]
          assert ids == [2,3,8,9,10,13,11], ids
          print('OK: V67 scalar allow-list exactly [2,3,8,9,10,13,11]')
          PY

          # V67 Unified Phase 1: fresh preflight -> target -> required GATT success -> fresh verify -> exact restore + restore verify.
          check_text 'WRITE_PREFLIGHT' "$UNIFIED"
          check_text 'VERIFY_TARGET' "$UNIFIED"
          check_text 'VERIFY_RESTORE' "$UNIFIED"
          check_text 'V67_UNIFIED_SCALAR_PREFLIGHT_START' "$UNIFIED"
          check_text 'V67_UNIFIED_SCALAR_PREFLIGHT_OK' "$UNIFIED"
          check_text 'freshBaseline=$original' "$UNIFIED"
          check_text 'UfeCodec.encodeFloat32Write(id, target)' "$UNIFIED"
          check_text 'V67_UNIFIED_SCALAR_WRITE_PLAIN=' "$UNIFIED"
          check_text 'V67_UNIFIED_GATT_TICKET_QUEUED' "$UNIFIED"
          check_text 'V67_UNIFIED_GATT_RESULT purpose=' "$UNIFIED"
          check_text 'V67_UNIFIED_TARGET_DESCRIPTOR_VERIFY' "$UNIFIED"
          check_text 'UfeCodec.encodeFloat32Write(id, original)' "$UNIFIED"
          check_text 'V67_UNIFIED_FAILSAFE_RESTORE_PLAIN=' "$UNIFIED"
          check_text 'V67_UNIFIED_RESTORE_DESCRIPTOR_VERIFY' "$UNIFIED"
          check_text 'RESTORE VERIFY FAILED — STOP CONTROL • DO NOT SAVE' "$UNIFIED"
          check_text 'RAM_DIRTY' "$UNIFIED"

          # Same-session V66 refresh behavior must remain present in V67.
          check_text 'REFRESH ALL • SAME SESSION' "$UNIFIED"
          check_text 'REFRESHING #$refreshCount • PLEASE WAIT' "$UNIFIED"
          check_text 'V67_UNIFIED_REFRESH_TAP' "$UNIFIED"
          check_text 'V67_UNIFIED_REFRESH_COMPLETE' "$UNIFIED"
          check_text 'NO VALUE CHANGES • refresh สำเร็จ แต่ DSP ส่งค่าชุดเดิม' "$UNIFIED"
          check_text 'scalarChanged=$scalarChanged' "$UNIFIED"
          check_text 'eqChanged=$eqChanged' "$UNIFIED"
          check_text 'sensorChanged=$sensorChanged' "$UNIFIED"
          check_text 'sameSession=true' "$UNIFIED"

          # Unified coverage remains complete, but only scalars are writable in this phase.
          check_text 'expectedScalars=7' "$UNIFIED"
          check_text 'expectedEqBands=105' "$UNIFIED"
          check_text 'expectedSensors=4' "$UNIFIED"
          check_text 'eqReadOnly=true' "$UNIFIED"
          check_text 'sensorReadOnly=true' "$UNIFIED"
          check_text 'genericWrites=false' "$UNIFIED"

          # SaveParams remains centralized, manual and guarded.
          check_text 'SaveParamsPolicy.encodeTrigger()' "$UNIFIED"
          check_text '570000000700000000' "$UNIFIED"
          check_text 'verifiedChangeCount > 0' "$UNIFIED"
          check_text 'V67_UNIFIED_SAVEPARAMS_TRIGGER_PLAIN=' "$UNIFIED"
          check_text 'V67_UNIFIED_PERSISTENT_SAVE_COMPLETE' "$UNIFIED"
          check_text 'DO NOT RETRY BLINDLY' "$UNIFIED"
          check_text 'UfeCodec.encodeWrite(ACTUATOR_ID, 0, byteArrayOf())' "$POLICY"
          check_text '570000000700000000' "$POLICY"

          python3 - <<'PY'
          from pathlib import Path
          u=Path('/tmp/okn_v67/app/src/main/java/com/okn/dsp/UnifiedControlActivity.kt').read_text()
          assert u.count('UfeCodec.encodeFloat32Write') == 2, u.count('UfeCodec.encodeFloat32Write')
          assert u.count('SaveParamsPolicy.encodeTrigger()') == 1, u.count('SaveParamsPolicy.encodeTrigger()')
          forbidden = [
              'LiveEqPolicy.encodeWrite',
              'LiveEqPolicy.encodeRestore',
              'EqBandCodec.encode',
              'UfeCodec.encodeWrite(7',
              'WRITE LIVE + VERIFY',
              'SAVE EQ',
          ]
          for x in forbidden:
              assert x not in u, x
          assert 'UfeCodec.encodeFloat32Write(id, target)' in u
          assert 'UfeCodec.encodeFloat32Write(id, original)' in u
          print('OK: Unified has only verified scalar target+restore encoders; no EQ/unknown writer')
          PY

          if grep -R -n -F 'UfeCodec.encodeWrite(7' /tmp/okn_v67/app/src/main/java/com/okn/dsp | grep -v 'SaveParamsPolicy.kt'; then
            echo 'ERROR: direct SaveParams ID7 write exists outside SaveParamsPolicy'
            exit 1
          fi

          # Existing separately-qualified production modules remain present.
          check_text 'V66_SCALAR_WRITE_PLAIN=' "$SCALAR"
          check_text 'V66_TARGET_DESCRIPTOR_VERIFY' "$SCALAR"
          check_text 'V66_FAILSAFE_RESTORE_PLAIN=' "$SCALAR"
          check_text 'V66_SCALAR_SAVEPARAMS_TRIGGER_PLAIN=' "$SCALAR"
          check_text 'V66_LIVE_EQ_WRITE_PLAIN=' "$LIVE"
          check_text 'V66_EQ_ROLLBACK_WRITE_PLAIN=' "$LIVE"
          check_text 'V66_SAVEPARAMS_TRIGGER_PLAIN=' "$LIVE"

          echo 'OK: V67 static preflight passed'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/okn_v67
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and package artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn_v67/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          mkdir -p artifact
          cp "$APK" artifact/OKN_DSP_V67_UNIFIED_VERIFIED_GLOBAL_WRITE_MIGRATION-debug.apk
          cp /tmp/okn_v67/README_V67.txt artifact/
          cp /tmp/okn_v67/evidence/OKN_DSP_V67_UNIFIED_VERIFIED_GLOBAL_WRITE_MIGRATION_PLAN.txt artifact/
          cp /tmp/okn_v67/evidence/OKN_DSP_V67_UNIFIED_VERIFIED_GLOBAL_WRITE_MIGRATION_PLAN.json artifact/
          sha256sum artifact/OKN_DSP_V67_UNIFIED_VERIFIED_GLOBAL_WRITE_MIGRATION-debug.apk > artifact/OKN_DSP_V67_UNIFIED_VERIFIED_GLOBAL_WRITE_MIGRATION-debug.sha256
          ls -lh artifact

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-V67-UNIFIED-VERIFIED-GLOBAL-WRITE-MIGRATION-debug-apk
          path: artifact/
          if-no-files-found: error
          retention-days: 30
