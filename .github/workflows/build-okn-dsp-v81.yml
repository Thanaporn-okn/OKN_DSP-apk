name: Build OKN DSP V81 Connection Watchdog Fail-Closed

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_ANDROID_V81_CONNECTION_WATCHDOG_FAIL_CLOSED.zip'
      - '.github/workflows/build-okn-dsp-v81.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify V81 source
        shell: bash
        run: |
          set -euo pipefail
          echo '6324184f41e0935dc7dda9bb917691b2e15fcfe0467197ede9ddb13bb814b960  OKN_DSP_ANDROID_V81_CONNECTION_WATCHDOG_FAIL_CLOSED.zip' | sha256sum -c -
          rm -rf /tmp/okn_v81
          mkdir -p /tmp/okn_v81
          unzip -q OKN_DSP_ANDROID_V81_CONNECTION_WATCHDOG_FAIL_CLOSED.zip -d /tmp/okn_v81
          cd /tmp/okn_v81
          python3 preflight_v81.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/okn_v81
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and package artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn_v81/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          mkdir -p artifact
          cp "$APK" artifact/OKN_DSP_V81_CONNECTION_WATCHDOG_FAIL_CLOSED-debug.apk
          cp /tmp/okn_v81/README_V81.txt artifact/
          cp /tmp/okn_v81/evidence/OKN_DSP_V81_CONNECTION_WATCHDOG_FAIL_CLOSED_PLAN.txt artifact/
          cp /tmp/okn_v81/evidence/OKN_DSP_V81_CONNECTION_WATCHDOG_FAIL_CLOSED_PLAN.json artifact/
          cp /tmp/okn_v81/evidence/OKN_DSP_V80_PERSISTENT_LAST_DSP_RECONNECT_RUNTIME_SUCCESS_CAPTURE.txt artifact/
          sha256sum artifact/OKN_DSP_V81_CONNECTION_WATCHDOG_FAIL_CLOSED-debug.apk > artifact/OKN_DSP_V81_CONNECTION_WATCHDOG_FAIL_CLOSED-debug.sha256
          ls -lh artifact

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-V81-CONNECTION-WATCHDOG-FAIL-CLOSED-debug-apk
          path: artifact/
          if-no-files-found: error
          retention-days: 30
