      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager)"
          echo "sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preflight
        working-directory: /tmp/okn_peramp_dsp/OKN_Peramp_DSP_NEW
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/preflight.py

      - name: Build debug APK
        working-directory: /tmp/okn_peramp_dsp/OKN_Peramp_DSP_NEW
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          APK="/tmp/okn_peramp_dsp/OKN_Peramp_DSP_NEW/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p /tmp/out
          cp "$APK" /tmp/out/OKN_Peramp_DSP_1.0.0-debug.apk
          sha256sum /tmp/out/OKN_Peramp_DSP_1.0.0-debug.apk > /tmp/out/OKN_Peramp_DSP_1.0.0-debug.apk.sha256
          ls -lh /tmp/out/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN-Peramp-DSP-APK
          path: /tmp/out/*
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: success()
        shell: bash
        run: |
          {
            echo "## OKN Peramp DSP"
            echo "- package: com.okn.perampdsp"
            echo "- source: embedded inside this workflow"
            echo "- output: OKN_Peramp_DSP_1.0.0-debug.apk"
            echo "- artifact: OKN-Peramp-DSP-APK"
          } >> "$GITHUB_STEP_SUMMARY"
