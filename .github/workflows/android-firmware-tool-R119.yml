name: OKN CURRENT TRACK R119 Pre-AES Gate Audit OFFLINE ONLY

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/android-firmware-tool.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: okn-current-r119-pre-aes-${{ github.ref }}
  cancel-in-progress: true

env:
  EXECUTE_OFFICIAL_CLIENT: "NO"
  LIVE_BOARD_USB: "NO"
  HOST_TO_DEVICE_USB: "NO"
  FLASH_ERASE_WRITE: "NO"
  FLASH_ALLOWED: "NO"
  R118_SOURCE_RUN_ID: "37420603318"
  R118_SOURCE_COMMIT: "c9695d2511afe40438653b58b03ec1c9563f3b5b"
  R118_ARTIFACT_ID: "11392533354"
  R118_ARTIFACT_SHA256: "f79e40607ff410c6ebbc1ce056fcc1913b579ad11ebc58fc644c925eea63d72a"
  R118_ARTIFACT_SIZE: "5904200"
  OUT: /tmp/r119

jobs:
  audit:
    name: Prove earliest blocker before AES and A3F4 writes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fail-closed safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$EXECUTE_OFFICIAL_CLIENT" = "NO"
          test "$LIVE_BOARD_USB" = "NO"
          test "$HOST_TO_DEVICE_USB" = "NO"
          test "$FLASH_ERASE_WRITE" = "NO"
          test "$FLASH_ALLOWED" = "NO"
          rm -rf "$OUT"
          mkdir -p "$OUT"/{input,evidence,review}
          cat > "$OUT/evidence/00_SCOPE.txt" <<EOF
          REVISION=CURRENT_TRACK_R119
          MODE=OFFLINE_EVIDENCE_ONLY
          TARGET_EXECUTED=false
          BOARD_USB_ACCESS=NO
          HOST_TO_DEVICE_USB=NO
          FLASH_ERASE_WRITE=NO
          FLASH_ALLOWED=NO
          R118_SOURCE_RUN_ID=$R118_SOURCE_RUN_ID
          R118_SOURCE_COMMIT=$R118_SOURCE_COMMIT
          TARGET_METHOD=UpdateCommandThread
          TARGET_METHOD_TOKEN=0x0600082C
          TARGET_METHOD_RID=2092
          TARGET_METHOD_RVA=0xA3F4
          EOF

      - name: Download and verify pinned R118 evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "$OUT/input/r118.zip" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${R118_ARTIFACT_ID}/zip"
          ACTUAL_SHA="$(sha256sum "$OUT/input/r118.zip" | awk '{print $1}')"
          ACTUAL_SIZE="$(stat -c%s "$OUT/input/r118.zip")"
          test "$ACTUAL_SHA" = "$R118_ARTIFACT_SHA256"
          test "$ACTUAL_SIZE" = "$R118_ARTIFACT_SIZE"
          unzip -q "$OUT/input/r118.zip" -d "$OUT/input/r118"
          for f in \
            evidence/20_N9_METHOD.il \
            evidence/21_EXACT_SWITCH_MAP.json \
            evidence/30_VM_SUMMARY.json \
            evidence/35_NATIVE_WRITE_TRACE.json \
            evidence/36A_ALL_HELPER_RESOLUTION.json \
            evidence/36C_TARGET_METHOD_PE_PROVENANCE.json \
            evidence/49_STAGE1_KEY_PARSER_SANITY.json \
            evidence/53_EXACT_TARGET_PATCH_GATE.json \
            decrypted/stage1_local37.bin \
            decrypted/stage2_qword_xor.bin; do
            test -f "$OUT/input/r118/$f"
          done
          printf 'R118_ARTIFACT_SHA256=%s\nR118_ARTIFACT_SIZE=%s\nR118_ARTIFACT_IDENTITY_MATCHED=true\n' \
            "$ACTUAL_SHA" "$ACTUAL_SIZE" > "$OUT/evidence/01_R118_ARTIFACT_IDENTITY.txt"

      - name: Audit state292 gate wrapper coverage and A3F4 ledger
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json,struct,hashlib,shutil

          out=Path(os.environ['OUT']); src=out/'input/r118/evidence'; ev=out/'evidence'; review=out/'review'
          load=lambda n: json.loads((src/n).read_text())
          il=(src/'20_N9_METHOD.il').read_text(errors='ignore')
          sw=load('21_EXACT_SWITCH_MAP.json'); vm=load('30_VM_SUMMARY.json')
          native=load('35_NATIVE_WRITE_TRACE.json'); helpers=load('36A_ALL_HELPER_RESOLUTION.json')
          target=load('36C_TARGET_METHOD_PE_PROVENANCE.json'); sanity=load('49_STAGE1_KEY_PARSER_SANITY.json')
          gate118=load('53_EXACT_TARGET_PATCH_GATE.json')
          s1=(out/'input/r118/decrypted/stage1_local37.bin').read_bytes()
          s2=(out/'input/r118/decrypted/stage2_qword_xor.bin').read_bytes()

          targets=sw.get('all_targets',[])
          main_ok=(sw.get('switch_target_count')==689 and sw.get('state_392_mapping_correct') is True and
                   len(targets)>402 and targets[289]=='IL_1969' and targets[292]=='IL_59b1' and
                   targets[402]=='IL_23ed' and targets[281]=='IL_65d1')
          if not main_ok: raise SystemExit('canonical main-switch identity failed')

          required=['IL_1969: ldloc.s 114','IL_1970: stloc.s 28','IL_59b1: ldloc.s 28',
                    'IL_59b3: ldc.i4.4','IL_59b4: bne.un IL_5d8f','IL_59b9: ldc.i4 402',
                    '::VnHlfpNorSGR6U9GUOp(','IL_26e3: ldc.i4 281',
                    'IL_65da: newobj instance void [mscorlib]System.Security.Cryptography.CryptoStream::.ctor']
          il_gate=all(x in il for x in required)
          if not il_gate: raise SystemExit('state292/AES IL proof failed')

          snaps=vm.get('main_state_snapshots',[])
          a=next((x for x in snaps if x.get('main_state')==289),{})
          b=next((x for x in snaps if x.get('main_state')==292),{})
          before=a.get('reader_pos'); after=b.get('reader_pos')
          observed=b.get('locals',{}).get('28',b.get('local28'))
          if not (isinstance(before,int) and isinstance(after,int) and after-before==4 and isinstance(observed,int)):
              raise SystemExit('state292 snapshot consistency failed')
          word1=struct.unpack_from('<I',s1,before)[0]; word2=struct.unpack_from('<I',s2,before)[0]
          qword_il=all(x in il for x in ['IL_495b: ldind.i8','IL_495c: ldc.i4 939576589','IL_4961: conv.i8','IL_4962: xor','IL_4963: stind.i8'])
          qword_cannot_fix=qword_il and before%8==4 and word1==word2

          unknown=vm.get('unknown_calls',[])
          first313=min((x.get('step') for x in vm.get('global_reach_main_only',[]) if x.get('state')==313 and isinstance(x.get('step'),int)),default=10**18)
          first292=min((x.get('step') for x in vm.get('global_reach_main_only',[]) if x.get('state')==292 and isinstance(x.get('step'),int)),default=10**18)
          defs={x.get('name'):x for x in helpers.get('definitions',[]) if x.get('name')}
          def names_before(limit): return sorted({x.get('name') for x in unknown if isinstance(x.get('step'),int) and x['step']<=limit and x.get('name')})
          pre313=names_before(first313); pre292=names_before(first292)
          known_one=[]; missing=[]
          for n in pre292:
              d=defs.get(n)
              if not d: missing.append(n); continue
              body=d.get('body','')
              if body.count(' call ')+body.count('\n\tcall ')>=1: known_one.append(n)

          ledger=[]; a3f4=0xA3F4
          for seq,w in enumerate(native.get('writes',[])):
              r=w.get('rva'); n=w.get('size'); hx=w.get('new_hex')
              if not (isinstance(r,int) and isinstance(n,int) and isinstance(hx,str)): continue
              ledger.append({'sequence':seq,'rva':r,'size':n,'covers_A3F4':r<=a3f4<r+n,
                             'source':w.get('source'),'target_origin':w.get('target_origin'),
                             'pe_image_provenance':w.get('pe_image_provenance') is True,
                             'step':w.get('step'),'main_state':w.get('main_state'),
                             'sha256_new_bytes':hashlib.sha256(bytes.fromhex(hx)).hexdigest()})
          covering=[x for x in ledger if x['covers_A3F4']]
          pe_cover=[x for x in covering if x['pe_image_provenance'] and str(x.get('target_origin','')).startswith('PE_IMAGE:')]

          fmt={'target_method_identity_proven':bool(target.get('target_method',{}).get('method_identity_proven')),
               'canonical_main_switch_proven':main_ok,'state292_exact_il_gate_proven':il_gate,
               'format_gate_expected_int32':4,'reader_offset_before_state289':before,'reader_offset_after_state292':after,
               'observed_local28':observed,'observed_local28_hex':f'0x{observed & 0xffffffff:08X}',
               'stage1_u32_at_reader_offset':word1,'stage2_u32_at_reader_offset':word2,
               'qword_mask_cannot_change_format_word':qword_cannot_fix,'format_gate_passed_in_r118':observed==4,
               'state402_reached':any(x.get('state')==402 for x in vm.get('global_reach_main_only',[])),
               'state281_reached':any(x.get('state')==281 for x in vm.get('global_reach_main_only',[])),
               'earliest_proven_blocker':'STATE292_FORMAT_WORD_MISMATCH_BEFORE_AES_DECRYPTOR'}
          gaps={'first_state313_step':first313,'first_state292_step':first292,
                'unknown_call_names_before_state313':pre313,'unknown_call_names_before_state292':pre292,
                'unknown_call_unique_before_state313':len(pre313),'unknown_call_unique_before_state292':len(pre292),
                'known_wrapper_definitions_before_state292':known_one,'definition_missing_before_state292':missing,
                'r118_key_unique_value_per_index':sanity.get('key_unique_value_per_index'),
                'r118_state313_key_matches_unique_writes':sanity.get('state313_key_matches_unique_writes')}
          led={'target_rva':'0xA3F4','r118_native_write_count':native.get('write_count',0),
               'r118_write_process_memory_count':native.get('write_process_memory_count',0),
               'ordered_write_ledger':ledger,'A3F4_covering_writes':covering,
               'PE_IMAGE_proven_A3F4_covering_writes':pe_cover,'exact_patch_bytes_proven':False}
          (ev/'70_R119_FORMAT_GATE.json').write_text(json.dumps(fmt,indent=2)+'\n')
          (ev/'71_R119_PRE_GATE_WRAPPER_GAPS.json').write_text(json.dumps(gaps,indent=2)+'\n')
          (ev/'72_R119_A3F4_WRITE_LEDGER.json').write_text(json.dumps(led,indent=2)+'\n')

          verdict={'revision':'CURRENT_TRACK_R119','offline_only':True,**fmt,
                   'pre_state292_unknown_wrapper_unique_count':len(pre292),
                   'pre_state292_known_wrapper_definition_count':len(known_one),
                   'pre_state292_missing_definition_count':len(missing),
                   'key_unique_value_per_index':sanity.get('key_unique_value_per_index'),
                   'state313_key_matches_unique_writes':sanity.get('state313_key_matches_unique_writes'),
                   'native_write_count':native.get('write_count',0),'A3F4_covering_write_count':len(covering),
                   'PE_IMAGE_proven_A3F4_write_count':len(pe_cover),'exact_patch_bytes_proven':False,
                   'protected_update_body_recovered':False,'firmware_readback_primitive_proven':False,
                   'full_flash_readback_proven':False,'live_board_commands_allowed':False,
                   'next_gate':'Implement deterministic semantics for known wrappers before state292; require a unique key/control path and local28==4 before states 402/281 and any A3F4 write promotion.'}
          (review/'80_R119_VERDICT.json').write_text(json.dumps(verdict,indent=2)+'\n')
          lines=['OKN CURRENT TRACK R119 PRE-AES GATE AUDIT','OFFLINE_ONLY=true',
                 f"TARGET_METHOD_IDENTITY_PROVEN={str(fmt['target_method_identity_proven']).lower()}",
                 f"STATE292_EXPECTED=4",f"STATE292_OBSERVED={observed}",
                 f"STATE292_FORMAT_GATE_PASSED={str(observed==4).lower()}",
                 f"QWORD_MASK_CANNOT_CHANGE_FORMAT_WORD={str(qword_cannot_fix).lower()}",
                 f"PRE_STATE292_UNKNOWN_WRAPPER_COUNT={len(pre292)}",f"PRE_STATE292_MISSING_DEFINITION_COUNT={len(missing)}",
                 f"KEY_UNIQUE_VALUE_PER_INDEX={str(sanity.get('key_unique_value_per_index')).lower()}",
                 f"NATIVE_WRITE_COUNT={native.get('write_count',0)}",f"A3F4_COVERING_WRITE_COUNT={len(covering)}",
                 'EXACT_PATCH_BYTES_PROVEN=false','PROTECTED_UPDATE_BODY_RECOVERED=false',
                 'LIVE_BOARD_COMMANDS_ALLOWED=false','EARLIEST_PROVEN_BLOCKER=STATE292_FORMAT_WORD_MISMATCH_BEFORE_AES_DECRYPTOR']
          (review/'81_R119_SUMMARY.txt').write_text('\n'.join(lines)+'\n')
          for p in ev.iterdir():
              if p.is_file(): shutil.copy2(p,review/p.name)
          (review/'99_SAFETY_ATTESTATION.txt').write_text('OFFLINE_EVIDENCE_ONLY=true\nTARGET_EXECUTED=false\nBOARD_USB_ACCESSED=false\nHOST_TO_DEVICE_COMMANDS_SENT=false\nHID_SET_REPORT_LIVE=false\nFLASH_ERASE_WRITE=false\nFLASH_ALLOWED=false\n')
          print('\n'.join(lines))
          PY
          (cd "$OUT/review" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$OUT/review/SHA256SUMS.txt"

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo "## OKN CURRENT TRACK R119 — Pre-AES Gate Audit"
            echo
            echo "- Offline evidence only; protected EXE is never executed."
            echo "- Pinned R118 artifact identity is verified before analysis."
            echo "- Proves state292 format gate before AES and records pre-gate emulator wrapper coverage gaps."
            echo "- A3F4 promotion remains fail-closed; no USB/DSP/flash activity."
            echo
            [ ! -f "$OUT/review/81_R119_SUMMARY.txt" ] || { echo '```text'; cat "$OUT/review/81_R119_SUMMARY.txt"; echo '```'; }
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload R119 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CURRENT-R119-PRE-AES-GATE-EVIDENCE
          path: |
            /tmp/r119/review
            /tmp/r119/evidence
          if-no-files-found: warn
          retention-days: 30
