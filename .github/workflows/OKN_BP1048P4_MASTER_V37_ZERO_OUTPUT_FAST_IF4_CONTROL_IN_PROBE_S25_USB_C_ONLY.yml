name: OKN BP1048P4 MASTER V37 ZERO-OUTPUT FAST IF4 CONTROL-IN PROBE S25 USB-C ONLY

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/OKN_BP1048P4_MASTER_V37_ZERO_OUTPUT_FAST_IF4_CONTROL_IN_PROBE_S25_USB_C_ONLY.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FLASH_ALLOWED: "NO"
  ERASE_ALLOWED: "NO"
  WRITE_ALLOWED: "NO"
  FEATURE_REPORT_ALLOWED: "NO"
  HOST_OUTPUT_ALLOWED: "NO"
  STARTUP_COMMAND_ALLOWED: "NO"
  AUTH_REPLY_ALLOWED: "NO"

jobs:
  build-v37:
    name: Build zero-output fast IF4 control-IN probe APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          test "$ERASE_ALLOWED" = "NO"
          test "$WRITE_ALLOWED" = "NO"
          test "$FEATURE_REPORT_ALLOWED" = "NO"
          test "$HOST_OUTPUT_ALLOWED" = "NO"
          test "$STARTUP_COMMAND_ALLOWED" = "NO"
          test "$AUTH_REPLY_ALLOWED" = "NO"

          rm -rf /tmp/v37
          mkdir -p /tmp/v37/app/app/src/main/java/com/okn/bp1048p4v37
          mkdir -p /tmp/v37/app/app/src/main/res/xml
          mkdir -p /tmp/v37/evidence /tmp/v37/out

          cat > /tmp/v37/evidence/00_SCOPE.txt <<'EOF'
          REVISION=MASTER-V37
          MODE=ZERO_OUTPUT_FAST_IF4_CONTROL_IN_PROBE
          REQUIRED_PHONE=Samsung Galaxy S25+
          REQUIRED_PATH=Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only

          PROVEN_BY_V36:
          - Exact runtime fingerprint is valid.
          - IF3 is Consumer Control HID and owns the only interrupt-IN endpoint.
          - IF4 is vendor-defined HID with a 256-byte Input report, 256-byte
            Output report, and 8-byte Feature report.
          - IF4 has zero interrupt endpoints, therefore vendor traffic is
            control-report based on this production runtime.

          V37 LIVE RULES:
          - zero application Output reports,
          - zero startup commands,
          - zero auth replies,
          - zero Feature reports,
          - GET_REPORT(Input) on IF4 only after exact fingerprint,
          - no flash/erase/write/recovery/update.

          HARD RULE:
          New live byte 0x11 is never transmitted.

          FLASH_ALLOWED=NO
          EOF

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail
          A=/tmp/v37/app

          cat > "$A/settings.gradle" <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name='OKN_BP1048P4_V37_ZERO_OUTPUT_IF4_IN'
          include ':app'
          EOF

          cat > "$A/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > "$A/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > "$A/app/build.gradle" <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.okn.bp1048p4v37'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.okn.bp1048p4v37'
                  minSdk 29
                  targetSdk 35
                  versionCode 37
                  versionName '37.0'
              }
          }
          EOF

          cat > "$A/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.usb.host" android:required="true"/>

              <application
                  android:allowBackup="false"
                  android:label="OKN BP1048P4 V37 Zero Output IF4 IN">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED"/>
                      </intent-filter>

                      <meta-data
                          android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED"
                          android:resource="@xml/device_filter"/>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > "$A/app/src/main/res/xml/device_filter.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <usb-device vendor-id="25380" product-id="5913"/>
          </resources>
          EOF

          cat > "$A/app/src/main/java/com/okn/bp1048p4v37/MainActivity.java" <<'JAVA'
          package com.okn.bp1048p4v37;

          import android.app.Activity;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.hardware.usb.UsbDevice;
          import android.hardware.usb.UsbDeviceConnection;
          import android.hardware.usb.UsbInterface;
          import android.hardware.usb.UsbManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.SystemClock;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import java.security.MessageDigest;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.HashMap;
          import java.util.Locale;
          import java.util.Map;

          @SuppressWarnings("deprecation")
          public class MainActivity extends Activity {
              private static final int VID=0x6324;
              private static final int PID=0x1719;
              private static final int SAVE_EVIDENCE=137;
              private static final String USB_PERMISSION=
                  "com.okn.bp1048p4v37.USB_PERMISSION";

              private static final String RAW_SHA=
                  "C7E861A6F28EB832E16450D3A35B64C557BEA4E0CC15FF1EB94C45E348C84001";
              private static final String IF3_SHA=
                  "BAFE7C0E6A251EB36B11362B18106DFF3DC0010A831A3B8B6CD49DBF4A9AE2C3";
              private static final String IF4_SHA=
                  "78510751B31DCC204CD6CA2FE023F05CF84B75227A279E8E1FBAF7D6C3A21B6F";

              private UsbManager usb;
              private TextView log;
              private Button probeButton;
              private final StringBuilder evidence=new StringBuilder();
              private long t0;
              private boolean exactFingerprint=false;
              private volatile boolean probeRunning=false;

              private static final class Captured {
                  final long elapsedMs;
                  final int result;
                  final byte[] bytes;

                  Captured(long elapsedMs,int result,byte[] bytes) {
                      this.elapsedMs=elapsedMs;
                      this.result=result;
                      this.bytes=bytes;
                  }
              }

              private final BroadcastReceiver permissionRx=new BroadcastReceiver() {
                  @Override public void onReceive(Context c,Intent i) {
                      if(!USB_PERMISSION.equals(i.getAction()))return;

                      UsbDevice d=getDevice(i);
                      boolean ok=i.getBooleanExtra(
                          UsbManager.EXTRA_PERMISSION_GRANTED,false);

                      line("USB_PERMISSION_RESULT="+ok+dev(d));

                      if(ok && runtime(d))
                          verify(d);
                  }
              };

              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);

                  getWindow().addFlags(
                      WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  t0=SystemClock.elapsedRealtime();
                  usb=(UsbManager)getSystemService(Context.USB_SERVICE);

                  evidence.append("EVIDENCE_FORMAT=OKN_BP1048P4_V37_ZERO_OUTPUT_FAST_IF4_CONTROL_IN\n");
                  evidence.append("REQUIRED_PHONE=Samsung Galaxy S25+\n");
                  evidence.append("REQUIRED_PATH=Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only\n");
                  evidence.append("EXPECTED_RUNTIME_VID_PID=6324:1719\n");
                  evidence.append("HOST_APPLICATION_OUTPUT_COUNT=0\n");
                  evidence.append("STARTUP_COMMAND_SENT=false\n");
                  evidence.append("AUTH_REPLY_SENT=false\n");
                  evidence.append("FEATURE_REPORT_USED=false\n");
                  evidence.append("FLASH_WRITE_ERASE_RECOVERY=false\n");
                  evidence.append("NEW_LIVE_0X11_SENT=false\n");

                  IntentFilter pf=new IntentFilter(USB_PERMISSION);

                  if(Build.VERSION.SDK_INT>=33)
                      registerReceiver(
                          permissionRx,pf,Context.RECEIVER_NOT_EXPORTED);
                  else
                      registerReceiver(permissionRx,pf);

                  LinearLayout root=new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(28,28,28,28);

                  TextView title=new TextView(this);
                  title.setText(
                      "OKN BP1048P4 V37 — Zero-output fast IF4 control-IN");
                  title.setTextSize(20);
                  root.addView(title);

                  TextView note=new TextView(this);
                  note.setText(
                      "\nอ่านอย่างเดียว 100%\n"+
                      "• ไม่ส่ง startup\n"+
                      "• ไม่ส่ง auth reply\n"+
                      "• ไม่มี Output/Feature report\n"+
                      "• ไม่ส่ง 0x11\n"+
                      "• ไม่ flash/erase/write\n\n"+
                      "VERIFY ก่อน แล้วกด FAST IF4 CONTROL-IN PROBE 20s\n");
                  root.addView(note);

                  add(
                      root,
                      "REQUEST USB PERMISSION + VERIFY EXACT BOARD",
                      v->scan(true));

                  probeButton=add(
                      root,
                      "FAST IF4 CONTROL-IN PROBE 20s",
                      v->startProbe());

                  probeButton.setEnabled(false);

                  add(
                      root,
                      "SAVE FULL EVIDENCE REPORT",
                      v->saveEvidence());

                  log=new TextView(this);
                  log.setTextIsSelectable(true);
                  log.setText("\nLog:\n");
                  root.addView(log);

                  ScrollView sv=new ScrollView(this);
                  sv.addView(root);
                  setContentView(sv);

                  scan(false);
              }

              private Button add(
                  LinearLayout root,
                  String text,
                  android.view.View.OnClickListener l) {

                  Button b=new Button(this);
                  b.setAllCaps(false);
                  b.setText(text);
                  b.setOnClickListener(l);
                  root.addView(b);
                  return b;
              }

              private void line(String s) {
                  long ms=SystemClock.elapsedRealtime()-t0;
                  String row=String.format(
                      Locale.US,"[%06dms] %s\n",ms,s);

                  evidence.append(row);

                  runOnUiThread(()->{
                      if(log!=null)log.append(row);
                  });
              }

              private UsbDevice getDevice(Intent i) {
                  if(Build.VERSION.SDK_INT>=33)
                      return i.getParcelableExtra(
                          UsbManager.EXTRA_DEVICE,UsbDevice.class);

                  return i.getParcelableExtra(
                      UsbManager.EXTRA_DEVICE);
              }

              private boolean runtime(UsbDevice d) {
                  return d!=null &&
                      d.getVendorId()==VID &&
                      d.getProductId()==PID;
              }

              private String dev(UsbDevice d) {
                  if(d==null)return " device=<NULL>";

                  return String.format(
                      Locale.US,
                      " vid=%04X pid=%04X id=%d ifaces=%d",
                      d.getVendorId(),
                      d.getProductId(),
                      d.getDeviceId(),
                      d.getInterfaceCount());
              }

              private void scan(boolean requestPermission) {
                  UsbDevice target=null;

                  for(UsbDevice d:usb.getDeviceList().values()) {
                      line(
                          "USB_DEVICE="+dev(d)+
                          " permission="+usb.hasPermission(d));

                      if(runtime(d))
                          target=d;
                  }

                  if(target==null) {
                      exactFingerprint=false;
                      probeButton.setEnabled(false);
                      line("RUNTIME_TARGET_FOUND=false");
                      return;
                  }

                  line("RUNTIME_TARGET_FOUND=true");

                  if(!usb.hasPermission(target)) {
                      line("USB_PERMISSION=false");

                      if(requestPermission) {
                          Intent intent=new Intent(USB_PERMISSION)
                              .setPackage(getPackageName());

                          PendingIntent pi=PendingIntent.getBroadcast(
                              this,
                              target.getDeviceId(),
                              intent,
                              PendingIntent.FLAG_UPDATE_CURRENT|
                              PendingIntent.FLAG_MUTABLE);

                          usb.requestPermission(target,pi);
                          line("USB_PERMISSION_REQUESTED=true");
                      }

                      return;
                  }

                  verify(target);
              }

              private Map<Integer,Integer> hidLengths(byte[] raw) {
                  Map<Integer,Integer> out=new HashMap<>();
                  int p=0,currentIf=-1,currentClass=-1;

                  while(raw!=null && p+2<=raw.length) {
                      int len=raw[p]&255;
                      int type=raw[p+1]&255;

                      if(len<2 || p+len>raw.length)
                          break;

                      if(type==0x04 && len>=9) {
                          currentIf=raw[p+2]&255;
                          currentClass=raw[p+5]&255;

                      } else if(
                          type==0x21 &&
                          currentClass==3 &&
                          currentIf>=0 &&
                          len>=9) {

                          int n=raw[p+5]&255;
                          int q=p+6;

                          for(
                              int k=0;
                              k<n && q+2<p+len;
                              k++,q+=3) {

                              int dtype=raw[q]&255;
                              int dlen=
                                  (raw[q+1]&255)|
                                  ((raw[q+2]&255)<<8);

                              if(dtype==0x22 && dlen>0) {
                                  out.put(currentIf,dlen);
                                  break;
                              }
                          }
                      }

                      p+=len;
                  }

                  return out;
              }

              private byte[] reportDescriptor(
                  UsbDeviceConnection c,
                  UsbInterface x,
                  int expected) {

                  byte[] b=new byte[expected];

                  int r=c.controlTransfer(
                      0x81,0x06,0x2200,x.getId(),
                      b,b.length,1200);

                  line(
                      "IF"+x.getId()+
                      "_REPORT_DESCRIPTOR_RESULT="+r);

                  if(r<=0)
                      return null;

                  byte[] exact=Arrays.copyOf(b,r);

                  line(
                      "IF"+x.getId()+
                      "_REPORT_DESCRIPTOR_SHA256="+
                      sha256(exact));

                  return exact;
              }

              private byte[] recoverIf3(
                  UsbDeviceConnection c,
                  UsbInterface if3,
                  int expected) {

                  byte[] b=reportDescriptor(c,if3,expected);

                  if(b!=null && IF3_SHA.equals(sha256(b)))
                      return b;

                  boolean cl=c.claimInterface(if3,false);
                  line("IF3_TEMP_CLAIM_FORCE_FALSE="+cl);

                  if(cl) {
                      try {
                          b=reportDescriptor(c,if3,expected);
                      } finally {
                          line(
                              "IF3_TEMP_RELEASE_FORCE_FALSE="+
                              c.releaseInterface(if3));
                      }
                  }

                  if(b!=null && IF3_SHA.equals(sha256(b)))
                      return b;

                  boolean clf=c.claimInterface(if3,true);
                  line("IF3_TEMP_CLAIM_FORCE_TRUE="+clf);

                  if(clf) {
                      try {
                          b=reportDescriptor(c,if3,expected);
                      } finally {
                          line(
                              "IF3_TEMP_RELEASE_FORCE_TRUE="+
                              c.releaseInterface(if3));
                      }
                  }

                  return b;
              }

              private void verify(UsbDevice d) {
                  exactFingerprint=false;

                  UsbDeviceConnection c=usb.openDevice(d);

                  if(c==null) {
                      line("VERIFY_OPEN_NULL=true");
                      probeButton.setEnabled(false);
                      return;
                  }

                  try {
                      byte[] raw=c.getRawDescriptors();

                      if(raw==null || raw.length==0) {
                          line("RAW_DESCRIPTOR_EMPTY=true");
                          return;
                      }

                      String rawSha=sha256(raw);

                      line("RAW_DESCRIPTOR_BYTES="+raw.length);
                      line("RAW_DESCRIPTOR_SHA256="+rawSha);

                      Map<Integer,Integer> lens=hidLengths(raw);

                      UsbInterface if3=null;
                      UsbInterface if4=null;

                      for(int i=0;i<d.getInterfaceCount();i++) {
                          UsbInterface x=d.getInterface(i);

                          if(
                              x.getInterfaceClass()==3 &&
                              x.getId()==3)
                              if3=x;

                          if(
                              x.getInterfaceClass()==3 &&
                              x.getId()==4)
                              if4=x;
                      }

                      if(if3==null || if4==null) {
                          line(
                              "REQUIRED_HID_INTERFACES_MISSING=true");
                          return;
                      }

                      byte[] h4=reportDescriptor(
                          c,
                          if4,
                          lens.containsKey(4)?
                              lens.get(4):36);

                      byte[] h3=recoverIf3(
                          c,
                          if3,
                          lens.containsKey(3)?
                              lens.get(3):33);

                      boolean rawOk=RAW_SHA.equals(rawSha);
                      boolean if3Ok=
                          h3!=null &&
                          IF3_SHA.equals(sha256(h3));
                      boolean if4Ok=
                          h4!=null &&
                          IF4_SHA.equals(sha256(h4));

                      exactFingerprint=
                          rawOk && if3Ok && if4Ok;

                      line("RAW_FINGERPRINT_OK="+rawOk);
                      line("IF3_FINGERPRINT_OK="+if3Ok);
                      line("IF4_FINGERPRINT_OK="+if4Ok);
                      line(
                          "V37_EXACT_RUNTIME_FINGERPRINT_OK="+
                          exactFingerprint);

                  } finally {
                      c.close();
                      probeButton.setEnabled(
                          exactFingerprint && !probeRunning);
                  }
              }

              private void startProbe() {
                  if(!exactFingerprint || probeRunning) {
                      line("V37_PROBE_BLOCKED=true");
                      return;
                  }

                  probeRunning=true;
                  probeButton.setEnabled(false);

                  new Thread(
                      this::runProbe,
                      "v37-fast-if4-control-in").start();
              }

              private void runProbe() {
                  UsbDevice target=null;

                  for(UsbDevice d:usb.getDeviceList().values())
                      if(runtime(d))
                          target=d;

                  if(
                      target==null ||
                      !usb.hasPermission(target)) {

                      line(
                          "V37_PROBE_ABORT_TARGET_OR_PERMISSION=true");
                      finishProbe();
                      return;
                  }

                  UsbInterface if4=null;

                  for(
                      int i=0;
                      i<target.getInterfaceCount();
                      i++) {

                      UsbInterface x=target.getInterface(i);

                      if(
                          x.getInterfaceClass()==3 &&
                          x.getId()==4) {

                          if4=x;
                          break;
                      }
                  }

                  if(if4==null) {
                      line("V37_PROBE_ABORT_IF4_MISSING=true");
                      finishProbe();
                      return;
                  }

                  UsbDeviceConnection c=usb.openDevice(target);

                  if(c==null) {
                      line("V37_PROBE_ABORT_OPEN_NULL=true");
                      finishProbe();
                      return;
                  }

                  boolean claimed=c.claimInterface(if4,false);

                  line("V37_IF4_CLAIM_FORCE_FALSE="+claimed);

                  final ArrayList<Captured> captured=
                      new ArrayList<>();

                  long start=SystemClock.elapsedRealtime();
                  long deadline=start+20000;

                  int iterations=0;
                  int positiveResults=0;
                  int nonZeroResults=0;
                  int zeroResults=0;
                  int negativeResults=0;
                  int duplicateNonZero=0;

                  String lastNonZeroSha=null;

                  try {
                      line("V37_FAST_PROBE_STARTED=true");
                      line("HOST_APPLICATION_OUTPUT_COUNT=0");

                      while(
                          SystemClock.elapsedRealtime()<deadline &&
                          iterations<10000) {

                          byte[] input=new byte[256];

                          int r=c.controlTransfer(
                              0xA1,0x01,0x0100,if4.getId(),
                              input,input.length,50);

                          iterations++;

                          if(r<0) {
                              negativeResults++;
                              continue;
                          }

                          if(r==0) {
                              zeroResults++;
                              continue;
                          }

                          positiveResults++;

                          byte[] exact=Arrays.copyOf(input,r);

                          boolean nonZero=false;

                          for(byte z:exact) {
                              if(z!=0) {
                                  nonZero=true;
                                  break;
                              }
                          }

                          if(!nonZero)
                              continue;

                          nonZeroResults++;

                          String sh=sha256(exact);

                          if(sh.equals(lastNonZeroSha))
                              duplicateNonZero++;

                          lastNonZeroSha=sh;

                          if(captured.size()<512) {
                              captured.add(
                                  new Captured(
                                      SystemClock.elapsedRealtime()-start,
                                      r,
                                      exact));
                          }
                      }

                      long elapsed=
                          SystemClock.elapsedRealtime()-start;

                      line("V37_PROBE_ELAPSED_MS="+elapsed);
                      line("V37_ITERATIONS="+iterations);
                      line(
                          "V37_POSITIVE_RESULT_COUNT="+
                          positiveResults);
                      line(
                          "V37_ZERO_RESULT_COUNT="+
                          zeroResults);
                      line(
                          "V37_NEGATIVE_RESULT_COUNT="+
                          negativeResults);
                      line(
                          "V37_NONZERO_REPORT_COUNT="+
                          nonZeroResults);
                      line(
                          "V37_DUPLICATE_NONZERO_COUNT="+
                          duplicateNonZero);
                      line(
                          "V37_STORED_NONZERO_COUNT="+
                          captured.size());

                      for(int i=0;i<captured.size();i++) {
                          Captured x=captured.get(i);

                          line(
                              "V37_CAPTURE_"+(i+1)+
                              "_ELAPSED_MS="+x.elapsedMs+
                              " RESULT="+x.result+
                              " SHA256="+sha256(x.bytes)+
                              " HEX="+hex(x.bytes));
                      }

                      line(
                          "V37_SPONTANEOUS_VENDOR_DATA_SEEN="+
                          (nonZeroResults>0));

                      line("HOST_APPLICATION_OUTPUT_COUNT=0");
                      line("STARTUP_COMMAND_SENT=false");
                      line("AUTH_REPLY_SENT=false");
                      line("FEATURE_REPORT_USED=false");
                      line("FLASH_WRITE_ERASE_RECOVERY=false");
                      line("NEW_LIVE_0X11_SENT=false");
                      line("V37_PROBE_COMPLETE=true");

                  } catch(Exception ex) {
                      line(
                          "V37_PROBE_EXCEPTION="+
                          ex.getClass().getName()+":"+
                          ex.getMessage());

                  } finally {
                      if(claimed) {
                          try {
                              line(
                                  "V37_IF4_RELEASE="+
                                  c.releaseInterface(if4));
                          } catch(Exception ex) {
                              line(
                                  "V37_RELEASE_EXCEPTION="+
                                  ex.getClass().getName());
                          }
                      }

                      c.close();
                      finishProbe();
                  }
              }

              private void finishProbe() {
                  probeRunning=false;

                  runOnUiThread(
                      ()->probeButton.setEnabled(exactFingerprint));
              }

              private void saveEvidence() {
                  Intent i=
                      new Intent(Intent.ACTION_CREATE_DOCUMENT);

                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("text/plain");

                  i.putExtra(
                      Intent.EXTRA_TITLE,
                      "OKN_BP1048P4_V37_ZERO_OUTPUT_FAST_IF4_CONTROL_IN_EVIDENCE.txt");

                  startActivityForResult(i,SAVE_EVIDENCE);
              }

              @Override protected void onActivityResult(
                  int requestCode,
                  int resultCode,
                  Intent data) {

                  super.onActivityResult(
                      requestCode,resultCode,data);

                  if(
                      requestCode==SAVE_EVIDENCE &&
                      resultCode==RESULT_OK &&
                      data!=null) {

                      try(OutputStream os=
                          getContentResolver()
                          .openOutputStream(data.getData())) {

                          String footer=
                              "\nEXPORT_EXACT_RUNTIME_FINGERPRINT_OK="+
                              exactFingerprint+
                              "\nEXPORT_HOST_APPLICATION_OUTPUT_COUNT=0"+
                              "\nEXPORT_STARTUP_COMMAND_SENT=false"+
                              "\nEXPORT_AUTH_REPLY_SENT=false"+
                              "\nEXPORT_FEATURE_REPORT_USED=false"+
                              "\nEXPORT_FLASH_WRITE_ERASE_RECOVERY=false"+
                              "\nEXPORT_NEW_LIVE_0X11_SENT=false"+
                              "\nEXPORT_FLASH_ALLOWED=NO\n";

                          os.write(
                              (evidence.toString()+footer)
                              .getBytes(StandardCharsets.UTF_8));

                          line("EVIDENCE_EXPORT_OK=true");

                      } catch(Exception ex) {
                          line(
                              "EVIDENCE_EXPORT_ERROR="+ex);
                      }
                  }
              }

              private static String hex(byte[] b) {
                  StringBuilder s=
                      new StringBuilder(b.length*2);

                  for(byte x:b)
                      s.append(
                          String.format(
                              Locale.US,"%02X",x&255));

                  return s.toString();
              }

              private static String sha256(byte[] b) {
                  try {
                      MessageDigest md=
                          MessageDigest.getInstance("SHA-256");

                      return hex(md.digest(b));

                  } catch(Exception e) {
                      return "SHA256_ERROR";
                  }
              }

              @Override protected void onDestroy() {
                  try {
                      unregisterReceiver(permissionRx);
                  } catch(Exception ignored) {}

                  super.onDestroy();
              }
          }
          JAVA

      - name: Static zero-output safety audit
        shell: bash
        run: |
          set -euo pipefail

          SRC=/tmp/v37/app/app/src/main/java/com/okn/bp1048p4v37/MainActivity.java

          python3 - <<'PY'
          from pathlib import Path

          t=Path(
              "/tmp/v37/app/app/src/main/java/com/okn/bp1048p4v37/MainActivity.java"
          ).read_text()

          required=[
              "0xA1,0x01,0x0100",
              "V37_NONZERO_REPORT_COUNT=",
              "V37_SPONTANEOUS_VENDOR_DATA_SEEN=",
              "HOST_APPLICATION_OUTPUT_COUNT=0",
              "STARTUP_COMMAND_SENT=false",
              "AUTH_REPLY_SENT=false",
              "FEATURE_REPORT_USED=false",
              "FLASH_WRITE_ERASE_RECOVERY=false",
              "NEW_LIVE_0X11_SENT=false",
              "V37_EXACT_RUNTIME_FINGERPRINT_OK="
          ]

          missing=[
              x for x in required
              if x not in t
          ]

          if missing:
              raise SystemExit(
                  "missing required token(s): "+
                  repr(missing))

          forbidden=[
              "USB_DIR_OUT",
              "bulkTransfer(",
              "UsbRequest",
              "0x21,0x09",
              "0x21, 0x09",
              "HidD_SetOutputReport",
              "HidD_SetFeature",
              "FLASH_BOOT_EN",
              "chiperas",
              "codedata",
              "bootdat",
              "constdat",
              "cnfgdat",
              "btupdat",
              "upinfo",
              "cxxx",
              "STARTUP_PREFIX",
              "AUTH_ANDROID_WIRE"
          ]

          bad=[
              x for x in forbidden
              if x in t
          ]

          if bad:
              raise SystemExit(
                  "forbidden output/destructive token(s): "+
                  repr(bad))

          # Exactly two controlTransfer call sites:
          # 1) HID report-descriptor GET_DESCRIPTOR (control-IN)
          # 2) IF4 HID Input GET_REPORT (control-IN)
          if t.count("controlTransfer(") != 2:
              raise SystemExit(
                  "expected exactly two control-IN call sites")

          if "0x81,0x06,0x2200" not in t:
              raise SystemExit(
                  "descriptor control-IN missing")

          if "0xA1,0x01,0x0100" not in t:
              raise SystemExit(
                  "IF4 Input GET_REPORT control-IN missing")

          print(
              "V37_STATIC_ZERO_OUTPUT_CONTROL_IN_AUDIT=PASS")
          PY

          cp "$SRC" /tmp/v37/evidence/MainActivity.java
          sha256sum "$SRC" \
