      - name: Final build decision
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/v37/evidence/04_V37_FINAL_DECISION.md <<'EOF'
          # MASTER V37 FINAL DECISION

          V36 proves:
          - IF3 is Consumer Control HID with one 64-byte interrupt-IN endpoint.
          - IF4 is vendor HID with no interrupt endpoints.
          - IF4 report descriptor defines 256-byte Input and Output reports plus
            an 8-byte Feature report.

          Therefore the production vendor receive path is IF4 HID control
          GET_REPORT, not the IF3 Consumer Control interrupt endpoint.

          V37 is a bounded zero-output experiment:
          - exact runtime fingerprint required,
          - IF4 Input GET_REPORT only,
          - tight 20-second loop with no per-iteration UI logging,
          - reports buffered in RAM and emitted after capture,
          - no Output report,
          - no startup,
          - no auth reply,
          - no Feature report,
          - no byte 0x11 transmitted,
          - no flash/erase/write.

          Goal:
          determine whether any spontaneous vendor IF4 Input data exists without a
          host command and measure the practical control-IN polling path without
          contaminating it with the logging delay that affected V31.

          Classification:
          ZERO_OUTPUT_FAST_IF4_CONTROL_IN_DIAGNOSTIC_NOT_FOR_FLASH
          EOF

          cp /tmp/v37/evidence/* /tmp/v37/out/

          (
            cd /tmp/v37/out &&
            sha256sum * > SHA256SUMS.txt
          )

          cat \
            /tmp/v37/evidence/04_V37_FINAL_DECISION.md \
            >> "$GITHUB_STEP_SUMMARY"

