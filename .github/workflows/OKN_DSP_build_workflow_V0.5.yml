name: Build OKN DSP APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ZIP_NAME: OKN_DSP_Android_BLE_Logger_V0.5.zip
  GRADLE_VERSION: '8.10'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$ZIP_NAME" ]; then
            found="$(find . -maxdepth 2 -type f -iname '*OKN*DSP*V0.5*.zip' -print -quit)"
            if [ -z "$found" ]; then
              echo "ERROR: $ZIP_NAME was not found in the repository root."
              echo "Upload the separate project ZIP first, then upload this workflow."
              exit 1
            fi
            cp "$found" "$ZIP_NAME"
          fi
          echo "Using $ZIP_NAME"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir project
          unzip -q "$ZIP_NAME" -d project
          root="$(find project -mindepth 1 -maxdepth 2 -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          if [ -z "$root" ]; then
            echo "ERROR: settings.gradle.kts was not found after extracting the project ZIP."
            find project -maxdepth 4 -type f | sort
            exit 1
          fi
          echo "PROJECT_ROOT=$root" >> "$GITHUB_ENV"
          echo "Project root: $root"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-v0.5.0-debug
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: success()
        run: |
          echo "## OKN DSP APK v0.5.0" >> "$GITHUB_STEP_SUMMARY"
          echo "Build completed successfully." >> "$GITHUB_STEP_SUMMARY"
          echo "Download artifact: **OKN-DSP-v0.5.0-debug**" >> "$GITHUB_STEP_SUMMARY"
