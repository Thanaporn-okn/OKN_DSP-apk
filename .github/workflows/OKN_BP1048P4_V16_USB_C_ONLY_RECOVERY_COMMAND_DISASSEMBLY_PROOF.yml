name: OKN BP1048P4 V16 USB-C ONLY RECOVERY COMMAND DISASSEMBLY PROOF

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/OKN_BP1048P4_V16_USB_C_ONLY_RECOVERY_COMMAND_DISASSEMBLY_PROOF.yml'

permissions:
  contents: read

env:
  SDK_REPO: "https://github.com/leadercxn/bp1048_sdk_v0.1.12.git"
  SDK_COMMIT: "8105bd864b04995d81c9f9ae77cb158259f39015"
  EXPECTED_FLASHBOOT_SHA256: "6b632435152478ecd6a8c3697b044caf253630f70923b27c8cbe8baa509148a6"

  REQUIRED_PATH: "Samsung Galaxy S25+ -> USB-C cable -> DSP USB-C only"

  SOLDER_ALLOWED: "NO"
  BOARD_MOD_ALLOWED: "NO"
  JTAG_ALLOWED: "NO"
  SDP_ALLOWED: "NO"
  AICE_ALLOWED: "NO"
  HARDWARE_PROBE_ALLOWED: "NO"
  LIVE_USB_COMMAND_ALLOWED: "NO"
  FLASH_READ_ALLOWED: "NO"
  FLASH_WRITE_ALLOWED: "NO"
  FLASH_ERASE_ALLOWED: "NO"

jobs:
  static_proof:
    name: V16 disassemble FlashBoot recovery command handlers
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Enforce USB-C-only constraints
        shell: bash
        run: |
          set -euo pipefail
          for v in SOLDER_ALLOWED BOARD_MOD_ALLOWED JTAG_ALLOWED SDP_ALLOWED AICE_ALLOWED HARDWARE_PROBE_ALLOWED LIVE_USB_COMMAND_ALLOWED FLASH_READ_ALLOWED FLASH_WRITE_ALLOWED FLASH_ERASE_ALLOWED; do
            test "${!v}" = "NO"
          done

          rm -rf /tmp/v16
          mkdir -p /tmp/v16/evidence /tmp/v16/tool

          cat > /tmp/v16/evidence/SAFETY.txt <<'EOF'
          REQUIRED_PATH=Samsung Galaxy S25+ -> USB-C cable -> DSP USB-C only
          SOLDER_ALLOWED=NO
          BOARD_MOD_ALLOWED=NO
          JTAG_ALLOWED=NO
          SDP_ALLOWED=NO
          AICE_ALLOWED=NO
          HARDWARE_PROBE_ALLOWED=NO
          LIVE_USB_COMMAND_ALLOWED=NO
          TARGET_CONNECTED=NO
          USB_CONTROL_TRANSFER_EXECUTED=NO
          FLASH_READ_EXECUTED=NO
          FLASH_WRITE_EXECUTED=NO
          FLASH_ERASE_EXECUTED=NO
          RUNTIME_OPCODE_0x11_EXECUTED=NO
          EOF

      - name: Fetch pinned SDK and reconstruct exact FlashBoot
        shell: bash
        run: |
          set -euo pipefail
          S=/tmp/v16/sdk
          E=/tmp/v16/evidence

          git clone -q "$SDK_REPO" "$S"
          git -C "$S" checkout -q "$SDK_COMMIT"
          test "$(git -C "$S" rev-parse HEAD)" = "$SDK_COMMIT"
          git -C "$S" rev-parse HEAD > "$E/SDK_COMMIT.txt"

          cd "$S"
          mapfile -t DIRS < <(find BT_Audio_APP MVsB1_Base_SDK develop_lib -type d | sort)
          ARGS=()
          for d in "${DIRS[@]}"; do ARGS+=("-I$d"); done

          gcc -E -P "${ARGS[@]}" \
            BT_Audio_APP/bt_audio_app_src/device/flash_boot.c \
            -o /tmp/v16/flash_boot.pre.c

          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib, json

          src=Path('/tmp/v16/flash_boot.pre.c').read_text(errors='replace')
          E=Path('/tmp/v16/evidence')

          m=re.search(
              r'const\s+unsigned\s+char\s+flash_data\s*\[\s*65536\s*\]\s*=\s*\{(.*?)\}\s*;',
              src,re.S
          )
          if not m:
              raise RuntimeError('flash_data[65536] initializer missing')

          body=m.group(1)
          toks=[]
          buf=[]
          depth=0
          for ch in body:
              if ch == '(':
                  depth += 1; buf.append(ch)
              elif ch == ')':
                  depth=max(0,depth-1); buf.append(ch)
              elif ch == ',' and depth == 0:
                  s=''.join(buf).strip()
                  if s: toks.append(s)
                  buf=[]
              else:
                  buf.append(ch)
          s=''.join(buf).strip()
          if s: toks.append(s)

          values=[]
          for idx,t in enumerate(toks):
              t=re.sub(r'(?i)(0x[0-9a-f]+|\b\d+)(?:u|ul|ull|l|ll)\b',r'\1',t).strip()
              if not re.fullmatch(r'[0-9a-fA-FxX\s()+\-*/%<>&|~]+',t):
                  raise RuntimeError(f'unresolved token {idx}: {t}')
              values.append(eval(t,{'__builtins__':{}},{}) & 0xff)

          if len(values) != 65536:
              raise RuntimeError(f'FlashBoot size {len(values)} != 65536')

          b=bytes(values)
          Path('/tmp/v16/flash_boot.bin').write_bytes(b)
          sha=hashlib.sha256(b).hexdigest()

          (E/'V16_FLASHBOOT.json').write_text(json.dumps({
              'bytes':len(b),'sha256':sha
          },indent=2)+'\n')
          PY

          test "$(sha256sum /tmp/v16/flash_boot.bin | awk '{print $1}')" = "$EXPECTED_FLASHBOOT_SHA256"

      - name: Build GNU NDS32 objdump
        shell: bash
        run: |
          set -euo pipefail
          E=/tmp/v16/evidence
          cd /tmp/v16/tool

          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential curl xz-utils bison flex texinfo zlib1g-dev >/dev/null

          BINUTILS_VER=2.42
          curl -fL --retry 3 --connect-timeout 15 --max-time 120 \
            "https://ftp.gnu.org/gnu/binutils/binutils-${BINUTILS_VER}.tar.xz" \
            -o binutils.tar.xz

          tar -xf binutils.tar.xz
          mkdir build
          cd build

          ../binutils-${BINUTILS_VER}/configure \
            --target=nds32le-elf \
            --disable-nls \
            --disable-werror \
            --disable-gdb \
            --disable-gprofng \
            --disable-gas \
            --disable-ld \
            > "$E/BINUTILS_CONFIGURE.txt" 2>&1

          make -j2 all-binutils > "$E/BINUTILS_BUILD.txt" 2>&1

          OBJDUMP=/tmp/v16/tool/build/binutils/objdump
          test -x "$OBJDUMP"
          "$OBJDUMP" --version > "$E/OBJDUMP_VERSION.txt"
          "$OBJDUMP" -i > "$E/OBJDUMP_TARGETS.txt"
          grep -qi 'nds32' "$E/OBJDUMP_TARGETS.txt"

      - name: Disassemble NDS32 FlashBoot
        shell: bash
        run: |
          set -euo pipefail
          E=/tmp/v16/evidence
          OBJDUMP=/tmp/v16/tool/build/binutils/objdump

          ok=0
          for arch in nds32 nds32:v3s nds32:v3; do
            if "$OBJDUMP" -D -z -b binary -m "$arch" -EL \
                /tmp/v16/flash_boot.bin \
                > /tmp/v16/flash_boot.dis 2> "$E/OBJDUMP_DISASM_STDERR.txt"; then
              echo "$arch" > "$E/OBJDUMP_ARCH.txt"
              ok=1
              break
            fi
          done

          test "$ok" -eq 1
          test -s /tmp/v16/flash_boot.dis
          grep -Eq '^[[:space:]]*[0-9a-f]+:' /tmp/v16/flash_boot.dis

      - name: Extract dispatcher function windows and call graph
        shell: bash
        run: |
          set -euo pipefail
          E=/tmp/v16/evidence

          python3 - <<'PY'
          from pathlib import Path
          import re,json,collections

          E=Path('/tmp/v16/evidence')
          text=Path('/tmp/v16/flash_boot.dis').read_text(errors='replace')
          lines=text.splitlines()

          funcs=[
              ('cxxx',     0x4C08, 0x4F9A),
              ('chiperas', 0x4F9A, 0x5064),
              ('bootdat',  0x5064, 0x51BC),
              ('codedata', 0x51BC, 0x52EE),
              ('constdat', 0x52EE, 0x53F2),
              ('cnfgdat',  0x53F2, 0x54F6),
              ('btupdat',  0x54F6, 0x5646),
              ('upinfo',   0x5646, 0x5800),
          ]

          addr_line=[]
          rx=re.compile(r'^\s*([0-9a-fA-F]+):\s+(.*)$')
          for line in lines:
              m=rx.match(line)
              if m:
                  addr_line.append((int(m.group(1),16),line,m.group(2)))

          def window(a,b):
              return [(addr,line,body) for addr,line,body in addr_line if a <= addr < b]

          out={}
          all_calls=[]
          for name,start,end in funcs:
              rows=window(start,end)
              asm='\n'.join(x[1] for x in rows)
              calls=[]
              immediates=[]
              mem_offsets=[]
              for addr,line,body in rows:
                  # Common NDS32 call mnemonics.
                  if re.search(r'\b(?:jal|jral|bal)\b',body,re.I):
                      targets=re.findall(r'\b(?:0x)?([0-9a-fA-F]{3,8})\b',body)
                      calls.append({'site':f'0x{addr:04X}','asm':body,'tokens':targets})
                      all_calls.append({'function':name,'site':addr,'asm':body})
                  immediates += re.findall(r'(?<![A-Za-z0-9_])(?:0x)?[0-9a-fA-F]{2,8}(?![A-Za-z0-9_])',body)
                  mem_offsets += re.findall(r'\[[^\]]+\]',body)

              # Keep useful constants, without pretending they are protocol fields yet.
              count=collections.Counter(x.lower() for x in immediates)
              top=[{'token':k,'count':v} for k,v in count.most_common(80)]

              out[name]={
                  'start':f'0x{start:04X}',
                  'end_exclusive':f'0x{end:04X}',
                  'instruction_lines':len(rows),
                  'calls':calls,
                  'top_numeric_tokens':top
              }
              (E/f'DISASM_{name.upper()}.txt').write_text(asm+'\n')

          known_read_sites=[0x515E,0x52A6,0x5544,0x5606]
          read_site_evidence=[]
          amap={a:(line,body) for a,line,body in addr_line}
          addrs=[a for a,_,_ in addr_line]

          for site in known_read_sites:
              nearest=sorted(addrs,key=lambda x:abs(x-site))[:9]
              nearest=sorted(x for x in nearest if abs(x-site) <= 20)
              read_site_evidence.append({
                  'expected_site':f'0x{site:04X}',
                  'nearby':[amap[x][0] for x in nearest]
              })

          result={
              'dispatcher_functions':out,
              'known_spiflashread_address':'0x00000E0E',
              'known_dispatcher_spiflashread_call_sites':[
                  '0x0000515E','0x000052A6','0x00005544','0x00005606'
              ],
              'read_site_disassembly_evidence':read_site_evidence
          }
          (E/'V16_DISPATCHER_DISASSEMBLY.json').write_text(
              json.dumps(result,indent=2)+'\n'
          )

          with (E/'V16_READ_VERIFY_SITES.txt').open('w') as f:
              for x in read_site_evidence:
                  f.write(f"===== {x['expected_site']} =====\n")
                  f.write('\n'.join(x['nearby'])+'\n\n')
          PY

      - name: Recover command strings and raw dispatcher-adjacent data
        shell: bash
        run: |
          set -euo pipefail
          E=/tmp/v16/evidence

          python3 - <<'PY'
          from pathlib import Path
          import json,binascii

          b=Path('/tmp/v16/flash_boot.bin').read_bytes()
          E=Path('/tmp/v16/evidence')
          cmds=['cxxx','chiperas','bootdat','codedata','constdat','cnfgdat','btupdat','upinfo']

          rows={}
          for c in cmds:
              off=b.find(c.encode())
              if off < 0:
                  raise RuntimeError(f'{c} missing')
              lo=max(0,off-64)
              hi=min(len(b),off+len(c)+64)
              rows[c]={
                  'string_offset':f'0x{off:04X}',
                  'context_start':f'0x{lo:04X}',
                  'context_hex':b[lo:hi].hex()
              }

          (E/'V16_COMMAND_STRING_CONTEXT.json').write_text(
              json.dumps(rows,indent=2)+'\n'
          )
          PY

      - name: Build conservative protocol matrix
        shell: bash
        run: |
          set -euo pipefail
          E=/tmp/v16/evidence

          python3 - <<'PY'
          from pathlib import Path
          import json

          E=Path('/tmp/v16/evidence')
          d=json.loads((E/'V16_DISPATCHER_DISASSEMBLY.json').read_text())

          matrix=[
            {
              'command':'cxxx',
              'dispatcher':'0x00004C08',
              'class':'session/control',
              'flash_mutating':'not proven',
              'read_verify_call_site':None,
              'live_safe':False
            },
            {
              'command':'chiperas',
              'dispatcher':'0x00004F9A',
              'class':'chip erase',
              'flash_mutating':True,
              'read_verify_call_site':None,
              'live_safe':False
            },
            {
              'command':'bootdat',
              'dispatcher':'0x00005064',
              'class':'boot data transfer',
              'flash_mutating':True,
              'read_verify_call_site':'0x0000515E',
              'live_safe':False
            },
            {
              'command':'codedata',
              'dispatcher':'0x000051BC',
              'class':'code data transfer',
              'flash_mutating':True,
              'read_verify_call_site':'0x000052A6',
              'live_safe':False
            },
            {
              'command':'constdat',
              'dispatcher':'0x000052EE',
              'class':'const data transfer',
              'flash_mutating':True,
              'read_verify_call_site':None,
              'live_safe':False
            },
            {
              'command':'cnfgdat',
              'dispatcher':'0x000053F2',
              'class':'config data transfer',
              'flash_mutating':True,
              'read_verify_call_site':None,
              'live_safe':False
            },
            {
              'command':'btupdat',
              'dispatcher':'0x000054F6',
              'class':'BT/update data transfer',
              'flash_mutating':True,
              'read_verify_call_site':['0x00005544','0x00005606'],
              'live_safe':False
            },
            {
              'command':'upinfo',
              'dispatcher':'0x00005646',
              'class':'update information/control',
              'flash_mutating':'not proven from command name alone',
              'read_verify_call_site':None,
              'live_safe':False
            }
          ]

          result={
              'transport':{
                  'recovery_vid_pid':'0000:2244',
                  'hid_interface':0,
                  'report_bytes':256,
                  'ep0_packet_bytes':64,
                  'set_report_setup':'21 09 00 02 00 00 00 01',
                  'get_report_setup':'A1 01 00 01 00 00 00 01'
              },
              'block_model':{
                  'known_flash_block_bytes':4096,
                  'reports_per_4096_block':16,
                  'note':'4096/256 = 16; exact command-header/data placement remains to be proven from dispatcher assembly.'
              },
              'commands':matrix,
              'generic_flash_readback_proven':False,
              'exact_payload_layout_fully_proven':False,
              'exact_ack_status_semantics_fully_proven':False,
              'exact_checksum_crc_semantics_fully_proven':False,
              'live_usb_command_permitted':False,
              'flash_erase_write_permitted':False,
              'next_target':'Use the generated per-command NDS32 disassembly windows to resolve exact byte offsets, lengths, ACK/status fields, address increments, checksums/CRC and command ordering before enabling any live recovery traffic.'
          }

          (E/'V16_RESULT.json').write_text(json.dumps(result,indent=2)+'\n')

          report=[
              '# BP1048P4 V16 — Recovery command disassembly proof','',
              '- Required path remains **Samsung Galaxy S25+ → USB-C → DSP USB-C only**.',
              '- Reconstructed and hash-verified the same 65,536-byte FlashBoot image proven in V15.',
              '- Built an NDS32-target GNU objdump and generated function-level disassembly for all eight recovery handlers.',
              '- Recovery transport remains interface 0 / 256-byte HID reports over 64-byte EP0.',
              '- Dispatcher addresses are recorded for `cxxx`, `chiperas`, `bootdat`, `codedata`, `constdat`, `cnfgdat`, `btupdat`, and `upinfo`.',
              '- Known internal `SpiFlashRead` verification call sites are captured around `0x515E`, `0x52A6`, `0x5544`, and `0x5606`.',
              '- Exact payload/ACK/checksum fields remain fail-closed until the generated disassembly evidence proves them.',
              '- No live USB command or flash operation is executed.'
          ]
          (E/'V16_REPORT.md').write_text('\n'.join(report)+'\n')
          PY

          cat "$E/V16_REPORT.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Final fail-closed assertions
        shell: bash
        run: |
          set -euo pipefail
          for v in SOLDER_ALLOWED BOARD_MOD_ALLOWED JTAG_ALLOWED SDP_ALLOWED AICE_ALLOWED HARDWARE_PROBE_ALLOWED LIVE_USB_COMMAND_ALLOWED FLASH_READ_ALLOWED FLASH_WRITE_ALLOWED FLASH_ERASE_ALLOWED; do
            test "${!v}" = "NO"
          done

          python3 - <<'PY'
          from pathlib import Path
          import json

          E=Path('/tmp/v16/evidence')
          safety=(E/'SAFETY.txt').read_text()
          for x in [
              'REQUIRED_PATH=Samsung Galaxy S25+ -> USB-C cable -> DSP USB-C only',
              'SOLDER_ALLOWED=NO','BOARD_MOD_ALLOWED=NO','JTAG_ALLOWED=NO',
              'SDP_ALLOWED=NO','AICE_ALLOWED=NO','HARDWARE_PROBE_ALLOWED=NO',
              'LIVE_USB_COMMAND_ALLOWED=NO','TARGET_CONNECTED=NO',
              'USB_CONTROL_TRANSFER_EXECUTED=NO',
              'FLASH_READ_EXECUTED=NO','FLASH_WRITE_EXECUTED=NO',
              'FLASH_ERASE_EXECUTED=NO','RUNTIME_OPCODE_0x11_EXECUTED=NO'
          ]:
              assert x in safety, x

          fb=json.loads((E/'V16_FLASHBOOT.json').read_text())
          r=json.loads((E/'V16_RESULT.json').read_text())

          assert fb['bytes'] == 65536
          assert fb['sha256'] == '6b632435152478ecd6a8c3697b044caf253630f70923b27c8cbe8baa509148a6'
          assert r['transport']['recovery_vid_pid'] == '0000:2244'
          assert r['transport']['hid_interface'] == 0
          assert r['transport']['report_bytes'] == 256
          assert r['generic_flash_readback_proven'] is False
          assert r['live_usb_command_permitted'] is False
          assert r['flash_erase_write_permitted'] is False

          for name in ['cxxx','chiperas','bootdat','codedata','constdat','cnfgdat','btupdat','upinfo']:
              p=E/f'DISASM_{name.upper()}.txt'
              assert p.exists() and p.stat().st_size > 0, name

          print('V16_RECOVERY_COMMAND_DISASSEMBLY_PROOF_COMPLETE=YES')
          print('REQUIRED_PATH=S25_PLUS_USB_C_TO_DSP_USB_C_ONLY')
          print('FLASHBOOT_SHA256=6b632435152478ecd6a8c3697b044caf253630f70923b27c8cbe8baa509148a6')
          print('LIVE_USB_COMMAND_ALLOWED=NO')
          print('FLASH_WRITE_ALLOWED=NO')
          print('SOLDER_ALLOWED=NO')
          print('BOARD_MOD_ALLOWED=NO')
          PY

      - name: Package V16 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v16/evidence
          zip -9 -r /tmp/OKN_BP1048P4_V16_RECOVERY_COMMAND_DISASSEMBLY_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/OKN_BP1048P4_V16_RECOVERY_COMMAND_DISASSEMBLY_EVIDENCE.zip \
            > /tmp/OKN_BP1048P4_V16_RECOVERY_COMMAND_DISASSEMBLY_EVIDENCE.zip.sha256

      - name: Upload V16 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OKN-BP1048P4-V16-RECOVERY-COMMAND-DISASSEMBLY-EVIDENCE
          path: |
            /tmp/OKN_BP1048P4_V16_RECOVERY_COMMAND_DISASSEMBLY_EVIDENCE.zip
            /tmp/OKN_BP1048P4_V16_RECOVERY_COMMAND_DISASSEMBLY_EVIDENCE.zip.sha256
            /tmp/v16/evidence/V16_REPORT.md
            /tmp/v16/evidence/V16_RESULT.json
            /tmp/v16/evidence/V16_FLASHBOOT.json
            /tmp/v16/evidence/V16_DISPATCHER_DISASSEMBLY.json
            /tmp/v16/evidence/V16_COMMAND_STRING_CONTEXT.json
            /tmp/v16/evidence/V16_READ_VERIFY_SITES.txt
            /tmp/v16/evidence/DISASM_CXXX.txt
            /tmp/v16/evidence/DISASM_CHIPERAS.txt
            /tmp/v16/evidence/DISASM_BOOTDAT.txt
            /tmp/v16/evidence/DISASM_CODEDATA.txt
            /tmp/v16/evidence/DISASM_CONSTDAT.txt
            /tmp/v16/evidence/DISASM_CNFGDAT.txt
            /tmp/v16/evidence/DISASM_BTUPDAT.txt
            /tmp/v16/evidence/DISASM_UPINFO.txt
            /tmp/v16/evidence/OBJDUMP_ARCH.txt
            /tmp/v16/evidence/OBJDUMP_VERSION.txt
            /tmp/v16/evidence/OBJDUMP_TARGETS.txt
            /tmp/v16/evidence/BINUTILS_CONFIGURE.txt
            /tmp/v16/evidence/BINUTILS_BUILD.txt
            /tmp/v16/evidence/SDK_COMMIT.txt
            /tmp/v16/evidence/SAFETY.txt
          if-no-files-found: warn
          retention-days: 90
