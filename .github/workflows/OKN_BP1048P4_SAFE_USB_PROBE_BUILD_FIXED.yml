name: OKN BP1048P4 Safe USB Probe APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/OKN_BP1048P4_SAFE_USB_PROBE_BUILD.yml'

permissions:
  contents: read

jobs:
  build-safe-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Create Safe Probe Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/com/okn/dsp/safeprobe

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "OKN_BP1048P4_SafeProbe"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.okn.dsp.safeprobe'
              compileSdk 35
              defaultConfig {
                  applicationId "com.okn.dsp.safeprobe"
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName "1.0-safeprobe"
              }
              buildTypes {
                  debug { debuggable true }
                  release { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.usb.host" android:required="true" />
              <application
                  android:allowBackup="false"
                  android:label="OKN Safe USB Probe"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/okn/dsp/safeprobe/MainActivity.java <<'EOF'
          package com.okn.dsp.safeprobe;

          import android.app.Activity;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.hardware.usb.UsbConstants;
          import android.hardware.usb.UsbDevice;
          import android.hardware.usb.UsbDeviceConnection;
          import android.hardware.usb.UsbEndpoint;
          import android.hardware.usb.UsbInterface;
          import android.hardware.usb.UsbManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.text.method.ScrollingMovementMethod;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import java.util.Locale;
          import java.util.Map;

          public final class MainActivity extends Activity {
              private static final String ACTION_USB_PERMISSION = "com.okn.dsp.safeprobe.USB_PERMISSION";
              private static final int TARGET_VID = 0x18B4;
              private static final int TARGET_PID = 0x06B7;
              private UsbManager usbManager;
              private UsbDevice selectedDevice;
              private TextView logView;
              private final StringBuilder log = new StringBuilder();

              private final BroadcastReceiver usbReceiver = new BroadcastReceiver() {
                  @Override public void onReceive(Context context, Intent intent) {
                      if (!ACTION_USB_PERMISSION.equals(intent.getAction())) return;
                      UsbDevice device;
                      if (Build.VERSION.SDK_INT >= 33) {
                          device = intent.getParcelableExtra(UsbManager.EXTRA_DEVICE, UsbDevice.class);
                      } else {
                          @SuppressWarnings("deprecation")
                          UsbDevice d = intent.getParcelableExtra(UsbManager.EXTRA_DEVICE);
                          device = d;
                      }
                      boolean granted = intent.getBooleanExtra(UsbManager.EXTRA_PERMISSION_GRANTED, false);
                      append("USB permission: " + granted);
                      if (granted && device != null) {
                          selectedDevice = device;
                          runSafeProbe(device);
                      }
                  }
              };

              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  usbManager = (UsbManager) getSystemService(Context.USB_SERVICE);
                  IntentFilter filter = new IntentFilter(ACTION_USB_PERMISSION);
                  if (Build.VERSION.SDK_INT >= 33) registerReceiver(usbReceiver, filter, Context.RECEIVER_NOT_EXPORTED);
                  else registerReceiver(usbReceiver, filter);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(24,24,24,24);

                  TextView title = new TextView(this);
                  title.setText("OKN BP1048P4 — SAFE USB PROBE");
                  title.setTextSize(20);
                  root.addView(title);

                  TextView warning = new TextView(this);
                  warning.setText("READ-ONLY: ไม่มี ERASE / PROGRAM / FLASH / SET_REPORT");
                  warning.setPadding(0,8,0,16);
                  root.addView(warning);

                  Button scan = new Button(this);
                  scan.setText("1. Scan USB");
                  scan.setOnClickListener(v -> scanUsb());
                  root.addView(scan);

                  Button probe = new Button(this);
                  probe.setText("2. Safe Probe Selected Device");
                  probe.setOnClickListener(v -> requestOrProbe());
                  root.addView(probe);

                  Button copy = new Button(this);
                  copy.setText("3. Copy Log");
                  copy.setOnClickListener(v -> copyLog());
                  root.addView(copy);

                  logView = new TextView(this);
                  logView.setTextIsSelectable(true);
                  logView.setMovementMethod(new ScrollingMovementMethod());
                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(logView, new ScrollView.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                  root.addView(scroll, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT,0,1f));
                  setContentView(root);

                  append("SAFE PROBE v1");
                  append("Android SDK: " + Build.VERSION.SDK_INT);
                  append("No USB OUT/SET_REPORT commands are implemented.");
                  scanUsb();
              }

              @Override protected void onDestroy() {
                  try { unregisterReceiver(usbReceiver); } catch (IllegalArgumentException ignored) {}
                  super.onDestroy();
              }

              private void scanUsb() {
                  selectedDevice = null;
                  append("");
                  append("=== USB DEVICE SCAN ===");
                  Map<String, UsbDevice> devices = usbManager.getDeviceList();
                  if (devices.isEmpty()) { append("No USB device detected."); return; }
                  UsbDevice fallback = null;
                  for (UsbDevice d : devices.values()) {
                      append(String.format(Locale.US,
                              "Device name=%s VID=%04X PID=%04X class=%02X sub=%02X proto=%02X ifaces=%d",
                              d.getDeviceName(), d.getVendorId(), d.getProductId(), d.getDeviceClass(),
                              d.getDeviceSubclass(), d.getDeviceProtocol(), d.getInterfaceCount()));
                      if (fallback == null) fallback = d;
                      if (d.getVendorId() == TARGET_VID && d.getProductId() == TARGET_PID) selectedDevice = d;
                  }
                  if (selectedDevice == null) {
                      selectedDevice = fallback;
                      append("Known 18B4:06B7 target not found; selected first USB device.");
                  } else append("Selected known BP1048P4 board: 18B4:06B7");
                  append("Permission already granted: " + usbManager.hasPermission(selectedDevice));
              }

              private void requestOrProbe() {
                  if (selectedDevice == null) scanUsb();
                  if (selectedDevice == null) return;
                  if (usbManager.hasPermission(selectedDevice)) { runSafeProbe(selectedDevice); return; }
                  int flags = PendingIntent.FLAG_UPDATE_CURRENT;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) flags |= PendingIntent.FLAG_MUTABLE;
                  PendingIntent pi = PendingIntent.getBroadcast(this,0,
                          new Intent(ACTION_USB_PERMISSION).setPackage(getPackageName()),flags);
                  append("Requesting Android USB permission...");
                  usbManager.requestPermission(selectedDevice, pi);
              }

              private void runSafeProbe(UsbDevice device) {
                  append("");
                  append("=== SAFE READ-ONLY PROBE ===");
                  append(String.format(Locale.US,"Target VID:PID = %04X:%04X", device.getVendorId(), device.getProductId()));
                  UsbDeviceConnection connection = usbManager.openDevice(device);
                  if (connection == null) { append("openDevice() failed."); return; }
                  try {
                      byte[] raw = connection.getRawDescriptors();
                      append("Raw device descriptors (" + raw.length + " bytes):");
                      append(hex(raw, raw.length));
                      for (int i=0; i<device.getInterfaceCount(); i++) {
                          UsbInterface intf = device.getInterface(i);
                          append("");
                          append(String.format(Locale.US,
                                  "IF index=%d id=%d class=%02X sub=%02X proto=%02X endpoints=%d",
                                  i,intf.getId(),intf.getInterfaceClass(),intf.getInterfaceSubclass(),
                                  intf.getInterfaceProtocol(),intf.getEndpointCount()));
                          for (int e=0; e<intf.getEndpointCount(); e++) {
                              UsbEndpoint ep = intf.getEndpoint(e);
                              append(String.format(Locale.US,
                                      "  EP addr=%02X dir=%s type=%d maxPacket=%d interval=%d",
                                      ep.getAddress(), ep.getDirection()==UsbConstants.USB_DIR_IN?"IN":"OUT",
                                      ep.getType(),ep.getMaxPacketSize(),ep.getInterval()));
                          }
                          if (intf.getInterfaceClass() == UsbConstants.USB_CLASS_HID) {
                              readHidDescriptor(connection,intf);
                              safeGetFeatureReport(connection,intf);
                              safeGetInputReport(connection,intf);
                          }
                      }
                      append("");
                      append("=== SAFE PROBE COMPLETE ===");
                      append("No USB OUT transfer, SET_REPORT, erase or program command was sent.");
                      append("Copy this entire log back to ChatGPT.");
                  } finally { connection.close(); }
              }

              private void readHidDescriptor(UsbDeviceConnection c, UsbInterface intf) {
                  byte[] report = new byte[1024];
                  int n = c.controlTransfer(0x81,0x06,0x22<<8,intf.getId(),report,report.length,1500);
                  append("  HID Report Descriptor GET_DESCRIPTOR result=" + n);
                  if (n > 0) append("  " + hex(report,n));
              }

              private void safeGetFeatureReport(UsbDeviceConnection c, UsbInterface intf) {
                  byte[] data = new byte[64];
                  int n = c.controlTransfer(0xA1,0x01,(3<<8),intf.getId(),data,data.length,1500);
                  append("  GET_REPORT Feature(type=3,id=0) result=" + n);
                  if (n > 0) append("  " + hex(data,n));
              }

              private void safeGetInputReport(UsbDeviceConnection c, UsbInterface intf) {
                  byte[] data = new byte[256];
                  int n = c.controlTransfer(0xA1,0x01,(1<<8),intf.getId(),data,data.length,1500);
                  append("  GET_REPORT Input(type=1,id=0) result=" + n);
                  if (n > 0) append("  " + hex(data,n));
              }

              private void copyLog() {
                  ClipboardManager cb = (ClipboardManager)getSystemService(CLIPBOARD_SERVICE);
                  cb.setPrimaryClip(ClipData.newPlainText("OKN Safe USB Probe",log.toString()));
                  append("Log copied to clipboard.");
              }

              private void append(String s) {
                  log.append(s).append('\n');
                  if (logView != null) logView.setText(log.toString());
              }

              private static String hex(byte[] data, int count) {
                  int n = Math.min(count,data.length);
                  StringBuilder out = new StringBuilder(n*3);
                  for (int i=0;i<n;i++) {
                      if (i!=0) out.append(' ');
                      out.append(String.format(Locale.US,"%02X",data[i]&0xFF));
                  }
                  return out.toString();
              }
          }
          EOF

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          sha256sum "$APK" | tee OKN_SAFE_USB_PROBE_APK_SHA256.txt
          cp "$APK" OKN_BP1048P4_SAFE_USB_PROBE.apk

      - name: Upload Safe Probe APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN_BP1048P4_SAFE_USB_PROBE
          path: |
            OKN_BP1048P4_SAFE_USB_PROBE.apk
            OKN_SAFE_USB_PROBE_APK_SHA256.txt
          if-no-files-found: error
          retention-days: 30
