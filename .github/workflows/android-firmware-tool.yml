name: OKN Android Firmware Tool R90 FIX1

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: okn-android-firmware-tool-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: /tmp/okn-android-firmware-tool
  PROJECT_TGZ_SHA256: 89b8f13ce6f3ebee0dee2c628ec3ff54cb9e74811a991e4f25b9bbb6717a658b
  SDK_REPO: https://github.com/leadercxn/bp1048_sdk_v0.1.12.git
  SDK_COMMIT: 8105bd864b04995d81c9f9ae77cb158259f39015
  READ_ONLY_FIRST: "YES"
  USB_VENDOR_OUT_ALLOWED: "NO"
  HID_SET_REPORT_ALLOWED: "NO"
  FLASH_ERASE_ALLOWED: "NO"
  FLASH_WRITE_ALLOWED: "NO"
  UNLOCK_ALLOWED: "NO"
  FULL_FLASH_READBACK_PROVEN: "NO"

jobs:
  build-test-package:
    name: Build + test read-only S25+ USB firmware tool
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fail-closed scope gate
        shell: bash
        run: |
          set -euo pipefail
          test "$READ_ONLY_FIRST" = "YES"
          test "$USB_VENDOR_OUT_ALLOWED" = "NO"
          test "$HID_SET_REPORT_ALLOWED" = "NO"
          test "$FLASH_ERASE_ALLOWED" = "NO"
          test "$FLASH_WRITE_ALLOWED" = "NO"
          test "$UNLOCK_ALLOWED" = "NO"
          test "$FULL_FLASH_READBACK_PROVEN" = "NO"
          rm -rf "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR/ci-output/evidence" "$PROJECT_DIR/ci-output/logs" "$PROJECT_DIR/ci-output/reports"
          cat > "$PROJECT_DIR/ci-output/evidence/00_SAFETY_GATE.txt" <<'EOF'
          TARGET=MVSilicon BP1048P4 family project evidence
          PHONE=Samsung Galaxy S25+
          PHYSICAL_PATH=Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only
          SOLDERING=NO
          BOARD_MODIFICATION=NO
          JTAG_SWD_UART_TESTPOINT=NO
          EXTERNAL_PROGRAMMER=NO
          READ_ONLY_FIRST=YES
          USB_VENDOR_OUT_COMMANDS=NO
          HID_SET_REPORT=NO
          ERASE=NO
          FLASH_WRITE=NO
          UNLOCK=NO
          FULL_FLASH_READBACK_PROVEN=NO
          EOF

      - name: Reconstruct complete Android project embedded in this one YML
