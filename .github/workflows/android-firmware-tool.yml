            },
            "static_alias_proof":alias_proof,
            "vm_summary":summary,
            "critical_state_hits":hit,
            "candidate_key_iv_pairs":uniq[:20],
            "create_decryptor_reached":(
              summary.get("global_reached_create_decryptor",False)
              or summary.get("reached_create_decryptor",False)
              or hit["402"]
            ),
            "crypto_stream_reached":hit["281"],
            "aes_decrypt_reached":(
              summary.get("reached_aes_decrypt",False)
              or any(
                x.get("kind")=="AES_DECRYPT"
