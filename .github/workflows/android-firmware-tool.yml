name: OKN R103 Firmware Readback Capability Auditor OFFLINE ONLY

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/android-firmware-tool.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: okn-r103-firmware-readback-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  OUT: /tmp/okn-r103
  ANDROID_URL: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-01.apk_.zip"
  WINDOWS_URL: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-08.exe_.zip"
  LIVE_BOARD_USB: "NO"
  HOST_TO_DEVICE_USB: "NO"
  FLASH_ERASE_WRITE: "NO"
  FLASH_ALLOWED: "NO"

jobs:
  audit:
    name: Audit official clients for true firmware readback capability / STATIC ONLY
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fail-closed offline-only scope gate
        shell: bash
        run: |
          set -euo pipefail
          test "$LIVE_BOARD_USB" = "NO"
          test "$HOST_TO_DEVICE_USB" = "NO"
          test "$FLASH_ERASE_WRITE" = "NO"
          test "$FLASH_ALLOWED" = "NO"
          rm -rf "$OUT"
          mkdir -p "$OUT"/{downloads,android,windows,decompiled,evidence,review}

          cat > "$OUT/evidence/00_SCOPE.txt" <<'EOF'
          REVISION=R103
          MODE=OFFLINE_STATIC_ONLY
          TARGET=GoloPine_DSTech_BP1048P4
          PRODUCTION_USB=6324:1719
          PRODUCTION_HID_USAGE=FF00:55AA
          UFE_READ_SENSOR=0x58
          UFE_READ_FIFO=0x61
          UFE_READ_BULK=0x63
          BOARD_USB_ACCESS=NO
          LIVE_USB_COMMANDS=NO
          HOST_TO_DEVICE_USB=NO
          SET_REPORT_LIVE=NO
          ERASE=NO
          WRITE=NO
          UNLOCK=NO
          FLASH_ALLOWED=NO
          GOAL=Determine_if_official_clients_expose_true_firmware_or_flash_readback_beyond_UFE_sensor_reads
          EOF

      - name: Install static-analysis utilities
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            unzip p7zip-full file binutils jq curl default-jre-headless

      - name: Download official Android and Windows clients
        shell: bash
        run: |
          set -euo pipefail

          fetch() {
            curl \
              --fail --location --retry 4 --retry-all-errors \
              --connect-timeout 20 --max-time 240 \
              --user-agent "Mozilla/5.0 OKN-R103-Interop-Research" \
              --referer "https://golodsp.com/7%E9%80%9A%E9%81%93%E9%9F%B3%E9%A2%91%E5%89%8D%E7%BA%A7/" \
              --output "$2" "$1"
            test -s "$2"
          }

          fetch "$ANDROID_URL" "$OUT/downloads/android.zip"
          fetch "$WINDOWS_URL" "$OUT/downloads/windows.zip"
          sha256sum "$OUT/downloads/"*.zip > "$OUT/evidence/01_DOWNLOAD_SHA256.txt"

      - name: Extract real APK and Windows client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT/android/pkg" "$OUT/windows/pkg"
          7z x -y "$OUT/downloads/android.zip" -o"$OUT/android/pkg" >/dev/null
          7z x -y "$OUT/downloads/windows.zip" -o"$OUT/windows/pkg" >/dev/null

          APK="$(find "$OUT/android/pkg" -type f -iname '*.apk' ! -path '*/__MACOSX/*' ! -name '._*' -size +100k | sort | head -n1)"
          EXE="$(find "$OUT/windows/pkg" -type f -iname '*.exe' ! -path '*/__MACOSX/*' ! -name '._*' -size +100k | sort | head -n1)"

          test -n "$APK"
          test -n "$EXE"
          unzip -t "$APK" >/dev/null
          cp "$APK" "$OUT/android/golopine.apk"
          cp "$EXE" "$OUT/windows/dstech.exe"

          {
            file "$OUT/android/golopine.apk"
            file "$OUT/windows/dstech.exe"
            sha256sum "$OUT/android/golopine.apk" "$OUT/windows/dstech.exe"
          } > "$OUT/evidence/02_CLIENT_IDENTITY.txt"

      - name: Decompile Windows .NET client
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PATH:$HOME/.dotnet/tools"
          if ! command -v ilspycmd >/dev/null 2>&1; then
            dotnet tool install --global ilspycmd >/dev/null
          fi

          mkdir -p "$OUT/decompiled/windows"
          ilspycmd --project --outputdir "$OUT/decompiled/windows" "$OUT/windows/dstech.exe" \
            > "$OUT/evidence/10_ILSPY_STDOUT.txt" \
            2> "$OUT/evidence/11_ILSPY_STDERR.txt"

          echo "ILSPY_RC=0" > "$OUT/evidence/12_ILSPY_STATUS.txt"

      - name: Extract protocol class contracts from Windows client
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re,json

          out=Path(os.environ['OUT'])
          root=out/'decompiled/windows'
          ev=out/'evidence'

          wanted=[
            'Sensor.cs','ReadSensorPeriperalCommand.cs','ReadSensorFifoCommand.cs',
            'ReadSensorBulkCommand.cs','UFEHeader.cs','HidDevice.cs','HIDInterface.cs',
            'DeviceCommunicationStream.cs','UFEcommandBridge.cs'
          ]

          contracts=[]
          for name in wanted:
            matches=list(root.rglob(name))
            for p in matches:
              txt=p.read_text(errors='ignore')
              contracts.append({
                'file':str(p.relative_to(out)),
                'text':txt[:50000]
              })

          (ev/'20_WINDOWS_PROTOCOL_CONTRACTS.json').write_text(
            json.dumps(contracts,indent=2,ensure_ascii=False)+'\n')

          # Parse public fields / constructor signatures that remain visible even
          # when method bodies are protected.
          parsed=[]
          for c in contracts:
            txt=c['text']
            fields=re.findall(r'(?m)^\s*public\s+([\w<>\[\].]+)\s+(\w+)\s*;',txt)
            ctors=re.findall(r'(?m)^\s*public\s+(\w+)\s*\(([^)]*)\)',txt)
            enums=re.findall(r'(?m)^\s*(UFE_[A-Z0-9_]+)\s*=\s*(\d+)\s*,?\s*$',txt)
            parsed.append({
              'file':c['file'],
              'public_fields':fields,
              'constructors':ctors,
              'ufe_enum_values':[(n,int(v)) for n,v in enums]
            })

          (ev/'21_WINDOWS_PROTOCOL_CONTRACT_SUMMARY.json').write_text(
            json.dumps(parsed,indent=2,ensure_ascii=False)+'\n')
          PY

      - name: Inventory Android transport plugins and permissions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT/android/raw"
          7z x -y "$OUT/android/golopine.apk" -o"$OUT/android/raw" >/dev/null

          strings -a -n 4 "$OUT/android/raw/classes.dex" > "$OUT/evidence/30_CLASSES_DEX_STRINGS.txt"

          python3 - <<'PY'
          from pathlib import Path
          import os,json

          out=Path(os.environ['OUT'])
          ev=out/'evidence'
          lines=(ev/'30_CLASSES_DEX_STRINGS.txt').read_text(errors='ignore').splitlines()
          terms=[
            'bluetooth','ble','bluetooth_classic','universal_ble',
            'UsbManager','UsbDevice','controlTransfer','bulkTransfer',
            'hidraw','hidapi','/dev/bus/usb','MethodChannel'
          ]
          hits=[]
          for s in lines:
            ms=[t for t in terms if t.lower() in s.lower()]
            if ms:
              hits.append({'terms':ms,'string':s[:2000]})
          (ev/'31_ANDROID_TRANSPORT_EVIDENCE.json').write_text(
            json.dumps(hits,indent=2,ensure_ascii=False)+'\n')
          PY

      - name: Search both clients for firmware flash readback primitives
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re,json,subprocess

          out=Path(os.environ['OUT'])
          ev=out/'evidence'
          roots=[out/'decompiled/windows',out/'android/raw']

          # Separate readback terms from write/update terms.  A firmware updater
          # or 'update command' does NOT count as readback evidence.
          read_terms=[
            'ReadFlash','ReadFirmware','FirmwareRead','FlashRead','ReadMemory',
            'DumpFirmware','DumpFlash','DownloadFirmware','BackupFirmware',
            'ReadRom','ReadROM','MemoryRead','FlashDump','FirmwareDump'
          ]
          update_terms=[
            'firmware','flash','upgrade','bootloader','updatecommandthread',
            'writeflash','erase','program','download mva','mva'
          ]

          read_hits=[]
          update_hits=[]

          for root in roots:
            if not root.exists(): continue
            for p in root.rglob('*'):
              if not p.is_file() or p.stat().st_size>80_000_000: continue
              rel=str(p.relative_to(out))
              if p.suffix.lower() in {'.cs','.java','.kt','.xml','.txt','.json','.ini','.cfg','.properties'}:
                try: lines=p.read_text(errors='ignore').splitlines()
                except: continue
                for i,line in enumerate(lines):
                  r=[t for t in read_terms if t.lower() in line.lower()]
                  u=[t for t in update_terms if t.lower() in line.lower()]
                  if r:
                    read_hits.append({'path':rel,'line':i+1,'terms':r,'text':line[:4000]})
                  if u:
                    update_hits.append({'path':rel,'line':i+1,'terms':u,'text':line[:4000]})
              elif p.suffix.lower() in {'.exe','.dll','.so','.dex'}:
                try:
                  rr=subprocess.run(['strings','-a','-n','4',str(p)],capture_output=True,text=True,errors='ignore',timeout=40)
                except Exception:
                  continue
                for s in rr.stdout.splitlines():
                  r=[t for t in read_terms if t.lower() in s.lower()]
                  u=[t for t in update_terms if t.lower() in s.lower()]
                  if r: read_hits.append({'path':rel,'terms':r,'text':s[:4000]})
                  if u: update_hits.append({'path':rel,'terms':u,'text':s[:4000]})

          (ev/'40_FIRMWARE_READBACK_TERM_HITS.json').write_text(
            json.dumps(read_hits,indent=2,ensure_ascii=False)+'\n')
          (ev/'41_FIRMWARE_UPDATE_WRITE_TERM_HITS.json').write_text(
            json.dumps(update_hits[:4000],indent=2,ensure_ascii=False)+'\n')
          print('readback_term_hits',len(read_hits))
          print('update_write_term_hits',len(update_hits))
          PY

      - name: Correlate proven R102 packet layouts with Windows type semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json

          out=Path(os.environ['OUT'])
          ev=out/'evidence'
          contracts=json.loads((ev/'21_WINDOWS_PROTOCOL_CONTRACT_SUMMARY.json').read_text())

          def find(name):
            return [x for x in contracts if x['file'].endswith('/'+name) or x['file'].endswith(name)]

          result={
            'read_sensor_fifo':{
              'command':0x61,
              'windows_contract':find('ReadSensorFifoCommand.cs'),
              'proven_r102_wire_layout':'[0x61][Sensor.ID BE32][memlength BE16]',
              'official_android_observed_memlength':200,
            },
            'read_sensor_bulk':{
              'command':0x63,
              'windows_contract':find('ReadSensorBulkCommand.cs'),
              'proven_r102_wire_layout':'[0x63][Sensor.ID BE32][memoffset BE16][memlength BE16]',
              'official_android_observed_memoffset':0,
              'official_android_observed_memlength':0x078C,
            },
            'read_sensor_actuator':{
              'command':0x58,
              'windows_contract':find('ReadSensorPeriperalCommand.cs'),
              'proven_r102_wire_layout':'[0x58][Sensor.ID BE32][0x0000][derived/cascade length BE16]',
            },
            'sensor_model':find('Sensor.cs'),
          }
          (ev/'50_UFE_READ_SEMANTICS.json').write_text(
            json.dumps(result,indent=2,ensure_ascii=False)+'\n')
          PY

      - name: Produce conservative capability verdict
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json

          out=Path(os.environ['OUT'])
          ev=out/'evidence'

          contracts=json.loads((ev/'21_WINDOWS_PROTOCOL_CONTRACT_SUMMARY.json').read_text())
          transport=json.loads((ev/'31_ANDROID_TRANSPORT_EVIDENCE.json').read_text())
          readhits=json.loads((ev/'40_FIRMWARE_READBACK_TERM_HITS.json').read_text())
          updatehits=json.loads((ev/'41_FIRMWARE_UPDATE_WRITE_TERM_HITS.json').read_text())

          flat=json.dumps(contracts,ensure_ascii=False)
          bulk_sensor_semantics=(
            'ReadSensorBulkCommand' in flat and
            'memoffset' in flat and
            'memlength' in flat and
            'Sensor' in flat
          )
          fifo_sensor_semantics=(
            'ReadSensorFifoCommand' in flat and
            'memlength' in flat and
            'Sensor' in flat
          )

          android_blob=json.dumps(transport,ensure_ascii=False).lower()
          android_ble=('bluetooth_classic' in android_blob or 'universal_ble' in android_blob)
          android_usb=any(k in android_blob for k in ('usbmanager','controtransfer','bulktransfer','hidraw','hidapi'))

          verdict={
            'ufe_bulk_is_sensor_scoped':bulk_sensor_semantics,
            'ufe_fifo_is_sensor_scoped':fifo_sensor_semantics,
            'ufe_sensor_id_is_not_proven_flash_address':True,
            'official_android_transport_shows_bluetooth_ble':android_ble,
            'official_android_transport_shows_direct_android_usb_api':android_usb,
            'explicit_firmware_flash_readback_term_hits':len(readhits),
            'firmware_update_or_write_related_hits':len(updatehits),
            'true_firmware_readback_primitive_proven':False,
            'full_flash_readback_proven':False,
            'live_board_commands_allowed':False,
            'next_gate':'If no true firmware-read primitive exists, pivot away from UFE sensor reads and locate a vendor bootloader/updater readback path; do not reinterpret Sensor.ID as a flash address.'
          }
          (ev/'60_R103_VERDICT.json').write_text(
            json.dumps(verdict,indent=2,ensure_ascii=False)+'\n')

          lines=[
            'OKN R103 FIRMWARE READBACK CAPABILITY AUDITOR',
            'OFFLINE_ONLY=true',
            f'UFE_BULK_IS_SENSOR_SCOPED={str(bulk_sensor_semantics).lower()}',
            f'UFE_FIFO_IS_SENSOR_SCOPED={str(fifo_sensor_semantics).lower()}',
            'UFE_SENSOR_ID_IS_NOT_PROVEN_FLASH_ADDRESS=true',
            f'ANDROID_OFFICIAL_CLIENT_BLUETOOTH_BLE={str(android_ble).lower()}',
            f'ANDROID_OFFICIAL_CLIENT_DIRECT_USB_API={str(android_usb).lower()}',
            f'FIRMWARE_READBACK_TERM_HITS={len(readhits)}',
            f'UPDATE_WRITE_RELATED_HITS={len(updatehits)}',
            'TRUE_FIRMWARE_READBACK_PRIMITIVE_PROVEN=false',
            'FULL_FLASH_READBACK_PROVEN=false',
            'LIVE_BOARD_COMMANDS_ALLOWED=false',
          ]
          (ev/'61_R103_SUMMARY.txt').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY

      - name: Build compact evidence artifact
        shell: bash
        run: |
          set -euo pipefail
          cp -a "$OUT/evidence/." "$OUT/review/"

          cat > "$OUT/review/99_SAFETY_ATTESTATION.txt" <<'EOF'
          OFFLINE_STATIC_ONLY=true
          BOARD_USB_ACCESSED=false
          HOST_TO_DEVICE_COMMANDS_SENT=false
          HID_SET_REPORT_LIVE=false
          FLASH_ERASE_WRITE=false
          FULL_FLASH_READBACK_PROVEN=false
          EOF

          (
            cd "$OUT/review"
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          ) > "$OUT/review/SHA256SUMS.txt"

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo "## OKN R103 Firmware Readback Capability Auditor"
            echo
            echo "- Static/offline only."
            echo "- Distinguishes UFE Sensor.ID reads from true firmware/flash reads."
            echo "- Searches official Android and Windows clients for a separate readback primitive."
            echo "- No board USB access and no host-to-device packet."
            echo
            for f in \
              "$OUT/evidence/12_ILSPY_STATUS.txt" \
              "$OUT/evidence/61_R103_SUMMARY.txt"; do
              if [ -f "$f" ]; then
                echo "### $(basename "$f")"
                echo '```text'
                cat "$f"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload R103 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R103-FIRMWARE-READBACK-CAPABILITY-EVIDENCE
          path: /tmp/okn-r103/review
          if-no-files-found: error
          retention-days: 30
