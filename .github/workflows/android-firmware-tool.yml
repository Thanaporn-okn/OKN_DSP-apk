name: OKN Android Firmware Tool R94 READ-ONLY HID Matrix

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/android-firmware-tool.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android-firmware-tool.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: okn-android-firmware-tool-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: /tmp/okn-android-firmware-tool
  PROJECT_TGZ_SHA256: 8c6b96d41ef11b8d57347cfd1ad6b6f4ae67a5bb4c6eec18c6e4115a0ccb8747
  SDK_REPO: https://github.com/leadercxn/bp1048_sdk_v0.1.12.git
  SDK_COMMIT: 8105bd864b04995d81c9f9ae77cb158259f39015
  READ_ONLY_FIRST: "YES"
  USB_VENDOR_OUT_ALLOWED: "NO"
  HID_SET_REPORT_ALLOWED: "NO"
  FLASH_ERASE_ALLOWED: "NO"
  FLASH_WRITE_ALLOWED: "NO"
  UNLOCK_ALLOWED: "NO"
  FULL_FLASH_READBACK_PROVEN: "NO"

jobs:
  build-test-package:
    name: Build + test read-only S25+ USB firmware tool
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fail-closed scope gate
        shell: bash
        run: |
          set -euo pipefail
          test "$READ_ONLY_FIRST" = "YES"
          test "$USB_VENDOR_OUT_ALLOWED" = "NO"
          test "$HID_SET_REPORT_ALLOWED" = "NO"
          test "$FLASH_ERASE_ALLOWED" = "NO"
          test "$FLASH_WRITE_ALLOWED" = "NO"
          test "$UNLOCK_ALLOWED" = "NO"
          test "$FULL_FLASH_READBACK_PROVEN" = "NO"
          rm -rf "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR/ci-output/evidence" "$PROJECT_DIR/ci-output/logs" "$PROJECT_DIR/ci-output/reports"
          cat > "$PROJECT_DIR/ci-output/evidence/00_SAFETY_GATE.txt" <<'EOF'
          TARGET=MVSilicon BP1048P4 family project evidence
          PHONE=Samsung Galaxy S25+
          PHYSICAL_PATH=Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only
          SOLDERING=NO
          BOARD_MODIFICATION=NO
          JTAG_SWD_UART_TESTPOINT=NO
          EXTERNAL_PROGRAMMER=NO
          READ_ONLY_FIRST=YES
          USB_VENDOR_OUT_COMMANDS=NO
          HID_SET_REPORT=NO
          ERASE=NO
          FLASH_WRITE=NO
          UNLOCK=NO
          FULL_FLASH_READBACK_PROVEN=NO
          PRODUCTION_USB_ID=6324:1719
          PRODUCTION_MANUFACTURER=JMDSTECH
          PRODUCTION_PRODUCT=DSTech_DSP_ComboDigitalArchitect
          PRODUCTION_IF3=HID_INTERRUPT_IN_0x81_64B
          PRODUCTION_IF4=VENDOR_HID_CONTROL_ONLY_FF00_55AA
          IF4_INPUT_BYTES=256
          IF4_OUTPUT_BYTES=256
          IF4_FEATURE_BYTES=8
          GET_REPORT_OUTPUT_CURRENT_VALUE=DEVICE_TO_HOST_READ_ONLY
          SET_REPORT=NO
          OUTPUT_TRANSFER=NO
          FORCE_KERNEL_DETACH=NO
          EOF

      - name: Reconstruct complete Android project embedded in this one YML
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/okn-r94-project.tgz.b64 <<'R94_PROJECT_B64'
