                              L64=U32(658242601 ^ 1092075823 ^ 1441417454)
                              L11=U32(B-L75)
                              L74=U32((C<<11) | (C>>21))
                              PRE=U32(U32(U32(L64<<16)+L11) ^ L11)

                              def STEP(x):
                                  y=U32(x+L75)
                                  y=U32(y ^ U32(y<<6))
                                  y=U32(y+L11)
                                  y=U32(y ^ (y>>11))
                                  y=U32(y+L74)
                                  y=U32(y ^ U32(y<<1))
                                  y=U32(y+y)
