              return U("call:"+name)

          initial=S(ip=label["IL_0000"])
          # .NET zero-initialized static field before N9 first-call guard.
          # This assumption is explicit and alternate branches are still forked when unknown.
          initial.statics["NaheA732Kj"]=False

          active=collections.deque([initial])
          finished=[]
          seen={}
          MAX_PATHS=1024
          MAX_STEPS=5000000
          total_steps=0
          GLOBAL_REACH=[]
          GLOBAL_EVENTS=[]

          def key(s):
              def arrsig(v):
                  if isinstance(v,bytearray):return hashlib.sha1(bytes(v)).hexdigest()[:12]
                  if isinstance(v,bytes):return hashlib.sha1(v).hexdigest()[:12]
                  if isinstance(v,Reader):return ("reader",v.s.pos)
                  if isinstance(v,Stream):return ("stream",v.pos)
                  if isinstance(v,(int,str,bool,type(None))):return v
                  return type(v).__name__
              focus=[8,12,17,27,29,37,38,47,55,67,71,76,78,83,95,98,100,105,110,114,118]
              return (s.ip,tuple(arrsig(s.locals[i]) for i in focus),
                      s.statics.get("NaheA732Kj"))

          while active and total_steps<MAX_STEPS:
              s=active.popleft()
              branch_out=[]
              local_budget=5000

              while local_budget>0 and s.steps<120000:
                  local_budget-=1; s.steps+=1; total_steps+=1
                  if s.ip<0 or s.ip>=len(ins):
                      finished.append(s); break

                  lab,op,arg,raw=ins[s.ip]
                  nxt=s.ip+1
                  c=ldc(op,arg)
                  if c is not None:
                      push(s,c); s.ip=nxt; continue

                  ln=locno(op,arg)
                  if op.startswith("ldloc") and ln is not None:
                      push(s,s.locals[ln]); s.ip=nxt; continue
                  if op.startswith("stloc") and ln is not None:
                      v=pop(s); s.locals[ln]=v
                      if ln==12 and isinstance(v,(bytes,bytearray)):
                          rp=None
                          r=s.locals[114]
                          if isinstance(r,Reader):rp=r.s.pos
                          event={
                              "kind":"LOCAL12_SET","length":len(v),
                              "reader_position_after":rp,
                              "mod16":len(v)%16,"step":s.steps
                          }
                          s.milestones.append(event)
                          GLOBAL_EVENTS.append(event)
                      if ln==29 and isinstance(v,(bytes,bytearray)):
                          s.milestones.append({
                              "kind":"LOCAL29_PLAINTEXT","length":len(v),
                              "head64":bytes(v)[:64].hex().upper(),"step":s.steps
                          })
                      s.ip=nxt; continue

                  if op=="ldnull":push(s,None);s.ip=nxt;continue
                  if op=="ldstr":
                      mm=re.match(r'"(.*)"',arg)
                      push(s,bytes(mm.group(1),"utf-8").decode("unicode_escape") if mm else arg)
                      s.ip=nxt;continue
                  if op=="dup":
                      push(s,s.stack[-1] if s.stack else U("dup"));s.ip=nxt;continue
                  if op=="pop":pop(s);s.ip=nxt;continue

                  if op=="newarr":
                      n=pop(s)
                      push(s,bytearray(n) if isinstance(n,int) and 0<=n<=10000000 else U("array"))
                      s.ip=nxt;continue
                  if op=="ldlen":
                      a=pop(s);push(s,len(a) if isinstance(a,(bytes,bytearray,list)) else U("len"))
                      s.ip=nxt;continue
                  if op in ("stelem.i1","stelem.i2","stelem.i4"):
                      val=pop(s);idx=pop(s);a=pop(s)
                      if isinstance(a,bytearray) and isinstance(idx,int) and 0<=idx<len(a) and isinstance(val,int):
                          a[idx]=val&255
                      s.ip=nxt;continue
                  if op in ("ldelem.u1","ldelem.i1"):
                      idx=pop(s);a=pop(s)
                      if isinstance(a,(bytes,bytearray)) and isinstance(idx,int) and 0<=idx<len(a):
                          push(s,a[idx])
                      else:push(s,U("elem"))
                      s.ip=nxt;continue

                  if op in ("add","sub","mul","div","div.un","rem","rem.un","xor","and","or","shl","shr","shr.un","ceq","cgt","cgt.un","clt","clt.un"):
                      b=pop(s);a=pop(s);push(s,binary(a,b,op));s.ip=nxt;continue
                  if op=="neg":
                      a=pop(s);push(s,-a if isinstance(a,int) else U("neg"));s.ip=nxt;continue
                  if op=="not":
                      a=pop(s);push(s,~a if isinstance(a,int) else U("not"));s.ip=nxt;continue
                  if op.startswith("conv."):
                      a=pop(s)
                      if isinstance(a,int):
                          if op in ("conv.u1",):a&=0xff
                          elif op in ("conv.u2",):a&=0xffff
                          elif op in ("conv.u4",):a&=0xffffffff
                      push(s,a);s.ip=nxt;continue

                  if op=="ldsfld":
                      fld=arg.split("::")[-1]
                      push(s,s.statics.get(fld,U("static:"+fld)));s.ip=nxt;continue
                  if op=="stsfld":
                      fld=arg.split("::")[-1]
                      s.statics[fld]=pop(s);s.ip=nxt;continue

                  if op=="switch":
                      v=pop(s)
                      ts=re.findall(r'IL_[0-9A-Fa-f]+',arg)
                      if isinstance(v,int) and 0<=v<len(ts):
                          if v in (626,631,313,458,96,206,94,289,292,402,40,281):
                              evt={
                                  "state":v,
                                  "target":ts[v],
                                  "step":s.steps,
                                  "local38":s.locals[38] if isinstance(s.locals[38],int) else None,
                                  "local98":s.locals[98] if isinstance(s.locals[98],int) else None,
                                  "key_local17_hex":(
                                      bytes(s.locals[17]).hex().upper()
                                      if isinstance(s.locals[17],bytearray) else None
                                  ),
                                  "key_local47_hex":(
                                      bytes(s.locals[47]).hex().upper()
                                      if isinstance(s.locals[47],(bytes,bytearray)) else None
                                  ),
                                  "iv_local100_hex":(
                                      bytes(s.locals[100]).hex().upper()
                                      if isinstance(s.locals[100],bytearray) else None
                                  ),
                                  "iv_local8_hex":(
                                      bytes(s.locals[8]).hex().upper()
                                      if isinstance(s.locals[8],(bytes,bytearray)) else None
                                  ),
                              }
                              if v==96 and isinstance(s.locals[37],bytearray):
                                  stage=bytes(s.locals[37])
                                  (OUT/"decrypted/stage1_local37.bin").write_bytes(stage)
                                  evt.update({
                                      "stage1_len":len(stage),
                                      "stage1_sha256":hashlib.sha256(stage).hexdigest(),
                                      "stage1_head64":stage[:64].hex().upper(),
                                  })
                              GLOBAL_REACH.append(evt)

                          # R113 proved 404<->625 is a legitimate 16-byte XOR loop.
                          # The later 313 loop runs once per 4-byte word over ~608 KB.
                          # Accelerate only the common non-final iterations using the
                          # exact arithmetic visible in states
                          # 313,2,117,141,502,215,299,342,664,46,33,321,95,199,617,451,458.
                          # The final iteration stays in original IL for remainder/tail handling.
                          if (
                              v==313
                              and isinstance(s.locals[38],int) and s.locals[38]==0
                              and isinstance(s.locals[98],int) and s.locals[98]>1000
                              and isinstance(s.locals[27],(bytes,bytearray))
                              and isinstance(s.locals[47],(bytes,bytearray))
                              and isinstance(s.locals[37],bytearray)
                          ):
                              MASK=0xffffffff
                              def U32(x): return x & MASK

                              # Exact constants and operations from state 46 / IL_5be0.
                              D=1474240118
                              B=725701736
                              C=7651480
                              L75=U32(D-B)
                              L64=U32(658242601 ^ 1092075823 ^ 1441417454)
                              L11=U32(B-L75)
                              L74=U32((C<<11) | (C>>21))
                              PRE=U32(U32(U32(L64<<16)+L11) ^ L11)

                              def STEP(x):
                                  y=U32(x+L75)
                                  y=U32(y ^ U32(y<<6))
                                  y=U32(y+L11)
                                  y=U32(y ^ (y>>11))
                                  y=U32(y+L74)
                                  y=U32(y ^ U32(y<<1))
                                  y=U32(y+y)
                                  z=U32(PRE-y)
                                  return U32(x+z)

                              keybytes=bytes(s.locals[47])
                              source=bytes(s.locals[27])
                              dest=s.locals[37]

                              if len(keybytes)%4:
                                  raise RuntimeError("key length is not word aligned")

                              key_words=[
                                  struct.unpack_from("<I",keybytes,k)[0]
                                  for k in range(0,len(keybytes),4)
                              ]

                              acc=U32(s.locals[105]) if isinstance(s.locals[105],int) else 0

                              # local98 is ceil(len/4); therefore local98-1 are complete
                              # 4-byte words and the final iteration handles the tail.
                              complete_words=s.locals[98]-1
                              for ii in range(complete_words):
                                  kw=key_words[ii % len(key_words)]
                                  acc=U32(acc+kw)       # state 299
                                  acc=STEP(acc)         # state 46
                                  dw=struct.unpack_from("<I",source,ii*4)[0]
                                  struct.pack_into("<I",dest,ii*4,U32(acc^dw))

                              s.locals[105]=acc
                              s.locals[38]=complete_words
                              s.milestones.append({
                                  "kind":"FAST_WORD_LOOP",
                                  "iterations":complete_words,
                                  "source_len":len(source),
                                  "key_hex":keybytes.hex().upper(),
                                  "iv_hex":(
                                      bytes(s.locals[8]).hex().upper()
                                      if isinstance(s.locals[8],(bytes,bytearray))
                                      else None
                                  ),
                                  "accumulator":acc,
                                  "step":s.steps
                              })

                          s.trace.append({"state":v,"target":ts[v],"step":s.steps})
                          if v in (626,631,289,292,402,40,281):
                              s.milestones.append({
                                  "kind":"CRYPTO_GATE_STATE",
                                  "state":v,"target":ts[v],"step":s.steps
                              })
                          s.ip=label[ts[v]]
                      else:s.ip=nxt
                      continue

                  if op in ("br","br.s","leave","leave.s"):
                      t=re.search(r'IL_[0-9A-Fa-f]+',arg)
                      if t:s.ip=label[t.group(0)]
                      else:s.ip=nxt
                      continue

                  if op in ("brtrue","brtrue.s","brfalse","brfalse.s"):
                      v=pop(s); want_true=op.startswith("brtrue")
                      t=re.search(r'IL_[0-9A-Fa-f]+',arg)
                      ti=label[t.group(0)] if t else nxt
                      if unk(v):
                          a=cp(s);b=cp(s)
                          a.unknown_branches+=1;b.unknown_branches+=1
                          a.ip=ti if want_true else nxt
                          b.ip=nxt if want_true else ti
                          branch_out=[a,b];break
                      truth=bool(v)
                      s.ip=ti if truth==want_true else nxt
                      continue

                  if op.startswith(("beq","bne","bge","bgt","ble","blt")):
                      b=pop(s);a=pop(s)
                      t=re.search(r'IL_[0-9A-Fa-f]+',arg)
                      ti=label[t.group(0)] if t else nxt
                      if unk(a) or unk(b):
                          x=cp(s);y=cp(s);x.unknown_branches+=1;y.unknown_branches+=1
                          x.ip=ti;y.ip=nxt;branch_out=[x,y];break
                      try:
                          if op.startswith("beq"):cond=a==b
                          elif op.startswith("bne"):cond=a!=b
                          elif op.startswith("bge"):cond=a>=b
                          elif op.startswith("bgt"):cond=a>b
                          elif op.startswith("ble"):cond=a<=b
                          else:cond=a<b
                      except:cond=False
                      s.ip=ti if cond else nxt
                      continue

                  if op in ("call","callvirt"):
                      name=method(arg); n=argc(arg)
                      args=[pop(s) for _ in range(n)][::-1]
                      if "instance " in arg:
                          args=[pop(s)]+args
                      ret=known_call(s,name,args)
                      # Known void wrapper names.
                      void=(" void " in (" "+arg)) or arg.startswith("void ")
                      if not void:push(s,ret)
                      s.ip=nxt;continue

                  if op=="newobj":
                      n=argc(arg);args=[pop(s) for _ in range(n)][::-1]
                      if "Y7Uor8e58M9K22QZF7H::.ctor" in arg:
                          push(s,Reader(args[-1]) if args and isinstance(args[-1],Stream) else U("Reader"))
                      elif "MemoryStream::.ctor" in arg:
                          if args and isinstance(args[-1],(bytes,bytearray)):
                              # Exact IL at IL_51f2: new MemoryStream(local29),
                              # then wrap it in Y7U... BinaryReader.
                              push(s,Stream(bytes(args[-1])))
                          else:
                              # Parameterless MemoryStream used as CryptoStream output.
                              push(s,Mem())
                      elif "CryptoStream::.ctor" in arg:
                          # ctor args: stream, transform, mode
                          mem=args[-3] if len(args)>=3 else U()
                          tr=args[-2] if len(args)>=2 else U()
                          push(s,Crypto(mem,tr) if isinstance(mem,Mem) else U("Crypto"))
                      else:
                          push(s,U("newobj"))
                      s.ip=nxt;continue

                  # Address/pointer/native instructions not needed for the
                  # resource/key phase are modelled conservatively.
                  if op.startswith(("ldloca","ldarga","ldarg","ldfld","ldflda","ldind","ldelema","ldtoken")):
                      push(s,U(op));s.ip=nxt;continue
                  if op.startswith(("stfld","stind","initobj","cpblk","stobj")):
                      # conservative stack cleanup is intentionally omitted;
                      # unknown later branch will fork rather than invent truth.
                      s.ip=nxt;continue
                  if op=="ret":
                      finished.append(s);break
                  if op in ("nop","volatile."):
                      s.ip=nxt;continue

                  # Unsupported opcode: keep going but make it visible.
                  s.milestones.append({"kind":"UNSUPPORTED","label":lab,"op":op,"arg":arg})
                  s.ip=nxt

              if branch_out:
                  for x in branch_out:
                      k=key(x);best=seen.get(k)
                      if best is None or x.unknown_branches<best:
                          seen[k]=x.unknown_branches
                          active.append(x)
                  # Keep bounded symbolic search.
                  if len(active)>MAX_PATHS:
                      def crypto_progress(z):
                          states={x["state"] for x in z.trace}
                          score=0
                          for st,w in ((626,10),(631,20),(289,30),(292,40),(402,100),(40,120),(281,200)):
                              if st in states: score+=w
                          return score
                      ordered=sorted(
                          active,
                          key=lambda z:(
                              -crypto_progress(z),
                              -len(set(x["state"] for x in z.trace)),
                              z.unknown_branches,
                              len(z.trace)
                          )
                      )
                      active=collections.deque(ordered[:MAX_PATHS])
              else:
                  # preserve states that hit budget for another quantum
                  if local_budget<=0:
                      k=key(s);best=seen.get(k)
                      if best is None or s.unknown_branches<best:
                          seen[k]=s.unknown_branches;active.append(s)

          allstates=finished+list(active)
          interesting=[]
          for s in allstates:
              kinds=[m["kind"] for m in s.milestones]
              score=(1000*("LOCAL29_PLAINTEXT" in kinds)+
                     500*("AES_DECRYPT" in kinds)+
                     200*("CreateDecryptor" in kinds)+
                     100*("LOCAL12_SET" in kinds)+
                     20*("resource_open" in kinds))
              if score:
                  interesting.append((score,s))
          interesting.sort(key=lambda x:(-x[0],x[1].unknown_branches))

          report=[]
          for score,s in interesting[:100]:
              report.append({
                  "score":score,
                  "steps":s.steps,
                  "unknown_branches":s.unknown_branches,
                  "trace_states":[x["state"] for x in s.trace[:2000]],
                  "trace_targets":[x["target"] for x in s.trace[:2000]],
                  "reads":s.reads[:500],
                  "milestones":s.milestones[:1000],
                  "key_local17_hex":bytes(s.locals[17]).hex().upper() if isinstance(s.locals[17],bytearray) else None,
                  "iv_local100_hex":bytes(s.locals[100]).hex().upper() if isinstance(s.locals[100],bytearray) else None
              })

          summary={
              "instruction_count":len(ins),
              "switch_target_count":len(switch_targets),
              "switch_392":switch_targets[392] if len(switch_targets)>392 else None,
              "total_vm_steps":total_steps,
              "finished_or_active_states":len(allstates),
              "interesting_states":len(interesting),
              "best_score":interesting[0][0] if interesting else 0,
              "reached_resource_open":any(any(m["kind"]=="resource_open" for m in s.milestones) for s in allstates),
              "reached_local12":any(any(m["kind"]=="LOCAL12_SET" for m in s.milestones) for s in allstates),
              "reached_create_decryptor":any(any(m["kind"]=="CreateDecryptor" for m in s.milestones) for s in allstates),
              "reached_aes_decrypt":any(any(m["kind"]=="AES_DECRYPT" for m in s.milestones) for s in allstates),
              "reached_plaintext":any(any(m["kind"]=="LOCAL29_PLAINTEXT" for m in s.milestones) for s in allstates),
              "static_intptr_size":4,
              "initial_NaheA732Kj_assumption":False,
              "global_reach":GLOBAL_REACH[-5000:],
              "global_events":GLOBAL_EVENTS[-5000:],
              "global_reached_create_decryptor":any(
                  x.get("kind")=="CreateDecryptor" for x in GLOBAL_EVENTS
              ),
              "global_reached_state289":any(x.get("state")==289 for x in GLOBAL_REACH),
              "global_reached_state292":any(x.get("state")==292 for x in GLOBAL_REACH),
              "global_reached_state402":any(x.get("state")==402 for x in GLOBAL_REACH),
              "global_reached_state281":any(x.get("state")==281 for x in GLOBAL_REACH),
          }

          (OUT/"evidence/30_VM_SUMMARY.json").write_text(json.dumps(summary,indent=2)+"\n")
          (OUT/"evidence/31_VM_INTERESTING_PATHS.json").write_text(
              json.dumps(report,indent=2,ensure_ascii=False)+"\n")
          print(json.dumps(summary,indent=2))

          PY

          echo "EXACT_WRAPPERS: zfos=true omT=null"
          set +e
          timeout 480s python3 "$OUT/n9_emulator.py" \
            > "$OUT/evidence/32_VM_STDOUT.txt" \
            2> "$OUT/evidence/33_VM_STDERR.txt"
          RC=$?
          set -e
          echo "VM_RC=$RC" > "$OUT/evidence/34_VM_STATUS.txt"

          if [ "$RC" -eq 124 ]; then
            echo "VM_TIMEOUT=true" >> "$OUT/evidence/34_VM_STATUS.txt"
          fi

      - name: Static fallback slice for key IV and h15 reader position
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re,json,collections

          out=Path(os.environ["OUT"])
          n9=(out/"evidence/20_N9_METHOD.il").read_text(errors="ignore")

          targets=[
              ("resource_open","h15IL2i6yy2BZV8RqM.YuRwd1JALC4oy32W66"),
              ("read_int32","qfkv4ZNDynVciIciQy6"),
              ("read_bytes","sWg0PuN2fLSfxi2LB0D"),
              ("key_alias","stloc.s 47"),
              ("iv_use","ldloc.s 8"),
              ("create_decryptor","VnHlfpNorSGR6U9GUOp"),
              ("crypto_stream","CryptoStream::.ctor"),
              ("local12","stloc.s 12")
          ]

          lines=n9.splitlines()
          hits=[]
          for kind,needle in targets:
              for i,l in enumerate(lines):
                  if needle in l:
                      hits.append({
                          "kind":kind,"line":i+1,"matched":l.strip(),
                          "context":"\n".join(lines[max(0,i-15):min(len(lines),i+25)])
                      })

          # Enumerate all explicit writes to key local17 and IV local100.
          writes=[]
          for i,l in enumerate(lines):
              if re.search(r'\bldloc(?:\.s)?\s+(17|100)\b',l):
                  loc=int(re.search(r'(17|100)',l).group(1))
                  ctx="\n".join(lines[i:min(len(lines),i+10)])
                  if "stelem.i1" in ctx:
                      writes.append({"local":loc,"line":i+1,"context":ctx})

          (out/"evidence/40_STATIC_PIPELINE_HITS.json").write_text(
              json.dumps(hits,indent=2,ensure_ascii=False)+"\n")
          (out/"evidence/41_KEY_IV_WRITE_SITES.json").write_text(
              json.dumps(writes,indent=2,ensure_ascii=False)+"\n")

          print("pipeline_hits",len(hits))
          print("key_iv_write_sites",len(writes))
          PY

      - name: Prove aliases and report exact crypto-gate reachability
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json,re

          out=Path(os.environ["OUT"])
          ev=out/"evidence"
          n9=(ev/"20_N9_METHOD.il").read_text(errors="ignore")

          alias_proof={
            "key_local17_to_local47":bool(re.search(
              r"IL_2f34:\s+ldloc 17\s+IL_2f38:\s+stloc\.s 47",n9,re.M)),
            "iv_local100_to_local8":bool(re.search(
              r"IL_111e:\s+ldloc 100\s+IL_1122:\s+stloc\.s 8",n9,re.M)),
            "create_decryptor_uses_local47_local8":bool(re.search(
              r"IL_23ed:[\s\S]{0,300}?ldloc\.s 47"
              r"[\s\S]{0,80}?ldloc\.s 8"
              r"[\s\S]{0,160}?VnHlfpNorSGR6U9GUOp",n9,re.M)),
          }

          try:
            summary=json.loads((ev/"30_VM_SUMMARY.json").read_text())
          except:
            summary={}

          try:
            paths=json.loads((ev/"31_VM_INTERESTING_PATHS.json").read_text())
          except:
            paths=[]

          states=(626,631,313,458,96,206,94,289,292,402,40,281)
          hit={str(st):False for st in states}
          for e in summary.get("global_reach",[]):
            st=e.get("state")
            if str(st) in hit:
              hit[str(st)]=True
          candidates=[]

          for p in paths:
            trace=p.get("trace_states",[])
            for st in states:
              if st in trace: hit[str(st)]=True
            k=p.get("key_local17_hex")
            iv=p.get("iv_local100_hex")
            if k and iv:
              candidates.append({
                "key_hex":k,"iv_hex":iv,
                "score":p.get("score"),
                "unknown_branches":p.get("unknown_branches"),
                "states_hit":[st for st in states if st in trace],
              })

          uniq=[]
          seen=set()
          for c in candidates:
            t=(c["key_hex"],c["iv_hex"])
            if t in seen: continue
            seen.add(t); uniq.append(c)

          result={
            "exact_wrapper_semantics":{
              "zfos":True,
