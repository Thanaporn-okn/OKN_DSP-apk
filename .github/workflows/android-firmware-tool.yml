name: OKN R108 MEGA Resource Decryptor + Stub Body Recovery OFFLINE ONLY

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/android-firmware-tool.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: okn-r108-resource-decryptor-${{ github.ref }}
  cancel-in-progress: true

env:
  WINDOWS_URL: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-08.exe_.zip"
  LIVE_BOARD_USB: "NO"
  HOST_TO_DEVICE_USB: "NO"
  FLASH_ERASE_WRITE: "NO"
  FLASH_ALLOWED: "NO"

jobs:
  recover:
    name: Recover protector crypto/resource pipeline / STATIC ONLY
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OUT: /tmp/r108

    steps:
      - name: Fail-closed safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$LIVE_BOARD_USB" = "NO"
          test "$HOST_TO_DEVICE_USB" = "NO"
          test "$FLASH_ERASE_WRITE" = "NO"
          test "$FLASH_ALLOWED" = "NO"
          rm -rf "$OUT"
          mkdir -p "$OUT"/{downloads,pkg,il,evidence,resources,review}
          cat > "$OUT/evidence/00_SCOPE.txt" <<'EOF'
          REVISION=R108
          MODE=OFFLINE_STATIC_ONLY
          TARGET_EXECUTED=false
          BOARD_USB_ACCESS=NO
          HOST_TO_DEVICE_USB=NO
          FLASH_ERASE_WRITE=NO
          FLASH_ALLOWED=NO
          GOAL=Recover_resource_decryption_and_stub_method_body_restoration_pipeline
          EOF

      - name: Install static-analysis tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            unzip p7zip-full file binutils jq curl mono-utils python3 python3-pip
          python3 -m pip install --break-system-packages --quiet pefile dnfile

      - name: Download official Windows client
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            --connect-timeout 20 --max-time 240 \
            --user-agent "Mozilla/5.0 OKN-R108-Static-Research" \
            --referer "https://golodsp.com/7%E9%80%9A%E9%81%93%E9%9F%B3%E9%A2%91%E5%89%8D%E7%BA%A7/" \
            --output "$OUT/downloads/windows.zip" "$WINDOWS_URL"
          7z x -y "$OUT/downloads/windows.zip" -o"$OUT/pkg" >/dev/null
          EXE="$(find "$OUT/pkg" -type f -iname '*.exe' ! -path '*/__MACOSX/*' ! -name '._*' -size +100k | sort | head -n1)"
          test -n "$EXE"
          cp "$EXE" "$OUT/dstech.exe"
          {
            file "$OUT/dstech.exe"
            sha256sum "$OUT/dstech.exe"
          } > "$OUT/evidence/01_IDENTITY.txt"

      - name: Dump raw IL and decompiled C sharp
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PATH:$HOME/.dotnet/tools"
          if ! command -v ilspycmd >/dev/null 2>&1; then
            dotnet tool install --global ilspycmd >/dev/null
          fi
          ilspycmd --ilcode "$OUT/dstech.exe" > "$OUT/il/all.il" \
            2> "$OUT/evidence/10_ILSPY_IL_STDERR.txt"
          ilspycmd --project --outputdir "$OUT/csharp" "$OUT/dstech.exe" \
            > "$OUT/evidence/11_ILSPY_CSHARP_STDOUT.txt" \
            2> "$OUT/evidence/12_ILSPY_CSHARP_STDERR.txt"

      - name: Extract all five managed resource blobs via raw COR20 parser
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,struct,json,re,hashlib
          import pefile,dnfile
          out=Path(os.environ['OUT']);ev=out/'evidence';rd=out/'resources';exe=out/'dstech.exe'
          raw=exe.read_bytes(); pe=pefile.PE(str(exe),fast_load=False); dn=dnfile.dnPE(str(exe))
          com=pe.OPTIONAL_HEADER.DATA_DIRECTORY[14]
          coff=pe.get_offset_from_rva(int(com.VirtualAddress))
          rrva,rsize=struct.unpack_from('<II',raw,coff+24)
          roff=pe.get_offset_from_rva(rrva)
          table=getattr(getattr(getattr(dn,'net',None),'mdtables',None),'ManifestResource',None)
          rows=[]
          for rid,r in enumerate(getattr(table,'rows',[]) if table else [],1):
            name=str(r.Name); rel=int(r.Offset or 0); pos=roff+rel
            n=struct.unpack_from('<I',raw,pos)[0]
            data=raw[pos+4:pos+4+n]
            safe=re.sub(r'[^A-Za-z0-9._-]+','_',name)
            dst=rd/f'{rid:03d}_{safe}.bin'; dst.write_bytes(data)
            rows.append({'rid':rid,'name':name,'offset':rel,'length':n,'file':dst.name,
                         'sha256':hashlib.sha256(data).hexdigest()})
          (ev/'20_RESOURCE_MAP.json').write_text(json.dumps(rows,indent=2,ensure_ascii=False)+'\n')
          print('resources',len(rows))
          PY

      - name: Index IL methods using robust brace-depth parser
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re,json
          out=Path(os.environ['OUT']);ev=out/'evidence'
          lines=(out/'il/all.il').read_text(errors='ignore').splitlines()

          methods=[]; i=0
          while i < len(lines):
            if not re.match(r'^\s*\.method\b',lines[i]):
              i+=1; continue
            start=i; header=[lines[i]]; i+=1
            # collect header until opening brace
            while i<len(lines) and '{' not in lines[i]:
              header.append(lines[i]); i+=1
            if i>=len(lines): break
            header.append(lines[i])
            depth=lines[i].count('{')-lines[i].count('}')
            body=[*header]; i+=1
            while i<len(lines) and depth>0:
              body.append(lines[i])
              depth += lines[i].count('{')-lines[i].count('}')
              i+=1
            text='\n'.join(body)
            # Find end-comment first, then fallback to method header last identifier.
            m=re.search(r'// end of method\s+(.+?)\s*$',text,re.M)
            key=m.group(1).strip() if m else ''
            if not key:
              hm=re.search(r'\.method[\s\S]{0,800}?\s([A-Za-z0-9_.$<>`\'"-]+)\s*\(',text)
              key=hm.group(1) if hm else f'method_at_line_{start+1}'
            methods.append({'key':key,'line':start+1,'text':text})

          (ev/'30_IL_METHOD_COUNT.txt').write_text(f'METHODS_PARSED={len(methods)}\n')

          terms=[
            'GetManifestResourceStream','RijndaelManaged','CryptoStream','DeflateStream',
            'GZipStream','AssemblyResolve','PrepareMethod','GetFunctionPointer',
            'VirtualProtect','VirtualAlloc','Marshal::Copy','Marshal.Copy',
            'LoadLibrary','GetProcAddress','RuntimeHelpers'
          ]
          resources=json.loads((ev/'20_RESOURCE_MAP.json').read_text())
          names=[r['name'] for r in resources]
          selected=[]
          for m in methods:
            text=m['text']; low=text.lower()
            hits=[t for t in terms if t.lower() in low]
            rn=[n for n in names if n.lower() in low]
            if hits or rn:
              selected.append({'key':m['key'],'line':m['line'],'api_hits':hits,
                               'resource_name_hits':rn,'text':text})
          (ev/'31_RESOURCE_CRYPTO_METHODS.json').write_text(
            json.dumps(selected,indent=2,ensure_ascii=False)+'\n')
          print('parsed_methods',len(methods))
          print('resource_crypto_methods',len(selected))
          PY

      - name: Recover crypto constants and byte arrays from selected methods
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re,json
          out=Path(os.environ['OUT']);ev=out/'evidence'
          methods=json.loads((ev/'31_RESOURCE_CRYPTO_METHODS.json').read_text())
          rows=[]
          for m in methods:
            text=m['text']
            ints=[]
            for mm in re.finditer(r'\bldc\.i4(?:\.s)?\s+(-?(?:0x[0-9A-Fa-f]+|\d+))',text):
              try: v=int(mm.group(1),0)
              except: continue
              ints.append({'value':v,'hex':hex(v & 0xffffffff),'line_fragment':mm.group(0)})
            strings=re.findall(r'\bldstr\s+"([^"]*)"',text)
            newarr=re.findall(r'newarr\s+([^\n]+)',text)
            stelem=[]
            lines=text.splitlines()
            for i,line in enumerate(lines):
              if 'stelem.i1' in line or 'stelem.i4' in line:
                lo=max(0,i-5);hi=min(len(lines),i+3)
                stelem.append('\n'.join(lines[lo:hi]))
            calls=re.findall(r'\bcall(?:virt)?\s+([^\n]+)',text)
            rows.append({'key':m['key'],'api_hits':m['api_hits'],'resource_name_hits':m['resource_name_hits'],
                         'constants':ints[:2000],'strings':strings[:500],
                         'newarr':newarr[:200],'stelem_windows':stelem[:500],'calls':calls[:2000],
                         'text':text})
          (ev/'32_CRYPTO_CONSTANTS.json').write_text(json.dumps(rows,indent=2,ensure_ascii=False)+'\n')
          PY

      - name: Rank likely resource decryptor and method restorer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json
          out=Path(os.environ['OUT']);ev=out/'evidence'
          rows=json.loads((ev/'32_CRYPTO_CONSTANTS.json').read_text())
          ranked=[]
          for r in rows:
            blob=(r.get('text') or '').lower(); score=0; reasons=[]
            weights=[
              ('getmanifestresourcestream',12),('rijndael',10),('cryptostream',9),
              ('deflatestream',9),('preparemethod',14),('getfunctionpointer',14),
              ('virtualprotect',14),('marshal',8),('assemblyresolve',5),
              ('binaryreader',4),('memorystream',3)
            ]
            for term,w in weights:
              if term in blob: score+=w;reasons.append(term)
            if r.get('resource_name_hits'): score+=12*len(r['resource_name_hits']);reasons.append('exact_resource_name')
            ranked.append({'key':r['key'],'score':score,'reasons':reasons,
                           'resource_name_hits':r.get('resource_name_hits',[]),
                           'api_hits':r.get('api_hits',[]),
                           'constants':r.get('constants',[])[:300],
                           'strings':r.get('strings',[])[:100],
                           'calls':r.get('calls',[])[:300],
                           'stelem_windows':r.get('stelem_windows',[])[:100],
                           'text':r.get('text','')})
          ranked.sort(key=lambda x:(-x['score'],x['key']))
          (ev/'40_RANKED_PROTECTOR_METHODS.json').write_text(json.dumps(ranked,indent=2,ensure_ascii=False)+'\n')
          (ev/'41_TOP_PROTECTOR_METHODS.json').write_text(json.dumps(ranked[:30],indent=2,ensure_ascii=False)+'\n')
          print('ranked',len(ranked))
          if ranked:
            print('top',ranked[0]['key'],ranked[0]['score'],ranked[0]['reasons'])
          PY

      - name: Search resource blobs for repeating-block crypto structure and embedded method tables
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json,math,collections,struct,hashlib
          out=Path(os.environ['OUT']);ev=out/'evidence';rd=out/'resources'
          rows=[]
          for p in sorted(rd.glob('*.bin')):
            data=p.read_bytes()
            blocks=[data[i:i+16] for i in range(0,len(data)-15,16)]
            dup=len(blocks)-len(set(blocks))
            # Search for plausible 4-byte RID/token tables and known UpdateCommandThread token/RID.
            probes=[]
            for name,v in [('RID_2092',2092),('TOKEN_0600082C',0x0600082C),('RVA_A3F4',0xA3F4)]:
              for endian,fmt in [('LE','<I'),('BE','>I')]:
                pat=struct.pack(fmt,v)
                pos=data.find(pat)
                if pos>=0: probes.append({'name':name,'endian':endian,'offset':pos})
            rows.append({'file':p.name,'size':len(data),'mod16':len(data)%16,
                         'duplicate_16byte_blocks':dup,'probe_hits':probes,
                         'sha256':hashlib.sha256(data).hexdigest()})
          (ev/'50_RESOURCE_STRUCTURE.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY

      - name: Build conservative R108 verdict
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json
          out=Path(os.environ['OUT']);ev=out/'evidence';review=out/'review'
          ranked=json.loads((ev/'40_RANKED_PROTECTOR_METHODS.json').read_text())
          rstruct=json.loads((ev/'50_RESOURCE_STRUCTURE.json').read_text())
          resource_crypto=json.loads((ev/'31_RESOURCE_CRYPTO_METHODS.json').read_text())
          high=[x for x in ranked if x['score']>=12]
          verdict={
            'resource_crypto_methods':len(resource_crypto),
            'high_value_protector_methods':len(high),
            'top_method':ranked[0] if ranked else None,
            'resource_structure':rstruct,
            'resource_decryption_algorithm_recovered':False,
            'protected_update_body_recovered':False,
            'firmware_readback_primitive_proven':False,
            'full_flash_readback_proven':False,
            'live_board_commands_allowed':False,
            'next_gate':'Use the highest-ranked exact IL method to reproduce key/IV derivation and decrypt the matching manifest resource statically; then map recovered method bodies back to MethodDef RID 2092.'
          }
          (review/'60_R108_VERDICT.json').write_text(json.dumps(verdict,indent=2,ensure_ascii=False)+'\n')
          lines=[
            'OKN R108 RESOURCE DECRYPTOR + STUB BODY RECOVERY',
            'OFFLINE_ONLY=true',
            f'RESOURCE_CRYPTO_METHODS={len(resource_crypto)}',
            f'HIGH_VALUE_PROTECTOR_METHODS={len(high)}',
            'RESOURCE_DECRYPTION_ALGORITHM_RECOVERED=false',
            'PROTECTED_UPDATE_BODY_RECOVERED=false',
            'FIRMWARE_READBACK_PRIMITIVE_PROVEN=false',
            'FULL_FLASH_READBACK_PROVEN=false',
            'LIVE_BOARD_COMMANDS_ALLOWED=false'
          ]
          (review/'61_R108_SUMMARY.txt').write_text('\n'.join(lines)+'\n')
          (review/'62_TOP_PROTECTOR_METHODS.json').write_text(json.dumps(ranked[:30],indent=2,ensure_ascii=False)+'\n')
          print('\n'.join(lines))
          PY

      - name: Copy compact evidence and safety attestation
        shell: bash
        run: |
          set -euo pipefail
          cp -a "$OUT/evidence/." "$OUT/review/"
          cat > "$OUT/review/99_SAFETY_ATTESTATION.txt" <<'EOF'
          OFFLINE_STATIC_ONLY=true
          TARGET_EXECUTED=false
          BOARD_USB_ACCESSED=false
          HOST_TO_DEVICE_COMMANDS_SENT=false
          HID_SET_REPORT_LIVE=false
          FLASH_ERASE_WRITE=false
          FULL_FLASH_READBACK_PROVEN=false
          EOF
          (cd "$OUT/review" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$OUT/review/SHA256SUMS.txt"

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo "## OKN R108 MEGA Resource Decryptor + Stub Body Recovery"
            echo
            echo "- Offline/static only; target EXE is never executed."
            echo "- Fixes R107 IL method-parser failure."
            echo "- Correlates exact manifest resource names with Rijndael/CryptoStream/Deflate/PrepareMethod helpers."
            echo
            if [ -f "$OUT/review/61_R108_SUMMARY.txt" ]; then
              echo '```text'
              cat "$OUT/review/61_R108_SUMMARY.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload R108 final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R108-RESOURCE-DECRYPTOR-STUB-RECOVERY-EVIDENCE
          path: /tmp/r108/review
          if-no-files-found: error
          retention-days: 30
