                          states={x["state"] for x in z.trace if x.get("is_main")}
                          score=0
                          for st,w in ((626,5),(631,10),(289,20),(292,30),(558,50),(565,60),(75,80),(16,100),(305,150),(533,300),(569,350),(17,500),(157,500)):
