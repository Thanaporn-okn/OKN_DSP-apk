name: OKN R96 Official Client Protocol Decompiler OFFLINE ONLY

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/android-firmware-tool.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: okn-r96-official-client-protocol-${{ github.ref }}
  cancel-in-progress: true

env:
  OUT: /tmp/okn-r96
  ANDROID_URL: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-01.apk_.zip"
  WINDOWS_URL: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-08.exe_.zip"
  LIVE_BOARD_USB: "NO"
  HOST_TO_DEVICE_USB: "NO"
  FLASH_ERASE_WRITE: "NO"
  FLASH_ALLOWED: "NO"

jobs:
  mine:
    name: Decompile official Android and Windows clients / STATIC ONLY
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fail-closed offline-only scope gate
        shell: bash
        run: |
          set -euo pipefail
          test "$LIVE_BOARD_USB" = "NO"
          test "$HOST_TO_DEVICE_USB" = "NO"
          test "$FLASH_ERASE_WRITE" = "NO"
          test "$FLASH_ALLOWED" = "NO"

          rm -rf "$OUT"
          mkdir -p "$OUT"/{downloads,android,windows,decompiled,evidence,review}

          cat > "$OUT/evidence/00_SCOPE.txt" <<'EOF'
          REVISION=R96
          MODE=OFFLINE_STATIC_ONLY
          TARGET=GoloPine_DSTech_BP1048P4
          KNOWN_PRODUCTION_USB=6324:1719
          KNOWN_HID_USAGE=FF00:55AA
          BOARD_USB_ACCESS=NO
          LIVE_USB_COMMANDS=NO
          HOST_TO_DEVICE_USB=NO
          SET_REPORT_LIVE=NO
          OUTPUT_TRANSFER_LIVE=NO
          ERASE=NO
          WRITE=NO
          UNLOCK=NO
          FLASH_ALLOWED=NO
          GOAL=Recover_protocol_command_ids_and_packet_layout_from_official_clients
          EOF

      - name: Install offline-analysis utilities
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            unzip p7zip-full file binutils jq default-jre-headless mono-utils

          {
            echo "java=$(java -version 2>&1 | head -1)"
            echo "dotnet=$(dotnet --version 2>/dev/null || true)"
            echo "monodis=$(monodis --version 2>&1 | head -1 || true)"
          } > "$OUT/evidence/01_TOOL_VERSIONS.txt"

      - name: Download official clients
        shell: bash
        run: |
          set -euo pipefail

          fetch() {
            local url="$1"
            local out="$2"
            curl \
              --fail --location --retry 4 --retry-all-errors \
              --connect-timeout 20 --max-time 240 \
              --user-agent "Mozilla/5.0 OKN-R96-Interop-Research" \
              --referer "https://golodsp.com/7%E9%80%9A%E9%81%93%E9%9F%B3%E9%A2%91%E5%89%8D%E7%BA%A7/" \
              --output "$out" "$url"
            test -s "$out"
          }

          fetch "$ANDROID_URL" "$OUT/downloads/android.zip"
          fetch "$WINDOWS_URL" "$OUT/downloads/windows.zip"

          sha256sum "$OUT/downloads/"*.zip > "$OUT/evidence/02_DOWNLOAD_SHA256.txt"
          file "$OUT/downloads/"*.zip > "$OUT/evidence/03_DOWNLOAD_FILE_TYPES.txt"

      - name: Extract and select real APK and EXE
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT/android/pkg" "$OUT/windows/pkg"

          7z x -y "$OUT/downloads/android.zip" -o"$OUT/android/pkg" >/dev/null
          7z x -y "$OUT/downloads/windows.zip" -o"$OUT/windows/pkg" >/dev/null

          APK="$(
            find "$OUT/android/pkg" -type f -iname '*.apk' \
              ! -path '*/__MACOSX/*' ! -name '._*' -size +100k \
              -print | sort | head -n1
          )"
          EXE="$(
            find "$OUT/windows/pkg" -type f -iname '*.exe' \
              ! -path '*/__MACOSX/*' ! -name '._*' -size +100k \
              -print | sort | head -n1
          )"

          test -n "$APK"
          test -n "$EXE"

          file "$APK" | grep -qi 'Android package'
          unzip -t "$APK" >/dev/null
          file "$EXE" | grep -Eqi 'PE32|Mono/.Net|assembly'

          cp "$APK" "$OUT/android/golopine.apk"
          cp "$EXE" "$OUT/windows/dstech.exe"

          {
            echo "APK=$APK"
            echo "APK_SIZE=$(stat -c%s "$APK")"
            echo "APK_TYPE=$(file -b "$APK")"
            echo "EXE=$EXE"
            echo "EXE_SIZE=$(stat -c%s "$EXE")"
            echo "EXE_TYPE=$(file -b "$EXE")"
          } > "$OUT/evidence/04_SELECTED_BINARIES.txt"

          sha256sum "$OUT/android/golopine.apk" "$OUT/windows/dstech.exe" \
            > "$OUT/evidence/05_SELECTED_SHA256.txt"

      - name: Decompile real Android APK with JADX
        shell: bash
        run: |
          set -euo pipefail

          JADX_VER="1.5.2"
          curl -fsSL --retry 4 \
            -o "$OUT/downloads/jadx.zip" \
            "https://github.com/skylot/jadx/releases/download/v${JADX_VER}/jadx-${JADX_VER}.zip"

          mkdir -p "$OUT/jadx" "$OUT/decompiled/android" "$OUT/android/raw"
          unzip -q "$OUT/downloads/jadx.zip" -d "$OUT/jadx"

          set +e
          "$OUT/jadx/bin/jadx" \
            --no-res --show-bad-code --threads-count 2 \
            -d "$OUT/decompiled/android" \
            "$OUT/android/golopine.apk" \
            > "$OUT/evidence/10_JADX_STDOUT.txt" \
            2> "$OUT/evidence/11_JADX_STDERR.txt"
          JADX_RC=$?
          set -e
          printf 'JADX_RC=%s\n' "$JADX_RC" > "$OUT/evidence/12_JADX_STATUS.txt"

          7z x -y "$OUT/android/golopine.apk" -o"$OUT/android/raw" >/dev/null

          find "$OUT/decompiled/android" -type f | sort \
            > "$OUT/evidence/13_ANDROID_DECOMPILED_FILES.txt"
          find "$OUT/android/raw" -type f | sort \
            > "$OUT/evidence/14_ANDROID_RAW_FILES.txt"

      - name: Decompile .NET Windows client with ILSpy and monodis fallback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT/decompiled/windows-ilspy" "$OUT/decompiled/windows-il"

          ILSPY_OK=false

          if command -v dotnet >/dev/null 2>&1; then
            export PATH="$PATH:$HOME/.dotnet/tools"
            if dotnet tool install --global ilspycmd \
                > "$OUT/evidence/20_ILSPY_INSTALL_STDOUT.txt" \
                2> "$OUT/evidence/21_ILSPY_INSTALL_STDERR.txt"; then
              if ilspycmd --version > "$OUT/evidence/22_ILSPY_VERSION.txt" 2>&1; then
                set +e
                ilspycmd \
                  --project \
                  --outputdir "$OUT/decompiled/windows-ilspy" \
                  "$OUT/windows/dstech.exe" \
                  > "$OUT/evidence/23_ILSPY_STDOUT.txt" \
                  2> "$OUT/evidence/24_ILSPY_STDERR.txt"
                rc=$?
                set -e
                echo "ILSPY_RC=$rc" > "$OUT/evidence/25_ILSPY_STATUS.txt"
                if [ "$rc" = 0 ]; then ILSPY_OK=true; fi
              fi
            else
              echo "ILSPY_INSTALL_FAILED=true" > "$OUT/evidence/25_ILSPY_STATUS.txt"
            fi
          else
            echo "DOTNET_NOT_FOUND=true" > "$OUT/evidence/25_ILSPY_STATUS.txt"
          fi

          # Always produce IL too; this is useful for exact integer constants.
          set +e
          monodis \
            --output="$OUT/decompiled/windows-il/dstech.il" \
            "$OUT/windows/dstech.exe" \
            > "$OUT/evidence/26_MONODIS_STDOUT.txt" \
            2> "$OUT/evidence/27_MONODIS_STDERR.txt"
          MONO_RC=$?
          set -e

          {
            echo "ILSPY_OK=$ILSPY_OK"
            echo "MONODIS_RC=$MONO_RC"
          } > "$OUT/evidence/28_WINDOWS_DECOMPILER_STATUS.txt"

          find "$OUT/decompiled/windows-ilspy" -type f | sort \
            > "$OUT/evidence/29_WINDOWS_CSHARP_FILES.txt"
          find "$OUT/decompiled/windows-il" -type f | sort \
            > "$OUT/evidence/30_WINDOWS_IL_FILES.txt"

      - name: Mine Android transport and command evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re,json,subprocess,hashlib

          out=Path(os.environ["OUT"])
          ev=out/"evidence"
          roots=[out/"decompiled/android",out/"android/raw"]

          terms=[
            "UsbManager","UsbDevice","UsbDeviceConnection","UsbInterface","UsbEndpoint",
            "controlTransfer","bulkTransfer","UsbRequest","claimInterface",
            "6324","1719","0x6324","0x1719","55AA","55aa","FF00","ff00",
            "GET_REPORT","SET_REPORT","HidD_","hid","USBHID",
            "DSTech","GoloPine","AudioDSP","BP1048","BP1048P4",
            "ReadSensor","WriteActuator","UFE_","payload","command",
            "firmware","upgrade","flash","erase","read","write","save","load",
            "volume","gain","equalizer","delay","crossover"
          ]

          text_ext={".java",".kt",".xml",".smali",".txt",".json",".js",".properties",".ini",".cfg"}
          hits=[]
          arrays=[]
          binary_strings=[]

          for root in roots:
            if not root.exists(): continue
            for p in root.rglob("*"):
              if not p.is_file(): continue
              rel=str(p.relative_to(out))
              if p.suffix.lower() in text_ext:
                try: txt=p.read_text(errors="ignore")
                except: continue
                lines=txt.splitlines()
                for i,line in enumerate(lines):
                  matched=[t for t in terms if t.lower() in line.lower()]
                  if not matched: continue
                  lo=max(0,i-8); hi=min(len(lines),i+15)
                  hits.append({
                    "path":rel,"line":i+1,"terms":matched,
                    "context":"\n".join(f"{j+1}: {lines[j]}" for j in range(lo,hi))[:16000]
                  })

                # Candidate Java/Kotlin byte arrays.
                for m in re.finditer(r'(?is)(?:byteArrayOf|new\s+byte\s*\[\]\s*\{|byte\s*\[\][^=]*=\s*\{)(.{1,3000}?)(?:\)|\})',txt):
                  vals=[]
                  for tok in re.findall(r'(?:\(byte\)\s*)?(0x[0-9A-Fa-f]{1,2}|-?\d{1,3})',m.group(1)):
                    try:
                      v=int(tok,0)
                      if v<0: v=(v+256)&255
                      if 0<=v<=255: vals.append(v)
                    except: pass
                  if len(vals)>=4:
                    b=bytes(vals)
                    arrays.append({
                      "path":rel,
                      "line":txt.count("\n",0,m.start())+1,
                      "length":len(b),
                      "hex":b[:512].hex().upper(),
                      "sha256":hashlib.sha256(b).hexdigest()
                    })

              if p.suffix.lower() in {".dex",".so",".bin",".dat"}:
                try:
                  r=subprocess.run(["strings","-a","-n","4",str(p)],
                                   capture_output=True,text=True,errors="ignore",timeout=30)
                except Exception:
                  continue
                for s in r.stdout.splitlines():
                  low=s.lower()
                  if any(t.lower() in low for t in terms):
                    binary_strings.append({"path":rel,"string":s[:3000]})

          ev.joinpath("40_ANDROID_PROTOCOL_HITS.json").write_text(
            json.dumps(hits,indent=2,ensure_ascii=False)+"\n")
          ev.joinpath("41_ANDROID_BYTE_ARRAYS.json").write_text(
            json.dumps(arrays,indent=2,ensure_ascii=False)+"\n")
          ev.joinpath("42_ANDROID_BINARY_STRINGS.json").write_text(
            json.dumps(binary_strings,indent=2,ensure_ascii=False)+"\n")
          ev.joinpath("43_ANDROID_SUMMARY.json").write_text(json.dumps({
            "protocol_hits":len(hits),
            "byte_arrays":len(arrays),
            "binary_string_hits":len(binary_strings)
          },indent=2)+"\n")
          PY

      - name: Mine Windows C sharp and IL for exact protocol constants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re,json

          out=Path(os.environ["OUT"])
          ev=out/"evidence"
          croot=out/"decompiled/windows-ilspy"
          ilfile=out/"decompiled/windows-il/dstech.il"

          keywords=[
            "DSTechAcutatorCommand","ReadSensorPeriperalCommand",
            "ReadSensorBulkCommand","ReadSensorFifoCommand",
            "ReadActuatorPeriperalCommand","WriteActuatorPeriperalCommand",
            "UFE_WRITE_ACTUATOR_COMMAND","UFE_READ_SENSOR_ACTUATOR_COMMAND",
            "UFE_RESPONSE_READ_SENSOR_ACTUATOR_COMMAND",
            "UFE_READ_SENSOR_FIFO_COMMAND","UFE_READ_SENSOR_ACTUATOR_BULK_COMMAND",
            "UFE_RESPONSE_READ_SENSOR_ACTUATOR_BULK_COMMAND",
            "USBHID","HidD_SetOutputReport","HidD_GetInputReport",
            "HidD_SetFeature","HidRead","HidDataReceived",
            "VendorID","ProductID","6324","1719","0x6324","0x1719",
            "55AA","AA55","FF00",
            "firmware","upgrade","flash","erase"
          ]

          csharp_hits=[]
          enum_blocks=[]
          numeric_lines=[]
          method_windows=[]

          if croot.exists():
            for p in croot.rglob("*.cs"):
              try: txt=p.read_text(errors="ignore")
              except: continue
              rel=str(p.relative_to(out))
              lines=txt.splitlines()

              for i,line in enumerate(lines):
                if any(k.lower() in line.lower() for k in keywords):
                  lo=max(0,i-12); hi=min(len(lines),i+30)
                  csharp_hits.append({
                    "path":rel,"line":i+1,
                    "context":"\n".join(f"{j+1}: {lines[j]}" for j in range(lo,hi))[:20000]
                  })

                if re.search(r'\b(?:const|static\s+readonly)\b',line) and re.search(r'(?:0x[0-9A-Fa-f]+|\b\d+\b)',line):
                  if any(k.lower() in ("\n".join(lines[max(0,i-8):min(len(lines),i+9)])).lower()
                         for k in keywords):
                    numeric_lines.append({"path":rel,"line":i+1,"text":line.strip()[:3000]})

              for m in re.finditer(r'(?is)\benum\s+([A-Za-z_]\w*)[^{]*\{(.{1,20000}?)\}',txt):
                name=m.group(1)
                body=m.group(2)
                if any(k.lower() in (name+"\n"+body).lower() for k in keywords) or \
                   any(x in name.lower() for x in ("command","sensor","actuator","hid","ufe")):
                  enum_blocks.append({
                    "path":rel,
                    "line":txt.count("\n",0,m.start())+1,
                    "name":name,
                    "body":body[:18000]
                  })

              # Method bodies whose name suggests actual transport/packet construction.
              for m in re.finditer(
                r'(?m)^\s*(?:public|private|protected|internal)\s+(?:static\s+)?'
                r'[^\n{;=]+\b(ReadSensor\w*|WriteActuator\w*|HidRead\w*|HidWrite\w*|'
                r'Send\w*|Receive\w*|Build\w*Command\w*|appendRead\w*|appendWrite\w*)\s*\(',
                txt,re.I):
                start=m.start()
                # bounded source window rather than whole proprietary file
                snippet=txt[start:start+16000]
                method_windows.append({
                  "path":rel,
                  "line":txt.count("\n",0,start)+1,
                  "method":m.group(1),
                  "snippet":snippet
                })

          il_hits=[]
          if ilfile.exists():
            lines=ilfile.read_text(errors="ignore").splitlines()
            for i,line in enumerate(lines):
              if any(k.lower() in line.lower() for k in keywords):
                lo=max(0,i-18); hi=min(len(lines),i+45)
                il_hits.append({
                  "line":i+1,
                  "context":"\n".join(f"{j+1}: {lines[j]}" for j in range(lo,hi))[:22000]
                })

          ev.joinpath("50_WINDOWS_CSHARP_HITS.json").write_text(
            json.dumps(csharp_hits,indent=2,ensure_ascii=False)+"\n")
          ev.joinpath("51_WINDOWS_ENUM_BLOCKS.json").write_text(
            json.dumps(enum_blocks,indent=2,ensure_ascii=False)+"\n")
          ev.joinpath("52_WINDOWS_NUMERIC_CONSTANTS.json").write_text(
            json.dumps(numeric_lines,indent=2,ensure_ascii=False)+"\n")
          ev.joinpath("53_WINDOWS_METHOD_WINDOWS.json").write_text(
            json.dumps(method_windows,indent=2,ensure_ascii=False)+"\n")
          ev.joinpath("54_WINDOWS_IL_HITS.json").write_text(
            json.dumps(il_hits,indent=2,ensure_ascii=False)+"\n")
          ev.joinpath("55_WINDOWS_SUMMARY.json").write_text(json.dumps({
            "csharp_hits":len(csharp_hits),
            "enum_blocks":len(enum_blocks),
            "numeric_constants":len(numeric_lines),
            "method_windows":len(method_windows),
            "il_hits":len(il_hits)
          },indent=2)+"\n")
          PY

      - name: Classify candidate read paths without enabling live commands
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json,re

          out=Path(os.environ["OUT"])
          ev=out/"evidence"

          def load(name,default):
            p=ev/name
            if not p.exists(): return default
            return json.loads(p.read_text(errors="ignore"))

          enums=load("51_WINDOWS_ENUM_BLOCKS.json",[])
          nums=load("52_WINDOWS_NUMERIC_CONSTANTS.json",[])
          methods=load("53_WINDOWS_METHOD_WINDOWS.json",[])
          csharp=load("50_WINDOWS_CSHARP_HITS.json",[])
          android=load("40_ANDROID_PROTOCOL_HITS.json",[])

          read_words=("read","get","query","status","sensor","receive","recv","load")
          write_words=("write","set","save","flash","erase","upgrade","update","reset","unlock")

          read_candidates=[]
          unsafe_candidates=[]

          for row in enums+nums+methods+csharp+android:
            blob=json.dumps(row,ensure_ascii=False).lower()
            if any(w in blob for w in read_words):
              read_candidates.append(row)
            if any(w in blob for w in write_words):
              unsafe_candidates.append(row)

          verdict={
            "known_live_usb":{"vid":"6324","pid":"1719","usage_page":"FF00","usage":"55AA"},
            "read_candidate_count":len(read_candidates),
            "unsafe_or_write_candidate_count":len(unsafe_candidates),
            "read_candidates":read_candidates[:500],
            "unsafe_or_write_candidates":unsafe_candidates[:500],
            "live_board_commands_allowed":False,
            "firmware_readback_proven":False,
            "promotion_rule":"A command may be tested live only after official-client decompilation grounds its exact command id, frame layout, response semantics, and shows no erase/write/unlock side effect."
          }
          ev.joinpath("60_PROTOCOL_VERDICT.json").write_text(
            json.dumps(verdict,indent=2,ensure_ascii=False)+"\n")

          summary=[
            "OKN R96 OFFLINE PROTOCOL DECOMPILER",
            "LIVE_BOARD_COMMANDS_ALLOWED=false",
            "FIRMWARE_READBACK_PROVEN=false",
            f"READ_CANDIDATES={len(read_candidates)}",
            f"UNSAFE_OR_WRITE_CANDIDATES={len(unsafe_candidates)}",
            "NEXT_GATE=Review exact enums/constants/methods before constructing any live host-to-device packet."
          ]
          ev.joinpath("61_R96_SUMMARY.txt").write_text("\n".join(summary)+"\n")
          print("\n".join(summary))
          PY

      - name: Build compact evidence artifact
        shell: bash
        run: |
          set -euo pipefail
          cp -a "$OUT/evidence/." "$OUT/review/"

          cat > "$OUT/review/99_SAFETY_ATTESTATION.txt" <<'EOF'
          OFFLINE_STATIC_ONLY=true
          BOARD_USB_ACCESSED=false
          HOST_TO_DEVICE_COMMANDS_SENT=false
          HID_SET_REPORT_LIVE=false
          FLASH_ERASE_WRITE=false
          FULL_FIRMWARE_READBACK_PROVEN=false
          EOF

          (
            cd "$OUT/review"
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          ) > "$OUT/review/SHA256SUMS.txt"

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo "## OKN R96 Official Client Protocol Decompiler"
            echo
            echo "- Offline-only interoperability analysis."
            echo "- No board USB access and no live host-to-device packets."
            echo
            for f in \
              "$OUT/evidence/04_SELECTED_BINARIES.txt" \
              "$OUT/evidence/28_WINDOWS_DECOMPILER_STATUS.txt" \
              "$OUT/evidence/43_ANDROID_SUMMARY.json" \
              "$OUT/evidence/55_WINDOWS_SUMMARY.json" \
              "$OUT/evidence/61_R96_SUMMARY.txt"; do
              if [ -f "$f" ]; then
                echo "### $(basename "$f")"
                echo '```text'
                cat "$f"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload R96 protocol evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R96-OFFICIAL-CLIENT-PROTOCOL-EVIDENCE
          path: /tmp/okn-r96/review
          if-no-files-found: error
          retention-days: 30
