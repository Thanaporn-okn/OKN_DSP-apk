name: OKN R97 Raw IL + Flutter AOT Protocol Miner OFFLINE ONLY

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/android-firmware-tool.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: okn-r97-raw-il-flutter-aot-${{ github.ref }}
  cancel-in-progress: true

env:
  OUT: /tmp/okn-r97
  ANDROID_URL: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-01.apk_.zip"
  WINDOWS_URL: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-08.exe_.zip"
  LIVE_BOARD_USB: "NO"
  HOST_TO_DEVICE_USB: "NO"
  FLASH_ERASE_WRITE: "NO"
  FLASH_ALLOWED: "NO"

jobs:
  mine:
    name: Recover packet layout from raw IL and Flutter AOT / STATIC ONLY
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fail-closed offline-only scope gate
        shell: bash
        run: |
          set -euo pipefail
          test "$LIVE_BOARD_USB" = "NO"
          test "$HOST_TO_DEVICE_USB" = "NO"
          test "$FLASH_ERASE_WRITE" = "NO"
          test "$FLASH_ALLOWED" = "NO"

          rm -rf "$OUT"
          mkdir -p "$OUT"/{downloads,android,windows,il,blutter,evidence,review}

          cat > "$OUT/evidence/00_SCOPE.txt" <<'EOF'
          REVISION=R97
          MODE=OFFLINE_STATIC_ONLY
          TARGET=GoloPine_DSTech_BP1048P4
          KNOWN_PRODUCTION_USB=6324:1719
          KNOWN_HID_USAGE=FF00:55AA
          KNOWN_UFE_WRITE_ACTUATOR=0x57
          KNOWN_UFE_READ_SENSOR_ACTUATOR=0x58
          KNOWN_UFE_READ_SENSOR_JSON=0x59
          KNOWN_UFE_RESPONSE_READ_SENSOR=0x60
          KNOWN_UFE_READ_SENSOR_FIFO=0x61
          KNOWN_UFE_RESPONSE_FIFO=0x62
          KNOWN_UFE_READ_SENSOR_BULK=0x63
          KNOWN_UFE_RESPONSE_SENSOR_BULK=0x64
          KNOWN_UFE_CONTINUE_BULK=0x82
          BOARD_USB_ACCESS=NO
          LIVE_USB_COMMANDS=NO
          HOST_TO_DEVICE_USB=NO
          SET_REPORT_LIVE=NO
          OUTPUT_TRANSFER_LIVE=NO
          ERASE=NO
          WRITE=NO
          UNLOCK=NO
          FLASH_ALLOWED=NO
          GOAL=Recover_exact_read_command_packet_layout_and_transport_from_official_clients
          EOF

      - name: Install static-analysis toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            unzip p7zip-full file binutils jq git curl \
            python3 python3-pip python3-pyelftools python3-requests \
            cmake ninja-build build-essential pkg-config \
            libicu-dev libcapstone-dev default-jre-headless

          {
            echo "python=$(python3 --version)"
            echo "gcc=$(gcc --version | head -1)"
            echo "cmake=$(cmake --version | head -1)"
            echo "dotnet=$(dotnet --version 2>/dev/null || true)"
          } > "$OUT/evidence/01_TOOL_VERSIONS.txt"

      - name: Download official GoloPine clients
        shell: bash
        run: |
          set -euo pipefail

          fetch() {
            local url="$1"
            local out="$2"
            curl \
              --fail --location --retry 4 --retry-all-errors \
              --connect-timeout 20 --max-time 240 \
              --user-agent "Mozilla/5.0 OKN-R97-Interop-Research" \
              --referer "https://golodsp.com/7%E9%80%9A%E9%81%93%E9%9F%B3%E9%A2%91%E5%89%8D%E7%BA%A7/" \
              --output "$out" "$url"
            test -s "$out"
          }

          fetch "$ANDROID_URL" "$OUT/downloads/android.zip"
          fetch "$WINDOWS_URL" "$OUT/downloads/windows.zip"

          sha256sum "$OUT/downloads/"*.zip > "$OUT/evidence/02_DOWNLOAD_SHA256.txt"

      - name: Select real APK and .NET EXE
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$OUT/android/pkg" "$OUT/windows/pkg"
          7z x -y "$OUT/downloads/android.zip" -o"$OUT/android/pkg" >/dev/null
          7z x -y "$OUT/downloads/windows.zip" -o"$OUT/windows/pkg" >/dev/null

          APK="$(
            find "$OUT/android/pkg" -type f -iname '*.apk' \
              ! -path '*/__MACOSX/*' ! -name '._*' -size +100k \
              -print | sort | head -n1
          )"

          EXE="$(
            find "$OUT/windows/pkg" -type f -iname '*.exe' \
              ! -path '*/__MACOSX/*' ! -name '._*' -size +100k \
              -print | sort | head -n1
          )"

          test -n "$APK"
          test -n "$EXE"
          unzip -t "$APK" >/dev/null

          cp "$APK" "$OUT/android/golopine.apk"
          cp "$EXE" "$OUT/windows/dstech.exe"

          {
            echo "APK_SIZE=$(stat -c%s "$OUT/android/golopine.apk")"
            echo "APK_TYPE=$(file -b "$OUT/android/golopine.apk")"
            echo "EXE_SIZE=$(stat -c%s "$OUT/windows/dstech.exe")"
            echo "EXE_TYPE=$(file -b "$OUT/windows/dstech.exe")"
          } > "$OUT/evidence/03_SELECTED_BINARIES.txt"

          sha256sum "$OUT/android/golopine.apk" "$OUT/windows/dstech.exe" \
            > "$OUT/evidence/04_SELECTED_SHA256.txt"

      - name: Dump Windows raw IL and metadata with ILSpy
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PATH:$HOME/.dotnet/tools"

          if ! command -v ilspycmd >/dev/null 2>&1; then
            dotnet tool install --global ilspycmd \
              > "$OUT/evidence/10_ILSPY_INSTALL_STDOUT.txt" \
              2> "$OUT/evidence/11_ILSPY_INSTALL_STDERR.txt"
          fi

          ilspycmd --version > "$OUT/evidence/12_ILSPY_VERSION.txt" 2>&1

          # Whole-assembly IL: useful even when high-level C# bodies are hidden.
          set +e
          ilspycmd --ilcode "$OUT/windows/dstech.exe" \
            > "$OUT/il/all.il" \
            2> "$OUT/evidence/13_ILSPY_ALL_IL_STDERR.txt"
          ALL_IL_RC=$?
          set -e
          echo "ALL_IL_RC=$ALL_IL_RC" > "$OUT/evidence/14_ILSPY_ALL_IL_STATUS.txt"

          # Current ILSpy exposes metadata table dumping; keep it best-effort.
          set +e
          ilspycmd --dump-table MethodDef --json "$OUT/windows/dstech.exe" \
            > "$OUT/il/MethodDef.json" \
            2> "$OUT/evidence/15_METHODDEF_STDERR.txt"
          METHODDEF_RC=$?

          ilspycmd --dump-table TypeDef --json "$OUT/windows/dstech.exe" \
            > "$OUT/il/TypeDef.json" \
            2> "$OUT/evidence/16_TYPEDEF_STDERR.txt"
          TYPEDEF_RC=$?
          set -e

          {
            echo "METHODDEF_RC=$METHODDEF_RC"
            echo "TYPEDEF_RC=$TYPEDEF_RC"
          } > "$OUT/evidence/17_METADATA_DUMP_STATUS.txt"

          types=(
            "DSTech_AudioDSP_Client.UFEHeader"
            "DSTech_AudioDSP_Client.PeriperalCommand"
            "DSTech_AudioDSP_Client.Sensor"
            "DSTech_AudioDSP_Client.Actuator"
            "DSTech_AudioDSP_Client.ReadSensorPeriperalCommand"
            "DSTech_AudioDSP_Client.ReadSensorBulkCommand"
            "DSTech_AudioDSP_Client.ReadSensorFifoCommand"
            "DSTech_AudioDSP_Client.ReadActuatorPeriperalCommand"
            "DSTech_AudioDSP_Client.WriteActuatorPeriperalCommand"
            "DSTech_AudioDSP_Client.UFEcommandBridge"
            "DSTech_AudioDSP_Client.Hid"
            "DSTech_AudioDSP_Client.HidDevice"
            "DSTech_AudioDSP_Client.HIDInterface"
            "DSTech_AudioDSP_Client.DeviceCommunicationStream"
          )

          mkdir -p "$OUT/il/types"
          for t in "${types[@]}"; do
            safe="$(printf '%s' "$t" | tr -c 'A-Za-z0-9._-' '_')"
            set +e
            ilspycmd --ilcode --type "$t" "$OUT/windows/dstech.exe" \
              > "$OUT/il/types/${safe}.il" \
              2> "$OUT/il/types/${safe}.stderr.txt"
            rc=$?
            set -e
            printf '%s\t%s\n' "$rc" "$t" >> "$OUT/evidence/18_TYPE_IL_STATUS.tsv"
          done

      - name: Extract Flutter AOT libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT/android/raw"
          7z x -y "$OUT/android/golopine.apk" -o"$OUT/android/raw" >/dev/null

          LIBDIR="$OUT/android/raw/lib/arm64-v8a"
          test -s "$LIBDIR/libapp.so"
          test -s "$LIBDIR/libflutter.so"

          {
            file "$LIBDIR/libapp.so"
            file "$LIBDIR/libflutter.so"
            sha256sum "$LIBDIR/libapp.so" "$LIBDIR/libflutter.so"
          } > "$OUT/evidence/20_FLUTTER_LIBS.txt"

          strings -a -n 4 "$LIBDIR/libapp.so" \
            > "$OUT/evidence/21_LIBAPP_STRINGS.txt"
          strings -a -n 4 "$LIBDIR/libflutter.so" \
            > "$OUT/evidence/22_LIBFLUTTER_STRINGS.txt"

      - name: Run Blutter against Flutter ARM64 AOT
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 https://github.com/worawit/blutter.git "$OUT/blutter-src"

          set +e
          python3 "$OUT/blutter-src/blutter.py" \
            "$OUT/android/raw/lib/arm64-v8a" \
            "$OUT/blutter/out" \
            > "$OUT/evidence/23_BLUTTER_STDOUT.txt" \
            2> "$OUT/evidence/24_BLUTTER_STDERR.txt"
          BLUTTER_RC=$?
          set -e

          echo "BLUTTER_RC=$BLUTTER_RC" > "$OUT/evidence/25_BLUTTER_STATUS.txt"

          if [ -d "$OUT/blutter/out" ]; then
            find "$OUT/blutter/out" -type f | sort \
              > "$OUT/evidence/26_BLUTTER_FILES.txt"
          else
            : > "$OUT/evidence/26_BLUTTER_FILES.txt"
          fi

      - name: Mine exact Windows IL packet evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re,json

          out=Path(os.environ["OUT"])
          ev=out/"evidence"

          files=[p for p in (out/"il").rglob("*") if p.is_file()]
          terms=[
            "UFE_WRITE_ACTUATOR_COMMAND",
            "UFE_READ_SENSOR_ACTUATOR_COMMAND",
            "UFE_READ_SENSOR_FIFO_COMMAND",
            "UFE_READ_SENSOR_ACTUATOR_JSON_COMMAND",
            "UFE_RESPONSE_READ_SENSOR_ACTUATOR_COMMAND",
            "UFE_RESPONSE_FIFO_SENSOR",
            "UFE_READ_SENSOR_ACTUATOR_BULK_COMMAND",
            "UFE_RESPONSE_READ_SENSOR_ACTUATOR_BULK_COMMAND",
            "UFE_CONTINUE_BULK_SEND",
            "ReadSensorPeriperalCommand",
            "ReadSensorBulkCommand",
            "ReadSensorFifoCommand",
            "ReadActuatorPeriperalCommand",
            "ToByteArray",
            "HidD_SetOutputReport",
            "HidD_GetInputReport",
            "WriteFile","ReadFile",
            "6324","1719",
          ]

          hits=[]
          il_byte_builders=[]

          for p in files:
            try: txt=p.read_text(errors="ignore")
            except: continue
            rel=str(p.relative_to(out))
            lines=txt.splitlines()

            for i,line in enumerate(lines):
              found=[t for t in terms if t.lower() in line.lower()]
              if not found:
                continue
              lo=max(0,i-25); hi=min(len(lines),i+80)
              ctx="\n".join(f"{j+1}: {lines[j]}" for j in range(lo,hi))
              hits.append({
                "path":rel,"line":i+1,"terms":found,"context":ctx[:30000]
              })

            # Find method-sized regions around ToByteArray and extract constants /
            # stelem.i1 / newarr / field loads, which reveal packet construction.
            for m in re.finditer(r'(?im)^.*ToByteArray.*$',txt):
              start=max(0,m.start()-4000)
              end=min(len(txt),m.start()+24000)
              block=txt[start:end]

              constants=re.findall(
                r'(?im)\bldc\.i4(?:\.s)?\s+(-?(?:0x[0-9A-Fa-f]+|\d+))|'
                r'\bldc\.i4\.(\d+|m1)\b',
                block
              )
              flat=[]
              for a,b in constants:
                flat.append(a or b)

              interesting=[
                ln.strip() for ln in block.splitlines()
                if re.search(
                  r'(?i)(newarr|stelem\.i1|ldelem\.u1|ldc\.i4|stfld|ldfld|'
                  r'BitConverter|BlockCopy|CopyTo|memoffset|memlength|sensor|cascade|UFE_)',
                  ln
                )
              ]

              il_byte_builders.append({
                "path":rel,
                "anchor":"ToByteArray",
                "constants":flat[:1000],
                "interesting_lines":interesting[:2000],
                "window":block[:30000]
              })

          ev.joinpath("30_WINDOWS_IL_HITS.json").write_text(
            json.dumps(hits,indent=2,ensure_ascii=False)+"\n")
          ev.joinpath("31_WINDOWS_IL_BYTE_BUILDERS.json").write_text(
            json.dumps(il_byte_builders,indent=2,ensure_ascii=False)+"\n")
          ev.joinpath("32_WINDOWS_IL_SUMMARY.json").write_text(json.dumps({
            "files_scanned":len(files),
            "term_hits":len(hits),
            "tobytearray_windows":len(il_byte_builders)
          },indent=2)+"\n")
          PY

      - name: Mine Flutter AOT protocol evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re,json

          out=Path(os.environ["OUT"])
          ev=out/"evidence"

          roots=[out/"blutter/out"]
          # Include libapp strings even if Blutter fails.
          string_files=[ev/"21_LIBAPP_STRINGS.txt"]

          terms=[
            "usb","hid","report","sensor","actuator","ufe",
            "readSensor","writeActuator","bulk","fifo",
            "6324","1719","55aa","ff00",
            "deviceDescription","authen","firmware","upgrade","flash",
            "MethodChannel","EventChannel","send","receive",
            "mastervolume","biquad","equalizer","crossover"
          ]

          hits=[]
          numeric_neighbors=[]

          for root in roots:
            if not root.exists():
              continue
            for p in root.rglob("*"):
              if not p.is_file():
                continue
              if p.stat().st_size > 80_000_000:
                continue
              try: txt=p.read_text(errors="ignore")
              except: continue
              lines=txt.splitlines()
              rel=str(p.relative_to(out))
              for i,line in enumerate(lines):
                found=[t for t in terms if t.lower() in line.lower()]
                if not found:
                  continue
                lo=max(0,i-20); hi=min(len(lines),i+50)
                ctx="\n".join(f"{j+1}: {lines[j]}" for j in range(lo,hi))
                hits.append({
                  "path":rel,"line":i+1,"terms":found,"context":ctx[:30000]
                })

                if re.search(r'(?<!\d)(87|88|89|96|97|98|99|100|130)(?!\d)',ctx):
                  numeric_neighbors.append({
                    "path":rel,"line":i+1,"context":ctx[:30000]
                  })

          for p in string_files:
            if not p.exists(): continue
            lines=p.read_text(errors="ignore").splitlines()
            for i,line in enumerate(lines):
              if any(t.lower() in line.lower() for t in terms):
                lo=max(0,i-10); hi=min(len(lines),i+20)
                hits.append({
                  "path":str(p.relative_to(out)),
                  "line":i+1,
                  "terms":[t for t in terms if t.lower() in line.lower()],
                  "context":"\n".join(
                    f"{j+1}: {lines[j]}" for j in range(lo,hi)
                  )[:20000]
                })

          ev.joinpath("40_FLUTTER_AOT_HITS.json").write_text(
            json.dumps(hits,indent=2,ensure_ascii=False)+"\n")
          ev.joinpath("41_FLUTTER_COMMAND_ID_NEIGHBORS.json").write_text(
            json.dumps(numeric_neighbors,indent=2,ensure_ascii=False)+"\n")
          ev.joinpath("42_FLUTTER_AOT_SUMMARY.json").write_text(json.dumps({
            "protocol_hits":len(hits),
            "command_id_neighbors":len(numeric_neighbors)
          },indent=2)+"\n")
          PY

      - name: Correlate command IDs and packet layout evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json,re

          out=Path(os.environ["OUT"])
          ev=out/"evidence"

          def load(name, default):
            p=ev/name
            return json.loads(p.read_text(errors="ignore")) if p.exists() else default

          ilhits=load("30_WINDOWS_IL_HITS.json",[])
          builders=load("31_WINDOWS_IL_BYTE_BUILDERS.json",[])
          flutter=load("40_FLUTTER_AOT_HITS.json",[])
          neighbors=load("41_FLUTTER_COMMAND_ID_NEIGHBORS.json",[])

          known={
            "write_actuator":0x57,
            "read_sensor_actuator":0x58,
            "read_sensor_json":0x59,
            "response_read_sensor":0x60,
            "read_sensor_fifo":0x61,
            "response_fifo":0x62,
            "read_sensor_bulk":0x63,
            "response_sensor_bulk":0x64,
            "continue_bulk":0x82,
          }

          # Packet layout is only "proven" when concrete byte construction or
          # equivalent AOT code is recovered, not merely enum names.
          builder_text=json.dumps(builders,ensure_ascii=False).lower()
          concrete_ops=any(x in builder_text for x in [
            "stelem.i1","newarr","blockcopy","memoffset","memlength"
          ])
          nonempty_builder=any(
            len(x.get("interesting_lines",[])) >= 3 for x in builders
          )
          packet_layout_proven=bool(concrete_ops and nonempty_builder)

          verdict={
            "exact_command_ids_from_official_windows_client":known,
            "windows_il_hit_count":len(ilhits),
            "windows_tobytearray_windows":len(builders),
            "flutter_protocol_hits":len(flutter),
            "flutter_command_id_neighbors":len(neighbors),
            "packet_layout_proven":packet_layout_proven,
            "sensor_parameter_read_command_proven":True,
            "full_flash_readback_proven":False,
            "live_board_commands_allowed":False,
            "reason":"Command IDs are grounded, but no live host-to-device packet is allowed until the exact packet layout, target sensor/address semantics, and non-destructive response path are proven."
          }

          ev.joinpath("50_R97_VERDICT.json").write_text(
            json.dumps(verdict,indent=2,ensure_ascii=False)+"\n")

          lines=[
            "OKN R97 RAW IL + FLUTTER AOT PROTOCOL MINER",
            "OFFLINE_ONLY=true",
            f"WINDOWS_IL_HITS={len(ilhits)}",
            f"WINDOWS_TOBYTEARRAY_WINDOWS={len(builders)}",
            f"FLUTTER_PROTOCOL_HITS={len(flutter)}",
            f"FLUTTER_COMMAND_ID_NEIGHBORS={len(neighbors)}",
            f"PACKET_LAYOUT_PROVEN={str(packet_layout_proven).lower()}",
            "SENSOR_PARAMETER_READ_COMMAND_PROVEN=true",
            "FULL_FLASH_READBACK_PROVEN=false",
            "LIVE_BOARD_COMMANDS_ALLOWED=false",
          ]
          ev.joinpath("51_R97_SUMMARY.txt").write_text("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY

      - name: Build compact evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          cp -a "$OUT/evidence/." "$OUT/review/"

          # Include only compact type-specific IL, not the complete proprietary
          # application decompilation.
          mkdir -p "$OUT/review/type-il"
          cp -a "$OUT/il/types/." "$OUT/review/type-il/" 2>/dev/null || true

          cat > "$OUT/review/99_SAFETY_ATTESTATION.txt" <<'EOF'
          OFFLINE_STATIC_ONLY=true
          BOARD_USB_ACCESSED=false
          HOST_TO_DEVICE_COMMANDS_SENT=false
          HID_SET_REPORT_LIVE=false
          FLASH_ERASE_WRITE=false
          FULL_FLASH_READBACK_PROVEN=false
          EOF

          (
            cd "$OUT/review"
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          ) > "$OUT/review/SHA256SUMS.txt"

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo "## OKN R97 Raw IL + Flutter AOT Protocol Miner"
            echo
            echo "- Static/offline analysis only."
            echo "- No board access and no live OUT/SET_REPORT."
            echo
            for f in \
              "$OUT/evidence/03_SELECTED_BINARIES.txt" \
              "$OUT/evidence/14_ILSPY_ALL_IL_STATUS.txt" \
              "$OUT/evidence/17_METADATA_DUMP_STATUS.txt" \
              "$OUT/evidence/25_BLUTTER_STATUS.txt" \
              "$OUT/evidence/32_WINDOWS_IL_SUMMARY.json" \
              "$OUT/evidence/42_FLUTTER_AOT_SUMMARY.json" \
              "$OUT/evidence/51_R97_SUMMARY.txt"; do
              if [ -f "$f" ]; then
                echo "### $(basename "$f")"
                echo '```text'
                cat "$f"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload R97 protocol evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R97-RAW-IL-FLUTTER-AOT-PROTOCOL-EVIDENCE
          path: /tmp/okn-r97/review
          if-no-files-found: error
          retention-days: 30
