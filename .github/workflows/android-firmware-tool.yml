      - name: Static fallback slice for key IV and h15 reader position
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re,json,collections

          out=Path(os.environ["OUT"])
          n9=(out/"evidence/20_N9_METHOD.il").read_text(errors="ignore")

          targets=[
              ("resource_open","h15IL2i6yy2BZV8RqM.YuRwd1JALC4oy32W66"),
              ("read_int32","qfkv4ZNDynVciIciQy6"),
              ("read_bytes","sWg0PuN2fLSfxi2LB0D"),
              ("key_alias","stloc.s 47"),
              ("iv_use","ldloc.s 8"),
              ("create_decryptor","VnHlfpNorSGR6U9GUOp"),
              ("crypto_stream","CryptoStream::.ctor"),
              ("local12","stloc.s 12")
          ]

          lines=n9.splitlines()
          hits=[]
          for kind,needle in targets:
              for i,l in enumerate(lines):
                  if needle in l:
                      hits.append({
                          "kind":kind,"line":i+1,"matched":l.strip(),
                          "context":"\n".join(lines[max(0,i-15):min(len(lines),i+25)])
                      })

          # Enumerate all explicit writes to key local17 and IV local100.
          writes=[]
          for i,l in enumerate(lines):
              if re.search(r'\bldloc(?:\.s)?\s+(17|100)\b',l):
                  loc=int(re.search(r'(17|100)',l).group(1))
                  ctx="\n".join(lines[i:min(len(lines),i+10)])
                  if "stelem.i1" in ctx:
                      writes.append({"local":loc,"line":i+1,"context":ctx})

          (out/"evidence/40_STATIC_PIPELINE_HITS.json").write_text(
              json.dumps(hits,indent=2,ensure_ascii=False)+"\n")
          (out/"evidence/41_KEY_IV_WRITE_SITES.json").write_text(
              json.dumps(writes,indent=2,ensure_ascii=False)+"\n")

          print("pipeline_hits",len(hits))
          print("key_iv_write_sites",len(writes))
          PY

