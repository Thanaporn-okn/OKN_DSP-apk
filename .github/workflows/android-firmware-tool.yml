name: OKN R105 MEGA Updater + Bootloader + Firmware Miner OFFLINE ONLY

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/android-firmware-tool.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: okn-r105-mega-offline-${{ github.ref }}
  cancel-in-progress: true

env:
  WINDOWS_URL: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-08.exe_.zip"
  LIVE_BOARD_USB: "NO"
  HOST_TO_DEVICE_USB: "NO"
  FLASH_ERASE_WRITE: "NO"
  FLASH_ALLOWED: "NO"

jobs:
  dotnet_protocol:
    name: 1 - Decompile updater + HID protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OUT: /tmp/r105-dotnet

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$LIVE_BOARD_USB" = "NO"
          test "$HOST_TO_DEVICE_USB" = "NO"
          test "$FLASH_ERASE_WRITE" = "NO"
          test "$FLASH_ALLOWED" = "NO"
          rm -rf "$OUT"
          mkdir -p "$OUT"/{downloads,pkg,decompiled,il,evidence}

          cat > "$OUT/evidence/00_SCOPE.txt" <<'EOF'
          REVISION=R105
          JOB=DOTNET_PROTOCOL
          MODE=OFFLINE_STATIC_ONLY
          TARGET_USB=6324:1719
          TARGET_HID_USAGE=FF00:55AA
          BOARD_USB_ACCESS=NO
          LIVE_USB_COMMANDS=NO
          HOST_TO_DEVICE_USB=NO
          SET_REPORT_LIVE=NO
          FLASH_ERASE_WRITE=NO
          FLASH_ALLOWED=NO
          EOF

      - name: Install analysis tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            unzip p7zip-full file binutils jq curl mono-utils python3 python3-pip
          python3 -m pip install --break-system-packages --quiet dnfile pefile

      - name: Download official Windows client
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            --connect-timeout 20 --max-time 240 \
            --user-agent "Mozilla/5.0 OKN-R105-Interop-Research" \
            --referer "https://golodsp.com/7%E9%80%9A%E9%81%93%E9%9F%B3%E9%A2%91%E5%89%8D%E7%BA%A7/" \
            --output "$OUT/downloads/windows.zip" "$WINDOWS_URL"

          7z x -y "$OUT/downloads/windows.zip" -o"$OUT/pkg" >/dev/null

          EXE="$(
            find "$OUT/pkg" -type f -iname '*.exe' \
              ! -path '*/__MACOSX/*' ! -name '._*' -size +100k \
              -print | sort | head -n1
          )"
          test -n "$EXE"
          cp "$EXE" "$OUT/dstech.exe"

          {
            file "$OUT/dstech.exe"
            sha256sum "$OUT/dstech.exe"
            stat -c 'SIZE=%s' "$OUT/dstech.exe"
          } > "$OUT/evidence/01_CLIENT_IDENTITY.txt"

      - name: Decompile C sharp and raw IL
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PATH:$HOME/.dotnet/tools"

          if ! command -v ilspycmd >/dev/null 2>&1; then
            dotnet tool install --global ilspycmd \
              > "$OUT/evidence/10_ILSPY_INSTALL_STDOUT.txt" \
              2> "$OUT/evidence/11_ILSPY_INSTALL_STDERR.txt"
          fi

          ilspycmd --project \
            --outputdir "$OUT/decompiled" \
            "$OUT/dstech.exe" \
            > "$OUT/evidence/12_CSHARP_STDOUT.txt" \
            2> "$OUT/evidence/13_CSHARP_STDERR.txt"

          ilspycmd --ilcode "$OUT/dstech.exe" \
            > "$OUT/il/all.il" \
            2> "$OUT/evidence/14_IL_STDERR.txt"

          {
            echo "CSHARP_RC=0"
            echo "IL_RC=0"
            ilspycmd --version 2>&1
          } > "$OUT/evidence/15_DECOMPILER_STATUS.txt"

      - name: Mine updater, bootloader, HID and verification paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re,json

          out=Path(os.environ["OUT"])
          root=out/"decompiled"
          ev=out/"evidence"

          categories={
            "updater":[
              "UpdateCommandThread","firmware","upgrade","bootloader","flash",
              "erase","program","download","mva","update"
            ],
            "device_to_host":[
              "HidD_GetInputReport","HidD_GetFeature","ReadFile",
              "GetInputReport","GetFeature","receive","response","ack"
            ],
            "host_to_device":[
              "HidD_SetOutputReport","HidD_SetFeature","WriteFile",
              "SetOutputReport","SetFeature","send"
            ],
            "verify_status":[
              "verify","status","checksum","crc","version","query",
              "readback","compare","check","ack"
            ],
            "readback_words":[
              "ReadFlash","ReadFirmware","FirmwareRead","FlashRead",
              "ReadMemory","MemoryRead","DumpFlash","DumpFirmware",
              "BackupFirmware","ReadRom","ReadROM"
            ]
          }

          hits=[]
          method_windows=[]
          method_pat=re.compile(
            r'(?m)^\s*(?:public|private|protected|internal)\s+'
            r'(?:static\s+)?[^\n{;=]+\s+([A-Za-z_]\w*)\s*\([^)]*\)\s*\{'
          )

          for p in root.rglob("*.cs"):
            try: txt=p.read_text(errors="ignore")
            except: continue
            lines=txt.splitlines()
            rel=str(p.relative_to(out))

            for i,line in enumerate(lines):
              matched={}
              for cat,terms in categories.items():
                ms=[t for t in terms if t.lower() in line.lower()]
                if ms: matched[cat]=ms
              if matched:
                lo=max(0,i-18); hi=min(len(lines),i+45)
                hits.append({
                  "path":rel,"line":i+1,"matched":matched,
                  "context":"\n".join(
                    f"{j+1}: {lines[j]}" for j in range(lo,hi)
                  )[:26000]
                })

            for m in method_pat.finditer(txt):
              name=m.group(1)
              start=m.start()
              snippet=txt[start:start+36000]
              low=snippet.lower()
              matched_cats=[
                cat for cat,terms in categories.items()
                if any(t.lower() in low[:16000] for t in terms)
              ]
              if name=="UpdateCommandThread" or matched_cats:
                method_windows.append({
                  "path":rel,
                  "line":txt.count("\n",0,start)+1,
                  "method":name,
                  "categories":matched_cats,
                  "snippet":snippet
                })

          (ev/"20_SOURCE_HITS.json").write_text(
            json.dumps(hits,indent=2,ensure_ascii=False)+"\n")
          (ev/"21_METHOD_WINDOWS.json").write_text(
            json.dumps(method_windows,indent=2,ensure_ascii=False)+"\n")
          print("source_hits",len(hits))
          print("method_windows",len(method_windows))
          PY

      - name: Build updater call map and constants map
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re,json,collections

          out=Path(os.environ["OUT"])
          ev=out/"evidence"
          methods=json.loads((ev/"21_METHOD_WINDOWS.json").read_text())

          rows=[]
          call_index=collections.defaultdict(set)

          for m in methods:
            txt=m["snippet"]
            constants=[]
            for cm in re.finditer(r'(?<![\w])(?:0x[0-9A-Fa-f]+|\d+)(?![\w])',txt):
              tok=cm.group(0)
              try: v=int(tok,0)
              except: continue
              if 0 <= v <= 0xFFFFFFFF:
                constants.append({
                  "value":v,"hex":hex(v),"offset":cm.start()
                })

            calls=[]
            for c in re.finditer(r'\b([A-Za-z_]\w*)\s*\(',txt):
              name=c.group(1)
              if name in {
                "if","for","while","switch","catch","lock","using",
                "sizeof","typeof","nameof","new"
              }:
                continue
              calls.append(name)
              call_index[m["method"]].add(name)

            arrays=[]
            for a in re.finditer(
              r'(?is)(?:new\s+byte\s*\[[^\]]*\]|new\s+byte\s*\[\]\s*\{).{0,2500}',
              txt
            ):
              arrays.append(a.group(0)[:5000])

            rows.append({
              "path":m["path"],
              "method":m["method"],
              "categories":m["categories"],
              "constants":constants[:2000],
              "calls":calls[:3000],
              "byte_array_windows":arrays[:300]
            })

          graph={k:sorted(v) for k,v in call_index.items()}
          (ev/"22_METHOD_CONSTANTS_CALLS.json").write_text(
            json.dumps(rows,indent=2,ensure_ascii=False)+"\n")
          (ev/"23_METHOD_CALL_GRAPH.json").write_text(
            json.dumps(graph,indent=2,ensure_ascii=False)+"\n")
          PY

      - name: Mine raw IL around updater and HID APIs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json

          out=Path(os.environ["OUT"])
          ev=out/"evidence"
          lines=(out/"il/all.il").read_text(errors="ignore").splitlines()

          needles=[
            "UpdateCommandThread",
            "HidD_SetOutputReport","HidD_GetInputReport",
            "HidD_SetFeature","HidD_GetFeature",
            "WriteFile","ReadFile",
            "Firmware","Upgrade","Boot","Flash","MVA",
            "CRC","Checksum","Verify","Status"
          ]

          windows=[]
          for i,line in enumerate(lines):
            found=[n for n in needles if n.lower() in line.lower()]
            if not found: continue
            lo=max(0,i-100); hi=min(len(lines),i+260)
            windows.append({
              "line":i+1,
              "terms":found,
              "context":"\n".join(
                f"{j+1}: {lines[j]}" for j in range(lo,hi)
              )[:60000]
            })

          (ev/"30_IL_PROTOCOL_WINDOWS.json").write_text(
            json.dumps(windows,indent=2,ensure_ascii=False)+"\n")
          print("il_windows",len(windows))
          PY

      - name: Enumerate .NET methods, RVAs and protected stubs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json
          import dnfile

          out=Path(os.environ["OUT"])
          ev=out/"evidence"
          pe=dnfile.dnPE(str(out/"dstech.exe"))

          rows=[]
          if pe.net and pe.net.mdtables and pe.net.mdtables.MethodDef:
            for idx,row in enumerate(pe.net.mdtables.MethodDef.rows,1):
              name=str(row.Name)
              rva=int(row.Rva or 0)
              flags=str(row.Flags)
              interesting=any(k in name.lower() for k in (
                "update","firm","flash","boot","hid","read","write",
                "verify","status","crc","checksum","feature","report"
              ))
              if interesting:
                rows.append({
                  "rid":idx,
                  "name":name,
                  "rva":rva,
                  "rva_hex":hex(rva),
                  "flags":flags
                })

          (ev/"31_INTERESTING_METHOD_RVAS.json").write_text(
            json.dumps(rows,indent=2,ensure_ascii=False)+"\n")
          print("interesting_method_rvas",len(rows))
          PY

      - name: Classify exact updater candidates conservatively
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json

          out=Path(os.environ["OUT"])
          ev=out/"evidence"
          methods=json.loads((ev/"21_METHOD_WINDOWS.json").read_text())
          consts=json.loads((ev/"22_METHOD_CONSTANTS_CALLS.json").read_text())

          safeish=[]
          mutating=[]
          readback=[]

          for m in methods:
            cats=set(m.get("categories",[]))
            item={
              "path":m["path"],"method":m["method"],
              "categories":sorted(cats)
            }
            if "verify_status" in cats or "device_to_host" in cats:
              safeish.append(item)
            if "updater" in cats or "host_to_device" in cats:
              mutating.append(item)
            if "readback_words" in cats:
              readback.append(item)

          verdict={
            "method_windows":len(methods),
            "status_verify_or_device_to_host_methods":len(safeish),
            "mutating_or_host_to_device_methods":len(mutating),
            "explicit_readback_named_methods":len(readback),
            "updater_protocol_fully_recovered":False,
            "non_destructive_bootloader_query_proven":False,
            "firmware_readback_primitive_proven":False,
            "live_board_commands_allowed":False,
            "promotion_rule":"No updater command is promoted live until its exact request bytes, exact response bytes, and non-mutating behavior are all tied together in official-client code."
          }

          (ev/"40_DOTNET_VERDICT.json").write_text(
            json.dumps(verdict,indent=2)+"\n")
          (ev/"41_SAFEISH_CANDIDATES.json").write_text(
            json.dumps(safeish,indent=2,ensure_ascii=False)+"\n")
          (ev/"42_MUTATING_CANDIDATES.json").write_text(
            json.dumps(mutating,indent=2,ensure_ascii=False)+"\n")
          (ev/"43_EXPLICIT_READBACK_CANDIDATES.json").write_text(
            json.dumps(readback,indent=2,ensure_ascii=False)+"\n")
          PY

      - name: Upload .NET evidence
        uses: actions/upload-artifact@v4
        with:
          name: r105-dotnet-evidence
          path: /tmp/r105-dotnet/evidence
          if-no-files-found: error
          retention-days: 7

  firmware_resources:
    name: 2 - Mine updater resources + firmware formats
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OUT: /tmp/r105-resources

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$LIVE_BOARD_USB" = "NO"
          test "$HOST_TO_DEVICE_USB" = "NO"
          test "$FLASH_ERASE_WRITE" = "NO"
          test "$FLASH_ALLOWED" = "NO"
          rm -rf "$OUT"
          mkdir -p "$OUT"/{downloads,pkg,expanded,evidence}

          cat > "$OUT/evidence/00_SCOPE.txt" <<'EOF'
          REVISION=R105
          JOB=FIRMWARE_RESOURCES
          MODE=OFFLINE_STATIC_ONLY
          BOARD_USB_ACCESS=NO
          HOST_TO_DEVICE_USB=NO
          FLASH_ERASE_WRITE=NO
          FLASH_ALLOWED=NO
          EOF

      - name: Install resource-analysis tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            unzip p7zip-full file binutils jq curl python3 python3-pip icoutils
          python3 -m pip install --break-system-packages --quiet pefile

      - name: Download and recursively expand Windows package
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            --connect-timeout 20 --max-time 240 \
            --user-agent "Mozilla/5.0 OKN-R105-Resource-Research" \
            --referer "https://golodsp.com/7%E9%80%9A%E9%81%93%E9%9F%B3%E9%A2%91%E5%89%8D%E7%BA%A7/" \
            --output "$OUT/downloads/windows.zip" "$WINDOWS_URL"

          7z x -y "$OUT/downloads/windows.zip" -o"$OUT/pkg" >/dev/null

          EXE="$(
            find "$OUT/pkg" -type f -iname '*.exe' \
              ! -path '*/__MACOSX/*' ! -name '._*' -size +100k \
              -print | sort | head -n1
          )"
          test -n "$EXE"
          cp "$EXE" "$OUT/dstech.exe"

          # Extract resources/embedded archives best-effort.
          7z x -y "$OUT/dstech.exe" -o"$OUT/expanded/pe" \
            > "$OUT/evidence/10_7Z_PE_STDOUT.txt" 2>&1 || true

          find "$OUT/pkg" "$OUT/expanded" -type f -printf '%p\t%s\n' | sort \
            > "$OUT/evidence/11_FILE_INVENTORY.tsv"

      - name: Find firmware-like payloads and updater assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json,hashlib,subprocess,re,math

          out=Path(os.environ["OUT"])
          roots=[out/"pkg",out/"expanded"]
          ev=out/"evidence"

          ext_interest={
            ".bin",".fw",".img",".rom",".hex",".mva",".dat",".upd",
            ".dfu",".ota",".pack",".res",".resource",".dll",".exe"
          }
          name_terms=(
            "firm","flash","upgrade","update","boot","mva","rom","dsp",
            "bp1048","image","program"
          )

          candidates=[]
          strings_hits=[]

          for root in roots:
            if not root.exists(): continue
            for p in root.rglob("*"):
              if not p.is_file(): continue
              try: size=p.stat().st_size
              except: continue
              rel=str(p.relative_to(out))
              suffix=p.suffix.lower()
              lowname=p.name.lower()

              selected=(
                suffix in ext_interest
                or any(t in lowname for t in name_terms)
                or size > 256*1024
              )
              if selected:
                try:
                  data=p.read_bytes()
                  sha=hashlib.sha256(data).hexdigest()
                  head=data[:64].hex().upper()
                  tail=data[-64:].hex().upper() if data else ""
                except:
                  sha=head=tail=""
                candidates.append({
                  "path":rel,"size":size,"suffix":suffix,
                  "sha256":sha,"head64":head,"tail64":tail
                })

              if size <= 100_000_000 and suffix in {
                ".exe",".dll",".bin",".dat",".mva",".fw",".img",".rom",".resource"
              }:
                try:
                  r=subprocess.run(
                    ["strings","-a","-n","4",str(p)],
                    capture_output=True,text=True,errors="ignore",timeout=30
                  )
                except:
                  continue
                for s in r.stdout.splitlines():
                  if any(t in s.lower() for t in (
                    "firmware","flash","bootloader","upgrade","update",
                    "crc","checksum","verify","erase","program",
                    "readflash","readfirmware","readmemory","backup"
                  )):
                    strings_hits.append({
                      "path":rel,"string":s[:3000]
                    })

          (ev/"20_FIRMWARE_LIKE_FILES.json").write_text(
            json.dumps(candidates,indent=2,ensure_ascii=False)+"\n")
          (ev/"21_RESOURCE_STRINGS.json").write_text(
            json.dumps(strings_hits,indent=2,ensure_ascii=False)+"\n")
          print("firmware_like_files",len(candidates))
          print("resource_string_hits",len(strings_hits))
          PY

      - name: Enumerate PE resources and overlays
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json,hashlib
          import pefile

          out=Path(os.environ["OUT"])
          ev=out/"evidence"
          exe=out/"dstech.exe"
          pe=pefile.PE(str(exe),fast_load=False)

          sections=[]
          for s in pe.sections:
            sections.append({
              "name":s.Name.rstrip(b"\0").decode(errors="ignore"),
              "virtual_address":hex(s.VirtualAddress),
              "virtual_size":s.Misc_VirtualSize,
              "raw_offset":s.PointerToRawData,
              "raw_size":s.SizeOfRawData,
              "entropy":s.get_entropy()
            })

          overlay_offset=pe.get_overlay_data_start_offset()
          overlay=None
          if overlay_offset is not None:
            data=exe.read_bytes()[overlay_offset:]
            overlay={
              "offset":overlay_offset,
              "size":len(data),
              "sha256":hashlib.sha256(data).hexdigest(),
              "head64":data[:64].hex().upper()
            }

          result={
            "sections":sections,
            "overlay":overlay,
            "entrypoint_rva":hex(pe.OPTIONAL_HEADER.AddressOfEntryPoint),
            "image_base":hex(pe.OPTIONAL_HEADER.ImageBase)
          }
          (ev/"22_PE_LAYOUT.json").write_text(
            json.dumps(result,indent=2)+"\n")
          PY

      - name: Search binary for likely update framing constants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json,re

          out=Path(os.environ["OUT"])
          ev=out/"evidence"
          data=(out/"dstech.exe").read_bytes()

          # Context around known production USB IDs and common protocol markers.
          patterns={
            "VID_LE":bytes.fromhex("2463"),
            "VID_BE":bytes.fromhex("6324"),
            "PID_LE":bytes.fromhex("1917"),
            "PID_BE":bytes.fromhex("1719"),
            "USAGE_55AA_LE":bytes.fromhex("AA55"),
            "USAGE_55AA_BE":bytes.fromhex("55AA"),
            "CRC16_POLY_1021_LE":bytes.fromhex("2110"),
            "CRC16_POLY_1021_BE":bytes.fromhex("1021"),
          }

          hits=[]
          for name,pat in patterns.items():
            start=0
            while True:
              i=data.find(pat,start)
              if i<0: break
              lo=max(0,i-64); hi=min(len(data),i+128)
              hits.append({
                "pattern":name,
                "offset":i,
                "offset_hex":hex(i),
                "context_hex":data[lo:hi].hex().upper()
              })
              start=i+1

          (ev/"30_BINARY_MARKER_WINDOWS.json").write_text(
            json.dumps(hits[:5000],indent=2)+"\n")
          print("marker_hits",len(hits))
          PY

      - name: Upload resource evidence
        uses: actions/upload-artifact@v4
        with:
          name: r105-resource-evidence
          path: /tmp/r105-resources/evidence
          if-no-files-found: error
          retention-days: 7

  correlate:
    name: 3 - Correlate protocol + resources + risk
    needs: [dotnet_protocol, firmware_resources]
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$LIVE_BOARD_USB" = "NO"
          test "$HOST_TO_DEVICE_USB" = "NO"
          test "$FLASH_ERASE_WRITE" = "NO"
          test "$FLASH_ALLOWED" = "NO"
          rm -rf /tmp/r105-final
          mkdir -p /tmp/r105-final/{dotnet,resources,review}

      - name: Download .NET evidence
        uses: actions/download-artifact@v4
        with:
          name: r105-dotnet-evidence
          path: /tmp/r105-final/dotnet

      - name: Download resource evidence
        uses: actions/download-artifact@v4
        with:
          name: r105-resource-evidence
          path: /tmp/r105-final/resources

      - name: Build combined protocol map and next-gate verdict
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          base=Path("/tmp/r105-final")
          dot=base/"dotnet"
          res=base/"resources"
          review=base/"review"

          def load(path,default):
            p=Path(path)
            if not p.exists(): return default
            try: return json.loads(p.read_text(errors="ignore"))
            except: return default

          dver=load(dot/"40_DOTNET_VERDICT.json",{})
          safe=load(dot/"41_SAFEISH_CANDIDATES.json",[])
          mut=load(dot/"42_MUTATING_CANDIDATES.json",[])
          readback=load(dot/"43_EXPLICIT_READBACK_CANDIDATES.json",[])
          rsrc=load(res/"20_FIRMWARE_LIKE_FILES.json",[])
          rstrings=load(res/"21_RESOURCE_STRINGS.json",[])
          pelayout=load(res/"22_PE_LAYOUT.json",{})

          # Known, already-proven UFE layouts from R102 are included as
          # reference only. They remain sensor-scoped and are not flash reads.
          proven_ufe={
            "0x58":{
              "name":"READ_SENSOR_ACTUATOR",
              "scope":"Sensor/parameter data",
              "full_flash_readback":False
            },
            "0x61":{
              "name":"READ_SENSOR_FIFO",
              "layout":"[61][Sensor.ID BE32][memlength BE16]",
              "scope":"Sensor FIFO",
              "full_flash_readback":False
            },
            "0x63":{
              "name":"READ_SENSOR_BULK",
              "layout":"[63][Sensor.ID BE32][memoffset BE16][memlength BE16]",
              "scope":"Sensor data block",
              "full_flash_readback":False
            }
          }

          # High-value candidates are methods that appear in both a
          # device-to-host/status context and updater context. They are still
          # NOT safe until exact request/response semantics are proven.
          safe_names={x.get("method") for x in safe}
          mut_names={x.get("method") for x in mut}
          overlap=sorted(x for x in safe_names & mut_names if x)

          firmware_payloads=[
            x for x in rsrc
            if x.get("suffix") in {".bin",".fw",".img",".rom",".mva",".hex",".dfu",".ota",".upd"}
            or any(t in x.get("path","").lower() for t in ("firm","flash","upgrade","mva","boot"))
          ]

          combined={
            "revision":"R105",
            "mode":"OFFLINE_STATIC_ONLY",
            "proven_sensor_read_protocol":proven_ufe,
            "updater_status_or_device_to_host_candidates":safe,
            "mutating_updater_candidates":mut,
            "explicit_named_readback_candidates":readback,
            "status_updater_overlap_method_names":overlap,
            "firmware_payload_candidates":firmware_payloads,
            "pe_overlay":pelayout.get("overlay"),
            "true_firmware_readback_primitive_proven":False,
            "full_flash_readback_proven":False,
            "live_board_commands_allowed":False,
            "next_gate":"Inspect any status/updater overlap method and any embedded firmware payload together to recover exact bootloader request/response framing. Do not execute updater traffic on the production board yet."
          }

          (review/"50_R105_COMBINED_PROTOCOL_MAP.json").write_text(
            json.dumps(combined,indent=2,ensure_ascii=False)+"\n")

          lines=[
            "OKN R105 MEGA OFFLINE RESULT",
            "UFE_SENSOR_READ_LAYOUTS_PROVEN=true",
            f"UPDATER_STATUS_OR_D2H_CANDIDATES={len(safe)}",
            f"MUTATING_UPDATER_CANDIDATES={len(mut)}",
            f"EXPLICIT_NAMED_READBACK_CANDIDATES={len(readback)}",
            f"STATUS_UPDATER_OVERLAP_METHODS={len(overlap)}",
            f"FIRMWARE_PAYLOAD_CANDIDATES={len(firmware_payloads)}",
            "TRUE_FIRMWARE_READBACK_PRIMITIVE_PROVEN=false",
            "FULL_FLASH_READBACK_PROVEN=false",
            "LIVE_BOARD_COMMANDS_ALLOWED=false",
          ]
          (review/"51_R105_SUMMARY.txt").write_text("\n".join(lines)+"\n")

          # Compact shortlist for manual review on the next turn.
          shortlist={
            "overlap_methods":overlap[:100],
            "safeish_candidates":safe[:100],
            "explicit_readback_candidates":readback[:100],
            "firmware_payload_candidates":firmware_payloads[:100],
            "resource_strings":rstrings[:200]
          }
          (review/"52_R105_SHORTLIST.json").write_text(
            json.dumps(shortlist,indent=2,ensure_ascii=False)+"\n")

          print("\n".join(lines))
          PY

      - name: Copy all compact evidence into final bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r105-final/review/dotnet /tmp/r105-final/review/resources
          cp -a /tmp/r105-final/dotnet/. /tmp/r105-final/review/dotnet/
          cp -a /tmp/r105-final/resources/. /tmp/r105-final/review/resources/

          cat > /tmp/r105-final/review/99_SAFETY_ATTESTATION.txt <<'EOF'
          OFFLINE_STATIC_ONLY=true
          BOARD_USB_ACCESSED=false
          HOST_TO_DEVICE_COMMANDS_SENT=false
          HID_SET_REPORT_LIVE=false
          FLASH_ERASE_WRITE=false
          FULL_FLASH_READBACK_PROVEN=false
          EOF

          (
            cd /tmp/r105-final/review
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          ) > /tmp/r105-final/review/SHA256SUMS.txt

      - name: Publish combined summary
        shell: bash
        run: |
          {
            echo "## OKN R105 MEGA Offline Updater/Bootloader/Firmware Miner"
            echo
            echo "- Runs .NET protocol mining and firmware-resource mining in parallel."
            echo "- Correlates updater status/verify paths with HID transport and embedded payloads."
            echo "- Includes previously proven UFE sensor-read layouts only as reference."
            echo "- No board USB access; no host-to-device traffic."
            echo
            echo '```text'
            cat /tmp/r105-final/review/51_R105_SUMMARY.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload final R105 evidence
        uses: actions/upload-artifact@v4
        with:
          name: R105-MEGA-UPDATER-BOOTLOADER-FIRMWARE-EVIDENCE
          path: /tmp/r105-final/review
          if-no-files-found: error
          retention-days: 30
