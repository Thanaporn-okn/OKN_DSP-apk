      - name: Analyze recovered stage1 store and parser entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json,struct,hashlib,math,collections,re

          out=Path(os.environ["OUT"])
          ev=out/"evidence"
          stage=out/"decrypted/stage1_local37.bin"

          result={
            "stage1_recovered":stage.exists(),
            "memory_stream_byte_array_model":"MemoryStream(local29) -> BinaryReader",
            "update_token":"0x0600082C",
            "update_rid":2092,
          }

          if stage.exists():
            data=stage.read_bytes()
            ctr=collections.Counter(data)
            n=len(data)
            entropy=(
              -sum((v/n)*math.log2(v/n) for v in ctr.values())
              if n else 0.0
            )

            int4=[]
            for off in range(0,max(0,len(data)-3),4):
              if struct.unpack_from("<i",data,off)[0]==4:
                int4.append(off)
                if len(int4)>=500:
                  break

            result.update({
              "length":len(data),
              "sha256":hashlib.sha256(data).hexdigest(),
              "head64":data[:64].hex().upper(),
              "first_int32_le":(
                struct.unpack_from("<i",data,0)[0] if len(data)>=4 else None
              ),
              "entropy":entropy,
              "aligned_int32_value4_offsets":int4,
              "token_0600082c_offsets":[
                m.start() for m in re.finditer(
                  re.escape(bytes.fromhex("2C080006")),data
                )
              ][:100],
              "rid_2092_le_offsets":[
                m.start() for m in re.finditer(
                  re.escape(struct.pack("<I",2092)),data
                )
              ][:100],
            })

          try:
            vm=json.loads((ev/"30_VM_SUMMARY.json").read_text())
          except Exception:
            vm={}

          result["critical_state_hits"]=sorted(set(
            x.get("state")
            for x in vm.get("global_reach",[])
            if x.get("state") is not None
          ))
          result["reader_events"]=[
            x for x in vm.get("global_events",[])
            if x.get("kind") in ("ReadInt32","ReadBytes")
          ][-500:]

          (ev/"46_STAGE1_STORE_ANALYSIS.json").write_text(
            json.dumps(result,indent=2,ensure_ascii=False)+"\n")
          print(json.dumps({
            "stage1_recovered":result.get("stage1_recovered"),
            "length":result.get("length"),
            "first_int32_le":result.get("first_int32_le"),
            "critical_state_hits":result.get("critical_state_hits"),
            "read_event_count":len(result.get("reader_events",[])),
          },indent=2))
          PY

      - name: Validate any recovered plaintext and search method-store mappings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json,re,struct,hashlib,math,collections

          out=Path(os.environ["OUT"])
          ev=out/"evidence"

          paths=[]
          try: paths=json.loads((ev/"31_VM_INTERESTING_PATHS.json").read_text())
          except: pass

          candidates=[]
          for p in paths:
              for m in p.get("milestones",[]):
                  if m.get("kind") in ("AES_DECRYPT","LOCAL29_PLAINTEXT"):
                      candidates.append({"path_score":p.get("score"),"milestone":m})

          # Also inspect any VM-produced decrypted files if future emulator
          # versions create them.
          files=[]
          for fp in (out/"decrypted").glob("*"):
              if not fp.is_file():continue
              data=fp.read_bytes()
              files.append({
                  "file":fp.name,"size":len(data),
                  "sha256":hashlib.sha256(data).hexdigest(),
                  "head64":data[:64].hex().upper(),
                  "token_0600082c_offsets":[m.start() for m in re.finditer(re.escape(b"\x2c\x08\x00\x06"),data)][:100],
                  "rid_2092_le_offsets":[m.start() for m in re.finditer(re.escape(struct.pack("<I",2092)),data)][:100],
              })

          result={
              "plaintext_milestone_candidates":candidates[:100],
              "decrypted_files":files,
              "update_method_body_recovered":False,
              "note":"A token/RID hit alone is not sufficient; body mapping must be tied to protector store format."
          }
          (ev/"50_METHOD_STORE_SEARCH.json").write_text(
              json.dumps(result,indent=2,ensure_ascii=False)+"\n")
          PY

