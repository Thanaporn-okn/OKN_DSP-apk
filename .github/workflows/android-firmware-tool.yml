name: OKN R98 Flutter UFE Function Xref Miner OFFLINE ONLY

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/android-firmware-tool.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: okn-r98-flutter-ufe-xref-${{ github.ref }}
  cancel-in-progress: true

env:
  OUT: /tmp/okn-r98
  ANDROID_URL: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-01.apk_.zip"
  LIVE_BOARD_USB: "NO"
  HOST_TO_DEVICE_USB: "NO"
  FLASH_ERASE_WRITE: "NO"
  FLASH_ALLOWED: "NO"

jobs:
  mine:
    name: Recover exact UFE functions from Flutter AOT / STATIC ONLY
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fail-closed offline-only scope gate
        shell: bash
        run: |
          set -euo pipefail
          test "$LIVE_BOARD_USB" = "NO"
          test "$HOST_TO_DEVICE_USB" = "NO"
          test "$FLASH_ERASE_WRITE" = "NO"
          test "$FLASH_ALLOWED" = "NO"

          rm -rf "$OUT"
          mkdir -p "$OUT"/{downloads,android,blutter,evidence,review}

          cat > "$OUT/evidence/00_SCOPE.txt" <<'EOF'
          REVISION=R98
          MODE=OFFLINE_STATIC_ONLY
          TARGET=GoloPine_DSTech_BP1048P4
          KNOWN_PRODUCTION_USB=6324:1719
          KNOWN_HID_USAGE=FF00:55AA
          KNOWN_READ_SENSOR=0x58
          KNOWN_READ_SENSOR_FIFO=0x61
          KNOWN_READ_SENSOR_BULK=0x63
          KNOWN_RESPONSE_READ_SENSOR=0x60
          KNOWN_RESPONSE_FIFO=0x62
          KNOWN_RESPONSE_BULK=0x64
          KNOWN_CONTINUE_BULK=0x82
          BOARD_USB_ACCESS=NO
          LIVE_USB_COMMANDS=NO
          HOST_TO_DEVICE_USB=NO
          SET_REPORT_LIVE=NO
          OUTPUT_TRANSFER_LIVE=NO
          ERASE=NO
          WRITE=NO
          UNLOCK=NO
          FLASH_ALLOWED=NO
          GOAL=Resolve_Flutter_AOT_functions_referencing_UFE_bulk_read_strings_and_extract_frame_construction_constants
          EOF

      - name: Install Blutter build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            unzip p7zip-full file binutils jq git curl \
            python3 python3-pip python3-pyelftools python3-requests \
            cmake ninja-build build-essential pkg-config \
            libicu-dev libcapstone-dev

      - name: Download and select real Android APK
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --fail --location --retry 4 --retry-all-errors \
            --connect-timeout 20 --max-time 240 \
            --user-agent "Mozilla/5.0 OKN-R98-Interop-Research" \
            --referer "https://golodsp.com/7%E9%80%9A%E9%81%93%E9%9F%B3%E9%A2%91%E5%89%8D%E7%BA%A7/" \
            --output "$OUT/downloads/android.zip" "$ANDROID_URL"

          mkdir -p "$OUT/android/pkg"
          7z x -y "$OUT/downloads/android.zip" -o"$OUT/android/pkg" >/dev/null

          APK="$(
            find "$OUT/android/pkg" -type f -iname '*.apk' \
              ! -path '*/__MACOSX/*' ! -name '._*' -size +100k \
              -print | sort | head -n1
          )"
          test -n "$APK"
          unzip -t "$APK" >/dev/null
          cp "$APK" "$OUT/android/golopine.apk"

          {
            echo "APK_SIZE=$(stat -c%s "$OUT/android/golopine.apk")"
            echo "APK_TYPE=$(file -b "$OUT/android/golopine.apk")"
            sha256sum "$OUT/android/golopine.apk"
          } > "$OUT/evidence/01_APK_IDENTITY.txt"

      - name: Extract APK and inventory native transport libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT/android/raw"
          7z x -y "$OUT/android/golopine.apk" -o"$OUT/android/raw" >/dev/null

          test -s "$OUT/android/raw/lib/arm64-v8a/libapp.so"
          test -s "$OUT/android/raw/lib/arm64-v8a/libflutter.so"

          find "$OUT/android/raw/lib" -type f | sort \
            > "$OUT/evidence/02_NATIVE_LIB_INVENTORY.txt"

          while IFS= read -r f; do
            printf '%s\t%s\n' "${f#$OUT/android/raw/}" "$(file -b "$f")"
          done < "$OUT/evidence/02_NATIVE_LIB_INVENTORY.txt" \
            > "$OUT/evidence/03_NATIVE_LIB_TYPES.txt"

          python3 - <<'PY'
          from pathlib import Path
          import os,subprocess,json

          out=Path(os.environ["OUT"])
          libroot=out/"android/raw/lib"
          terms=[
            "libusb","hidraw","hidapi","UsbManager","UsbDevice",
            "controlTransfer","bulkTransfer","interruptTransfer",
            "/dev/bus/usb","USBDEVFS","SET_REPORT","GET_REPORT",
            "MethodChannel","EventChannel","serial","bluetooth","ble"
          ]
          hits=[]
          for p in libroot.rglob("*.so"):
            try:
              r=subprocess.run(["strings","-a","-n","4",str(p)],
                  capture_output=True,text=True,errors="ignore",timeout=30)
            except Exception:
              continue
            for s in r.stdout.splitlines():
              if any(t.lower() in s.lower() for t in terms):
                hits.append({
                  "path":str(p.relative_to(out)),
                  "string":s[:2000]
                })
          (out/"evidence/04_NATIVE_TRANSPORT_STRINGS.json").write_text(
              json.dumps(hits,indent=2,ensure_ascii=False)+"\n")
          print("native_transport_hits",len(hits))
          PY

      - name: Run Blutter against arm64 Flutter AOT
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/worawit/blutter.git "$OUT/blutter-src"

          python3 "$OUT/blutter-src/blutter.py" \
            "$OUT/android/raw/lib/arm64-v8a" \
            "$OUT/blutter/out" \
            > "$OUT/evidence/10_BLUTTER_STDOUT.txt" \
            2> "$OUT/evidence/11_BLUTTER_STDERR.txt"

          echo "BLUTTER_RC=0" > "$OUT/evidence/12_BLUTTER_STATUS.txt"
          find "$OUT/blutter/out" -type f | sort > "$OUT/evidence/13_BLUTTER_FILES.txt"

      - name: Resolve target strings to PP offsets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re,json

          out=Path(os.environ["OUT"])
          pp=out/"blutter/out/pp.txt"
          txt=pp.read_text(errors="ignore")

          targets=[
            "Sent Device Type and software version authentication request data",
            "CurDeviceDescriptionLength=",
            "Target DeviceDescriptionLength= ",
            "Bulk receive start Length= ",
            " sensorID=",
            "Bulk receive Length= ",
            "Bulk Receive Finished len= ",
            "On actuator data updated",
            "On sensor data updated",
            "Decode UFE JSON success!",
            "UFE_TYPE_FLOAT32",
            "UFE_TYPE_INT32",
            "UFE_TYPE_BIQUAD_CASCADE",
            "hidUsage"
          ]

          rows=[]
          for target in targets:
            # Blutter pp format: [pp+0xcf30] String: "..."
            pat=re.compile(
              r'^\[pp\+0x([0-9a-fA-F]+)\].*?String:\s*"(.*)"\s*$',
              re.M
            )
            found=[]
            for m in pat.finditer(txt):
              val=m.group(2)
              if target.lower() in val.lower():
                found.append({
                  "pp_hex":"0x"+m.group(1).lower(),
                  "pp_int":int(m.group(1),16),
                  "value":val
                })
            rows.append({"target":target,"matches":found})

          (out/"evidence/20_PP_TARGET_OFFSETS.json").write_text(
              json.dumps(rows,indent=2,ensure_ascii=False)+"\n")
          print(json.dumps(rows,indent=2,ensure_ascii=False))
          PY

      - name: Cross-reference PP offsets into Blutter assembly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re,json,shutil

          out=Path(os.environ["OUT"])
          ev=out/"evidence"
          asmroot=out/"blutter/out/asm"
          targets=json.loads((ev/"20_PP_TARGET_OFFSETS.json").read_text())

          refs=[]
          selected=set()

          # Candidate literal formats observed in Blutter output vary by release.
          for target in targets:
            for m in target["matches"]:
              hx=m["pp_hex"].lower()
              hxn=hx[2:]
              forms=[
                f"pp+{hx}", f"PP+{hx}",
                f"pp + {hx}", f"PP + {hx}",
                f"#{hx}", f"#0x{hxn}",
                f"[pp+{hx}]", f"[PP+{hx}]",
              ]

              for p in asmroot.rglob("*.dart"):
                try: txt=p.read_text(errors="ignore")
                except Exception: continue
                low=txt.lower()

                positions=[]
                for form in forms:
                  start=0
                  fl=form.lower()
                  while True:
                    i=low.find(fl,start)
                    if i<0: break
                    positions.append(i)
                    start=i+1

                # Some Blutter asm files carry the literal string in comments.
                start=0
                needle=m["value"].lower()
                while needle:
                  i=low.find(needle,start)
                  if i<0: break
                  positions.append(i)
                  start=i+1

                for i in sorted(set(positions)):
                  lo=max(0,i-12000)
                  hi=min(len(txt),i+20000)
                  window=txt[lo:hi]
                  refs.append({
                    "target":target["target"],
                    "value":m["value"],
                    "pp_hex":hx,
                    "path":str(p.relative_to(out)),
                    "char_offset":i,
                    "window":window
                  })
                  selected.add(p)

          # If direct PP textual refs are absent, grep likely immediate offsets
          # transformed by ARM64 scaled addressing and retain candidates.
          pp_ints=[]
          for t in targets:
            for m in t["matches"]:
              pp_ints.append((t["target"],m["pp_int"],m["value"]))

          if not refs:
            for p in asmroot.rglob("*.dart"):
              try: txt=p.read_text(errors="ignore")
              except Exception: continue
              lines=txt.splitlines()
              for i,line in enumerate(lines):
                nums=[]
                for hm in re.finditer(r'0x([0-9a-fA-F]+)',line):
                  try: nums.append(int(hm.group(1),16))
                  except: pass
                for target,val,s in pp_ints:
                  # exact PP displacement or nearby 8-byte aligned displacement
                  if any(abs(n-val)<=16 for n in nums):
                    lo=max(0,i-120); hi=min(len(lines),i+220)
                    refs.append({
                      "target":target,"value":s,"pp_hex":hex(val),
                      "path":str(p.relative_to(out)),
                      "line":i+1,
                      "window":"\n".join(lines[lo:hi])
                    })
                    selected.add(p)

          (ev/"21_ASM_PP_XREFS.json").write_text(
              json.dumps(refs,indent=2,ensure_ascii=False)+"\n")

          sel=out/"review/selected-asm"
          sel.mkdir(parents=True,exist_ok=True)
          for p in sorted(selected):
            rel=p.relative_to(asmroot)
            name=str(rel).replace("/","__")
            dst=sel/name
            shutil.copy2(p,dst)

          (ev/"22_SELECTED_ASM_FILES.txt").write_text(
              "\n".join(str(p.relative_to(out)) for p in sorted(selected))+"\n")

          print("xref_count",len(refs))
          print("selected_asm_files",len(selected))
          PY

      - name: Mine UFE command constants and byte stores near xrefs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re,json

          out=Path(os.environ["OUT"])
          ev=out/"evidence"
          refs=json.loads((ev/"21_ASM_PP_XREFS.json").read_text())

          command_values={
            0x57:"WRITE_ACTUATOR",
            0x58:"READ_SENSOR",
            0x59:"READ_SENSOR_JSON",
            0x60:"RESPONSE_READ_SENSOR",
            0x61:"READ_SENSOR_FIFO",
            0x62:"RESPONSE_FIFO",
            0x63:"READ_SENSOR_BULK",
            0x64:"RESPONSE_BULK",
            0x82:"CONTINUE_BULK"
          }

          mined=[]
          for ref in refs:
            w=ref["window"]
            lines=w.splitlines()
            constants=[]
            stores=[]
            arithmetic=[]

            for idx,line in enumerate(lines):
              low=line.lower()
              vals=[]
              for m in re.finditer(r'(?<![0-9a-f])0x([0-9a-f]+)',low):
                try: vals.append(int(m.group(1),16))
                except: pass
              for m in re.finditer(r'(?<![\w])#(\d+)',low):
                try: vals.append(int(m.group(1)))
                except: pass

              for v in vals:
                if v in command_values:
                  constants.append({
                    "line":line.strip(),
                    "value":v,
                    "meaning":command_values[v]
                  })

              if re.search(r'\b(strb|sturb|strh|sturh|str\s+w|str\s+x|stp)\b',low):
                stores.append(line.strip())
              if re.search(r'\b(add|sub|lsl|lsr|ubfx|bfi|rev|rev16|and|orr|eor)\b',low):
                arithmetic.append(line.strip())

            mined.append({
              "target":ref["target"],
              "value":ref["value"],
              "pp_hex":ref["pp_hex"],
              "path":ref["path"],
              "command_constants":constants[:200],
              "byte_word_stores":stores[:400],
              "packing_arithmetic":arithmetic[:400],
              "window":w
            })

          (ev/"30_UFE_XREF_MINED.json").write_text(
              json.dumps(mined,indent=2,ensure_ascii=False)+"\n")

          # High-confidence evidence requires target string xref + command constant
          # in the same bounded assembly window, rather than global constants.
          high=[]
          for x in mined:
            if x["command_constants"]:
              high.append({
                "target":x["target"],
                "path":x["path"],
                "commands":x["command_constants"],
                "stores":x["byte_word_stores"][:100],
                "packing":x["packing_arithmetic"][:100]
              })

          (ev/"31_HIGH_CONFIDENCE_COMMAND_XREFS.json").write_text(
              json.dumps(high,indent=2,ensure_ascii=False)+"\n")

          print("xref_windows",len(mined))
          print("high_confidence_windows",len(high))
          PY

      - name: Search all AOT assembly for read command IDs near memory terms
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re,json

          out=Path(os.environ["OUT"])
          asmroot=out/"blutter/out/asm"
          ev=out/"evidence"

          command_hex=("0x58","0x61","0x63","0x60","0x62","0x64","0x82")
          memory_words=("offset","length","sensor","bulk","fifo","uint8","uint16","byte","data")
          hits=[]

          for p in asmroot.rglob("*.dart"):
            try: lines=p.read_text(errors="ignore").splitlines()
            except Exception: continue

            for i,line in enumerate(lines):
              low=line.lower()
              if not any(c in low for c in command_hex):
                continue
              lo=max(0,i-100); hi=min(len(lines),i+180)
              ctx="\n".join(lines[lo:hi])
              score=sum(1 for w in memory_words if w in ctx.lower())
              if score:
                hits.append({
                  "path":str(p.relative_to(out)),
                  "line":i+1,
                  "command_line":line.strip(),
                  "memory_term_score":score,
                  "context":ctx
                })

          hits.sort(key=lambda x:(-x["memory_term_score"],x["path"],x["line"]))
          (ev/"32_COMMAND_ID_ASM_HITS.json").write_text(
              json.dumps(hits[:1000],indent=2,ensure_ascii=False)+"\n")
          print("command_id_asm_hits",len(hits))
          PY

      - name: Produce corrected evidence verdict
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json

          out=Path(os.environ["OUT"])
          ev=out/"evidence"

          def load(name,default):
            p=ev/name
            return json.loads(p.read_text(errors="ignore")) if p.exists() else default

          offsets=load("20_PP_TARGET_OFFSETS.json",[])
          refs=load("21_ASM_PP_XREFS.json",[])
          high=load("31_HIGH_CONFIDENCE_COMMAND_XREFS.json",[])
          idhits=load("32_COMMAND_ID_ASM_HITS.json",[])
          native=load("04_NATIVE_TRANSPORT_STRINGS.json",[])

          target_offset_count=sum(len(x.get("matches",[])) for x in offsets)

          verdict={
            "r97_packet_layout_verdict_corrected":False,
            "correction_reason":"R97 global byte-builder heuristic matched unrelated protected assembly methods; exact ReadSensorBulkCommand.ToByteArray remained a stub.",
            "flutter_target_string_offsets":target_offset_count,
            "flutter_asm_xrefs":len(refs),
            "high_confidence_command_xrefs":len(high),
            "global_command_id_asm_hits":len(idhits),
            "native_transport_string_hits":len(native),
            "read_sensor_command_ids_proven":True,
            "exact_read_frame_layout_proven":bool(high),
            "full_flash_readback_proven":False,
            "live_board_commands_allowed":False,
            "promotion_rule":"No live packet until an exact official-client AOT function ties read command ID to byte packing and response parsing, and target semantics are non-destructive."
          }

          (ev/"40_R98_VERDICT.json").write_text(
              json.dumps(verdict,indent=2,ensure_ascii=False)+"\n")

          lines=[
            "OKN R98 FLUTTER UFE FUNCTION XREF MINER",
            "OFFLINE_ONLY=true",
            "R97_PACKET_LAYOUT_VERDICT_CORRECTED=false",
            f"TARGET_PP_OFFSETS={target_offset_count}",
            f"ASM_XREFS={len(refs)}",
            f"HIGH_CONFIDENCE_COMMAND_XREFS={len(high)}",
            f"COMMAND_ID_ASM_HITS={len(idhits)}",
            f"NATIVE_TRANSPORT_HITS={len(native)}",
            "READ_SENSOR_COMMAND_IDS_PROVEN=true",
            f"EXACT_READ_FRAME_LAYOUT_PROVEN={str(bool(high)).lower()}",
            "FULL_FLASH_READBACK_PROVEN=false",
            "LIVE_BOARD_COMMANDS_ALLOWED=false",
          ]
          (ev/"41_R98_SUMMARY.txt").write_text("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY

      - name: Build compact artifact
        shell: bash
        run: |
          set -euo pipefail
          cp -a "$OUT/evidence/." "$OUT/review/"

          cat > "$OUT/review/99_SAFETY_ATTESTATION.txt" <<'EOF'
          OFFLINE_STATIC_ONLY=true
          BOARD_USB_ACCESSED=false
          HOST_TO_DEVICE_COMMANDS_SENT=false
          HID_SET_REPORT_LIVE=false
          FLASH_ERASE_WRITE=false
          FULL_FLASH_READBACK_PROVEN=false
          EOF

          (
            cd "$OUT/review"
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          ) > "$OUT/review/SHA256SUMS.txt"

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo "## OKN R98 Flutter UFE Function Xref Miner"
            echo
            echo "- Offline/static analysis only."
            echo "- Corrects R97 packet-layout false positive."
            echo "- No board USB access and no host-to-device packets."
            echo
            for f in \
              "$OUT/evidence/01_APK_IDENTITY.txt" \
              "$OUT/evidence/12_BLUTTER_STATUS.txt" \
              "$OUT/evidence/41_R98_SUMMARY.txt"; do
              if [ -f "$f" ]; then
                echo "### $(basename "$f")"
                echo '```text'
                cat "$f"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload R98 protocol evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R98-FLUTTER-UFE-FUNCTION-XREF-EVIDENCE
          path: /tmp/okn-r98/review
          if-no-files-found: error
          retention-days: 30
