name: OKN R106 MEGA Protected Method Recovery OFFLINE ONLY

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/android-firmware-tool.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: okn-r106-protected-method-recovery-${{ github.ref }}
  cancel-in-progress: true

env:
  WINDOWS_URL: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-08.exe_.zip"
  LIVE_BOARD_USB: "NO"
  HOST_TO_DEVICE_USB: "NO"
  FLASH_ERASE_WRITE: "NO"
  FLASH_ALLOWED: "NO"

jobs:
  inspect_metadata:
    name: 1 - Metadata + stub + protector inspection
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OUT: /tmp/r106-metadata

    steps:
      - name: Fail-closed safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$LIVE_BOARD_USB" = "NO"
          test "$HOST_TO_DEVICE_USB" = "NO"
          test "$FLASH_ERASE_WRITE" = "NO"
          test "$FLASH_ALLOWED" = "NO"
          rm -rf "$OUT"
          mkdir -p "$OUT"/{downloads,pkg,decompiled,il,evidence,resource-dump}
          cat > "$OUT/evidence/00_SCOPE.txt" <<'EOF'
          REVISION=R106
          MODE=OFFLINE_STATIC_ONLY
          TARGET_USB=6324:1719
          TARGET_HID_USAGE=FF00:55AA
          UPDATE_COMMAND_THREAD_TOKEN=0x0600082C
          UPDATE_COMMAND_THREAD_RVA=0x0000A3F4
          BOARD_USB_ACCESS=NO
          HOST_TO_DEVICE_USB=NO
          FLASH_ERASE_WRITE=NO
          FLASH_ALLOWED=NO
          EOF

      - name: Install analysis utilities
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            unzip p7zip-full file binutils jq curl mono-utils python3 python3-pip
          python3 -m pip install --break-system-packages --quiet pefile dnfile capstone

      - name: Download official Windows client
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            --connect-timeout 20 --max-time 240 \
            --user-agent "Mozilla/5.0 OKN-R106-Interop-Research" \
            --referer "https://golodsp.com/7%E9%80%9A%E9%81%93%E9%9F%B3%E9%A2%91%E5%89%8D%E7%BA%A7/" \
            --output "$OUT/downloads/windows.zip" "$WINDOWS_URL"
          7z x -y "$OUT/downloads/windows.zip" -o"$OUT/pkg" >/dev/null
          EXE="$(find "$OUT/pkg" -type f -iname '*.exe' ! -path '*/__MACOSX/*' ! -name '._*' -size +100k | sort | head -n1)"
          test -n "$EXE"
          cp "$EXE" "$OUT/dstech.exe"
          {
            file "$OUT/dstech.exe"
            sha256sum "$OUT/dstech.exe"
            stat -c 'SIZE=%s' "$OUT/dstech.exe"
          } > "$OUT/evidence/01_IDENTITY.txt"

      - name: Decompile whole assembly and raw IL
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PATH:$HOME/.dotnet/tools"
          if ! command -v ilspycmd >/dev/null 2>&1; then
            dotnet tool install --global ilspycmd >/dev/null
          fi
          ilspycmd --project --outputdir "$OUT/decompiled" "$OUT/dstech.exe" \
            > "$OUT/evidence/10_ILSPY_CSHARP_STDOUT.txt" \
            2> "$OUT/evidence/11_ILSPY_CSHARP_STDERR.txt"
          ilspycmd --ilcode "$OUT/dstech.exe" > "$OUT/il/all.il" \
            2> "$OUT/evidence/12_ILSPY_IL_STDERR.txt"
          ilspycmd --version > "$OUT/evidence/13_ILSPY_VERSION.txt" 2>&1

      - name: Fingerprint protector and runtime-restoration APIs
        shell: bash
        run: |
          set -euo pipefail
          strings -a -n 4 "$OUT/dstech.exe" > "$OUT/evidence/20_ASCII_STRINGS.txt"
          strings -el -n 4 "$OUT/dstech.exe" > "$OUT/evidence/21_UTF16_STRINGS.txt" || true
          python3 - <<'PY'
          from pathlib import Path
          import os,json
          out=Path(os.environ['OUT']); ev=out/'evidence'
          blobs=[]
          for name in ('20_ASCII_STRINGS.txt','21_UTF16_STRINGS.txt'):
            p=ev/name
            if p.exists(): blobs += p.read_text(errors='ignore').splitlines()
          fingerprints=[
            'Eazfuscator','Confuser','Babel','Dotfuscator','SmartAssembly',
            'AgileDotNet','.NET Reactor','CryptoObfuscator','CodeVeil',
            'VirtualProtect','VirtualAlloc','GetProcAddress','LoadLibrary',
            'RuntimeHelpers','PrepareMethod','GetFunctionPointer','Marshal.Copy',
            'GetManifestResourceStream','AssemblyResolve','ResourceManager',
            'DeflateStream','GZipStream','CryptoStream','Rijndael','AesManaged',
            'ProtectedMemory','MemoryStream','BinaryReader'
          ]
          hits=[]
          for s in blobs:
            ms=[t for t in fingerprints if t.lower() in s.lower()]
            if ms: hits.append({'terms':ms,'string':s[:3000]})
          (ev/'22_PROTECTOR_FINGERPRINT_HITS.json').write_text(
            json.dumps(hits,indent=2,ensure_ascii=False)+'\n')
          print('fingerprint_hits',len(hits))
          PY

      - name: Build precise MethodDef stub map
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json,re
          import dnfile, pefile

          out=Path(os.environ['OUT']); ev=out/'evidence'; exe=out/'dstech.exe'
          pe=pefile.PE(str(exe),fast_load=False)
          dn=dnfile.dnPE(str(exe))
          raw=exe.read_bytes()

          rows=[]
          stubs=[]
          key=[]
          if dn.net and dn.net.mdtables and dn.net.mdtables.MethodDef:
            for rid,m in enumerate(dn.net.mdtables.MethodDef.rows,1):
              name=str(m.Name)
              rva=int(m.Rva or 0)
              token=0x06000000|rid
              body=b''
              file_off=None
              if rva:
                try:
                  file_off=pe.get_offset_from_rva(rva)
                  body=raw[file_off:file_off+32]
                except: pass
              # Recognize the protected method body seen repeatedly:
              # tiny/fat header then nop,nop,nop,ret. Keep raw bytes for audit.
              stub_like=(b'\x00\x00\x00\x2a' in body[:20])
              row={
                'rid':rid,'token':token,'token_hex':hex(token),
                'name':name,'rva':rva,'rva_hex':hex(rva),
                'file_offset':file_off,
                'file_offset_hex':hex(file_off) if file_off is not None else None,
                'raw32':body.hex().upper(),
                'stub_like':stub_like
              }
              rows.append(row)
              if stub_like: stubs.append(row)
              if name in {
                'UpdateCommandThread','HidRead','HidDataReceived','Read','Write',
                'Send','getFeature','setFeature','appendReadSensorBulkCommand',
                'appendReadSensorFifoCommand','appendReadSensorCommand'
              }:
                key.append(row)
          (ev/'30_METHODDEF_MAP.json').write_text(json.dumps(rows,indent=2)+'\n')
          (ev/'31_STUB_METHODS.json').write_text(json.dumps(stubs,indent=2)+'\n')
          (ev/'32_KEY_METHODS.json').write_text(json.dumps(key,indent=2)+'\n')
          (ev/'33_STUB_SUMMARY.json').write_text(json.dumps({
            'method_count':len(rows),'stub_like_count':len(stubs),
            'stub_fraction':(len(stubs)/len(rows) if rows else 0),
            'update_command_thread':[r for r in rows if r['name']=='UpdateCommandThread']
          },indent=2)+'\n')
          PY

      - name: Extract protector helper classes and module initialization IL
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re,json
          out=Path(os.environ['OUT']); ev=out/'evidence'
          il=(out/'il/all.il').read_text(errors='ignore')
          needles=[
            'q71r2Rj8SiD9GF1BI50','cIl9ffeRGV4htojFrSb',
            "<Module>{93326db6-bd6b-49d7-bcbb-0b5f9f9d91b4}",
            'N9jju8llVi','GlNjyV3Xag','ziUjWiyQoN','eUxozINRQ9'
          ]
          windows=[]
          lines=il.splitlines()
          for i,line in enumerate(lines):
            found=[n for n in needles if n.lower() in line.lower()]
            if not found: continue
            lo=max(0,i-120); hi=min(len(lines),i+500)
            windows.append({
              'line':i+1,'terms':found,
              'context':'\n'.join(f'{j+1}: {lines[j]}' for j in range(lo,hi))[:120000]
            })
          (ev/'40_PROTECTOR_HELPER_IL_WINDOWS.json').write_text(
            json.dumps(windows,indent=2,ensure_ascii=False)+'\n')
          print('helper_windows',len(windows))
          PY

      - name: Extract managed resource blobs without executing assembly
        shell: bash
        run: |
          set -euo pipefail
          cat > "$OUT/ResourceDump.cs" <<'CS'
          using System;
          using System.IO;
          using System.Reflection.Metadata;
          using System.Reflection.PortableExecutable;
          using System.Text.Json;
          using System.Collections.Generic;

          class P {
            static void Main(string[] args) {
              var path=args[0]; var outDir=args[1]; Directory.CreateDirectory(outDir);
              using var fs=File.OpenRead(path); using var pe=new PEReader(fs);
              var md=pe.GetMetadataReader(); var ch=pe.PEHeaders.CorHeader;
              var list=new List<object>();
              if(ch == null) { File.WriteAllText(Path.Combine(outDir,"manifest.json"),"[]"); return; }
              var resRva=ch.ResourcesDirectory.RelativeVirtualAddress;
              foreach(var h in md.ManifestResources) {
                var r=md.GetManifestResource(h); var name=md.GetString(r.Name);
                bool embedded=r.Implementation.IsNil;
                int len=0; string file=""; string err="";
                if(embedded) {
                  try {
                    var block=pe.GetSectionData(resRva + (int)r.Offset);
                    var reader=block.GetReader(); len=reader.ReadInt32();
                    if(len>=0 && len<=reader.RemainingBytes) {
                      var bytes=reader.ReadBytes(len);
                      var safe=string.Join("_", name.Split(Path.GetInvalidFileNameChars()));
                      file=safe+".bin"; File.WriteAllBytes(Path.Combine(outDir,file),bytes);
                    }
                  } catch(Exception ex) { err=ex.GetType().Name+":"+ex.Message; }
                }
                list.Add(new { name, embedded, offset=(uint)r.Offset, length=len, file, error=err });
              }
              File.WriteAllText(Path.Combine(outDir,"manifest.json"),
                JsonSerializer.Serialize(list,new JsonSerializerOptions{WriteIndented=true}));
            }
          }
          CS
          cat > "$OUT/ResourceDump.csproj" <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net8.0</TargetFramework></PropertyGroup>
          </Project>
          XML
          (cd "$OUT" && dotnet run -c Release --project ResourceDump.csproj -- "$OUT/dstech.exe" "$OUT/resource-dump") \
            > "$OUT/evidence/50_RESOURCE_DUMP_STDOUT.txt" 2> "$OUT/evidence/51_RESOURCE_DUMP_STDERR.txt"
          cp "$OUT/resource-dump/manifest.json" "$OUT/evidence/52_MANIFEST_RESOURCES.json"

      - name: Analyze resource blobs and search method token/RVA keys
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json,math,collections,zlib,gzip,bz2,lzma,hashlib,struct,re
          out=Path(os.environ['OUT']); ev=out/'evidence'; rr=out/'resource-dump'
          token=0x0600082C; rva=0xA3F4
          pats={
            'UpdateCommandThread_token_LE':struct.pack('<I',token),
            'UpdateCommandThread_RVA_LE':struct.pack('<I',rva),
            'BSJB':b'BSJB','MZ':b'MZ','PE':b'PE\x00\x00'
          }
          def entropy(data):
            if not data:return 0
            c=collections.Counter(data); n=len(data)
            return -sum((v/n)*math.log2(v/n) for v in c.values())
          rows=[]; keys=[]
          for p in rr.glob('*.bin'):
            data=p.read_bytes()
            row={'file':p.name,'size':len(data),'sha256':hashlib.sha256(data).hexdigest(),
                 'entropy':entropy(data),'head64':data[:64].hex().upper()}
            found=[]
            for name,pat in pats.items():
              pos=data.find(pat)
              if pos>=0:
                found.append({'pattern':name,'offset':pos,'offset_hex':hex(pos)})
                keys.append({'file':p.name,'pattern':name,'offset':pos})
            row['key_hits']=found
            attempts=[]
            funcs=[('zlib',zlib.decompress),('gzip',gzip.decompress),('bz2',bz2.decompress),('lzma',lzma.decompress)]
            for name,fn in funcs:
              try:
                dec=fn(data)
                if dec and len(dec)>0:
                  op=rr/(p.name+'.'+name+'.dec')
                  op.write_bytes(dec)
                  attempts.append({'codec':name,'ok':True,'size':len(dec),'head64':dec[:64].hex().upper()})
              except Exception: pass
            # raw-deflate best effort
            try:
              dec=zlib.decompress(data,-15)
              if dec:
                op=rr/(p.name+'.deflate.dec');op.write_bytes(dec)
                attempts.append({'codec':'raw-deflate','ok':True,'size':len(dec),'head64':dec[:64].hex().upper()})
            except Exception: pass
            row['decompression']=attempts
            rows.append(row)
          (ev/'53_RESOURCE_BLOB_ANALYSIS.json').write_text(json.dumps(rows,indent=2)+'\n')
          (ev/'54_RESOURCE_KEY_HITS.json').write_text(json.dumps(keys,indent=2)+'\n')
          print('resource_blobs',len(rows),'key_hits',len(keys))
          PY

      - name: Upload metadata/protector evidence
        uses: actions/upload-artifact@v4
        with:
          name: r106-metadata-protector-evidence
          path: /tmp/r106-metadata/evidence
          if-no-files-found: error
          retention-days: 7

  carve_text:
    name: 2 - High-entropy text + encrypted-store carving
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OUT: /tmp/r106-carve

    steps:
      - name: Safety gate and download client
        shell: bash
        run: |
          set -euo pipefail
          test "$LIVE_BOARD_USB" = "NO"
          test "$HOST_TO_DEVICE_USB" = "NO"
          test "$FLASH_ERASE_WRITE" = "NO"
          test "$FLASH_ALLOWED" = "NO"
          rm -rf "$OUT"; mkdir -p "$OUT"/{downloads,pkg,evidence}
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends unzip p7zip-full file curl python3 python3-pip
          python3 -m pip install --break-system-packages --quiet pefile dnfile
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 240 \
            --user-agent "Mozilla/5.0 OKN-R106-Carver" \
            --referer "https://golodsp.com/7%E9%80%9A%E9%81%93%E9%9F%B3%E9%A2%91%E5%89%8D%E7%BA%A7/" \
            --output "$OUT/downloads/windows.zip" "$WINDOWS_URL"
          7z x -y "$OUT/downloads/windows.zip" -o"$OUT/pkg" >/dev/null
          EXE="$(find "$OUT/pkg" -type f -iname '*.exe' ! -path '*/__MACOSX/*' ! -name '._*' -size +100k | sort | head -n1)"
          cp "$EXE" "$OUT/dstech.exe"

      - name: Build PE section entropy map and token/RVA windows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json,math,collections,struct,hashlib
          import pefile
          out=Path(os.environ['OUT']); ev=out/'evidence'; exe=out/'dstech.exe'; data=exe.read_bytes()
          pe=pefile.PE(str(exe),fast_load=False)
          def H(b):
            if not b:return 0
            c=collections.Counter(b);n=len(b)
            return -sum((v/n)*math.log2(v/n) for v in c.values())
          sections=[]; blocks=[]
          for s in pe.sections:
            name=s.Name.rstrip(b'\0').decode(errors='ignore')
            raw=s.get_data(); base=s.PointerToRawData
            sections.append({'name':name,'raw_offset':base,'raw_size':len(raw),'entropy':H(raw),
                             'virtual_address':int(s.VirtualAddress),'virtual_size':int(s.Misc_VirtualSize)})
            if name=='.text':
              for off in range(0,len(raw),4096):
                b=raw[off:off+4096]
                blocks.append({'file_offset':base+off,'file_offset_hex':hex(base+off),
                               'section_offset':off,'section_offset_hex':hex(off),
                               'size':len(b),'entropy':H(b),'sha256':hashlib.sha256(b).hexdigest(),
                               'head32':b[:32].hex().upper()})
          blocks.sort(key=lambda x:-x['entropy'])
          pats={
            'token_0600082C_LE':struct.pack('<I',0x0600082C),
            'rva_A3F4_LE':struct.pack('<I',0xA3F4),
            'VID_PID_LE':bytes.fromhex('24631917'),
            'usage_55AA':bytes.fromhex('AA55')
          }
          ph=[]
          for name,pat in pats.items():
            start=0
            while True:
              i=data.find(pat,start)
              if i<0:break
              lo=max(0,i-128);hi=min(len(data),i+256)
              ph.append({'pattern':name,'offset':i,'offset_hex':hex(i),'context_hex':data[lo:hi].hex().upper()})
              start=i+1
          (ev/'10_PE_SECTIONS.json').write_text(json.dumps(sections,indent=2)+'\n')
          (ev/'11_TOP_ENTROPY_BLOCKS.json').write_text(json.dumps(blocks[:300],indent=2)+'\n')
          (ev/'12_TOKEN_RVA_BINARY_HITS.json').write_text(json.dumps(ph,indent=2)+'\n')
          print('token_rva_hits',len(ph))
          PY

      - name: Map protected stub RVAs against high entropy neighborhoods
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json,math,collections
          import pefile,dnfile
          out=Path(os.environ['OUT']);ev=out/'evidence';exe=out/'dstech.exe';raw=exe.read_bytes()
          pe=pefile.PE(str(exe),fast_load=False);dn=dnfile.dnPE(str(exe))
          def H(b):
            if not b:return 0
            c=collections.Counter(b);n=len(b)
            return -sum((v/n)*math.log2(v/n) for v in c.values())
          rows=[]
          if dn.net and dn.net.mdtables and dn.net.mdtables.MethodDef:
            for rid,m in enumerate(dn.net.mdtables.MethodDef.rows,1):
              rva=int(m.Rva or 0)
              if not rva:continue
              try: fo=pe.get_offset_from_rva(rva)
              except:continue
              b=raw[fo:fo+32]
              if b'\x00\x00\x00\x2a' not in b[:20]:continue
              lo=max(0,fo-4096);hi=min(len(raw),fo+4096)
              rows.append({'rid':rid,'token_hex':hex(0x06000000|rid),'name':str(m.Name),
                           'rva_hex':hex(rva),'file_offset_hex':hex(fo),
                           'local_entropy_8k':H(raw[lo:hi]),'raw32':b.hex().upper()})
          (ev/'20_STUB_LOCAL_ENTROPY.json').write_text(json.dumps(rows,indent=2)+'\n')
          print('stub_count',len(rows))
          PY

      - name: Upload carving evidence
        uses: actions/upload-artifact@v4
        with:
          name: r106-text-carving-evidence
          path: /tmp/r106-carve/evidence
          if-no-files-found: error
          retention-days: 7

  correlate:
    name: 3 - Correlate protector + resource + encrypted store
    needs: [inspect_metadata, carve_text]
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$LIVE_BOARD_USB" = "NO"
          test "$HOST_TO_DEVICE_USB" = "NO"
          test "$FLASH_ERASE_WRITE" = "NO"
          test "$FLASH_ALLOWED" = "NO"
          rm -rf /tmp/r106-final; mkdir -p /tmp/r106-final/{metadata,carve,review}

      - name: Download metadata evidence
        uses: actions/download-artifact@v4
        with:
          name: r106-metadata-protector-evidence
          path: /tmp/r106-final/metadata

      - name: Download carving evidence
        uses: actions/download-artifact@v4
        with:
          name: r106-text-carving-evidence
          path: /tmp/r106-final/carve

      - name: Produce recovery verdict and next-stage map
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          b=Path('/tmp/r106-final');m=b/'metadata';c=b/'carve';r=b/'review'
          def load(p,d):
            p=Path(p)
            try:return json.loads(p.read_text(errors='ignore'))
            except:return d
          st=load(m/'33_STUB_SUMMARY.json',{})
          fp=load(m/'22_PROTECTOR_FINGERPRINT_HITS.json',[])
          res=load(m/'53_RESOURCE_BLOB_ANALYSIS.json',[])
          keys=load(m/'54_RESOURCE_KEY_HITS.json',[])
          hits=load(c/'12_TOKEN_RVA_BINARY_HITS.json',[])
          secs=load(c/'10_PE_SECTIONS.json',[])
          helper=load(m/'40_PROTECTOR_HELPER_IL_WINDOWS.json',[])
          update=st.get('update_command_thread',[])
          recovery_sources=[]
          if keys: recovery_sources.append('manifest_resource_key_hit')
          if hits: recovery_sources.append('raw_binary_token_or_rva_hit')
          if helper: recovery_sources.append('protector_helper_il_available')
          verdict={
            'method_count':st.get('method_count'),
            'stub_like_count':st.get('stub_like_count'),
            'stub_fraction':st.get('stub_fraction'),
            'update_command_thread':update,
            'protector_fingerprint_hits':len(fp),
            'manifest_resource_blobs':len(res),
            'resource_token_or_rva_key_hits':len(keys),
            'raw_binary_token_or_rva_hits':len(hits),
            'protector_helper_il_windows':len(helper),
            'recovery_sources':recovery_sources,
            'protected_method_body_recovered':False,
            'updater_protocol_recovered':False,
            'firmware_readback_primitive_proven':False,
            'full_flash_readback_proven':False,
            'live_board_commands_allowed':False,
            'next_gate':'Use protector-helper IL plus resource/token/RVA hits to reconstruct the method-restoration algorithm and recover UpdateCommandThread body without executing the target.'
          }
          (r/'50_R106_VERDICT.json').write_text(json.dumps(verdict,indent=2)+'\n')
          lines=[
            'OKN R106 MEGA PROTECTED METHOD RECOVERY',
            'OFFLINE_ONLY=true',
            f"METHOD_COUNT={st.get('method_count',0)}",
            f"STUB_LIKE_COUNT={st.get('stub_like_count',0)}",
            f"PROTECTOR_FINGERPRINT_HITS={len(fp)}",
            f"MANIFEST_RESOURCE_BLOBS={len(res)}",
            f"RESOURCE_TOKEN_RVA_KEY_HITS={len(keys)}",
            f"RAW_BINARY_TOKEN_RVA_HITS={len(hits)}",
            f"PROTECTOR_HELPER_IL_WINDOWS={len(helper)}",
            'PROTECTED_METHOD_BODY_RECOVERED=false',
            'UPDATER_PROTOCOL_RECOVERED=false',
            'FIRMWARE_READBACK_PRIMITIVE_PROVEN=false',
            'FULL_FLASH_READBACK_PROVEN=false',
            'LIVE_BOARD_COMMANDS_ALLOWED=false'
          ]
          (r/'51_R106_SUMMARY.txt').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY

      - name: Copy compact evidence into final bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r106-final/review/metadata /tmp/r106-final/review/carve
          cp -a /tmp/r106-final/metadata/. /tmp/r106-final/review/metadata/
          cp -a /tmp/r106-final/carve/. /tmp/r106-final/review/carve/
          cat > /tmp/r106-final/review/99_SAFETY_ATTESTATION.txt <<'EOF'
          OFFLINE_STATIC_ONLY=true
          TARGET_EXECUTED=false
          BOARD_USB_ACCESSED=false
          HOST_TO_DEVICE_COMMANDS_SENT=false
          FLASH_ERASE_WRITE=false
          FULL_FLASH_READBACK_PROVEN=false
          EOF
          (cd /tmp/r106-final/review && find . -type f -print0 | sort -z | xargs -0 sha256sum) \
            > /tmp/r106-final/review/SHA256SUMS.txt

      - name: Publish combined summary
        shell: bash
        run: |
          {
            echo "## OKN R106 MEGA Protected Method Recovery"
            echo
            echo "Static-only: the protected Windows client is never executed."
            echo '```text'
            cat /tmp/r106-final/review/51_R106_SUMMARY.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload final R106 evidence
        uses: actions/upload-artifact@v4
        with:
          name: R106-MEGA-PROTECTED-METHOD-RECOVERY-EVIDENCE
          path: /tmp/r106-final/review
          if-no-files-found: error
          retention-days: 30
