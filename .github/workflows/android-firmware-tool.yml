              r"IL_23ed:[\s\S]{0,300}?ldloc\.s 47"
              r"[\s\S]{0,80}?ldloc\.s 8"
              r"[\s\S]{0,160}?VnHlfpNorSGR6U9GUOp",n9,re.M)),
