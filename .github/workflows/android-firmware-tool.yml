name: OKN R114 FAST Stage1 Store + N9 Parser Recovery OFFLINE ONLY

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/android-firmware-tool.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: okn-r114-fast-stage1-${{ github.ref }}
  cancel-in-progress: true

env:
  WINDOWS_URL: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-08.exe_.zip"
  LIVE_BOARD_USB: "NO"
  HOST_TO_DEVICE_USB: "NO"
  FLASH_ERASE_WRITE: "NO"
  FLASH_ALLOWED: "NO"

jobs:
  recover:
    name: Fast stage1 store recovery and second-stage parser tracing
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OUT: /tmp/r114

    steps:
      - name: Fail-closed static-only safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$LIVE_BOARD_USB" = "NO"
          test "$HOST_TO_DEVICE_USB" = "NO"
          test "$FLASH_ERASE_WRITE" = "NO"
          test "$FLASH_ALLOWED" = "NO"

          rm -rf "$OUT"
          mkdir -p "$OUT"/{downloads,pkg,il,resources,decrypted,evidence,review}

          cat > "$OUT/evidence/00_SCOPE.txt" <<'EOF'
          REVISION=R114
          MODE=OFFLINE_STATIC_ONLY
          TARGET_EXECUTED=false
          BOARD_USB_ACCESS=NO
          HOST_TO_DEVICE_USB=NO
          FLASH_ERASE_WRITE=NO
          FLASH_ALLOWED=NO
          PE_TARGET=PE32
          STATIC_INTPTR_SIZE=4
          TARGET_PROTECTOR=N9jju8llVi
          TARGET_RESOURCE=h15IL2i6yy2BZV8RqM.YuRwd1JALC4oy32W66
          TARGET_METHOD=UpdateCommandThread
          TARGET_METHOD_TOKEN=0x0600082C
          TARGET_METHOD_RID=2092
          GOAL=Recover_exact_key_iv_execute_large_word_transform_fast_then_parse_stage1_store_without_running_target
          EOF

      - name: Install static-analysis dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            unzip p7zip-full file curl python3 python3-pip
          python3 -m pip install --break-system-packages --quiet \
            pefile dnfile pycryptodome

      - name: Download official Windows client and dump IL
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            --connect-timeout 20 --max-time 240 \
            --user-agent "Mozilla/5.0 OKN-R111-Static-Research" \
            --referer "https://golodsp.com/7%E9%80%9A%E9%81%93%E9%9F%B3%E9%A2%91%E5%89%8D%E7%BA%A7/" \
            --output "$OUT/downloads/windows.zip" "$WINDOWS_URL"

          7z x -y "$OUT/downloads/windows.zip" -o"$OUT/pkg" >/dev/null

          EXE="$(
            find "$OUT/pkg" -type f -iname '*.exe' \
              ! -path '*/__MACOSX/*' ! -name '._*' -size +100k \
              | sort | head -n1
          )"
          test -n "$EXE"
          cp "$EXE" "$OUT/dstech.exe"

          export PATH="$PATH:$HOME/.dotnet/tools"
          if ! command -v ilspycmd >/dev/null 2>&1; then
            dotnet tool install --global ilspycmd >/dev/null
          fi
          ilspycmd --ilcode "$OUT/dstech.exe" > "$OUT/il/all.il" \
            2> "$OUT/evidence/01_ILSPY_STDERR.txt"

          {
            file "$OUT/dstech.exe"
            sha256sum "$OUT/dstech.exe"
            echo "IL_BYTES=$(stat -c%s "$OUT/il/all.il")"
          } > "$OUT/evidence/02_IDENTITY.txt"

      - name: Extract h15 and all managed resources statically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,struct,json,re,hashlib
          import pefile,dnfile

          out=Path(os.environ["OUT"])
          exe=out/"dstech.exe"
          raw=exe.read_bytes()
          pe=pefile.PE(str(exe),fast_load=False)
          dn=dnfile.dnPE(str(exe))

          cor=pe.OPTIONAL_HEADER.DATA_DIRECTORY[14]
          co=pe.get_offset_from_rva(int(cor.VirtualAddress))
          rrva,rsize=struct.unpack_from("<II",raw,co+24)
          ro=pe.get_offset_from_rva(rrva)

          table=getattr(getattr(getattr(dn,"net",None),"mdtables",None),"ManifestResource",None)
          rows=[]
          for rid,r in enumerate(getattr(table,"rows",[]) if table else [],1):
              name=str(r.Name); rel=int(r.Offset or 0)
              pos=ro+rel
              n=struct.unpack_from("<I",raw,pos)[0]
              data=raw[pos+4:pos+4+n]
              safe=re.sub(r"[^A-Za-z0-9._-]+","_",name)
              fn=f"{rid:03d}_{safe}.bin"
              (out/"resources"/fn).write_bytes(data)
              rows.append({
                  "rid":rid,"name":name,"length":len(data),"file":fn,
                  "sha256":hashlib.sha256(data).hexdigest(),
                  "mod16":len(data)%16,
                  "head32":data[:32].hex().upper()
              })

          (out/"evidence/10_RESOURCE_MAP.json").write_text(
              json.dumps(rows,indent=2,ensure_ascii=False)+"\n")

          h=next(x for x in rows if x["name"]=="h15IL2i6yy2BZV8RqM.YuRwd1JALC4oy32W66")
          data=(out/"resources"/h["file"]).read_bytes()
          header=data[:15]
          body=data[15:]
          (out/"resources/h15_header15.bin").write_bytes(header)
          (out/"resources/h15_after15.bin").write_bytes(body)

          hypothesis={
              "total_length":len(data),
              "total_mod16":len(data)%16,
              "first15_hex":header.hex().upper(),
              "after15_length":len(body),
              "after15_mod16":len(body)%16,
              "header15_is_hypothesis_not_proof":True
          }
          (out/"evidence/11_H15_HEADER15_HYPOTHESIS.json").write_text(
              json.dumps(hypothesis,indent=2)+"\n")
          print(json.dumps(hypothesis,indent=2))
          PY

      - name: Parse exact N9 method switch with deterministic slicing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json,re

          out=Path(os.environ["OUT"])
          il=(out/"il/all.il").read_text(errors="ignore")

          # IMPORTANT: never use a whole-file DOTALL/non-greedy regex here.
          # R110 timed out because that regex backtracked across the large IL.
          needle="N9jju8llVi () cil managed noinlining"
          pos=il.find(needle)
          if pos < 0:
              raise SystemExit("N9 method signature not found")

          start=il.rfind(".method",0,pos)
          if start < 0:
              raise SystemExit("N9 method start not found")

          end_tag="// end of method q71r2Rj8SiD9GF1BI50::N9jju8llVi"
          end_pos=il.find(end_tag,pos)
          if end_pos < 0:
              # Less-specific fallback still uses direct find, not regex.
              end_pos=il.find("// end of method",pos)
          if end_pos < 0:
              raise SystemExit("N9 method end not found")

          end_line=il.find("\n",end_pos)
          if end_line < 0:
              end_line=len(il)

          n9=il[start:end_line]
          (out/"evidence/20_N9_METHOD.il").write_text(n9)

          sw_start=n9.find("IL_0012: switch (")
          if sw_start < 0:
              raise SystemExit("main switch not found")
          sw_open=n9.find("(",sw_start)
          sw_close=n9.find(")",sw_open)
          if sw_open < 0 or sw_close < 0:
              raise SystemExit("main switch bounds not found")

          switch_blob=n9[sw_open+1:sw_close]
          targets=re.findall(r"IL_[0-9A-Fa-f]+",switch_blob)

          result={
              "method_bytes":len(n9),
              "switch_target_count":len(targets),
              "initial_state_constant":392,
              "initial_state_target":targets[392] if len(targets)>392 else None,
              "state_391_target":targets[391] if len(targets)>391 else None,
              "state_392_expected":"IL_1990",
              "state_392_mapping_correct":len(targets)>392 and targets[392]=="IL_1990",
              "all_targets":targets
          }
          (out/"evidence/21_EXACT_SWITCH_MAP.json").write_text(
              json.dumps(result,indent=2)+"\n")

          # Checkpoint immediately so evidence survives any later timeout.
          (out/"review").mkdir(exist_ok=True)
          (out/"review/20_N9_METHOD.il").write_text(n9)
          (out/"review/21_EXACT_SWITCH_MAP.json").write_text(
              json.dumps(result,indent=2)+"\n")

          print("method_bytes",len(n9))
          print("switch_targets",len(targets))
          print("state392",result["initial_state_target"])

          if not result["state_392_mapping_correct"]:
              raise SystemExit("corrected switch mapping gate failed")
          PY

      - name: Extract and prove exact wrapper method definitions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json,re

          out=Path(os.environ["OUT"])
          il=(out/"il/all.il").read_text(errors="ignore")
          ev=out/"evidence"

          names=[
            "zfos5ENLukrcbiO4qNQ","omTjeHNp0inHSoSsOBH",
            "tFjbT6Nj4GDWeki27kh","gH6uphNOsYQyRXDZmHu",
            "qfkv4ZNDynVciIciQy6","oNNQE6NTi9uesXTTGZJ",
            "B5fr4WNvBYuVpLZQQQQ","sWg0PuN2fLSfxi2LB0D",
            "uKbcISNmDSreine16Qp","trEuKPNkgB3p5fLuROn",
            "Q2CVcdNXO7dpP5ufbGy","VnHlfpNorSGR6U9GUOp",
            "RMHoOvNN1BGBrZfKGy1","it3eekNKjtbEQVI5up2",
            "HVJrNANRJZcM7WNOuLw"
          ]

          methods={}
          for name in names:
            end_tag="// end of method q71r2Rj8SiD9GF1BI50::"+name
            e=il.find(end_tag)
            if e < 0:
              raise SystemExit("wrapper end marker missing: "+name)
            s=il.rfind(".method",0,e)
            if s < 0:
              raise SystemExit("wrapper start missing: "+name)
            nl=il.find("\n",e)
            if nl < 0: nl=len(il)
            methods[name]=il[s:nl]

          proofs={
            "zfos_is_constant_true":(
              methods["zfos5ENLukrcbiO4qNQ"].count("ldnull") >= 2
              and "ceq" in methods["zfos5ENLukrcbiO4qNQ"]
              and "ret" in methods["zfos5ENLukrcbiO4qNQ"]
            ),
            "omt_is_constant_null":(
              "ldnull" in methods["omTjeHNp0inHSoSsOBH"]
              and "ret" in methods["omTjeHNp0inHSoSsOBH"]
              and "call " not in methods["omTjeHNp0inHSoSsOBH"]
            ),
            "tf_reads_intptr_size":(
              "System.IntPtr::get_Size()" in methods["tFjbT6Nj4GDWeki27kh"]
            ),
            "resource_wrapper_is_GetManifestResourceStream":(
              "GetManifestResourceStream" in methods["gH6uphNOsYQyRXDZmHu"]
            ),
            "qfkv_is_BinaryReader_ReadInt32":(
              "::sXXetjyGMH()" in methods["qfkv4ZNDynVciIciQy6"]
            ),
            "base_stream_wrapper":(
              "::mpep2xkqqr()" in methods["oNNQE6NTi9uesXTTGZJ"]
            ),
            "length_wrapper":(
              "System.IO.Stream::get_Length()" in methods["B5fr4WNvBYuVpLZQQQQ"]
            ),
            "readbytes_wrapper":(
              "::FtHelxtJIP(int32)" in methods["sWg0PuN2fLSfxi2LB0D"]
            ),
            "position_setter_wrapper":(
              "System.IO.Stream::set_Position(int64)" in methods["uKbcISNmDSreine16Qp"]
            ),
            "cipher_mode_setter":(
              "SymmetricAlgorithm::set_Mode" in methods["Q2CVcdNXO7dpP5ufbGy"]
            ),
            "create_decryptor_proven":(
              "SymmetricAlgorithm::CreateDecryptor(uint8[], uint8[])"
              in methods["VnHlfpNorSGR6U9GUOp"]
            ),
            "crypto_write_wrapper":(
              "System.IO.Stream::Write(uint8[], int32, int32)"
              in methods["RMHoOvNN1BGBrZfKGy1"]
            ),
            "flush_final_block_wrapper":(
              "CryptoStream::FlushFinalBlock()" in methods["it3eekNKjtbEQVI5up2"]
            ),
            "memory_to_array_wrapper":(
              "MemoryStream::ToArray()" in methods["HVJrNANRJZcM7WNOuLw"]
            ),
          }

          if not all(proofs.values()):
            raise SystemExit("exact wrapper proof gate failed: "+json.dumps(proofs))

          (ev/"22_EXACT_WRAPPER_METHODS.json").write_text(
            json.dumps(methods,indent=2,ensure_ascii=False)+"\n")
          (ev/"23_EXACT_WRAPPER_PROOFS.json").write_text(
            json.dumps(proofs,indent=2)+"\n")

          print(json.dumps(proofs,indent=2))
          PY

      - name: Prove custom reader is plain BinaryReader
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json

          out=Path(os.environ["OUT"])
          il=(out/"il/all.il").read_text(errors="ignore")
          ev=out/"evidence"

          names=[
            ".ctor","mpep2xkqqr","FtHelxtJIP","sXXetjyGMH"
          ]
          rows={}
          for name in names:
            tag=f"// end of method Y7Uor8e58M9K22QZF7H::{name}"
            e=il.find(tag)
            if e < 0:
              raise SystemExit("reader method missing: "+name)
            s=il.rfind(".method",0,e)
            nl=il.find("\n",e)
            rows[name]=il[s:(len(il) if nl<0 else nl)]

          proofs={
            "ctor_wraps_BinaryReader":
              "System.IO.BinaryReader::.ctor" in rows[".ctor"],
            "base_stream_is_BinaryReader_BaseStream":
              "System.IO.BinaryReader::get_BaseStream()" in rows["mpep2xkqqr"],
            "read_bytes_is_BinaryReader_ReadBytes":
              "System.IO.BinaryReader::ReadBytes(int32)" in rows["FtHelxtJIP"],
            "read_int32_is_BinaryReader_ReadInt32":
              "System.IO.BinaryReader::ReadInt32()" in rows["sXXetjyGMH"],
          }

          if not all(proofs.values()):
            raise SystemExit("BinaryReader proof gate failed")

          (ev/"24_BINARYREADER_METHODS.json").write_text(
            json.dumps(rows,indent=2,ensure_ascii=False)+"\n")
          (ev/"25_BINARYREADER_PROOFS.json").write_text(
            json.dumps(proofs,indent=2)+"\n")
          print(json.dumps(proofs,indent=2))
          PY

      - name: Run exact IL emulator with accelerated stage1 word loop
        shell: bash
        run: |
          set -euo pipefail
          cat > "$OUT/n9_emulator.py" <<'PY'
          from pathlib import Path
          from dataclasses import dataclass, field
          import os,re,json,copy,struct,hashlib,collections
          from Crypto.Cipher import AES
          from Crypto.Util.Padding import unpad

          OUT=Path(os.environ["OUT"])
          N9=(OUT/"evidence/20_N9_METHOD.il").read_text(errors="ignore")
          RM=json.loads((OUT/"evidence/10_RESOURCE_MAP.json").read_text())
          RESOURCE_BY_NAME={r["name"]:(OUT/"resources"/r["file"]).read_bytes() for r in RM}

          class U:
              def __init__(self,name="unknown"): self.name=name
              def __repr__(self): return f"U({self.name})"
          def unk(v): return isinstance(v,U)

          class Stream:
              def __init__(self,data=b""): self.data=bytes(data); self.pos=0
          class Reader:
              def __init__(self,s): self.s=s
          class SymAlg:
              def __init__(self): self.mode=1
          class Transform:
              def __init__(self,key,iv): self.key=key; self.iv=iv
          class Mem:
              def __init__(self): self.data=bytearray()
          class Crypto:
              def __init__(self,mem,tr): self.mem=mem; self.tr=tr; self.inp=bytearray()

          # Parse IL instruction labels.
          ins=[]
          label={}
          for line in N9.splitlines():
              m=re.match(r'\s*(IL_[0-9A-Fa-f]+):\s*(.*)',line)
              if not m: continue
              lab=m.group(1); rest=m.group(2).strip()
              if not rest: continue
              parts=rest.split(None,1)
              op=parts[0]; arg=parts[1] if len(parts)>1 else ""
              label[lab]=len(ins)
              ins.append((lab,op,arg,rest))

          switch_targets=re.findall(r'IL_[0-9A-Fa-f]+',ins[label["IL_0012"]][2])

          TRUE_FUN={"WbRj7RycxdawMtIuobL","fX136sh7mQQ8tIupxUo"}
          NULL_FUN={"KTbwe7yfoqkIHrkHFxb","ayhyp5hj3R0itGWa7hr"}

          def locno(op,arg):
              m=re.match(r'(?:ldloc|stloc)\.(\d+)$',op)
              if m:return int(m.group(1))
              if op in ("ldloc","stloc","ldloc.s","stloc.s"):
                  try:return int(arg.split()[0])
                  except:return None
              return None

          def ldc(op,arg):
              if op=="ldc.i4.m1": return -1
              m=re.match(r'ldc\.i4\.(\d+)$',op)
              if m:return int(m.group(1))
              if op in ("ldc.i4","ldc.i4.s"):
                  s=arg.split()[0]
                  try:return int(s,0)
                  except:return U("bad_ldc")
              return None

          def argc(callarg):
              mm=re.search(r'\((.*)\)\s*$',callarg)
              if not mm:return 0
              s=mm.group(1).strip()
              if not s:return 0
              # All relevant protector wrapper args are simple and have no nested commas.
              return len([x for x in s.split(",") if x.strip()])

          def method(callarg):
              m=re.search(r'::([A-Za-z0-9_.$<>`\'"-]+)\s*\(',callarg)
              return m.group(1) if m else ""

          def rettype(callarg):
              pre=callarg.split("::",1)[0].strip()
              return pre.split()[0] if pre else "object"

          @dataclass
          class S:
              ip:int=0
              stack:list=field(default_factory=list)
              locals:list=field(default_factory=lambda:[0]*120)
              statics:dict=field(default_factory=dict)
              trace:list=field(default_factory=list)
              reads:list=field(default_factory=list)
              milestones:list=field(default_factory=list)
              unknown_branches:int=0
              steps:int=0

          def cp(s): return copy.deepcopy(s)
          def pop(s):
              return s.stack.pop() if s.stack else U("stack_underflow")
          def push(s,v): s.stack.append(v)

          def binary(a,b,op):
              if unk(a) or unk(b): return U(f"{op}")
              try:
                  if op=="add":return a+b
                  if op=="sub":return a-b
                  if op=="mul":return a*b
                  if op in ("div","div.un"):return a//b
                  if op in ("rem","rem.un"):return a%b
                  if op=="xor":return a^b
                  if op=="and":return a&b
                  if op=="or":return a|b
                  if op=="shl":return a<<b
                  if op in ("shr","shr.un"):return a>>b
                  if op=="ceq":return int(a==b)
                  if op in ("cgt","cgt.un"):return int(a>b)
                  if op in ("clt","clt.un"):return int(a<b)
              except:return U(op)
              return U(op)

          def known_call(s,name,args):
              if name=="zfos5ENLukrcbiO4qNQ":
                  return True
              if name=="omTjeHNp0inHSoSsOBH":
                  return None
              if name in TRUE_FUN:return True
              if name in NULL_FUN:return None
              if name=="tFjbT6Nj4GDWeki27kh":return 4
              if name=="gH6uphNOsYQyRXDZmHu":
                  nm=args[-1] if args else U()
                  if isinstance(nm,str) and nm in RESOURCE_BY_NAME:
                      st=Stream(RESOURCE_BY_NAME[nm])
                      event={"kind":"resource_open","name":nm,"length":len(st.data),"step":s.steps}
                      s.milestones.append(event)
                      GLOBAL_EVENTS.append(event)
                      return st
                  return U("resource")
              if name=="qfkv4ZNDynVciIciQy6":
                  r=args[-1] if args else U()
                  if isinstance(r,Reader):
                      before=r.s.pos
                      if before+4<=len(r.s.data):
                          v=struct.unpack_from("<i",r.s.data,before)[0]; r.s.pos+=4
                          s.reads.append({"op":"ReadInt32","before":before,"after":r.s.pos,"value":v})
                          return v
                  return U("ReadInt32")
              if name=="oNNQE6NTi9uesXTTGZJ":
                  r=args[-1] if args else U()
                  return r.s if isinstance(r,Reader) else U("BaseStream")
              if name=="B5fr4WNvBYuVpLZQQQQ":
                  st=args[-1] if args else U()
                  return len(st.data) if isinstance(st,Stream) else U("Length")
              if name=="YoMYlpKfA3xZZIkL5Uo":
                  st=args[-1] if args else U()
                  return st.pos if isinstance(st,Stream) else U("Position")
              if name=="uKbcISNmDSreine16Qp":
                  if len(args)>=2 and isinstance(args[-2],Stream) and isinstance(args[-1],int):
                      args[-2].pos=args[-1]
                  return None
              if name=="sWg0PuN2fLSfxi2LB0D":
                  if len(args)>=2 and isinstance(args[-2],Reader) and isinstance(args[-1],int):
                      r=args[-2]; n=max(0,args[-1]); before=r.s.pos
                      data=r.s.data[before:before+n]; r.s.pos+=len(data)
                      s.reads.append({"op":"ReadBytes","before":before,"after":r.s.pos,"requested":n,"returned":len(data)})
                      return bytes(data)
                  return U("ReadBytes")
              if name=="trEuKPNkgB3p5fLuROn":return SymAlg()
              if name=="Q2CVcdNXO7dpP5ufbGy":
                  if len(args)>=2 and isinstance(args[-2],SymAlg):args[-2].mode=args[-1]
                  return None
              if name=="VnHlfpNorSGR6U9GUOp":
                  if len(args)>=3:
                      alg,key,iv=args[-3:]
                      kb=bytes(key) if isinstance(key,(bytes,bytearray)) else key
                      ib=bytes(iv) if isinstance(iv,(bytes,bytearray)) else iv
                      if isinstance(kb,bytes) and isinstance(ib,bytes):
                          s.milestones.append({
                              "kind":"CreateDecryptor","key_hex":kb.hex().upper(),
                              "iv_hex":ib.hex().upper(),"key_len":len(kb),"iv_len":len(ib),
                              "step":s.steps
                          })
                      return Transform(kb,ib)
                  return U("transform")
              if name=="RMHoOvNN1BGBrZfKGy1":
                  if len(args)>=4 and isinstance(args[-4],Crypto):
                      c,buf,off,n=args[-4:]
                      if isinstance(buf,(bytes,bytearray)) and isinstance(off,int) and isinstance(n,int):
                          c.inp.extend(bytes(buf)[off:off+n])
                  return None
              if name=="it3eekNKjtbEQVI5up2":
                  c=args[-1] if args else U()
                  if isinstance(c,Crypto) and isinstance(c.tr,Transform):
                      key,iv=c.tr.key,c.tr.iv
                      if isinstance(key,bytes) and isinstance(iv,bytes) and len(key) in (16,24,32) and len(iv)==16 and len(c.inp)%16==0:
                          try:
                              raw=AES.new(key,AES.MODE_CBC,iv).decrypt(bytes(c.inp))
                              try: plain=unpad(raw,16)
                              except: plain=raw
                              c.mem.data.extend(plain)
                              s.milestones.append({
                                  "kind":"AES_DECRYPT","cipher_len":len(c.inp),
                                  "plain_len":len(plain),"plain_head64":plain[:64].hex().upper(),
                                  "pkcs7_removed":len(plain)!=len(raw),"step":s.steps
                              })
                          except Exception as e:
