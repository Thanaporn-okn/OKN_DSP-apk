name: OKN R99 ARM64 PP-XREF UFE Frame Miner OFFLINE ONLY

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/android-firmware-tool.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: okn-r99-arm64-pp-xref-${{ github.ref }}
  cancel-in-progress: true

env:
  OUT: /tmp/okn-r99
  ANDROID_URL: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-01.apk_.zip"
  LIVE_BOARD_USB: "NO"
  HOST_TO_DEVICE_USB: "NO"
  FLASH_ERASE_WRITE: "NO"
  FLASH_ALLOWED: "NO"

jobs:
  mine:
    name: Reconstruct ARM64 PP references for UFE read frames / STATIC ONLY
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fail-closed offline-only scope gate
        shell: bash
        run: |
          set -euo pipefail
          test "$LIVE_BOARD_USB" = "NO"
          test "$HOST_TO_DEVICE_USB" = "NO"
          test "$FLASH_ERASE_WRITE" = "NO"
          test "$FLASH_ALLOWED" = "NO"
          rm -rf "$OUT"
          mkdir -p "$OUT"/{downloads,android,blutter,evidence,review}

          cat > "$OUT/evidence/00_SCOPE.txt" <<'EOF'
          REVISION=R99
          MODE=OFFLINE_STATIC_ONLY
          TARGET=GoloPine_DSTech_BP1048P4
          KNOWN_PRODUCTION_USB=6324:1719
          KNOWN_HID_USAGE=FF00:55AA
          KNOWN_READ_SENSOR=0x58
          KNOWN_READ_SENSOR_FIFO=0x61
          KNOWN_READ_SENSOR_BULK=0x63
          KNOWN_RESPONSE_READ_SENSOR=0x60
          KNOWN_RESPONSE_FIFO=0x62
          KNOWN_RESPONSE_BULK=0x64
          KNOWN_CONTINUE_BULK=0x82
          BOARD_USB_ACCESS=NO
          LIVE_USB_COMMANDS=NO
          HOST_TO_DEVICE_USB=NO
          SET_REPORT_LIVE=NO
          OUTPUT_TRANSFER_LIVE=NO
          ERASE=NO
          WRITE=NO
          UNLOCK=NO
          FLASH_ALLOWED=NO
          GOAL=Resolve_split_ARM64_PP_references_and_recover_exact_UFE_read_frame_builder
          EOF

      - name: Install Blutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            unzip p7zip-full file binutils jq git curl \
            python3 python3-pip python3-pyelftools python3-requests \
            cmake ninja-build build-essential pkg-config \
            libicu-dev libcapstone-dev

      - name: Download and extract official Android client
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --fail --location --retry 4 --retry-all-errors \
            --connect-timeout 20 --max-time 240 \
            --user-agent "Mozilla/5.0 OKN-R99-Interop-Research" \
            --referer "https://golodsp.com/7%E9%80%9A%E9%81%93%E9%9F%B3%E9%A2%91%E5%89%8D%E7%BA%A7/" \
            --output "$OUT/downloads/android.zip" "$ANDROID_URL"

          mkdir -p "$OUT/android/pkg" "$OUT/android/raw"
          7z x -y "$OUT/downloads/android.zip" -o"$OUT/android/pkg" >/dev/null

          APK="$(
            find "$OUT/android/pkg" -type f -iname '*.apk' \
              ! -path '*/__MACOSX/*' ! -name '._*' -size +100k \
              -print | sort | head -n1
          )"
          test -n "$APK"
          unzip -t "$APK" >/dev/null
          cp "$APK" "$OUT/android/golopine.apk"
          7z x -y "$OUT/android/golopine.apk" -o"$OUT/android/raw" >/dev/null

          test -s "$OUT/android/raw/lib/arm64-v8a/libapp.so"
          test -s "$OUT/android/raw/lib/arm64-v8a/libflutter.so"

          {
            echo "APK_SIZE=$(stat -c%s "$OUT/android/golopine.apk")"
            echo "APK_TYPE=$(file -b "$OUT/android/golopine.apk")"
            sha256sum "$OUT/android/golopine.apk"
            sha256sum "$OUT/android/raw/lib/arm64-v8a/libapp.so"
            sha256sum "$OUT/android/raw/lib/arm64-v8a/libflutter.so"
          } > "$OUT/evidence/01_IDENTITY.txt"

      - name: Run Blutter
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/worawit/blutter.git "$OUT/blutter-src"
          python3 "$OUT/blutter-src/blutter.py" \
            "$OUT/android/raw/lib/arm64-v8a" \
            "$OUT/blutter/out" \
            > "$OUT/evidence/10_BLUTTER_STDOUT.txt" \
            2> "$OUT/evidence/11_BLUTTER_STDERR.txt"
          echo "BLUTTER_RC=0" > "$OUT/evidence/12_BLUTTER_STATUS.txt"

      - name: Resolve target PP objects and adjacent closures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re,json

          out=Path(os.environ["OUT"])
          pp=(out/"blutter/out/pp.txt").read_text(errors="ignore").splitlines()

          targets=[
            "Sent Device Type and software version authentication request data",
            "CurDeviceDescriptionLength=",
            "Target DeviceDescriptionLength= ",
            "Bulk receive start Length= ",
            " memoffset=",
            " sensorID=",
            "Bulk receive Length= ",
            "Bulk Receive Finished len= ",
            "On actuator data updated",
            "On sensor data updated",
            "Decode UFE JSON success!"
          ]

          rows=[]
          for i,line in enumerate(pp):
            m=re.match(r'^\[pp\+0x([0-9a-fA-F]+)\]\s+(.*)$',line)
            if not m:
              continue
            off=int(m.group(1),16)
            rest=m.group(2)
            matched=[t for t in targets if t.lower() in rest.lower()]
            if matched:
              lo=max(0,i-8); hi=min(len(pp),i+9)
              rows.append({
                "offset":off,
                "offset_hex":hex(off),
                "page":off>>12,
                "page_hex":hex(off>>12),
                "low12":off & 0xfff,
                "low12_hex":hex(off & 0xfff),
                "matched":matched,
                "object":rest,
                "neighbors":pp[lo:hi]
              })

          # Also retain known nearby closures/functions disclosed by pp.txt.
          closure_pat=re.compile(r'(?:AnonymousClosure|Closure):.*?\((0x[0-9a-fA-F]+)\)')
          nearby_closures=[]
          for r in rows:
            for line in r["neighbors"]:
              cm=closure_pat.search(line)
              if cm:
                nearby_closures.append({
                  "target":r["matched"],
                  "address":cm.group(1).lower(),
                  "line":line
                })

          # Known anchors from R98/R97 PP table.
          for addr in ("0x25177c4","0x2546d8c","0x2515070"):
            nearby_closures.append({
              "target":["known_anchor"],
              "address":addr,
              "line":"known_from_previous_evidence"
            })

          # de-dup
          seen=set(); uniq=[]
          for x in nearby_closures:
            k=x["address"]
            if k not in seen:
              seen.add(k); uniq.append(x)

          ev=out/"evidence"
          (ev/"20_TARGET_PP_OBJECTS.json").write_text(
            json.dumps(rows,indent=2,ensure_ascii=False)+"\n")
          (ev/"21_NEARBY_FUNCTION_ADDRESSES.json").write_text(
            json.dumps(uniq,indent=2,ensure_ascii=False)+"\n")
          print("targets",len(rows),"function_addresses",len(uniq))
          PY

      - name: Reconstruct split ARM64 PP references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re,json,shutil

          out=Path(os.environ["OUT"])
          ev=out/"evidence"
          asmroot=out/"blutter/out/asm"
          targets=json.loads((ev/"20_TARGET_PP_OBJECTS.json").read_text())

          # Typical Dart ARM64 access for large PP offset:
          #   add xN, PP, #0xc, lsl #12
          #   ldr xM, [xN, #0xf30]
          add_re=re.compile(
            r'\badd\s+x(?P<reg>\d+),\s*PP,\s*#(?P<page>0x[0-9a-fA-F]+|\d+),\s*lsl\s*#12',
            re.I
          )
          mem_re_tpl=r'\[(?:x{reg}),\s*#(?P<imm>-?(?:0x[0-9a-fA-F]+|\d+))\]'
          direct_re=re.compile(r'\[PP,\s*#(?P<imm>0x[0-9a-fA-F]+|\d+)\]',re.I)

          xrefs=[]
          selected=set()

          for p in asmroot.rglob("*.dart"):
            try: lines=p.read_text(errors="ignore").splitlines()
            except Exception: continue

            for i,line in enumerate(lines):
              # Direct PP references.
              for dm in direct_re.finditer(line):
                imm=int(dm.group("imm"),0)
                for t in targets:
                  if imm==t["offset"]:
                    lo=max(0,i-220); hi=min(len(lines),i+380)
                    xrefs.append({
                      "target":t,
                      "mode":"direct",
                      "path":str(p.relative_to(out)),
                      "line":i+1,
                      "match_lines":[line],
                      "context":"\n".join(lines[lo:hi])
                    })
                    selected.add(p)

              am=add_re.search(line)
              if not am:
                continue
              reg=am.group("reg")
              page=int(am.group("page"),0)
              mre=re.compile(mem_re_tpl.format(reg=reg),re.I)

              for j in range(i+1,min(len(lines),i+14)):
                mm=mre.search(lines[j])
                if not mm:
                  continue
                low=int(mm.group("imm"),0)
                effective=(page<<12)+low
                for t in targets:
                  if effective==t["offset"]:
                    lo=max(0,i-220); hi=min(len(lines),j+380)
                    xrefs.append({
                      "target":t,
                      "mode":"split_add_mem",
                      "path":str(p.relative_to(out)),
                      "line":i+1,
                      "match_lines":[line,lines[j]],
                      "effective":hex(effective),
                      "context":"\n".join(lines[lo:hi])
                    })
                    selected.add(p)

          # De-duplicate exact xrefs.
          dedup=[]
          seen=set()
          for x in xrefs:
            k=(x["target"]["offset"],x["path"],x["line"],x["mode"])
            if k in seen: continue
            seen.add(k); dedup.append(x)

          (ev/"30_SPLIT_PP_XREFS.json").write_text(
            json.dumps(dedup,indent=2,ensure_ascii=False)+"\n")

          sel=out/"review/selected-asm"
          sel.mkdir(parents=True,exist_ok=True)
          for p in selected:
            shutil.copy2(p,sel/p.name)

          (ev/"31_SELECTED_ASM_FILES.txt").write_text(
            "\n".join(sorted(str(p.relative_to(out)) for p in selected))+"\n")

          print("split_pp_xrefs",len(dedup))
          print("selected_asm_files",len(selected))
          PY

      - name: Locate exact known classes and function addresses
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re,json,shutil

          out=Path(os.environ["OUT"])
          ev=out/"evidence"
          asmroot=out/"blutter/out/asm"
          addr_rows=json.loads((ev/"21_NEARBY_FUNCTION_ADDRESSES.json").read_text())
          addresses={x["address"].lower() for x in addr_rows}

          class_names={"aLe","MKe","Bs","tr"}
          hits=[]
          selected=set()

          for p in asmroot.rglob("*.dart"):
            try: txt=p.read_text(errors="ignore")
            except Exception: continue
            lines=txt.splitlines()
            low=txt.lower()

            # Exact address anchors.
            for addr in addresses:
              pos=low.find(addr.lower())
              while pos>=0:
                line_no=txt.count("\n",0,pos)
                lo=max(0,line_no-180); hi=min(len(lines),line_no+420)
                hits.append({
                  "kind":"address",
                  "needle":addr,
                  "path":str(p.relative_to(out)),
                  "line":line_no+1,
                  "context":"\n".join(lines[lo:hi])
                })
                selected.add(p)
                pos=low.find(addr.lower(),pos+1)

            # Blutter obfuscated class/function anchors.
            for cls in class_names:
              pats=[
                rf'\bclass\s+{re.escape(cls)}\b',
                rf'\b{re.escape(cls)}\s+[A-Za-z_$][\w$]*\s*\(',
              ]
              for pat in pats:
                for m in re.finditer(pat,txt):
                  line_no=txt.count("\n",0,m.start())
                  lo=max(0,line_no-80); hi=min(len(lines),line_no+500)
                  hits.append({
                    "kind":"symbol",
                    "needle":cls,
                    "path":str(p.relative_to(out)),
                    "line":line_no+1,
                    "context":"\n".join(lines[lo:hi])
                  })
                  selected.add(p)

          (ev/"32_SYMBOL_ADDRESS_HITS.json").write_text(
            json.dumps(hits,indent=2,ensure_ascii=False)+"\n")

          sel=out/"review/anchor-asm"
          sel.mkdir(parents=True,exist_ok=True)
          for p in selected:
            shutil.copy2(p,sel/p.name)

          print("symbol_address_hits",len(hits))
          print("anchor_files",len(selected))
          PY

      - name: Extract function-local read-frame evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re,json

          out=Path(os.environ["OUT"])
          ev=out/"evidence"
          xrefs=json.loads((ev/"30_SPLIT_PP_XREFS.json").read_text())
          anchors=json.loads((ev/"32_SYMBOL_ADDRESS_HITS.json").read_text())

          command_ids={
            0x58:"READ_SENSOR",
            0x61:"READ_SENSOR_FIFO",
            0x63:"READ_SENSOR_BULK",
            0x60:"RESPONSE_READ_SENSOR",
            0x62:"RESPONSE_FIFO",
            0x64:"RESPONSE_BULK",
            0x82:"CONTINUE_BULK",
          }
          # Dart Smi often stores integer value shifted left by one.
          smi_ids={k<<1:v+"_SMI" for k,v in command_ids.items()}

          rows=[]
          for source in xrefs+anchors:
            ctx=source.get("context","")
            lines=ctx.splitlines()

            constants=[]
            stores=[]
            loads=[]
            calls=[]
            terms=[]

            for line in lines:
              l=line.lower()

              # Only count immediate constants in value-producing instructions,
              # not stack offsets or class field offsets.
              m=re.search(
                r'\b(?:movz|movn|mov|orr)\s+[xw]\d+,\s*(?:xzr,\s*)?#(0x[0-9a-f]+|\d+)',
                l
              )
              if m:
                v=int(m.group(1),0)
                if v in command_ids:
                  constants.append({"value":v,"meaning":command_ids[v],"line":line.strip()})
                if v in smi_ids:
                  constants.append({"value":v,"meaning":smi_ids[v],"line":line.strip()})

              if re.search(r'\b(?:strb|sturb|strh|sturh|str\s+w\d+)\b',l):
                stores.append(line.strip())
              if re.search(r'\b(?:ldrb|ldurb|ldrh|ldurh|ldr\s+w\d+)\b',l):
                loads.append(line.strip())
              if re.search(r'\bbl\s+#0x[0-9a-f]+\b',l):
                calls.append(line.strip())

              for word in ("memoffset","sensorid","bulk receive","device description",
                           "uint8","uint16","bytedata","setuint","getuint","length"):
                if word in l:
                  terms.append({"term":word,"line":line.strip()})

            rows.append({
              "source_kind":source.get("kind",source.get("mode","xref")),
              "needle":source.get("needle"),
              "target":source.get("target"),
              "path":source.get("path"),
              "line":source.get("line"),
              "command_immediates":constants[:200],
              "byte_word_stores":stores[:300],
              "byte_word_loads":loads[:300],
              "calls":calls[:300],
              "semantic_terms":terms[:300],
              "context":ctx
            })

          high=[
            r for r in rows
            if r["command_immediates"]
            and r["byte_word_stores"]
            and (
              r.get("target")
              or any(t["term"] in ("memoffset","sensorid","bulk receive") for t in r["semantic_terms"])
            )
          ]

          (ev/"40_FUNCTION_LOCAL_EVIDENCE.json").write_text(
            json.dumps(rows,indent=2,ensure_ascii=False)+"\n")
          (ev/"41_HIGH_CONFIDENCE_FRAME_BUILDERS.json").write_text(
            json.dumps(high,indent=2,ensure_ascii=False)+"\n")

          print("function_local_windows",len(rows))
          print("high_confidence_frame_builders",len(high))
          PY

      - name: Produce conservative R99 verdict
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json

          out=Path(os.environ["OUT"])
          ev=out/"evidence"

          def load(name):
            p=ev/name
            return json.loads(p.read_text(errors="ignore")) if p.exists() else []

          xrefs=load("30_SPLIT_PP_XREFS.json")
          anchors=load("32_SYMBOL_ADDRESS_HITS.json")
          high=load("41_HIGH_CONFIDENCE_FRAME_BUILDERS.json")

          exact=bool(high)

          verdict={
            "split_pp_xrefs":len(xrefs),
            "symbol_or_address_hits":len(anchors),
            "high_confidence_frame_builders":len(high),
            "read_command_ids_proven":True,
            "exact_read_frame_layout_proven":exact,
            "full_flash_readback_proven":False,
            "live_board_commands_allowed":False,
            "reason":"Even if a read frame builder is recovered, full flash access remains unproven until the sensor/address namespace is shown to map to firmware flash and the response path is bounded/non-destructive."
          }
          (ev/"50_R99_VERDICT.json").write_text(
            json.dumps(verdict,indent=2,ensure_ascii=False)+"\n")

          lines=[
            "OKN R99 ARM64 PP-XREF UFE FRAME MINER",
            "OFFLINE_ONLY=true",
            f"SPLIT_PP_XREFS={len(xrefs)}",
            f"SYMBOL_OR_ADDRESS_HITS={len(anchors)}",
            f"HIGH_CONFIDENCE_FRAME_BUILDERS={len(high)}",
            "READ_COMMAND_IDS_PROVEN=true",
            f"EXACT_READ_FRAME_LAYOUT_PROVEN={str(exact).lower()}",
            "FULL_FLASH_READBACK_PROVEN=false",
            "LIVE_BOARD_COMMANDS_ALLOWED=false",
          ]
          (ev/"51_R99_SUMMARY.txt").write_text("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY

      - name: Build compact evidence artifact
        shell: bash
        run: |
          set -euo pipefail
          cp -a "$OUT/evidence/." "$OUT/review/"

          cat > "$OUT/review/99_SAFETY_ATTESTATION.txt" <<'EOF'
          OFFLINE_STATIC_ONLY=true
          BOARD_USB_ACCESSED=false
          HOST_TO_DEVICE_COMMANDS_SENT=false
          HID_SET_REPORT_LIVE=false
          FLASH_ERASE_WRITE=false
          FULL_FLASH_READBACK_PROVEN=false
          EOF

          (
            cd "$OUT/review"
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          ) > "$OUT/review/SHA256SUMS.txt"

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo "## OKN R99 ARM64 PP-XREF UFE Frame Miner"
            echo
            echo "- Offline/static only."
            echo "- Reconstructs split ARM64 PP addressing rather than matching raw numbers."
            echo "- No board USB access and no host-to-device packet."
            echo
            for f in \
              "$OUT/evidence/12_BLUTTER_STATUS.txt" \
              "$OUT/evidence/51_R99_SUMMARY.txt"; do
              if [ -f "$f" ]; then
                echo "### $(basename "$f")"
                echo '```text'
                cat "$f"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload R99 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R99-ARM64-PP-XREF-UFE-FRAME-EVIDENCE
          path: /tmp/okn-r99/review
          if-no-files-found: error
          retention-days: 30
