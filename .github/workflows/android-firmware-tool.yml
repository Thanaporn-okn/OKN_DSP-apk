      - name: Audit live USB code for read-only behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re

          root = Path('/tmp/okn-android-firmware-tool')
          src = root / 'app/src/main/java/com/okn/bp1048p4r81'
          engine = (src / 'UsbCaptureEngine.java').read_text(errors='ignore')
          facts = (src / 'ProtocolFacts.java').read_text(errors='ignore')
          main = (src / 'MainActivity.java').read_text(errors='ignore')
          locked = (src / 'NoProvenReadbackStrategy.java').read_text(errors='ignore')
          all_java = '\n'.join(p.read_text(errors='ignore') for p in sorted(src.glob('*.java')))

          required = [
              'captureReadOnlySnapshot', 'getRawDescriptors', 'UsbProtocolClassifier',
              'FirmwareAnalyzer', 'HexViewer', 'NO_PROVEN_FULL_FLASH_READBACK_R90'
          ]
          missing = [x for x in required if x not in all_java]
          if missing:
              raise SystemExit('missing required read-only feature(s): ' + repr(missing))

          # Fail closed on USB APIs that can transmit arbitrary payloads.
          api_forbidden = ['bulkTransfer(', 'UsbRequest', 'queue(', 'requestWait(']
          bad_api = [x for x in api_forbidden if x in engine]
          if bad_api:
              raise SystemExit('forbidden live USB primitive(s): ' + repr(bad_api))

          if re.search(r'claimInterface\s*\([^,]+,\s*true\s*\)', engine):
              raise SystemExit('force-detach claimInterface(..., true) is forbidden')

          # Every explicit controlTransfer call must use one of the two device-to-host request types.
          lines = engine.splitlines()
          calls = []
          for i, line in enumerate(lines):
              if 'controlTransfer(' not in line:
                  continue
              frag = ' '.join(lines[i:i+9])
              calls.append(frag)
              if ('ProtocolFacts.HID_GET_DESCRIPTOR_BM' not in frag and
                  'ProtocolFacts.HID_INPUT_GET_REPORT_BM' not in frag):
                  raise SystemExit('non-whitelisted controlTransfer: ' + frag)
          if len(calls) < 4:
              raise SystemExit('expected passive control-transfer read callsites not found')

          for name, value in [('HID_GET_DESCRIPTOR_BM', '0x81'), ('HID_INPUT_GET_REPORT_BM', '0xA1')]:
              if not re.search(r'\b' + re.escape(name) + r'\s*=\s*' + value + r'\s*;', facts, re.I):
                  raise SystemExit(name + ' must remain device-to-host: ' + value)

          if not re.search(r'boolean\s+isProven\s*\(\s*\)\s*\{\s*return\s+false\s*;', locked, re.S):
              raise SystemExit('full firmware readback lock is not fail-closed')
          if 'BACKUP FULL FIRMWARE — LOCKED' not in main:
              raise SystemExit('locked full-backup UI gate missing')

          rows = []
          for p in sorted(root.rglob('*')):
              if not p.is_file() or '/build/' in str(p) or '/ci-output/' in str(p):
                  continue
              rows.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root)}")
          (root / 'ci-output/evidence/SOURCE_SHA256SUMS.txt').write_text('\n'.join(rows) + '\n')

          result = {
              'control_transfer_calls': len(calls),
              'allowed_control_directions': ['0x81 GET_DESCRIPTOR IN', '0xA1 HID class IN'],
              'bulk_transfer_present': False,
              'forced_interface_detach_present': False,
              'hid_set_report_allowed': False,
              'vendor_out_allowed': False,
              'erase_allowed': False,
              'flash_write_allowed': False,
              'unlock_allowed': False,
              'full_flash_readback_proven': False,
              'gate': 'PASS'
          }
          (root / 'ci-output/evidence/01_USB_READ_ONLY_AUDIT.json').write_text(json.dumps(result, indent=2) + '\n')
          print('USB_READ_ONLY_AUDIT=PASS', json.dumps(result))
          PY

      - name: Pin BP1048P4 SDK and collect bounded static evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/okn-bp1048-sdk
          git clone -q "$SDK_REPO" /tmp/okn-bp1048-sdk
          git -C /tmp/okn-bp1048-sdk checkout -q "$SDK_COMMIT"
          test "$(git -C /tmp/okn-bp1048-sdk rev-parse HEAD)" = "$SDK_COMMIT"

          python3 - <<'PY'
          from pathlib import Path
          import json, os, re

          root = Path('/tmp/okn-bp1048-sdk')
          out = Path('/tmp/okn-android-firmware-tool/ci-output/evidence')
          keys = [
              'SpiFlashRead', 'SpiFlashReadWpr', 'SpiFlashWrite', 'SpiFlashErase',
              'FlashChipErase', 'FlashSectorErase', 'btupdat', 'Communication_Effect_0x11',
              'MV_UserWriteData', 'HID', 'USB', 'flashboot', 'upgrade'
          ]
          allowed_ext = {'.c','.h','.s','.S','.ld','.txt','.md','.ini','.cfg','.mk','.cmake'}
          hits = []
          files = 0
          for p in sorted(root.rglob('*')):
              if not p.is_file() or p.suffix not in allowed_ext:
                  continue
              try:
                  if p.stat().st_size > 2_000_000:
                      continue
                  text = p.read_text(errors='ignore')
              except Exception:
                  continue
              files += 1
              for n, line in enumerate(text.splitlines(), 1):
                  found = [k for k in keys if k.lower() in line.lower()]
                  if found:
                      hits.append({'path': str(p.relative_to(root)), 'line': n, 'keywords': found, 'text': line[:400]})
                  if len(hits) >= 3000:
                      break
              if len(hits) >= 3000:
                  break

          result = {
              'sdk_repo': os.environ['SDK_REPO'],
              'sdk_commit': os.environ['SDK_COMMIT'],
              'source_files_scanned': files,
              'keyword_hits_capped_at_3000': len(hits),
              'offline_static_only': True,
              'proves_generic_full_flash_readback': False,
              'note': 'Internal flash-read symbols do not by themselves prove a host-visible arbitrary readback command.'
          }
          (out / '02_SDK_STATIC_SUMMARY.json').write_text(json.dumps(result, indent=2) + '\n')
          (out / '03_SDK_STATIC_HITS.json').write_text(json.dumps(hits, indent=2, ensure_ascii=False) + '\n')
          print(json.dumps(result, indent=2))
          PY

      - name: Verify R89 BP1048P4 reference layout and MVA rule offline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('/tmp/okn-bp1048-sdk')
          out=Path('/tmp/okn-android-firmware-tool/ci-output/evidence')
          flash=(root/'BT_Audio_APP/bt_audio_app_src/inc/flash_config.h').read_text(errors='ignore')
          boot=(root/'BT_Audio_APP/bt_audio_app_src/inc/flash_boot.h').read_text(errors='ignore')
          obex=(root/'BT_Audio_APP/bt_audio_app_src/apps/bt_obex_upgrade.c').read_text(errors='ignore')
          upgrade=(root/'BT_Audio_APP/bt_audio_app_src/device/upgrade.c').read_text(errors='ignore')
          assertions={
            'bp1048p4_branch':'#ifdef CFG_CHIP_BP1048P4' in flash,
            'staging_offset_0x100000':'FLASH_MVA_UPDATE_START_OFFSET 0x100000' in obex,
            'crc_poly_0x1021':'0x1021' in obex,
            'crc_initial_zero':'uint16_t Crc16 = 0' in obex,
            'crc_excludes_last4':'MvaFileTotalSize - 4' in obex,
            'trailer_bytes_2_3_zero':'Tmp[2] | Tmp[3]' in obex,
            'dual_bank_apply':'ROM_BankBUpgradeApply(1, FLASH_MVA_UPDATE_START_OFFSET)' in obex,
            'flash_boot_enabled':'#define FLASH_BOOT_EN      1' in boot,
            'mva_header_errors':'MVA_HEADER_ERR' in upgrade and 'MVA_MAGIC_ERR' in upgrade,
          }
          if not all(assertions.values()): raise SystemExit('R89 reference assertion changed: '+repr(assertions))
          result={
            'sdk_commit':'8105bd864b04995d81c9f9ae77cb158259f39015',
            'reference_only':True,
            'layout':{
              'CODE_ADDR':'0x000000','CONST_DATA_ADDR':'0x198000','AUDIO_EFFECT_ADDR':'0x3C8000',
              'FLASHFS_ADDR':'0x3D0000','USER_DATA_ADDR':'0x3F0000','BP_DATA_ADDR':'0x3F3000',
              'BT_DATA_ADDR':'0x3FB000','USER_CONFIG_ADDR':'0x3FE000','BT_CONFIG_ADDR':'0x3FF000'},
            'mva_staging_offset':'0x100000',
            'mva_crc':{'poly':'0x1021','init':'0x0000','coverage':'all bytes except final 4','trailer':'CRC_LO CRC_HI 00 00'},
            'assertions':assertions,
            'production_exact_layout_proven':False,
            'production_full_flash_readback_proven':False,
            'flash_allowed':False
          }
          (out/'04_R89_REFERENCE_FACTS.json').write_text(json.dumps(result,indent=2)+'\n')
          print('R89_REFERENCE_VERIFY=PASS')
          PY

      - name: Inventory repository firmware/update candidates offline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, math, re

          repo = Path('.')
          out = Path('/tmp/okn-android-firmware-tool/ci-output/evidence')
          exts = {'.mva','.bin','.img','.fw','.rom','.ota','.dfu','.upd','.adx','.hex','.elf'}
          skip = {'.git','.gradle','build','ci-output'}

          def entropy(b):
              if not b: return 0.0
              counts = [0] * 256
              for x in b: counts[x] += 1
              return round(-sum((n/len(b))*math.log2(n/len(b)) for n in counts if n), 5)

          items = []
          for p in sorted(repo.rglob('*')):
              if not p.is_file() or p.suffix.lower() not in exts or any(x in skip for x in p.parts):
                  continue
              h = hashlib.sha256()
              sample = b''
              size = p.stat().st_size
              with p.open('rb') as f:
                  while True:
                      chunk = f.read(1024 * 1024)
                      if not chunk: break
                      h.update(chunk)
                      if len(sample) < 1024 * 1024:
                          sample += chunk[:1024 * 1024 - len(sample)]
              strings = [m.group().decode('ascii','replace') for m in list(re.finditer(rb'[ -~]{5,120}', sample))[:60]]
              items.append({
                  'path': str(p.relative_to(repo)), 'size': size, 'sha256': h.hexdigest(),
                  'sample_entropy': entropy(sample), 'first64_hex': sample[:64].hex().upper(),
                  'ascii_strings_sample': strings
              })

          result = {
              'candidate_count': len(items),
              'candidates': items,
              'filename_or_magic_alone_proves_safe_readback': False,
              'full_flash_readback_proven': False
          }
          (out / '05_REPO_FIRMWARE_CANDIDATES.json').write_text(json.dumps(result, indent=2, ensure_ascii=False) + '\n')
          print(json.dumps({'candidate_count': len(items), 'full_flash_readback_proven': False}))
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Accept licenses non-interactively and verify SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --version
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1
          set -o pipefail
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:testDebugUnitTest 2>&1 | tee ci-output/logs/unit-tests.log

      - name: Run Android lint
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:lintDebug 2>&1 | tee ci-output/logs/lint.log
          find app/build/reports -maxdepth 3 -type f -print -exec cp --parents '{}' ci-output/reports/ \; 2>/dev/null || true

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug 2>&1 | tee ci-output/logs/assemble-debug.log
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" ci-output/OKN_DSP_Firmware_Tool_R90-debug.apk
          sha256sum ci-output/OKN_DSP_Firmware_Tool_R90-debug.apk | tee ci-output/OKN_DSP_Firmware_Tool_R90-debug.apk.sha256
          zip -9 -r ci-output/OKN_DSP_Firmware_Tool_R90-source.zip \
            settings.gradle build.gradle gradle.properties app README.md KNOWN_PROTOCOL.md STATUS.txt \
            -x 'app/build/*' '.gradle/*' 'ci-output/*' >/dev/null
          sha256sum ci-output/OKN_DSP_Firmware_Tool_R90-source.zip | tee ci-output/OKN_DSP_Firmware_Tool_R90-source.zip.sha256

      - name: Publish summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo '# OKN Android Firmware Tool R90'
            echo
            echo '- Target path: Samsung Galaxy S25+ -> USB-C -> DSP board USB-C only'
            echo '- Live mode: USB inspection + standard descriptor reads + bounded proven HID device-to-host GET_REPORT only'
            echo '- Protocol discovery: interface/endpoint classification for HID, CDC, DFU/application-specific, Mass Storage, Vendor Specific, Bulk/Interrupt/etc.'
            echo '- Offline tools: firmware SHA-256/header hints/entropy/strings + R89 MVA CRC/reference-layout check + Hex Viewer + evidence ZIP'
            echo '- Reference SDK layout/MVA rules: **included as offline hints only**'
            echo '- Full arbitrary firmware readback: **LOCKED / NOT PROVEN**'
            echo '- Erase/write/unlock/vendor OUT/HID SET_REPORT: **NOT IMPLEMENTED**'
            echo
            if [ -s "$PROJECT_DIR/ci-output/OKN_DSP_Firmware_Tool_R90-debug.apk.sha256" ]; then
              cat "$PROJECT_DIR/ci-output/OKN_DSP_Firmware_Tool_R90-debug.apk.sha256"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK logs reports and evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: OKN-ANDROID-FIRMWARE-TOOL-R90
          path: /tmp/okn-android-firmware-tool/ci-output/**
          if-no-files-found: warn
          retention-days: 30

  cleanup-old-workflows:
    name: Keep only android-firmware-tool.yml
    needs: build-test-package
    if: ${{ needs.build-test-package.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout main for one-time workflow cleanup
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Remove superseded R82-R89 workflow files and push safely
        shell: bash
        run: |
          set -euo pipefail
          keep='.github/workflows/android-firmware-tool.yml'
          test -s "$keep"
          old=(
            '.github/workflows/OKN_BP1048P4_R82_AUTO_RUN_FIRMWARE_FORENSICS_S25_USB_C_ONLY.yml'
            '.github/workflows/OKN_BP1048P4_R83_AUTO_RUN_FIRMWARE_FORENSICS_S25_USB_C_ONLY.yml'
            '.github/workflows/OKN_BP1048P4_R84_AUTO_RUN_HOST_VISIBLE_FLASH_READBACK_STATIC_MAP.yml'
            '.github/workflows/OKN_BP1048P4_R85_AUTO_RUN_FLASH_READBACK_REVERSE_CALLGRAPH.yml'
            '.github/workflows/OKN_BP1048P4_R86_AUTO_RUN_R85_STATUS_RECOVERY.yml'
            '.github/workflows/OKN_BP1048P4_R87_AUTO_RUN_FAST_FLASH_READBACK_GRAPH.yml'
            '.github/workflows/OKN_BP1048P4_R88_AUTO_RUN_FIRMWARE_LAYOUT_CONTAINER_MAP.yml'
            '.github/workflows/OKN_BP1048P4_R89_AUTO_RUN_MVA_CONTAINER_DUALBANK_SPEC.yml'
          )
          for f in "${old[@]}"; do
            [ ! -e "$f" ] || rm -f "$f"
          done
          git add -A .github/workflows
          if git diff --cached --quiet; then
            echo 'No superseded workflow files remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep only android-firmware-tool workflow [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

