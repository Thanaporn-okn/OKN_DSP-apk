name: OKN R101 Flutter UFE Reverse Callgraph Miner OFFLINE ONLY

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/android-firmware-tool.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: okn-r101-ufe-reverse-callgraph-${{ github.ref }}
  cancel-in-progress: true

env:
  OUT: /tmp/okn-r101
  ANDROID_URL: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-01.apk_.zip"
  LIVE_BOARD_USB: "NO"
  HOST_TO_DEVICE_USB: "NO"
  FLASH_ERASE_WRITE: "NO"
  FLASH_ALLOWED: "NO"

jobs:
  mine:
    name: Reverse callers/callees around Flutter UFE parser / STATIC ONLY
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fail-closed offline-only scope gate
        shell: bash
        run: |
          set -euo pipefail
          test "$LIVE_BOARD_USB" = "NO"
          test "$HOST_TO_DEVICE_USB" = "NO"
          test "$FLASH_ERASE_WRITE" = "NO"
          test "$FLASH_ALLOWED" = "NO"

          rm -rf "$OUT"
          mkdir -p "$OUT"/{downloads,android,blutter,evidence,review}

          cat > "$OUT/evidence/00_SCOPE.txt" <<'EOF'
          REVISION=R101
          MODE=OFFLINE_STATIC_ONLY
          TARGET=GoloPine_DSTech_BP1048P4
          KNOWN_USB=6324:1719
          KNOWN_HID_USAGE=FF00:55AA
          KNOWN_RESPONSE_PARSER=0x266c0dc
          KNOWN_HIDDEN_HELPER_1=0x2517708
          KNOWN_HIDDEN_HELPER_2=0x25c2234
          KNOWN_HIDDEN_HELPER_3=0x2545420
          KNOWN_HIDDEN_HELPER_4=0x25465f0
          BOARD_USB_ACCESS=NO
          LIVE_USB_COMMANDS=NO
          HOST_TO_DEVICE_USB=NO
          SET_REPORT_LIVE=NO
          OUTPUT_TRANSFER_LIVE=NO
          ERASE=NO
          WRITE=NO
          UNLOCK=NO
          FLASH_ALLOWED=NO
          GOAL=Recover_request_builder_and_transport_path_by_reverse_callgraph_from_official_Flutter_AOT
          EOF

      - name: Install static-analysis dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            unzip p7zip-full file binutils jq git curl \
            python3 python3-pip python3-pyelftools python3-requests \
            cmake ninja-build build-essential pkg-config \
            libicu-dev libcapstone-dev
          python3 -m pip install --break-system-packages --quiet capstone pyelftools

      - name: Download and extract official Android client
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --fail --location --retry 4 --retry-all-errors \
            --connect-timeout 20 --max-time 240 \
            --user-agent "Mozilla/5.0 OKN-R101-Interop-Research" \
            --referer "https://golodsp.com/7%E9%80%9A%E9%81%93%E9%9F%B3%E9%A2%91%E5%89%8D%E7%BA%A7/" \
            --output "$OUT/downloads/android.zip" "$ANDROID_URL"

          mkdir -p "$OUT/android/pkg" "$OUT/android/raw"
          7z x -y "$OUT/downloads/android.zip" -o"$OUT/android/pkg" >/dev/null

          APK="$(
            find "$OUT/android/pkg" -type f -iname '*.apk' \
              ! -path '*/__MACOSX/*' ! -name '._*' -size +100k \
              -print | sort | head -n1
          )"
          test -n "$APK"
          unzip -t "$APK" >/dev/null
          cp "$APK" "$OUT/android/golopine.apk"
          7z x -y "$OUT/android/golopine.apk" -o"$OUT/android/raw" >/dev/null

          test -s "$OUT/android/raw/lib/arm64-v8a/libapp.so"
          test -s "$OUT/android/raw/lib/arm64-v8a/libflutter.so"

          {
            echo "APK_SIZE=$(stat -c%s "$OUT/android/golopine.apk")"
            echo "LIBAPP_SIZE=$(stat -c%s "$OUT/android/raw/lib/arm64-v8a/libapp.so")"
            sha256sum "$OUT/android/golopine.apk"
            sha256sum "$OUT/android/raw/lib/arm64-v8a/libapp.so"
          } > "$OUT/evidence/01_IDENTITY.txt"

      - name: Run Blutter
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/worawit/blutter.git "$OUT/blutter-src"
          python3 "$OUT/blutter-src/blutter.py" \
            "$OUT/android/raw/lib/arm64-v8a" \
            "$OUT/blutter/out" \
            > "$OUT/evidence/10_BLUTTER_STDOUT.txt" \
            2> "$OUT/evidence/11_BLUTTER_STDERR.txt"
          echo "BLUTTER_RC=0" > "$OUT/evidence/12_BLUTTER_STATUS.txt"

      - name: Build Blutter function index and retain protocol classes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re,json,shutil

          out=Path(os.environ["OUT"])
          asm=out/"blutter/out/asm"
          ev=out/"evidence"

          rows=[]
          pat=re.compile(r'// \*\* addr: 0x([0-9a-fA-F]+), size: ([^\s]+)')
          for p in asm.rglob("*.dart"):
            try: lines=p.read_text(errors="ignore").splitlines()
            except Exception: continue
            for i,line in enumerate(lines):
              m=pat.search(line)
              if not m: continue
              decl=""
              for j in range(i-1,max(-1,i-8),-1):
                if "(" in lines[j] and "{" in lines[j]:
                  decl=lines[j].strip()
                  break
              try: sz=int(m.group(2),0)
              except: sz=None
              rows.append({
                "addr":int(m.group(1),16),
                "addr_hex":"0x"+m.group(1).lower(),
                "size":sz,
                "size_raw":m.group(2),
                "path":str(p.relative_to(out)),
                "line":i+1,
                "decl":decl
              })
          rows.sort(key=lambda x:x["addr"])
          (ev/"20_FUNCTION_INDEX.json").write_text(
              json.dumps(rows,indent=2,ensure_ascii=False)+"\n")

          # Keep full assembly for the two obfuscated protocol classes only.
          keep=out/"review/protocol-classes"
          keep.mkdir(parents=True,exist_ok=True)
          for name in ("aLe.dart","MKe.dart"):
            p=asm/name
            if p.exists():
              shutil.copy2(p,keep/name)

          print("function_count",len(rows))
          PY

      - name: Scan Blutter assembly for direct references to protocol anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re,json

          out=Path(os.environ["OUT"])
          asm=out/"blutter/out/asm"
          ev=out/"evidence"

          targets={
            0x266c0dc:"RESPONSE_PARSER",
            0x2517708:"HIDDEN_HELPER_2517708",
            0x25c2234:"HIDDEN_HELPER_25c2234",
            0x2545420:"HIDDEN_HELPER_2545420",
            0x25465f0:"HIDDEN_HELPER_25465f0",
            0x25177c4:"ALE_BYTEDATA_CLOSURE",
            0x2546d8c:"MKE_PR_CLOSURE",
          }

          refs=[]
          for p in asm.rglob("*.dart"):
            try: lines=p.read_text(errors="ignore").splitlines()
            except Exception: continue
            rel=str(p.relative_to(out))
            for i,line in enumerate(lines):
              low=line.lower()
              for addr,label in targets.items():
                needle=f"0x{addr:x}"
                if needle not in low:
                  continue
                lo=max(0,i-50); hi=min(len(lines),i+90)
                refs.append({
                  "target":hex(addr),
                  "label":label,
                  "path":rel,
                  "line":i+1,
                  "matched_line":line.strip(),
                  "context":"\n".join(lines[lo:hi])
                })

          (ev/"21_BLUTTER_TEXT_XREFS.json").write_text(
              json.dumps(refs,indent=2,ensure_ascii=False)+"\n")
          print("blutter_text_xrefs",len(refs))
          PY

      - name: Build raw ARM64 direct-call graph for libapp
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json,bisect
          from elftools.elf.elffile import ELFFile
          from capstone import Cs, CS_ARCH_ARM64, CS_MODE_LITTLE_ENDIAN
          from capstone.arm64 import ARM64_OP_IMM

          out=Path(os.environ["OUT"])
          ev=out/"evidence"
          lib=out/"android/raw/lib/arm64-v8a/libapp.so"
          index=json.loads((ev/"20_FUNCTION_INDEX.json").read_text())
          starts=sorted(r["addr"] for r in index)
          by={r["addr"]:r for r in index}

          def owner(addr):
            i=bisect.bisect_right(starts,addr)-1
            if i<0: return None
            s=starts[i]
            # Avoid attributing across implausibly huge gaps.
            if addr-s>0x10000:
              return None
            return by[s]

          md=Cs(CS_ARCH_ARM64,CS_MODE_LITTLE_ENDIAN)
          md.detail=True

          edges=[]
          with lib.open("rb") as f:
            elf=ELFFile(f)
            for seg in elf.iter_segments():
              if seg["p_type"]!="PT_LOAD":
                continue
              flags=int(seg["p_flags"])
              # PF_X
              if not (flags & 1):
                continue
              data=seg.data()
              base=int(seg["p_vaddr"])
              for ins in md.disasm(data,base):
                if ins.mnemonic!="bl" or not ins.operands:
                  continue
                op=ins.operands[0]
                if op.type!=ARM64_OP_IMM:
                  continue
                target=int(op.imm)
                own=owner(ins.address)
                edges.append({
                  "callsite":ins.address,
                  "callsite_hex":hex(ins.address),
                  "target":target,
                  "target_hex":hex(target),
                  "caller":own,
                  "callee":by.get(target)
                })

          (ev/"30_RAW_CALL_EDGES.json").write_text(
              json.dumps(edges,indent=2,ensure_ascii=False)+"\n")
          print("direct_bl_edges",len(edges))
          PY

      - name: Extract reverse callers and callees around UFE parser/helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json,collections

          out=Path(os.environ["OUT"])
          ev=out/"evidence"
          edges=json.loads((ev/"30_RAW_CALL_EDGES.json").read_text())

          seed={
            0x266c0dc:"RESPONSE_PARSER",
            0x2517708:"HIDDEN_HELPER_2517708",
            0x25c2234:"HIDDEN_HELPER_25c2234",
            0x2545420:"HIDDEN_HELPER_2545420",
            0x25465f0:"HIDDEN_HELPER_25465f0",
          }

          rev=collections.defaultdict(list)
          fwd=collections.defaultdict(list)
          for e in edges:
            rev[e["target"]].append(e)
            if e.get("caller"):
              fwd[e["caller"]["addr"]].append(e)

          rows=[]
          interesting_funcs=set(seed)
          for addr,label in seed.items():
            callers=rev.get(addr,[])
            rows.append({
              "seed":hex(addr),
              "label":label,
              "callers":callers[:1000],
            })
            for e in callers:
              c=e.get("caller")
              if c:
                interesting_funcs.add(c["addr"])
                # one more level outward
                for up in rev.get(c["addr"],[]):
                  if up.get("caller"):
                    interesting_funcs.add(up["caller"]["addr"])

            for e in fwd.get(addr,[]):
              interesting_funcs.add(e["target"])

          # Add direct callees of all discovered callers.
          expanded=set(interesting_funcs)
          for a in list(interesting_funcs):
            for e in fwd.get(a,[]):
              expanded.add(e["target"])
          interesting_funcs=expanded

          (ev/"31_REVERSE_CALLERS.json").write_text(
              json.dumps(rows,indent=2,ensure_ascii=False)+"\n")
          (ev/"32_INTERESTING_FUNCTION_ADDRS.json").write_text(
              json.dumps(
                [{"addr":a,"addr_hex":hex(a)} for a in sorted(interesting_funcs)],
                indent=2
              )+"\n")
          print("interesting_function_addrs",len(interesting_funcs))
          PY

      - name: Raw-disassemble discovered callgraph nodes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json,bisect
          from elftools.elf.elffile import ELFFile
          from capstone import Cs, CS_ARCH_ARM64, CS_MODE_LITTLE_ENDIAN
          from capstone.arm64 import ARM64_OP_IMM

          out=Path(os.environ["OUT"])
          ev=out/"evidence"
          lib=out/"android/raw/lib/arm64-v8a/libapp.so"
          index=json.loads((ev/"20_FUNCTION_INDEX.json").read_text())
          wanted=json.loads((ev/"32_INTERESTING_FUNCTION_ADDRS.json").read_text())

          by={r["addr"]:r for r in index}
          starts=sorted(by)

          md=Cs(CS_ARCH_ARM64,CS_MODE_LITTLE_ENDIAN)
          md.detail=True

          with lib.open("rb") as f:
            elf=ELFFile(f)
            segs=[]
            for seg in elf.iter_segments():
              if seg["p_type"]=="PT_LOAD":
                segs.append({
                  "vaddr":int(seg["p_vaddr"]),
                  "filesz":int(seg["p_filesz"]),
                  "offset":int(seg["p_offset"]),
                })

            def readva(addr,size):
              for s in segs:
                if s["vaddr"]<=addr<s["vaddr"]+s["filesz"]:
                  n=min(size,s["vaddr"]+s["filesz"]-addr)
                  f.seek(s["offset"]+(addr-s["vaddr"]))
                  return f.read(n)
              return b""

            def next_start(addr):
              i=bisect.bisect_right(starts,addr)
              return starts[i] if i<len(starts) else None

            rows=[]
            for w in wanted:
              addr=w["addr"]
              ns=next_start(addr)
              # If exact Blutter function is known, use next start as bound.
              # For hidden targets use a conservative 0x800 window.
              if addr in by and ns and 4<=ns-addr<=0x3000:
                size=ns-addr
              else:
                size=0x800
              data=readva(addr,size)
              insns=[]
              calls=[]
              stores=[]
              loads=[]
              immediates=[]
              for ins in md.disasm(data,addr):
                text=f"{ins.mnemonic} {ins.op_str}".strip()
                row={"address":hex(ins.address),"text":text}
                if ins.mnemonic=="bl" and ins.operands and ins.operands[0].type==ARM64_OP_IMM:
                  t=int(ins.operands[0].imm)
                  c={"at":hex(ins.address),"target":hex(t),"symbol":by.get(t)}
                  calls.append(c); row["call"]=c
                if ins.mnemonic in ("strb","sturb","strh","sturh","str","stur","stp"):
                  stores.append({"at":hex(ins.address),"text":text})
                if ins.mnemonic in ("ldrb","ldurb","ldrh","ldurh","ldr","ldur","ldp"):
                  loads.append({"at":hex(ins.address),"text":text})
                if ins.mnemonic in ("mov","movz","movk","orr","add","sub"):
                  for op in ins.operands:
                    if op.type==ARM64_OP_IMM:
                      v=int(op.imm)
                      if v <= 0x10000:
                        immediates.append({
                          "at":hex(ins.address),
                          "value":v,
                          "hex":hex(v),
                          "text":text
                        })
                insns.append(row)

              rows.append({
                "addr":hex(addr),
                "symbol":by.get(addr),
                "size":size,
                "raw_hex":data[:512].hex().upper(),
                "calls":calls[:500],
                "stores":stores[:500],
                "loads":loads[:500],
                "small_immediates":immediates[:1000],
                "instructions":insns[:5000],
              })

          (ev/"40_CALLGRAPH_NODE_DISASSEMBLY.json").write_text(
              json.dumps(rows,indent=2,ensure_ascii=False)+"\n")
          print("nodes_disassembled",len(rows))
          PY

      - name: Rank likely request-builder and transport nodes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json,re

          out=Path(os.environ["OUT"])
          ev=out/"evidence"
          nodes=json.loads((ev/"40_CALLGRAPH_NODE_DISASSEMBLY.json").read_text())
          textrefs=json.loads((ev/"21_BLUTTER_TEXT_XREFS.json").read_text())

          # Known UFE command values and tagged Smi forms.
          values={
            0x58:"READ_SENSOR",
            0x61:"READ_FIFO",
            0x63:"READ_BULK",
            0x82:"CONTINUE_BULK",
            0xB0:"READ_SENSOR_SMI",
            0xC2:"READ_FIFO_SMI",
            0xC6:"READ_BULK_SMI",
            0x104:"CONTINUE_BULK_SMI",
          }

          ranked=[]
          for n in nodes:
            score=0
            reasons=[]
            matched=[]
            for im in n.get("small_immediates",[]):
              v=im["value"]
              if v in values:
                matched.append({"meaning":values[v],**im})
                score+=5
            if len(n.get("stores",[]))>=2:
              score+=2; reasons.append("multiple_stores")
            if n.get("calls"):
              score+=1; reasons.append("has_calls")
            sym=n.get("symbol") or {}
            blob=json.dumps(sym,ensure_ascii=False).lower()
            if any(k in blob for k in ("byte","data","usb","hid","sensor","bulk","fifo")):
              score+=3; reasons.append("symbol_semantic_hint")

            ranked.append({
              "addr":n["addr"],
              "symbol":n.get("symbol"),
              "score":score,
              "reasons":reasons,
              "matched_command_immediates":matched,
              "store_count":len(n.get("stores",[])),
              "call_count":len(n.get("calls",[])),
              "calls":n.get("calls",[])[:100],
              "stores":n.get("stores",[])[:100],
            })

          ranked.sort(key=lambda x:(-x["score"],x["addr"]))
          strong=[r for r in ranked if r["score"]>=6]

          (ev/"50_RANKED_CALLGRAPH_NODES.json").write_text(
              json.dumps(ranked,indent=2,ensure_ascii=False)+"\n")
          (ev/"51_STRONG_REQUEST_BUILDER_CANDIDATES.json").write_text(
              json.dumps(strong,indent=2,ensure_ascii=False)+"\n")

          verdict={
            "blutter_text_xrefs":len(textrefs),
            "callgraph_nodes":len(nodes),
            "strong_request_builder_candidates":len(strong),
            "read_command_ids_proven":True,
            "exact_read_frame_layout_proven":False,
            "full_flash_readback_proven":False,
            "live_board_commands_allowed":False,
            "reason":"Reverse callgraph narrows request/transport candidates, but no packet is promoted until command semantics and byte layout are tied to the same official-client function."
          }
          (ev/"52_R101_VERDICT.json").write_text(
              json.dumps(verdict,indent=2,ensure_ascii=False)+"\n")

          summary=[
            "OKN R101 FLUTTER UFE REVERSE CALLGRAPH MINER",
            "OFFLINE_ONLY=true",
            f"BLUTTER_TEXT_XREFS={len(textrefs)}",
            f"CALLGRAPH_NODES={len(nodes)}",
            f"STRONG_REQUEST_BUILDER_CANDIDATES={len(strong)}",
            "READ_COMMAND_IDS_PROVEN=true",
            "EXACT_READ_FRAME_LAYOUT_PROVEN=false",
            "FULL_FLASH_READBACK_PROVEN=false",
            "LIVE_BOARD_COMMANDS_ALLOWED=false",
          ]
          (ev/"53_R101_SUMMARY.txt").write_text("\n".join(summary)+"\n")
          print("\n".join(summary))
          PY

      - name: Build compact evidence artifact
        shell: bash
        run: |
          set -euo pipefail
          cp -a "$OUT/evidence/." "$OUT/review/"

          cat > "$OUT/review/99_SAFETY_ATTESTATION.txt" <<'EOF'
          OFFLINE_STATIC_ONLY=true
          BOARD_USB_ACCESSED=false
          HOST_TO_DEVICE_COMMANDS_SENT=false
          HID_SET_REPORT_LIVE=false
          FLASH_ERASE_WRITE=false
          FULL_FLASH_READBACK_PROVEN=false
          EOF

          (
            cd "$OUT/review"
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          ) > "$OUT/review/SHA256SUMS.txt"

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo "## OKN R101 Flutter UFE Reverse Callgraph Miner"
            echo
            echo "- Offline/static analysis only."
            echo "- Reverse-calls from the proven response parser and hidden helpers."
            echo "- No board USB access and no host-to-device packet."
            echo
            for f in \
              "$OUT/evidence/12_BLUTTER_STATUS.txt" \
              "$OUT/evidence/53_R101_SUMMARY.txt"; do
              if [ -f "$f" ]; then
                echo "### $(basename "$f")"
                echo '```text'
                cat "$f"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload R101 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R101-FLUTTER-UFE-REVERSE-CALLGRAPH-EVIDENCE
          path: /tmp/okn-r101/review
          if-no-files-found: error
          retention-days: 30
