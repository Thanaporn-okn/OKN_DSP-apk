name: Build OKN DSP V68 Unified Verified Live EQ Write Migration

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_ANDROID_V68_UNIFIED_VERIFIED_LIVE_EQ_WRITE_MIGRATION.zip'
      - '.github/workflows/build-okn-dsp-v68.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify V68 source
        shell: bash
        run: |
          set -euo pipefail
          echo '02595f372c1c48e1301040954f2e19e9bf22db4adb2d250b2487178a6d69ebe2  OKN_DSP_ANDROID_V68_UNIFIED_VERIFIED_LIVE_EQ_WRITE_MIGRATION.zip' | sha256sum -c -
          rm -rf /tmp/okn_v68
          mkdir -p /tmp/okn_v68
          unzip -q OKN_DSP_ANDROID_V68_UNIFIED_VERIFIED_LIVE_EQ_WRITE_MIGRATION.zip -d /tmp/okn_v68

          check_file() { test -f "$1" || { echo "ERROR missing $1"; exit 1; }; echo "OK file: $1"; }
          check_text() { grep -Fq "$1" "$2" || { echo "ERROR missing marker '$1' in $2"; exit 1; }; echo "OK marker: $1"; }

          MAIN=/tmp/okn_v68/app/src/main/java/com/okn/dsp/MainActivity.kt
          UNIFIED=/tmp/okn_v68/app/src/main/java/com/okn/dsp/UnifiedControlActivity.kt
          SCALAR=/tmp/okn_v68/app/src/main/java/com/okn/dsp/ScalarControlActivity.kt
          LIVE=/tmp/okn_v68/app/src/main/java/com/okn/dsp/LiveEqActivity.kt
          SAVEPOL=/tmp/okn_v68/app/src/main/java/com/okn/dsp/protocol/SaveParamsPolicy.kt
          EQPOL=/tmp/okn_v68/app/src/main/java/com/okn/dsp/protocol/LiveEqPolicy.kt
          EQCODEC=/tmp/okn_v68/app/src/main/java/com/okn/dsp/protocol/EqBandCodec.kt
          SCALARPOL=/tmp/okn_v68/app/src/main/java/com/okn/dsp/protocol/VerifiedScalarControls.kt
          GATE=/tmp/okn_v68/app/src/main/java/com/okn/dsp/protocol/WriteGate.kt
          GRADLE=/tmp/okn_v68/app/build.gradle.kts
          MANIFEST=/tmp/okn_v68/app/src/main/AndroidManifest.xml
          V67CAP=/tmp/okn_v68/evidence/OKN_DSP_V67_UNIFIED_GLOBAL_WRITE_RUNTIME_SUCCESS_CAPTURE.txt

          for f in "$MAIN" "$UNIFIED" "$SCALAR" "$LIVE" "$SAVEPOL" "$EQPOL" "$EQCODEC" "$SCALARPOL" "$GATE" "$GRADLE" "$MANIFEST" "$V67CAP"; do check_file "$f"; done
          check_file /tmp/okn_v68/README_V68.txt
          check_file /tmp/okn_v68/evidence/OKN_DSP_V68_UNIFIED_VERIFIED_LIVE_EQ_WRITE_MIGRATION_PLAN.txt
          check_file /tmp/okn_v68/evidence/OKN_DSP_V68_UNIFIED_VERIFIED_LIVE_EQ_WRITE_MIGRATION_PLAN.json

          # V68 identity.
          check_text 'versionCode = 68' "$GRADLE"
          check_text '4.9.0-v68-unified-verified-live-eq-write-migration' "$GRADLE"
          check_text 'OKN DSP V68 — PRODUCTION VERIFIED CONTROL HUB' "$MAIN"
          check_text 'UNIFIED V68 • VERIFIED GLOBAL + SAFE-PEAKING EQ WRITES • SENSORS READ ONLY' "$MAIN"
          check_text 'UnifiedControlActivity::class.java' "$MAIN"
          check_text '.UnifiedControlActivity' "$MANIFEST"

          # Exact seven-scalar allow-list. Generic writes must remain locked.
          check_text 'const val enabled: Boolean = false' "$GATE"
          check_text 'const val unifiedVerifiedScalarWritesEnabled: Boolean = true' "$GATE"
          check_text 'const val unifiedVerifiedEqWritesEnabled: Boolean = true' "$GATE"
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('/tmp/okn_v68/app/src/main/java/com/okn/dsp/protocol/VerifiedScalarControls.kt').read_text()
          ids=[int(x) for x in re.findall(r'VerifiedScalarControl\((\d+),', s)]
          assert ids == [2,3,8,9,10,13,11], ids
          print('OK: scalar allow-list exactly [2,3,8,9,10,13,11]')
          PY

          # V67 runtime-qualified base evidence is embedded byte-for-byte.
          echo '81da058e93f5c4a469dfb7e9fb10f7a18311f2aacd9a4cedfec33fe36fb50fe8  '"$V67CAP" | sha256sum -c -
          check_text 'V67_UNIFIED_TARGET_DESCRIPTOR_VERIFY id=9 expected=118.3 actual=118.3 verified=true' "$V67CAP"
          check_text 'V67_UNIFIED_TARGET_DESCRIPTOR_VERIFY id=9 expected=117.3 actual=117.3 verified=true' "$V67CAP"
          check_text 'V67_UNIFIED_PERSISTENT_SAVE_COMPLETE' "$V67CAP"

          # Existing separately-qualified production paths/policies must not regress.
          echo '01f6aca6f2131bd41ca4fd1d674d879cade425ccc7ddef77e63718e8e124ffed  '"$SCALAR" | sha256sum -c -
          echo '3240ca56c81b7960098ae9fb6ea7421d32e74b11e42810ce4c5b71b35d7ab8d0  '"$LIVE" | sha256sum -c -
          echo '88005dba77d2b84597f5bd5e23eaaacec7d25b59dc0f38b8affbde2d2cfbeb85  '"$SAVEPOL" | sha256sum -c -
          echo 'cfb046aa09acaf8429176a9b99e988ea06347f3daeea988b7c118d056400d2bc  '"$EQPOL" | sha256sum -c -
          echo '4f033a406e363b2418af9b39fa2e42a13674b09f9de2bb7acf1eb6ff1918cd58  '"$EQCODEC" | sha256sum -c -

          # V68 keeps the complete V67 scalar pipeline.
          check_text 'WRITE_PREFLIGHT' "$UNIFIED"
          check_text 'VERIFY_TARGET' "$UNIFIED"
          check_text 'VERIFY_RESTORE' "$UNIFIED"
          check_text 'V68_UNIFIED_SCALAR_PREFLIGHT_START' "$UNIFIED"
          check_text 'V68_UNIFIED_SCALAR_PREFLIGHT_OK' "$UNIFIED"
          check_text 'UfeCodec.encodeFloat32Write(id, target)' "$UNIFIED"
          check_text 'PendingGattPurpose.SCALAR_TARGET' "$UNIFIED"
          check_text 'V68_UNIFIED_TARGET_DESCRIPTOR_VERIFY' "$UNIFIED"
          check_text 'UfeCodec.encodeFloat32Write(id, original)' "$UNIFIED"
          check_text 'PendingGattPurpose.SCALAR_RESTORE' "$UNIFIED"
          check_text 'V68_UNIFIED_RESTORE_DESCRIPTOR_VERIFY' "$UNIFIED"
          check_text 'RESTORE VERIFY FAILED — STOP CONTROL • DO NOT SAVE' "$UNIFIED"

          # V68 Phase 2: safe LIVE EQ migration only.
          check_text 'EQ_WRITE_PREFLIGHT' "$UNIFIED"
          check_text 'EQ_VERIFY_TARGET' "$UNIFIED"
          check_text 'EQ_VERIFY_RESTORE' "$UNIFIED"
          check_text 'V68_UNIFIED_EQ_PREFLIGHT_START' "$UNIFIED"
          check_text 'V68_UNIFIED_EQ_PREFLIGHT_OK' "$UNIFIED"
          check_text 'LiveEqPolicy.isWritable(original)' "$UNIFIED"
          check_text 'LiveEqPolicy.encodeWrite(ch, band1, target)' "$UNIFIED"
          check_text 'V68_UNIFIED_EQ_WRITE_PLAIN=' "$UNIFIED"
          check_text 'payloadBytes=48' "$UNIFIED"
          check_text 'PendingGattPurpose.EQ_TARGET' "$UNIFIED"
          check_text 'V68_UNIFIED_EQ_TARGET_DESCRIPTOR_VERIFY' "$UNIFIED"
          check_text 'LiveEqPolicy.encodeRestore(ch, band1, original)' "$UNIFIED"
          check_text 'V68_UNIFIED_EQ_FAILSAFE_RESTORE_PLAIN=' "$UNIFIED"
          check_text 'PendingGattPurpose.EQ_RESTORE' "$UNIFIED"
          check_text 'V68_UNIFIED_EQ_RESTORE_DESCRIPTOR_VERIFY' "$UNIFIED"
          check_text 'EQ RESTORE VERIFY FAILED — STOP CONTROL • DO NOT SAVE' "$UNIFIED"
          check_text 'eqTargetVerifyDelayMs = 3000L' "$UNIFIED"
          check_text 'eqRestoreVerifyDelayMs = 3000L' "$UNIFIED"
          check_text 'val writable = LiveEqPolicy.isWritable(b)' "$UNIFIED"
          check_text 'LOCKED • non-standard/unsafe EQ shape • V68 ไม่ส่ง write' "$UNIFIED"
          check_text 'b.type == EqBandCodec.PEAKING_TYPE' "$EQPOL"
          check_text 'EqBandCodec.encode(previous)' "$EQPOL"

          # Same-session refresh, complete read coverage and sensor read-only policy remain intact.
          check_text 'REFRESH ALL • SAME SESSION' "$UNIFIED"
          check_text 'REFRESHING #$refreshCount • PLEASE WAIT' "$UNIFIED"
          check_text 'V68_UNIFIED_REFRESH_TAP' "$UNIFIED"
          check_text 'V68_UNIFIED_REFRESH_COMPLETE' "$UNIFIED"
          check_text 'NO VALUE CHANGES • refresh สำเร็จ แต่ DSP ส่งค่าชุดเดิม' "$UNIFIED"
          check_text 'scalarChanged=$scalarChanged' "$UNIFIED"
          check_text 'eqChanged=$eqChanged' "$UNIFIED"
          check_text 'sensorChanged=$sensorChanged' "$UNIFIED"
          check_text 'sameSession=true' "$UNIFIED"
          check_text 'expectedScalars=7' "$UNIFIED"
          check_text 'expectedEqBands=105' "$UNIFIED"
          check_text 'expectedSensors=4' "$UNIFIED"
          check_text 'sensorReadOnly=true' "$UNIFIED"
          check_text 'genericWrites=false' "$UNIFIED"

          # Manual guarded SaveParams only. No auto-save or direct ID7 writer.
          check_text 'SaveParamsPolicy.encodeTrigger()' "$UNIFIED"
          check_text '570000000700000000' "$UNIFIED"
          check_text 'V68_UNIFIED_SAVEPARAMS_TRIGGER_PLAIN=' "$UNIFIED"
          check_text 'V68_UNIFIED_PERSISTENT_SAVE_COMPLETE' "$UNIFIED"
          check_text 'DO NOT RETRY' "$UNIFIED"
          check_text 'UfeCodec.encodeWrite(ACTUATOR_ID, 0, byteArrayOf())' "$SAVEPOL"
          check_text '570000000700000000' "$SAVEPOL"

          # Queue failure must stop/re-auth rather than continue on an uncertain TX stream.
          check_text 'V68_UNIFIED_TX_STREAM_UNCERTAIN' "$UNIFIED"
          check_text 'STOP_REAUTH' "$UNIFIED"
          check_text 'STOP_NO_RETRY' "$UNIFIED"

          python3 - <<'PY'
          from pathlib import Path
          u=Path('/tmp/okn_v68/app/src/main/java/com/okn/dsp/UnifiedControlActivity.kt').read_text()
          assert u.count('UfeCodec.encodeFloat32Write') == 2, u.count('UfeCodec.encodeFloat32Write')
          assert u.count('LiveEqPolicy.encodeWrite') == 1, u.count('LiveEqPolicy.encodeWrite')
          assert u.count('LiveEqPolicy.encodeRestore') == 1, u.count('LiveEqPolicy.encodeRestore')
          assert u.count('SaveParamsPolicy.encodeTrigger()') == 1, u.count('SaveParamsPolicy.encodeTrigger()')
          assert 'EqBandCodec.encode' not in u
          assert 'UfeCodec.encodeWrite(' not in u
          assert 'LiveEqPolicy.isWritable(original)' in u
          assert 'val writable = LiveEqPolicy.isWritable(b)' in u
          assert 'sensorReadOnly=true' in u
          assert 'genericWrites=false' in u
          print('OK: Unified writer surface is exactly 2 scalar encoders + 1 EQ target + 1 EQ restore + 1 centralized SaveParams trigger')
          PY

          if grep -R -n -F 'UfeCodec.encodeWrite(7' /tmp/okn_v68/app/src/main/java/com/okn/dsp | grep -v 'SaveParamsPolicy.kt'; then
            echo 'ERROR: direct SaveParams ID7 write exists outside SaveParamsPolicy'
            exit 1
          fi

          echo 'OK: V68 static preflight passed'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/okn_v68
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and package artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn_v68/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          mkdir -p artifact
          cp "$APK" artifact/OKN_DSP_V68_UNIFIED_VERIFIED_LIVE_EQ_WRITE_MIGRATION-debug.apk
          cp /tmp/okn_v68/README_V68.txt artifact/
          cp /tmp/okn_v68/evidence/OKN_DSP_V68_UNIFIED_VERIFIED_LIVE_EQ_WRITE_MIGRATION_PLAN.txt artifact/
          cp /tmp/okn_v68/evidence/OKN_DSP_V68_UNIFIED_VERIFIED_LIVE_EQ_WRITE_MIGRATION_PLAN.json artifact/
          sha256sum artifact/OKN_DSP_V68_UNIFIED_VERIFIED_LIVE_EQ_WRITE_MIGRATION-debug.apk > artifact/OKN_DSP_V68_UNIFIED_VERIFIED_LIVE_EQ_WRITE_MIGRATION-debug.sha256
          ls -lh artifact

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-V68-UNIFIED-VERIFIED-LIVE-EQ-WRITE-MIGRATION-debug-apk
          path: artifact/
          if-no-files-found: error
          retention-days: 30
