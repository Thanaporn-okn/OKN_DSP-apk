name: R146 N9 data-aware static stream position ciphertext slice audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R146_N9_DATA_AWARE_STATIC_STREAM_POSITION_CIPHERTEXT_SLICE_AUDIT.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r146-n9-data-aware-static-${{ github.ref }}
  cancel-in-progress: true

env:
  FLASH_ALLOWED: "NO"
  R145_RUN_ID: "36004169630"
  R145_JOB_ID: "107647946960"
  R145_ARTIFACT_ID: "10810086100"
  R145_ARTIFACT_NAME: "R145-EXACT-OFFICIAL-WINDOWS-KEYIV-VALIDATION-FRAMING-STATIC-EVIDENCE"
  R145_ARTIFACT_DIGEST: "sha256:0e19fc3735d6bd5fec14b7086b3f6c94c35c39594ebacadb2652e1caf9e55567"
  H15_RESOURCE_NAME: "h15IL2i6yy2BZV8RqM.YuRwd1JALC4oy32W66"

jobs:
  static_trace:
    name: STATIC ONLY - N9 data-aware BinaryReader stream trace - no execution - no USB - no board
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r146/r145 /tmp/r146/evidence
          cat > /tmp/r146/evidence/R146_SAFETY.txt <<'EOF'
          R146_MODE=OFFLINE_STATIC_N9_DATA_AWARE_STREAM_TRACE_ONLY
          R146_VENDOR_BINARY_EXECUTED=NO
          R146_WINDOWS_EXE_EXECUTED=NO
          R146_DLL_EXECUTED=NO
          R146_APK_EXECUTED=NO
          R146_USB_DEVICE_ACCESS=NO
          R146_BOARD_CONTACT=NO
          R146_AA55_SENT=NO
          R146_LINEIN_AA55_SENT=NO
          R146_RUNTIME_0X11_SENT=NO
          R146_RUNTIME_0XFE_SENT=NO
          R146_FLASHBOOT_COMMAND_SENT=NO
          R146_FLASH_READ_EXECUTED=NO
          R146_FLASH_ERASE_EXECUTED=NO
          R146_FLASH_WRITE_EXECUTED=NO
          R146_ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD=NO
          R146_REFERENCE_EVIDENCE_IS_NOT_PRODUCTION_PROOF=YES
          HARDWARE_MODIFICATION=FORBIDDEN
          FLASH_ALLOWED=NO
          EOF

      - name: Download pinned R145 evidence
        uses: actions/download-artifact@v4
        with:
          name: R145-EXACT-OFFICIAL-WINDOWS-KEYIV-VALIDATION-FRAMING-STATIC-EVIDENCE
          path: /tmp/r146/r145
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 36004169630

      - name: Verify and extract pinned R145 evidence
        shell: bash
        run: |
          set -euo pipefail
          OUTER="$(find /tmp/r146/r145 -maxdepth 2 -type f -name 'R145_EXACT_OFFICIAL_WINDOWS_KEYIV_VALIDATION_FRAMING_STATIC_EVIDENCE.zip' -print -quit)"
          test -n "$OUTER"
          sha256sum "$OUTER" > /tmp/r146/evidence/R146_R145_INNER_ZIP.sha256
          unzip -q "$OUTER" -d /tmp/r146/evidence/r145
          test -s /tmp/r146/evidence/r145/R145_DECISION.json
          test -s /tmp/r146/evidence/r145/r144/R144_PE32_CONCRETE_KEYIV_PATH.json
          test -s /tmp/r146/evidence/r145/r144/r143/R143_N9_METHOD.il
          test -s /tmp/r146/evidence/r145/r144/r143/r142/r141/r140/R140_FIXED_FULL.il
          test -s /tmp/r146/evidence/r145/r144/r143/r142/R142_EXTRACTED_MANAGED_RESOURCES/02_h15IL2i6yy2BZV8RqM.YuRwd1JALC4oy32W66.bin
          grep -F '"R144_VALIDATOR_FALSE_NEGATIVE_CONFIRMED": true' /tmp/r146/evidence/r145/R145_DECISION.json
          grep -F '"PE32_CREATEDECRYPTOR_KEYIV_STATICALLY_RECOVERED": true' /tmp/r146/evidence/r145/R145_DECISION.json
          grep -F '"H15_PLAINTEXT_RECOVERED": false' /tmp/r146/evidence/r145/R145_DECISION.json
          grep -F '"FLASH_ALLOWED": false' /tmp/r146/evidence/r145/R145_DECISION.json

      - name: Prove BinaryReader wrapper semantics statically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,json,hashlib
          ev=Path('/tmp/r146/evidence')
          full=(ev/'r145/r144/r143/r142/r141/r140/R140_FIXED_FULL.il').read_text(errors='replace')

          facts={
            'custom_reader_ctor_uses_BinaryReader': bool(re.search(
              r'Y7Uor8e58M9K22QZF7H::\.ctor.*?BinaryReader::\.ctor\(class \[mscorlib\]System\.IO\.Stream\)',
              full, re.S)),
            'FtHelxtJIP_is_ReadBytes': bool(re.search(
              r'Y7Uor8e58M9K22QZF7H::FtHelxtJIP.*?BinaryReader::ReadBytes\(int32\)',
              full, re.S)),
            'sXXetjyGMH_is_ReadInt32': bool(re.search(
              r'Y7Uor8e58M9K22QZF7H::sXXetjyGMH.*?BinaryReader::ReadInt32\(\)',
              full, re.S)),
            'sW_wrapper_reaches_FtHelxtJIP': bool(re.search(
              r'sWg0PuN2fLSfxi2LB0D.*?Y7Uor8e58M9K22QZF7H::FtHelxtJIP\(int32\)',
              full, re.S)),
            'qf_wrapper_reaches_sXXetjyGMH': bool(re.search(
              r'qfkv4ZNDynVciIciQy6.*?Y7Uor8e58M9K22QZF7H::sXXetjyGMH\(\)',
              full, re.S)),
            'crypto_write_is_Stream_Write': bool(re.search(
              r'RMHoOvNN1BGBrZfKGy1.*?Stream::Write\(uint8\[\], int32, int32\)',
              full, re.S)),
            'crypto_finalize_is_FlushFinalBlock': bool(re.search(
              r'it3eekNKjtbEQVI5up2.*?CryptoStream::FlushFinalBlock\(\)',
              full, re.S)),
            'crypto_output_is_MemoryStream_ToArray': bool(re.search(
              r'HVJrNANRJZcM7WNOuLw.*?MemoryStream::ToArray\(\)',
              full, re.S)),
          }
          out={'facts':facts,'all_required_reader_facts':all(facts[k] for k in [
            'custom_reader_ctor_uses_BinaryReader','FtHelxtJIP_is_ReadBytes',
            'sXXetjyGMH_is_ReadInt32','sW_wrapper_reaches_FtHelxtJIP',
            'qf_wrapper_reaches_sXXetjyGMH'])}
          (ev/'R146_READER_WRAPPER_PROOF.json').write_text(json.dumps(out,indent=2)+'\n')
          if not out['all_required_reader_facts']:
              raise SystemExit('required BinaryReader wrapper semantics not proven')
          PY

      - name: Data-aware static execution over pinned N9 path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re,struct,hashlib

          ev=Path('/tmp/r146/evidence')
          n9=(ev/'r145/r144/r143/R143_N9_METHOD.il').read_text(errors='replace')
          r144=json.loads((ev/'r145/r144/R144_PE32_CONCRETE_KEYIV_PATH.json').read_text())
          h15=(ev/'r145/r144/r143/r142/R142_EXTRACTED_MANAGED_RESOURCES/02_h15IL2i6yy2BZV8RqM.YuRwd1JALC4oy32W66.bin').read_bytes()

          # R144 already established a concrete PE32 flattened-state path to the
          # CreateDecryptor state. R146 reuses that pinned path; it does not
          # invent new opaque-predicate outcomes.
          labels=r144.get('path_labels') or []
          states=r144.get('path_states') or []
          if not labels or len(labels)!=len(states):
              raise SystemExit('pinned R144 path missing/inconsistent')

          # Split N9 into IL label blocks.
          matches=list(re.finditer(r'(?m)^\s*(IL_[0-9a-fA-F]{4}):',n9))
          blocks={}
          for i,m in enumerate(matches):
              end=matches[i+1].start() if i+1<len(matches) else len(n9)
              blocks[m.group(1)]=n9[m.start():end]

          scalar={}
          arrays={}
          reader_pos=0
          reader_created=False
          trace=[]
          unresolved=[]
          crypto_seen=False
          crypto_step=None

          def eval_const_expr(lines):
              # Small fail-closed evaluator for integer expressions emitted by
              # this obfuscator. Unknown input => None, never guessed.
              st=[]
              for s in lines:
                  s=s.strip()
                  m=re.search(r':\s+(.*)$',s)
                  op=m.group(1) if m else s
                  if re.fullmatch(r'ldc\.i4\.m1',op): st.append(-1)
                  elif re.fullmatch(r'ldc\.i4\.[0-8]',op): st.append(int(op[-1]))
                  elif (x:=re.fullmatch(r'ldc\.i4(?:\.s)?\s+(-?\d+)',op)): st.append(int(x.group(1)))
                  elif (x:=re.fullmatch(r'ldloc(?:\.s)?\s+(\d+)',op)):
                      st.append(scalar.get(int(x.group(1))))
                  elif op=='add':
                      if len(st)<2 or st[-1] is None or st[-2] is None: st.append(None)
                      else: b=st.pop(); a=st.pop(); st.append(a+b)
                  elif op=='sub':
                      if len(st)<2 or st[-1] is None or st[-2] is None: st.append(None)
                      else: b=st.pop(); a=st.pop(); st.append(a-b)
                  elif op=='mul':
                      if len(st)<2 or st[-1] is None or st[-2] is None: st.append(None)
                      else: b=st.pop(); a=st.pop(); st.append(a*b)
              return st[-1] if st else None

          for step,(state,label) in enumerate(zip(states,labels)):
              b=blocks.get(label,'')
              lines=b.splitlines()

              # Track simple scalar assignments.
              for i,line in enumerate(lines):
                  sm=re.search(r'\bstloc(?:\.s)?\s+(\d+)',line)
                  if sm:
                      v=eval_const_expr(lines[max(0,i-6):i])
                      if v is not None:
                          scalar[int(sm.group(1))]=v

              # Resource reader construction resets position to start of exact
              # extracted CLR resource payload (the 4-byte CLR manifest length
              # prefix is outside GetManifestResourceStream()).
              if '::gH6uphNOsYQyRXDZmHu(' in b and 'newobj instance void Q9Wet0jLP4YxXSyJBiC.q71r2Rj8SiD9GF1BI50/Y7Uor8e58M9K22QZF7H::.ctor' in b:
                  reader_created=True
                  reader_pos=0
                  trace.append({'step':step,'state':state,'label':label,'op':'reader_create','position_after':reader_pos})

              # Exact ReadInt32 wrapper call. It consumes four bytes.
              if '::qfkv4ZNDynVciIciQy6(' in b:
                  if not reader_created or reader_pos+4>len(h15):
                      unresolved.append({'step':step,'state':state,'label':label,'reason':'ReadInt32 without provable in-range reader position'})
                  else:
                      raw=h15[reader_pos:reader_pos+4]
                      val=struct.unpack('<i',raw)[0]
                      before=reader_pos; reader_pos+=4
                      trace.append({'step':step,'state':state,'label':label,'op':'ReadInt32','position_before':before,'position_after':reader_pos,'raw_hex':raw.hex(),'value':val})

              # Exact ReadBytes wrapper. Recover count from immediate IL stack
              # expression before call. If not statically known, stop claiming
              # exact downstream position.
              if '::sWg0PuN2fLSfxi2LB0D(' in b:
                  call_i=next(i for i,x in enumerate(lines) if '::sWg0PuN2fLSfxi2LB0D(' in x)
                  count=eval_const_expr(lines[max(0,call_i-10):call_i])
                  if count is None or count<0:
                      unresolved.append({'step':step,'state':state,'label':label,'reason':'ReadBytes count unresolved'})
                  elif not reader_created or reader_pos+count>len(h15):
                      unresolved.append({'step':step,'state':state,'label':label,'reason':'ReadBytes out of range','count':count,'position':reader_pos})
                  else:
                      before=reader_pos
                      data=h15[reader_pos:reader_pos+count]
                      reader_pos+=count
                      trace.append({'step':step,'state':state,'label':label,'op':'ReadBytes','count':count,'position_before':before,'position_after':reader_pos,'sha256':hashlib.sha256(data).hexdigest()})

              if '::VnHlfpNorSGR6U9GUOp(' in b:
                  crypto_seen=True
                  crypto_step=step
                  trace.append({'step':step,'state':state,'label':label,'op':'CreateDecryptor','reader_position_at_call':reader_pos if reader_created else None})

          # Independently locate the actual CryptoStream Write input local.
          write_sites=[]
          for label,b in blocks.items():
              if '::RMHoOvNN1BGBrZfKGy1(' in b:
                  mm=re.search(r'ldloc(?:\.s)?\s+(\d+).*?ldc\.i4\.0.*?ldloc(?:\.s)?\s+\1.*?ldlen.*?::RMHoOvNN1BGBrZfKGy1',
                               b,re.S)
                  write_sites.append({'label':label,'whole_array_local':int(mm.group(1)) if mm else None,'excerpt':b[:1800]})

          # We only authorize an offline decrypt experiment when the exact byte
          # slice fed to CryptoStream is proven and block aligned. This workflow
          # does NOT decrypt it; it only determines whether that precondition is met.
          proven_slice=None
          # A slice is accepted only if a traced ReadBytes event can be linked
          # unambiguously to the same local later passed whole to Stream.Write.
          # This first R146 tracer intentionally fails closed if local dataflow
          # is not yet fully reconstructed.
          block_aligned=False
          if proven_slice:
              block_aligned=(proven_slice['length'] % 16)==0

          out={
            'source_path':'R144 concrete PE32 path reused exactly',
            'path_state_count':len(states),
            'crypto_state_reached':crypto_seen,
            'crypto_step':crypto_step,
            'h15_length':len(h15),
            'h15_sha256':hashlib.sha256(h15).hexdigest(),
            'reader_final_position_on_traced_prefix':reader_pos if reader_created else None,
            'trace':trace,
            'unresolved':unresolved,
            'crypto_stream_write_sites':write_sites,
            'PROVEN_EXACT_CIPHERTEXT_SLICE':proven_slice,
            'PROVEN_CIPHERTEXT_BLOCK_ALIGNED':block_aligned,
            'DIRECT_AES_CBC_DECRYPTION_AUTHORIZED_BY_R146_STATIC_TRACE':bool(proven_slice and block_aligned),
            'H15_PLAINTEXT_RECOVERED':False,
            'important_interpretation':'No padding/framing is guessed. Absence of a proven slice means the next static step must reconstruct local dataflow into the CryptoStream Write buffer; it does not authorize trial decryption.'
          }
          (ev/'R146_N9_DATA_AWARE_STREAM_TRACE.json').write_text(json.dumps(out,indent=2)+'\n')
          PY

      - name: Build fail-closed R146 decision and report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          ev=Path('/tmp/r146/evidence')
          t=json.loads((ev/'R146_N9_DATA_AWARE_STREAM_TRACE.json').read_text())
          decision={
            'R145_RUN_ID':36004169630,
            'R145_ARTIFACT_ID':10810086100,
            'R145_ARTIFACT_DIGEST':'sha256:0e19fc3735d6bd5fec14b7086b3f6c94c35c39594ebacadb2652e1caf9e55567',
            'N9_CONCRETE_PE32_PATH_REUSED':True,
            'N9_PATH_STATE_COUNT':t['path_state_count'],
            'N9_CREATEDECRYPTOR_REACHED':t['crypto_state_reached'],
            'H15_LENGTH':t['h15_length'],
            'PROVEN_EXACT_CIPHERTEXT_SLICE':t['PROVEN_EXACT_CIPHERTEXT_SLICE'],
            'PROVEN_CIPHERTEXT_BLOCK_ALIGNED':t['PROVEN_CIPHERTEXT_BLOCK_ALIGNED'],
            'DIRECT_AES_CBC_DECRYPTION_AUTHORIZED_BY_STATIC_FRAMING':t['DIRECT_AES_CBC_DECRYPTION_AUTHORIZED_BY_R146_STATIC_TRACE'],
            'H15_PLAINTEXT_RECOVERED':False,
            'ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD':False,
            'AA55_LIVE_RETEST_ALLOWED':False,
            'RUNTIME_0X11_ALLOWED':False,
            'RUNTIME_0XFE_ALLOWED':False,
            'FLASH_ALLOWED':False,
          }
          if decision['DIRECT_AES_CBC_DECRYPTION_AUTHORIZED_BY_STATIC_FRAMING']:
              decision['NEXT']='Offline-only decrypt of the proven exact block-aligned ciphertext slice using the already proven PE32 key/IV, with no board/USB/vendor execution. Validate plaintext structurally before making any stronger claim.'
          else:
              decision['NEXT']='Continue static N9 local-dataflow reconstruction from BinaryReader outputs into local12 / the whole-array buffer passed to CryptoStream.Write. Prove exact source offset and length; do not guess padding/framing and do not decrypt an unproven slice.'
          (ev/'R146_DECISION.json').write_text(json.dumps(decision,indent=2)+'\n')
          (ev/'R146_REPORT_TH.md').write_text(
            '# R146 N9 data-aware static stream trace\n\n'
            f'- concrete PE32 path reused: {decision["N9_CONCRETE_PE32_PATH_REUSED"]}\n'
            f'- path states: {decision["N9_PATH_STATE_COUNT"]}\n'
            f'- CreateDecryptor reached: {decision["N9_CREATEDECRYPTOR_REACHED"]}\n'
            f'- h15 length: {decision["H15_LENGTH"]}\n'
            f'- exact ciphertext slice proven: {decision["PROVEN_EXACT_CIPHERTEXT_SLICE"] is not None}\n'
            f'- block aligned: {decision["PROVEN_CIPHERTEXT_BLOCK_ALIGNED"]}\n'
            f'- offline AES-CBC framing authorized: {decision["DIRECT_AES_CBC_DECRYPTION_AUTHORIZED_BY_STATIC_FRAMING"]}\n'
            '- H15 plaintext recovered: False\n'
            '- live/board authorization: False\n\n'
            f'NEXT: {decision["NEXT"]}\n\n'
            'FLASH_ALLOWED=NO\n')
          print(json.dumps(decision,indent=2))
          PY

      - name: Package R146 evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r146/evidence
          zip -9 -r /tmp/R146_N9_DATA_AWARE_STATIC_STREAM_POSITION_CIPHERTEXT_SLICE_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/R146_N9_DATA_AWARE_STATIC_STREAM_POSITION_CIPHERTEXT_SLICE_EVIDENCE.zip \
            > /tmp/R146_N9_DATA_AWARE_STATIC_STREAM_POSITION_CIPHERTEXT_SLICE_EVIDENCE.zip.sha256

      - name: Upload R146 evidence
        uses: actions/upload-artifact@v4
        with:
          name: R146-N9-DATA-AWARE-STATIC-STREAM-POSITION-CIPHERTEXT-SLICE-EVIDENCE
          path: |
            /tmp/R146_N9_DATA_AWARE_STATIC_STREAM_POSITION_CIPHERTEXT_SLICE_EVIDENCE.zip
            /tmp/R146_N9_DATA_AWARE_STATIC_STREAM_POSITION_CIPHERTEXT_SLICE_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'R146_VENDOR_BINARY_EXECUTED=NO' /tmp/r146/evidence/R146_SAFETY.txt
          grep -F 'R146_USB_DEVICE_ACCESS=NO' /tmp/r146/evidence/R146_SAFETY.txt
          grep -F 'R146_BOARD_CONTACT=NO' /tmp/r146/evidence/R146_SAFETY.txt
          grep -F 'R146_AA55_SENT=NO' /tmp/r146/evidence/R146_SAFETY.txt
          grep -F 'R146_RUNTIME_0X11_SENT=NO' /tmp/r146/evidence/R146_SAFETY.txt
          grep -F 'R146_RUNTIME_0XFE_SENT=NO' /tmp/r146/evidence/R146_SAFETY.txt
          grep -F '"H15_PLAINTEXT_RECOVERED": false' /tmp/r146/evidence/R146_DECISION.json
          grep -F '"ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD": false' /tmp/r146/evidence/R146_DECISION.json
          grep -F '"FLASH_ALLOWED": false' /tmp/r146/evidence/R146_DECISION.json
          echo R146_N9_DATA_AWARE_STATIC_TRACE_COMPLETE=YES
          echo FLASH_ALLOWED=NO
