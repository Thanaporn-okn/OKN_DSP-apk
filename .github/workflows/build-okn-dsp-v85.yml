name: Build OKN DSP V85 All-Status Disconnect Fail-Closed

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_ANDROID_V85_ALL_STATUS_DISCONNECT_FAIL_CLOSED.zip'
      - '.github/workflows/build-okn-dsp-v85.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify V85 source
        shell: bash
        run: |
          set -euo pipefail
          echo '7bae6c3f0446fd265b727e4eff8b2c31873ea3d8c8526ae8f78a0383b0dcb9b9  OKN_DSP_ANDROID_V85_ALL_STATUS_DISCONNECT_FAIL_CLOSED.zip' | sha256sum -c -
          rm -rf /tmp/okn_v85
          mkdir -p /tmp/okn_v85
          unzip -q OKN_DSP_ANDROID_V85_ALL_STATUS_DISCONNECT_FAIL_CLOSED.zip -d /tmp/okn_v85

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run V85 preflight and verify stable signing certificate
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/okn_v85
          python3 preflight_v85.py
          echo 'ba1c52f2607c09953c52fdd79c5f72026aaf0adb8aa44bcba277f7d9b49d9511  app/okn_dsp_stable_debug.keystore' | sha256sum -c -
          CERT=$(keytool -list -v -keystore app/okn_dsp_stable_debug.keystore -storepass android -alias androiddebugkey | awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr 'A-F' 'a-f')
          test "$CERT" = 'c3da85af2e978dbd0ed9bb695e5c79a263189595c116ad93a1ded75a2eb98397'
          echo "Stable signing certificate SHA-256: $CERT"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build stable-signed debug APK
        working-directory: /tmp/okn_v85
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK signing identity and package artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn_v85/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose "$APK"
          CERT=$($APKSIGNER verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' | tr 'A-F' 'a-f')
          test "$CERT" = 'c3da85af2e978dbd0ed9bb695e5c79a263189595c116ad93a1ded75a2eb98397'
          mkdir -p artifact
          cp "$APK" artifact/OKN_DSP_V85_ALL_STATUS_DISCONNECT_FAIL_CLOSED-debug.apk
          cp /tmp/okn_v85/README_V85.txt artifact/
          cp /tmp/okn_v85/evidence/OKN_DSP_V85_ALL_STATUS_DISCONNECT_FAIL_CLOSED_PLAN.txt artifact/
          cp /tmp/okn_v85/evidence/OKN_DSP_V85_ALL_STATUS_DISCONNECT_FAIL_CLOSED_PLAN.json artifact/
          printf '%s\n' "$CERT" > artifact/OKN_DSP_V85_APK_CERT_SHA256.txt
          sha256sum artifact/OKN_DSP_V85_ALL_STATUS_DISCONNECT_FAIL_CLOSED-debug.apk > artifact/OKN_DSP_V85_ALL_STATUS_DISCONNECT_FAIL_CLOSED-debug.sha256
          ls -lh artifact

      - name: Upload V85 artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN_DSP_V85_ALL_STATUS_DISCONNECT_FAIL_CLOSED
          path: /tmp/okn_v85/artifact/*
          if-no-files-found: error
