name: R103 BP10xx MVAssistant V1.8.11 public package static audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R103_BP10XX_MVASSISTANT_V1_8_11_STATIC_AUDIT.yml"

permissions:
  contents: read

concurrency:
  group: r103-bp10xx-mvassistant-v1-8-11-${{ github.ref }}
  cancel-in-progress: true

env:
  DRIVE_FILE_ID: 15hdF2vnnUMVtIFKhZPGLPwBSEZpyqP2H
  SOURCE_NAME: MVAssistant_BP10xx_V1.8.11.zip
  SOURCE_FORUM_URL: https://usmi.mybb.ru/viewtopic.php?id=70&p=2
  FLASH_ALLOWED: "NO"

jobs:
  static-audit:
    name: BP10xx V1.8.11 STATIC ONLY - NO EXECUTION - NO USB - NO BOARD - NO FLASH
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r103/input /tmp/r103/extract /tmp/r103/evidence
          cat > /tmp/r103/evidence/R103_SAFETY.txt <<'EOF'
          R103_MODE=STATIC_OFFLINE_ONLY
          R103_VENDOR_BINARY_EXECUTED=NO
          R103_WINE_MONO_DOTNET_TARGET_EXECUTION=NO
          R103_USB_DEVICE_ACCESS=NO
          R103_BOARD_CONTACT=NO
          R103_AA55_SENT=NO
          R103_LINEIN_AA55_SENT=NO
          R103_RUNTIME_0X11_SENT=NO
          R103_SEND_CHIPERAS_CODEDATA_BOOTDAT_CONSTDAT_CNFGDAT_BTUPDAT_UPINFO_CXXX=NO
          R103_FLASH_READ_EXECUTED=NO
          R103_FLASH_ERASE_EXECUTED=NO
          R103_FLASH_WRITE_EXECUTED=NO
          R103_ANY_DISCOVERED_PACKET_AUTHORIZED_FOR_BP1048P4=NO
          R103_REFERENCE_BP10XX_TOOL_ASSUMED_GOLOPINE_P4_COMPATIBLE=NO
          FINAL_REQUIRED_TRANSPORT=SAMSUNG_S25_PLUS_USB_C_DIRECT_TO_DSP_USB_C
          HARDWARE_MODIFICATION=FORBIDDEN
          FLASH_ALLOWED=NO
          EOF
          cat /tmp/r103/evidence/R103_SAFETY.txt

      - name: Install static-only tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            file unzip p7zip-full binutils poppler-utils antiword cabextract \
            python3-pip jq >/dev/null
          python3 -m pip install --disable-pip-version-check --no-input \
            gdown pefile olefile >/dev/null
          {
            file --version | head -n1
            7z | sed -n '1,3p'
            objdump --version | head -n1
            python3 - <<'PY'
          import pefile, olefile, gdown
          print("pefile="+getattr(pefile,"__version__","unknown"))
          print("olefile="+getattr(olefile,"__version__","unknown"))
          print("gdown="+getattr(gdown,"__version__","unknown"))
          PY
          } > /tmp/r103/evidence/R103_TOOL_VERSIONS.txt

      - name: Acquire exact public Google Drive package without execution
        shell: bash
        run: |
          set -euo pipefail
          OUT="/tmp/r103/input/$SOURCE_NAME"
          python3 -m gdown "$DRIVE_FILE_ID" -O "$OUT" \
            > /tmp/r103/evidence/R103_GDOWN_STDOUT.txt 2> /tmp/r103/evidence/R103_GDOWN_STDERR.txt || true

          if [ ! -s "$OUT" ]; then
            curl --fail --location --retry 3 --retry-all-errors \
              "https://drive.usercontent.google.com/download?id=$DRIVE_FILE_ID&export=download&confirm=t" \
              -o "$OUT"
          fi

          test -s "$OUT"
          file "$OUT" | tee /tmp/r103/evidence/R103_SOURCE_FILETYPE.txt
          stat -c 'SOURCE_SIZE=%s' "$OUT" | tee /tmp/r103/evidence/R103_SOURCE_SIZE.txt
          sha256sum "$OUT" | tee /tmp/r103/evidence/R103_SOURCE_SHA256.txt
          sha1sum "$OUT" | tee /tmp/r103/evidence/R103_SOURCE_SHA1.txt
          printf 'SOURCE_DRIVE_FILE_ID=%s\nSOURCE_FORUM_URL=%s\n' \
            "$DRIVE_FILE_ID" "$SOURCE_FORUM_URL" \
            > /tmp/r103/evidence/R103_SOURCE_PROVENANCE.txt

      - name: Safely extract top-level package
        shell: bash
        run: |
          set -euo pipefail
          PKG="/tmp/r103/input/$SOURCE_NAME"
          python3 - "$PKG" /tmp/r103/extract <<'PY'
          from pathlib import Path
          import sys, zipfile

          src=Path(sys.argv[1]); dst=Path(sys.argv[2])
          MAX_MEMBER=250*1024*1024
          MAX_TOTAL=800*1024*1024
          total=0
          with zipfile.ZipFile(src) as z:
              rows=[]
              for i in z.infolist():
                  name=i.filename.replace("\\","/")
                  rows.append(f"{i.file_size}\t{i.compress_size}\t{name}")
                  if i.file_size > MAX_MEMBER:
                      raise SystemExit(f"member too large: {name}")
                  total += i.file_size
                  if total > MAX_TOTAL:
                      raise SystemExit("archive expanded size limit exceeded")
                  target=(dst/name).resolve()
                  if not str(target).startswith(str(dst.resolve())+"/") and target != dst.resolve():
                      raise SystemExit(f"path traversal refused: {name}")
              Path("/tmp/r103/evidence/R103_TOP_ARCHIVE_MEMBERS.txt").write_text("\n".join(rows)+"\n")
              z.extractall(dst)
          print(f"EXTRACTED_TOTAL={total}")
          PY

      - name: Inventory and hash every extracted file
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r103/extract
          find . -type f -printf '%P\n' | sort > /tmp/r103/evidence/R103_FILE_LIST.txt
          find . -type f -print0 | sort -z | xargs -0 sha256sum \
            > /tmp/r103/evidence/R103_ALL_EXTRACTED_SHA256.txt
          while IFS= read -r f; do
            printf '%s\t' "$f"
            file -b "$f"
          done < /tmp/r103/evidence/R103_FILE_LIST.txt \
            > /tmp/r103/evidence/R103_FILE_TYPES.txt
          {
            echo "FILE_COUNT=$(wc -l < /tmp/r103/evidence/R103_FILE_LIST.txt)"
            echo "TOTAL_BYTES=$(find . -type f -printf '%s\n' | awk '{s+=$1} END{print s+0}')"
          } > /tmp/r103/evidence/R103_INVENTORY_SUMMARY.txt
          cat /tmp/r103/evidence/R103_INVENTORY_SUMMARY.txt

      - name: Expand nested archives and CHM-like containers statically
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r103/nested
          : > /tmp/r103/evidence/R103_NESTED_ARCHIVE_LISTINGS.txt
          : > /tmp/r103/evidence/R103_NESTED_EXTRACTION_LOG.txt

          i=0
          while IFS= read -r -d '' f; do
            case "${f,,}" in
              *.zip|*.7z|*.rar|*.cab|*.chm)
                i=$((i+1))
                echo "===== $f =====" >> /tmp/r103/evidence/R103_NESTED_ARCHIVE_LISTINGS.txt
                7z l "$f" >> /tmp/r103/evidence/R103_NESTED_ARCHIVE_LISTINGS.txt 2>&1 || true
                d="/tmp/r103/nested/$i"
                mkdir -p "$d"
                timeout 60s 7z x -y -o"$d" "$f" >> /tmp/r103/evidence/R103_NESTED_EXTRACTION_LOG.txt 2>&1 || true
                ;;
            esac
            [ "$i" -ge 30 ] && break
          done < <(find /tmp/r103/extract -type f -print0)

          find /tmp/r103/nested -type f -printf '%P\n' | sort \
            > /tmp/r103/evidence/R103_NESTED_FILE_LIST.txt || true

      - name: Extract manuals and human-readable resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r103/text
          : > /tmp/r103/evidence/R103_TEXT_EXTRACTION_LOG.txt

          n=0
          while IFS= read -r -d '' f; do
            n=$((n+1))
            out="/tmp/r103/text/$(printf '%04d' "$n").txt"
            case "${f,,}" in
              *.pdf)
                pdftotext -layout "$f" "$out" 2>>/tmp/r103/evidence/R103_TEXT_EXTRACTION_LOG.txt || true
                ;;
              *.doc)
                antiword "$f" > "$out" 2>>/tmp/r103/evidence/R103_TEXT_EXTRACTION_LOG.txt || true
                ;;
              *.txt|*.ini|*.cfg|*.conf|*.xml|*.json|*.htm|*.html|*.md|*.log)
                cp "$f" "$out" 2>>/tmp/r103/evidence/R103_TEXT_EXTRACTION_LOG.txt || true
                ;;
              *)
                continue
                ;;
            esac
            printf 'SOURCE=%s\n' "$f" | cat - "$out" > "$out.tmp" && mv "$out.tmp" "$out"
          done < <(find /tmp/r103/extract /tmp/r103/nested -type f -print0 2>/dev/null)

          cat /tmp/r103/text/*.txt 2>/dev/null > /tmp/r103/all_text.txt || true

          grep -Ein -C 3 \
            'BP1048P4|BP1048P[0-9]|BP1048B[0-9]|BP10xx|BP10|GoloPine|DSTech|MVAssistant|MV_Assisant|MVA|upgrade|update|bootloader|boot|recovery|backup|read.?back|read flash|verify|CRC|USB|HID|UART|serial|VID|PID|programmer|dongle|burn|flash|OTP|efuse|升级|烧录|引导|恢复|备份|读取|校验|串口|升级狗|烧录器' \
            /tmp/r103/all_text.txt \
            | head -n 6000 > /tmp/r103/evidence/R103_MANUAL_AND_TEXT_CONTEXT.txt || true

      - name: Static PE import resource and string audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import pefile, hashlib, json, re, subprocess

          roots=[Path("/tmp/r103/extract"),Path("/tmp/r103/nested")]
          files=[]
          for root in roots:
              if root.exists():
                  files += [p for p in root.rglob("*") if p.is_file()]

          pe_rows=[]
          import_rows=[]
          for p in files:
              try:
                  head=p.read_bytes()[:2]
              except Exception:
                  continue
              if head != b"MZ":
                  continue
              try:
                  pe=pefile.PE(str(p), fast_load=False)
              except Exception as e:
                  pe_rows.append({"path":str(p),"error":repr(e)})
                  continue
              item={
                  "path":str(p),
                  "size":p.stat().st_size,
                  "sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
                  "machine":hex(pe.FILE_HEADER.Machine),
                  "entry_rva":hex(pe.OPTIONAL_HEADER.AddressOfEntryPoint),
                  "image_base":hex(pe.OPTIONAL_HEADER.ImageBase),
                  "subsystem":pe.OPTIONAL_HEADER.Subsystem,
                  "sections":[
                      {
                          "name":s.Name.rstrip(b"\0").decode("ascii","replace"),
                          "rva":hex(s.VirtualAddress),
                          "raw":hex(s.PointerToRawData),
                          "raw_size":s.SizeOfRawData,
                          "entropy":round(s.get_entropy(),4),
                      } for s in pe.sections
                  ],
              }
              imports=[]
              if hasattr(pe,"DIRECTORY_ENTRY_IMPORT"):
                  for ent in pe.DIRECTORY_ENTRY_IMPORT:
                      dll=ent.dll.decode(errors="replace")
                      for imp in ent.imports:
                          nm=imp.name.decode(errors="replace") if imp.name else f"ord:{imp.ordinal}"
                          imports.append(f"{dll}!{nm}")
                          import_rows.append(f"{p}\t{dll}!{nm}")
              item["imports"]=imports
              item["dotnet"]=any("mscoree" in x.lower() for x in imports)
              pe_rows.append(item)

          Path("/tmp/r103/evidence/R103_PE_SUMMARY.json").write_text(
              json.dumps(pe_rows,indent=2,ensure_ascii=False)+"\n"
          )
          Path("/tmp/r103/evidence/R103_PE_IMPORTS.tsv").write_text(
              "\n".join(import_rows)+"\n"
          )
          PY

          grep -Ei \
            'hid\.dll|HidD_|HidP_|setupapi|SetupDi|winusb|libusb|CreateFile|ReadFile|WriteFile|DeviceIoControl|serial|COM[0-9]|uart|ftdi|ch34|usbser|mscoree' \
            /tmp/r103/evidence/R103_PE_IMPORTS.tsv \
            > /tmp/r103/evidence/R103_TRANSPORT_IMPORT_HITS.txt || true

          : > /tmp/r103/evidence/R103_BINARY_STRING_HITS.txt
          find /tmp/r103/extract /tmp/r103/nested -type f -size -80M -print0 2>/dev/null |
          while IFS= read -r -d '' f; do
            if file "$f" | grep -Eq 'PE32|MS-DOS|executable|shared object|data'; then
              {
                echo "===== $f ASCII ====="
                strings -a -n 4 "$f"
                echo "===== $f UTF16LE ====="
                strings -el -n 4 "$f" || true
              } | grep -Ein -C 2 \
                'BP1048P4|BP1048P[0-9]|BP1048B[0-9]|BP10xx|BP10|GoloPine|DSTech|MVAssistant|MVA|HidD_|HidP_|SetupDi|WinUSB|libusb|CreateFile|ReadFile|WriteFile|DeviceIoControl|VID[_:= ]|PID[_:= ]|USB|HID|UART|serial|COM[0-9]|upgrade|update|bootloader|boot|recovery|backup|read.?back|verify|CRC|chiperas|codedata|bootdat|constdat|cnfgdat|btupdat|upinfo|cxxx|flash|OTP|efuse|升级|烧录|恢复|备份|读取|校验|串口|升级狗|烧录器' \
                >> /tmp/r103/evidence/R103_BINARY_STRING_HITS.txt || true
            fi
          done

      - name: Map exact BP10xx support and candidate transport
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          ev=Path("/tmp/r103/evidence")
          blobs=[]
          for n in [
              "R103_MANUAL_AND_TEXT_CONTEXT.txt",
              "R103_BINARY_STRING_HITS.txt",
              "R103_TRANSPORT_IMPORT_HITS.txt",
              "R103_NESTED_ARCHIVE_LISTINGS.txt",
          ]:
              p=ev/n
              blobs.append(p.read_text(errors="replace") if p.exists() else "")
          t="\n".join(blobs)

          def hits(pattern):
              return len(re.findall(pattern,t,re.I))

          decision={
            "PUBLIC_BP10XX_V1_8_11_PACKAGE_ACQUIRED": True,
            "PACKAGE_SOURCE_PINNED_BY_SHA256": True,
            "BP1048P4_LITERAL_HIT_COUNT": hits(r"\bBP1048P4\b"),
            "BP1048_LITERAL_HIT_COUNT": hits(r"\bBP1048(?:P4|B1|B2)?\b"),
            "BP10XX_LITERAL_HIT_COUNT": hits(r"\bBP10xx\b"),
            "GOLOPINE_OR_DSTECH_LITERAL_HIT_COUNT": hits(r"GoloPine|DSTech"),
            "HID_SURFACE_HIT_COUNT": hits(r"HidD_|HidP_|hid\.dll|\bHID\b"),
            "WINUSB_SURFACE_HIT_COUNT": hits(r"WinUSB"),
            "UART_SERIAL_SURFACE_HIT_COUNT": hits(r"\bUART\b|\bserial\b|COM[0-9]"),
            "BOOT_UPGRADE_RECOVERY_HIT_COUNT": hits(r"bootloader|\bboot\b|upgrade|recovery|升级|引导|恢复"),
            "BACKUP_READBACK_HIT_COUNT": hits(r"backup|read.?back|read flash|备份|读取"),
            "PROGRAMMER_DONGLE_HIT_COUNT": hits(r"programmer|dongle|升级狗|烧录器"),
            "PRODUCTION_GOLOPINE_BP1048P4_COMPATIBILITY_PROVEN": False,
            "PHONE_DIRECT_BOOT_ENTRY_PROVEN": False,
            "PRODUCTION_RECOVERY_USB_IDENTITY_PROVEN": False,
            "SAFE_READ_ONLY_PRODUCTION_IDENTIFY_PROVEN": False,
            "SAFE_READ_ONLY_PRODUCTION_BACKUP_PROVEN": False,
            "ANY_PACKET_AUTHORIZED_FOR_BOARD": False,
            "FLASH_ALLOWED": False,
          }
          (ev/"R103_DECISION.json").write_text(
              json.dumps(decision,indent=2,ensure_ascii=False)+"\n"
          )
          print(json.dumps(decision,indent=2,ensure_ascii=False))
          PY

      - name: Build focused report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          ev=Path("/tmp/r103/evidence")
          d=json.loads((ev/"R103_DECISION.json").read_text())
          report=[
            "# R103 BP10xx MVAssistant V1.8.11 public package static audit",
            "",
            "STATIC/OFFLINE ONLY. The package is never executed and no USB device or board is contacted.",
            "",
            "## Decision",
            "```json",
            json.dumps(d,indent=2,ensure_ascii=False),
            "```",
            "",
            "## Gate",
            "- BP10xx-family evidence is not automatically GoloPine/DSTech BP1048P4 production compatibility.",
            "- No discovered packet, command, report, programmer protocol, or firmware image is authorized for the production board.",
            "- No AA55 repeat and no runtime 0x11.",
            "- No chiperas/codedata/bootdat/constdat/cnfgdat/btupdat/upinfo/cxxx transmission.",
            "- Final accepted route remains Samsung S25+ -> USB-C -> DSP USB-C, with no board modification.",
            "- FLASH_ALLOWED=NO.",
          ]
          (ev/"R103_REPORT.md").write_text("\n".join(report)+"\n")
          PY
          cat /tmp/r103/evidence/R103_REPORT.md

      - name: Package evidence only - exclude vendor binaries
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r103/evidence
          zip -9 -r /tmp/R103_BP10XX_MVASSISTANT_V1_8_11_STATIC_EVIDENCE.zip .
          sha256sum /tmp/R103_BP10XX_MVASSISTANT_V1_8_11_STATIC_EVIDENCE.zip \
            > /tmp/R103_BP10XX_MVASSISTANT_V1_8_11_STATIC_EVIDENCE.zip.sha256
          cat /tmp/R103_BP10XX_MVASSISTANT_V1_8_11_STATIC_EVIDENCE.zip.sha256

      - name: Upload R103 evidence
        uses: actions/upload-artifact@v4
        with:
          name: R103-BP10XX-MVASSISTANT-V1-8-11-STATIC-EVIDENCE
          path: |
            /tmp/R103_BP10XX_MVASSISTANT_V1_8_11_STATIC_EVIDENCE.zip
            /tmp/R103_BP10XX_MVASSISTANT_V1_8_11_STATIC_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'R103_VENDOR_BINARY_EXECUTED=NO' /tmp/r103/evidence/R103_SAFETY.txt
          grep -F 'R103_USB_DEVICE_ACCESS=NO' /tmp/r103/evidence/R103_SAFETY.txt
          grep -F 'R103_ANY_DISCOVERED_PACKET_AUTHORIZED_FOR_BP1048P4=NO' /tmp/r103/evidence/R103_SAFETY.txt
          grep -F 'FLASH_ALLOWED=NO' /tmp/r103/evidence/R103_SAFETY.txt
          cat /tmp/r103/evidence/R103_DECISION.json
          echo R103_STATIC_AUDIT_COMPLETE=YES
          echo FLASH_ALLOWED=NO
