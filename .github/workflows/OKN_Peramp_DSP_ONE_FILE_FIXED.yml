      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK 35 only
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          echo "sdkmanager=$SDKMANAGER"

          # Do NOT run `sdkmanager --licenses` here. That command asks for every
          # optional license installed on the hosted image (Google TV/XR, etc.).
          # Feed 'yes' only to the packages this app actually requires.
          set +o pipefail
          yes | "$SDKMANAGER" \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"
          SDK_RC=${PIPESTATUS[1]}
          set -o pipefail
          test "$SDK_RC" -eq 0

          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -d "$SDK_ROOT/platforms/${ANDROID_PLATFORM}"
          test -x "$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}/aapt2"
          test -x "$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          echo "Android SDK: PASS"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Preflight project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          java -version
          gradle --version
          gradle --version | grep -q 'Gradle 8.9'

          # Compile blocker found in the previous one-file workflow.
          grep -q '^import androidx.compose.foundation.layout.weight$' \
            app/src/main/java/com/okn/perampdsp/ui/PerampApp.kt

          grep -q 'compileSdk = 35' app/build.gradle.kts
          grep -q 'id("com.android.application") version "8.7.3"' build.gradle.kts
          grep -q 'id("org.jetbrains.kotlin.android") version "2.0.21"' build.gradle.kts
          echo "Project preflight: PASS"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          AAPT2="$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}/aapt2"
          APKSIGNER="$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"

          test -s "$APK"
          "$AAPT2" dump badging "$APK" | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -q "package: name='com.okn.perampdsp'" "$RUNNER_TEMP/apk-badging.txt"
          "$APKSIGNER" verify --verbose "$APK"

          rm -rf "$GITHUB_WORKSPACE/dist"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/OKN-Peramp-DSP-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/dist/OKN-Peramp-DSP-debug.apk" \
            > "$GITHUB_WORKSPACE/dist/OKN-Peramp-DSP-debug.apk.sha256"
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN-Peramp-DSP-debug
          path: |
            dist/OKN-Peramp-DSP-debug.apk
            dist/OKN-Peramp-DSP-debug.apk.sha256
