        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false

      - name: Install required Android SDK 35 only
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          SDK_RC=${PIPESTATUS[1]}
          set -o pipefail
          test "$SDK_RC" -eq 0
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -d "$SDK_ROOT/platforms/android-35"
          test -x "$SDK_ROOT/build-tools/35.0.0/aapt2"
          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          test -s project/app/build/outputs/apk/debug/app-debug.apk
          sha256sum project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload OKN Peramp DSP APK
        uses: actions/upload-artifact@v7
        with:
          name: OKN-Peramp-DSP-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
