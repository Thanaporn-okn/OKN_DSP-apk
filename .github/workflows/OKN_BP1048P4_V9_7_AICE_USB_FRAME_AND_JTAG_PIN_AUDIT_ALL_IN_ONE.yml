name: OKN BP1048P4 V9.7 AICE USB FRAME AND JTAG PIN AUDIT ALL IN ONE

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/OKN_BP1048P4_V9_7_AICE_USB_FRAME_AND_JTAG_PIN_AUDIT_ALL_IN_ONE.yml'

permissions:
  contents: read

env:
  FLASH_ALLOWED: "NO"
  AICE_USB_ALLOWED: "NO"
  HARDWARE_PROBE_ALLOWED: "NO"

  SDK_REPO: "https://github.com/leadercxn/bp1048_sdk_v0.1.12.git"
  SDK_COMMIT: "8105bd864b04995d81c9f9ae77cb158259f39015"

  OPENOCD_REPO: "https://github.com/openocd-org/openocd.git"
  OPENOCD_COMMIT: "f342aac0845a69d591ad39a025d74e9c765f6420"

jobs:
  static_proof:
    name: V9.7 prove AICE USB framing and audit BP1048 JTAG/EDM exposure
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          test "$AICE_USB_ALLOWED" = "NO"
          test "$HARDWARE_PROBE_ALLOWED" = "NO"

          rm -rf /tmp/v97
          mkdir -p /tmp/v97/evidence

          cat > /tmp/v97/evidence/SAFETY.txt <<'EOF'
          MODE=OFFLINE_STATIC_REVERSE_ENGINEERING
          TARGET_BP1048_CONNECTED=NO
          AICE_CONNECTED=NO
          OPENOCD_EXECUTED=NO
          ICEMAN_EXECUTED=NO
          USB_COMMAND_SENT=NO
          JTAG_COMMAND_SENT=NO
          UNKNOWN_BOARD_PIN_PROBED=NO
          FLASH_READ_EXECUTED=NO
          FLASH_ERASE_EXECUTED=NO
          FLASH_WRITE_EXECUTED=NO
          FLASH_ALLOWED=NO
          AICE_USB_ALLOWED=NO
          HARDWARE_PROBE_ALLOWED=NO
          EOF

      - name: Fetch pinned SDK and OpenOCD
        shell: bash
        run: |
          set -euo pipefail

          git clone -q "$SDK_REPO" /tmp/v97/sdk-src
          git -C /tmp/v97/sdk-src checkout -q "$SDK_COMMIT"
          test "$(git -C /tmp/v97/sdk-src rev-parse HEAD)" = "$SDK_COMMIT"

          git clone -q "$OPENOCD_REPO" /tmp/v97/openocd-src
          git -C /tmp/v97/openocd-src checkout -q "$OPENOCD_COMMIT"
          test "$(git -C /tmp/v97/openocd-src rev-parse HEAD)" = "$OPENOCD_COMMIT"

          git -C /tmp/v97/sdk-src rev-parse HEAD > /tmp/v97/evidence/SDK_COMMIT.txt
          git -C /tmp/v97/openocd-src rev-parse HEAD > /tmp/v97/evidence/OPENOCD_COMMIT.txt

      - name: Prove AICE USB byte framing
        shell: bash
        run: |
          set -euo pipefail
          test "$AICE_USB_ALLOWED" = "NO"

          O=/tmp/v97/openocd-src
          E=/tmp/v97/evidence
          USB="$O/src/jtag/aice/aice_usb.c"
          CFG="$O/tcl/interface/nds32-aice.cfg"

          grep -nE 'AICE_FORMAT_HTDMB|AICE_FORMAT_DTHMA|AICE_CMD_T_READ_MEM =|AICE_CMD_T_FASTREAD_MEM' \
            "$USB" > "$E/AICE_FRAME_CONSTANTS.txt"

          grep -nE 'aice_pack_htdmb|usb_out_buffer\[[0-7]\]|aice_unpack_dthma|usb_in_buffer\[[0-9]+' \
            "$USB" > "$E/AICE_PACK_UNPACK_EVIDENCE.txt" || true

          grep -nE 'aice_fastread_mem|AICE_CMD_T_FASTREAD_MEM|AICE_FORMAT_DTHMA|num_of_words - 1|aice_unpack_dthma_multiple_data' \
            "$USB" > "$E/AICE_FASTREAD_FRAME_EVIDENCE.txt"

          grep -nE 'aice vid_pid|aice port|adapter driver|adapter speed' \
            "$CFG" > "$E/AICE_CONFIG_EVIDENCE.txt"

          python3 - <<'PY'
          from pathlib import Path
          import re, json

          E=Path('/tmp/v97/evidence')
          src=Path('/tmp/v97/openocd-src/src/jtag/aice/aice_usb.c').read_text(errors='replace')
          cfg=Path('/tmp/v97/openocd-src/tcl/interface/nds32-aice.cfg').read_text(errors='replace')

          required = [
              r'#define\s+AICE_FORMAT_HTDMB\s+\(8\)',
              r'#define\s+AICE_FORMAT_DTHMA\s+\(8\)',
              r'AICE_CMD_T_READ_MEM\s*=\s*0x26',
              r'AICE_CMD_T_FASTREAD_MEM\s*=\s*0x27',
              r'usb_out_buffer\[0\]\s*=\s*cmd_code',
              r'usb_out_buffer\[1\]\s*=\s*target_id',
              r'usb_out_buffer\[2\]\s*=\s*extra_word_length',
              r'usb_out_buffer\[3\]\s*=\s*0',
              r'usb_out_buffer\[4\].*address\s*>>\s*24',
              r'usb_out_buffer\[5\].*address\s*>>\s*16',
              r'usb_out_buffer\[6\].*address\s*>>\s*8',
              r'usb_out_buffer\[7\].*address\s*&\s*0xFF',
              r'\*cmd_ack_code\s*=\s*usb_in_buffer\[0\]',
              r'\*target_id\s*=\s*usb_in_buffer\[1\]',
              r'\*extra_word_length\s*=\s*usb_in_buffer\[2\]',
              r'aice_usb_read\(usb_in_buffer,\s*AICE_FORMAT_DTHMA\s*\+\s*\(num_of_words\s*-\s*1\)\s*\*\s*4\)',
          ]
          for pat in required:
              if not re.search(pat, src, re.S):
                  raise RuntimeError('missing AICE framing proof: '+pat)

          if 'aice vid_pid 0x1CFC 0x0000' not in cfg:
              raise RuntimeError('AICE VID/PID proof missing')
          if 'aice port aice_usb' not in cfg:
              raise RuntimeError('aice_usb port proof missing')

          result = {
              "aice_usb_vid": "0x1CFC",
              "aice_usb_pid": "0x0000",
              "read_mem_cmd": "0x26",
              "fastread_mem_cmd": "0x27",
              "htdmb_request_bytes": 8,
              "htdmb_request_layout": [
                  "byte0=CMD",
                  "byte1=TARGET_ID",
                  "byte2=EXTRA_WORD_LENGTH",
                  "byte3=0",
                  "byte4..7=ADDRESS_BE32"
              ],
              "dthma_response_base_bytes": 8,
              "dthma_response_header_bytes_for_multi_data": 4,
              "fastread_response_bytes_formula": "4 + 4*N",
              "fastread_max_words": 256,
              "fastread_max_data_bytes": 1024,
              "fastread_max_usb_response_bytes": 1028,
              "fastread_address_source": "NDS_EDM_MISC_SBAR set separately; FASTREAD_MEM HTDMB address argument is 0",
              "FLASH_ALLOWED": False,
              "AICE_USB_ALLOWED": False
          }
          (E/'V9_7_AICE_USB_FRAME.json').write_text(json.dumps(result, indent=2)+'\n')
          PY

      - name: Prove AICE USB transport and external adapter requirement
        shell: bash
        run: |
          set -euo pipefail
          test "$AICE_USB_ALLOWED" = "NO"

          O=/tmp/v97/openocd-src
          E=/tmp/v97/evidence
          USB="$O/src/jtag/aice/aice_usb.c"
          IFACE="$O/src/jtag/aice/aice_interface.c"

          grep -nE 'jtag_libusb_open|libusb_claim_interface|jtag_libusb_choose_interface|LIBUSB_TRANSFER_TYPE_BULK|aice_usb_open' \
            "$USB" > "$E/AICE_USB_TRANSPORT.txt"

          grep -nE 'Cannot find AICE Interface|AICE JTAG Interface ready|aice_port->api->open' \
            "$IFACE" > "$E/AICE_ADAPTER_REQUIREMENT.txt"

          grep -q 'libusb_claim_interface(devh, 0)' "$USB"
          grep -q 'LIBUSB_TRANSFER_TYPE_BULK' "$USB"
          grep -q 'Cannot find AICE Interface' "$IFACE"

      - name: Prove 1024-byte AICE bulk-read path
        shell: bash
        run: |
          set -euo pipefail
          O=/tmp/v97/openocd-src
          E=/tmp/v97/evidence
          USB="$O/src/jtag/aice/aice_usb.c"

          grep -nE 'static int aice_bulk_read_mem|packet_size = \(count >= 0x100\)|NDS_EDM_MISC_SBAR|aice_fastread_mem|static int aice_usb_bulk_read_mem' \
            "$USB" > "$E/AICE_BULK_READ_PATH.txt"

          grep -q 'packet_size = (count >= 0x100) ? 0x100 : count' "$USB"
          grep -q 'aice_write_misc(coreid, NDS_EDM_MISC_SBAR, addr)' "$USB"
          grep -q 'aice_fastread_mem(coreid, buffer' "$USB"

      - name: Audit pinned BP1048 SDK for JTAG pin mapping and EDM definitions
        shell: bash
        run: |
          set -euo pipefail
          S=/tmp/v97/sdk-src
          E=/tmp/v97/evidence

          grep -RInE --binary-files=without-match \
            --include='*.c' --include='*.h' --include='*.prefs' --include='*.launch' --include='*.cfg' --include='*.txt' \
            '\b(JTAG|TCK|TMS|TDI|TDO|TRST|EDM_CFG|EDMSW|EDM_CTL|EDM_DTR)\b' \
            "$S/MVsB1_Base_SDK" "$S/BT_Audio_APP" \
            > "$E/SDK_JTAG_EDM_SEARCH.txt" || true

          grep -RInE --binary-files=without-match \
            --include='*.prefs' --include='*.launch' \
            'connectType=ICE|iceman\.misc\.args|targetURI=.*LOCALHOST|gdbjtag|jtagDevice' \
            "$S/MVsB1_Base_SDK" "$S/BT_Audio_APP" \
            > "$E/SDK_ANDES_ICE_PROJECT_METADATA.txt" || true

          grep -RInE --binary-files=without-match \
            --include='*.c' --include='*.h' --include='*.cfg' --include='*.prefs' --include='*.launch' \
            '(GPIO|PIN|PAD).*(TCK|TMS|TDI|TDO|TRST)|(TCK|TMS|TDI|TDO|TRST).*(GPIO|PIN|PAD)' \
            "$S/MVsB1_Base_SDK" "$S/BT_Audio_APP" \
            > "$E/SDK_EXPLICIT_JTAG_PIN_MAP.txt" || true

          python3 - <<'PY'
          from pathlib import Path
          import json, re

          E=Path('/tmp/v97/evidence')
          all_hits=(E/'SDK_JTAG_EDM_SEARCH.txt').read_text(errors='replace')
          meta=(E/'SDK_ANDES_ICE_PROJECT_METADATA.txt').read_text(errors='replace')
          pinmap=(E/'SDK_EXPLICIT_JTAG_PIN_MAP.txt').read_text(errors='replace').strip()

          result = {
              "nds32_edm_register_names_present": all(x in all_hits for x in ["EDM_CFG","EDMSW","EDM_CTL","EDM_DTR"]),
              "andes_ice_project_metadata_present": ("connectType=ICE" in meta or "iceman.misc.args" in meta),
              "explicit_gpio_pin_to_jtag_signal_mapping_found_in_pinned_sdk": bool(pinmap),
              "explicit_pin_map_evidence_lines": pinmap.splitlines()[:100] if pinmap else [],
              "scope_note": "This conclusion is limited to the pinned SDK source/config files scanned here; it is not a statement about undocumented silicon test pads or private board schematics."
          }
          if not result["nds32_edm_register_names_present"]:
              raise RuntimeError("expected NDS32 EDM register definitions not found")
          if not result["andes_ice_project_metadata_present"]:
              raise RuntimeError("expected Andes ICE project metadata not found")

          (E/'V9_7_SDK_JTAG_PIN_AUDIT.json').write_text(json.dumps(result, indent=2)+'\n')
          PY

      - name: Correlate ICEman V9.5 with AICE without conflating protocols
        shell: bash
        run: |
          set -euo pipefail
          E=/tmp/v97/evidence

          python3 - <<'PY'
          from pathlib import Path
          import json

          E=Path('/tmp/v97/evidence')
          a=json.loads((E/'V9_7_AICE_USB_FRAME.json').read_text())
          s=json.loads((E/'V9_7_SDK_JTAG_PIN_AUDIT.json').read_text())

          result = {
              "v95_iceman_fastin_cmd": "0x1C",
              "v95_iceman_mxic_read_window_bytes": 1024,
              "v96_aice_fastread_cmd": a["fastread_mem_cmd"],
              "v96_aice_fastread_max_data_bytes": a["fastread_max_data_bytes"],
              "same_max_data_window_bytes": a["fastread_max_data_bytes"] == 1024,
              "same_protocol_frame_proven": False,
              "reason_not_same_protocol": "ICEman uses TCP helper frames (for example fastin 0x1C); OpenOCD AICE uses USB AICE commands (FASTREAD_MEM 0x27) and different byte framing.",
              "stock_bp1048_runtime_usb_vid_pid": "6324:1719",
              "stock_bp1048_recovery_usb_vid_pid": "0000:2244",
              "openocd_aice_usb_vid_pid": "1CFC:0000",
              "stock_runtime_or_recovery_is_aice": False,
              "explicit_jtag_pin_map_found_in_pinned_sdk": s["explicit_gpio_pin_to_jtag_signal_mapping_found_in_pinned_sdk"],
              "safe_next_step": "Use board schematic/test-point tracing or authoritative BP1048P4 package documentation to identify the physical Andes debug/EDM connection before any hardware test. Do not probe unknown pins automatically.",
              "FLASH_ALLOWED": False,
              "AICE_USB_ALLOWED": False,
              "HARDWARE_PROBE_ALLOWED": False
          }
          (E/'V9_7_RESULT.json').write_text(json.dumps(result, indent=2)+'\n')

          lines=[
              '# BP1048P4 V9.7 — AICE USB frame + JTAG/EDM exposure audit',
              '',
              '- OpenOCD AICE `READ_MEM` command: `0x26`.',
              '- OpenOCD AICE `FASTREAD_MEM` command: `0x27`.',
              '- HTDMB request is 8 bytes: `[CMD, TARGET_ID, EXTRA_WORD_LENGTH, 0, ADDRESS_BE32]`.',
              '- FASTREAD response is `4 + 4*N` bytes and carries at most 256 words = 1024 data bytes.',
              '- AICE USB requires an external AICE-compatible USB adapter (`1CFC:0000` in the pinned config), interface 0, bulk endpoints.',
              '- V9.5 ICEman and OpenOCD AICE both expose a 1024-byte read window, but their command IDs/framing are different; protocol identity is not claimed.',
              f"- Explicit GPIO/PIN/PAD → TCK/TMS/TDI/TDO/TRST mapping found in pinned BP1048 SDK: **{s['explicit_gpio_pin_to_jtag_signal_mapping_found_in_pinned_sdk']}**.",
              '- NDS32 EDM register definitions and Andes ICE project metadata are present in the SDK.',
              '- No hardware, AICE, OpenOCD, ICEman, JTAG, flash-read, erase, or write operation was executed.',
              '- `FLASH_ALLOWED=NO`, `AICE_USB_ALLOWED=NO`, `HARDWARE_PROBE_ALLOWED=NO`.'
          ]
          (E/'V9_7_REPORT.md').write_text('\n'.join(lines)+'\n')
          PY

          cat "$E/V9_7_REPORT.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Final fail-closed assertions
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          test "$AICE_USB_ALLOWED" = "NO"
          test "$HARDWARE_PROBE_ALLOWED" = "NO"

          python3 - <<'PY'
          from pathlib import Path
          import json

          E=Path('/tmp/v97/evidence')
          safety=(E/'SAFETY.txt').read_text()
          for x in [
              'TARGET_BP1048_CONNECTED=NO',
              'AICE_CONNECTED=NO',
              'OPENOCD_EXECUTED=NO',
              'ICEMAN_EXECUTED=NO',
              'USB_COMMAND_SENT=NO',
              'JTAG_COMMAND_SENT=NO',
              'UNKNOWN_BOARD_PIN_PROBED=NO',
              'FLASH_READ_EXECUTED=NO',
              'FLASH_ERASE_EXECUTED=NO',
              'FLASH_WRITE_EXECUTED=NO',
              'FLASH_ALLOWED=NO',
              'AICE_USB_ALLOWED=NO',
              'HARDWARE_PROBE_ALLOWED=NO'
          ]:
              assert x in safety, x

          assert (E/'SDK_COMMIT.txt').read_text().strip() == '8105bd864b04995d81c9f9ae77cb158259f39015'
          assert (E/'OPENOCD_COMMIT.txt').read_text().strip() == 'f342aac0845a69d591ad39a025d74e9c765f6420'

          a=json.loads((E/'V9_7_AICE_USB_FRAME.json').read_text())
          r=json.loads((E/'V9_7_RESULT.json').read_text())

          assert a['read_mem_cmd'] == '0x26'
          assert a['fastread_mem_cmd'] == '0x27'
          assert a['htdmb_request_bytes'] == 8
          assert a['fastread_max_data_bytes'] == 1024
          assert a['fastread_max_usb_response_bytes'] == 1028
          assert r['same_max_data_window_bytes'] is True
          assert r['same_protocol_frame_proven'] is False
          assert r['stock_runtime_or_recovery_is_aice'] is False
          assert r['FLASH_ALLOWED'] is False
          assert r['AICE_USB_ALLOWED'] is False
          assert r['HARDWARE_PROBE_ALLOWED'] is False

          print('V9_7_AICE_FRAME_AND_JTAG_PIN_AUDIT_COMPLETE=YES')
          print('FLASH_ALLOWED=NO')
          print('AICE_USB_ALLOWED=NO')
          print('HARDWARE_PROBE_ALLOWED=NO')
          PY

      - name: Package V9.7 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          cd /tmp/v97/evidence
          zip -9 -r /tmp/OKN_BP1048P4_V9_7_AICE_FRAME_JTAG_AUDIT_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/OKN_BP1048P4_V9_7_AICE_FRAME_JTAG_AUDIT_EVIDENCE.zip \
            > /tmp/OKN_BP1048P4_V9_7_AICE_FRAME_JTAG_AUDIT_EVIDENCE.zip.sha256

      - name: Upload V9.7 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OKN-BP1048P4-V9_7-AICE-FRAME-JTAG-AUDIT-EVIDENCE
          path: |
            /tmp/OKN_BP1048P4_V9_7_AICE_FRAME_JTAG_AUDIT_EVIDENCE.zip
            /tmp/OKN_BP1048P4_V9_7_AICE_FRAME_JTAG_AUDIT_EVIDENCE.zip.sha256
            /tmp/v97/evidence/V9_7_REPORT.md
            /tmp/v97/evidence/V9_7_RESULT.json
            /tmp/v97/evidence/V9_7_AICE_USB_FRAME.json
            /tmp/v97/evidence/V9_7_SDK_JTAG_PIN_AUDIT.json
            /tmp/v97/evidence/AICE_FRAME_CONSTANTS.txt
            /tmp/v97/evidence/AICE_PACK_UNPACK_EVIDENCE.txt
            /tmp/v97/evidence/AICE_FASTREAD_FRAME_EVIDENCE.txt
            /tmp/v97/evidence/AICE_CONFIG_EVIDENCE.txt
            /tmp/v97/evidence/AICE_USB_TRANSPORT.txt
            /tmp/v97/evidence/AICE_ADAPTER_REQUIREMENT.txt
            /tmp/v97/evidence/AICE_BULK_READ_PATH.txt
            /tmp/v97/evidence/SDK_JTAG_EDM_SEARCH.txt
            /tmp/v97/evidence/SDK_ANDES_ICE_PROJECT_METADATA.txt
            /tmp/v97/evidence/SDK_EXPLICIT_JTAG_PIN_MAP.txt
            /tmp/v97/evidence/SDK_COMMIT.txt
            /tmp/v97/evidence/OPENOCD_COMMIT.txt
            /tmp/v97/evidence/SAFETY.txt
          if-no-files-found: warn
          retention-days: 90
