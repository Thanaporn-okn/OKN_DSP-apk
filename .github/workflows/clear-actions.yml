name: Clear All Actions History

on:
  push:
    paths:
      - ".github/workflows/clear-actions.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  clear:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Delete ALL workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          set +e

          echo "Current cleanup run: $CURRENT_RUN"

          while true
          do
            RUNS=$(gh api \
              "repos/$REPO/actions/runs?per_page=100" \
              --jq ".workflow_runs[] |
              select(.id != $CURRENT_RUN) |
              [.id,.status] |
              @tsv")

            if [ -z "$RUNS" ]; then
              echo "ALL OLD RUNS DELETED"
              break
            fi

            echo "$RUNS" |
            while IFS=$'\t' read -r RUN_ID STATUS
            do
              [ -z "$RUN_ID" ] && continue

              echo "Processing $RUN_ID - $STATUS"

              if [ "$STATUS" != "completed" ]; then
                gh api \
                  --method POST \
                  "repos/$REPO/actions/runs/$RUN_ID/cancel" \
                  >/dev/null 2>&1 || true
              fi

              gh api \
                --method DELETE \
                "repos/$REPO/actions/runs/$RUN_ID" \
                >/dev/null 2>&1 || true
            done

            sleep 3
          done

          echo "DONE"
