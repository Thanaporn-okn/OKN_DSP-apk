name: R38 TRUE7CH runtime integration

on:
  workflow_dispatch:

jobs:
  r38-runtime-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack pinned R36 source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="OKN_BP1048P4_PHASE3_TRUE7CH_Source_R36.zip"
          test -f "$ZIP"
          echo "0edcc409352d7656ec0296b8416a55ea9f276299c396ed7fff6c8c5517cb3d82  $ZIP" | sha256sum -c -
          rm -rf /tmp/r36src
          mkdir -p /tmp/r36src
          unzip -q "$ZIP" -d /tmp/r36src
          ROOT="$(find /tmp/r36src -mindepth 1 -maxdepth 1 -type d -name 'OKN_BP1048P4_PHASE3_TRUE7CH_R36' | head -n1)"
          test -n "$ROOT"
          echo "R36_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Install host prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libc6-i386 lib32z1 git unzip

      - name: Fetch pinned public BP1048 SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/leadercxn/bp1048_sdk_v0.1.12.git /tmp/bp1048
          cd /tmp/bp1048
          git checkout 8105bd864b04995d81c9f9ae77cb158259f39015
          test "$(git rev-parse HEAD)" = "8105bd864b04995d81c9f9ae77cb158259f39015"

      - name: Fetch Andes NDS32 toolchain
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Ai-Thinker-Open/Andestech.git /tmp/andes
          echo "/tmp/andes/BSPv422/toolchains/nds32le-elf-mculib-v3s/bin" >> "$GITHUB_PATH"

      - name: Verify SDK fingerprints and select BP1048P4
        shell: bash
        run: |
          set -euo pipefail
          cd "$R36_ROOT"
          python3 experimental_r36/scripts/check_sdk_files.py /tmp/bp1048
          python3 experimental_r36/scripts/enable_bp1048p4.py /tmp/bp1048
          grep -a '^#define  CFG_CHIP_BP1048P4' /tmp/bp1048/BT_Audio_APP/bt_audio_app_src/inc/app_config.h
          if grep -a -q '^#define  CFG_CHIP_BP10128' /tmp/bp1048/BT_Audio_APP/bt_audio_app_src/inc/app_config.h; then
            echo 'BP10128 is still enabled' >&2
            exit 1
          fi

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          nds32le-elf-gcc --version
          nds32le-elf-ld --version
          nds32le-elf-objdump --version

      - name: Repair Windows-origin header case on Linux
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCASE'
          from pathlib import Path
          import re

          root = Path('/tmp/bp1048')
          bases = [
              root / 'BT_Audio_APP',
              root / 'MVsB1_Base_SDK' / 'driver',
              root / 'MVsB1_Base_SDK' / 'middleware',
              root / 'develop_lib',
          ]
          headers = []
          for base in bases:
              if base.exists():
                  headers.extend(p for p in base.rglob('*') if p.is_file() and p.suffix.lower() in {'.h', '.hpp'})
          by_lower = {}
          for p in headers:
              by_lower.setdefault(p.name.lower(), []).append(p)

          rx = re.compile(r'^\s*#\s*include\s*[<\"]([^\">]+)[\">]', re.M)
          spellings = set()
          for base in bases:
              if not base.exists():
                  continue
              for p in base.rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in {'.c', '.h', '.hpp', '.s'}:
                      continue
                  try:
                      text = p.read_bytes().decode('latin-1')
                  except OSError:
                      continue
                  for inc in rx.findall(text):
                      if '/' not in inc and '\\' not in inc:
                          spellings.add(inc)

          made = []
          for inc in sorted(spellings):
              for target in by_lower.get(inc.lower(), []):
                  alias = target.with_name(inc)
                  if alias.name == target.name or alias.exists():
                      continue
                  try:
                      alias.symlink_to(target.name)
                  except OSError:
                      alias.write_bytes(target.read_bytes())
                  made.append((str(alias.relative_to(root)), target.name))

          must = root / 'MVsB1_Base_SDK/middleware/rtos/freertos/inc/freertos.h'
          if not must.exists():
              raise SystemExit('failed to create freertos.h compatibility alias')
          print('Created', len(made), 'case aliases')
          PYCASE

      - name: Build production include path from BT_Audio_APP project order
        shell: bash
        run: |
          set -euo pipefail
          SDK=/tmp/bp1048
          : > /tmp/r38_includes.rsp
          for d in \
            "$SDK/BT_Audio_APP/bt_audio_app_src/audio" \
            "$SDK/develop_lib/util" \
            "$SDK/develop_lib" \
            "$SDK/develop_lib/trace" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/ai/md5" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/ai/speex/include/speex" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/ai/speex/include" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/ai/speex/libspeex" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/ai/speex" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/ai" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/inc" \
            "$SDK/MVsB1_Base_SDK/driver/driver_api/inc/otg" \
            "$SDK/MVsB1_Base_SDK/middleware/rtc/inc" \
            "$SDK/MVsB1_Base_SDK/middleware/fatfs/inc" \
            "$SDK/MVsB1_Base_SDK/middleware/user/inc" \
            "$SDK/MVsB1_Base_SDK/middleware/bluetooth/inc" \
            "$SDK/MVsB1_Base_SDK/middleware/audio/inc" \
            "$SDK/MVsB1_Base_SDK/driver/driver/inc" \
            "$SDK/MVsB1_Base_SDK/driver/driver_api/inc" \
            "$SDK/MVsB1_Base_SDK/middleware/mv_utils/inc" \
            "$SDK/MVsB1_Base_SDK/middleware/lrc/inc" \
            "$SDK/MVsB1_Base_SDK/middleware/rtos/rtos_api" \
            "$SDK/MVsB1_Base_SDK/middleware/rtos/freertos/inc" \
            "$SDK/MVsB1_Base_SDK/middleware/flashfs/inc" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/display" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/user" \
            "$SDK/MVsB1_Base_SDK/middleware/cec/inc" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/ble"; do
            test -d "$d" && printf '%s\n' "-I$d" >> /tmp/r38_includes.rsp
          done
          find "$SDK/BT_Audio_APP" \
               "$SDK/MVsB1_Base_SDK/driver" \
               "$SDK/MVsB1_Base_SDK/middleware" \
               "$SDK/develop_lib" \
               -type f -name '*.h' -printf '%h\n' | sort -u | while read -r d; do
            grep -Fxq -- "-I$d" /tmp/r38_includes.rsp || printf '%s\n' "-I$d" >> /tmp/r38_includes.rsp
          done
          printf '%s\n' "-I$R36_ROOT/firmware/include" >> /tmp/r38_includes.rsp
          head -50 /tmp/r38_includes.rsp

      - name: Patch runtime dispatcher for TRUE7CH controls 0x57 0x58
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYPATCH'
          from pathlib import Path

          p = Path('/tmp/bp1048/BT_Audio_APP/bt_audio_app_src/audio/communication.c')
          b = p.read_bytes()
          original = b

          def once(old: bytes, new: bytes, label: str):
              global b
              n = b.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {n}')
              b = b.replace(old, new, 1)

          once(
              b'#include "main_task.h"',
              b'#include "main_task.h"\r\n#include "okn_r36_sdk_bridge.h"',
              'include hook')

          once(
              b'void Communication_Effect_Init(void)\r\n{',
              b'void Communication_Effect_Init(void)\r\n{\r\n\tokn_r36_init();',
              'init hook')

          marker = b'void Communication_Effect_Config(uint8_t Control, uint8_t *buf, uint32_t len)\r\n{'
          helper = br'''/* OKN R38 TRUE7CH runtime bridge. Runtime-only; no flash write path. */
          static void OKN_Communication_0x57(uint8_t *buf, uint32_t len)
          {
              uint8_t req[13];
              if((buf == NULL) || (len != 12u)) return;
              req[0] = OKN_UFE_WRITE;
              memcpy(&req[1], buf, 12u);
              if(okn_r36_ufe_write_apply(req, sizeof(req)))
              {
                  memset(tx_buf, 0, sizeof(tx_buf));
                  tx_buf[0] = OKN_UFE_WRITE;
                  Communication_Effect_Send(tx_buf, 1u);
              }
          }
          
          static void OKN_Communication_0x58(uint8_t *buf, uint32_t len)
          {
              uint8_t req[9];
              uint8_t resp[13];
              size_t n;
              if((buf == NULL) || (len != 8u)) return;
              req[0] = OKN_UFE_READ;
              memcpy(&req[1], buf, 8u);
              n = okn_r36_ufe_read(req, sizeof(req), resp, sizeof(resp));
              if((n != 13u) || (resp[0] != OKN_UFE_READ_RESPONSE)) return;
              memset(tx_buf, 0, sizeof(tx_buf));
              tx_buf[0] = 0xA5u;
              tx_buf[1] = 0x5Au;
              tx_buf[2] = OKN_UFE_READ_RESPONSE;
              tx_buf[3] = (uint8_t)(n - 1u);
              memcpy(&tx_buf[4], &resp[1], n - 1u);
              tx_buf[3u + n] = 0x16u;
              Communication_Effect_Send(tx_buf, (uint32_t)(n + 4u));
          }
          
          '''
          once(marker, helper + marker, 'runtime helper insertion')

          once(
              b'\t\tcase 0x80:\r\n',
              b'\t\tcase 0x57:\r\n\t\t\tOKN_Communication_0x57(buf, len);\r\n\t\t\treturn;\r\n\r\n'
              b'\t\tcase 0x58:\r\n\t\t\tOKN_Communication_0x58(buf, len);\r\n\t\t\treturn;\r\n\r\n'
              b'\t\tcase 0x80:\r\n',
              'dispatcher cases')

          if b == original:
              raise SystemExit('patch made no changes')
          p.write_bytes(b)

          # Safety assertions: new runtime hooks are present and the destructive 0x11
          # branch remains separate/unmodified.
          text = b.decode('latin-1')
          for needle in ['OKN_Communication_0x57', 'OKN_Communication_0x58',
                         'case 0x57:', 'case 0x58:', 'okn_r36_init();']:
              if needle not in text:
                  raise SystemExit('missing patched token: ' + needle)
          if text.count('case 0x11:') != 1 or text.count('Communication_Effect_0x11(buf, len);') != 1:
              raise SystemExit('destructive 0x11 branch changed unexpectedly')

          Path('/tmp/R38_PATCHED_communication.c').write_bytes(b)
          Path('/tmp/R38_RUNTIME_PROTOCOL.txt').write_text(
              'R38 runtime protocol (experimental, RAM only)\n'
              'WRITE: A5 5A 57 0C <id32be><offset16be><len16be><float32le> 16\n'
              'READ : A5 5A 58 08 <id32be><offset16be><len16be> 16\n'
              'READ RESPONSE: A5 5A 60 0C <id32be><offset16be><len16be><float32le> 16\n'
              'IDs: CH1..CH7 = 22..28\n'
              'No SaveParams, erase, program, commit, reset, or Control 0x11 is used by this bridge.\n',
              encoding='utf-8')
          print('R38 communication runtime patch applied')
          PYPATCH

      - name: Compile TRUE7CH runtime integration against real SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK=/tmp/bp1048
          ROOT="$R36_ROOT"
          CC=nds32le-elf-gcc
          COMMON=(-Os -g3 -mcpu=d1088-spu -mcmodel=medium -mext-dsp -mext-zol -fsingle-precision-constant -ffunction-sections -fdata-sections)
          APP=(-DFUNC_OS_EN=1 -DCFG_APP_CONFIG -DHAVE_CONFIG_H)

          cd "$ROOT"
          "$CC" "${COMMON[@]}" @/tmp/r38_includes.rsp -c firmware/src/okn_gain7.c -o /tmp/okn_gain7.o
          "$CC" "${COMMON[@]}" @/tmp/r38_includes.rsp -c firmware/src/okn_ufe_gain7.c -o /tmp/okn_ufe_gain7.o
          "$CC" "${COMMON[@]}" @/tmp/r38_includes.rsp -DOKN_R36_VENDOR_SDK=1 -c firmware/src/okn_r36_sdk_bridge.c -o /tmp/okn_r36_sdk_bridge.o

          "$CC" "${COMMON[@]}" @/tmp/r38_includes.rsp "${APP[@]}" \
            -c "$SDK/BT_Audio_APP/bt_audio_app_src/services/audio_core_api.c" -o /tmp/audio_core_api.o
          "$CC" "${COMMON[@]}" @/tmp/r38_includes.rsp \
            -c "$SDK/MVsB1_Base_SDK/driver/driver_api/src/i2s_interface.c" -o /tmp/i2s_interface.o
          "$CC" "${COMMON[@]}" @/tmp/r38_includes.rsp "${APP[@]}" \
            -c "$SDK/BT_Audio_APP/bt_audio_app_src/audio/communication.c" -o /tmp/communication_r38.o

          nds32le-elf-ld -r \
            --wrap=AudioI2S0_DataSet \
            --wrap=AudioI2S1_DataSet \
            -o /tmp/R38_TRUE7CH_RUNTIME_INTEGRATION.o \
            /tmp/okn_gain7.o \
            /tmp/okn_ufe_gain7.o \
            /tmp/okn_r36_sdk_bridge.o \
            /tmp/audio_core_api.o \
            /tmp/i2s_interface.o \
            /tmp/communication_r38.o

          nds32le-elf-nm -a -C /tmp/R38_TRUE7CH_RUNTIME_INTEGRATION.o > /tmp/R38_SYMBOLS.txt
          nds32le-elf-nm -u /tmp/R38_TRUE7CH_RUNTIME_INTEGRATION.o > /tmp/R38_UNRESOLVED.txt || true
          nds32le-elf-size /tmp/R38_TRUE7CH_RUNTIME_INTEGRATION.o > /tmp/R38_SIZE.txt
          nds32le-elf-objdump -dr /tmp/R38_TRUE7CH_RUNTIME_INTEGRATION.o > /tmp/R38_DISASM_RELOC.txt

          for sym in \
            Communication_Effect_Config \
            okn_r36_init \
            okn_r36_ufe_write_apply \
            okn_r36_ufe_read \
            __wrap_AudioI2S0_DataSet \
            __wrap_AudioI2S1_DataSet \
            AudioCoreSinkVolSet; do
            grep -Eq "[[:space:]]${sym}$" /tmp/R38_SYMBOLS.txt || { echo "missing symbol $sym" >&2; exit 1; }
          done

          if grep -Eq ' U AudioCoreSinkVolSet$| U __real_AudioI2S0_DataSet$| U __real_AudioI2S1_DataSet$' /tmp/R38_UNRESOLVED.txt; then
            echo 'Expected real SDK runtime symbols did not resolve' >&2
            cat /tmp/R38_UNRESOLVED.txt >&2
            exit 1
          fi

      - name: Static safety audit of R38 runtime path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYSAFE'
          from pathlib import Path
          s = Path('/tmp/R38_PATCHED_communication.c').read_bytes().decode('latin-1')
          start = s.index('/* OKN R38 TRUE7CH runtime bridge.')
          end = s.index('void Communication_Effect_Config', start)
          block = s[start:end]
          forbidden = [
              'Communication_Effect_0x11', 'SpiFlashErase', 'SpiFlashWrite',
              'SaveParams', 'Reset_McuSystem', 'chiperas', 'codedata', 'constdat'
          ]
          bad = [x for x in forbidden if x in block]
          if bad:
              raise SystemExit('forbidden runtime bridge token(s): ' + ', '.join(bad))
          required = ['OKN_UFE_WRITE', 'OKN_UFE_READ', 'OKN_UFE_READ_RESPONSE',
                      'okn_r36_ufe_write_apply', 'okn_r36_ufe_read']
          miss = [x for x in required if x not in block]
          if miss:
              raise SystemExit('missing runtime bridge token(s): ' + ', '.join(miss))
          print('PASS R38 runtime bridge contains no flash/reset/save call')
          PYSAFE

      - name: Generate full BT_Audio_APP source compile inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYINV'
          from pathlib import Path
          import re

          sdk = Path('/tmp/bp1048')
          app = sdk / 'BT_Audio_APP'
          sources = set()
          for p in (app / 'bt_audio_app_src').rglob('*'):
              if p.is_file() and p.suffix.lower() in {'.c', '.s'}:
                  sources.add(p.resolve())

          proj = (app / '.project').read_text(encoding='utf-8', errors='replace')
          for uri in re.findall(r'<locationURI>(.*?)</locationURI>', proj):
              u = uri.replace('&amp;', '&')
              if u.startswith('PARENT-1-PROJECT_LOC/'):
                  p = sdk / u[len('PARENT-1-PROJECT_LOC/'):]
              elif u.startswith('WORKSPACE_LOC/'):
                  p = sdk / u[len('WORKSPACE_LOC/'):]
              else:
                  continue
              if p.is_file() and p.suffix.lower() in {'.c', '.s'}:
                  sources.add(p.resolve())

          items = sorted(str(p) for p in sources)
          Path('/tmp/R38_FULL_SOURCE_INVENTORY.txt').write_text('\n'.join(items) + '\n', encoding='utf-8')
          Path('/tmp/R38_FULL_SOURCE_COUNT.txt').write_text(str(len(items)) + '\n', encoding='ascii')
          print('Full source inventory count:', len(items))
          PYINV

      - name: Audit compile frontier for full BT_Audio_APP
        shell: bash
        run: |
          set -euo pipefail
          CC=nds32le-elf-gcc
          COMMON=(-Os -g3 -mcpu=d1088-spu -mcmodel=medium -mext-dsp -mext-zol -fsingle-precision-constant -ffunction-sections -fdata-sections)
          APP=(-DFUNC_OS_EN=1 -DCFG_APP_CONFIG -DHAVE_CONFIG_H)
          rm -rf /tmp/r38audit && mkdir -p /tmp/r38audit/obj /tmp/r38audit/log
          : > /tmp/R38_COMPILE_AUDIT.tsv
          pass=0
          fail=0
          i=0
          while IFS= read -r src; do
            test -n "$src" || continue
            i=$((i+1))
            obj="/tmp/r38audit/obj/$i.o"
            log="/tmp/r38audit/log/$i.log"
            set +e
            "$CC" "${COMMON[@]}" @/tmp/r38_includes.rsp "${APP[@]}" -c "$src" -o "$obj" >"$log" 2>&1
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              pass=$((pass+1))
              printf 'PASS\t%s\n' "$src" >> /tmp/R38_COMPILE_AUDIT.tsv
            else
              fail=$((fail+1))
              printf 'FAIL\t%s\t%s\n' "$src" "$log" >> /tmp/R38_COMPILE_AUDIT.tsv
            fi
          done < /tmp/R38_FULL_SOURCE_INVENTORY.txt
          printf 'TOTAL=%d\nPASS=%d\nFAIL=%d\n' "$i" "$pass" "$fail" | tee /tmp/R38_COMPILE_AUDIT_SUMMARY.txt

          # Diagnostic frontier only: integration success above is the hard gate.
          # Preserve first errors so R39 can fix build-system deltas without rerunning blindly.
          : > /tmp/R38_FIRST_FAILURES.txt
          awk -F '\t' '$1=="FAIL" && n<20 {print $2"\t"$3; n++}' /tmp/R38_COMPILE_AUDIT.tsv | while IFS=$'\t' read -r src log; do
            echo "===== $src =====" >> /tmp/R38_FIRST_FAILURES.txt
            sed -n '1,80p' "$log" >> /tmp/R38_FIRST_FAILURES.txt
          done

      - name: Package R38 evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/README_R38.txt <<'EOF'
          R38 TRUE7CH RUNTIME INTEGRATION EVIDENCE
          - Real public BP1048 SDK pinned to commit 8105bd864b04995d81c9f9ae77cb158259f39015
          - BP1048P4 selected
          - Runtime controls 0x57 write / 0x58 read inserted into Communication_Effect_Config
          - Actuator IDs 22..28 map to CH1..CH7 gain state
          - 0x60 read response generated
          - DAC0/DACX/I2S runtime gain bridge compiled against real SDK APIs
          - No flash/save/reset function is called by the injected runtime bridge
          - This artifact is NOT a flashable production firmware.
          EOF
          sha256sum \
            /tmp/R38_TRUE7CH_RUNTIME_INTEGRATION.o \
            /tmp/R38_PATCHED_communication.c \
            /tmp/R38_RUNTIME_PROTOCOL.txt \
            /tmp/R38_SYMBOLS.txt \
            /tmp/R38_UNRESOLVED.txt \
            > /tmp/R38_SHA256SUMS.txt

      - name: Upload R38 evidence
        uses: actions/upload-artifact@v4
        with:
          name: R38_TRUE7CH_RUNTIME_INTEGRATION
          path: |
            /tmp/R38_TRUE7CH_RUNTIME_INTEGRATION.o
            /tmp/R38_PATCHED_communication.c
            /tmp/R38_RUNTIME_PROTOCOL.txt
            /tmp/R38_SYMBOLS.txt
            /tmp/R38_UNRESOLVED.txt
            /tmp/R38_SIZE.txt
            /tmp/R38_DISASM_RELOC.txt
            /tmp/R38_FULL_SOURCE_INVENTORY.txt
            /tmp/R38_FULL_SOURCE_COUNT.txt
            /tmp/R38_COMPILE_AUDIT.tsv
            /tmp/R38_COMPILE_AUDIT_SUMMARY.txt
            /tmp/R38_FIRST_FAILURES.txt
            /tmp/R38_SHA256SUMS.txt
            /tmp/README_R38.txt
