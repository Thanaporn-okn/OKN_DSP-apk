name: OKN BP1048P4 V8.8 USB TRACE + HID CALLERS — ALL IN ONE

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLASH_ALLOWED: "NO"
  WIN_CLIENT_URL: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-08.exe_.zip"
  APK_CLIENT_URL: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-01.apk_.zip"
  EXPECTED_WIN_ZIP_SHA256: "f14b0c4baad70a8b0d5dc3b2783819cc2ef6e1a9c6ec2adcf17f1557059edd2a"
  JADX_VERSION: "1.5.6"

jobs:
  master:
    name: Build USB Diagnostics V8.8 + static updater recovery scan
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          mkdir -p /tmp/okn/{pkg,tools,evidence,decompiled/windows,decompiled/android}
          cat > /tmp/okn/evidence/SAFETY.txt <<'TXT'
          MODE=OFFLINE_RESEARCH_PLUS_SAFE_ANDROID_BUILD
          PHYSICAL_USB_BOARD_PRESENT=NO
          USB_COMMAND_SENT_BY_CI=NO
          FEATURE_55_SENT=NO
          FEATURE_AA_SENT=NO
          BOOT_ENTRY_EXECUTED=NO
          FLASH_READ_EXECUTED=NO
          FLASH_ERASE_EXECUTED=NO
          FLASH_WRITE_EXECUTED=NO
          FLASH_ALLOWED=NO
          TXT

      - name: Generate complete Android project + recovery analyzer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json
          from pathlib import Path
          files=json.loads('{"KNOWN_PROTOCOL.md":"","README_TH.md":"","app/build.gradle":"","app/src/main/AndroidManifest.xml":"","app/src/main/java/com/okn/bp1048reader/Bp1048Protocol.java":"","app/src/main/java/com/okn/bp1048reader/Bp1048Usb.java":"","app/src/main/java/com/okn/bp1048reader/MainActivity.java":"","app/src/main/java/com/okn/bp1048reader/SessionTrace.java":"","app/src/main/res/xml/device_filter.xml":"PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPHJlc291cmNlcz4KICAgIDx1c2ItZGV2aWNlIHZlbmRvci1pZD0iMjUzODAiIHByb2R1Y3QtaWQ9IjU5MTMiIC8+CjwvcmVzb3VyY2VzPgo=","build.gradle":"cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguNy4zJyBhcHBseSBmYWxzZQp9Cg==","gradle.properties":"YW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCg==","settings.gradle":"","tools/recover_candidates.py":"","tools/tests/TestUsb.java":"","tools/tests/android/hardware/usb/UsbConstants.java":"cGFja2FnZSBhbmRyb2lkLmhhcmR3YXJlLnVzYjsgcHVibGljIGNsYXNzIFVzYkNvbnN0YW50cyB7IHB1YmxpYyBzdGF0aWMgZmluYWwgaW50IFVTQl9DTEFTU19ISUQ9MzsgfQo=","tools/tests/android/hardware/usb/UsbDevice.java":"","tools/tests/android/hardware/usb/UsbDeviceConnection.java":"","tools/tests/android/hardware/usb/UsbInterface.java":"cGFja2FnZSBhbmRyb2lkLmhhcmR3YXJlLnVzYjsgcHVibGljIGNsYXNzIFVzYkludGVyZmFjZSB7IHB1YmxpYyBpbnQgZ2V0SWQoKXtyZXR1cm4gNDt9IHB1YmxpYyBpbnQgZ2V0SW50ZXJmYWNlQ2xhc3MoKXtyZXR1cm4gMzt9IH0K","tools/tests/android/hardware/usb/UsbManager.java":"cGFja2FnZSBhbmRyb2lkLmhhcmR3YXJlLnVzYjsgcHVibGljIGNsYXNzIFVzYk1hbmFnZXIgewogcHVibGljIGZpbmFsIFVzYkRldmljZUNvbm5lY3Rpb24gY29ubmVjdGlvbj1uZXcgVXNiRGV2aWNlQ29ubmVjdGlvbigpOwogcHVibGljIFVzYkRldmljZUNvbm5lY3Rpb24gb3BlbkRldmljZShVc2JEZXZpY2UgZCl7cmV0dXJuIGNvbm5lY3Rpb247fSB9Cg=="}')
          for name,data in files.items():
              p=Path(name); p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(base64.b64decode(data))
          Path('tools/recover_candidates.py').chmod(0o755)
          print('generated', len(files), 'files')
          PY
          grep -Rni "FLASH_ALLOWED" app/src/main/java || true
          if grep -RniE 'FLASH_ALLOWED[[:space:]]*=[[:space:]]*true|PRODUCTION_FLASH_ENABLED[[:space:]]*=[[:space:]]*true' app/src/main; then
            echo "Unsafe flash gate detected" >&2
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses and install API 35
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$SDK" ANDROID_HOME="$SDK"
          SDKMANAGER=""
          for p in             "$SDK/cmdline-tools/16.0/bin/sdkmanager"             "$SDK/cmdline-tools/latest/bin/sdkmanager"             "$(command -v sdkmanager 2>/dev/null || true)"; do
            if [ -n "$p" ] && [ -x "$p" ]; then SDKMANAGER="$p"; break; fi
          done
          test -n "$SDKMANAGER"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/tmp/sdk-licenses.log 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          tail -100 /tmp/sdk-licenses.log || true

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Test USB failure handling and capture ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/okn/test-classes
          javac -d /tmp/okn/test-classes tools/tests/android/hardware/usb/*.java tools/tests/TestUsb.java app/src/main/java/com/okn/bp1048reader/{Bp1048Protocol,Bp1048Usb,SessionTrace}.java
          java -cp /tmp/okn/test-classes TestUsb

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug :app:lintDebug
          mkdir -p /tmp/okn/output
          cp README_TH.md /tmp/okn/output/README_TH.md
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/okn/output/OKN_BP1048P4_UsbDiagnostics_v8_8.apk
          sha256sum /tmp/okn/output/OKN_BP1048P4_UsbDiagnostics_v8_8.apk | tee /tmp/okn/output/APK_SHA256.txt
          zip -9 -r /tmp/okn/output/OKN_BP1048P4_UsbDiagnostics_v8_8_SOURCE.zip             app tools README_TH.md KNOWN_PROTOCOL.md build.gradle settings.gradle gradle.properties -x '*/build/*' >/dev/null
          sha256sum /tmp/okn/output/OKN_BP1048P4_UsbDiagnostics_v8_8_SOURCE.zip > /tmp/okn/output/SOURCE_SHA256.txt

      - name: Upload phone APK and Thai test instructions
        uses: actions/upload-artifact@v4
        with:
          name: OKN-BP1048P4-USB-DIAGNOSTICS-V8_8-APK
          path: |
            /tmp/okn/output/OKN_BP1048P4_UsbDiagnostics_v8_8.apk
            /tmp/okn/output/APK_SHA256.txt
            /tmp/okn/output/README_TH.md
          if-no-files-found: error

      - name: Set up .NET 8 for Windows-client analysis
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Install offline reverse-engineering tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip p7zip-full file binutils jq >/dev/null
          dotnet tool install ilspycmd --tool-path /tmp/okn/tools/ilspy >/tmp/okn/evidence/ILSPY_INSTALL.log 2>&1
          curl -fL --retry 4             "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip"             -o /tmp/okn/tools/jadx.zip
          mkdir -p /tmp/okn/tools/jadx
          unzip -q -o /tmp/okn/tools/jadx.zip -d /tmp/okn/tools/jadx
          /tmp/okn/tools/jadx/bin/jadx --version | tee /tmp/okn/evidence/JADX_VERSION.txt
          /tmp/okn/tools/ilspy/ilspycmd --version | tee /tmp/okn/evidence/ILSPY_VERSION.txt

      - name: Download pinned official GoloPine clients
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --connect-timeout 20 "$WIN_CLIENT_URL" -o /tmp/okn/pkg/windows.zip
          curl -fL --retry 4 --connect-timeout 20 "$APK_CLIENT_URL" -o /tmp/okn/pkg/android.zip
          sha256sum /tmp/okn/pkg/windows.zip /tmp/okn/pkg/android.zip | tee /tmp/okn/evidence/OFFICIAL_DOWNLOAD_SHA256.txt
          ACTUAL="$(sha256sum /tmp/okn/pkg/windows.zip | awk '{print $1}')"
          if [ "$ACTUAL" != "$EXPECTED_WIN_ZIP_SHA256" ]; then
            echo "Official Windows client hash changed: $ACTUAL" >&2
            exit 1
          fi
          mkdir -p /tmp/okn/pkg/windows /tmp/okn/pkg/android
          unzip -q -o /tmp/okn/pkg/windows.zip -d /tmp/okn/pkg/windows
          unzip -q -o /tmp/okn/pkg/android.zip -d /tmp/okn/pkg/android
          find /tmp/okn/pkg/windows /tmp/okn/pkg/android -type f -printf '%p\n' > /tmp/okn/evidence/OFFICIAL_FILE_LIST.txt

      - name: Deep decompile Windows client
        shell: bash
        run: |
          set -u
          OUT=/tmp/okn/decompiled/windows
          find /tmp/okn/pkg/windows -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0 | while IFS= read -r -d '' f; do
            b="$(basename "$f" | tr ' /' '__')"
            sha256sum "$f" >> "$OUT/SHA256SUMS.txt"
            file "$f" >> "$OUT/FILE_TYPES.txt" || true
            strings -a -n 3 "$f" > "$OUT/${b}.ascii.txt" || true
            strings -a -el -n 3 "$f" > "$OUT/${b}.utf16.txt" || true
            mkdir -p "$OUT/${b}.src"
            /tmp/okn/tools/ilspy/ilspycmd -p -o "$OUT/${b}.src" "$f" >"$OUT/${b}.ilspy.log" 2>&1 || true
            /tmp/okn/tools/ilspy/ilspycmd -il "$f" >"$OUT/${b}.il.txt" 2>"$OUT/${b}.il.err" || true
          done

      - name: Deep decompile Android client
        shell: bash
        run: |
          set -u
          OUT=/tmp/okn/decompiled/android
          find /tmp/okn/pkg/android -type f -iname '*.apk' -print0 | while IFS= read -r -d '' apk; do
            b="$(basename "$apk" | tr ' /' '__')"
            sha256sum "$apk" >> "$OUT/SHA256SUMS.txt"
            mkdir -p "$OUT/${b}.jadx"
            /tmp/okn/tools/jadx/bin/jadx --show-bad-code --no-res -d "$OUT/${b}.jadx" "$apk" >"$OUT/${b}.jadx.log" 2>&1 || true
            mkdir -p "$OUT/${b}.raw"
            unzip -q -o "$apk" -d "$OUT/${b}.raw" || true
            find "$OUT/${b}.raw" -type f \( -name 'classes*.dex' -o -name '*.so' -o -name '*.xml' \) -print0 |               while IFS= read -r -d '' f; do strings -a -n 3 "$f" 2>/dev/null || true; done               > "$OUT/${b}.raw_strings.txt"
          done

      - name: Rank exact HID/updater candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/recover_candidates.py /tmp/okn/decompiled/windows /tmp/okn/decompiled/android --out /tmp/okn/evidence
          cat /tmp/okn/evidence/RECOVERY_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          head -350 /tmp/okn/evidence/UPDATER_CANDIDATES.txt | sed 's/```/` ` `/g' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Package evidence and master result
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/okn/decompiled/windows /tmp/okn/evidence/windows
          cp -a /tmp/okn/decompiled/android /tmp/okn/evidence/android
          cd /tmp/okn/evidence
          zip -9 -r /tmp/okn/output/OKN_BP1048P4_OFFLINE_UPDATER_RECOVERY_V8_EVIDENCE.zip . >/dev/null
          cd /tmp/okn/output
          sha256sum OKN_BP1048P4_OFFLINE_UPDATER_RECOVERY_V8_EVIDENCE.zip > EVIDENCE_SHA256.txt
          cp /tmp/okn/evidence/RECOVERY_REPORT.md .
          cp /tmp/okn/evidence/RECOVERY_STATUS.json .
          cp /tmp/okn/evidence/UPDATER_CANDIDATES.txt .
          cp /tmp/okn/evidence/SAFETY.txt .
          zip -9 -r /tmp/OKN_BP1048P4_MASTER_V8_ALL_IN_ONE_OUTPUT.zip . >/dev/null
          sha256sum /tmp/OKN_BP1048P4_MASTER_V8_ALL_IN_ONE_OUTPUT.zip > /tmp/OKN_BP1048P4_MASTER_V8_ALL_IN_ONE_OUTPUT.zip.sha256

      - name: Upload one complete artifact
        uses: actions/upload-artifact@v7
        with:
          name: OKN-BP1048P4-MASTER-V8_8-ALL-IN-ONE
          path: |
            /tmp/OKN_BP1048P4_MASTER_V8_ALL_IN_ONE_OUTPUT.zip
            /tmp/OKN_BP1048P4_MASTER_V8_ALL_IN_ONE_OUTPUT.zip.sha256
            /tmp/okn/output/OKN_BP1048P4_UsbDiagnostics_v8_8.apk
            /tmp/okn/output/APK_SHA256.txt
            /tmp/okn/output/OKN_BP1048P4_UsbDiagnostics_v8_8_SOURCE.zip
            /tmp/okn/output/OKN_BP1048P4_OFFLINE_UPDATER_RECOVERY_V8_EVIDENCE.zip
            /tmp/okn/output/RECOVERY_REPORT.md
            /tmp/okn/output/RECOVERY_STATUS.json
            /tmp/okn/output/UPDATER_CANDIDATES.txt
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/okn/output/RECOVERY_STATUS.json'))
          assert d['FLASH_ALLOWED'] is False
          print('MASTER_V8_COMPLETE=YES')
          print('FLASH_ALLOWED=NO')
          PY
  runtime_devirtualize:
    name: Exact HID caller graph V8.8 + reachable IL (NO USB)
    runs-on: windows-latest
    timeout-minutes: 50

    steps:
      - name: Safety gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:FLASH_ALLOWED -ne "NO") { throw "FLASH_ALLOWED must remain NO" }
          New-Item -ItemType Directory -Force -Path `
            "$env:RUNNER_TEMP\bpv8\client", `
            "$env:RUNNER_TEMP\bpv8\probe", `
            "$env:RUNNER_TEMP\bpv8\evidence" | Out-Null
          @"
          MODE=OFFLINE_RUNTIME_DEvirtualization
          PHYSICAL_USB_BOARD_PRESENT=NO
          USB_COMMAND_SENT=NO
          HID_OUTPUT_REPORT_SENT=NO
          HID_FEATURE_REPORT_SENT=NO
          FLASH_READ_EXECUTED=NO
          FLASH_ERASE_EXECUTED=NO
          FLASH_WRITE_EXECUTED=NO
          FLASH_ALLOWED=NO
          "@ | Set-Content "$env:RUNNER_TEMP\bpv8\evidence\SAFETY.txt"

      - name: Download pinned official Windows client
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "$env:RUNNER_TEMP\bpv8"
          Invoke-WebRequest -Uri $env:WIN_CLIENT_URL -OutFile "$root\client.zip"
          $actual = (Get-FileHash "$root\client.zip" -Algorithm SHA256).Hash.ToLower()
          "expected=$env:EXPECTED_WIN_ZIP_SHA256" | Set-Content "$root\evidence\CLIENT_PIN.txt"
          "actual=$actual" | Add-Content "$root\evidence\CLIENT_PIN.txt"
          if ($actual -ne $env:EXPECTED_WIN_ZIP_SHA256) { throw "Official Windows client ZIP hash changed" }
          Expand-Archive -Force "$root\client.zip" "$root\client\extracted"
          $exe = Get-ChildItem "$root\client\extracted" -Recurse -File -Filter *.exe |
            Where-Object { $_.FullName -notmatch '__MACOSX' } |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $exe) { throw "Client EXE not found" }
          Copy-Item $exe.FullName "$root\client\official.exe"
          (Get-FileHash "$root\client\official.exe" -Algorithm SHA256).Hash.ToLower() |
            Set-Content "$root\evidence\OFFICIAL_EXE_SHA256.txt"
          $exe.FullName | Set-Content "$root\evidence\ORIGINAL_EXE_PATH.txt"

      - name: Build x86 .NET Framework runtime body probe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "$env:RUNNER_TEMP\bpv8"
          @'
          using System;
          using System.Collections;
          using System.Collections.Generic;
          using System.Globalization;
          using System.IO;
          using System.Linq;
          using System.Reflection;
          using System.Runtime.CompilerServices;
          using System.Runtime.InteropServices;
          using System.Text;
          using System.Text.RegularExpressions;

          internal static class RuntimeProbe
          {
              static string OutDir;
              static Assembly A;
              static Module M;

              static string Safe(string s)
              {
                  if (String.IsNullOrEmpty(s)) return "_";
                  foreach (char c in Path.GetInvalidFileNameChars()) s = s.Replace(c, '_');
                  return s.Replace('`','_').Replace('<','_').Replace('>','_').Replace(':','_');
              }

              static string Hex(byte[] b, int max)
              {
                  if (b == null) return "";
                  int n = Math.Min(max, b.Length);
                  StringBuilder sb = new StringBuilder(n * 3);
                  for (int i=0;i<n;i++) { if (i>0) sb.Append(' '); sb.Append(b[i].ToString("X2")); }
                  return sb.ToString();
              }

              static byte[] GetIL(MethodBase m)
              {
                  try {
                      MethodBody b = m.GetMethodBody();
                      return b == null ? null : b.GetILAsByteArray();
                  } catch { return null; }
              }

              [StructLayout(LayoutKind.Sequential)]
              struct MEMORY_BASIC_INFORMATION
              {
                  public IntPtr BaseAddress;
                  public IntPtr AllocationBase;
                  public uint AllocationProtect;
                  public UIntPtr RegionSize;
                  public uint State;
                  public uint Protect;
                  public uint Type;
              }

              [DllImport("kernel32.dll", SetLastError=true)]
              static extern IntPtr GetCurrentProcess();

              [DllImport("kernel32.dll", SetLastError=true)]
              static extern bool ReadProcessMemory(
                  IntPtr hProcess, IntPtr lpBaseAddress, [Out] byte[] lpBuffer,
                  UIntPtr nSize, out UIntPtr lpNumberOfBytesRead);

              [DllImport("kernel32.dll", SetLastError=true)]
              static extern UIntPtr VirtualQuery(
                  IntPtr lpAddress, out MEMORY_BASIC_INFORMATION lpBuffer, UIntPtr dwLength);

              const uint MEM_COMMIT = 0x1000;
              const uint PAGE_NOACCESS = 0x01;
              const uint PAGE_GUARD = 0x100;

              static bool PageReadable(IntPtr p, out MEMORY_BASIC_INFORMATION mbi)
              {
                  mbi = new MEMORY_BASIC_INFORMATION();
                  UIntPtr n = VirtualQuery(p, out mbi, (UIntPtr)Marshal.SizeOf(typeof(MEMORY_BASIC_INFORMATION)));
                  if (n == UIntPtr.Zero) return false;
                  if (mbi.State != MEM_COMMIT) return false;
                  if ((mbi.Protect & PAGE_NOACCESS) != 0) return false;
                  if ((mbi.Protect & PAGE_GUARD) != 0) return false;
                  return true;
              }

              // Never dereference JIT/precode pointers with Marshal.Copy/ReadByte.
              // An invalid or page-crossing pointer can raise AccessViolation and kill
              // the CLR before catch{} runs. ReadProcessMemory fails safely instead.
              static byte[] ReadNative(IntPtr p, int len)
              {
                  if (p == IntPtr.Zero || len <= 0) return null;
                  try {
                      List<byte> all = new List<byte>();
                      long cur = p.ToInt64();
                      int remain = Math.Min(len, 4096);
                      IntPtr hp = GetCurrentProcess();
                      while (remain > 0) {
                          MEMORY_BASIC_INFORMATION mbi;
                          IntPtr cp = new IntPtr(cur);
                          if (!PageReadable(cp, out mbi)) break;
                          long regionEnd = mbi.BaseAddress.ToInt64() + (long)mbi.RegionSize.ToUInt64();
                          long avail = regionEnd - cur;
                          if (avail <= 0) break;
                          int take = (int)Math.Min((long)remain, Math.Min(avail, 128L));
                          byte[] tmp = new byte[take];
                          UIntPtr got;
                          if (!ReadProcessMemory(hp, cp, tmp, (UIntPtr)take, out got)) break;
                          int n = (int)Math.Min((ulong)take, got.ToUInt64());
                          if (n <= 0) break;
                          for (int i=0;i<n;i++) all.Add(tmp[i]);
                          cur += n;
                          remain -= n;
                          if (n < take) break;
                      }
                      return all.Count == 0 ? null : all.ToArray();
                  } catch { return null; }
              }

              static int I32(byte[] b, int o)
              {
                  if (b == null || o < 0 || o + 4 > b.Length) return 0;
                  return b[o] | (b[o+1] << 8) | (b[o+2] << 16) | (b[o+3] << 24);
              }

              static IntPtr ReadPtr32Safe(IntPtr p)
              {
                  byte[] b = ReadNative(p, 4);
                  if (b == null || b.Length < 4) return IntPtr.Zero;
                  return new IntPtr(I32(b,0));
              }

              static IntPtr ResolveJump32(IntPtr p)
              {
                  byte[] h = ReadNative(p, 16);
                  if (h == null || h.Length < 2) return IntPtr.Zero;
                  try {
                      byte b0 = h[0];
                      long basep = p.ToInt64();
                      if (b0 == 0xE9 && h.Length >= 5)
                          return new IntPtr(basep + 5 + I32(h,1));
                      if (b0 == 0xEB && h.Length >= 2)
                          return new IntPtr(basep + 2 + unchecked((sbyte)h[1]));
                      if (b0 == 0xFF && h.Length >= 6 && h[1] == 0x25)
                          return ReadPtr32Safe(new IntPtr(I32(h,2)));
                      if (b0 == 0x68 && h.Length >= 6 && h[5] == 0xC3)
                          return new IntPtr(I32(h,1));
                      if (b0 == 0xB8 && h.Length >= 7 && h[5] == 0xFF && h[6] == 0xE0)
                          return new IntPtr(I32(h,1));
                  } catch {}
                  return IntPtr.Zero;
              }

              static string MethodId(MethodBase m)
              {
                  string type = m.DeclaringType == null ? "<global>" : m.DeclaringType.FullName;
                  return "0x" + m.MetadataToken.ToString("X8") + "_" + Safe(type) + "_" + Safe(m.Name);
              }

              static void DumpMethod(MethodBase m, string dir, bool binary)
              {
                  byte[] before = GetIL(m);
                  IntPtr fp = IntPtr.Zero;
                  string err = "";
                  try {
                      if (!m.ContainsGenericParameters && !m.IsAbstract) {
                          RuntimeHelpers.PrepareMethod(m.MethodHandle);
                          fp = m.MethodHandle.GetFunctionPointer();
                      }
                  } catch (Exception ex) { err = ex.GetType().FullName + ": " + ex.Message; }
                  byte[] after = GetIL(m);
                  string id = MethodId(m);
                  string metaPath = Path.Combine(dir, id + ".txt");

                  // Persist the identity/IL first. Even if native inspection fails,
                  // the workflow still retains the exact method token and stub body.
                  using (StreamWriter pre = new StreamWriter(metaPath, false, Encoding.UTF8)) {
                      pre.WriteLine("token=0x" + m.MetadataToken.ToString("X8"));
                      pre.WriteLine("type=" + (m.DeclaringType == null ? "" : m.DeclaringType.FullName));
                      pre.WriteLine("method=" + m.Name);
                      pre.WriteLine("attributes=" + m.Attributes);
                      pre.WriteLine("impl_attributes=" + m.MethodImplementationFlags);
                      pre.WriteLine("il_before_len=" + (before == null ? -1 : before.Length));
                      pre.WriteLine("il_before=" + Hex(before,4096));
                      pre.WriteLine("il_after_len=" + (after == null ? -1 : after.Length));
                      pre.WriteLine("il_after=" + Hex(after,4096));
                      pre.WriteLine("function_ptr=0x" + fp.ToInt64().ToString("X"));
                      if (!String.IsNullOrEmpty(err)) pre.WriteLine("prepare_error=" + err);
                  }

                  byte[] native = ReadNative(fp, binary ? 512 : 96);
                  IntPtr target = ResolveJump32(fp);
                  byte[] targetBytes = target == IntPtr.Zero ? null : ReadNative(target, binary ? 512 : 96);
                  using (StreamWriter w = new StreamWriter(metaPath, true, Encoding.UTF8)) {
                      w.WriteLine("jump_target=0x" + target.ToInt64().ToString("X"));
                      w.WriteLine("native_len=" + (native == null ? -1 : native.Length));
                      w.WriteLine("target_native_len=" + (targetBytes == null ? -1 : targetBytes.Length));
                      w.WriteLine("native=" + Hex(native,4096));
                      w.WriteLine("target_native=" + Hex(targetBytes,4096));
                      if (!String.IsNullOrEmpty(err)) w.WriteLine("prepare_error=" + err);
                  }
                  if (binary && native != null) File.WriteAllBytes(Path.Combine(dir,id + ".native.bin"), native);
                  if (binary && targetBytes != null) File.WriteAllBytes(Path.Combine(dir,id + ".target.bin"), targetBytes);
              }

              static bool TryNumber64(object o, out long v)
              {
                  v=0; if(o==null) return false;
                  try {
                      if(o is IntPtr) { v=((IntPtr)o).ToInt64(); return true; }
                      if(o is UIntPtr) { v=unchecked((long)((UIntPtr)o).ToUInt64()); return true; }
                      TypeCode tc=Type.GetTypeCode(o.GetType());
                      switch(tc) {
                          case TypeCode.SByte: case TypeCode.Byte: case TypeCode.Int16: case TypeCode.UInt16:
                          case TypeCode.Int32: case TypeCode.UInt32: case TypeCode.Int64: case TypeCode.UInt64:
                              v=unchecked((long)Convert.ToUInt64(o)); return true;
                      }
                  } catch { try { v=Convert.ToInt64(o); return true; } catch {} }
                  return false;
              }

              static string ShortValue(object v)
              {
                  if(v==null) return "null";
                  try {
                      long n;
                      if(TryNumber64(v,out n)) return v.GetType().Name+"="+n+"(0x"+unchecked((ulong)n).ToString("X")+")";
                      if(v is string) { string q=(string)v; if(q.Length>300) q=q.Substring(0,300); return "String=\""+q.Replace("\r"," ").Replace("\n"," ")+"\""; }
                      if(v is MethodBase) { MethodBase m=(MethodBase)v; return "Method="+(m.DeclaringType==null?"":m.DeclaringType.FullName+"::")+m.Name+" token=0x"+m.MetadataToken.ToString("X8"); }
                      if(v is Delegate) { Delegate d=(Delegate)v; MethodInfo m=d.Method; return "Delegate="+(m.DeclaringType==null?"":m.DeclaringType.FullName+"::")+m.Name+" token=0x"+m.MetadataToken.ToString("X8"); }
                      Array a=v as Array; if(a!=null) return v.GetType().FullName+" len="+a.Length;
                      string q2=v.ToString(); if(q2.Length>300) q2=q2.Substring(0,300); return v.GetType().FullName+"="+q2;
                  } catch { return v.GetType().FullName; }
              }

              static void DumpObjectFields(StreamWriter w, object obj, string prefix, int depth, HashSet<int> seen)
              {
                  if(obj==null || depth>2) return;
                  Type t=obj.GetType();
                  if(t.IsPrimitive || t.IsEnum || obj is string || obj is IntPtr || obj is UIntPtr || obj is decimal) return;
                  int id=RuntimeHelpers.GetHashCode(obj);
                  if(seen.Contains(id)) { w.WriteLine(prefix+"<cycle>"); return; }
                  seen.Add(id);
                  try {
                      foreach(FieldInfo f in t.GetFields(BindingFlags.Instance|BindingFlags.Public|BindingFlags.NonPublic)) {
                          object fv=null;
                          try { fv=f.GetValue(obj); } catch(Exception ex) { w.WriteLine(prefix+"FIELD "+f.Name+" <error "+ex.GetType().Name+">"); continue; }
                          w.WriteLine(prefix+"FIELD token=0x"+f.MetadataToken.ToString("X8")+" name="+f.Name+" type="+f.FieldType.FullName+" value="+ShortValue(fv));
                          byte[] bb=fv as byte[];
                          if(bb!=null) w.WriteLine(prefix+"  BYTES len="+bb.Length+" head="+Hex(bb,96));
                          Array ar=fv as Array;
                          if(ar!=null && !(fv is byte[])) {
                              int lim=Math.Min(ar.Length,16); StringBuilder sb=new StringBuilder();
                              for(int i=0;i<lim;i++) { object x=null; try{x=ar.GetValue(i);}catch{} if(i>0) sb.Append(" | "); sb.Append(ShortValue(x)); }
                              if(lim>0) w.WriteLine(prefix+"  ARRAY_SAMPLE "+sb.ToString());
                          }
                          if(fv!=null && depth<2 && !(fv is Array) && !(fv is IDictionary) && !(fv is Delegate) && !(fv is MethodBase))
                              DumpObjectFields(w,fv,prefix+"  ",depth+1,seen);
                      }
                  } finally { seen.Remove(id); }
              }

              static void DumpObjectByteArrays(StreamWriter index, object obj, string dir, string keyHex, string rva, string path, int depth, HashSet<int> seen)
              {
                  if(obj==null || depth>3) return;
                  Type t=obj.GetType();
                  if(t.IsPrimitive || t.IsEnum || obj is string || obj is IntPtr || obj is UIntPtr || obj is decimal || obj is Delegate || obj is MethodBase) return;
                  int id=RuntimeHelpers.GetHashCode(obj);
                  if(seen.Contains(id)) return;
                  seen.Add(id);
                  try {
                      foreach(FieldInfo f in t.GetFields(BindingFlags.Instance|BindingFlags.Public|BindingFlags.NonPublic)) {
                          object fv=null; try { fv=f.GetValue(obj); } catch { continue; }
                          byte[] bb=fv as byte[];
                          string child=path+"."+f.Name;
                          if(bb!=null) {
                              string stem="obj_"+Safe(keyHex)+"_"+Safe(child)+"_tok_0x"+f.MetadataToken.ToString("X8")+".bin";
                              string fp=Path.Combine(dir,stem);
                              try { File.WriteAllBytes(fp,bb); } catch {}
                              index.WriteLine(keyHex+"\t"+rva+"\t0x"+f.MetadataToken.ToString("X8")+"\t"+f.Name+"\t"+child+"\t"+bb.Length+"\t"+stem+"\t"+Hex(bb,128));
                          }
                          if(fv!=null && depth<3 && !(fv is Array) && !(fv is IDictionary))
                              DumpObjectByteArrays(index,fv,dir,keyHex,rva,child,depth+1,seen);
                      }
                  } finally { seen.Remove(id); }
              }

              static void DumpStaticFields(Type t)
              {
                  string path = Path.Combine(OutDir,"STATIC_FIELDS.txt");
                  string objPath = Path.Combine(OutDir,"MAP_OBJECTS.txt");
                  string idxPath = Path.Combine(OutDir,"MAP_ADDRESS_INDEX.tsv");
                  string mapDir = Path.Combine(OutDir,"map_native"); Directory.CreateDirectory(mapDir);
                  string objBlobDir = Path.Combine(OutDir,"map_object_blobs"); Directory.CreateDirectory(objBlobDir);
                  string objBlobIdx = Path.Combine(OutDir,"MAP_OBJECT_BLOB_INDEX.tsv");
                  long moduleBase=0;
                  try { moduleBase=Marshal.GetHINSTANCE(M).ToInt64(); } catch {}
                  using (StreamWriter w = new StreamWriter(path,true,Encoding.UTF8))
                  using (StreamWriter ow = new StreamWriter(objPath,true,Encoding.UTF8))
                  using (StreamWriter iw = new StreamWriter(idxPath,true,Encoding.UTF8))
                  using (StreamWriter bi = new StreamWriter(objBlobIdx,true,Encoding.UTF8)) {
                      if(new FileInfo(objBlobIdx).Length==0) bi.WriteLine("key_hex\trva\tfield_token\tfield_name\tobject_path\tlength\tfile\thead_hex");
                      w.WriteLine("===== TYPE " + t.FullName + " =====");
                      ow.WriteLine("===== TYPE " + t.FullName + " =====");
                      foreach (FieldInfo f in t.GetFields(BindingFlags.Static|BindingFlags.Public|BindingFlags.NonPublic)) {
                          try {
                              object v = f.GetValue(null);
                              w.WriteLine("FIELD token=0x" + f.MetadataToken.ToString("X8") + " name=" + f.Name + " type=" + f.FieldType.FullName + " valueType=" + (v==null?"null":v.GetType().FullName));
                              byte[] bb = v as byte[];
                              if (bb != null) {
                                  string n = "field_0x" + f.MetadataToken.ToString("X8") + "_" + Safe(f.Name) + ".bin";
                                  File.WriteAllBytes(Path.Combine(OutDir,n),bb);
                                  w.WriteLine("  byte_len=" + bb.Length + " sha_hint=" + Hex(bb,64));
                              }
                              IDictionary d = v as IDictionary;
                              if (d != null) {
                                  int count=0;
                                  foreach (DictionaryEntry de in d) {
                                      if (count++ > 200000) break;
                                      string extra="";
                                      try {
                                          if (de.Key is int && de.Value is int) {
                                              int kt=(int)de.Key, raw=(int)de.Value, mt=raw & 0x3fffffff;
                                              MemberInfo km=null, vm=null;
                                              try { km=M.ResolveMember(kt); } catch {}
                                              try { vm=M.ResolveMember(mt); } catch {}
                                              extra=" keyMember="+(km==null?"":km.DeclaringType+"::"+km.Name)+" valueMember="+(vm==null?"":vm.DeclaringType+"::"+vm.Name)+" callvirtFlag="+((raw & 0x40000000)!=0);
                                          }
                                      } catch {}
                                      string ktp = de.Key == null ? "null" : de.Key.GetType().FullName;
                                      string vtp = de.Value == null ? "null" : de.Value.GetType().FullName;
                                      long ka=0; bool keynum=TryNumber64(de.Key,out ka);
                                      string keyhex=keynum ? "0x"+unchecked((ulong)ka).ToString("X") : "";
                                      string rvah=""; if(keynum && moduleBase!=0) rvah="0x"+unchecked((ulong)(ka-moduleBase)).ToString("X");
                                      w.WriteLine("  MAP " + de.Key + " -> " + de.Value + " keyType=" + ktp + " valueType=" + vtp + " keyHex="+keyhex+" rva="+rvah+extra);
                                      if(keynum) {
                                          iw.WriteLine(ka+"\t"+keyhex+"\t"+rvah+"\t"+vtp+"\t"+ShortValue(de.Value).Replace("\t"," "));
                                          if(ka>0 && ka<=UInt32.MaxValue) {
                                              byte[] mb=ReadNative(new IntPtr(ka),384);
                                              if(mb!=null && mb.Length>0) File.WriteAllBytes(Path.Combine(mapDir,"map_0x"+ka.ToString("X8")+".bin"),mb);
                                          }
                                      }
                                      ow.WriteLine("MAP key="+de.Key+" keyHex="+keyhex+" rva="+rvah+" valueType="+vtp+" value="+ShortValue(de.Value));
                                      if(de.Value!=null) {
                                          DumpObjectFields(ow,de.Value,"  ",0,new HashSet<int>());
                                          DumpObjectByteArrays(bi,de.Value,objBlobDir,keyhex,rvah,"root",0,new HashSet<int>());
                                      }
                                  }
                                  w.WriteLine("  map_entries_dumped="+count);
                              } else if (v != null && !(v is Delegate)) {
                                  string q = v.ToString(); if (q.Length>1000) q=q.Substring(0,1000);
                                  w.WriteLine("  value="+q);
                              }
                          } catch (Exception ex) { w.WriteLine("FIELD_ERROR "+f.Name+" "+ex.GetType().Name+" "+ex.Message); }
                      }
                  }
              }

              static void DumpPInvokePointers(IEnumerable<Type> types)
              {
                  string dir=Path.Combine(OutDir,"pinvoke"); Directory.CreateDirectory(dir);
                  using(StreamWriter w=new StreamWriter(Path.Combine(OutDir,"PINVOKE_POINTERS.txt"),false,Encoding.UTF8)) {
                      foreach(Type t in types) {
                          MethodInfo[] ms; try { ms=t.GetMethods(BindingFlags.Static|BindingFlags.Instance|BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.DeclaredOnly); } catch { continue; }
                          foreach(MethodInfo m in ms) {
                              if((m.Attributes & MethodAttributes.PinvokeImpl)==0) continue;
                              DllImportAttribute da=null; try { da=(DllImportAttribute)Attribute.GetCustomAttribute(m,typeof(DllImportAttribute)); } catch {}
                              IntPtr fp=IntPtr.Zero, jt=IntPtr.Zero; string err="";
                              try { RuntimeHelpers.PrepareMethod(m.MethodHandle); fp=m.MethodHandle.GetFunctionPointer(); jt=ResolveJump32(fp); }
                              catch(Exception ex){err=ex.GetType().Name+": "+ex.Message;}
                              string ep=da==null?"":(String.IsNullOrEmpty(da.EntryPoint)?m.Name:da.EntryPoint);
                              string dll=da==null?"":da.Value;
                              w.WriteLine("token=0x"+m.MetadataToken.ToString("X8")+" type="+t.FullName+" method="+m.Name+" dll="+dll+" entry="+ep+" function_ptr=0x"+fp.ToInt64().ToString("X")+" jump_target=0x"+jt.ToInt64().ToString("X")+" error="+err);
                              byte[] b=ReadNative(fp,256); if(b!=null) File.WriteAllBytes(Path.Combine(dir,"pinvoke_0x"+m.MetadataToken.ToString("X8")+"_"+Safe(ep)+"_fp_0x"+fp.ToInt64().ToString("X")+".bin"),b);
                              byte[] tb=jt==IntPtr.Zero?null:ReadNative(jt,256); if(tb!=null) File.WriteAllBytes(Path.Combine(dir,"pinvoke_0x"+m.MetadataToken.ToString("X8")+"_"+Safe(ep)+"_target_0x"+jt.ToInt64().ToString("X")+".bin"),tb);
                          }
                      }
                  }
              }

              static bool PriorityType(Type t)
              {
                  string s=t.FullName ?? t.Name;
                  return Regex.IsMatch(s,"Hid|MainWindow|UFE|DeviceCommunicationStream|HardwareCommandConverter|DeviceShowList|report|Upgrade|Firmware|Flash|Boot|Communication",RegexOptions.IgnoreCase);
              }

              public static int Main(string[] args)
              {
                  if (args.Length < 2) { Console.Error.WriteLine("usage: RuntimeProbe target.exe outdir"); return 2; }
                  string target=Path.GetFullPath(args[0]); OutDir=Path.GetFullPath(args[1]); Directory.CreateDirectory(OutDir);
                  Directory.SetCurrentDirectory(Path.GetDirectoryName(target));
                  AppDomain.CurrentDomain.AssemblyResolve += delegate(object sender, ResolveEventArgs e) {
                      try {
                          string n=new AssemblyName(e.Name).Name+".dll";
                          string p=Path.Combine(Path.GetDirectoryName(target),n);
                          if(File.Exists(p)) return Assembly.LoadFrom(p);
                      } catch {}
                      return null;
                  };
                  Console.WriteLine("PROCESS_BITNESS="+(IntPtr.Size*8));
                  A=Assembly.LoadFrom(target); M=A.ManifestModule;
                  long moduleBase=0; try { moduleBase=Marshal.GetHINSTANCE(M).ToInt64(); } catch {}
                  File.WriteAllText(Path.Combine(OutDir,"ASSEMBLY.txt"),A.FullName+Environment.NewLine+"Module="+M.Name+Environment.NewLine+"ModuleBase=0x"+moduleBase.ToString("X")+Environment.NewLine);
                  File.WriteAllText(Path.Combine(OutDir,"MODULE_BASE.txt"),"0x"+moduleBase.ToString("X")+Environment.NewLine);

                  Type protector=A.GetType("Q9Wet0jLP4YxXSyJBiC.q71r2Rj8SiD9GF1BI50",false);
                  Type hid=A.GetType("DSTech_AudioDSP_Client.Hid",false);
                  using (StreamWriter w=new StreamWriter(Path.Combine(OutDir,"INIT.log"),false,Encoding.UTF8)) {
                      foreach(Type t in new Type[]{protector,hid}) {
                          if(t==null) continue;
                          try { RuntimeHelpers.RunClassConstructor(t.TypeHandle); w.WriteLine("cctor OK "+t.FullName); }
                          catch(Exception ex){ w.WriteLine("cctor FAIL "+t.FullName+" "+ex); }
                      }
                  }
                  if(protector!=null) DumpStaticFields(protector);
                  if(hid!=null) DumpStaticFields(hid);

                  string pdir=Path.Combine(OutDir,"priority"); Directory.CreateDirectory(pdir);
                  string sdir=Path.Combine(OutDir,"all_stubs"); Directory.CreateDirectory(sdir);
                  List<Type> types=new List<Type>();
                  try { types.AddRange(A.GetTypes()); }
                  catch(ReflectionTypeLoadException ex){ types.AddRange(ex.Types.Where(x=>x!=null)); File.WriteAllLines(Path.Combine(OutDir,"TYPE_LOAD_ERRORS.txt"),ex.LoaderExceptions.Select(x=>x.ToString()).ToArray()); }
                  DumpPInvokePointers(types);

                  int pri=0, stubs=0, fail=0;
                  foreach(Type t in types) {
                      MethodBase[] ms;
                      try {
                          List<MethodBase> q=new List<MethodBase>();
                          q.AddRange(t.GetMethods(BindingFlags.Instance|BindingFlags.Static|BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.DeclaredOnly).Cast<MethodBase>());
                          q.AddRange(t.GetConstructors(BindingFlags.Instance|BindingFlags.Static|BindingFlags.Public|BindingFlags.NonPublic).Cast<MethodBase>());
                          ms=q.ToArray();
                      } catch { continue; }
                      foreach(MethodBase m in ms) {
                          try {
                              if (m.IsAbstract || (m.Attributes & MethodAttributes.PinvokeImpl)!=0 || m.ContainsGenericParameters) continue;
                              byte[] il=GetIL(m);
                              if(PriorityType(t)) { DumpMethod(m,pdir,true); pri++; }
                              else if(il!=null && il.Length<=8 && stubs<8000) { DumpMethod(m,sdir,true); stubs++; }
                          } catch { fail++; }
                      }
                  }
                  File.WriteAllText(Path.Combine(OutDir,"COUNTS.txt"),"priority="+pri+Environment.NewLine+"stub_methods="+stubs+Environment.NewLine+"failures="+fail+Environment.NewLine);
                  Console.WriteLine("priority="+pri+" stubs="+stubs+" failures="+fail);
                  return 0;
              }
          }
          '@ | Set-Content "$root\probe\RuntimeProbe.cs" -Encoding UTF8

          $csc = "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { throw ".NET Framework x86 csc.exe not found" }
          & $csc /nologo /optimize+ /platform:x86 /target:exe `
            /out:"$root\probe\RuntimeProbe.exe" `
            "$root\probe\RuntimeProbe.cs" `
            2>&1 | Tee-Object -FilePath "$root\evidence\PROBE_BUILD.log"
          if ($LASTEXITCODE -ne 0) { throw "RuntimeProbe compile failed" }

      - name: Execute protected-body materialization probe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $root = "$env:RUNNER_TEMP\bpv8"
          $out = "$root\evidence\runtime"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & "$root\probe\RuntimeProbe.exe" "$root\client\official.exe" $out `
            *> "$root\evidence\RUNTIME_PROBE.log"
          "exit_code=$LASTEXITCODE" | Set-Content "$root\evidence\RUNTIME_PROBE_EXIT.txt"
          Get-Content "$root\evidence\RUNTIME_PROBE.log" -Tail 200
          $global:LASTEXITCODE = 0
          exit 0

      - name: Correlate protector address map, PInvoke stubs, and native bodies V8.5
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $root = "$env:RUNNER_TEMP\bpv8"
          python -m pip install --disable-pip-version-check --quiet capstone
          @'
          from pathlib import Path
          import hashlib, json, os, re, struct
          try:
              from capstone import Cs, CS_ARCH_X86, CS_MODE_32
              from capstone.x86_const import X86_OP_IMM
          except Exception:
              Cs=None; X86_OP_IMM=None

          root=Path(os.environ['RUNNER_TEMP'])/'bpv8'
          ev=root/'evidence'; rt=ev/'runtime'; pri=rt/'priority'; stubs=rt/'all_stubs'; maps=rt/'map_native'; pin=rt/'pinvoke'
          md=Cs(CS_ARCH_X86,CS_MODE_32) if Cs else None
          if md: md.detail=True

          def intval(s):
              try: return int(s,0)
              except: return None

          def kvfile(p):
              d={}
              if not p.exists(): return d
              for line in p.read_text(errors='replace').splitlines():
                  if '=' in line:
                      k,v=line.split('=',1); d[k.strip()]=v.strip()
              return d

          module_base=intval((rt/'MODULE_BASE.txt').read_text(errors='replace').strip()) if (rt/'MODULE_BASE.txt').exists() else None

          # Address map emitted directly by the protector static dictionary.
          amap=[]
          if (rt/'MAP_ADDRESS_INDEX.tsv').exists():
              for line in (rt/'MAP_ADDRESS_INDEX.tsv').read_text(errors='replace').splitlines():
                  q=line.split('\t',4)
                  if len(q)>=4:
                      try: amap.append((int(q[0]),q[1],q[2],q[3],q[4] if len(q)>4 else ''))
                      except: pass
          map_addrs=sorted({x[0] for x in amap})

          # P/Invoke precode/native pointers, including HidD_* and ReadFile/WriteFile.
          pinrows=[]; pin_targets={}
          pp=rt/'PINVOKE_POINTERS.txt'
          if pp.exists():
              rx=re.compile(r'token=(0x[0-9A-Fa-f]+) type=(.*?) method=(\S+) dll=(\S*) entry=(\S*) function_ptr=(0x[0-9A-Fa-f]+) jump_target=(0x[0-9A-Fa-f]+)')
              for line in pp.read_text(errors='replace').splitlines():
                  m=rx.search(line)
                  if not m: continue
                  tok,typ,meth,dll,entry,fp,jt=m.groups(); fpi=int(fp,16); jti=int(jt,16)
                  row={'token':tok,'type':typ,'method':meth,'dll':dll,'entry':entry,'fp':fpi,'jt':jti}
                  pinrows.append(row)
                  for addr,kind in ((fpi,'fp'),(jti,'jt')):
                      if addr: pin_targets.setdefault(addr,[]).append((entry or meth,kind,tok))

          # Method-to-protector-map correlation.  The V8.2 map keys cluster around
          # the loaded module address, so exact/near address matches are much more
          # useful than searching MAP lines for the word "Hid".
          methods=[]
          for p in ([*sorted(pri.glob('*.txt')),*sorted(stubs.glob('*.txt'))] if (pri.exists() or stubs.exists()) else []):
              d=kvfile(p); fp=intval(d.get('function_ptr','')); jt=intval(d.get('jump_target',''))
              if not d.get('token'): continue
              methods.append({'file':p.name,'token':d.get('token',''),'type':d.get('type',''),'method':d.get('method',''),'fp':fp,'jt':jt})

          def nearest(addr):
              if addr is None or not map_addrs: return (None,None)
              import bisect
              i=bisect.bisect_left(map_addrs,addr); cand=[]
              if i<len(map_addrs): cand.append(map_addrs[i])
              if i: cand.append(map_addrs[i-1])
              if not cand: return (None,None)
              k=min(cand,key=lambda x:abs(x-addr)); return k,abs(k-addr)

          cor=[]
          for m in methods:
              for kind in ('fp','jt'):
                  a=m[kind]
                  if not a: continue
                  k,delta=nearest(a)
                  if k is not None:
                      cor.append((delta,kind,a,k,m['token'],m['type'],m['method'],m['file']))
          cor.sort(key=lambda x:(0 if re.search(r'Hid|UFE|Upgrade|Firmware|Flash|Boot|Communication|DeviceCommunication',x[5]+' '+x[6],re.I) else 1,x[0],x[5],x[6]))
          with (ev/'METHOD_MAP_CORRELATION.tsv').open('w',encoding='utf-8') as f:
              f.write('delta\tptr_kind\tmethod_ptr\tmap_key\ttoken\ttype\tmethod\tfile\n')
              for r in cor:
                  f.write(f'{r[0]}\t{r[1]}\t0x{r[2]:08X}\t0x{r[3]:08X}\t{r[4]}\t{r[5]}\t{r[6]}\t{r[7]}\n')

          # Build code-region list with correct virtual base addresses.
          regions=[]
          for p in sorted(maps.glob('map_0x*.bin')) if maps.exists() else []:
              m=re.search(r'map_0x([0-9A-Fa-f]+)\.bin$',p.name)
              if m: regions.append(('map',p,int(m.group(1),16)))
          for p in sorted(pri.glob('*.native.bin')) if pri.exists() else []:
              meta=Path(str(p).replace('.native.bin','.txt')); d=kvfile(meta); base=intval(d.get('function_ptr',''))
              if base: regions.append(('priority_native',p,base))
          for p in sorted(pri.glob('*.target.bin')) if pri.exists() else []:
              meta=Path(str(p).replace('.target.bin','.txt')); d=kvfile(meta); base=intval(d.get('jump_target',''))
              if base: regions.append(('priority_target',p,base))

          for p in sorted(stubs.glob('*.native.bin')) if stubs.exists() else []:
              meta=Path(str(p).replace('.native.bin','.txt')); d=kvfile(meta); base=intval(d.get('function_ptr',''))
              if base: regions.append(('stub_native',p,base))
          for p in sorted(stubs.glob('*.target.bin')) if stubs.exists() else []:
              meta=Path(str(p).replace('.target.bin','.txt')); d=kvfile(meta); base=intval(d.get('jump_target',''))
              if base: regions.append(('stub_target',p,base))

          consts={0xA5:'A5',0x5A:'5A',0x55:'55',0xAA:'AA',0x6324:'VID6324',0x1719:'PID1719',0x2244:'PID2244'}
          sem=[]; xrefs=[]; rawhits=[]
          for kind,p,base in regions:
              try: b=p.read_bytes()
              except: continue
              # raw constants remain useful, but semantic immediates catch e.g.
              # 'mov byte ptr [eax+N], 0xA5' where A5/5A are not adjacent bytes.
              for label,pat in [('A5_5A',b'\xA5\x5A'),('55_AA',b'\x55\xAA'),('VID6324',struct.pack('<H',0x6324)),('PID1719',struct.pack('<H',0x1719)),('PID2244',struct.pack('<H',0x2244))]:
                  if pat in b: rawhits.append((kind,p.name,base,label,b.find(pat)))
              if not md: continue
              insns=list(md.disasm(b,base))[:300]
              imm_events=[]
              lines=[]
              for ins in insns:
                  lines.append(f'{ins.address:08X}  {ins.mnemonic:8s} {ins.op_str}')
                  try:
                      for op in ins.operands:
                          if op.type==X86_OP_IMM:
                              val=op.imm & 0xffffffff
                              if val in consts: imm_events.append((ins.address,consts[val],ins.mnemonic,ins.op_str))
                              if ins.mnemonic in ('call','jmp'):
                                  for tgt,names in pin_targets.items():
                                      if val==tgt or abs(val-tgt)<=8:
                                          for nm,pk,ptok in names:
                                              xrefs.append((kind,p.name,ins.address,ins.mnemonic,val,tgt,nm,pk,ptok))
                  except Exception: pass
              Path(str(p)+'.asm.txt').write_text('\n'.join(lines)+'\n',errors='replace')
              if imm_events:
                  for e in imm_events: sem.append((kind,p.name,*e))
                  # Pair/window evidence for command construction.
                  for i,e in enumerate(imm_events):
                      for j in range(i+1,min(len(imm_events),i+12)):
                          e2=imm_events[j]
                          names={e[1],e2[1]}
                          if names=={'A5','5A'} or names=={'55','AA'}:
                              sem.append((kind,p.name,e[0],'+'.join(sorted(names)),'WINDOW',f'{e[2]} {e[3]} || {e2[2]} {e2[3]}'))

          with (ev/'PINVOKE_CALL_XREFS.tsv').open('w',encoding='utf-8') as f:
              f.write('region_kind\tfile\tcall_address\top\tresolved_target\tpinvoke_ptr\tentry\tptr_kind\ttoken\n')
              for r in xrefs: f.write(f'{r[0]}\t{r[1]}\t0x{r[2]:08X}\t{r[3]}\t0x{r[4]:08X}\t0x{r[5]:08X}\t{r[6]}\t{r[7]}\t{r[8]}\n')
          with (ev/'SEMANTIC_IMMEDIATE_HITS.tsv').open('w',encoding='utf-8') as f:
              f.write('region_kind\tfile\taddress\tconstant\tmnemonic\top_str\n')
              for r in sem: f.write(f'{r[0]}\t{r[1]}\t0x{r[2]:08X}\t{r[3]}\t{r[4]}\t{r[5]}\n')
          with (ev/'RAW_CONSTANT_HITS.tsv').open('w',encoding='utf-8') as f:
              f.write('region_kind\tfile\tbase\tpattern\toffset\n')
              for r in rawhits: f.write(f'{r[0]}\t{r[1]}\t0x{r[2]:08X}\t{r[3]}\t0x{r[4]:X}\n')

          # Search large protector blobs as ASCII and UTF-16LE.  V8.2 exposed a
          # 76 KB byte[] field; this catches hidden API/protocol names if present.
          keywords=['HidD_SetFeature','HidD_SetOutputReport','HidD_GetInputReport','ReadFile','WriteFile','SetFeature','flash','firmware','upgrade','boot','6324','1719','2244']
          blobhits=[]
          for p in rt.glob('field_*.bin'):
              b=p.read_bytes()
              for kw in keywords:
                  for enc in ('ascii','utf-16le'):
                      pat=kw.encode(enc,errors='ignore'); off=b.lower().find(pat.lower())
                      if off>=0: blobhits.append((p.name,kw,enc,off))
          with (ev/'FIELD_BLOB_STRING_HITS.tsv').open('w',encoding='utf-8') as f:
              f.write('file\tkeyword\tencoding\toffset\n')
              for r in blobhits: f.write(f'{r[0]}\t{r[1]}\t{r[2]}\t0x{r[3]:X}\n')

          exact=sum(1 for r in cor if r[0]==0)
          near=sum(1 for r in cor if r[0]<=32)
          hidnear=sum(1 for r in cor if r[0]<=32 and re.search(r'Hid|UFE|Upgrade|Firmware|Flash|Boot|Communication|DeviceCommunication',r[5]+' '+r[6],re.I))
          mapobj=(rt/'MAP_OBJECTS.txt').read_text(errors='replace') if (rt/'MAP_OBJECTS.txt').exists() else ''
          obj_signal=[x for x in mapobj.splitlines() if re.search(r'Method=|Delegate=|IntPtr=|Byte\[\]|DynamicMethod|RuntimeMethod',x,re.I)]
          (ev/'MAP_OBJECT_SIGNAL_LINES.txt').write_text('\n'.join(obj_signal[:20000])+'\n' if obj_signal else 'NO_OBJECT_SIGNAL_LINES\n',errors='replace')

          status={
              'module_base': None if module_base is None else f'0x{module_base:08X}',
              'map_entries':len(amap),'map_native_dumps':len(list(maps.glob('*.bin'))) if maps.exists() else 0,
              'priority_methods':len(methods),'pinvoke_methods':len(pinrows),
              'method_map_exact':exact,'method_map_near_le32':near,'priority_hid_near_le32':hidnear,
              'pinvoke_direct_xrefs':len(xrefs),'semantic_immediate_hits':len(sem),'raw_constant_hits':len(rawhits),
              'field_blob_string_hits':len(blobhits),'object_signal_lines':len(obj_signal),
              'boot_entry_proven':False,'flash_read_protocol_proven':False,'flash_write_enabled':False,'FLASH_ALLOWED':False
          }
          (ev/'V8_5_STATUS.json').write_text(json.dumps(status,indent=2)+'\n')
          report=[
              '# BP1048P4 V8.5 protector-map correlation', '',
              '## Why V8.5',
              '- V8.2 safely recovered hundreds of native method bodies and 1,824 protector-map entries, but its MAP scorer only searched text labels.',
              '- V8.5 treats numeric protector-map keys as candidate runtime addresses, dumps those regions, inspects the opaque map-value objects, and correlates them to method/JIT pointers.',
              '- V8.5 also resolves P/Invoke precode pointers and looks for native call/jump xrefs plus semantic immediate construction of A5/5A and 55/AA.', '',
              '## Results',
              f'- module base: **{status["module_base"]}**',
              f'- protector address entries: **{status["map_entries"]}**',
              f'- safe map-address native dumps: **{status["map_native_dumps"]}**',
              f'- priority methods: **{status["priority_methods"]}**',
              f'- P/Invoke methods captured: **{status["pinvoke_methods"]}**',
              f'- exact method-pointer ↔ map-key matches: **{exact}**',
              f'- near matches (<=32 bytes): **{near}**',
              f'- HID/upgrade priority near matches: **{hidnear}**',
              f'- direct call/jump xrefs to P/Invoke stubs: **{len(xrefs)}**',
              f'- semantic immediate hits: **{len(sem)}**',
              f'- raw constant hits: **{len(rawhits)}**',
              f'- protector blob keyword hits: **{len(blobhits)}**',
              f'- opaque map-object signal lines: **{len(obj_signal)}**', '',
              '## Gate',
              '- CI has no physical USB device.',
              '- No HID report is intentionally sent.',
              '- No flash read/erase/write operation is executed.',
              '- `FLASH_ALLOWED=NO`', '',
              '## Highest-value evidence',
              '- `METHOD_MAP_CORRELATION.tsv`',
              '- `PINVOKE_CALL_XREFS.tsv`',
              '- `SEMANTIC_IMMEDIATE_HITS.tsv`',
              '- `runtime/MAP_OBJECTS.txt` and `MAP_OBJECT_SIGNAL_LINES.txt`',
              '- `runtime/map_native/*.bin.asm.txt`'
          ]
          (ev/'V8_5_REPORT.md').write_text('\n'.join(report)+'\n')
          '@ | Set-Content "$root\analyze_v83.py" -Encoding UTF8
          python "$root\analyze_v83.py" *> "$root\evidence\ANALYZE_V8_5.log"
          "analyze_exit=$LASTEXITCODE" | Set-Content "$root\evidence\ANALYZE_V8_5_EXIT.txt"

          if (Test-Path "$root\evidence\V8_5_REPORT.md") { Get-Content "$root\evidence\V8_5_REPORT.md" | Add-Content $env:GITHUB_STEP_SUMMARY }
          "" | Add-Content $env:GITHUB_STEP_SUMMARY
          "### Top method ↔ protector-map correlations" | Add-Content $env:GITHUB_STEP_SUMMARY
          if (Test-Path "$root\evidence\METHOD_MAP_CORRELATION.tsv") { Get-Content "$root\evidence\METHOD_MAP_CORRELATION.tsv" -TotalCount 100 | Add-Content $env:GITHUB_STEP_SUMMARY }
          "" | Add-Content $env:GITHUB_STEP_SUMMARY
          "### Direct PInvoke call/jump xrefs" | Add-Content $env:GITHUB_STEP_SUMMARY
          if (Test-Path "$root\evidence\PINVOKE_CALL_XREFS.tsv") { Get-Content "$root\evidence\PINVOKE_CALL_XREFS.tsv" -TotalCount 100 | Add-Content $env:GITHUB_STEP_SUMMARY }
          "" | Add-Content $env:GITHUB_STEP_SUMMARY
          "### Semantic protocol constants" | Add-Content $env:GITHUB_STEP_SUMMARY
          if (Test-Path "$root\evidence\SEMANTIC_IMMEDIATE_HITS.tsv") { Get-Content "$root\evidence\SEMANTIC_IMMEDIATE_HITS.tsv" -TotalCount 120 | Add-Content $env:GITHUB_STEP_SUMMARY }
          "" | Add-Content $env:GITHUB_STEP_SUMMARY
          "### Opaque map-object signals" | Add-Content $env:GITHUB_STEP_SUMMARY
          if (Test-Path "$root\evidence\MAP_OBJECT_SIGNAL_LINES.txt") { Get-Content "$root\evidence\MAP_OBJECT_SIGNAL_LINES.txt" -TotalCount 120 | Add-Content $env:GITHUB_STEP_SUMMARY }
          $global:LASTEXITCODE = 0
          exit 0

      - name: Map protector keys to PE MethodDef RVAs and protected body blobs V8.5
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $root = "$env:RUNNER_TEMP\bpv8"
          python -m pip install --disable-pip-version-check --quiet dnfile
          @'
          from pathlib import Path
          import bisect, hashlib, json, os, re, struct
          try:
              import dnfile
          except Exception:
              dnfile=None

          root=Path(os.environ['RUNNER_TEMP'])/'bpv8'
          ev=root/'evidence'; rt=ev/'runtime'; exe=root/'client'/'official.exe'

          def intval(s):
              try: return int(str(s).strip(),0)
              except: return None

          module_base=intval((rt/'MODULE_BASE.txt').read_text(errors='replace').strip()) if (rt/'MODULE_BASE.txt').exists() else None

          # Identity by metadata token from every materialized protected method.
          identities={}
          for d in (rt/'priority',rt/'all_stubs'):
              if not d.exists(): continue
              for p in d.glob('*.txt'):
                  q={}
                  for line in p.read_text(errors='replace').splitlines():
                      if '=' in line:
                          k,v=line.split('=',1); q[k.strip()]=v.strip()
                  tok=q.get('token','').upper()
                  if tok:
                      identities[tok]=(q.get('type',''),q.get('method',''),p.name,q.get('il_before',''),q.get('il_after',''))

          # MethodDef RVA table from the original protected PE.  This is the key
          # V8.5 correction: protector Hashtable keys are image addresses/RVAs,
          # not JIT function pointers, so V8.3 pointer-to-key correlation was the
          # wrong coordinate system.
          method_rows=[]
          dn_error=''
          if dnfile and exe.exists():
              try:
                  pe=dnfile.dnPE(str(exe))
                  rows=getattr(getattr(getattr(pe,'net',None),'mdtables',None),'MethodDef',None)
                  rows=getattr(rows,'rows',[]) or []
                  for i,row in enumerate(rows,1):
                      try: rva=int(row.Rva)
                      except: rva=0
                      if not rva: continue
                      tok=0x06000000|i
                      try: nm=str(row.Name)
                      except: nm=''
                      method_rows.append((rva,tok,nm))
              except Exception as ex:
                  dn_error=repr(ex)
          method_rows.sort()
          rvas=[x[0] for x in method_rows]

          def nearest_method(rva):
              if not rvas: return None
              i=bisect.bisect_left(rvas,rva); cand=[]
              if i<len(rvas): cand.append(method_rows[i])
              if i: cand.append(method_rows[i-1])
              if not cand: return None
              return min(cand,key=lambda x:abs(x[0]-rva))

          # Protector address map.
          amap=[]
          p=rt/'MAP_ADDRESS_INDEX.tsv'
          if p.exists():
              for line in p.read_text(errors='replace').splitlines():
                  q=line.split('\t',4)
                  if len(q)<4: continue
                  try: key=int(q[0])
                  except: continue
                  rva=(key-module_base) if module_base is not None else None
                  amap.append((key,rva,q[3],q[4] if len(q)>4 else ''))

          # Blob index emitted per opaque protector map object.
          blobs_by_key={}; blob_index=rt/'MAP_OBJECT_BLOB_INDEX.tsv'
          if blob_index.exists():
              lines=blob_index.read_text(errors='replace').splitlines()
              for line in lines[1:]:
                  q=line.split('\t',7)
                  if len(q)<7: continue
                  key=intval(q[0]); length=intval(q[5])
                  if key is None: continue
                  blobs_by_key.setdefault(key,[]).append({'rva_text':q[1],'field_token':q[2],'field_name':q[3],'path':q[4],'length':length,'file':q[6],'head':q[7] if len(q)>7 else ''})

          rows=[]
          for key,rva,vtp,val in amap:
              if rva is None: continue
              mm=nearest_method(rva)
              if not mm: continue
              mrva,tok,nm=mm; delta=rva-mrva
              tokhex=f'0x{tok:08X}'.upper()
              typ,meth,meta,ilb,ila=identities.get(tokhex,('','', '', '', ''))
              rows.append({'abs_delta':abs(delta),'delta':delta,'key':key,'map_rva':rva,'method_rva':mrva,'token':tokhex,'metadata_name':nm,'type':typ,'method':meth,'meta_file':meta,'value_type':vtp,'blobs':blobs_by_key.get(key,[])})
          rows.sort(key=lambda x:(x['abs_delta'],0 if re.search(r'Hid|UFE|Upgrade|Firmware|Flash|Boot|Communication|DeviceCommunication',x['type']+' '+x['method'],re.I) else 1,x['token']))

          with (ev/'RVA_METHOD_MAP.tsv').open('w',encoding='utf-8') as f:
              f.write('abs_delta\tdelta\tmap_key\tmap_rva\tmethod_rva\ttoken\ttype\tmethod\tmetadata_name\tblob_count\tvalue_type\n')
              for x in rows:
                  f.write(f"{x['abs_delta']}\t{x['delta']}\t0x{x['key']:08X}\t0x{x['map_rva']:08X}\t0x{x['method_rva']:08X}\t{x['token']}\t{x['type']}\t{x['method']}\t{x['metadata_name']}\t{len(x['blobs'])}\t{x['value_type']}\n")

          # Search each map-object body for exact metadata tokens of native/PInvoke
          # methods and for protocol constants.  Exact 4-byte token hits are much
          # stronger than the overlapping A5 disassembly noise seen in V8.3.
          pin_tokens={}
          pp=rt/'PINVOKE_POINTERS.txt'
          if pp.exists():
              rx=re.compile(r'token=(0x[0-9A-Fa-f]+).*?entry=(\S*)')
              for line in pp.read_text(errors='replace').splitlines():
                  m=rx.search(line)
                  if m:
                      pin_tokens[int(m.group(1),16)]=m.group(2)
          body_hits=[]; protocol_hits=[]
          blobdir=rt/'map_object_blobs'
          for key,items in blobs_by_key.items():
              for bi in items:
                  bp=blobdir/bi['file']
                  if not bp.exists(): continue
                  b=bp.read_bytes()
                  for tok,entry in pin_tokens.items():
                      pat=struct.pack('<I',tok); off=0
                      while True:
                          j=b.find(pat,off)
                          if j<0: break
                          body_hits.append((key,bi['file'],j,tok,entry,'token32le'))
                          off=j+1
                  for label,pat in [('A5_5A',b'\xA5\x5A'),('55_AA',b'\x55\xAA'),('VID6324',struct.pack('<H',0x6324)),('PID1719',struct.pack('<H',0x1719)),('PID2244',struct.pack('<H',0x2244))]:
                      off=0
                      while True:
                          j=b.find(pat,off)
                          if j<0: break
                          protocol_hits.append((key,bi['file'],j,label))
                          off=j+1
          with (ev/'BODY_PINVOKE_TOKEN_HITS.tsv').open('w',encoding='utf-8') as f:
              f.write('map_key\tfile\toffset\ttoken\tentry\tencoding\n')
              for r in body_hits: f.write(f'0x{r[0]:08X}\t{r[1]}\t0x{r[2]:X}\t0x{r[3]:08X}\t{r[4]}\t{r[5]}\n')
          with (ev/'BODY_PROTOCOL_HITS.tsv').open('w',encoding='utf-8') as f:
              f.write('map_key\tfile\toffset\tpattern\n')
              for r in protocol_hits: f.write(f'0x{r[0]:08X}\t{r[1]}\t0x{r[2]:X}\t{r[3]}\n')

          # Human-focused body report: exact/near RVA matches for updater/HID code,
          # including actual blob bytes rather than only object lengths.
          high=[]
          for x in rows:
              sig=re.search(r'Hid|UFE|Upgrade|Firmware|Flash|Boot|Communication|DeviceCommunication|HardwareCommand',x['type']+' '+x['method']+' '+x['metadata_name'],re.I)
              if x['abs_delta']<=32 and (sig or x['blobs']): high.append(x)
          lines=[]
          for x in high[:300]:
              lines.append(f"===== delta={x['delta']} key=0x{x['key']:08X} map_rva=0x{x['map_rva']:X} method_rva=0x{x['method_rva']:X} token={x['token']} {x['type']}::{x['method'] or x['metadata_name']} =====")
              if not x['blobs']:
                  lines.append('NO_MAP_OBJECT_BLOB')
              for bi in x['blobs'][:8]:
                  bp=blobdir/bi['file']; data=bp.read_bytes() if bp.exists() else b''
                  lines.append(f"BLOB field={bi['field_name']} len={len(data)} file={bi['file']} sha256={hashlib.sha256(data).hexdigest() if data else ''}")
                  lines.append('HEX '+data[:512].hex(' ').upper())
              lines.append('')
          (ev/'HIGH_SIGNAL_RVA_BODIES.txt').write_text('\n'.join(lines)+'\n' if lines else 'NO_HIGH_SIGNAL_RVA_BODY_MATCHES\n',errors='replace')

          exact=sum(1 for x in rows if x['delta']==0)
          near=sum(1 for x in rows if x['abs_delta']<=16)
          hid_exact=sum(1 for x in rows if x['abs_delta']<=16 and re.search(r'Hid|UFE|Upgrade|Firmware|Flash|Boot|Communication|DeviceCommunication',x['type']+' '+x['method']+' '+x['metadata_name'],re.I))
          setfeature_hits=sum(1 for r in body_hits if r[4]=='HidD_SetFeature')
          setoutput_hits=sum(1 for r in body_hits if r[4]=='HidD_SetOutputReport')
          getinput_hits=sum(1 for r in body_hits if r[4]=='HidD_GetInputReport')
          status={'module_base':None if module_base is None else f'0x{module_base:08X}','methoddef_rows':len(method_rows),'map_entries':len(amap),'map_object_blobs':sum(len(v) for v in blobs_by_key.values()),'rva_exact':exact,'rva_near_le16':near,'hid_upgrade_near_le16':hid_exact,'body_pinvoke_token_hits':len(body_hits),'body_setfeature_token_hits':setfeature_hits,'body_setoutput_token_hits':setoutput_hits,'body_getinput_token_hits':getinput_hits,'body_protocol_hits':len(protocol_hits),'dnfile_error':dn_error,'boot_entry_proven':False,'flash_read_protocol_proven':False,'FLASH_ALLOWED':False}
          (ev/'V8_5_RVA_STATUS.json').write_text(json.dumps(status,indent=2)+'\n')
          report=['# BP1048P4 V8.5 MethodDef-RVA / protected-body correlation','',
          '## Main correction','- V8.3 confirmed real native xrefs for `Hid_Write -> HidD_SetOutputReport`, `Hid_Read -> HidD_GetInputReport`, and `Hid_getFeature -> HidD_GetInputReport`.','- Its protector-map keys did not correlate with JIT pointers because the keys are loaded-image addresses. V8.5 compares `(map_key - module_base)` against original PE MethodDef RVAs instead.','- V8.5 also dumps the opaque `ooDeh1nBCT` byte arrays per map key and searches those actual bodies for P/Invoke metadata tokens.','',
          '## Results',f'- MethodDef RVA rows: **{len(method_rows)}**',f'- protector map entries: **{len(amap)}**',f'- protected map-object byte blobs: **{status["map_object_blobs"]}**',f'- exact map-RVA ↔ MethodDef-RVA matches: **{exact}**',f'- near matches <=16 bytes: **{near}**',f'- HID/upgrade near matches <=16 bytes: **{hid_exact}**',f'- P/Invoke metadata-token hits inside protected bodies: **{len(body_hits)}**',f'- `HidD_SetFeature` body token hits: **{setfeature_hits}**',f'- `HidD_SetOutputReport` body token hits: **{setoutput_hits}**',f'- `HidD_GetInputReport` body token hits: **{getinput_hits}**',f'- raw protocol-pattern hits inside mapped protected bodies: **{len(protocol_hits)}**','',
          '## Interpretation rule','- Repeated `A5` hits from overlapping arbitrary map-address windows are **not** treated as protocol proof.','- Priority is given to exact/near MethodDef-RVA mapping plus body-token/xref evidence.','',
          '## Gate','- no physical USB device','- no HID command sent','- no flash read/erase/write command sent','- `FLASH_ALLOWED=NO`']
          (ev/'V8_5_RVA_REPORT.md').write_text('\n'.join(report)+'\n')
          '@ | Set-Content "$root\analyze_v84_rva.py" -Encoding UTF8
          python "$root\analyze_v84_rva.py" *> "$root\evidence\ANALYZE_V8_5_RVA.log"
          "analyze_exit=$LASTEXITCODE" | Set-Content "$root\evidence\ANALYZE_V8_5_RVA_EXIT.txt"

          if (Test-Path "$root\evidence\V8_5_RVA_REPORT.md") { Get-Content "$root\evidence\V8_5_RVA_REPORT.md" | Add-Content $env:GITHUB_STEP_SUMMARY }
          "" | Add-Content $env:GITHUB_STEP_SUMMARY
          "### High-signal MethodDef-RVA body matches" | Add-Content $env:GITHUB_STEP_SUMMARY
          if (Test-Path "$root\evidence\HIGH_SIGNAL_RVA_BODIES.txt") { Get-Content "$root\evidence\HIGH_SIGNAL_RVA_BODIES.txt" -TotalCount 180 | Add-Content $env:GITHUB_STEP_SUMMARY }
          "" | Add-Content $env:GITHUB_STEP_SUMMARY
          "### Protected-body PInvoke token hits" | Add-Content $env:GITHUB_STEP_SUMMARY
          if (Test-Path "$root\evidence\BODY_PINVOKE_TOKEN_HITS.tsv") { Get-Content "$root\evidence\BODY_PINVOKE_TOKEN_HITS.tsv" -TotalCount 160 | Add-Content $env:GITHUB_STEP_SUMMARY }
          $global:LASTEXITCODE = 0
          exit 0

      - name: Decode reachable protected IL CFG and reject dead-byte protocol false positives V8.5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "$env:RUNNER_TEMP\bpv8"
          $ev = "$root\evidence"
          $rt = "$ev\runtime"
          $src = "$root\IlCfgProbe.cs"
          $exe = "$root\IlCfgProbe.exe"

          @'
          using System;
          using System.IO;
          using System.Text;
          using System.Linq;
          using System.Collections.Generic;
          using System.Reflection;
          using System.Reflection.Emit;
          using System.Text.RegularExpressions;

          class IlCfgProbe {
            class I {
              public int Off, Next;
              public OpCode Op;
              public long Num;
              public bool HasNum;
              public int[] Targets = new int[0];
            }
            class M {
              public string Token="", Name="", Delta="", Type="";
            }
            static Dictionary<ushort,OpCode> Ops = new Dictionary<ushort,OpCode>();
            static Dictionary<int,string> Pin = new Dictionary<int,string>();
            static Dictionary<long,string> ConstNames = new Dictionary<long,string>{
              {0xA5,"A5"},{0x5A,"5A"},{0x55,"55"},{0xAA,"AA"},
              {0x6324,"VID6324"},{0x1719,"PID1719"},{0x2244,"PID2244"}
            };

            static int I32(byte[] b,int p){ return BitConverter.ToInt32(b,p); }
            static long I64(byte[] b,int p){ return BitConverter.ToInt64(b,p); }
            static int U16(byte[] b,int p){ return BitConverter.ToUInt16(b,p); }

            static I Decode(byte[] b,int off) {
              if(off<0 || off>=b.Length) return null;
              int p=off; ushort code;
              byte x=b[p++];
              if(x==0xFE){ if(p>=b.Length)return null; code=(ushort)(0xFE00|b[p++]); }
              else code=x;
              OpCode op;
              if(!Ops.TryGetValue(code,out op)) return null;
              I z=new I(); z.Off=off; z.Op=op;
              try {
                switch(op.OperandType){
                  case OperandType.InlineNone: break;
                  case OperandType.ShortInlineBrTarget: {
                    sbyte d=unchecked((sbyte)b[p]); p++; z.Targets=new[]{p+d}; break; }
                  case OperandType.InlineBrTarget: {
                    int d=I32(b,p); p+=4; z.Targets=new[]{p+d}; break; }
                  case OperandType.ShortInlineI: z.Num=unchecked((sbyte)b[p]); z.HasNum=true; p++; break;
                  case OperandType.InlineI: z.Num=I32(b,p); z.HasNum=true; p+=4; break;
                  case OperandType.InlineI8: z.Num=I64(b,p); z.HasNum=true; p+=8; break;
                  case OperandType.ShortInlineR: p+=4; break;
                  case OperandType.InlineR: p+=8; break;
                  case OperandType.InlineString:
                  case OperandType.InlineField:
                  case OperandType.InlineMethod:
                  case OperandType.InlineSig:
                  case OperandType.InlineTok:
                  case OperandType.InlineType:
                    z.Num=(uint)I32(b,p); z.HasNum=true; p+=4; break;
                  case OperandType.ShortInlineVar: z.Num=b[p]; z.HasNum=true; p++; break;
                  case OperandType.InlineVar: z.Num=U16(b,p); z.HasNum=true; p+=2; break;
                  case OperandType.InlineSwitch: {
                    int n=I32(b,p); p+=4;
                    if(n<0 || n>100000 || p+4L*n>b.Length) return null;
                    int basep=p+4*n; int[] tt=new int[n];
                    for(int i=0;i<n;i++) tt[i]=basep+I32(b,p+4*i);
                    p=basep; z.Targets=tt; break; }
                  default: return null;
                }
              } catch { return null; }
              if(p<0 || p>b.Length) return null;
              z.Next=p; return z;
            }

            static long? Ldc(I i){
              short v=i.Op.Value;
              if(v==OpCodes.Ldc_I4_M1.Value) return -1;
              if(v==OpCodes.Ldc_I4_0.Value) return 0;
              if(v==OpCodes.Ldc_I4_1.Value) return 1;
              if(v==OpCodes.Ldc_I4_2.Value) return 2;
              if(v==OpCodes.Ldc_I4_3.Value) return 3;
              if(v==OpCodes.Ldc_I4_4.Value) return 4;
              if(v==OpCodes.Ldc_I4_5.Value) return 5;
              if(v==OpCodes.Ldc_I4_6.Value) return 6;
              if(v==OpCodes.Ldc_I4_7.Value) return 7;
              if(v==OpCodes.Ldc_I4_8.Value) return 8;
              if(v==OpCodes.Ldc_I4_S.Value || v==OpCodes.Ldc_I4.Value) return i.Num;
              return null;
            }

            static Dictionary<long,M> LoadMap(string p){
              var d=new Dictionary<long,M>(); if(!File.Exists(p))return d;
              var lines=File.ReadAllLines(p); if(lines.Length<2)return d;
              var h=lines[0].Split('\t');
              Func<string,int> ix=(n)=>Array.IndexOf(h,n);
              int ik=ix("map_key"),it=ix("token"),inm=ix("metadata_name"),im=ix("method"),id=ix("delta"),ity=ix("type");
              foreach(var line in lines.Skip(1)){
                var q=line.Split('\t'); if(ik<0||ik>=q.Length)continue;
                long k; if(!TryHex(q[ik],out k))continue;
                var m=new M();
                if(it>=0&&it<q.Length)m.Token=q[it];
                string n=""; if(im>=0&&im<q.Length)n=q[im]; if(String.IsNullOrEmpty(n)&&inm>=0&&inm<q.Length)n=q[inm]; m.Name=n;
                if(id>=0&&id<q.Length)m.Delta=q[id]; if(ity>=0&&ity<q.Length)m.Type=q[ity];
                M old; if(!d.TryGetValue(k,out old) || AbsInt(m.Delta)<AbsInt(old.Delta))d[k]=m;
              }
              return d;
            }
            static int AbsInt(string s){ int x; return Int32.TryParse(s,out x)?Math.Abs(x):999999; }
            static bool TryHex(string s,out long v){ s=s.Trim(); if(s.StartsWith("0x",StringComparison.OrdinalIgnoreCase))s=s.Substring(2); return Int64.TryParse(s,System.Globalization.NumberStyles.HexNumber,null,out v); }
            static void LoadPin(string p){
              if(!File.Exists(p))return;
              var rx=new Regex(@"token=(0x[0-9A-Fa-f]+).*?entry=(\S*)");
              foreach(var l in File.ReadLines(p)){ var m=rx.Match(l); if(!m.Success)continue; long t; if(TryHex(m.Groups[1].Value,out t))Pin[(int)t]=m.Groups[2].Value; }
            }
            static long KeyFromName(string n){ var m=Regex.Match(n,@"obj_0x([0-9A-Fa-f]+)_"); if(!m.Success)return -1; long v; return TryHex(m.Groups[1].Value,out v)?v:-1; }

            static void Main(string[] a){
              if(a.Length<2){Console.Error.WriteLine("usage: IlCfgProbe evidence runtime"); Environment.Exit(2);}
              string ev=a[0],rt=a[1];
              foreach(var f in typeof(OpCodes).GetFields(BindingFlags.Public|BindingFlags.Static)) if(f.FieldType==typeof(OpCode)){ var o=(OpCode)f.GetValue(null); Ops[unchecked((ushort)o.Value)]=o; }
              LoadPin(Path.Combine(rt,"PINVOKE_POINTERS.txt"));
              var map=LoadMap(Path.Combine(ev,"RVA_METHOD_MAP.tsv"));
              string bd=Path.Combine(rt,"map_object_blobs");
              var calls=new List<string>(); var cons=new List<string>(); var meths=new List<string>(); var reports=new List<string>(); var instructions=new List<string>();
              int files=0, decodeFail=0, reachableTotal=0, fakeRawA55A=0, reachableSetFeature=0, reachableSetOutput=0, reachableGetInput=0;
              foreach(var fp in Directory.Exists(bd)?Directory.GetFiles(bd,"*.bin"):new string[0]){
                files++; byte[] b=File.ReadAllBytes(fp); long key=KeyFromName(Path.GetFileName(fp)); M mm; if(!map.TryGetValue(key,out mm))mm=new M();
                var seen=new HashSet<int>(); var ins=new Dictionary<int,I>(); var q=new Queue<int>(); q.Enqueue(0);
                int fail=0;
                while(q.Count>0){
                  int off=q.Dequeue(); if(off<0||off>=b.Length||seen.Contains(off))continue; seen.Add(off);
                  I z=Decode(b,off); if(z==null){fail++; continue;} ins[off]=z;
                  bool terminal=z.Op.FlowControl==FlowControl.Return || z.Op.FlowControl==FlowControl.Throw;
                  bool uncond=z.Op.FlowControl==FlowControl.Branch;
                  foreach(int t in z.Targets) if(t>=0&&t<b.Length)q.Enqueue(t);
                  if(!terminal && !uncond && z.Next>=0 && z.Next<b.Length)q.Enqueue(z.Next);
                }
                decodeFail+=fail; reachableTotal+=ins.Count;
                bool rawA55A=false; for(int i=0;i+1<b.Length;i++) if(b[i]==0xA5&&b[i+1]==0x5A){rawA55A=true;break;}
                bool reachA5=false,reach5A=false,reach55=false,reachAA=false,reachVID=false,reach1719=false,reach2244=false;
                var localCalls=new List<string>();
                foreach(var z in ins.Values.OrderBy(x=>x.Off)){
                  instructions.Add(String.Join("\t",new[]{"0x"+key.ToString("X8"),"0x"+z.Off.ToString("X"),z.Op.Name,z.Op.OperandType.ToString(),z.HasNum?z.Num.ToString(System.Globalization.CultureInfo.InvariantCulture):"",String.Join(",",z.Targets.Select(t=>t.ToString()).ToArray()),Path.GetFileName(fp)}));
                int tok=(int)(z.Num&0xffffffff);
                  if((z.Op.Value==OpCodes.Call.Value || z.Op.Value==OpCodes.Callvirt.Value || z.Op.Value==OpCodes.Jmp.Value) && z.HasNum){
                    string entry; if(Pin.TryGetValue(tok,out entry)){
                      calls.Add(String.Join("\t",new[]{"0x"+key.ToString("X8"),mm.Token,mm.Type,mm.Name,"0x"+z.Off.ToString("X"),z.Op.Name,"0x"+tok.ToString("X8"),entry,Path.GetFileName(fp)}));
                      localCalls.Add(entry+"@0x"+z.Off.ToString("X"));
                      if(entry=="HidD_SetFeature")reachableSetFeature++;
                      if(entry=="HidD_SetOutputReport")reachableSetOutput++;
                      if(entry=="HidD_GetInputReport")reachableGetInput++;
                    }
                  }
                  long? cv=Ldc(z); if(cv.HasValue){
                    string label; if(ConstNames.TryGetValue(cv.Value,out label)){
                      cons.Add(String.Join("\t",new[]{"0x"+key.ToString("X8"),mm.Token,mm.Type,mm.Name,"0x"+z.Off.ToString("X"),z.Op.Name,cv.Value.ToString(),"0x"+(cv.Value&0xffffffffL).ToString("X"),label,Path.GetFileName(fp)}));
                      if(cv.Value==0xA5)reachA5=true; if(cv.Value==0x5A)reach5A=true; if(cv.Value==0x55)reach55=true; if(cv.Value==0xAA)reachAA=true;
                      if(cv.Value==0x6324)reachVID=true; if(cv.Value==0x1719)reach1719=true; if(cv.Value==0x2244)reach2244=true;
                    }
                  }
                }
                if(rawA55A && !(reachA5&&reach5A))fakeRawA55A++;
                meths.Add(String.Join("\t",new[]{"0x"+key.ToString("X8"),mm.Token,mm.Type,mm.Name,mm.Delta,b.Length.ToString(),ins.Count.ToString(),fail.ToString(),rawA55A?"1":"0",reachA5?"1":"0",reach5A?"1":"0",reach55?"1":"0",reachAA?"1":"0",reachVID?"1":"0",reach1719?"1":"0",reach2244?"1":"0",String.Join(",",localCalls),Path.GetFileName(fp)}));
                if(localCalls.Count>0 || (reachA5&&reach5A) || reachVID || reach1719 || reach2244 || reach55 || reachAA){
                  reports.Add("===== key=0x"+key.ToString("X8")+" token="+mm.Token+" "+mm.Type+"::"+mm.Name+" delta="+mm.Delta+" len="+b.Length+" reachable="+ins.Count+" =====");
                  reports.Add("PInvoke="+String.Join(",",localCalls));
                  reports.Add("constants="+String.Join(",",new[]{reachA5?"A5":"",reach5A?"5A":"",reach55?"55":"",reachAA?"AA":"",reachVID?"VID6324":"",reach1719?"PID1719":"",reach2244?"PID2244":""}.Where(x=>x!="")));
                  reports.Add("");
                }
              }
              File.WriteAllText(Path.Combine(ev,"IL_CFG_INSTRUCTIONS.tsv"),"map_key\til_offset\top\toperand_type\toperand\tbranch_targets\tfile\n"+String.Join("\n",instructions)+"\n");
              File.WriteAllText(Path.Combine(ev,"IL_CFG_PINVOKE_CALLS.tsv"),"map_key\ttoken\ttype\tmethod\til_offset\top\ttarget_token\tentry\tfile\n"+String.Join("\n",calls)+"\n");
              File.WriteAllText(Path.Combine(ev,"IL_CFG_CONSTANTS.tsv"),"map_key\ttoken\ttype\tmethod\til_offset\top\tvalue_dec\tvalue_hex\tconstant\tfile\n"+String.Join("\n",cons)+"\n");
              File.WriteAllText(Path.Combine(ev,"IL_CFG_METHODS.tsv"),"map_key\ttoken\ttype\tmethod\tdelta\tblob_len\treachable_instructions\tdecode_failures\traw_A5_5A\treach_A5\treach_5A\treach_55\treach_AA\treach_VID6324\treach_PID1719\treach_PID2244\tpinvoke_calls\tfile\n"+String.Join("\n",meths)+"\n");
              File.WriteAllText(Path.Combine(ev,"IL_CFG_HIGH_SIGNAL.txt"),reports.Count>0?String.Join("\n",reports)+"\n":"NO_REACHABLE_HIGH_SIGNAL_METHODS\n");
              string json="{\n"+
                "  \"blobs_scanned\": "+files+",\n"+
                "  \"reachable_instructions\": "+reachableTotal+",\n"+
                "  \"decode_failures\": "+decodeFail+",\n"+
                "  \"reachable_pinvoke_calls\": "+calls.Count+",\n"+
                "  \"reachable_protocol_constants\": "+cons.Count+",\n"+
                "  \"raw_A5_5A_but_unreachable_semantics\": "+fakeRawA55A+",\n"+
                "  \"reachable_HidD_SetFeature_calls\": "+reachableSetFeature+",\n"+
                "  \"reachable_HidD_SetOutputReport_calls\": "+reachableSetOutput+",\n"+
                "  \"reachable_HidD_GetInputReport_calls\": "+reachableGetInput+",\n"+
                "  \"FLASH_ALLOWED\": false\n}\n";
              File.WriteAllText(Path.Combine(ev,"V8_5_CFG_STATUS.json"),json);
            }
          }
          '@ | Set-Content $src -Encoding UTF8

          $csc = "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { throw "x86 .NET Framework csc.exe not found" }
          & $csc /nologo /optimize+ /platform:x86 /out:$exe $src *> "$ev\IL_CFG_BUILD.log"
          if ($LASTEXITCODE -ne 0) { Get-Content "$ev\IL_CFG_BUILD.log"; throw "IL CFG decoder build failed" }

          & $exe $ev $rt *> "$ev\IL_CFG_RUN.log"
          $cfgExit = $LASTEXITCODE
          "cfg_exit=$cfgExit" | Set-Content "$ev\IL_CFG_EXIT.txt"
          if ($cfgExit -ne 0) { throw "Reachable IL decoder failed: $cfgExit" }

          "" | Add-Content $env:GITHUB_STEP_SUMMARY
          "# BP1048P4 V8.5 reachable protected-IL CFG" | Add-Content $env:GITHUB_STEP_SUMMARY
          if (Test-Path "$ev\V8_5_CFG_STATUS.json") { Get-Content "$ev\V8_5_CFG_STATUS.json" | Add-Content $env:GITHUB_STEP_SUMMARY }
          "" | Add-Content $env:GITHUB_STEP_SUMMARY
          "## Reachable high-signal methods" | Add-Content $env:GITHUB_STEP_SUMMARY
          if (Test-Path "$ev\IL_CFG_HIGH_SIGNAL.txt") { Get-Content "$ev\IL_CFG_HIGH_SIGNAL.txt" -TotalCount 220 | Add-Content $env:GITHUB_STEP_SUMMARY }
          "" | Add-Content $env:GITHUB_STEP_SUMMARY
          "## Reachable PInvoke calls" | Add-Content $env:GITHUB_STEP_SUMMARY
          if (Test-Path "$ev\IL_CFG_PINVOKE_CALLS.tsv") { Get-Content "$ev\IL_CFG_PINVOKE_CALLS.tsv" -TotalCount 180 | Add-Content $env:GITHUB_STEP_SUMMARY }

      - name: Correct protector map to exact IL code-start V8.7
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "$env:RUNNER_TEMP\bpv8"
          $ev = "$root\evidence"
          $rt = "$ev\runtime"

          python -m pip install --disable-pip-version-check --quiet dnfile
          @'
          from pathlib import Path
          import csv, json, re, struct
          import dnfile

          root=Path(__import__('os').environ['RUNNER_TEMP'])/'bpv8'
          ev=root/'evidence'; rt=ev/'runtime'; exe=root/'client'/'official.exe'
          base=int((rt/'MODULE_BASE.txt').read_text().strip(),0)

          def normhex(v):
              try:
                  n=v if isinstance(v,int) else int(str(v).strip(),0)
                  return f'0x{n:08X}'
              except Exception:
                  s=str(v).strip()
                  return ('0x'+s[2:].upper()) if s.lower().startswith('0x') else s

          # Runtime identity recovered from the materialized protected methods.
          identity={}
          for d in (rt/'priority', rt/'all_stubs'):
              if not d.exists(): continue
              for p in d.glob('*.txt'):
                  q={}
                  for line in p.read_text(errors='replace').splitlines():
                      if '=' in line:
                          k,v=line.split('=',1); q[k.strip()]=v.strip()
                  tok=normhex(q.get('token',''))
                  if tok:
                      identity[tok]=(q.get('type',''),q.get('method',''))

          pe=dnfile.dnPE(str(exe))
          mt=pe.net.mdtables.MethodDef
          code_by_rva={}; method_rows=[]
          for idx,row in enumerate(mt.rows,1):
              rva=int(row.Rva or 0)
              if not rva: continue
              tok=normhex(0x06000000|idx)
              b=pe.get_data(rva,4) or b''
              if not b: continue
              kind=b[0]&0x3
              if kind==0x2: hdr=1
              elif kind==0x3 and len(b)>=2:
                  flags_size=int.from_bytes(b[:2],'little')
                  hdr=((flags_size>>12)&0xF)*4
                  if hdr < 12: hdr=12
              else:
                  hdr=0
              code_rva=rva+hdr
              typ,meth=identity.get(tok,('',''))
              rec=(tok,rva,hdr,code_rva,typ,meth,str(row.Name))
              code_by_rva.setdefault(code_rva,[]).append(rec)
              method_rows.append(rec)

          amap=[]
          mp=rt/'MAP_ADDRESS_INDEX.tsv'
          if mp.exists():
              for line in mp.read_text(errors='replace').splitlines():
                  q=line.split('\t')
                  if not q: continue
                  try: key=int(q[0],0)
                  except: continue
                  if key==0: continue
                  amap.append(key)

          exact=[]; unmatched=[]
          for key in sorted(set(amap)):
              mrva=key-base
              rows=code_by_rva.get(mrva,[])
              if rows:
                  for rec in rows:
                      exact.append((key,mrva,*rec))
              else:
                  unmatched.append((key,mrva))

          out=ev/'V8_7_EXACT_CODESTART_MAP.tsv'
          with out.open('w',encoding='utf-8',newline='') as f:
              f.write('map_key\tmap_rva\ttoken\tmethoddef_rva\theader_size\tcode_start_rva\ttype\tmethod\tmetadata_name\n')
              for key,mrva,tok,rva,hdr,crva,typ,meth,mname in exact:
                  f.write(f'0x{key:08X}\t0x{mrva:08X}\t{tok}\t0x{rva:08X}\t{hdr}\t0x{crva:08X}\t{typ}\t{meth}\t{mname}\n')

          (ev/'V8_7_UNMATCHED_CODESTART_MAP.tsv').write_text(
              'map_key\tmap_rva\n'+''.join(f'0x{k:08X}\t0x{r:08X}\n' for k,r in unmatched),errors='replace')

          exact_by_key={normhex(x[0]):x for x in exact}
          def correct(src,dst):
              p=ev/src
              if not p.exists(): raise RuntimeError('Missing '+src)
              lines=p.read_text(errors='replace').splitlines()
              if not lines: raise RuntimeError('Empty '+src)
              hdr=lines[0].split('\t')
              out=[lines[0]+'\texact_token\texact_type\texact_method\texact_metadata_name']
              n=0
              for line in lines[1:]:
                  if not line.strip(): continue
                  q=line.split('\t'); key=normhex(q[0]) if q else ''
                  x=exact_by_key.get(key)
                  if x:
                      _,_,tok,rva,hs,cr,typ,meth,mname=x
                      out.append(line+f'\t{tok}\t{typ}\t{meth}\t{mname}'); n+=1
                  else: out.append(line+'\t\t\t\t')
              (ev/dst).write_text('\n'.join(out)+'\n',errors='replace')
              return n

          c_calls=correct('IL_CFG_PINVOKE_CALLS.tsv','V8_7_CORRECTED_CFG_PINVOKE_CALLS.tsv')
          c_const=correct('IL_CFG_CONSTANTS.tsv','V8_7_CORRECTED_CFG_CONSTANTS.tsv')
          for src,count in [('IL_CFG_PINVOKE_CALLS.tsv',c_calls),('IL_CFG_CONSTANTS.tsv',c_const)]:
              expected=sum(bool(x.strip()) for x in (ev/src).read_text().splitlines()[1:])
              if count != expected or expected == 0:
                  raise RuntimeError(f'Incomplete exact code-start join: {src}: {count}/{expected}')

          # High-value HID calls after exact code-start identity correction.
          hid=[]
          cp=ev/'V8_7_CORRECTED_CFG_PINVOKE_CALLS.tsv'
          if cp.exists():
              for line in cp.read_text(errors='replace').splitlines()[1:]:
                  if re.search(r'HidD_|ReadFile|WriteFile|CreateFile|SetupDi',line,re.I): hid.append(line)
          (ev/'V8_7_EXACT_HID_CALLS.txt').write_text('\n'.join(hid)+'\n' if hid else 'NO_EXACT_HID_CALLS\n')

          status={
              'module_base':f'0x{base:08X}',
              'nonzero_map_keys':len(set(amap)),
              'exact_code_start_matches':len({x[0] for x in exact}),
              'unmatched_code_start_keys':len(unmatched),
              'corrected_cfg_pinvoke_rows':c_calls,
              'corrected_cfg_constant_rows':c_const,
              'FLASH_ALLOWED':False
          }
          (ev/'V8_7_CODESTART_STATUS.json').write_text(json.dumps(status,indent=2)+'\n')
          '@ | Set-Content "$root\correct_codestart.py" -Encoding UTF8

          python "$root\correct_codestart.py"
          if ($LASTEXITCODE -ne 0) { throw "Exact code-start correction failed" }
          "" | Add-Content $env:GITHUB_STEP_SUMMARY
          "# V8.7 exact IL code-start correction" | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-Content "$ev\V8_7_CODESTART_STATUS.json" | Add-Content $env:GITHUB_STEP_SUMMARY
          "" | Add-Content $env:GITHUB_STEP_SUMMARY
          "## Exact HID/PInvoke calls" | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-Content "$ev\V8_7_EXACT_HID_CALLS.txt" -TotalCount 120 | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Trace exact HID callers and packet-building IL V8.8
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "$env:RUNNER_TEMP\bpv8"
          @'
          """Static MethodDef caller evidence only; no wire-protocol inference from names."""
          import csv
          import json
          import re
          import sys
          from collections import defaultdict
          from pathlib import Path
          
          
          def number(value):
              return int(value, 0)
          
          
          def rows(path):
              with path.open(encoding='utf-8-sig', newline='') as f:
                  return list(csv.DictReader(f, delimiter='\t'))
          
          
          def analyze(ev):
              exact = rows(ev / 'V8_7_EXACT_CODESTART_MAP.tsv')
              methods = {number(r['map_key']): r for r in exact}
              instructions = rows(ev / 'IL_CFG_INSTRUCTIONS.tsv')
              pin = rows(ev / 'V8_7_CORRECTED_CFG_PINVOKE_CALLS.tsv')
              calls = []
              by_target = defaultdict(set)
              for row in instructions:
                  if row['op'] not in ('call', 'callvirt', 'jmp', 'newobj') or not row['operand']:
                      continue
                  src = methods.get(number(row['map_key']))
                  if not src:
                      continue
                  target = number(row['operand'])
                  token = number(src['token'])
                  by_target[target].add(token)
                  calls.append((src['token'], src['metadata_name'], row['il_offset'], row['op'], f'0x{target:08X}'))
              seeds = {number(r['exact_token']) for r in pin if r['exact_token'] and re.search(r'HidD_|ReadFile|WriteFile', r['entry'])}
              if not seeds:
                  raise RuntimeError('No exactly mapped HID/file I/O seed methods')
              distance = {token: 0 for token in seeds}
              frontier = seeds
              for depth in range(1, 4):
                  following = {caller for target in frontier for caller in by_target[target]} - distance.keys()
                  distance.update({token: depth for token in following})
                  frontier = following
              with (ev / 'V8_8_CALL_EDGES.tsv').open('w', newline='', encoding='utf-8') as f:
                  w = csv.writer(f, delimiter='\t'); w.writerow(['source_token','source_name','il_offset','op','target_token']); w.writerows(calls)
              count = 0
              with (ev / 'V8_8_HID_CALLER_IL.tsv').open('w', newline='', encoding='utf-8') as f:
                  w = csv.writer(f, delimiter='\t')
                  w.writerow(['exact_token','metadata_name','caller_depth','map_key','il_offset','op','operand_type','operand','branch_targets','file'])
                  for row in instructions:
                      src = methods.get(number(row['map_key']))
                      if not src or number(src['token']) not in distance: continue
                      count += 1
                      w.writerow([src['token'],src['metadata_name'],distance[number(src['token'])]] +
                                 [row[k] for k in ['map_key','il_offset','op','operand_type','operand','branch_targets','file']])
              status = dict(exact_methods=len(methods), reachable_instruction_rows=len(instructions),
                            call_edges=len(calls), hid_seed_methods=len(seeds), caller_methods=len(distance),
                            focused_instruction_rows=count, max_caller_depth=3,
                            limitations=['Static direct metadata-token edges only; virtual dispatch and reflection unresolved',
                                         'CFG starts at IL offset zero; exception handlers are not additional roots',
                                         'No stack/data-flow reconstruction; nearby constants do not prove packet fields'],
                            flash_read_wire_protocol_proven=False, FLASH_ALLOWED=False)
              if not instructions or not calls or not count:
                  raise RuntimeError('Empty reachable-IL/caller evidence; inspect decoder output')
              (ev / 'V8_8_PROTOCOL_GRAPH_STATUS.json').write_text(json.dumps(status, indent=2)+'\n')
              (ev / 'V8_8_PROTOCOL_GRAPH_REPORT.md').write_text(
                  '# V8.8 HID caller evidence\n\n'
                  f'- HID/file I/O wrapper methods: {len(seeds)}\n- Methods within three caller levels: {len(distance)}\n'
                  f'- Focused reachable IL rows: {count}\n\n'
                  'Inspect V8_8_HID_CALLER_IL.tsv for packet-building instructions and their exact MethodDef identities.\n'
                  'Operands are decoded IL values; they are not confirmed USB commands, offsets or lengths.\n'
                  'Exception-only paths, reflection and indirect calls may be missing.\n'
                  'Full firmware readback remains unproven.\n')
              return status
          
          
          if __name__ == '__main__':
              print(json.dumps(analyze(Path(sys.argv[1])), indent=2))
          '@ | Set-Content "$root\protocol_graph.py" -Encoding UTF8
          python "$root\protocol_graph.py" "$root\evidence"
          if ($LASTEXITCODE -ne 0) { throw "HID caller analysis failed" }
          Get-Content "$root\evidence\V8_8_PROTOCOL_GRAPH_REPORT.md" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Package V8.5 runtime evidence
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "$env:RUNNER_TEMP\bpv8"
          $ev = "$root\evidence"
          New-Item -ItemType Directory -Force -Path $ev | Out-Null

          if (-not (Test-Path "$ev\V8_5_REPORT.md")) {
            @"
          # BP1048P4 V8.5 runtime evidence

          The post-processing analyzer did not produce V8_5_REPORT.md.
          Raw runtime evidence was still preserved. Inspect RUNTIME_PROBE.log,
          runtime/STATIC_FIELDS.txt, runtime/priority, and ANALYZE_V8.log.
          FLASH_ALLOWED=NO
          "@ | Set-Content "$ev\V8_5_REPORT.md"
          }

          if (-not (Test-Path "$ev\V8_5_STATUS.json")) {
            '{"runtime_probe_present":false,"analysis_complete":false,"boot_entry_proven":false,"flash_read_protocol_proven":false,"flash_write_enabled":false,"FLASH_ALLOWED":false}' | Set-Content "$ev\V8_5_STATUS.json"
          }
          if (-not (Test-Path "$ev\PROTECTOR_HID_MAP.txt")) {
            'ANALYZER_DID_NOT_PRODUCE_PROTECTOR_HID_MAP' | Set-Content "$ev\PROTECTOR_HID_MAP.txt"
          }
          if (-not (Test-Path "$ev\NATIVE_CONSTANT_HITS.txt")) {
            'ANALYZER_DID_NOT_PRODUCE_NATIVE_CONSTANT_HITS' | Set-Content "$ev\NATIVE_CONSTANT_HITS.txt"
          }

          Compress-Archive -Force -CompressionLevel Optimal `
            -Path "$ev\*" `
            -DestinationPath "$root\OKN_BP1048P4_RUNTIME_DEVIRTUALIZE_V8_7_EVIDENCE.zip"
          (Get-FileHash "$root\OKN_BP1048P4_RUNTIME_DEVIRTUALIZE_V8_7_EVIDENCE.zip" -Algorithm SHA256).Hash.ToLower() |
            Set-Content "$root\OKN_BP1048P4_RUNTIME_DEVIRTUALIZE_V8_7_EVIDENCE.zip.sha256"

      - name: Upload V8.5 runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OKN-BP1048P4-RUNTIME-DEVIRTUALIZE-V8_7
          path: |
            ${{ runner.temp }}\bpv8\OKN_BP1048P4_RUNTIME_DEVIRTUALIZE_V8_7_EVIDENCE.zip
            ${{ runner.temp }}\bpv8\OKN_BP1048P4_RUNTIME_DEVIRTUALIZE_V8_7_EVIDENCE.zip.sha256
            ${{ runner.temp }}\bpv8\evidence\V8_5_REPORT.md
            ${{ runner.temp }}\bpv8\evidence\V8_5_STATUS.json
            ${{ runner.temp }}\bpv8\evidence\PROTECTOR_HID_MAP.txt
            ${{ runner.temp }}\bpv8\evidence\NATIVE_CONSTANT_HITS.txt
            ${{ runner.temp }}\bpv8\evidence\RUNTIME_PROBE.log
            ${{ runner.temp }}\bpv8\evidence\METHOD_MAP_CORRELATION.tsv
            ${{ runner.temp }}\bpv8\evidence\PINVOKE_CALL_XREFS.tsv
            ${{ runner.temp }}\bpv8\evidence\SEMANTIC_IMMEDIATE_HITS.tsv
            ${{ runner.temp }}\bpv8\evidence\V8_5_RVA_REPORT.md
            ${{ runner.temp }}\bpv8\evidence\V8_5_RVA_STATUS.json
            ${{ runner.temp }}\bpv8\evidence\RVA_METHOD_MAP.tsv
            ${{ runner.temp }}\bpv8\evidence\HIGH_SIGNAL_RVA_BODIES.txt
            ${{ runner.temp }}\bpv8\evidence\BODY_PINVOKE_TOKEN_HITS.tsv
            ${{ runner.temp }}\bpv8\evidence\BODY_PROTOCOL_HITS.tsv
            D:\a\_temp\bpv8\evidence\IL_CFG_PINVOKE_CALLS.tsv
            D:\a\_temp\bpv8\evidence\IL_CFG_CONSTANTS.tsv
            D:\a\_temp\bpv8\evidence\IL_CFG_METHODS.tsv
            D:\a\_temp\bpv8\evidence\IL_CFG_HIGH_SIGNAL.txt
            D:\a\_temp\bpv8\evidence\V8_5_CFG_STATUS.json
            ${{ runner.temp }}\bpv8\evidence\V8_7_CODESTART_STATUS.json
            ${{ runner.temp }}\bpv8\evidence\V8_7_EXACT_CODESTART_MAP.tsv
            ${{ runner.temp }}\bpv8\evidence\V8_7_UNMATCHED_CODESTART_MAP.tsv
            ${{ runner.temp }}\bpv8\evidence\V8_7_CORRECTED_CFG_PINVOKE_CALLS.tsv
            ${{ runner.temp }}\bpv8\evidence\V8_7_CORRECTED_CFG_CONSTANTS.tsv
            ${{ runner.temp }}\bpv8\evidence\V8_7_EXACT_HID_CALLS.txt
            ${{ runner.temp }}\bpv8\evidence\V8_8_*
            ${{ runner.temp }}\bpv8\evidence\RAW_CONSTANT_HITS.tsv
            ${{ runner.temp }}\bpv8\evidence\MAP_OBJECT_SIGNAL_LINES.txt
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:FLASH_ALLOWED -ne "NO") { throw "FLASH_ALLOWED changed" }
          $p = "$env:RUNNER_TEMP\bpv8\evidence\V8_5_STATUS.json"
          if (Test-Path $p) {
            $s = Get-Content $p | ConvertFrom-Json
            if ($s.FLASH_ALLOWED -ne $false) { throw "V8 gate failed" }
            if ($s.flash_write_enabled -ne $false) { throw "write gate failed" }
          }
          "RUNTIME_DEVIRTUALIZE_V8_7_COMPLETE=YES"
          "FLASH_ALLOWED=NO"

  sdk_flashboot_research:
    name: MVSilicon SDK FlashBoot + PC tool protocol research V8.7 (OFFLINE / NO USB)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SDK_REPO: "https://github.com/leadercxn/bp1048_sdk_v0.1.12.git"
      SDK_COMMIT: "8105bd864b04995d81c9f9ae77cb158259f39015"

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          mkdir -p /tmp/sdkv87/{evidence,tool}
          cat > /tmp/sdkv87/evidence/SAFETY.txt <<'EOF'
          MODE=OFFLINE_MVSILICON_SDK_FLASHBOOT_RESEARCH
          PHYSICAL_USB_BOARD_PRESENT=NO
          USB_COMMAND_SENT=NO
          BOOT_ENTRY_EXECUTED=NO
          FLASH_READ_EXECUTED=NO
          FLASH_ERASE_EXECUTED=NO
          FLASH_WRITE_EXECUTED=NO
          FLASH_ALLOWED=NO
          EOF

      - name: Fetch pinned public BP1048 SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone -q "$SDK_REPO" /tmp/sdkv87/sdk
          git -C /tmp/sdkv87/sdk checkout -q "$SDK_COMMIT"
          test "$(git -C /tmp/sdkv87/sdk rev-parse HEAD)" = "$SDK_COMMIT"
          git -C /tmp/sdkv87/sdk rev-parse HEAD | tee /tmp/sdkv87/evidence/SDK_COMMIT.txt

      - name: Extract firmware-side boot entry and flash APIs
        shell: bash
        run: |
          set -euo pipefail
          SDK=/tmp/sdkv87/sdk
          E=/tmp/sdkv87/evidence
          U="$SDK/BT_Audio_APP/bt_audio_app_src/device/upgrade.c"
          H="$SDK/BT_Audio_APP/bt_audio_app_src/inc/flash_boot.h"
          F="$SDK/MVsB1_Base_SDK/driver/driver_api/inc/flash_interface.h"
          FB="$SDK/BT_Audio_APP/bt_audio_app_src/device/flash_boot.c"

          python3 - <<'PY'
          from pathlib import Path
          import json,re,hashlib
          S=Path('/tmp/sdkv87/sdk'); E=Path('/tmp/sdkv87/evidence')
          u=(S/'BT_Audio_APP/bt_audio_app_src/device/upgrade.c').read_text(errors='replace')
          h=(S/'BT_Audio_APP/bt_audio_app_src/inc/flash_boot.h').read_text(errors='replace')
          fi=(S/'MVsB1_Base_SDK/driver/driver_api/inc/flash_interface.h').read_text(errors='replace')
          fb=(S/'BT_Audio_APP/bt_audio_app_src/device/flash_boot.c').read_text(errors='replace')

          def contexts(text, pats, radius=8):
              L=text.splitlines(); out=[]
              for i,line in enumerate(L):
                  if any(re.search(p,line,re.I) for p in pats):
                      lo=max(0,i-radius); hi=min(len(L),i+radius+1)
                      out.append('\n'.join(f'{j+1:6d}: {L[j]}' for j in range(lo,hi)))
              return '\n\n'.join(out)

          (E/'UPGRADE_BOOT_ENTRY_CONTEXT.txt').write_text(contexts(u,[r'ADR_FLASH_BOOT_FLAGE',r'start_up_grate',r'AppResourceUsbDevice',r'jump_fun',r'NO_PC_LINK'],12)+'\n')
          (E/'FLASH_BOOT_CONFIG_CONTEXT.txt').write_text(contexts(h,[r'JUDGEMENT_STANDARD',r'PCTOOL_',r'UP_PORT',r'BOOT_UART'],10)+'\n')
          (E/'FLASH_API_CONTEXT.txt').write_text(contexts(fi,[r'SpiFlashReadWpr',r'SpiFlashWriteWpr',r'SpiFlashEraseWpr',r'FlashEraseWpr'],8)+'\n')

          # Recover literal bytes from the 64K embedded flash boot image for strings/signatures.
          m=re.search(r'flash_data\s*\[\s*65536\s*\]\s*=\s*\{(.*?)\};',fb,re.S)
          literal=b''
          if m:
              literal=bytes(int(x,16) for x in re.findall(r'0x([0-9A-Fa-f]{2})',m.group(1)))
              (E/'FLASH_BOOT_LITERAL_BYTES.bin').write_bytes(literal)
              (E/'FLASH_BOOT_LITERAL_BYTES_SHA256.txt').write_text(hashlib.sha256(literal).hexdigest()+'\n')

          vals={}
          for name,txt,rx in [
            ('boot_flag_address',u,r'#define\s+ADR_FLASH_BOOT_FLAGE\s+\((0x[0-9A-Fa-f]+)\)'),
            ('judgement_standard',h,r'#define\s+JUDGEMENT_STANDARD\s+(0x[0-9A-Fa-f]+)'),
            ('pctool_on',h,r'#define\s+PCTOOL_ON\s+(0x[0-9A-Fa-f]+)'),
            ('boot_uart_baud_default',h,r'#define\s+BOOT_UART_BAUD_RATE\s+([A-Za-z0-9_]+)')]:
              mm=re.search(rx,txt)
              vals[name]=mm.group(1) if mm else None
          vals.update({
            'start_up_grate_present':'start_up_grate' in u,
            'usbdevice_pc_flag_present':bool(re.search(r'AppResourceUsbDevice.*?SREG_FLASH_BOOT_FLAGE\.PC\s*=\s*1.*?SREG_FLASH_BOOT_FLAGE\.updata\s*=\s*1',u,re.S)),
            'jump_to_zero_present':bool(re.search(r'jump_fun\s*=\s*\(fun\)0\s*;',u)),
            'spi_flash_read_api_present':'SpiFlashReadWpr' in fi,
            'spi_flash_write_api_present':'SpiFlashWriteWpr' in fi,
            'flash_literal_bytes_extracted':len(literal),
            'FLASH_ALLOWED':False
          })
          (E/'SDK_BOOT_FACTS.json').write_text(json.dumps(vals,indent=2)+'\n')
          PY

          strings -a -n 4 "$E/FLASH_BOOT_LITERAL_BYTES.bin" > "$E/FLASH_BOOT_LITERAL_STRINGS.txt" || true
          grep -Eai 'usb|hid|pc|uart|com|upgrade|update|flash|read|write|erase|crc|mva|boot|code|const|config' "$E/FLASH_BOOT_LITERAL_STRINGS.txt" > "$E/FLASH_BOOT_SIGNAL_STRINGS.txt" || true

      - name: Search SDK for PC upgrade transport and MVA framing
        shell: bash
        run: |
          set -euo pipefail
          SDK=/tmp/sdkv87/sdk; E=/tmp/sdkv87/evidence
          grep -RniE --include='*.c' --include='*.h' --include='*.txt' \
            'PCTOOL|NO_PC_LINK|AppResourceUsbDevice|start_up_grate|MVA_|SpiFlashRead|SpiFlashWrite|FlashErase|USB.*Device|Device.*USB|HID|CDC|UART|upgrade|updata|flash boot|FlashBoot' \
            "$SDK/BT_Audio_APP" "$SDK/MVsB1_Base_SDK" 2>/dev/null \
            | head -c 8000000 > "$E/SDK_PC_UPGRADE_SEARCH.txt" || true

          grep -RniE --include='*.c' --include='*.h' \
            'UsbDevice|USB_DEVICE|USB.*HID|HID.*USB|USB.*CDC|CDC.*USB|EP0|SET_REPORT|GET_REPORT|vendor.*request|class.*request' \
            "$SDK/BT_Audio_APP" "$SDK/MVsB1_Base_SDK" 2>/dev/null \
            | head -c 4000000 > "$E/SDK_USB_TRANSPORT_SEARCH.txt" || true

      - name: Rebuild exact 64K FlashBoot + recover recovery HID and PC command table V8.7
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re, struct

          S=Path('/tmp/sdkv87/sdk')
          E=Path('/tmp/sdkv87/evidence')
          fb=(S/'BT_Audio_APP/bt_audio_app_src/device/flash_boot.c').read_text(errors='replace')
          fc=(S/'BT_Audio_APP/bt_audio_app_src/inc/flash_config.h').read_text(errors='replace')
          h=(S/'BT_Audio_APP/bt_audio_app_src/inc/flash_boot.h').read_text(errors='replace')

          def define_expr(text,name,contains=None):
              rx=re.compile(r'^\s*#define\s+'+re.escape(name)+r'\s+(.+?)\s*(?://.*)?$',re.M)
              vals=[m.group(1).strip() for m in rx.finditer(text)]
              if contains is not None:
                  vals=[x for x in vals if contains in x]
              if not vals:
                  raise RuntimeError('missing #define '+name)
              return vals[0].split('/*',1)[0].strip()

          def safe_eval(expr,names):
              expr=expr.strip()
              if not re.fullmatch(r'[A-Za-z0-9_xX()+\-<>&| \t]+',expr):
                  raise RuntimeError('unsafe expression: '+expr)
              return int(eval(expr,{'__builtins__':{}},dict(names)))

          names={}
          names['CONST_DATA_ADDR']=safe_eval(define_expr(fc,'CONST_DATA_ADDR'),names)
          names['AUDIO_EFFECT_ADDR']=safe_eval(define_expr(fc,'AUDIO_EFFECT_ADDR','0x200000'),names)
          names['USER_DATA_ADDR']=safe_eval(define_expr(fc,'USER_DATA_ADDR','0x200000'),names)

          # BP1048P4 takes the non-BP10128 SD branch: SDIO_A15_A16_A17 => SD_PORT=1.
          for n in ['BOOT_UART_TX_OFF','BOOT_UART_BAUD_RATE_512000','JUDGEMENT_STANDARD',
                    'UDisk_ON','PCTOOL_ON','BTTOOL_OFF','SD_A15A16A17']:
              names[n]=safe_eval(define_expr(h,n),names)
          names['BOOT_UART_TX_PIN']=names['BOOT_UART_TX_OFF']
          names['BOOT_UART_BAUD_RATE']=names['BOOT_UART_BAUD_RATE_512000']
          names['BOOT_UART_CONFIG']=safe_eval(define_expr(h,'BOOT_UART_CONFIG'),names)
          names['SD_PORT']=names['SD_A15A16A17']
          names['UP_PORT']=safe_eval(define_expr(h,'UP_PORT'),names)

          m=re.search(r'flash_data\s*\[\s*65536\s*\]\s*=\s*\{(.*?)\};',fb,re.S)
          if not m:
              raise RuntimeError('flash_data[65536] initializer not found')
          body=re.sub(r'/\*.*?\*/','',m.group(1),flags=re.S)
          body=re.sub(r'//[^\n]*','',body)
          parts=[x.strip() for x in body.split(',') if x.strip()]
          vals=[]
          for i,expr in enumerate(parts):
              v=safe_eval(expr,names)
              if not 0 <= v <= 0xFF:
                  raise RuntimeError(f'initializer byte {i} out of range: {expr} -> {v}')
              vals.append(v)
          if len(vals)!=65536:
              raise RuntimeError(f'exact FlashBoot reconstruction length={len(vals)}, expected 65536')
          b=bytes(vals)
          (E/'FLASH_BOOT_REBUILT.bin').write_bytes(b)
          (E/'FLASH_BOOT_REBUILT.bin.sha256').write_text(hashlib.sha256(b).hexdigest()+'\n')

          # Recover the control-only vendor HID descriptor used by PC FlashBoot.
          devs=[]
          for i in range(len(b)-18):
              if b[i:i+2] != b'\x12\x01': continue
              d=b[i:i+18]
              bcd=d[2]|(d[3]<<8); mps=d[7]
              if 0x0100 <= bcd <= 0x0300 and mps in (8,16,32,64):
                  devs.append({
                      'offset':i,'bcdUSB':bcd,'device_class':d[4],
                      'max_packet0':mps,'vid':d[8]|(d[9]<<8),'pid':d[10]|(d[11]<<8),
                      'bcdDevice':d[12]|(d[13]<<8),'num_configurations':d[17]
                  })
          recovery=next((x for x in devs if x['pid']==0x2244),None)
          if recovery is None:
              raise RuntimeError('recovery USB PID 0x2244 descriptor not found in exact FlashBoot')

          report_desc=bytes.fromhex(
              '06 00 FF 0A 55 AA A1 01 15 00 26 FF 00 75 08 '
              '96 00 01 09 01 81 02 96 00 01 09 01 91 02 '
              '95 01 09 01 B1 02 C0')
          rd_off=b.find(report_desc)
          if rd_off < 0:
              raise RuntimeError('expected 36-byte vendor HID report descriptor not found')

          cfg_pat=bytes.fromhex('09 02 1B 00 01 01 00 80 32 09 04 00 00 00 03 00 00 00 09 21')
          cfg_off=b.find(cfg_pat)
          if cfg_off < 0:
              raise RuntimeError('expected recovery HID configuration/interface descriptor not found')

          usb={
              'flashboot_sha256':hashlib.sha256(b).hexdigest(),
              'flashboot_length':len(b),
              'device_descriptor_offset':recovery['offset'],
              'vid':f"0x{recovery['vid']:04X}",
              'pid':f"0x{recovery['pid']:04X}",
              'bcdUSB':f"0x{recovery['bcdUSB']:04X}",
              'ep0_max_packet':recovery['max_packet0'],
              'config_descriptor_offset':cfg_off,
              'interface_class':3,
              'interface_subclass':0,
              'interface_protocol':0,
              'interrupt_endpoint_count':0,
              'hid_report_descriptor_offset':rd_off,
              'hid_report_descriptor_length':len(report_desc),
              'usage_page':'0xFF00',
              'usage':'0xAA55',
              'input_report_bytes':256,
              'output_report_bytes':256,
              'feature_report_bytes':1,
              'control_endpoint_only':True,
              'feature_value_semantics_proven':False,
              'FLASH_ALLOWED':False
          }
          (E/'FLASH_BOOT_USB_FACTS.json').write_text(json.dumps(usb,indent=2)+'\n')

          # Exact ordered pointer table for the PC-side FlashBoot command names.
          commands=['chiperas','upinfo','btupdat','cnfgdat','constdat','codedata','bootdat','cxxx']
          cmd_offsets={}
          for s in commands:
              o=b.find(s.encode()+b'\x00')
              if o<0: o=b.find(s.encode())
              if o<0: raise RuntimeError('missing FlashBoot PC command string '+s)
              cmd_offsets[s]=o
          table_blob=b''.join(struct.pack('<I',cmd_offsets[s]) for s in commands)
          table_off=b.find(table_blob)
          if table_off<0:
              raise RuntimeError('ordered FlashBoot PC command pointer table not found')

          cmd_info={
              'command_table_offset':f'0x{table_off:08X}',
              'commands':[{'index':i,'name':s,'string_offset':f"0x{cmd_offsets[s]:08X}",
                           'pointer_slot':f"0x{table_off+i*4:08X}"} for i,s in enumerate(commands)],
              'ascii_command_table_proven':True,
              'wire_framing_proven':False,
              'readback_command_proven':False,
              'erase_write_execution_enabled':False,
              'FLASH_ALLOWED':False
          }
          (E/'FLASH_BOOT_COMMAND_TABLE.json').write_text(json.dumps(cmd_info,indent=2)+'\n')

          lines=[]
          for s in commands:
              target=cmd_offsets[s]; pat=struct.pack('<I',target); refs=[]
              p=0
              while True:
                  j=b.find(pat,p)
                  if j<0: break
                  refs.append(j); p=j+1
              lines.append(f'{s}\tstring=0x{target:08X}\txrefs='+','.join(f'0x{x:08X}' for x in refs))
          for label in [b'cmd_cxxx :',b' cmd_cxxx ACK %02X %02X %02X %02X ',
                        b'pc upgrata boot',b'pc upgrata code',b'pc upgrata const',b'pc upgrata config',
                        b'pc upgrata ok',b'PC IS OK',b'USBC']:
              o=b.find(label)
              lines.append(label.decode(errors='replace')+f'\toffset=0x{o:08X}')
          (E/'FLASH_BOOT_COMMAND_XREFS.txt').write_text('\n'.join(lines)+'\n')

          def hx(off,radius=64):
              lo=max(0,off-radius); hi=min(len(b),off+radius)
              return f'0x{lo:08X}..0x{hi:08X}\n'+b[lo:hi].hex(' ').upper()
          (E/'FLASH_BOOT_HIGH_SIGNAL_HEX.txt').write_text(
              '=== HID REPORT ===\n'+hx(rd_off,48)+'\n\n=== USB CONFIG ===\n'+hx(cfg_off,48)+
              '\n\n=== USB DEVICE ===\n'+hx(recovery['offset'],48)+
              '\n\n=== PC COMMAND TABLE ===\n'+hx(table_off,64)+'\n')

          rebuild={
              'CONST_DATA_ADDR':f"0x{names['CONST_DATA_ADDR']:08X}",
              'USER_DATA_ADDR':f"0x{names['USER_DATA_ADDR']:08X}",
              'AUDIO_EFFECT_ADDR':f"0x{names['AUDIO_EFFECT_ADDR']:08X}",
              'BOOT_UART_CONFIG':f"0x{names['BOOT_UART_CONFIG']:02X}",
              'JUDGEMENT_STANDARD':f"0x{names['JUDGEMENT_STANDARD']:02X}",
              'UP_PORT':f"0x{names['UP_PORT']:02X}",
              'initializer_items':len(vals),'exact_length':len(b),'FLASH_ALLOWED':False
          }
          (E/'FLASH_BOOT_REBUILD_FACTS.json').write_text(json.dumps(rebuild,indent=2)+'\n')

          report=[
              '# BP1048P4 V8.7 exact FlashBoot HID/PC protocol evidence','',
              f"- exact FlashBoot image rebuilt: **{len(b)} bytes**",
              f"- SHA-256: \\`{hashlib.sha256(b).hexdigest()}\\`",
              f"- recovery USB descriptor: VID **0x{recovery['vid']:04X}**, PID **0x{recovery['pid']:04X}**",
              '- recovery interface: **vendor HID over control endpoint only** (bNumEndpoints=0)',
              '- HID report descriptor: **Input 256 B / Output 256 B / Feature 1 B**',
              '- Usage Page **0xFF00**, Usage **0xAA55**',
              f"- ordered PC command pointer table: **0x{table_off:08X}**",
              '- commands: `chiperas, upinfo, btupdat, cnfgdat, constdat, codedata, bootdat, cxxx`',
              '- The 1-byte Feature report is proven structurally, but the value/meaning is **not yet proven**.',
              '- Exact PC wire framing and flash readback command are **not yet proven**.',
              '- No command is transmitted in CI; `FLASH_ALLOWED=NO`.'
          ]
          (E/'V8_7_FLASHBOOT_PROTOCOL_REPORT.md').write_text('\n'.join(report)+'\n')
          PY

          cat /tmp/sdkv87/evidence/V8_7_FLASHBOOT_PROTOCOL_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/sdkv87/evidence/FLASH_BOOT_COMMAND_XREFS.txt >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"

      - name: Analyze MVSilicon b1_download_v1.7 tool offline
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq file binutils p7zip-full unzip >/dev/null
          python3 -m pip install --disable-pip-version-check --quiet pefile
          TOOL=/tmp/sdkv87/sdk/MVsB1_Base_SDK/tools/b1_download_v1.7.exe
          E=/tmp/sdkv87/evidence
          sha256sum "$TOOL" | tee "$E/B1_DOWNLOAD_SHA256.txt"
          file "$TOOL" | tee "$E/B1_DOWNLOAD_FILETYPE.txt"
          strings -a -n 3 "$TOOL" > "$E/B1_DOWNLOAD_ASCII.txt" || true
          strings -a -el -n 3 "$TOOL" > "$E/B1_DOWNLOAD_UTF16.txt" || true
          objdump -x "$TOOL" > "$E/B1_DOWNLOAD_OBJDUMP.txt" 2>&1 || true
          cat "$E/B1_DOWNLOAD_ASCII.txt" "$E/B1_DOWNLOAD_UTF16.txt" | \
            grep -Eai 'CreateFile|ReadFile|WriteFile|SetupDi|HidD_|hid.dll|winusb|libusb|usb|VID_|PID_|COM[0-9]|serial|uart|baud|115200|256000|512000|1000000|flash|erase|program|download|read|write|crc|address|0x55|0xAA|mva|boot' \
            > "$E/B1_DOWNLOAD_PROTOCOL_HITS.txt" || true
          python3 - <<'PY'
          from pathlib import Path
          import json, pefile, re
          p=Path('/tmp/sdkv87/sdk/MVsB1_Base_SDK/tools/b1_download_v1.7.exe')
          E=Path('/tmp/sdkv87/evidence')
          d={'pe_parse':False,'imports':[],'exports':[],'transport_hints':{},'FLASH_ALLOWED':False}
          try:
              pe=pefile.PE(str(p),fast_load=False); d['pe_parse']=True
              for ent in getattr(pe,'DIRECTORY_ENTRY_IMPORT',[]) or []:
                  dll=(ent.dll or b'').decode(errors='replace')
                  for x in ent.imports:
                      nm=(x.name or b'').decode(errors='replace') if x.name else f'ord:{x.ordinal}'
                      d['imports'].append(f'{dll}!{nm}')
              if hasattr(pe,'DIRECTORY_ENTRY_EXPORT') and pe.DIRECTORY_ENTRY_EXPORT:
                  for x in pe.DIRECTORY_ENTRY_EXPORT.symbols:
                      d['exports'].append((x.name or b'').decode(errors='replace') if x.name else f'ord:{x.ordinal}')
          except Exception as e: d['error']=repr(e)
          txt=(E/'B1_DOWNLOAD_PROTOCOL_HITS.txt').read_text(errors='replace') if (E/'B1_DOWNLOAD_PROTOCOL_HITS.txt').exists() else ''
          low=txt.lower()
          d['transport_hints']={k:(k in low) for k in ['hid.dll','hidd_','winusb','libusb','createfile','readfile','writefile','serial','uart','baud','com']}
          (E/'B1_DOWNLOAD_ANALYSIS.json').write_text(json.dumps(d,indent=2)+'\n')
          PY

      - name: Build V8.7 SDK conclusion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          E=Path('/tmp/sdkv87/evidence')
          facts=json.loads((E/'SDK_BOOT_FACTS.json').read_text())
          b1=json.loads((E/'B1_DOWNLOAD_ANALYSIS.json').read_text())
          hits=(E/'B1_DOWNLOAD_PROTOCOL_HITS.txt').read_text(errors='replace') if (E/'B1_DOWNLOAD_PROTOCOL_HITS.txt').exists() else ''
          report=[
            '# BP1048P4 V8.7 MVSilicon SDK FlashBoot research','',
            '## Firmware-side boot entry proven from SDK source',
            f"- boot flag register: `{facts.get('boot_flag_address')}`",
            f"- AppResourceUsbDevice sets PC + update flags: **{facts.get('usbdevice_pc_flag_present')}**",
            f"- boot handoff jumps to address 0: **{facts.get('jump_to_zero_present')}**",
            f"- PC tool interface compile flag PCTOOL_ON: `{facts.get('pctool_on')}`",
            f"- JUDGEMENT_STANDARD: `{facts.get('judgement_standard')}`",
            f"- SDK flash read API present: **{facts.get('spi_flash_read_api_present')}**",
            '', '## Host-side research target',
            '- `b1_download_v1.7.exe` was analyzed offline and classified as a Cygwin/Flash-Burner utility; it is not treated as the FlashBoot PC HID protocol source.',
            '- V8.7 reconstructs the exact embedded 64K FlashBoot and derives recovery USB/HID plus its ordered PC command table directly from that image.',
            '- This does **not** authorize or execute any flash command; it is evidence gathering only.',
            '', '## Transport hints from b1_download',
            '```json',json.dumps(b1.get('transport_hints',{}),indent=2),'```','',
            '## Gate','- no physical USB board','- no boot command sent','- no flash read/erase/write executed','- `FLASH_ALLOWED=NO`'
          ]
          (E/'V8_7_SDK_REPORT.md').write_text('\n'.join(report)+'\n')
          proto=json.loads((E/'FLASH_BOOT_USB_FACTS.json').read_text()) if (E/'FLASH_BOOT_USB_FACTS.json').exists() else {}
          ctab=json.loads((E/'FLASH_BOOT_COMMAND_TABLE.json').read_text()) if (E/'FLASH_BOOT_COMMAND_TABLE.json').exists() else {}
          status={'sdk_commit':(E/'SDK_COMMIT.txt').read_text().strip(),
                  'boot_flag_internal_path_proven':bool(facts.get('usbdevice_pc_flag_present') and facts.get('jump_to_zero_present')),
                  'recovery_usb_descriptor_proven':bool(proto.get('pid')=='0x2244'),
                  'recovery_vid':proto.get('vid'),'recovery_pid':proto.get('pid'),
                  'recovery_hid_input_bytes':proto.get('input_report_bytes'),
                  'recovery_hid_output_bytes':proto.get('output_report_bytes'),
                  'recovery_hid_feature_bytes':proto.get('feature_report_bytes'),
                  'flashboot_pc_command_table_proven':bool(ctab.get('ascii_command_table_proven')),
                  'host_pc_wire_protocol_proven':False,'flash_read_wire_protocol_proven':False,'FLASH_ALLOWED':False}
          (E/'V8_7_SDK_STATUS.json').write_text(json.dumps(status,indent=2)+'\n')
          PY
          cat /tmp/sdkv87/evidence/V8_7_SDK_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '## b1_download protocol hits (first 160)' >> "$GITHUB_STEP_SUMMARY"
          head -160 /tmp/sdkv87/evidence/B1_DOWNLOAD_PROTOCOL_HITS.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '## PC upgrade source hits (first 120)' >> "$GITHUB_STEP_SUMMARY"
          head -120 /tmp/sdkv87/evidence/SDK_PC_UPGRADE_SEARCH.txt >> "$GITHUB_STEP_SUMMARY" || true

