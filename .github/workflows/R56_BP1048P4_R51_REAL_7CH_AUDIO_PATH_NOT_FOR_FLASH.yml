          test "${#OKN_OBJS[@]}" -ge 5

          LIBS=(
            "$SDK/MVsB1_Base_SDK/driver/driver/libDriver.a"
            "$SDK/MVsB1_Base_SDK/middleware/audio/libsra.a"
            "$SDK/MVsB1_Base_SDK/middleware/cec/libcec.a"
            "$SDK/MVsB1_Base_SDK/middleware/audio/libsbcenc.a"
            "$SDK/MVsB1_Base_SDK/middleware/audio/libVocalCut.a"
            "$SDK/MVsB1_Base_SDK/middleware/audio/libmp3enc.a"
            "$SDK/MVsB1_Base_SDK/middleware/audio/libAudioEffectLibrary.a"
            "$SDK/MVsB1_Base_SDK/middleware/audio/libresampler.a"
            "$SDK/MVsB1_Base_SDK/middleware/audio/libAudioDecoderLibrary.a"
            "$SDK/MVsB1_Base_SDK/middleware/bluetooth/libBtStack.a"
            "$SDK/MVsB1_Base_SDK/middleware/flashfs/libFlashFS.a"
            "$SDK/MVsB1_Base_SDK/middleware/lrc/libLrc.a"
            "$SDK/MVsB1_Base_SDK/middleware/fatfs/libfatfs.a"
            "$SDK/MVsB1_Base_SDK/middleware/rtc/libRTC.a"
            "$SDK/MVsB1_Base_SDK/middleware/audio/libcvsd_plc.a"
            "$SDK/MVsB1_Base_SDK/middleware/audio/libBlueAEC.a"
            "$SDK/MVsB1_Base_SDK/middleware/xmai/libxmauth.a"
            "$SDK/BT_Audio_APP/bt_audio_app_src/libopus/lib/libopus.a"
          )

          for lib in "${LIBS[@]}"; do
            test -f "$lib" || {
              echo "missing library: $lib" >&2
              exit 1
            }
          done

          set +e
          nds32le-elf-gcc \
            -static \
            -nostartfiles \
            -g3 \
            -mcpu=d1088-spu \
            -mcmodel=medium \
            -mext-dsp \
            -Wl,--gc-sections \
            -Wl,-Map,"$MAP" \
            -T "$SDK/BT_Audio_APP/nds32-ae210p.ld" \
            -o "$ELF" \
            "${OBJS[@]}" \
            "${OKN_OBJS[@]}" \
            /tmp/r56_audio_bridge.o \
            /tmp/r55_uart_mutex_compat.o \
            -Wl,--start-group \
            "${LIBS[@]}" \
            -ldsp -lm \
            -Wl,--end-group \
            > /tmp/R55_LINK.log 2>&1
          rc=$?
          set -e

          echo "$rc" > /tmp/R55_LINK_RC.txt

          if [ "$rc" -ne 0 ]; then
            sed -n '1,400p' /tmp/R55_LINK.log \
              > /tmp/R55_LINK_FIRST_ERRORS.txt
            exit "$rc"
          fi

          nds32le-elf-size "$ELF" \
            > /tmp/R55_SIZE.txt
          nds32le-elf-readelf -h -S -l "$ELF" \
            > /tmp/R55_READELF.txt
          nds32le-elf-readelf -Ws "$ELF" \
            > /tmp/R55_SYMBOLS_READELF.txt
          nds32le-elf-readelf -rW "$ELF" \
            > /tmp/R55_RELOCATIONS.txt
          nds32le-elf-nm -a -C "$ELF" \
            > /tmp/R55_FINAL_SYMBOLS.txt
          nds32le-elf-objdump -d "$ELF" \
            > /tmp/R55_DISASM.txt

          sha256sum "$ELF" "$MAP" \
            > /tmp/R55_IMAGE_SHA256.txt

      - name: Gate final real 7CH vendor runtime integration
        id: final_symbol_gate
        if: steps.full_link.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          ELF=/tmp/R56_BP1048P4_R51_REAL_7CH_AUDIO_PATH_NOT_FOR_FLASH.elf

          grep -Eq 'Machine:.*(Andes|NDS32|nds32)' \
            /tmp/R55_READELF.txt

          for sym in \
            _start \
            HIDUsb_Rx \
            UsbLoadAudioMode \
            Communication_Effect_Init \
            Communication_Effect_Send \
            okn_r51_init \
            okn_r51_process_stereo \
            okn_r51_handle_usb_report \
            okn_router7_process_stereo \
            okn_peq7_apply \
            okn_gain7_apply \
            okn_usb_proto_handle \
            okn_r56_audio_init \
            okn_r56_audio_process \
            okn_r56_audio_space_ok \
            okn_r56_audio_push \
            AudioI2S_Init \
            AudioI2S0_DataSet \
            AudioI2S1_DataSet \
            AudioI2S0_DataSpaceLenGet \
            AudioI2S1_DataSpaceLenGet
          do
            grep -Eq "[[:space:]]${sym}$" \
              /tmp/R55_FINAL_SYMBOLS.txt || {
                echo "missing final symbol: $sym" >&2
                exit 1
              }
          done

          awk \
            '$7=="UND" && ($5=="GLOBAL" || $5=="WEAK") {print}' \
            /tmp/R55_SYMBOLS_READELF.txt \
            > /tmp/R55_RUNTIME_UNRESOLVED.txt

          if [ -s /tmp/R55_RUNTIME_UNRESOLVED.txt ]; then
            cat /tmp/R55_RUNTIME_UNRESOLVED.txt >&2
            exit 1
          fi

          if grep -Eq '^Relocation section ' /tmp/R55_RELOCATIONS.txt; then
            echo "unexpected relocation section(s) in final static ELF" >&2
            cat /tmp/R55_RELOCATIONS.txt >&2
            exit 1
          fi

          # We deliberately do NOT objcopy to a raw BIN in R56.
          test ! -e /tmp/R56_BP1048P4_R51_REAL_7CH_AUDIO_PATH_NOT_FOR_FLASH.bin

          echo "PASS: full vendor BP1048P4 ELF linked with live R51 audio path"
          echo "PASS: vendor HIDUsb_Rx contains R51 protocol bridge"
          echo "PASS: stock USB tuning fallback retained"
          echo "PASS: PEQ and dedicated Gain are retained in final vendor ELF from real audio calls"
          echo "PASS: CH1/2 DAC0, CH3 DACX logical, CH4/5 I2S0, CH6/7 I2S1 routing retained"
          echo "PASS: no raw flashable BIN generated by R56"

      - name: Build R56 evidence bundle
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          OUT=/tmp/R56_BP1048P4_R51_REAL_7CH_AUDIO_PATH_EVIDENCE
          rm -rf "$OUT"
          mkdir -p "$OUT"

          cp -f /tmp/R55_TOOLCHAIN.txt "$OUT/" 2>/dev/null || true
          cp -f /tmp/R55_COMMUNICATION_PATCH.diff "$OUT/" 2>/dev/null || true
          cp -f /tmp/R55_SOURCE_GRAPH_SUMMARY.txt "$OUT/" 2>/dev/null || true
          cp -f /tmp/R55_ACTIVE_SOURCES.tsv "$OUT/" 2>/dev/null || true
          cp -f /tmp/R55_EXCLUDED_SOURCES.tsv "$OUT/" 2>/dev/null || true
          cp -f /tmp/R55_COMPILE_SUMMARY.txt "$OUT/" 2>/dev/null || true
          cp -f /tmp/R55_COMPILE_RESULTS.tsv "$OUT/" 2>/dev/null || true
          cp -f /tmp/R55_FIRST_COMPILE_FAILURES.txt "$OUT/" 2>/dev/null || true
          cp -f /tmp/R55_R51_OBJECT_SYMBOLS.txt "$OUT/" 2>/dev/null || true
          cp -f /tmp/R55_COMMUNICATION_RELOCS.txt "$OUT/" 2>/dev/null || true
          cp -f /tmp/R55_COMMUNICATION_OBJDUMP.txt "$OUT/" 2>/dev/null || true
          cp -f /tmp/R55_COMMUNICATION_SYMBOLS.txt "$OUT/" 2>/dev/null || true
          cp -f /tmp/R55_LINK.log "$OUT/" 2>/dev/null || true
          cp -f /tmp/R55_LINK_RC.txt "$OUT/" 2>/dev/null || true
          cp -f /tmp/R55_LINK_FIRST_ERRORS.txt "$OUT/" 2>/dev/null || true
          cp -f /tmp/R55_SIZE.txt "$OUT/" 2>/dev/null || true
          cp -f /tmp/R55_READELF.txt "$OUT/" 2>/dev/null || true
          cp -f /tmp/R55_SYMBOLS_READELF.txt "$OUT/" 2>/dev/null || true
          cp -f /tmp/R55_RUNTIME_UNRESOLVED.txt "$OUT/" 2>/dev/null || true
          cp -f /tmp/R55_RELOCATIONS.txt "$OUT/" 2>/dev/null || true
          cp -f /tmp/R55_FINAL_SYMBOLS.txt "$OUT/" 2>/dev/null || true
          cp -f /tmp/R55_DISASM.txt "$OUT/" 2>/dev/null || true
          cp -f /tmp/R55_IMAGE_SHA256.txt "$OUT/" 2>/dev/null || true
          cp -f /tmp/R56_AUDIO_PATH_STATE.txt "$OUT/" 2>/dev/null || true
          cp -f /tmp/R56_MAIN_TASK_PATCH.diff "$OUT/" 2>/dev/null || true
          cp -f /tmp/R56_AUDIO_CORE_PATCH.diff "$OUT/" 2>/dev/null || true
          cp -f /tmp/R56_AUDIO_BRIDGE_SYMBOLS.txt "$OUT/" 2>/dev/null || true
          cp -f /tmp/R56_AUDIO_BRIDGE_RELOCS.txt "$OUT/" 2>/dev/null || true
          cp -f /tmp/R56_AUDIO_BRIDGE_OBJDUMP.txt "$OUT/" 2>/dev/null || true
          cp -f /tmp/R56_AUDIO_CORE_RELOCS.txt "$OUT/" 2>/dev/null || true
          cp -f /tmp/R56_MAIN_TASK_RELOCS.txt "$OUT/" 2>/dev/null || true
          cp -f /tmp/r56gen/okn_r56_audio_bridge.h "$OUT/" 2>/dev/null || true
          cp -f /tmp/r56gen/okn_r56_audio_bridge.c "$OUT/" 2>/dev/null || true

          cp -f \
            /tmp/R56_BP1048P4_R51_REAL_7CH_AUDIO_PATH_NOT_FOR_FLASH.elf \
            "$OUT/" 2>/dev/null || true
          cp -f \
            /tmp/R56_BP1048P4_R51_REAL_7CH_AUDIO_PATH_NOT_FOR_FLASH.map \
            "$OUT/" 2>/dev/null || true

          cat > "$OUT/R55_STATUS.txt" <<EOF
          R56 BP1048P4 R51 REAL 7CH AUDIO PATH INTEGRATION

          compile_vendor=${{ steps.compile_vendor.outcome }}
          compile_r51=${{ steps.compile_r51.outcome }}
          compile_audio_bridge=${{ steps.compile_audio_bridge.outcome }}
          audio_callgraph=${{ steps.audio_callgraph.outcome }}
          hid_callgraph=${{ steps.hid_callgraph.outcome }}
          compat=${{ steps.compat.outcome }}
          full_link=${{ steps.full_link.outcome }}
          final_symbol_gate=${{ steps.final_symbol_gate.outcome }}

          SAFETY STATUS: NOT FOR FLASH

          R56 intentionally does not create a raw .bin.
          This stage proves vendor compile/link/call-graph plus real audio-buffer routing.

          Proven in R56:
          - live vendor DAC0 stereo buffer calls R51 processing
          - R51 executes PEQ before dedicated Gain
          - CH1/2 route to DAC0 L/R
          - CH3 routes to DACX logical mono lane
          - CH4/5 route to I2S0 L/R
          - CH6/7 route to I2S1 L/R
          - dual I2S driver calls are retained by real call graph

          Still NOT proven:
          - exact production-board I2S pin wiring
          - physical amplifier/output identity of DACX CH3
          - first-flash boot entry
          - stock image readback
          - rollback/recovery image
          EOF

          (
            cd /tmp
            zip -qr \
              R56_BP1048P4_R51_REAL_7CH_AUDIO_PATH_EVIDENCE.zip \
              R56_BP1048P4_R51_REAL_7CH_AUDIO_PATH_EVIDENCE
            sha256sum \
              R56_BP1048P4_R51_REAL_7CH_AUDIO_PATH_EVIDENCE.zip \
              > R56_BP1048P4_R51_REAL_7CH_AUDIO_PATH_EVIDENCE.zip.sha256
          )

          cat \
            /tmp/R56_BP1048P4_R51_REAL_7CH_AUDIO_PATH_EVIDENCE.zip.sha256

      - name: Upload R56 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R56-BP1048P4-R51-REAL-7CH-AUDIO-PATH-EVIDENCE
          path: |
            /tmp/R56_BP1048P4_R51_REAL_7CH_AUDIO_PATH_EVIDENCE.zip
            /tmp/R56_BP1048P4_R51_REAL_7CH_AUDIO_PATH_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: R56 final gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          cat /tmp/R55_SOURCE_GRAPH_SUMMARY.txt || true
          cat /tmp/R55_COMPILE_SUMMARY.txt || true
          cat /tmp/R55_LINK_FIRST_ERRORS.txt 2>/dev/null || true

          test "${{ steps.compile_vendor.outcome }}" = "success"
          test "${{ steps.compile_r51.outcome }}" = "success"
          test "${{ steps.compile_audio_bridge.outcome }}" = "success"
          test "${{ steps.audio_callgraph.outcome }}" = "success"
          test "${{ steps.hid_callgraph.outcome }}" = "success"
          test "${{ steps.compat.outcome }}" = "success"
          test "${{ steps.full_link.outcome }}" = "success"
          test "${{ steps.final_symbol_gate.outcome }}" = "success"

          echo "R56_VENDOR_USB_RUNTIME_INTEGRATION=PASS"
          echo "R56_REAL_7CH_AUDIO_PATH=PASS"
          echo "R56_PEAKING_EQ_BEFORE_DEDICATED_GAIN=PASS"
          echo "R56_RAW_BIN_CREATED=NO"
          echo "FLASH_ALLOWED=NO"
