      # setup-gradle scans Gradle project files, so the generated project must exist first.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Verify frozen protocol core and V4 read-only probe
        shell: bash
        run: |
          set -euo pipefail
          echo "d04458da9e590825c33e19b3726087144d0da03ddeedebd2bee2a25e47cf3ce0  app/src/main/java/com/okn/peramp/DspProtocol.java" | sha256sum -c -
          echo "c0cc02d282db07f9639f164ac7f5f506e7ef211b4b779932c3fb6562b413576c  app/src/main/java/com/okn/peramp/BleManager.java" | sha256sum -c -

      - name: Validate PEQ safety, reset path, and V4 no-TX probe
        shell: bash
        run: |
          set -euo pipefail
          python3 Sources/validate_v38_gate.py
          python3 Sources/validate_v39_reset.py
          python3 Sources/validate_oknpv4.py

      - name: Build Debug and Release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk OKNPV4-debug.apk
          cp app/build/outputs/apk/release/app-release.apk OKNPV4-release.apk

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging OKNPV4-debug.apk | tee OKNPV4-apk-badging.txt
          grep -q "package: name='com.okn.peramp' versionCode='4000' versionName='4.0.0'" OKNPV4-apk-badging.txt
          grep -q "application-label:'OKN Peramp'" OKNPV4-apk-badging.txt

      - name: Package generated source and checksums
        shell: bash
        run: |
          set -euo pipefail
          zip -qr OKNPV4-source.zip app Sources build.gradle settings.gradle gradle.properties -x '*/build/*' -x '.gradle/*'
          sha256sum OKNPV4-debug.apk OKNPV4-release.apk OKNPV4-source.zip > OKNPV4-SHA256SUMS.txt
          cat OKNPV4-SHA256SUMS.txt

      - name: Upload OKNPV4 artifact
        uses: actions/upload-artifact@v7
        with:
          name: OKNPV4
          path: |
            OKNPV4-debug.apk
            OKNPV4-release.apk
            OKNPV4-source.zip
            OKNPV4-SHA256SUMS.txt
            OKNPV4-apk-badging.txt
          if-no-files-found: error
          retention-days: 30
