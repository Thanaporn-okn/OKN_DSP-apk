name: Build OKN DSP V11.1 AB01 AB02 AB03 Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Find V11.1 ZIP
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -type f -name 'OKN_DSP_V11_1_AB01_AB02_AB03.zip' | head -n 1)
          test -n "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract V11.1
        run: |
          rm -rf payload
          mkdir payload
          unzip -q "$ZIP" -d payload

      - name: Create clean Flutter Android project
        run: |
          flutter create \
            --platforms=android \
            --org com.okn \
            --project-name okn_dsp \
            temp_app

      - name: Install V11.1 files
        run: |
          cp payload/pubspec.yaml temp_app/pubspec.yaml
          rm -rf temp_app/lib
          cp -r payload/lib temp_app/lib
          mkdir -p temp_app/android/app/src/main/kotlin/com/okn/okn_dsp
          cp payload/android_patch/MainActivity.kt \
            temp_app/android/app/src/main/kotlin/com/okn/okn_dsp/MainActivity.kt

      - name: Install Bluetooth permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("temp_app/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          perms = """    <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN"
                  android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"
                  android:maxSdkVersion="30" />
          """
          if "android.permission.BLUETOOTH_SCAN" not in s:
              pos = s.find(">", s.find("<manifest"))
              s = s[:pos+1] + "\n" + perms + s[pos+1:]
          p.write_text(s)
          PY

      - name: Get packages
        working-directory: temp_app
        run: flutter pub get

      - name: Analyze
        working-directory: temp_app
        run: flutter analyze

      - name: Build APK
        working-directory: temp_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN_DSP_V11_1_AB01_AB02_AB03_APK
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
