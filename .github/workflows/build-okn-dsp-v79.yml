name: Build OKN DSP V79 Production Icon Refresh

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_ANDROID_V79_PRODUCTION_ICON_REFRESH.zip'
      - '.github/workflows/build-okn-dsp-v79.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify V79 source
        shell: bash
        run: |
          set -euo pipefail
          echo '45b19b7df73b49fb35c7510d59fcfb75e8d8a36c73ea94b2078dc2f6ea0472c8  OKN_DSP_ANDROID_V79_PRODUCTION_ICON_REFRESH.zip' | sha256sum -c -
          rm -rf /tmp/okn_v79
          mkdir -p /tmp/okn_v79
          unzip -q OKN_DSP_ANDROID_V79_PRODUCTION_ICON_REFRESH.zip -d /tmp/okn_v79
          cd /tmp/okn_v79
          python3 preflight_v79.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/okn_v79
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and package artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn_v79/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          mkdir -p artifact
          cp "$APK" artifact/OKN_DSP_V79_PRODUCTION_ICON_REFRESH-debug.apk
          cp /tmp/okn_v79/README_V79.txt artifact/
          cp /tmp/okn_v79/evidence/OKN_DSP_V79_ICON_MASTER_USER_UPLOAD.png artifact/
          cp /tmp/okn_v79/evidence/OKN_DSP_V79_PRODUCTION_ICON_REFRESH_PLAN.txt artifact/
          cp /tmp/okn_v79/evidence/OKN_DSP_V79_PRODUCTION_ICON_REFRESH_PLAN.json artifact/
          sha256sum artifact/OKN_DSP_V79_PRODUCTION_ICON_REFRESH-debug.apk > artifact/OKN_DSP_V79_PRODUCTION_ICON_REFRESH-debug.sha256
          ls -lh artifact

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-V79-PRODUCTION-ICON-REFRESH-debug-apk
          path: artifact/
          if-no-files-found: error
          retention-days: 30
