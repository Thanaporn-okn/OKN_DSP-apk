      - name: Build active vendor source graph
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          import xml.etree.ElementTree as ET, os
          sdk=Path(os.environ['RUNNER_TEMP'])/'bp1048sdk'; app=sdk/'BT_Audio_APP'
          project=ET.parse(app/'.project').getroot(); cproject=ET.parse(app/'.cproject').getroot()
          exclusions=set()
          for e in cproject.iter('entry'):
              raw=e.attrib.get('excluding',''); exclusions.update(x for x in raw.split('|') if x)
          sources={}
          local=app/'bt_audio_app_src'
          for p in local.rglob('*'):
              if p.is_file() and p.suffix.lower() in {'.c','.s'}: sources[p.resolve()]=p.relative_to(app).as_posix()
          for link in project.iter('link'):
              name=(link.findtext('name') or '').strip(); typ=(link.findtext('type') or '').strip(); uri=(link.findtext('locationURI') or '').strip().replace('&amp;','&')
              if typ!='1' or not name.lower().endswith(('.c','.s')): continue
              if uri.startswith('PARENT-1-PROJECT_LOC/'): p=sdk/uri[len('PARENT-1-PROJECT_LOC/'):]
              elif uri.startswith('WORKSPACE_LOC/'): p=sdk/uri[len('WORKSPACE_LOC/'):]
              else: continue
              if p.is_file(): sources[p.resolve()]=name
          def norm(x): return x.replace('\\','/').lower().replace('_','').strip('/')
          exn=sorted({norm(x) for x in exclusions}); active=[]; excluded=[]
          for physical,logical in sorted(sources.items(),key=lambda x:x[1].lower()):
              ln=norm(logical); matches=[e for e in exn if ln==e or ln.endswith('/'+e)]
              if matches: excluded.append((str(physical),logical,matches[0]))
              else: active.append((str(physical),logical))
          Path('/tmp/R58_ACTIVE_SOURCES.tsv').write_text(''.join(f'{p}\t{l}\n' for p,l in active))
          Path('/tmp/R58_EXCLUDED_SOURCES.tsv').write_text(''.join(f'{p}\t{l}\t{e}\n' for p,l,e in excluded))
          Path('/tmp/R58_SOURCE_GRAPH_SUMMARY.txt').write_text(f'DISCOVERED={len(sources)}\nACTIVE={len(active)}\nEXCLUDED={len(excluded)}\n')
          if len(active)<100: raise SystemExit(f'unexpectedly small graph {len(active)}')
          print(Path('/tmp/R58_SOURCE_GRAPH_SUMMARY.txt').read_text(),end='')
          PY2

      - name: Compile full vendor source graph
        id: compile_vendor
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          CC=nds32le-elf-gcc
          COMMON=(-Os -g3 -mcpu=d1088-spu -mcmodel=medium -mext-dsp -mext-zol -fsingle-precision-constant -ffunction-sections -fdata-sections)
          APP=(-DFUNC_OS_EN=1 -DCFG_APP_CONFIG -DHAVE_CONFIG_H)
          rm -rf /tmp/r58obj /tmp/r58compile; mkdir -p /tmp/r58obj /tmp/r58compile
          : > /tmp/R58_COMPILE_RESULTS.tsv
          pass=0; fail=0; n=0
          while IFS=$'\t' read -r src logical; do
            test -n "$src" || continue; n=$((n+1)); rel="${logical%.*}.o"; obj="/tmp/r58obj/$rel"; log="/tmp/r58compile/${n}.log"; mkdir -p "$(dirname "$obj")"
            set +e
            "$CC" "${COMMON[@]}" @"$RUNNER_TEMP/R58_INCLUDES.rsp" "${APP[@]}" -c "$src" -o "$obj" >"$log" 2>&1
            rc=$?; set -e
            if [ "$rc" -eq 0 ]; then pass=$((pass+1)); printf 'PASS\t%s\t%s\n' "$logical" "$obj" >> /tmp/R58_COMPILE_RESULTS.tsv
            else fail=$((fail+1)); printf 'FAIL\t%s\t%s\n' "$logical" "$log" >> /tmp/R58_COMPILE_RESULTS.tsv; fi
          done < /tmp/R58_ACTIVE_SOURCES.tsv
          printf 'TOTAL=%d\nPASS=%d\nFAIL=%d\n' "$n" "$pass" "$fail" | tee /tmp/R58_COMPILE_SUMMARY.txt
          : > /tmp/R58_FIRST_COMPILE_FAILURES.txt
          awk -F '\t' '$1=="FAIL" && n<20 {print $2"\t"$3; n++}' /tmp/R58_COMPILE_RESULTS.tsv | while IFS=$'\t' read -r logical log; do echo "===== $logical =====" >> /tmp/R58_FIRST_COMPILE_FAILURES.txt; sed -n '1,100p' "$log" >> /tmp/R58_FIRST_COMPILE_FAILURES.txt; done
          test "$fail" -eq 0

      - name: Compile current gain runtime into vendor ABI
        id: compile_gain
        if: steps.compile_vendor.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r58_gain_obj
          for src in "$R57_ROOT/firmware/src/okn56_gain7.c" "$R57_ROOT/firmware/src/okn56_runtime.c"; do
            obj="/tmp/r58_gain_obj/$(basename "${src%.c}").o"
            nds32le-elf-gcc -std=gnu11 -Os -g3 -mcpu=d1088-spu -mcmodel=medium -mext-dsp -mext-zol -fsingle-precision-constant -ffunction-sections -fdata-sections -Wall -Wextra -Werror @"$RUNNER_TEMP/R58_INCLUDES.rsp" -c "$src" -o "$obj"
          done
          nds32le-elf-nm -a /tmp/r58_gain_obj/*.o > /tmp/R58_GAIN_SYMBOLS.txt
          for sym in okn56_runtime_init okn56_ufe_write okn56_ufe_read okn56_process_lane okn56_gain_process_lane; do grep -Eq "[[:space:]]${sym}$" /tmp/R58_GAIN_SYMBOLS.txt; done

      - name: Compile R59 USB bridge into vendor ABI
        id: compile_transport
        if: steps.compile_vendor.outcome == 'success' && steps.compile_gain.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          nds32le-elf-gcc -std=gnu11 -Os -g3 -mcpu=d1088-spu -mcmodel=medium -mext-dsp -mext-zol -fsingle-precision-constant -ffunction-sections -fdata-sections -Wall -Wextra -Werror @"$RUNNER_TEMP/R58_INCLUDES.rsp" -DFUNC_OS_EN=1 -DCFG_APP_CONFIG -DHAVE_CONFIG_H -c "$RUNNER_TEMP/r58gen/okn_r59_usb_bridge.c" -o /tmp/r59_usb_bridge.o
          nds32le-elf-readelf -rW /tmp/r59_usb_bridge.o > /tmp/R59_USB_BRIDGE_RELOCS.txt
