          for dep in okn56_runtime_init okn56_process_lane AudioI2S0_DataSet AudioI2S1_DataSet AudioI2S0_DataSpaceLenGet AudioI2S1_DataSpaceLenGet; do grep -F "$dep" /tmp/R58_BRIDGE_RELOCS.txt >/dev/null; done
          for sym in okn58_audio_init okn58_audio_process okn58_audio_space_ok okn58_audio_push okn58_runtime; do grep -Eq "[[:space:]]${sym}$" /tmp/R58_BRIDGE_SYMBOLS.txt; done
          echo 'R58_BRIDGE_COMPILE=PASS'

      - name: Prove vendor audio objects call R58 bridge
        id: audio_callgraph
        if: steps.compile_bridge.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          CORE_OBJ="$(find /tmp/r58obj -type f -name audio_core_api.o | head -n1)"
          MAIN_OBJ="$(find /tmp/r58obj -type f -name main_task.o | head -n1)"
