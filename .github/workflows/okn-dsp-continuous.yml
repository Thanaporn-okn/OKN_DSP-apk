          nds32le-elf-readelf -rW "$MAIN_OBJ" > /tmp/R58_MAIN_TASK_RELOCS.txt
          for sym in okn58_audio_process okn58_audio_space_ok okn58_audio_push; do grep -F "$sym" /tmp/R58_AUDIO_CORE_RELOCS.txt >/dev/null; done
          grep -F okn58_audio_init /tmp/R58_MAIN_TASK_RELOCS.txt >/dev/null
          echo 'R58_REAL_VENDOR_PCM_CALLGRAPH=PASS' | tee /tmp/R58_CALLGRAPH_STATE.txt
          echo 'R58_GAIN_VIA_EQ=NO' >> /tmp/R58_CALLGRAPH_STATE.txt
          echo 'R58_PHYSICAL_BOARD_MAPPING=UNPROVEN' >> /tmp/R58_CALLGRAPH_STATE.txt
          echo 'R58_OUTPUT_HARDWARE_INIT=LOCKED' >> /tmp/R58_CALLGRAPH_STATE.txt

      - name: Prove vendor HID object calls R59 and preserves stock fallback
        id: transport_callgraph
        if: steps.compile_vendor.outcome == 'success' && steps.compile_transport.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          COMM_OBJ="$(find /tmp/r58obj -type f -name communication.o | head -n1)"
          test -s "$COMM_OBJ"
          nds32le-elf-readelf -rW "$COMM_OBJ" > /tmp/R59_COMMUNICATION_RELOCS.txt
          nds32le-elf-nm -a "$COMM_OBJ" > /tmp/R59_COMMUNICATION_SYMBOLS.txt
          nds32le-elf-objdump -dr "$COMM_OBJ" > /tmp/R59_COMMUNICATION_OBJDUMP.txt
          for sym in okn59_usb_claims okn59_usb_handle okn58_runtime UsbLoadAudioMode; do
            grep -F "$sym" /tmp/R59_COMMUNICATION_RELOCS.txt >/dev/null || { echo "missing communication relocation: $sym" >&2; exit 1; }
          done
          grep -Eq '[[:space:]][Tt][[:space:]]+Communication_Effect_Send$' /tmp/R59_COMMUNICATION_SYMBOLS.txt
          echo 'R59_CUSTOM_UFE_TRANSPORT_CALLGRAPH_VERIFIED=YES' | tee /tmp/R59_HID_CALLGRAPH_STATE.txt
          echo 'R59_STOCK_USB_FALLBACK_RETAINED=YES' >> /tmp/R59_HID_CALLGRAPH_STATE.txt
          echo 'R59_LIVE_USB_TRANSPORT_VERIFIED=NO' >> /tmp/R59_HID_CALLGRAPH_STATE.txt

      - name: R60 exhaustive OKN6/UFE protocol conformance
        id: r60_conformance
        if: steps.transport_callgraph.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/r58gen/test_r60_e2e.c" <<'C'
          #include <assert.h>
          #include <math.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <string.h>
          #include "okn56_runtime.h"
          #include "okn_r59_usb_bridge.h"

          static void w16be(uint8_t*p,unsigned v){p[0]=(uint8_t)(v>>8);p[1]=(uint8_t)v;}
          static void w32be(uint8_t*p,unsigned v){p[0]=(uint8_t)(v>>24);p[1]=(uint8_t)(v>>16);p[2]=(uint8_t)(v>>8);p[3]=(uint8_t)v;}
          static unsigned r32be(const uint8_t*p){return ((unsigned)p[0]<<24)|((unsigned)p[1]<<16)|((unsigned)p[2]<<8)|p[3];}
          static unsigned r16be(const uint8_t*p){return ((unsigned)p[0]<<8)|p[1];}
          static void wf(uint8_t*p,float f){uint32_t u;memcpy(&u,&f,4);p[0]=(uint8_t)u;p[1]=(uint8_t)(u>>8);p[2]=(uint8_t)(u>>16);p[3]=(uint8_t)(u>>24);}
          static void wu32le(uint8_t*p,uint32_t u){p[0]=(uint8_t)u;p[1]=(uint8_t)(u>>8);p[2]=(uint8_t)(u>>16);p[3]=(uint8_t)(u>>24);}
          static float rf(const uint8_t*p){uint32_t u=(uint32_t)p[0]|((uint32_t)p[1]<<8)|((uint32_t)p[2]<<16)|((uint32_t)p[3]<<24);float f;memcpy(&f,&u,4);return f;}
          static void hdr(uint8_t*p){memset(p,0,OKN59_REPORT_BYTES);memcpy(p,"OKN6",4);p[4]=OKN59_VERSION;}
          static uint8_t *ufe(uint8_t*p){return p+OKN59_HEADER_BYTES;}
          static void readq(uint8_t*q,unsigned id,unsigned off,unsigned len){uint8_t*u;hdr(q);u=ufe(q);u[0]=OKN56_UFE_READ;w32be(u+1,id);w16be(u+5,off);w16be(u+7,len);}
          static void writeq(uint8_t*q,unsigned id,unsigned off,unsigned len,float db){uint8_t*u;hdr(q);u=ufe(q);u[0]=OKN56_UFE_WRITE;w32be(u+1,id);w16be(u+5,off);w16be(u+7,len);wf(u+9,db);}
          static void expect_reply(const uint8_t*o,unsigned id,float db){
              assert(memcmp(o,"OKN6",4)==0 && o[4]==OKN59_VERSION);
              assert(o[5]==OKN56_UFE_RESPONSE);
              assert(r32be(o+6)==id);
              assert(r16be(o+10)==0u && r16be(o+12)==4u);
              assert(fabsf(rf(o+14)-db)<0.001f);
          }
          static float getv(okn56_runtime_t*r,unsigned id,uint8_t*q,uint8_t*o){
              readq(q,id,0u,4u);
              assert(okn59_usb_handle(r,q,OKN59_REPORT_BYTES,o,OKN59_REPORT_BYTES)==OKN59_REPORT_BYTES);
              assert(o[5]==OKN56_UFE_RESPONSE && r32be(o+6)==id);
              return rf(o+14);
          }
          int main(void){
              okn56_runtime_t r;
              uint8_t q[OKN59_REPORT_BYTES],o[OKN59_REPORT_BYTES];
              unsigned id; int h;
              assert(okn56_runtime_init(&r,48000u,0u));

              /* Identity is raw ASCII and read-only. */
              readq(q,29u,0u,4u);
              assert(okn59_usb_handle(&r,q,sizeof(q),o,sizeof(o))==OKN59_REPORT_BYTES);
              assert(memcmp(o,"OKN6",4)==0 && o[4]==OKN59_VERSION);
              assert(o[5]==OKN56_UFE_RESPONSE && r32be(o+6)==29u && r16be(o+12)==4u);
              assert(memcmp(o+14,"OKN6",4)==0);
              writeq(q,29u,0u,4u,0.0f);
              assert(okn59_usb_handle(&r,q,sizeof(q),o,sizeof(o))==0u);

              /* Every legal half-dB point, every channel, write then immediate readback. */
              for(id=22u;id<=28u;++id){
                  for(h=-140;h<=12;++h){
                      float db=0.5f*(float)h;
                      writeq(q,id,0u,4u,db);
                      assert(okn59_usb_handle(&r,q,sizeof(q),o,sizeof(o))==OKN59_REPORT_BYTES);
                      expect_reply(o,id,db);
                      assert(fabsf(getv(&r,id,q,o)-db)<0.001f);
                  }
              }

              /* Reset all channels and prove UFE ID isolation. */
              for(id=22u;id<=28u;++id){writeq(q,id,0u,4u,0.0f);assert(okn59_usb_handle(&r,q,sizeof(q),o,sizeof(o))==OKN59_REPORT_BYTES);}
              writeq(q,25u,0u,4u,-12.0f);assert(okn59_usb_handle(&r,q,sizeof(q),o,sizeof(o))==OKN59_REPORT_BYTES);
              for(id=22u;id<=28u;++id){float v=getv(&r,id,q,o);assert(fabsf(v-(id==25u?-12.0f:0.0f))<0.001f);}

              /* PCM lane isolation using the same runtime state. */
              {
                  int16_t x[7]={10000,10000,10000,10000,10000,10000,10000};
                  unsigned ch;
                  for(ch=0;ch<7u;++ch) okn56_process_lane(&r,(uint8_t)ch,&x[ch],1u,1u);
                  for(ch=0;ch<7u;++ch){
                      if(ch==3u) assert(x[ch] > 2500 && x[ch] < 2525); /* -12 dB ~= 0.2512 */
                      else assert(x[ch]==10000);
                  }
              }

              /* Invalid IDs, framing, offset, length and numeric range fail closed. */
              writeq(q,21u,0u,4u,0.0f); assert(okn59_usb_handle(&r,q,sizeof(q),o,sizeof(o))==0u);
              writeq(q,30u,0u,4u,0.0f); assert(okn59_usb_handle(&r,q,sizeof(q),o,sizeof(o))==0u);
              writeq(q,22u,1u,4u,0.0f);  assert(okn59_usb_handle(&r,q,sizeof(q),o,sizeof(o))==0u);
              writeq(q,22u,0u,2u,0.0f);  assert(okn59_usb_handle(&r,q,sizeof(q),o,sizeof(o))==0u);
              writeq(q,22u,0u,4u,-70.5f);assert(okn59_usb_handle(&r,q,sizeof(q),o,sizeof(o))==0u);
              writeq(q,22u,0u,4u,6.5f);  assert(okn59_usb_handle(&r,q,sizeof(q),o,sizeof(o))==0u);
              hdr(q); {uint8_t*u=ufe(q);u[0]=OKN56_UFE_WRITE;w32be(u+1,22u);w16be(u+5,0u);w16be(u+7,4u);wu32le(u+9,0x7fc00000u);} assert(okn59_usb_handle(&r,q,sizeof(q),o,sizeof(o))==0u);
              hdr(q); {uint8_t*u=ufe(q);u[0]=OKN56_UFE_WRITE;w32be(u+1,22u);w16be(u+5,0u);w16be(u+7,4u);wu32le(u+9,0x7f800000u);} assert(okn59_usb_handle(&r,q,sizeof(q),o,sizeof(o))==0u);
              hdr(q); {uint8_t*u=ufe(q);u[0]=OKN56_UFE_WRITE;w32be(u+1,22u);w16be(u+5,0u);w16be(u+7,4u);wu32le(u+9,0xff800000u);} assert(okn59_usb_handle(&r,q,sizeof(q),o,sizeof(o))==0u);
              readq(q,22u,1u,4u); assert(okn59_usb_handle(&r,q,sizeof(q),o,sizeof(o))==0u);
              readq(q,22u,0u,2u); assert(okn59_usb_handle(&r,q,sizeof(q),o,sizeof(o))==0u);
              readq(q,30u,0u,4u); assert(okn59_usb_handle(&r,q,sizeof(q),o,sizeof(o))==0u);

              /* HID namespace behavior: bad length/magic is not ours; bad version is reserved and consumed fail-closed. */
              hdr(q); assert(okn59_usb_claims(q,sizeof(q))); assert(!okn59_usb_claims(q,sizeof(q)-1u));
              q[0]='X'; assert(!okn59_usb_claims(q,sizeof(q)));
              hdr(q); q[4]=(uint8_t)(OKN59_VERSION+1u); assert(okn59_usb_claims(q,sizeof(q))); assert(okn59_usb_handle(&r,q,sizeof(q),o,sizeof(o))==0u);

              puts("R60_PROTOCOL_MATRIX=PASS");
              puts("R60_ALL_7CH_ALL_HALF_DB_POINTS=PASS");
              puts("R60_IDENTITY_READONLY=PASS");
              puts("R60_CHANNEL_ISOLATION=PASS");
              puts("R60_MALFORMED_FAIL_CLOSED=PASS");
              puts("R60_NUMERIC_FAIL_CLOSED=PASS");
              puts("GAIN_VIA_EQ=NO");
              return 0;
          }
          C
          cc -std=c11 -O2 -Wall -Wextra -Werror -Wpedantic \
            -I"$R57_ROOT/firmware/include" -I"$R57_ROOT/firmware/src" -I"$RUNNER_TEMP/r58gen" \
            "$RUNNER_TEMP/r58gen/test_r60_e2e.c" \
            "$R57_ROOT/firmware/src/okn56_gain7.c" "$R57_ROOT/firmware/src/okn56_runtime.c" \
            "$RUNNER_TEMP/r58gen/okn_r59_usb_bridge.c" -lm -o "$RUNNER_TEMP/r58gen/test_r60_e2e"
          "$RUNNER_TEMP/r58gen/test_r60_e2e" | tee /tmp/R60_PROTOCOL_CONFORMANCE.log
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -Wpedantic -fsanitize=address,undefined \
            -I"$R57_ROOT/firmware/include" -I"$R57_ROOT/firmware/src" -I"$RUNNER_TEMP/r58gen" \
            "$RUNNER_TEMP/r58gen/test_r60_e2e.c" \
            "$R57_ROOT/firmware/src/okn56_gain7.c" "$R57_ROOT/firmware/src/okn56_runtime.c" \
            "$RUNNER_TEMP/r58gen/okn_r59_usb_bridge.c" -lm -o "$RUNNER_TEMP/r58gen/test_r60_e2e_san"
          ASAN_OPTIONS=detect_leaks=0 "$RUNNER_TEMP/r58gen/test_r60_e2e_san" | tee /tmp/R60_PROTOCOL_SANITIZE.log
          grep -q '^R60_PROTOCOL_MATRIX=PASS$' /tmp/R60_PROTOCOL_CONFORMANCE.log
          grep -q '^R60_ALL_7CH_ALL_HALF_DB_POINTS=PASS$' /tmp/R60_PROTOCOL_CONFORMANCE.log
          grep -q '^R60_CHANNEL_ISOLATION=PASS$' /tmp/R60_PROTOCOL_CONFORMANCE.log
          grep -q '^GAIN_VIA_EQ=NO$' /tmp/R60_PROTOCOL_CONFORMANCE.log

      - name: R60 prove static USB reply-buffer path and keep live USB locked
        id: r60_usb_tx_static
        if: steps.r60_conformance.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          import os
          root=Path(os.environ['RUNNER_TEMP'])/'bp1048sdk'
          comm=root/'BT_Audio_APP/bt_audio_app_src/audio/communication.c'
          s=comm.read_text(encoding='latin-1')
          def span(text,sig):
              p=text.find(sig)
              if p<0: raise SystemExit('missing '+sig)
              b=text.find('{',p)
              if b<0: raise SystemExit('missing brace '+sig)
              d=0
              for i in range(b,len(text)):
                  if text[i]=='{': d+=1
                  elif text[i]=='}':
                      d-=1
                      if d==0:return text[p:i+1]
              raise SystemExit('unterminated '+sig)
          send=span(s,'void Communication_Effect_Send(uint8_t *buf, uint32_t len)')
          rx=span(s,'void HIDUsb_Rx(uint8_t *buf,uint16_t len)')
          for tok in ['#ifdef CFG_COMMUNICATION_BY_USB','memcpy(hid_tx_buf, buf, 256);']:
              if tok not in send: raise SystemExit('USB reply static path missing '+tok)
          for tok in ['okn59_usb_claims','okn59_usb_handle','Communication_Effect_Send','UsbLoadAudioMode(len,buf);']:
              if tok not in rx: raise SystemExit('HID RX integration missing '+tok)
          refs=[]
          for base in [root/'BT_Audio_APP',root/'MVsB1_Base_SDK']:
              for p in base.rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in {'.c','.h','.s'}: continue
                  try:t=p.read_text(encoding='latin-1')
                  except OSError:continue
                  if 'hid_tx_buf' in t:
                      for n,line in enumerate(t.splitlines(),1):
                          if 'hid_tx_buf' in line: refs.append(f'{p.relative_to(root)}:{n}:{line.strip()}')
          Path('/tmp/R60_HID_TX_BUF_REFS.txt').write_text('\n'.join(refs)+'\n')
          if len(refs)<2: raise SystemExit(f'insufficient hid_tx_buf evidence: {len(refs)}')
          Path('/tmp/R60_USB_TX_STATIC_GATE.txt').write_text(
              'R60_USB_REPLY_COPY_TO_HID_TX_BUF=PASS\n'
              'R60_CUSTOM_RX_TO_REPLY_CALLGRAPH=PASS\n'
              'R60_LIVE_USB_TX_VERIFIED=NO\n'
              'R60_HOST_TO_DEVICE_USB=NO\n'
              'R60_FEATURE_SET_REPORT_ALLOWED=NO\n')
          print('R60_USB_TX_STATIC_GATE=PASS')
          print('R60_LIVE_USB_TX_VERIFIED=NO')
          PY2
          grep -q '^R60_USB_REPLY_COPY_TO_HID_TX_BUF=PASS$' /tmp/R60_USB_TX_STATIC_GATE.txt
          grep -q '^R60_LIVE_USB_TX_VERIFIED=NO$' /tmp/R60_USB_TX_STATIC_GATE.txt


      - name: R61 discover actual HID TX consumer + USB descriptor evidence
        id: r61_usb_tx_discovery
        if: steps.r60_usb_tx_static.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          import os,re
          root=Path(os.environ['RUNNER_TEMP'])/'bp1048sdk'
          refs=[]
          descriptor_hits=[]
          for base in [root/'BT_Audio_APP', root/'MVsB1_Base_SDK']:
              for p in base.rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in {'.c','.h','.s','.inc'}:
                      continue
                  try:
                      t=p.read_text(encoding='latin-1')
                  except OSError:
                      continue
                  rel=p.relative_to(root).as_posix()
                  for n,line in enumerate(t.splitlines(),1):
                      if 'hid_tx_buf' in line:
                          refs.append(f'{rel}:{n}:{line.strip()}')
                      u=line.upper()
                      if ('HID' in u or 'USB' in u) and any(k in u for k in ['REPORT','ENDPOINT','EP','DESCRIPTOR','0X81','256']):
                          descriptor_hits.append(f'{rel}:{n}:{line.strip()}')
          Path('/tmp/R61_HID_TX_ALL_REFS.txt').write_text('\n'.join(refs)+'\n')
          Path('/tmp/R61_USB_DESCRIPTOR_CANDIDATES.txt').write_text('\n'.join(descriptor_hits[:2000])+'\n')
          external=[x for x in refs if 'BT_Audio_APP/bt_audio_app_src/audio/communication.c:' not in x]
          Path('/tmp/R61_HID_TX_EXTERNAL_REFS.txt').write_text('\n'.join(external)+'\n')
          state=[
              'R61_USB_TX_DISCOVERY=PASS',
              f'R61_HID_TX_REF_COUNT={len(refs)}',
              f'R61_HID_TX_EXTERNAL_REF_COUNT={len(external)}',
              f'R61_USB_DESCRIPTOR_CANDIDATE_COUNT={len(descriptor_hits)}',
              'R61_LIVE_USB_EXECUTED=NO',
              'R61_HOST_TO_DEVICE_USB=NO',
          ]
          if external:
              state.append('R61_HID_TX_CONSUMER_CANDIDATES_FOUND=YES')
          else:
              state.append('R61_HID_TX_CONSUMER_CANDIDATES_FOUND=NO')
          Path('/tmp/R61_USB_TX_DISCOVERY_STATE.txt').write_text('\n'.join(state)+'\n')
          print('\n'.join(state))
          if len(refs) < 2:
              raise SystemExit('insufficient hid_tx_buf references')
          PY2
          grep -q '^R61_USB_TX_DISCOVERY=PASS$' /tmp/R61_USB_TX_DISCOVERY_STATE.txt
          grep -q '^R61_LIVE_USB_EXECUTED=NO$' /tmp/R61_USB_TX_DISCOVERY_STATE.txt

      - name: R62 discover SDK sample output config without enabling hardware
        id: r62_output_discovery
        if: steps.r61_usb_tx_discovery.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          import os,re
          root=Path(os.environ['RUNNER_TEMP'])/'bp1048sdk'
          cfg=root/'BT_Audio_APP/bt_audio_app_src/inc/app_config.h'
          s=cfg.read_text(encoding='latin-1')
          active=[]
          for n,line in enumerate(s.splitlines(),1):
              m=re.match(r'^\s*#define\s+([A-Za-z0-9_]+)(?:\s+(.*))?$', line)
              if m and any(k in m.group(1) for k in ['I2S','DAC','AUDIO','USB','SPDIF']):
                  active.append(f'app_config.h:{n}:{line.strip()}')
          Path('/tmp/R62_ACTIVE_AUDIO_OUTPUT_MACROS.txt').write_text('\n'.join(active)+'\n')

          pin_hits=[]
          api_hits=[]
          rx_pin=re.compile(r'(I2S|DAC|GPIO|PIN|IOMUX|MFP|FUNC_SEL|PORT)', re.I)
          rx_api=re.compile(r'(AudioI2S[01]_|AudioDAC|DAC[0-9A-Za-z_]*|I2S[01]_[A-Za-z0-9_]+)')
          for base in [root/'BT_Audio_APP',root/'MVsB1_Base_SDK/driver',root/'MVsB1_Base_SDK/middleware']:
              for p in base.rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in {'.c','.h'}: continue
                  try:t=p.read_text(encoding='latin-1')
                  except OSError:continue
                  rel=p.relative_to(root).as_posix()
                  for n,line in enumerate(t.splitlines(),1):
                      if rx_pin.search(line) and any(k in line for k in ['CFG_','GPIO','Pin','PIN','I2S','DAC']):
                          pin_hits.append(f'{rel}:{n}:{line.strip()}')
                      if rx_api.search(line):
                          api_hits.append(f'{rel}:{n}:{line.strip()}')
          Path('/tmp/R62_PINMUX_OUTPUT_CANDIDATES.txt').write_text('\n'.join(pin_hits[:3000])+'\n')
          Path('/tmp/R62_OUTPUT_API_CANDIDATES.txt').write_text('\n'.join(api_hits[:3000])+'\n')
          state=[
              'R62_OUTPUT_CONFIG_DISCOVERY=PASS',
              f'R62_ACTIVE_AUDIO_MACRO_COUNT={len(active)}',
              f'R62_PINMUX_CANDIDATE_COUNT={len(pin_hits)}',
              f'R62_OUTPUT_API_CANDIDATE_COUNT={len(api_hits)}',
              'R62_SDK_SAMPLE_CONFIG_DISCOVERED=YES',
              'R62_PHYSICAL_7CH_BOARD_MAPPING_VERIFIED=NO',
              'R62_OUTPUT_HARDWARE_INIT_ENABLED=NO',
              'R62_LIVE_BOARD_USB=NO',
          ]
          Path('/tmp/R62_OUTPUT_DISCOVERY_STATE.txt').write_text('\n'.join(state)+'\n')
          print('\n'.join(state))
          if not active or not api_hits:
              raise SystemExit('insufficient SDK output configuration evidence')
          PY2
          grep -q '^R62_OUTPUT_CONFIG_DISCOVERY=PASS$' /tmp/R62_OUTPUT_DISCOVERY_STATE.txt
          grep -q '^R62_PHYSICAL_7CH_BOARD_MAPPING_VERIFIED=NO$' /tmp/R62_OUTPUT_DISCOVERY_STATE.txt

      - name: R63 prove custom gain/transport/audio objects have no flash call path
        id: r63_custom_flash_audit
        if: steps.r62_output_discovery.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/R63_CUSTOM_RELOCS.txt
          for obj in /tmp/r59_usb_bridge.o /tmp/r58_audio_bridge.o /tmp/r58_gain_obj/*.o; do
            test -s "$obj"
            echo "===== $obj =====" >> /tmp/R63_CUSTOM_RELOCS.txt
            nds32le-elf-readelf -rW "$obj" >> /tmp/R63_CUSTOM_RELOCS.txt
          done
          if grep -Ei '[[:space:]](flash|erase|unlock|boot|ota|upgrade|firmware|protect)[A-Za-z0-9_]*([[:space:]]|$)' /tmp/R63_CUSTOM_RELOCS.txt; then
            echo 'dangerous custom relocation found' >&2
            exit 1
          fi
          ! grep -RniE '\b(flash|erase|unlock|boot|ota|upgrade|firmware|protect)\b' \
            "$R57_ROOT/firmware/src/okn56_gain7.c" \
            "$R57_ROOT/firmware/src/okn56_runtime.c" \
            "$RUNNER_TEMP/r58gen/okn_r58_audio_bridge.c" \
            "$RUNNER_TEMP/r58gen/okn_r59_usb_bridge.c"
          cat > /tmp/R63_CUSTOM_FLASH_AUDIT_STATE.txt <<'EOF'
          R63_CUSTOM_PATH_FLASH_AUDIT=PASS
          R63_CUSTOM_PATH_FLASH_RELOCS=NONE
          R63_CUSTOM_PATH_ERASE_WRITE_CALLS=NONE
          R63_CUSTOM_PATH_BOOT_UNLOCK_CALLS=NONE
          R63_FLASH_ALLOWED=NO
          R63_HOST_TO_DEVICE_USB=NO
          EOF
          cat /tmp/R63_CUSTOM_FLASH_AUDIT_STATE.txt

