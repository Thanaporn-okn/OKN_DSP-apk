          for dep in okn56_ufe_write okn56_ufe_read; do grep -F "$dep" /tmp/R59_USB_BRIDGE_RELOCS.txt >/dev/null; done
          for sym in okn59_usb_claims okn59_usb_handle; do grep -Eq "[[:space:]]${sym}$" /tmp/R59_USB_BRIDGE_SYMBOLS.txt; done
          echo 'R59_USB_BRIDGE_TARGET_COMPILE=PASS'

      - name: Compile R58 vendor audio bridge
        id: compile_bridge
        if: steps.compile_gain.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          nds32le-elf-gcc -std=gnu11 -Os -g3 -mcpu=d1088-spu -mcmodel=medium -mext-dsp -mext-zol -fsingle-precision-constant -ffunction-sections -fdata-sections -Wall -Wextra -Werror @"$RUNNER_TEMP/R58_INCLUDES.rsp" -DFUNC_OS_EN=1 -DCFG_APP_CONFIG -DHAVE_CONFIG_H -c "$RUNNER_TEMP/r58gen/okn_r58_audio_bridge.c" -o /tmp/r58_audio_bridge.o
          nds32le-elf-readelf -rW /tmp/r58_audio_bridge.o > /tmp/R58_BRIDGE_RELOCS.txt
