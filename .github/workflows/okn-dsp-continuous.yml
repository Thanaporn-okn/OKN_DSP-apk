      - name: R66 prove exact HID input-report control TX path
        id: r66_hid_control_tx
        if: steps.r65_blocker_summary.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          import os,re
          root=Path(os.environ['RUNNER_TEMP'])/'bp1048sdk'
          p=root/'MVsB1_Base_SDK/driver/driver_api/src/otg/device/otg_device_standard_request.c'
          s=p.read_text(encoding='latin-1')

          def body(sig):
              # Match a real function definition, not the earlier prototype.
              m=re.search(r'(?m)^[ \\t]*'+re.escape(sig)+r'[ \\t\\r\\n]*\\{', s)
              if not m: raise SystemExit('missing function definition '+sig)
              start=m.start()
              brace=s.find('{',m.start())
              d=0
              for i in range(brace,len(s)):
                  if s[i]=='{': d+=1
                  elif s[i]=='}':
                      d-=1
                      if d==0: return s[start:i+1]
              raise SystemExit('unterminated '+sig)

          tx=body('void hid_send_data(void)')
          cls=body('void OTG_DeviceClassRequest()')
          if 'OTG_DeviceControlSend(hid_tx_buf,256,6);' not in tx:
              raise SystemExit('exact hid_tx_buf control-send sink missing')
          required=[
              'Setup[4] == InterfaceNum[HID_DATA_INTERFACE_NUM]',
              'Setup[3] == 0x02',
              'Setup[0] == 0x21',
              'hid_recive_data();',
              'Setup[3] == 0x01',
              'Setup[0] == 0xA1',
              'hid_send_data();',
              'Setup[3] == 0x03',
          ]
          for tok in required:
              if tok not in cls: raise SystemExit('class request evidence missing '+tok)

          lines=[]
          for n,line in enumerate(s.splitlines(),1):
              if any(k in line for k in [
                  'HID_DATA_INTERFACE_NUM','hid_recive_data','hid_send_data',
                  'OTG_DeviceControlSend(hid_tx_buf','GetReport (Feature Report)',
                  'SetReport (Feature Report)'
              ]):
                  lines.append(f'{n}:{line.strip()}')
          Path('/tmp/R66_HID_CONTROL_PATH_EVIDENCE.txt').write_text('\n'.join(lines)+'\n')
          state=[
              'R66_HID_CONTROL_PATH_STATIC=PASS',
              'R66_HID_INPUT_REPORT_REQUEST_BMREQUESTTYPE=0xA1',
              'R66_HID_INPUT_REPORT_WVALUE_HIGH=0x01',
              'R66_HID_OUTPUT_REPORT_REQUEST_BMREQUESTTYPE=0x21',
              'R66_HID_OUTPUT_REPORT_WVALUE_HIGH=0x02',
              'R66_HID_TX_SINK=OTG_DeviceControlSend(hid_tx_buf,256,6)',
              'R66_FEATURE_REPORT_PATH_SEPARATE=YES',
              'R66_FEATURE_SET_REPORT_ALLOWED=NO',
              'R66_LIVE_USB_EXECUTED=NO',
              'R66_HOST_TO_DEVICE_USB=NO',
          ]
          Path('/tmp/R66_HID_CONTROL_PATH_STATE.txt').write_text('\n'.join(state)+'\n')
          print('\n'.join(state))
          PY2
          grep -q '^R66_HID_CONTROL_PATH_STATIC=PASS$' /tmp/R66_HID_CONTROL_PATH_STATE.txt
          grep -q '^R66_FEATURE_SET_REPORT_ALLOWED=NO$' /tmp/R66_HID_CONTROL_PATH_STATE.txt

      - name: R67 prove HID data report descriptor and control-only interface
        id: r67_hid_descriptor
        if: steps.r66_hid_control_tx.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          import os,re
          root=Path(os.environ['RUNNER_TEMP'])/'bp1048sdk'
          p=root/'MVsB1_Base_SDK/driver/driver_api/src/otg/device/otg_device_descriptor.h'
          s=p.read_text(encoding='latin-1')
          a=s.find('const uint8_t HidDataReportDescriptor[]')
          if a < 0: raise SystemExit('HidDataReportDescriptor missing')
          b=s.find('};',a)
          if b < 0: raise SystemExit('HidDataReportDescriptor unterminated')
          arr=s[a:b+2]
          compact=re.sub(r'\s+','',arr).lower()

          # 0x96 0x00 0x01 => REPORT_COUNT 0x0100 (256), first INPUT then OUTPUT.
          if compact.count('0x96,0x00,0x01') < 2:
              raise SystemExit('256-byte input/output report counts not both present')
          if '0x81,0x02' not in compact or '0x91,0x02' not in compact:
              raise SystemExit('input/output main items missing')
          if '0x95,0x08' not in compact or '0xb1,0x02' not in compact:
              raise SystemExit('8-byte feature report missing')

          lines=s.splitlines()
          data_if=[]
          for i,line in enumerate(lines):
              if 'sizeof(HidDataReportDescriptor)' in line:
                  prev='\n'.join(lines[max(0,i-4):i+1])
                  # HID data interface descriptor has bNumEndpoints = 0.
                  if re.search(r'0x09\s*,\s*0x04\s*,[^\n]*0x00\s*,\s*0x03\s*,\s*0x00\s*,\s*0x00\s*,\s*0x00',prev,re.I):
                      data_if.append((i+1,prev))
          if not data_if:
              raise SystemExit('no zero-endpoint HID data interface descriptor proved')

          ev=[
              'HidDataReportDescriptor: INPUT Report Count 0x0100 = 256 bytes',
              'HidDataReportDescriptor: OUTPUT Report Count 0x0100 = 256 bytes',
              'HidDataReportDescriptor: FEATURE Report Count 0x08 = 8 bytes',
              f'Zero-endpoint HID data interface descriptor instances={len(data_if)}',
          ]
          Path('/tmp/R67_HID_DESCRIPTOR_EVIDENCE.txt').write_text('\n'.join(ev)+'\n\n'+
              '\n---\n'.join(x[1] for x in data_if)+'\n')
          state=[
              'R67_HID_DESCRIPTOR_STATIC=PASS',
              'R67_HID_INPUT_REPORT_BYTES=256',
              'R67_HID_OUTPUT_REPORT_BYTES=256',
              'R67_HID_FEATURE_REPORT_BYTES=8',
              'R67_HID_DATA_INTERFACE_ENDPOINTS=0',
              'R67_HID_DATA_PATH=CONTROL_TRANSFER_STATIC',
              'R67_INTERRUPT_IN_NOT_REQUIRED_FOR_HID_DATA_STATIC=YES',
              'R67_FEATURE_SET_REPORT_ALLOWED=NO',
              'R67_LIVE_USB_VERIFIED=NO',
          ]
          Path('/tmp/R67_HID_DESCRIPTOR_STATE.txt').write_text('\n'.join(state)+'\n')
          print('\n'.join(state))
          PY2
          grep -q '^R67_HID_DESCRIPTOR_STATIC=PASS$' /tmp/R67_HID_DESCRIPTOR_STATE.txt
          grep -q '^R67_HID_DATA_INTERFACE_ENDPOINTS=0$' /tmp/R67_HID_DESCRIPTOR_STATE.txt

      - name: R68 prove active SDK output topology and detect bridge mismatch
        id: r68_output_topology
        if: steps.r65_blocker_summary.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          import os,re
          root=Path(os.environ['RUNNER_TEMP'])/'bp1048sdk'
          cfg=root/'BT_Audio_APP/bt_audio_app_src/inc/app_config.h'
          main=root/'BT_Audio_APP/bt_audio_app_src/apps/main_task.c'
          bridge=Path(os.environ['RUNNER_TEMP'])/'r58gen/okn_r58_audio_bridge.c'
          c=cfg.read_text(encoding='latin-1')
          m=main.read_text(encoding='latin-1')
          b=bridge.read_text(encoding='latin-1')

          def active_define(name):
              return bool(re.search(r'(?m)^\s*#define\s+'+re.escape(name)+r'\b',c))
          dac0=active_define('CFG_RES_AUDIO_DAC0_EN')
          dacx=active_define('CFG_RES_AUDIO_DACX_EN')
          i2so=active_define('CFG_RES_AUDIO_I2SOUT_EN')
          if not dac0 or not dacx:
              raise SystemExit('expected active DAC0/DACX sample sinks not both enabled')
          if i2so:
              raise SystemExit('sample unexpectedly enables I2SOUT; re-audit required')

          def sink_fmt(sym):
              rx=re.compile(re.escape(sym)+r'\]\.PcmFormat\s*=\s*(\d+)\s*;')
              mm=rx.search(m)
              if not mm: raise SystemExit('PcmFormat missing for '+sym)
              return int(mm.group(1))
          f0=sink_fmt('AUDIO_DAC0_SINK_NUM')
          fx=sink_fmt('AUDIO_DACX_SINK_NUM')
          if f0 != 2 or fx != 2:
              raise SystemExit(f'unexpected sink formats DAC0={f0} DACX={fx}')

          for tok in ['AudioDAC0DataSet','AudioDAC1DataSet','AudioCoreSinkEnable(AUDIO_DAC0_SINK_NUM)',
                      'AudioCoreSinkEnable(AUDIO_DACX_SINK_NUM)']:
              if tok not in m: raise SystemExit('active sink evidence missing '+tok)

          # Current locked bridge treats DACX buffer as a single stride-1 lane.
          bridge_mismatch=('dacx_mono' in b and
                           re.search(r'okn56_process_lane\(&s_runtime,\s*2u,\s*dacx_mono,\s*frames,\s*1u\)',b) is not None)
          if not bridge_mismatch:
              raise SystemExit('expected current locked bridge representation not found; re-audit mapping')

          evidence=[
              f'CFG_RES_AUDIO_DAC0_EN={dac0}',
              f'CFG_RES_AUDIO_DACX_EN={dacx}',
              f'CFG_RES_AUDIO_I2SOUT_EN={i2so}',
              f'DAC0_PcmFormat={f0}',
              f'DACX_PcmFormat={fx}',
              'DAC0 FuncDataSet=AudioDAC0DataSet',
              'DACX FuncDataSet=AudioDAC1DataSet',
              'Current locked bridge labels DACX as dacx_mono and uses stride=1',
          ]
          Path('/tmp/R68_OUTPUT_TOPOLOGY_EVIDENCE.txt').write_text('\n'.join(evidence)+'\n')
          state=[
              'R68_SDK_OUTPUT_TOPOLOGY_STATIC=PASS',
              'R68_SAMPLE_DAC0_ACTIVE=YES',
              'R68_SAMPLE_DACX_ACTIVE=YES',
              'R68_SAMPLE_I2SOUT_ACTIVE=NO',
              'R68_DAC0_PCMFORMAT=2',
              'R68_DACX_PCMFORMAT=2',
              'R68_CURRENT_LOCKED_BRIDGE_DACX_FORMAT_MISMATCH=YES',
              'R68_AUDIO_BRIDGE_PRODUCTION_READY=NO',
              'R68_PHYSICAL_7CH_BOARD_MAPPING_VERIFIED=NO',
              'R68_OUTPUT_HARDWARE_INIT_ENABLED=NO',
          ]
          Path('/tmp/R68_OUTPUT_TOPOLOGY_STATE.txt').write_text('\n'.join(state)+'\n')
          print('\n'.join(state))
          PY2
          grep -q '^R68_SDK_OUTPUT_TOPOLOGY_STATIC=PASS$' /tmp/R68_OUTPUT_TOPOLOGY_STATE.txt
          grep -q '^R68_CURRENT_LOCKED_BRIDGE_DACX_FORMAT_MISMATCH=YES$' /tmp/R68_OUTPUT_TOPOLOGY_STATE.txt
          grep -q '^R68_AUDIO_BRIDGE_PRODUCTION_READY=NO$' /tmp/R68_OUTPUT_TOPOLOGY_STATE.txt

      - name: R69 distinguish custom-path safety from vendor flash code presence
        id: r69_vendor_flash_scope
        if: steps.r68_output_topology.outcome == 'success' && steps.r64_memory_audit.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          import re
          files=[
              Path('/tmp/R58_FINAL_SYMBOLS.txt'),
              Path('/tmp/R64_SECTION_HEADERS.txt'),
              Path('/tmp/OKN_R60_CURRENT_E2E_CONFORMANCE_NOT_FOR_FLASH.map'),
          ]
          hits=[]
          rx=re.compile(r'(flash|erase|boot|upgrade|ota)',re.I)
          for p in files:
              if not p.exists(): continue
              for n,line in enumerate(p.read_text(errors='replace').splitlines(),1):
                  if rx.search(line):
                      hits.append(f'{p.name}:{n}:{line}')
          Path('/tmp/R69_VENDOR_FLASH_SYMBOL_EVIDENCE.txt').write_text('\n'.join(hits[:3000])+'\n')
