          if [ "$rc" -ne 0 ]; then sed -n '1,400p' /tmp/R58_LINK.log > /tmp/R58_LINK_FIRST_ERRORS.txt; exit "$rc"; fi
          nds32le-elf-size "$ELF" > /tmp/R58_SIZE.txt
