      - name: R72 prove AB00 AB01 AB02 GATT profile and write callback from pinned SDK
        id: r72_ble_sdk_inventory
        if: steps.r71_ble_transport_lock.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          import os,re
          root=Path(os.environ['RUNNER_TEMP'])/'bp1048sdk'
          p=root/'BT_Audio_APP/bt_audio_app_src/ble/ble_app_func.c'
          s=p.read_text(encoding='latin-1')

          required = {
              'service_ab00': 'PRIMARY_SERVICE-AB00',
              'char_ab01': 'CHARACTERISTIC-AB01',
              'char_ab02': 'CHARACTERISTIC-AB02-NOTIFY',
              'ab01_handle': '#define ATT_CHARACTERISTIC_AB01_01_VALUE_HANDLE 0x0006',
              'ab02_handle': '#define ATT_CHARACTERISTIC_AB02_01_VALUE_HANDLE 0x0008',
              'ab02_cccd': '#define ATT_CHARACTERISTIC_AB02_01_CLIENT_CONFIGURATION_HANDLE 0x0009',
              'app_att_write': 'int16_t app_att_write(',
              'ab01_case': 'case ATT_CHARACTERISTIC_AB01_01_VALUE_HANDLE:',
          }
          missing=[k for k,v in required.items() if v not in s]
          if missing:
              raise SystemExit('BLE source proof missing: '+','.join(missing))

          # The default AB profile explicitly supports WRITE_WITHOUT_RESPONSE on AB01.
          if 'CHARACTERISTIC-AB01-READ | WRITE | WRITE_WITHOUT_RESPONSE | DYNAMIC' not in s:
              raise SystemExit('AB01 WRITE_WITHOUT_RESPONSE not proved in pinned source')
          if 'VALUE-AB01-READ | WRITE | WRITE_WITHOUT_RESPONSE | DYNAMIC' not in s:
              raise SystemExit('AB01 value properties not proved')

          # Prove writes in the AB00 service are routed into app_att_write().
          if 'ATT_SERVICE_AB00_START_HANDLE' not in s or 'return app_att_write(con_handle, attribute_handle' not in s:
              raise SystemExit('AB00 -> app_att_write dispatcher not proved')

          evidence=[]
          for n,line in enumerate(s.splitlines(),1):
              if any(k in line for k in [
                  'PRIMARY_SERVICE-AB00','CHARACTERISTIC-AB01','CHARACTERISTIC-AB02',
                  'ATT_CHARACTERISTIC_AB01_01_VALUE_HANDLE',
                  'ATT_CHARACTERISTIC_AB02_01_VALUE_HANDLE',
                  'ATT_CHARACTERISTIC_AB02_01_CLIENT_CONFIGURATION_HANDLE',
                  'ATT_SERVICE_AB00_START_HANDLE','app_att_write(',
                  'ble_rcv_data_proess'
              ]):
                  evidence.append(f'{n}:{line.strip()}')
          Path('/tmp/R72_BLE_PROFILE_CALLBACK_EVIDENCE.txt').write_text('\n'.join(evidence)+'\n')

          state=[
              'R72_BLE_SDK_PROFILE_PROOF=PASS',
              'R72_AB00_PUBLIC_SDK_PROVEN=YES',
              'R72_AB01_PUBLIC_SDK_PROVEN=YES',
              'R72_AB02_PUBLIC_SDK_PROVEN=YES',
              'R72_AB01_HANDLE=0x0006',
              'R72_AB02_HANDLE=0x0008',
              'R72_AB02_CCCD_HANDLE=0x0009',
              'R72_AB01_WRITE_WITHOUT_RESPONSE=YES',
              'R72_AB00_TO_APP_ATT_WRITE_DISPATCH=YES',
              'R72_AB01_WRITE_CALLBACK_POINT_PROVEN=YES',
              'R72_CUSTOM_BLE_UFE_HOOK_VERIFIED=NO',
              'R72_NO_VENDOR_OPCODE_GUESS=YES',
          ]
          Path('/tmp/R72_BLE_SDK_STATE.txt').write_text('\n'.join(state)+'\n')
          print('\n'.join(state))
          PY2
          grep -q '^R72_BLE_SDK_PROFILE_PROOF=PASS$' /tmp/R72_BLE_SDK_STATE.txt
          grep -q '^R72_AB01_WRITE_WITHOUT_RESPONSE=YES$' /tmp/R72_BLE_SDK_STATE.txt
          grep -q '^R72_NO_VENDOR_OPCODE_GUESS=YES$' /tmp/R72_BLE_SDK_STATE.txt

      - name: R73 compile exact-ABI transport-neutral BLE UFE adapter
        id: r73_ble_ufe_adapter
        if: steps.r72_ble_sdk_inventory.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/r58gen/okn_r73_ble_ufe_adapter.c" <<'EOF'
          #include <stdint.h>
          #include <stddef.h>
          #include "okn56_runtime.h"

          /*
           * Plain-UFE adapter only.  The stock authenticated AES/CFB8 session is
           * deliberately NOT reimplemented or guessed here.
           */
          int okn73_ble_ufe_rx(okn56_runtime_t *runtime,
                              const uint8_t *plain, size_t len,
                              uint8_t *reply, size_t reply_cap,
                              size_t *reply_len)
          {
              if (!runtime || !plain || !len || !reply_len) return -1;
              *reply_len = 0u;

              if (plain[0] == 0x57u) {
                  return okn56_ufe_write(runtime, plain, len);
              }

              if (plain[0] == 0x58u) {
                  size_t n;
                  if (!reply || reply_cap == 0u) return -2;
                  n = okn56_ufe_read(runtime, plain, len, reply, reply_cap);
                  if (n == 0u) return -3;
                  *reply_len = n;
                  return 1;
              }

              return 0; /* not ours: no guessed opcode or takeover */
          }
          EOF

          nds32le-elf-gcc -c \
            -mcpu=d1088-spu -mext-dsp \
            -ffunction-sections -fdata-sections \
            -I "$R57_ROOT/firmware/include" \
            "$RUNNER_TEMP/r58gen/okn_r73_ble_ufe_adapter.c" \
            -o /tmp/r73_ble_ufe_adapter.o

          nds32le-elf-nm -u /tmp/r73_ble_ufe_adapter.o > /tmp/R73_BLE_UFE_UNRESOLVED.txt
          grep -q 'okn56_ufe_write' /tmp/R73_BLE_UFE_UNRESOLVED.txt
          grep -q 'okn56_ufe_read' /tmp/R73_BLE_UFE_UNRESOLVED.txt
          ! grep -Ei '(flash|erase|unlock|boot|ota|upgrade|firmware)' /tmp/R73_BLE_UFE_UNRESOLVED.txt

          cat > /tmp/R73_BLE_UFE_ADAPTER_STATE.txt <<'EOF'
          R73_BLE_UFE_ADAPTER_COMPILE=PASS
          R73_OKN56_RUNTIME_ABI=EXACT_HEADER
          R73_UFE_WRITE_OPCODE=0x57
          R73_UFE_READ_OPCODE=0x58
          R73_UFE_READ_RESPONSE=0x60
          R73_GAIN_IDS=22..28
          R73_IDENTITY_ID=29
          R73_VENDOR_BLE_OPCODE_GUESSED=NO
          R73_STOCK_AES_CFB8_REIMPLEMENTED=NO
          R73_BLE_CHARACTERISTIC_HOOK_ACTIVE=NO
          R73_FLASH_CALLS=NONE
          EOF
          cat /tmp/R73_BLE_UFE_ADAPTER_STATE.txt

