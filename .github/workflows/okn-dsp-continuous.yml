      - name: R75 compile AB01-to-UFE and AB02-notify bridge contract
        id: r75_ble_gatt_bridge
        if: steps.r74_ble_notify_contract.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/r58gen/okn_r75_ble_gatt_bridge.c" <<'EOF'
          #include <stdint.h>
          #include <stddef.h>
          #include "okn56_runtime.h"

          extern int att_server_notify(uint16_t handle, uint8_t *value, uint16_t value_len);
          extern int att_server_can_send(void);

          int okn73_ble_ufe_rx(okn56_runtime_t *runtime,
                              const uint8_t *plain, size_t len,
                              uint8_t *reply, size_t reply_cap,
                              size_t *reply_len);

          #define OKN_AB01_VALUE_HANDLE 0x0006u
          #define OKN_AB02_VALUE_HANDLE 0x0008u

          /*
           * Contract-only bridge. Input is already PLAIN UFE.
           * Cipher/auth session integration is a separate required gate.
           */
          int okn75_ab01_plain_rx(okn56_runtime_t *runtime,
                                 const uint8_t *plain, size_t len,
                                 uint8_t *reply, size_t reply_cap,
                                 size_t *reply_len)
          {
              (void)OKN_AB01_VALUE_HANDLE;
              return okn73_ble_ufe_rx(runtime, plain, len, reply, reply_cap, reply_len);
          }

          int okn75_ab02_plain_notify(uint8_t *reply, size_t reply_len)
          {
              if (!reply || reply_len == 0u || reply_len > 0xffffu) return -1;
              if (att_server_can_send() == 0) return -2;
              return att_server_notify((uint16_t)OKN_AB02_VALUE_HANDLE,
                                       reply, (uint16_t)reply_len);
          }
          EOF

          nds32le-elf-gcc -c \
            -mcpu=d1088-spu -mext-dsp \
            -ffunction-sections -fdata-sections \
            -I "$R57_ROOT/firmware/include" \
            "$RUNNER_TEMP/r58gen/okn_r75_ble_gatt_bridge.c" \
