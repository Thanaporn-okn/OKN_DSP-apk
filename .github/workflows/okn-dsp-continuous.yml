          grep -q 'att_server_notify' /tmp/R75_BLE_GATT_UNRESOLVED.txt
          grep -q 'att_server_can_send' /tmp/R75_BLE_GATT_UNRESOLVED.txt
          ! grep -Ei '(flash|erase|unlock|boot|ota|upgrade|firmware)' /tmp/R75_BLE_GATT_UNRESOLVED.txt

          cat > /tmp/R75_BLE_GATT_BRIDGE_STATE.txt <<'EOF'
          R75_BLE_GATT_BRIDGE_COMPILE=PASS
          R75_AB01_VALUE_HANDLE=0x0006
          R75_AB02_VALUE_HANDLE=0x0008
          R75_AB01_TO_PLAIN_UFE_CONTRACT=PASS
          R75_AB02_NOTIFY_CONTRACT=PASS
          R75_STOCK_AES_CFB8_SESSION_HOOK_VERIFIED=NO
          R75_PATCHED_INTO_VENDOR_APP_ATT_WRITE=NO
