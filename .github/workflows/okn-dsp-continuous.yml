# OKN DSP CONTINUOUS PIPELINE
# Stable workflow path: .github/workflows/okn-dsp-continuous.yml
# Future stages will update this same YAML file instead of creating new filenames.
name: OKN DSP CONTINUOUS PIPELINE

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/okn-dsp-continuous.yml"

permissions:
  contents: read

concurrency:
  group: okn-dsp-continuous-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_REPO: https://github.com/leadercxn/bp1048_sdk_v0.1.12.git
  SDK_COMMIT: 8105bd864b04995d81c9f9ae77cb158259f39015
  TOOLCHAIN_REPO: https://github.com/xingrz/nds-builder.git
  TOOLCHAIN_COMMIT: 572969caccb1d0c576b2893c905fa7b3396815e4
  TOOLCHAIN_SHA256: a231682172de4af23ac94726c021a824f1ae7d1f7c72a4619093b90caa7de0e4
  SOURCE_ZIP_SHA256: b3d7ddfcac0343af4fec8433437ad633f31109e47daa2555aebf80e9e04d3eab
  LIVE_BOARD_USB: "NO"
  HOST_TO_DEVICE_USB: "NO"
  FLASH_ERASE_WRITE: "NO"
  FLASH_ALLOWED: "NO"
  FEATURE_SET_REPORT_ALLOWED: "NO"
  EXECUTE_VENDOR_EXE: "NO"

jobs:
  okn-dsp-continuous:
    name: Continuous dedicated-gain firmware proof / offline only
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fail-closed safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$LIVE_BOARD_USB" = "NO"
          test "$HOST_TO_DEVICE_USB" = "NO"
          test "$FLASH_ERASE_WRITE" = "NO"
          test "$FLASH_ALLOWED" = "NO"
          test "$FEATURE_SET_REPORT_ALLOWED" = "NO"
          test "$EXECUTE_VENDOR_EXE" = "NO"
          echo 'OFFLINE_ONLY=YES'
          echo 'FLASH_ALLOWED=NO'

      - name: Restore exact R57 CURRENT source
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/R57_SOURCE.b64" <<'R57_B64'
          
          R57_B64
          base64 -d "$RUNNER_TEMP/R57_SOURCE.b64" > "$RUNNER_TEMP/R57_SOURCE.zip"
          echo "$SOURCE_ZIP_SHA256  $RUNNER_TEMP/R57_SOURCE.zip" | sha256sum -c -
          rm -rf "$RUNNER_TEMP/r57src"
          mkdir -p "$RUNNER_TEMP/r57src"
          unzip -q "$RUNNER_TEMP/R57_SOURCE.zip" -d "$RUNNER_TEMP/r57src"
          (cd "$RUNNER_TEMP/r57src" && sha256sum -c SOURCE_HASHES.txt)
          echo "R57_ROOT=$RUNNER_TEMP/r57src" >> "$GITHUB_ENV"

      - name: Re-prove current Dedicated Gain is not EQ
        shell: bash
        run: |
          set -euo pipefail
          cd "$R57_ROOT"
          python3 tools/audit_r57.py | tee "$RUNNER_TEMP/R58_BASE_AUDIT.txt"
          grep -q '^GAIN_VIA_EQ=NO$' "$RUNNER_TEMP/R58_BASE_AUDIT.txt"
          grep -q '^DEDICATED_GAIN_ONLY=PASS$' "$RUNNER_TEMP/R58_BASE_AUDIT.txt"
          ! grep -RniE 'peq|biquad|equalizer|eq_apply|filter_gain' \
            firmware/src/okn56_gain7.c firmware/src/okn56_runtime.c firmware/src/okn57_audio_hook.c
          make clean
          make test | tee "$RUNNER_TEMP/R58_HOST_TEST.log"
          make sanitize | tee "$RUNNER_TEMP/R58_SANITIZE.log"
          grep -q 'PASS R57 CURRENT' "$RUNNER_TEMP/R58_HOST_TEST.log"

      - name: Fetch pinned public BP1048 SDK and select BP1048P4
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/bp1048sdk"
          git init -q "$RUNNER_TEMP/bp1048sdk"
          git -C "$RUNNER_TEMP/bp1048sdk" remote add origin "$SDK_REPO"
          git -C "$RUNNER_TEMP/bp1048sdk" fetch -q --depth 1 origin "$SDK_COMMIT"
          git -C "$RUNNER_TEMP/bp1048sdk" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/bp1048sdk" rev-parse HEAD)" = "$SDK_COMMIT"
          test -f "$RUNNER_TEMP/bp1048sdk/BT_Audio_APP/nds32-ae210p.ld"
          python3 - <<'PY2'
          from pathlib import Path
          import re, os
          root=Path(os.environ['RUNNER_TEMP'])/'bp1048sdk'
          p=root/'BT_Audio_APP/bt_audio_app_src/inc/app_config.h'
          s=p.read_text(encoding='latin-1')
          s,n1=re.subn(r'(?m)^[ \t]*#define[ \t]+CFG_CHIP_BP10128\b.*$', '// R58 disabled sample target: CFG_CHIP_BP10128', s, count=1)
          s,n2=re.subn(r'(?m)^[ \t]*//[ \t]*#define[ \t]+CFG_CHIP_BP1048P4\b.*$', '#define CFG_CHIP_BP1048P4', s, count=1)
          if (n1,n2)!=(1,1): raise SystemExit(f'chip patch mismatch {n1=} {n2=}')
          p.write_text(s,encoding='latin-1')
          active=re.findall(r'(?m)^[ \t]*#define[ \t]+(CFG_CHIP_[A-Za-z0-9_]+)\b',s)
          if active != ['CFG_CHIP_BP1048P4']: raise SystemExit(f'unexpected chip macros: {active}')
          print('TARGET_CHIP=BP1048P4')
          PY2

      - name: Repair Windows-origin header case on Linux
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          import os,re
          root=Path(os.environ['RUNNER_TEMP'])/'bp1048sdk'
          bases=[root/'BT_Audio_APP',root/'MVsB1_Base_SDK/driver',root/'MVsB1_Base_SDK/middleware',root/'develop_lib']
          headers=[]
          for base in bases:
              if base.exists(): headers += [p for p in base.rglob('*') if p.is_file() and p.suffix.lower() in {'.h','.hpp'}]
          by_lower={}
          for p in headers: by_lower.setdefault(p.name.lower(),[]).append(p)
          rx=re.compile(r'^\s*#\s*include\s*[<"]([^">]+)[">]',re.M)
          spellings=set()
          for base in bases:
              if not base.exists(): continue
              for p in base.rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in {'.c','.h','.hpp','.s'}: continue
                  try: text=p.read_bytes().decode('latin-1')
                  except OSError: continue
                  for inc in rx.findall(text):
                      if '/' not in inc and '\\' not in inc: spellings.add(inc)
          made=0
          for inc in sorted(spellings):
              for target in by_lower.get(inc.lower(),[]):
                  alias=target.with_name(inc)
                  if alias.name==target.name or alias.exists(): continue
                  try: alias.symlink_to(target.name)
                  except OSError: alias.write_bytes(target.read_bytes())
                  made+=1
          print('CASE_ALIASES=',made)
          PY2

      - name: Acquire pinned NDS32 D1088 toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libc6-i386 lib32z1 xz-utils
          rm -rf "$RUNNER_TEMP/nds-src" "$RUNNER_TEMP/nds"
          git init -q "$RUNNER_TEMP/nds-src"
          git -C "$RUNNER_TEMP/nds-src" remote add origin "$TOOLCHAIN_REPO"
          git -C "$RUNNER_TEMP/nds-src" fetch -q --depth 1 origin "$TOOLCHAIN_COMMIT"
          git -C "$RUNNER_TEMP/nds-src" checkout -q --detach FETCH_HEAD
          echo "$TOOLCHAIN_SHA256  $RUNNER_TEMP/nds-src/nds32le-elf-mculib-v3s.4.9.4.txz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/nds"
          tar -xJf "$RUNNER_TEMP/nds-src/nds32le-elf-mculib-v3s.4.9.4.txz" -C "$RUNNER_TEMP/nds"
          echo "$RUNNER_TEMP/nds/nds32le-elf-mculib-v3s/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/nds/nds32le-elf-mculib-v3s/bin/nds32le-elf-gcc" --version | tee "$RUNNER_TEMP/R58_TOOLCHAIN.txt"

      - name: Generate R58 locked vendor audio bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r58gen"
          cat > "$RUNNER_TEMP/r58gen/okn_r58_audio_bridge.h" <<'H'
          #ifndef OKN_R58_AUDIO_BRIDGE_H
          #define OKN_R58_AUDIO_BRIDGE_H
          #include <stddef.h>
          #include <stdint.h>
          #include "okn56_runtime.h"
          #define OKN58_PHYSICAL_7CH_MAPPING_VERIFIED 0u
          #define OKN58_OUTPUT_HARDWARE_INIT_VERIFIED 0u
          void okn58_audio_init(uint32_t sample_rate, uint16_t frames);
          void okn58_audio_process(int16_t *dac0_lr, int16_t *dacx_mono, uint16_t frames);
          uint8_t okn58_audio_space_ok(uint16_t frames);
          uint8_t okn58_audio_push(uint16_t frames);
          okn56_runtime_t *okn58_runtime(void);
          #endif
          H
          cat > "$RUNNER_TEMP/r58gen/okn_r58_audio_bridge.c" <<'C'
          #include <stddef.h>
          #include <stdint.h>
          #include <string.h>
          #include "type.h"
          #include "i2s_interface.h"
          #include "okn56_runtime.h"
          #include "okn_r58_audio_bridge.h"

          #define OKN58_MAX_FRAMES 512u
          static okn56_runtime_t s_runtime;
          static int16_t s_i2s0_lr[OKN58_MAX_FRAMES * 2u];
          static int16_t s_i2s1_lr[OKN58_MAX_FRAMES * 2u];
          static uint16_t s_frames;
          static uint8_t s_ready;
          /* Fail-closed: no production code enables this in R58. Volatile keeps
             both low-level output call paths in the linked call graph. */
          static volatile uint8_t s_output_enable;

          okn56_runtime_t *okn58_runtime(void) { return &s_runtime; }

          void okn58_audio_init(uint32_t sample_rate, uint16_t frames)
          {
              s_ready = 0u;
              s_output_enable = 0u;
              if (!sample_rate || !frames || frames > OKN58_MAX_FRAMES) return;
              if (!okn56_runtime_init(&s_runtime, sample_rate, 5u)) return;
              memset(s_i2s0_lr, 0, sizeof(s_i2s0_lr));
              memset(s_i2s1_lr, 0, sizeof(s_i2s1_lr));
              s_frames = frames;
              s_ready = 1u;
          }

          void okn58_audio_process(int16_t *dac0_lr, int16_t *dacx_mono, uint16_t frames)
          {
              uint16_t i;
              if (!s_ready || !dac0_lr || frames != s_frames) return;

              /* Logical sidecar source only: preserve the vendor DAC0 stereo
                 samples as the source for both additional stereo pairs. */
              for (i = 0u; i < frames; ++i) {
                  s_i2s0_lr[2u*i]     = dac0_lr[2u*i];
                  s_i2s0_lr[2u*i + 1] = dac0_lr[2u*i + 1u];
                  s_i2s1_lr[2u*i]     = dac0_lr[2u*i];
                  s_i2s1_lr[2u*i + 1] = dac0_lr[2u*i + 1u];
              }

              /* Seven independent dedicated gain lanes. No filter coefficients
                 or tone parameters are touched by this module. */
              okn56_process_lane(&s_runtime, 0u, dac0_lr,       frames, 2u);
              okn56_process_lane(&s_runtime, 1u, dac0_lr + 1,   frames, 2u);
              if (dacx_mono) okn56_process_lane(&s_runtime, 2u, dacx_mono, frames, 1u);
              okn56_process_lane(&s_runtime, 3u, s_i2s0_lr,     frames, 2u);
              okn56_process_lane(&s_runtime, 4u, s_i2s0_lr + 1, frames, 2u);
              okn56_process_lane(&s_runtime, 5u, s_i2s1_lr,     frames, 2u);
              okn56_process_lane(&s_runtime, 6u, s_i2s1_lr + 1, frames, 2u);
          }

          uint8_t okn58_audio_space_ok(uint16_t frames)
          {
              if (!s_ready || frames != s_frames) return 0u;
              if (!s_output_enable) return 1u;
              return (uint8_t)((AudioI2S0_DataSpaceLenGet() >= frames) &&
                               (AudioI2S1_DataSpaceLenGet() >= frames));
          }

          uint8_t okn58_audio_push(uint16_t frames)
          {
              if (!s_ready || frames != s_frames) return 0u;
              if (!s_output_enable) return 1u;
              if (!okn58_audio_space_ok(frames)) return 0u;
              (void)AudioI2S0_DataSet(s_i2s0_lr, frames);
              (void)AudioI2S1_DataSet(s_i2s1_lr, frames);
              return 1u;
          }
          C
          ! grep -RniE 'peq|biquad|equalizer|eq_apply|filter_gain' "$RUNNER_TEMP/r58gen"
          grep -q 's_output_enable = 0u' "$RUNNER_TEMP/r58gen/okn_r58_audio_bridge.c"
          echo 'R58_OUTPUT_ENABLE_DEFAULT=0' | tee "$RUNNER_TEMP/R58_BRIDGE_GATE.txt"
          echo 'R58_PHYSICAL_7CH_MAPPING_VERIFIED=NO' >> "$RUNNER_TEMP/R58_BRIDGE_GATE.txt"
          echo 'R58_OUTPUT_HARDWARE_INIT_VERIFIED=NO' >> "$RUNNER_TEMP/R58_BRIDGE_GATE.txt"

      - name: Generate R59 OKN6 USB transport bridge and host tests
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/r58gen/okn_r59_usb_bridge.h" <<'H'
          #ifndef OKN_R59_USB_BRIDGE_H
          #define OKN_R59_USB_BRIDGE_H
          #include <stddef.h>
          #include <stdint.h>
          #include "okn56_runtime.h"
          #define OKN59_REPORT_BYTES 256u
          #define OKN59_HEADER_BYTES 5u
          #define OKN59_VERSION 1u
          int okn59_usb_claims(const uint8_t *report, size_t n);
          size_t okn59_usb_handle(okn56_runtime_t *runtime,
                                  const uint8_t *report,
                                  size_t n,
                                  uint8_t *reply,
                                  size_t cap);
          #endif
          H
          cat > "$RUNNER_TEMP/r58gen/okn_r59_usb_bridge.c" <<'C'
          #include <stddef.h>
          #include <stdint.h>
          #include <string.h>
          #include "okn56_runtime.h"
          #include "okn_r59_usb_bridge.h"

          static int okn59_magic(const uint8_t *p)
          {
              return p && p[0]=='O' && p[1]=='K' && p[2]=='N' && p[3]=='6';
          }

          int okn59_usb_claims(const uint8_t *report, size_t n)
          {
              return report && n==OKN59_REPORT_BYTES && okn59_magic(report);
          }

          static void okn59_reply_header(uint8_t *reply)
          {
              reply[0]='O'; reply[1]='K'; reply[2]='N'; reply[3]='6';
              reply[4]=OKN59_VERSION;
          }

          size_t okn59_usb_handle(okn56_runtime_t *runtime,
                                  const uint8_t *report,
                                  size_t n,
                                  uint8_t *reply,
                                  size_t cap)
          {
              const uint8_t *ufe;
              uint8_t read_req[9];
              size_t rn;
              if (!runtime || !report || !reply ||
                  n != OKN59_REPORT_BYTES || cap < OKN59_REPORT_BYTES ||
                  !okn59_magic(report) || report[4] != OKN59_VERSION)
                  return 0u;
              memset(reply, 0, OKN59_REPORT_BYTES);
              okn59_reply_header(reply);
              ufe = report + OKN59_HEADER_BYTES;
              if (ufe[0] == OKN56_UFE_READ) {
                  rn = okn56_ufe_read(runtime, ufe, 9u,
                                      reply + OKN59_HEADER_BYTES,
                                      OKN59_REPORT_BYTES - OKN59_HEADER_BYTES);
                  return rn ? OKN59_REPORT_BYTES : 0u;
              }
              if (ufe[0] == OKN56_UFE_WRITE) {
                  if (!okn56_ufe_write(runtime, ufe, 13u)) return 0u;
                  memset(read_req, 0, sizeof(read_req));
                  read_req[0] = OKN56_UFE_READ;
                  memcpy(read_req + 1, ufe + 1, 8u);
                  rn = okn56_ufe_read(runtime, read_req, sizeof(read_req),
                                      reply + OKN59_HEADER_BYTES,
                                      OKN59_REPORT_BYTES - OKN59_HEADER_BYTES);
                  return rn ? OKN59_REPORT_BYTES : 0u;
              }
              return 0u;
          }
          C

          cat > "$RUNNER_TEMP/r58gen/test_r59_usb.c" <<'C'
          #include <assert.h>
          #include <math.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <string.h>
          #include "okn56_runtime.h"
          #include "okn_r59_usb_bridge.h"
          static void w16be(uint8_t*p,unsigned v){p[0]=(uint8_t)(v>>8);p[1]=(uint8_t)v;}
          static void w32be(uint8_t*p,unsigned v){p[0]=(uint8_t)(v>>24);p[1]=(uint8_t)(v>>16);p[2]=(uint8_t)(v>>8);p[3]=(uint8_t)v;}
          static void wf(uint8_t*p,float f){uint32_t u;memcpy(&u,&f,4);p[0]=(uint8_t)u;p[1]=(uint8_t)(u>>8);p[2]=(uint8_t)(u>>16);p[3]=(uint8_t)(u>>24);}
          static float rf(const uint8_t*p){uint32_t u=(uint32_t)p[0]|((uint32_t)p[1]<<8)|((uint32_t)p[2]<<16)|((uint32_t)p[3]<<24);float f;memcpy(&f,&u,4);return f;}
          static void hdr(uint8_t*p){memset(p,0,OKN59_REPORT_BYTES);memcpy(p,"OKN6",4);p[4]=OKN59_VERSION;}
          int main(void)
          {
              okn56_runtime_t r;
              uint8_t q[OKN59_REPORT_BYTES], o[OKN59_REPORT_BYTES];
              uint8_t *u;
              assert(okn56_runtime_init(&r,48000u,0u));
              hdr(q); u=q+OKN59_HEADER_BYTES; u[0]=OKN56_UFE_READ; w32be(u+1,29u); w16be(u+7,4u);
              assert(okn59_usb_claims(q,sizeof(q)));
              assert(okn59_usb_handle(&r,q,sizeof(q),o,sizeof(o))==OKN59_REPORT_BYTES);
              assert(memcmp(o,"OKN6",4)==0 && o[4]==OKN59_VERSION);
              assert(o[5]==OKN56_UFE_RESPONSE && memcmp(o+14,"OKN6",4)==0);
              hdr(q); u=q+OKN59_HEADER_BYTES; u[0]=OKN56_UFE_WRITE; w32be(u+1,22u); w16be(u+7,4u); wf(u+9,-6.0f);
              assert(okn59_usb_handle(&r,q,sizeof(q),o,sizeof(o))==OKN59_REPORT_BYTES);
              assert(o[5]==OKN56_UFE_RESPONSE && fabsf(rf(o+14)+6.0f)<0.01f);
              hdr(q); u=q+OKN59_HEADER_BYTES; u[0]=OKN56_UFE_READ; w32be(u+1,22u); w16be(u+7,4u);
              assert(okn59_usb_handle(&r,q,sizeof(q),o,sizeof(o))==OKN59_REPORT_BYTES);
              assert(fabsf(rf(o+14)+6.0f)<0.01f);
              hdr(q); u=q+OKN59_HEADER_BYTES; u[0]=OKN56_UFE_WRITE; w32be(u+1,29u); w16be(u+7,4u); wf(u+9,0.0f);
              assert(okn59_usb_handle(&r,q,sizeof(q),o,sizeof(o))==0u);
              hdr(q); u=q+OKN59_HEADER_BYTES; u[0]=OKN56_UFE_READ; w32be(u+1,30u); w16be(u+7,4u);
              assert(okn59_usb_handle(&r,q,sizeof(q),o,sizeof(o))==0u);
              hdr(q); q[4]=2u; assert(okn59_usb_claims(q,sizeof(q))); assert(okn59_usb_handle(&r,q,sizeof(q),o,sizeof(o))==0u);
              q[0]='X'; assert(!okn59_usb_claims(q,sizeof(q)));
              puts("R59_USB_HOST_TEST=PASS");
              puts("R59_IDENTITY_READ=PASS");
              puts("R59_GAIN_WRITE_READBACK=PASS");
              puts("R59_FAIL_CLOSED=PASS");
              puts("GAIN_VIA_EQ=NO");
              return 0;
          }
          C
          ! grep -RniE 'peq|biquad|equalizer|eq_apply|filter_gain' "$RUNNER_TEMP/r58gen/okn_r59_usb_bridge.c" "$RUNNER_TEMP/r58gen/okn_r59_usb_bridge.h"
          cc -std=c11 -O2 -Wall -Wextra -Werror -Wpedantic -I"$R57_ROOT/firmware/include" -I"$R57_ROOT/firmware/src" -I"$RUNNER_TEMP/r58gen" "$RUNNER_TEMP/r58gen/test_r59_usb.c" "$R57_ROOT/firmware/src/okn56_gain7.c" "$R57_ROOT/firmware/src/okn56_runtime.c" "$RUNNER_TEMP/r58gen/okn_r59_usb_bridge.c" -lm -o "$RUNNER_TEMP/r58gen/test_r59_usb"
          "$RUNNER_TEMP/r58gen/test_r59_usb" | tee "$RUNNER_TEMP/R59_USB_HOST_TEST.log"
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -Wpedantic -fsanitize=address,undefined -I"$R57_ROOT/firmware/include" -I"$R57_ROOT/firmware/src" -I"$RUNNER_TEMP/r58gen" "$RUNNER_TEMP/r58gen/test_r59_usb.c" "$R57_ROOT/firmware/src/okn56_gain7.c" "$R57_ROOT/firmware/src/okn56_runtime.c" "$RUNNER_TEMP/r58gen/okn_r59_usb_bridge.c" -lm -o "$RUNNER_TEMP/r58gen/test_r59_usb_san"
          ASAN_OPTIONS=detect_leaks=0 "$RUNNER_TEMP/r58gen/test_r59_usb_san" | tee "$RUNNER_TEMP/R59_USB_SANITIZE.log"
          grep -q '^R59_GAIN_WRITE_READBACK=PASS$' "$RUNNER_TEMP/R59_USB_HOST_TEST.log"
          echo 'R59_CUSTOM_NAMESPACE=OKN6/V1' | tee "$RUNNER_TEMP/R59_TRANSPORT_STATE.txt"
          echo 'R59_TRANSPORT_MODE=USB_HID_256_BYTE_REPORT' >> "$RUNNER_TEMP/R59_TRANSPORT_STATE.txt"
          echo 'R59_LIVE_USB_EXECUTED=NO' >> "$RUNNER_TEMP/R59_TRANSPORT_STATE.txt"
          echo 'R59_HOST_TO_DEVICE_USB=NO' >> "$RUNNER_TEMP/R59_TRANSPORT_STATE.txt"

      - name: Patch vendor audio callgraph only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          import os
          root=Path(os.environ['RUNNER_TEMP'])/'bp1048sdk'
          main=root/'BT_Audio_APP/bt_audio_app_src/apps/main_task.c'
          core=root/'BT_Audio_APP/bt_audio_app_src/services/audio_core_api.c'

          def span(text,sig):
              hits=[]; pos=0
              while True:
                  p=text.find(sig,pos)
                  if p<0: break
                  j=p+len(sig)
                  while j<len(text) and text[j].isspace(): j+=1
                  if j<len(text) and text[j]=='{': hits.append((p,j))
                  pos=p+len(sig)
              if len(hits)!=1: raise SystemExit(f'definition count {sig}: {len(hits)}')
              start,brace=hits[0]; depth=0
              for i in range(brace,len(text)):
                  if text[i]=='{': depth+=1
                  elif text[i]=='}':
                      depth-=1
                      if depth==0: return start,brace,i+1
              raise SystemExit(f'unterminated {sig}')

          m0=main.read_text(encoding='latin-1'); m=m0
          inc='#include "i2s_interface.h"'
          if m.count(inc)!=1: raise SystemExit('main include anchor mismatch')
          m=m.replace(inc,inc+'\n#include "okn_r58_audio_bridge.h"',1)
          marker='\tAudioCoreSinkEnable(AUDIO_DACX_SINK_NUM);\n#endif\n\n#ifdef CFG_RES_AUDIO_I2SOUT_EN'
          if m.count(marker)!=1: raise SystemExit('sink marker mismatch')
          repl='\tAudioCoreSinkEnable(AUDIO_DACX_SINK_NUM);\n#endif\n\n\t/* R58: gain state only; no output pin/peripheral init. */\n\tokn58_audio_init(mainAppCt.SampleRate, mainAppCt.SamplesPreFrame);\n\n#ifdef CFG_RES_AUDIO_I2SOUT_EN'
          m=m.replace(marker,repl,1)
          a,b,e=span(m,'void AudioResInit(void)')
          body=m[a:e]
          body=body[:-1]+'\n\t/* R58: follow vendor frame-size changes; still output-locked. */\n\tokn58_audio_init(mainAppCt.SampleRate, mainAppCt.SamplesPreFrame);\n}'
          m=m[:a]+body+m[e:]
          main.write_text(m,encoding='latin-1')
          Path('/tmp/R58_main_task_before.c').write_text(m0,encoding='latin-1')
          Path('/tmp/R58_main_task_after.c').write_text(m,encoding='latin-1')

          c0=core.read_text(encoding='latin-1'); c=c0
          inc='#include "main_task.h"'
          if c.count(inc)!=1: raise SystemExit('core include anchor mismatch')
          c=c.replace(inc,inc+'\n#include "okn_r58_audio_bridge.h"',1)
          a,b,e=span(c,'static bool AudioCoreSinkDataSet(void)')
          block=c[a:e]
          decl='\tuint32_t i;\n'
          if block.count(decl)!=1: raise SystemExit('sink data decl anchor mismatch')
          block=block.replace(decl,decl+'\tif(!okn58_audio_space_ok(mainAppCt.SamplesPreFrame)) return FALSE;\n',1)
          tail='\treturn TRUE;\n}'
          if block.count(tail)!=1: raise SystemExit('sink data return anchor mismatch')
          block=block.replace(tail,'\tif(!okn58_audio_push(mainAppCt.SamplesPreFrame)) return FALSE;\n\treturn TRUE;\n}',1)
          c=c[:a]+block+c[e:]
          a,b,e=span(c,'void AduioCoreSinkVolSet(void)')
          block=c[a:e]
          block=block[:-1]+'\n\t/* R58 real vendor PCM-buffer call; dedicated gain stays identity by default. */\n#ifdef CFG_RES_AUDIO_DACX_EN\n\tokn58_audio_process(AudioCore.AudioSink[AUDIO_DAC0_SINK_NUM].PcmOutBuf, AudioCore.AudioSink[AUDIO_DACX_SINK_NUM].PcmOutBuf, mainAppCt.SamplesPreFrame);\n#else\n\tokn58_audio_process(AudioCore.AudioSink[AUDIO_DAC0_SINK_NUM].PcmOutBuf, (int16_t*)0, mainAppCt.SamplesPreFrame);\n#endif\n}'
          c=c[:a]+block+c[e:]
          core.write_text(c,encoding='latin-1')
          Path('/tmp/R58_audio_core_before.c').write_text(c0,encoding='latin-1')
          Path('/tmp/R58_audio_core_after.c').write_text(c,encoding='latin-1')

          joined=m+'\n'+c
          for tok in ['okn58_audio_init(','okn58_audio_process(','okn58_audio_space_ok(','okn58_audio_push(']:
              if tok not in joined: raise SystemExit('missing vendor hook '+tok)
          print('R58_VENDOR_AUDIO_PATCH=PASS')
          PY2
          diff -u /tmp/R58_main_task_before.c /tmp/R58_main_task_after.c > /tmp/R58_MAIN_TASK_PATCH.diff || true
          diff -u /tmp/R58_audio_core_before.c /tmp/R58_audio_core_after.c > /tmp/R58_AUDIO_CORE_PATCH.diff || true
          test -s /tmp/R58_MAIN_TASK_PATCH.diff
          test -s /tmp/R58_AUDIO_CORE_PATCH.diff

      - name: Patch vendor HID receive path for reserved OKN6 namespace
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          import os
          root=Path(os.environ['RUNNER_TEMP'])/'bp1048sdk'
          c=root/'BT_Audio_APP/bt_audio_app_src/audio/communication.c'
          before=c.read_text(encoding='latin-1')
          def span(text,sig):
              hits=[]; pos=0
              while True:
                  p=text.find(sig,pos)
                  if p<0: break
                  j=p+len(sig)
                  while j<len(text) and text[j].isspace(): j+=1
                  if j<len(text) and text[j]=='{': hits.append((p,j))
                  pos=p+len(sig)
              if len(hits)!=1: raise SystemExit(f'definition count {sig}: {len(hits)}')
              start,brace=hits[0]; depth=0
              for i in range(brace,len(text)):
                  if text[i]=='{': depth+=1
                  elif text[i]=='}':
                      depth-=1
                      if depth==0: return start,brace,i+1
              raise SystemExit(f'unterminated {sig}')
          inc='#include "main_task.h"'
          if before.count(inc)!=1: raise SystemExit('communication include anchor mismatch')
          s=before.replace(inc,inc+'\n#include "okn_r58_audio_bridge.h"\n#include "okn_r59_usb_bridge.h"',1)
          a,b,e=span(s,'void HIDUsb_Rx(uint8_t *buf,uint16_t len)')
          old=s[a:e]
          if 'UsbLoadAudioMode(len,buf);' not in old: raise SystemExit('stock UsbLoadAudioMode fallback not found')
          hook=("\n#ifdef CFG_COMMUNICATION_BY_USB\n"
                "\tstatic uint8_t okn_r59_reply[OKN59_REPORT_BYTES];\n"
                "\tif ((buf != NULL) && okn59_usb_claims(buf, (size_t)len))\n"
                "\t{\n"
                "\t\tsize_t okn_n = okn59_usb_handle(okn58_runtime(), buf, (size_t)len, okn_r59_reply, sizeof(okn_r59_reply));\n"
                "\t\tif (okn_n == OKN59_REPORT_BYTES)\n"
                "\t\t{\n"
                "\t\t\tCommunication_Effect_Send(okn_r59_reply, (uint16_t)okn_n);\n"
                "\t\t}\n"
                "\t\tgCtrlVars.IsEffectChangedByPcTool = 1;\n"
                "\t\treturn; /* consume reserved OKN6 namespace */\n"
                "\t}\n"
                "#endif\n")
          brace=old.find('{'); new=old[:brace+1]+hook+old[brace+1:]; s=s[:a]+new+s[e:]
          c.write_text(s,encoding='latin-1')
          Path('/tmp/R59_communication_before.c').write_text(before,encoding='latin-1')
          Path('/tmp/R59_communication_after.c').write_text(s,encoding='latin-1')
          _,_,he=span(s,'void HIDUsb_Rx(uint8_t *buf,uint16_t len)'); hs=s[s.find('void HIDUsb_Rx(uint8_t *buf,uint16_t len)'):he]
          for tok in ['okn59_usb_claims','okn59_usb_handle','okn58_runtime','Communication_Effect_Send','UsbLoadAudioMode(len,buf);']:
              if tok not in hs: raise SystemExit('HID patch missing '+tok)
          if hs.count('UsbLoadAudioMode(len,buf);')!=1: raise SystemExit('stock HID fallback count changed')
          print('R59_VENDOR_HID_PATCH=PASS'); print('R59_STOCK_HID_FALLBACK_PRESERVED=PASS')
          PY2
          diff -u /tmp/R59_communication_before.c /tmp/R59_communication_after.c > /tmp/R59_COMMUNICATION_PATCH.diff || true
          test -s /tmp/R59_COMMUNICATION_PATCH.diff

