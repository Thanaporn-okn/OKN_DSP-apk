      # setup-gradle scans Gradle project files, so the generated project must exist first.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Verify frozen V6.2 protocol core
        shell: bash
        run: |
          set -euo pipefail
          echo "e40bac569ec09021a9eb5d7751784d2d74383aaa3ff6e3ab7fec7cbabc34dc10  app/src/main/java/com/okn/peramp/DspProtocol.java" | sha256sum -c -

      - name: Validate V7 frozen write core, PEQ safety, tone truth and no-unknown-TX gate
        shell: bash
        run: |
          set -euo pipefail
          python3 Sources/validate_v38_gate.py
          python3 Sources/validate_v39_reset_v7.py
          python3 Sources/validate_oknpv7.py

      - name: Build Debug and Release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk OKNPV7-debug.apk
          cp app/build/outputs/apk/release/app-release.apk OKNPV7-release.apk

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging OKNPV7-debug.apk | tee OKNPV7-apk-badging.txt
          grep -q "package: name='com.okn.peramp' versionCode='7000' versionName='7.0.0'" OKNPV7-apk-badging.txt
          grep -q "application-label:'OKN Peramp'" OKNPV7-apk-badging.txt

      - name: Package V7 source evidence and checksums
        shell: bash
        run: |
          set -euo pipefail
          zip -qr OKNPV7-source.zip app Sources build.gradle settings.gradle gradle.properties -x '*/build/*' -x '.gradle/*'
          cp Sources/OKNPV7_REVERSE_CHECKPOINT.txt OKNPV7-REVERSE-CHECKPOINT.txt
          cp Sources/OKNPV7_BUILD_NOTES.txt OKNPV7-BUILD-NOTES.txt
          cp Sources/V7_OUTPUT_GAIN_STATIC_DISCOVERY.txt OKNPV7-OUTPUT-GAIN-STATIC-DISCOVERY.txt
          sha256sum OKNPV7-debug.apk OKNPV7-release.apk OKNPV7-source.zip OKNPV7-REVERSE-CHECKPOINT.txt OKNPV7-BUILD-NOTES.txt OKNPV7-OUTPUT-GAIN-STATIC-DISCOVERY.txt > OKNPV7-SHA256SUMS.txt
          cat OKNPV7-SHA256SUMS.txt

      - name: Upload OKNPV7 artifact
        uses: actions/upload-artifact@v7
        with:
          name: OKNPV7
          path: |
            OKNPV7-debug.apk
            OKNPV7-release.apk
            OKNPV7-source.zip
            OKNPV7-SHA256SUMS.txt
            OKNPV7-apk-badging.txt
            OKNPV7-REVERSE-CHECKPOINT.txt
            OKNPV7-BUILD-NOTES.txt
            OKNPV7-OUTPUT-GAIN-STATIC-DISCOVERY.txt
          if-no-files-found: error
          retention-days: 30
