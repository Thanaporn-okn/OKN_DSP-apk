name: OKNPV7 - Build OKN Peramp V7 Frozen V6.2 Core + Global Tone Truth

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/OKNPV7.yml'

permissions:
  contents: read

concurrency:
  group: oknpv7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build OKN Peramp 7.0.0
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 35 non-interactively
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Generate OKN Peramp V7 project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app Sources build.gradle settings.gradle gradle.properties payload.tar.gz payload.tar.gz.b64
