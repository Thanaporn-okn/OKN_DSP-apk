name: OKN BP1048P4 MASTER V5 RAW IL DOTNET HID PROTOCOL RECOVERY

"on":
  workflow_dispatch:

permissions:
  contents: read

env:
  GOLOPINE_WINDOWS_URL: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-08.exe_.zip"
  EXPECTED_RUNTIME_VID_PID: "6324:1719"
  LIVE_DEVICE_IO: "NO"
  USB_DEVICE_ACCESS: "NO"
  HOST_TO_DEVICE_IO: "NO"
  FLASH_ALLOWED: "NO"
  WRITE_ALLOWED: "NO"
  ERASE_ALLOWED: "NO"
  RECOVERY_COMMAND_ALLOWED: "NO"

jobs:
  master-v5:
    name: MASTER V5 raw IL + protected .NET HID protocol recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$LIVE_DEVICE_IO" = "NO"
          test "$USB_DEVICE_ACCESS" = "NO"
          test "$HOST_TO_DEVICE_IO" = "NO"
          test "$FLASH_ALLOWED" = "NO"
          test "$WRITE_ALLOWED" = "NO"
          test "$ERASE_ALLOWED" = "NO"
          test "$RECOVERY_COMMAND_ALLOWED" = "NO"
          rm -rf /tmp/v5
          mkdir -p /tmp/v5/{download,pkg,tools,ilspy,resources,evidence,out,dnlib}

      - name: Download and select real official Windows vendor client
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 6 --retry-all-errors --retry-delay 2 \
            --connect-timeout 20 --max-time 300 \
            "$GOLOPINE_WINDOWS_URL" -o /tmp/v5/download/vendor.zip

          unzip -q /tmp/v5/download/vendor.zip -d /tmp/v5/pkg

          EXE="$(
            find /tmp/v5/pkg -type f -iname '*.exe' \
              ! -path '*/__MACOSX/*' ! -name '._*' -printf '%s\t%p\n' \
              | sort -nr | head -n1 | cut -f2-
          )"
          test -n "$EXE"
          test "$(stat -c '%s' "$EXE")" -gt 100000
          test "$(xxd -p -l 2 "$EXE" | tr '[:lower:]' '[:upper:]')" = "4D5A"
          cp "$EXE" /tmp/v5/vendor.exe

          {
            echo "SELECTED_EXE=$EXE"
            file /tmp/v5/vendor.exe
            stat -c 'BYTES=%s' /tmp/v5/vendor.exe
            sha256sum /tmp/v5/vendor.exe
            echo "FIRST_128_BYTES="
            xxd -g1 -l 128 /tmp/v5/vendor.exe
          } | tee /tmp/v5/evidence/01_VENDOR_EXE_IDENTITY.txt

      - name: Install ILSpy and dnlib analysis helper
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --tool-path /tmp/v5/tools ilspycmd \
            > /tmp/v5/evidence/02_ILSPY_INSTALL.txt 2>&1
          /tmp/v5/tools/ilspycmd --version \
            | tee /tmp/v5/evidence/03_ILSPY_VERSION.txt

          cd /tmp/v5/dnlib
          dotnet new console --framework net8.0 --force >/dev/null
          dotnet add package dnlib --version 4.5.0 >/dev/null

      - name: Export complete raw IL and decompiled project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v5/ilspy/{cs,il}

          /tmp/v5/tools/ilspycmd -p -o /tmp/v5/ilspy/cs /tmp/v5/vendor.exe \
            > /tmp/v5/evidence/04_ILSPY_CS_STDOUT.txt \
            2> /tmp/v5/evidence/05_ILSPY_CS_STDERR.txt || true

          /tmp/v5/tools/ilspycmd -il -o /tmp/v5/ilspy/il /tmp/v5/vendor.exe \
            > /tmp/v5/evidence/06_ILSPY_IL_STDOUT.txt \
            2> /tmp/v5/evidence/07_ILSPY_IL_STDERR.txt || true

          {
            echo "CS_FILES=$(find /tmp/v5/ilspy/cs -type f -name '*.cs' | wc -l)"
            echo "IL_FILES=$(find /tmp/v5/ilspy/il -type f | wc -l)"
            echo "IL_BYTES=$(find /tmp/v5/ilspy/il -type f -printf '%s\n' | awk '{s+=$1} END{print s+0}')"
          } | tee /tmp/v5/evidence/08_ILSPY_STRUCTURE.txt

          # Package the raw IL output itself: V4 omitted this.
          if find /tmp/v5/ilspy/il -type f | grep -q .; then
            (cd /tmp/v5/ilspy/il && zip -qr /tmp/v5/evidence/09_RAW_IL_OUTPUT.zip .)
          fi

          grep -RInE \
            'HidD_SetOutputReport|HidD_SetFeature|HidD_GetInputReport|ReadFile|WriteFile|USBHID|HidDevice|HIDInterface|DSTechAcutatorCommand|HardwareCommandConverter|CreateSigmaDSP|GetOutputData|Send\(|Write\(|OpenDevice|OutputReportLength|InputReportLength|UFE_WRITE_ACTUATOR_COMMAND|UFE_READ_SENSOR|ldc\.i4|newarr|stelem\.i1' \
            /tmp/v5/ilspy/il 2>/dev/null \
            > /tmp/v5/evidence/10_RAW_IL_PROTOCOL_HITS.txt || true

      - name: Dump exact dnlib method bodies call graph constants and embedded resources
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v5/dnlib/Program.cs <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using System.Text;
          using System.Collections.Generic;
          using dnlib.DotNet;
          using dnlib.DotNet.Emit;

          static class P
          {
              static readonly string[] Focus = new[] {
                  "Hid", "HIDInterface", "HidDevice", "USBHID",
                  "DSTechAcutatorCommand", "HardwareCommandConverter",
                  "report", "UFEHeader", "DeviceCard",
                  "CreateSigmaDSP", "GetOutputData", "Send", "Write",
                  "OpenDevice", "OutputReportLength", "InputReportLength",
                  "q71r2Rj8SiD9GF1BI50"
              };

              static bool Interesting(string s) =>
                  Focus.Any(x => s.IndexOf(x, StringComparison.OrdinalIgnoreCase) >= 0);

              static string Op(object? o)
              {
                  if (o == null) return "";
                  if (o is string st) return "\"" + st.Replace("\r","\\r").Replace("\n","\\n") + "\"";
                  if (o is byte[] b) return BitConverter.ToString(b).Replace("-","");
                  return o.ToString() ?? "";
              }

              public static int Main(string[] args)
              {
                  var exe = args[0];
                  var outDir = args[1];
                  Directory.CreateDirectory(outDir);
                  Directory.CreateDirectory(Path.Combine(outDir, "resources"));

                  var mod = ModuleDefMD.Load(exe);
                  var sb = new StringBuilder();
                  var calls = new StringBuilder();
                  var allConst = new StringBuilder();

                  sb.AppendLine($"MODULE={mod.FullName}");
                  sb.AppendLine($"ASSEMBLY={mod.Assembly?.FullName}");
                  sb.AppendLine($"TYPES={mod.GetTypes().Count()}");
                  sb.AppendLine();

                  var methods = mod.GetTypes().SelectMany(t => t.Methods).ToList();

                  foreach (var m in methods)
                  {
                      var full = m.FullName ?? "";
                      bool focus = Interesting(full) || Interesting(m.DeclaringType.FullName ?? "");
                      if (!m.HasBody) continue;

                      if (focus)
                      {
                          sb.AppendLine($"===== TOKEN=0x{m.MDToken.Raw:X8} RVA=0x{m.RVA:X8} {full} =====");
                          int idx=0;
                          foreach (var ins in m.Body.Instructions)
                          {
                              sb.AppendLine($"{idx:D4} IL_{ins.Offset:X4}: {ins.OpCode} {Op(ins.Operand)}");
                              idx++;
                          }
                          sb.AppendLine();
                      }

                      foreach (var ins in m.Body.Instructions)
                      {
                          if (ins.OpCode.Code == Code.Call || ins.OpCode.Code == Code.Callvirt ||
                              ins.OpCode.Code == Code.Newobj)
                          {
                              var target = ins.Operand?.ToString() ?? "";
                              if (Interesting(target) || focus)
                                  calls.AppendLine(
                                      $"CALLER=0x{m.MDToken.Raw:X8} {full}\n" +
                                      $"  IL_{ins.Offset:X4} {ins.OpCode} {target}"
                                  );
                          }

                          if (focus && (
                              ins.OpCode.Code.ToString().StartsWith("Ldc_I4") ||
                              ins.OpCode.Code == Code.Ldc_I8 ||
                              ins.OpCode.Code == Code.Ldstr ||
                              ins.OpCode.Code == Code.Newarr ||
                              ins.OpCode.Code.ToString().StartsWith("Stelem")))
                          {
                              allConst.AppendLine(
                                  $"0x{m.MDToken.Raw:X8} {full} IL_{ins.Offset:X4} " +
                                  $"{ins.OpCode} {Op(ins.Operand)}"
                              );
                          }
                      }
                  }

                  File.WriteAllText(Path.Combine(outDir, "11_DNLIB_FOCUSED_METHOD_IL.txt"), sb.ToString());
                  File.WriteAllText(Path.Combine(outDir, "12_DNLIB_CALL_GRAPH.txt"), calls.ToString());
                  File.WriteAllText(Path.Combine(outDir, "13_DNLIB_FOCUSED_CONSTANTS.txt"), allConst.ToString());

                  var resIndex = new StringBuilder();
                  foreach (var r in mod.Resources)
                  {
                      resIndex.AppendLine($"{r.ResourceType}\t{r.Name}");
                      if (r is EmbeddedResource er)
                      {
                          try {
                              var data = er.CreateReader().ToArray();
                              var safe = string.Concat(er.Name.Select(c => char.IsLetterOrDigit(c) || c=='.' || c=='_' || c=='-' ? c : '_'));
                              var path = Path.Combine(outDir, "resources", safe + ".bin");
                              File.WriteAllBytes(path, data);
                              resIndex.AppendLine($"  BYTES={data.Length}\tFILE={Path.GetFileName(path)}");
                          } catch (Exception ex) {
                              resIndex.AppendLine($"  ERROR={ex.GetType().Name}:{ex.Message}");
                          }
                      }
                  }
                  File.WriteAllText(Path.Combine(outDir, "14_DNLIB_RESOURCE_INDEX.txt"), resIndex.ToString());

                  // Full method metadata inventory to prove what has real IL bodies.
                  var meta = new StringBuilder();
                  foreach (var m in methods)
                      meta.AppendLine(
                          $"TOKEN=0x{m.MDToken.Raw:X8}\tRVA=0x{m.RVA:X8}\tHASBODY={m.HasBody}\t" +
                          $"INS={(m.HasBody ? m.Body.Instructions.Count : 0)}\t{m.FullName}"
                      );
                  File.WriteAllText(Path.Combine(outDir, "15_DNLIB_METHOD_INVENTORY.txt"), meta.ToString());

                  return 0;
              }
          }
          CS

          cd /tmp/v5/dnlib
          dotnet run -c Release -- /tmp/v5/vendor.exe /tmp/v5/evidence \
            > /tmp/v5/evidence/16_DNLIB_STDOUT.txt \
            2> /tmp/v5/evidence/17_DNLIB_STDERR.txt

      - name: Analyze protector runtime and anti-tamper evidence
        shell: bash
        run: |
          set -euo pipefail

          grep -nEi \
            'q71r2Rj8SiD9GF1BI50|WriteProcessMemory|VirtualProtect|Marshal\.Write|GetManifestResourceStream|AesCryptoServiceProvider|CryptoStream|GetDelegateForFunctionPointer|Assembly\.Load|ModuleHandle|PrepareMethod|GetFunctionPointer' \
            /tmp/v5/evidence/11_DNLIB_FOCUSED_METHOD_IL.txt \
            /tmp/v5/evidence/12_DNLIB_CALL_GRAPH.txt \
            /tmp/v5/evidence/15_DNLIB_METHOD_INVENTORY.txt \
            > /tmp/v5/evidence/18_PROTECTOR_RUNTIME_HITS.txt || true

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, math, re, zipfile, zlib, gzip

          root=Path('/tmp/v5/evidence/resources')
          rows=[]

          def entropy(b):
              if not b: return 0.0
              cnt=[0]*256
              for x in b: cnt[x]+=1
              n=len(b)
              import math
              return -sum((c/n)*math.log2(c/n) for c in cnt if c)

          for p in root.glob('*'):
              if not p.is_file(): continue
              b=p.read_bytes()
              hits={
                'MZ': [m.start() for m in re.finditer(b'MZ',b)][:20],
                'ZIP': [m.start() for m in re.finditer(b'PK\x03\x04',b)][:20],
                'BSJB': [m.start() for m in re.finditer(b'BSJB',b)][:20],
                'DEX': [m.start() for m in re.finditer(b'dex\n',b)][:20],
                'A55A': [m.start() for m in re.finditer(bytes.fromhex('A55A'),b)][:20],
                'VIDPID_LE': [m.start() for m in re.finditer(bytes.fromhex('24631917'),b)][:20],
              }
              rows.append({
                'file':p.name,
                'bytes':len(b),
                'sha256':hashlib.sha256(b).hexdigest(),
                'entropy':round(entropy(b),6),
                'magic_hits':hits
              })

          Path('/tmp/v5/evidence/19_RESOURCE_MAGIC_SCAN.json').write_text(
              json.dumps(rows,indent=2)+'\n'
          )
          PY

      - name: Extract exact HID caller windows and byte-building candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          il=Path('/tmp/v5/evidence/11_DNLIB_FOCUSED_METHOD_IL.txt').read_text(errors='ignore')
          calls=Path('/tmp/v5/evidence/12_DNLIB_CALL_GRAPH.txt').read_text(errors='ignore')
          const=Path('/tmp/v5/evidence/13_DNLIB_FOCUSED_CONSTANTS.txt').read_text(errors='ignore')

          needles=[
              'Hid::Write','HIDInterface::Send','GetOutputData',
              'HidD_SetOutputReport','HidD_SetFeature','HidD_GetInputReport',
              'WriteFile','ReadFile','CreateSigmaDSP',
              'DSTechAcutatorCommand','UFE_WRITE_ACTUATOR_COMMAND'
          ]

          blocks=[]
          for text,name in [(il,'IL'),(calls,'CALLS'),(const,'CONST')]:
              lines=text.splitlines()
              for i,l in enumerate(lines):
                  if any(n.lower() in l.lower() for n in needles):
                      lo=max(0,i-30); hi=min(len(lines),i+50)
                      blocks.append(
                          f"\n===== {name}:{i+1} =====\n" +
                          '\n'.join(lines[lo:hi]) + '\n'
                      )

          Path('/tmp/v5/evidence/20_EXACT_HID_CALLER_WINDOWS.txt').write_text(
              ''.join(blocks[:3000])
          )

          # Harvest integer constants appearing near HID/command code.
          nums=[]
          for block in blocks:
              vals=re.findall(r'\b(?:ldc\.i4(?:\.s)?\s+)?(-?\d+)\b|0x([0-9A-Fa-f]+)',block)
              for dec,hx in vals:
                  if dec:
                      try:v=int(dec)
                      except:continue
                  elif hx:
                      v=int(hx,16)
                  else: continue
                  if -1 <= v <= 65535:
                      nums.append(v)
          from collections import Counter
          counts=Counter(nums)
          Path('/tmp/v5/evidence/21_NEAR_HID_CONSTANT_FREQUENCY.json').write_text(
              json.dumps(counts.most_common(1000),indent=2)+'\n'
          )
          PY

      - name: Best-effort generic deobfuscation probe without trusting output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v5/deobf
          {
            echo "This is best-effort only. No transformed binary is ever executed or sent to hardware."
            echo "Strings that suggest runtime method patching:"
            grep -Ei 'WriteProcessMemory|VirtualProtect|GetDelegateForFunctionPointer|CryptoStream|AesCryptoServiceProvider' \
              /tmp/v5/evidence/18_PROTECTOR_RUNTIME_HITS.txt | head -n 300 || true
          } > /tmp/v5/evidence/22_DEOBFUSCATION_ASSESSMENT.txt

      - name: Build V5 decision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          e=Path('/tmp/v5/evidence')
          il=(e/'11_DNLIB_FOCUSED_METHOD_IL.txt').read_text(errors='ignore')
          calls=(e/'12_DNLIB_CALL_GRAPH.txt').read_text(errors='ignore')
          prot=(e/'18_PROTECTOR_RUNTIME_HITS.txt').read_text(errors='ignore')
          win=(e/'20_EXACT_HID_CALLER_WINDOWS.txt').read_text(errors='ignore')

          def seen(p,*texts):
              return any(re.search(p,t,re.I|re.S) for t in texts)

          decision={
            'revision':'MASTER-V5',
            'source':'official GoloPine/DSTech Windows client',
            'expected_runtime_vid_pid':'6324:1719',
            'raw_il_captured':(e/'09_RAW_IL_OUTPUT.zip').exists(),
            'dnlib_real_method_bodies_seen':seen(r'HASBODY=True', (e/'15_DNLIB_METHOD_INVENTORY.txt').read_text(errors='ignore')),
            'hid_output_api_seen':seen(r'HidD_SetOutputReport',il,calls,win),
            'hid_feature_api_seen':seen(r'HidD_SetFeature',il,calls,win),
            'hid_input_api_seen':seen(r'HidD_GetInputReport',il,calls,win),
            'writefile_seen':seen(r'WriteFile',il,calls,win),
            'readfile_seen':seen(r'ReadFile',il,calls,win),
            'dstech_command_seen':seen(r'DSTechAcutatorCommand',il,calls,win),
            'sigma_command_seen':seen(r'CreateSigmaDSP',il,calls,win),
            'runtime_method_patching_or_antitamper_seen':seen(r'WriteProcessMemory|VirtualProtect|Marshal\.Write|CryptoStream',prot),
            'exact_live_frame_proven':False,
            'safe_stock_backup_proven':False,
            'rollback_proven':False,
            'exact_board_flash_layout_proven':False,
            'live_device_io':False,
            'host_to_device_io':False,
            'flash_allowed':False
          }

          # Do not automatically claim exact protocol merely because APIs/callers were found.
          # That requires an unambiguous report buffer construction plus transport call.
          if decision['hid_output_api_seen'] and decision['dstech_command_seen']:
              decision['status']='RAW_HID_PATH_IDENTIFIED_EXACT_FRAME_REQUIRES_REVIEW'
          else:
              decision['status']='PROTECTED_CLIENT_REQUIRES_FURTHER_OFFLINE_RECOVERY'

          (e/'23_V5_FINAL_DECISION.json').write_text(json.dumps(decision,indent=2)+'\n')
          md=f"""# MASTER V5 FINAL DECISION

          - Raw IL captured: **{decision['raw_il_captured']}**
          - Real dnlib method bodies visible: **{decision['dnlib_real_method_bodies_seen']}**
          - HID SetOutputReport path: **{decision['hid_output_api_seen']}**
          - HID SetFeature path: **{decision['hid_feature_api_seen']}**
          - HID GetInputReport path: **{decision['hid_input_api_seen']}**
          - WriteFile/ReadFile: **{decision['writefile_seen']} / {decision['readfile_seen']}**
          - DSTech command objects: **{decision['dstech_command_seen']}**
          - Sigma command builders: **{decision['sigma_command_seen']}**
          - Runtime method patching/anti-tamper evidence: **{decision['runtime_method_patching_or_antitamper_seen']}**
          - Exact live report frame proven: **NO**
          - Safe stock backup proven: **NO**
          - Rollback proven: **NO**
          - Flash allowed: **NO**

          Status: **{decision['status']}**

          Classification: **STATIC_ANALYSIS_ONLY_NOT_FOR_FLASH**
          """
          (e/'24_V5_FINAL_DECISION.md').write_text(md)
          print(md)
          PY
          cat /tmp/v5/evidence/24_V5_FINAL_DECISION.md >> "$GITHUB_STEP_SUMMARY"

      - name: Package one V5 artifact
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/v5/evidence/* /tmp/v5/out/
          (cd /tmp/v5/out && sha256sum * > SHA256SUMS.txt)

          # Never redistribute the vendor EXE or downloaded vendor ZIP.
          test ! -e /tmp/v5/out/vendor.exe
          test ! -e /tmp/v5/out/vendor.zip

      - name: Upload V5 static evidence
        uses: actions/upload-artifact@v7
        with:
          name: OKN-BP1048P4-MASTER-V5-RAW-IL-DOTNET-HID-PROTOCOL-RECOVERY
          path: /tmp/v5/out/*
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed assertion
        shell: bash
        run: |
          set -euo pipefail
          test "$LIVE_DEVICE_IO" = "NO"
          test "$USB_DEVICE_ACCESS" = "NO"
          test "$HOST_TO_DEVICE_IO" = "NO"
          test "$FLASH_ALLOWED" = "NO"
          test "$WRITE_ALLOWED" = "NO"
          test "$ERASE_ALLOWED" = "NO"
          test "$RECOVERY_COMMAND_ALLOWED" = "NO"
          grep -q '"live_device_io": false' /tmp/v5/evidence/23_V5_FINAL_DECISION.json
          grep -q '"host_to_device_io": false' /tmp/v5/evidence/23_V5_FINAL_DECISION.json
          grep -q '"flash_allowed": false' /tmp/v5/evidence/23_V5_FINAL_DECISION.json
          grep -q 'STATIC_ANALYSIS_ONLY_NOT_FOR_FLASH' /tmp/v5/evidence/24_V5_FINAL_DECISION.md
          echo "MASTER_V5_STATIC_ANALYSIS=PASS"
          echo "FLASH_ALLOWED=NO"
