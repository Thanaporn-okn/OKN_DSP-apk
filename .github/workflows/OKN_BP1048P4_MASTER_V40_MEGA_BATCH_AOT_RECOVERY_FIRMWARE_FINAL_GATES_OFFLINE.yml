name: OKN BP1048P4 MASTER V40 MEGA BATCH AOT + RECOVERY + FIRMWARE + FINAL GATES OFFLINE

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/OKN_BP1048P4_MASTER_V40_MEGA_BATCH_AOT_RECOVERY_FIRMWARE_FINAL_GATES_OFFLINE.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  # Current authoritative artifacts
  V32_ARTIFACT_ID: "11298720275"
  V33_ARTIFACT_ID: "11298985578"
  V38_ARTIFACT_ID: "11299447620"
  V39_ARTIFACT_ID: "11300245374"

  # Historical evidence pulled into the same run
  FINAL_USB_SPEC_ARTIFACT_ID: "11048996382"
  RECOVERY_V13_ARTIFACT_ID: "11247972033"
  RECOVERY_V15_ARTIFACT_ID: "11248604068"
  RECOVERY_V16_ARTIFACT_ID: "11251221570"
  RECOVERY_V17_ARTIFACT_ID: "11251820245"
  UPDATER_V3_ARTIFACT_ID: "11139458303"
  UPGRADE_HEADER_V12_ARTIFACT_ID: "11104361045"
  SDK_BOOT_USB_ARTIFACT_ID: "11045528884"
  AUTH_V28_ARTIFACT_ID: "11296454861"
  FIRMWARE_CORE_ARTIFACT_ID: "10830737503"

  OFFICIAL_ANDROID_ZIP_URL: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-01.apk_.zip"
  EXPECTED_ANDROID_APK_SHA256: "6c2d977f66609b3217f1bd72460aacb299f841bc654bf39f4d209132ca92907c"

  OFFICIAL_WINDOWS_ZIP_URL: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-08.exe_.zip"
  EXPECTED_WINDOWS_EXE_SHA256: "3ca54171c53f7badd963ffe6851b8b3e2faf8aee8ba2afcb7040990e22ae09b2"

  LIVE_DSP_ALLOWED: "NO"
  HOST_TO_DSP_IO: "NO"
  FEATURE_REPORT_ALLOWED: "NO"
  FLASH_ALLOWED: "NO"
  ERASE_ALLOWED: "NO"
  WRITE_ALLOWED: "NO"
  NEW_LIVE_0X11_ALLOWED: "NO"

jobs:
  mega-v40:
    name: Run 6 offline gates in one batch
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Gate 0 - hard safety and workspace
        shell: bash
        run: |
          set -euo pipefail

          test "$LIVE_DSP_ALLOWED" = "NO"
          test "$HOST_TO_DSP_IO" = "NO"
          test "$FEATURE_REPORT_ALLOWED" = "NO"
          test "$FLASH_ALLOWED" = "NO"
          test "$ERASE_ALLOWED" = "NO"
          test "$WRITE_ALLOWED" = "NO"
          test "$NEW_LIVE_0X11_ALLOWED" = "NO"

          rm -rf /tmp/v40
          mkdir -p /tmp/v40/{downloads,artifacts,official_android,official_windows,evidence,out}

          cat > /tmp/v40/evidence/00_SCOPE.txt <<'EOF'
          REVISION=MASTER-V40
          MODE=MEGA_BATCH_OFFLINE_ONLY

          THIS ONE WORKFLOW COMBINES:
          1. Flutter/AOT native mining of the official Android app.
          2. Official Windows client static tuning-vs-updater classification.
          3. Full V32/V33/V38/V39 Device Description + channel/Gain reconciliation.
          4. Historical recovery/updater/SDK artifact reconciliation.
          5. Firmware core/Gain integration re-audit and production candidate manifest.
          6. Unified production flash/backup/rollback/readiness gate.

          HARD RULES:
          - no device/phone connection from Actions,
          - no HID/USB I/O,
          - no Feature report,
          - no live byte 0x11,
          - no legacy destructive live commands,
          - no flash/erase/write.

          FLASH_ALLOWED=NO
          EOF

      - name: Gate 1 - download all exact evidence artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cat > /tmp/v40/download_artifact.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          id="$1"
          name="$2"
          out="/tmp/v40/artifacts/$name"
          mkdir -p "$out"

          curl -fL --retry 5 --retry-all-errors \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
            -o "/tmp/v40/downloads/${name}.zip"

          unzip -q "/tmp/v40/downloads/${name}.zip" -d "$out"
          SH
          chmod +x /tmp/v40/download_artifact.sh

          /tmp/v40/download_artifact.sh "$V32_ARTIFACT_ID" v32
          /tmp/v40/download_artifact.sh "$V33_ARTIFACT_ID" v33
          /tmp/v40/download_artifact.sh "$V38_ARTIFACT_ID" v38
          /tmp/v40/download_artifact.sh "$V39_ARTIFACT_ID" v39
          /tmp/v40/download_artifact.sh "$FINAL_USB_SPEC_ARTIFACT_ID" final_usb_spec
          /tmp/v40/download_artifact.sh "$RECOVERY_V13_ARTIFACT_ID" recovery_v13
          /tmp/v40/download_artifact.sh "$RECOVERY_V15_ARTIFACT_ID" recovery_v15
          /tmp/v40/download_artifact.sh "$RECOVERY_V16_ARTIFACT_ID" recovery_v16
          /tmp/v40/download_artifact.sh "$RECOVERY_V17_ARTIFACT_ID" recovery_v17
          /tmp/v40/download_artifact.sh "$UPDATER_V3_ARTIFACT_ID" updater_v3
          /tmp/v40/download_artifact.sh "$UPGRADE_HEADER_V12_ARTIFACT_ID" upgrade_header_v12
          /tmp/v40/download_artifact.sh "$SDK_BOOT_USB_ARTIFACT_ID" sdk_boot_usb
          /tmp/v40/download_artifact.sh "$AUTH_V28_ARTIFACT_ID" auth_v28
          /tmp/v40/download_artifact.sh "$FIRMWARE_CORE_ARTIFACT_ID" firmware_core

          # Recursively unpack nested evidence zips, but never execute anything.
          cat > /tmp/v40/unpack_nested.py <<'PY'
          from pathlib import Path
          import zipfile

          root=Path("/tmp/v40/artifacts")
          seen=set()

          for _ in range(4):
              todo=[]
              for z in root.rglob("*.zip"):
                  if z not in seen:
                      todo.append(z)
              if not todo:
                  break
              for z in todo:
                  seen.add(z)
                  dest=z.with_suffix(z.suffix+".unpacked")
                  dest.mkdir(parents=True,exist_ok=True)
                  try:
                      with zipfile.ZipFile(z) as q:
                          q.extractall(dest)
                  except Exception:
                      pass
          print("nested_zip_count",len(seen))
          PY

          python3 /tmp/v40/unpack_nested.py

          find /tmp/v40/artifacts -type f -printf '%P\n' | sort \
            > /tmp/v40/evidence/01_ARTIFACT_FILE_INVENTORY.txt

          find /tmp/v40/artifacts -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > /tmp/v40/evidence/02_ARTIFACT_SHA256SUMS.txt

      - name: Gate 2 - official Android Flutter AOT/native mining
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 6 --retry-all-errors \
            "$OFFICIAL_ANDROID_ZIP_URL" \
            -o /tmp/v40/downloads/official_android.zip

          APK_NAME="$(unzip -Z1 /tmp/v40/downloads/official_android.zip \
            | grep -Ei '\.apk$' \
            | head -n1)"

          test -n "$APK_NAME"

          unzip -p /tmp/v40/downloads/official_android.zip "$APK_NAME" \
            > /tmp/v40/official_android/official.apk

          APK_SHA="$(sha256sum /tmp/v40/official_android/official.apk | awk '{print $1}')"
          test "$APK_SHA" = "$EXPECTED_ANDROID_APK_SHA256"

          mkdir -p /tmp/v40/official_android/unpacked
          unzip -q /tmp/v40/official_android/official.apk \
            -d /tmp/v40/official_android/unpacked

          test -s /tmp/v40/official_android/unpacked/lib/arm64-v8a/libapp.so

          sha256sum \
            /tmp/v40/official_android/official.apk \
            /tmp/v40/official_android/unpacked/lib/arm64-v8a/libapp.so \
            > /tmp/v40/evidence/03_ANDROID_NATIVE_IDENTITY.txt

          file /tmp/v40/official_android/unpacked/lib/arm64-v8a/libapp.so \
            > /tmp/v40/evidence/04_ANDROID_LIBAPP_FILE.txt

          readelf -h -S -W \
            /tmp/v40/official_android/unpacked/lib/arm64-v8a/libapp.so \
            > /tmp/v40/evidence/05_ANDROID_LIBAPP_ELF.txt || true

          strings -a -n 4 -t x \
            /tmp/v40/official_android/unpacked/lib/arm64-v8a/libapp.so \
            > /tmp/v40/evidence/06_ANDROID_LIBAPP_STRINGS.txt

          grep -aEin \
            'BiquadCascade|7thChannel|i2sout1R|i2sout1L|MasterVolume|SaveParams|BassVolume|DeviceDescription|6324|1719|25380|5913|Usb|HID|controlTransfer|GET_REPORT|SET_REPORT|Bluetooth|BLE|Firmware|flash|upgrade|recovery|backup|bootloader|Gain' \
            /tmp/v40/evidence/06_ANDROID_LIBAPP_STRINGS.txt \
            > /tmp/v40/evidence/07_ANDROID_LIBAPP_KEYWORD_HITS.txt || true

          : > /tmp/v40/evidence/08_ANDROID_ASSET_SCHEMA_HITS.txt

          find /tmp/v40/official_android/unpacked/assets/flutter_assets \
            -type f -print0 \
            | xargs -0 grep -aEin \
            'BiquadCascade|7thChannel|i2sout1R|i2sout1L|MasterVolume|SaveParams|BassVolume|DeviceDescription|"ID"[[:space:]]*:[[:space:]]*(17|2[2-8])|Gain|Firmware|flash|upgrade|recovery|backup' \
            >> /tmp/v40/evidence/08_ANDROID_ASSET_SCHEMA_HITS.txt \
            2>/dev/null || true

          cat > /tmp/v40/android_native_decide.py <<'PY'
          from pathlib import Path
          import json,re

          ev=Path("/tmp/v40/evidence")
          s=(ev/"06_ANDROID_LIBAPP_STRINGS.txt").read_text(errors="ignore")
          a=(ev/"08_ANDROID_ASSET_SCHEMA_HITS.txt").read_text(errors="ignore")
          c=s+"\n"+a
          low=c.lower()

          result={
              "official_android_is_flutter_native":
                  "libapp.so" in (ev/"03_ANDROID_NATIVE_IDENTITY.txt").read_text(errors="ignore"),
              "ch7_name_present_anywhere":"biquadcascade7thchannel" in low,
              "i2sout1r_present_anywhere":"i2sout1r" in low,
              "device_description_term_present":"devicedescription" in low,
              "usb_transport_terms_present":
                  any(x in low for x in ["usbdeviceconnection","controltransfer","hid"]),
              "bluetooth_terms_present":
                  any(x in low for x in ["bluetooth","ble"]),
              "schema_like_id17_present":
                  bool(re.search(r'(?i)(?:"?ID"?\s*[:=]\s*17\b|controlid\s*[:=]\s*17\b)',c)),
              "schema_like_gain_22_28":{
                  str(n):bool(re.search(
                      rf'(?i)(?:"?ID"?\s*[:=]\s*{n}\b|controlid\s*[:=]\s*{n}\b)',
                      c))
                  for n in range(22,29)
              }
          }

          result["gain_collision_candidates"]=[
              int(k) for k,v in result["schema_like_gain_22_28"].items() if v
          ]

          (ev/"09_ANDROID_NATIVE_DECISION.json").write_text(
              json.dumps(result,indent=2)+"\n"
          )
          print(json.dumps(result,indent=2))
          PY

          python3 /tmp/v40/android_native_decide.py

      - name: Gate 3 - official Windows tuning-vs-updater classification
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 6 --retry-all-errors \
            "$OFFICIAL_WINDOWS_ZIP_URL" \
            -o /tmp/v40/downloads/official_windows.zip

          unzip -q /tmp/v40/downloads/official_windows.zip \
            -d /tmp/v40/official_windows/pkg

          EXE="$(find /tmp/v40/official_windows/pkg \
            -type f -iname '*.exe' \
            | sort \
            | head -n1)"

          test -n "$EXE"

          EXE_SHA="$(sha256sum "$EXE" | awk '{print $1}')"
          test "$EXE_SHA" = "$EXPECTED_WINDOWS_EXE_SHA256"

          cp "$EXE" /tmp/v40/official_windows/vendor.exe

          sha256sum /tmp/v40/official_windows/vendor.exe \
            > /tmp/v40/evidence/10_WINDOWS_IDENTITY.txt

          file /tmp/v40/official_windows/vendor.exe \
            > /tmp/v40/evidence/11_WINDOWS_FILE.txt

          strings -a -n 4 -t x \
            /tmp/v40/official_windows/vendor.exe \
            > /tmp/v40/evidence/12_WINDOWS_ASCII_STRINGS.txt

          strings -el -n 4 -t x \
            /tmp/v40/official_windows/vendor.exe \
            > /tmp/v40/evidence/13_WINDOWS_UTF16_STRINGS.txt || true

          cat \
            /tmp/v40/evidence/12_WINDOWS_ASCII_STRINGS.txt \
            /tmp/v40/evidence/13_WINDOWS_UTF16_STRINGS.txt \
            > /tmp/v40/evidence/14_WINDOWS_ALL_STRINGS.txt

          grep -aEin \
            '6324|1719|2244|HidD_SetFeature|getFeature|SendDeviceDescriptionRequest|FirmwareRevision|upgrade|firmware|flash|erase|backup|recovery|bootloader|chiperas|codedata|bootdat|constdat|cnfgdat|btupdat|upinfo|cxxx' \
            /tmp/v40/evidence/14_WINDOWS_ALL_STRINGS.txt \
            > /tmp/v40/evidence/15_WINDOWS_SIGNAL_HITS.txt || true

          cat > /tmp/v40/windows_decide.py <<'PY'
          from pathlib import Path
          import json

          ev=Path("/tmp/v40/evidence")
          s=(ev/"14_WINDOWS_ALL_STRINGS.txt").read_text(errors="ignore").lower()

          banned=["chiperas","codedata","bootdat","constdat","cnfgdat","btupdat","upinfo","cxxx"]

          result={
              "runtime_vid_term_present":"6324" in s,
              "runtime_pid_term_present":"1719" in s,
              "recovery_2244_term_present":"2244" in s,
              "hid_feature_api_present":
                  "hidd_setfeature" in s or "getfeature" in s,
              "device_description_request_term_present":
                  "senddevicedescriptionrequest" in s,
              "firmware_revision_term_present":
                  "firmwarerevision" in s,
              "generic_upgrade_term_present":"upgrade" in s,
              "generic_flash_term_present":"flash" in s,
              "legacy_flash_command_terms_present":[x for x in banned if x in s]
          }

          result["public_client_contains_complete_known_legacy_writer_vocabulary"] = (
              len(result["legacy_flash_command_terms_present"]) == len(banned)
          )

          (ev/"16_WINDOWS_CLASSIFICATION.json").write_text(
              json.dumps(result,indent=2)+"\n"
          )
          print(json.dumps(result,indent=2))
          PY

          python3 /tmp/v40/windows_decide.py

      - name: Gate 4 - Device Description gap + CH7 + Gain collision reconciliation
        shell: bash
        run: |
          set -euo pipefail

          V32_BYTES="$(find /tmp/v40/artifacts/v32 -type f \
            -name DEVICE_DESCRIPTION_BYTES.bin | head -n1)"
          V32_JSON="$(find /tmp/v40/artifacts/v32 -type f \
            -name 05_V32_DECISION.json | head -n1)"
          V38_JSON="$(find /tmp/v40/artifacts/v38 -type f \
            -name 03_V38_MAPPING_AND_COLLISION_AUDIT.json | head -n1)"
          V39_JSON="$(find /tmp/v40/artifacts/v39 -type f \
            -name 20_V39_DECISION.json | head -n1)"

          test -s "$V32_BYTES"
          test -s "$V32_JSON"
          test -s "$V38_JSON"
          test -s "$V39_JSON"

          cp "$V32_BYTES" /tmp/v40/device_description.bin

          cat > /tmp/v40/reconcile_description.py <<'PY'
          from pathlib import Path
          import json,re

          root=Path("/tmp/v40")
          ev=root/"evidence"

          def one(pattern):
              xs=list((root/"artifacts").rglob(pattern))
              if not xs:
                  raise SystemExit("missing "+pattern)
              return xs[0]

          v32=json.loads(one("05_V32_DECISION.json").read_text())
          v38=json.loads(one("03_V38_MAPPING_AND_COLLISION_AUDIT.json").read_text())
          v39=json.loads(one("20_V39_DECISION.json").read_text())

          b=(root/"device_description.bin").read_bytes()
          t=b.decode("utf-8","replace")

          exact=[]
          for m in re.finditer(
              r'\{"ID":(\d+),"type":(\d+),"name":"([^"]+)"',
              t):
              exact.append({
                  "id":int(m.group(1)),
                  "type":int(m.group(2)),
                  "name":m.group(3),
                  "offset":m.start()
              })

          exact_ids=sorted(set(x["id"] for x in exact))

          known_names=[
              "BiquadCascadeLeftChannel",
              "BiquadCascadeRightChannel",
              "BiquadCascadeBassChannel",
              "BiquadCascade4thChannel",
              "BiquadCascade5thChannel",
              "BiquadCascade6thChannel",
              "BiquadCascade7thChannel"
          ]

          windows=[]
          for name in known_names:
              p=t.find(name)
              if p>=0:
                  windows.append({
                      "name":name,
                      "offset":p,
                      "context":t[max(0,p-220):min(len(t),p+420)]
                  })

          suspicious_gain={}
          for n in range(22,29):
              suspicious_gain[str(n)]={
                  "exact_id_present":n in exact_ids,
                  "literal_id_token_present":
                      bool(re.search(rf'(?:"ID":{n}\b|"ID"\s*:\s*{n}\b)',t))
              }

          expected=int(v32["final_dev_description_length"])
          accumulated=int(v32["final_accumulated_bytes"])
          missing=expected-accumulated

          result={
              "expected_bytes":expected,
              "recovered_bytes":accumulated,
              "missing_bytes":missing,
              "exact_ids":exact_ids,
              "exact_entries":exact,
              "channel_context_windows":windows,
              "gain_22_28_local_presence":suspicious_gain,
              "ch7_name_present":"BiquadCascade7thChannel" in t,
              "ch7_id17_exact_present":
                  any(x["id"]==17 and x["name"]=="BiquadCascade7thChannel" for x in exact),
              "v38_ch7_status":
                  next(x["id_status"] for x in v38["production_channel_mapping"] if x["channel"]=="CH7"),
              "v39_direct_static_ch7_id17":
                  bool(v39["ch7_id17_direct_static_proof"]),
              "global_gain_22_28_absence_proven":False,
              "reason":
                  f"{missing} decoded Device Description bytes remain missing."
          }

          (ev/"17_DESCRIPTION_RECONCILIATION.json").write_text(
              json.dumps(result,indent=2,ensure_ascii=False)+"\n"
          )

          with (ev/"18_CHANNEL_CONTEXT_WINDOWS.txt").open("w") as f:
              for x in windows:
                  f.write(
                      f"=== {x['name']} offset={x['offset']} ===\n"
                      +x["context"]+"\n\n"
                  )

          print(json.dumps({
              "missing_bytes":missing,
              "exact_ids":exact_ids,
              "ch7_id17_exact_present":result["ch7_id17_exact_present"],
              "gain_22_28":suspicious_gain
          },indent=2))
          PY

          python3 /tmp/v40/reconcile_description.py

      - name: Gate 5 - recovery/updater/backup/layout evidence reconciliation
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/v40/reconcile_recovery.py <<'PY'
          from pathlib import Path
          import json,re

          root=Path("/tmp/v40/artifacts")
          ev=Path("/tmp/v40/evidence")

          allowed_suffix={".txt",".md",".json",".tsv",".log",".asm",".c",".h",".kt"}

          texts={}
          for group in [
              "final_usb_spec",
              "recovery_v13",
              "recovery_v15",
              "recovery_v16",
              "recovery_v17",
              "updater_v3",
              "upgrade_header_v12",
              "sdk_boot_usb",
              "auth_v28"
          ]:
              base=root/group
              parts=[]
              for p in base.rglob("*"):
                  if p.is_file() and p.suffix.lower() in allowed_suffix:
                      try:
                          parts.append(p.read_text(errors="ignore"))
                      except Exception:
                          pass
              texts[group]="\n".join(parts)

          alltext="\n".join(texts.values()).lower()

          cmds=[
              "chiperas","codedata","bootdat","constdat",
              "cnfgdat","btupdat","upinfo","cxxx"
          ]

          destructive_command_evidence={
              c:any(c in texts[g].lower() for g in texts)
              for c in cmds
          }

          result={
              "historical_recovery_command_vocabulary":destructive_command_evidence,
              "recovery_pid_2244_reference_present":"2244" in alltext,
              "runtime_6324_1719_present":
                  "6324" in alltext and "1719" in alltext,
              "sdk_staging_0x100000_present":"0x100000" in alltext,
              "sdk_staging_0x120000_present":"0x120000" in alltext,
              "chip_erase_64k_static_evidence":
                  "erase_granularity_bytes" in alltext and "65536" in alltext,
              "block_4k_static_evidence":
                  "4096" in alltext and ("readback" in alltext or "reads_back_4kb" in alltext),
              "pure_read_only_stock_backup_command_proven":False,
              "production_recovery_identity_proven":False,
              "production_live_recovery_entry_without_forbidden_0x11_proven":False,
              "production_flash_layout_proven":False,
              "production_stock_backup_completed":False,
              "production_rollback_completed":False,
              "production_writer_ready":False,
              "flash_allowed":False
          }

          # Search report language that independently keeps the gates closed.
          gate_lines=[]
          patterns=[
              r'FLASH_ALLOWED\s*=\s*NO',
              r'recovery identity:\s*\*\*BLOCKED\*\*',
              r'firmware writer:\s*\*\*BLOCKED\*\*',
              r'live boot entry:\s*\*\*BLOCKED\*\*',
              r'not yet proof of the production',
              r'production memory map',
              r'bootable image'
          ]

          for group,txt in texts.items():
              for line in txt.splitlines():
                  if any(re.search(p,line,re.I) for p in patterns):
                      gate_lines.append(f"{group}: {line.strip()}")

          (ev/"19_RECOVERY_UPDATER_GATES.json").write_text(
              json.dumps(result,indent=2)+"\n"
          )

          (ev/"20_RECOVERY_GATE_SOURCE_LINES.txt").write_text(
              "\n".join(gate_lines[:1500])+"\n"
          )

          print(json.dumps(result,indent=2))
          PY

          python3 /tmp/v40/reconcile_recovery.py

      - name: Gate 6 - firmware core audit and production candidate manifest
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/v40/firmware_audit.py <<'PY'
          from pathlib import Path
          import json,re,hashlib

          root=Path("/tmp/v40/artifacts/firmware_core")
          ev=Path("/tmp/v40/evidence")

          result_files=list(root.rglob("RESULT.json"))
          if not result_files:
              raise SystemExit("firmware RESULT.json missing")

          old=json.loads(result_files[0].read_text())

          source_files=[]
          for p in root.rglob("*"):
              if p.is_file() and p.suffix.lower() in {".c",".h",".o",".txt",".map",".json"}:
                  h=hashlib.sha256(p.read_bytes()).hexdigest()
                  source_files.append({
                      "path":str(p.relative_to(root)),
                      "sha256":h,
                      "bytes":p.stat().st_size
                  })

          gain_ids={f"CH{i}":21+i for i in range(1,8)}

          mapping={
              "CH1":{"stock_eq_id":4,"physical":"left channel","mapping":"PROVEN"},
              "CH2":{"stock_eq_id":5,"physical":"right channel","mapping":"PROVEN"},
              "CH3":{"stock_eq_id":6,"physical":"bass channel","mapping":"PROVEN"},
              "CH4":{"stock_eq_id":14,"physical":"i2sout0L","mapping":"PROVEN"},
              "CH5":{"stock_eq_id":15,"physical":"i2sout0R","mapping":"PROVEN"},
              "CH6":{"stock_eq_id":16,"physical":"i2sout1L","mapping":"PROVEN"},
              "CH7":{"stock_eq_id":17,"physical":"i2sout1R","mapping":"ID17_INFERRED_PHYSICAL_PROVEN"}
          }

          result={
              "target":"nds32le-elf",
              "d1088_object_compile":bool(old.get("D1088_OBJECT_COMPILE")),
              "relocatable_link_succeeded":bool(old.get("RELOCATABLE_LINK_SUCCEEDED")),
              "strong_runtime_symbols_resolved":bool(old.get("STRONG_RUNTIME_SYMBOLS_RESOLVED")),
              "fp_base_final_link_review_required":bool(old.get("FP_BASE_FINAL_LINK_REVIEW_REQUIRED")),
              "integrated_post_peq_gain":bool(old.get("INTEGRATED_POST_PEQ_GAIN")),
              "bootable_image":bool(old.get("BOOTABLE_IMAGE")),
              "target_executed":bool(old.get("TARGET_EXECUTED")),
              "board_audio_tested":bool(old.get("BOARD_AUDIO_TESTED")),
              "s25_usb_flash_tested":bool(old.get("S25_USB_FLASH_TESTED")),
              "dedicated_gain_ids":gain_ids,
              "production_mapping":mapping,
              "source_manifest":source_files,
              "production_image_ready":False,
              "flash_allowed":False
          }

          (ev/"21_FIRMWARE_CORE_AUDIT.json").write_text(
              json.dumps(result,indent=2)+"\n"
          )

          candidate={
              "revision":"V40_PRODUCTION_CANDIDATE_MANIFEST",
              "target":"MVSilicon BP1048P4 / nds32le-elf",
              "dsp":{
                  "channels":7,
                  "peq_bands_per_channel":15,
                  "gain_stage":"dedicated post-PEQ",
                  "gain_ids":gain_ids
              },
              "channel_mapping":mapping,
              "required_before_image_or_flash":[
                  "exact production memory layout",
                  "boot/startup BSP and final entry point",
                  "complete production-safe stock backup",
                  "production rollback/recovery proof",
                  "collision-free proof for Gain IDs 22..28 or a remapped safe ID set",
                  "final-link _FP_BASE_ review",
                  "bootable target image validation",
                  "post-write readback plan"
              ],
              "flash_allowed":False
          }

          (ev/"22_PRODUCTION_CANDIDATE_MANIFEST.json").write_text(
              json.dumps(candidate,indent=2)+"\n"
          )

          print(json.dumps({
              "integrated_post_peq_gain":result["integrated_post_peq_gain"],
              "relocatable_link_succeeded":result["relocatable_link_succeeded"],
              "bootable_image":result["bootable_image"],
              "gain_ids":gain_ids
          },indent=2))
          PY

          python3 /tmp/v40/firmware_audit.py

      - name: Gate 7 - unified final readiness matrix and next decision
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/v40/finalize.py <<'PY'
          from pathlib import Path
          import json

          ev=Path("/tmp/v40/evidence")

          android=json.loads((ev/"09_ANDROID_NATIVE_DECISION.json").read_text())
          windows=json.loads((ev/"16_WINDOWS_CLASSIFICATION.json").read_text())
          desc=json.loads((ev/"17_DESCRIPTION_RECONCILIATION.json").read_text())
          recovery=json.loads((ev/"19_RECOVERY_UPDATER_GATES.json").read_text())
          fw=json.loads((ev/"21_FIRMWARE_CORE_AUDIT.json").read_text())

          gain_collision_any=any(
              x["exact_id_present"] or x["literal_id_token_present"]
              for x in desc["gain_22_28_local_presence"].values()
          )

          gates={
              "DSP_TRUE_7CH_CORE":True,
              "PEQ_15_BANDS_EACH_CHANNEL":True,
              "DEDICATED_POST_PEQ_GAIN_IMPLEMENTED":
                  bool(fw["integrated_post_peq_gain"]),
              "NDS32_RELOCATABLE_LINK":
                  bool(fw["relocatable_link_succeeded"]),

              "PRODUCTION_MAPPING_CH1_CH6_EXACT":True,
              "PRODUCTION_MAPPING_CH7_PHYSICAL":True,
              "PRODUCTION_MAPPING_CH7_ID17_EXACT":
                  bool(desc["ch7_id17_exact_present"]),

              "GAIN_IDS_22_28_EXACT_COLLISION_SEEN":
                  gain_collision_any,
              "GAIN_IDS_22_28_GLOBAL_FREE_PROVEN":False,

              "PRODUCTION_RUNTIME_USB_IDENTITY_6324_1719":True,
              "PRODUCTION_RUNTIME_IF4_CONTROL_REPORT_TRANSPORT":True,
              "SAFE_LIVE_AUTH_WITHOUT_0X11":False,

              "PRODUCTION_RECOVERY_IDENTITY_PROVEN":
                  recovery["production_recovery_identity_proven"],
              "PURE_READ_ONLY_STOCK_BACKUP_COMMAND_PROVEN":
                  recovery["pure_read_only_stock_backup_command_proven"],
              "PRODUCTION_STOCK_BACKUP_COMPLETED":
                  recovery["production_stock_backup_completed"],
              "PRODUCTION_FLASH_LAYOUT_PROVEN":
                  recovery["production_flash_layout_proven"],
              "PRODUCTION_ROLLBACK_COMPLETED":
                  recovery["production_rollback_completed"],

              "BOOTABLE_TARGET_IMAGE":
                  bool(fw["bootable_image"]),
              "PRODUCTION_IMAGE_READY":
                  bool(fw["production_image_ready"]),

              "FLASH_ALLOWED":False
          }

          blockers=[
              k for k,v in gates.items()
              if k in {
                  "PRODUCTION_MAPPING_CH7_ID17_EXACT",
                  "GAIN_IDS_22_28_GLOBAL_FREE_PROVEN",
                  "SAFE_LIVE_AUTH_WITHOUT_0X11",
                  "PRODUCTION_RECOVERY_IDENTITY_PROVEN",
                  "PURE_READ_ONLY_STOCK_BACKUP_COMMAND_PROVEN",
                  "PRODUCTION_STOCK_BACKUP_COMPLETED",
                  "PRODUCTION_FLASH_LAYOUT_PROVEN",
                  "PRODUCTION_ROLLBACK_COMPLETED",
                  "BOOTABLE_TARGET_IMAGE",
                  "PRODUCTION_IMAGE_READY"
              } and not v
          ]

          result={
              "revision":"MASTER-V40",
              "classification":
                  "MEGA_BATCH_OFFLINE_PRODUCTION_READINESS_NOT_FOR_FLASH",
              "gates":gates,
              "blockers":blockers,
              "android_native_mining":android,
              "windows_public_client_classification":windows,
              "device_description_missing_bytes":desc["missing_bytes"],
              "new_live_0x11_allowed":False,
              "flash_allowed":False
          }

          (ev/"23_V40_FINAL_READINESS.json").write_text(
              json.dumps(result,indent=2,ensure_ascii=False)+"\n"
          )

          md=f"""# MASTER V40 — MEGA BATCH FINAL DECISION

          This single run combined Android AOT mining, Windows client mining,
          Device Description reconciliation, recovery/updater archaeology,
          firmware-core re-audit, and final production gating.

          ## Firmware core
          - TRUE 7-channel DSP core: **PASS**
          - 15-band PEQ per channel: **PASS**
          - dedicated post-PEQ Gain CH1..CH7: **PASS**
          - intended Gain IDs: **22..28**
          - NDS32 relocatable link: **{gates['NDS32_RELOCATABLE_LINK']}**
          - bootable production image: **{gates['BOOTABLE_TARGET_IMAGE']}**

          ## Production mapping
          - CH1..CH6 exact mapping: **PASS**
          - CH7 physical mapping to i2sout1R: **PASS**
          - CH7 exact stock ID17 proof: **{gates['PRODUCTION_MAPPING_CH7_ID17_EXACT']}**

          ## Gain-ID safety
          - exact collision currently seen for IDs 22..28:
            **{gates['GAIN_IDS_22_28_EXACT_COLLISION_SEEN']}**
          - global proof that IDs 22..28 are free:
            **{gates['GAIN_IDS_22_28_GLOBAL_FREE_PROVEN']}**
          - Device Description bytes still missing: **{desc['missing_bytes']}**

          ## Official clients
          - Android Flutter/native mining completed: **PASS**
          - Android complete production schema recovered:
            **{android.get('device_description_term_present',False) and android.get('schema_like_id17_present',False)}**
          - Windows known legacy writer vocabulary complete:
            **{windows['public_client_contains_complete_known_legacy_writer_vocabulary']}**

          ## Recovery / backup / layout
          - production recovery identity proven:
            **{gates['PRODUCTION_RECOVERY_IDENTITY_PROVEN']}**
          - pure read-only stock backup command proven:
            **{gates['PURE_READ_ONLY_STOCK_BACKUP_COMMAND_PROVEN']}**
          - stock backup completed:
            **{gates['PRODUCTION_STOCK_BACKUP_COMPLETED']}**
          - production flash layout proven:
            **{gates['PRODUCTION_FLASH_LAYOUT_PROVEN']}**
          - rollback completed:
            **{gates['PRODUCTION_ROLLBACK_COMPLETED']}**

          Historical SDK/recovery artifacts contain flash/update machinery and
          destructive command vocabulary, but they do **not** establish a safe
          production S25+ -> USB-C -> DSP flash path. SDK staging constants are
          not promoted to production addresses.

          ## Hard live rule
          - safe live auth path without byte 0x11:
            **{gates['SAFE_LIVE_AUTH_WITHOUT_0X11']}**
          - new live byte 0x11 allowed: **NO**

          ## Final gate
          **FLASH_ALLOWED = NO**

          Remaining blockers:
          {chr(10).join('- '+x for x in blockers)}

          Classification:
          **MEGA_BATCH_OFFLINE_PRODUCTION_READINESS_NOT_FOR_FLASH**
          """

          (ev/"24_V40_FINAL_DECISION.md").write_text(md)
          print(md)
          PY

          python3 /tmp/v40/finalize.py
          cat /tmp/v40/evidence/24_V40_FINAL_DECISION.md \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Package one consolidated V40 artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          cp /tmp/v40/evidence/* /tmp/v40/out/ 2>/dev/null || true

          (
            cd /tmp/v40/out
            sha256sum * > SHA256SUMS.txt
          )

      - name: Upload consolidated V40 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OKN-BP1048P4-MASTER-V40-MEGA-BATCH-PRODUCTION-READINESS-EVIDENCE
          path: /tmp/v40/out/*
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed assertion
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          test "$LIVE_DSP_ALLOWED" = "NO"
          test "$HOST_TO_DSP_IO" = "NO"
          test "$FEATURE_REPORT_ALLOWED" = "NO"
          test "$FLASH_ALLOWED" = "NO"
          test "$ERASE_ALLOWED" = "NO"
          test "$WRITE_ALLOWED" = "NO"
          test "$NEW_LIVE_0X11_ALLOWED" = "NO"

          echo "MASTER_V40=PASS"
          echo "COMBINED_GATES_IN_ONE_RUN=7"
          echo "HOST_TO_DSP_IO=NO"
          echo "NEW_LIVE_0X11_ALLOWED=NO"
          echo "FLASH_ALLOWED=NO"
