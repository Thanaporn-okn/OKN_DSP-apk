name: R37.1 NDS32 link proof

on:
  workflow_dispatch:

jobs:
  r37-link-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack pinned R36 source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="OKN_BP1048P4_PHASE3_TRUE7CH_Source_R36.zip"
          test -f "$ZIP"
          echo "0edcc409352d7656ec0296b8416a55ea9f276299c396ed7fff6c8c5517cb3d82  $ZIP" | sha256sum -c -
          rm -rf /tmp/r36src
          mkdir -p /tmp/r36src
          unzip -q "$ZIP" -d /tmp/r36src
          ROOT="$(find /tmp/r36src -mindepth 1 -maxdepth 1 -type d -name 'OKN_BP1048P4_PHASE3_TRUE7CH_R36' | head -n1)"
          test -n "$ROOT"
          echo "R36_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Install host prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libc6-i386 lib32z1 git unzip

      - name: Fetch pinned public BP1048 SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/leadercxn/bp1048_sdk_v0.1.12.git /tmp/bp1048
          cd /tmp/bp1048
          git checkout 8105bd864b04995d81c9f9ae77cb158259f39015
          test "$(git rev-parse HEAD)" = "8105bd864b04995d81c9f9ae77cb158259f39015"

      - name: Fetch Andes NDS32 toolchain
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Ai-Thinker-Open/Andestech.git /tmp/andes
          echo "/tmp/andes/BSPv422/toolchains/nds32le-elf-mculib-v3s/bin" >> "$GITHUB_PATH"

      - name: Verify SDK fingerprints and select BP1048P4
        shell: bash
        run: |
          set -euo pipefail
          cd "$R36_ROOT"
          python3 experimental_r36/scripts/check_sdk_files.py /tmp/bp1048
          python3 experimental_r36/scripts/enable_bp1048p4.py /tmp/bp1048
          grep -a '^#define  CFG_CHIP_BP1048P4' /tmp/bp1048/BT_Audio_APP/bt_audio_app_src/inc/app_config.h
          if grep -a -q '^#define  CFG_CHIP_BP10128' /tmp/bp1048/BT_Audio_APP/bt_audio_app_src/inc/app_config.h; then
            echo 'BP10128 is still enabled' >&2
            exit 1
          fi

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          nds32le-elf-gcc --version
          nds32le-elf-ld --version

      - name: Add Linux compatibility aliases for Windows-origin SDK headers
        shell: bash
        run: |
          set -euo pipefail
          SDK=/tmp/bp1048
          python3 - <<'PYCASE'
          from pathlib import Path
          import re

          root = Path('/tmp/bp1048')
          # The vendor project was authored on Windows (case-insensitive FS).
          # GitHub Actions is Linux. Create only aliases explicitly requested by
          # source #include spellings when a case-insensitive header exists.
          header_dirs = [
              root / 'BT_Audio_APP',
              root / 'MVsB1_Base_SDK' / 'driver',
              root / 'MVsB1_Base_SDK' / 'middleware',
              root / 'develop_lib',
          ]
          headers = []
          for base in header_dirs:
              if base.exists():
                  headers.extend(p for p in base.rglob('*') if p.is_file() and p.suffix.lower() in {'.h', '.hpp'})
          by_lower = {}
          for p in headers:
              by_lower.setdefault(p.name.lower(), []).append(p)

          include_spellings = set()
          rx = re.compile(r'^\s*#\s*include\s*[<"]([^">]+)[">]', re.M)
          for base in header_dirs:
              if not base.exists():
                  continue
              for p in base.rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in {'.c', '.h', '.hpp', '.s'}:
                      continue
                  try:
                      text = p.read_bytes().decode('latin-1')
                  except OSError:
                      continue
                  for inc in rx.findall(text):
                      # Toolchain/system headers are intentionally ignored.
                      if '/' not in inc and '\\' not in inc:
                          include_spellings.add(inc)

          made = []
          for inc in sorted(include_spellings):
              matches = by_lower.get(inc.lower(), [])
              for target in matches:
                  alias = target.with_name(inc)
                  if alias.name == target.name or alias.exists():
                      continue
                  try:
                      alias.symlink_to(target.name)
                  except OSError:
                      alias.write_bytes(target.read_bytes())
                  made.append((str(alias.relative_to(root)), target.name))

          # This exact mismatch caused R37 #1 to fail. Require the repair.
          must = root / 'MVsB1_Base_SDK/middleware/rtos/freertos/inc/freertos.h'
          if not must.exists():
              raise SystemExit('failed to create freertos.h compatibility alias')
          print(f'Created {len(made)} case-compatibility aliases')
          for alias, target in made[:80]:
              print('ALIAS', alias, '->', target)
          PYCASE

      - name: Build R37 objects against real SDK headers
        shell: bash
        run: |
          set -euo pipefail
          SDK=/tmp/bp1048
          CC=nds32le-elf-gcc
          ROOT="$R36_ROOT"
          : > /tmp/r37_includes.rsp
          # Prefer the real BT_Audio_APP include order before broad fallback dirs.
          # This prevents same-named headers from examples/libopus being selected first.
          for d in \
            "$SDK/BT_Audio_APP/bt_audio_app_src/audio" \
            "$SDK/develop_lib/util" \
            "$SDK/develop_lib" \
            "$SDK/develop_lib/trace" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/ai/md5" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/ai/speex/include/speex" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/ai/speex/include" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/ai/speex/libspeex" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/ai/speex" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/ai" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/inc" \
            "$SDK/MVsB1_Base_SDK/driver/driver_api/inc/otg" \
            "$SDK/MVsB1_Base_SDK/middleware/rtc/inc" \
            "$SDK/MVsB1_Base_SDK/middleware/fatfs/inc" \
            "$SDK/MVsB1_Base_SDK/middleware/user/inc" \
            "$SDK/MVsB1_Base_SDK/middleware/bluetooth/inc" \
            "$SDK/MVsB1_Base_SDK/middleware/audio/inc" \
            "$SDK/MVsB1_Base_SDK/driver/driver/inc" \
            "$SDK/MVsB1_Base_SDK/driver/driver_api/inc" \
            "$SDK/MVsB1_Base_SDK/middleware/mv_utils/inc" \
            "$SDK/MVsB1_Base_SDK/middleware/lrc/inc" \
            "$SDK/MVsB1_Base_SDK/middleware/rtos/rtos_api" \
            "$SDK/MVsB1_Base_SDK/middleware/rtos/freertos/inc" \
            "$SDK/MVsB1_Base_SDK/middleware/flashfs/inc" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/display" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/user" \
            "$SDK/MVsB1_Base_SDK/middleware/cec/inc" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/ble"; do
            test -d "$d" && printf '%s\n' "-I$d" >> /tmp/r37_includes.rsp
          done
          # Fallback only within the production SDK areas, excluding examples.
          find "$SDK/BT_Audio_APP" \
               "$SDK/MVsB1_Base_SDK/driver" \
               "$SDK/MVsB1_Base_SDK/middleware" \
               "$SDK/develop_lib" \
               -type f -name '*.h' -printf '%h\n' | sort -u | while read -r d; do
            grep -Fxq -- "-I$d" /tmp/r37_includes.rsp || printf '%s\n' "-I$d" >> /tmp/r37_includes.rsp
          done
          printf '%s\n' "-I$ROOT/firmware/include" >> /tmp/r37_includes.rsp
          echo '--- R37 include path head ---'
          head -40 /tmp/r37_includes.rsp
          COMMON=(-Os -g3 -mcpu=d1088-spu -mcmodel=medium -mext-dsp -mext-zol -fsingle-precision-constant -ffunction-sections -fdata-sections)

          cd "$ROOT"
          "$CC" "${COMMON[@]}" @/tmp/r37_includes.rsp -c firmware/src/okn_gain7.c -o /tmp/okn_gain7.o
          "$CC" "${COMMON[@]}" @/tmp/r37_includes.rsp -c firmware/src/okn_ufe_gain7.c -o /tmp/okn_ufe_gain7.o
          "$CC" "${COMMON[@]}" @/tmp/r37_includes.rsp -DOKN_R36_VENDOR_SDK=1 -c firmware/src/okn_r36_sdk_bridge.c -o /tmp/okn_r36_sdk_bridge.o

          "$CC" "${COMMON[@]}" @/tmp/r37_includes.rsp -DFUNC_OS_EN=1 -DCFG_APP_CONFIG -DHAVE_CONFIG_H \
            -c "$SDK/BT_Audio_APP/bt_audio_app_src/services/audio_core_api.c" -o /tmp/audio_core_api.o
          "$CC" "${COMMON[@]}" @/tmp/r37_includes.rsp \
            -c "$SDK/MVsB1_Base_SDK/driver/driver_api/src/i2s_interface.c" -o /tmp/i2s_interface.o

      - name: Partial-link TRUE7CH bridge to real SDK objects
        shell: bash
        run: |
          set -euo pipefail
          nds32le-elf-ld -r \
            --wrap=AudioI2S0_DataSet \
            --wrap=AudioI2S1_DataSet \
            -o /tmp/R37_TRUE7CH_SDK_PARTIAL.o \
            /tmp/okn_gain7.o \
            /tmp/okn_ufe_gain7.o \
            /tmp/okn_r36_sdk_bridge.o \
            /tmp/audio_core_api.o \
            /tmp/i2s_interface.o

          nds32le-elf-nm -C /tmp/R37_TRUE7CH_SDK_PARTIAL.o > /tmp/R37_TRUE7CH_SDK_PARTIAL_SYMBOLS.txt
          nds32le-elf-nm -u /tmp/R37_TRUE7CH_SDK_PARTIAL.o > /tmp/R37_TRUE7CH_SDK_PARTIAL_UNRESOLVED.txt || true
          nds32le-elf-size /tmp/R37_TRUE7CH_SDK_PARTIAL.o > /tmp/R37_TRUE7CH_SDK_PARTIAL_SIZE.txt

          # These must now be provided by the real SDK objects in the partial link.
          if grep -Eq ' U AudioCoreSinkVolSet$| U __real_AudioI2S0_DataSet$| U __real_AudioI2S1_DataSet$' /tmp/R37_TRUE7CH_SDK_PARTIAL_UNRESOLVED.txt; then
            echo 'R37 bridge did not resolve expected real SDK symbols' >&2
            cat /tmp/R37_TRUE7CH_SDK_PARTIAL_UNRESOLVED.txt >&2
            exit 1
          fi

      - name: Build Andes executable link proof (NOT FOR FLASH)
        shell: bash
        run: |
          set -euo pipefail
          SDK=/tmp/bp1048
          ROOT="$R36_ROOT"
          CC=nds32le-elf-gcc

          cat > /tmp/r37_link_proof_main.c <<'EOF'
          #include <stdint.h>
          #include "okn_gain7.h"
          #include "okn_ufe_gain7.h"

          static okn_gain7_state_t s_gain;
          volatile uint32_t g_r37_link_proof_marker;

          int main(void)
          {
              uint8_t req[8] = { OKN_UFE_WRITE, OKN_UFE_ID_CH1_VOLUME, 0, 0, 0, 0, 0, 0 };
              okn_gain7_init(&s_gain);
              (void)okn_gain7_set_db(&s_gain, 0u, -6.0f);
              g_r37_link_proof_marker = 0x52333700u | (uint32_t)okn_gain7_get_q14(&s_gain, 0u);
              (void)req;
              for (;;) { __asm__ volatile ("nop"); }
          }
          EOF

          COMMON=(-Os -g3 -mcpu=d1088-spu -mcmodel=medium -mext-dsp -mext-zol -fsingle-precision-constant -ffunction-sections -fdata-sections)
          "$CC" "${COMMON[@]}" -I"$ROOT/firmware/include" -c /tmp/r37_link_proof_main.c -o /tmp/r37_link_proof_main.o

          EXDBG="$SDK/MVsB1_Base_SDK/examples/Example_GPIO/Debug"
          LDS="$SDK/MVsB1_Base_SDK/examples/Example_GPIO/nds32-ae210p.ld"
          DRV="$SDK/MVsB1_Base_SDK/driver/driver"

          test -f "$EXDBG/startup/crt0.o"
          test -f "$EXDBG/startup/init-default.o"
          test -f "$EXDBG/startup/interrupt.o"
          test -f "$EXDBG/startup/retarget.o"
          test -f "$EXDBG/driver/driver_api/src/uarts_interface.o"
          test -f "$DRV/libDriver.a"

          "$CC" -Os -nostartfiles -static -mcpu=d1088-spu -mcmodel=medium -mext-dsp -mvh \
            -T"$LDS" -Wl,--gc-sections -L"$DRV" \
            -o /tmp/R37_BP1048P4_LINK_PROOF_NOT_FOR_FLASH.adx \
            "$EXDBG/startup/crt0.o" \
            "$EXDBG/startup/init-default.o" \
            "$EXDBG/startup/interrupt.o" \
            "$EXDBG/startup/retarget.o" \
            "$EXDBG/driver/driver_api/src/uarts_interface.o" \
            /tmp/r37_link_proof_main.o \
            /tmp/okn_gain7.o \
            /tmp/okn_ufe_gain7.o \
            -lDriver -ldsp -lm

          nds32le-elf-objcopy -S -O binary \
            /tmp/R37_BP1048P4_LINK_PROOF_NOT_FOR_FLASH.adx \
            /tmp/R37_BP1048P4_LINK_PROOF_NOT_FOR_FLASH.bin
          nds32le-elf-size /tmp/R37_BP1048P4_LINK_PROOF_NOT_FOR_FLASH.adx > /tmp/R37_LINK_PROOF_SIZE.txt
          nds32le-elf-nm -n -C /tmp/R37_BP1048P4_LINK_PROOF_NOT_FOR_FLASH.adx > /tmp/R37_LINK_PROOF_SYMBOLS.txt
          nds32le-elf-readelf -h -S /tmp/R37_BP1048P4_LINK_PROOF_NOT_FOR_FLASH.adx > /tmp/R37_LINK_PROOF_READELF.txt

          grep -q ' main$' /tmp/R37_LINK_PROOF_SYMBOLS.txt
          grep -q ' okn_gain7_init$' /tmp/R37_LINK_PROOF_SYMBOLS.txt
          test -s /tmp/R37_BP1048P4_LINK_PROOF_NOT_FOR_FLASH.bin

          cat > /tmp/README_R37_NOT_FOR_FLASH.txt <<'EOF'
          R37 LINK PROOF ONLY - DO NOT FLASH.
          This image proves Andes NDS32 compile/link/objcopy using the public SDK startup/linker and OKN gain engine.
          It is NOT a GoloPine production firmware and does not contain the final board-specific 7-channel audio routing.
          EOF

          sha256sum \
            /tmp/R37_BP1048P4_LINK_PROOF_NOT_FOR_FLASH.adx \
            /tmp/R37_BP1048P4_LINK_PROOF_NOT_FOR_FLASH.bin \
            /tmp/R37_TRUE7CH_SDK_PARTIAL.o \
            > /tmp/R37_SHA256SUMS.txt

      - name: Upload R37 link evidence
        uses: actions/upload-artifact@v4
        with:
          name: R37_1_NDS32_LINK_PROOF
          path: |
            /tmp/R37_BP1048P4_LINK_PROOF_NOT_FOR_FLASH.adx
            /tmp/R37_BP1048P4_LINK_PROOF_NOT_FOR_FLASH.bin
            /tmp/R37_LINK_PROOF_SIZE.txt
            /tmp/R37_LINK_PROOF_SYMBOLS.txt
            /tmp/R37_LINK_PROOF_READELF.txt
            /tmp/R37_TRUE7CH_SDK_PARTIAL.o
            /tmp/R37_TRUE7CH_SDK_PARTIAL_SYMBOLS.txt
            /tmp/R37_TRUE7CH_SDK_PARTIAL_UNRESOLVED.txt
            /tmp/R37_TRUE7CH_SDK_PARTIAL_SIZE.txt
            /tmp/R37_SHA256SUMS.txt
            /tmp/README_R37_NOT_FOR_FLASH.txt
