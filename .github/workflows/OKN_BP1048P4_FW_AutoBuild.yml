name: OKN BP1048P4 Firmware Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_BP1048P4_FW_V*_Sources.zip'
      - 'OKN_BP1048P4_FW_V*_SHA256.txt'
      - '.github/workflows/OKN_BP1048P4_FW_AutoBuild.yml'

permissions:
  contents: read

jobs:
  host-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest firmware source
        id: select
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(OKN_BP1048P4_FW_V*_Sources.zip)
          test ${#files[@]} -gt 0

          SRC_ZIP=$(printf '%s\n' "${files[@]}" | sort -V | tail -n1)
          VERSION=$(printf '%s' "$SRC_ZIP" | sed -E 's/^OKN_BP1048P4_FW_V([0-9]+)_Sources\.zip$/\1/')
          test "$VERSION" != "$SRC_ZIP"

          echo "SRC_ZIP=$SRC_ZIP" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SRC_DIR=OKN_BP1048P4_FW_V$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact_name=OKN-BP1048P4-FW-V${VERSION}-validation" >> "$GITHUB_OUTPUT"

          printf 'Selected firmware: V%s\nSelected source: %s\n' "$VERSION" "$SRC_ZIP"

      - name: Verify source SHA256
        shell: bash
        run: |
          set -euo pipefail
          SHA_FILE="OKN_BP1048P4_FW_V${VERSION}_SHA256.txt"
          if test -f "$SHA_FILE"; then
            sha256sum -c "$SHA_FILE"
          else
            echo "WARNING: $SHA_FILE not found; recording SHA only"
            sha256sum "$SRC_ZIP"
          fi

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _fw
          mkdir -p _fw
          unzip -q "$SRC_ZIP" -d _fw
          test -f "_fw/$SRC_DIR/Makefile"

      - name: Verify selected version matches manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          v = int(os.environ['VERSION'])
          p = pathlib.Path('_fw') / os.environ['SRC_DIR'] / 'firmware_manifest.json'
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data.get('project') == 'OKN_BP1048P4_FW', data
          assert int(data.get('version', -1)) == v, (v, data.get('version'))
          print(f'PASS: selected V{v} matches firmware_manifest.json')
          PY

      - name: Run fail-closed validation
        shell: bash
        run: |
          set -euo pipefail
          cd "_fw/$SRC_DIR"
          make clean
          make verify | tee ../../verify.log
          make test | tee ../../tests.log
          make demo | tee ../../host-demo.log

      - name: Build validation artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          SRC="_fw/$SRC_DIR"
          OUT=_validation
          rm -rf "$OUT"
          mkdir -p "$OUT"

          printf 'V%s\n' "$VERSION" > "$OUT/SELECTED_VERSION.txt"
          printf '%s\n' "$SRC_ZIP" > "$OUT/SELECTED_SOURCE.txt"

          for f in BUILD_STATUS.txt firmware_manifest.json target_port_manifest.json evidence_manifest.json; do
            test -f "$SRC/$f" && cp "$SRC/$f" "$OUT/$f" || true
          done
          test -f host-demo.log && cp host-demo.log "$OUT/host-demo.log" || true
          test -f verify.log && cp verify.log "$OUT/verify.log" || true
          test -f tests.log && cp tests.log "$OUT/tests.log" || true
          sha256sum "$SRC_ZIP" > "$OUT/source-zip.sha256"

          {
            echo "OKN_BP1048P4_FW_V${VERSION} CI VALIDATION"
            echo '================================'
            echo "Commit: ${GITHUB_SHA}"
            echo "Selected source: ${SRC_ZIP}"
            echo 'Hardware flashing performed: NO'
            echo 'Vendor programmer invoked: NO'
            echo 'Unknown hardware writes: NONE'
            echo 'Validation scope: host-only / fail-closed gates'
          } > "$OUT/CI_VALIDATION.txt"

          echo '--- Artifact identity ---'
          cat "$OUT/SELECTED_VERSION.txt"
          cat "$OUT/source-zip.sha256"

      - name: Upload versioned validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.select.outputs.artifact_name }}
          path: _validation/
          if-no-files-found: error
          retention-days: 14
