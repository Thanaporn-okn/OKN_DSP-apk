name: Build OKN DSP V16 Packet Capture Lab

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Find V16 ZIP
        shell: bash
        run: |
          set -e
          ZIP="./OKN_DSP_V16_PACKET_CAPTURE_LAB.zip"
          test -f "$ZIP"
          echo "Using $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract V16
        run: |
          rm -rf payload
          mkdir payload
          unzip -q "$ZIP" -d payload
          test -f payload/pubspec.yaml
          test -f payload/lib/main.dart
          test -f payload/android_patch/MainActivity.kt

      - name: Verify V16 source
        run: |
          set -e
          grep -q "class OknDspApp" payload/lib/main.dart
          grep -q "startCaptureTest" payload/lib/main.dart
          grep -q "AB01" payload/lib/main.dart
          grep -q "AB02" payload/lib/main.dart
          grep -q "AB03" payload/lib/main.dart
          grep -q "ScanCallback" payload/android_patch/MainActivity.kt
          grep -q "ScanResult" payload/android_patch/MainActivity.kt
          grep -q "startCaptureTest" payload/android_patch/MainActivity.kt
          if grep -R "class MyApp" payload/lib payload/test 2>/dev/null; then
            echo "ERROR: stale MyApp detected"
            exit 1
          fi
          echo "V16 source verification passed."

      - name: Create clean Flutter Android project
        run: |
          flutter create --platforms=android --org com.okn --project-name okn_dsp temp_app

      - name: Install V16 files
        run: |
          cp payload/pubspec.yaml temp_app/pubspec.yaml
          rm -rf temp_app/lib temp_app/test
          cp -r payload/lib temp_app/lib
          mkdir -p temp_app/android/app/src/main/kotlin/com/okn/okn_dsp
          cp payload/android_patch/MainActivity.kt             temp_app/android/app/src/main/kotlin/com/okn/okn_dsp/MainActivity.kt

      - name: Install Bluetooth permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("temp_app/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          perms = '''    <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />
          '''
          if "android.permission.BLUETOOTH_SCAN" not in s:
              pos = s.find(">", s.find("<manifest"))
              s = s[:pos+1] + "\n" + perms + s[pos+1:]
          p.write_text(s)
          PY

      - name: Get packages
        working-directory: temp_app
        run: flutter pub get

      - name: Verify no stale test
        run: |
          set -e
          test ! -d temp_app/test
          if grep -R "MyApp" temp_app/lib temp_app/test 2>/dev/null; then
            echo "ERROR: stale MyApp reference found"
            exit 1
          fi

      - name: Analyze
        working-directory: temp_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        working-directory: temp_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN_DSP_V16_PACKET_CAPTURE_LAB_APK
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
