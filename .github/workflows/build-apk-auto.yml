name: Build Android APK

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      source_zip:
        description: 'Optional source ZIP path. Blank = auto-select highest source vN ZIP.'
        required: false
        type: string
      android_api:
        description: 'Optional Android API override. Blank = detect compileSdk.'
        required: false
        type: string
      gradle_version:
        description: 'Optional Gradle override. Blank = detect gradle-wrapper.properties.'
        required: false
        type: string
      java_version:
        description: 'Optional Java override. Blank = repo variable or Java 17.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # These repository Variables are optional. Leave them unset for automatic mode.
  REPO_ANDROID_API_OVERRIDE: ${{ vars.ANDROID_API_OVERRIDE }}
  REPO_GRADLE_VERSION_OVERRIDE: ${{ vars.GRADLE_VERSION_OVERRIDE }}
  REPO_JAVA_VERSION_OVERRIDE: ${{ vars.JAVA_VERSION_OVERRIDE }}
  INPUT_SOURCE_ZIP: ${{ inputs.source_zip }}
  INPUT_ANDROID_API: ${{ inputs.android_api }}
  INPUT_GRADLE_VERSION: ${{ inputs.gradle_version }}
  INPUT_JAVA_VERSION: ${{ inputs.java_version }}

jobs:
  build-apk:
    name: Build build.apk
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve latest Android source and tool versions
        id: project
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          import shutil
          import subprocess
          from pathlib import Path

          ws = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          tmp = Path(os.environ['RUNNER_TEMP']) / 'fbmarket-auto-source'
          out = Path(os.environ['GITHUB_OUTPUT'])

          def env(name):
              return os.environ.get(name, '').strip()

          def write_output(key, value):
              with out.open('a', encoding='utf-8') as f:
                  f.write(f'{key}={value}\n')

          def version_number(path: Path):
              # FBMarketMVP_source_v12.zip -> (12, mtime)
              m = re.search(r'(?:^|[_-])v(\d+)(?:\D|$)', path.stem, re.I)
              return (int(m.group(1)) if m else -1, path.stat().st_mtime)

          requested = env('INPUT_SOURCE_ZIP')
          project_dir = None
          source_zip = None

          if requested:
              candidate = (ws / requested).resolve()
              if ws not in candidate.parents and candidate != ws:
                  raise SystemExit(f'Invalid source_zip outside repository: {requested}')
              if not candidate.is_file():
                  raise SystemExit(f'source_zip does not exist: {requested}')
              source_zip = candidate
          else:
              # Prefer versioned source ZIPs. Pick the highest numeric vN, not lexical order.
              candidates = []
              source_dir = ws / 'source'
              if source_dir.exists():
                  candidates.extend(source_dir.rglob('*.zip'))
              candidates.extend(ws.glob('FBMarketMVP_source_v*.zip'))
              candidates = sorted({p.resolve() for p in candidates if p.is_file()}, key=version_number)
              if candidates:
                  source_zip = candidates[-1]

          if source_zip:
              if tmp.exists():
                  shutil.rmtree(tmp)
              tmp.mkdir(parents=True)
              print(f'Auto-selected source ZIP: {source_zip}')
              subprocess.run(['unzip', '-q', '-o', str(source_zip), '-d', str(tmp)], check=True)
              settings = list(tmp.rglob('settings.gradle.kts')) + list(tmp.rglob('settings.gradle'))
              if not settings:
                  raise SystemExit('ZIP extracted, but settings.gradle(.kts) was not found.')
              # Prefer shallowest settings file in case the ZIP contains docs/examples.
              settings.sort(key=lambda p: (len(p.parts), str(p)))
              project_dir = settings[0].parent.resolve()
          elif (ws / 'settings.gradle.kts').exists() or (ws / 'settings.gradle').exists():
              project_dir = ws
              print('No source ZIP found. Using expanded Android project at repository root.')
          else:
              raise SystemExit('No Android source found. Upload source/FBMarketMVP_source_vN.zip or expand the project at repo root.')

          app_kts = project_dir / 'app' / 'build.gradle.kts'
          app_groovy = project_dir / 'app' / 'build.gradle'
          build_file = app_kts if app_kts.exists() else app_groovy
          if not build_file.exists():
              raise SystemExit(f'Android app build file not found under {project_dir}/app')
          build_text = build_file.read_text(encoding='utf-8', errors='replace')

          # Android API: manual dispatch > repository variable > detected compileSdk > 36.
          api = env('INPUT_ANDROID_API') or env('REPO_ANDROID_API_OVERRIDE')
          if not api:
              patterns = [
                  r'compileSdk\s*=\s*(\d+)',
                  r'compileSdkVersion\s*\(?\s*(\d+)\s*\)?',
                  r'compileSdk\s+(\d+)',
              ]
              for pat in patterns:
                  m = re.search(pat, build_text)
                  if m:
                      api = m.group(1)
                      break
          api = api or '36'
          if not api.isdigit():
              raise SystemExit(f'Could not determine numeric Android compileSdk. Got: {api!r}')

          # Build Tools: use explicit project value when present; otherwise API.0.0.
          bt = None
          for pat in [r'buildToolsVersion\s*=\s*[\"\']([^\"\']+)', r'buildToolsVersion\s+[\"\']([^\"\']+)']:
              m = re.search(pat, build_text)
              if m:
                  bt = m.group(1)
                  break
          bt = bt or f'{api}.0.0'

          # Gradle: manual dispatch > repository variable > wrapper distribution > 9.6.0.
          gradle = env('INPUT_GRADLE_VERSION') or env('REPO_GRADLE_VERSION_OVERRIDE')
          wrapper = project_dir / 'gradle' / 'wrapper' / 'gradle-wrapper.properties'
          if not gradle and wrapper.exists():
              txt = wrapper.read_text(encoding='utf-8', errors='replace')
              m = re.search(r'gradle-([0-9][0-9A-Za-z.\-+]*)-(?:all|bin)\.zip', txt)
              if m:
                  gradle = m.group(1)
          gradle = gradle or '9.6.0'

          java = env('INPUT_JAVA_VERSION') or env('REPO_JAVA_VERSION_OVERRIDE') or '17'

          print(f'Project directory : {project_dir}')
          print(f'Android API       : {api}')
          print(f'Build Tools       : {bt}')
          print(f'Gradle            : {gradle}')
          print(f'Java              : {java}')

          write_output('project_dir', project_dir)
          write_output('android_api', api)
          write_output('build_tools', bt)
          write_output('gradle_version', gradle)
          write_output('java_version', java)
          write_output('source_zip', source_zip or 'expanded-root')
          PY

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.project.outputs.java_version }}

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install detected Android SDK
        id: sdk
        shell: bash
        env:
          API: ${{ steps.project.outputs.android_api }}
          BUILD_TOOLS: ${{ steps.project.outputs.build_tools }}
        run: |
          set -euo pipefail

          echo "Installing platforms;android-${API}"
          if ! sdkmanager --install "platform-tools" "platforms;android-${API}"; then
            echo "::error::Android platform API ${API} is not available from this runner's SDK repository."
            echo "Available platform packages near the requested API:"
            sdkmanager --list 2>/dev/null | grep -E 'platforms;android-[0-9]+' | tail -n 20 || true
            echo "You can set repository variable ANDROID_API_OVERRIDE without editing this workflow, but only if the app source is compatible."
            exit 1
          fi

          # Build tools are usually selected by AGP. Install the detected/default version when available,
          # but do not fail the whole build if that exact package is not published.
          if ! sdkmanager --install "build-tools;${BUILD_TOOLS}"; then
            echo "::warning::build-tools;${BUILD_TOOLS} was not available. AGP will use an installed compatible Build Tools version if possible."
          fi

          test -d "$ANDROID_HOME/platforms/android-${API}"

      - name: Set up detected Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.project.outputs.gradle_version }}
          cache-provider: basic

      - name: Apply compatibility fixes for known old source versions
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          API: ${{ steps.project.outputs.android_api }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path('.')
          api = int(os.environ.get('API', '36'))

          def rw(path, fn):
              if not path.exists():
                  return
              old = path.read_text(encoding='utf-8')
              new = fn(old)
              if new != old:
                  path.write_text(new, encoding='utf-8')
                  print(f'Compatibility patch: {path}')

          root_kts = root / 'build.gradle.kts'
          app_kts = root / 'app/build.gradle.kts'
          root_g = root / 'build.gradle'
          app_g = root / 'app/build.gradle'

          root_text = ''
          if root_kts.exists():
              root_text = root_kts.read_text(encoding='utf-8')
          elif root_g.exists():
              root_text = root_g.read_text(encoding='utf-8')

          # Detect AGP major. AGP 9+ includes built-in Kotlin, so old kotlin-android application is removed.
          agp = re.search(r'com\.android\.(?:application|library)[\"\']?\)?\s*version\s*[\"\'](\d+)', root_text)
          agp_major = int(agp.group(1)) if agp else 0

          if agp_major >= 9:
              rw(root_kts, lambda s: re.sub(r'^\s*id\("org\.jetbrains\.kotlin\.android"\).*\n', '', s, flags=re.M))
              rw(app_kts, lambda s: re.sub(r'^\s*id\("org\.jetbrains\.kotlin\.android"\)\s*\n', '', s, flags=re.M))
              rw(root_g, lambda s: re.sub(r'^\s*id\s+[\"\']org\.jetbrains\.kotlin\.android[\"\'].*\n', '', s, flags=re.M))
              rw(app_g, lambda s: re.sub(r'^\s*id\s+[\"\']org\.jetbrains\.kotlin\.android[\"\']\s*\n', '', s, flags=re.M))

              def remove_old_kotlin_block(s):
                  return re.sub(r'\n?kotlin\s*\{\s*jvmToolchain\([^)]*\)\s*\}\s*', '\n', s, flags=re.S)
              rw(app_kts, remove_old_kotlin_block)

              props = root / 'gradle.properties'
              if props.exists():
                  txt = props.read_text(encoding='utf-8')
                  txt = re.sub(r'^android\.builtInKotlin=false\s*$', 'android.builtInKotlin=true', txt, flags=re.M)
                  props.write_text(txt, encoding='utf-8')

          # Known old FBMarket source issue: this explicit import resolves to an internal symbol.
          java_root = root / 'app/src/main/java'
          if java_root.exists():
              for p in java_root.rglob('*.kt'):
                  txt = p.read_text(encoding='utf-8')
                  fixed = txt.replace('import androidx.compose.foundation.layout.weight\n', '')
                  if fixed != txt:
                      p.write_text(fixed, encoding='utf-8')
                      print(f'Compatibility patch: invalid weight import in {p}')

          # Known old source dependency that requires API 37. It was unused by FBMarket v1-v4.
          if api <= 36:
              def remove_known_lifecycle(s):
                  s = re.sub(r'^\s*implementation\([\"\']androidx\.lifecycle:lifecycle-runtime-compose:2\.11\.0[\"\']\)\s*\n', '', s, flags=re.M)
                  s = re.sub(r'^\s*implementation\s+[\"\']androidx\.lifecycle:lifecycle-runtime-compose:2\.11\.0[\"\']\s*\n', '', s, flags=re.M)
                  return s
              rw(app_kts, remove_known_lifecycle)
              rw(app_g, remove_known_lifecycle)
          PY

      - name: Show resolved environment
        shell: bash
        run: |
          set -euo pipefail
          echo "Source      : ${{ steps.project.outputs.source_zip }}"
          echo "Project     : ${{ steps.project.outputs.project_dir }}"
          echo "Android API : ${{ steps.project.outputs.android_api }}"
          echo "Build Tools : ${{ steps.project.outputs.build_tools }}"
          echo "Gradle      : ${{ steps.project.outputs.gradle_version }}"
          echo "Java        : ${{ steps.project.outputs.java_version }}"
          java -version
          gradle --version
          sdkmanager --version

      - name: Build APK - attempt 1
        id: build1
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set +e
          set -o pipefail
          gradle --no-daemon --no-configuration-cache --stacktrace :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build-attempt-1.log"
          STATUS=${PIPESTATUS[0]}
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build APK - clean retry
        id: build2
        if: steps.build1.outputs.status != '0'
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set +e
          set -o pipefail
          gradle --stop >/dev/null 2>&1 || true
          rm -rf .gradle app/build build
          gradle --no-daemon --no-configuration-cache --refresh-dependencies --stacktrace clean :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build-attempt-2.log"
          STATUS=${PIPESTATUS[0]}
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Create diagnostic log
        if: always()
        shell: bash
        run: |
          {
            echo '===== FB Market automatic Android build ====='
            echo "Run: $GITHUB_RUN_NUMBER"
            echo "Commit: $GITHUB_SHA"
            echo "Source: ${{ steps.project.outputs.source_zip }}"
            echo "Android API: ${{ steps.project.outputs.android_api }}"
            echo "Build Tools: ${{ steps.project.outputs.build_tools }}"
            echo "Gradle: ${{ steps.project.outputs.gradle_version }}"
            echo "Java: ${{ steps.project.outputs.java_version }}"
            echo
            [[ -f build-attempt-1.log ]] && cat build-attempt-1.log
            if [[ -f build-attempt-2.log ]]; then
              echo
              echo '===== CLEAN RETRY ====='
              cat build-attempt-2.log
            fi
          } > build-error.log

      - name: Verify build result
        shell: bash
        run: |
          set -euo pipefail
          FIRST='${{ steps.build1.outputs.status }}'
          SECOND='${{ steps.build2.outputs.status }}'

          if [[ "$FIRST" != '0' && "$SECOND" != '0' ]]; then
            echo '::error::Both Android build attempts failed. See build-error.log artifact.'
            echo '===== ROOT CAUSE HINTS ====='
            grep -nE '(^e: |AAR metadata|requires libraries and applications|currently compiled against|Unresolved reference|Cannot access|Type mismatch|No value passed|Compilation error|What went wrong|Caused by:)' build-error.log | tail -n 160 || true
            exit 1
          fi

      - name: Prepare build.apk
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR='${{ steps.project.outputs.project_dir }}'
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*debug*.apk' | head -n 1 || true)"
          if [[ -z "$APK" || ! -f "$APK" ]]; then
            echo '::error::Gradle reported success but no debug APK was found.'
            exit 4
          fi

          cp "$APK" "$GITHUB_WORKSPACE/build.apk"
          sha256sum "$GITHUB_WORKSPACE/build.apk" > "$GITHUB_WORKSPACE/build.apk.sha256"
          ls -lh "$GITHUB_WORKSPACE/build.apk" "$GITHUB_WORKSPACE/build.apk.sha256"

      - name: Upload build.apk directly
        uses: actions/upload-artifact@v7
        with:
          name: build.apk
          path: build.apk
          archive: false
          retention-days: 30
          if-no-files-found: error

      - name: Upload checksum directly
        uses: actions/upload-artifact@v7
        with:
          name: build.apk.sha256
          path: build.apk.sha256
          archive: false
          retention-days: 30
          if-no-files-found: error

      - name: Upload diagnostic log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-error.log
          path: build-error.log
          archive: false
          retention-days: 30
          if-no-files-found: warn
