name: R129 exact PCTools AA55 HID callgraph static reverse

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R129_EXACT_PCTOOLS_AA55_HID_CALLGRAPH_STATIC_REVERSE.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r129-pctools-aa55-hid-static-${{ github.ref }}
  cancel-in-progress: true

env:
  FLASH_ALLOWED: "NO"
  R127_RUN_ID: "35865759674"
  R127_ACQUIRED_ARTIFACT_ID: "10751533100"
  R127_ACQUIRED_ARTIFACT_NAME: "R127-ACQUIRED-PUBLIC-FILES"
  R127_ACQUIRED_ARTIFACT_DIGEST: "sha256:43f60bf724744c488d3c3b0da147666b4091b7d74d3be6ebec6712e4b1b6983a"
  R127_INNER_ZIP_SHA256: "d217dff170352179ee3d6a70b8e3a58b98b41ef2d365a4551daff4124ce21be6"
  BT_NAME_RAR_SHA256: "c6b1fcb4d0e430c86c50e9ddf1007fa110f416c0570888060d693819164eccb8"
  PCTOOLS_SHA256: "0e13801b29070f805869823e6db4ad56d70494b2621fb63c330cea1d69e9ca33"
  UPGRADE_FLASH_SHA256: "bebb887b04fc724e1c459cce15d4395c78df3e098c54f06369ffe78b50aec073"
  FLASHBOOT_UPDATEFILE_SHA256: "34acb64329dd0e952f490dc56624b6d8b7e0cc516a2f23ca5df6c48cf9e6a3d6"
  R128_RUN_ID: "35868841078"
  R128_JOB_ID: "107207277867"
  R128_EVIDENCE_ARTIFACT_ID: "10753442571"
  R128_EVIDENCE_DIGEST: "sha256:297bb39a20d8900b13da0af729bbcfc3815f5fe78bc7aab2728a0886bc7477cb"

jobs:
  static_reverse:
    name: STATIC ONLY - no vendor execution - no USB - no board
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r129/input /tmp/r129/acquired /tmp/r129/unpacked/bt /tmp/r129/evidence
          cat > /tmp/r129/evidence/R129_SAFETY.txt <<'EOF'
          R129_MODE=EXACT_PCTOOLS_AA55_HID_CALLGRAPH_STATIC_ONLY
          R129_VENDOR_BINARY_EXECUTED=NO
          R129_INSTALLER_EXECUTED=NO
          R129_USB_DEVICE_ACCESS=NO
          R129_BOARD_CONTACT=NO
          R129_AA55_SENT=NO
          R129_RUNTIME_0X11_SENT=NO
          R129_RUNTIME_0XFE_SENT=NO
          R129_FLASHBOOT_COMMAND_SENT=NO
          R129_FLASH_READ_EXECUTED=NO
          R129_FLASH_ERASE_EXECUTED=NO
          R129_FLASH_WRITE_EXECUTED=NO
          R129_ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD=NO
          REFERENCE_OR_TOOL_EVIDENCE_IS_NOT_PRODUCTION_PROOF=YES
          FINAL_REQUIRED_TRANSPORT=SAMSUNG_S25_PLUS_USB_C_DIRECT_TO_DSP_USB_C
          HARDWARE_MODIFICATION=FORBIDDEN
          FLASH_ALLOWED=NO
          EOF

      - name: Download pinned R127 acquired files as inert data
        uses: actions/download-artifact@v4
        with:
          name: R127-ACQUIRED-PUBLIC-FILES
          path: /tmp/r129/input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 35865759674

      - name: Install static tooling only
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            file unzip p7zip-full binutils jq python3-pip >/dev/null
          python3 -m pip install --disable-pip-version-check --no-input \
            pefile capstone >/dev/null

      - name: Verify pinned hashes and extract inert files
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r129/input
          test -f R127_ACQUIRED_PUBLIC_FILES.zip
          echo "${R127_INNER_ZIP_SHA256}  R127_ACQUIRED_PUBLIC_FILES.zip" | sha256sum -c -
          unzip -q R127_ACQUIRED_PUBLIC_FILES.zip -d /tmp/r129/acquired

          BT_RAR="$(find /tmp/r129/acquired -type f -name '*.rar' -path '*BT_NAME_TOOL*' -print -quit)"
          test -n "$BT_RAR"
          echo "${BT_NAME_RAR_SHA256}  ${BT_RAR}" | sha256sum -c -
          7z x -y -o/tmp/r129/unpacked/bt "$BT_RAR" >/tmp/r129/evidence/R129_7Z_BT_EXTRACT.txt

          PCTOOLS="$(find /tmp/r129/unpacked/bt -type f -name 'MV_AP82xx_BP10xx_PC_Tools_V2.2.8_20210205.exe' -print -quit)"
          UPGRADE="$(find /tmp/r129/unpacked/bt -type f -name 'upgrade_flash.exe' -print -quit)"
          FLASHBT="$(find /tmp/r129/unpacked/bt -type f -name 'Flashboot_UpDateFile.bt' -print -quit)"
          test -n "$PCTOOLS" -a -n "$UPGRADE" -a -n "$FLASHBT"
          echo "${PCTOOLS_SHA256}  ${PCTOOLS}" | sha256sum -c -
          echo "${UPGRADE_FLASH_SHA256}  ${UPGRADE}" | sha256sum -c -
          echo "${FLASHBOOT_UPDATEFILE_SHA256}  ${FLASHBT}" | sha256sum -c -
          printf '%s\n' "$PCTOOLS" > /tmp/r129/PCTOOLS_PATH
          printf '%s\n' "$UPGRADE" > /tmp/r129/UPGRADE_PATH
          printf '%s\n' "$FLASHBT" > /tmp/r129/FLASHBT_PATH

      - name: Recover exact AA55 Feature report patterns and branch context
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re,pefile
          from capstone import Cs,CS_ARCH_X86,CS_MODE_32
          from capstone.x86 import X86_OP_IMM,X86_OP_MEM,X86_REG_EBP

          p=Path(Path('/tmp/r129/PCTOOLS_PATH').read_text().strip())
          pe=pefile.PE(str(p),fast_load=False)
          imagebase=pe.OPTIONAL_HEADER.ImageBase
          iat={}
          for e in getattr(pe,'DIRECTORY_ENTRY_IMPORT',[]):
              for imp in e.imports:
                  if imp.name:
                      n=imp.name.decode('latin1','replace')
                      if n in {'HidD_SetFeature','HidD_GetFeature'}:
                          iat[imp.address]=n

          md=Cs(CS_ARCH_X86,CS_MODE_32); md.detail=True
          ins=[]
          for s in pe.sections:
              if s.Characteristics & 0x20000000:
                  ins.extend(md.disasm(s.get_data(),imagebase+s.VirtualAddress))
          ins=sorted(ins,key=lambda x:x.address)
          addr_index={x.address:i for i,x in enumerate(ins)}

          calls=[]
          for idx,ci in enumerate(ins):
              names=[]
              for op in ci.operands:
                  vals=[]
                  if op.type==X86_OP_IMM: vals=[op.imm]
                  elif op.type==X86_OP_MEM and op.mem.disp: vals=[op.mem.disp & 0xffffffff]
                  for v in vals:
                      if v in iat: names.append(iat[v])
              if not names: continue
              lo=max(0,idx-100); hi=min(len(ins),idx+140)
              ctx=[{'va':hex(x.address),'mnemonic':x.mnemonic,'op_str':x.op_str} for x in ins[lo:hi]]
              calls.append({'idx':idx,'call_va':ci.address,'imports':sorted(set(names)),'context':ctx})

          pairs=[]
          set_calls=[c for c in calls if 'HidD_SetFeature' in c['imports']]
          get_calls=[c for c in calls if 'HidD_GetFeature' in c['imports']]
          for sc in set_calls:
              candidates=[g for g in get_calls if 0 < g['idx']-sc['idx'] <= 80]
              if not candidates: continue
              gc=min(candidates,key=lambda g:g['idx'])
              region=ins[max(0,sc['idx']-80):min(len(ins),gc['idx']+100)]
              set_len9=False; get_len9=False
              aa_stores=[]; cmp55=[]; buffers=[]
              for x in region:
                  txt=f'{x.mnemonic} {x.op_str}'
                  if x.address < sc['call_va'] and re.search(r'mov dword ptr \[esp \+ 8\], 9$',txt): set_len9=True
                  if sc['call_va'] < x.address < gc['call_va'] and re.search(r'mov dword ptr \[esp \+ 8\], 9$',txt): get_len9=True
                  if x.mnemonic=='mov' and len(x.operands)==2 and x.operands[1].type==X86_OP_IMM and x.operands[1].imm==0xaa:
                      if x.operands[0].type==X86_OP_MEM and x.operands[0].mem.base==X86_REG_EBP:
                          aa_stores.append({'va':hex(x.address),'disp':x.operands[0].mem.disp,'text':txt})
                  if x.mnemonic=='cmp' and len(x.operands)==2 and x.operands[1].type==X86_OP_IMM and x.operands[1].imm==0x55:
                      if x.operands[0].type==X86_OP_MEM and x.operands[0].mem.base==X86_REG_EBP:
                          cmp55.append({'va':hex(x.address),'disp':x.operands[0].mem.disp,'text':txt})
                  if x.mnemonic=='lea' and len(x.operands)==2 and x.operands[1].type==X86_OP_MEM and x.operands[1].mem.base==X86_REG_EBP:
                      buffers.append({'va':hex(x.address),'disp':x.operands[1].mem.disp,'text':txt})
              same_disp=[]
              for a in aa_stores:
                  for c in cmp55:
                      if a['disp']==c['disp']:
                          same_disp.append(a['disp'])
              pairs.append({
                  'setfeature_va':hex(sc['call_va']),
                  'getfeature_va':hex(gc['call_va']),
                  'instruction_distance':gc['idx']-sc['idx'],
                  'set_len9_seen':set_len9,
                  'get_len9_seen':get_len9,
                  'aa_stores':aa_stores,
                  'cmp55':cmp55,
                  'same_stack_byte_AA_then_55':sorted(set(same_disp)),
                  'stack_buffer_lea_candidates':buffers[-12:],
                  'context':[{'va':hex(x.address),'text':f'{x.mnemonic} {x.op_str}'} for x in region],
              })

          exact=[]
          for r in pairs:
              if r['set_len9_seen'] and r['get_len9_seen'] and r['same_stack_byte_AA_then_55']:
                  exact.append(r)

          out={
              'pctools_sha256':'0e13801b29070f805869823e6db4ad56d70494b2621fb63c330cea1d69e9ca33',
              'setfeature_iat':hex(next(k for k,v in iat.items() if v=='HidD_SetFeature')),
              'getfeature_iat':hex(next(k for k,v in iat.items() if v=='HidD_GetFeature')),
              'feature_pair_candidates':pairs,
              'exact_same_stack_byte_AA55_len9_pairs':exact,
              'interpretation':'Static Windows-tool behavior only. No frame is authorized for production live use.'
          }
          Path('/tmp/r129/evidence/R129_AA55_FEATURE_PATTERNS.json').write_text(json.dumps(out,indent=2)+'\n')
          PY

      - name: Contextualize production USB VID PID literals and exact pair evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,struct,pefile
          from capstone import Cs,CS_ARCH_X86,CS_MODE_32
          from capstone.x86 import X86_OP_IMM

          PROD_VID=0x18B4
          PROD_PID=0x06B7
          paths={
              'pctools':Path(Path('/tmp/r129/PCTOOLS_PATH').read_text().strip()),
              'upgrade_flash':Path(Path('/tmp/r129/UPGRADE_PATH').read_text().strip()),
          }
          result=[]
          for label,p in paths.items():
              data=p.read_bytes(); pe=pefile.PE(str(p),fast_load=False); ib=pe.OPTIONAL_HEADER.ImageBase
              vidb=struct.pack('<H',PROD_VID); pidb=struct.pack('<H',PROD_PID)
              vids=[]; pos=0
              while True:
                  pos=data.find(vidb,pos)
                  if pos<0: break
                  vids.append(pos); pos+=1
              pids=[]; pos=0
              while True:
                  pos=data.find(pidb,pos)
                  if pos<0: break
                  pids.append(pos); pos+=1
              near=[]
              for vo in vids:
                  ds=sorted(((abs(po-vo),po) for po in pids))[:5]
                  for d,po in ds:
                      if d<=64:
                          near.append({'vid_file_offset':vo,'pid_file_offset':po,'distance':d})

              md=Cs(CS_ARCH_X86,CS_MODE_32); md.detail=True
              imm_hits=[]; both_blocks=[]; block=[]
              for s in pe.sections:
                  if not (s.Characteristics & 0x20000000): continue
                  sec=list(md.disasm(s.get_data(),ib+s.VirtualAddress))
                  for i,x in enumerate(sec):
                      vals=[op.imm for op in x.operands if op.type==X86_OP_IMM]
                      if PROD_VID in vals or PROD_PID in vals:
                          imm_hits.append({'va':hex(x.address),'text':f'{x.mnemonic} {x.op_str}','values':[hex(v) for v in vals if v in (PROD_VID,PROD_PID)]})
                          lo=max(0,i-40); hi=min(len(sec),i+41)
                          vals2=[]
                          for y in sec[lo:hi]:
                              vals2 += [op.imm for op in y.operands if op.type==X86_OP_IMM]
                          if PROD_VID in vals2 and PROD_PID in vals2:
                              both_blocks.append({'center_va':hex(x.address),'context':[{'va':hex(y.address),'text':f'{y.mnemonic} {y.op_str}'} for y in sec[lo:hi]]})
              # dedupe context by center
              seen=set(); ded=[]
              for b in both_blocks:
                  k=b['center_va']
                  if k not in seen: seen.add(k); ded.append(b)
              result.append({
                  'label':label,'path':str(p),
                  'production_vid_hex':'0x18B4','production_pid_hex':'0x06B7',
                  'raw_u16_vid_count':len(vids),'raw_u16_pid_count':len(pids),
                  'raw_pair_within_64_bytes':near[:500],
                  'exact_instruction_immediate_hits':imm_hits,
                  'instruction_windows_containing_both_exact_immediates':ded[:100],
              })
          Path('/tmp/r129/evidence/R129_USB_ID_CONTEXT.json').write_text(json.dumps(result,indent=2)+'\n')
          PY

      - name: Recover two-level pointer xrefs for MVA and flashboot strings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re,struct,pefile
          from capstone import Cs,CS_ARCH_X86,CS_MODE_32
          from capstone.x86 import X86_OP_IMM,X86_OP_MEM

          terms=re.compile(r'MVA|Flashboot_UpDateFile|Flashboot upgrade|BPXX MVA|AP82XX MVA|upgrade start|Upgrade Finished|READSN|PCTools_Config|chiperas|codedata|bootdat|constdat|cnfgdat|btupdat|upinfo',re.I)
          paths={
              'pctools':Path(Path('/tmp/r129/PCTOOLS_PATH').read_text().strip()),
              'upgrade_flash':Path(Path('/tmp/r129/UPGRADE_PATH').read_text().strip()),
          }
          allrows=[]
          for label,p in paths.items():
              data=p.read_bytes(); pe=pefile.PE(str(p),fast_load=False); ib=pe.OPTIONAL_HEADER.ImageBase
              strings=[]
              for enc,pat in [('ascii',rb'[\x20-\x7e]{5,}'),('utf16le',rb'(?:[\x20-\x7e]\x00){5,}')]:
                  for m in re.finditer(pat,data):
                      s=m.group().decode('latin1' if enc=='ascii' else 'utf-16le','replace')
                      if not terms.search(s): continue
                      try: va=ib+pe.get_rva_from_offset(m.start())
                      except Exception: continue
                      strings.append({'encoding':enc,'file_offset':m.start(),'va':va,'text':s[:800]})

              ptr_rows=[]
              for s in strings:
                  needle=struct.pack('<I',s['va'] & 0xffffffff)
                  offs=[]; pos=0
                  while True:
                      pos=data.find(needle,pos)
                      if pos<0: break
                      offs.append(pos); pos+=1
                  ptrs=[]
                  for off in offs[:200]:
                      try: pva=ib+pe.get_rva_from_offset(off)
                      except Exception: continue
                      ptrs.append({'file_offset':off,'pointer_va':pva})
                  ptr_rows.append({'string':s,'pointer_slots':ptrs})

              targets={}
              for row in ptr_rows:
                  targets[row['string']['va']]=('string',row['string']['text'])
                  for q in row['pointer_slots']:
                      targets[q['pointer_va']]=('pointer_slot',row['string']['text'])

              md=Cs(CS_ARCH_X86,CS_MODE_32); md.detail=True
              code_xrefs=[]
              for sec in pe.sections:
                  if not (sec.Characteristics & 0x20000000): continue
                  for x in md.disasm(sec.get_data(),ib+sec.VirtualAddress):
                      vals=[]
                      for op in x.operands:
                          if op.type==X86_OP_IMM: vals.append(op.imm & 0xffffffff)
                          elif op.type==X86_OP_MEM and op.mem.disp: vals.append(op.mem.disp & 0xffffffff)
                      for v in vals:
                          if v in targets:
                              kind,text=targets[v]
                              code_xrefs.append({'insn_va':hex(x.address),'instruction':f'{x.mnemonic} {x.op_str}','target_va':hex(v),'target_kind':kind,'string':text})
              allrows.append({'label':label,'string_pointer_map':ptr_rows,'code_xrefs_to_string_or_pointer_slot':code_xrefs})
          Path('/tmp/r129/evidence/R129_MVA_POINTER_XREFS.json').write_text(json.dumps(allrows,indent=2,ensure_ascii=False)+'\n')
          PY

      - name: Reconstruct static HID Output Input report-building contexts in upgrade_flash
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,pefile
          from capstone import Cs,CS_ARCH_X86,CS_MODE_32
          from capstone.x86 import X86_OP_IMM,X86_OP_MEM,X86_REG_EBP

          p=Path(Path('/tmp/r129/UPGRADE_PATH').read_text().strip())
          pe=pefile.PE(str(p),fast_load=False); ib=pe.OPTIONAL_HEADER.ImageBase
          wanted={'HidD_SetOutputReport','HidD_GetInputReport'}; iat={}
          for e in getattr(pe,'DIRECTORY_ENTRY_IMPORT',[]):
              for imp in e.imports:
                  if imp.name:
                      n=imp.name.decode('latin1','replace')
                      if n in wanted: iat[imp.address]=n
          md=Cs(CS_ARCH_X86,CS_MODE_32); md.detail=True
          ins=[]
          for s in pe.sections:
              if s.Characteristics & 0x20000000:
                  ins.extend(md.disasm(s.get_data(),ib+s.VirtualAddress))
          ins=sorted(ins,key=lambda x:x.address)
          rows=[]
          for idx,x in enumerate(ins):
              names=[]
              for op in x.operands:
                  vals=[]
                  if op.type==X86_OP_IMM: vals=[op.imm & 0xffffffff]
                  elif op.type==X86_OP_MEM and op.mem.disp: vals=[op.mem.disp & 0xffffffff]
                  for v in vals:
                      if v in iat: names.append(iat[v])
              if not names: continue
              lo=max(0,idx-100); hi=min(len(ins),idx+60)
              ctx=ins[lo:hi]
              stores=[]; arg_imms=[]
              for y in ctx:
                  if y.address > x.address: continue
                  if y.mnemonic=='mov' and len(y.operands)==2 and y.operands[0].type==X86_OP_MEM and y.operands[0].mem.base==X86_REG_EBP and y.operands[1].type==X86_OP_IMM:
                      stores.append({'va':hex(y.address),'stack_disp':y.operands[0].mem.disp,'imm':hex(y.operands[1].imm & 0xffffffff),'size':y.operands[0].size,'text':f'{y.mnemonic} {y.op_str}'})
                  if y.mnemonic=='mov' and len(y.operands)==2 and y.operands[0].type==X86_OP_MEM and y.operands[1].type==X86_OP_IMM:
                      if y.operands[0].mem.base!=X86_REG_EBP:
                          arg_imms.append({'va':hex(y.address),'imm':hex(y.operands[1].imm & 0xffffffff),'text':f'{y.mnemonic} {y.op_str}'})
              rows.append({
                  'call_va':hex(x.address),'imports':sorted(set(names)),
                  'preceding_stack_immediate_stores':stores[-80:],
                  'preceding_argument_immediates':arg_imms[-40:],
                  'context':[{'va':hex(y.address),'text':f'{y.mnemonic} {y.op_str}'} for y in ctx],
              })
          Path('/tmp/r129/evidence/R129_UPGRADE_HID_REPORT_CONTEXT.json').write_text(json.dumps({'iat':{hex(k):v for k,v in iat.items()},'calls':rows},indent=2)+'\n')
          PY

      - name: Parse Flashboot_UpDateFile bt bytes structurally only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          p=Path(Path('/tmp/r129/FLASHBT_PATH').read_text().strip())
          b=p.read_bytes()
          printable=[]
          start=None
          for i,x in enumerate(b+b'\x00'):
              ok=32<=x<=126
              if ok and start is None: start=i
              if (not ok) and start is not None:
                  if i-start>=4: printable.append({'offset':start,'text':b[start:i].decode('ascii','replace')})
                  start=None
          out={
              'path':str(p),'size':len(b),'sha256':hashlib.sha256(b).hexdigest(),
              'hex':b.hex(),
              'first_16':[hex(x) for x in b[:16]],
              'printable_runs':printable,
              'byte_value_counts':{hex(v):b.count(bytes([v])) for v in sorted(set(b))},
              'interpretation':'Structural byte inventory only; this does not establish that the file is a production flashboot image or is accepted by the production board.'
          }
          Path('/tmp/r129/evidence/R129_FLASHBOOT_BT_PARSE.json').write_text(json.dumps(out,indent=2)+'\n')
          PY

      - name: Build fail-closed R129 decision and report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          ev=Path('/tmp/r129/evidence')
          aa=json.loads((ev/'R129_AA55_FEATURE_PATTERNS.json').read_text())
          usb=json.loads((ev/'R129_USB_ID_CONTEXT.json').read_text())
          mx=json.loads((ev/'R129_MVA_POINTER_XREFS.json').read_text())
          up=json.loads((ev/'R129_UPGRADE_HID_REPORT_CONTEXT.json').read_text())
          bt=json.loads((ev/'R129_FLASHBOOT_BT_PARSE.json').read_text())

          exact=aa['exact_same_stack_byte_AA55_len9_pairs']
          pct_usb=next(x for x in usb if x['label']=='pctools')
          prod_pair_immediate=bool(pct_usb['instruction_windows_containing_both_exact_immediates'])
          mva_code_xrefs=sum(len(x['code_xrefs_to_string_or_pointer_slot']) for x in mx)

          decision={
              'R128_RUN_ID':35868841078,
              'R128_EVIDENCE_ARTIFACT_ID':10753442571,
              'PCTOOLS_SHA256':'0e13801b29070f805869823e6db4ad56d70494b2621fb63c330cea1d69e9ca33',
              'UPGRADE_FLASH_SHA256':'bebb887b04fc724e1c459cce15d4395c78df3e098c54f06369ffe78b50aec073',
              'FLASHBOOT_UPDATEFILE_SHA256':'34acb64329dd0e952f490dc56624b6d8b7e0cc516a2f23ca5df6c48cf9e6a3d6',
              'EXACT_PCTOOLS_AA55_SETFEATURE_GETFEATURE_LEN9_STATIC_PATTERN_COUNT':len(exact),
              'EXACT_PCTOOLS_AA55_SETFEATURE_GETFEATURE_LEN9_STATIC_PATTERN_PROVEN':bool(exact),
