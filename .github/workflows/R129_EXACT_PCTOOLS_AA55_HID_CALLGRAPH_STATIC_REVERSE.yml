      - name: Package R129 evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r129/evidence
          zip -9 -r /tmp/R129_EXACT_PCTOOLS_AA55_HID_CALLGRAPH_STATIC_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/R129_EXACT_PCTOOLS_AA55_HID_CALLGRAPH_STATIC_EVIDENCE.zip \
            > /tmp/R129_EXACT_PCTOOLS_AA55_HID_CALLGRAPH_STATIC_EVIDENCE.zip.sha256

      - name: Upload R129 evidence
        uses: actions/upload-artifact@v4
        with:
          name: R129-EXACT-PCTOOLS-AA55-HID-CALLGRAPH-STATIC-EVIDENCE
          path: |
            /tmp/R129_EXACT_PCTOOLS_AA55_HID_CALLGRAPH_STATIC_EVIDENCE.zip
            /tmp/R129_EXACT_PCTOOLS_AA55_HID_CALLGRAPH_STATIC_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'R129_VENDOR_BINARY_EXECUTED=NO' /tmp/r129/evidence/R129_SAFETY.txt
          grep -F 'R129_USB_DEVICE_ACCESS=NO' /tmp/r129/evidence/R129_SAFETY.txt
          grep -F 'R129_BOARD_CONTACT=NO' /tmp/r129/evidence/R129_SAFETY.txt
          grep -F 'R129_AA55_SENT=NO' /tmp/r129/evidence/R129_SAFETY.txt
          grep -F 'R129_RUNTIME_0X11_SENT=NO' /tmp/r129/evidence/R129_SAFETY.txt
          grep -F 'R129_RUNTIME_0XFE_SENT=NO' /tmp/r129/evidence/R129_SAFETY.txt
          grep -F '"FLASH_ALLOWED": false' /tmp/r129/evidence/R129_DECISION.json
          echo R129_STATIC_REVERSE_COMPLETE=YES
          echo FLASH_ALLOWED=NO
