name: Build OKN DSP V42 Controlled Write Flow Fix

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_ANDROID_V42_CONTROLLED_WRITE_FLOW_FIX.zip'
      - '.github/workflows/build-okn-dsp-v42.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify V42 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/okn_v42
          mkdir -p /tmp/okn_v42
          unzip -q OKN_DSP_ANDROID_V42_CONTROLLED_WRITE_FLOW_FIX.zip -d /tmp/okn_v42

          test -f /tmp/okn_v42/app/src/main/java/com/okn/dsp/EvidenceLabActivity.kt
          test -f /tmp/okn_v42/app/src/main/java/com/okn/dsp/protocol/ControlledMasterVolumeProof.kt
          test -f /tmp/okn_v42/evidence/OKN_DSP_V42_CONTROLLED_WRITE_PROOF_PLAN.txt

          grep -q '2.4.0-v42-controlled-mastervolume-flow-fix' /tmp/okn_v42/app/build.gradle.kts
          grep -q 'versionCode = 42' /tmp/okn_v42/app/build.gradle.kts
          grep -q 'V42_READONLY_FLOW_RELEASED_FOR_CONTROLLED_PROOF' /tmp/okn_v42/app/src/main/java/com/okn/dsp/EvidenceLabActivity.kt
          grep -q 'V42_CONTROLLED_WRITE_PROOF_COMPLETE' /tmp/okn_v42/app/src/main/java/com/okn/dsp/EvidenceLabActivity.kt
          grep -q 'TX_WRITE_MASTER_MINUS1DB_V42' /tmp/okn_v42/app/src/main/java/com/okn/dsp/EvidenceLabActivity.kt
          grep -q 'TX_RESTORE_MASTER_V42' /tmp/okn_v42/app/src/main/java/com/okn/dsp/EvidenceLabActivity.kt
          grep -q 'controlledMasterVolumeProofEnabled: Boolean = true' /tmp/okn_v42/app/src/main/java/com/okn/dsp/protocol/WriteGate.kt
          grep -q 'const val enabled: Boolean = false' /tmp/okn_v42/app/src/main/java/com/okn/dsp/protocol/WriteGate.kt
          grep -q 'SAVE_PARAMS = 7' /tmp/okn_v42/app/src/main/java/com/okn/dsp/protocol/ConfirmedDspMap.kt
          echo 'V42 source restored; flow fix and safety gates verified'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/okn_v42
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and package artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn_v42/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          mkdir -p artifact
          cp "$APK" artifact/OKN_DSP_V42_CONTROLLED_WRITE_FLOW_FIX-debug.apk
          cp /tmp/okn_v42/evidence/OKN_DSP_V42_CONTROLLED_WRITE_PROOF_PLAN.txt artifact/
          cp /tmp/okn_v42/evidence/OKN_DSP_V42_CONTROLLED_WRITE_PROOF_PLAN.json artifact/
          cp /tmp/okn_v42/README_V42.txt artifact/
          sha256sum artifact/OKN_DSP_V42_CONTROLLED_WRITE_FLOW_FIX-debug.apk > artifact/OKN_DSP_V42_CONTROLLED_WRITE_FLOW_FIX-debug.sha256
          ls -lh artifact

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-V42-CONTROLLED-WRITE-FLOW-FIX-debug-apk
          path: artifact/
          if-no-files-found: error
          retention-days: 30
