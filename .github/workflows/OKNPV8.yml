      # setup-gradle scans Gradle project files, so the generated project must exist first.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Verify frozen V7 protocol core
        shell: bash
        run: |
          set -euo pipefail
          echo "e40bac569ec09021a9eb5d7751784d2d74383aaa3ff6e3ab7fec7cbabc34dc10  app/src/main/java/com/okn/peramp/DspProtocol.java" | sha256sum -c -
          test "$(sha256sum app/src/main/java/com/okn/peramp/BleManager.java | awk '{print $1}')" = "5eda068380708b2a73485bc043b26af2b63483badbc0eda2593716d124aedb0d"

      - name: Validate V8 production qualification, PEQ safety and no-unknown-TX gate
        shell: bash
        run: |
          set -euo pipefail
          python3 Sources/validate_v38_gate.py
          python3 Sources/validate_v39_reset_v8.py
          python3 Sources/validate_oknpv8.py

      - name: Build Debug and Release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk OKNPV8-debug.apk
          cp app/build/outputs/apk/release/app-release.apk OKNPV8-release.apk

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging OKNPV8-debug.apk | tee OKNPV8-apk-badging.txt
          grep -q "package: name='com.okn.peramp' versionCode='8000' versionName='8.0.0'" OKNPV8-apk-badging.txt
          grep -q "application-label:'OKN Peramp'" OKNPV8-apk-badging.txt

      - name: Package V8 source qualification evidence and checksums
        shell: bash
        run: |
          set -euo pipefail
          zip -qr OKNPV8-source.zip app Sources build.gradle settings.gradle gradle.properties -x '*/build/*' -x '.gradle/*'
          cp Sources/OKNPV8_REVERSE_CHECKPOINT.txt OKNPV8-REVERSE-CHECKPOINT.txt
          cp Sources/OKNPV8_BUILD_NOTES.txt OKNPV8-BUILD-NOTES.txt
          cp Sources/V8_PRODUCTION_QUALIFICATION_PLAN.txt OKNPV8-PRODUCTION-QUALIFICATION-PLAN.txt
          cp Sources/V8_OUTPUT_GAIN_STATIC_DISCOVERY.txt OKNPV8-OUTPUT-GAIN-STATIC-DISCOVERY.txt
          sha256sum OKNPV8-debug.apk OKNPV8-release.apk OKNPV8-source.zip OKNPV8-REVERSE-CHECKPOINT.txt OKNPV8-BUILD-NOTES.txt OKNPV8-PRODUCTION-QUALIFICATION-PLAN.txt OKNPV8-OUTPUT-GAIN-STATIC-DISCOVERY.txt > OKNPV8-SHA256SUMS.txt
          cat OKNPV8-SHA256SUMS.txt

      - name: Upload OKNPV8 artifact
        uses: actions/upload-artifact@v7
        with:
          name: OKNPV8
          path: |
            OKNPV8-debug.apk
            OKNPV8-release.apk
            OKNPV8-source.zip
            OKNPV8-SHA256SUMS.txt
            OKNPV8-apk-badging.txt
            OKNPV8-REVERSE-CHECKPOINT.txt
            OKNPV8-BUILD-NOTES.txt
            OKNPV8-PRODUCTION-QUALIFICATION-PLAN.txt
            OKNPV8-OUTPUT-GAIN-STATIC-DISCOVERY.txt
          if-no-files-found: error
          retention-days: 30
