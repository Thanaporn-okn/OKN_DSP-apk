          SXxyatC+6Qx343Y2p52F65MbFfq6mtQzv0dHcZ/F7N3Fd+cv/iMQsJ40XTkYfJjj21jimS3ms8/f
          ZIvV9Lqdak0Nejqb6vB5ifUii18hXGwyd+fMbdgKZLECpZdTZ8ctZ8SVNNe4uVnsn70ON1S9iCds
          ExqmLDY3rkW+nl6HDxsGpI8m7PF4PB6Px+PxeDwej/83x/8Am6FObwC4AQA=
          B64_EOF
          sed -i 's/^[[:space:]]*//' "$RUNNER_TEMP/okn-v54-clone.tar.gz.b64"
          base64 -d "$RUNNER_TEMP/okn-v54-clone.tar.gz.b64" > "$RUNNER_TEMP/okn-v54-clone.tar.gz"
          tar -xzf "$RUNNER_TEMP/okn-v54-clone.tar.gz" -C "$WORK"
          cd "$WORK"
          sha256sum -c SOURCE_HASHES.txt
          echo "SRC_DIR=$WORK" >> "$GITHUB_ENV"

      - name: Static clone and fail-closed checks
        shell: bash
        run: |
          set -euo pipefail
          cd "$SRC_DIR"
          test "$(find app/src/main/assets/i18n -name '*.json' | wc -l)" -eq 17
          grep -q 'GoloPine DSP AudioTurning' app/src/main/res/values/strings.xml
          grep -q 'com.okn.golopineclone' app/build.gradle
          grep -q 'BiquadCascade7thChannel' app/src/main/assets/i18n/en_US.json
          grep -q 'ระดับเสียงหลัก' app/src/main/assets/i18n/th_TH.json
          ! grep -R -n '<uses-permission' app/src/main/AndroidManifest.xml
          ! grep -R -n 'android.bluetooth\|android.hardware.usb\|UsbManager\|BluetoothGatt' app/src/main/java
          ! grep -R -n 'INTERNET\|BLUETOOTH_CONNECT\|BLUETOOTH_SCAN\|WRITE_EXTERNAL_STORAGE' app/src/main/AndroidManifest.xml
          echo 'V54 clone static/fail-closed checks PASS'

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;${{ env.ANDROID_PLATFORM }}" "build-tools;${{ env.ANDROID_BUILD_TOOLS }}"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$SRC_DIR"
          for n in 1 2 3; do
            if gradle --no-daemon --stacktrace :app:assembleDebug; then exit 0; fi
            sleep $((n*20))
          done
          exit 1

      - name: Package APK and source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$SRC_DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/out/OKN_GoloPine_Clone_V54-debug.apk"
          cd "$SRC_DIR"
          zip -qr "$GITHUB_WORKSPACE/out/OKN_GoloPine_Clone_V54_Source.zip" . -x 'app/build/*' '.gradle/*'
          cd "$GITHUB_WORKSPACE/out"
          sha256sum OKN_GoloPine_Clone_V54-debug.apk OKN_GoloPine_Clone_V54_Source.zip > SHA256.txt
          cat > BUILD_SCOPE.txt <<'EOF'
          V54 GOLOPINE CLONE
          - Static reconstruction from user-supplied GoloPine Flutter APK
          - APK-derived GoloPine icon/background visual and all 17 bundled locale JSON files
          - Original-visible telemetry, master/bass/treble/surround controls and 10 PEQ groups
          - CH1..CH7 local output trim UI: 0.5 dB steps, -70..+6 dB
          - Side-by-side clone package: com.okn.golopineclone
          - Fail-closed: no Bluetooth/USB/network permission and no host-to-device transport
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: OKN_GOLOPINE_CLONE_V54
          path: out/*
          if-no-files-found: error
