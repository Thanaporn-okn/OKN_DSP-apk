      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK command-line tools 16.0
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          TOOLS_ZIP="/tmp/commandlinetools-linux-12266719_latest.zip"
          rm -rf "$SDK_ROOT" /tmp/okn-cmdline-tools "$TOOLS_ZIP"
          mkdir -p "$SDK_ROOT/cmdline-tools" /tmp/okn-cmdline-tools
          curl -fL --retry 5 --retry-delay 3 \
            "https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip" \
            -o "$TOOLS_ZIP"
          unzip -q "$TOOLS_ZIP" -d /tmp/okn-cmdline-tools
          mv /tmp/okn-cmdline-tools/cmdline-tools "$SDK_ROOT/cmdline-tools/16.0"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"

          # `yes` normally exits with SIGPIPE after sdkmanager finishes.
          # Capture sdkmanager's status (PIPESTATUS[1]) instead of the whole pipeline.
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses
          SDK_STATUS=${PIPESTATUS[1]}
          set -o pipefail

          if [ "$SDK_STATUS" -ne 0 ]; then
            echo "sdkmanager --licenses failed with status $SDK_STATUS" >&2
            exit "$SDK_STATUS"
          fi

          test -d "$ANDROID_SDK_ROOT/licenses"
          echo "Android SDK licenses accepted."

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --list_installed
          test -f "$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify DSP core
        shell: bash
        working-directory: OKN_Peramp_DSP
        run: |
          set -euo pipefail
          chmod +x tools/verify-core.sh
          ./tools/verify-core.sh

      - name: Build debug APK
        shell: bash
        working-directory: OKN_Peramp_DSP
        run: |
          set -uo pipefail
          gradle --version
          set +e
          gradle --no-daemon --stacktrace --warning-mode all :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/OKN-Peramp-DSP-build.log"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "Gradle build failed with status $BUILD_STATUS" >&2
            exit "$BUILD_STATUS"
          fi

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OKN-Peramp-DSP-build-log
          path: OKN-Peramp-DSP-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/OKN_Peramp_DSP/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/OKN-Peramp-DSP-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/OKN-Peramp-DSP-debug.apk" | tee "$GITHUB_WORKSPACE/OKN-Peramp-DSP-debug.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN-Peramp-DSP-debug
          path: |
            OKN-Peramp-DSP-debug.apk
            OKN-Peramp-DSP-debug.sha256
          if-no-files-found: error
          retention-days: 30
