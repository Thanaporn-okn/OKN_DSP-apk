name: Build OKN DSP V61 Production Verified Control Hub

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_ANDROID_V61_PRODUCTION_VERIFIED_CONTROL_HUB.zip'
      - '.github/workflows/build-okn-dsp-v61.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify V61 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/okn_v61
          mkdir -p /tmp/okn_v61
          unzip -q OKN_DSP_ANDROID_V61_PRODUCTION_VERIFIED_CONTROL_HUB.zip -d /tmp/okn_v61

          check_file() { test -f "$1" || { echo "ERROR missing $1"; exit 1; }; echo "OK file: $1"; }
          check_text() { grep -Fq "$1" "$2" || { echo "ERROR missing marker '$1' in $2"; exit 1; }; echo "OK marker: $1"; }

          MAIN=/tmp/okn_v61/app/src/main/java/com/okn/dsp/MainActivity.kt
          SCALAR=/tmp/okn_v61/app/src/main/java/com/okn/dsp/ScalarControlActivity.kt
          LIVE=/tmp/okn_v61/app/src/main/java/com/okn/dsp/LiveEqActivity.kt
          POLICY=/tmp/okn_v61/app/src/main/java/com/okn/dsp/protocol/SaveParamsPolicy.kt
          SCALARPOL=/tmp/okn_v61/app/src/main/java/com/okn/dsp/protocol/VerifiedScalarControls.kt
          GATE=/tmp/okn_v61/app/src/main/java/com/okn/dsp/protocol/WriteGate.kt
          GRADLE=/tmp/okn_v61/app/build.gradle.kts

          for f in "$MAIN" "$SCALAR" "$LIVE" "$POLICY" "$SCALARPOL" "$GATE" "$GRADLE"; do check_file "$f"; done
          check_file /tmp/okn_v61/README_V61.txt
          check_file /tmp/okn_v61/evidence/OKN_DSP_V61_PRODUCTION_VERIFIED_CONTROL_HUB_PLAN.txt
          check_file /tmp/okn_v61/evidence/OKN_DSP_V61_PRODUCTION_VERIFIED_CONTROL_HUB_PLAN.json
          check_file /tmp/okn_v61/evidence/OKN_DSP_V57_SAVEPARAMS_PERSISTENCE_COMPLETE_CAPTURE.txt
          check_file /tmp/okn_v61/evidence/OKN_DSP_V58_LIVE_EQ_PERMANENT_SAVE_SUCCESS_CAPTURE.txt
          check_file /tmp/okn_v61/evidence/OKN_DSP_V60_GLOBAL_CONTROL_PERSISTENT_SAVE_SUCCESS_CAPTURE.txt

          check_text 'versionCode = 61' "$GRADLE"
          check_text '4.3.0-v61-production-verified-control-hub' "$GRADLE"

          # Production launcher: only real verified module entry points; old fake/local controls removed.
          check_text 'PRODUCTION VERIFIED CONTROL HUB' "$MAIN"
          check_text 'REAL DSP CONTROLS ONLY • NO MOCK EQ • NO LOCAL PRESET WRITE • GENERIC WRITES LOCKED' "$MAIN"
          check_text 'ScalarControlActivity::class.java' "$MAIN"
          check_text 'LiveEqActivity::class.java' "$MAIN"
          if grep -Eq 'SeekBar|LOCAL EQ PRESETS|renderPresets|savePreset\(|loadPreset\(|pendingChanges' "$MAIN"; then
            echo 'ERROR: mock/local launcher controls still present'
            exit 1
          fi

          # Generic writes remain locked; only proven modules stay enabled.
          check_text 'const val enabled: Boolean = false' "$GATE"
          check_text 'verifiedScalarControlsEnabled: Boolean = true' "$GATE"
          check_text 'verifiedScalarPersistentSaveEnabled: Boolean = true' "$GATE"
          check_text 'liveEqEditorEnabled: Boolean = true' "$GATE"
          check_text 'liveEqPersistentSaveEnabled: Boolean = true' "$GATE"

          # Exact V57-proven SaveParams trigger remains centralized.
          check_text 'const val ACTUATOR_ID = 7' "$POLICY"
          check_text 'UfeCodec.encodeWrite(ACTUATOR_ID, 0, byteArrayOf())' "$POLICY"
          check_text '570000000700000000' "$POLICY"
          if grep -R -n -F 'UfeCodec.encodeWrite(7' /tmp/okn_v61/app/src/main/java/com/okn/dsp | grep -v 'SaveParamsPolicy.kt'; then
            echo 'ERROR: direct SaveParams ID7 write exists outside SaveParamsPolicy'
            exit 1
          fi

          # Scalar allow-list remains exactly the six runtime-proved controls.
          for marker in \
            'VerifiedScalarControl(2, "MasterVolume"' \
            'VerifiedScalarControl(8, "BassVolume"' \
            'VerifiedScalarControl(9, "BassCutoff"' \
            'VerifiedScalarControl(10, "BassBoost"' \
            'VerifiedScalarControl(13, "MiddleBoost"' \
            'VerifiedScalarControl(11, "TrebleBoost"'; do
            check_text "$marker" "$SCALARPOL"
          done
          if grep -Fq 'VerifiedScalarControl(3,' "$SCALARPOL"; then
            echo 'ERROR: ID3 RemindSoundVolume must remain intentionally unexposed'
            exit 1
          fi

          # Global controls remain write -> fresh descriptor verify -> rollback on failure -> explicit save.
          check_text 'V61_SCALAR_WRITE_PLAIN=' "$SCALAR"
          check_text 'V61_TARGET_DESCRIPTOR_VERIFY' "$SCALAR"
          check_text 'V61_SCALAR_WRITE_COMPLETE' "$SCALAR"
          check_text 'persistence=RAM_DIRTY' "$SCALAR"
          check_text 'V61_FAILSAFE_RESTORE_PLAIN=' "$SCALAR"
          check_text 'V61_RESTORE_DESCRIPTOR_VERIFY' "$SCALAR"
          check_text 'SAVE VERIFIED GLOBAL CONTROLS TO DSP (PERMANENT) • GUARDED' "$SCALAR"
          check_text 'V61_SCALAR_SAVEPARAMS_TRIGGER_PLAIN=' "$SCALAR"
          check_text 'V61_SCALAR_PERSISTENT_SAVE_COMPLETE' "$SCALAR"
          if grep -Fq 'IMPORT V59 VERIFIED RAM-DIRTY PROOF' "$SCALAR"; then
            echo 'ERROR: V59 one-time recovery UI must not remain in V61 production module'
            exit 1
          fi

          # Live EQ remains the V58-proved guarded 7CH path.
          check_text 'V61_LIVE_EQ_WRITE_PLAIN=' "$LIVE"
          check_text 'V61_TARGET_DESCRIPTOR_VERIFY' "$LIVE"
          check_text 'V61_EQ_ROLLBACK_WRITE_PLAIN=' "$LIVE"
          check_text 'V61_ROLLBACK_DESCRIPTOR_VERIFY' "$LIVE"
          check_text 'SAVE TO DSP (PERMANENT) • GUARDED' "$LIVE"
          check_text 'V61_SAVEPARAMS_TRIGGER_PLAIN=' "$LIVE"
          check_text 'V61_PERSISTENT_SAVE_COMPLETE' "$LIVE"

          # No APPLY/verify path is allowed to auto-save.
          python3 - <<'PY'
          from pathlib import Path
          scalar = Path('/tmp/okn_v61/app/src/main/java/com/okn/dsp/ScalarControlActivity.kt').read_text()
          live = Path('/tmp/okn_v61/app/src/main/java/com/okn/dsp/LiveEqActivity.kt').read_text()
          scalar_apply = scalar[scalar.index('private fun sendScalarWrite'):scalar.index('private fun requestDescriptor')]
          scalar_verify = scalar[scalar.index('private fun onDescriptorComplete'):scalar.index('private fun extractScalarValues')]
          live_apply = live[live.index('private fun applyBand'):live.index('private fun requestDescriptor')]
          live_verify = live[live.index('private fun verifyTarget'):live.index('private fun restorePrevious')]
          for seg, name in [(scalar_apply,'scalar_apply'),(scalar_verify,'scalar_verify'),(live_apply,'live_apply'),(live_verify,'live_verify')]:
              assert 'SaveParamsPolicy.encodeTrigger()' not in seg, name
              assert 'sendPermanentSave()' not in seg, name
          print('OK: APPLY/verify paths do not auto-save')
          PY

          echo 'OK: V61 production launcher exposes only runtime-proved real DSP control modules'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/okn_v61
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and package artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn_v61/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          mkdir -p artifact
          cp "$APK" artifact/OKN_DSP_V61_PRODUCTION_VERIFIED_CONTROL_HUB-debug.apk
          cp /tmp/okn_v61/README_V61.txt artifact/
          cp /tmp/okn_v61/evidence/OKN_DSP_V61_PRODUCTION_VERIFIED_CONTROL_HUB_PLAN.txt artifact/
          cp /tmp/okn_v61/evidence/OKN_DSP_V61_PRODUCTION_VERIFIED_CONTROL_HUB_PLAN.json artifact/
          sha256sum artifact/OKN_DSP_V61_PRODUCTION_VERIFIED_CONTROL_HUB-debug.apk > artifact/OKN_DSP_V61_PRODUCTION_VERIFIED_CONTROL_HUB-debug.sha256
          ls -lh artifact

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-V61-PRODUCTION-VERIFIED-CONTROL-HUB-debug-apk
          path: artifact/
          if-no-files-found: error
          retention-days: 30
