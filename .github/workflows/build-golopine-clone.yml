      - name: Static current-version protocol evidence and fail-closed checks
        shell: bash
        run: |
          set -euo pipefail
          cd "$SRC_DIR"
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root = Path(".")
          gradle = (root / "app/build.gradle").read_text()
          settings = (root / "settings.gradle").read_text()
          java = (root / "app/src/main/java/com/okn/golopineclone/MainActivity.java").read_text()
          manifest = (root / "app/src/main/AndroidManifest.xml").read_text()
          th = json.loads((root / "app/src/main/assets/i18n/th_TH.json").read_text())
          en = json.loads((root / "app/src/main/assets/i18n/en_US.json").read_text())

          m_name = re.search(r"versionName\s+'([^']+)'", gradle)
          m_code = re.search(r"versionCode\s+(\d+)", gradle)
          assert m_name and m_code
          app_version = m_name.group(1)
          version_code = int(m_code.group(1))
          major = int(app_version.split(".", 1)[0])
          tag = f"V{major}"

          assert app_version == "66.0.0-clone"
          assert version_code == 1066
          assert version_code == 1000 + major
          assert f'rootProject.name = "OKN_GoloPine_Clone_{tag}"' in settings
          assert len(list((root / "app/src/main/assets/i18n").glob("*.json"))) == 17
          assert th.get("UiHeaderVersion") == "OKN V66 • ภายในเครื่อง"
          assert en.get("UiHeaderVersion") == "OKN V66 • LOCAL/OFFLINE"

          required = [
              'WindowInsets.Type.systemBars()',
              'showProtocolEvidenceDialog',
              'inspectProtocolEvidenceJson',
              'protocolEvidenceSummary',
              'protocol_evidence_json',
              '"protocol-evidence"',
              'safetyLine("TRANSPORT_PROTOCOL", "UNPROVEN")',
              'safetyLine("DEVICE_DESCRIPTION", "UNPROVEN")',
              'safetyLine("CONTROL_MAPPING", "UNPROVEN")',
              'safetyLine("DSP_WRITE", "LOCKED")',
              'LIVE_BOARD_USB',
              'HOST_TO_DEVICE_USB',
              'FLASH_ERASE_WRITE',
              'FLASH_ALLOWED',
          ]
          for token in required:
              assert token in java, token

          assert "<uses-permission" not in manifest
          for token in [
              "android.permission.INTERNET",
              "android.permission.BLUETOOTH",
              "android.permission.BLUETOOTH_CONNECT",
              "android.permission.BLUETOOTH_SCAN",
              "WRITE_EXTERNAL_STORAGE",
          ]:
              assert token not in manifest, token

          for token in [
              "android.bluetooth",
              "android.hardware.usb",
              "BluetoothAdapter",
              "BluetoothManager",
              "BluetoothGatt",
              "UsbManager",
              "UsbDevice",
              "HttpURLConnection",
              "java.net",
              "SET_REPORT",
          ]:
              assert token not in java, token

          print(f"{tag} clone protocol-evidence/fail-closed checks PASS")
          Path(".version_env").write_text(
              f"APP_VERSION={app_version}\n"
              f"VERSION_CODE={version_code}\n"
              f"VERSION_TAG={tag}\n"
              f"ARTIFACT_NAME=OKN_GOLOPINE_CLONE_{tag}\n"
          )
          PY
          cat .version_env >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$SRC_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Package APK and source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          APK_NAME="OKN_GoloPine_Clone_${VERSION_TAG}-debug.apk"
          SRC_NAME="OKN_GoloPine_Clone_${VERSION_TAG}_Source.zip"
          cp "$SRC_DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/out/$APK_NAME"
          cd "$SRC_DIR"
          zip -qr "$GITHUB_WORKSPACE/out/$SRC_NAME" . -x 'app/build/*' '.gradle/*'
          cd "$GITHUB_WORKSPACE/out"
          sha256sum "$APK_NAME" "$SRC_NAME" > SHA256.txt
          cat > BUILD_SCOPE.txt <<EOF
          ${VERSION_TAG} continuous GoloPine clone build using one stable workflow file:
          - Workflow path stays .github/workflows/build-golopine-clone.yml for future versions.
          - Local Protocol Evidence JSON can be staged and reviewed offline.
          - Evidence staging does not mark transport/device-description/control-mapping proven.
          - DSP_WRITE remains LOCKED.
          - No Bluetooth/USB/network permission or host-to-device transport.
          - Firmware/USB fail-closed markers remain NO.
          EOF
          sed -i 's/^[[:space:]]*//' BUILD_SCOPE.txt

      - name: Upload current-version artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: out/*
          if-no-files-found: error
