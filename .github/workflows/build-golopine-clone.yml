      - name: Static current-version UI and fail-closed checks
        shell: bash
        run: |
          set -euo pipefail
          cd "$SRC_DIR"
          APP_VERSION="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -1)"
          VERSION_CODE="$(awk '/versionCode/{print $2; exit}' app/build.gradle)"
          MAJOR="${APP_VERSION%%.*}"
          VERSION_TAG="V${MAJOR}"
          EXPECTED_CODE=$((1000 + MAJOR))
          test -n "$APP_VERSION"
          test "$VERSION_CODE" -eq "$EXPECTED_CODE"
          test "$(find app/src/main/assets/i18n -name '*.json' | wc -l)" -eq 17
          grep -Fq "rootProject.name = "OKN_GoloPine_Clone_${VERSION_TAG}"" settings.gradle
          grep -q 'WindowInsets.Type.systemBars()' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -q 'copyBackupToClipboard' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -q 'readClipboardText' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -q 'inspectBackupJson' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -q 'confirmResetSection' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -q 'resetSection' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -q 'root.optInt("schema", -1) != 1' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -q 'LIVE_BOARD_USB' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -q 'HOST_TO_DEVICE_USB' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -q 'FLASH_ERASE_WRITE' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -q 'FLASH_ALLOWED' app/src/main/java/com/okn/golopineclone/MainActivity.java
          ! grep -R -n '<uses-permission' app/src/main/AndroidManifest.xml
          ! grep -R -n 'android.bluetooth\|android.hardware.usb\|UsbManager\|BluetoothGatt\|HttpURLConnection\|java.net\|SET_REPORT' app/src/main/java
          ! grep -R -n 'INTERNET\|BLUETOOTH_CONNECT\|BLUETOOTH_SCAN\|WRITE_EXTERNAL_STORAGE' app/src/main/AndroidManifest.xml
          grep -Fq ""UiHeaderVersion": "OKN ${VERSION_TAG} • ภายในเครื่อง"" app/src/main/assets/i18n/th_TH.json
          grep -Fq '"UiPasteClipboard": "วางจากคลิปบอร์ด"' app/src/main/assets/i18n/th_TH.json
          grep -Fq '"UiResetPeq": "รีเซ็ต PEQ ทั้งหมด"' app/src/main/assets/i18n/th_TH.json
          grep -Fq '"UiBackupTitle": "LOCAL BACKUP"' app/src/main/assets/i18n/en_US.json
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_TAG=$VERSION_TAG" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=OKN_GOLOPINE_CLONE_${VERSION_TAG}" >> "$GITHUB_ENV"
          echo "${VERSION_TAG} clone UI/backup/reset/fail-closed checks PASS"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$SRC_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Package APK and source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          APK_NAME="OKN_GoloPine_Clone_${VERSION_TAG}-debug.apk"
          SRC_NAME="OKN_GoloPine_Clone_${VERSION_TAG}_Source.zip"
          cp "$SRC_DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/out/$APK_NAME"
          cd "$SRC_DIR"
          zip -qr "$GITHUB_WORKSPACE/out/$SRC_NAME" . -x 'app/build/*' '.gradle/*'
          cd "$GITHUB_WORKSPACE/out"
          sha256sum "$APK_NAME" "$SRC_NAME" > SHA256.txt
          cat > BUILD_SCOPE.txt <<EOF
          ${VERSION_TAG} continuous GoloPine clone build using one stable workflow file:
          - Workflow path stays .github/workflows/build-golopine-clone.yml for future versions.
          - Version/artifact names are derived automatically from app/build.gradle.
          - Local clipboard backup/restore validates schema/app ID, reviews source version/value count, and clamps numeric ranges.
          - HOME / PEQ / OUTPUT can be reset independently; full local reset remains available.
          - No storage permission is required for backup or restore.
          - Fail-closed: no Bluetooth/USB/network permission or host-to-device transport.
          EOF
          sed -i 's/^[[:space:]]*//' BUILD_SCOPE.txt

      - name: Upload current-version artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: out/*
          if-no-files-found: error
