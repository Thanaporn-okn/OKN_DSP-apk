name: R138 exact primary community Drive resilient acquisition static audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R138_EXACT_PRIMARY_COMMUNITY_GDRIVE_RESILIENT_ACQUISITION_STATIC_AUDIT.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r138-primary-community-drive-resilient-${{ github.ref }}
  cancel-in-progress: true

env:
  FLASH_ALLOWED: "NO"
  R137_RUN_ID: "35898112070"
  R137_JOB_ID: "107307041160"
  R137_EVIDENCE_ARTIFACT_ID: "10767358715"
  R137_EVIDENCE_ARTIFACT_NAME: "R137-EXACT-ACPWORKBENCH-SYSTEM-RECOVER-PAYLOAD-STATIC-EVIDENCE"
  R137_EVIDENCE_DIGEST: "sha256:434d28173498e53b6bfb7dc8ba58f942a6c762d08a48e0202d74117f9fc24546"
  DSP_PRIMARY_FILE_ID: "1eJxszZqheaYBkum6AthHMAl35JigTH3A"
  COMMUNITY_FILE_ID: "1-fvBMX74S69kvDy7EWMBbfg0lpLD05J7"
  PROD_VID_HEX: "18B4"
  PROD_PID_HEX: "06B7"

jobs:
  acquire:
    name: STATIC ONLY - resilient Drive acquisition - no execution - no USB - no board
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r138/downloads /tmp/r138/unpacked /tmp/r138/text /tmp/r138/r137 /tmp/r138/evidence
          cat > /tmp/r138/evidence/R138_SAFETY.txt <<'EOF'
          R138_MODE=PUBLIC_FILE_ACQUISITION_AND_OFFLINE_STATIC_INSPECTION_ONLY
          R138_VENDOR_BINARY_EXECUTED=NO
          R138_INSTALLER_EXECUTED=NO
          R138_USB_DEVICE_ACCESS=NO
          R138_BOARD_CONTACT=NO
          R138_AA55_SENT=NO
          R138_RUNTIME_0X11_SENT=NO
          R138_RUNTIME_0XFE_SENT=NO
          R138_FLASHBOOT_COMMAND_SENT=NO
          R138_FLASH_READ_EXECUTED=NO
          R138_FLASH_ERASE_EXECUTED=NO
          R138_FLASH_WRITE_EXECUTED=NO
          R138_ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD=NO
          HARDWARE_MODIFICATION=FORBIDDEN
          REFERENCE_OR_TOOL_EVIDENCE_IS_NOT_PRODUCTION_PROOF=YES
          FLASH_ALLOWED=NO
          EOF

      - name: Download pinned R137 evidence for continuity only
        uses: actions/download-artifact@v4
        with:
          name: R137-EXACT-ACPWORKBENCH-SYSTEM-RECOVER-PAYLOAD-STATIC-EVIDENCE
          path: /tmp/r138/r137
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 35898112070

      - name: Install acquisition and static tooling only
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            file unzip p7zip-full binutils poppler-utils jq python3-pip >/dev/null
          python3 -m pip install --disable-pip-version-check --no-input \
            requests beautifulsoup4 pefile capstone gdown >/dev/null

      - name: Record exact R127 public Drive IDs and R137 continuity
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r138/evidence/R138_TARGETS.json <<EOF
          [
            {
              "label": "DSP_SOFTWARE_PRIMARY",
              "file_id": "${DSP_PRIMARY_FILE_ID}",
              "source": "R127 exact recovered Google Drive ID"
            },
            {
              "label": "COMMUNITY_SHARED_FILE",
              "file_id": "${COMMUNITY_FILE_ID}",
              "source": "R127 exact recovered Google Drive ID"
            }
          ]
          EOF
          find /tmp/r138/r137 -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/r138/evidence/R138_R137_ARTIFACT_FILES.txt

      - name: Resilient exact Drive download with confirmation form handling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import requests, json, hashlib, re, subprocess, urllib.parse, time
          from bs4 import BeautifulSoup

          root=Path('/tmp/r138/downloads')
          ev=Path('/tmp/r138/evidence')
          targets=json.loads((ev/'R138_TARGETS.json').read_text())
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'

          def looks_html(resp, head):
              ct=(resp.headers.get('content-type') or '').lower()
              h=head.lower()
              return 'text/html' in ct or b'<!doctype html' in h or b'<html' in h

          def filename_from_headers(resp, default_name):
              cd=resp.headers.get('content-disposition') or ''
              m=re.search(r"filename\*=UTF-8''([^;]+)",cd,re.I)
              if m:
                  return urllib.parse.unquote(m.group(1)).replace('/','_')
              m=re.search(r'filename="([^"]+)"',cd,re.I)
              if m: return m.group(1).replace('/','_')
              m=re.search(r'filename=([^;]+)',cd,re.I)
              if m: return m.group(1).strip().strip('"').replace('/','_')
              return default_name

          def save_response(resp, dest_dir, default_name):
              chunks=[]; total=0; head=b''
              for chunk in resp.iter_content(1024*1024):
                  if not chunk: continue
                  if len(head)<8192: head=(head+chunk)[:8192]
                  chunks.append(chunk); total+=len(chunk)
                  if total>2*1024*1024*1024:
                      raise RuntimeError('download exceeds 2 GiB safety cap')
              if looks_html(resp,head):
                  return None, head, b''.join(chunks[:4])[:2*1024*1024]
              name=filename_from_headers(resp,default_name)
              out=dest_dir/name
              with out.open('wb') as f:
                  for c in chunks: f.write(c)
              return out, head, None

          def request_once(session,url,params=None,data=None,method='GET'):
              kw=dict(headers={'User-Agent':UA},timeout=90,allow_redirects=True,stream=True)
              if method=='POST': return session.post(url,data=data,**kw)
              return session.get(url,params=params,**kw)

          def try_download(label,fid):
              dest=root/label; dest.mkdir(parents=True,exist_ok=True)
              s=requests.Session(); attempts=[]
              endpoints=[
                  ('usercontent-confirm','https://drive.usercontent.google.com/download',{'id':fid,'export':'download','confirm':'t'}),
                  ('drive-uc','https://drive.google.com/uc',{'export':'download','id':fid}),
              ]
              for tag,url,params in endpoints:
                  try:
                      r=request_once(s,url,params=params)
                      out,head,html=save_response(r,dest,f'{label}.bin')
                      attempts.append({'tag':tag,'url':r.url,'status':r.status_code,'content_type':r.headers.get('content-type'),'content_disposition':r.headers.get('content-disposition'),'saved':str(out) if out else None,'html_head':head[:1000].decode('latin1','replace') if out is None else None})
                      if out and out.stat().st_size>0:
                          return out,attempts
                      if html is not None:
                          soup=BeautifulSoup(html,'html.parser')
                          form=soup.find('form',id='download-form') or soup.find('form')
                          if form and form.get('action'):
                              action=urllib.parse.urljoin(r.url,form.get('action'))
                              fields={}
                              for inp in form.find_all('input'):
                                  if inp.get('name'):
                                      fields[inp.get('name')]=inp.get('value','')
                              method=(form.get('method') or 'get').upper()
                              rr=request_once(s,action,params=fields if method!='POST' else None,data=fields if method=='POST' else None,method=method)
                              out2,head2,html2=save_response(rr,dest,f'{label}.bin')
                              attempts.append({'tag':tag+'-form','url':rr.url,'status':rr.status_code,'fields':fields,'content_type':rr.headers.get('content-type'),'content_disposition':rr.headers.get('content-disposition'),'saved':str(out2) if out2 else None,'html_head':head2[:1000].decode('latin1','replace') if out2 is None else None})
                              if out2 and out2.stat().st_size>0:
                                  return out2,attempts
                          token=None
                          for k,v in s.cookies.items():
                              if k.startswith('download_warning'):
                                  token=v; break
                          if token:
                              rr=request_once(s,'https://drive.google.com/uc',params={'export':'download','id':fid,'confirm':token})
                              out3,head3,html3=save_response(rr,dest,f'{label}.bin')
                              attempts.append({'tag':tag+'-cookie-confirm','url':rr.url,'status':rr.status_code,'token_present':True,'content_type':rr.headers.get('content-type'),'content_disposition':rr.headers.get('content-disposition'),'saved':str(out3) if out3 else None,'html_head':head3[:1000].decode('latin1','replace') if out3 is None else None})
                              if out3 and out3.stat().st_size>0:
                                  return out3,attempts
                  except Exception as e:
                      attempts.append({'tag':tag,'error':type(e).__name__+': '+str(e)[:500]})

              # Last fallback: modern gdown exact file ID only. Never execute downloaded content.
              try:
                  outpath=dest/f'{label}_gdown.bin'
                  cp=subprocess.run(['gdown','--id',fid,'-O',str(outpath)],capture_output=True,text=True,timeout=240)
                  attempts.append({'tag':'gdown-id-fallback','rc':cp.returncode,'stdout_tail':cp.stdout[-3000:],'stderr_tail':cp.stderr[-3000:]})
                  if cp.returncode==0 and outpath.exists() and outpath.stat().st_size>0:
                      head=outpath.read_bytes()[:8192].lower()
                      if b'<html' not in head and b'<!doctype html' not in head:
                          return outpath,attempts
                      outpath.unlink(missing_ok=True)
              except Exception as e:
                  attempts.append({'tag':'gdown-id-fallback','error':type(e).__name__+': '+str(e)[:500]})
              return None,attempts

          results=[]
          for t in targets:
              out,attempts=try_download(t['label'],t['file_id'])
              row={**t,'success':bool(out),'attempts':attempts}
              if out:
                  data=out.read_bytes()
                  try: typ=subprocess.check_output(['file','-b',str(out)],text=True,errors='replace').strip()
                  except Exception: typ=''
                  row.update({'file':str(out.relative_to(root)),'size':len(data),'sha256':hashlib.sha256(data).hexdigest(),'file_type':typ,'first64_hex':data[:64].hex()})
              results.append(row)
          (ev/'R138_DOWNLOAD_RESULTS.json').write_text(json.dumps(results,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(results,indent=2,ensure_ascii=False))
          PY

      - name: Recursively extract acquired archives as inert data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,hashlib,json
          src=Path('/tmp/r138/downloads'); out=Path('/tmp/r138/unpacked'); ev=Path('/tmp/r138/evidence')
          queue=[(p,0,p.parent.name) for p in src.rglob('*') if p.is_file()]
          seen=set(); rows=[]; total=0; cap=2*1024*1024*1024
          while queue:
              p,depth,label=queue.pop(0)
              if depth>3 or not p.exists(): continue
              data=p.read_bytes(); h=hashlib.sha256(data).hexdigest()
              if h in seen: continue
              seen.add(h)
              try: test=subprocess.run(['7z','t',str(p)],capture_output=True,text=True,timeout=90)
              except Exception: continue
              if test.returncode!=0: continue
              dest=out/f'{label}_d{depth}_{h[:12]}'; dest.mkdir(parents=True,exist_ok=True)
              try: cp=subprocess.run(['7z','x','-y',f'-o{dest}',str(p)],capture_output=True,text=True,timeout=240)
              except Exception as e:
                  rows.append({'source':str(p),'depth':depth,'error':type(e).__name__+': '+str(e)[:300]}); continue
              files=[q for q in dest.rglob('*') if q.is_file()]
              added=sum(q.stat().st_size for q in files); total+=added
              rows.append({'source':str(p),'sha256':h,'depth':depth,'extract_rc':cp.returncode,'file_count':len(files),'added_bytes':added})
              if total>cap:
                  rows.append({'stop':'max_total_extracted_bytes','total':total}); break
              for q in files:
                  if q.stat().st_size<=512*1024*1024: queue.append((q,depth+1,label))
          (ev/'R138_ARCHIVE_EXTRACTION.json').write_text(json.dumps(rows,indent=2,ensure_ascii=False)+'\n')
          PY

      - name: Static audit acquired and extracted files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re,hashlib,subprocess,struct
          import pefile
          from capstone import Cs,CS_ARCH_X86,CS_MODE_32
          from capstone.x86 import X86_OP_IMM

          roots=[Path('/tmp/r138/downloads'),Path('/tmp/r138/unpacked')]
          ev=Path('/tmp/r138/evidence')
          PROD_VID=0x18B4; PROD_PID=0x06B7
          key=re.compile(r'BP1048|BP10|MV_AP82|firmware|upgrade|update|flashboot|bootloader|recovery|backup|readback|dump|MVA|codedata|chiperas|bootdat|constdat|cnfgdat|btupdat|upinfo|18B4|06B7|6324|1719',re.I)
          firmware_ext={'.bin','.hex','.img','.rom','.fw','.firmware','.mva','.bt','.upd','.upg','.dfu','.dsp','.dat'}
          ignored_payload={'.exe','.dll','.pdf','.txt','.ini','.xml','.jpg','.jpeg','.png','.bmp','.ico','.gif','.zip','.rar','.7z'}
          files=[]; payloads=[]; production=[]
          seen=set()
          for root in roots:
              for p in sorted(root.rglob('*')):
                  if not p.is_file(): continue
                  data=p.read_bytes(); h=hashlib.sha256(data).hexdigest()
                  uniq=(h,p.name)
                  if uniq in seen: continue
                  seen.add(uniq)
                  rel=f'{root.name}/{p.relative_to(root)}'
                  try: typ=subprocess.check_output(['file','-b',str(p)],text=True,errors='replace').strip()
                  except Exception: typ=''
                  vals=[]
                  for m in re.finditer(rb'[\x20-\x7e]{5,}',data):
                      s=m.group().decode('latin1','replace')
                      if key.search(s): vals.append(s[:800])
                  for m in re.finditer(rb'(?:[\x20-\x7e]\x00){5,}',data):
                      s=m.group().decode('utf-16le','replace')
                      if key.search(s): vals.append(s[:800])
                  vals=list(dict.fromkeys(vals))[:500]
                  row={'path':rel,'size':len(data),'sha256':h,'file_type':typ,'keyword_hits':vals}
                  # Exact code-immediate scan for production VID/PID in 32-bit PE only.
                  exact=[]
                  try:
                      pe=pefile.PE(str(p),fast_load=False)
                      if pe.FILE_HEADER.Machine==0x14c:
                          md=Cs(CS_ARCH_X86,CS_MODE_32); md.detail=True; ib=pe.OPTIONAL_HEADER.ImageBase
                          for sec in pe.sections:
                              if sec.Characteristics & 0x20000000:
                                  for ins in md.disasm(sec.get_data(),ib+sec.VirtualAddress):
                                      for op in ins.operands:
                                          if op.type==X86_OP_IMM and (op.imm & 0xffffffff) in {PROD_VID,PROD_PID}:
                                              exact.append({'va':hex(ins.address),'value':hex(op.imm & 0xffffffff),'instruction':f'{ins.mnemonic} {ins.op_str}'})
                      row['pe_parse_ok']=True
                  except Exception:
                      row['pe_parse_ok']=False
                  row['exact_production_code_immediates']=exact[:200]
                  files.append(row)
                  text_prod=[s for s in vals if re.search(r'18b4|06b7|6324|1719',s,re.I)]
                  if text_prod or exact:
                      production.append({'path':rel,'text_hits':text_prod[:100],'exact_code_immediates':exact[:100]})
                  ext=p.suffix.lower(); name_signal=bool(re.search(r'firmware|upgrade|update|flash|boot|rom|image|dsp|download',p.name,re.I))
                  candidate=(ext in firmware_ext) or (name_signal and ext not in ignored_payload)
                  if candidate and len(data)>=1024:
                      payloads.append({'path':rel,'size':len(data),'sha256':h,'file_type':typ,'extension':ext,'first64_hex':data[:64].hex(),'name_signal':name_signal,'keyword_hits':vals[:100]})
          out={'files':files,'production_identity_candidates':production,'standalone_firmware_update_payload_candidates':payloads}
          (ev/'R138_STATIC_AUDIT.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          PY

      - name: Build fail-closed R138 decision and package acquired data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          ev=Path('/tmp/r138/evidence')
          dl=json.loads((ev/'R138_DOWNLOAD_RESULTS.json').read_text())
          audit=json.loads((ev/'R138_STATIC_AUDIT.json').read_text())
          success=[x for x in dl if x.get('success')]
          prod=audit.get('production_identity_candidates',[])
          payload=audit.get('standalone_firmware_update_payload_candidates',[])
          decision={
            'R137_RUN_ID':35898112070,
            'R137_JOB_ID':107307041160,
            'R137_EVIDENCE_ARTIFACT_ID':10767358715,
            'R137_EVIDENCE_DIGEST':'sha256:434d28173498e53b6bfb7dc8ba58f942a6c762d08a48e0202d74117f9fc24546',
            'TARGET_EXACT_DRIVE_ID_COUNT':2,
            'SUCCESSFUL_EXACT_DRIVE_DOWNLOAD_COUNT':len(success),
            'SUCCESSFUL_LABELS':[x['label'] for x in success],
            'PRODUCTION_IDENTITY_CANDIDATE_FILE_COUNT':len(prod),
            'PRODUCTION_IDENTITY_CANDIDATES':prod[:100],
            'STANDALONE_FIRMWARE_UPDATE_PAYLOAD_CANDIDATE_COUNT':len(payload),
            'STANDALONE_FIRMWARE_UPDATE_PAYLOAD_CANDIDATES':payload[:100],
            'IMPORTANT_INTERPRETATION':'Acquisition/static evidence only. Filename, string, numeric ID, archive, or payload resemblance does not prove production compatibility or authorize board communication.',
            'PRODUCTION_FIRMWARE_ARTIFACT_PROVEN':False,
            'SAFE_READ_ONLY_STOCK_BACKUP_PROVEN':False,
            'PRODUCTION_BOOTSTRAP_BRIDGE_PROVEN':False,
            'PRODUCTION_RECOVERY_USB_IDENTITY_PROVEN':False,
            'ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD':False,
            'AA55_LIVE_RETEST_ALLOWED':False,
            'RUNTIME_0X11_ALLOWED':False,
            'RUNTIME_0XFE_ALLOWED':False,
            'VENDOR_BINARY_EXECUTED':False,
            'USB_DEVICE_ACCESSED':False,
            'BOARD_CONTACTED':False,
            'FLASH_ALLOWED':False,
            'NEXT':('If a concrete firmware/update payload or production-ID-linked artifact is acquired, deep-static characterize its file format, hashes, embedded metadata, and references only. Do not execute or transmit it.' if payload or prod else 'If these exact primary/community IDs still yield no production firmware artifact, document acquisition failure and pivot to production-specific firmware/update documentation or an exact stock firmware source. No live transmission is authorized.')
          }
          (ev/'R138_DECISION.json').write_text(json.dumps(decision,indent=2,ensure_ascii=False)+'\n')
          (ev/'R138_REPORT_TH.md').write_text(
            '# R138 resilient exact Drive acquisition + static audit\n\n'
            f'- exact target IDs: 2\n'
            f'- successful downloads: {len(success)}\n'
            f'- production-ID candidate files: {len(prod)}\n'
            f'- standalone firmware/update payload candidates: {len(payload)}\n\n'
            '## Safety\n- Public acquisition + offline static inspection only.\n- No vendor executable executed.\n- No USB/board access.\n- AA55 / 0x11 / 0xFE / erase / program / flash remain blocked.\n- FLASH_ALLOWED=NO\n')
          print(json.dumps(decision,indent=2,ensure_ascii=False))
          PY
          cd /tmp/r138/downloads
          zip -9 -r /tmp/R138_ACQUIRED_PRIMARY_COMMUNITY_FILES.zip . >/dev/null || true
          if [ ! -s /tmp/R138_ACQUIRED_PRIMARY_COMMUNITY_FILES.zip ]; then
            echo NO_VALID_FILES_ACQUIRED > /tmp/R138_NO_VALID_FILES_ACQUIRED.txt
            zip -9 /tmp/R138_ACQUIRED_PRIMARY_COMMUNITY_FILES.zip /tmp/R138_NO_VALID_FILES_ACQUIRED.txt >/dev/null
          fi
          sha256sum /tmp/R138_ACQUIRED_PRIMARY_COMMUNITY_FILES.zip > /tmp/R138_ACQUIRED_PRIMARY_COMMUNITY_FILES.zip.sha256

      - name: Package R138 evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r138/evidence
          zip -9 -r /tmp/R138_EXACT_PRIMARY_COMMUNITY_GDRIVE_RESILIENT_STATIC_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/R138_EXACT_PRIMARY_COMMUNITY_GDRIVE_RESILIENT_STATIC_EVIDENCE.zip > /tmp/R138_EXACT_PRIMARY_COMMUNITY_GDRIVE_RESILIENT_STATIC_EVIDENCE.zip.sha256

      - name: Upload R138 evidence
        uses: actions/upload-artifact@v4
        with:
          name: R138-EXACT-PRIMARY-COMMUNITY-GDRIVE-RESILIENT-STATIC-EVIDENCE
          path: |
            /tmp/R138_EXACT_PRIMARY_COMMUNITY_GDRIVE_RESILIENT_STATIC_EVIDENCE.zip
            /tmp/R138_EXACT_PRIMARY_COMMUNITY_GDRIVE_RESILIENT_STATIC_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Upload acquired primary community files
        uses: actions/upload-artifact@v4
        with:
          name: R138-ACQUIRED-PRIMARY-COMMUNITY-FILES
          path: |
            /tmp/R138_ACQUIRED_PRIMARY_COMMUNITY_FILES.zip
            /tmp/R138_ACQUIRED_PRIMARY_COMMUNITY_FILES.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'R138_VENDOR_BINARY_EXECUTED=NO' /tmp/r138/evidence/R138_SAFETY.txt
          grep -F 'R138_USB_DEVICE_ACCESS=NO' /tmp/r138/evidence/R138_SAFETY.txt
          grep -F 'R138_BOARD_CONTACT=NO' /tmp/r138/evidence/R138_SAFETY.txt
          grep -F 'R138_AA55_SENT=NO' /tmp/r138/evidence/R138_SAFETY.txt
          grep -F 'R138_RUNTIME_0X11_SENT=NO' /tmp/r138/evidence/R138_SAFETY.txt
          grep -F 'R138_RUNTIME_0XFE_SENT=NO' /tmp/r138/evidence/R138_SAFETY.txt
          grep -F '"FLASH_ALLOWED": false' /tmp/r138/evidence/R138_DECISION.json
          echo R138_STATIC_ACQUISITION_COMPLETE=YES
          echo FLASH_ALLOWED=NO
