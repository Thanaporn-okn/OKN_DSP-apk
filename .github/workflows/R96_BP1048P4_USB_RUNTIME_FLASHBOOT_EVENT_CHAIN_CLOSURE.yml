name: R96 BP1048P4 USB runtime to flashboot event-chain closure

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r96-bp1048p4-usb-bootstrap-chain-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_REPO: https://github.com/leadercxn/bp1048_sdk_v0.1.12.git
  SDK_COMMIT: 8105bd864b04995d81c9f9ae77cb158259f39015
  FLASH_ALLOWED: 'NO'

jobs:
  offline-chain-audit:
    name: OFFLINE USB runtime-to-flashboot chain audit - no execution/no USB/no board/no flash
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r96/evidence
          cat > /tmp/r96/evidence/R96_SAFETY.txt <<'EOF'
          R96_STATIC_ONLY=YES
          BOARD_CONTACT=NO
          USB_DEVICE_ACCESS=NO
          PHONE_LIVE_TEST=NO
          VENDOR_BINARY_EXECUTION=NO
          SEND_AA55=NO
          SEND_0X11=NO
          SEND_CHIPERAS_CODEDATA_BOOTDAT_CONSTDAT_CNFGDAT_BTUPDAT_UPINFO_CXXX=NO
          R79_PHYSICAL_REPLUG_AUTORUN=NO
          ERASE_PROGRAM_FLASH=NO
          FINAL_REQUIRED_TRANSPORT=SAMSUNG_S25_PLUS_USB_C_DIRECT_TO_DSP_USB_C
          HARDWARE_MODIFICATION=FORBIDDEN
          FLASH_ALLOWED=NO
          PURPOSE=TRACE_REFERENCE_USB_RUNTIME_HID_PATH_AND_USB_RESOURCE_EVENT_PATH_TO_START_UP_GRATE_WITHOUT_LIVE_TEST
          EOF
          cat /tmp/r96/evidence/R96_SAFETY.txt

      - name: Install static source tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/r96-venv
          /tmp/r96-venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir \
            tree-sitter tree-sitter-c
          echo "/tmp/r96-venv/bin" >> "$GITHUB_PATH"

      - name: Clone exact SDK commit
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "$SDK_REPO" /tmp/r96/sdk
          cd /tmp/r96/sdk
          git fetch --depth=1 origin "$SDK_COMMIT"
          git checkout --detach "$SDK_COMMIT"
          HEAD="$(git rev-parse HEAD)"
          test "$HEAD" = "$SDK_COMMIT"
          printf 'SDK_COMMIT_MATCH=YES\nSDK_HEAD=%s\n' "$HEAD" \
            > /tmp/r96/evidence/R96_SDK_GATE.txt

      - name: Exact source-wide bootstrap/event inventory
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r96/sdk

          grep -RInaE \
            'start_up_grate|AppResourceUsbDevice|MSG_DEVICE_SERVICE_USB_DEVICE_IN|MSG_DEVICE_SERVICE_USB_DEVICE_OUT|ResourceRegister|ResourceDeregister|ResourceValue|FindResourceMode|GetSystemMode|SetSystemMode|UsbLoadAudioMode|HIDUsb_Rx|FLASH_BOOT_EN|CFG_UPGRADE_PC_EN|UsbDevice|USB_DEVICE|pc_upgrade|upgrade' \
            --include='*.c' --include='*.h' \
            --exclude-dir=.git . \
            > /tmp/r96/evidence/R96_ALL_SOURCE_HITS.txt || true

          grep -RInaE \
            'start_up_grate[[:space:]]*\([[:space:]]*AppResourceUsbDevice[[:space:]]*\)' \
            --include='*.c' --include='*.h' \
            --exclude-dir=.git . \
            > /tmp/r96/evidence/R96_EXACT_START_USB_CALLS.txt || true

          grep -RInaE \
            'MSG_DEVICE_SERVICE_USB_DEVICE_IN|MSG_DEVICE_SERVICE_USB_DEVICE_OUT' \
            --include='*.c' --include='*.h' \
            --exclude-dir=.git . \
            > /tmp/r96/evidence/R96_USB_DEVICE_MESSAGE_HITS.txt || true

          grep -RInaE \
            'ResourceRegister[[:space:]]*\([[:space:]]*AppResourceUsbDevice|ResourceDeregister[[:space:]]*\([[:space:]]*AppResourceUsbDevice' \
            --include='*.c' --include='*.h' \
            --exclude-dir=.git . \
            > /tmp/r96/evidence/R96_USB_RESOURCE_REGISTER_HITS.txt || true

          grep -RInaE \
            'HIDUsb_Rx|UsbLoadAudioMode' \
            --include='*.c' --include='*.h' \
            --exclude-dir=.git . \
            > /tmp/r96/evidence/R96_RUNTIME_HID_PATH_HITS.txt || true

          echo '=== exact start_up_grate USB calls ==='
          cat /tmp/r96/evidence/R96_EXACT_START_USB_CALLS.txt
          echo '=== USB device message hits ==='
          cat /tmp/r96/evidence/R96_USB_DEVICE_MESSAGE_HITS.txt
          echo '=== USB resource register hits ==='
          cat /tmp/r96/evidence/R96_USB_RESOURCE_REGISTER_HITS.txt
          echo '=== runtime HID path hits ==='
          cat /tmp/r96/evidence/R96_RUNTIME_HID_PATH_HITS.txt

      - name: Extract full enclosing C functions for relevant hits
        shell: bash
        run: |
          set -euo pipefail
          /tmp/r96-venv/bin/python - <<'PY'
          from pathlib import Path
          import json,re
          from tree_sitter import Language, Parser
          import tree_sitter_c

          root=Path('/tmp/r96/sdk')
          out=Path('/tmp/r96/evidence')

          lang=Language(tree_sitter_c.language())
          parser=Parser(lang)

          needles=[
              'start_up_grate',
              'AppResourceUsbDevice',
              'MSG_DEVICE_SERVICE_USB_DEVICE_IN',
              'MSG_DEVICE_SERVICE_USB_DEVICE_OUT',
              'ResourceRegister',
              'ResourceDeregister',
              'ResourceValue',
              'FindResourceMode',
              'GetSystemMode',
              'UsbLoadAudioMode',
              'HIDUsb_Rx',
              'FLASH_BOOT_EN',
              'CFG_UPGRADE_PC_EN',
          ]

          records=[]
          funcs=[]

          def walk(node):
              stack=[node]
              while stack:
                  n=stack.pop()
                  yield n
                  stack.extend(reversed(n.children))

          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in ('.c','.h') or '.git' in p.parts:
                  continue
              try:
                  b=p.read_bytes()
                  text=b.decode('utf-8','ignore')
              except:
                  continue
              if not any(n in text for n in needles):
                  continue

              tree=parser.parse(b)
              for node in walk(tree.root_node):
                  if node.type != 'function_definition':
                      continue
                  chunk=b[node.start_byte:node.end_byte].decode('utf-8','ignore')
                  matched=[n for n in needles if n in chunk]
                  if not matched:
                      continue

                  # Best-effort name extraction from declarator.
                  header=b[node.start_byte:min(node.end_byte,node.start_byte+1200)].decode('utf-8','ignore')
                  m=re.search(r'([A-Za-z_][A-Za-z0-9_]*)\s*\([^;{}]*\)\s*\{',header,re.S)
                  name=m.group(1) if m else f'function_at_{node.start_point[0]+1}'
                  rec={
                      'path':str(p.relative_to(root)),
                      'name':name,
                      'start_line':node.start_point[0]+1,
                      'end_line':node.end_point[0]+1,
                      'matched_terms':matched,
                      'text':chunk,
                  }
                  funcs.append(rec)

              # Also keep local +/-30 line contexts for macro/global hits.
              lines=text.splitlines()
              for i,line in enumerate(lines):
                  matched=[n for n in needles if n in line]
                  if matched:
                      lo=max(0,i-30); hi=min(len(lines),i+31)
                      records.append({
                          'path':str(p.relative_to(root)),
                          'line':i+1,
                          'matched_terms':matched,
                          'context':'\n'.join(lines[lo:hi]),
                      })

          out.joinpath('R96_RELEVANT_FUNCTIONS.json').write_text(
              json.dumps(funcs,indent=2,ensure_ascii=False)+'\n'
          )
          out.joinpath('R96_RELEVANT_CONTEXTS.json').write_text(
              json.dumps(records,indent=2,ensure_ascii=False)+'\n'
          )

          # Human-readable function dump.
          parts=[]
          for f in funcs:
              parts.append(
                  f"===== {f['path']} :: {f['name']} lines {f['start_line']}-{f['end_line']} "
                  f"terms={f['matched_terms']} =====\n{f['text']}\n"
              )
          out.joinpath('R96_RELEVANT_FUNCTIONS.txt').write_text('\n'.join(parts))

          print('RELEVANT_FUNCTION_COUNT',len(funcs))
          print('CONTEXT_COUNT',len(records))
          PY

          sed -n '1,2600p' /tmp/r96/evidence/R96_RELEVANT_FUNCTIONS.txt

      - name: Build heuristic call graph and classify USB event dependency
        shell: bash
        run: |
          set -euo pipefail
          /tmp/r96-venv/bin/python - <<'PY'
          from pathlib import Path
          import collections,json,re

          p=Path('/tmp/r96/evidence')
          funcs=json.loads((p/'R96_RELEVANT_FUNCTIONS.json').read_text())
          allhits=(p/'R96_ALL_SOURCE_HITS.txt').read_text(errors='ignore')
          exact=(p/'R96_EXACT_START_USB_CALLS.txt').read_text(errors='ignore')
          msg=(p/'R96_USB_DEVICE_MESSAGE_HITS.txt').read_text(errors='ignore')
          reg=(p/'R96_USB_RESOURCE_REGISTER_HITS.txt').read_text(errors='ignore')
          runtime=(p/'R96_RUNTIME_HID_PATH_HITS.txt').read_text(errors='ignore')

          # Index all extracted functions by name.
          by_name=collections.defaultdict(list)
          for i,f in enumerate(funcs):
              by_name[f['name']].append(i)

          known_names=set(by_name)
          calls=collections.defaultdict(set)
          for i,f in enumerate(funcs):
              text=f['text']
              for name in known_names:
                  if name==f['name']:
                      continue
                  if re.search(r'\b'+re.escape(name)+r'\s*\(',text):
                      calls[i].add(name)

          graph=[]
          for i,cs in calls.items():
              graph.append({
                  'caller':funcs[i]['name'],
                  'path':funcs[i]['path'],
                  'calls':sorted(cs)
              })
          p.joinpath('R96_HEURISTIC_CALLGRAPH.json').write_text(
              json.dumps(graph,indent=2,ensure_ascii=False)+'\n'
          )

          # Exact function bodies carrying key semantics.
          def ftexts(term):
              return [f for f in funcs if term in f['text']]

          start_usb=ftexts('start_up_grate(AppResourceUsbDevice)')
          if not start_usb:
              # Allow whitespace variants.
              start_usb=[
                  f for f in funcs
                  if re.search(r'start_up_grate\s*\(\s*AppResourceUsbDevice\s*\)',f['text'])
              ]

          usb_msg_funcs=[
              f for f in funcs
              if 'MSG_DEVICE_SERVICE_USB_DEVICE_IN' in f['text']
              or 'MSG_DEVICE_SERVICE_USB_DEVICE_OUT' in f['text']
          ]
          resource_funcs=[
              f for f in funcs
              if re.search(r'Resource(Register|Deregister)\s*\(\s*AppResourceUsbDevice',f['text'])
          ]
          hid_funcs=[
              f for f in funcs if 'HIDUsb_Rx' in f['text'] or 'UsbLoadAudioMode' in f['text']
          ]

          # Determine if any runtime HID function directly reaches flashboot start call.
          runtime_direct_boot=any(
              re.search(r'start_up_grate\s*\(',f['text'])
              for f in hid_funcs
          )

          # Determine if exact USB start caller also checks a device-IN message/resource/mode.
          start_requires_usb_msg=any(
              'MSG_DEVICE_SERVICE_USB_DEVICE_IN' in f['text']
              for f in start_usb
          )
          start_requires_resource=any(
              'ResourceValue(AppResourceUsbDevice)' in f['text']
              for f in start_usb
          )
          start_has_mode_gate=any(
              'GetSystemMode' in f['text']
              for f in start_usb
          )

          # Host-command-to-message synthesis would need an explicit code path in UsbLoadAudioMode/HIDUsb_Rx.
          runtime_synthesizes_usb_in=any(
              'MSG_DEVICE_SERVICE_USB_DEVICE_IN' in f['text']
              or 'ResourceRegister(AppResourceUsbDevice)' in f['text']
              for f in hid_funcs
          )

          decision={
              'SDK_COMMIT_MATCH':True,
              'EXACT_USB_START_UP_GRATE_CALLSITE_COUNT':len(start_usb),
              'USB_DEVICE_MESSAGE_FUNCTION_COUNT':len(usb_msg_funcs),
              'USB_RESOURCE_REGISTER_FUNCTION_COUNT':len(resource_funcs),
              'RUNTIME_HID_FUNCTION_COUNT':len(hid_funcs),
              'RUNTIME_HID_DIRECTLY_CALLS_START_UP_GRATE':runtime_direct_boot,
              'RUNTIME_HID_SYNTHESIZES_USB_DEVICE_IN_OR_RESOURCE_REGISTER':runtime_synthesizes_usb_in,
              'USB_START_CALLER_CONTAINS_DEVICE_IN_MESSAGE_DEPENDENCY':start_requires_usb_msg,
              'USB_START_CALLER_CONTAINS_RESOURCEVALUE_USB_DEPENDENCY':start_requires_resource,
              'USB_START_CALLER_CONTAINS_SYSTEM_MODE_GATE':start_has_mode_gate,
              'SOFTWARE_ONLY_HOST_REQUEST_TO_SYNTHESIZE_FRESH_USB_RESOURCE_EVENT_PROVEN':False,
              'PHONE_DIRECT_BOOTSTRAP_WITHOUT_REPLUG_PROVEN':False,
              'PHONE_DIRECT_BOOTSTRAP_WITHOUT_REPEATING_AA55_PROVEN':False,
              'PRODUCTION_BOOTSTRAP_PROVEN_FROM_REFERENCE_SDK':False,
              'LIVE_BOARD_TEST_ALLOWED_FROM_R96':False,
              'FLASH_ALLOWED':False,
          }

          p.joinpath('R96_DECISION.json').write_text(json.dumps(decision,indent=2)+'\n')

          # Compact named evidence.
          evidence={
              'start_usb_functions':start_usb,
              'usb_message_functions':usb_msg_funcs,
              'resource_functions':resource_funcs,
              'runtime_hid_functions':hid_funcs,
          }
          p.joinpath('R96_CHAIN_EVIDENCE.json').write_text(
              json.dumps(evidence,indent=2,ensure_ascii=False)+'\n'
          )

          print(json.dumps(decision,indent=2))
          PY

      - name: Search libraries and objects for hidden USB event producer semantics
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r96/sdk
          : > /tmp/r96/evidence/R96_BINARY_EVENT_STRING_HITS.txt
          : > /tmp/r96/evidence/R96_BINARY_EVENT_SYMBOL_HITS.txt

          find . -type f \( -name '*.a' -o -name '*.o' -o -name '*.elf' \) -print0 \
            | while IFS= read -r -d '' f; do
                strings -a "$f" 2>/dev/null \
                  | grep -Ei \
                    'USB_DEVICE_IN|USB_DEVICE_OUT|AppResourceUsbDevice|start_up_grate|UsbLoadAudioMode|HIDUsb_Rx|upgrade|usb.*connect|usb.*disconnect|device.*in|device.*out' \
                  | sed "s#^#$f\t#" \
                  >> /tmp/r96/evidence/R96_BINARY_EVENT_STRING_HITS.txt || true

                nm -A "$f" 2>/dev/null \
                  | grep -Ei \
                    'Usb|USB|OTG|Device|HID|Resource|Upgrade|start_up_grate' \
                  >> /tmp/r96/evidence/R96_BINARY_EVENT_SYMBOL_HITS.txt || true
              done

          sed -n '1,1200p' /tmp/r96/evidence/R96_BINARY_EVENT_STRING_HITS.txt
          echo '--- symbols ---'
          sed -n '1,1200p' /tmp/r96/evidence/R96_BINARY_EVENT_SYMBOL_HITS.txt

      - name: Build focused report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          p=Path('/tmp/r96/evidence')
          dec=json.loads((p/'R96_DECISION.json').read_text())
          chain=json.loads((p/'R96_CHAIN_EVIDENCE.json').read_text())

          lines=[
              '# R96 BP1048P4 USB runtime-to-flashboot event-chain closure',
              '',
              'OFFLINE/STATIC ONLY. No phone/USB/board access, no AA55, no flash.',
              '',
              '## Decision',
              '```json',json.dumps(dec,indent=2),'```','',
              '## Exact start_up_grate(AppResourceUsbDevice) functions',
          ]

          if chain['start_usb_functions']:
              for f in chain['start_usb_functions']:
                  lines += [
                      f"### {f['path']} :: {f['name']} lines {f['start_line']}-{f['end_line']}",
                      '```c',f['text'],'```'
                  ]
          else:
              lines.append('- none found')

          lines += ['','## USB device IN/OUT message functions']
          for f in chain['usb_message_functions'][:60]:
              lines += [
                  f"### {f['path']} :: {f['name']} lines {f['start_line']}-{f['end_line']}",
                  '```c',f['text'],'```'
              ]

          lines += ['','## AppResourceUsbDevice register/deregister functions']
          for f in chain['resource_functions'][:60]:
              lines += [
                  f"### {f['path']} :: {f['name']} lines {f['start_line']}-{f['end_line']}",
                  '```c',f['text'],'```'
              ]

          lines += ['','## Runtime HID command path']
          for f in chain['runtime_hid_functions'][:80]:
              lines += [
                  f"### {f['path']} :: {f['name']} lines {f['start_line']}-{f['end_line']}",
                  '```c',f['text'],'```'
              ]

          lines += [
              '',
              '## Interpretation gate',
              '- The final accepted solution remains Samsung S25+ -> USB-C -> DSP USB-C with the unmodified board.',
              '- R96 does not repeat AA55 and does not run the physical-replug R79 hypothesis.',
              '- A reference-SDK event chain is not accepted as production proof.',
              '- If the only transition to start_up_grate depends on a fresh USB-device resource event, the next task is to find a software-only way to generate that event from the existing USB session; otherwise no live test is authorized.',
              '- FLASH_ALLOWED=NO.',
          ]
          p.joinpath('R96_REPORT.md').write_text('\n'.join(lines)+'\n')
          PY

          sed -n '1,1400p' /tmp/r96/evidence/R96_REPORT.md

      - name: Package evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/r96/evidence && zip -9 -r /tmp/R96_BP1048P4_USB_RUNTIME_FLASHBOOT_CHAIN_EVIDENCE.zip .)
          sha256sum /tmp/R96_BP1048P4_USB_RUNTIME_FLASHBOOT_CHAIN_EVIDENCE.zip \
            > /tmp/R96_BP1048P4_USB_RUNTIME_FLASHBOOT_CHAIN_EVIDENCE.zip.sha256

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R96-BP1048P4-USB-RUNTIME-FLASHBOOT-CHAIN-EVIDENCE
          path: |
            /tmp/R96_BP1048P4_USB_RUNTIME_FLASHBOOT_CHAIN_EVIDENCE.zip
            /tmp/R96_BP1048P4_USB_RUNTIME_FLASHBOOT_CHAIN_EVIDENCE.zip.sha256
          if-no-files-found: error
