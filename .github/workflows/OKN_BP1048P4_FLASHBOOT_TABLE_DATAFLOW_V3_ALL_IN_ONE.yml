name: OKN BP1048P4 Flashboot Table Dataflow V3 - All In One

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: okn-bp1048p4-flashboot-table-dataflow-v3-${{ github.ref }}
  cancel-in-progress: true

env:
  FLASH_ALLOWED: "NO"

jobs:
  table_dataflow:
    name: Trace DFxx bases into E000 command table - NO USB - NO FLASH
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          mkdir -p /tmp/td/evidence
          cat > /tmp/td/evidence/SAFETY.txt <<'EOF'
          MODE=OFFLINE_STATIC_TABLE_DATAFLOW_ONLY
          TARGET=MVSilicon_BP1048P4
          IMAGE=SDK_flash_data_64KiB
          USB_OR_BOARD_CONTACT=NO
          TARGET_FIRMWARE_EXECUTED=NO
          FEATURE_55_SENT=NO
          FEATURE_AA_SENT=NO
          FLASH_READ_EXECUTED=NO
          FLASH_ERASE_EXECUTED=NO
          FLASH_WRITE_EXECUTED=NO
          LIVE_BOOT_ENTRY_AUTHORIZED=NO
          LIVE_FLASH_AUTHORIZED=NO
          FLASH_ALLOWED=NO
          EOF

      - name: Checkout public BP1048 SDK
        uses: actions/checkout@v4
        with:
          repository: leadercxn/bp1048_sdk_v0.1.12
          ref: master
          path: bp1048-sdk
          fetch-depth: 1

      - name: Reconstruct exact flashboot image
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib, json, re, subprocess

          ROOT=Path("bp1048-sdk")
          OUT=Path("/tmp/td/evidence")
          OUT.mkdir(parents=True,exist_ok=True)

          commit=subprocess.check_output(
              ["git","-C",str(ROOT),"rev-parse","HEAD"],text=True
          ).strip()

          src=ROOT/"BT_Audio_APP/bt_audio_app_src/device/flash_boot.c"
          text=src.read_text(errors="replace")

          m=re.search(
              r"(?:static\s+|const\s+|unsigned\s+|signed\s+)*"
              r"(?:char|uint8_t|uint8|u8|BYTE)\s+flash_data\s*"
              r"\[\s*(?P<n>\d+)\s*\]\s*=\s*\{(?P<body>.*?)\};",
              text,re.I|re.S
          )
          assert m,"flash_data missing"
          declared=int(m.group("n"))

          body=re.sub(r"/\*.*?\*/","",m.group("body"),flags=re.S)
          body=re.sub(r"//[^\r\n]*","",body)
          vals=[int(x,16) for x in re.findall(
              r"0[xX]([0-9A-Fa-f]{1,2})\b",body
          )]
          assert declared==65536
          assert len(vals)==65520

          raw=bytes(vals)+bytes(declared-len(vals))
          assert len(raw)==65536
          (OUT/"flash_data_65536.bin").write_bytes(raw)

          # Exact command strings.
          strings=[]
          st=None
          for i,b in enumerate(raw+b"\x00"):
              if 32<=b<=126:
                  if st is None:
                      st=i
              else:
                  if st is not None and i-st>=3:
                      strings.append((st,raw[st:i].decode("ascii",errors="replace")))
                  st=None

          commands={}
          for name in [
              "chiperas","upinfo","btupdat","cnfgdat","constdat","codedata","cxxx"
          ]:
              commands[name]=[off for off,s in strings if s==name]

          # Word dump + dereference around initialized data table.
          table=[]
          string_by_offset={off:s for off,s in strings}
          for pos in range(0xDF00,0xE181,4):
              w=int.from_bytes(raw[pos:pos+4],"little")
              cstr=None
              if 0<=w<len(raw):
                  end=raw.find(b"\x00",w,min(len(raw),w+96))
                  if end>w:
                      try:
                          s=raw[w:end].decode("ascii")
                          if all(32<=ord(ch)<=126 for ch in s):
                              cstr=s
                      except Exception:
                          pass
              table.append({
                  "offset":pos,
                  "word":w,
                  "word_hex":f"0x{w:08X}",
                  "cstring_at_word":cstr,
                  "exact_command":next(
                      (name for name,hits in commands.items() if w in hits),
                      None
                  ),
              })

          prep={
              "revision":"FLASHBOOT_TABLE_DATAFLOW_V3",
              "sdk_commit":commit,
              "image_sha256":hashlib.sha256(raw).hexdigest(),
              "command_offsets":commands,
              "table_words":table,
              "USB_OR_BOARD_CONTACTED":False,
              "LIVE_FLASH_AUTHORIZED":False,
              "FLASH_ALLOWED":False,
          }
          (OUT/"PREP.json").write_text(
              json.dumps(prep,indent=2,ensure_ascii=False)+"\n"
          )

          (OUT/"TABLE_DF00_E180.txt").write_text(
              "\n".join(
                  f"{x['offset']:04X}: {x['word_hex']}"
                  + (f" -> {x['cstring_at_word']!r}" if x["cstring_at_word"] else "")
                  for x in table
              )+"\n"
          )
          PYCODE

      - name: Build GNU NDS32 objdump
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/td/toolchain /tmp/td/build
          cd /tmp/td/toolchain
          URL="https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz"

          if curl -fL --retry 3 --connect-timeout 20 "$URL" -o binutils-2.44.tar.xz; then
            tar -xf binutils-2.44.tar.xz
            cd /tmp/td/build
            if ../toolchain/binutils-2.44/configure \
                --target=nds32le-elf \
                --disable-nls \
                --disable-werror \
                --disable-gdb \
                --disable-gprofng \
                --disable-gas \
                --disable-ld \
                --disable-gold \
                >/tmp/td/evidence/NDS32_BUILD.log 2>&1 &&
               make -j2 all-binutils >>/tmp/td/evidence/NDS32_BUILD.log 2>&1; then
              find /tmp/td/build -type f -name '*objdump' -perm -111 -print \
                > /tmp/td/evidence/OBJDUMP_CANDIDATES.txt
              echo BUILD_STATUS=SUCCESS > /tmp/td/evidence/NDS32_BUILD_STATUS.txt
            else
              echo BUILD_STATUS=FAILED > /tmp/td/evidence/NDS32_BUILD_STATUS.txt
            fi
          else
            echo BUILD_STATUS=DOWNLOAD_FAILED > /tmp/td/evidence/NDS32_BUILD_STATUS.txt
          fi
          exit 0

      - name: Disassemble and trace table accesses
        shell: bash
        run: |
          set -euo pipefail

          OBJDUMP="$(find /tmp/td/build -type f -name '*objdump' -perm -111 | head -1 || true)"
          IMAGE="/tmp/td/evidence/flash_data_65536.bin"
          DIS="/tmp/td/evidence/NDS32_DISASSEMBLY.txt"

          if [ -n "$OBJDUMP" ]; then
            "$OBJDUMP" -D -b binary -m nds32 --adjust-vma=0 "$IMAGE" \
              > "$DIS" 2>/tmp/td/evidence/NDS32_DISASSEMBLY.stderr.txt
            echo DISASM_STATUS=SUCCESS > /tmp/td/evidence/NDS32_DISASM_STATUS.txt
          else
            : > "$DIS"
            echo DISASM_STATUS=NO_OBJDUMP > /tmp/td/evidence/NDS32_DISASM_STATUS.txt
          fi

          python3 - <<'PYCODE'
          from pathlib import Path
          import json,re

          OUT=Path("/tmp/td/evidence")
          raw=(OUT/"flash_data_65536.bin").read_bytes()
          prep=json.loads((OUT/"PREP.json").read_text())
          dlines=(OUT/"NDS32_DISASSEMBLY.txt").read_text(
              errors="replace"
          ).splitlines()

          row_rx=re.compile(
              r"^\s*([0-9A-Fa-f]+):\s+(?:[0-9A-Fa-f]{2,8}\s+)+(.+?)\s*$"
          )
          ins=[]
          for line_no,line in enumerate(dlines,1):
              m=row_rx.match(line)
              if m:
                  ins.append({
                      "line_no":line_no,
                      "addr":int(m.group(1),16),
                      "text":m.group(2).strip(),
                      "raw":line,
                  })

          def pint(s):
              s=s.strip().replace("#","")
              try:
                  return int(s,0)
              except Exception:
                  return None

          reg=r"(\$[A-Za-z0-9]+)"
          imm=r"(-?0x[0-9A-Fa-f]+|-?\d+)"

          movi_rx=re.compile(rf"\bmovi\s+{reg}\s*,\s*#?{imm}",re.I)
          sethi_rx=re.compile(rf"\bsethi\s+{reg}\s*,\s*#?{imm}",re.I)
          addi_rx=re.compile(rf"\baddi\s+{reg}\s*,\s*{reg}\s*,\s*#?{imm}",re.I)
          ori_rx=re.compile(rf"\bori\s+{reg}\s*,\s*{reg}\s*,\s*#?{imm}",re.I)
          add_rx=re.compile(rf"\badd\s+{reg}\s*,\s*{reg}\s*,\s*{reg}",re.I)

          # NDS32 memory form from binutils:
          # lwi $rt,[$ra + imm], lhi/lbi/lbsi/lhsi and stores.
          mem_rx=re.compile(
              rf"\b(?P<op>lwi|lhi|lbi|lbsi|lhsi|swi|shi|sbi)"
              rf"(?:\.[A-Za-z0-9]+)?\s+"
              rf"(?P<rt>\$[A-Za-z0-9]+)\s*,\s*"
              rf"\[(?P<ra>\$[A-Za-z0-9]+)"
              rf"(?:\s*\+\s*#?(?P<off>-?0x[0-9A-Fa-f]+|-?\d+))?\]",
              re.I
          )

          call_rx=re.compile(
              r"\b(jal|jral|jr|j|beq|bne|beqz|bnez|bgez|bltz|bgtz|blez)\b",
              re.I
          )

          command_offsets={}
          for name,hits in prep["command_offsets"].items():
              for off in hits:
                  command_offsets[off]=name

          # Seed every exact MOVI to the DFxx/E0xx initialized-data region.
          seeds=[]
          for idx,x in enumerate(ins):
              m=movi_rx.search(x["text"])
              if not m:
                  continue
              rd,val_s=m.groups()
              val=pint(val_s)
              if val is not None and 0xDF00 <= (val & 0xffffffff) <= 0xE180:
                  seeds.append({
                      "idx":idx,"addr":x["addr"],"reg":rd,
                      "base":val & 0xffffffff,"text":x["text"]
                  })

          traces=[]
          table_hits=[]

          for seed in seeds:
              regs={seed["reg"]:seed["base"]}
              events=[]

              # Follow a bounded straight-line window. We retain branches/calls
              # as context but do not jump across them.
              for j in range(seed["idx"],min(len(ins),seed["idx"]+70)):
                  x=ins[j]
                  t=x["text"]

                  # Register constructors.
                  mm=movi_rx.search(t)
                  if mm:
                      rd,vs=mm.groups()
                      v=pint(vs)
                      if v is not None:
                          regs[rd]=v & 0xffffffff

                  sm=sethi_rx.search(t)
                  if sm:
                      rd,vs=sm.groups()
                      v=pint(vs)
                      if v is not None:
                          regs[rd]=((v & 0xfffff)<<12)&0xffffffff

                  am=addi_rx.search(t)
                  if am:
                      rd,ra,vs=am.groups()
                      v=pint(vs)
                      if ra in regs and v is not None:
                          regs[rd]=(regs[ra]+v)&0xffffffff
                      elif rd in regs:
                          regs.pop(rd,None)

                  om=ori_rx.search(t)
                  if om:
                      rd,ra,vs=om.groups()
                      v=pint(vs)
                      if ra in regs and v is not None:
                          regs[rd]=(regs[ra] | (v & 0x7fff))&0xffffffff
                      elif rd in regs:
                          regs.pop(rd,None)

                  ad=add_rx.search(t)
                  if ad:
                      rd,ra,rb=ad.groups()
                      if ra in regs and rb in regs:
                          regs[rd]=(regs[ra]+regs[rb])&0xffffffff
                      elif rd in regs:
                          regs.pop(rd,None)

                  mmem=mem_rx.search(t)
                  if mmem:
                      op=mmem.group("op").lower()
                      rt=mmem.group("rt")
                      ra=mmem.group("ra")
                      off=pint(mmem.group("off") or "0")
                      if off is None:
                          off=0

                      if ra in regs:
                          base=regs[ra]
                          # Test textual offset as bytes, and also ISA-scaled
                          # interpretation. Report whichever reaches our table.
                          scale=4 if op in ("lwi","swi") else 2 if op in ("lhi","lhsi","shi") else 1
                          ea_candidates=[]
                          for mode,ea in [
                              ("text_as_bytes",(base+off)&0xffffffff),
                              ("scaled",(base+off*scale)&0xffffffff),
                          ]:
                              if ea not in [z[1] for z in ea_candidates]:
                                  ea_candidates.append((mode,ea))

                          chosen=None
                          for mode,ea in ea_candidates:
                              if 0xDF00 <= ea <= 0xE180:
                                  chosen=(mode,ea)
                                  # Prefer a candidate that specifically lands
                                  # in the known E000 command-table neighborhood.
                                  if 0xE000 <= ea <= 0xE060:
                                      break

                          if chosen:
                              mode,ea=chosen
                              ev={
                                  "instruction_addr":x["addr"],
                                  "instruction":t,
                                  "op":op,
                                  "base_reg":ra,
                                  "base_value":base,
                                  "offset_text":off,
                                  "effective_mode":mode,
                                  "effective_address":ea,
                              }

                              if op.startswith("l") and ea < len(raw):
                                  if op=="lwi" and ea+4<=len(raw):
                                      val=int.from_bytes(raw[ea:ea+4],"little")
                                      ev["loaded_value"]=val
                                      ev["loaded_value_hex"]=f"0x{val:08X}"
                                      if val in command_offsets:
                                          ev["loaded_command_pointer"]=command_offsets[val]
                                      if 0<=val<len(raw):
                                          end=raw.find(b"\x00",val,min(len(raw),val+64))
                                          if end>val:
                                              try:
                                                  s=raw[val:end].decode("ascii")
                                                  if s and all(32<=ord(ch)<=126 for ch in s):
                                                      ev["loaded_cstring"]=s
                                              except Exception:
                                                  pass
                                      regs[rt]=val
                                  elif op in ("lbi","lbsi"):
                                      regs[rt]=raw[ea]
                                  elif op in ("lhi","lhsi") and ea+2<=len(raw):
                                      regs[rt]=int.from_bytes(raw[ea:ea+2],"little")
                              elif op.startswith("s"):
                                  ev["store_value_known"]=regs.get(rt)

                              events.append(ev)
                              if 0xE000 <= ea <= 0xE060:
                                  table_hits.append({
                                      "seed_addr":seed["addr"],
                                      "seed_base":seed["base"],
                                      **ev
                                  })

                  if call_rx.search(t):
                      events.append({
                          "instruction_addr":x["addr"],
                          "control_transfer":t,
                      })

              traces.append({
                  "seed":seed,
                  "events":events,
              })

          # For every table hit, save raw disassembly +/- 24 instructions.
          snippets=[]
          by_addr={x["addr"]:i for i,x in enumerate(ins)}
          for n,h in enumerate(table_hits):
              idx=by_addr.get(h["instruction_addr"])
              if idx is None:
                  continue
              rows=ins[max(0,idx-24):min(len(ins),idx+25)]
              txt="\n".join(r["raw"] for r in rows)
              snippets.append({
                  "hit":h,
                  "text":txt,
              })
              (OUT/f"TABLE_HIT_{n:02d}_{h['instruction_addr']:04X}.asm").write_text(
                  txt+"\n"
              )

          result={
              "seed_count":len(seeds),
              "seeds":seeds,
              "traces":traces,
              "e000_e060_table_hits":table_hits,
              "snippet_count":len(snippets),
          }
          (OUT/"TABLE_DATAFLOW.json").write_text(
              json.dumps(result,indent=2,ensure_ascii=False)+"\n"
          )

          md=[
              "# BP1048P4 Flashboot Table Dataflow V3",
              "",
              f"64 KiB SHA256: `{prep['image_sha256']}`",
              "",
              "## DFxx/E0xx base-load seeds",
          ]
          for s in seeds:
              md.append(
                  f"- `0x{s['addr']:04X}` `{s['text']}` → base `0x{s['base']:04X}`"
              )
          if not seeds:
              md.append("- none")

          md+=["","## Proven/possible accesses into 0xE000–0xE060"]
          if table_hits:
              for h in table_hits[:120]:
                  extra=[]
                  if "loaded_value_hex" in h:
                      extra.append(h["loaded_value_hex"])
                  if "loaded_cstring" in h:
                      extra.append(repr(h["loaded_cstring"]))
                  if "loaded_command_pointer" in h:
                      extra.append("COMMAND="+h["loaded_command_pointer"])
                  suffix=(" → "+", ".join(extra)) if extra else ""
                  md.append(
                      f"- seed `0x{h['seed_addr']:04X}`; insn `0x{h['instruction_addr']:04X}` "
                      f"`{h['instruction']}` → EA `0x{h['effective_address']:04X}` "
                      f"({h['effective_mode']}){suffix}"
                  )
          else:
              md.append("- none recovered in bounded straight-line traces")

          md+=["","## Command-pointer loads recovered"]
          cmdhits=[h for h in table_hits if "loaded_command_pointer" in h]
          if cmdhits:
              for h in cmdhits:
                  md.append(
                      f"- `0x{h['instruction_addr']:04X}` loads "
                      f"`{h['loaded_command_pointer']}` from table "
                      f"`0x{h['effective_address']:04X}`"
                  )
          else:
              md.append("- none")

          md+=["","## Interpretation"]
          md.append("- This run follows actual register values from DFxx/E0xx base loads into memory operands; it does not use fuzzy string-address matching.")
          md.append("- NDS32 `lwi/lhi/lbi` addressing is checked under both textual-byte and ISA-scaled interpretations; only accesses landing in the initialized-data window are retained.")
          md.append("- `upinfo`/`cxxx` are still not authorized unless a handler path is recovered and shown not to reach erase/program operations.")
          md.append("- USB/board contacted: **NO**")
          md.append("- Flash read/erase/write: **NO**")
          md.append("- `FLASH_ALLOWED=NO`")

          (OUT/"TABLE_DATAFLOW_SUMMARY.md").write_text("\n".join(md)+"\n")
          PYCODE

      - name: Publish summary
        shell: bash
        run: |
          set -euo pipefail
          cat /tmp/td/evidence/TABLE_DATAFLOW_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Package evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/td/evidence
          zip -9 -r /tmp/OKN_BP1048P4_TABLE_DATAFLOW_V3_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/OKN_BP1048P4_TABLE_DATAFLOW_V3_EVIDENCE.zip \
            > /tmp/OKN_BP1048P4_TABLE_DATAFLOW_V3_EVIDENCE.zip.sha256

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: OKN-BP1048P4-TABLE-DATAFLOW-V3-EVIDENCE
          path: |
            /tmp/OKN_BP1048P4_TABLE_DATAFLOW_V3_EVIDENCE.zip
            /tmp/OKN_BP1048P4_TABLE_DATAFLOW_V3_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/td/evidence/PREP.json"))
          assert d["USB_OR_BOARD_CONTACTED"] is False
          assert d["LIVE_FLASH_AUTHORIZED"] is False
          assert d["FLASH_ALLOWED"] is False
          print("TABLE_DATAFLOW_V3_FAIL_CLOSED_GATE=PASS")
          PY
          echo FLASH_ALLOWED=NO
