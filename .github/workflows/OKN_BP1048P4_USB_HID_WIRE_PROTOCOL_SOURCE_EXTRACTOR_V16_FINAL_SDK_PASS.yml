name: OKN BP1048P4 USB HID Wire Protocol Source Extractor V16 - Final SDK Pass

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: okn-bp1048p4-usb-hid-wire-v16-${{ github.ref }}
  cancel-in-progress: true

env:
  FLASH_ALLOWED: "NO"

jobs:
  wire_protocol:
    name: Recover exact runtime USB HID frame from source - NO USB - NO FLASH
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          mkdir -p /tmp/v16/evidence
          cat > /tmp/v16/evidence/SAFETY.txt <<'EOF'
          MODE=OFFLINE_SOURCE_ONLY
          TARGET=MVSilicon_BP1048P4
          USB_OR_BOARD_CONTACT=NO
          TARGET_FIRMWARE_EXECUTED=NO
          FEATURE_55_SENT=NO
          FEATURE_AA_SENT=NO
          FLASH_READ_EXECUTED=NO
          FLASH_ERASE_EXECUTED=NO
          FLASH_WRITE_EXECUTED=NO
          LIVE_BOOT_ENTRY_AUTHORIZED=NO
          LIVE_FLASH_AUTHORIZED=NO
          FLASH_ALLOWED=NO
          EOF

      - name: Checkout public BP1048 SDK
        uses: actions/checkout@v4
        with:
          repository: leadercxn/bp1048_sdk_v0.1.12
          ref: master
          path: bp1048-sdk
          fetch-depth: 1

      - name: Extract exact communication source and HID driver paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re, subprocess

          ROOT=Path("bp1048-sdk")
          OUT=Path("/tmp/v16/evidence")
          COMM=ROOT/"BT_Audio_APP/bt_audio_app_src/audio/communication.c"
          assert COMM.exists(), COMM

          text=COMM.read_text(errors="replace")
          (OUT/"communication.c.full.txt").write_text(text)

          # Exact known anchors from V15.
          anchors=[
              "tx_buf",
              "communic_buf",
              "0xa5",
              "0x5a",
              "CFG_COMMUNICATION_BY_USB",
              "CFG_COMMUNICATION_BY_UART",
              "USB",
              "HID",
              "crc",
              "CRC",
              "checksum",
              "send",
              "recv",
              "receive",
              "write",
              "read",
          ]

          lines=text.splitlines()
          blocks=[]
          for i,line in enumerate(lines):
              low=line.lower()
              if any(a.lower() in low for a in anchors):
                  lo=max(0,i-10)
                  hi=min(len(lines),i+15)
                  blocks.append(
                      f"### communication.c:{i+1}\n" +
                      "\n".join(f"{j+1:5d}: {lines[j]}" for j in range(lo,hi))
                  )
          (OUT/"communication.focus.txt").write_text("\n\n".join(blocks)+"\n")

          # Find all likely function definitions in communication.c.
          func_rx=re.compile(
              r"(?m)^[ \t]*(?:static[ \t]+)?"
              r"(?:void|bool|int|int8_t|int16_t|int32_t|uint8_t|uint16_t|uint32_t|size_t)"
              r"[ \t]+([A-Za-z_][A-Za-z0-9_]*)[ \t]*\([^;]*\)[ \t]*\{"
          )
          funcs=[]
          for m in func_rx.finditer(text):
              name=m.group(1)
              start=text[:m.start()].count("\n")+1
              funcs.append((name,start))
          (OUT/"communication.functions.txt").write_text(
              "\n".join(f"{ln:5d} {name}" for name,ln in funcs)+"\n"
          )

          # Extract every function containing a protocol-relevant token.
          protocol_tokens=[
              "tx_buf","communic_buf","0xa5","0x5a",
              "CFG_COMMUNICATION_BY_USB","CFG_COMMUNICATION_BY_UART",
              "crc","CRC","checksum"
          ]
          function_bodies=[]
          for idx,(name,start_line) in enumerate(funcs):
              start_idx=sum(len(x)+1 for x in lines[:start_line-1])
              end_line=funcs[idx+1][1]-1 if idx+1<len(funcs) else len(lines)
              body="\n".join(lines[start_line-1:end_line])
              if any(tok.lower() in body.lower() for tok in protocol_tokens):
                  function_bodies.append(
                      f"===== FUNCTION {name} @ line {start_line} =====\n{body}"
                  )
          (OUT/"communication.protocol_functions.txt").write_text(
              "\n\n".join(function_bodies)+"\n"
          )

          # Search entire SDK for direct USB/HID communication APIs and the 256/512 buffers.
          patterns=[
              r"\bCFG_COMMUNICATION_BY_USB\b",
              r"\bCFG_COMMUNICATION_METHID\b",
              r"\bHID_DATA_FUN_EN\b",
              r"\bRequest\s*\[\s*256\s*\]",
              r"\btx_buf\s*\[\s*256\s*\]",
              r"\bcommunic_buf\s*\[\s*512\s*\]",
              r"\b[A-Za-z_][A-Za-z0-9_]*(?:Hid|HID|Usb|USB)[A-Za-z0-9_]*\s*\(",
              r"\bOTG_Device[A-Za-z0-9_]*\s*\(",
          ]

          hits=[]
          source_files=[]
          for p in ROOT.rglob("*"):
              if not p.is_file() or ".git" in p.parts:
                  continue
              try:
                  if p.stat().st_size > 1_500_000:
                      continue
                  s=p.read_text(errors="replace")
              except Exception:
                  continue
              if not any(re.search(rx,s,re.I) for rx in patterns):
                  continue
              source_files.append(str(p.relative_to(ROOT)))
              sl=s.splitlines()
              for i,line in enumerate(sl):
                  matched=[rx for rx in patterns if re.search(rx,line,re.I)]
                  if matched:
                      lo=max(0,i-7)
                      hi=min(len(sl),i+10)
                      hits.append({
                          "file":str(p.relative_to(ROOT)),
                          "line":i+1,
                          "matched":matched,
                          "context":"\n".join(
                              f"{j+1:5d}: {sl[j]}" for j in range(lo,hi)
                          )
                      })

          (OUT/"sdk_usb_hid_hits.txt").write_text(
              "\n\n".join(
                  f"### {h['file']}:{h['line']}\n{h['context']}" for h in hits
              )+"\n"
          )

          # Derive candidate API call names from USB/HID lines.
          api_names=set()
          for h in hits:
              for line in h["context"].splitlines():
                  for name in re.findall(
                      r"\b([A-Za-z_][A-Za-z0-9_]*(?:Hid|HID|Usb|USB)[A-Za-z0-9_]*)\s*\(",
                      line
                  ):
                      api_names.add(name)

          # Pull all source contexts for each candidate API.
          api_contexts=[]
          for api in sorted(api_names):
              rx=re.compile(r"\b"+re.escape(api)+r"\s*\(")
              for p in ROOT.rglob("*"):
                  if not p.is_file() or ".git" in p.parts:
                      continue
                  try:
                      if p.stat().st_size > 1_500_000:
                          continue
                      sl=p.read_text(errors="replace").splitlines()
                  except Exception:
                      continue
                  for i,line in enumerate(sl):
                      if rx.search(line):
                          lo=max(0,i-8)
                          hi=min(len(sl),i+12)
                          api_contexts.append({
                              "api":api,
                              "file":str(p.relative_to(ROOT)),
                              "line":i+1,
                              "context":"\n".join(
                                  f"{j+1:5d}: {sl[j]}" for j in range(lo,hi)
                              )
                          })

          (OUT/"candidate_usb_hid_api_contexts.txt").write_text(
              "\n\n".join(
                  f"### {h['api']} — {h['file']}:{h['line']}\n{h['context']}"
                  for h in api_contexts
              )+"\n"
          )

          # Search specifically for code touching communication buffers.
          buf_terms=["tx_buf","communic_buf","Request"]
          buf_hits=[]
          for p in ROOT.rglob("*"):
              if not p.is_file() or ".git" in p.parts:
                  continue
              try:
                  if p.stat().st_size > 1_500_000:
                      continue
                  sl=p.read_text(errors="replace").splitlines()
              except Exception:
                  continue
              for i,line in enumerate(sl):
                  if any(re.search(r"\b"+re.escape(t)+r"\b",line) for t in buf_terms):
                      lo=max(0,i-12)
                      hi=min(len(sl),i+18)
                      buf_hits.append({
                          "file":str(p.relative_to(ROOT)),
                          "line":i+1,
                          "context":"\n".join(
                              f"{j+1:5d}: {sl[j]}" for j in range(lo,hi)
                          )
                      })
          (OUT/"buffer_use_contexts.txt").write_text(
              "\n\n".join(
                  f"### {h['file']}:{h['line']}\n{h['context']}" for h in buf_hits
              )+"\n"
          )

          # Extract packet constants in communication.c.
          numeric=[]
          for ln,line in enumerate(lines,1):
              vals=re.findall(r"0x[0-9A-Fa-f]+|\b\d+\b",line)
              if vals and any(k in line.lower() for k in (
                  "tx_buf","communic","len","crc","sum","cmd","data"
              )):
                  numeric.append({
                      "line":ln,
                      "text":line.strip(),
                      "values":vals
                  })

          summary={
              "sdk_commit":subprocess.check_output(
                  ["git","-C",str(ROOT),"rev-parse","HEAD"],text=True
              ).strip(),
              "communication_sha256":hashlib.sha256(text.encode()).hexdigest(),
              "candidate_api_names":sorted(api_names),
              "protocol_function_count":len(function_bodies),
              "usb_hid_hit_count":len(hits),
              "buffer_use_hit_count":len(buf_hits),
              "numeric_protocol_lines":numeric[:500],
              "USB_OR_BOARD_CONTACTED":False,
              "LIVE_FLASH_AUTHORIZED":False,
              "FLASH_ALLOWED":False
          }
          (OUT/"WIRE_PROTOCOL_SOURCE.json").write_text(
              json.dumps(summary,indent=2,ensure_ascii=False)+"\n"
          )

          md=[
              "# BP1048P4 USB HID Wire Protocol Source Extractor V16",
              "",
              f"SDK commit: `{summary['sdk_commit']}`",
              "",
              "## Known runtime communication buffers",
          ]

          for i,line in enumerate(lines,1):
              if "tx_buf[256]" in line.replace(" ","") or "communic_buf[512]" in line.replace(" ",""):
                  md.append(f"- `communication.c:{i}` `{line.strip()}`")
          # More tolerant explicit anchors:
          for i,line in enumerate(lines,1):
              compact=re.sub(r"\s+","",line)
              if "tx_buf[256]" in compact or "communic_buf[512]" in compact:
                  entry=f"- `communication.c:{i}` `{line.strip()}`"
                  if entry not in md:
                      md.append(entry)

          md += [
              "",
              "## Candidate USB/HID API names",
          ]
          if api_names:
              for api in sorted(api_names):
                  md.append(f"- `{api}`")
          else:
              md.append("- none recovered")

          md += [
              "",
              "## Protocol-relevant functions in communication.c",
          ]
          if function_bodies:
              for block in function_bodies:
                  header=block.splitlines()[0]
                  md.append(f"- `{header.replace('=====','').strip()}`")
          else:
              md.append("- none")

          md += [
              "",
              "## Exact packet/protocol lines in communication.c",
          ]
          important=[]
          for i,line in enumerate(lines,1):
              low=line.lower()
              if any(k in low for k in (
                  "tx_buf","communic_buf","0xa5","0x5a",
                  "crc","checksum","cfg_communication_by_usb"
              )):
                  important.append((i,line.strip()))
          for i,line in important[:180]:
              md.append(f"- `{i}` `{line}`")

          md += [
              "",
              "## Candidate USB/HID source contexts",
          ]
          for h in api_contexts[:60]:
              md.append(f"### `{h['api']}` — `{h['file']}:{h['line']}`")
              for row in h["context"].splitlines():
                  md.append("    "+row)

          md += [
              "",
              "## Communication-buffer use contexts",
          ]
          for h in buf_hits[:45]:
              md.append(f"### `{h['file']}:{h['line']}`")
              for row in h["context"].splitlines():
                  md.append("    "+row)

          md += [
              "",
              "## Decision",
              "- This is the final broad SDK pass.",
              "- If this source exposes the exact HID send/receive API and frame layout, the next step is Android implementation rather than another reverse-engineering workflow.",
              "- If it does not expose the production frame, SDK scanning stops and the Windows GoloPine client becomes the sole protocol source.",
              "- USB/board contacted: **NO**",
              "- Flash read/erase/write executed: **NO**",
              "- `FLASH_ALLOWED=NO`",
          ]
          (OUT/"WIRE_PROTOCOL_SOURCE_SUMMARY.md").write_text("\n".join(md)+"\n")
          PY

      - name: Publish summary
        shell: bash
        run: |
          set -euo pipefail
          cat /tmp/v16/evidence/WIRE_PROTOCOL_SOURCE_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Package evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v16/evidence
          zip -9 -r /tmp/OKN_BP1048P4_USB_HID_WIRE_PROTOCOL_V16_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/OKN_BP1048P4_USB_HID_WIRE_PROTOCOL_V16_EVIDENCE.zip \
            > /tmp/OKN_BP1048P4_USB_HID_WIRE_PROTOCOL_V16_EVIDENCE.zip.sha256

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: OKN-BP1048P4-USB-HID-WIRE-PROTOCOL-V16-EVIDENCE
          path: |
            /tmp/OKN_BP1048P4_USB_HID_WIRE_PROTOCOL_V16_EVIDENCE.zip
            /tmp/OKN_BP1048P4_USB_HID_WIRE_PROTOCOL_V16_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/v16/evidence/WIRE_PROTOCOL_SOURCE.json"))
          assert d["USB_OR_BOARD_CONTACTED"] is False
          assert d["LIVE_FLASH_AUTHORIZED"] is False
          assert d["FLASH_ALLOWED"] is False
          print("USB_HID_WIRE_PROTOCOL_V16_GATE=PASS")
          PY
          echo FLASH_ALLOWED=NO
