name: OKN Cleanup Old Workflows - ONE SHOT

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/OKN_CLEANUP_OLD_WORKFLOWS_ONE_SHOT.yml'

permissions:
  contents: write

jobs:
  cleanup:
    name: Delete superseded workflows and self-remove
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Verify workflows that must be kept
        shell: bash
        run: |
          set -euo pipefail

          KEEP_R60=".github/workflows/OKN_BP1048P4_R60_EVIDENCE_GATE_S25_USB_C_ONLY_FIXED_V3.yml"
          KEEP_BUILD=".github/workflows/OKN_DSP_AutoBuild.yml"

          test -f "$KEEP_R60" || {
            echo "ERROR: required keeper missing: $KEEP_R60"
            exit 1
          }

          test -f "$KEEP_BUILD" || {
            echo "ERROR: required keeper missing: $KEEP_BUILD"
            exit 1
          }

          echo "KEEP: $KEEP_R60"
          echo "KEEP: $KEEP_BUILD"

      - name: Delete superseded workflow files
        shell: bash
        run: |
          set -euo pipefail

          files=(
            ".github/workflows/OKN_BP1048P4_R59_ONE_SHOT_MASTER_S25_USB_C_ONLY_FIXED_V2.yml"
            ".github/workflows/OKN_BP1048P4_R60_EVIDENCE_GATE_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_BP1048P4_R60_EVIDENCE_GATE_S25_USB_C_ONLY_FIXED.yml"
            ".github/workflows/OKN_BP1048P4_R60_EVIDENCE_GATE_S25_USB_C_ONLY_FIXED_V2.yml"
            ".github/workflows/OKN_BP1048P4_V21_FIXED_USB_C_ONLY_ALL_IN_ONE_FINAL_STATIC_ANDROID_GENERATOR.yml"
            ".github/workflows/OKN_BP1048P4_V23_ONE_CLICK_S25_USB_C_ONLY_ANDROID_FIRMWARE_TOOL.yml"
            ".github/workflows/OKN_BP1048P4_V24_FIXED_ONE_CLICK_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_BP1048P4_V25_FIXED_SAFETY_CHECK_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_BP1048P4_V26_READ_ONLY_USB_DIAGNOSTIC_S25.yml"
            ".github/workflows/OKN_BP1048P4_V27_VERSION_QUERY_ONLY_S25_USB_C.yml"
            ".github/workflows/OKN_BP1048P4_V28_HID_INPUT_TRANSPORT_DIAGNOSTIC_S25_USB_C.yml"
            ".github/workflows/OKN_BP1048P4_V29_ONE_CLICK_FINAL_DIAGNOSTIC_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_BP1048P4_V30_FINAL_MASTER_GATE_S25_USB_C_ONLY.yml"
          )

          echo "Deleting superseded workflows..."
          for f in "${files[@]}"; do
            if [[ -e "$f" ]]; then
              echo "DELETE: $f"
              rm -f -- "$f"
            else
              echo "SKIP (already missing): $f"
            fi
          done

          # One-shot cleanup: remove this cleanup workflow too.
          SELF=".github/workflows/OKN_CLEANUP_OLD_WORKFLOWS_ONE_SHOT.yml"
          if [[ -e "$SELF" ]]; then
            echo "DELETE SELF: $SELF"
            rm -f -- "$SELF"
          fi

      - name: Safety check before commit
        shell: bash
        run: |
          set -euo pipefail

          test -f ".github/workflows/OKN_BP1048P4_R60_EVIDENCE_GATE_S25_USB_C_ONLY_FIXED_V3.yml"
          test -f ".github/workflows/OKN_DSP_AutoBuild.yml"

          echo
          echo "Remaining workflows:"
          find .github/workflows -maxdepth 1 -type f -name '*.yml' -printf '%f\n' | sort

          echo
          echo "Git changes:"
          git status --short

      - name: Commit and push cleanup
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet && git diff --cached --quiet; then
            echo "Nothing to delete."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A .github/workflows
          git commit -m "cleanup: remove superseded DSP workflows"
          git push origin HEAD:${GITHUB_REF_NAME}
