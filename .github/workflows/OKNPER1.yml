# OKNPER1 - clean-room single-file GitHub Actions build
# Generates the Android project from this workflow, runs protocol/preflight checks, builds and uploads APK.
# Verified scope only: AB00/AB01/AB02/AB03, Auth/RandKey, scalar allow-list, PEAKING EQ, manual SaveParams.
name: Build OKNPER1

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - ".github/workflows/OKNPER1.yml"

permissions:
  contents: read

concurrency:
  group: oknper1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          {
            echo 'OKNPER1 build diagnostics'
            echo "UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Commit: ${GITHUB_SHA:-unknown}"
            echo "Runner: ${RUNNER_OS:-unknown} ${RUNNER_ARCH:-unknown}"
          } > dist/ci-context.txt

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          sdkmanager --list_installed | grep -E "platforms;android-35|build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

