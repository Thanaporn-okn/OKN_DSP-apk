          test -f app/src/main/java/com/okn/oknper1/BleEngine.java
          test -f app/src/main/java/com/okn/oknper1/DspProtocol.java
          grep -q '0000ab00-0000-1000-8000-00805f9b34fb' app/src/main/java/com/okn/oknper1/BleEngine.java
          grep -q '0000ab01-0000-1000-8000-00805f9b34fb' app/src/main/java/com/okn/oknper1/BleEngine.java
          grep -q '0000ab02-0000-1000-8000-00805f9b34fb' app/src/main/java/com/okn/oknper1/BleEngine.java
          grep -q '0000ab03-0000-1000-8000-00805f9b34fb' app/src/main/java/com/okn/oknper1/BleEngine.java
          grep -q '631C062443FD3844558001F3EDA0CCF8' app/src/main/java/com/okn/oknper1/SessionCrypto.java
          grep -q '2AAF948632A59FF8F2B23E6E4193FD21' app/src/main/java/com/okn/oknper1/SessionCrypto.java
          grep -q 'AES/CFB8/NoPadding' app/src/main/java/com/okn/oknper1/SessionCrypto.java
          grep -q 'SCALAR_IDS = {2,3,8,9,10,13,11}' app/src/main/java/com/okn/oknper1/DspProtocol.java
          grep -q 'EQ_IDS = {4,5,6,14,15,16,17}' app/src/main/java/com/okn/oknper1/DspProtocol.java
          grep -q '570000000700000000' app/src/main/java/com/okn/oknper1/DspProtocol.java
          grep -q 'type != 12' app/src/main/java/com/okn/oknper1/DspProtocol.java
          grep -q 'versionCode 1' app/build.gradle
          grep -q "versionName '1.0.0'" app/build.gradle
          if grep -R -E 'AA55|genericWrite|writeUnknown|CrossoverWrite|DelayWrite|PresetWrite' app/src/main/java; then
            echo 'Forbidden/unverified write surface detected'
            exit 1
          fi
          echo 'OKNPER1 safety invariants: PASS'

      - name: Run protocol smoke vectors
        shell: bash
        run: |
          set -euo pipefail
          javac tools/ProtocolSmoke.java
          java -cp tools ProtocolSmoke | tee dist/protocol-smoke.txt

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --version | tee dist/gradle-version.txt
          gradle --no-daemon --stacktrace --warning-mode all clean assembleDebug 2>&1 | tee dist/build.log

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          cp "$APK" dist/OKNPER1-debug.apk
          AAPT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/build-tools/35.0.0/aapt2"
          "$AAPT" dump badging "$APK" | tee dist/apk-badging.txt
          grep -q "package: name='com.okn.oknper1.debug'" dist/apk-badging.txt
          grep -q "versionCode='1'" dist/apk-badging.txt
          grep -q "versionName='1.0.0-debug'" dist/apk-badging.txt
          grep -q "application-label:'OKNPER1'" dist/apk-badging.txt
          sha256sum dist/OKNPER1-debug.apk | tee dist/SHA256SUMS.txt

      - name: Package generated source
        shell: bash
        run: |
          set -euo pipefail
          zip -qr dist/OKNPER1-source.zip settings.gradle build.gradle gradle.properties app tools
          sha256sum dist/OKNPER1-source.zip >> dist/SHA256SUMS.txt

      - name: Upload OKNPER1
        uses: actions/upload-artifact@v7
        with:
          name: OKNPER1
          path: |
            dist/OKNPER1-debug.apk
            dist/OKNPER1-source.zip
            dist/SHA256SUMS.txt
            dist/apk-badging.txt
            dist/protocol-smoke.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OKNPER1-diagnostics
          path: |
            dist/ci-context.txt
            dist/build.log
            dist/gradle-version.txt
            dist/apk-badging.txt
            dist/protocol-smoke.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo '# OKNPER1'
            echo
            if [ -s dist/OKNPER1-debug.apk ]; then
              echo '✅ APK generated successfully.'
              echo 'Artifact: **OKNPER1**'
            else
              echo '❌ APK was not generated.'
              echo 'Download **OKNPER1-diagnostics** and inspect build.log.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
