name: OKN BP1048P4 MASTER V28 USBHID HIDINTERFACE JIT FRAMING RECOVERY OFFLINE

"on":
  workflow_dispatch:

permissions:
  contents: read

env:
  GOLOPINE_WINDOWS_URL: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-08.exe_.zip"
  EXPECTED_VENDOR_SHA256: "3ca54171c53f7badd963ffe6851b8b3e2faf8aee8ba2afcb7040990e22ae09b2"

  LIVE_DSP_CONNECTED: "NO"
  USB_TARGET_ACCESS: "NO"
  HOST_TO_DSP_IO: "NO"
  REAL_HID_OBJECT_ALLOWED: "NO"
  REAL_HID_CONNECT_ALLOWED: "NO"
  REAL_HID_SEND_ALLOWED: "NO"
  REAL_HID_READ_ALLOWED: "NO"
  REAL_HID_WRITE_ALLOWED: "NO"
  FEATURE_REPORT_ALLOWED: "NO"
  FLASH_ALLOWED: "NO"
  ERASE_ALLOWED: "NO"
  WRITE_ALLOWED: "NO"

jobs:
  master-v28:
    name: Capture USBHID.Write and HIDInterface.Send runtime JIT OFFLINE
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Safety gate and workspace
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"

          foreach($n in @(
            "LIVE_DSP_CONNECTED","USB_TARGET_ACCESS","HOST_TO_DSP_IO",
            "REAL_HID_OBJECT_ALLOWED","REAL_HID_CONNECT_ALLOWED",
            "REAL_HID_SEND_ALLOWED","REAL_HID_READ_ALLOWED","REAL_HID_WRITE_ALLOWED",
            "FEATURE_REPORT_ALLOWED","FLASH_ALLOWED","ERASE_ALLOWED","WRITE_ALLOWED"
          )){
            if((Get-Item "Env:$n").Value -ne "NO"){ throw "$n must remain NO" }
          }

          $root="C:\okn_v28"
          if(Test-Path $root){ Remove-Item -Recurse -Force $root }
          New-Item -ItemType Directory -Force -Path `
            "$root\download","$root\pkg","$root\harness","$root\evidence","$root\out" | Out-Null

          @"
          REVISION=MASTER-V28
          MODE=OFFLINE_RUNTIME_JIT_TRANSPORT_FRAMING_RECOVERY
          TARGET_1=DSTech_AudioDSP_Client.USBHID.Write(Byte[])
          TARGET_2=DSTech_AudioDSP_Client.HIDInterface.Send(Byte[])
          REAL_HID_IO=NO
          HOST_TO_DSP_IO=NO
          FEATURE_REPORT=NO
          FLASH_ALLOWED=NO
          ERASE_ALLOWED=NO
          WRITE_ALLOWED=NO
          "@ | Set-Content "$root\evidence\00_SCOPE.txt"

      - name: Acquire exact official vendor binary
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v28"

          curl.exe -fL --retry 6 --retry-all-errors --retry-delay 2 `
            --connect-timeout 20 --max-time 300 `
            $env:GOLOPINE_WINDOWS_URL -o "$root\download\vendor.zip"
          if($LASTEXITCODE -ne 0){ throw "vendor download failed" }

          Expand-Archive -Force "$root\download\vendor.zip" "$root\pkg"

          $exe=Get-ChildItem "$root\pkg" -Recurse -File -Filter *.exe |
            Where-Object {$_.FullName -notmatch '\\__MACOSX\\' -and $_.Name -notlike '._*'} |
            Sort-Object Length -Descending | Select-Object -First 1

          if(-not $exe){ throw "vendor EXE missing" }
          Copy-Item $exe.FullName "$root\vendor.exe" -Force

          $sha=(Get-FileHash "$root\vendor.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne $env:EXPECTED_VENDOR_SHA256){ throw "vendor SHA changed: $sha" }

          @"
          SHA256=$sha
          ORIGINAL_BINARY_MODIFIED=NO
          "@ | Set-Content "$root\evidence\01_VENDOR_IDENTITY.txt"

      - name: Build x86 runtime JIT capture probe
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v28"

          @'
          using System;
          using System.IO;
          using System.Linq;
          using System.Reflection;
          using System.Runtime.CompilerServices;
          using System.Runtime.InteropServices;
          using System.Collections.Generic;

          public static class Probe
          {
              static string OutPath;

              static void Log(string s)
              {
                  File.AppendAllText(OutPath,s+Environment.NewLine);
              }

              static string Hex(byte[] b)
              {
                  if(b==null)return "<NULL>";
                  return BitConverter.ToString(b).Replace("-","");
              }

              static MethodInfo FindByteArrayMethod(Type t,string wanted)
              {
                  return t.GetMethods(
                      BindingFlags.Public|BindingFlags.NonPublic|
                      BindingFlags.Instance|BindingFlags.Static)
                    .Where(m=>m.Name==wanted)
                    .Where(m=>{
                        var p=m.GetParameters();
                        return p.Length==1 && p[0].ParameterType==typeof(byte[]);
                    })
                    .OrderBy(m=>m.MetadataToken)
                    .FirstOrDefault();
              }

              static IntPtr ResolveNearJumps(IntPtr start,string tag)
              {
                  long cur=start.ToInt64();

                  for(int depth=0;depth<8;depth++)
                  {
                      byte[] b=new byte[16];
                      Marshal.Copy(new IntPtr(cur),b,0,b.Length);

                      Log(tag+"_PTR_"+depth+"=0x"+cur.ToString("X"));
                      Log(tag+"_HEAD16_"+depth+"="+Hex(b));

                      // jmp rel32
                      if(b[0]==0xE9)
                      {
                          int rel=BitConverter.ToInt32(b,1);
                          cur=cur+5+rel;
                          continue;
                      }

                      // jmp rel8
                      if(b[0]==0xEB)
                      {
                          sbyte rel=unchecked((sbyte)b[1]);
                          cur=cur+2+rel;
                          continue;
                      }

                      // common x86 absolute indirect jump: FF 25 <addr32>
                      if(b[0]==0xFF && b[1]==0x25)
                      {
                          int slot=BitConverter.ToInt32(b,2);
                          int target=Marshal.ReadInt32(new IntPtr(slot));
                          cur=unchecked((uint)target);
                          continue;
                      }

                      break;
                  }

                  return new IntPtr(cur);
              }

              static void DumpMethod(MethodInfo m,string tag)
              {
                  if(m==null)
                  {
                      Log(tag+"_MISSING=true");
                      return;
                  }

                  Log(tag+"_FOUND=true");
                  Log(tag+"_DECLARING_TYPE="+m.DeclaringType.FullName);
                  Log(tag+"_NAME="+m.Name);
                  Log(tag+"_TOKEN=0x"+m.MetadataToken.ToString("X8"));
                  Log(tag+"_SIGNATURE="+m.ToString());
                  Log(tag+"_IS_STATIC="+m.IsStatic);

                  try
                  {
                      MethodBody body=m.GetMethodBody();
                      byte[] il=body==null?null:body.GetILAsByteArray();
                      Log(tag+"_IL="+Hex(il));
                  }
                  catch(Exception ex)
                  {
                      Log(tag+"_IL_EXCEPTION="+ex.GetBaseException().GetType().FullName);
                  }

                  RuntimeHelpers.PrepareMethod(m.MethodHandle);

                  IntPtr fp=m.MethodHandle.GetFunctionPointer();
                  Log(tag+"_FUNCTION_PTR=0x"+fp.ToInt64().ToString("X"));

                  IntPtr resolved=ResolveNearJumps(fp,tag+"_RESOLVE");
                  Log(tag+"_RESOLVED_PTR=0x"+resolved.ToInt64().ToString("X"));

                  byte[] native=new byte[2048];
                  Marshal.Copy(resolved,native,0,native.Length);

                  File.WriteAllBytes(
                      Path.Combine(
                          Path.GetDirectoryName(OutPath),
                          tag+"_NATIVE2048.bin"),
                      native);

                  Log(tag+"_NATIVE2048_SHA256="+Sha256(native));
                  Log(tag+"_NATIVE_HEAD256="+Hex(native.Take(256).ToArray()));
              }

              static string Sha256(byte[] b)
              {
                  using(var h=System.Security.Cryptography.SHA256.Create())
                      return BitConverter.ToString(h.ComputeHash(b)).Replace("-","").ToLowerInvariant();
              }

              public static void Main(string[] a)
              {
                  if(a.Length<2)throw new Exception("args: vendor.exe evidence.txt");

                  string exe=Path.GetFullPath(a[0]);
                  OutPath=Path.GetFullPath(a[1]);
                  File.WriteAllText(OutPath,"");

                  Directory.SetCurrentDirectory(Path.GetDirectoryName(exe));

                  Log("MODE=OFFLINE_RUNTIME_JIT_TRANSPORT_FRAMING_RECOVERY");
                  Log("REAL_HID_OBJECT_CREATED=NO");
                  Log("REAL_HID_CONNECT_INVOKED=NO");
                  Log("REAL_HID_SEND_INVOKED=NO");
                  Log("REAL_HID_READ_INVOKED=NO");
                  Log("REAL_HID_WRITE_INVOKED=NO");
                  Log("HOST_TO_DSP_IO=NO");
                  Log("FEATURE_REPORT_INVOKED=NO");
                  Log("FLASH_ALLOWED=NO");

                  Assembly asm=Assembly.LoadFile(exe);
                  RuntimeHelpers.RunModuleConstructor(asm.ManifestModule.ModuleHandle);

                  Type usb=asm.GetType("DSTech_AudioDSP_Client.USBHID",false);
                  Type hid=asm.GetType("DSTech_AudioDSP_Client.HIDInterface",false);

                  Log("USBHID_TYPE_PRESENT="+(usb!=null));
                  Log("HIDINTERFACE_TYPE_PRESENT="+(hid!=null));

                  MethodInfo write=usb==null?null:FindByteArrayMethod(usb,"Write");
                  MethodInfo send=hid==null?null:FindByteArrayMethod(hid,"Send");

                  DumpMethod(write,"USBHID_WRITE");
                  DumpMethod(send,"HIDINTERFACE_SEND");

                  Log("JIT_CAPTURE_COMPLETE=true");
                  Environment.Exit(0);
              }
          }
          '@ | Set-Content "$root\harness\Probe.cs"

          $csc="$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          if(-not(Test-Path $csc)){ throw "x86 csc missing" }

          & $csc /nologo /platform:x86 /target:exe `
            /out:"$root\harness\Probe.exe" `
            "$root\harness\Probe.cs"

          if($LASTEXITCODE -ne 0){ throw "probe compile failed" }

      - name: Static safety audit
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v28"
          $s=Get-Content "$root\harness\Probe.cs" -Raw

          foreach($bad in @(
            "HidD_SetOutputReport(","HidD_GetInputReport(",
            "HidD_SetFeature(","HidD_GetFeature(",
            "ReadFile(","WriteFile(","CreateFileW("
          )){
            if($s.Contains($bad)){ throw "forbidden native HID primitive: $bad" }
          }

          foreach($need in @(
            "RuntimeHelpers.PrepareMethod",
            "GetFunctionPointer",
            "USBHID",
            "HIDInterface",
            "REAL_HID_OBJECT_CREATED=NO",
            "HOST_TO_DSP_IO=NO",
            "FLASH_ALLOWED=NO"
          )){
            if(-not $s.Contains($need)){ throw "missing marker: $need" }
          }

          "STATIC_SAFETY_AUDIT=PASS" |
            Set-Content "$root\evidence\02_STATIC_SAFETY_AUDIT.txt"

      - name: Capture runtime JIT bytes without invoking transport
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v28"

          & "$root\harness\Probe.exe" `
            "$root\vendor.exe" `
            "$root\evidence\03_RUNTIME_JIT_CAPTURE.txt"

          if($LASTEXITCODE -ne 0){ throw "runtime JIT capture failed" }

          $ev=Get-Content "$root\evidence\03_RUNTIME_JIT_CAPTURE.txt" -Raw

          if($ev -notmatch 'JIT_CAPTURE_COMPLETE=true'){ throw "capture incomplete" }
          if($ev -notmatch 'USBHID_WRITE_FOUND=true'){ throw "USBHID.Write missing" }
          if($ev -notmatch 'HIDINTERFACE_SEND_FOUND=true'){ throw "HIDInterface.Send missing" }

          Get-Content "$root\evidence\03_RUNTIME_JIT_CAPTURE.txt"

      - name: Disassemble captured JIT and derive framing evidence
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v28"

          python -m pip install --quiet capstone

          @'
          from pathlib import Path
          import json,re
          from capstone import Cs, CS_ARCH_X86, CS_MODE_32

          root=Path(r"C:\okn_v28")
          ev=root/"evidence"

          txt=(ev/"03_RUNTIME_JIT_CAPTURE.txt").read_text(errors="ignore")

          md=Cs(CS_ARCH_X86,CS_MODE_32)
          md.detail=False

          results={}

          for tag in ["USBHID_WRITE","HIDINTERFACE_SEND"]:
              p=ev/f"{tag}_NATIVE2048.bin"
              if not p.exists():
                  results[tag]={"present":False}
                  continue

              data=p.read_bytes()
              ins=list(md.disasm(data,0))

              # Stop after a plausible function end but keep enough instructions
              # to survive small protector/thunk prologues.
              trimmed=[]
              ret_seen=0
              for x in ins[:700]:
                  trimmed.append(x)
                  if x.mnemonic.startswith("ret"):
                      ret_seen+=1
                      if len(trimmed)>20:
                          break

              out="\n".join(
                  f"{x.address:08X}: {x.mnemonic:<8} {x.op_str}"
                  for x in trimmed
              )+"\n"

              (ev/f"04_{tag}_DISASM.txt").write_text(out)

              mnem=[x.mnemonic for x in trimmed]
              op=[x.op_str.lower() for x in trimmed]

              # Conservative indicators only.
              add_one=sum(
                  1 for x in trimmed
                  if x.mnemonic in ("inc","add","lea") and
                     ("1" in x.op_str or "+ 1" in x.op_str or "+1" in x.op_str)
              )
              byte_stores=sum(
                  1 for x in trimmed
                  if x.mnemonic.startswith("mov") and
                     ("byte ptr" in x.op_str.lower())
              )
              calls=sum(1 for x in trimmed if x.mnemonic=="call")

              results[tag]={
                  "present":True,
                  "instruction_count":len(trimmed),
                  "ret_seen":ret_seen,
                  "add_or_inc_one_indicators":add_one,
                  "byte_store_indicators":byte_stores,
                  "call_count":calls
              }

          decision={
              "revision":"MASTER-V28",
              "classification":"OFFLINE_RUNTIME_JIT_TRANSPORT_RECOVERY_NOT_FOR_FLASH",
              "v26_auth_reply_hex":"7427956A",
              "candidate_android_wire_hex":"05047427956A",
              "usb_hid_write":results.get("USBHID_WRITE"),
              "hid_interface_send":results.get("HIDINTERFACE_SEND"),
              "candidate_live_use_proven":False,
              "real_hid_invoked":False,
              "host_to_dsp_io":False,
              "feature_report_invoked":False,
              "flash_allowed":False
          }

          both=all(results.get(k,{}).get("present") for k in ["USBHID_WRITE","HIDINTERFACE_SEND"])

          # Do not auto-authorize live traffic solely from heuristic disassembly.
          if both:
              decision["status"]="RUNTIME_JIT_CAPTURED_FOR_BOTH_TRANSPORT_LAYERS_REVIEW_EXACT_FRAMING_NEXT"
          else:
              decision["status"]="TRANSPORT_JIT_CAPTURE_INCOMPLETE"

          (ev/"05_V28_DECISION.json").write_text(json.dumps(decision,indent=2)+"\n")

          mdout=f"""# MASTER V28 FINAL DECISION

          - USBHID.Write runtime JIT captured: **{results.get('USBHID_WRITE',{}).get('present',False)}**
          - HIDInterface.Send runtime JIT captured: **{results.get('HIDINTERFACE_SEND',{}).get('present',False)}**
          - Candidate auth-reply Android bytes: **05 04 74 27 95 6A**
          - Candidate authorized for live use: **NO**
          - Real HID invoked: **NO**
          - Host-to-DSP I/O: **NO**
          - Feature report invoked: **NO**
          - Flash/erase/write: **NO / NO / NO**

          Status: **{decision['status']}**

          Review `04_USBHID_WRITE_DISASM.txt` and
          `04_HIDINTERFACE_SEND_DISASM.txt` to confirm the two nested length-prefix
          transforms before building a same-session S25+ auth test.

          Classification:
          **OFFLINE_RUNTIME_JIT_TRANSPORT_RECOVERY_NOT_FOR_FLASH**
          """

          (ev/"06_V28_FINAL_DECISION.md").write_text(mdout)
          print(mdout)
          '@ | Set-Content "$root\derive.py"
          python "$root\derive.py"
          if($LASTEXITCODE -ne 0){ throw "V28 derive failed" }

          Get-Content "$root\evidence\06_V28_FINAL_DECISION.md" >> $env:GITHUB_STEP_SUMMARY

      - name: Package V28 evidence
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v28"

          Copy-Item "$root\evidence\*" "$root\out\" -Force

          foreach($bad in @("vendor.exe","Probe.exe")){
            if(Test-Path "$root\out\$bad"){ throw "binary leak: $bad" }
          }

          Get-ChildItem "$root\out" -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content "$root\out\SHA256SUMS.txt"

      - name: Upload V28 evidence
        uses: actions/upload-artifact@v7
        with:
          name: OKN-BP1048P4-MASTER-V28-USBHID-HIDINTERFACE-JIT-FRAMING-EVIDENCE
          path: C:\okn_v28\out\*
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed assertion
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v28"

          foreach($n in @(
            "LIVE_DSP_CONNECTED","USB_TARGET_ACCESS","HOST_TO_DSP_IO",
            "REAL_HID_OBJECT_ALLOWED","REAL_HID_CONNECT_ALLOWED",
            "REAL_HID_SEND_ALLOWED","REAL_HID_READ_ALLOWED","REAL_HID_WRITE_ALLOWED",
            "FEATURE_REPORT_ALLOWED","FLASH_ALLOWED","ERASE_ALLOWED","WRITE_ALLOWED"
          )){
            if((Get-Item "Env:$n").Value -ne "NO"){ throw "$n changed" }
          }

          $d=Get-Content "$root\evidence\05_V28_DECISION.json" -Raw | ConvertFrom-Json

          if($d.real_hid_invoked -ne $false){ throw "unexpected HID state" }
          if($d.host_to_dsp_io -ne $false){ throw "unexpected host-to-DSP state" }
          if($d.feature_report_invoked -ne $false){ throw "unexpected feature state" }
          if($d.flash_allowed -ne $false){ throw "unexpected flash state" }
          if($d.candidate_live_use_proven -ne $false){ throw "must remain fail-closed" }

          "MASTER_V28=PASS"
          "REAL_HID_IO=NO"
          "HOST_TO_DSP_IO=NO"
          "FLASH_ALLOWED=NO"
