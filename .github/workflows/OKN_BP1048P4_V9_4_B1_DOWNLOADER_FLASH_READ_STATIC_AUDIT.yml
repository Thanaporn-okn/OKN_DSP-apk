name: OKN BP1048P4 V9.4 B1 DOWNLOADER FLASH_READ STATIC AUDIT

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/OKN_BP1048P4_V9_4_B1_DOWNLOADER_FLASH_READ_STATIC_AUDIT.yml'

permissions:
  contents: read

env:
  FLASH_ALLOWED: "NO"
  SDK_REPO: "https://github.com/leadercxn/bp1048_sdk_v0.1.12.git"
  SDK_COMMIT: "8105bd864b04995d81c9f9ae77cb158259f39015"
  B1_EXE_REL: "MVsB1_Base_SDK/tools/b1_download_v1.7.exe"
  EXPECTED_B1_GIT_BLOB_SHA1: "dd2503e5a78d9b7c12f8b680a6be83d090adb966"
  EXPECTED_B1_SIZE: "1146395"
  R2_REPO: "https://github.com/radareorg/radare2.git"
  R2_COMMIT: "1ae9dfaf7fe5b6d74414145aa13fa8ef427adf57"

jobs:
  static_audit:
    name: V9.4 static reverse engineering of b1_download_v1.7.exe (NO EXECUTION / NO USB)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          rm -rf /tmp/v94
          mkdir -p /tmp/v94/{sdk,evidence,r2-prefix}
          cat > /tmp/v94/evidence/SAFETY.txt <<'EOF'
          MODE=OFFLINE_STATIC_REVERSE_ENGINEERING
          TARGET=b1_download_v1.7.exe
          TARGET_EXECUTED=NO
          WINE_EXECUTED=NO
          PHYSICAL_USB_BOARD_PRESENT=NO
          USB_COMMAND_SENT=NO
          UART_COMMAND_SENT=NO
          HID_SET_REPORT_SENT=NO
          HID_SET_FEATURE_SENT=NO
          FLASH_READ_EXECUTED=NO
          FLASH_ERASE_EXECUTED=NO
          FLASH_WRITE_EXECUTED=NO
          FLASH_ALLOWED=NO
          EOF

      - name: Fetch pinned BP1048 SDK and verify downloader bytes
        shell: bash
        run: |
          set -euo pipefail
          git clone -q "$SDK_REPO" /tmp/v94/sdk-src
          git -C /tmp/v94/sdk-src checkout -q "$SDK_COMMIT"
          test "$(git -C /tmp/v94/sdk-src rev-parse HEAD)" = "$SDK_COMMIT"
          EXE="/tmp/v94/sdk-src/$B1_EXE_REL"
          test -f "$EXE"
          test "$(stat -c '%s' "$EXE")" = "$EXPECTED_B1_SIZE"
          test "$(git -C /tmp/v94/sdk-src hash-object "$B1_EXE_REL")" = "$EXPECTED_B1_GIT_BLOB_SHA1"
          git -C /tmp/v94/sdk-src rev-parse HEAD > /tmp/v94/evidence/SDK_COMMIT.txt
          git -C /tmp/v94/sdk-src hash-object "$B1_EXE_REL" > /tmp/v94/evidence/B1_GIT_BLOB_SHA1.txt
          sha256sum "$EXE" | tee /tmp/v94/evidence/B1_SHA256.txt
          stat "$EXE" > /tmp/v94/evidence/B1_STAT.txt
          file "$EXE" | tee /tmp/v94/evidence/B1_FILE_TYPE.txt

      - name: Collect PE metadata imports symbols and strings without executing target
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          EXE="/tmp/v94/sdk-src/$B1_EXE_REL"
          file "$EXE" > /tmp/v94/evidence/B1_FILE.txt
          objdump -x "$EXE" > /tmp/v94/evidence/B1_OBJDUMP_X.txt 2>&1 || true
          objdump -p "$EXE" > /tmp/v94/evidence/B1_OBJDUMP_P.txt 2>&1 || true
          objdump -h "$EXE" > /tmp/v94/evidence/B1_OBJDUMP_H.txt 2>&1 || true
          objdump -t -C "$EXE" > /tmp/v94/evidence/B1_OBJDUMP_SYMBOLS.txt 2>&1 || true
          nm -a -C "$EXE" > /tmp/v94/evidence/B1_NM_SYMBOLS.txt 2>&1 || true
          strings -a -t x "$EXE" > /tmp/v94/evidence/B1_STRINGS_ASCII_OFFSETS.txt
          strings -a -el -t x "$EXE" > /tmp/v94/evidence/B1_STRINGS_UTF16LE_OFFSETS.txt || true
          {
            echo '=== exact/high-signal ASCII strings ==='
            grep -iEn -C 8 'FLASH_READ|flash_read|SpiCodeFlashReadStatus|ReadFlashStatusRegister|MSG_PEEK|HID|USB|VID|PID|COM[0-9%]|baud|uart|serial|CreateFile|ReadFile|WriteFile|DeviceIoControl|SetupDi|HidD_|HidP_|libusb|WinUSB|FT_' /tmp/v94/evidence/B1_STRINGS_ASCII_OFFSETS.txt || true
            echo
            echo '=== PE import-related evidence ==='
            grep -iEn -C 3 'CreateFile|ReadFile|WriteFile|DeviceIoControl|SetupDi|HidD_|HidP_|WinUSB|libusb|FT_|CreateFileMapping|MapViewOfFile|CreateNamedPipe|PeekNamedPipe|GetCommState|SetCommState|SetCommTimeouts|PurgeComm' /tmp/v94/evidence/B1_OBJDUMP_P.txt || true
            echo
            echo '=== symbol-name evidence ==='
            grep -iEn -C 4 'flash_read|SpiCodeFlashReadStatus|ReadFlashStatusRegister|peek|download|uart|serial|usb|hid|spi' /tmp/v94/evidence/B1_NM_SYMBOLS.txt || true
          } > /tmp/v94/evidence/B1_HIGH_SIGNAL_TEXT.txt

      - name: Prove downloader role from SDK project metadata and release notes
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          ROOT=/tmp/v94/sdk-src
          OUT=/tmp/v94/evidence/B1_TOOL_ROLE_EVIDENCE.txt
          {
            echo '=== SDK tools release notes ==='
            grep -n -A8 -B2 'b1_download_v1.7.exe' "$ROOT/MVsB1_Base_SDK/tools/readme.txt" || true
            echo
            grep -n -A4 -B2 '4KB.*CRC' "$ROOT/MVsB1_Base_SDK/tools/readme.txt" || true
            echo
            echo '=== AndeSight flash-driver project settings ==='
            grep -RIn --include='com.andestech.ide.flash.ui.prefs' 'b1_download' "$ROOT" | head -120 || true
            echo
            echo '=== verify=true references using b1_download ==='
            grep -RIl --include='com.andestech.ide.flash.ui.prefs' 'b1_download' "$ROOT" \n              | while IFS= read -r f; do grep -H 'verify=true' "$f" || true; done | head -120
          } > "$OUT"
          grep -q 'b1_download_v1.7.exe' "$OUT"
          grep -q 'flashDriver' "$OUT"

      - name: Build pinned radare2 for reproducible PE analysis
        shell: bash
        run: |
          set -euo pipefail
          git clone -q "$R2_REPO" /tmp/v94/radare2-src
          git -C /tmp/v94/radare2-src checkout -q "$R2_COMMIT"
          cd /tmp/v94/radare2-src
          ./configure --prefix=/tmp/v94/r2-prefix > /tmp/v94/evidence/R2_CONFIGURE.log 2>&1
          make -j2 > /tmp/v94/evidence/R2_BUILD.log 2>&1
          make install > /tmp/v94/evidence/R2_INSTALL.log 2>&1
          export PATH="/tmp/v94/r2-prefix/bin:$PATH"
          r2 -v > /tmp/v94/evidence/R2_VERSION.txt
          rabin2 -v >> /tmp/v94/evidence/R2_VERSION.txt

      - name: Analyze PE strings xrefs call contexts and transport indicators
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          export PATH="/tmp/v94/r2-prefix/bin:$PATH"
          export EXE="/tmp/v94/sdk-src/$B1_EXE_REL"
          export E="/tmp/v94/evidence"

          rabin2 -I "$EXE" > "$E/B1_RABIN_INFO.txt" 2>&1 || true
          rabin2 -S "$EXE" > "$E/B1_RABIN_SECTIONS.txt" 2>&1 || true
          rabin2 -i "$EXE" > "$E/B1_RABIN_IMPORTS.txt" 2>&1 || true
          rabin2 -E "$EXE" > "$E/B1_RABIN_EXPORTS.txt" 2>&1 || true
          rabin2 -s "$EXE" > "$E/B1_RABIN_SYMBOLS.txt" 2>&1 || true
          rabin2 -zz "$EXE" > "$E/B1_RABIN_STRINGS.txt" 2>&1 || true
          rabin2 -I -j "$EXE" > "$E/B1_RABIN_INFO.json" 2>/dev/null || echo '{}' > "$E/B1_RABIN_INFO.json"
          rabin2 -i -j "$EXE" > "$E/B1_RABIN_IMPORTS.json" 2>/dev/null || echo '[]' > "$E/B1_RABIN_IMPORTS.json"
          rabin2 -s -j "$EXE" > "$E/B1_RABIN_SYMBOLS.json" 2>/dev/null || echo '[]' > "$E/B1_RABIN_SYMBOLS.json"
          rabin2 -zz -j "$EXE" > "$E/B1_RABIN_STRINGS.json" 2>/dev/null || echo '[]' > "$E/B1_RABIN_STRINGS.json"

          python3 - <<'PY'
          import json, os, re, subprocess, pathlib, hashlib

          exe=pathlib.Path(os.environ['EXE'])
          E=pathlib.Path(os.environ['E'])
          r2=str(pathlib.Path('/tmp/v94/r2-prefix/bin/radare2'))

          def run(args, timeout=120):
              p=subprocess.run(args,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,
                               text=True,errors='replace',timeout=timeout)
              return p.returncode,p.stdout

          def load_json(path, default):
              try:
                  return json.loads(path.read_text(errors='replace'))
              except Exception:
                  return default

          raw=exe.read_bytes()
          sha256=hashlib.sha256(raw).hexdigest()

          # Independent raw-string scan so findings do not depend on any one disassembler.
          targets=[
              b'FLASH_READ (0x03)', b'flash_read', b'SpiCodeFlashReadStatus',
              b'ReadFlashStatusRegister', b'MSG_PEEK 0x2', b'peek2', b'peek_next'
          ]
          raw_hits=[]
          for t in targets:
              start=0
              while True:
                  i=raw.find(t,start)
                  if i<0: break
                  raw_hits.append({'needle':t.decode('ascii'),'file_offset':i,'hex_offset':f'0x{i:X}'})
                  start=i+1
          (E/'B1_RAW_TARGET_STRING_OFFSETS.json').write_text(json.dumps(raw_hits,indent=2)+'\n')

          # Extract printable neighborhoods around every FLASH_READ occurrence.
          flash_offsets=[x['file_offset'] for x in raw_hits if x['needle']=='FLASH_READ (0x03)']
          neighborhoods=[]
          for off in flash_offsets:
              lo=max(0,off-320); hi=min(len(raw),off+640)
              chunk=raw[lo:hi]
              printable=''.join(chr(b) if 32<=b<127 else '.' for b in chunk)
              neighborhoods.append({'offset':f'0x{off:X}','window_start':f'0x{lo:X}','ascii':printable})
          (E/'B1_FLASH_READ_RAW_NEIGHBORHOODS.json').write_text(json.dumps(neighborhoods,indent=2)+'\n')

          imports=load_json(E/'B1_RABIN_IMPORTS.json',[])
          if isinstance(imports,dict):
              imports=imports.get('imports',imports.get('symbols',[])) or []
          import_names=[]
          for x in imports if isinstance(imports,list) else []:
              if isinstance(x,dict):
                  n=x.get('name') or x.get('libname') or x.get('bind') or ''
                  if n: import_names.append(str(n))
              elif isinstance(x,str): import_names.append(x)

          # Radare2 full analysis. Never run/debug/emulate the target executable.
          rc,out=run([r2,'-2','-q','-A','-c','ij','-c','aflj','-c','q',str(exe)],timeout=180)
          (E/'B1_R2_ANALYSIS_SMOKE.txt').write_text(out)
          if rc!=0:
              raise RuntimeError('radare2 static analysis failed')

          def r2json(cmd, default):
              rc,out=run([r2,'-2','-q','-A','-c',cmd,'-c','q',str(exe)],timeout=180)
              # JSON may have harmless banner/noise; choose the last JSON-looking line/block.
              if rc!=0: return default
              s=out.strip()
              for cand in (s, *reversed(s.splitlines())):
                  cand=cand.strip()
                  if not cand: continue
                  try: return json.loads(cand)
                  except Exception: pass
              return default

          funcs=r2json('aflj',[])
          strings=r2json('izzj',[])
          symbols=r2json('isj',[])
          (E/'B1_R2_FUNCTIONS.json').write_text(json.dumps(funcs,indent=2)+'\n')
          (E/'B1_R2_STRINGS.json').write_text(json.dumps(strings,indent=2)+'\n')
          (E/'B1_R2_SYMBOLS.json').write_text(json.dumps(symbols,indent=2)+'\n')

          def sval(x):
              for k in ('string','name','realname'):
                  v=x.get(k) if isinstance(x,dict) else None
                  if isinstance(v,str) and v: return v
              return ''

          # Find string records, then xrefs to each one.
          needles=['FLASH_READ (0x03)','flash_read','SpiCodeFlashReadStatus',
                   'ReadFlashStatusRegister','MSG_PEEK 0x2','peek2','peek_next']
          matched=[]
          for s in strings if isinstance(strings,list) else []:
              text=sval(s)
              if any(n.lower() in text.lower() for n in needles):
                  matched.append(s)
          (E/'B1_R2_TARGET_STRINGS.json').write_text(json.dumps(matched,indent=2)+'\n')

          xref_rows=[]
          contexts=[]
          for s in matched:
              va=s.get('vaddr',s.get('paddr'))
              if not isinstance(va,int): continue
              xrefs=r2json(f'axtj @ {va}',[])
              if not isinstance(xrefs,list): xrefs=[]
              for xr in xrefs:
                  frm=xr.get('from') if isinstance(xr,dict) else None
                  row={'string':sval(s),'string_vaddr':f'0x{va:X}','xref':xr}
                  if isinstance(frm,int):
                      fi=r2json(f'afij @ {frm}',[])
                      f0=fi[0] if isinstance(fi,list) and fi else {}
                      row['from']=f'0x{frm:X}'
                      row['function_name']=f0.get('name') if isinstance(f0,dict) else None
                      row['function_addr']=f"0x{f0.get('offset'):X}" if isinstance(f0,dict) and isinstance(f0.get('offset'),int) else None
                      rc,ctx=run([r2,'-2','-q','-A','-c',f's {max(0,frm-96)}','-c','pd 96','-c','q',str(exe)],timeout=180)
                      contexts.append({'string':sval(s),'from':f'0x{frm:X}','function':row.get('function_name'),'disassembly':ctx})
                      if isinstance(f0,dict) and isinstance(f0.get('offset'),int):
                          faddr=f0['offset']
                          rc,pdc=run([r2,'-2','-q','-A','-c',f's {faddr}','-c','pdc','-c','q',str(exe)],timeout=180)
                          contexts[-1]['pseudocode']=pdc
                  xref_rows.append(row)
          (E/'B1_R2_TARGET_XREFS.json').write_text(json.dumps(xref_rows,indent=2)+'\n')
          (E/'B1_R2_TARGET_CONTEXTS.json').write_text(json.dumps(contexts,indent=2)+'\n')

          # Symbol/function names are especially useful if MinGW/COFF names survived stripping.
          high_funcs=[]
          for f in funcs if isinstance(funcs,list) else []:
              n=str(f.get('name','')) if isinstance(f,dict) else ''
              if re.search(r'(flash|spi|read|peek|uart|serial|usb|hid|download|send|recv|write)',n,re.I):
                  high_funcs.append(f)
          (E/'B1_R2_HIGH_SIGNAL_FUNCTIONS.json').write_text(json.dumps(high_funcs,indent=2)+'\n')

          # Import-level transport inventory. This does not claim a protocol; it identifies APIs worth following.
          classes={
              'hid_usb':['hidd_','hidp_','setupdi','winusb','libusb','usb'],
              'serial':['getcommstate','setcommstate','setcommtimeouts','purgecomm','clearcomm','waitcommevent','escapecommfunction'],
              'generic_io':['createfile','readfile','writefile','deviceiocontrol','createfilemapping','mapviewoffile'],
              'network':['socket','connect','send','recv','wsastartup'],
          }
          transport={k:sorted({n for n in import_names if any(t in n.lower() for t in terms)}) for k,terms in classes.items()}

          # String-level transport hints, including VID/PID and COM port formats.
          ascii_text=(E/'B1_STRINGS_ASCII_OFFSETS.txt').read_text(errors='replace')
          string_hints={
              'vid_pid_lines':[ln for ln in ascii_text.splitlines() if re.search(r'(VID|PID)[_:= ]|[0-9A-Fa-f]{4}:[0-9A-Fa-f]{4}',ln,re.I)][:200],
              'usb_hid_lines':[ln for ln in ascii_text.splitlines() if re.search(r'USB|HID|WinUSB|libusb',ln,re.I)][:200],
              'serial_lines':[ln for ln in ascii_text.splitlines() if re.search(r'COM[%0-9]|baud|UART|serial',ln,re.I)][:200],
          }

          # Check whether target strings are referenced by code and name the referencing functions.
          flash_xrefs=[x for x in xref_rows if 'FLASH_READ (0x03)' in x.get('string','')]
          flash_funcs=sorted({x.get('function_name') for x in flash_xrefs if x.get('function_name')})
          status_name_present=any('SpiCodeFlashReadStatus' in x['needle'] or 'ReadFlashStatusRegister' in x['needle'] for x in raw_hits)

          # Conservative result: presence of FLASH_READ text alone does NOT prove host firmware readback.
          # We only mark a host readback primitive as proven if this static audit itself can establish
          # a device->host/file data path. V9.4 intentionally defaults fail-closed when evidence is incomplete.
          result={
              'sdk_commit':os.environ.get('SDK_COMMIT'),
              'target_relpath':os.environ.get('B1_EXE_REL'),
              'target_sha256':sha256,
              'target_size':len(raw),
              'target_executed':False,
              'raw_FLASH_READ_0x03_occurrences':len(flash_offsets),
              'raw_FLASH_READ_0x03_offsets':[f'0x{x:X}' for x in flash_offsets],
              'status_register_function_name_strings_present':status_name_present,
              'r2_target_string_records':len(matched),
              'FLASH_READ_0x03_code_xref_count':len(flash_xrefs),
              'FLASH_READ_0x03_referencing_functions':flash_funcs,
              'transport_imports':transport,
              'transport_string_hints':string_hints,
              'host_generic_flash_readback_proven':False,
              'host_full_firmware_dump_path_proven':False,
              'FLASH_ALLOWED':False,
              'interpretation':'FLASH_READ (0x03) is a high-signal candidate requiring code-context classification; string presence alone is not treated as a host readback command.'
          }
          (E/'V9_4_B1_DOWNLOADER_AUDIT.json').write_text(json.dumps(result,indent=2)+'\n')

          md=[
              '# BP1048P4 V9.4 — b1_download_v1.7.exe static FLASH_READ audit','',
              f'- Target SHA-256: `{sha256}`',
              f'- Target size: **{len(raw)} bytes**',
              f'- Raw `FLASH_READ (0x03)` occurrences: **{len(flash_offsets)}** at '+(', '.join(f'`0x{x:X}`' for x in flash_offsets) or '(none)'),
              f'- Status-register function-name strings present: **{status_name_present}** (`SpiCodeFlashReadStatus` / `ReadFlashStatusRegister`).',
              f'- Code xrefs to `FLASH_READ (0x03)` recovered by radare2: **{len(flash_xrefs)}**.',
              '- Referencing functions: '+(', '.join(f'`{x}`' for x in flash_funcs) if flash_funcs else '(no named function recovered)'),
              '- HID/USB imports: '+(', '.join(transport['hid_usb']) if transport['hid_usb'] else '(none identified)'),
              '- Serial imports: '+(', '.join(transport['serial']) if transport['serial'] else '(none identified)'),
              '- Generic I/O imports: '+(', '.join(transport['generic_io']) if transport['generic_io'] else '(none identified)'),
              '- `FLASH_READ (0x03)` is **not automatically classified as a host firmware-read command**; V9.4 records xrefs and surrounding code for review.',
              '- `host_generic_flash_readback_proven = false` and `host_full_firmware_dump_path_proven = false` unless a device-to-host data path is actually established.',
              '- Target executable was never executed; no Wine, USB, UART, erase, write, or flash command was used.',
              '- `FLASH_ALLOWED=NO`.'
          ]
          (E/'V9_4_REPORT.md').write_text('\n'.join(md)+'\n')
          PY

          cat "$E/V9_4_REPORT.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Correlate FLASH_READ with symbols and disassembly using binutils
        shell: bash
        run: |
          set -euo pipefail
          EXE="/tmp/v94/sdk-src/$B1_EXE_REL"
          E=/tmp/v94/evidence
          {
            echo '=== symbols matching flash/status/read ==='
            nm -a -C "$EXE" 2>/dev/null | grep -iE 'flash_read|SpiCodeFlashReadStatus|ReadFlashStatusRegister|flash.*read|read.*flash|peek' || true
            echo
            echo '=== strings around FLASH_READ ==='
            grep -iEn -C 16 'FLASH_READ \(0x03\)|SpiCodeFlashReadStatus|ReadFlashStatusRegister|flash_read|MSG_PEEK' "$E/B1_STRINGS_ASCII_OFFSETS.txt" || true
            echo
            echo '=== import hints ==='
            grep -iEn 'CreateFile|ReadFile|WriteFile|DeviceIoControl|SetupDi|HidD_|HidP_|WinUSB|GetCommState|SetCommState|SetCommTimeouts|PurgeComm' "$E/B1_OBJDUMP_P.txt" || true
          } > "$E/V9_4_CORRELATION.txt"

      - name: Final fail-closed assertions
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          python3 - <<'PY'
          import json
          from pathlib import Path
          E=Path('/tmp/v94/evidence')
          safety=(E/'SAFETY.txt').read_text()
          assert 'TARGET_EXECUTED=NO' in safety
          assert 'PHYSICAL_USB_BOARD_PRESENT=NO' in safety
          assert 'FLASH_READ_EXECUTED=NO' in safety
          assert 'FLASH_ERASE_EXECUTED=NO' in safety
          assert 'FLASH_WRITE_EXECUTED=NO' in safety
          assert 'FLASH_ALLOWED=NO' in safety
          assert (E/'SDK_COMMIT.txt').read_text().strip() == '8105bd864b04995d81c9f9ae77cb158259f39015'
          assert (E/'B1_GIT_BLOB_SHA1.txt').read_text().strip() == 'dd2503e5a78d9b7c12f8b680a6be83d090adb966'
          r=json.loads((E/'V9_4_B1_DOWNLOADER_AUDIT.json').read_text())
          assert r.get('target_size') == 1146395
          assert r.get('target_executed') is False
          assert r.get('raw_FLASH_READ_0x03_occurrences',0) >= 1
          assert r.get('status_register_function_name_strings_present') is True
          assert r.get('host_generic_flash_readback_proven') is False
          assert r.get('host_full_firmware_dump_path_proven') is False
          assert r.get('FLASH_ALLOWED') is False
          print('V9_4_B1_STATIC_AUDIT_COMPLETE=YES')
          print('FLASH_ALLOWED=NO')
          PY

      - name: Package V9.4 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          cd /tmp/v94/evidence
          zip -9 -r /tmp/OKN_BP1048P4_V9_4_B1_DOWNLOADER_STATIC_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/OKN_BP1048P4_V9_4_B1_DOWNLOADER_STATIC_EVIDENCE.zip > /tmp/OKN_BP1048P4_V9_4_B1_DOWNLOADER_STATIC_EVIDENCE.zip.sha256

      - name: Upload V9.4 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OKN-BP1048P4-V9_4-B1-DOWNLOADER-STATIC-EVIDENCE
          path: |
            /tmp/OKN_BP1048P4_V9_4_B1_DOWNLOADER_STATIC_EVIDENCE.zip
            /tmp/OKN_BP1048P4_V9_4_B1_DOWNLOADER_STATIC_EVIDENCE.zip.sha256
            /tmp/v94/evidence/V9_4_REPORT.md
            /tmp/v94/evidence/V9_4_B1_DOWNLOADER_AUDIT.json
            /tmp/v94/evidence/V9_4_CORRELATION.txt
