name: OKN BP1048P4 V9.4 B1 DOWNLOADER FLASH READ STATIC AUDIT FIXED

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/OKN_BP1048P4_V9_4_B1_DOWNLOADER_FLASH_READ_STATIC_AUDIT.yml'
      - '.github/workflows/OKN_BP1048P4_V9_4_B1_DOWNLOADER_FLASH_READ_STATIC_AUDIT_FIXED.yml'

permissions:
  contents: read

env:
  FLASH_ALLOWED: "NO"
  SDK_REPO: "https://github.com/leadercxn/bp1048_sdk_v0.1.12.git"
  SDK_COMMIT: "8105bd864b04995d81c9f9ae77cb158259f39015"
  B1_EXE_REL: "MVsB1_Base_SDK/tools/b1_download_v1.7.exe"
  EXPECTED_B1_GIT_BLOB_SHA1: "dd2503e5a78d9b7c12f8b680a6be83d090adb966"
  EXPECTED_B1_SIZE: "1146395"

jobs:
  static_audit:
    name: V9.4 FIXED classify B1 flash-read path and ICEman transport
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          rm -rf /tmp/v94
          mkdir -p /tmp/v94/{sdk,evidence}
          cat > /tmp/v94/evidence/SAFETY.txt <<'EOF'
          MODE=OFFLINE_STATIC_REVERSE_ENGINEERING
          TARGET=b1_download_v1.7.exe
          TARGET_EXECUTED=NO
          WINE_EXECUTED=NO
          PHYSICAL_USB_BOARD_PRESENT=NO
          USB_COMMAND_SENT=NO
          UART_COMMAND_SENT=NO
          HID_SET_REPORT_SENT=NO
          HID_SET_FEATURE_SENT=NO
          FLASH_READ_EXECUTED=NO
          FLASH_ERASE_EXECUTED=NO
          FLASH_WRITE_EXECUTED=NO
          FLASH_ALLOWED=NO
          EOF

      - name: Fetch pinned SDK and verify downloader bytes
        shell: bash
        run: |
          set -euo pipefail
          git clone -q "$SDK_REPO" /tmp/v94/sdk-src
          git -C /tmp/v94/sdk-src checkout -q "$SDK_COMMIT"
          test "$(git -C /tmp/v94/sdk-src rev-parse HEAD)" = "$SDK_COMMIT"
          EXE="/tmp/v94/sdk-src/$B1_EXE_REL"
          test -f "$EXE"
          test "$(stat -c '%s' "$EXE")" = "$EXPECTED_B1_SIZE"
          test "$(git -C /tmp/v94/sdk-src hash-object "$B1_EXE_REL")" = "$EXPECTED_B1_GIT_BLOB_SHA1"
          git -C /tmp/v94/sdk-src rev-parse HEAD > /tmp/v94/evidence/SDK_COMMIT.txt
          git -C /tmp/v94/sdk-src hash-object "$B1_EXE_REL" > /tmp/v94/evidence/B1_GIT_BLOB_SHA1.txt
          sha256sum "$EXE" | tee /tmp/v94/evidence/B1_SHA256.txt
          file "$EXE" | tee /tmp/v94/evidence/B1_FILE_TYPE.txt

      - name: Collect PE COFF DWARF symbols strings and disassembly
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          EXE="/tmp/v94/sdk-src/$B1_EXE_REL"
          E=/tmp/v94/evidence

          objdump -h "$EXE" > "$E/B1_OBJDUMP_H.txt" 2>&1
          objdump -p "$EXE" > "$E/B1_OBJDUMP_P.txt" 2>&1 || true
          objdump -x "$EXE" > "$E/B1_OBJDUMP_X.txt" 2>&1 || true
          objdump -t -C "$EXE" > "$E/B1_OBJDUMP_SYMBOLS.txt" 2>&1 || true
          objdump -d -C -l "$EXE" > "$E/B1_DISASSEMBLY.txt" 2>&1 || true
          nm -a -C "$EXE" > "$E/B1_NM_SYMBOLS.txt" 2>&1 || true
          strings -a -t x "$EXE" > "$E/B1_STRINGS_ASCII_OFFSETS.txt"
          strings -a -el -t x "$EXE" > "$E/B1_STRINGS_UTF16LE_OFFSETS.txt" || true

      - name: Prove downloader role and AndeSight usage
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          ROOT=/tmp/v94/sdk-src
          OUT=/tmp/v94/evidence/B1_TOOL_ROLE_EVIDENCE.txt
          {
            echo '=== SDK tools release notes ==='
            grep -n -A8 -B2 'b1_download_v1.7.exe' "$ROOT/MVsB1_Base_SDK/tools/readme.txt" || true
            echo
            grep -n -A4 -B2 '4KB.*CRC' "$ROOT/MVsB1_Base_SDK/tools/readme.txt" || true
            echo
            echo '=== AndeSight flash-driver project settings ==='
            grep -RIn --include='com.andestech.ide.flash.ui.prefs' 'b1_download' "$ROOT" | head -120 || true
            echo
            echo '=== verify=true references using b1_download ==='
            grep -RIl --include='com.andestech.ide.flash.ui.prefs' 'b1_download' "$ROOT" \
              | while IFS= read -r f; do grep -H 'verify=true' "$f" || true; done \
              | head -120 || true
          } > "$OUT"
          grep -q 'b1_download_v1.7.exe' "$OUT"
          grep -q 'flashDriver' "$OUT"

      - name: Classify FLASH_READ opcode and downloader transport
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          export E=/tmp/v94/evidence
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          E=Path(os.environ['E'])
          sections=(E/'B1_OBJDUMP_H.txt').read_text(errors='replace').splitlines()
          strings=(E/'B1_STRINGS_ASCII_OFFSETS.txt').read_text(errors='replace').splitlines()
          imports=(E/'B1_OBJDUMP_P.txt').read_text(errors='replace')
          symbols=(E/'B1_NM_SYMBOLS.txt').read_text(errors='replace')
          xdump=(E/'B1_OBJDUMP_X.txt').read_text(errors='replace')

          sec=[]
          for i,line in enumerate(sections):
              m=re.match(r'\s*\d+\s+(\.\S+)\s+([0-9A-Fa-f]+)\s+([0-9A-Fa-f]+)\s+([0-9A-Fa-f]+)\s+([0-9A-Fa-f]+)',line)
              if m:
                  name,size,vma,lma,off=m.groups()
                  sec.append({'name':name,'size':int(size,16),'vma':int(vma,16),'file_off':int(off,16)})

          flash_offsets=[]
          for line in strings:
              if 'FLASH_READ (0x03)' in line:
                  m=re.match(r'\s*([0-9A-Fa-f]+)\s+',line)
                  if m: flash_offsets.append(int(m.group(1),16))

          def section_for(off):
              for s in sec:
                  if s['file_off'] <= off < s['file_off'] + s['size']:
                      return s['name']
              return None

          flash_sections=[section_for(x) for x in flash_offsets]
          macro_context=[]
          for line in strings:
              if re.search(r'FLASH_(WREN|WRDI|RDSR|HRDSR|RDSR3|WRSR|WRSR2|WRSR3|READ|FREAD|QIOFREAD|PP|QPP|SE|BE_64)',line):
                  macro_context.append(line.strip())

          import_names=[]
          for line in imports.splitlines():
              m=re.match(r'\s*[0-9A-Fa-f]+\s+\d+\s+([A-Za-z_][A-Za-z0-9_@?]*)\s*$',line)
              if m: import_names.append(m.group(1))
          import_names=sorted(set(import_names))

          network=[x for x in import_names if x.lower() in {'socket','connect','read','write','close','inet_aton'}]
          hid=[x for x in import_names if re.search(r'hidd_|hidp_|setupdi|winusb|libusb',x,re.I)]
          serial=[x for x in import_names if re.search(r'getcommstate|setcommstate|setcommtimeouts|purgecomm|clearcomm|waitcommevent',x,re.I)]

          required_symbols={
              'initial_socket':'initial_socket(char const*, unsigned int)',
              'out_io':'out_io(unsigned int, unsigned int, char*)',
              'send_cmd':'send_cmd(char)',
              'fastin':'fastin(unsigned int, unsigned int, char*)',
              'fastout':'fastout(unsigned int, unsigned int, char*)',
              'multi_out_new':'multi_out_new(unsigned int, unsigned int, unsigned char*, unsigned int)',
              'nds32_burn':'nds32_burn(unsigned int, unsigned char*, unsigned int)',
              'Verification':'Verification(unsigned int, unsigned char*, unsigned int)',
              'nds32_verify':'nds32_verify(unsigned int, unsigned char*, unsigned int)',
              'mxic_read':'mxic_read(unsigned int, unsigned char*, unsigned int)',
              'SpiCodeFlashReadStatus':'SpiCodeFlashReadStatus()',
              'ReadFlashStatusRegister':'ReadFlashStatusRegister(_SPI_CODE_FLASH_INFO*)',
              'spib_rx_data':'spib_rx_data(unsigned int*, int)',
              'spib_tx_data':'spib_tx_data(unsigned int*, int)',
          }
          sym_addrs={}
          for key,name in required_symbols.items():
              rx=re.compile(r'^([0-9A-Fa-f]+)\s+[A-Za-z]\s+'+re.escape(name)+r'\s*$',re.M)
              m=rx.search(symbols)
              if m: sym_addrs[key]='0x'+m.group(1).upper()

          ascii_text='\n'.join(strings)
          iceman_lines=[x.strip() for x in strings if re.search(r'ICEman|--host:|--port:|Port number to connect|can.t create socket|connecting fail',x,re.I)]
          default_port_2354=bool(re.search(r'default to 2354',ascii_text,re.I))

          source_files=[]
          for name in ['util.cpp','main.cpp','platform-ae210p.cpp','spiflash-MXIC.cpp']:
              if name in xdump: source_files.append(name)

          result={
              'flash_read_0x03_offsets':['0x%X'%x for x in flash_offsets],
              'flash_read_0x03_sections':flash_sections,
              'flash_read_0x03_is_dwarf_debug_macro':bool(flash_offsets) and all(x=='.debug_macro' for x in flash_sections),
              'spi_nor_macro_context':macro_context,
              'network_imports':network,
              'hid_usb_imports':hid,
              'serial_imports':serial,
              'iceman_usage_lines':iceman_lines,
              'iceman_default_port_2354':default_port_2354,
              'source_files_recovered':source_files,
              'symbol_addresses':sym_addrs,
              'downloader_role':'AndeSight/NDS32 flash burner driver',
              'transport_classification':'TCP socket client to ICEman debugger service',
              'spi_flash_read_primitive_present':'mxic_read' in sym_addrs,
              'verification_path_present':'Verification' in sym_addrs and 'nds32_verify' in sym_addrs,
              'direct_usb_hid_transport_proven':False,
              'direct_serial_transport_proven':False,
              'runtime_usb_generic_flash_readback_proven':False,
              'android_usb_full_firmware_dump_path_proven':False,
              'FLASH_ALLOWED':False,
          }
          (E/'V9_4_CLASSIFICATION.json').write_text(json.dumps(result,indent=2)+'\n')

          md=[
              '# V9.4 FIXED classification', '',
              '- `FLASH_READ (0x03)` occurs in **.debug_macro**, not executable protocol data.',
              '- It appears beside standard SPI NOR opcodes such as WREN 0x06, RDSR 0x05, PP 0x02, SE 0x20 and BE64 0xD8.',
              '- Therefore `FLASH_READ (0x03)` is classified as the SPI-NOR READ opcode/source macro, not a BP1048 USB command.',
              '- The executable imports socket/connect/read/write and contains `--host`, `--port`, `ICEman`, with default port **2354**.',
              '- The downloader is therefore an **AndeSight/NDS32 Flash Burner client talking to ICEman over TCP**.',
              '- Recovered symbols include `mxic_read`, `Verification`, `nds32_verify`, `out_io`, `fastin`, `fastout`, and SPIB register helpers.',
              '- This proves a flash-read primitive exists in the **debugger/ICE path**, but does not prove a readback path over the stock BP1048 runtime/recovery USB interfaces.',
              '- `FLASH_ALLOWED=NO`; target EXE and hardware were not executed.'
          ]
          (E/'V9_4_CLASSIFICATION.md').write_text('\n'.join(md)+'\n')
          PY
          cat /tmp/v94/evidence/V9_4_CLASSIFICATION.md >> "$GITHUB_STEP_SUMMARY"

      - name: Extract high-value function disassembly and call edges
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          export E=/tmp/v94/evidence
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          E=Path(os.environ['E'])
          d=(E/'B1_DISASSEMBLY.txt').read_text(errors='replace')
          n=(E/'B1_NM_SYMBOLS.txt').read_text(errors='replace')
          cls=json.loads((E/'V9_4_CLASSIFICATION.json').read_text())

          targets=['initial_socket','out_io','send_cmd','fastin','fastout','multi_out_new',
                   'nds32_burn','Verification','nds32_verify','mxic_read','SpiCodeFlashReadStatus',
                   'ReadFlashStatusRegister','spib_rx_data','spib_tx_data']

          addr_to_name={v.lower():k for k,v in cls['symbol_addresses'].items()}
          funcs={}
          lines=d.splitlines()
          header=re.compile(r'^([0-9a-fA-F]+)\s+<(.+)>:$')
          current=None
          buf=[]
          for line in lines:
              m=header.match(line.strip())
              if m:
                  if current in targets:
                      funcs[current]='\n'.join(buf)
                  dem=m.group(2)
                  current=None
                  for t in targets:
                      if dem.startswith(t+'(') or dem==t:
                          current=t; break
                  buf=[line] if current else []
              elif current:
                  buf.append(line)
          if current in targets:
              funcs[current]='\n'.join(buf)

          for name,text in funcs.items():
              (E/f'DISASM_{name}.txt').write_text(text+'\n')

          call_edges=[]
          call_re=re.compile(r'\bcall\s+([0-9a-fA-Fx]+)\s+<([^>]+)>')
          for src,text in funcs.items():
              for line in text.splitlines():
                  m=call_re.search(line)
                  if not m: continue
                  dst_dem=m.group(2)
                  dst=None
                  for t in targets:
                      if dst_dem.startswith(t+'(') or dst_dem==t:
                          dst=t; break
                  if dst:
                      call_edges.append({'from':src,'to':dst,'instruction':line.strip()})
          (E/'V9_4_CALL_EDGES.json').write_text(json.dumps(call_edges,indent=2)+'\n')

          summary={
              'functions_extracted':sorted(funcs),
              'call_edges':call_edges,
              'mxic_read_disassembly_extracted':'mxic_read' in funcs,
              'nds32_verify_disassembly_extracted':'nds32_verify' in funcs,
              'Verification_disassembly_extracted':'Verification' in funcs,
              'initial_socket_disassembly_extracted':'initial_socket' in funcs,
          }
          (E/'V9_4_DISASM_STATUS.json').write_text(json.dumps(summary,indent=2)+'\n')
          PY

      - name: Build final V9.4 report
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          python3 - <<'PY'
          import json
          from pathlib import Path
          E=Path('/tmp/v94/evidence')
          c=json.loads((E/'V9_4_CLASSIFICATION.json').read_text())
          d=json.loads((E/'V9_4_DISASM_STATUS.json').read_text())
          result={
              'sdk_commit':(E/'SDK_COMMIT.txt').read_text().strip(),
              'target_git_blob_sha1':(E/'B1_GIT_BLOB_SHA1.txt').read_text().strip(),
              'target_sha256':(E/'B1_SHA256.txt').read_text().split()[0],
              'target_size':1146395,
              'target_executed':False,
              'flash_read_0x03_classification':'SPI NOR READ opcode/source macro in DWARF .debug_macro',
              'downloader_transport':'TCP socket to ICEman debugger service, default port 2354',
              'debugger_flash_read_primitive_present':c['spi_flash_read_primitive_present'],
              'debugger_verification_path_present':c['verification_path_present'],
              'direct_usb_hid_transport_proven':False,
              'direct_serial_transport_proven':False,
              'stock_runtime_usb_flash_dump_path_proven':False,
              'stock_recovery_usb_flash_dump_path_proven':False,
              'android_usb_full_firmware_dump_path_proven':False,
              'high_value_disassembly_extracted':d['functions_extracted'],
              'call_edges':d['call_edges'],
              'FLASH_ALLOWED':False,
          }
          (E/'V9_4_RESULT.json').write_text(json.dumps(result,indent=2)+'\n')
          md=[
              '# BP1048P4 V9.4 FIXED result','',
              '- The previous V9.4 failure was a shell typo in the `grep` pipeline; this workflow fixes it.',
              '- `FLASH_READ (0x03)` is a **SPI NOR opcode macro stored in DWARF `.debug_macro`**, not a runtime/recovery USB command.',
              '- `b1_download_v1.7.exe` is an **AndeSight/NDS32 Flash Burner driver**.',
              '- Its host transport is **TCP to ICEman**, and the embedded usage says the default ICEman port is **2354**.',
              '- The binary contains a real debugger-side read primitive: `mxic_read(address, buffer, length)` plus `Verification` / `nds32_verify`.',
              '- So flash content can be read for debugger verification through the ICE/AndeSight path.',
              '- This does **not** establish a full-firmware read path through BP1048 stock USB runtime (`6324:1719`) or recovery FlashBoot (`0000:2244`).',
              '- Next target after this run: reconstruct `out_io` / `fastin` / `multi_in` ICEman request framing and determine whether the same target-memory read can be reached without proprietary ICE hardware.',
              '- `FLASH_ALLOWED=NO`; no target command was executed.'
          ]
          (E/'V9_4_REPORT.md').write_text('\n'.join(md)+'\n')
          PY
          cat /tmp/v94/evidence/V9_4_REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Final fail-closed assertions
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          python3 - <<'PY'
          import json
          from pathlib import Path
          E=Path('/tmp/v94/evidence')
          safety=(E/'SAFETY.txt').read_text()
          assert 'TARGET_EXECUTED=NO' in safety
          assert 'FLASH_READ_EXECUTED=NO' in safety
          assert 'FLASH_ERASE_EXECUTED=NO' in safety
          assert 'FLASH_WRITE_EXECUTED=NO' in safety
          assert (E/'SDK_COMMIT.txt').read_text().strip() == '8105bd864b04995d81c9f9ae77cb158259f39015'
          assert (E/'B1_GIT_BLOB_SHA1.txt').read_text().strip() == 'dd2503e5a78d9b7c12f8b680a6be83d090adb966'
          c=json.loads((E/'V9_4_CLASSIFICATION.json').read_text())
          r=json.loads((E/'V9_4_RESULT.json').read_text())
          assert c['flash_read_0x03_is_dwarf_debug_macro'] is True
          assert c['iceman_default_port_2354'] is True
          assert 'socket' in [x.lower() for x in c['network_imports']]
          assert 'connect' in [x.lower() for x in c['network_imports']]
          assert c['spi_flash_read_primitive_present'] is True
          assert c['verification_path_present'] is True
          assert r['debugger_flash_read_primitive_present'] is True
          assert r['stock_runtime_usb_flash_dump_path_proven'] is False
          assert r['stock_recovery_usb_flash_dump_path_proven'] is False
          assert r['android_usb_full_firmware_dump_path_proven'] is False
          assert r['FLASH_ALLOWED'] is False
          print('V9_4_FIXED_STATIC_AUDIT_COMPLETE=YES')
          print('FLASH_ALLOWED=NO')
          PY

      - name: Package V9.4 fixed evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          cd /tmp/v94/evidence
          zip -9 -r /tmp/OKN_BP1048P4_V9_4_FIXED_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/OKN_BP1048P4_V9_4_FIXED_EVIDENCE.zip > /tmp/OKN_BP1048P4_V9_4_FIXED_EVIDENCE.zip.sha256

      - name: Upload V9.4 fixed evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OKN-BP1048P4-V9_4-FIXED-EVIDENCE
          path: |
            /tmp/OKN_BP1048P4_V9_4_FIXED_EVIDENCE.zip
            /tmp/OKN_BP1048P4_V9_4_FIXED_EVIDENCE.zip.sha256
            /tmp/v94/evidence/V9_4_REPORT.md
            /tmp/v94/evidence/V9_4_RESULT.json
            /tmp/v94/evidence/V9_4_CLASSIFICATION.md
            /tmp/v94/evidence/V9_4_CLASSIFICATION.json
            /tmp/v94/evidence/V9_4_DISASM_STATUS.json
            /tmp/v94/evidence/V9_4_CALL_EDGES.json
            /tmp/v94/evidence/DISASM_initial_socket.txt
            /tmp/v94/evidence/DISASM_out_io.txt
            /tmp/v94/evidence/DISASM_fastin.txt
            /tmp/v94/evidence/DISASM_fastout.txt
            /tmp/v94/evidence/DISASM_mxic_read.txt
            /tmp/v94/evidence/DISASM_Verification.txt
            /tmp/v94/evidence/DISASM_nds32_verify.txt
            /tmp/v94/evidence/B1_TOOL_ROLE_EVIDENCE.txt
            /tmp/v94/evidence/B1_OBJDUMP_H.txt
            /tmp/v94/evidence/B1_OBJDUMP_P.txt
            /tmp/v94/evidence/B1_OBJDUMP_X.txt
            /tmp/v94/evidence/B1_NM_SYMBOLS.txt
            /tmp/v94/evidence/B1_SHA256.txt
            /tmp/v94/evidence/B1_GIT_BLOB_SHA1.txt
            /tmp/v94/evidence/B1_FILE_TYPE.txt
            /tmp/v94/evidence/SDK_COMMIT.txt
            /tmp/v94/evidence/SAFETY.txt
          if-no-files-found: warn
          retention-days: 90
