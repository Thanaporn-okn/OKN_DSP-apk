name: R72 BP1048P4 Android passive USB mode detector build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R72_BP1048P4_ANDROID_PASSIVE_USB_MODE_DETECTOR_BUILD.yml"

permissions:
  contents: read

concurrency:
  group: r72-bp1048p4-android-passive-detector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-passive-detector:
    name: Build S25+ passive USB detector / NO USB I-O / NO FLASH
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Create R72 Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/com/okn/dsp/passivedetector

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "OKN_BP1048P4_R72_Passive_USB_Detector"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.okn.dsp.passivedetector'
              compileSdk 35

              defaultConfig {
                  applicationId "com.okn.dsp.passivedetector"
                  minSdk 26
                  targetSdk 35
                  versionCode 72
                  versionName "72.0-passive-usb-detector"
              }

              buildTypes {
                  debug {
                      debuggable true
                  }
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature
                  android:name="android.hardware.usb.host"
                  android:required="true" />

              <application
                  android:allowBackup="false"
                  android:label="OKN USB Mode Detector R72"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="unspecified"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/okn/dsp/passivedetector/MainActivity.java <<'EOF'
          package com.okn.dsp.passivedetector;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.hardware.usb.UsbConstants;
          import android.hardware.usb.UsbDevice;
          import android.hardware.usb.UsbEndpoint;
          import android.hardware.usb.UsbInterface;
          import android.hardware.usb.UsbManager;
          import android.os.Bundle;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.util.ArrayList;
          import java.util.Comparator;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;

          public final class MainActivity extends Activity {
              // Production normal-runtime identity established by prior board logs.
              private static final int NORMAL_VID = 0x6324;
              private static final int NORMAL_PID = 0x1719;

              // Literal identity embedded in the exact reference PCTOOL flashboot.
              // This is NOT claimed to be production-live until observed on hardware.
              private static final int REF_BOOT_VID = 0x0000;
              private static final int REF_BOOT_PID = 0x2244;

              private UsbManager usbManager;
              private TextView statusView;
              private TextView logView;
              private final StringBuilder log = new StringBuilder();

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  usbManager = (UsbManager) getSystemService(Context.USB_SERVICE);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(24, 24, 24, 24);

                  TextView title = new TextView(this);
                  title.setText("OKN BP1048P4 — Passive USB Mode Detector R72");
                  title.setTextSize(20);
                  root.addView(title);

                  TextView safety = new TextView(this);
                  safety.setText(
                          "PASSIVE ONLY: enumerates Android USB metadata. " +
                          "No USB permission request, no openDevice, no control/bulk transfer, " +
                          "no HID report, no boot arm, no erase/program/reset.");
                  safety.setPadding(0, 8, 0, 14);
                  root.addView(safety);

                  statusView = new TextView(this);
                  statusView.setTextSize(18);
                  statusView.setText("Status: not scanned");
                  statusView.setPadding(0, 8, 0, 16);
                  root.addView(statusView);

                  Button scan = new Button(this);
                  scan.setText("SCAN USB NOW");
                  scan.setOnClickListener(v -> scanUsb());
                  root.addView(scan);

                  Button copy = new Button(this);
                  copy.setText("COPY LOG");
                  copy.setOnClickListener(v -> copyLog());
                  root.addView(copy);

                  logView = new TextView(this);
                  logView.setTextIsSelectable(true);

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(logView);
                  root.addView(
                          scroll,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));

                  setContentView(root);

                  append("R72 passive detector started.");
                  append("Normal runtime target: 6324:1719");
                  append("Reference flashboot literal: 0000:2244");
                  append("Reference flashboot shape: IF0 HID 03/00/00, endpoints=0");
                  append("Report sizes are NOT queried in passive mode.");
                  scanUsb();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (usbManager != null && logView != null) {
                      scanUsb();
                  }
              }

              private void scanUsb() {
                  append("");
                  append("=== PASSIVE USB SCAN ===");

                  Map<String, UsbDevice> map = usbManager.getDeviceList();
                  List<UsbDevice> devices = new ArrayList<>(map.values());
                  devices.sort(
                          Comparator
                                  .comparingInt(UsbDevice::getVendorId)
                                  .thenComparingInt(UsbDevice::getProductId)
                                  .thenComparing(UsbDevice::getDeviceName));

                  if (devices.isEmpty()) {
                      statusView.setText("Status: NO USB DEVICE");
                      append("No USB devices enumerated by Android.");
                      return;
                  }

                  boolean normalFound = false;
                  boolean referenceBootCandidate = false;
                  boolean genericEp0HidFound = false;

                  for (UsbDevice d : devices) {
                      append("");
                      append(String.format(
                              Locale.US,
                              "DEVICE %04X:%04X name=%s class=%02X/%02X/%02X ifaces=%d",
                              d.getVendorId(),
                              d.getProductId(),
                              d.getDeviceName(),
                              d.getDeviceClass(),
                              d.getDeviceSubclass(),
                              d.getDeviceProtocol(),
                              d.getInterfaceCount()));

                      boolean normal =
                              d.getVendorId() == NORMAL_VID &&
                              d.getProductId() == NORMAL_PID;

                      boolean ep0OnlyHid = hasEp0OnlyHidInterface0(d);
                      boolean refBootIdentity =
                              d.getVendorId() == REF_BOOT_VID &&
                              d.getProductId() == REF_BOOT_PID;

                      if (normal) {
                          normalFound = true;
                          append("CLASSIFICATION=NORMAL_RUNTIME_CONFIRMED");
                      } else if (refBootIdentity && ep0OnlyHid) {
                          referenceBootCandidate = true;
                          append(
                                  "CLASSIFICATION=REFERENCE_PCTOOL_BOOTLOADER_CANDIDATE");
                          append(
                                  "NOTE=VID/PID+interface shape match reference blob; " +
                                  "live report descriptor not queried.");
                      } else if (ep0OnlyHid) {
                          genericEp0HidFound = true;
                          append("CLASSIFICATION=UNKNOWN_EP0_ONLY_HID");
                      } else {
                          append("CLASSIFICATION=OTHER_USB_DEVICE");
                      }

                      dumpInterfaces(d);
                  }

                  if (referenceBootCandidate) {
                      statusView.setText(
                              "Status: REFERENCE PCTOOL BOOTLOADER CANDIDATE");
                  } else if (normalFound) {
                      statusView.setText("Status: NORMAL RUNTIME 6324:1719");
                  } else if (genericEp0HidFound) {
                      statusView.setText("Status: UNKNOWN EP0-ONLY HID");
                  } else {
                      statusView.setText("Status: target not detected");
                  }
              }

              private static boolean hasEp0OnlyHidInterface0(UsbDevice d) {
                  for (int i = 0; i < d.getInterfaceCount(); i++) {
                      UsbInterface intf = d.getInterface(i);
                      if (intf.getId() == 0 &&
                              intf.getInterfaceClass() == UsbConstants.USB_CLASS_HID &&
                              intf.getInterfaceSubclass() == 0 &&
                              intf.getInterfaceProtocol() == 0 &&
                              intf.getEndpointCount() == 0) {
                          return true;
                      }
                  }
                  return false;
              }

              private void dumpInterfaces(UsbDevice d) {
                  for (int i = 0; i < d.getInterfaceCount(); i++) {
                      UsbInterface intf = d.getInterface(i);
                      append(String.format(
                              Locale.US,
                              "  IF[%d] id=%d alt=%d class=%02X/%02X/%02X eps=%d",
                              i,
                              intf.getId(),
                              intf.getAlternateSetting(),
                              intf.getInterfaceClass(),
                              intf.getInterfaceSubclass(),
                              intf.getInterfaceProtocol(),
                              intf.getEndpointCount()));

                      for (int e = 0; e < intf.getEndpointCount(); e++) {
                          UsbEndpoint ep = intf.getEndpoint(e);
                          append(String.format(
                                  Locale.US,
                                  "    EP[%d] addr=0x%02X dir=%s type=%d maxPacket=%d interval=%d",
                                  e,
                                  ep.getAddress(),
                                  ep.getDirection() == UsbConstants.USB_DIR_IN
                                          ? "IN" : "OUT",
                                  ep.getType(),
                                  ep.getMaxPacketSize(),
                                  ep.getInterval()));
                      }
                  }
              }

              private void copyLog() {
                  ClipboardManager cb =
                          (ClipboardManager) getSystemService(CLIPBOARD_SERVICE);
                  cb.setPrimaryClip(
                          ClipData.newPlainText(
                                  "OKN R72 Passive USB Detector Log",
                                  log.toString()));
                  append("Log copied.");
              }

              private void append(String line) {
                  log.append(line).append('\n');
                  if (logView != null) {
                      logView.setText(log.toString());
                  }
              }
          }
          EOF

      - name: Source-level passive safety audit
        id: safety
        shell: bash
        run: |
          set -euo pipefail

          SRC=app/src/main/java/com/okn/dsp/passivedetector/MainActivity.java

          grep -F 'NORMAL_VID = 0x6324' "$SRC"
          grep -F 'NORMAL_PID = 0x1719' "$SRC"
          grep -F 'REF_BOOT_VID = 0x0000' "$SRC"
          grep -F 'REF_BOOT_PID = 0x2244' "$SRC"
          grep -F 'UsbManager::getDeviceList' /dev/null 2>/dev/null || true
          grep -F 'usbManager.getDeviceList()' "$SRC"
          grep -F 'USB_CLASS_HID' "$SRC"
          grep -F 'intf.getEndpointCount() == 0' "$SRC"

          # Hard fail if any active USB I/O or permission API is present.
          ! grep -F 'UsbDeviceConnection' "$SRC"
          ! grep -F 'openDevice(' "$SRC"
          ! grep -F 'controlTransfer(' "$SRC"
          ! grep -F 'bulkTransfer(' "$SRC"
          ! grep -F 'claimInterface(' "$SRC"
          ! grep -F 'releaseInterface(' "$SRC"
          ! grep -F 'requestPermission(' "$SRC"

          # Hard fail if HID-report/boot/flash command tokens are present.
          ! grep -Eai \
            'SET_REPORT|GET_REPORT|HID_SET_REPORT|HID_GET_REPORT|chiperas|codedata|bootdat|constdat|cnfgdat|btupdat|upinfo|cxxx|SpiFlash|FlashErase|FlashWrite|Reset_McuSystem' \
            "$SRC"

          cat > R72_SAFETY_AUDIT.txt <<'EOF'
          R72_PASSIVE_USB_ENUMERATION_ONLY=YES
          R72_USB_PERMISSION_REQUEST_PRESENT=NO
          R72_OPEN_DEVICE_PRESENT=NO
          R72_CONTROL_TRANSFER_PRESENT=NO
          R72_BULK_TRANSFER_PRESENT=NO
          R72_CLAIM_INTERFACE_PRESENT=NO
          R72_HID_REPORT_COMMAND_PRESENT=NO
          R72_FLASH_COMMAND_PRESENT=NO
          R72_NORMAL_RUNTIME_IDENTITY=6324:1719
          R72_REFERENCE_BOOTLOADER_LITERAL_IDENTITY=0000:2244
          R72_REFERENCE_BOOTLOADER_INTERFACE_SHAPE=IF0_HID_03_00_00_EP0_ONLY
          R72_REFERENCE_REPORT_DESCRIPTOR_QUERIED_LIVE=NO
          R72_PRODUCTION_LIVE_BOOTLOADER_IDENTITY_PROVEN=NO
          FLASH_ALLOWED=NO
          EOF

          cat R72_SAFETY_AUDIT.txt

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug

      - name: Verify APK and package artifact
        shell: bash
        run: |
          set -euo pipefail

          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"

          cp "$APK" OKN_BP1048P4_R72_PASSIVE_USB_MODE_DETECTOR.apk

          sha256sum OKN_BP1048P4_R72_PASSIVE_USB_MODE_DETECTOR.apk \
            | tee OKN_BP1048P4_R72_PASSIVE_USB_MODE_DETECTOR_SHA256.txt

          unzip -l OKN_BP1048P4_R72_PASSIVE_USB_MODE_DETECTOR.apk \
            | tee R72_APK_FILE_LIST.txt

          test -s R72_SAFETY_AUDIT.txt
          grep -F 'R72_PASSIVE_USB_ENUMERATION_ONLY=YES' R72_SAFETY_AUDIT.txt
          grep -F 'R72_CONTROL_TRANSFER_PRESENT=NO' R72_SAFETY_AUDIT.txt
          grep -F 'R72_FLASH_COMMAND_PRESENT=NO' R72_SAFETY_AUDIT.txt
          grep -F 'FLASH_ALLOWED=NO' R72_SAFETY_AUDIT.txt

      - name: Upload R72 APK
        uses: actions/upload-artifact@v4
        with:
          name: R72-OKN-BP1048P4-PASSIVE-USB-MODE-DETECTOR
          path: |
            OKN_BP1048P4_R72_PASSIVE_USB_MODE_DETECTOR.apk
            OKN_BP1048P4_R72_PASSIVE_USB_MODE_DETECTOR_SHA256.txt
            R72_SAFETY_AUDIT.txt
            R72_APK_FILE_LIST.txt
          if-no-files-found: error
          retention-days: 30

      - name: R72 final gate
        shell: bash
        run: |
          set -euo pipefail

          test "${{ steps.safety.outcome }}" = "success"

          grep -F 'R72_PASSIVE_USB_ENUMERATION_ONLY=YES' R72_SAFETY_AUDIT.txt
          grep -F 'R72_USB_PERMISSION_REQUEST_PRESENT=NO' R72_SAFETY_AUDIT.txt
          grep -F 'R72_OPEN_DEVICE_PRESENT=NO' R72_SAFETY_AUDIT.txt
          grep -F 'R72_CONTROL_TRANSFER_PRESENT=NO' R72_SAFETY_AUDIT.txt
          grep -F 'R72_BULK_TRANSFER_PRESENT=NO' R72_SAFETY_AUDIT.txt
          grep -F 'R72_CLAIM_INTERFACE_PRESENT=NO' R72_SAFETY_AUDIT.txt
          grep -F 'R72_HID_REPORT_COMMAND_PRESENT=NO' R72_SAFETY_AUDIT.txt
          grep -F 'R72_FLASH_COMMAND_PRESENT=NO' R72_SAFETY_AUDIT.txt
          grep -F 'R72_PRODUCTION_LIVE_BOOTLOADER_IDENTITY_PROVEN=NO' R72_SAFETY_AUDIT.txt
          grep -F 'FLASH_ALLOWED=NO' R72_SAFETY_AUDIT.txt

          echo "R72_ANDROID_PASSIVE_USB_MODE_DETECTOR=PASS"
          echo "FLASH_ALLOWED=NO"
