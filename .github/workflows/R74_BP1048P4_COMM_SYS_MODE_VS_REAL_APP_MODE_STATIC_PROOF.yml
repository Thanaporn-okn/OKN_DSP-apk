name: R74 BP1048P4 communication sys_mode vs real app mode static proof

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R74_BP1048P4_COMM_SYS_MODE_VS_REAL_APP_MODE_STATIC_PROOF.yml"

permissions:
  contents: read

concurrency:
  group: r74-bp1048p4-sys-mode-vs-app-mode-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_REPO: https://github.com/leadercxn/bp1048_sdk_v0.1.12.git
  SDK_COMMIT: 8105bd864b04995d81c9f9ae77cb158259f39015

jobs:
  static-proof:
    name: sys_mode control variable vs GetSystemMode / STATIC ONLY / NO USB / NO FLASH
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch pinned SDK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/bp1048_r74
          git init -q /tmp/bp1048_r74
          cd /tmp/bp1048_r74
          git remote add origin "$SDK_REPO"
          git fetch -q --depth=1 origin "$SDK_COMMIT"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SDK_COMMIT"
          echo "R74_SDK_COMMIT=$(git rev-parse HEAD)" \
            | tee /tmp/R74_SDK_STATE.txt

      - name: Enumerate every gCtrlVars.sys_mode reference
        id: sys_mode_refs
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/bp1048_r74

          grep -RIn \
            --include='*.c' \
            --include='*.h' \
            -E '\bgCtrlVars\.sys_mode\b|\bsys_mode\b' \
            "$ROOT" \
            | tee /tmp/R74_SYS_MODE_ALL.txt || true

          python3 - <<'PY'
          from pathlib import Path
          import re

          lines=[
              x for x in Path("/tmp/R74_SYS_MODE_ALL.txt")
              .read_text(encoding="utf-8", errors="replace")
              .splitlines()
              if x.strip()
          ]

          writes=[]
          readbacks=[]
          declarations=[]
          defaults=[]
          other=[]

          for line in lines:
              if "uint16_t" in line and "sys_mode" in line:
                  declarations.append(line)
                  continue
              if "CFG_SYS_MODE" in line:
                  defaults.append(line)

              if "gCtrlVars.sys_mode" not in line:
                  continue

              if re.search(r"gCtrlVars\.sys_mode\s*=", line):
                  writes.append(line)
              elif "memcpy" in line and "&gCtrlVars.sys_mode" in line:
                  # In this source the known occurrence is tx-buffer serialization.
                  if re.search(
                      r"memcpy\s*\(\s*&?tx_buf\[[^\]]+\]\s*,\s*&gCtrlVars\.sys_mode",
                      line
                  ):
                      readbacks.append(line)
                  else:
                      other.append(line)
              else:
                  other.append(line)

          operational=[
              x for x in other
              if "return" not in x
          ]

          out=[
              f"R74_SYS_MODE_TOTAL_REFERENCES={len(lines)}",
              f"R74_SYS_MODE_DECLARATIONS={len(declarations)}",
              f"R74_SYS_MODE_WRITES={len(writes)}",
              f"R74_SYS_MODE_READBACK_SERIALIZATIONS={len(readbacks)}",
              f"R74_SYS_MODE_DEFAULT_REFERENCES={len(defaults)}",
              f"R74_SYS_MODE_OTHER_REFERENCES={len(other)}",
              f"R74_SYS_MODE_OPERATIONAL_CONSUMERS={len(operational)}",
              "R74_SYS_MODE_HAS_OPERATIONAL_CONSUMER="
              + ("YES" if operational else "NO"),
          ]

          Path("/tmp/R74_SYS_MODE_STATE.txt").write_text(
              "\n".join(out)+"\n", encoding="utf-8"
          )
          Path("/tmp/R74_SYS_MODE_OTHER.txt").write_text(
              "\n".join(other)+"\n", encoding="utf-8"
          )

          print("\n".join(out))
          if other:
              print("=== other references ===")
              print("\n".join(other))
          PY

      - name: Prove communication command only writes gCtrlVars.sys_mode
        id: comm_mode
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/bp1048_r74/BT_Audio_APP/bt_audio_app_src/audio/communication.c

          python3 - "$SRC" <<'PY'
          from pathlib import Path
          import sys

          lines=Path(sys.argv[1]).read_text(
              encoding="latin-1", errors="replace"
          ).splitlines()

          start=next(
              i for i,x in enumerate(lines)
              if "case 0:" in x and "system mode" in x
          )
          end=next(
              i for i in range(start+1, len(lines))
              if "case 1:" in lines[i] and "system reset" in lines[i]
          )

          block=lines[start:end]
          text="\n".join(block)

          required=[
              "memcpy(&TmpData, &buf[1], 2);",
              "TmpData = TmpData > 1? 1 : TmpData;",
              "gCtrlVars.sys_mode =  TmpData;",
          ]
          for x in required:
              if x not in text:
                  raise SystemExit("missing expected sys_mode logic: "+x)

          forbidden=[
              "mainAppCt.appCurrentMode",
              "mainAppCt.appTargetMode",
              "AppModes",
              "FindModeByPlugInMsg",
              "ModeStateSet",
              "GetSystemMode",
              "ResourceRegister",
              "start_up_grate",
              "Reset_McuSystem",
              "ROM_SysReset",
              "ADR_FLASH_BOOT_FLAGE",
              "SREG_FLASH_BOOT_FLAGE",
          ]

          bad=[x for x in forbidden if x in text]
          if bad:
              raise SystemExit(
                  "unexpected real app-mode/boot side effect in sys_mode case: "
                  + ",".join(bad)
              )

          Path("/tmp/R74_COMM_SYS_MODE_BLOCK.txt").write_text(
              "\n".join(
                  f"{start+i+1}: {line}"
                  for i,line in enumerate(block)
              )+"\n",
              encoding="utf-8"
          )

          out=[
              "R74_COMM_SYS_MODE_COMMAND_PRESENT=YES",
              "R74_COMM_SYS_MODE_VALUE_CLAMPED_0_OR_1=YES",
              "R74_COMM_SYS_MODE_WRITES_CTRLVAR_ONLY=YES",
              "R74_COMM_SYS_MODE_WRITES_APP_CURRENT_MODE=NO",
              "R74_COMM_SYS_MODE_WRITES_APP_TARGET_MODE=NO",
              "R74_COMM_SYS_MODE_CALLS_MODE_SWITCH_API=NO",
              "R74_COMM_SYS_MODE_CALLS_RESOURCE_REGISTER=NO",
              "R74_COMM_SYS_MODE_CALLS_START_UP_GRATE=NO",
              "R74_COMM_SYS_MODE_WRITES_FLASHBOOT_FLAG=NO",
          ]

          Path("/tmp/R74_COMM_SYS_MODE_STATE.txt").write_text(
              "\n".join(out)+"\n",
              encoding="utf-8"
          )
          print("\n".join(out))
          PY

      - name: Prove GetSystemMode source of truth is appCurrentMode
        id: get_system_mode
        shell: bash
        run: |
          set -euo pipefail

          MAIN=/tmp/bp1048_r74/BT_Audio_APP/bt_audio_app_src/apps/main_task.c

          python3 - "$MAIN" <<'PY'
          from pathlib import Path
          import sys

          lines=Path(sys.argv[1]).read_text(
              encoding="latin-1", errors="replace"
          ).splitlines()

          start=next(
              i for i,x in enumerate(lines)
              if "uint32_t GetSystemMode(void)" in x
          )
          block=lines[start:start+8]
          text="\n".join(block)

          if "return mainAppCt.appCurrentMode;" not in text:
              raise SystemExit(
                  "GetSystemMode no longer returns mainAppCt.appCurrentMode"
              )

          if "gCtrlVars.sys_mode" in text:
              raise SystemExit(
                  "GetSystemMode unexpectedly references gCtrlVars.sys_mode"
              )

          Path("/tmp/R74_GET_SYSTEM_MODE_BLOCK.txt").write_text(
              "\n".join(
                  f"{start+i+1}: {line}"
                  for i,line in enumerate(block)
              )+"\n",
              encoding="utf-8"
          )

          state = [
              "R74_GET_SYSTEM_MODE_RETURNS_APP_CURRENT_MODE=YES",
              "R74_GET_SYSTEM_MODE_READS_GCTRLVARS_SYS_MODE=NO",
          ]
          Path("/tmp/R74_GET_SYSTEM_MODE_STATE.txt").write_text(
              "\n".join(state)+"\n", encoding="utf-8"
          )
          print("\n".join(state))
          PY

      - name: Prove USB resource threshold depends on GetSystemMode not sys_mode ctrlvar
        id: usb_threshold
        shell: bash
        run: |
          set -euo pipefail

          DET=/tmp/bp1048_r74/BT_Audio_APP/bt_audio_app_src/device/device_detect.c
          MODEH=/tmp/bp1048_r74/BT_Audio_APP/bt_audio_app_src/inc/mode_switch_api.h

          grep -F 'if(GetSystemMode()<AppModeLineAudioPlay)' "$DET"
          grep -F 'InOrOut = OTG_PortDeviceIsLink();' "$DET"

          python3 - "$DET" "$MODEH" <<'PY'
          from pathlib import Path
          import re, sys

          det=Path(sys.argv[1]).read_text(
              encoding="latin-1", errors="replace"
          ).splitlines()
          modeh=Path(sys.argv[2]).read_text(
              encoding="latin-1", errors="replace"
          ).splitlines()

          early=next(
              i for i,x in enumerate(det)
              if "if(GetSystemMode()<AppModeLineAudioPlay)" in x.replace(" ","")
              or "if(GetSystemMode()<AppModeLineAudioPlay)" in x
          )
          link=next(
              i for i,x in enumerate(det)
              if "InOrOut = OTG_PortDeviceIsLink();" in x
          )
          if not early < link:
              raise SystemExit("early return no longer precedes USB link test")

          enum={}
          cur=-1
          inside=False
          for line in modeh:
              if "typedef enum" in line:
                  inside=True
                  continue
              if inside and "}AppMode" in line.replace(" ",""):
                  break
              if inside:
                  m=re.match(
                      r"\s*(AppMode[A-Za-z0-9_]+)\s*(?:=\s*([0-9]+))?\s*,?",
                      line
                  )
                  if m:
                      if m.group(2) is not None:
                          cur=int(m.group(2))
                      else:
                          cur+=1
                      enum[m.group(1)]=cur

          for k in [
              "AppModeWaitingPlay",
              "AppModeRestPlay",
              "AppModeLineAudioPlay",
              "AppModeUsbDevicePlay",
          ]:
              if k not in enum:
                  raise SystemExit("missing enum "+k)

          out=[
              f"R74_APP_MODE_WAITING={enum['AppModeWaitingPlay']}",
              f"R74_APP_MODE_REST={enum['AppModeRestPlay']}",
              f"R74_APP_MODE_LINE={enum['AppModeLineAudioPlay']}",
              f"R74_APP_MODE_USB_DEVICE={enum['AppModeUsbDevicePlay']}",
              "R74_USB_RESOURCE_GATE_USES_GET_SYSTEM_MODE=YES",
              "R74_USB_RESOURCE_GATE_USES_GCTRLVARS_SYS_MODE=NO",
              "R74_WAITING_BELOW_USB_DETECT_THRESHOLD="
              + ("YES" if enum["AppModeWaitingPlay"] < enum["AppModeLineAudioPlay"] else "NO"),
              "R74_REST_BELOW_USB_DETECT_THRESHOLD="
              + ("YES" if enum["AppModeRestPlay"] < enum["AppModeLineAudioPlay"] else "NO"),
          ]

          Path("/tmp/R74_USB_THRESHOLD_STATE.txt").write_text(
              "\n".join(out)+"\n",
              encoding="utf-8"
          )
          print("\n".join(out))
          PY

      - name: Enumerate real appCurrentMode writers
        id: real_mode_writers
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/bp1048_r74/BT_Audio_APP

          grep -RIn \
            --include='*.c' \
            --include='*.h' \
            -E 'appCurrentMode[[:space:]]*=' \
            "$ROOT" \
            | tee /tmp/R74_APP_CURRENT_MODE_WRITERS.txt || true

          COUNT="$(grep -c . /tmp/R74_APP_CURRENT_MODE_WRITERS.txt || true)"

          {
            echo "R74_APP_CURRENT_MODE_ASSIGNMENT_SITES=$COUNT"
          } | tee /tmp/R74_APP_MODE_WRITER_STATE.txt

          test "$COUNT" -ge 1

          if grep -F 'gCtrlVars.sys_mode' /tmp/R74_APP_CURRENT_MODE_WRITERS.txt \
               | grep -q .; then
            echo "R74_APP_CURRENT_MODE_WRITTEN_FROM_GCTRLVARS_SYS_MODE=YES" \
              | tee -a /tmp/R74_APP_MODE_WRITER_STATE.txt
          else
            echo "R74_APP_CURRENT_MODE_WRITTEN_FROM_GCTRLVARS_SYS_MODE=NO" \
              | tee -a /tmp/R74_APP_MODE_WRITER_STATE.txt
          fi

      - name: Build R74 decision
        id: decision
        shell: bash
        run: |
          set -euo pipefail

          OP="$(
            grep '^R74_SYS_MODE_HAS_OPERATIONAL_CONSUMER=' \
              /tmp/R74_SYS_MODE_STATE.txt | cut -d= -f2
          )"

          FROM_CTRL="$(
            grep '^R74_APP_CURRENT_MODE_WRITTEN_FROM_GCTRLVARS_SYS_MODE=' \
              /tmp/R74_APP_MODE_WRITER_STATE.txt | cut -d= -f2
          )"

          cat > /tmp/R74_DECISION.txt <<EOF
          R74_SYS_MODE_HAS_OPERATIONAL_CONSUMER=$OP
          R74_APP_CURRENT_MODE_WRITTEN_FROM_GCTRLVARS_SYS_MODE=$FROM_CTRL

          R74_COMM_SYS_MODE_IS_REAL_APP_MODE_SWITCH=NO
          R74_COMM_SYS_MODE_CAN_BE_USED_TO_RAISE_GETSYSTEMMODE_THRESHOLD=NO

          R74_USB_RESOURCE_GATE_DEPENDS_ON_REAL_APP_CURRENT_MODE=YES
          R74_USB_RESOURCE_GATE_NOT_DRIVEN_BY_COMM_SYS_MODE=YES

          R74_LIVE_SYS_MODE_WRITE_PROBE_REQUIRED=NO
          R74_REPEAT_AA55_REQUIRED=NO

          R74_PRODUCTION_FIRST_BOOTSTRAP_PROVEN=NO
          R74_STOCK_BACKUP_PROVEN=NO
          R74_RECOVERY_PROVEN=NO

          R74_BOARD_USB_ACCESSED=NO
          R74_FLASH_WRITE_EXECUTED=NO
          R74_FLASH_ERASE_EXECUTED=NO
          FLASH_ALLOWED=NO
          EOF

          cat /tmp/R74_DECISION.txt

      - name: Build R74 evidence bundle
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          OUT=/tmp/R74_BP1048P4_SYS_MODE_VS_REAL_APP_MODE_EVIDENCE
          rm -rf "$OUT"
          mkdir -p "$OUT"

          for f in \
            R74_SDK_STATE.txt \
            R74_SYS_MODE_ALL.txt \
            R74_SYS_MODE_STATE.txt \
            R74_SYS_MODE_OTHER.txt \
            R74_COMM_SYS_MODE_BLOCK.txt \
            R74_COMM_SYS_MODE_STATE.txt \
            R74_GET_SYSTEM_MODE_BLOCK.txt \
            R74_GET_SYSTEM_MODE_STATE.txt \
            R74_USB_THRESHOLD_STATE.txt \
            R74_APP_CURRENT_MODE_WRITERS.txt \
            R74_APP_MODE_WRITER_STATE.txt \
            R74_DECISION.txt; do
            test -f "/tmp/$f" && cp "/tmp/$f" "$OUT/"
          done

          cat > "$OUT/README.txt" <<'EOF'
          R74 proves whether communication-layer gCtrlVars.sys_mode controls
          the actual application mode used by GetSystemMode() and the USB
          resource detector.

          Key distinction:
          - communication sys_mode is a control variable exposed to the host
          - GetSystemMode() returns mainAppCt.appCurrentMode
          - USB resource detection gates on GetSystemMode()

          The workflow intentionally does not send a live sys_mode write because
          static source proof is sufficient to determine whether it can raise
          the USB resource threshold in the reference SDK.

          Static only. No board USB access. No reset. No erase/program/flash.
          EOF

          (
            cd /tmp
            zip -qr \
              R74_BP1048P4_SYS_MODE_VS_REAL_APP_MODE_EVIDENCE.zip \
              R74_BP1048P4_SYS_MODE_VS_REAL_APP_MODE_EVIDENCE
            sha256sum \
              R74_BP1048P4_SYS_MODE_VS_REAL_APP_MODE_EVIDENCE.zip \
              > R74_BP1048P4_SYS_MODE_VS_REAL_APP_MODE_EVIDENCE.zip.sha256
          )

          cat /tmp/R74_BP1048P4_SYS_MODE_VS_REAL_APP_MODE_EVIDENCE.zip.sha256

      - name: Upload R74 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R74-BP1048P4-SYS-MODE-VS-REAL-APP-MODE-EVIDENCE
          path: |
            /tmp/R74_BP1048P4_SYS_MODE_VS_REAL_APP_MODE_EVIDENCE.zip
            /tmp/R74_BP1048P4_SYS_MODE_VS_REAL_APP_MODE_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: R74 final gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          cat /tmp/R74_SYS_MODE_STATE.txt 2>/dev/null || true
          cat /tmp/R74_COMM_SYS_MODE_STATE.txt 2>/dev/null || true
          cat /tmp/R74_USB_THRESHOLD_STATE.txt 2>/dev/null || true
          cat /tmp/R74_APP_MODE_WRITER_STATE.txt 2>/dev/null || true
          cat /tmp/R74_DECISION.txt 2>/dev/null || true

          test "${{ steps.sys_mode_refs.outcome }}" = "success"
          test "${{ steps.comm_mode.outcome }}" = "success"
          test "${{ steps.get_system_mode.outcome }}" = "success"
          test "${{ steps.usb_threshold.outcome }}" = "success"
          test "${{ steps.real_mode_writers.outcome }}" = "success"
          test "${{ steps.decision.outcome }}" = "success"

          grep -F 'R74_COMM_SYS_MODE_WRITES_CTRLVAR_ONLY=YES' \
            /tmp/R74_COMM_SYS_MODE_STATE.txt
          grep -F 'R74_GET_SYSTEM_MODE_RETURNS_APP_CURRENT_MODE=YES' \
            /tmp/R74_GET_SYSTEM_MODE_STATE.txt
          grep -F 'R74_USB_RESOURCE_GATE_USES_GET_SYSTEM_MODE=YES' \
            /tmp/R74_USB_THRESHOLD_STATE.txt
          grep -F 'R74_APP_CURRENT_MODE_WRITTEN_FROM_GCTRLVARS_SYS_MODE=NO' \
            /tmp/R74_APP_MODE_WRITER_STATE.txt
          grep -F 'R74_COMM_SYS_MODE_IS_REAL_APP_MODE_SWITCH=NO' \
            /tmp/R74_DECISION.txt
          grep -F 'R74_LIVE_SYS_MODE_WRITE_PROBE_REQUIRED=NO' \
            /tmp/R74_DECISION.txt
          grep -F 'R74_BOARD_USB_ACCESSED=NO' \
            /tmp/R74_DECISION.txt
          grep -F 'FLASH_ALLOWED=NO' \
            /tmp/R74_DECISION.txt

          echo "R74_COMM_SYS_MODE_VS_REAL_APP_MODE_STATIC_PROOF=PASS"
          echo "FLASH_ALLOWED=NO"
