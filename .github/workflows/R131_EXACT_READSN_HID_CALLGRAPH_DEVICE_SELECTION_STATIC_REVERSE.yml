name: R131 exact READSN HID callgraph device-selection static reverse FIXED

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R131_EXACT_READSN_HID_CALLGRAPH_DEVICE_SELECTION_STATIC_REVERSE.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r131-readsn-hid-classification-fixed-${{ github.ref }}
  cancel-in-progress: true

env:
  FLASH_ALLOWED: "NO"
  R127_RUN_ID: "35865759674"
  R127_ACQUIRED_ARTIFACT_NAME: "R127-ACQUIRED-PUBLIC-FILES"
  R127_INNER_ZIP_SHA256: "d217dff170352179ee3d6a70b8e3a58b98b41ef2d365a4551daff4124ce21be6"
  BT_NAME_RAR_SHA256: "c6b1fcb4d0e430c86c50e9ddf1007fa110f416c0570888060d693819164eccb8"
  PCTOOLS_SHA256: "0e13801b29070f805869823e6db4ad56d70494b2621fb63c330cea1d69e9ca33"
  UPGRADE_FLASH_SHA256: "bebb887b04fc724e1c459cce15d4395c78df3e098c54f06369ffe78b50aec073"
  R130_RUN_ID: "35881983712"
  R130_JOB_ID: "107252476179"
  R130_EVIDENCE_ARTIFACT_NAME: "R130-EXACT-PCTOOLS-READONLY-IDENTIFY-RECOVERY-USB-STATIC-EVIDENCE"
  R130_EVIDENCE_ARTIFACT_ID: "10760539531"
  R130_EVIDENCE_DIGEST: "sha256:58eba111548d6708748769680e9fa58ea5d551cea91fce6e05f75ed2e18c4671"
  R131_CANCELLED_RUN_ID: "35883252396"
  R131_CANCELLED_JOB_ID: "107256787901"

jobs:
  static_reverse:
    name: STATIC ONLY - classify HID reads - no execution - no USB - no board
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r131/input /tmp/r131/acquired /tmp/r131/unpacked/bt /tmp/r131/r130 /tmp/r131/evidence
          cat > /tmp/r131/evidence/R131_SAFETY.txt <<'EOF'
          R131_MODE=READSN_HID_CLASSIFICATION_STATIC_ONLY_FIXED_AFTER_TIMEOUT
          R131_VENDOR_BINARY_EXECUTED=NO
          R131_USB_DEVICE_ACCESS=NO
          R131_BOARD_CONTACT=NO
          R131_AA55_SENT=NO
          R131_RUNTIME_0X11_SENT=NO
          R131_RUNTIME_0XFE_SENT=NO
          R131_FLASH_READ_EXECUTED=NO
          R131_FLASH_ERASE_EXECUTED=NO
          R131_FLASH_WRITE_EXECUTED=NO
          R131_ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD=NO
          FLASH_ALLOWED=NO
          EOF

      - name: Download pinned R127 acquired files as inert data
        uses: actions/download-artifact@v4
        with:
          name: R127-ACQUIRED-PUBLIC-FILES
          path: /tmp/r131/input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 35865759674

      - name: Download pinned R130 evidence for continuity only
        uses: actions/download-artifact@v4
        with:
          name: R130-EXACT-PCTOOLS-READONLY-IDENTIFY-RECOVERY-USB-STATIC-EVIDENCE
          path: /tmp/r131/r130
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 35881983712

      - name: Install static tooling only
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq file unzip p7zip-full python3-pip >/dev/null
          python3 -m pip install --disable-pip-version-check --no-input pefile capstone >/dev/null

      - name: Verify pinned hashes and extract inert files
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r131/input
          test -f R127_ACQUIRED_PUBLIC_FILES.zip
          echo "${R127_INNER_ZIP_SHA256}  R127_ACQUIRED_PUBLIC_FILES.zip" | sha256sum -c -
          unzip -q R127_ACQUIRED_PUBLIC_FILES.zip -d /tmp/r131/acquired
          BT_RAR="$(find /tmp/r131/acquired -type f -name '*.rar' -path '*BT_NAME_TOOL*' -print -quit)"
          test -n "$BT_RAR"
          echo "${BT_NAME_RAR_SHA256}  ${BT_RAR}" | sha256sum -c -
          7z x -y -o/tmp/r131/unpacked/bt "$BT_RAR" >/tmp/r131/evidence/R131_7Z_BT_EXTRACT.txt
          PCTOOLS="$(find /tmp/r131/unpacked/bt -type f -name 'MV_AP82xx_BP10xx_PC_Tools_V2.2.8_20210205.exe' -print -quit)"
          UPGRADE="$(find /tmp/r131/unpacked/bt -type f -name 'upgrade_flash.exe' -print -quit)"
          test -n "$PCTOOLS" -a -n "$UPGRADE"
          echo "${PCTOOLS_SHA256}  ${PCTOOLS}" | sha256sum -c -
          echo "${UPGRADE_FLASH_SHA256}  ${UPGRADE}" | sha256sum -c -
          printf '%s\n' "$PCTOOLS" > /tmp/r131/PCTOOLS_PATH
          printf '%s\n' "$UPGRADE" > /tmp/r131/UPGRADE_PATH

      - name: Classify every HID read call by nearby write coupling and response checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re,pefile
          from capstone import Cs,CS_ARCH_X86,CS_MODE_32
          from capstone.x86 import X86_OP_IMM,X86_OP_MEM

          targets={
            'pctools':Path(Path('/tmp/r131/PCTOOLS_PATH').read_text().strip()),
            'upgrade_flash':Path(Path('/tmp/r131/UPGRADE_PATH').read_text().strip()),
          }
          read_names={'HidD_GetFeature','HidD_GetInputReport','HidP_GetCaps'}
          write_names={'HidD_SetFeature','HidD_SetOutputReport','WriteFile'}
          danger_re=re.compile(r'chiperas|codedata|bootdat|constdat|cnfgdat|btupdat|upinfo|cxxx|flash|erase|program|mva|upgrade',re.I)
          ident_re=re.compile(r'readsn|serial|version|identify|device|vid_|pid_|vendor|product|firmware',re.I)
          all_rows=[]

          for label,p in targets.items():
            data=p.read_bytes(); pe=pefile.PE(str(p),fast_load=False); ib=pe.OPTIONAL_HEADER.ImageBase
            iat={}
            for e in getattr(pe,'DIRECTORY_ENTRY_IMPORT',[]):
              for imp in e.imports:
                if imp.name:
                  n=imp.name.decode('latin1','replace')
                  if n in read_names|write_names:
                    iat[imp.address]=n
            strings=[]
            for m in re.finditer(rb'[\x20-\x7e]{5,}',data):
              s=m.group().decode('latin1','replace')
              if danger_re.search(s) or ident_re.search(s):
                try: va=ib+pe.get_rva_from_offset(m.start())
                except Exception: continue
                strings.append((va,s[:300]))
            for m in re.finditer(rb'(?:[\x20-\x7e]\x00){5,}',data):
              s=m.group().decode('utf-16le','replace')
              if danger_re.search(s) or ident_re.search(s):
                try: va=ib+pe.get_rva_from_offset(m.start())
                except Exception: continue
                strings.append((va,s[:300]))
            strmap=dict(strings)
            md=Cs(CS_ARCH_X86,CS_MODE_32); md.detail=True
            ins=[]
            for sec in pe.sections:
              if sec.Characteristics & 0x20000000:
                ins.extend(md.disasm(sec.get_data(),ib+sec.VirtualAddress))
            ins=sorted(ins,key=lambda x:x.address)
            calls=[]
            for idx,x in enumerate(ins):
              vals=[]
              for op in x.operands:
                if op.type==X86_OP_IMM: vals.append(op.imm)
                elif op.type==X86_OP_MEM and op.mem.disp: vals.append(op.mem.disp & 0xffffffff)
              names=sorted({iat[v] for v in vals if v in iat})
              if names:
                calls.append((idx,x,names))
            for idx,x,names in calls:
              r=[n for n in names if n in read_names]
              if not r: continue
              lo=max(0,idx-160); hi=min(len(ins),idx+161)
              ctx=ins[lo:hi]
              nearby_writes=[]; nearby_reads=[]; string_refs=[]; cmps=[]; imm_bytes=[]
              for j,y in enumerate(ctx):
                vals=[]
                for op in y.operands:
                  if op.type==X86_OP_IMM: vals.append(op.imm)
                  elif op.type==X86_OP_MEM and op.mem.disp: vals.append(op.mem.disp & 0xffffffff)
                ns=sorted({iat[v] for v in vals if v in iat})
                if any(n in write_names for n in ns):
                  nearby_writes.append({'va':hex(y.address),'imports':ns,'distance':(lo+j)-idx})
                if any(n in read_names for n in ns):
                  nearby_reads.append({'va':hex(y.address),'imports':ns,'distance':(lo+j)-idx})
                for v in vals:
                  if v in strmap:
                    string_refs.append({'va':hex(y.address),'text':strmap[v]})
                if y.mnemonic in ('cmp','test'):
                  cmps.append({'va':hex(y.address),'text':f'{y.mnemonic} {y.op_str}'})
                if y.mnemonic=='mov' and any(op.type==X86_OP_IMM and 0 <= op.imm <= 0xff for op in y.operands):
                  imm_bytes.append({'va':hex(y.address),'text':f'{y.mnemonic} {y.op_str}'})
              danger=any(danger_re.search(z['text']) for z in string_refs)
              ident=any(ident_re.search(z['text']) for z in string_refs)
              writes_before=[z for z in nearby_writes if -120 <= z['distance'] < 0]
              writes_after=[z for z in nearby_writes if 0 < z['distance'] <= 120]
              pure=not writes_before and not writes_after and not danger
              classification='PURE_READ_CANDIDATE' if pure else ('READ_AFTER_OR_NEAR_WRITE' if (writes_before or writes_after) else 'READ_IN_DANGEROUS_CONTEXT')
              all_rows.append({
                'label':label,'call_va':hex(x.address),'read_imports':r,'classification':classification,
                'nearby_writes':nearby_writes,'nearby_reads':nearby_reads,
                'identify_string_context':ident,'danger_string_context':danger,
                'string_refs':string_refs[:80],'response_cmp_context':cmps[:120],'immediate_byte_context':imm_bytes[:120]
              })
          Path('/tmp/r131/evidence/R131_HID_READ_CLASSIFICATION.json').write_text(json.dumps(all_rows,indent=2,ensure_ascii=False)+'\n')
          PY

      - name: Build fail-closed decision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          ev=Path('/tmp/r131/evidence')
          rows=json.loads((ev/'R131_HID_READ_CLASSIFICATION.json').read_text())
          pure=[r for r in rows if r['classification']=='PURE_READ_CANDIDATE']
          ident=[r for r in pure if r['identify_string_context']]
          pct=[r for r in rows if r['label']=='pctools']
          upg=[r for r in rows if r['label']=='upgrade_flash']
          decision={
            'R130_RUN_ID':35881983712,
            'R130_EVIDENCE_ARTIFACT_ID':10760539531,
            'PCTOOLS_SHA256':'0e13801b29070f805869823e6db4ad56d70494b2621fb63c330cea1d69e9ca33',
            'UPGRADE_FLASH_SHA256':'bebb887b04fc724e1c459cce15d4395c78df3e098c54f06369ffe78b50aec073',
            'TOTAL_HID_READ_CALLS_CLASSIFIED':len(rows),
            'PCTOOLS_HID_READ_CALLS_CLASSIFIED':len(pct),
            'UPGRADE_FLASH_HID_READ_CALLS_CLASSIFIED':len(upg),
            'PURE_READ_CANDIDATE_COUNT':len(pure),
            'PURE_READ_WITH_IDENTIFY_STRING_CONTEXT_COUNT':len(ident),
            'PURE_READ_WITH_IDENTIFY_STRING_CONTEXT':[{'label':r['label'],'call_va':r['call_va'],'read_imports':r['read_imports']} for r in ident],
            'IMPORTANT_INTERPRETATION':'Static classification only. Even a pure-read tool call is not authorized for production live use without independent production identity and protocol proof.',
            'READ_ONLY_IDENTIFY_PATH_STATICALLY_PROVEN_FOR_PRODUCTION':False,
            'SAFE_READ_ONLY_STOCK_BACKUP_PROVEN':False,
            'PRODUCTION_BOOTSTRAP_BRIDGE_PROVEN':False,
            'PRODUCTION_RECOVERY_USB_IDENTITY_PROVEN':False,
            'ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD':False,
            'AA55_LIVE_RETEST_ALLOWED':False,
            'RUNTIME_0X11_ALLOWED':False,
            'RUNTIME_0XFE_ALLOWED':False,
            'VENDOR_BINARY_EXECUTED':False,
            'USB_DEVICE_ACCESSED':False,
            'BOARD_CONTACTED':False,
            'FLASH_ALLOWED':False,
            'NEXT':'If pure-read identify candidates remain, recover exact packet construction and response validation statically. If none remain, close PCTools read-only identify route and continue searching for production-specific recovery/backup evidence. No live transmission is authorized.'
          }
          (ev/'R131_DECISION.json').write_text(json.dumps(decision,indent=2)+'\n')
          (ev/'R131_REPORT_TH.md').write_text(
            '# R131 PCTools HID read classification\n\n'
            f'- HID read calls classified: {len(rows)}\n'
            f'- pure-read candidates: {len(pure)}\n'
            f'- pure-read + identify context: {len(ident)}\n'
            '- static only; no vendor binary executed\n'
            '- no USB/board access\n'
            '- AA55, 0x11, 0xFE, erase/program/flash remain blocked\n'
            '- FLASH_ALLOWED=NO\n')
          print(json.dumps(decision,indent=2))
          PY

      - name: Package evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r131/evidence
          zip -9 -r /tmp/R131_EXACT_PCTOOLS_HID_READ_CLASSIFICATION_STATIC_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/R131_EXACT_PCTOOLS_HID_READ_CLASSIFICATION_STATIC_EVIDENCE.zip > /tmp/R131_EXACT_PCTOOLS_HID_READ_CLASSIFICATION_STATIC_EVIDENCE.zip.sha256

      - name: Upload R131 evidence
        uses: actions/upload-artifact@v4
        with:
          name: R131-EXACT-PCTOOLS-HID-READ-CLASSIFICATION-STATIC-EVIDENCE
          path: |
            /tmp/R131_EXACT_PCTOOLS_HID_READ_CLASSIFICATION_STATIC_EVIDENCE.zip
            /tmp/R131_EXACT_PCTOOLS_HID_READ_CLASSIFICATION_STATIC_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'R131_VENDOR_BINARY_EXECUTED=NO' /tmp/r131/evidence/R131_SAFETY.txt
          grep -F 'R131_USB_DEVICE_ACCESS=NO' /tmp/r131/evidence/R131_SAFETY.txt
          grep -F 'R131_BOARD_CONTACT=NO' /tmp/r131/evidence/R131_SAFETY.txt
          grep -F 'R131_AA55_SENT=NO' /tmp/r131/evidence/R131_SAFETY.txt
          grep -F 'R131_RUNTIME_0X11_SENT=NO' /tmp/r131/evidence/R131_SAFETY.txt
          grep -F 'R131_RUNTIME_0XFE_SENT=NO' /tmp/r131/evidence/R131_SAFETY.txt
          grep -F '"FLASH_ALLOWED": false' /tmp/r131/evidence/R131_DECISION.json
          echo R131_STATIC_CLASSIFICATION_COMPLETE=YES
          echo FLASH_ALLOWED=NO
