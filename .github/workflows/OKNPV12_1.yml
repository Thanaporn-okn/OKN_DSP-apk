      - name: Validate V12.1 gain quantization, 92-slot gate, detailed diagnostics and no-unknown-TX policy
        shell: bash
        run: |
          set -euo pipefail
          python3 Sources/validate_v38_gate.py
          python3 Sources/validate_oknpv12.py

      - name: Build Debug and Release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk OKNPV12_1-debug.apk
          cp app/build/outputs/apk/release/app-release.apk OKNPV12_1-release.apk

      - name: Verify APK identity and test signing
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging OKNPV12_1-debug.apk | tee OKNPV12_1-apk-badging.txt
          grep -q "package: name='com.okn.peramp' versionCode='12001' versionName='12.1.0'" OKNPV12_1-apk-badging.txt
          grep -q "application-label:'OKN Peramp'" OKNPV12_1-apk-badging.txt
          {
            echo 'V12 release signing status: TEST SIGNING ONLY - debug key configured in build.gradle.'
            echo 'A user-owned production key is still required for public production distribution.'
            "$APKSIGNER" verify --verbose --print-certs OKNPV12_1-release.apk
          } | tee OKNPV12_1-signing.txt

      - name: Package V12.1 source, PEQ proof and checksums
        shell: bash
        run: |
          set -euo pipefail
          zip -qr OKNPV12_1-source.zip app Sources build.gradle settings.gradle gradle.properties -x '*/build/*' -x '.gradle/*'
          cp Sources/OKNPV12_BUILD_NOTES.txt OKNPV12_1-BUILD-NOTES.txt
          cp Sources/V12_FULL_PEQ_PROOF.txt OKNPV12_1-FULL-PEQ-PROOF.txt
          cp Sources/V11_ORIGINAL_APP_STATIC_REVERSE.txt OKNPV12_1-ORIGINAL-APP-STATIC-REVERSE.txt
          cp Sources/V10_HARDWARE_BASELINE_PROOF.txt OKNPV12_1-HARDWARE-BASELINE-PROOF.txt
          cp Sources/V10_OUTPUT_GAIN_STATIC_DISCOVERY.txt OKNPV12_1-OUTPUT-GAIN-STATIC-DISCOVERY.txt
          cp Sources/ProtocolEvidence/GoloPine_DeviceDescription_REAL_20260906_204555.json OKNPV12_1-HISTORICAL-SAME-HARDWARE-DESCRIPTOR.json
          sha256sum OKNPV12_1-debug.apk OKNPV12_1-release.apk OKNPV12_1-source.zip OKNPV12_1-BUILD-NOTES.txt OKNPV12_1-FULL-PEQ-PROOF.txt OKNPV12_1-ORIGINAL-APP-STATIC-REVERSE.txt OKNPV12_1-HARDWARE-BASELINE-PROOF.txt OKNPV12_1-OUTPUT-GAIN-STATIC-DISCOVERY.txt OKNPV12_1-HISTORICAL-SAME-HARDWARE-DESCRIPTOR.json OKNPV12_1-signing.txt > OKNPV12_1-SHA256SUMS.txt
          cat OKNPV12_1-SHA256SUMS.txt

      - name: Upload OKNPV12_1 artifact
        uses: actions/upload-artifact@v7
        with:
          name: OKNPV12_1
          path: |
            OKNPV12_1-debug.apk
            OKNPV12_1-release.apk
            OKNPV12_1-source.zip
            OKNPV12_1-SHA256SUMS.txt
            OKNPV12_1-apk-badging.txt
            OKNPV12_1-signing.txt
            OKNPV12_1-BUILD-NOTES.txt
            OKNPV12_1-FULL-PEQ-PROOF.txt
            OKNPV12_1-ORIGINAL-APP-STATIC-REVERSE.txt
            OKNPV12_1-HARDWARE-BASELINE-PROOF.txt
            OKNPV12_1-OUTPUT-GAIN-STATIC-DISCOVERY.txt
            OKNPV12_1-HISTORICAL-SAME-HARDWARE-DESCRIPTOR.json
          if-no-files-found: error
          retention-days: 30
