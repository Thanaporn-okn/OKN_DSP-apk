name: R101 BP1048P4 runtime USB RAM-only bootstrap primitive audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r101-bp1048p4-usb-ram-bootstrap-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_REPO: https://github.com/leadercxn/bp1048_sdk_v0.1.12.git
  SDK_COMMIT: 8105bd864b04995d81c9f9ae77cb158259f39015
  FLASH_ALLOWED: 'NO'

jobs:
  static-ram-bootstrap-audit:
    name: OFFLINE USB RAM-only primitive audit - no exploit/no USB/no board/no flash
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r101/evidence
          cat > /tmp/r101/evidence/R101_SAFETY.txt <<'EOF'
          R101_STATIC_ONLY=YES
          BOARD_CONTACT=NO
          USB_DEVICE_ACCESS=NO
          PHONE_LIVE_TEST=NO
          EXPLOIT_PAYLOAD_GENERATION=NO
          LIVE_PACKET_GENERATION=NO
          VENDOR_BINARY_EXECUTION=NO
          SEND_AA55=NO
          SEND_0X11=NO
          SEND_CHIPERAS_CODEDATA_BOOTDAT_CONSTDAT_CNFGDAT_BTUPDAT_UPINFO_CXXX=NO
          ERASE_PROGRAM_FLASH=NO
          FINAL_REQUIRED_TRANSPORT=SAMSUNG_S25_PLUS_USB_C_DIRECT_TO_DSP_USB_C
          HARDWARE_MODIFICATION=FORBIDDEN
          FLASH_ALLOWED=NO
          PURPOSE=FIND_SOURCE_LEVEL_RAM_ONLY_READ_WRITE_OR_MEMORY_SAFETY_PRIMITIVE_REACHABLE_FROM_STOCK_USB_HID_WITHOUT_FLASH_SIDE_EFFECTS
          EOF
          cat /tmp/r101/evidence/R101_SAFETY.txt

      - name: Install static analysis tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/r101-venv
          /tmp/r101-venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir \
            tree-sitter tree-sitter-c
          echo "/tmp/r101-venv/bin" >> "$GITHUB_PATH"

      - name: Clone exact SDK commit
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "$SDK_REPO" /tmp/r101/sdk
          cd /tmp/r101/sdk
          git fetch --depth=1 origin "$SDK_COMMIT"
          git checkout --detach "$SDK_COMMIT"
          HEAD="$(git rev-parse HEAD)"
          test "$HEAD" = "$SDK_COMMIT"
          printf 'SDK_COMMIT_MATCH=YES\nSDK_HEAD=%s\n' "$HEAD" \
            > /tmp/r101/evidence/R101_SDK_GATE.txt

      - name: Preserve exact USB runtime source
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r101/sdk

          files=(
            "BT_Audio_APP/bt_audio_app_src/audio/communication.c"
            "BT_Audio_APP/bt_audio_app_src/audio/communication.h"
            "MVsB1_Base_SDK/driver/driver_api/src/otg/device/otg_device_standard_request.c"
            "BT_Audio_APP/bt_audio_app_src/device/upgrade.c"
          )

          for f in "${files[@]}"; do
            test -f "$f"
            cp --parents "$f" /tmp/r101/evidence/
          done

          find /tmp/r101/evidence -type f -print0 | xargs -0 sha256sum \
            > /tmp/r101/evidence/R101_SOURCE_SHA256.txt

      - name: Build source-wide USB memory primitive inventory
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r101/sdk

          grep -RInaE \
            'HIDUsb_Rx|UsbLoadAudioMode|Communication_Effect_Config|hid_recive_data|Request\[|Setup\[|memcpy|memmove|strcpy|strncpy|sprintf|vsprintf|sscanf|atoi|strtol|uintptr_t|uint32_t[[:space:]]*\*|void[[:space:]]*\*|SpiFlashRead|SpiFlashWrite|SpiFlashErase|DMA_CircularDataPut|OTG_DeviceControlSend|ROM_SysReset|jump_fun' \
            --include='*.c' --include='*.h' \
            --exclude-dir=.git . \
            > /tmp/r101/evidence/R101_MEMORY_PRIMITIVE_HITS.txt || true

          sed -n '1,3200p' /tmp/r101/evidence/R101_MEMORY_PRIMITIVE_HITS.txt

      - name: Extract relevant functions with AST
        shell: bash
        run: |
          set -euo pipefail
          /tmp/r101-venv/bin/python - <<'PY'
          from pathlib import Path
          import json,re
          from tree_sitter import Language, Parser
          import tree_sitter_c

          root=Path('/tmp/r101/sdk')
          out=Path('/tmp/r101/evidence')

          lang=Language(tree_sitter_c.language())
          parser=Parser(lang)

          target_terms=[
              'HIDUsb_Rx','UsbLoadAudioMode','Communication_Effect_Config',
              'hid_recive_data','OTG_DeviceClassRequest','OTG_DeviceManufacturerRequest',
              'memcpy','memmove','strcpy','strncpy','sprintf','vsprintf',
              'SpiFlashRead','SpiFlashWrite','SpiFlashErase',
              'OTG_DeviceControlSend','Request[','Setup['
          ]

          def walk(node):
              st=[node]
              while st:
                  n=st.pop()
                  yield n
                  st.extend(reversed(n.children))

          funcs=[]
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in ('.c','.h') or '.git' in p.parts:
                  continue
              b=p.read_bytes()
              txt=b.decode('utf-8','ignore')
              if not any(t in txt for t in target_terms):
                  continue
              tree=parser.parse(b)
              for node in walk(tree.root_node):
                  if node.type!='function_definition':
                      continue
                  chunk=b[node.start_byte:node.end_byte].decode('utf-8','ignore')
                  matched=[t for t in target_terms if t in chunk]
                  if not matched:
                      continue
                  head=b[node.start_byte:min(node.end_byte,node.start_byte+1500)].decode('utf-8','ignore')
                  m=re.search(r'([A-Za-z_][A-Za-z0-9_]*)\s*\([^;{}]*\)\s*\{',head,re.S)
                  name=m.group(1) if m else f'function_at_{node.start_point[0]+1}'
                  funcs.append({
                      'path':str(p.relative_to(root)),
                      'name':name,
                      'start_line':node.start_point[0]+1,
                      'end_line':node.end_point[0]+1,
                      'matched_terms':matched,
                      'text':chunk,
                  })

          out.joinpath('R101_RELEVANT_FUNCTIONS.json').write_text(
              json.dumps(funcs,indent=2,ensure_ascii=False)+'\n'
          )
          parts=[]
          for f in funcs:
              parts.append(
                  f"===== {f['path']} :: {f['name']} lines {f['start_line']}-{f['end_line']} "
                  f"terms={f['matched_terms']} =====\n{f['text']}\n"
              )
          out.joinpath('R101_RELEVANT_FUNCTIONS.txt').write_text('\n'.join(parts))
          print('FUNCTION_COUNT',len(funcs))
          PY

          sed -n '1,3400p' /tmp/r101/evidence/R101_RELEVANT_FUNCTIONS.txt

      - name: Analyze USB reachable length and pointer hazards
        shell: bash
        run: |
          set -euo pipefail
          /tmp/r101-venv/bin/python - <<'PY'
          from pathlib import Path
          import json,re,collections

          ev=Path('/tmp/r101/evidence')
          funcs=json.loads((ev/'R101_RELEVANT_FUNCTIONS.json').read_text())

          by_name=collections.defaultdict(list)
          for f in funcs:
              by_name[f['name']].append(f)

          # Build best-effort function call graph among extracted functions.
          names=set(by_name)
          edges=[]
          for f in funcs:
              called=[]
              for n in names:
                  if n==f['name']:
                      continue
                  if re.search(r'\b'+re.escape(n)+r'\s*\(',f['text']):
                      called.append(n)
              edges.append({
                  'path':f['path'],
                  'caller':f['name'],
                  'calls':sorted(set(called)),
              })
          ev.joinpath('R101_CALLGRAPH.json').write_text(json.dumps(edges,indent=2)+'\n')

          # Reachability seed: device receives host-controlled bytes here.
          seeds={'hid_recive_data','HIDUsb_Rx','UsbLoadAudioMode'}
          reachable=set(seeds)
          changed=True
          while changed:
              changed=False
              for e in edges:
                  if e['caller'] in reachable:
                      for c in e['calls']:
                          if c not in reachable:
                              reachable.add(c); changed=True

          hazards=[]
          generic_pointer=[]
          readback_candidates=[]
          flash_side_effects=[]

          copy_rx=re.compile(r'\b(memcpy|memmove|strcpy|strncpy|sprintf|vsprintf)\s*\((.*?)\)\s*;',re.S)
          ptr_from_buf_rx=re.compile(
              r'\(\s*(?:uint(?:8|16|32)_t|void|char)\s*\*\s*\)\s*'
              r'\(?\s*(?:buff|buf|Request|data)\s*\[[^\]]+\]',
              re.I
          )
          addr_build_rx=re.compile(
              r'(?:addr|address|offset|position|pos)\s*=.*?(?:buff|buf|Request|data)\s*\[',
              re.I|re.S
          )

          for f in funcs:
              text=f['text']
              is_reach=f['name'] in reachable
              if not is_reach:
                  continue

              for m in copy_rx.finditer(text):
                  call=m.group(0)
                  host_len=bool(re.search(
                      r'(?:buff|buf|Request|data)\s*\[[^\]]+\]|len|cmd_len|packet_len|position',
                      call,re.I
                  ))
                  fixed_dest=bool(re.search(
                      r'\b(?:hid_tx_buf|tx_buf|Request|Setup|buf|buff)\b',
                      call,re.I
                  ))
                  hazards.append({
                      'path':f['path'],'function':f['name'],
                      'kind':'copy_call',
                      'host_influenced_length_or_index':host_len,
                      'fixed_or_named_buffer_destination':fixed_dest,
                      'code':call[:1200],
                  })

              if ptr_from_buf_rx.search(text) or addr_build_rx.search(text):
                  generic_pointer.append({
                      'path':f['path'],'function':f['name'],'text':text[:12000]
                  })

              # Candidate read-to-host primitive requires BOTH a memory/flash read source
              # and OTG/HID response send in one reachable function.
              if (
                  re.search(r'\b(?:SpiFlashRead|memcpy|memmove)\s*\(',text)
                  and re.search(r'\b(?:OTG_DeviceControlSend|Communication_Effect_Send|hid_send_data)\s*\(',text)
              ):
                  readback_candidates.append({
                      'path':f['path'],'function':f['name'],'text':text[:16000]
                  })

              if re.search(r'\b(?:SpiFlashWrite|SpiFlashErase)\s*\(',text):
                  flash_side_effects.append({
                      'path':f['path'],'function':f['name']
                  })

          # Explicit key function body checks.
          usb_load=by_name.get('UsbLoadAudioMode',[])
          hid_rx=by_name.get('HIDUsb_Rx',[])
          std=[f for f in funcs if f['path'].endswith('otg_device_standard_request.c')]

          decision={
              'SDK_COMMIT_MATCH':True,
              'USB_REACHABLE_FUNCTION_COUNT':len(reachable),
              'USB_REACHABLE_COPY_CALL_COUNT':len(hazards),
              'USB_REACHABLE_COPY_WITH_HOST_INFLUENCED_LENGTH_OR_INDEX_COUNT':sum(
                  1 for x in hazards if x['host_influenced_length_or_index']
              ),
              'USB_REACHABLE_PAYLOAD_TO_POINTER_OR_ADDRESS_BUILD_CANDIDATE_COUNT':len(generic_pointer),
              'USB_REACHABLE_READ_AND_RESPONSE_IN_SAME_FUNCTION_CANDIDATE_COUNT':len(readback_candidates),
              'USB_REACHABLE_FLASH_WRITE_ERASE_FUNCTION_COUNT':len(flash_side_effects),
              'USB_RAM_ONLY_ARBITRARY_WRITE_PRIMITIVE_PROVEN':False,
              'USB_RAM_ONLY_ARBITRARY_READ_TO_HOST_PRIMITIVE_PROVEN':False,
              'USB_RAM_CODE_EXECUTION_PRIMITIVE_PROVEN':False,
              'SAFE_RAM_ONLY_STOCK_FLASH_DUMP_LOADER_PATH_PROVEN':False,
              'PRODUCTION_RUNTIME_BINARY_MATCH_TO_REFERENCE_PROVEN':False,
              'LIVE_BOARD_TEST_ALLOWED_FROM_R101':False,
              'FLASH_ALLOWED':False,
          }

          ev.joinpath('R101_HAZARDS.json').write_text(
              json.dumps({
                  'reachable_functions':sorted(reachable),
                  'copy_hazards':hazards,
                  'payload_pointer_candidates':generic_pointer,
                  'readback_candidates':readback_candidates,
                  'flash_side_effect_functions':flash_side_effects,
              },indent=2,ensure_ascii=False)+'\n'
          )
          ev.joinpath('R101_DECISION.json').write_text(json.dumps(decision,indent=2)+'\n')
          print(json.dumps(decision,indent=2))
          PY

      - name: Audit bounds checks around host-controlled parser fields
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r101/sdk

          # Exact parser body/context.
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path('BT_Audio_APP/bt_audio_app_src/audio/communication.c').read_text(errors='ignore').splitlines()
          out=Path('/tmp/r101/evidence/R101_USBLOAD_CONTEXT.txt')

          starts=[]
          for i,l in enumerate(src):
              if re.search(r'\bvoid\s+UsbLoadAudioMode\s*\(',l):
                  starts.append(i)

          chunks=[]
          for s in starts:
              # Brace-aware body extract.
              depth=0; begun=False; e=s
              for j in range(s,len(src)):
                  depth += src[j].count('{')
                  if src[j].count('{'): begun=True
                  depth -= src[j].count('}')
                  if begun and depth<=0:
                      e=j; break
              chunks.append('\n'.join(f'{k+1}: {src[k]}' for k in range(s,e+1)))

          out.write_text('\n\n'.join(chunks)+'\n')
          PY

          cat /tmp/r101/evidence/R101_USBLOAD_CONTEXT.txt

          # Find comparisons involving parser lengths/positions near memcpy/copy loops.
          grep -RInaE \
            '(len|cmd_len|packet_len|position|buff\[[0-9]+\]|buf\[[0-9]+\]|Request\[[0-9]+\]).*(>|>=|<|<=|==|!=)|((>|>=|<|<=).*(len|cmd_len|packet_len|position))' \
            BT_Audio_APP/bt_audio_app_src/audio/communication.c \
            MVsB1_Base_SDK/driver/driver_api/src/otg/device/otg_device_standard_request.c \
            > /tmp/r101/evidence/R101_BOUNDS_CHECK_HITS.txt || true

          sed -n '1,2400p' /tmp/r101/evidence/R101_BOUNDS_CHECK_HITS.txt

      - name: Search for explicit generic RAM read write command semantics
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r101/sdk

          grep -RInaE \
            'ReadMem|WriteMem|MemoryRead|MemoryWrite|MemRead|MemWrite|ram.*read|ram.*write|read.*address|write.*address|peek|poke|debug.*read|debug.*write|mem.*address|address.*mem|uintptr_t.*buff|uintptr_t.*Request|\*\([[:space:]]*uint(8|16|32)_t[[:space:]]*\*[[:space:]]*\).*buff|\*\([[:space:]]*uint(8|16|32)_t[[:space:]]*\*[[:space:]]*\).*Request' \
            --include='*.c' --include='*.h' \
            --exclude-dir=.git . \
            > /tmp/r101/evidence/R101_GENERIC_RAM_COMMAND_HITS.txt || true

          cat /tmp/r101/evidence/R101_GENERIC_RAM_COMMAND_HITS.txt

      - name: Build focused report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          p=Path('/tmp/r101/evidence')
          dec=json.loads((p/'R101_DECISION.json').read_text())
          hz=json.loads((p/'R101_HAZARDS.json').read_text())
          generic=(p/'R101_GENERIC_RAM_COMMAND_HITS.txt').read_text(errors='ignore')

          lines=[
              '# R101 BP1048P4 runtime USB RAM-only bootstrap primitive audit',
              '',
              'OFFLINE SOURCE AUDIT ONLY. No exploit payload, no phone, no USB, no board, no flash.',
              '',
              '## Decision',
              '```json',json.dumps(dec,indent=2),'```','',
              '## USB-reachable copy hazards',
          ]
          if hz['copy_hazards']:
              for x in hz['copy_hazards'][:300]:
                  lines.append('- '+json.dumps(x,ensure_ascii=False)[:4000])
          else:
              lines.append('- none')

          lines += ['','## Payload-derived pointer/address candidates']
          if hz['payload_pointer_candidates']:
              for x in hz['payload_pointer_candidates'][:100]:
                  lines.append('- '+json.dumps(x,ensure_ascii=False)[:6000])
          else:
              lines.append('- none')

          lines += ['','## Read + response candidates']
          if hz['readback_candidates']:
              for x in hz['readback_candidates'][:100]:
                  lines.append('- '+json.dumps(x,ensure_ascii=False)[:6000])
          else:
              lines.append('- none')

          lines += ['','## Explicit generic RAM command search']
          lines.append('```')
          lines.append(generic[:60000])
          lines.append('```')

          lines += [
              '',
              '## Gate',
              '- A suspicious copy or parser bug is not automatically a usable code-execution primitive.',
              '- R101 intentionally does not construct an exploit or live packet.',
              '- If a source-level RAM-only primitive is found, the next step is offline proof of controllability, exact bounds, return path, and read-only side effects before any hardware test.',
              '- The first allowed live goal would be read-only stock backup, not flashing.',
              '- No 0x11, no AA55 repeat, no flash.',
              '- FLASH_ALLOWED=NO.',
          ]
          p.joinpath('R101_REPORT.md').write_text('\n'.join(lines)+'\n')
          print(json.dumps(dec,indent=2))
          PY

          sed -n '1,1400p' /tmp/r101/evidence/R101_REPORT.md

      - name: Package evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/r101/evidence && zip -9 -r /tmp/R101_BP1048P4_USB_RAM_BOOTSTRAP_PRIMITIVE_EVIDENCE.zip .)
          sha256sum /tmp/R101_BP1048P4_USB_RAM_BOOTSTRAP_PRIMITIVE_EVIDENCE.zip \
            > /tmp/R101_BP1048P4_USB_RAM_BOOTSTRAP_PRIMITIVE_EVIDENCE.zip.sha256

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R101-BP1048P4-USB-RAM-BOOTSTRAP-PRIMITIVE-EVIDENCE
          path: |
            /tmp/R101_BP1048P4_USB_RAM_BOOTSTRAP_PRIMITIVE_EVIDENCE.zip
            /tmp/R101_BP1048P4_USB_RAM_BOOTSTRAP_PRIMITIVE_EVIDENCE.zip.sha256
          if-no-files-found: error
