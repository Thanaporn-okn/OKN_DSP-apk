name: OKN BP1048P4 R64 FIXED ONE-FILE AUTO ROM DualBank USB Entry Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/OKN_BP1048P4_R64_FIXED_ONE_FILE_AUTORUN_ROM_DUALBANK_AUDIT.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  TARGET_SOC: "MVSilicon BP1048P4"
  REQUIRED_PHONE: "Samsung Galaxy S25+"
  REQUIRED_PATH: "Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only"

  SDK_REPO: "https://github.com/leadercxn/bp1048_sdk_v0.1.12.git"
  SDK_COMMIT: "8105bd864b04995d81c9f9ae77cb158259f39015"

  TOOLCHAIN_REPO: "https://github.com/xingrz/nds-builder.git"
  TOOLCHAIN_COMMIT: "572969caccb1d0c576b2893c905fa7b3396815e4"
  TOOLCHAIN_SHA256: "a231682172de4af23ac94726c021a824f1ae7d1f7c72a4619093b90caa7de0e4"

  R62_ARTIFACT_ID: "11305755848"
  R62_BIN_SHA256: "85960cc40a599e98fe754922aa75e62b75449e218667c9cc6caf3828709641f3"

  R63_ARTIFACT_ID: "11305721885"
  R63_METADATA_BIN_SHA256: "6218582ba618320e7a5367332e8abe34c6dfa354c783aafe6f1b1fa588bb42b9"

  LIVE_USB_ALLOWED: "NO"
  FEATURE_REPORT_ALLOWED: "NO"
  RUNTIME_0X11_ALLOWED: "NO"
  FLASH_READ_ALLOWED: "NO"
  FLASH_WRITE_ALLOWED: "NO"
  FLASH_ERASE_ALLOWED: "NO"
  FLASH_ALLOWED: "NO"

jobs:
  r64-rom-dualbank-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Hard fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          test "$TARGET_SOC" = "MVSilicon BP1048P4"
          test "$REQUIRED_PHONE" = "Samsung Galaxy S25+"
          test "$REQUIRED_PATH" = "Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only"
          for v in LIVE_USB_ALLOWED FEATURE_REPORT_ALLOWED RUNTIME_0X11_ALLOWED FLASH_READ_ALLOWED FLASH_WRITE_ALLOWED FLASH_ERASE_ALLOWED FLASH_ALLOWED; do
            test "${!v}" = "NO"
          done

          rm -rf /tmp/r64
          mkdir -p /tmp/r64/{sdk,toolchain,r62,r63,evidence,out,extract}

          cat > /tmp/r64/evidence/00_SCOPE.txt <<'EOF'
          REVISION=R64-FIXED
          TARGET=MVSilicon BP1048P4
          REQUIRED_PATH=Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only

          PURPOSE:
          Determine whether BP1048P4 ROM/driver Dual-Bank / Bank-B upgrade capability
          provides a REAL call path reachable from the stock runtime USB/HID interface.

          THIS RUN IS STATIC/OFFLINE ONLY.
          NO BOARD I/O.
          NO FEATURE AA/55.
          NO RUNTIME 0x11.
          NO FLASH READ/WRITE/ERASE.
          FLASH_ALLOWED=NO
          EOF

      - name: Install NDS32 runtime compatibility
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libc6-i386 lib32z1 xz-utils binutils file unzip git >/dev/null
          dpkg -s libc6-i386 lib32z1 >/tmp/r64/evidence/00B_NDS32_RUNTIME_PACKAGES.txt

      - name: Download exact successful R62 and R63 artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          get_artifact() {
            local id="$1"
            local zip="$2"
            local dir="$3"
            curl -fL --retry 5 --retry-all-errors \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              -o "$zip"
            unzip -q "$zip" -d "$dir"
          }

          get_artifact "$R62_ARTIFACT_ID" /tmp/r64/R62.zip /tmp/r64/r62
          get_artifact "$R63_ARTIFACT_ID" /tmp/r64/R63.zip /tmp/r64/r63

          R62BIN=/tmp/r64/r62/R62_BP1048P4_OKN_STANDALONE_NOT_FOR_FIRST_FLASH.bin
          R62ADX=/tmp/r64/r62/R62_BP1048P4_OKN_STANDALONE_NOT_FOR_FIRST_FLASH.adx
          R63BIN=/tmp/r64/r63/R63_BP1048P4_METADATA_CANDIDATE_DO_NOT_FLASH.bin

          test -s "$R62BIN"
          test -s "$R62ADX"
          test -s "$R63BIN"

          echo "${R62_BIN_SHA256}  ${R62BIN}" | sha256sum -c -
          echo "${R63_METADATA_BIN_SHA256}  ${R63BIN}" | sha256sum -c -

      - name: Clone exact public SDK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/r64/sdk
          git clone --filter=blob:none --no-checkout "$SDK_REPO" /tmp/r64/sdk
          git -C /tmp/r64/sdk fetch --depth 1 origin "$SDK_COMMIT"
          git -C /tmp/r64/sdk checkout -q --detach "$SDK_COMMIT"
          test "$(git -C /tmp/r64/sdk rev-parse HEAD)" = "$SDK_COMMIT"
          echo "SDK_COMMIT_MATCH=YES" > /tmp/r64/evidence/01_SDK_IDENTITY.txt

      - name: Fetch exact NDS32 toolchain
        shell: bash
        run: |
          set -euo pipefail
          git init -q /tmp/r64/toolchain-src
          git -C /tmp/r64/toolchain-src remote add origin "$TOOLCHAIN_REPO"
          git -C /tmp/r64/toolchain-src fetch -q --depth 1 origin "$TOOLCHAIN_COMMIT"
          git -C /tmp/r64/toolchain-src checkout -q --detach FETCH_HEAD

          T=/tmp/r64/toolchain-src/nds32le-elf-mculib-v3s.4.9.4.txz
          echo "${TOOLCHAIN_SHA256}  ${T}" | sha256sum -c -

          tar -xJf "$T" -C /tmp/r64/toolchain
          TC=/tmp/r64/toolchain/nds32le-elf-mculib-v3s/bin
          test -x "$TC/nds32le-elf-nm"
          test -x "$TC/nds32le-elf-objdump"
          test -x "$TC/nds32le-elf-ar"

          "$TC/nds32le-elf-nm" --version | tee /tmp/r64/evidence/01B_NM_VERSION.txt
          "$TC/nds32le-elf-objdump" --version | tee /tmp/r64/evidence/01C_OBJDUMP_VERSION.txt
          "$TC/nds32le-elf-ar" --version | tee /tmp/r64/evidence/01D_AR_VERSION.txt

          # Fail here, before any audit, if the old 32-bit NDS32 tools cannot load.
          ldd "$TC/nds32le-elf-nm" > /tmp/r64/evidence/01E_NM_LDD.txt || true
          if grep -q 'not found' /tmp/r64/evidence/01E_NM_LDD.txt; then
            cat /tmp/r64/evidence/01E_NM_LDD.txt
            exit 1
          fi

          echo "$TC" >> "$GITHUB_PATH"

      - name: Exact source-level DualBank and OBEX census
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r64/sdk

          {
            echo "=== ROM / Bank-B source hits ==="
            git grep -n -I -E \
              'ROM_BankBUpgradeApply|ROM_BankBUpgradeBBankAddrGet|ROM_BankBUpgradeReturnCodeGet|DualBankUpdateReboot|Dual.?Bank|BankBUpgrade|bank.?upgrade|upgrade.?bank' \
              -- . || true

            echo
            echo "=== OBEX update source hits ==="
            git grep -n -I -E \
              'MVA_BT_OBEX_UPDATE_FUNC_SUPPORT|ObexUpdateProc|ObexUpgradeStart|ObexUpgradeEnd|BT_OBEX_SUPPORT' \
              -- . || true

            echo
            echo "=== USB runtime entry source hits ==="
            git grep -n -I -E \
              'HIDUsb_Rx|UsbLoadAudioMode|Communication_Effect_Config|SET_REPORT|GET_REPORT|start_up_grate|AppResourceUsbDevice|pc_upgrade' \
              -- BT_Audio_APP MVsB1_Base_SDK || true
          } > /tmp/r64/evidence/02_SOURCE_CENSUS.txt

          git grep -n -I -E \
            'ROM_BankBUpgradeApply|ROM_BankBUpgradeBBankAddrGet|ROM_BankBUpgradeReturnCodeGet|DualBankUpdateReboot|BankBUpgrade' \
            -- . > /tmp/r64/evidence/03_BANKB_SOURCE_XREFS.txt || true

          git grep -n -I -E \
            'MVA_BT_OBEX_UPDATE_FUNC_SUPPORT|ObexUpdateProc|ObexUpgradeStart|ObexUpgradeEnd' \
            -- . > /tmp/r64/evidence/04_OBEX_SOURCE_XREFS.txt || true

      - name: Audit archive symbols and Bank-B references
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r64/sdk

          : > /tmp/r64/evidence/05_ALL_ARCHIVE_BANKB_SYMBOLS.txt
          : > /tmp/r64/evidence/06_ALL_ARCHIVE_OBEX_SYMBOLS.txt
          : > /tmp/r64/evidence/07_ARCHIVE_INVENTORY.txt

          ARCHIVE_COUNT=0
          NM_OK_COUNT=0
          while IFS= read -r a; do
            ARCHIVE_COUNT=$((ARCHIVE_COUNT+1))
            echo "$a" >> /tmp/r64/evidence/07_ARCHIVE_INVENTORY.txt

            TMP=/tmp/r64/nm.$ARCHIVE_COUNT.txt
            if nds32le-elf-nm -A "$a" >"$TMP" 2>/tmp/r64/nm.$ARCHIVE_COUNT.err; then
              NM_OK_COUNT=$((NM_OK_COUNT+1))
            else
              echo "NM_FAILED=$a" >&2
              cat /tmp/r64/nm.$ARCHIVE_COUNT.err >&2
              exit 1
            fi

            grep -E \
              'ROM_BankBUpgradeApply|ROM_BankBUpgradeBBankAddrGet|ROM_BankBUpgradeReturnCodeGet|DualBankUpdateReboot|BankBUpgrade' \
              "$TMP" >> /tmp/r64/evidence/05_ALL_ARCHIVE_BANKB_SYMBOLS.txt || true

            grep -E \
              'ObexUpdateProc|ObexUpgradeStart|ObexUpgradeEnd|DualBankUpdateReboot' \
              "$TMP" >> /tmp/r64/evidence/06_ALL_ARCHIVE_OBEX_SYMBOLS.txt || true
          done < <(find . -type f -name '*.a' | sort)

          printf 'ARCHIVE_COUNT=%d\nNM_OK_COUNT=%d\n' "$ARCHIVE_COUNT" "$NM_OK_COUNT" \
            | tee /tmp/r64/evidence/07B_NM_AUDIT_HEALTH.txt
          test "$ARCHIVE_COUNT" -gt 0
          test "$NM_OK_COUNT" -eq "$ARCHIVE_COUNT"

          cat /tmp/r64/evidence/05_ALL_ARCHIVE_BANKB_SYMBOLS.txt
          cat /tmp/r64/evidence/06_ALL_ARCHIVE_OBEX_SYMBOLS.txt

      - name: Locate definitions versus callers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          e = Path("/tmp/r64/evidence")
          bank = (e/"05_ALL_ARCHIVE_BANKB_SYMBOLS.txt").read_text(errors="replace").splitlines()
          obex = (e/"06_ALL_ARCHIVE_OBEX_SYMBOLS.txt").read_text(errors="replace").splitlines()

          wanted_bank = [
              "ROM_BankBUpgradeApply",
              "ROM_BankBUpgradeBBankAddrGet",
              "ROM_BankBUpgradeReturnCodeGet",
              "DualBankUpdateReboot",
          ]
          wanted_obex = [
              "ObexUpdateProc",
              "ObexUpgradeStart",
              "ObexUpgradeEnd",
          ]

          def classify(lines, names):
              out = {}
              for name in names:
                  rows = [x for x in lines if re.search(rf"\b{re.escape(name)}$", x)]
                  defs = []
                  und = []
                  other = []
                  for row in rows:
                      # nm record normally has "... <addr> <type> <symbol>" or "... U <symbol>"
                      m = re.search(r"\s([A-Za-z?])\s+" + re.escape(name) + r"$", row)
                      typ = m.group(1) if m else "?"
                      if typ.upper() == "U":
                          und.append(row)
                      elif typ.upper() in {"T","D","B","R","W","A","C","V","S"}:
                          defs.append(row)
                      else:
                          other.append(row)
                  out[name] = {"definitions":defs, "undefined_call_refs":und, "other":other}
              return out

          state = {
              "bankb": classify(bank, wanted_bank),
              "obex": classify(obex, wanted_obex),
          }
          (e/"08_SYMBOL_CLASSIFICATION.json").write_text(json.dumps(state, indent=2)+"\n")
          print(json.dumps(state, indent=2))
          PY

      - name: Disassemble archive members containing Bank-B symbols
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r64/sdk
          OUT=/tmp/r64/evidence/09_BANKB_DISASSEMBLY.txt
          : > "$OUT"

          # Disassemble only archives that nm says contain one of the target symbols.
          cut -d: -f1 /tmp/r64/evidence/05_ALL_ARCHIVE_BANKB_SYMBOLS.txt | sort -u | while IFS= read -r a; do
            test -n "$a" || continue
            test -f "$a" || continue
            echo "===== $a =====" >> "$OUT"
            nds32le-elf-objdump -dr "$a" 2>/dev/null | \
              grep -E -B20 -A80 \
              '<ROM_BankBUpgradeApply>|<ROM_BankBUpgradeBBankAddrGet>|<ROM_BankBUpgradeReturnCodeGet>|<DualBankUpdateReboot>|ROM_BankBUpgradeApply|ROM_BankBUpgradeBBankAddrGet|ROM_BankBUpgradeReturnCodeGet|DualBankUpdateReboot' \
              >> "$OUT" || true
          done

          sed -n '1,1200p' "$OUT"

      - name: Inspect final R62 linked firmware for DualBank code
        shell: bash
        run: |
          set -euo pipefail
          ADX=/tmp/r64/r62/R62_BP1048P4_OKN_STANDALONE_NOT_FOR_FIRST_FLASH.adx

          nds32le-elf-nm -a -C "$ADX" > /tmp/r64/evidence/10_R62_FINAL_SYMBOLS.txt

          grep -E \
            'ROM_BankBUpgradeApply|ROM_BankBUpgradeBBankAddrGet|ROM_BankBUpgradeReturnCodeGet|DualBankUpdateReboot|ObexUpdateProc|ObexUpgradeStart|ObexUpgradeEnd' \
            /tmp/r64/evidence/10_R62_FINAL_SYMBOLS.txt \
            > /tmp/r64/evidence/11_R62_DUALBANK_OBEX_SYMBOLS.txt || true

          cat /tmp/r64/evidence/11_R62_DUALBANK_OBEX_SYMBOLS.txt

      - name: Prove transport ownership of OBEX update calls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          S = Path("/tmp/r64/sdk")
          E = Path("/tmp/r64/evidence")

          h = (S/"BT_Audio_APP/bt_audio_app_src/inc/bt_obex_upgrade.h").read_text(errors="replace")
          app = (S/"MVsB1_Base_SDK/middleware/bluetooth/src/bt_obex_app.c").read_text(errors="replace")

          bank_src = (E/"03_BANKB_SOURCE_XREFS.txt").read_text(errors="replace")
          obex_src = (E/"04_OBEX_SOURCE_XREFS.txt").read_text(errors="replace")
          archive_bank = (E/"05_ALL_ARCHIVE_BANKB_SYMBOLS.txt").read_text(errors="replace")
          final_r62 = (E/"11_R62_DUALBANK_OBEX_SYMBOLS.txt").read_text(errors="replace")

          # Any source hit for a Bank-B symbol in obvious USB/HID runtime files?
          usb_path_hit = False
          usb_terms = ("usb","hid","communication","otg")
          for line in bank_src.splitlines():
              path = line.split(":",1)[0].lower()
              if any(t in path for t in usb_terms):
                  usb_path_hit = True

          obex_guard = "MVA_BT_OBEX_UPDATE_FUNC_SUPPORT" in app
          obex_callback = (
              "BT_STACK_EVENT_OBEX_DATA_RECEIVED" in app
              and "ObexUpdateProc(param)" in app
          )
          dualbank_reboot_header_commented = bool(re.search(
              r'^\s*//\s*void\s+DualBankUpdateReboot\s*\(',
              h, re.M
          ))

          state = {
              "sdk_commit": "8105bd864b04995d81c9f9ae77cb158259f39015",
              "rom_bankb_symbols_seen_in_archives": "ROM_BankBUpgrade" in archive_bank,
              "bankb_source_xrefs_present": bool(bank_src.strip()),
              "bankb_source_xref_in_usb_hid_runtime_file": usb_path_hit,
              "obex_update_compile_guard_present": obex_guard,
              "obex_update_called_from_bt_obex_data_callback": obex_callback,
              "obex_update_transport_classification": "BLUETOOTH_OBEX",
              "dualbank_update_reboot_declaration_commented_in_header": dualbank_reboot_header_commented,
              "r62_final_contains_bankb_or_obex_update_symbols": bool(final_r62.strip()),
              "direct_runtime_usb_to_rom_bankb_call_path_proven": False,
              "s25_usb_c_only_first_flash_unlocked_by_dualbank": False,
              "flash_allowed": False,
          }

          # We intentionally do not promote mere symbol presence into reachability.
          # A real USB/HID -> call -> ROM Bank-B chain is required.
          if usb_path_hit:
              state["note"] = (
                  "A source-level USB/HID-path Bank-B textual hit exists; "
                  "manual exact callgraph review is still required before any live use."
              )
          else:
              state["note"] = (
                  "Bank-B capability may exist in libraries/ROM, but no direct "
                  "runtime USB/HID source path to it was found."
              )

          (E/"12_R64_TRANSPORT_DECISION.json").write_text(
              json.dumps(state, indent=2)+"\n"
          )
          print(json.dumps(state, indent=2))
          PY

      - name: Build R64 final engineering decision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          E=Path("/tmp/r64/evidence")
          d=json.loads((E/"12_R64_TRANSPORT_DECISION.json").read_text())

          lines=[
              "# R64 BP1048P4 ROM / Dual-Bank USB Entry Audit",
              "",
              "Deployment constraint:",
              "**Samsung Galaxy S25+ -> USB-C -> DSP USB-C only**",
              "",
              "Results:",
              f"- ROM/Bank-B symbols visible in SDK archives: **{d['rom_bankb_symbols_seen_in_archives']}**",
              f"- Bank-B source xrefs exist: **{d['bankb_source_xrefs_present']}**",
              f"- Direct Bank-B xref in USB/HID runtime source file: **{d['bankb_source_xref_in_usb_hid_runtime_file']}**",
              f"- OBEX update compile guard present: **{d['obex_update_compile_guard_present']}**",
              f"- OBEX update is called from Bluetooth OBEX data callback: **{d['obex_update_called_from_bt_obex_data_callback']}**",
              f"- `DualBankUpdateReboot` declaration is commented in public header: **{d['dualbank_update_reboot_declaration_commented_in_header']}**",
              f"- R62 final linked image contains Bank-B/OBEX upgrade symbols: **{d['r62_final_contains_bankb_or_obex_update_symbols']}**",
              "",
              "Decision:",
              "- Symbol/library capability alone is NOT a stock-board USB entry path.",
              "- Bluetooth OBEX update is NOT the required direct USB-C transport.",
              "- No live Feature report, runtime 0x11, erase or write was executed.",
              "- Direct stock runtime USB -> ROM Bank-B upgrade remains unproven.",
              "",
              "Next engineering branch:",
              "If no exact USB-callable Bank-B entry appears in the evidence, the next",
              "work item is an OFFLINE first-install bootstrap design that minimizes",
              "changes to stock flash and proves address/range/rollback before hardware use.",
              "",
              "FLASH_ALLOWED=NO",
          ]
          (E/"13_R64_FINAL_REPORT.md").write_text("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY

          cat /tmp/r64/evidence/13_R64_FINAL_REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Package R64 evidence
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/r64/evidence/* /tmp/r64/out/
          cp /tmp/r64/r63/R63_BP1048P4_METADATA_CANDIDATE_DO_NOT_FLASH.bin \
            /tmp/r64/out/R63_BP1048P4_METADATA_CANDIDATE_DO_NOT_FLASH.bin
          (cd /tmp/r64/out && sha256sum * > SHA256SUMS.txt)

      - name: Upload R64 evidence
        uses: actions/upload-artifact@v4
        with:
          name: R64_BP1048P4_ROM_DUALBANK_USB_ENTRY_AUDIT
          path: /tmp/r64/out/*
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed assertion
        shell: bash
        run: |
          set -euo pipefail
          for v in LIVE_USB_ALLOWED FEATURE_REPORT_ALLOWED RUNTIME_0X11_ALLOWED FLASH_READ_ALLOWED FLASH_WRITE_ALLOWED FLASH_ERASE_ALLOWED FLASH_ALLOWED; do
            test "${!v}" = "NO"
          done
          test -s /tmp/r64/evidence/12_R64_TRANSPORT_DECISION.json
          grep -q '"flash_allowed": false' /tmp/r64/evidence/12_R64_TRANSPORT_DECISION.json
          echo "R64_ROM_DUALBANK_AUDIT=PASS"
          echo "FLASH_ALLOWED=NO"
