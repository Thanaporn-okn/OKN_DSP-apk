name: OKN BP1048P4 V30 FINAL MASTER GATE S25 USB-C ONLY

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/OKN_BP1048P4_V30_FINAL_MASTER_GATE_S25_USB_C_ONLY.yml'
      - 'firmware/**'
      - 'Firmware/**'
      - '*.mva'
      - '*.bin'
      - '*.img'
      - '*.fw'
      - '*.rom'
      - '*.ota'
      - '*.dfu'

permissions:
  contents: read

env:
  REQUIRED_PHONE: "Samsung Galaxy S25+"
  REQUIRED_PATH: "Samsung Galaxy S25+ -> USB-C cable -> DSP USB-C port only"
  SDK_REPO: "https://github.com/leadercxn/bp1048_sdk_v0.1.12.git"
  SDK_COMMIT: "8105bd864b04995d81c9f9ae77cb158259f39015"
  RUNTIME_VID_HEX: "6324"
  RUNTIME_PID_HEX: "1719"
  REFERENCE_RECOVERY_VID_HEX: "0000"
  REFERENCE_RECOVERY_PID_HEX: "2244"
  FLASH_ALLOWED: "NO"
  HOST_TO_DEVICE_HID_ALLOWED: "NO"
  FLASHBOOT_AA_ALLOWED: "NO"
  RECOVERY_COMMAND_ALLOWED: "NO"
  ERASE_ALLOWED: "NO"
  WRITE_ALLOWED: "NO"

jobs:
  final_master:
    name: Static gate + firmware inventory + passive Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$REQUIRED_PHONE" = "Samsung Galaxy S25+"
          test "$REQUIRED_PATH" = "Samsung Galaxy S25+ -> USB-C cable -> DSP USB-C port only"
          test "$FLASH_ALLOWED" = "NO"
          test "$HOST_TO_DEVICE_HID_ALLOWED" = "NO"
          test "$FLASHBOOT_AA_ALLOWED" = "NO"
          test "$RECOVERY_COMMAND_ALLOWED" = "NO"
          test "$ERASE_ALLOWED" = "NO"
          test "$WRITE_ALLOWED" = "NO"

          rm -rf /tmp/v30
          mkdir -p /tmp/v30/evidence /tmp/v30/out /tmp/v30/sdk

          cat > /tmp/v30/evidence/V30_SAFETY.txt <<'EOF'
          REQUIRED_PHONE=Samsung Galaxy S25+
          REQUIRED_PATH=Samsung Galaxy S25+ -> USB-C cable -> DSP USB-C port only
          SOLDER_ALLOWED=NO
          BOARD_MOD_ALLOWED=NO
          JTAG_ALLOWED=NO
          SDP_ALLOWED=NO
          AICE_ALLOWED=NO
          HARDWARE_PROBE_ALLOWED=NO
          HOST_TO_DEVICE_HID_ALLOWED=NO
          FLASHBOOT_AA_ALLOWED=NO
          RECOVERY_COMMAND_ALLOWED=NO
          FLASH_ERASE_ALLOWED=NO
          FLASH_WRITE_ALLOWED=NO
          FLASH_ALLOWED=NO
          EOF

      - name: Pin reference SDK and static facts
        shell: bash
        run: |
          set -euo pipefail

          git clone -q "$SDK_REPO" /tmp/v30/sdk/repo
          git -C /tmp/v30/sdk/repo checkout -q "$SDK_COMMIT"
          test "$(git -C /tmp/v30/sdk/repo rev-parse HEAD)" = "$SDK_COMMIT"

          COMM=/tmp/v30/sdk/repo/BT_Audio_APP/bt_audio_app_src/audio/communication.c
          OTG=/tmp/v30/sdk/repo/MVsB1_Base_SDK/driver/driver_api/src/otg/device/otg_device_standard_request.c
          DESC=/tmp/v30/sdk/repo/MVsB1_Base_SDK/driver/driver_api/src/otg/device/otg_device_descriptor.h

          test -f "$COMM"
          test -f "$OTG"
          test -f "$DESC"

          grep -q 'communic_buf\[i\] == 0xA5' "$COMM"
          grep -q 'communic_buf\[i+1\] == 0x5A' "$COMM"
          grep -q 'communic_buf\[i+4+packet_len\] == 0x16' "$COMM"
          grep -q 'SpiFlashErase' "$COMM"
          grep -q 'SpiFlashWrite' "$COMM"
          grep -q 'Request\[0\] == 0xAA' "$OTG"
          grep -q 'start_up_grate(AppResourceUsbDevice)' "$OTG"

          cat > /tmp/v30/evidence/V30_STATIC_FACTS.json <<EOF
          {
            "sdk_commit": "$SDK_COMMIT",
            "runtime_vid_pid": "6324:1719",
            "physical_runtime_proven": true,
            "raw_descriptor_sha256": "C7E861A6F28EB832E16450D3A35B64C557BEA4E0CC15FF1EB94C45E348C84001",
            "if4_report_descriptor_sha256": "78510751B31DCC204CD6CA2FE023F05CF84B75227A279E8E1FBAF7D6C3A21B6F",
            "runtime_output_256_physical": true,
            "runtime_input_getreport_physical": false,
            "feature_aa_ack55_physical": true,
            "aa_caused_recovery_physical": false,
            "cold_boot_caused_recovery_physical": false,
            "reference_recovery_vid_pid": "0000:2244",
            "reference_recovery_physically_observed": false,
            "safe_stock_backup_proven": false,
            "production_bootstrap_proven": false,
            "exact_board_firmware_proven": false,
            "flash_allowed": false
          }
          EOF

      - name: Offline firmware candidate inventory and MVA/CRC analysis
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, struct, os

          root=Path(".")
          out=Path("/tmp/v30/evidence")
          allowed={".mva",".bin",".img",".fw",".rom",".ota",".dfu"}
          skip={".git",".gradle","build","node_modules"}
          files=[]

          def crc16_xmodem(data):
              crc=0
              for b in data:
                  crc ^= b << 8
                  for _ in range(8):
                      crc=((crc<<1)^0x1021)&0xffff if crc&0x8000 else (crc<<1)&0xffff
              return crc

          def parse_mva(b):
              r={"magic_match":False,"record_count":None,"records":[],"parse_complete":False}
              if len(b)<5 or b[:4] != bytes.fromhex("4D56B158"):
                  return r
              r["magic_match"]=True
              count=b[4]
              r["record_count"]=count
              p=5
              try:
                  for i in range(count):
                      if p+5>len(b): raise ValueError("truncated record header")
                      rid=b[p]
                      n=int.from_bytes(b[p+1:p+5],"little")
                      p+=5
                      if p+n>len(b): raise ValueError("truncated record payload")
                      payload=b[p:p+n]
                      r["records"].append({
                          "index":i,
                          "id":rid,
                          "length":n,
                          "payload_sha256":hashlib.sha256(payload).hexdigest()
                      })
                      p+=n
                  r["parse_complete"]=True
                  r["bytes_after_records"]=len(b)-p
              except Exception as e:
                  r["error"]=str(e)
              return r

          for p in root.rglob("*"):
              if not p.is_file() or p.suffix.lower() not in allowed:
                  continue
              if any(x in skip for x in p.parts):
                  continue
              try:
                  b=p.read_bytes()
              except Exception:
                  continue
              rec={
                  "path":str(p),
                  "size":len(b),
                  "sha256":hashlib.sha256(b).hexdigest(),
                  "crc16_xmodem_whole":f"{crc16_xmodem(b):04X}",
                  "mva":parse_mva(b),
              }
              files.append(rec)

          decision={
              "candidate_count":len(files),
              "candidates":files,
              "exact_board_firmware_validated":False,
              "stock_backup_present":False,
              "production_recovery_package_validated":False,
              "flash_allowed":False,
              "required_next_input":
                "exact-board factory firmware/update package OR exact stock backup OR vendor production bootstrap/recovery documentation"
          }
          (out/"V30_FIRMWARE_INVENTORY.json").write_text(
              json.dumps(decision,indent=2,ensure_ascii=False)+"\n"
          )

          lines=[
              "# V30 Firmware Candidate Inventory",
              "",
              f"candidate_count: **{len(files)}**",
              "",
          ]
          for f in files:
              lines += [
                  f"## {f['path']}",
                  f"- size: {f['size']}",
                  f"- SHA256: `{f['sha256']}`",
                  f"- CRC16/XMODEM whole file: `{f['crc16_xmodem_whole']}`",
                  f"- MVA magic: `{f['mva'].get('magic_match')}`",
                  f"- MVA record count: `{f['mva'].get('record_count')}`",
                  f"- MVA parse complete: `{f['mva'].get('parse_complete')}`",
                  "",
              ]
          lines += [
              "## Gate",
              "- exact-board firmware validated: **NO**",
              "- stock backup present: **NO**",
              "- production recovery package validated: **NO**",
              "- `FLASH_ALLOWED=NO`",
          ]
          (out/"V30_FIRMWARE_INVENTORY.md").write_text("\n".join(lines)+"\n")
          PY

      - name: Generate passive Android gate app
        shell: bash
        run: |
          set -euo pipefail

          A=/tmp/v30/app
          mkdir -p "$A/app/src/main/java/com/okn/bp1048p4v30" "$A/app/src/main/res/xml"

          cat > "$A/settings.gradle" <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name='OKN_BP1048P4_V30'
          include ':app'
          EOF

          cat > "$A/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > "$A/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > "$A/app/build.gradle" <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.okn.bp1048p4v30'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.okn.bp1048p4v30'
                  minSdk 29
                  targetSdk 35
                  versionCode 30
                  versionName '30.0'
              }
          }
          EOF

          cat > "$A/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.usb.host" android:required="true"/>
              <application
                  android:allowBackup="false"
                  android:label="OKN BP1048P4 V30 MASTER GATE"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED"
                          android:resource="@xml/device_filter"/>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > "$A/app/src/main/res/xml/device_filter.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <usb-device vendor-id="25380" product-id="5913"/>
              <usb-device vendor-id="0" product-id="8772"/>
          </resources>
          EOF

          cat > "$A/app/src/main/java/com/okn/bp1048p4v30/MainActivity.java" <<'JAVA'
          package com.okn.bp1048p4v30;

          import android.app.Activity;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.hardware.usb.UsbDevice;
          import android.hardware.usb.UsbDeviceConnection;
          import android.hardware.usb.UsbInterface;
          import android.hardware.usb.UsbManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.SystemClock;
          import android.provider.OpenableColumns;
          import android.database.Cursor;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.security.MessageDigest;
          import java.util.Locale;
          import java.util.Map;

          public class MainActivity extends Activity {
              private static final int RUNTIME_VID=0x6324;
              private static final int RUNTIME_PID=0x1719;
              private static final int RECOVERY_VID=0x0000;
              private static final int RECOVERY_PID=0x2244;
              private static final int PICK_FILE=30;
              private static final int MAX_FILE=64*1024*1024;

              private UsbManager usb;
              private TextView log;
              private long t0;

              private final BroadcastReceiver rx=new BroadcastReceiver(){
                  @Override public void onReceive(Context c, Intent i){
                      UsbDevice d=getDevice(i);
                      if(UsbManager.ACTION_USB_DEVICE_ATTACHED.equals(i.getAction()))
                          line("USB ATTACHED"+dev(d));
                      else if(UsbManager.ACTION_USB_DEVICE_DETACHED.equals(i.getAction()))
                          line("USB DETACHED"+dev(d));
                      scan();
                  }
              };

              @Override protected void onCreate(Bundle b){
                  super.onCreate(b);
                  t0=SystemClock.elapsedRealtime();
                  usb=(UsbManager)getSystemService(Context.USB_SERVICE);

                  IntentFilter f=new IntentFilter();
                  f.addAction(UsbManager.ACTION_USB_DEVICE_ATTACHED);
                  f.addAction(UsbManager.ACTION_USB_DEVICE_DETACHED);
                  if(Build.VERSION.SDK_INT>=33)
                      registerReceiver(rx,f,Context.RECEIVER_NOT_EXPORTED);
                  else registerReceiver(rx,f);

                  LinearLayout root=new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(28,28,28,28);

                  TextView title=new TextView(this);
                  title.setText("OKN BP1048P4 V30 FINAL MASTER GATE");
                  title.setTextSize(20);
                  root.addView(title);

                  TextView note=new TextView(this);
                  note.setText(
                      "\nSamsung Galaxy S25+ → USB-C → DSP USB-C only\n"+
                      "PASSIVE/LOCAL ONLY\n"+
                      "ไม่มี SET_REPORT • ไม่มี AA • ไม่มี recovery command • ไม่มี erase/write\n");
                  root.addView(note);

                  add(root,"SCAN USB / PASSIVE GATE",v->scan());
                  add(root,"INSPECT FIRMWARE FILE LOCALLY",v->pickFile());

                  log=new TextView(this);
                  log.setTextIsSelectable(true);
                  log.setText("\nLog:\n");
                  root.addView(log);

                  ScrollView s=new ScrollView(this);
                  s.addView(root);
                  setContentView(s);
                  scan();
              }

              private void add(LinearLayout r,String s,View.OnClickListener l){
                  Button b=new Button(this);
                  b.setText(s);
                  b.setAllCaps(false);
                  b.setOnClickListener(l);
                  r.addView(b);
              }

              private UsbDevice getDevice(Intent i){
                  if(Build.VERSION.SDK_INT>=33)
                      return i.getParcelableExtra(UsbManager.EXTRA_DEVICE,UsbDevice.class);
                  return i.getParcelableExtra(UsbManager.EXTRA_DEVICE);
              }

              private void line(String s){
                  long ms=SystemClock.elapsedRealtime()-t0;
                  log.append(String.format(Locale.US,"[%06dms] %s\n",ms,s));
              }

              private String dev(UsbDevice d){
                  if(d==null)return "";
                  return String.format(Locale.US," [%04X:%04X id=%d name=%s]",
                      d.getVendorId(),d.getProductId(),d.getDeviceId(),d.getDeviceName());
              }

              private boolean runtime(UsbDevice d){
                  return d!=null && d.getVendorId()==RUNTIME_VID && d.getProductId()==RUNTIME_PID;
              }

              private boolean recovery(UsbDevice d){
                  return d!=null && d.getVendorId()==RECOVERY_VID && d.getProductId()==RECOVERY_PID;
              }

              private void scan(){
                  if(log==null)return;
                  Map<String,UsbDevice> m=usb.getDeviceList();
                  line("USB devices="+m.size());
                  boolean rr=false,rc=false;
                  for(UsbDevice d:m.values()){
                      line("พบ"+dev(d));
                      if(runtime(d)){
                          rr=true;
                          line("RUNTIME_PHYSICAL=true");
                          line("interfaces="+d.getInterfaceCount()+" permission="+usb.hasPermission(d));
                          for(int n=0;n<d.getInterfaceCount();n++){
                              UsbInterface x=d.getInterface(n);
                              line(String.format(Locale.US,
                                  " IF[%d] id=%d alt=%d class=%d sub=%d proto=%d eps=%d",
                                  n,x.getId(),x.getAlternateSetting(),x.getInterfaceClass(),
                                  x.getInterfaceSubclass(),x.getInterfaceProtocol(),x.getEndpointCount()));
                          }
                          if(usb.hasPermission(d)) readDescriptorsOnly(d);
                      }
                      if(recovery(d)){
                          rc=true;
                          line("REFERENCE_RECOVERY_0000_2244_PHYSICALLY_OBSERVED=true");
                          line("RECOVERY_COMMAND_SENT=false");
                      }
                  }
                  line("runtimeSeen="+rr);
                  line("recovery0000_2244Seen="+rc);
                  line("FLASH_ALLOWED=false");
              }

              private void readDescriptorsOnly(UsbDevice d){
                  UsbDeviceConnection c=usb.openDevice(d);
                  if(c==null){line("openDevice=null");return;}
                  try{
                      byte[] raw=c.getRawDescriptors();
                      if(raw!=null){
                          line("rawDescriptorBytes="+raw.length);
                          line("rawDescriptorSHA256="+sha256(raw));
                      }
                      byte[] report=new byte[1024];
                      int r=c.controlTransfer(
                          0x81,0x06,0x2200,4,report,report.length,1500);
                      line("IF4 GET_DESCRIPTOR(REPORT).result="+r);
                      if(r>0){
                          byte[] exact=new byte[r];
                          System.arraycopy(report,0,exact,0,r);
                          line("IF4 reportSHA256="+sha256(exact));
                      }
                  }catch(Exception e){
                      line("descriptor error="+e);
                  }finally{
                      c.close();
                  }
              }

              private void pickFile(){
                  Intent i=new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("*/*");
                  startActivityForResult(i,PICK_FILE);
              }

              @Override protected void onActivityResult(int req,int result,Intent data){
                  super.onActivityResult(req,result,data);
                  if(req!=PICK_FILE || result!=RESULT_OK || data==null || data.getData()==null)return;
                  inspectFile(data.getData());
              }

              private void inspectFile(Uri u){
                  try{
                      String name=fileName(u);
                      byte[] b=readAll(u);
                      line("=== LOCAL FIRMWARE INSPECT ===");
                      line("name="+name);
                      line("bytes="+b.length);
                      line("SHA256="+sha256(b));
                      line(String.format(Locale.US,"CRC16_XMODEM=%04X",crc16(b)));
                      boolean mva=b.length>=5 &&
                          (b[0]&255)==0x4D && (b[1]&255)==0x56 &&
                          (b[2]&255)==0xB1 && (b[3]&255)==0x58;
                      line("MVA_MAGIC="+mva);
                      if(mva){
                          int count=b[4]&255;
                          line("MVA_RECORD_COUNT="+count);
                          int p=5;
                          boolean ok=true;
                          for(int n=0;n<count;n++){
                              if(p+5>b.length){ok=false;break;}
                              int id=b[p]&255;
                              long len=((long)b[p+1]&255) |
                                  (((long)b[p+2]&255)<<8) |
                                  (((long)b[p+3]&255)<<16) |
                                  (((long)b[p+4]&255)<<24);
                              p+=5;
                              line(" MVA["+n+"] id="+id+" len="+len);
                              if(len<0 || len>b.length-p){ok=false;break;}
                              p+=(int)len;
                          }
                          line("MVA_PARSE_COMPLETE="+ok);
                          if(ok)line("MVA_BYTES_AFTER_RECORDS="+(b.length-p));
                      }
                      line("FILE_SENT_TO_DSP=false");
                      line("FLASH_ALLOWED=false");
                      line("=== LOCAL FIRMWARE INSPECT END ===");
                  }catch(Exception e){
                      line("file inspect error="+e);
                  }
              }

              private String fileName(Uri u){
                  String n="<unknown>";
                  try(Cursor c=getContentResolver().query(u,null,null,null,null)){
                      if(c!=null && c.moveToFirst()){
                          int i=c.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                          if(i>=0)n=c.getString(i);
                      }
                  }catch(Exception ignored){}
                  return n;
              }

              private byte[] readAll(Uri u)throws Exception{
                  try(InputStream in=getContentResolver().openInputStream(u);
                      ByteArrayOutputStream out=new ByteArrayOutputStream()){
                      if(in==null)throw new IllegalStateException("openInputStream=null");
                      byte[] buf=new byte[8192];
                      int total=0,r;
                      while((r=in.read(buf))!=-1){
                          total+=r;
                          if(total>MAX_FILE)throw new IllegalArgumentException("file > 64 MiB");
                          out.write(buf,0,r);
                      }
                      return out.toByteArray();
                  }
              }

              private static int crc16(byte[] b){
                  int crc=0;
                  for(byte q:b){
                      crc^=(q&255)<<8;
                      for(int i=0;i<8;i++)
                          crc=(crc&0x8000)!=0 ? ((crc<<1)^0x1021)&0xffff : (crc<<1)&0xffff;
                  }
                  return crc;
              }

              private static String sha256(byte[] b){
                  try{
                      MessageDigest m=MessageDigest.getInstance("SHA-256");
                      StringBuilder s=new StringBuilder();
                      for(byte q:m.digest(b))
                          s.append(String.format(Locale.US,"%02X",q&255));
                      return s.toString();
                  }catch(Exception e){return "<sha-error>";}
              }

              @Override protected void onDestroy(){
                  try{unregisterReceiver(rx);}catch(Exception ignored){}
                  super.onDestroy();
              }
          }
          JAVA

          JAVA_SRC="$A/app/src/main/java/com/okn/bp1048p4v30/MainActivity.java"

          # Fail closed: no host-to-device USB class/vendor control transfer.
          if grep -n -E 'controlTransfer\([[:space:]]*0x(0|2|4|6)[0-9A-Fa-f]' "$JAVA_SRC"; then
            echo "FAIL: possible host-to-device control transfer"
            exit 1
          fi

          # No HID SET_REPORT / Feature trigger / recovery command.
          if grep -n -E '0x09,[[:space:]]*0x0?2|0x0300|0xAA|chiperas|bootdat|codedata|constdat|cnfgdat|btupdat|upinfo|cxxx' "$JAVA_SRC"; then
            echo "FAIL: forbidden updater primitive in Android source"
            exit 1
          fi

          grep -q -F 'Samsung Galaxy S25+' "$JAVA_SRC"

      - name: Build V30 APK
        shell: bash
        run: |
          set -euo pipefail
          A=/tmp/v30/app

          SDKMAN="$(command -v sdkmanager || true)"
          if [ -n "$SDKMAN" ]; then
            set +o pipefail
            yes | "$SDKMAN" --licenses >/dev/null 2>&1 || true
            set -o pipefail
            "$SDKMAN" "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true
          fi

          cd /tmp/v30
          curl -fL --retry 3 --connect-timeout 15 \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o gradle.zip
          unzip -q gradle.zip
          export PATH="/tmp/v30/gradle-8.9/bin:$PATH"

          cd "$A"
          gradle --no-daemon :app:assembleDebug

          cp "$A/app/build/outputs/apk/debug/app-debug.apk" \
            /tmp/v30/out/OKN_BP1048P4_V30_FINAL_MASTER_GATE.apk

          (cd "$A" && zip -9 -r \
            /tmp/v30/out/OKN_BP1048P4_V30_ANDROID_SOURCE.zip . >/dev/null)

      - name: Produce final self-contained decision
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json

