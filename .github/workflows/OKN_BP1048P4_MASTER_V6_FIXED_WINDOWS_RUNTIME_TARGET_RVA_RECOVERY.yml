name: OKN BP1048P4 MASTER V6 FIXED WINDOWS RUNTIME TARGET-RVA RECOVERY

"on":
  workflow_dispatch:

permissions:
  contents: read

env:
  GOLOPINE_WINDOWS_URL: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-08.exe_.zip"
  EXPECTED_RUNTIME_VID_PID: "6324:1719"
  LIVE_DSP_CONNECTED: "NO"
  USB_TARGET_ACCESS: "NO"
  HOST_TO_DSP_IO: "NO"
  HID_SEND_ALLOWED: "NO"
  FLASH_ALLOWED: "NO"
  WRITE_ALLOWED: "NO"
  ERASE_ALLOWED: "NO"
  RECOVERY_COMMAND_ALLOWED: "NO"

jobs:
  master-v6-fixed:
    name: MASTER V6 FIXED runtime target-RVA recovery without DSP
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Safety gate and workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($n in @(
            "LIVE_DSP_CONNECTED","USB_TARGET_ACCESS","HOST_TO_DSP_IO",
            "HID_SEND_ALLOWED","FLASH_ALLOWED","WRITE_ALLOWED",
            "ERASE_ALLOWED","RECOVERY_COMMAND_ALLOWED"
          )) {
            if ((Get-Item "Env:$n").Value -ne "NO") { throw "$n must be NO" }
          }

          $root = "C:\okn_v6f"
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          New-Item -ItemType Directory -Force -Path `
            "$root\download","$root\pkg","$root\tools","$root\baseline",`
            "$root\runtime","$root\evidence","$root\out" | Out-Null

          @"
          MODE=WINDOWS_RUNTIME_TARGET_RVA_RECOVERY_WITHOUT_DSP
          LIVE_DSP_CONNECTED=NO
          USB_TARGET_ACCESS=NO
          HOST_TO_DSP_IO=NO
          HID_SEND_ALLOWED=NO
          FLASH_ALLOWED=NO
          WRITE_ALLOWED=NO
          ERASE_ALLOWED=NO
          RECOVERY_COMMAND_ALLOWED=NO
          "@ | Set-Content "$root\evidence\00_SAFETY.txt"

      - name: Download and select real official Windows vendor client
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "C:\okn_v6f"

          curl.exe -fL --retry 6 --retry-all-errors --retry-delay 2 `
            --connect-timeout 20 --max-time 300 `
            $env:GOLOPINE_WINDOWS_URL -o "$root\download\vendor.zip"
          if ($LASTEXITCODE -ne 0) { throw "vendor download failed" }

          Expand-Archive -Force "$root\download\vendor.zip" "$root\pkg"

          $exe = Get-ChildItem "$root\pkg" -Recurse -File -Filter *.exe |
            Where-Object {
              $_.FullName -notmatch '\\__MACOSX\\' -and
              $_.Name -notlike '._*'
            } |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (-not $exe) { throw "real vendor EXE not found" }
          if ($exe.Length -lt 100000) { throw "selected EXE too small" }

          Copy-Item $exe.FullName "$root\vendor.exe" -Force
          $b = [IO.File]::ReadAllBytes("$root\vendor.exe")
          if ($b[0] -ne 0x4D -or $b[1] -ne 0x5A) { throw "not MZ" }

          @"
          SELECTED_EXE=$($exe.FullName)
          BYTES=$($exe.Length)
          SHA256=$((Get-FileHash "$root\vendor.exe" -Algorithm SHA256).Hash)
          "@ | Set-Content "$root\evidence\01_VENDOR_IDENTITY.txt"

      - name: Install ILSpy and create baseline IL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "C:\okn_v6f"

          dotnet tool install --tool-path "$root\tools" ilspycmd *> "$root\evidence\02_ILSPY_INSTALL.txt"
          & "$root\tools\ilspycmd.exe" --version |
            Set-Content "$root\evidence\03_ILSPY_VERSION.txt"

          New-Item -ItemType Directory -Force -Path "$root\baseline\il","$root\baseline\cs" | Out-Null

          & "$root\tools\ilspycmd.exe" -il -o "$root\baseline\il" "$root\vendor.exe" `
            *> "$root\evidence\04_BASELINE_IL_LOG.txt"

          & "$root\tools\ilspycmd.exe" -p -o "$root\baseline\cs" "$root\vendor.exe" `
            *> "$root\evidence\05_BASELINE_CS_LOG.txt"

          if ((Get-ChildItem "$root\baseline\il" -Recurse -File).Count -lt 1) {
            throw "baseline IL empty"
          }

      - name: Extract exact target method RVAs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "C:\okn_v6f"

          @'
          from pathlib import Path
          import re, json

          root=Path(r"C:\okn_v6f\baseline\il")
          targets=[
            "DSTechAcutatorCommand::GetOutputData",
            "DSTechAcutatorCommand::.ctor",
            "HardwareCommandConverter::ConvertSigmaDSPCoefficient",
            "HardwareCommandConverter::SpitToByte",
            "HardwareCommandConverter::CreateFilterUpdateCommand",
            "HardwareCommandConverter::CreateSigmaDSPsingleVariableUpdateCommand",
            "HardwareCommandConverter::CreateSigmaDSPfiltrUpdateCommand",
            "HIDInterface::Connect",
            "HIDInterface::Write",
            "HIDInterface::Send",
          ]

          rows=[]
          for p in root.rglob("*"):
              if not p.is_file():
                  continue
              s=p.read_text(errors="ignore")
              lines=s.splitlines()

              for i,l in enumerate(lines):
                  if "} // end of method " not in l:
                      continue
                  name=l.split("} // end of method ",1)[1].strip()
                  if not any(t.lower() in name.lower() for t in targets):
                      continue

                  start=max(0,i-150)
                  block="\n".join(lines[start:i+1])
                  rv=re.findall(r"Method begins at RVA 0x([0-9A-Fa-f]+)",block)
                  code=re.findall(r"Code size:\s*(\d+)",block)

                  rows.append({
                    "method":name,
                    "rva":int(rv[-1],16) if rv else None,
                    "rva_hex":("0x"+rv[-1].upper()) if rv else None,
                    "baseline_code_size":int(code[-1]) if code else None,
                    "baseline_instruction_count":len(re.findall(r"\bIL_[0-9A-Fa-f]{4,8}:",block)),
                  })

          Path(r"C:\okn_v6f\evidence\06_TARGET_METHOD_RVAS.json").write_text(
              json.dumps(rows,indent=2)+"\n"
          )

          if not any(x.get("rva") for x in rows):
              raise SystemExit("no target RVAs")
          print(json.dumps(rows,indent=2))
          '@ | Set-Content "$root\extract_rvas.py"

          python "$root\extract_rvas.py"

      - name: Launch protected client and capture exact runtime target RVAs with correct WinAPI types
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "C:\okn_v6f"

          $p = Start-Process -FilePath "$root\vendor.exe" -WorkingDirectory $root -PassThru

          $captured = $false
          foreach ($delay in @(1,2,3,5)) {
            Start-Sleep -Seconds $delay
            $p.Refresh()
            if ($p.HasExited) { break }
            try {
              $base = $p.MainModule.BaseAddress.ToInt64()
              $size = $p.MainModule.ModuleMemorySize
              $captured = $true
              break
            } catch {
              Start-Sleep -Milliseconds 300
            }
          }

          if (-not $captured) {
            throw "could not capture process module"
          }

          "$($p.Id)|$base|$size" | Set-Content "$root\runtime\process_info.txt"

          @'
          from pathlib import Path
          import ctypes, json, struct, hashlib

          root=Path(r"C:\okn_v6f")
          pid_s,base_s,size_s=(root/"runtime/process_info.txt").read_text().strip().split("|")
          pid=int(pid_s); base=int(base_s); module_size=int(size_s)
          targets=json.loads((root/"evidence/06_TARGET_METHOD_RVAS.json").read_text())

          k=ctypes.WinDLL("kernel32", use_last_error=True)

          # Correct pointer-sized prototypes. V6 omitted these.
          k.OpenProcess.argtypes=[ctypes.c_uint32,ctypes.c_int,ctypes.c_uint32]
          k.OpenProcess.restype=ctypes.c_void_p
          k.ReadProcessMemory.argtypes=[
              ctypes.c_void_p, ctypes.c_void_p, ctypes.c_void_p,
              ctypes.c_size_t, ctypes.POINTER(ctypes.c_size_t)
          ]
          k.ReadProcessMemory.restype=ctypes.c_int
          k.CloseHandle.argtypes=[ctypes.c_void_p]
          k.CloseHandle.restype=ctypes.c_int

          PROCESS_VM_READ=0x0010
          PROCESS_QUERY_INFORMATION=0x0400
          h=k.OpenProcess(PROCESS_VM_READ|PROCESS_QUERY_INFORMATION,False,pid)
          if not h:
              raise OSError(ctypes.get_last_error(),"OpenProcess failed")

          def rpm(addr,n):
              buf=(ctypes.c_ubyte*n)()
              got=ctypes.c_size_t()
              ok=k.ReadProcessMemory(
                  h,ctypes.c_void_p(addr),ctypes.byref(buf),
                  n,ctypes.byref(got)
              )
              return bool(ok),got.value,bytes(buf[:got.value])

          diag={
              "pid":pid,
              "base":base,
              "base_hex":f"0x{base:X}",
              "module_size":module_size,
              "header":{},
              "targets":[]
          }

          ok,got,hdr=rpm(base,4096)
          diag["header"]={
              "ok":ok,"got":got,
              "first_64_hex":hdr[:64].hex().upper(),
              "starts_mz":hdr[:2]==b"MZ",
              "sha256":hashlib.sha256(hdr).hexdigest() if hdr else None
          }
          if hdr:
              (root/"runtime/runtime_header_4k.bin").write_bytes(hdr)

          for t in targets:
              rva=t.get("rva")
              if rva is None:
                  continue
              # 1024 bytes is enough to observe a replaced IL body / nearby stubs.
              ok,got,data=rpm(base+rva,1024)
              safe="".join(c if c.isalnum() else "_" for c in t["method"])[:120]
              if data:
                  (root/f"runtime/{safe}_rva_{rva:08X}.bin").write_bytes(data)
              diag["targets"].append({
                  **{k:v for k,v in t.items() if k!="block"},
                  "read_ok":ok,
                  "read_bytes":got,
                  "runtime_first_64_hex":data[:64].hex().upper(),
                  "runtime_sha256":hashlib.sha256(data).hexdigest() if data else None
              })

          k.CloseHandle(h)
          (root/"evidence/07_TARGET_RVA_RUNTIME_READ.json").write_text(
              json.dumps(diag,indent=2)+"\n"
          )
          print(json.dumps(diag,indent=2))
          '@ | Set-Content "$root\target_read.py"

          python "$root\target_read.py"

          if (-not $p.HasExited) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

          $r = Get-Content "$root\evidence\07_TARGET_RVA_RUNTIME_READ.json" -Raw | ConvertFrom-Json
          $good = @($r.targets | Where-Object { $_.read_ok -eq $true -and $_.read_bytes -gt 0 }).Count
          if ($good -lt 1) { throw "no target RVA could be read" }

      - name: Compare runtime RVA bytes against disk and patch only valid changed method bodies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "C:\okn_v6f"

          @'
          from pathlib import Path
          import json, struct, hashlib, re, shutil

          root=Path(r"C:\okn_v6f")
          exe=root/"vendor.exe"
          b=bytearray(exe.read_bytes())
          targets=json.loads((root/"evidence/06_TARGET_METHOD_RVAS.json").read_text())
          runtime=json.loads((root/"evidence/07_TARGET_RVA_RUNTIME_READ.json").read_text())

          pe=struct.unpack_from("<I",b,0x3C)[0]
          if b[pe:pe+4] != b"PE\0\0":
              raise SystemExit("disk PE invalid")
          coff=pe+4
          nsec=struct.unpack_from("<H",b,coff+2)[0]
          opt_size=struct.unpack_from("<H",b,coff+16)[0]
          opt=coff+20
          sect=opt+opt_size

          sections=[]
          for i in range(nsec):
              o=sect+i*40
              name=b[o:o+8].split(b"\0",1)[0].decode("ascii","replace")
              vsize,va,raw_size,raw_ptr=struct.unpack_from("<IIII",b,o+8)
              sections.append((name,va,max(vsize,raw_size),raw_ptr,raw_size))

          def rva_to_off(rva):
              for name,va,span,rp,rs in sections:
                  if va <= rva < va+span:
                      d=rva-va
                      if d < rs:
                          return rp+d
              return None

          def parse_method(blob):
              if not blob:
                  return None
              b0=blob[0]
              # Tiny format: low 2 bits == 2, code size in upper 6 bits.
              if b0 & 0x3 == 0x2:
                  cs=b0>>2
                  return {"format":"tiny","header_size":1,"code_size":cs,"total":1+cs}
              # Fat format.
              if len(blob)>=12 and b0 & 0x3 == 0x3:
                  flags_size=struct.unpack_from("<H",blob,0)[0]
                  dwords=(flags_size>>12)&0xF
                  hs=dwords*4
                  cs=struct.unpack_from("<I",blob,4)[0]
                  if hs>=12 and hs<=64 and cs<=65536:
                      return {"format":"fat","header_size":hs,"code_size":cs,"total":hs+cs}
              return None

          rt_by={(x.get("rva")):x for x in runtime["targets"]}
          out=bytearray(b)
          report=[]

          for t in targets:
              rva=t.get("rva")
              if rva is None:
                  continue
              ro=rt_by.get(rva,{})
              safe="".join(c if c.isalnum() else "_" for c in t["method"])[:120]
              rp=root/f"runtime/{safe}_rva_{rva:08X}.bin"
              if not rp.exists():
                  continue
              rb=rp.read_bytes()
              off=rva_to_off(rva)
              if off is None:
                  report.append({"method":t["method"],"rva":rva,"mapped":False})
                  continue

              disk=b[off:off+len(rb)]
              first_diff=next((i for i,(x,y) in enumerate(zip(disk,rb)) if x!=y),None)
              runtime_method=parse_method(rb)
              disk_method=parse_method(disk)

              patched=False
              patch_len=0

              if first_diff is not None and runtime_method:
                  # Patch only method header + code, never neighboring data.
                  total=runtime_method["total"]
                  if 0 < total <= min(len(rb),65536):
                      out[off:off+total]=rb[:total]
                      patched=True
                      patch_len=total

              report.append({
                  "method":t["method"],
                  "rva":rva,
                  "rva_hex":f"0x{rva:X}",
                  "file_offset":off,
                  "read_bytes":len(rb),
                  "changed":first_diff is not None,
                  "first_diff_offset":first_diff,
                  "disk_method":disk_method,
                  "runtime_method":runtime_method,
                  "patched":patched,
                  "patch_len":patch_len,
                  "disk_first_64_hex":bytes(disk[:64]).hex().upper(),
                  "runtime_first_64_hex":rb[:64].hex().upper(),
              })

          patched=root/"runtime/runtime_target_patched.exe"
          patched.write_bytes(out)

          summary={
              "patched_exe_sha256":hashlib.sha256(out).hexdigest(),
              "changed_targets":sum(1 for x in report if x.get("changed")),
              "valid_runtime_method_headers":sum(1 for x in report if x.get("runtime_method")),
              "patched_targets":sum(1 for x in report if x.get("patched")),
              "targets":report,
          }
          (root/"evidence/08_RUNTIME_TARGET_DIFF_AND_PATCH.json").write_text(
              json.dumps(summary,indent=2)+"\n"
          )
          print(json.dumps(summary,indent=2))
          '@ | Set-Content "$root\patch_targets.py"

          python "$root\patch_targets.py"

          $j = Get-Content "$root\evidence\08_RUNTIME_TARGET_DIFF_AND_PATCH.json" -Raw | ConvertFrom-Json
          if ($j.changed_targets -lt 1) {
            "NO_RUNTIME_TARGET_CHANGE_OBSERVED=true" | Set-Content "$root\evidence\08A_NO_RUNTIME_CHANGE.txt"
          }

      - name: Decompile target-patched image and compare exact command methods
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "C:\okn_v6f"

          New-Item -ItemType Directory -Force -Path "$root\runtime\patched_il","$root\runtime\patched_cs" | Out-Null

          & "$root\tools\ilspycmd.exe" -il -o "$root\runtime\patched_il" "$root\runtime\runtime_target_patched.exe" `
            *> "$root\evidence\09_PATCHED_ILSPY_IL_LOG.txt"

          & "$root\tools\ilspycmd.exe" -p -o "$root\runtime\patched_cs" "$root\runtime\runtime_target_patched.exe" `
            *> "$root\evidence\10_PATCHED_ILSPY_CS_LOG.txt"

          @'
          from pathlib import Path
          import re,json,hashlib

          root=Path(r"C:\okn_v6f")
          targets=[
            "DSTechAcutatorCommand::GetOutputData",
            "DSTechAcutatorCommand::.ctor",
            "HardwareCommandConverter::ConvertSigmaDSPCoefficient",
            "HardwareCommandConverter::SpitToByte",
            "HardwareCommandConverter::CreateFilterUpdateCommand",
            "HardwareCommandConverter::CreateSigmaDSPsingleVariableUpdateCommand",
            "HardwareCommandConverter::CreateSigmaDSPfiltrUpdateCommand",
            "HIDInterface::Connect","HIDInterface::Write","HIDInterface::Send",
          ]

          def extract(folder):
              rows={}
              for p in folder.rglob("*"):
                  if not p.is_file():
                      continue
                  lines=p.read_text(errors="ignore").splitlines()
                  starts=[i for i,l in enumerate(lines) if re.match(r"^\s*\.method\b",l)]
                  for si,st in enumerate(starts):
                      en=starts[si+1] if si+1<len(starts) else len(lines)
                      for j in range(st,en):
                          if re.search(r"\}\s*//\s*end of method",lines[j]):
                              en=j+1
                              break
                      block="\n".join(lines[st:en])
                      names=re.findall(r"\}\s*//\s*end of method\s+(.+)",block)
                      name=names[-1].strip() if names else ""
                      if not any(t.lower() in name.lower() for t in targets):
                          continue
                      ins=len(re.findall(r"\bIL_[0-9A-Fa-f]{4,8}:",block))
                      code=re.findall(r"Code size:\s*(\d+)",block)
                      rows[name]={
                          "instruction_count":ins,
                          "code_size":int(code[-1]) if code else None,
                          "sha256":hashlib.sha256(block.encode()).hexdigest(),
                          "block":block
                      }
              return rows

          base=extract(root/"baseline/il")
          patched=extract(root/"runtime/patched_il")

          comparison=[]
          excerpts=[]
          for name in sorted(set(base)|set(patched)):
              b=base.get(name,{})
              p=patched.get(name,{})
              changed=b.get("sha256") != p.get("sha256")
              restored=(p.get("code_size",0)>4 or p.get("instruction_count",0)>b.get("instruction_count",0))
              comparison.append({
                  "method":name,
                  "baseline_instruction_count":b.get("instruction_count"),
                  "patched_instruction_count":p.get("instruction_count"),
                  "baseline_code_size":b.get("code_size"),
                  "patched_code_size":p.get("code_size"),
                  "changed":changed,
                  "appears_restored":restored,
              })
              if p:
                  excerpts.append(
                      f"\n===== {name} restored={restored} =====\n" +
                      "\n".join(p["block"].splitlines()[:500]) + "\n"
                  )

          (root/"evidence/11_PATCHED_METHOD_COMPARISON.json").write_text(
              json.dumps(comparison,indent=2)+"\n"
          )
          (root/"evidence/12_PATCHED_FOCUSED_IL.txt").write_text("".join(excerpts))
          print(json.dumps(comparison,indent=2))
          '@ | Set-Content "$root\compare_patched.py"

          python "$root\compare_patched.py"

      - name: Offline pure command-builder reflection probe with no HID invocation
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          $root = "C:\okn_v6f"

          @'
          param([string]$AssemblyPath,[string]$OutPath)
          $ErrorActionPreference = "Stop"

          function Hex($x) {
            if ($null -eq $x) { return "<NULL>" }
            if ($x -is [byte[]]) {
              return (($x | ForEach-Object { $_.ToString("X2") }) -join "")
            }
            return [string]$x
          }

          $o=New-Object System.Collections.Generic.List[string]
          $o.Add("MODE=PURE_BUILDERS_ONLY")
          $o.Add("HID_CONNECT_INVOKED=NO")
          $o.Add("HID_SEND_INVOKED=NO")
          $o.Add("HID_WRITE_INVOKED=NO")

          try {
            $asm=[Reflection.Assembly]::LoadFile($AssemblyPath)
            $o.Add("ASSEMBLY=$($asm.FullName)")

            $hc=$asm.GetType("DSTech_AudioDSP_Client.HardwareCommandConverter",$false)

            if ($hc) {
              foreach ($name in @("ConvertSigmaDSPCoefficient","SpitToByte")) {
                $m=$hc.GetMethod($name,[Reflection.BindingFlags]"Public,Static")
                if ($m) {
                  foreach ($v in @(0,1,-1,4660)) {
                    try {
                      $arg = if ($name -eq "ConvertSigmaDSPCoefficient") { [double]$v } else { [int]$v }
                      $r=$m.Invoke($null,@($arg))
                      $o.Add("$name($v)=$(Hex $r)")
                    } catch {
                      $o.Add("$name($v)=EXCEPTION:$($_.Exception.GetBaseException().Message)")
                    }
                  }
                }
              }

              $m=$hc.GetMethod("CreateSigmaDSPsingleVariableUpdateCommand",[Reflection.BindingFlags]"Public,Static")
              if ($m) {
                foreach ($addr in @([int16]0,[int16]1,[int16]4660)) {
                  foreach ($dat in @([double]0,[double]1,[double]-1,[double]0.5)) {
                    try {
                      $r=$m.Invoke($null,@($addr,$dat))
                      $o.Add("CreateSigmaDSPsingleVariableUpdateCommand($addr,$dat)=$(Hex $r)")
                    } catch {
                      $o.Add("CreateSigmaDSPsingleVariableUpdateCommand($addr,$dat)=EXCEPTION:$($_.Exception.GetBaseException().Message)")
                    }
                  }
                }
              }
            } else {
              $o.Add("HardwareCommandConverter=NOT_FOUND")
            }

            $ct=$asm.GetType("DSTech_AudioDSP_Client.DSTechAcutatorCommand",$false)
            if ($ct) {
              try {
                $obj=[Activator]::CreateInstance($ct)
                $ap=$ct.GetProperty("Address")
                $dp=$ct.GetProperty("Data")
                $gm=$ct.GetMethod("GetOutputData",[Reflection.BindingFlags]"Public,Instance")
                foreach ($addr in @(0,1,4660)) {
                  foreach ($data in @(
                    [byte[]]@(),
                    [byte[]]@(0),
                    [byte[]]@(1,2,3,4),
                    [byte[]]@(0xA5,0x5A,0,0,0x16)
                  )) {
                    try {
                      $ap.SetValue($obj,[int]$addr,$null)
                      $dp.SetValue($obj,$data,$null)
                      $r=$gm.Invoke($obj,$null)
                      $o.Add("DSTechAcutatorCommand addr=$addr data=$(Hex $data) output=$(Hex $r)")
                    } catch {
                      $o.Add("DSTechAcutatorCommand addr=$addr=EXCEPTION:$($_.Exception.GetBaseException().Message)")
                    }
                  }
                }
              } catch {
                $o.Add("DSTechAcutatorCommand_PROBE=EXCEPTION:$($_.Exception.GetBaseException().Message)")
              }
            }
          } catch {
            $o.Add("ASSEMBLY_EXCEPTION=$($_.Exception.GetBaseException().ToString())")
          }

          $o | Set-Content $OutPath
          '@ | Set-Content "$root\pure_probe.ps1"

          $x86ps="$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe"

          if (Test-Path $x86ps) {
            & $x86ps -NoProfile -ExecutionPolicy Bypass `
              -File "$root\pure_probe.ps1" `
              -AssemblyPath "$root\runtime\runtime_target_patched.exe" `
              -OutPath "$root\evidence\13_PURE_BUILDER_OUTPUTS.txt"
          } else {
            "X86_POWERSHELL_NOT_FOUND=true" |
              Set-Content "$root\evidence\13_PURE_BUILDER_OUTPUTS.txt"
          }

      - name: Build V6 FIXED final decision
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "C:\okn_v6f"

          @'
