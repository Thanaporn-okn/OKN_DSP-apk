      - name: Validate consolidated protocol catalog and fail-closed writer
        shell: bash
        run: |
          set -euo pipefail
          BLE=app/src/main/java/com/okn/peramp/BleClient.java
          DSP=app/src/main/java/com/okn/peramp/DspProtocol.java
          CAT=app/src/main/java/com/okn/peramp/ProtocolCatalog.java
          UI=app/src/main/java/com/okn/peramp/MainActivity.java
          REF=EXTRACTED_REFERENCE.md

          # Production transport/authentication that was qualified against the physical DSP.
          grep -q '0000ab00-0000-1000-8000-00805f9b34fb' "$BLE"
          grep -q '0000ab01-0000-1000-8000-00805f9b34fb' "$BLE"
          grep -q '0000ab02-0000-1000-8000-00805f9b34fb' "$BLE"
          grep -q 'WRITE_TYPE_NO_RESPONSE' "$BLE"
          grep -q '631C062443FD3844558001F3EDA0CCF8' "$DSP"
          grep -q '661C0624' "$DSP"
          grep -q 'AES/CFB8/NoPadding' "$DSP"
          grep -q '2AAF948632A59FF8F2B23E6E4193FD21' "$DSP"
          grep -q '10E7D2F443924938A28D759BAC0E9E22' "$DSP"
          grep -q 'EQ_RECORD_BYTES = 48' "$DSP"
          grep -q 'V106 SCALAR PRECHECK' "$DSP"
          grep -q 'V106 EQ PRECHECK' "$DSP"
          grep -q 'V106 ROLLBACK VERIFIED' "$DSP"
          grep -q 'V106 SAVE PRECHECK' "$DSP"
          grep -q 'V106 SAVE VERIFIED' "$DSP"
          grep -q 'TrebleBoost ID11 remains WRITE LOCKED' "$DSP"

          # Full recovered catalog is present, but catalog entries must not relax the writer allow-list.
          grep -q 'UUID_40AF_SERVICE' "$CAT"
          grep -q 'UUID_FFE0_SERVICE' "$CAT"
          grep -q 'UFE_READ_SENSOR_FIFO = 97' "$CAT"
          grep -q 'UFE_READ_SENSOR_ACTUATOR_BULK = 99' "$CAT"
          grep -q 'BIQUAD_CASCADE31_F' "$CAT"
          grep -q 'CHEBYSHEV_TYPE2_HIGHPASS' "$CAT"
          grep -q 'BluetoothSPP=2' "$CAT"
          grep -q 'HandshakeError=4' "$CAT"
          grep -q 'WriteActuator(actuator,cascade)' "$CAT"
          grep -q 'accessControl' "$DSP"
          grep -q 'constantParameters' "$DSP"
          grep -q 'ProtocolCatalog.filterName' "$DSP"
          grep -q 'REVERSE-ENGINEERING CATALOG' "$UI"
          grep -q 'UFE + FILTER TYPE CATALOG' "$UI"
          grep -q '0x2A05 Service Changed must never be treated as DSP RX' "$REF"

          # Unsafe old AUTO transport and old literal one-byte descriptor request must not re-enter production code.
          if grep -qE 'profile *= *"AUTO"|new byte\[\]\{\(byte\)89\}|TX 59' "$BLE" "$DSP"; then
            echo 'ERROR: legacy guessed transport/request found in production code'
            grep -nE 'profile *= *"AUTO"|new byte\[\]\{\(byte\)89\}|TX 59' "$BLE" "$DSP" || true
            exit 1
          fi

          grep -q 'versionCode 6' app/build.gradle
          grep -q "versionName '1.0.6'" app/build.gradle

          python3 - <<'PYVAL'
          import re, subprocess
          from pathlib import Path
          ui=Path('app/src/main/java/com/okn/peramp/MainActivity.java').read_text(encoding='utf-8')
          m=re.search(r'DEFAULT_FREQS = \{([^}]*)\}', ui); assert m
          bands=[x.strip() for x in m.group(1).split(',') if x.strip()]; assert len(bands)==15
          m=re.search(r'CHANNEL_NAMES = \{([^}]*)\}', ui); assert m
          channels=re.findall(r'"([^"]+)"', m.group(1)); assert channels == ['CH1 LEFT','CH2 RIGHT','CH3 BASS','CH4','CH5','CH6','CH7']
          for page in ['HOME','BLUETOOTH','MASTER','CHANNEL','15-BAND EQ','X-OVER','DELAY','EFFECTS','PRESET','DRC','REVERB','PROTOCOL']:
              assert f'"{page}"' in ui

          cat=Path('app/src/main/java/com/okn/peramp/ProtocolCatalog.java').read_text(encoding='utf-8')
          for filter_id in range(21):
              assert re.search(rf'FILTER_TYPES\.put\({filter_id},', cat), filter_id
          for token in ['Q31','FLOAT32','TRIGGER_RESPONSE','INT32','BIQUAD_CASCADE_F_BASE','FIFO_XY_FLOAT_PLOTTER','UFE_EIT_LXP_HONEYCOMB']:
              assert token in cat, token

          # Previously captured real-device authentication vector.
          auth32=bytes.fromhex('D024E38C00000000420DA6E8FDDF06895D514A274A2181DEB2F457CA70A60EC1')
          key='2AAF948632A59FF8F2B23E6E4193FD21'; iv='01'*16
          plain=subprocess.run(['openssl','enc','-aes-128-cfb8','-d','-K',key,'-iv',iv,'-nopad'], input=auth32[8:], stdout=subprocess.PIPE, check=True).stdout
          assert plain.hex().upper() == '060708080D07405C0168DEEB916838D752E0D696BB3655E6'
          rand=plain[8:]
          enc=subprocess.run(['openssl','enc','-aes-128-cfb8','-e','-K',rand.hex(),'-iv',iv,'-nopad'], input=bytes.fromhex('661C0624'), stdout=subprocess.PIPE, check=True).stdout
          assert enc.hex().upper() == '5DFCB7E5'
          print('v1.0.6 consolidated validation: PASS')
          print('15 EQ bands x 7 channels; 21 recovered biquad filter types catalogued')
          PYVAL

      - name: Build debug APK
        id: apk_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p dist
          gradle --version | tee dist/gradle-version.txt
          gradle --no-daemon --stacktrace --warning-mode all clean assembleDebug 2>&1 | tee dist/build.log

      - name: Verify APK
        if: steps.apk_build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" dist/OKN-Peramp-v1.0.6-debug.apk
          AAPT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/build-tools/35.0.0/aapt2"
          "$AAPT" dump badging "$APK" | tee dist/apk-badging.txt
          grep -q "package: name='com.okn.peramp.debug'" dist/apk-badging.txt
          grep -q "versionCode='6'" dist/apk-badging.txt
          grep -q "versionName='1.0.6-debug'" dist/apk-badging.txt
          grep -q "application-label:'OKN Peramp'" dist/apk-badging.txt
          sha256sum dist/OKN-Peramp-v1.0.6-debug.apk | tee dist/SHA256SUMS.txt

      - name: Package generated source
        if: steps.apk_build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          zip -qr dist/OKN-Peramp-v1.0.6-source.zip settings.gradle build.gradle gradle.properties EXTRACTED_REFERENCE.md app -x 'app/build/*'
          sha256sum dist/OKN-Peramp-v1.0.6-source.zip >> dist/SHA256SUMS.txt
          ls -lh dist

      - name: Upload OKN Peramp v1.0.6
        if: steps.apk_build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: OKN-Peramp-v1.0.6
          path: |
            dist/OKN-Peramp-v1.0.6-debug.apk
            dist/OKN-Peramp-v1.0.6-source.zip
            dist/SHA256SUMS.txt
            dist/apk-badging.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OKN-Peramp-v1.0.6-build-diagnostics
          path: |
            dist/ci-context.txt
            dist/build.log
            dist/gradle-version.txt
            dist/apk-badging.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Write workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "# OKN Peramp v1.0.6"
            echo
            if [ -s dist/OKN-Peramp-v1.0.6-debug.apk ]; then
              echo "✅ APK generated and package/version verification passed."
              echo "Artifact: **OKN-Peramp-v1.0.6**"
              echo "Basis: consolidated APK + EXE + physical DSP reverse-engineering catalog"
              echo "Writer: fail-closed hardware-qualified AB00/Auth16/AES-CFB8/UFE surface"
            else
              echo "❌ APK was not generated."
              echo "Download **OKN-Peramp-v1.0.6-build-diagnostics** and inspect build.log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail workflow if APK build failed
        if: steps.apk_build.outcome != 'success'
        shell: bash
        run: exit 1
