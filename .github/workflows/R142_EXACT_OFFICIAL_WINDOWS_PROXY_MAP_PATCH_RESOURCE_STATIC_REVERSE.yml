name: R142 exact official Windows proxy map patch resource static reverse

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R142_EXACT_OFFICIAL_WINDOWS_PROXY_MAP_PATCH_RESOURCE_STATIC_REVERSE.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r142-official-windows-proxy-map-patch-resource-${{ github.ref }}
  cancel-in-progress: true

env:
  FLASH_ALLOWED: "NO"
  R141_FIXED_RUN_ID: "35954842830"
  R141_FIXED_JOB_ID: "107490850984"
  R141_FIXED_ARTIFACT_ID: "10790122482"
  R141_FIXED_ARTIFACT_NAME: "R141-FIXED-EXACT-OFFICIAL-WINDOWS-PROTECTOR-RESOURCE-STATIC-EVIDENCE"
  R141_FIXED_ARTIFACT_DIGEST: "sha256:ea3a8180bef36c082a557b74b044636d6b0359a889f80f7274d8c0d662595cdb"
  R139_RUN_ID: "35942006697"
  R139_ACQUIRED_ARTIFACT_ID: "10785516143"
  R139_ACQUIRED_ARTIFACT_NAME: "R139-ACQUIRED-OFFICIAL-GOLOPINE-7CH-CLIENTS"
  R139_ACQUIRED_ARTIFACT_DIGEST: "sha256:94cf50b5d821e02f4303236fe42c5748434a70a1f914c91a6794d5c2d71097ab"
  R139_ACQUIRED_INNER_ZIP_SHA256: "47847664d699fc0fdd85a3861c438916524715803655dc25a23f1d34ee3bf375"
  WINDOWS_ZIP_SHA256: "f14b0c4baad70a8b0d5dc3b2783819cc2ef6e1a9c6ec2adcf17f1557059edd2a"
  WINDOWS_EXE_SHA256: "3ca54171c53f7badd963ffe6851b8b3e2faf8aee8ba2afcb7040990e22ae09b2"
  Cqby_RESOURCE_NAME: "Cqbyqa4dLFCxiIqcVf.y5BfsDAojQqIPctdlf"
  H15_RESOURCE_NAME: "h15IL2i6yy2BZV8RqM.YuRwd1JALC4oy32W66"
  PROD_VID_DEC: "6324"
  PROD_PID_DEC: "1719"
  PROD_VID_HEX: "18B4"
  PROD_PID_HEX: "06B7"

jobs:
  static_reverse:
    name: STATIC ONLY - proxy map + patch resource - no execution - no USB - no board
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r142/r141 /tmp/r142/r139 /tmp/r142/acquired /tmp/r142/windows /tmp/r142/evidence /tmp/r142/resources
          cat > /tmp/r142/evidence/R142_SAFETY.txt <<'EOF'
          R142_MODE=OFFLINE_STATIC_PROXY_MAP_PATCH_RESOURCE_REVERSE_ONLY
          R142_VENDOR_BINARY_EXECUTED=NO
          R142_WINDOWS_EXE_EXECUTED=NO
          R142_USB_DEVICE_ACCESS=NO
          R142_BOARD_CONTACT=NO
          R142_AA55_SENT=NO
          R142_RUNTIME_0X11_SENT=NO
          R142_RUNTIME_0XFE_SENT=NO
          R142_FLASHBOOT_COMMAND_SENT=NO
          R142_FLASH_READ_EXECUTED=NO
          R142_FLASH_ERASE_EXECUTED=NO
          R142_FLASH_WRITE_EXECUTED=NO
          R142_ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD=NO
          HARDWARE_MODIFICATION=FORBIDDEN
          REFERENCE_OR_TOOL_EVIDENCE_IS_NOT_PRODUCTION_SAFETY_PROOF=YES
          FLASH_ALLOWED=NO
          EOF

      - name: Download pinned R141 FIXED evidence
        uses: actions/download-artifact@v4
        with:
          name: R141-FIXED-EXACT-OFFICIAL-WINDOWS-PROTECTOR-RESOURCE-STATIC-EVIDENCE
          path: /tmp/r142/r141
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 35954842830

      - name: Download pinned R139 official clients as inert data
        uses: actions/download-artifact@v4
        with:
          name: R139-ACQUIRED-OFFICIAL-GOLOPINE-7CH-CLIENTS
          path: /tmp/r142/r139
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 35942006697

      - name: Install static metadata tooling only
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq file unzip python3-pip >/dev/null
          python3 -m pip install --disable-pip-version-check --no-input dnfile pefile >/dev/null

      - name: Verify and extract pinned evidence plus official Windows client
        shell: bash
        run: |
          set -euo pipefail

          R141_OUTER="$(find /tmp/r142/r141 -maxdepth 2 -type f -name 'R141_FIXED_EXACT_OFFICIAL_WINDOWS_PROTECTOR_RESOURCE_STATIC_EVIDENCE.zip' -print -quit)"
          test -n "$R141_OUTER"
          sha256sum "$R141_OUTER" > /tmp/r142/evidence/R142_R141_INNER_ZIP.sha256
          unzip -q "$R141_OUTER" -d /tmp/r142/evidence/r141
          test -s /tmp/r142/evidence/r141/R141_FIXED_MANAGED_RESOURCE_BLOB.bin
          test -s /tmp/r142/evidence/r141/r140/R140_FIXED_FULL.il
          test -s /tmp/r142/evidence/r141/R141_FIXED_DECISION.json
          grep -F '"FLASH_ALLOWED": false' /tmp/r142/evidence/r141/R141_FIXED_DECISION.json

          ACQ="$(find /tmp/r142/r139 -maxdepth 2 -type f -name 'R139_ACQUIRED_OFFICIAL_GOLOPINE_7CH_CLIENTS.zip' -print -quit)"
          test -n "$ACQ"
          echo "${R139_ACQUIRED_INNER_ZIP_SHA256}  ${ACQ}" | sha256sum -c -
          unzip -q "$ACQ" -d /tmp/r142/acquired
          WINZIP=/tmp/r142/acquired/windows_2026-04-08.zip
          test -f "$WINZIP"
          echo "${WINDOWS_ZIP_SHA256}  ${WINZIP}" | sha256sum -c -
          unzip -q "$WINZIP" -d /tmp/r142/windows
          WINEXE="$(find /tmp/r142/windows -type f -name 'golopine_audio_turning_release_2026-04-08.exe' ! -path '*/__MACOSX/*' -print -quit)"
          test -n "$WINEXE"
          echo "${WINDOWS_EXE_SHA256}  ${WINEXE}" | sha256sum -c -
          printf '%s\n' "$WINEXE" > /tmp/r142/WINEXE_PATH
          file "$WINEXE" > /tmp/r142/evidence/R142_WINDOWS_FILE_TYPE.txt

      - name: Extract all managed resources and decrypt exact Cqby proxy map
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,struct,hashlib,json,math,collections

          ev=Path('/tmp/r142/evidence')
          blob=(ev/'r141/R141_FIXED_MANAGED_RESOURCE_BLOB.bin').read_bytes()
          manifest=(ev/'r141/R141_FIXED_MANIFEST.txt').read_text(errors='replace')
          il=(ev/'r141/r140/R140_FIXED_FULL.il').read_text(errors='replace')

          entries=[]
          for m in re.finditer(r"^\s*(\d+):\s+private\s+'([^']+)'\s+at offset\s+(\d+)\s+in current module",manifest,re.M):
              entries.append({'index':int(m.group(1)),'name':m.group(2),'offset':int(m.group(3))})
          if not entries:
              raise SystemExit('No manifest resources parsed')
          entries.sort(key=lambda x:x['offset'])

          for i,e in enumerate(entries):
              off=e['offset']
              if off+4>len(blob): raise SystemExit(f'bad resource offset {off}')
              ln=struct.unpack_from('<I',blob,off)[0]
              payload=blob[off+4:off+4+ln]
              if len(payload)!=ln: raise SystemExit(f'truncated resource {e["name"]}')
              e.update({
                  'declared_length':ln,
                  'payload_sha256':hashlib.sha256(payload).hexdigest(),
                  'first32_hex':payload[:32].hex(),
                  'ascii_18B4':payload.count(b'18B4')+payload.count(b'18b4'),
                  'ascii_06B7':payload.count(b'06B7')+payload.count(b'06b7'),
                  'ascii_6324':payload.count(b'6324'),
                  'ascii_1719':payload.count(b'1719'),
                  'le16_18B4':payload.count(struct.pack('<H',0x18B4)),
                  'le16_06B7':payload.count(struct.pack('<H',0x06B7)),
                  'le32_6324':payload.count(struct.pack('<I',6324)),
                  'le32_1719':payload.count(struct.pack('<I',1719)),
              })
              outp=Path('/tmp/r142/resources')/f'{e["index"]:02d}_{e["name"]}.bin'
              outp.write_bytes(payload)
              e['extracted_path']=str(outp)

          byname={e['name']:e for e in entries}
          cq=byname.get('Cqbyqa4dLFCxiIqcVf.y5BfsDAojQqIPctdlf')
          h15=byname.get('h15IL2i6yy2BZV8RqM.YuRwd1JALC4oy32W66')
          if not cq or not h15: raise SystemExit('required resources missing')

          cq_bytes=Path(cq['extracted_path']).read_bytes()

          # Exact offline reconstruction of the transform visible in
          # q71r2Rj8SiD9GF1BI50::yvgj74JvmW IL_013f..IL_033f.
          # This is data transformation only; the vendor EXE is never executed.
          def u32(x): return x & 0xffffffff
          def rol32(x,n): return u32((x<<n)|(x>>(32-n)))

          fixed38=u32(658242601 ^ 1092075823 ^ 1441417454)
          out=bytearray(len(cq_bytes))
          state=0
          words=(len(cq_bytes)+3)//4
          rem=len(cq_bytes)%4
          for i in range(words):
              off=i*4
              if i==words-1 and rem:
                  enc=0
                  for k in range(rem):
                      enc=(enc<<8)|cq_bytes[len(cq_bytes)-1-k]
              else:
                  enc=int.from_bytes(cq_bytes[off:off+4],'little')

              loc39=725701736
              loc40=7651480
              loc41=1474240118
              loc42=state
              loc41=u32(loc41-loc39)
              loc39=u32(loc39-loc41)

              # IL computes a bit-swap value into loc44 but does not consume it
              # on the path producing loc42/state. Retain calculation as audit.
              loc44=loc40 & 0x55555555
              loc45=loc40 & 0xaaaaaaaa
              loc44=u32(((loc44>>1)|u32(loc45<<1)) ^ loc41)

              loc40=rol32(loc40,11)
              loc42=u32(loc42+loc41)
              loc42=u32(loc42 ^ u32(loc42<<6))
              loc42=u32(loc42+loc39)
              loc42=u32(loc42 ^ (loc42>>11))
              loc42=u32(loc42+loc40)
              loc42=u32(loc42 ^ u32(loc42<<1))
              loc42=u32(loc42+loc42)
              loc42=u32(((u32(fixed38<<16)+loc39) ^ loc39) - loc42)
              state=u32(state+loc42)
              dec=u32(state ^ enc)
              out[off:off+4]=dec.to_bytes(4,'little')

          dec=bytes(out[:len(cq_bytes)])
          (ev/'R142_CQBY_PROXY_MAP_DECRYPTED.bin').write_bytes(dec)
          if len(dec)%8: raise SystemExit('decrypted proxy map not 8-byte aligned')

          pairs=[]
          for off in range(0,len(dec),8):
              field_token, encoded_token=struct.unpack_from('<II',dec,off)
              callvirt=bool(encoded_token & 0x40000000)
              target_token=encoded_token & 0x3fffffff
              pairs.append({
                  'index':off//8,
                  'field_token':f'0x{field_token:08X}',
                  'encoded_target_token':f'0x{encoded_token:08X}',
                  'target_token':f'0x{target_token:08X}',
                  'callvirt_flag':callvirt,
                  'field_table':(field_token>>24)&0xff,
                  'field_rid':field_token&0x00ffffff,
                  'target_table':(target_token>>24)&0xff,
                  'target_rid':target_token&0x00ffffff,
              })

          usage={}
          for e in entries:
              usage[e['name']]={
                  'literal_reference_count_in_visible_il':len(re.findall(re.escape(e['name']),il)),
                  'payload_size':e['declared_length'],
                  'payload_sha256':e['payload_sha256'],
              }

          result={
              'managed_resource_blob_size':len(blob),
              'managed_resource_count':len(entries),
              'resources':entries,
              'resource_usage':usage,
              'cqby_resource_size':len(cq_bytes),
              'cqby_decrypted_sha256':hashlib.sha256(dec).hexdigest(),
              'proxy_pair_count':len(pairs),
              'proxy_pairs':pairs,
              'pst_static_initializer_count_visible_il':len(re.findall(r"\.cctor\$PST[0-9A-Fa-f]+",il)),
              'runtime_proxy_helper_call_count_visible_il':len(re.findall(r'::yvgj74JvmW\(',il)),
              'h15_resource_size':h15['declared_length'],
              'h15_literal_reference_count_visible_il':len(re.findall(re.escape(h15['name']),il)),
              'n9_method_present':'void N9jju8llVi ()' in il,
              'write_process_memory_string_present':'WriteProcessMemory' in il or ('Write ' in il and 'Process ' in il and 'Memory' in il),
              'prepare_method_present':'RuntimeHelpers::PrepareMethod' in il,
              'marshal_writeintptr_present':'Marshal::WriteIntPtr' in il,
              'process_base_address_present':'ProcessModule::get_BaseAddress' in il,
              'important_interpretation':'Cqby is a deterministic encrypted proxy-token map. h15 is a separate larger resource consumed by N9jju8llVi, whose visible IL contains runtime method preparation and memory-writing machinery. Numeric occurrences inside encrypted payloads are not VID/PID proof.'
          }
          (ev/'R142_RESOURCE_PROXY_MAP_STATIC_ANALYSIS.json').write_text(json.dumps(result,indent=2,ensure_ascii=False)+'\n')
          PY

      - name: Resolve proxy metadata tokens against official assembly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          import dnfile

          ev=Path('/tmp/r142/evidence')
          win=Path(Path('/tmp/r142/WINEXE_PATH').read_text().strip())
          d=json.loads((ev/'R142_RESOURCE_PROXY_MAP_STATIC_ANALYSIS.json').read_text())
          pe=dnfile.dnPE(str(win))

          def rows(name):
              try:
                  tab=getattr(pe.net.mdtables,name)
                  return tab.rows or []
              except Exception:
                  return []

          field_rows=rows('Field')
          method_rows=rows('MethodDef')
          member_rows=rows('MemberRef')
          methodspec_rows=rows('MethodSpec')

          def sval(x):
              try:
                  if x is None: return None
                  return str(x)
              except Exception:
                  return repr(x)

          def safe_row(rs,rid):
              return rs[rid-1] if 1 <= rid <= len(rs) else None

          def row_name(row):
              if row is None: return None
              return sval(getattr(row,'Name',None))

          resolved=[]
          interesting=[]
          sem_re=re.compile(r'hid|usb|vendor|product|vid|pid|read|write|feature|report|device|createfile|setoutput|getinput',re.I)

          for p in d['proxy_pairs']:
              ft=int(p['field_token'],16); tt=int(p['target_token'],16)
              frid=ft & 0x00ffffff
              trid=tt & 0x00ffffff
              ttab=(tt>>24)&0xff
              frow=safe_row(field_rows,frid)
              if ttab==0x06:
                  trow=safe_row(method_rows,trid); tkind='MethodDef'
              elif ttab==0x0A:
                  trow=safe_row(member_rows,trid); tkind='MemberRef'
              elif ttab==0x2B:
                  trow=safe_row(methodspec_rows,trid); tkind='MethodSpec'
              else:
                  trow=None; tkind=f'Table0x{ttab:02X}'
              rec={**p,
                   'field_name':row_name(frow),
                   'target_kind':tkind,
                   'target_name':row_name(trow),
                   'field_row_repr':repr(frow)[:1200] if frow is not None else None,
                   'target_row_repr':repr(trow)[:1600] if trow is not None else None}
              resolved.append(rec)
              hay=' '.join(x or '' for x in [rec['field_name'],rec['target_name'],rec['target_row_repr']])
              if sem_re.search(hay):
                  interesting.append(rec)

          # Visible HID/PID/VID-related field rows themselves.
          hid_fields=[]
          for i,row in enumerate(field_rows,1):
              nm=row_name(row) or ''
              rr=repr(row)
              if sem_re.search(nm+' '+rr):
                  hid_fields.append({'field_token':f'0x{0x04000000|i:08X}','name':nm,'repr':rr[:1600]})

          out={
              'field_row_count':len(field_rows),
              'methoddef_row_count':len(method_rows),
              'memberref_row_count':len(member_rows),
              'methodspec_row_count':len(methodspec_rows),
              'resolved_proxy_pair_count':len(resolved),
              'interesting_proxy_pair_count':len(interesting),
              'interesting_proxy_pairs':interesting,
              'hid_semantic_field_rows':hid_fields,
              'resolved_proxy_pairs':resolved,
          }
          (ev/'R142_PROXY_TOKEN_RESOLUTION.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          PY

      - name: Build fail-closed R142 decision and report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          ev=Path('/tmp/r142/evidence')
          a=json.loads((ev/'R142_RESOURCE_PROXY_MAP_STATIC_ANALYSIS.json').read_text())
          r=json.loads((ev/'R142_PROXY_TOKEN_RESOLUTION.json').read_text())

          pair_count=a['proxy_pair_count']
          pst=a['pst_static_initializer_count_visible_il']
          helper=a['runtime_proxy_helper_call_count_visible_il']
          proxy_map_proven=(pair_count==619 and pst==619 and helper>=619)
          patcher_supported=all([
              a['h15_literal_reference_count_visible_il']>0,
              a['n9_method_present'],
              a['write_process_memory_string_present'],
              a['prepare_method_present'],
              a['marshal_writeintptr_present'],
              a['process_base_address_present'],
          ])

          decision={
            'R141_FIXED_RUN_ID':35954842830,
            'R141_FIXED_JOB_ID':107490850984,
            'R141_FIXED_ARTIFACT_ID':10790122482,
            'R141_FIXED_ARTIFACT_DIGEST':'sha256:ea3a8180bef36c082a557b74b044636d6b0359a889f80f7274d8c0d662595cdb',
            'WINDOWS_EXE_SHA256':'3ca54171c53f7badd963ffe6851b8b3e2faf8aee8ba2afcb7040990e22ae09b2',
            'MANAGED_RESOURCE_COUNT':a['managed_resource_count'],
            'CQBY_RESOURCE_SIZE':a['cqby_resource_size'],
            'CQBY_PROXY_MAP_DECRYPTED_PAIR_COUNT':pair_count,
            'PST_STATIC_INITIALIZER_COUNT':pst,
            'RUNTIME_PROXY_HELPER_CALL_COUNT':helper,
            'CQBY_PROXY_TOKEN_MAP_STATICALLY_PROVEN':proxy_map_proven,
            'RESOLVED_PROXY_PAIR_COUNT':r['resolved_proxy_pair_count'],
            'INTERESTING_HID_USB_PROXY_PAIR_COUNT':r['interesting_proxy_pair_count'],
            'H15_PATCH_RESOURCE_SIZE':a['h15_resource_size'],
            'H15_REFERENCED_BY_VISIBLE_IL_COUNT':a['h15_literal_reference_count_visible_il'],
            'N9_RUNTIME_METHOD_PATCHER_STATICALLY_SUPPORTED':patcher_supported,
            'IMPORTANT_INTERPRETATION':'The Cqby resource is now recoverable as a 619-entry metadata proxy map and matches the 619 visible PST/proxy helper initializers. The separate h15 resource is associated with runtime method patching. This does not yet reconstruct protected HID method bodies or prove the production VID/PID route.',
            'PRODUCTION_VIDPID_RECOVERED_FROM_PROTECTED_METHOD_BODIES':False,
            'OFFICIAL_WINDOWS_PRODUCTION_USBHID_LINKAGE_STATICALLY_PROVEN':False,
            'READ_ONLY_IDENTIFY_PATH_STATICALLY_PROVEN_FOR_PRODUCTION':False,
            'SAFE_READ_ONLY_STOCK_BACKUP_PROVEN':False,
            'PRODUCTION_BOOTSTRAP_BRIDGE_PROVEN':False,
            'PRODUCTION_RECOVERY_USB_IDENTITY_PROVEN':False,
            'ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD':False,
            'AA55_LIVE_RETEST_ALLOWED':False,
            'RUNTIME_0X11_ALLOWED':False,
            'RUNTIME_0XFE_ALLOWED':False,
            'VENDOR_BINARY_EXECUTED':False,
            'USB_DEVICE_ACCESSED':False,
            'BOARD_CONTACTED':False,
            'FLASH_ALLOWED':False,
            'NEXT':('Deep-static reconstruct the h15/N9 runtime method-patch stream: identify its crypto/key derivation, record format, method/RVA destinations, and recover only HID/USB-related protected method bodies offline. Do not execute vendor code or transmit USB.' if patcher_supported else 'Pivot to Android native/static transport evidence; keep all live traffic blocked.')
          }
          (ev/'R142_DECISION.json').write_text(json.dumps(decision,indent=2,ensure_ascii=False)+'\n')
          (ev/'R142_REPORT_TH.md').write_text(
            '# R142 official Windows proxy-map + patch-resource static reverse\n\n'
            f'- managed resources: {decision["MANAGED_RESOURCE_COUNT"]}\n'
            f'- Cqby size: {decision["CQBY_RESOURCE_SIZE"]} bytes\n'
            f'- decrypted proxy pairs: {pair_count}\n'
            f'- PST initializers / helper calls: {pst} / {helper}\n'
            f'- proxy map proven: {proxy_map_proven}\n'
            f'- resolved proxy pairs: {decision["RESOLVED_PROXY_PAIR_COUNT"]}\n'
            f'- HID/USB-semantic proxy pairs: {decision["INTERESTING_HID_USB_PROXY_PAIR_COUNT"]}\n'
            f'- h15 patch resource size: {decision["H15_PATCH_RESOURCE_SIZE"]} bytes\n'
            f'- N9 runtime patcher supported: {patcher_supported}\n\n'
            'FLASH_ALLOWED=NO\n')
          print(json.dumps(decision,indent=2,ensure_ascii=False))
          PY

      - name: Package R142 evidence
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/r142/resources /tmp/r142/evidence/R142_EXTRACTED_MANAGED_RESOURCES
          cd /tmp/r142/evidence
          zip -9 -r /tmp/R142_EXACT_OFFICIAL_WINDOWS_PROXY_MAP_PATCH_RESOURCE_STATIC_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/R142_EXACT_OFFICIAL_WINDOWS_PROXY_MAP_PATCH_RESOURCE_STATIC_EVIDENCE.zip > /tmp/R142_EXACT_OFFICIAL_WINDOWS_PROXY_MAP_PATCH_RESOURCE_STATIC_EVIDENCE.zip.sha256

      - name: Upload R142 evidence
        uses: actions/upload-artifact@v4
        with:
          name: R142-EXACT-OFFICIAL-WINDOWS-PROXY-MAP-PATCH-RESOURCE-STATIC-EVIDENCE
          path: |
            /tmp/R142_EXACT_OFFICIAL_WINDOWS_PROXY_MAP_PATCH_RESOURCE_STATIC_EVIDENCE.zip
            /tmp/R142_EXACT_OFFICIAL_WINDOWS_PROXY_MAP_PATCH_RESOURCE_STATIC_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'R142_VENDOR_BINARY_EXECUTED=NO' /tmp/r142/evidence/R142_SAFETY.txt
          grep -F 'R142_WINDOWS_EXE_EXECUTED=NO' /tmp/r142/evidence/R142_SAFETY.txt
          grep -F 'R142_USB_DEVICE_ACCESS=NO' /tmp/r142/evidence/R142_SAFETY.txt
          grep -F 'R142_BOARD_CONTACT=NO' /tmp/r142/evidence/R142_SAFETY.txt
          grep -F 'R142_AA55_SENT=NO' /tmp/r142/evidence/R142_SAFETY.txt
          grep -F 'R142_RUNTIME_0X11_SENT=NO' /tmp/r142/evidence/R142_SAFETY.txt
          grep -F 'R142_RUNTIME_0XFE_SENT=NO' /tmp/r142/evidence/R142_SAFETY.txt
          grep -F '"FLASH_ALLOWED": false' /tmp/r142/evidence/R142_DECISION.json
