name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build OKN DSP Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find latest DSP ZIP
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SEARCHING DSP ZIP"
          echo "========================================"

          ZIP_FILE="$(
            find . \
              -type f \
              -name 'OKN_DSP_ANDROID_V*.zip' \
              -printf '%f\n' |
            sort -V |
            tail -n 1
          )"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No OKN_DSP_ANDROID_V*.zip found."
            exit 1
          fi

          APP_VERSION="${ZIP_FILE#OKN_DSP_ANDROID_}"
          APP_VERSION="${APP_VERSION%.zip}"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          echo ""
          echo "SELECTED ZIP  : $ZIP_FILE"
          echo "SELECTED VERSION: $APP_VERSION"
          echo ""

      - name: Extract DSP ZIP
        shell: bash
        run: |
          set -e

          rm -rf android_project
          mkdir -p android_project

          echo "Extracting $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d android_project

          echo ""
          echo "Project files:"
          find android_project -maxdepth 3 -type f | sort

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          if [ ! -f "android_project/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts not found at ZIP root."
            exit 1
          fi

          if [ ! -d "android_project/app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          echo "Android project structure OK."

      - name: Verify V number
        shell: bash
        run: |
          echo "========================================"
          echo "OKN DSP BUILD VERSION"
          echo "========================================"
          echo "ZIP     : $ZIP_FILE"
          echo "VERSION : $APP_VERSION"
          echo "========================================"

          echo ""
          echo "Gradle:"
          grep -R \
            "versionCode\|versionName" \
            android_project/app/build.gradle.kts \
            || true

          echo ""
          echo "Packet Logger:"
          grep -R \
            "V[0-9][0-9]* PACKET LOGGER\|V[0-9][0-9]* PACKET" \
            android_project/app/src/main/java \
            || true

      - name: Build APK
        shell: bash
        run: |
          set -e

          echo "BUILDING $APP_VERSION"

          gradle \
            -p android_project \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK_PATH="android_project/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          echo "========================================"
          echo "APK BUILD SUCCESS"
          echo "========================================"
          ls -lh "$APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-${{ env.APP_VERSION }}-debug-apk
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
