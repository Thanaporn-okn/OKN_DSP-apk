name: Build OKN DSP V7 Reference UI Compile Fix

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_ANDROID_V7_REFERENCE_UI_COMPILE_FIX.zip'
      - 'OKN_DSP_V7_SHA256.txt'
      - '.github/workflows/build-okn-dsp-v7.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and unpack V7 source
        shell: bash
        run: |
          set -euo pipefail
          echo 'b6f86217da6810c4aa0c4896e0c726b8ba3bf5bfbd96bbf02bfa23ae21aa494b  OKN_DSP_ANDROID_V7_REFERENCE_UI_COMPILE_FIX.zip' | sha256sum -c -
          unzip -tq OKN_DSP_ANDROID_V7_REFERENCE_UI_COMPILE_FIX.zip
          rm -rf /tmp/okn_dsp_v7
          mkdir -p /tmp/okn_dsp_v7
          unzip -q OKN_DSP_ANDROID_V7_REFERENCE_UI_COMPILE_FIX.zip -d /tmp/okn_dsp_v7
          test -f /tmp/okn_dsp_v7/preflight_v7.py
          test -f /tmp/okn_dsp_v7/app/src/main/res/drawable-nodpi/ui_home_reference.jpg
          test -f /tmp/okn_dsp_v7/app/src/main/res/drawable-nodpi/ui_eq_reference.jpg

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run V7 preflight and verify stable signing identity
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/okn_dsp_v7
          python3 preflight_v7.py
          echo 'ba1c52f2607c09953c52fdd79c5f72026aaf0adb8aa44bcba277f7d9b49d9511  app/okn_dsp_stable_debug.keystore' | sha256sum -c -
          CERT=$(keytool -list -v -keystore app/okn_dsp_stable_debug.keystore -storepass android -alias androiddebugkey | awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr 'A-F' 'a-f')
          test "$CERT" = 'c3da85af2e978dbd0ed9bb695e5c79a263189595c116ad93a1ded75a2eb98397'
          echo "Stable debug signing certificate SHA-256: $CERT"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build stable-signed V7 APK
        working-directory: /tmp/okn_dsp_v7
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK identity and signer
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn_dsp_v7/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          SIGNER=$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' | tr 'A-F' 'a-f')
          test "$SIGNER" = 'c3da85af2e978dbd0ed9bb695e5c79a263189595c116ad93a1ded75a2eb98397'
          echo "APK signer certificate SHA-256: $SIGNER"
          mkdir -p /tmp/out
          cp "$APK" /tmp/out/OKN_DSP_V7_REFERENCE_UI_COMPILE_FIX-debug.apk
          sha256sum /tmp/out/OKN_DSP_V7_REFERENCE_UI_COMPILE_FIX-debug.apk | tee /tmp/out/OKN_DSP_V7_APK_SHA256.txt

      - name: Upload installable V7 APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-V7-REFERENCE-UI-COMPILE-FIX-APK
          path: /tmp/out/*
          if-no-files-found: error
          retention-days: 30
