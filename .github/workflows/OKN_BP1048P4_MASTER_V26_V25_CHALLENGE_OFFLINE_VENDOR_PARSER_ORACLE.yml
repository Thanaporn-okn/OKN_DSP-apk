name: OKN BP1048P4 MASTER V26 V25 CHALLENGE OFFLINE VENDOR PARSER ORACLE

"on":
  workflow_dispatch:

permissions:
  contents: read

env:
  GOLOPINE_WINDOWS_URL: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-08.exe_.zip"
  EXPECTED_VENDOR_SHA256: "3CA54171C53F7BADD963FFE6851B8B3E2FAF8AEE8BA2AFCB7040990E22AE09B2"

  V17_CHALLENGE_HEX: "D024E38C410000004202B94C65A23F2C640C8F60E133784C7E47463A7A521056"
  V25_CHALLENGE_HEX: "D024E38C410000004202B94C65A23F2CD2828A4EEEC40C46C317060DDBB49C39"

  LIVE_DSP_CONNECTED: "NO"
  USB_TARGET_ACCESS: "NO"
  HOST_TO_DSP_IO: "NO"
  REAL_HID_OBJECT_ALLOWED: "NO"
  REAL_HID_CONNECT_ALLOWED: "NO"
  REAL_HID_SEND_ALLOWED: "NO"
  REAL_HID_READ_ALLOWED: "NO"
  REAL_HID_WRITE_ALLOWED: "NO"
  FEATURE_REPORT_ALLOWED: "NO"
  FLASH_ALLOWED: "NO"
  ERASE_ALLOWED: "NO"
  WRITE_ALLOWED: "NO"

jobs:
  master-v26:
    name: Feed real V25 challenge into untouched GoloPine parser OFFLINE
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Safety gate and workspace
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"

          foreach($n in @(
            "LIVE_DSP_CONNECTED","USB_TARGET_ACCESS","HOST_TO_DSP_IO",
            "REAL_HID_OBJECT_ALLOWED","REAL_HID_CONNECT_ALLOWED",
            "REAL_HID_SEND_ALLOWED","REAL_HID_READ_ALLOWED","REAL_HID_WRITE_ALLOWED",
            "FEATURE_REPORT_ALLOWED","FLASH_ALLOWED","ERASE_ALLOWED","WRITE_ALLOWED"
          )){
            if((Get-Item "Env:$n").Value -ne "NO"){ throw "$n must be NO" }
          }

          if($env:V25_CHALLENGE_HEX.Length -ne 64){ throw "V25 challenge must be 32 bytes" }
          if($env:V25_CHALLENGE_HEX -eq $env:V17_CHALLENGE_HEX){ throw "V25 must differ from V17" }

          $root="C:\okn_v26"
          if(Test-Path $root){ Remove-Item -Recurse -Force $root }
          New-Item -ItemType Directory -Force -Path `
            "$root\download","$root\pkg","$root\harness","$root\evidence","$root\out" | Out-Null

          @"
          REVISION=MASTER-V26
          MODE=OFFLINE_VENDOR_PARSER_ORACLE_FOR_REAL_V25_CHALLENGE
          V17_CHALLENGE_HEX=$env:V17_CHALLENGE_HEX
          V25_CHALLENGE_HEX=$env:V25_CHALLENGE_HEX
          V25_DIFFERS_FROM_V17=true
          REAL_HID_IO=NO
          HOST_TO_DSP_IO=NO
          FEATURE_REPORT=NO
          FLASH_ALLOWED=NO
          ERASE_ALLOWED=NO
          WRITE_ALLOWED=NO
          "@ | Set-Content "$root\evidence\00_SAFETY_AND_INPUT.txt"

      - name: Acquire exact official vendor binary
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v26"

          curl.exe -fL --retry 6 --retry-all-errors --retry-delay 2 `
            --connect-timeout 20 --max-time 300 `
            $env:GOLOPINE_WINDOWS_URL -o "$root\download\vendor.zip"
          if($LASTEXITCODE -ne 0){ throw "vendor download failed" }

          Expand-Archive -Force "$root\download\vendor.zip" "$root\pkg"

          $exe=Get-ChildItem "$root\pkg" -Recurse -File -Filter *.exe |
            Where-Object {$_.FullName -notmatch '\\__MACOSX\\' -and $_.Name -notlike '._*'} |
            Sort-Object Length -Descending | Select-Object -First 1

          if(-not $exe){ throw "vendor EXE missing" }
          Copy-Item $exe.FullName "$root\vendor.exe" -Force

          $sha=(Get-FileHash "$root\vendor.exe" -Algorithm SHA256).Hash.ToUpperInvariant()
          if($sha -ne $env:EXPECTED_VENDOR_SHA256){
            throw "official vendor EXE SHA changed: $sha"
          }

          @"
          SHA256=$sha
          BYTES=$((Get-Item "$root\vendor.exe").Length)
          ORIGINAL_BINARY_MODIFIED=NO
          "@ | Set-Content "$root\evidence\01_VENDOR_IDENTITY.txt"

      - name: Build x86 fake stream parser oracle
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v26"

          @'
          using System;
          using System.IO;
          using System.Linq;
          using System.Reflection;
          using System.Reflection.Emit;
          using System.Runtime.CompilerServices;
          using System.Collections.Generic;
          using System.Threading;

          public static class CaptureSink
          {
              public static readonly List<byte[]> Writes=new List<byte[]>();

              public static void Clear()
              {
                  lock(Writes){ Writes.Clear(); }
              }

              public static void Record(byte[] b)
              {
                  lock(Writes)
                  {
                      Writes.Add(b==null?null:(byte[])b.Clone());
                  }
              }

              public static byte[][] Snapshot()
              {
                  lock(Writes)
                  {
                      return Writes.Select(x=>x==null?null:(byte[])x.Clone()).ToArray();
                  }
              }
          }

          public static class Probe
          {
              static string OutPath;

              static void Log(string s)
              {
                  File.AppendAllText(OutPath,s+Environment.NewLine);
              }

              static string Hex(byte[] b)
              {
                  if(b==null)return "<NULL>";
                  return BitConverter.ToString(b).Replace("-","");
              }

              static byte[] HexToBytes(string s)
              {
                  byte[] b=new byte[s.Length/2];
                  for(int i=0;i<b.Length;i++)
                      b[i]=Convert.ToByte(s.Substring(i*2,2),16);
                  return b;
              }

              static object InvokeBounded(
                  MethodInfo m,object target,object[] args,
                  int timeoutMs,string label)
              {
                  object result=null;
                  Exception error=null;

                  Thread th=new Thread(delegate(){
                      try{ result=m.Invoke(target,args); }
                      catch(Exception ex){ error=ex; }
                  });

                  th.IsBackground=true;
                  th.Start();

                  if(!th.Join(timeoutMs))
                  {
                      Log(label+"_TIMEOUT_MS="+timeoutMs);
                      try{ th.Abort(); }catch{}
                      return null;
                  }

                  if(error!=null)throw error;
                  return result;
              }

              static void EmitDefaultReturn(ILGenerator il,Type ret)
              {
                  if(ret==typeof(void)){ il.Emit(OpCodes.Ret); return; }

                  if(ret.IsValueType)
                  {
                      LocalBuilder loc=il.DeclareLocal(ret);
                      il.Emit(OpCodes.Ldloca_S,loc);
                      il.Emit(OpCodes.Initobj,ret);
                      il.Emit(OpCodes.Ldloc,loc);
                      il.Emit(OpCodes.Ret);
                      return;
                  }

                  il.Emit(OpCodes.Ldnull);
                  il.Emit(OpCodes.Ret);
              }

              static MethodAttributes Visibility(MethodInfo m)
              {
                  MethodAttributes a=MethodAttributes.Virtual|MethodAttributes.HideBySig;

                  if(m.IsPublic)a|=MethodAttributes.Public;
                  else if(m.IsFamily)a|=MethodAttributes.Family;
                  else if(m.IsFamilyOrAssembly)a|=MethodAttributes.FamORAssem;
                  else if(m.IsAssembly)a|=MethodAttributes.Assembly;
                  else a|=MethodAttributes.Private;

                  if(m.IsSpecialName)a|=MethodAttributes.SpecialName;
                  return a;
              }

              static Type BuildCaptureStream(Type baseType)
              {
                  AssemblyName an=new AssemblyName("OKN_V26_CAPTURE_STREAM");
                  AssemblyBuilder ab=AppDomain.CurrentDomain.DefineDynamicAssembly(
                      an,AssemblyBuilderAccess.Run);

                  ModuleBuilder mb=ab.DefineDynamicModule("main");

                  TypeBuilder tb=mb.DefineType(
                      "OKN.CaptureDeviceCommunicationStream",
                      TypeAttributes.Public|TypeAttributes.Class,
                      baseType);

                  ConstructorInfo bc=baseType.GetConstructor(
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance,
                      null,Type.EmptyTypes,null);

                  if(bc==null)
                      throw new Exception("DeviceCommunicationStream parameterless ctor missing");

                  ConstructorBuilder cb=tb.DefineConstructor(
                      MethodAttributes.Public,CallingConventions.Standard,Type.EmptyTypes);

                  ILGenerator ci=cb.GetILGenerator();
                  ci.Emit(OpCodes.Ldarg_0);
                  ci.Emit(OpCodes.Call,bc);
                  ci.Emit(OpCodes.Ret);

                  MethodInfo[] all=baseType.GetMethods(
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance);

                  MethodInfo[] selected=all.Where(m =>
                      m.IsVirtual && !m.IsFinal &&
                      (m.IsAbstract ||
                       m.Name=="Write" || m.Name=="WriteLine" ||
                       m.Name=="ReadBytes" || m.Name=="ReadLine" ||
                       m.Name=="Connect" || m.Name=="Disconnect")
                  ).GroupBy(m=>m.ToString()).Select(g=>g.First()).ToArray();

                  foreach(MethodInfo m in selected)
                  {
                      Type[] ps=m.GetParameters().Select(x=>x.ParameterType).ToArray();

                      MethodBuilder b=tb.DefineMethod(
                          m.Name,Visibility(m),m.ReturnType,ps);

                      ILGenerator il=b.GetILGenerator();

                      if(m.Name=="Write" && ps.Length==1 && ps[0]==typeof(byte[]))
                      {
                          il.Emit(OpCodes.Ldarg_1);
                          il.Emit(OpCodes.Call,
                              typeof(CaptureSink).GetMethod(
                                  "Record",BindingFlags.Public|BindingFlags.Static));

                          EmitDefaultReturn(il,m.ReturnType);
                      }
                      else
                      {
                          EmitDefaultReturn(il,m.ReturnType);
                      }

                      tb.DefineMethodOverride(b,m);
                  }

                  return tb.CreateType();
              }

              static void SetConnected(object stream,Type baseType)
              {
                  Type et=baseType.GetNestedType(
                      "ConnectionStatus",
                      BindingFlags.Public|BindingFlags.NonPublic);

                  if(et==null || !et.IsEnum)
                      throw new Exception("ConnectionStatus enum missing");

                  object connected=Enum.Parse(et,"Connected");

                  FieldInfo f=baseType.GetFields(
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance
                  ).FirstOrDefault(x=>x.FieldType==et);

                  if(f!=null)
                  {
                      f.SetValue(stream,connected);
                      return;
                  }

                  MethodInfo up=baseType.GetMethod(
                      "UpdateDeviceConnStatus",
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance);

                  if(up==null)
                      throw new Exception("cannot force fake stream connected state");

                  up.Invoke(stream,new object[]{connected});
              }

              static string ReadStatus(object bridge,Type bridgeType)
              {
                  PropertyInfo p=bridgeType.GetProperty(
                      "StreamStatus",
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance);

                  if(p!=null)
                  {
                      try{
                          object v=p.GetValue(bridge,null);
                          if(v!=null)return v.ToString();
                      }catch{}
                  }

                  foreach(FieldInfo f in bridgeType.GetFields(
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance))
                  {
                      if(f.FieldType.IsEnum &&
                         f.FieldType.Name.IndexOf("UFEStreamStatus",
                             StringComparison.OrdinalIgnoreCase)>=0)
                      {
                          object v=f.GetValue(bridge);
                          if(v!=null)return v.ToString();
                      }
                  }

                  return "<UNKNOWN>";
              }

              public static void Main(string[] args)
              {
                  if(args.Length<3)
                      throw new Exception("args: vendor.exe evidence.txt challengeHex");

                  string exe=Path.GetFullPath(args[0]);
                  OutPath=Path.GetFullPath(args[1]);
                  byte[] challenge=HexToBytes(args[2]);

                  File.WriteAllText(OutPath,"");
                  Directory.SetCurrentDirectory(Path.GetDirectoryName(exe));

                  Log("MODE=OFFLINE_VENDOR_PARSER_ORACLE_FOR_REAL_V25_CHALLENGE");
                  Log("REAL_HID_OBJECT_CREATED=NO");
                  Log("REAL_HID_CONNECT_INVOKED=NO");
                  Log("REAL_HID_SEND_INVOKED=NO");
                  Log("REAL_HID_READ_INVOKED=NO");
                  Log("REAL_HID_WRITE_INVOKED=NO");
                  Log("HOST_TO_DSP_IO=NO");
                  Log("FEATURE_REPORT_INVOKED=NO");
                  Log("FLASH_ALLOWED=NO");
                  Log("INPUT_LEN="+challenge.Length);
                  Log("INPUT_HEX="+Hex(challenge));

                  Assembly asm=Assembly.LoadFile(exe);
                  RuntimeHelpers.RunModuleConstructor(asm.ManifestModule.ModuleHandle);

                  Type baseType=asm.GetType(
                      "DSTech_AudioDSP_Client.DeviceCommunicationStream",true);

                  Type bridgeType=asm.GetType(
                      "DSTech_AudioDSP_Client.UFEcommandBridge",true);

                  Type captureType=BuildCaptureStream(baseType);

                  object stream=Activator.CreateInstance(captureType);
                  SetConnected(stream,baseType);

                  ConstructorInfo bc=bridgeType.GetConstructor(new[]{baseType});
                  if(bc==null)throw new Exception("UFEcommandBridge ctor missing");

                  object bridge=bc.Invoke(new[]{stream});

                  MethodInfo req=bridgeType.GetMethod(
                      "SendDevTypeSwVersAuthenRequest",
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance);

                  if(req==null)throw new Exception("startup helper missing");

                  CaptureSink.Clear();
                  InvokeBounded(req,bridge,null,1500,"STARTUP_HELPER");
                  Thread.Sleep(100);

                  byte[][] startup=CaptureSink.Snapshot();
                  Log("STARTUP_WRITE_COUNT="+startup.Length);
                  for(int i=0;i<startup.Length;i++)
                      Log("STARTUP_WRITE_"+i+"="+Hex(startup[i]));

                  CaptureSink.Clear();

                  MethodInfo fbl=bridgeType.GetMethod(
                      "FBL3HEmTva",
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance);

                  if(fbl==null)throw new Exception("FBL3HEmTva missing");

                  try
                  {
                      InvokeBounded(
                          fbl,bridge,new object[]{stream,challenge,EventArgs.Empty},
                          3000,"FBL");

                      Log("FBL_INVOKE=RETURNED");
                  }
                  catch(Exception ex)
                  {
                      Exception b=ex.GetBaseException();
                      Log("FBL_EXCEPTION="+b.GetType().FullName+":"+b.Message);
                  }

                  Thread.Sleep(250);

                  byte[][] writes=CaptureSink.Snapshot();

                  Log("FOLLOWUP_WRITE_COUNT="+writes.Length);
                  for(int i=0;i<writes.Length;i++)
                      Log("FOLLOWUP_WRITE_"+i+"="+Hex(writes[i]));

                  string status=ReadStatus(bridge,bridgeType);
                  Log("POST_AUTH_STREAM_STATUS="+status);

                  bool valid=
                      writes.Length>0 &&
                      writes[0]!=null &&
                      writes[0].Length==4 &&
                      status=="UFE_STREAM_GETTING_DEVICE_DESCRIPTION";

                  Log("V25_VENDOR_ORACLE_VALID="+valid);

                  if(writes.Length>0 && writes[0]!=null && writes[0].Length==4)
                      Log("V25_AUTH_REPLY_HEX="+Hex(writes[0]));

                  Log("PROBE_COMPLETE=true");

                  Environment.Exit(valid?0:2);
              }
          }
          '@ | Set-Content "$root\harness\Probe.cs"

          $csc="$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          if(-not(Test-Path $csc)){ throw "x86 csc missing" }

          & $csc /nologo /platform:x86 /target:exe `
            /out:"$root\harness\Probe.exe" `
            "$root\harness\Probe.cs"

          if($LASTEXITCODE -ne 0){ throw "Probe compile failed" }

      - name: Static safety audit
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v26"
          $s=Get-Content "$root\harness\Probe.cs" -Raw

          foreach($bad in @(
            "HidD_SetOutputReport(","HidD_GetInputReport(",
            "HidD_SetFeature(","HidD_GetFeature(",
            "ReadFile(","WriteFile(","CreateFileW("
          )){
            if($s.Contains($bad)){ throw "forbidden real HID primitive: $bad" }
          }

          foreach($need in @(
            "BuildCaptureStream",
            "SendDevTypeSwVersAuthenRequest",
            "FBL3HEmTva",
            "V25_VENDOR_ORACLE_VALID=",
            "REAL_HID_OBJECT_CREATED=NO",
            "HOST_TO_DSP_IO=NO",
            "FLASH_ALLOWED=NO"
          )){
            if(-not $s.Contains($need)){ throw "missing required marker: $need" }
          }

          "STATIC_SAFETY_AUDIT=PASS" |
            Set-Content "$root\evidence\02_STATIC_SAFETY_AUDIT.txt"

      - name: Run real V25 challenge through vendor parser offline
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v26"

          & "$root\harness\Probe.exe" `
            "$root\vendor.exe" `
            "$root\evidence\03_V26_VENDOR_ORACLE.txt" `
            "$env:V25_CHALLENGE_HEX"

          $exit=$LASTEXITCODE

          Get-Content "$root\evidence\03_V26_VENDOR_ORACLE.txt"

          if($exit -ne 0){ throw "V25 vendor parser oracle rejected challenge, exit=$exit" }

          $ev=Get-Content "$root\evidence\03_V26_VENDOR_ORACLE.txt" -Raw

          if($ev -notmatch 'V25_VENDOR_ORACLE_VALID=True'){
            throw "vendor oracle did not reach GET DEVICE DESCRIPTION"
          }

          if($ev -notmatch 'V25_AUTH_REPLY_HEX=[0-9A-F]{8}'){
            throw "4-byte V25 auth reply not captured"
          }

      - name: Derive V26 decision
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v26"

          $ev=Get-Content "$root\evidence\03_V26_VENDOR_ORACLE.txt" -Raw

          $reply=[regex]::Match($ev,'V25_AUTH_REPLY_HEX=([0-9A-F]{8})').Groups[1].Value
          $status=[regex]::Match($ev,'POST_AUTH_STREAM_STATUS=([A-Z0-9_<>]+)').Groups[1].Value

          if(-not $reply){ throw "missing auth reply" }
          if($status -ne "UFE_STREAM_GETTING_DEVICE_DESCRIPTION"){
            throw "unexpected parser state: $status"
          }

          @"
          # MASTER V26 FINAL DECISION

          - Input source: real V25 Samsung S25+ cross-session challenge
          - V25 challenge: **$env:V25_CHALLENGE_HEX**
          - Prior V17 challenge: **$env:V17_CHALLENGE_HEX**
          - Challenges differ: **YES**
          - Official vendor parser generated 4-byte auth reply: **$reply**
          - Parser post-auth state: **$status**
          - Real HID invoked: **NO**
          - Host-to-DSP I/O: **NO**
          - Feature report invoked: **NO**
          - Flash / erase / firmware write: **NO / NO / NO**

          This proves the untouched official GoloPine parser can compute a reply for
          the newly captured cross-session challenge offline. It does NOT authorize
          replaying that reply in a later session, because V25 already proved that
          the challenge changes across sessions.

          Next gate:
          build a same-session S25+ capture-and-hold diagnostic in which the USB
          session remains open while a challenge-specific reply is supplied.
          No firmware flash until backup/layout/rollback are independently proven.

          Classification: **V25_DYNAMIC_CHALLENGE_VENDOR_ORACLE_PROVEN_NOT_FOR_FLASH**
          "@ | Set-Content "$root\evidence\04_V26_FINAL_DECISION.md"

          Get-Content "$root\evidence\04_V26_FINAL_DECISION.md" >> $env:GITHUB_STEP_SUMMARY

      - name: Package evidence
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v26"

          Copy-Item "$root\evidence\*" "$root\out\" -Force

          foreach($bad in @("vendor.exe","Probe.exe")){
            if(Test-Path "$root\out\$bad"){ throw "binary leak: $bad" }
          }

          Get-ChildItem "$root\out" -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content "$root\out\SHA256SUMS.txt"

      - name: Upload V26 evidence
        uses: actions/upload-artifact@v7
        with:
          name: OKN-BP1048P4-MASTER-V26-V25-CHALLENGE-VENDOR-ORACLE-EVIDENCE
          path: C:\okn_v26\out\*
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed assertion
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v26"

          foreach($n in @(
            "LIVE_DSP_CONNECTED","USB_TARGET_ACCESS","HOST_TO_DSP_IO",
            "REAL_HID_OBJECT_ALLOWED","REAL_HID_CONNECT_ALLOWED",
            "REAL_HID_SEND_ALLOWED","REAL_HID_READ_ALLOWED","REAL_HID_WRITE_ALLOWED",
            "FEATURE_REPORT_ALLOWED","FLASH_ALLOWED","ERASE_ALLOWED","WRITE_ALLOWED"
          )){
            if((Get-Item "Env:$n").Value -ne "NO"){ throw "$n changed" }
          }

          $ev=Get-Content "$root\evidence\03_V26_VENDOR_ORACLE.txt" -Raw

          if($ev -notmatch 'REAL_HID_OBJECT_CREATED=NO'){ throw "bad HID state" }
          if($ev -notmatch 'HOST_TO_DSP_IO=NO'){ throw "bad host-to-DSP state" }
          if($ev -notmatch 'FEATURE_REPORT_INVOKED=NO'){ throw "bad feature state" }
          if($ev -notmatch 'FLASH_ALLOWED=NO'){ throw "bad flash state" }
          if($ev -notmatch 'V25_VENDOR_ORACLE_VALID=True'){ throw "oracle not valid" }

          "MASTER_V26=PASS"
          "REAL_HID_IO=NO"
          "HOST_TO_DSP_IO=NO"
          "FEATURE_REPORT=NO"
          "FLASH_ALLOWED=NO"
