name: OKN DSP Android AutoBuild

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

concurrency:
  group: okn-dsp-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      # ใช้เฉพาะเมื่อ project ยังไม่มี Gradle Wrapper
      FALLBACK_GRADLE_VERSION: '8.9'

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          # แบบที่ 1: แตก source ไว้ที่ root ของ repo แล้ว
          if [[ -f "settings.gradle" || -f "settings.gradle.kts" ]]; then
            if [[ -f "app/build.gradle" || -f "app/build.gradle.kts" ]]; then
              PROJECT_DIR="$GITHUB_WORKSPACE"
            fi
          fi

          # แบบที่ 2: มีโฟลเดอร์ OKN_DSP_Vxx อยู่ใน repo
          if [[ -z "$PROJECT_DIR" ]]; then
            CANDIDATE="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -printf '%h\n' | while read -r d; do
                if [[ -f "$d/app/build.gradle" || -f "$d/app/build.gradle.kts" ]]; then
                  printf '%s\n' "$d"
                fi
              done | head -n 1)"
            if [[ -n "$CANDIDATE" ]]; then
              PROJECT_DIR="$CANDIDATE"
            fi
          fi

          # แบบที่ 3: repo มี Source.zip อย่างเดียว ให้แตกอัตโนมัติ
          if [[ -z "$PROJECT_DIR" ]]; then
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f \
              \( -iname '*DSP*Source*.zip' -o -iname '*Source.zip' \) \
              -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"

            if [[ -n "$ZIP_FILE" ]]; then
              echo "Extracting: $ZIP_FILE"
              rm -rf "$RUNNER_TEMP/okn_source"
              mkdir -p "$RUNNER_TEMP/okn_source"
              unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/okn_source"

              PROJECT_DIR="$(find "$RUNNER_TEMP/okn_source" -maxdepth 4 -type f \
                \( -name settings.gradle -o -name settings.gradle.kts \) \
                -printf '%h\n' | while read -r d; do
                  if [[ -f "$d/app/build.gradle" || -f "$d/app/build.gradle.kts" ]]; then
                    printf '%s\n' "$d"
                  fi
                done | head -n 1)"
            fi
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "ERROR: Android project not found." >&2
            echo "Expected settings.gradle(.kts) + app/build.gradle(.kts), or an OKN DSP Source.zip" >&2
            exit 2
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Detect compileSdk
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE=""
          if [[ -f "$PROJECT_DIR/app/build.gradle" ]]; then
            BUILD_FILE="$PROJECT_DIR/app/build.gradle"
          elif [[ -f "$PROJECT_DIR/app/build.gradle.kts" ]]; then
            BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"
          fi

          COMPILE_SDK="$(python3 - "$BUILD_FILE" <<'PY'
          import re, sys
          p = sys.argv[1]
          text = open(p, encoding='utf-8').read()
          patterns = [
              r'\bcompileSdk\s*=\s*["\']?(\d+)',
              r'\bcompileSdk\s+["\']?(\d+)',
              r'\bcompileSdkVersion\s*[=( ]\s*["\']?(\d+)',
          ]
          for pat in patterns:
              m = re.search(pat, text)
              if m:
                  print(m.group(1))
                  raise SystemExit(0)
          raise SystemExit(1)
          PY
          )"

          if [[ -z "$COMPILE_SDK" ]]; then
            echo "ERROR: Cannot detect compileSdk from $BUILD_FILE" >&2
            exit 3
          fi

          echo "COMPILE_SDK=$COMPILE_SDK" >> "$GITHUB_ENV"
          echo "compileSdk = $COMPILE_SDK"

      # สำคัญ: ไม่ใช้ android-actions/setup-android@v3
      # เพราะ action รุ่นนั้นเรียก package เก่า 'tools' ซึ่ง sdkmanager รุ่นใหม่ไม่มีแล้ว
      - name: Prepare Android SDK only if needed
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$SDK_ROOT" ]]; then
            echo "ERROR: Android SDK root not found: $SDK_ROOT" >&2
            exit 4
          fi

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          PLATFORM_DIR="$SDK_ROOT/platforms/android-$COMPILE_SDK"
          REQUIRED_BUILD_TOOLS="${COMPILE_SDK}.0.0"
          BUILD_TOOLS_DIR="$SDK_ROOT/build-tools/$REQUIRED_BUILD_TOOLS"

          if [[ -d "$PLATFORM_DIR" && -d "$BUILD_TOOLS_DIR" ]]; then
            echo "Android SDK $COMPILE_SDK already installed. Skip sdkmanager."
            exit 0
          fi

          # เลือก sdkmanager ที่มีอยู่ใน runner โดยไม่ดาวน์โหลด cmdline-tools ซ้ำ
          SDKMANAGER=""
          NUMERIC_SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null \
            | grep -E '/cmdline-tools/[0-9]+([.][0-9]+)*/bin/sdkmanager$' \
            | sort -V | tail -n 1 || true)"

          if [[ -n "$NUMERIC_SDKMANAGER" ]]; then
            SDKMANAGER="$NUMERIC_SDKMANAGER"
          elif [[ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            echo "ERROR: sdkmanager not found in GitHub runner." >&2
            exit 5
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version || true

          # User has already accepted the Android SDK licenses in the previous run.
          # Keep this non-interactive for clean CI rebuilds.
          yes | "$SDKMANAGER" --licenses >/dev/null || true

          PACKAGES=("platform-tools")
          if [[ ! -d "$PLATFORM_DIR" ]]; then
            PACKAGES+=("platforms;android-$COMPILE_SDK")
          fi
          if [[ ! -d "$BUILD_TOOLS_DIR" ]]; then
            PACKAGES+=("build-tools;$REQUIRED_BUILD_TOOLS")
          fi

          echo "Installing: ${PACKAGES[*]}"
          "$SDKMANAGER" "${PACKAGES[@]}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Validate latest OKN safety script
        shell: bash
        run: |
          set -euo pipefail

          if [[ -d "$PROJECT_DIR/Sources" ]]; then
            VALIDATOR="$(find "$PROJECT_DIR/Sources" -maxdepth 1 -type f -name 'validate_v*.py' \
              | sort -V | tail -n 1 || true)"

            if [[ -n "$VALIDATOR" ]]; then
              echo "Running validator: $VALIDATOR"
              python3 "$VALIDATOR"
            else
              echo "No validate_v*.py found; continue build."
            fi
          else
            echo "No Sources directory; continue build."
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [[ -f "gradlew" ]]; then
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace :app:assembleDebug
          else
            echo "Gradle Wrapper not found; using Gradle $FALLBACK_GRADLE_VERSION from workflow."
            gradle --no-daemon --stacktrace :app:assembleDebug
          fi

      - name: Collect APK + SHA256 + build info
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/dist"
          mkdir -p "$GITHUB_WORKSPACE/dist"

          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/*/*.apk' \
            -name '*debug*.apk' | sort | head -n 1)"

          if [[ -z "$APK" || ! -f "$APK" ]]; then
            echo "ERROR: Debug APK not found." >&2
            find "$PROJECT_DIR" -type f -name '*.apk' -print || true
            exit 6
          fi

          cp "$APK" "$GITHUB_WORKSPACE/dist/OKN_DSP-debug.apk"
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum OKN_DSP-debug.apk > OKN_DSP-debug.apk.sha256

          {
            echo "OKN DSP Android AutoBuild"
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "compileSdk=$COMPILE_SDK"
            echo "java=$(java -version 2>&1 | head -n 1)"
            echo "gradle=$(gradle --version | awk '/^Gradle /{print $2; exit}')"
            echo "built_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > build-info.txt

          cat OKN_DSP-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: OKN_DSP-Android-debug-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
