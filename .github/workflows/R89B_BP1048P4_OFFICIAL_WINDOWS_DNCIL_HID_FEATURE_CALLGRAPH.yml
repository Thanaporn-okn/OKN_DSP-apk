name: R89B BP1048P4 official GoloPine dncil HID feature callgraph

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r89b-bp1048p4-golopine-dncil-callgraph-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLOPINE_ZIP_URL: https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-08.exe_.zip
  EXPECTED_ZIP_SHA256: f14b0c4baad70a8b0d5dc3b2783819cc2ef6e1a9c6ec2adcf17f1557059edd2a
  EXPECTED_EXE_SHA256: 3ca54171c53f7badd963ffe6851b8b3e2faf8aee8ba2afcb7040990e22ae09b2
  FLASH_ALLOWED: 'NO'

jobs:
  static-callgraph:
    name: OFFLINE dncil HID feature callgraph - no execution/no USB/no board/no flash
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/R89B_SAFETY.txt <<'EOF'
          R89B_STATIC_ONLY=YES
          VENDOR_BINARY_EXECUTION=NO
          BOARD_CONTACT=NO
          USB_DEVICE_ACCESS=NO
          SEND_AA55=NO
          SEND_0X11=NO
          SEND_CHIPERAS_CODEDATA_BOOTDAT_CONSTDAT_CNFGDAT_BTUPDAT_UPINFO_CXXX=NO
          R79_PHYSICAL_REPLUG_AUTORUN=NO
          ERASE_PROGRAM_FLASH=NO
          FLASH_ALLOWED=NO
          PURPOSE=TRACE_HID_FEATURE_PINVOKES_WITH_DNFILE_DNCIL_AND_SEPARATE_UFE_RUNTIME_FROM_BOOT_RECOVERY
          EOF
          cat /tmp/R89B_SAFETY.txt

      - name: Install static parsers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/r89b-venv
          /tmp/r89b-venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir \
            dnfile dncil pefile
          echo "/tmp/r89b-venv/bin" >> "$GITHUB_PATH"

      - name: Acquire exact official binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r89b/download /tmp/r89b/unpacked /tmp/r89b/evidence

          curl --fail --location --retry 4 --connect-timeout 20 \
            "$GOLOPINE_ZIP_URL" -o /tmp/r89b/download/golopine.zip

          ZIP_SHA="$(sha256sum /tmp/r89b/download/golopine.zip | awk '{print $1}')"
          echo "OBSERVED_ZIP_SHA256=$ZIP_SHA"
          test "$ZIP_SHA" = "$EXPECTED_ZIP_SHA256"

          unzip -q /tmp/r89b/download/golopine.zip -d /tmp/r89b/unpacked

          /tmp/r89b-venv/bin/python - <<'PY'
          from pathlib import Path
          import hashlib, json

          root=Path('/tmp/r89b/unpacked')
          candidates=[]
          for p in root.rglob('*.exe'):
              b=p.read_bytes()
              candidates.append({
                  'path':str(p.relative_to(root)),
                  'size':len(b),
                  'sha256':hashlib.sha256(b).hexdigest(),
                  'mz':b[:2]==b'MZ',
                  'sidecar':'__MACOSX' in p.parts or p.name.startswith('._'),
              })

          real=[x for x in candidates if x['mz'] and not x['sidecar'] and x['size']>100000]
          if len(real)!=1:
              raise SystemExit(f'Expected exactly one real PE EXE: {real}')

          chosen=real[0]
          src=root/chosen['path']
          dst=Path('/tmp/r89b/golopine.exe')
          dst.write_bytes(src.read_bytes())
          Path('/tmp/r89b/evidence/R89B_EXE_SELECTION.json').write_text(
              json.dumps({'candidates':candidates,'selected':chosen},indent=2)+'\n'
          )
          print(json.dumps({'selected':chosen},indent=2))
          PY

          EXE_SHA="$(sha256sum /tmp/r89b/golopine.exe | awk '{print $1}')"
          echo "OBSERVED_REAL_EXE_SHA256=$EXE_SHA"
          test "$EXE_SHA" = "$EXPECTED_EXE_SHA256"

          printf 'ZIP_SHA_MATCH=YES\nEXE_SHA_MATCH=YES\nZIP_SHA256=%s\nEXE_SHA256=%s\n' \
            "$ZIP_SHA" "$EXE_SHA" | tee /tmp/r89b/evidence/R89B_SHA_GATE.txt

      - name: Parse managed IL with dnfile and dncil
        shell: bash
        run: |
          set -euo pipefail
          /tmp/r89b-venv/bin/python - <<'PY'
          from pathlib import Path
          import collections, json

          import dnfile
          from dnfile.enums import MetadataTables
          from dncil.cil.body import CilMethodBody
          from dncil.cil.body.reader import CilMethodBodyReaderBase
          from dncil.cil.error import MethodBodyFormatError
          from dncil.clr.token import Token, StringToken, InvalidToken

          exe=Path('/tmp/r89b/golopine.exe')
          out=Path('/tmp/r89b/evidence')
          pe=dnfile.dnPE(str(exe))
          if not getattr(pe,'net',None) or not getattr(pe.net,'mdtables',None):
              raise SystemExit('No parseable .NET metadata')

          class DnfileMethodBodyReader(CilMethodBodyReaderBase):
              def __init__(self, pe, row):
                  self.pe=pe
                  self.offset=self.pe.get_offset_from_rva(row.Rva)
              def read(self,n):
                  data=self.pe.get_data(self.pe.get_rva_from_offset(self.offset),n)
                  self.offset += n
                  return data
              def tell(self):
                  return self.offset
              def seek(self,offset):
                  self.offset=offset
                  return self.offset

          TABLES={table.value:table.name for table in MetadataTables}

          def resolve_token(tok):
              if isinstance(tok,StringToken):
                  try:
                      us=pe.net.user_strings.get(tok.rid)
                  except Exception:
                      return None
                  if us is None or isinstance(us,bytes) or getattr(us,'value',None) is None:
                      return None
                  return us.value
              if not isinstance(tok,Token):
                  return None
              tname=TABLES.get(tok.table)
              if not tname:
                  return None
              table=getattr(pe.net.mdtables,tname,None)
              if table is None:
                  return None
              try:
                  return table.rows[tok.rid-1]
              except Exception:
                  return None

          method_table=pe.net.mdtables.MethodDef
          methods=[]
          for rid,row in enumerate(method_table.rows,1):
              methods.append({
                  'rid':rid,
                  'token':0x06000000|rid,
                  'name':str(row.Name),
                  'rva':int(row.Rva or 0),
                  'row':row,
              })

          # Build TypeDef owner map from MethodList starts.
          owner_by_rid={}
          try:
              typedefs=pe.net.mdtables.TypeDef.rows
              starts=[]
              for tid,tr in enumerate(typedefs,1):
                  try:
                      first=tr.MethodList[0].row_index
                  except Exception:
                      try:first=tr.MethodList.row_index
                      except Exception:first=None
                  if first:
                      starts.append((first,tid,tr))
              starts.sort()
              for i,(first,tid,tr) in enumerate(starts):
                  end=(starts[i+1][0]-1) if i+1<len(starts) else len(methods)
                  tname=f"{getattr(tr,'TypeNamespace','')}.{getattr(tr,'TypeName','')}".strip('.')
                  for rid in range(first,end+1):
                      owner_by_rid[rid]=tname
          except Exception:
              pass

          for m in methods:
              m['owner']=owner_by_rid.get(m['rid'],'')
              m['full_name']=(m['owner']+'::'+m['name']).strip(':')

          by_name=collections.defaultdict(set)
          for m in methods:
              by_name[m['name']].add(m['rid'])

          call_graph=collections.defaultdict(set)
          calls_external=collections.defaultdict(list)
          strings_by_method=collections.defaultdict(list)
          parsed_count=0
          parse_failures=[]

          interesting_native={
              'HidD_SetFeature','HidD_SetOutputReport','HidD_GetInputReport',
              'HidD_GetAttributes','HidD_GetHidGuid','ReadFile','WriteFile',
              'SetupDiEnumDeviceInterfaces','SetupDiGetDeviceInterfaceDetail'
          }

          for m in methods:
              if not m['rva']:
                  continue
              row=m['row']
              try:
                  body=CilMethodBody(DnfileMethodBodyReader(pe,row))
              except Exception as e:
                  parse_failures.append({
                      'rid':m['rid'],'name':m['full_name'],'rva':m['rva'],
                      'error':type(e).__name__+': '+str(e)
                  })
                  continue
              parsed_count += 1

              for ins in body.instructions:
                  opname=str(ins.opcode).lower()
                  operand=ins.operand

                  if opname in ('call','callvirt','newobj','ldftn','ldvirtftn') and isinstance(operand,Token):
                      obj=resolve_token(operand)
                      if obj is None:
                          continue

                      target_name=str(getattr(obj,'Name',''))
                      target_full=target_name
                      try:
                          cls=getattr(obj,'Class',None)
                          crow=getattr(cls,'row',None)
                          if crow is not None:
                              ns=str(getattr(crow,'TypeNamespace',''))
                              tn=str(getattr(crow,'TypeName',''))
                              typ=(ns+'.'+tn).strip('.')
                              if typ:
                                  target_full=typ+'::'+target_name
                      except Exception:
                          pass

                      if operand.table==0x06 and 1 <= operand.rid <= len(methods):
                          call_graph[m['rid']].add(operand.rid)
                      else:
                          calls_external[m['rid']].append({
                              'opcode':opname,
                              'token':f'0x{operand.value:08X}',
                              'name':target_name,
                              'full_name':target_full,
                          })

                  if opname=='ldstr' and isinstance(operand,StringToken):
                      s=resolve_token(operand)
                      if isinstance(s,str):
                          strings_by_method[m['rid']].append(s)

          rev=collections.defaultdict(set)
          for src,targets in call_graph.items():
              for dst in targets:
                  rev[dst].add(src)

          # P/Invoke MethodDefs are visible by name even though no body exists.
          feature_names=['HidD_SetFeature','HidD_SetOutputReport','HidD_GetInputReport']
          all_hid_names=feature_names+['HidD_GetAttributes','HidD_GetHidGuid']

          feature_rids=set()
          all_hid_rids=set()
          for n in feature_names:
              feature_rids |= by_name.get(n,set())
          for n in all_hid_names:
              all_hid_rids |= by_name.get(n,set())

          # Managed callers may reference P/Invoke methods as MemberRef rather than MethodDef.
          feature_direct_callers=set()
          all_hid_direct_callers=set()
          for rid,arr in calls_external.items():
              for x in arr:
                  if x['name'] in feature_names:
                      feature_direct_callers.add(rid)
                  if x['name'] in all_hid_names:
                      all_hid_direct_callers.add(rid)

          for src,targets in call_graph.items():
              if targets & feature_rids:
                  feature_direct_callers.add(src)
              if targets & all_hid_rids:
                  all_hid_direct_callers.add(src)

          # Build upward caller closure from the real feature-call sites.
          upward=set(feature_direct_callers)
          q=collections.deque((rid,0) for rid in feature_direct_callers)
          depth={rid:0 for rid in feature_direct_callers}
          while q:
              cur,d=q.popleft()
              if d>=10:
                  continue
              for parent in rev.get(cur,()):
                  if parent not in upward:
                      upward.add(parent)
                      depth[parent]=d+1
                      q.append((parent,d+1))

          ufe_keywords=[
              'UFE','Ufe','WriteActuator','ReadActuator',
              'SendDeviceDescriptionRequest','DeviceDescription',
              'appendWriteActuatorCommand','appendDeviceCommand'
          ]
          ufe_rids={
              m['rid'] for m in methods
              if any(k.lower() in (m['full_name']).lower() for k in ufe_keywords)
          }

          def paths_from(seeds, target_callers, max_depth=12, max_paths=1000):
              results=[]
              for s in sorted(seeds):
                  dq=collections.deque([(s,[s])])
                  best={s:0}
                  while dq and len(results)<max_paths:
                      cur,path=dq.popleft()
                      if cur in target_callers and len(path)>=1:
                          results.append(path)
                          continue
                      if len(path)-1>=max_depth:
                          continue
                      for nxt in call_graph.get(cur,()):
                          nd=len(path)
                          if best.get(nxt,999)>nd:
                              best[nxt]=nd
                              dq.append((nxt,path+[nxt]))
              return results

          ufe_paths=paths_from(ufe_rids,feature_direct_callers)

          boot_terms=[
              'bootloader','boot loader','recovery','pc_upgrade','start_up_grate',
              'flash_boot_en','usbloadaudiomode','pctool','enter boot','enter_boot'
          ]
          forbidden_terms=[
              'chiperas','codedata','bootdat','constdat','cnfgdat','btupdat','upinfo','cxxx'
          ]

          closure_strings=[]
          for rid in upward:
              closure_strings.extend(strings_by_method.get(rid,[]))
          closure_text='\n'.join(closure_strings).lower()

          boot_hits=sorted({t for t in boot_terms if t in closure_text})
          forbidden_hits=sorted({t for t in forbidden_terms if t in closure_text})

          all_literal_hits=[]
          for rid,vals in strings_by_method.items():
              for s in vals:
                  low=s.lower()
                  terms=[t for t in boot_terms+forbidden_terms if t in low]
                  if terms:
                      all_literal_hits.append({
                          'rid':rid,
                          'method':methods[rid-1]['full_name'],
                          'terms':terms,
                          'literal':s[:1200]
                      })

          def mobj(rid):
              m=methods[rid-1]
              return {
                  'rid':rid,'token':f"0x{m['token']:08X}",
                  'name':m['name'],'owner':m['owner'],
                  'full_name':m['full_name'],'rva':m['rva'],
              }

          feature_callers=[
              {
                  **mobj(rid),
                  'feature_calls':[
                      x for x in calls_external.get(rid,[])
                      if x['name'] in feature_names
                  ],
                  'calls_methoddef_feature':bool(call_graph.get(rid,set()) & feature_rids),
              }
              for rid in sorted(feature_direct_callers)
          ]

          out.joinpath('R89B_FEATURE_DIRECT_CALLERS.json').write_text(
              json.dumps(feature_callers,indent=2,ensure_ascii=False)+'\n'
          )
          out.joinpath('R89B_FEATURE_CALLER_UPWARD_CLOSURE.json').write_text(
              json.dumps([
                  {**mobj(rid),'depth_from_feature':depth.get(rid,0)}
                  for rid in sorted(upward)
              ],indent=2,ensure_ascii=False)+'\n'
          )
          out.joinpath('R89B_UFE_TO_FEATURE_PATHS.json').write_text(
              json.dumps([
                  [mobj(rid) for rid in path] for path in ufe_paths
              ],indent=2,ensure_ascii=False)+'\n'
          )
          out.joinpath('R89B_BOOT_FLASH_LITERAL_HITS.json').write_text(
              json.dumps(all_literal_hits,indent=2,ensure_ascii=False)+'\n'
          )
          out.joinpath('R89B_PARSE_FAILURES.json').write_text(
              json.dumps(parse_failures,indent=2,ensure_ascii=False)+'\n'
          )

          # Emit focused contexts from call graph around feature callers/closure.
          focus=[]
          for rid in sorted(upward | ufe_rids | feature_direct_callers):
              m=methods[rid-1]
              focus.append({
                  **mobj(rid),
                  'calls_methoddefs':[mobj(x) for x in sorted(call_graph.get(rid,set())) if 1<=x<=len(methods)],
                  'external_calls':calls_external.get(rid,[]),
                  'strings':strings_by_method.get(rid,[])[:100],
              })
          out.joinpath('R89B_FOCUSED_GRAPH_CONTEXT.json').write_text(
              json.dumps(focus,indent=2,ensure_ascii=False)+'\n'
          )

          decision={
              'METHODDEF_COUNT':len(methods),
              'PARSED_METHOD_BODY_COUNT':parsed_count,
              'METHOD_BODY_PARSE_FAILURE_COUNT':len(parse_failures),
              'HID_FEATURE_METHODDEF_RIDS':sorted(feature_rids),
              'HID_FEATURE_DIRECT_MANAGED_CALLER_COUNT':len(feature_direct_callers),
              'HID_FEATURE_CALLER_UPWARD_CLOSURE_COUNT':len(upward),
              'UFE_SEED_METHOD_COUNT':len(ufe_rids),
              'UFE_TO_HID_FEATURE_PATH_COUNT':len(ufe_paths),
              'BOOT_RECOVERY_TERMS_IN_HID_FEATURE_CALLER_CLOSURE':boot_hits,
              'FORBIDDEN_FLASH_TERMS_IN_HID_FEATURE_CALLER_CLOSURE':forbidden_hits,
              'BOOT_OR_FLASH_LDSTR_LITERAL_HIT_COUNT':len(all_literal_hits),
              'HID_FEATURE_REACHABLE_FROM_UFE_RUNTIME_EVIDENCE':bool(ufe_paths),
              'DISTINCT_BOOT_RECOVERY_BRANCH_FROM_HID_FEATURE_PROVEN':False,
              'BP1048P4_PHONE_DIRECT_BOOT_ENTRY_PROVEN':False,
              'BP1048P4_PHONE_DIRECT_RECOVERY_IDENTITY_PROVEN':False,
              'READ_ONLY_PHONE_DIRECT_BACKUP_PROVEN':False,
              'LIVE_BOARD_TEST_ALLOWED_FROM_R89B':False,
              'FLASH_ALLOWED':False,
          }
          out.joinpath('R89B_DECISION.json').write_text(json.dumps(decision,indent=2)+'\n')
          print(json.dumps(decision,indent=2))
          PY

      - name: Build focused report
        shell: bash
        run: |
          set -euo pipefail
          /tmp/r89b-venv/bin/python - <<'PY'
          from pathlib import Path
          import json

          p=Path('/tmp/r89b/evidence')
          dec=json.loads((p/'R89B_DECISION.json').read_text())
          callers=json.loads((p/'R89B_FEATURE_DIRECT_CALLERS.json').read_text())
          paths=json.loads((p/'R89B_UFE_TO_FEATURE_PATHS.json').read_text())
          lits=json.loads((p/'R89B_BOOT_FLASH_LITERAL_HITS.json').read_text())
          fails=json.loads((p/'R89B_PARSE_FAILURES.json').read_text())

          lines=[
              '# R89B official GoloPine Windows dncil HID-feature callgraph',
              '',
              'OFFLINE/STATIC ONLY. No vendor execution, no USB/board access, no flash.',
              '',
              '## Decision',
              '```json',json.dumps(dec,indent=2),'```','',
              '## Direct managed callers of HID feature APIs',
          ]

          for x in callers[:200]:
              lines.append(
                  f"- RID {x['rid']} `{x['full_name']}` RVA=0x{x['rva']:X} "
                  f"external_feature_calls={[c['name'] for c in x['feature_calls']]} "
                  f"methoddef_feature={x['calls_methoddef_feature']}"
              )

          lines += ['','## UFE/runtime -> HID-feature caller paths']
          if not paths:
              lines.append('- none resolved by direct static MethodDef graph')
          else:
              for path in paths[:250]:
                  lines.append('- '+' -> '.join(x['full_name'] for x in path))

          lines += ['','## Boot/flash ldstr literals']
          if not lits:
              lines.append('- none')
          else:
              for x in lits[:250]:
                  lines.append(f"- `{x['method']}` terms={x['terms']} :: `{x['literal']}`")

          lines += ['','## Parser coverage']
          lines.append(f"- method body parse failures: {len(fails)}")
          for x in fails[:80]:
              lines.append(f"- `{x['name']}` RVA=0x{x['rva']:X}: {x['error']}")

          lines += [
              '',
              '## Gate',
              '- R89 failed because monodis aborted on this protected/obfuscated assembly; R89B uses dnfile+dncil without executing it.',
              '- Feature P/Invoke existence alone is not treated as a boot-entry protocol.',
              '- A separate boot/recovery branch requires actual caller/literal/protocol evidence, not raw AA55 byte coincidences.',
              '- No repeated AA55, no R79 autorun, no live board test.',
              '- FLASH_ALLOWED=NO.',
          ]
          p.joinpath('R89B_REPORT.md').write_text('\n'.join(lines)+'\n')
          PY
          sed -n '1,720p' /tmp/r89b/evidence/R89B_REPORT.md

      - name: Package evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/R89B_SAFETY.txt /tmp/r89b/evidence/ || true
          (cd /tmp/r89b/evidence && zip -9 -r /tmp/R89B_BP1048P4_OFFICIAL_WINDOWS_DNCIL_HID_FEATURE_CALLGRAPH_EVIDENCE.zip .)
          sha256sum /tmp/R89B_BP1048P4_OFFICIAL_WINDOWS_DNCIL_HID_FEATURE_CALLGRAPH_EVIDENCE.zip \
            > /tmp/R89B_BP1048P4_OFFICIAL_WINDOWS_DNCIL_HID_FEATURE_CALLGRAPH_EVIDENCE.zip.sha256

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R89B-BP1048P4-OFFICIAL-WINDOWS-DNCIL-HID-FEATURE-CALLGRAPH-EVIDENCE
          path: |
            /tmp/R89B_BP1048P4_OFFICIAL_WINDOWS_DNCIL_HID_FEATURE_CALLGRAPH_EVIDENCE.zip
            /tmp/R89B_BP1048P4_OFFICIAL_WINDOWS_DNCIL_HID_FEATURE_CALLGRAPH_EVIDENCE.zip.sha256
          if-no-files-found: error
