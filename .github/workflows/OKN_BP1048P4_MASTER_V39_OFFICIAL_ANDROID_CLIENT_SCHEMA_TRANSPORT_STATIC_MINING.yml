name: OKN BP1048P4 MASTER V39 OFFICIAL ANDROID CLIENT SCHEMA + TRANSPORT STATIC MINING

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/OKN_BP1048P4_MASTER_V39_OFFICIAL_ANDROID_CLIENT_SCHEMA_TRANSPORT_STATIC_MINING.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  OFFICIAL_PAGE_URL: "https://golodsp.com/7%E9%80%9A%E9%81%93%E9%9F%B3%E9%A2%91%E5%89%8D%E7%BA%A7/"
  OFFICIAL_ANDROID_ZIP_URL: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-01.apk_.zip"

  V38_ARTIFACT_ID: "11299447620"

  LIVE_DSP_ALLOWED: "NO"
  HOST_TO_DSP_IO: "NO"
  FEATURE_REPORT_ALLOWED: "NO"
  FLASH_ALLOWED: "NO"
  ERASE_ALLOWED: "NO"
  WRITE_ALLOWED: "NO"
  NEW_LIVE_0X11_ALLOWED: "NO"

jobs:
  v39:
    name: Mine official Android client for schema and transport evidence OFFLINE
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail

          test "$LIVE_DSP_ALLOWED" = "NO"
          test "$HOST_TO_DSP_IO" = "NO"
          test "$FEATURE_REPORT_ALLOWED" = "NO"
          test "$FLASH_ALLOWED" = "NO"
          test "$ERASE_ALLOWED" = "NO"
          test "$WRITE_ALLOWED" = "NO"
          test "$NEW_LIVE_0X11_ALLOWED" = "NO"

          rm -rf /tmp/v39
          mkdir -p /tmp/v39/{download,apk,jadx,evidence,out,v38}

          cat > /tmp/v39/evidence/00_SCOPE.txt <<'EOF'
          REVISION=MASTER-V39
          MODE=OFFLINE_OFFICIAL_ANDROID_CLIENT_SCHEMA_AND_TRANSPORT_STATIC_MINING

          GOALS:
          - Search the official Android tuning package for a static Device
            Description template or parameter/control schema.
          - Seek direct static support for CH7 stock ID 17.
          - Seek static evidence that IDs 22..28 are already occupied.
          - Inventory Android USB/HID transport code and report framing.
          - Search for updater/flash/recovery strings without executing them.

          SAFETY:
          - No phone/device connection.
          - No USB/HID object.
          - No live packet transmitted.
          - No Feature report.
          - No flash/erase/write.
          - New live byte 0x11 remains forbidden.
          EOF

      - name: Download V38 evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          curl -fL --retry 4 --retry-all-errors \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$V38_ARTIFACT_ID/zip" \
            -o /tmp/v39/download/v38.zip

          unzip -q /tmp/v39/download/v38.zip -d /tmp/v39/v38

          test -s /tmp/v39/v38/03_V38_MAPPING_AND_COLLISION_AUDIT.json
          test -s /tmp/v39/v38/06_V38_FINAL_DECISION.md

          cp /tmp/v39/v38/06_V38_FINAL_DECISION.md \
            /tmp/v39/evidence/01_V38_INPUT_DECISION.md

      - name: Acquire official Android package and prove source identity
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 5 --retry-all-errors \
            "$OFFICIAL_PAGE_URL" \
            -o /tmp/v39/download/official_page.html

          grep -F \
            "golopine_audio_turning_release_2026-04-01.apk_.zip" \
            /tmp/v39/download/official_page.html \
            > /tmp/v39/evidence/02_OFFICIAL_PAGE_LINK_MATCH.txt

          test -s /tmp/v39/evidence/02_OFFICIAL_PAGE_LINK_MATCH.txt

          curl -fL --retry 6 --retry-all-errors \
            "$OFFICIAL_ANDROID_ZIP_URL" \
            -o /tmp/v39/download/official_android.zip

          sha256sum /tmp/v39/download/official_android.zip \
            > /tmp/v39/evidence/03_ANDROID_ZIP_SHA256.txt

          unzip -l /tmp/v39/download/official_android.zip \
            > /tmp/v39/evidence/04_ANDROID_ZIP_LIST.txt

          APK="$(unzip -Z1 /tmp/v39/download/official_android.zip \
            | grep -Ei '\.apk$' \
            | head -n1)"

          test -n "$APK"

          unzip -p /tmp/v39/download/official_android.zip "$APK" \
            > /tmp/v39/apk/official.apk

          test -s /tmp/v39/apk/official.apk

          sha256sum /tmp/v39/apk/official.apk \
            > /tmp/v39/evidence/05_ANDROID_APK_SHA256.txt

          unzip -l /tmp/v39/apk/official.apk \
            > /tmp/v39/evidence/06_APK_FILE_LIST.txt

      - name: Android package identity and certificate
        shell: bash
        run: |
          set -euo pipefail

          AAPT="$(find "${ANDROID_HOME:-/opt/android-sdk}" \
            -type f -name aapt 2>/dev/null \
            | sort -V \
            | tail -n1 || true)"

          APKSIGNER="$(find "${ANDROID_HOME:-/opt/android-sdk}" \
            -type f -name apksigner 2>/dev/null \
            | sort -V \
            | tail -n1 || true)"

          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging /tmp/v39/apk/official.apk \
              > /tmp/v39/evidence/07_AAPT_BADGING.txt || true
          else
            echo "AAPT_NOT_FOUND" \
              > /tmp/v39/evidence/07_AAPT_BADGING.txt
          fi

          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs /tmp/v39/apk/official.apk \
              > /tmp/v39/evidence/08_APKSIGNER_CERTS.txt 2>&1 || true
          else
            echo "APKSIGNER_NOT_FOUND" \
              > /tmp/v39/evidence/08_APKSIGNER_CERTS.txt
          fi

      - name: Extract APK and literal assets/resources
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/v39/apk/unpacked
          unzip -q /tmp/v39/apk/official.apk -d /tmp/v39/apk/unpacked

          find /tmp/v39/apk/unpacked -type f -printf '%P\n' \
            | sort \
            > /tmp/v39/evidence/09_UNPACKED_FILE_LIST.txt

          find /tmp/v39/apk/unpacked \
            -type f \
            \( -path '*/assets/*' \
               -o -path '*/res/raw/*' \
               -o -iname '*.json' \
               -o -iname '*.xml' \
               -o -iname '*.txt' \
               -o -iname '*.cfg' \
               -o -iname '*.ini' \
               -o -iname '*.dat' \
               -o -iname '*.bin' \) \
            -print \
            > /tmp/v39/evidence/10_RESOURCE_CANDIDATES.txt

          : > /tmp/v39/evidence/11_RESOURCE_KEYWORD_HITS.txt

          while IFS= read -r f; do
            grep -aEin \
              'BiquadCascade|7thChannel|i2sout1R|i2sout1L|MasterVolume|SaveParams|BassVolume|PowerStageVoltage|DeviceDescription|"ID"[[:space:]]*:[[:space:]]*(17|2[2-8])|flash|firmware|upgrade|recovery|backup' \
              "$f" \
              >> /tmp/v39/evidence/11_RESOURCE_KEYWORD_HITS.txt \
              2>/dev/null || true
          done < /tmp/v39/evidence/10_RESOURCE_CANDIDATES.txt

      - name: Extract all DEX strings without decompiler dependency
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/v39/dex_strings.py <<'PY'
          from pathlib import Path
          import struct,sys

          apk=Path("/tmp/v39/apk/unpacked")
          out=Path("/tmp/v39/evidence/12_DEX_ALL_STRINGS.txt")

          def uleb(data,off):
              result=0
              shift=0
              while True:
                  b=data[off]
                  off+=1
                  result |= (b & 0x7f) << shift
                  if not (b & 0x80):
                      return result,off
                  shift += 7

          rows=[]

          for dex in sorted(apk.glob("classes*.dex")):
              data=dex.read_bytes()

              if not data.startswith(b"dex\n"):
                  continue

              size=struct.unpack_from("<I",data,0x38)[0]
              ids_off=struct.unpack_from("<I",data,0x3c)[0]

              rows.append(f"### {dex.name} string_count={size}")

              for i in range(size):
                  s_off=struct.unpack_from("<I",data,ids_off+i*4)[0]

                  try:
                      _,p=uleb(data,s_off)
                      q=data.index(0,p)
                      raw=data[p:q]
                      s=raw.decode("utf-8","replace")
                  except Exception:
                      continue

                  rows.append(f"{dex.name}\t{i}\t{s}")

          out.write_text("\n".join(rows)+"\n",errors="ignore")
          print("DEX_STRING_ROWS",len(rows))
          PY

          python3 /tmp/v39/dex_strings.py

          grep -aEin \
            'BiquadCascade|7thChannel|i2sout1R|i2sout1L|MasterVolume|SaveParams|BassVolume|PowerStageVoltage|DeviceDescription|UsbDeviceConnection|controlTransfer|GET_REPORT|SET_REPORT|6324|1719|flash|firmware|upgrade|recovery|backup|Gain' \
            /tmp/v39/evidence/12_DEX_ALL_STRINGS.txt \
            > /tmp/v39/evidence/13_DEX_KEYWORD_HITS.txt || true

      - name: Decompile with JADX for source-level static context
        shell: bash
        run: |
          set -euo pipefail

          set +e

          API_JSON="$(curl -fsSL \
            https://api.github.com/repos/skylot/jadx/releases/latest)"

          URL="$(printf '%s' "$API_JSON" \
            | jq -r '.assets[] | select(.name|test("^jadx-[0-9].*\\.zip$")) | .browser_download_url' \
            | head -n1)"

          TAG="$(printf '%s' "$API_JSON" | jq -r '.tag_name // "UNKNOWN"')"

          echo "JADX_TAG=$TAG" \
            > /tmp/v39/evidence/14_JADX_IDENTITY.txt

          echo "JADX_URL=$URL" \
            >> /tmp/v39/evidence/14_JADX_IDENTITY.txt

          if [ -n "$URL" ] && [ "$URL" != "null" ]; then
            curl -fL --retry 4 --retry-all-errors "$URL" \
              -o /tmp/v39/download/jadx.zip

            sha256sum /tmp/v39/download/jadx.zip \
              >> /tmp/v39/evidence/14_JADX_IDENTITY.txt

            unzip -q /tmp/v39/download/jadx.zip -d /tmp/v39/jadx_tool

            /tmp/v39/jadx_tool/bin/jadx \
              --no-res \
              --show-bad-code \
              -d /tmp/v39/jadx \
              /tmp/v39/apk/official.apk \
              > /tmp/v39/evidence/15_JADX_STDOUT.txt \
              2> /tmp/v39/evidence/16_JADX_STDERR.txt

            echo "JADX_EXIT=$?" \
              >> /tmp/v39/evidence/14_JADX_IDENTITY.txt
          else
            echo "JADX_DOWNLOAD_URL_NOT_FOUND" \
              > /tmp/v39/evidence/16_JADX_STDERR.txt
          fi

          set -e

          : > /tmp/v39/evidence/17_JADX_SCHEMA_HITS.txt
          : > /tmp/v39/evidence/18_JADX_USB_TRANSPORT_HITS.txt
          : > /tmp/v39/evidence/19_JADX_UPDATE_RECOVERY_HITS.txt

          if [ -d /tmp/v39/jadx/sources ]; then
            grep -RniE \
              --include='*.java' \
              'BiquadCascade|7thChannel|i2sout1R|i2sout1L|MasterVolume|SaveParams|BassVolume|PowerStageVoltage|DeviceDescription|ControlID|ParamID|Gain' \
              /tmp/v39/jadx/sources \
              > /tmp/v39/evidence/17_JADX_SCHEMA_HITS.txt || true

            grep -RniE \
              --include='*.java' \
              'UsbDeviceConnection|controlTransfer|USB_DIR_|GET_REPORT|SET_REPORT|claimInterface|6324|1719|0xA1|0x21|0x01|0x09' \
              /tmp/v39/jadx/sources \
              > /tmp/v39/evidence/18_JADX_USB_TRANSPORT_HITS.txt || true

            grep -RniE \
              --include='*.java' \
              'flash|firmware|upgrade|update|recovery|backup|bootloader|erase|program' \
              /tmp/v39/jadx/sources \
              > /tmp/v39/evidence/19_JADX_UPDATE_RECOVERY_HITS.txt || true
          fi

      - name: Decide schema, CH7 ID, Gain collision, and transport evidence
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/v39/decide.py <<'PY'
          from pathlib import Path
          import json,re

          root=Path("/tmp/v39")
          ev=root/"evidence"

          v38=json.loads(
              (root/"v38"/"03_V38_MAPPING_AND_COLLISION_AUDIT.json").read_text()
          )

          def read(name):
              p=ev/name
              return p.read_text(errors="ignore") if p.exists() else ""

          corpus="\n".join([
              read("11_RESOURCE_KEYWORD_HITS.txt"),
              read("12_DEX_ALL_STRINGS.txt"),
              read("13_DEX_KEYWORD_HITS.txt"),
              read("17_JADX_SCHEMA_HITS.txt"),
              read("18_JADX_USB_TRANSPORT_HITS.txt"),
              read("19_JADX_UPDATE_RECOVERY_HITS.txt")
          ])

          lower=corpus.lower()

          ch7_name="biquadcascade7thchannel" in lower
          ch7_phys="i2sout1r" in lower

          # Direct static ID17 requires an exact schema-like ID=17 or JSON ID:17
          # in a text corpus that also carries the CH7 name/physical marker.
          id17_pattern=bool(re.search(
              r'(?i)(?:"?ID"?\s*[:=]\s*17|controlid\s*[:=]\s*17|paramid\s*[:=]\s*17)',
              corpus
          ))

          ch7_direct_static=ch7_name and id17_pattern

          occupied={}
          for n in range(22,29):
              occupied[n]=bool(re.search(
                  rf'(?i)(?:"?ID"?\s*[:=]\s*{n}\b|controlid\s*[:=]\s*{n}\b|paramid\s*[:=]\s*{n}\b)',
                  corpus
              ))

          static_collision_ids=[
              n for n,v in occupied.items() if v
          ]

          full_template=(
              '"name":"golopine_dsp_amplifier"' in lower and
              '"eypt"' in lower and
              ('"id":' in lower or '"id" :' in lower)
          )

          usb_static=(
              "usbdeviceconnection" in lower or
              "controltransfer" in lower
          )

          update_tokens=[
              x for x in [
                  "firmware","flash","upgrade","recovery",
                  "bootloader","erase","backup"
              ]
              if x in lower
          ]

          result={
              "revision":"MASTER-V39",
              "classification":
                  "OFFLINE_OFFICIAL_ANDROID_CLIENT_STATIC_MINING_NOT_FOR_FLASH",

              "ch7_name_present_in_official_android_static":ch7_name,
              "ch7_i2sout1r_present_in_official_android_static":ch7_phys,
              "schema_like_id17_present_in_static":id17_pattern,
              "ch7_id17_direct_static_proof":ch7_direct_static,

              "gain_ids_22_28_schema_like_static_occupancy":occupied,
              "gain_ids_22_28_static_collision_ids":static_collision_ids,

              "full_device_description_template_found":full_template,
              "usb_transport_static_evidence_present":usb_static,
              "update_recovery_keywords_present":update_tokens,

              "v38_ch7_status":
                  next(
                      x["id_status"]
                      for x in v38["production_channel_mapping"]
                      if x["channel"]=="CH7"
                  ),

              "v38_gain_global_absence_proven":
                  bool(v38["gain_id_absence_is_global_proof"]),

              "new_live_0x11_allowed":False,
              "host_to_dsp_io":False,
              "feature_report_invoked":False,
              "flash_allowed":False
          }

          if ch7_direct_static and not static_collision_ids:
              status="ANDROID_STATIC_SUPPORTS_CH7_ID17_AND_NO_STATIC_GAIN_COLLISION"
          elif static_collision_ids:
              status="ANDROID_STATIC_GAIN_ID_COLLISION_CANDIDATES_REQUIRE_REVIEW"
          elif full_template:
              status="ANDROID_STATIC_FULL_SCHEMA_TEMPLATE_FOUND_REVIEW_REQUIRED"
          else:
              status="ANDROID_CLIENT_HAS_NO_COMPLETE_STATIC_DEVICE_SCHEMA_DYNAMIC_DESCRIPTION_REMAINS_REQUIRED"

          result["status"]=status

          (ev/"20_V39_DECISION.json").write_text(
              json.dumps(result,indent=2,ensure_ascii=False)+"\n"
          )

          md=f"""# MASTER V39 FINAL DECISION

          Official Android client static mining:

          - CH7 name present statically: **{ch7_name}**
          - i2sout1R marker present statically: **{ch7_phys}**
          - schema-like ID 17 present statically: **{id17_pattern}**
          - direct static CH7 ID17 proof: **{ch7_direct_static}**
          - static collision candidates among Gain IDs 22..28:
            **{static_collision_ids}**
          - complete Device Description template found:
            **{full_template}**
          - Android USB transport static evidence present:
            **{usb_static}**
          - update/recovery keyword set:
            **{update_tokens}**

          V38 remains authoritative for production mapping unless stronger exact
          static evidence appears here. Absence of IDs 22..28 in this generic
          Android client is not by itself proof that the production Device
          Description leaves them unused.

          Status:
          **{status}**

          New live byte 0x11: **NOT ALLOWED**
          Host-to-DSP I/O: **NO**
          Flash/erase/write: **NO / NO / NO**

          Classification:
          **OFFLINE_OFFICIAL_ANDROID_CLIENT_STATIC_MINING_NOT_FOR_FLASH**
          """

          (ev/"21_V39_FINAL_DECISION.md").write_text(md)
          print(md)
          PY

          python3 /tmp/v39/decide.py
          cat /tmp/v39/evidence/21_V39_FINAL_DECISION.md \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Package V39 evidence
        shell: bash
        run: |
          set -euo pipefail

          cp /tmp/v39/evidence/* /tmp/v39/out/

          (
            cd /tmp/v39/out
            sha256sum * > SHA256SUMS.txt
          )

      - name: Upload V39 evidence
        uses: actions/upload-artifact@v7
        with:
          name: OKN-BP1048P4-MASTER-V39-OFFICIAL-ANDROID-STATIC-MINING-EVIDENCE
          path: /tmp/v39/out/*
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed assertion
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          test "$LIVE_DSP_ALLOWED" = "NO"
          test "$HOST_TO_DSP_IO" = "NO"
          test "$FEATURE_REPORT_ALLOWED" = "NO"
          test "$FLASH_ALLOWED" = "NO"
          test "$ERASE_ALLOWED" = "NO"
          test "$WRITE_ALLOWED" = "NO"
          test "$NEW_LIVE_0X11_ALLOWED" = "NO"

          echo "MASTER_V39=PASS"
          echo "HOST_TO_DSP_IO=NO"
          echo "NEW_LIVE_0X11_ALLOWED=NO"
          echo "FLASH_ALLOWED=NO"
