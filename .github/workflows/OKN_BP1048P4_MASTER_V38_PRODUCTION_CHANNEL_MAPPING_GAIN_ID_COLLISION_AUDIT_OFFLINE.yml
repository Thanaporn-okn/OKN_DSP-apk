name: OKN BP1048P4 MASTER V38 PRODUCTION CHANNEL MAPPING + GAIN ID COLLISION AUDIT OFFLINE

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/OKN_BP1048P4_MASTER_V38_PRODUCTION_CHANNEL_MAPPING_GAIN_ID_COLLISION_AUDIT_OFFLINE.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  V32_ARTIFACT_ID: "11298720275"
  V33_ARTIFACT_ID: "11298985578"

  V37_EVIDENCE_SHA256: "86a2d1430059d859742ecedc7fd57e77fda291d5947da54816d80cc9f5e89011"
  V37_ITERATIONS: "2001"
  V37_ZERO_RESULTS: "2001"
  V37_NONZERO_RESULTS: "0"
  V37_SPONTANEOUS_VENDOR_DATA: "false"

  FLASH_ALLOWED: "NO"
  ERASE_ALLOWED: "NO"
  WRITE_ALLOWED: "NO"
  FEATURE_REPORT_ALLOWED: "NO"
  LIVE_OUTPUT_ALLOWED: "NO"
  NEW_LIVE_0X11_ALLOWED: "NO"

jobs:
  v38:
    name: Recover production mapping and audit Gain IDs OFFLINE
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          test "$ERASE_ALLOWED" = "NO"
          test "$WRITE_ALLOWED" = "NO"
          test "$FEATURE_REPORT_ALLOWED" = "NO"
          test "$LIVE_OUTPUT_ALLOWED" = "NO"
          test "$NEW_LIVE_0X11_ALLOWED" = "NO"

          rm -rf /tmp/v38
          mkdir -p /tmp/v38/{v32,v33,evidence,out}

          cat > /tmp/v38/evidence/00_SCOPE.txt <<EOF
          REVISION=MASTER-V38
          MODE=OFFLINE_PRODUCTION_CHANNEL_MAPPING_AND_GAIN_ID_AUDIT

          SOURCE_V37_EVIDENCE_SHA256=$V37_EVIDENCE_SHA256
          V37_ITERATIONS=$V37_ITERATIONS
          V37_ZERO_RESULTS=$V37_ZERO_RESULTS
          V37_NONZERO_RESULTS=$V37_NONZERO_RESULTS
          V37_SPONTANEOUS_VENDOR_DATA=$V37_SPONTANEOUS_VENDOR_DATA

          NEW_LIVE_0X11_ALLOWED=NO
          LIVE_OUTPUT_ALLOWED=NO
          FLASH_ALLOWED=NO
          ERASE_ALLOWED=NO
          WRITE_ALLOWED=NO
          EOF

      - name: Download exact V32 and V33 evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          curl -fL --retry 4 --retry-all-errors \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$V32_ARTIFACT_ID/zip" \
            -o /tmp/v38/v32.zip

          curl -fL --retry 4 --retry-all-errors \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$V33_ARTIFACT_ID/zip" \
            -o /tmp/v38/v33.zip

          unzip -q /tmp/v38/v32.zip -d /tmp/v38/v32
          unzip -q /tmp/v38/v33.zip -d /tmp/v38/v33

          test -s /tmp/v38/v32/DEVICE_DESCRIPTION_BYTES.bin
          test -s /tmp/v38/v32/05_V32_DECISION.json
          test -s /tmp/v38/v33/02_V33_FORENSICS.json
          test -s /tmp/v38/v33/04_CHANNEL_MAPPING.tsv

          sha256sum /tmp/v38/v32/* > /tmp/v38/evidence/01_V32_SHA256SUMS.txt
          sha256sum /tmp/v38/v33/* > /tmp/v38/evidence/02_V33_SHA256SUMS.txt

      - name: Recover production mapping and audit dedicated Gain IDs
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/v38/analyze.py <<'PY'
          from pathlib import Path
          import json,re

          root=Path("/tmp/v38")
          ev=root/"evidence"

          v32=json.loads((root/"v32"/"05_V32_DECISION.json").read_text())
          v33=json.loads((root/"v33"/"02_V33_FORENSICS.json").read_text())
          raw=(root/"v32"/"DEVICE_DESCRIPTION_BYTES.bin").read_bytes()
          text=raw.decode("utf-8","replace")

          exact_ids=[]
          exact_entries=[]

          for m in re.finditer(
              r'\{"ID":(\d+),"type":(\d+),"name":"([^"]+)"',
              text):

              row={
                  "id":int(m.group(1)),
                  "type":int(m.group(2)),
                  "name":m.group(3),
                  "offset":m.start()
              }
              exact_ids.append(row["id"])
              exact_entries.append(row)

          names=[
              ("CH1","BiquadCascadeLeftChannel","left channel"),
              ("CH2","BiquadCascadeRightChannel","right channel"),
              ("CH3","BiquadCascadeBassChannel","bass channel turning"),
              ("CH4","BiquadCascade4thChannel","i2sout0L"),
              ("CH5","BiquadCascade5thChannel","i2sout0R"),
              ("CH6","BiquadCascade6thChannel","i2sout1L"),
              ("CH7","BiquadCascade7thChannel","i2sout1R"),
          ]

          mapping=[]
          proven_by_name={x["name"]:x for x in exact_entries}

          for ch,name,physical in names:
              if name in proven_by_name:
                  e=proven_by_name[name]
                  mapping.append({
                      "channel":ch,
                      "stock_control_id":e["id"],
                      "name":name,
                      "physical_description":physical,
                      "id_status":"PROVEN_FROM_RECOVERED_DEVICE_DESCRIPTION",
                      "confidence":"PROVEN"
                  })
              else:
                  pos=text.find(name)

                  if name=="BiquadCascade7thChannel" and pos>=0:
                      mapping.append({
                          "channel":ch,
                          "stock_control_id":17,
                          "name":name,
                          "physical_description":physical,
                          "id_status":
                              "STRUCTURALLY_INFERRED_FROM_CONSECUTIVE_14_15_16_AND_CH7_BLOCK",
                          "confidence":"HIGH_BUT_NOT_WIRE_EXACT"
                      })
                  else:
                      mapping.append({
                          "channel":ch,
                          "stock_control_id":None,
                          "name":name,
                          "physical_description":physical,
                          "id_status":"NOT_RECOVERED",
                          "confidence":"UNKNOWN"
                      })

          intended_gain_ids={
              "CH1":22,
              "CH2":23,
              "CH3":24,
              "CH4":25,
              "CH5":26,
              "CH6":27,
              "CH7":28
          }

          collision_rows=[]
          exact_set=set(exact_ids)

          for ch,gid in intended_gain_ids.items():
              collision_rows.append({
                  "channel":ch,
                  "dedicated_gain_id":gid,
                  "exact_collision_in_recovered_text":gid in exact_set,
                  "collision_status":
                      "EXACT_COLLISION_FOUND"
                      if gid in exact_set
                      else "NO_EXACT_COLLISION_IN_RECOVERED_BYTES"
              })

          missing=int(v32["final_dev_description_length"]) - int(v32["final_accumulated_bytes"])

          result={
              "revision":"MASTER-V38",
              "classification":
                  "OFFLINE_PRODUCTION_CHANNEL_MAPPING_AND_GAIN_ID_AUDIT_NOT_FOR_FLASH",

              "v32_declared_description_bytes":
                  int(v32["final_dev_description_length"]),
              "v32_recovered_description_bytes":
                  int(v32["final_accumulated_bytes"]),
              "v32_missing_description_bytes":missing,

              "v33_expected_total_reports":
                  v33.get("expected_total_report_hypothesis"),

              "v37_zero_output_probe":{
                  "evidence_sha256":
                      "86a2d1430059d859742ecedc7fd57e77fda291d5947da54816d80cc9f5e89011",
                  "iterations":2001,
                  "zero_results":2001,
                  "nonzero_results":0,
                  "spontaneous_vendor_data":False
              },

              "production_channel_mapping":mapping,
              "intended_dedicated_gain_ids":intended_gain_ids,
              "gain_id_collision_audit":collision_rows,

              "gain_id_absence_is_global_proof":False,
              "gain_id_absence_reason":
                  "1420 Device Description bytes are missing, so lack of IDs 22..28 in recovered bytes cannot prove global absence.",

              "logical_physical_mapping_gate":
                  all(x["confidence"] in ("PROVEN","HIGH_BUT_NOT_WIRE_EXACT")
                      for x in mapping),

              "new_live_0x11_allowed":False,
              "live_protocol_progress_without_output":
                  "BLOCKED_BY_V37_NO_SPONTANEOUS_VENDOR_DATA",
              "flash_allowed":False
          }

          (ev/"03_V38_MAPPING_AND_COLLISION_AUDIT.json").write_text(
              json.dumps(result,indent=2,ensure_ascii=False)+"\n")

          with (ev/"04_PRODUCTION_CHANNEL_MAPPING.tsv").open("w") as f:
              f.write(
                  "channel\tstock_control_id\tname\tphysical_description\t"
                  "id_status\tconfidence\n")

              for x in mapping:
                  f.write("\t".join([
                      str(x["channel"]),
                      str(x["stock_control_id"]),
                      str(x["name"]),
                      str(x["physical_description"]),
                      str(x["id_status"]),
                      str(x["confidence"])
                  ])+"\n")

          with (ev/"05_GAIN_ID_COLLISION_AUDIT.tsv").open("w") as f:
              f.write(
                  "channel\tdedicated_gain_id\t"
                  "exact_collision_in_recovered_text\tcollision_status\n")

              for x in collision_rows:
                  f.write("\t".join([
                      x["channel"],
                      str(x["dedicated_gain_id"]),
                      str(x["exact_collision_in_recovered_text"]),
                      x["collision_status"]
                  ])+"\n")

          proven=sum(1 for x in mapping if x["confidence"]=="PROVEN")
          inferred=sum(
              1 for x in mapping
              if x["confidence"]=="HIGH_BUT_NOT_WIRE_EXACT")

          any_collision=any(
              x["exact_collision_in_recovered_text"]
              for x in collision_rows)

          status=(
              "MAPPING_6_PROVEN_CH7_HIGH_CONFIDENCE_GAIN_22_28_NO_EXACT_COLLISION_BUT_GLOBAL_ABSENCE_UNPROVEN"
              if proven==6 and inferred==1 and not any_collision
              else "MAPPING_REVIEW_REQUIRED"
          )

          md=f"""# MASTER V38 FINAL DECISION

          V37 zero-output live result:
          - IF4 GET_REPORT(Input) iterations: **2001**
          - zero-length/no-data results: **2001**
          - nonzero vendor reports: **0**
          - spontaneous vendor data: **NO**
          - host application Output reports: **0**
          - new live 0x11 transmitted: **NO**

          Production channel mapping recovered from V32/V33:
          - CH1 -> stock ID 4 -> left channel
          - CH2 -> stock ID 5 -> right channel
          - CH3 -> stock ID 6 -> bass channel
          - CH4 -> stock ID 14 -> i2sout0L
          - CH5 -> stock ID 15 -> i2sout0R
          - CH6 -> stock ID 16 -> i2sout1L
          - CH7 -> candidate stock ID 17 -> i2sout1R

          Mapping confidence:
          - CH1..CH6: **PROVEN from recovered Device Description**
          - CH7 physical name/description: **PROVEN present**
          - CH7 ID 17: **HIGH-CONFIDENCE STRUCTURAL INFERENCE, not exact wire proof**

          Dedicated firmware Gain plan:
          - CH1..CH7 Gain IDs = **22..28**
          - exact collision found in recovered Device Description: **{any_collision}**
          - global absence of 22..28 proven: **NO**
            because **{missing} bytes** remain missing from the captured Device Description.

          V37 establishes that zero-output polling cannot advance the vendor
          protocol: no spontaneous IF4 vendor data appeared in 2001 polls.
          Under the hard rule that new live byte 0x11 is forbidden, no new
          authentication/Device Description live session is currently authorized.

          Status:
          **{status}**

          Flash/erase/write remains: **NO / NO / NO**

          Classification:
          **OFFLINE_PRODUCTION_CHANNEL_MAPPING_AND_GAIN_ID_AUDIT_NOT_FOR_FLASH**
          """

          (ev/"06_V38_FINAL_DECISION.md").write_text(md)
          print(md)
          PY

          python3 /tmp/v38/analyze.py
          cat /tmp/v38/evidence/06_V38_FINAL_DECISION.md >> "$GITHUB_STEP_SUMMARY"

      - name: Package V38 evidence
        shell: bash
        run: |
          set -euo pipefail

          cp /tmp/v38/evidence/* /tmp/v38/out/
          (
            cd /tmp/v38/out
            sha256sum * > SHA256SUMS.txt
          )

      - name: Upload V38 evidence
        uses: actions/upload-artifact@v7
        with:
          name: OKN-BP1048P4-MASTER-V38-PRODUCTION-MAPPING-GAIN-ID-AUDIT-EVIDENCE
          path: /tmp/v38/out/*
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed assertion
        shell: bash
        run: |
          set -euo pipefail

          test "$FLASH_ALLOWED" = "NO"
          test "$ERASE_ALLOWED" = "NO"
          test "$WRITE_ALLOWED" = "NO"
          test "$FEATURE_REPORT_ALLOWED" = "NO"
          test "$LIVE_OUTPUT_ALLOWED" = "NO"
          test "$NEW_LIVE_0X11_ALLOWED" = "NO"

          echo "MASTER_V38=PASS"
          echo "LIVE_OUTPUT_ALLOWED=NO"
          echo "NEW_LIVE_0X11_ALLOWED=NO"
          echo "FLASH_ALLOWED=NO"
