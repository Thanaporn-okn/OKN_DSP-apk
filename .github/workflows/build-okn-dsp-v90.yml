name: Build OKN DSP V90 Reference Real-time UI

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_ANDROID_V90_REFERENCE_REALTIME_UI.zip'
      - 'OKN_DSP_V90_SHA256.txt'
      - '.github/workflows/build-okn-dsp-v90.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify V90 source
        shell: bash
        run: |
          set -euo pipefail
          echo '4d7c811e45ac75221c6a3f649945c61c3e10182245fb0f6f6b07c252f0952c6a  OKN_DSP_ANDROID_V90_REFERENCE_REALTIME_UI.zip' | sha256sum -c -
          rm -rf /tmp/okn_v90
          mkdir -p /tmp/okn_v90
          unzip -q OKN_DSP_ANDROID_V90_REFERENCE_REALTIME_UI.zip -d /tmp/okn_v90

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run V90 preflight and verify stable signing certificate
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/okn_v90
          python3 preflight_v90.py
          echo 'ba1c52f2607c09953c52fdd79c5f72026aaf0adb8aa44bcba277f7d9b49d9511  app/okn_dsp_stable_debug.keystore' | sha256sum -c -
          CERT=$(keytool -list -v -keystore app/okn_dsp_stable_debug.keystore -storepass android -alias androiddebugkey | awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr 'A-F' 'a-f')
          test "$CERT" = 'c3da85af2e978dbd0ed9bb695e5c79a263189595c116ad93a1ded75a2eb98397'
          echo "Stable signing certificate SHA-256: $CERT"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build stable-signed V90 APK
        working-directory: /tmp/okn_v90
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK signing identity and package V90 artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn_v90/app/build/outputs/apk/debug/app-debug.apk
          ARTIFACT_DIR=/tmp/okn_v90/artifact
          test -f "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose "$APK"
          CERT=$($APKSIGNER verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' | tr 'A-F' 'a-f')
          test "$CERT" = 'c3da85af2e978dbd0ed9bb695e5c79a263189595c116ad93a1ded75a2eb98397'

          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"
          cp "$APK" "$ARTIFACT_DIR/OKN_DSP_V90_REFERENCE_REALTIME_UI-debug.apk"
          cp /tmp/okn_v90/README_V90.txt "$ARTIFACT_DIR/"
          cp /tmp/okn_v90/evidence/OKN_DSP_V90_REFERENCE_REALTIME_UI_PLAN.txt "$ARTIFACT_DIR/"
          cp /tmp/okn_v90/evidence/OKN_DSP_V90_REFERENCE_REALTIME_UI_PLAN.json "$ARTIFACT_DIR/"
          printf '%s\n' "$CERT" > "$ARTIFACT_DIR/OKN_DSP_V90_APK_CERT_SHA256.txt"
          sha256sum "$ARTIFACT_DIR/OKN_DSP_V90_REFERENCE_REALTIME_UI-debug.apk" > "$ARTIFACT_DIR/OKN_DSP_V90_REFERENCE_REALTIME_UI-debug.sha256"
          ls -lah "$ARTIFACT_DIR"

      - name: Upload V90 artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN_DSP_V90_REFERENCE_REALTIME_UI
          path: /tmp/okn_v90/artifact/
          if-no-files-found: error
