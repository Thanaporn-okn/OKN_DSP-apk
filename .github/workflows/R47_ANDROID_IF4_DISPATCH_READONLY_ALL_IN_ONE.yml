      - name: R47 hard safety gate - IF4 control IN only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYSAFE'
          from pathlib import Path
          import re
          root=Path('/tmp/r47src/r47_android_source')
          k=(root/'android_template/MainActivity.kt.in').read_text()
          d=(root/'lib/usb_readonly.dart').read_text()

          forbidden=[
              'System.loadLibrary','nativeUsbfsControlTransfer',
              'HID_SET_REPORT','USB_DIR_OUT','bulkTransfer','UsbRequest',
              'setConfiguration','setInterface','SpiFlashErase','SpiFlashWrite',
              'SaveParams','Reset_McuSystem','0x58','0x57','0x11',
              'HID_CONTROL_INTERFACE = 3','IF3_ANDROID_SIGNATURE',
          ]
          bad=[x for x in forbidden if x in k]
          if bad:
              raise SystemExit('forbidden R47 runtime token(s): '+', '.join(bad))

          required=[
              'RUNTIME_READ_INTERFACE = 4',
              'HID_GET_REPORT = 0x01',
              'HID_GET_IDLE = 0x02',
              'HID_GET_PROTOCOL = 0x03',
              'HID_REPORT_TYPE_INPUT = 0x01',
              'HID_REPORT_TYPE_FEATURE = 0x03',
              'IF4_FEATURE_BREQUEST_01_GET_REPORT',
              'IF4_INPUT_BREQUEST_01_GET_REPORT',
              'IF4_FEATURE_BREQUEST_02_GET_IDLE_CODE',
              'IF4_INPUT_BREQUEST_02_GET_IDLE_CODE',
              'IF4_FEATURE_BREQUEST_03_GET_PROTOCOL_CODE',
              'IF4_INPUT_BREQUEST_03_GET_PROTOCOL_CODE',
              'if4_public_dispatch_matches_input_send_path_zlp',
              'requestHex" to "NOT_SENT"',
          ]
          for token in required:
              if token not in k:
                  raise SystemExit('missing R47 proof token: '+token)

          allowed_methods={"scanUsb","inspectHid","requestUsbPermission","ep0Semantics"}
          calls=set(re.findall(r"invoke(?:List)?Method<[^>]+>\(\s*'([^']+)'", d))
          if calls != allowed_methods:
              raise SystemExit(f'unexpected Dart native methods: {sorted(calls)}')

          if 'RUNTIME_GET_REPORT_REQUEST_TYPE' not in k or 'READ_ONLY_REQUEST_TYPE' not in k:
              raise SystemExit('IN request types missing')
          if k.count('controlTransfer(') != 2:
              raise SystemExit('R47 expects GET_DESCRIPTOR + one generic class-IN controlTransfer call site')
          print('PASS R47 safety: IF4 control-IN only; no OUT/SET_REPORT/UFE/native/flash/reset/timing/report-ID matrix')
          PYSAFE

      - name: Validate R47 public-SDK dispatch fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFIX'
          for req in (0x01,0x02,0x03):
              setup=bytearray([0xA1,req,0x00,0x03,0x04,0x00,0x08,0x00])
              setup[0]=0
              expected=f'00 {req:02X} 00 03 04 00 08 00'
              assert bytes(setup).hex(' ').upper() == expected
          print('PASS R47 fixtures: public IF4 Feature branch fingerprints for bRequest 01/02/03')
          PYFIX

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android scaffold and overlay R47 source
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          rm -rf /tmp/okn_r47_app
          flutter create --platforms=android --org com.okn.dsp --project-name okn_dsp_r47 /tmp/okn_r47_app

          rm -rf /tmp/okn_r47_app/lib /tmp/okn_r47_app/test
          cp -a "$R47_SRC/lib" /tmp/okn_r47_app/lib
          cp -a "$R47_SRC/test" /tmp/okn_r47_app/test
          cp "$R47_SRC/pubspec.yaml" /tmp/okn_r47_app/pubspec.yaml
          cp "$R47_SRC/analysis_options.yaml" /tmp/okn_r47_app/analysis_options.yaml
          cp "$R47_SRC/README_R47_TH.txt" /tmp/okn_r47_app/README_R47_TH.txt

          MAIN="$(find /tmp/okn_r47_app/android/app/src/main/kotlin -name MainActivity.kt | head -n1)"
          test -f "$MAIN"
          PKG="$(sed -n 's/^package[[:space:]]\+//p' "$MAIN" | head -n1)"
          test -n "$PKG"
          sed "s/^package __PACKAGE__$/package $PKG/" "$R47_SRC/android_template/MainActivity.kt.in" > "$MAIN"

          MANIFEST=/tmp/okn_r47_app/android/app/src/main/AndroidManifest.xml
          python3 - <<'PYMAN'
          from pathlib import Path
          p=Path('/tmp/okn_r47_app/android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          marker='    <application'
          feature='    <uses-feature android:name="android.hardware.usb.host" android:required="false" />\n'
          if marker not in s:
              raise SystemExit('AndroidManifest application marker missing')
          if 'android.hardware.usb.host' not in s:
              s=s.replace(marker,feature+marker,1)
          p.write_text(s)
          PYMAN

          grep -q 'android.hardware.usb.host' "$MANIFEST"
          grep -q 'IF4_FEATURE_BREQUEST_02_GET_IDLE_CODE' "$MAIN"
          echo "R47_APP=/tmp/okn_r47_app" >> "$GITHUB_ENV"
          echo "R47_MAIN_ACTIVITY=$MAIN" >> "$GITHUB_ENV"

      - name: Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$R47_APP"
          flutter pub get

      - name: Protocol and regression unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$R47_APP"
          flutter test

      - name: Static analysis
        shell: bash
        run: |
          set -euo pipefail
          cd "$R47_APP"
          flutter analyze

      - name: Build Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$R47_APP"
          flutter build apk --debug --target-platform android-arm64
          test -s build/app/outputs/flutter-apk/app-debug.apk

      - name: Post-build R47 safety audit
        shell: bash
        run: |
          set -euo pipefail
          K="$R47_MAIN_ACTIVITY"
          ! grep -Eq 'HID_SET_REPORT|USB_DIR_OUT|bulkTransfer|UsbRequest|setConfiguration|setInterface|SpiFlashErase|SpiFlashWrite|SaveParams|Reset_McuSystem|0x58|0x57|0x11|IF3_ANDROID_SIGNATURE' "$K"
          grep -q 'HID_GET_REPORT = 0x01' "$K"
          grep -q 'HID_GET_IDLE = 0x02' "$K"
          grep -q 'HID_GET_PROTOCOL = 0x03' "$K"
          grep -q 'IF4_FEATURE_BREQUEST_02_GET_IDLE_CODE' "$K"
          grep -q 'IF4_FEATURE_BREQUEST_03_GET_PROTOCOL_CODE' "$K"
          grep -q 'if4_public_dispatch_matches_input_send_path_zlp' "$K"
          test "$(grep -c 'controlTransfer(' "$K")" = "2"
          echo 'PASS post-build R47: IF4 class-IN dispatch fingerprint only'

      - name: Package R47 APK and evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/r47_out
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp "$R47_APP/build/app/outputs/flutter-apk/app-debug.apk" "$OUT/OKN_DSP_R47_IF4_DISPATCH_READONLY_debug.apk"
          cp /tmp/OKN_DSP_R47_IF4_DISPATCH_READONLY_Source.zip "$OUT/OKN_DSP_R47_IF4_DISPATCH_READONLY_Source.zip"
          cp "$R47_APP/README_R47_TH.txt" "$OUT/README_R47_TH.txt"
          cp "$R47_MAIN_ACTIVITY" "$OUT/MainActivity_R47_IF4_DISPATCH_READONLY.kt"
          cat > "$OUT/R47_SAFETY_STATE.txt" <<'EOF'
          RUNTIME_INTERFACE=4
          R30_SIGNATURE_REQUIRED=YES
          CONTROL_IN_ONLY=YES
          SET_REPORT=NO
          UFE_COMMANDS=NO
          CONTROL_0x11=NO
          FLASH_ERASE_PROGRAM_COMMIT=NO
          RESET=NO
          TIMING_MATRIX=NO
          REPORT_ID_MATRIX=NO
          BREQUEST_GET_REPORT=YES
          BREQUEST_GET_IDLE_CODE=YES
          BREQUEST_GET_PROTOCOL_CODE=YES
          INPUT_REPORT_TYPE=YES
          FEATURE_REPORT_TYPE=YES
          EOF
          (cd "$OUT" && sha256sum * > SHA256SUMS.txt)

      - name: Upload R47 APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN_DSP_R47_IF4_DISPATCH_READONLY_APK
          path: /tmp/r47_out/*
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        shell: bash
        run: |
          {
            echo '## R47 Android IF4 class-dispatch read-only fingerprint'
            echo '- Triggered by R46: IF4 Feature GET_REPORT matches public SDK while IF3 signature stalls and IF4 Input stays 0B'
            echo '- Offline source review shows IsAndroid() call is commented out, so IF3 is retired as a gate'
            echo '- Probes only IF4 control-IN using bRequest 01/02/03 with Input/Feature report types'
            echo '- Distinguishes public-style dispatcher (ignores bRequest) from production bRequest-specific handling'
            echo '- No SET_REPORT, no 0x58/0x57/0x11, no flash/reset, no timing/report-ID matrix'
          } >> "$GITHUB_STEP_SUMMARY"
