name: R186 N9 first-seven raw-dispatch replay static proof

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R186_FIRST7_RAW_DISPATCH_REPLAY_STATIC_PROOF.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r186-static-${{ github.ref }}
  cancel-in-progress: true

env:
  FLASH_ALLOWED: "NO"

jobs:
  static_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          mkdir -p /tmp/r186/evidence

          cat > /tmp/r186/evidence/R186_SAFETY.txt <<'EOF'
          MODE=OFFLINE_STATIC_RAW_IL_REPLAY_ONLY
          FLASH_ALLOWED=NO
          USB_OR_BOARD_CONTACT=NO
          VENDOR_EXE_DLL_APK_EXECUTED=NO
          AES_OR_CRYPTOSTREAM_DECRYPT_EXECUTED=NO
          UFE_RUNTIME_TX_SENT=NO
          FLASH_READ_ERASE_WRITE_EXECUTED=NO
          DISCOVERED_FRAME_LIVE_AUTHORIZED=NO
          HARDWARE_MODIFICATION=FORBIDDEN
          EOF

      - name: Download pinned R185 evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: "10911851525"
          path: /tmp/r186/r185
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 36259036697

      - name: Download pinned R183 key-IV evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: "10907227154"
          path: /tmp/r186/r183
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 36245531797

      - name: Download pinned R181 comparison evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: "10905530304"
          path: /tmp/r186/r181
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 36238250238

      - name: Download pinned R157 raw IL evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: "10820682068"
          path: /tmp/r186/r157
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 36028455796

      - name: Replay first seven words directly from dispatcher IL
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib
          import io
          import json
          import re
          import struct
          import zipfile

          MASK32 = 0xffffffff

          def u32(x):
              return int(x) & MASK32

          base = Path("/tmp/r186")
          out = base / "evidence"
          out.mkdir(parents=True, exist_ok=True)

          def open_inner(folder, filename, expected_sha):
              p = base / folder / filename
              data = p.read_bytes()
              got = hashlib.sha256(data).hexdigest()
              assert got == expected_sha, (filename, got, expected_sha)

              side = p.with_name(p.name + ".sha256")
              assert side.exists(), f"missing {side}"
              assert side.read_text().split()[0] == expected_sha

              return zipfile.ZipFile(io.BytesIO(data))

          # ------------------------------------------------------------
          # Pin the immediately previous gate.
          # ------------------------------------------------------------
          r185 = open_inner(
              "r185",
              "R185_N9_POST_STATE404_BRANCH_CLOSURE_STATIC_EVIDENCE.zip",
              "a1cb6867c5d33bafe83cb489a372d21986d5cf22f6abfe2612d98b2f14e265d0",
          )
          d185 = json.loads(r185.read("R185_DECISION.json"))
          assert d185["revision"] == "R185"
          assert d185["POST_STATE404_BRANCH_CLUSTER_CLOSED_FOR_OFFICIAL_DIRECT_EXE_MODEL"] is True
          assert d185["R180_HASHTABLE_CONTRADICTION_STILL_STANDS"] is True
          assert d185["FLASH_ALLOWED"] is False

          # R183 independently reconstructed the post-state404 key.
          r183 = open_inner(
              "r183",
              "R183_N9_KEY_IV_PROVENANCE_CLOSURE_STATIC_EVIDENCE.zip",
              "47fcd307237c1584ca2f364c355da80479bbc275a17f0a54646445ec6e958c05",
          )
          d183 = json.loads(r183.read("R183_DECISION.json"))
          assert d183["revision"] == "R183"
          assert d183["LOCAL17_RAW_IL_RECONSTRUCTION_PROVEN"] is True
          assert d183["LOCAL100_RAW_IL_RECONSTRUCTION_PROVEN"] is True
          assert d183["POST_STATE404_KEY_MATCHES_R153"] is True
          assert d183["FLASH_ALLOWED"] is False

          post_key = bytes.fromhex(d183["POST_STATE404_KEY_HEX"])
          assert len(post_key) == 32

          # R181 is comparison only. It is NOT used to build the replay.
          r181 = open_inner(
              "r181",
              "R181_N9_FIRST7_WORD_LOCALIZATION_STATIC_EVIDENCE.zip",
              "6fadc12b2596635d566e8740df945db089edc27e042adc483e235a104e73f64e",
          )
          d181 = json.loads(r181.read("R181_DECISION.json"))
          assert d181["revision"] == "R181"
          assert d181["STATE565_VALUE_REPRODUCED_FROM_FIRST7_WORDS_ONLY"] is True
          assert d181["FLASH_ALLOWED"] is False

          # Raw IL/resource source.
          r157 = open_inner(
              "r157",
              "R157_N9_LOCAL29_LOCAL81_NONNULL_LOCAL93_LOOP_BRANCH_EVIDENCE.zip",
              "f974c64c63eea5f2b940c76101f4ab6e769803f5630a2d87d21d08679c321609",
          )

          prefix = (
              "r156/r155/r154/r153/r152/r151/r150/r149/r148/r147/"
              "r146/r145/r144/r143/"
          )
          raw = r157.read(prefix + "R143_N9_METHOD.il")
          n9_sha = hashlib.sha256(raw).hexdigest()
          assert n9_sha == \
              "5a3964c1f4bd8db455e6882a4ce6f90667e1a9abc6e1fafd10440b31006e4a33"
          text = raw.decode()

          h15 = r157.read(
              prefix +
              "r142/R142_EXTRACTED_MANAGED_RESOURCES/"
              "02_h15IL2i6yy2BZV8RqM.YuRwd1JALC4oy32W66.bin"
          )
          assert len(h15) == 607967
          assert hashlib.sha256(h15).hexdigest() == \
              "a46885bb2f09a600f6f16e6206f49d304ca829d441c5077b360b25ac8e6a33aa"

          # ------------------------------------------------------------
          # Parse raw dispatcher blocks. R170 is deliberately not downloaded
          # or read anywhere in R186.
          # ------------------------------------------------------------
          rows = []
          for line in text.splitlines():
              m = re.match(
                  r"\s*(IL_[0-9a-fA-F]+):\s+(\S+)(?:\s+(.*))?$",
                  line
              )
              if m:
                  rows.append((
                      m.group(1),
                      m.group(2),
                      (m.group(3) or "").split(" //", 1)[0].strip()
                  ))

          pos = {lab:i for i,(lab,_,_) in enumerate(rows)}
          sm = re.search(r"IL_0012:\s+switch \((.*?)\)\n", text, re.S)
          assert sm
          targets = [x.strip() for x in sm.group(1).split(",")]
          assert len(targets) == 689
          state_of = {lab:i for i,lab in enumerate(targets)}

          tpos = sorted((pos[lab], st, lab) for st,lab in enumerate(targets))
          blocks = {}
          for i,(p0,st,lab) in enumerate(tpos):
              p1 = tpos[i+1][0] if i + 1 < len(tpos) else len(rows)
              blocks[st] = rows[p0:p1]

          def ops(st):
              return [(op,arg) for _,op,arg in blocks[st]]

          # Pin the exact setup from local12/h15 to the full-word loop.
          assert ops(604) == [
              ("ldloc.s","12"), ("stloc.s","27"),
              ("ldc.i4","149"), ("br","IL_0012")
          ]
          assert ops(149)[:6] == [
              ("ldloc.s","27"), ("ldlen",""), ("conv.i4",""),
              ("ldc.i4.4",""), ("rem",""), ("stloc.s","80")
          ]
          assert ops(273)[:6] == [
              ("ldloc.s","27"), ("ldlen",""), ("conv.i4",""),
              ("ldc.i4.4",""), ("div",""), ("stloc.s","98")
          ]
          assert ops(668)[:5] == [
              ("ldloc.s","27"), ("ldlen",""), ("conv.i4",""),
              ("newarr","[mscorlib]System.Byte"), ("stloc.s","37")
          ]
          assert ops(484)[:6] == [
              ("ldloc.s","47"), ("ldlen",""), ("conv.i4",""),
              ("ldc.i4.4",""), ("div",""), ("stloc.s","118")
          ]
          assert ops(235)[:2] == [("ldc.i4.0",""), ("stloc.s","105")]
          assert ops(630)[:2] == [("ldc.i4.0",""), ("stloc.s","53")]
          assert ops(589)[:2] == [("ldc.i4.0",""), ("stloc.s","82")]

          # ------------------------------------------------------------
          # Minimal raw-IL interpreter for only the states actually visited
          # through the first seven complete 32-bit output words.
          # It follows dispatcher branches from IL itself rather than using
          # R170's reaching-definition schedule.
          # ------------------------------------------------------------
          def ldc_value(op, arg):
              if op in ("ldc.i4","ldc.i4.s"):
                  return u32(int(arg))
              if op.startswith("ldc.i4."):
                  tail = op[len("ldc.i4."):]
                  if tail == "m1":
                      return 0xffffffff
                  if tail.isdigit():
                      return int(tail)
              return None

          locals_ = {
              12: bytearray(h15),
              47: bytearray(post_key),
          }

          state = 604
          visited = []
          trace = []
          state46_entry = None

          for step in range(10000):
              visited.append(state)
              block = blocks[state]
              stack = []
              next_state = None
              pc = 0

              if state == 46:
                  state46_entry = locals_[105]

              while pc < len(block):
                  lab, op, arg = block[pc]

                  c = ldc_value(op, arg)
                  if c is not None:
                      stack.append(c)
                      pc += 1
                      continue

                  if op in ("ldloc","ldloc.s"):
                      stack.append(locals_.get(int(arg), 0))
                      pc += 1
                      continue

                  if op in ("stloc","stloc.s"):
                      locals_[int(arg)] = stack.pop()
                      pc += 1
                      continue

                  if op == "ldlen":
                      stack.append(len(stack.pop()))
                      pc += 1
                      continue

                  if op == "newarr":
                      n = stack.pop()
                      assert "System.Byte" in arg
                      stack.append(bytearray(n))
                      pc += 1
                      continue

                  if op == "ldelem.u1":
                      idx = stack.pop()
                      arr = stack.pop()
                      stack.append(arr[idx])
                      pc += 1
                      continue

                  if op == "stelem.i1":
                      value = stack.pop()
                      idx = stack.pop()
                      arr = stack.pop()
                      arr[idx] = value & 0xff
                      pc += 1
                      continue

                  if op == "dup":
                      stack.append(stack[-1])
                      pc += 1
                      continue

                  if op == "pop":
                      stack.pop()
                      pc += 1
                      continue

                  if op in (
                      "conv.i4","conv.i8","conv.u",
                      "conv.r.un","conv.r8"
                  ):
                      pc += 1
                      continue

                  if op == "conv.u1":
                      stack[-1] &= 0xff
                      pc += 1
                      continue

                  if op == "conv.u4":
                      stack[-1] = u32(stack[-1])
                      pc += 1
                      continue

                  if op in (
                      "add","sub","xor","and","or","mul",
                      "div","rem","shl","shr.un"
                  ):
                      b = stack.pop()
                      a = stack.pop()

                      if op == "add":
                          v = u32(a + b)
                      elif op == "sub":
                          v = u32(a - b)
                      elif op == "xor":
                          v = u32(a ^ b)
                      elif op == "and":
                          v = u32(a & b)
                      elif op == "or":
                          v = u32(a | b)
                      elif op == "mul":
                          v = u32(a * b)
                      elif op == "div":
                          aa = a if a < 0x80000000 else a - 0x100000000
                          bb = b if b < 0x80000000 else b - 0x100000000
                          assert bb != 0
                          v = u32(int(aa / bb))
                      elif op == "rem":
                          aa = a if a < 0x80000000 else a - 0x100000000
                          bb = b if b < 0x80000000 else b - 0x100000000
                          assert bb != 0
                          q = int(aa / bb)
                          v = u32(aa - q * bb)
                      elif op == "shl":
                          v = u32(a << (b & 31))
                      else:
                          v = (a & MASK32) >> (b & 31)

                      stack.append(v)
                      pc += 1
                      continue

                  if op == "call":
                      if "zfos5ENLukrcbiO4qNQ" in arg:
                          stack.append(1)
                      elif "omTjeHNp0inHSoSsOBH" in arg:
                          stack.append(0)
                      else:
                          raise AssertionError(
                              ("unsupported call in first-seven replay",
                               state, lab, arg)
                          )
                      pc += 1
                      continue

                  if op in (
                      "blt","ble","bgt","bge",
                      "bne.un","beq","brtrue","brfalse"
                  ):
                      if op in ("brtrue","brfalse"):
                          v = stack.pop()
                          take = bool(v) if op == "brtrue" else not bool(v)
                      else:
                          b = stack.pop()
                          a = stack.pop()
                          sa = a if a < 0x80000000 else a - 0x100000000
                          sb = b if b < 0x80000000 else b - 0x100000000

                          if op == "blt":
                              take = sa < sb
                          elif op == "ble":
                              take = sa <= sb
                          elif op == "bgt":
                              take = sa > sb
                          elif op == "bge":
                              take = sa >= sb
                          elif op == "bne.un":
                              take = a != b
                          else:
                              take = a == b

                      if take:
                          if arg == "IL_0012":
                              next_state = stack.pop()
                          elif arg == "IL_000e":
                              next_state = locals_[95]
                          elif arg in state_of:
                              next_state = state_of[arg]
                          else:
                              internal = [
                                  i for i,(x,_,_) in enumerate(block)
                                  if x == arg
                              ]
                              assert internal, (state, lab, arg)
                              pc = internal[0]
                              continue
                          break

                      pc += 1
                      continue

                  if op == "br":
                      if arg == "IL_0012":
                          next_state = stack.pop()
                      elif arg == "IL_000e":
                          next_state = locals_[95]
                      elif arg in state_of:
                          next_state = state_of[arg]
                      else:
                          internal = [
                              i for i,(x,_,_) in enumerate(block)
                              if x == arg
                          ]
                          assert internal, (state, lab, arg)
                          pc = internal[0]
                          continue
                      break

                  raise AssertionError(
                      ("unsupported opcode in first-seven replay",
                       state, lab, op, arg)
                  )

              if state == 57:
                  i = locals_[38]
                  key_offset = locals_[110] * 4
                  trace.append({
                      "word_index": i,
                      "local38": locals_[38],
                      "local110": locals_[110],
                      "key_offset": key_offset,
                      "local53_key_word_u32": locals_[53],
                      "state46_input_u32": state46_entry,
                      "state46_output_u32": locals_[105],
                      "local76_h15_offset": locals_[76],
                      "local82_h15_word_u32": locals_[82],
                      "local24_output_word_u32": locals_[24],
                      "local67_output_offset": locals_[67],
                  })

              # Stop immediately after the seventh completed word increments
              # local38 from 6 to 7.
              if state == 451 and locals_[38] == 7:
                  assert next_state == 458
                  break

              assert next_state is not None, (
                  "state had no dispatcher successor", state, ops(state), stack
              )
              state = next_state
          else:
              raise AssertionError("bounded first-seven replay did not finish")

          setup_states = [
              604,149,273,668,484,235,630,589,436,477,370,60,32
          ]
          one_word_states = [
              458,539,313,2,117,141,502,215,15,299,
              342,664,46,33,57,321,95,199,617,451
          ]
          assert visited == setup_states + one_word_states * 7

          assert locals_[80] == 3
          assert locals_[98] == 151992
          assert locals_[118] == 8
          assert locals_[38] == 7
          assert len(trace) == 7

          local37_first28 = bytes(locals_[37][:28])
          replay_words = [
              struct.unpack_from("<I", local37_first28, i*4)[0]
              for i in range(7)
          ]

          # Comparison happens only after the independent replay is complete.
          assert replay_words == d181["FIRST7_LOCAL37_WORDS_U32"]

          expected_trace = d181["FIRST7_TRACE"]
          assert len(expected_trace) == 7

          for a,b in zip(trace, expected_trace):
              assert a["word_index"] == b["word_index"]
              assert a["local53_key_word_u32"] == b["key_word_u32"]
              assert a["state46_input_u32"] == b["state46_input_u32"]
              assert a["state46_output_u32"] == b["state46_output_u32"]
              assert a["local82_h15_word_u32"] == b["h15_word_u32"]
              assert a["local24_output_word_u32"] == b["local37_word_u32"]

          # Apply the already-proven state179 low-32 XOR to the first four
          # 8-byte lanes only as a post-replay cross-check.
          local29_words = []
          for i,w in enumerate(replay_words):
              if i % 2 == 0:
                  local29_words.append(u32(w ^ 0x3800CD0D))
              else:
                  local29_words.append(w)

          assert local29_words == d181["FIRST7_LOCAL29_WORDS_U32"]

          state565_i32 = struct.unpack(
              "<i", struct.pack("<I", local29_words[6])
          )[0]
          assert state565_i32 == 1921932524
          assert state565_i32 == d185["STATE565_INT32_FROM_R179"]

          decision = {
              "revision": "R186",

              "R185_RUN_ID": 36259036697,
              "R185_ARTIFACT_ID": 10911851525,
              "R185_ARTIFACT_DIGEST":
                  "sha256:e19c088076049fd30320e5595e067305c65a43930a5fab0c09c2c6584d5a9921",
              "R185_INNER_SHA256":
                  "a1cb6867c5d33bafe83cb489a372d21986d5cf22f6abfe2612d98b2f14e265d0",

              "R170_ARTIFACT_DOWNLOADED": False,
              "R170_DECISION_USED_AS_INPUT": False,
              "RAW_DISPATCH_IL_DIRECTLY_INTERPRETED": True,

              "REPLAY_START_STATE": 604,
              "REPLAY_END_AFTER_LOCAL38": 7,
              "SETUP_STATE_SEQUENCE": setup_states,
              "PER_WORD_STATE_SEQUENCE": one_word_states,
              "TOTAL_VISITED_STATE_COUNT": len(visited),

              "LOCAL80_REMAINDER": locals_[80],
              "LOCAL98_CEIL_WORD_COUNT": locals_[98],
              "LOCAL118_KEY_WORD_COUNT": locals_[118],

              "FIRST7_RAW_REPLAY_TRACE": trace,
              "FIRST7_LOCAL37_HEX": local37_first28.hex(),
              "FIRST7_LOCAL37_WORDS_U32": replay_words,

              "FIRST7_MATCH_R181": True,
              "FIRST7_LOCAL29_WORDS_U32_AFTER_PROVEN_STATE179_XOR":
                  local29_words,
              "STATE565_INT32_REPRODUCED": state565_i32,

              "R170_REACHING_DEFINITION_SCHEDULE_ERROR_FOUND": False,
              "FIRST7_CONTROL_FLOW_OR_REACHING_DEFINITION_MISMATCH_FOUND":
                  False,

              "R180_HASHTABLE_CONTRADICTION_STILL_STANDS": True,

              "INTERPRETATION":
                  "A direct mini-interpreter followed the raw N9 dispatcher from "
                  "state604 through seven complete reconstruction words without "
                  "loading R170. The visited state sequence and all first-seven "
                  "key/source/transform/output values independently match R181. "
                  "Therefore the first-seven reaching-definition/control-flow "
                  "schedule does not explain the Hashtable contradiction.",

              "NEXT":
                  "R187: remain fully offline and audit the exact exception-handling "
                  "regions around state565's Hashtable(int) constructor. R180 proves "
                  "the constructor overflows for the reproduced capacity, so determine "
                  "whether that exception is intentionally caught and redirected by "
                  "N9 instead of assuming normal state565->543 continuation. Prove the "
                  "handler type, protected IL range, handler target, and successor "
                  "state from raw IL/exception metadata. Do not execute vendor binaries, "
                  "decrypt, contact USB, or flash.",

              "AES_OR_CRYPTOSTREAM_DECRYPT_EXECUTED": False,
              "OFFLINE_DECRYPT_AUTHORIZED": False,
              "VENDOR_BINARY_EXECUTED": False,
              "USB_OR_BOARD_CONTACTED": False,
              "ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD": False,
              "FLASH_ALLOWED": False,
          }

          (out / "R186_DECISION.json").write_text(
              json.dumps(decision, indent=2) + "\n"
          )
          (out / "R186_FIRST7_RAW_REPLAY_TRACE.json").write_text(
              json.dumps(trace, indent=2) + "\n"
          )
          (out / "R186_FIRST7_LOCAL37.bin").write_bytes(local37_first28)

          print(json.dumps(decision, indent=2))
          PYCODE

      - name: Package R186 evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r186/evidence
          zip -9 -r /tmp/R186_N9_FIRST7_RAW_DISPATCH_REPLAY_STATIC_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/R186_N9_FIRST7_RAW_DISPATCH_REPLAY_STATIC_EVIDENCE.zip \
            > /tmp/R186_N9_FIRST7_RAW_DISPATCH_REPLAY_STATIC_EVIDENCE.zip.sha256

      - name: Upload R186 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: R186-N9-FIRST7-RAW-DISPATCH-REPLAY-STATIC-EVIDENCE
          path: |
            /tmp/R186_N9_FIRST7_RAW_DISPATCH_REPLAY_STATIC_EVIDENCE.zip
            /tmp/R186_N9_FIRST7_RAW_DISPATCH_REPLAY_STATIC_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"

          grep -F '"R170_ARTIFACT_DOWNLOADED": false' /tmp/r186/evidence/R186_DECISION.json
          grep -F '"RAW_DISPATCH_IL_DIRECTLY_INTERPRETED": true' /tmp/r186/evidence/R186_DECISION.json
          grep -F '"FIRST7_MATCH_R181": true' /tmp/r186/evidence/R186_DECISION.json
          grep -F '"STATE565_INT32_REPRODUCED": 1921932524' /tmp/r186/evidence/R186_DECISION.json
          grep -F '"R170_REACHING_DEFINITION_SCHEDULE_ERROR_FOUND": false' /tmp/r186/evidence/R186_DECISION.json
          grep -F '"FIRST7_CONTROL_FLOW_OR_REACHING_DEFINITION_MISMATCH_FOUND": false' /tmp/r186/evidence/R186_DECISION.json
          grep -F '"R180_HASHTABLE_CONTRADICTION_STILL_STANDS": true' /tmp/r186/evidence/R186_DECISION.json
          grep -F '"USB_OR_BOARD_CONTACTED": false' /tmp/r186/evidence/R186_DECISION.json
          grep -F '"FLASH_ALLOWED": false' /tmp/r186/evidence/R186_DECISION.json

          echo R186_FIRST7_RAW_DISPATCH_REPLAY_STATIC_PROOF=YES
          echo FLASH_ALLOWED=NO
