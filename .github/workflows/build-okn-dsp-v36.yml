name: Build OKN DSP V36 Pre-Auth RandKey Trace

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_ANDROID_V36_PREAUTH_RANDKEY_TRACE.zip'
      - '.github/workflows/build-okn-dsp-v36.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore V36 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/okn_v36
          mkdir -p /tmp/okn_v36
          unzip -q OKN_DSP_ANDROID_V36_PREAUTH_RANDKEY_TRACE.zip -d /tmp/okn_v36
          test -f /tmp/okn_v36/app/src/main/java/com/okn/dsp/MainActivity.kt
          test -f /tmp/okn_v36/app/src/main/java/com/okn/dsp/protocol/RandKeyPreAuthLab.kt
          test -f /tmp/okn_v36/tools/reference/golopine_250401.apk
          grep -q '2.2.0-v36-preauth-randkey-trace' /tmp/okn_v36/app/build.gradle.kts
          grep -q 'PRE-AUTH RANDKEY TRACE REPORT' /tmp/okn_v36/app/src/main/java/com/okn/dsp/EvidenceLabActivity.kt
          echo 'V36 source restored and verified'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/okn_v36
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Package APK + proof
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn_v36/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          mkdir -p apk_artifact
          cp "$APK" apk_artifact/OKN_DSP_V36_PREAUTH_RANDKEY_TRACE-debug.apk
          sha256sum apk_artifact/OKN_DSP_V36_PREAUTH_RANDKEY_TRACE-debug.apk > apk_artifact/OKN_DSP_V36_PREAUTH_RANDKEY_TRACE-debug.sha256
          cp /tmp/okn_v36/evidence/OKN_DSP_V36_PREAUTH_RANDKEY_BASELINE.txt apk_artifact/
          cp /tmp/okn_v36/evidence/OKN_DSP_V36_PREAUTH_RANDKEY_BASELINE.json apk_artifact/
          cp /tmp/okn_v36/evidence/OKN_DSP_V35_PROTOCOL_PROOF.txt apk_artifact/
          ls -lh apk_artifact/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-V36-PREAUTH-RANDKEY-TRACE-debug-apk
          path: apk_artifact/
          if-no-files-found: error
          retention-days: 30

  aot-randkey-trace:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore V36 and extract reference AOT
        shell: bash
        run: |
          set -euo pipefail
          rm -rf v36 target blutter_pkg blutter_out artifact
          mkdir -p v36 target artifact
          unzip -q OKN_DSP_ANDROID_V36_PREAUTH_RANDKEY_TRACE.zip -d v36
          APK='v36/tools/reference/golopine_250401.apk'
          test -f "$APK"
          unzip -j "$APK" 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d target
          sha256sum target/libapp.so target/libflutter.so | tee target/SHA256SUMS.txt
          strings target/libflutter.so | grep -E '^[0-9]+\.[0-9]+\.[0-9]+ \(stable\)' | head -n 3 | tee target/dart_runtime.txt || true
          strings -t x target/libapp.so | grep -Ei 'RandKey|authentication response data length|AES/|cfb8|CFB-8|ENCRYPTED_SIZE|notify_encryption_required' | tee target/static_string_offsets.txt || true

      - name: Download Blutter Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 3 \
            'https://github.com/AcE77505/blutter-standalone/releases/download/v1.0/blutter_android.zip' \
            -o blutter_android.zip
          mkdir -p blutter_pkg
          unzip -q blutter_android.zip -d blutter_pkg
          BLUTTER_SH=$(find blutter_pkg -type f -name blutter.sh | head -n 1)
          test -n "$BLUTTER_SH"
          chmod +x "$BLUTTER_SH" || true
          find "$(dirname "$BLUTTER_SH")" -maxdepth 1 -type f -name 'blutter*' -exec chmod +x {} \; || true
          echo "BLUTTER_SH=$BLUTTER_SH" >> "$GITHUB_ENV"

      - name: Run Blutter on 250401 reference
        shell: bash
        run: |
          set +e
          "$BLUTTER_SH" -i "$GITHUB_WORKSPACE/target/libapp.so" -o "$GITHUB_WORKSPACE/blutter_out" 2>&1 | tee target/blutter_run.log
          RC=${PIPESTATUS[0]}
          echo "blutter_rc=$RC" | tee -a target/blutter_run.log
          exit 0

      - name: Extract RandKey call-site evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 v36/tools/analyze_randkey_trace.py --root blutter_out --target target --out artifact
          cp target/SHA256SUMS.txt artifact/ || true
          cp target/dart_runtime.txt artifact/ || true
          cp target/static_string_offsets.txt artifact/ || true
          cp target/blutter_run.log artifact/ || true
          cp v36/evidence/OKN_DSP_V36_PREAUTH_RANDKEY_BASELINE.txt artifact/
          cp v36/evidence/OKN_DSP_V36_PREAUTH_RANDKEY_BASELINE.json artifact/
          if [ -f blutter_out/pp.txt ]; then cp blutter_out/pp.txt artifact/; fi
          if [ -f blutter_out/objs.txt ]; then cp blutter_out/objs.txt artifact/; fi
          if [ -d blutter_out/asm ]; then tar -czf artifact/blutter_asm.tar.gz -C blutter_out asm; fi
          ls -lh artifact/

      - name: Upload AOT RandKey trace artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-V36-AOT-RANDKEY-TRACE
          path: artifact/
          if-no-files-found: error
          retention-days: 14
