      # setup-gradle scans Gradle project files, so the generated project must exist first.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Verify frozen protocol core and V6 round-trip verifier
        shell: bash
        run: |
          set -euo pipefail
          echo "e40bac569ec09021a9eb5d7751784d2d74383aaa3ff6e3ab7fec7cbabc34dc10  app/src/main/java/com/okn/peramp/DspProtocol.java" | sha256sum -c -
          echo "3306c3d3aec10a4520b63cbb788c816ec7a2f99d466d402383c4068831cfbdfd  app/src/main/java/com/okn/peramp/BleManager.java" | sha256sum -c -

      - name: Validate PEQ safety reset and V6 no-unknown-TX gate
        shell: bash
        run: |
          set -euo pipefail
          python3 Sources/validate_v38_gate.py
          python3 Sources/validate_v39_reset_v6.py
          python3 Sources/validate_oknpv6.py

      - name: Build Debug and Release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk OKNPV6-debug.apk
          cp app/build/outputs/apk/release/app-release.apk OKNPV6-release.apk

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging OKNPV6-debug.apk | tee OKNPV6-apk-badging.txt
          grep -q "package: name='com.okn.peramp' versionCode='6000' versionName='6.0.0'" OKNPV6-apk-badging.txt
          grep -q "application-label:'OKN Peramp'" OKNPV6-apk-badging.txt

      - name: Package generated source evidence and checksums
        shell: bash
        run: |
          set -euo pipefail
          zip -qr OKNPV6-source.zip app Sources build.gradle settings.gradle gradle.properties -x '*/build/*' -x '.gradle/*'
          cp Sources/OKNPV6_REVERSE_CHECKPOINT.txt OKNPV6-REVERSE-CHECKPOINT.txt
          cp Sources/OKNPV6_BUILD_NOTES.txt OKNPV6-BUILD-NOTES.txt
          sha256sum OKNPV6-debug.apk OKNPV6-release.apk OKNPV6-source.zip OKNPV6-REVERSE-CHECKPOINT.txt OKNPV6-BUILD-NOTES.txt > OKNPV6-SHA256SUMS.txt
          cat OKNPV6-SHA256SUMS.txt

      - name: Upload OKNPV6 artifact
        uses: actions/upload-artifact@v7
        with:
          name: OKNPV6
          path: |
            OKNPV6-debug.apk
            OKNPV6-release.apk
            OKNPV6-source.zip
            OKNPV6-SHA256SUMS.txt
            OKNPV6-apk-badging.txt
            OKNPV6-REVERSE-CHECKPOINT.txt
            OKNPV6-BUILD-NOTES.txt
          if-no-files-found: error
          retention-days: 30
