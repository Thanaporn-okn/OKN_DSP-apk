name: Build OKN DSP V2 Audio Stutter Fix

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_ANDROID_V2_AUDIO_STUTTER_FIX.zip'
      - '.github/workflows/build-okn-dsp-v2.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and extract V2 source
        shell: bash
        run: |
          set -euo pipefail
          echo '605772abbfd772277d4344ddd55928548ee7c13f40455c948f637e41b4016b07  OKN_DSP_ANDROID_V2_AUDIO_STUTTER_FIX.zip' | sha256sum -c -
          rm -rf /tmp/okn_v2
          mkdir -p /tmp/okn_v2
          unzip -q OKN_DSP_ANDROID_V2_AUDIO_STUTTER_FIX.zip -d /tmp/okn_v2
          test -f /tmp/okn_v2/preflight_v2.py
          test -f /tmp/okn_v2/evidence/OKN_DSP_V2_UI_MASTER_REFERENCE.png
          test -f /tmp/okn_v2/evidence/OKN_DSP_V2_AUDIO_STUTTER_FIX_BASIS.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run V2 preflight and verify stable signing identity
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/okn_v2
          python3 preflight_v2.py
          echo 'ba1c52f2607c09953c52fdd79c5f72026aaf0adb8aa44bcba277f7d9b49d9511  app/okn_dsp_stable_debug.keystore' | sha256sum -c -
          CERT=$(keytool -list -v -keystore app/okn_dsp_stable_debug.keystore -storepass android -alias androiddebugkey | awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr 'A-F' 'a-f')
          test "$CERT" = 'c3da85af2e978dbd0ed9bb695e5c79a263189595c116ad93a1ded75a2eb98397'
          echo "Stable signing certificate SHA-256: $CERT"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build V2 stable-signed debug APK
        working-directory: /tmp/okn_v2
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify V2 APK identity and signer
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn_v2/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          CERT=$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' /tmp/apksigner.txt | tr -d ':' | tr 'A-F' 'a-f')
          test "$CERT" = 'c3da85af2e978dbd0ed9bb695e5c79a263189595c116ad93a1ded75a2eb98397'
          BADGING=$("$AAPT" dump badging "$APK" | head -1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='com.okn.dsp'"
          echo "$BADGING" | grep -q "versionCode='2'"
          echo "$BADGING" | grep -q "versionName='1.0.1-v2-audio-stutter-fix'"
          mkdir -p /tmp/artifact
          cp "$APK" /tmp/artifact/OKN_DSP_V2_AUDIO_STUTTER_FIX-debug.apk

      - name: Upload V2 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-V2-AUDIO-STUTTER-FIX-debug-apk
          path: /tmp/artifact/OKN_DSP_V2_AUDIO_STUTTER_FIX-debug.apk
          if-no-files-found: error
