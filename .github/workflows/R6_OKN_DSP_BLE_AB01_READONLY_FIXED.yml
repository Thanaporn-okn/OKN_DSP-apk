name: OKN-DSP R6 FIX ALL-IN-ONE BLE AB01 Read-Only Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/R6_OKN_DSP_BLE_AB01_READONLY_FIXED.yml'

permissions:
  contents: read

env:
  FLASH_ALLOWED: 'NO'
  DSP_TX_ALLOWED: 'NO'
  BLE_READ_WHITELIST: '2A00,AB01'
  BLE_GATT_WRITE_ALLOWED: 'NO'
  BLE_CCCD_WRITE_ALLOWED: 'NO'
  BLE_NOTIFICATION_SUBSCRIBE_ALLOWED: 'NO'
  ANDROID_HOME: '/usr/local/lib/android/sdk'
  ANDROID_SDK_ROOT: '/usr/local/lib/android/sdk'

jobs:
  build-r6-fixed:
    name: Build OKN-DSP R6 fixed BLE AB01 read-only APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          echo "OKN_DSP_R6_FIXED=YES"
          echo "BLE_READ_WHITELIST=2A00,AB01"
          echo "BLE_GATT_WRITE_ALLOWED=NO"
          echo "BLE_CCCD_WRITE_ALLOWED=NO"
          echo "BLE_NOTIFICATION_SUBSCRIBE_ALLOWED=NO"
          echo "DSP_TX_ALLOWED=NO"
          echo "FLASH_ALLOWED=NO"

