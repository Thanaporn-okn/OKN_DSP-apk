      - name: Firmware host build and unit tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S /tmp/okn-r6-work/okn-r6/firmware                 -B /tmp/okn-r6-work/okn-r6/firmware/build                 -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build /tmp/okn-r6-work/okn-r6/firmware/build
          ctest --test-dir /tmp/okn-r6-work/okn-r6/firmware/build --output-on-failure

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify R6 BLE safety gates
        shell: bash
        run: |
          set -euo pipefail
          APP=/tmp/okn-r6-work/okn-r6/android-app/app
          BT="$APP/src/main/java/com/okn/dsp/BluetoothInspector.java"

          grep -F 'applicationId = "com.okn.dsp.r6"' "$APP/build.gradle.kts"
          grep -F '00002a00-0000-1000-8000-00805f9b34fb' "$BT"
          grep -F '0000ab01-0000-1000-8000-00805f9b34fb' "$BT"
          grep -F 'readCharacteristic(ch)' "$BT"
          grep -F 'public void refreshPaired()' "$BT"

          if grep -RInE '\.writeCharacteristic\(|\.writeDescriptor\(|\.setCharacteristicNotification\(|getOutputStream\(' "$APP/src/main/java"; then
            echo "Forbidden write/subscription path found"
            exit 1
          fi

          if grep -RInE 'chiperas|codedata|bootdat|constdat|cnfgdat|btupdat|upinfo|SpiFlashWrite|SpiFlashErase' "$APP/src/main/java"; then
            echo "Forbidden flash/update symbol found"
            exit 1
          fi

          grep -F 'OKN_RUNTIME_USB_TX_ENABLED", "false"' "$APP/build.gradle.kts"
          grep -F 'OKN_PRODUCTION_FLASH_ENABLED", "false"' "$APP/build.gradle.kts"
          echo "R6_FIXED_SAFETY_GATE=PASS"

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build OKN-DSP R6 fixed APK
        working-directory: /tmp/okn-r6-work/okn-r6/android-app
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn-r6-work/okn-r6/android-app/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          cp "$APK" /tmp/OKN-DSP-R6-v0.1.4-ab01-readonly-fixed.apk
          sha256sum /tmp/OKN-DSP-R6-v0.1.4-ab01-readonly-fixed.apk > /tmp/OKN-DSP-R6-v0.1.4-ab01-readonly-fixed.apk.sha256

      - name: Upload OKN-DSP R6 fixed package
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-R6-BLE-AB01-READONLY-FIXED
          path: |
            /tmp/OKN-DSP-R6-v0.1.4-ab01-readonly-fixed.apk
            /tmp/OKN-DSP-R6-v0.1.4-ab01-readonly-fixed.apk.sha256
            /tmp/OKN-DSP-R6-v0.1.4-fixed-source.zip
          if-no-files-found: error
          retention-days: 30
