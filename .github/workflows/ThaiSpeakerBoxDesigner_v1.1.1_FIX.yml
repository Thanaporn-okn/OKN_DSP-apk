                  Driver("pa-gst-181500-v3", "P.Audio", "GST-181500 V3", 18, 8.0, 1500, 3000, 40.0, 0.60, 0.63, 11.95, 92.248, 1225.0, 9.0, 5.6, 1.26, 96.0, 40.0, 800.0, 425.3, 232.0, "PA Sub/LF", "https://paudiothailand.com/products/lf-driver/ferrite-lf-driver/gst-181500-v3/"),
