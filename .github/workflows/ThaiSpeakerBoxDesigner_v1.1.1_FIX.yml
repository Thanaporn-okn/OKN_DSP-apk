                              ProjectStore.delete(context, it); projects = ProjectStore.load(context)
                          }, onOpen = { p ->
                              val d = catalog.firstOrNull { it.id == p.driverId } ?: selected
                              val enc = Enclosures.byId(p.enclosureId)
                              selected = d; enclosure = enc
                              currentInput = DesignInput(d, enc, p.count, p.targetHz, p.thicknessMm, p.wiring)
                              result = p.result; screen = Screen.RESULT
                          }, onNew = { screen = Screen.DESIGN })
                          Screen.MORE -> MoreScreen(
                              catalogCount = catalog.size,
                              onSyncOfficial = {
                                  scope.launch {
                                      val r = CatalogRepository.syncPAudio(context, 60); if (r.ok) refreshCatalog(); snack.showSnackbar(r.message)
                                  }
                              },
                              onSyncUrl = { url ->
                                  scope.launch {
                                      val r = CatalogRepository.syncJsonUrl(context, url); if (r.ok) refreshCatalog(); snack.showSnackbar(r.message)
                                  }
                              }
                          )
                          Screen.ADD_DRIVER -> AddDriverScreen({ screen = Screen.LIBRARY }) { d ->
                              CatalogRepository.addCustom(context, d); refreshCatalog(); selected = d; screen = Screen.DETAIL
                              scope.launch { snack.showSnackbar("เพิ่ม ${d.displayName} แล้ว") }
                          }
                      }
                  }
              }
          }
          
