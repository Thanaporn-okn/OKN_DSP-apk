      - name: Publish runtime speaker catalog
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re,urllib.request,html
          src=Path("app/src/main/java/com/okn/speakerbox/Models.kt").read_text(encoding="utf-8")
          rows=[]
          for line in src.splitlines():
              s=line.strip()
              if not s.startswith('Driver("pa-'): continue
              body=s[len("Driver("):].rstrip(",)")
              vals=[];cur=[];quote=False;esc=False
              for ch in body:
                  if esc: cur.append(ch);esc=False;continue
                  if ch=='\\': cur.append(ch);esc=True;continue
                  if ch=='"': quote=not quote;cur.append(ch);continue
                  if ch==',' and not quote: vals.append(''.join(cur).strip());cur=[];continue
                  cur.append(ch)
              vals.append(''.join(cur).strip())
              def S(i): return vals[i].strip().strip('"')
              def F(i): return float(vals[i])
              def I(i): return int(float(vals[i]))
              if len(vals)<23: continue
              d={"id":S(0),"brand":S(1),"model":S(2),"sizeInch":I(3),"ohm":F(4),"rmsW":I(5),"programW":I(6),"fs":F(7),"qts":F(8),"qes":F(9),"qms":F(10),"vasL":F(11),"sdCm2":F(12),"xmaxMm":F(13),"re":F(14),"leMh":F(15),"sensitivityDb":F(16),"freqMinHz":F(17),"freqMaxHz":F(18),"cutoutMm":F(19),"depthMm":F(20),"use":S(21),"sourceUrl":S(22),"verified":True,"custom":False,"imageUrl":""}
              try:
                  req=urllib.request.Request(d["sourceUrl"],headers={"User-Agent":"Mozilla/5.0 SpeakerBoxDesignerTH/1.1"})
                  page=urllib.request.urlopen(req,timeout=12).read().decode("utf-8","ignore")
                  m=re.search(r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)',page,re.I) or re.search(r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image["\']',page,re.I)
                  if m:d["imageUrl"]=html.unescape(m.group(1))
              except Exception: pass
              rows.append(d)
          Path("speaker_catalog.json").write_text(json.dumps(rows,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(f"catalog rows={len(rows)} images={sum(bool(x['imageUrl']) for x in rows)}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add speaker_catalog.json
          if git diff --cached --quiet; then
            echo "speaker_catalog.json unchanged"
          else
            git commit -m "Update speaker catalog for app v1.1 [skip ci]"
            git push origin HEAD:main
          fi

      - name: Verify generated sources
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/java/com/okn/speakerbox/MainActivity.kt
          test -s app/src/main/java/com/okn/speakerbox/Calculators.kt
          test -s app/src/main/java/com/okn/speakerbox/Data.kt
          grep -q 'Small vented-box 4th-order' app/src/main/java/com/okn/speakerbox/Calculators.kt
          grep -q 'exportAndShare' app/src/main/java/com/okn/speakerbox/PdfExporter.kt
          grep -q 'syncPAudio' app/src/main/java/com/okn/speakerbox/Data.kt
          grep -q 'SheetLayout' app/src/main/java/com/okn/speakerbox/MainActivity.kt

      - name: Test calculations and build APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 8
          mkdir -p dist
          cp "$APK" dist/ThaiSpeakerBoxDesigner-v1.1.0-polished-debug.apk
          sha256sum dist/ThaiSpeakerBoxDesigner-v1.1.0-polished-debug.apk | tee dist/SHA256SUMS.txt
          zip -9 -r dist/ThaiSpeakerBoxDesigner-v1.1.0-source.zip app settings.gradle.kts build.gradle.kts gradle.properties speaker_catalog.example.json speaker_catalog.json >/dev/null

      - name: Build summary
        shell: bash
        run: |
          {
            echo '## Thai Speaker Box Designer FULL v1'
            echo ''
            echo '- UI: Samsung/One UI dark mock direction'
            echo '- Calculator: sealed, vented, 4th band-pass; Thai/PA geometry presets clearly separated'
            echo '- Working: driver search/filter, custom driver, P.Audio web sync, JSON catalog import, wiring, response/impedance/excursion charts, pseudo-3D, cut list, 1220x2440 layout, projects, PDF share'
            echo '- Verified APK with apksigner + unzip integrity test'
            echo ''
            cat dist/SHA256SUMS.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK and source artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ThaiSpeakerBoxDesigner-v1.1.0-POLISHED
          path: |
            dist/ThaiSpeakerBoxDesigner-v1.1.0-polished-debug.apk
            dist/ThaiSpeakerBoxDesigner-v1.1.0-source.zip
            dist/SHA256SUMS.txt
            speaker_catalog.example.json
            speaker_catalog.json
          if-no-files-found: error
          retention-days: 30
