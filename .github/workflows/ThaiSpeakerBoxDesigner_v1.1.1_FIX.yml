                          OutlinedButton(onClick = onCompare, Modifier.weight(1f)) { Icon(Icons.Rounded.CompareArrows, null); Spacer(Modifier.width(5.dp)); Text("เปรียบเทียบ") }
                      }
                  }
                  item { Text("พบ ${shown.size} รุ่น", color = Color(0xFF8EA3B5), fontSize = 11.sp) }
                  items(shown, key = { it.id }) { d -> DriverCard(d, d.id == selected.id, { onDetail(d) }, { onUse(d) }) }
              }
          }
          
