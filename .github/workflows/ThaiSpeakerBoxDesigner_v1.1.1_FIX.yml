              private const val PREF = "speaker_projects"
              private const val KEY = "projects"
          
              fun load(context: Context): List<SavedProject> {
                  val text = context.getSharedPreferences(PREF, Context.MODE_PRIVATE).getString(KEY, null) ?: return emptyList()
                  return runCatching {
                      val arr = JSONArray(text)
                      (0 until arr.length()).mapNotNull { fromJson(arr.optJSONObject(it)) }.sortedByDescending { it.createdAt }
                  }.getOrDefault(emptyList())
              }
          
              fun save(context: Context, project: SavedProject) {
                  val list = load(context).toMutableList()
                  list.removeAll { it.id == project.id }
                  list.add(0, project)
                  persist(context, list.take(50))
              }
          
              fun delete(context: Context, id: String) = persist(context, load(context).filterNot { it.id == id })
          
              private fun persist(context: Context, list: List<SavedProject>) {
                  val arr = JSONArray()
                  list.forEach { arr.put(toJson(it)) }
                  context.getSharedPreferences(PREF, Context.MODE_PRIVATE).edit().putString(KEY, arr.toString()).apply()
              }
          
              private fun toJson(p: SavedProject) = JSONObject().apply {
                  put("id", p.id); put("name", p.name); put("createdAt", p.createdAt); put("driverId", p.driverId); put("driverName", p.driverName)
                  put("enclosureId", p.enclosureId); put("enclosureName", p.enclosureName); put("count", p.count); put("targetHz", p.targetHz)
                  put("thicknessMm", p.thicknessMm); put("wiring", p.wiring); put("result", resultToJson(p.result))
              }
          
              private fun fromJson(o: JSONObject?): SavedProject? {
                  if (o == null) return null
                  return runCatching {
                      SavedProject(o.getString("id"), o.getString("name"), o.getLong("createdAt"), o.getString("driverId"), o.getString("driverName"),
                          o.getString("enclosureId"), o.getString("enclosureName"), o.getInt("count"), o.getDouble("targetHz"), o.getInt("thicknessMm"),
                          o.getString("wiring"), resultFromJson(o.getJSONObject("result")))
                  }.getOrNull()
              }
          
              private fun resultToJson(r: DesignResult) = JSONObject().apply {
                  put("netL", r.netL); put("grossL", r.grossL); put("fbHz", r.fbHz); put("f3Hz", r.f3Hz); put("fcHz", r.fcHz); put("qtc", r.qtc); put("splDb", r.splDb)
                  put("impedanceOhm", r.impedanceOhm); put("widthMm", r.widthMm); put("heightMm", r.heightMm); put("depthMm", r.depthMm)
                  put("innerWidthMm", r.innerWidthMm); put("innerHeightMm", r.innerHeightMm); put("innerDepthMm", r.innerDepthMm)
                  put("portAreaCm2", r.portAreaCm2); put("portLengthMm", r.portLengthMm); put("portWidthMm", r.portWidthMm); put("portHeightMm", r.portHeightMm)
                  put("driverDisplacementL", r.driverDisplacementL); put("portDisplacementL", r.portDisplacementL); put("braceDisplacementL", r.braceDisplacementL)
                  put("sheetCount", r.sheetCount); put("method", r.method)
                  put("warnings", JSONArray(r.warnings))
                  put("cuts", JSONArray().apply { r.cutList.forEach { c -> put(JSONObject().apply { put("part", c.part); put("w", c.widthMm); put("h", c.heightMm); put("qty", c.qty); put("note", c.note) }) } })
              }
          
              private fun resultFromJson(o: JSONObject): DesignResult {
                  val cutsA = o.optJSONArray("cuts") ?: JSONArray()
                  val cuts = (0 until cutsA.length()).mapNotNull { i -> cutsA.optJSONObject(i)?.let { CutItem(it.optString("part"), it.optInt("w"), it.optInt("h"), it.optInt("qty",1), it.optString("note")) } }
                  val wa = o.optJSONArray("warnings") ?: JSONArray()
                  val warnings = (0 until wa.length()).map { wa.optString(it) }
                  return DesignResult(o.getDouble("netL"), o.getDouble("grossL"), o.getDouble("fbHz"), o.getDouble("f3Hz"), o.optDouble("fcHz",0.0), o.optDouble("qtc",0.707),
                      o.getDouble("splDb"), o.getDouble("impedanceOhm"), o.getInt("widthMm"), o.getInt("heightMm"), o.getInt("depthMm"), o.optInt("innerWidthMm"), o.optInt("innerHeightMm"),
                      o.optInt("innerDepthMm"), o.getDouble("portAreaCm2"), o.getInt("portLengthMm"), o.optInt("portWidthMm"), o.optInt("portHeightMm"), o.optDouble("driverDisplacementL"),
                      o.optDouble("portDisplacementL"), o.optDouble("braceDisplacementL"), o.getInt("sheetCount"), cuts, warnings, o.optString("method"))
              }
          }
