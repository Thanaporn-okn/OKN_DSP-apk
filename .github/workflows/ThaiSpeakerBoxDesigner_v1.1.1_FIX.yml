          @Composable
          fun Cabinet3D(inp:DesignInput,r:DesignResult,modifier:Modifier,angle:Float,zoom:Float){Canvas(modifier){
              val frontW=size.width*(.52f+.09f*(1-angle))*zoom;val frontH=size.height*.55f*zoom;val dx=size.width*.20f*angle*zoom;val dy=-size.height*.13f*angle*zoom
              val x=(size.width-frontW-dx)/2f;val y=(size.height-frontH-dy)/2f
              val front=Path().apply{moveTo(x,y);lineTo(x+frontW,y);lineTo(x+frontW,y+frontH);lineTo(x,y+frontH);close()}
              val side=Path().apply{moveTo(x+frontW,y);lineTo(x+frontW+dx,y+dy);lineTo(x+frontW+dx,y+frontH+dy);lineTo(x+frontW,y+frontH);close()}
              val top=Path().apply{moveTo(x,y);lineTo(x+dx,y+dy);lineTo(x+frontW+dx,y+dy);lineTo(x+frontW,y);close()}
              drawPath(front,Color(0xFFC99560));drawPath(side,Color(0xFF875735));drawPath(top,Color(0xFFE0B17D));drawPath(front,Color.White.copy(alpha=.18f),style=Stroke(width=2f));drawPath(side,Color.White.copy(alpha=.12f),style=Stroke(width=2f))
              val cols=if(inp.count==1)1 else min(2,inp.count);val rows=ceil(inp.count/cols.toDouble()).toInt();val rr=min(frontW/(cols*2.6f),frontH/(rows*2.65f))
              repeat(inp.count){i->val col=i%cols;val row=i/cols;val cx=x+frontW*(col+1)/(cols+1f);val usableH=if(r.fbHz>0)frontH*.80f else frontH;val cy=y+usableH*(row+1)/(rows+1f);drawCircle(Color(0xFF06080A),rr,Offset(cx,cy));drawCircle(Color(0xFF26343E),rr*.84f,Offset(cx,cy),style=Stroke(width=max(3f,5f*zoom)));drawCircle(Color(0xFF10161C),rr*.56f,Offset(cx,cy));drawCircle(Color(0xFF26323B),rr*.25f,Offset(cx,cy))}
              if(r.fbHz>0){val ph=max(9f,frontH*(r.portHeightMm.toFloat()/max(1,r.innerHeightMm))*0.85f);drawRoundRect(Color(0xFF070A0C),Offset(x+frontW*.08f,y+frontH-ph-8f),androidx.compose.ui.geometry.Size(frontW*.84f,ph),CornerRadius(5f,5f))}
              drawLine(Color.White.copy(alpha=.55f),Offset(x,y+frontH+12f),Offset(x+frontW,y+frontH+12f),2f);drawLine(Color.White.copy(alpha=.55f),Offset(x-12f,y),Offset(x-12f,y+frontH),2f)
          }}

          @Composable
          fun CutScreen(inp:DesignInput,r:DesignResult,onBack:()->Unit,onPdf:()->Unit){ val placements=remember(r){SpeakerMath.nestPanels(r.cutList)};var sheet by remember{mutableIntStateOf(0)};val sheets=max(1,(placements.maxOfOrNull{it.sheet}?:0)+1);Page{item{TopTitle("แบบตัดไม้",onBack){IconButton(onClick=onPdf){Icon(Icons.Rounded.PictureAsPdf,null)}}};item{DarkCard{Text("Cut list • ไม้ ${inp.thicknessMm} mm",fontWeight=FontWeight.Bold,fontSize=18.sp);r.cutList.forEachIndexed{i,c->Row(Modifier.fillMaxWidth().padding(vertical=4.dp),verticalAlignment=Alignment.CenterVertically){Surface(shape=CircleShape,color=Color(0xFF163B54)){Text("${i+1}",Modifier.padding(horizontal=8.dp,vertical=4.dp),fontSize=9.sp)};Spacer(Modifier.width(8.dp));Text(c.part,Modifier.weight(1f));Text(c.sizeText,color=Color(0xFFB0C2D0),fontSize=10.sp);Spacer(Modifier.width(7.dp));Text("×${c.qty}",fontWeight=FontWeight.Bold)}}}};item{DarkCard{Row(verticalAlignment=Alignment.CenterVertically){Text("วางแผ่น 1220×2440",Modifier.weight(1f),fontWeight=FontWeight.Bold);Text("${sheet+1}/$sheets",color=Color(0xFF63D2FF))};SheetLayout(placements.filter{it.sheet==sheet},Modifier.fillMaxWidth().height(430.dp));Row(Modifier.fillMaxWidth(),horizontalArrangement=Arrangement.SpaceBetween){OutlinedButton(onClick={if(sheet>0)sheet--},enabled=sheet>0){Text("ก่อนหน้า")};OutlinedButton(onClick={if(sheet<sheets-1)sheet++},enabled=sheet<sheets-1){Text("ถัดไป")}};Text("Layout เป็น shelf nesting อัตโนมัติ ให้ช่างเผื่อคมเลื่อย/kerf ตามเครื่องจริง",color=Color(0xFF8FA4B5),fontSize=9.sp)}}} }
          
          @Composable
          fun SheetLayout(p:List<PanelPlacement>,modifier:Modifier){Canvas(modifier.background(Color(0xFF080D12),RoundedCornerShape(14.dp)).padding(10.dp)){val sx=size.width/1220f;val sy=size.height/2440f;drawRect(Color(0xFF2B333A),style=Stroke(width=2f));p.forEachIndexed{i,q->val x=q.x*sx;val y=q.y*sy;val w=q.width*sx;val h=q.height*sy;val colors=listOf(Color(0xFF2196F3),Color(0xFF00BFA5),Color(0xFFFFB300),Color(0xFF9C6BFF));drawRect(colors[i%colors.size].copy(alpha=.40f),Offset(x,y),androidx.compose.ui.geometry.Size(w,h));drawRect(colors[i%colors.size],Offset(x,y),androidx.compose.ui.geometry.Size(w,h),style=Stroke(width=2f))}}}
          
          @Composable
          fun GraphScreen(inp:DesignInput,r:DesignResult,onBack:()->Unit){var tab by remember{mutableIntStateOf(0)};val pts=remember(tab,inp,r){when(tab){1->SpeakerMath.impedanceCurve(inp,r);2->SpeakerMath.excursionCurve(inp,r);else->SpeakerMath.responseCurve(inp,r)}};Page{item{TopTitle("กราฟวิเคราะห์",onBack)};item{Row(horizontalArrangement=Arrangement.spacedBy(6.dp)){listOf("SPL","Impedance","Excursion").forEachIndexed{i,s->ResultTab(s,tab==i,Modifier.weight(1f)){tab=i}}}};item{DarkCard{Text(when(tab){1->"Voice-coil impedance estimate (Ω)";2->"Cone excursion estimate (mm)";else->"Normalized frequency response (dB)"},fontWeight=FontWeight.Bold);EngineeringGraph(pts,tab,Modifier.fillMaxWidth().height(300.dp));Row(Modifier.fillMaxWidth(),horizontalArrangement=Arrangement.SpaceBetween){Text("15 Hz",fontSize=9.sp,color=Color(0xFF8499AA));Text("50",fontSize=9.sp,color=Color(0xFF8499AA));Text("100",fontSize=9.sp,color=Color(0xFF8499AA));Text("400 Hz",fontSize=9.sp,color=Color(0xFF8499AA))}}};item{DarkCard{when(tab){0->{Metric("F3","${r.f3Hz} Hz");Metric("Fb",if(r.fbHz>0)"${r.fbHz} Hz" else "Sealed");Text("กราฟ vented ใช้ Small 4th-order small-signal model; ไม่รวม room gain/diffraction",color=Color(0xFF91A6B8),fontSize=9.sp)};1->{Metric("Nominal","${inp.driver.ohm} Ω");Metric("โหลดรวม","${r.impedanceOhm} Ω");Text("รวม Re/Le และ motional impedance โดยประมาณ",color=Color(0xFF91A6B8),fontSize=9.sp)};else->{Metric("Xmax","${inp.driver.xmaxMm} mm");Text("Excursion เป็น normalized estimate สำหรับดูแนวโน้ม ไม่แทน large-signal simulation",color=Color(0xFFFFC27A),fontSize=9.sp)}}}}} }
          
          @Composable
          fun EngineeringGraph(points:List<CurvePoint>,tab:Int,modifier:Modifier){Canvas(modifier.background(Color(0xFF070C11),RoundedCornerShape(12.dp)).padding(12.dp)){if(points.size<2)return@Canvas;val grid=Color.White.copy(alpha=.08f);repeat(7){i->val y=size.height*i/6f;drawLine(grid,Offset(0f,y),Offset(size.width,y),1f)};repeat(8){i->val x=size.width*i/7f;drawLine(grid,Offset(x,0f),Offset(x,size.height),1f)};val minX=ln(points.first().hz);val maxX=ln(points.last().hz);val rawMin=points.minOf{it.value};val rawMax=points.maxOf{it.value};val minY=when(tab){0->min(-30.0,rawMin);1->0.0;else->0.0};val maxY=when(tab){0->max(4.0,rawMax);1->max(16.0,rawMax*1.08);else->max(8.0,rawMax*1.08)};fun xy(p:CurvePoint):Offset{val x=((ln(p.hz)-minX)/(maxX-minX)*size.width).toFloat();val y=(size.height-(p.value-minY)/(maxY-minY)*size.height).toFloat();return Offset(x,y)};val path=Path();points.forEachIndexed{i,p->val q=xy(p);if(i==0)path.moveTo(q.x,q.y)else path.lineTo(q.x,q.y)};drawPath(path,when(tab){1->Color(0xFFFFB74D);2->Color(0xFF8A7CFF);else->Color(0xFF27C0FF)},style=Stroke(width=4f,cap=StrokeCap.Round))}}
          
