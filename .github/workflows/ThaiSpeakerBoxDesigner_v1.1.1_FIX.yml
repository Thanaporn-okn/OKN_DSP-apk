name: Build Thai Speaker Box Designer - v1.1.1 FIXED

'on':
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/ThaiSpeakerBoxDesigner_v1.1.1_FIX.yml'

permissions:
  contents: write

concurrency:
  group: thai-speaker-box-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate full Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app settings.gradle.kts build.gradle.kts gradle.properties
          mkdir -p app/src/main/java/com/okn/speakerbox app/src/main/res/values app/src/main/res/xml app/src/test/java/com/okn/speakerbox

          cat > settings.gradle.kts <<'EOF_SETTINGS'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ThaiSpeakerBoxDesigner"
          include(":app")
          EOF_SETTINGS

          cat > build.gradle.kts <<'EOF_ROOT'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF_ROOT

          cat > gradle.properties <<'EOF_PROPS'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF_PROPS

          cat > app/build.gradle.kts <<'EOF_APP'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.okn.speakerbox"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.okn.speakerbox"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 11
                  versionName = "1.1.1-fixed"
                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              packaging { resources { excludes += "/META-INF/{AL2.0,LGPL2.1}" } }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
              implementation("org.jsoup:jsoup:1.18.3")
              implementation("io.coil-kt:coil-compose:2.7.0")
              debugImplementation("androidx.compose.ui:ui-tooling")
              testImplementation("junit:junit:4.13.2")
          }
          EOF_APP

          cat > app/src/main/AndroidManifest.xml <<'EOF_MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="Speaker Box Designer TH"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/Theme.SpeakerBox">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF_MANIFEST

          cat > app/src/main/res/values/themes.xml <<'EOF_THEME'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.SpeakerBox" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#05080D</item>
                  <item name="android:navigationBarColor">#05080D</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF_THEME

          cat > app/src/main/res/xml/file_paths.xml <<'EOF_PATHS'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="exports" path="exports/" />
          </paths>
          EOF_PATHS

          cat > app/src/main/java/com/okn/speakerbox/Models.kt <<'EOF_Models_kt'
