                          FilterChip(selected = verifiedOnly, onClick = { verifiedOnly = !verifiedOnly }, label = { Text("Verified") }, leadingIcon = { Icon(Icons.Rounded.Verified, null, Modifier.size(15.dp)) })
                      }
