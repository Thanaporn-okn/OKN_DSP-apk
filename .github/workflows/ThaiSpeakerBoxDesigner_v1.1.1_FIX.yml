          package com.okn.speakerbox

          import org.junit.Assert.*
          import org.junit.Test

          class SpeakerMathTest {
              @Test fun sealedAndVentedAreFinite() {
                  val d = SeedCatalog.drivers.first()
                  val sealed = DesignInput(d, Enclosures.byId("sealed"), 1, 0.0, 18, "ขนาน", 0.707)
                  val rs = SpeakerMath.calculate(sealed)
                  assertTrue(rs.netL > 0 && rs.f3Hz > 0 && rs.widthMm > 0)
                  val vented = DesignInput(d, Enclosures.byId("vented"), 1, 35.0, 18, "ขนาน")
                  val rv = SpeakerMath.calculate(vented)
                  assertTrue(rv.netL > 0 && rv.fbHz > 0 && rv.portLengthMm > 0)
                  assertTrue(SpeakerMath.responseCurve(vented, rv).all { it.value.isFinite() })
                  assertTrue(SpeakerMath.impedanceCurve(vented, rv).all { it.value.isFinite() })
              }
          }
