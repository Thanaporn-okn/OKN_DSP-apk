          @Composable
          fun DesignScreen(category: String, driver: Driver, initial: EnclosurePreset, onChoose: () -> Unit, onCalculated: (DesignInput, DesignResult) -> Unit) {
              var box by remember(initial.id) { mutableStateOf(initial) }
              var count by remember { mutableIntStateOf(1) }
              var target by remember { mutableFloatStateOf(max(25.0, min(80.0, driver.fs)).toFloat()) }
              var thickness by remember { mutableIntStateOf(if (driver.sizeInch >= 18) 20 else 18) }
              var qtc by remember { mutableFloatStateOf(.707f) }
              var wiring by remember { mutableStateOf("ขนาน") }
              val wiringOptions = SpeakerMath.wiringOptions(driver, count)
              if (wiringOptions.none { it.first == wiring }) wiring = wiringOptions.first().first
              Page {
                  item { TopTitle("ออกแบบตู้ • $category") }
                  item { StepBar(4) }
                  item {
                      Text("1  ดอกลำโพง", color = Color(0xFF6ED5FF), fontWeight = FontWeight.Bold)
                      DarkCard { Row(verticalAlignment = Alignment.CenterVertically) { SpeakerArt(Modifier.size(62.dp)); Spacer(Modifier.width(10.dp)); Column(Modifier.weight(1f)) { Text(driver.displayName, fontWeight=FontWeight.Bold); Text("${driver.sizeInch}\" • Fs ${driver.fs} • Qts ${driver.qts}", color=Color(0xFF98ACBD),fontSize=10.sp) }; OutlinedButton(onClick=onChoose){Text("เปลี่ยน")} } }
                  }
                  item {
                      Text("2  แบบตู้", color = Color(0xFF6ED5FF), fontWeight = FontWeight.Bold)
                      Column(verticalArrangement=Arrangement.spacedBy(7.dp)) { Enclosures.all.chunked(2).forEach { row -> Row(horizontalArrangement=Arrangement.spacedBy(7.dp)) { row.forEach { e -> BoxChoice(e, e.id==box.id, Modifier.weight(1f)){box=e} }; if(row.size==1) Spacer(Modifier.weight(1f)) } } }
                  }
                  item {
                      Text("3  จำนวน / โอห์ม", color = Color(0xFF6ED5FF), fontWeight = FontWeight.Bold)
                      DarkCard {
                          Row(verticalAlignment=Alignment.CenterVertically) { Text("จำนวนดอก", Modifier.weight(1f)); IconButton(onClick={if(count>1)count--}){Icon(Icons.Rounded.Remove,null)}; Text("$count",fontSize=22.sp,fontWeight=FontWeight.Black); IconButton(onClick={if(count<8)count++}){Icon(Icons.Rounded.Add,null)} }
                          Text("การต่อ")
                          Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement=Arrangement.spacedBy(6.dp)) { wiringOptions.forEach { (m,z) -> FilterChip(selected=wiring==m,onClick={wiring=m},label={Text("$m ${"%.1f".format(z)}Ω")}) } }
                      }
                  }
                  item {
                      Text("4  ค่าที่ต้องการ", color = Color(0xFF6ED5FF), fontWeight = FontWeight.Bold)
                      DarkCard {
                          if (box.kind == EnclosureKind.SEALED) {
                              Row { Text("Qtc",Modifier.weight(1f)); Text("${"%.3f".format(qtc)}",color=Color(0xFF66D5FF),fontWeight=FontWeight.Bold) }
                              Slider(qtc,{qtc=it},valueRange=.55f..1.10f)
                              Text("0.577 = Bessel • 0.707 = Butterworth",color=Color(0xFF8FA3B5),fontSize=10.sp)
                          } else {
                              Row { Text("ความถี่จูนที่ต้องการ",Modifier.weight(1f)); Text("${target.roundToInt()} Hz",color=Color(0xFF66D5FF),fontWeight=FontWeight.Bold) }
                              Slider(target,{target=it},valueRange=22f..90f)
                          }
                          Text("ความหนาไม้")
                          Row(horizontalArrangement=Arrangement.spacedBy(5.dp)) { listOf(15,18,20,25).forEach { mm -> FilterChip(selected=thickness==mm,onClick={thickness=mm},label={Text("$mm mm")}) } }
                      }
                  }
