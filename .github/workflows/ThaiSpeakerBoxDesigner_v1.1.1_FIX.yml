          object PdfExporter {
              fun exportAndShare(context: Context, input: DesignInput, result: DesignResult) {
                  val dir = File(context.cacheDir, "exports").apply { mkdirs() }
                  val stamp = SimpleDateFormat("yyyyMMdd-HHmm", Locale.US).format(Date())
                  val file = File(dir, "SpeakerBox-${input.driver.model.replace(Regex("[^A-Za-z0-9_-]"), "-")}-$stamp.pdf")
                  createPdf(file, input, result)
                  val uri = FileProvider.getUriForFile(context, "${context.packageName}.fileprovider", file)
                  val intent = Intent(Intent.ACTION_SEND).apply {
                      type = "application/pdf"
                      putExtra(Intent.EXTRA_STREAM, uri)
                      putExtra(Intent.EXTRA_SUBJECT, "Speaker Box Design - ${input.driver.displayName}")
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  }
                  context.startActivity(Intent.createChooser(intent, "แชร์แบบตู้ลำโพง PDF"))
              }
          
              private fun createPdf(file: File, input: DesignInput, r: DesignResult) {
                  val doc = PdfDocument()
                  val title = Paint(Paint.ANTI_ALIAS_FLAG).apply { textSize = 20f; color = Color.rgb(22, 80, 120); isFakeBoldText = true }
                  val h = Paint(Paint.ANTI_ALIAS_FLAG).apply { textSize = 14f; color = Color.BLACK; isFakeBoldText = true }
                  val p = Paint(Paint.ANTI_ALIAS_FLAG).apply { textSize = 11f; color = Color.DKGRAY }
                  val line = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.LTGRAY; strokeWidth = 1f }
                  var pageNo = 1
                  fun newPage(): Pair<PdfDocument.Page, FloatArray> {
                      val page = doc.startPage(PdfDocument.PageInfo.Builder(595, 842, pageNo++).create())
                      return page to floatArrayOf(42f, 48f)
                  }
                  var pair = newPage(); var page = pair.first; var y = pair.second[1]
                  fun textLine(text: String, paint: Paint = p, gap: Float = 18f) {
                      if (y > 800f) { doc.finishPage(page); pair = newPage(); page = pair.first; y = pair.second[1] }
                      page.canvas.drawText(text, 42f, y, paint); y += gap
                  }
                  textLine("Speaker Box Designer TH", title, 28f)
                  textLine("สรุปการออกแบบ", h, 24f)
                  textLine("ดอก: ${input.driver.displayName}  ${input.driver.sizeInch}\"  ${input.driver.ohm} Ω")
                  textLine("จำนวน: ${input.count} ดอก    การต่อ: ${input.wiring}    โหลดรวม: ${r.impedanceOhm} Ω")
                  textLine("แบบตู้: ${input.enclosure.nameTh} (${input.enclosure.subtitle})")
                  textLine("วิธีคำนวณ: ${r.method}")
                  y += 6f; page.canvas.drawLine(42f, y, 553f, y, line); y += 20f
                  textLine("ปริมาตรสุทธิ: ${r.netL} L", h)
                  textLine("ปริมาตรรวมก่อนตัด: ${r.grossL} L")
                  textLine("Fb: ${if (r.fbHz > 0) "${r.fbHz} Hz" else "Sealed"}    F3: ${r.f3Hz} Hz    Qtc: ${r.qtc}")
                  textLine("SPL ทางทฤษฎีจาก sensitivity + RMS: ${r.splDb} dB @1m")
                  textLine("ขนาดภายนอก W×H×D: ${r.widthMm} × ${r.heightMm} × ${r.depthMm} mm")
                  textLine("ขนาดภายใน W×H×D: ${r.innerWidthMm} × ${r.innerHeightMm} × ${r.innerDepthMm} mm")
                  if (r.fbHz > 0) {
                      textLine("พอร์ต: ${r.portAreaCm2} cm²  ${r.portWidthMm}×${r.portHeightMm} mm  ยาว ${r.portLengthMm} mm")
                  }
                  textLine("ไม้ประมาณ: ${r.sheetCount} แผ่น ขนาด 1220×2440 mm")
                  y += 8f
                  textLine("รายการตัดไม้", h, 22f)
                  r.cutList.forEach { c -> textLine("• ${c.part}: ${c.sizeText} ×${c.qty}${if (c.note.isNotBlank()) " — ${c.note}" else ""}") }
                  if (r.warnings.isNotEmpty()) {
                      y += 6f; textLine("ข้อควรตรวจ", h, 22f)
                      r.warnings.forEach { textLine("• $it") }
                  }
                  y += 6f
                  textLine("หมายเหตุ", h, 22f)
                  textLine("ค่าคำนวณเป็น small-signal/engineering estimate. SPL สูงสุดจริง, power compression, port velocity,")
                  textLine("ความแข็งแรง และ response ของ horn/local preset ควรยืนยันด้วย simulation และการวัดจริงก่อนผลิต.")
                  textLine("แหล่งข้อมูลดอก: ${input.driver.sourceUrl.ifBlank { "Custom / user supplied" }}")
                  doc.finishPage(page)

                  run {
                      val pg = doc.startPage(PdfDocument.PageInfo.Builder(595, 842, pageNo++).create())
                      val c = pg.canvas
                      c.drawText("แบบตู้และกราฟตอบสนอง", 42f, 48f, title)
                      c.drawText("${input.driver.displayName} • ${input.enclosure.nameTh}", 42f, 72f, h)
                      val bx=58f;val by=110f;val bw=230f;val bh=205f
                      c.drawRect(bx,by,bx+bw,by+bh,Paint().apply{color=Color.rgb(194,145,92);style=Paint.Style.FILL})
                      c.drawRect(bx,by,bx+bw,by+bh,Paint().apply{color=Color.DKGRAY;style=Paint.Style.STROKE;strokeWidth=2f})
                      val cols=if(input.count==1)1 else kotlin.math.min(2,input.count);val rows=kotlin.math.ceil(input.count/cols.toDouble()).toInt();val rr=kotlin.math.min(bw/(cols*2.7f),bh/(rows*2.8f))
                      repeat(input.count){i->val col=i%cols;val row=i/cols;val cx=bx+bw*(col+1)/(cols+1f);val usableH=if(r.fbHz>0)bh*.80f else bh;val cy=by+usableH*(row+1)/(rows+1f);c.drawCircle(cx,cy,rr,Paint().apply{color=Color.rgb(15,18,22)});c.drawCircle(cx,cy,rr*.73f,Paint().apply{color=Color.rgb(45,55,64);style=Paint.Style.STROKE;strokeWidth=5f})}
                      if(r.fbHz>0)c.drawRect(bx+bw*.10f,by+bh*.87f,bx+bw*.90f,by+bh*.93f,Paint().apply{color=Color.rgb(18,22,26)})
                      c.drawText("${r.widthMm} × ${r.heightMm} × ${r.depthMm} mm",bx,by+bh+22f,p)
                      val gx=42f;val gy=380f;val gw=510f;val gh=300f
                      c.drawText("Normalized frequency response",gx,gy-18f,h)
                      val gridPaint=Paint().apply{color=Color.rgb(220,225,230);strokeWidth=.6f}
                      repeat(7){i->val yy=gy+gh*i/6f;c.drawLine(gx,yy,gx+gw,yy,gridPaint)}
                      repeat(9){i->val xx=gx+gw*i/8f;c.drawLine(xx,gy,xx,gy+gh,gridPaint)}
                      val pts=SpeakerMath.responseCurve(input,r)
                      if(pts.size>1){val minX=kotlin.math.ln(pts.first().hz);val maxX=kotlin.math.ln(pts.last().hz);val minY=kotlin.math.min(-30.0,pts.minOf{it.value});val maxY=kotlin.math.max(4.0,pts.maxOf{it.value});val path=android.graphics.Path();pts.forEachIndexed{i,q->val xx=gx+((kotlin.math.ln(q.hz)-minX)/(maxX-minX)*gw).toFloat();val yy=gy+gh-((q.value-minY)/(maxY-minY)*gh).toFloat();if(i==0)path.moveTo(xx,yy)else path.lineTo(xx,yy)};c.drawPath(path,Paint(Paint.ANTI_ALIAS_FLAG).apply{color=Color.rgb(0,150,220);style=Paint.Style.STROKE;strokeWidth=3f})}
                      c.drawText("15 Hz",gx,gy+gh+18f,p);c.drawText("50",gx+gw*.31f,gy+gh+18f,p);c.drawText("100",gx+gw*.50f,gy+gh+18f,p);c.drawText("400 Hz",gx+gw-40f,gy+gh+18f,p)
                      c.drawText("F3 ${r.f3Hz} Hz   Fb ${if(r.fbHz>0)"${r.fbHz} Hz" else "Sealed"}   SPL ${r.splDb} dB (theoretical)",gx,gy+gh+42f,p)
                      doc.finishPage(pg)
                  }

                  val placements = SpeakerMath.nestPanels(r.cutList)
                  val sheets = (placements.maxOfOrNull { it.sheet } ?: 0) + 1
                  for (sheet in 0 until sheets) {
                      val pg = doc.startPage(PdfDocument.PageInfo.Builder(595, 842, pageNo++).create())
                      val c = pg.canvas
                      c.drawText("Cut layout — sheet ${sheet + 1}/$sheets (1220×2440 mm)", 35f, 40f, h)
                      val ox = 50f; val oy = 65f; val sw = 470f; val sh = 730f
                      c.drawRect(ox, oy, ox + sw, oy + sh, Paint().apply { style = Paint.Style.STROKE; color = Color.DKGRAY })
                      placements.filter { it.sheet == sheet }.forEach { q ->
                          val x = ox + q.x / 1220f * sw
                          val yy = oy + q.y / 2440f * sh
                          val ww = q.width / 1220f * sw
                          val hh = q.height / 2440f * sh
                          c.drawRect(x, yy, x + ww, yy + hh, Paint().apply { style = Paint.Style.STROKE; color = Color.rgb(40, 120, 180) })
                          c.drawText(q.label.take(18), x + 3f, yy + 13f, Paint(p).apply { textSize = 8f })
                          c.drawText("${q.width}×${q.height}", x + 3f, yy + 24f, Paint(p).apply { textSize = 7f })
                      }
                      doc.finishPage(pg)
                  }
                  FileOutputStream(file).use { doc.writeTo(it) }
                  doc.close()
              }
          }
