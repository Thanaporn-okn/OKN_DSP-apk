name: R62 BP1048 exact fast4K CRC and writeback proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r62-bp1048-fast4kcrc-exact-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_REPO: https://github.com/leadercxn/bp1048_sdk_v0.1.12.git
  SDK_COMMIT: 8105bd864b04995d81c9f9ae77cb158259f39015
  B1_REL: MVsB1_Base_SDK/tools/b1_download_v1.7.exe
  SAMPLE_REL: MVsB1_Base_SDK/examples/Example_GPIO/Debug/output/Example_GPIO.bin

jobs:
  exact-proof:
    name: Exact fast4K CRC/writeback proof / STATIC ONLY / NO FLASH
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout control repo
        uses: actions/checkout@v5

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git file binutils python3

      - name: Fetch pinned SDK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/bp1048_r62
          git init -q /tmp/bp1048_r62
          cd /tmp/bp1048_r62
          git remote add origin "$SDK_REPO"
          git fetch -q --depth=1 origin "$SDK_COMMIT"
          git checkout -q --detach FETCH_HEAD

          test "$(git rev-parse HEAD)" = "$SDK_COMMIT"
          test -s "$B1_REL"
          test -s "$SAMPLE_REL"

          {
            echo "SDK_COMMIT=$(git rev-parse HEAD)"
            sha256sum "$B1_REL"
            sha256sum "$SAMPLE_REL"
            wc -c "$B1_REL" "$SAMPLE_REL"
          } | tee /tmp/R62_SOURCE_FINGERPRINTS.txt

      - name: Extract exact symbol and DWARF evidence
        id: symbols
        shell: bash
        run: |
          set -euo pipefail
          EXE="/tmp/bp1048_r62/$B1_REL"

          nm -n -C "$EXE" > /tmp/R62_NM_DEMANGLED.txt
          objdump -t "$EXE" > /tmp/R62_SYMBOL_TABLE.txt
          objdump --dwarf=decodedline "$EXE" > /tmp/R62_DWARF_LINES.txt 2>/dev/null || true
          objdump --dwarf=info "$EXE" > /tmp/R62_DWARF_INFO.txt 2>/dev/null || true

          grep -E 'do_code_crc|crc16|crc_ccitt_table|cccrc|codebuf' \
            /tmp/R62_NM_DEMANGLED.txt \
            | tee /tmp/R62_TARGET_SYMBOLS.txt

          grep -q 'do_code_crc(unsigned int, int)' /tmp/R62_NM_DEMANGLED.txt
          grep -q 'crc16(unsigned char\*, unsigned int, unsigned short)' \
            /tmp/R62_NM_DEMANGLED.txt

      - name: Dump exact CRC function and address-zero writeback callsite
        id: disasm
        shell: bash
        run: |
          set -euo pipefail
          EXE="/tmp/bp1048_r62/$B1_REL"

          objdump -d -Mintel \
            --start-address=0x402610 \
            --stop-address=0x402750 \
            "$EXE" > /tmp/R62_CRC_FUNCTION_DISASM.txt

          objdump -d -Mintel \
            --start-address=0x412980 \
            --stop-address=0x412a10 \
            "$EXE" > /tmp/R62_ADDR0_WRITEBACK_DISASM.txt

          addr2line -f -C -e "$EXE" \
            0x402610 0x402650 0x402660 0x402688 0x4026b4 \
            0x4026e0 0x402710 0x402740 \
            0x4129c0 0x4129d6 0x4129e9 0x4129f3 \
            > /tmp/R62_ADDR2LINE.txt 2>/dev/null || true

          cat /tmp/R62_CRC_FUNCTION_DISASM.txt
          cat /tmp/R62_ADDR0_WRITEBACK_DISASM.txt

      - name: Prove exact fast4K CRC algorithm from instructions and table
        id: algorithm
        shell: bash
        run: |
          set -euo pipefail
          EXE="/tmp/bp1048_r62/$B1_REL"
          SAMPLE="/tmp/bp1048_r62/$SAMPLE_REL"

          python3 - "$EXE" "$SAMPLE" <<'PY'
          from pathlib import Path
          import re
          import struct
          import subprocess
          import sys
          import hashlib

          exe = Path(sys.argv[1])
          sample = Path(sys.argv[2])
          raw = exe.read_bytes()
          b = sample.read_bytes()

          dis = Path("/tmp/R62_CRC_FUNCTION_DISASM.txt").read_text(
              encoding="latin-1", errors="replace"
          )
          main = Path("/tmp/R62_ADDR0_WRITEBACK_DISASM.txt").read_text(
              encoding="latin-1", errors="replace"
          )

          # Exact function identity.
          assert "<__Z11do_code_crcji>" in dis
          assert re.search(r"402651:\s+31 c0\s+xor\s+eax,eax", dis)
          assert "0x414000" in dis

          # Exact excluded/included boundaries reconstructed from do_code_crc.
          required = {
              "END_00A4": r"\[esi\+0xa4\]",
              "START_00A8": r"\[esi\+0xa8\]",
              "END_00BC": r"\[esi\+0xbc\]",
              "START_00C0": r"\[esi\+0xc0\]",
              "END_00CC": r"\[esi\+0xcc\]",
              "START_00D4": r"\[esi\+0xd4\]",
              "END_00E4": r"\[esi\+0xe4\]",
              "START_00EC": r"\[esi\+0xec\]",
          }
          for name, pat in required.items():
              if not re.search(pat, dis):
                  raise SystemExit(f"missing CRC boundary {name}")

          # Verify the exact CCITT table bytes embedded in b1_download.
          table_off = 0x12600
          table_bytes = raw[table_off:table_off + 512]
          if len(table_bytes) != 512:
              raise SystemExit("CRC table truncated")

          def generate_table():
              out = []
              for i in range(256):
                  crc = i << 8
                  for _ in range(8):
                      crc = ((crc << 1) ^ 0x1021) & 0xFFFF \
                          if (crc & 0x8000) else ((crc << 1) & 0xFFFF)
                  out.append(crc)
              return b"".join(struct.pack("<H", x) for x in out)

          generated = generate_table()
          if table_bytes != generated:
              raise SystemExit("embedded CRC table != CRC-16/CCITT/XMODEM table")

          # Reconstruct the exact instruction-level update rule:
          # crc = (crc << 8) ^ table[((crc >> 8) ^ byte) & 0xff]
          table = list(struct.unpack("<256H", table_bytes))

          def update(crc, byte):
              return (((crc << 8) & 0xFFFF) ^
                      table[((crc >> 8) ^ byte) & 0xFF])

          ranges = [
              (0x0000, 0x00A4),
              (0x00A8, 0x00BC),
              (0x00C0, 0x00CC),
              (0x00D4, 0x00E4),
              (0x00EC, 0x1000),
          ]
          covered = sum(z-a for a, z in ranges)
          if covered != 4072:
              raise SystemExit(f"unexpected covered byte count: {covered}")

          crc = 0
          for a, z in ranges:
              for byte in b[a:z]:
                  crc = update(crc, byte)

          if crc != 0x4F09:
              raise SystemExit(f"sample fast4K CRC mismatch: got 0x{crc:04X}")

          # Confirm main() gates patching on target address == 0, calls
          # do_code_crc(0x1000, 0), then writes A4 and BC.
          required_main = [
              r"cmp\s+DWORD PTR \[esp\+0x34\],0x0",
              r"mov\s+DWORD PTR \[esp\+0x3c\],0x1000",
              r"mov\s+DWORD PTR \[esp\+0x4\],0x0",
              r"call\s+402650 <__Z11do_code_crcji>",
              r"mov\s+DWORD PTR \[eax\+0xa4\],0x10001000",
              r"mov\s+DWORD PTR \[eax\+0xbc\],edx",
          ]
          for pat in required_main:
              if not re.search(pat, main):
                  raise SystemExit(f"missing address-zero writeback proof: {pat}")

          # Construct a transient sample normalization exactly matching the
          # statically-proven writeback semantics.
          patched = bytearray(b)
          before = bytes(patched)

          patched[0xA4:0xA8] = struct.pack("<I", 0x10001000)
          patched[0xBC:0xC0] = struct.pack("<I", crc)

          changed = [
              i for i, (x, y) in enumerate(zip(before, patched))
              if x != y
          ]
          expected_changed = list(range(0xA4, 0xA8)) + list(range(0xBC, 0xC0))
          if changed != expected_changed:
              raise SystemExit(
                  f"unexpected changed offsets: {changed} != {expected_changed}"
              )

          # Recompute CRC after writeback.  It must remain identical because
          # both writeback fields are excluded from the fast4K CRC coverage.
          crc_after = 0
          for a, z in ranges:
              for byte in patched[a:z]:
                  crc_after = update(crc_after, byte)

          if crc_after != crc:
              raise SystemExit(
                  f"CRC changed after excluded-field writeback: "
                  f"{crc:04X}->{crc_after:04X}"
              )

          Path("/tmp/R62_SAMPLE_PATCHED_DO_NOT_FLASH.bin").write_bytes(patched)

          lines = [
              "R62_FAST4KCRC_ALGORITHM_PROVEN=YES",
              "R62_FAST4KCRC_NAME=CRC16_CCITT_XMODEM_TABLE_FORM",
              "R62_FAST4KCRC_POLY=0x1021",
              "R62_FAST4KCRC_INIT=0x0000",
              "R62_FAST4KCRC_XOROUT=0x0000",
              "R62_FAST4KCRC_REFLECTED=NO",
              "R62_FAST4KCRC_CODE_WINDOW=0x0000..0x0FFF",
              "R62_FAST4KCRC_COVERED_BYTES=4072",
              "R62_FAST4KCRC_INCLUDED_1=0x0000..0x00A3",
              "R62_FAST4KCRC_INCLUDED_2=0x00A8..0x00BB",
              "R62_FAST4KCRC_INCLUDED_3=0x00C0..0x00CB",
              "R62_FAST4KCRC_INCLUDED_4=0x00D4..0x00E3",
              "R62_FAST4KCRC_INCLUDED_5=0x00EC..0x0FFF",
              "R62_FAST4KCRC_EXCLUDED=A4-A7,BC-BF,CC-D3,E4-EB",
              "R62_ADDR_ZERO_GATE_PROVEN=YES",
              "R62_DO_CODE_CRC_ARGS=0x1000,0",
              "R62_WRITEBACK_A4_DWORD=0x10001000",
              "R62_WRITEBACK_BC_DWORD_LOW16_CRC=YES",
              f"R62_SAMPLE_FAST4KCRC=0x{crc:04X}",
              "R62_SAMPLE_A4_BYTES_LE=00100010",
              f"R62_SAMPLE_BC_BYTES_LE={crc & 0xFF:02x}{crc >> 8:02x}0000",
              "R62_CRC_STABLE_AFTER_EXCLUDED_WRITEBACK=YES",
              "R62_SAMPLE_PATCHED_BINARY_FLASHABLE=NO",
              "FLASH_ALLOWED=NO",
          ]

          Path("/tmp/R62_EXACT_PROOF.txt").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          Path("/tmp/R62_SAMPLE_PATCHED_SHA256.txt").write_text(
              hashlib.sha256(patched).hexdigest() +
              "  R62_SAMPLE_PATCHED_DO_NOT_FLASH.bin\n",
              encoding="ascii"
          )

          print("\n".join(lines))
          PY

      - name: Distinguish fast4K boot metadata from MVA length metadata
        id: metadata_roles
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          # R62 establishes the downloader's address-0 writeback only.
          # R28/R58 separately established MVA source-image length at E0..E3.
          lines = [
              "R62_BOOT_FASTCRC_FIELD_A4_A7=PROVEN",
              "R62_BOOT_FASTCRC_VALUE_FIELD_BC_BF=PROVEN",
              "R62_MVA_LENGTH_FIELD_E0_E2=SEPARATE_PREVIOUS_PROOF",
              "R62_MVA_LENGTH_CHECK_FIELD_E3=SEPARATE_PREVIOUS_PROOF",
              "R62_CC_D3_WRITEBACK_BY_B1_DOWNLOAD=NOT_OBSERVED",
              "R62_E4_EB_WRITEBACK_BY_B1_DOWNLOAD=NOT_OBSERVED",
              "R62_DIRECT_FLASH_METADATA_CONTRACT_ADVANCED=YES",
              "R62_RECOVERY_GATE_CLOSED=NO",
              "FLASH_ALLOWED=NO",
          ]
          Path("/tmp/R62_METADATA_ROLES.txt").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          print("\n".join(lines))
          PY

      - name: Remove transient patched sample
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/R62_SAMPLE_PATCHED_DO_NOT_FLASH.bin
          test ! -e /tmp/R62_SAMPLE_PATCHED_DO_NOT_FLASH.bin
          echo "R62_TRANSIENT_PATCHED_SAMPLE_RETAINED=NO" \
            | tee /tmp/R62_TRANSIENT_STATE.txt

      - name: Build R62 evidence bundle
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          OUT=/tmp/R62_BP1048_FAST4KCRC_EXACT_PROOF_EVIDENCE
          rm -rf "$OUT"
          mkdir -p "$OUT"

          for f in \
            R62_SOURCE_FINGERPRINTS.txt \
            R62_NM_DEMANGLED.txt \
            R62_TARGET_SYMBOLS.txt \
            R62_DWARF_LINES.txt \
            R62_DWARF_INFO.txt \
            R62_CRC_FUNCTION_DISASM.txt \
            R62_ADDR0_WRITEBACK_DISASM.txt \
            R62_ADDR2LINE.txt \
            R62_EXACT_PROOF.txt \
            R62_METADATA_ROLES.txt \
            R62_SAMPLE_PATCHED_SHA256.txt \
            R62_TRANSIENT_STATE.txt; do
            test -f "/tmp/$f" && cp "/tmp/$f" "$OUT/"
          done

          test ! -e "$OUT/R62_SAMPLE_PATCHED_DO_NOT_FLASH.bin"

          cat > "$OUT/README.txt" <<'EOF'
          R62 exact fast4K CRC/writeback proof.

          Proven statically from pinned b1_download_v1.7.exe:
          - CRC16/CCITT-XMODEM table form, init 0
          - first 4KB fast CRC coverage with four excluded metadata ranges
          - target-address-zero gate
          - do_code_crc(0x1000, 0)
          - +0xA4 dword = 0x10001000
          - +0xBC dword receives zero-extended CRC16 return value

          Cross-check:
          - pinned Example_GPIO.bin fast4K CRC = 0x4F09
          - writing A4/BC does not alter CRC because both fields are excluded

          No downloader execution.
          No USB access.
          No erase/program/flash operation.
          EOF

          (
            cd /tmp
            zip -qr \
              R62_BP1048_FAST4KCRC_EXACT_PROOF_EVIDENCE.zip \
              R62_BP1048_FAST4KCRC_EXACT_PROOF_EVIDENCE
            sha256sum \
              R62_BP1048_FAST4KCRC_EXACT_PROOF_EVIDENCE.zip \
              > R62_BP1048_FAST4KCRC_EXACT_PROOF_EVIDENCE.zip.sha256
          )

          cat /tmp/R62_BP1048_FAST4KCRC_EXACT_PROOF_EVIDENCE.zip.sha256

      - name: Upload R62 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R62-BP1048-FAST4KCRC-EXACT-PROOF-EVIDENCE
          path: |
            /tmp/R62_BP1048_FAST4KCRC_EXACT_PROOF_EVIDENCE.zip
            /tmp/R62_BP1048_FAST4KCRC_EXACT_PROOF_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: R62 final gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          cat /tmp/R62_EXACT_PROOF.txt 2>/dev/null || true
          cat /tmp/R62_METADATA_ROLES.txt 2>/dev/null || true
          cat /tmp/R62_TRANSIENT_STATE.txt 2>/dev/null || true

          test "${{ steps.symbols.outcome }}" = "success"
          test "${{ steps.disasm.outcome }}" = "success"
          test "${{ steps.algorithm.outcome }}" = "success"
          test "${{ steps.metadata_roles.outcome }}" = "success"

          grep -F 'R62_FAST4KCRC_ALGORITHM_PROVEN=YES' /tmp/R62_EXACT_PROOF.txt
          grep -F 'R62_ADDR_ZERO_GATE_PROVEN=YES' /tmp/R62_EXACT_PROOF.txt
          grep -F 'R62_WRITEBACK_A4_DWORD=0x10001000' /tmp/R62_EXACT_PROOF.txt
          grep -F 'R62_SAMPLE_FAST4KCRC=0x4F09' /tmp/R62_EXACT_PROOF.txt
          grep -F 'R62_CRC_STABLE_AFTER_EXCLUDED_WRITEBACK=YES' /tmp/R62_EXACT_PROOF.txt
          grep -F 'R62_TRANSIENT_PATCHED_SAMPLE_RETAINED=NO' /tmp/R62_TRANSIENT_STATE.txt
          grep -F 'FLASH_ALLOWED=NO' /tmp/R62_EXACT_PROOF.txt

          echo "R62_FAST4KCRC_EXACT_PROOF=PASS"
          echo "FLASH_ALLOWED=NO"
