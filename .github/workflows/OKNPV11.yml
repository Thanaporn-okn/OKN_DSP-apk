      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Verify generated V11 source identity
        shell: bash
        run: |
          set -euo pipefail
          echo "e40bac569ec09021a9eb5d7751784d2d74383aaa3ff6e3ab7fec7cbabc34dc10  app/src/main/java/com/okn/peramp/DspProtocol.java" | sha256sum -c -
          echo "18e1213296ff34d9dbda5befc5d5463908c15988df2bd503abf7cc46fd3fbe53  app/src/main/java/com/okn/peramp/BleManager.java" | sha256sum -c -
          echo "e2dad198ca20ad5884bbafd4c27eb136fdbf1b9d4306b11c56f8d71f190154a5  app/src/main/java/com/okn/peramp/MainActivity.java" | sha256sum -c -
          echo "1080c6a89baafe9d325c5029a3c32b1e45128d7ce46ebe6edbbb156c3123bb9b  app/src/main/java/com/okn/peramp/DspView.java" | sha256sum -c -
          echo "c45e06acb5cff2f23540ae5e8ed2f0387a8df2b24403c3bf10b599bbb33c3052  app/src/main/java/com/okn/peramp/DspState.java" | sha256sum -c -
          echo "255eed695c69cd564ca09fc30522f7c429ac6442ec8df75172305b61af935917  app/src/main/java/com/okn/peramp/CleanRoomDspEngine.java" | sha256sum -c -
          echo "d7b5bd49199d45c9fc2bc216c1794996570a8a35be297c3c52e724d05b57e3b9  app/src/main/java/com/okn/peramp/CleanRoomBiquadCodec.java" | sha256sum -c -
          echo "e273fe32f6880b5e9f295ba24749622bff659eb9ec4e02c1b7c5134bb05eb19e  Sources/validate_oknpv11.py" | sha256sum -c -
          echo "0340ffdf07a4f8bee9ec6c9f1696f70a1a2401c1e99d74e7bdb678a3cd211a38  Sources/validate_v39_reset_v11.py" | sha256sum -c -

      - name: Validate V11 clean-room engine frozen writers codec and no-unknown-TX gate
        shell: bash
        run: |
          set -euo pipefail
          python3 Sources/validate_v38_gate.py
          python3 Sources/validate_v39_reset_v11.py
          python3 Sources/validate_oknpv11.py

      - name: Build Debug and Release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk OKNPV11-debug.apk
          cp app/build/outputs/apk/release/app-release.apk OKNPV11-release.apk

      - name: Verify APK identity and test signing
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging OKNPV11-debug.apk | tee OKNPV11-apk-badging.txt
          grep -q "package: name='com.okn.peramp' versionCode='11000' versionName='11.0.0'" OKNPV11-apk-badging.txt
          grep -q "application-label:'OKN Peramp'" OKNPV11-apk-badging.txt
          {
            echo 'V11 release signing status: TEST SIGNING ONLY - debug key configured in build.gradle.'
            echo 'A user-owned production key is still required for public production distribution.'
            "$APKSIGNER" verify --verbose --print-certs OKNPV11-release.apk
          } | tee OKNPV11-signing.txt

      - name: Package V11 source reverse evidence and checksums
        shell: bash
        run: |
          set -euo pipefail
          zip -qr OKNPV11-source.zip app Sources build.gradle settings.gradle gradle.properties -x '*/build/*' -x '.gradle/*'
          cp Sources/OKNPV11_REVERSE_CHECKPOINT.txt OKNPV11-REVERSE-CHECKPOINT.txt
          cp Sources/OKNPV11_BUILD_NOTES.txt OKNPV11-BUILD-NOTES.txt
          cp Sources/V11_CLEAN_ROOM_ARCHITECTURE.txt OKNPV11-CLEAN-ROOM-ARCHITECTURE.txt
          cp Sources/V11_ORIGINAL_APP_STATIC_REVERSE.txt OKNPV11-ORIGINAL-APP-STATIC-REVERSE.txt
          cp Sources/V10_HARDWARE_BASELINE_PROOF.txt OKNPV11-HARDWARE-BASELINE-PROOF.txt
          cp Sources/V10_OUTPUT_GAIN_STATIC_DISCOVERY.txt OKNPV11-OUTPUT-GAIN-STATIC-DISCOVERY.txt
          cp Sources/ProtocolEvidence/GoloPine_DeviceDescription_REAL_20260906_204555.json OKNPV11-HISTORICAL-SAME-HARDWARE-DESCRIPTOR.json
          sha256sum OKNPV11-debug.apk OKNPV11-release.apk OKNPV11-source.zip OKNPV11-REVERSE-CHECKPOINT.txt OKNPV11-BUILD-NOTES.txt OKNPV11-CLEAN-ROOM-ARCHITECTURE.txt OKNPV11-ORIGINAL-APP-STATIC-REVERSE.txt OKNPV11-HARDWARE-BASELINE-PROOF.txt OKNPV11-OUTPUT-GAIN-STATIC-DISCOVERY.txt OKNPV11-HISTORICAL-SAME-HARDWARE-DESCRIPTOR.json OKNPV11-signing.txt > OKNPV11-SHA256SUMS.txt
          cat OKNPV11-SHA256SUMS.txt

      - name: Upload OKNPV11 artifact
        uses: actions/upload-artifact@v7
        with:
          name: OKNPV11
          path: |
            OKNPV11-debug.apk
            OKNPV11-release.apk
            OKNPV11-source.zip
            OKNPV11-SHA256SUMS.txt
            OKNPV11-apk-badging.txt
            OKNPV11-signing.txt
            OKNPV11-REVERSE-CHECKPOINT.txt
            OKNPV11-BUILD-NOTES.txt
            OKNPV11-CLEAN-ROOM-ARCHITECTURE.txt
            OKNPV11-ORIGINAL-APP-STATIC-REVERSE.txt
            OKNPV11-HARDWARE-BASELINE-PROOF.txt
            OKNPV11-OUTPUT-GAIN-STATIC-DISCOVERY.txt
            OKNPV11-HISTORICAL-SAME-HARDWARE-DESCRIPTOR.json
          if-no-files-found: error
          retention-days: 30
