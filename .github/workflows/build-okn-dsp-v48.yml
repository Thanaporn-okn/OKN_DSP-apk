name: Build OKN DSP V48 EQ Band Recovery

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_ANDROID_V48_EQ_BAND_RECOVERY.zip'
      - '.github/workflows/build-okn-dsp-v48.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify V48 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/okn_v48
          mkdir -p /tmp/okn_v48
          unzip -q OKN_DSP_ANDROID_V48_EQ_BAND_RECOVERY.zip -d /tmp/okn_v48

          check_file() { test -f "$1" || { echo "ERROR missing $1"; exit 1; }; echo "OK file: $1"; }
          check_text() { grep -Fq "$1" "$2" || { echo "ERROR missing marker '$1' in $2"; exit 1; }; echo "OK marker: $1"; }

          EQ=/tmp/okn_v48/app/src/main/java/com/okn/dsp/EqProofActivity.kt
          POLICY=/tmp/okn_v48/app/src/main/java/com/okn/dsp/protocol/EqBandRecoveryPolicy.kt
          GATE=/tmp/okn_v48/app/src/main/java/com/okn/dsp/protocol/WriteGate.kt
          GRADLE=/tmp/okn_v48/app/build.gradle.kts

          check_file "$EQ"
          check_file "$POLICY"
          check_file "$GATE"
          check_file "$GRADLE"
          check_file /tmp/okn_v48/README_V48.txt
          check_file /tmp/okn_v48/evidence/OKN_DSP_V48_EQ_RECOVERY_PLAN.txt
          check_file /tmp/okn_v48/evidence/OKN_DSP_V48_EQ_RECOVERY_PLAN.json
          check_file /tmp/okn_v48/evidence/OKN_DSP_V47_CURRENT_MINUS0P5_RECOVERY_NEEDED_CAPTURE.txt

          check_text 'versionCode = 48' "$GRADLE"
          check_text '3.0.0-v48-eq-band-recovery' "$GRADLE"
          check_text 'eqBandRecoveryEnabled: Boolean = true' "$GATE"
          check_text 'controlledEqBandProofEnabled: Boolean = false' "$GATE"
          check_text 'V46_TARGET_MINUS0P5DB' "$POLICY"
          check_text 'ORIGINAL_HEX' "$POLICY"
          check_text '0C0000000000C8420000000052B80E400000000000000000000000000000803FAE28FFBF9A5E7E3FAE28FFBF9A5E7E3F' "$POLICY"
          check_text 'V48_RECOVERY_READY' "$EQ"
          check_text 'V48_EQ_RECOVERY_WRITE_PLAIN=' "$EQ"
          check_text 'TX_EQ_CH1_BAND4_RECOVER_V48_A' "$EQ"
          check_text 'V48_RECOVERY_DESCRIPTOR_VERIFY' "$EQ"
          check_text 'V48_EQ_RECOVERY_COMPLETE' "$EQ"
          check_text 'recoveryVerifyDelayMs = 3000L' "$EQ"
          check_text 'recoveryRetryDelayMs = 2500L' "$EQ"
          check_text 'saveParams=false' "$EQ"

          if grep -Fq 'UfeCodec.encodeWrite(7' "$EQ" "$POLICY"; then
            echo 'ERROR: V48 recovery contains SaveParams ID7 write'
            exit 1
          fi
          if grep -Fq 'TX_EQ_CH1_BAND4_MINUS0P5DB' "$EQ"; then
            echo 'ERROR: V48 still contains target-lowering EQ write'
            exit 1
          fi
          echo 'OK: V48 is recovery-only, no SaveParams ID7 and no -0.5 target write'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/okn_v48
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and package artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn_v48/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          mkdir -p artifact
          cp "$APK" artifact/OKN_DSP_V48_EQ_BAND_RECOVERY-debug.apk
          cp /tmp/okn_v48/README_V48.txt artifact/
          cp /tmp/okn_v48/evidence/OKN_DSP_V48_EQ_RECOVERY_PLAN.txt artifact/
          cp /tmp/okn_v48/evidence/OKN_DSP_V48_EQ_RECOVERY_PLAN.json artifact/
          sha256sum artifact/OKN_DSP_V48_EQ_BAND_RECOVERY-debug.apk > artifact/OKN_DSP_V48_EQ_BAND_RECOVERY-debug.sha256
          ls -lh artifact

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-V48-EQ-BAND-RECOVERY-debug-apk
          path: artifact/
          if-no-files-found: error
          retention-days: 30
