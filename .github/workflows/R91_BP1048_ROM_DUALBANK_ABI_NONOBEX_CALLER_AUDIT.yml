name: R91 BP1048 ROM dual-bank ABI and non-OBEX caller audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r91-bp1048-rom-dualbank-abi-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_REPO: https://github.com/leadercxn/bp1048_sdk_v0.1.12.git
  SDK_COMMIT: 8105bd864b04995d81c9f9ae77cb158259f39015
  FLASH_ALLOWED: 'NO'

jobs:
  offline-rom-dualbank-audit:
    name: OFFLINE ROM dual-bank ABI/non-OBEX caller audit - no execution/no USB/no board/no flash
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/R91_SAFETY.txt <<'EOF'
          R91_STATIC_ONLY=YES
          SOURCE=PUBLIC_BP1048_SDK_EXACT_COMMIT
          SDK_COMMIT=8105bd864b04995d81c9f9ae77cb158259f39015
          BOARD_CONTACT=NO
          USB_DEVICE_ACCESS=NO
          BLUETOOTH_DEVICE_ACCESS=NO
          VENDOR_BINARY_EXECUTION=NO
          SEND_AA55=NO
          SEND_0X11=NO
          SEND_CHIPERAS_CODEDATA_BOOTDAT_CONSTDAT_CNFGDAT_BTUPDAT_UPINFO_CXXX=NO
          R79_PHYSICAL_REPLUG_AUTORUN=NO
          ERASE_PROGRAM_FLASH=NO
          REFERENCE_SDK_EQUALS_PRODUCTION=NO
          PRODUCTION_STAGING_OFFSET_ASSUMPTION=FORBIDDEN
          FLASH_ALLOWED=NO
          PURPOSE=RECOVER_ROM_BANKB_ABI_FIND_NON_OBEX_CALLERS_AND_AUDIT_REFERENCE_STAGING_LAYOUT
          EOF
          cat /tmp/R91_SAFETY.txt

      - name: Install static tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils file xxd
          python3 -m venv /tmp/r91-venv
          /tmp/r91-venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir pyelftools
          echo "/tmp/r91-venv/bin" >> "$GITHUB_PATH"

      - name: Clone exact SDK commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r91/evidence
          git clone --filter=blob:none --no-checkout "$SDK_REPO" /tmp/r91/sdk
          cd /tmp/r91/sdk
          git fetch --depth=1 origin "$SDK_COMMIT"
          git checkout --detach "$SDK_COMMIT"
          HEAD="$(git rev-parse HEAD)"
          test "$HEAD" = "$SDK_COMMIT"
          printf 'SDK_COMMIT_MATCH=YES\nSDK_HEAD=%s\n' "$HEAD" \
            | tee /tmp/r91/evidence/R91_SDK_GATE.txt

      - name: Exact source caller inventory
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r91/sdk

          grep -RInaE \
            'ROM_BankBUpgradeApply|ROM_BankBUpgradeBBankAddrGet|ROM_BankBUpgradeReturnCodeGet|ROM_SysReset|DualBankUpdateReboot|FLASH_MVA_UPDATE_START_OFFSET' \
            --exclude-dir=.git . \
            > /tmp/r91/evidence/R91_ALL_BANKB_SOURCE_HITS.txt || true

          grep -RInaE \
            'ROM_BankBUpgradeApply|ROM_BankBUpgradeBBankAddrGet|ROM_BankBUpgradeReturnCodeGet' \
            --exclude-dir=.git . \
            | grep -v 'BT_Audio_APP/bt_audio_app_src/apps/bt_obex_upgrade.c' \
            | grep -v 'MVsB1_Base_SDK/driver/driver/inc/rom.h' \
            > /tmp/r91/evidence/R91_NON_OBEX_BANKB_SOURCE_HITS.txt || true

          grep -RInaE \
            'MVA_BT_OBEX_UPDATE_FUNC_SUPPORT' \
            BT_Audio_APP MVsB1_Base_SDK 2>/dev/null \
            > /tmp/r91/evidence/R91_OBEX_FEATURE_FLAG_HITS.txt || true

          sed -n '1,600p' /tmp/r91/evidence/R91_ALL_BANKB_SOURCE_HITS.txt
          echo '--- NON OBEX ---'
          cat /tmp/r91/evidence/R91_NON_OBEX_BANKB_SOURCE_HITS.txt
          echo '--- FEATURE FLAG ---'
          cat /tmp/r91/evidence/R91_OBEX_FEATURE_FLAG_HITS.txt

      - name: Copy exact reference source evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r91/sdk

          cp BT_Audio_APP/bt_audio_app_src/apps/bt_obex_upgrade.c \
            /tmp/r91/evidence/R91_bt_obex_upgrade.c
          cp MVsB1_Base_SDK/driver/driver/inc/rom.h \
            /tmp/r91/evidence/R91_rom.h
          cp BT_Audio_APP/bt_audio_app_src/inc/flash_config.h \
            /tmp/r91/evidence/R91_flash_config.h
          cp BT_Audio_APP/bt_audio_app_src/inc/bt_config.h \
            /tmp/r91/evidence/R91_bt_config.h

          sha256sum \
            /tmp/r91/evidence/R91_bt_obex_upgrade.c \
            /tmp/r91/evidence/R91_rom.h \
            /tmp/r91/evidence/R91_flash_config.h \
            /tmp/r91/evidence/R91_bt_config.h \
            > /tmp/r91/evidence/R91_SOURCE_SHA256.txt

      - name: Extract rom.o from libDriver.a and enumerate symbols relocations
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r91/sdk

          LIB=MVsB1_Base_SDK/driver/driver/libDriver.a
          test -f "$LIB"
          mkdir -p /tmp/r91/romobj
          cp "$LIB" /tmp/r91/romobj/libDriver.a
          cd /tmp/r91/romobj

          ar t libDriver.a > /tmp/r91/evidence/R91_LIBDRIVER_MEMBERS.txt
          ar x libDriver.a rom.o
          test -f rom.o

          file rom.o | tee /tmp/r91/evidence/R91_ROM_O_FILETYPE.txt
          sha256sum rom.o | tee /tmp/r91/evidence/R91_ROM_O_SHA256.txt

          readelf -h rom.o > /tmp/r91/evidence/R91_ROM_O_ELF_HEADER.txt || true
          readelf -S rom.o > /tmp/r91/evidence/R91_ROM_O_SECTIONS.txt || true
          readelf -Ws rom.o > /tmp/r91/evidence/R91_ROM_O_SYMBOLS.txt || true
          readelf -r rom.o > /tmp/r91/evidence/R91_ROM_O_RELOCS.txt || true

          nm -an rom.o > /tmp/r91/evidence/R91_ROM_O_NM.txt || true
          objdump -h rom.o > /tmp/r91/evidence/R91_ROM_O_OBJDUMP_HEADERS.txt 2>&1 || true
          objdump -dr rom.o > /tmp/r91/evidence/R91_ROM_O_DISASM.txt 2>&1 || true

          grep -Ei \
            'ROM_BankBUpgradeApply|ROM_BankBUpgradeBBankAddrGet|ROM_BankBUpgradeReturnCodeGet|ROM_SysReset|ROM_CRC16|ROM_UserRegister' \
            /tmp/r91/evidence/R91_ROM_O_SYMBOLS.txt \
            > /tmp/r91/evidence/R91_ROM_TARGET_SYMBOLS.txt || true

          cat /tmp/r91/evidence/R91_ROM_TARGET_SYMBOLS.txt
          echo '--- relocations ---'
          sed -n '1,500p' /tmp/r91/evidence/R91_ROM_O_RELOCS.txt

      - name: Parse ELF symbol bytes and relocation ownership
        shell: bash
        run: |
          set -euo pipefail
          /tmp/r91-venv/bin/python - <<'PY'
          from pathlib import Path
          import json
          from elftools.elf.elffile import ELFFile

          obj=Path('/tmp/r91/romobj/rom.o')
          out=Path('/tmp/r91/evidence')
          targets={
              'ROM_BankBUpgradeApply',
              'ROM_BankBUpgradeBBankAddrGet',
              'ROM_BankBUpgradeReturnCodeGet',
              'ROM_SysReset',
              'ROM_CRC16',
              'ROM_UserRegisterSet',
              'ROM_UserRegisterClear',
              'ROM_UserRegisterGet',
          }

          with obj.open('rb') as f:
              elf=ELFFile(f)
              symtab=elf.get_section_by_name('.symtab')
              recs=[]
              if symtab:
                  for sym in symtab.iter_symbols():
                      if sym.name not in targets:
                          continue
                      st=sym.entry
                      sec_idx=st['st_shndx']
                      sec_name=None
                      data_hex=None
                      if isinstance(sec_idx,int):
                          sec=elf.get_section(sec_idx)
                          if sec is not None:
                              sec_name=sec.name
                              start=st['st_value']
                              size=st['st_size']
                              blob=sec.data()
                              if 0 <= start < len(blob):
                                  data_hex=blob[start:start+size].hex()
                      recs.append({
                          'name':sym.name,
                          'value':st['st_value'],
                          'size':st['st_size'],
                          'bind':st['st_info']['bind'],
                          'type':st['st_info']['type'],
                          'section':sec_name,
                          'bytes_hex':data_hex,
                      })

              relocs=[]
              for sec in elf.iter_sections():
                  if not sec.name.startswith('.rel') and not sec.name.startswith('.rela'):
                      continue
                  linked=elf.get_section(sec['sh_link']) if sec['sh_link'] else None
                  for rel in sec.iter_relocations():
                      sym_name=None
                      try:
                          sym=linked.get_symbol(rel['r_info_sym']) if linked is not None else None
                          sym_name=sym.name if sym else None
                      except Exception:
                          pass
                      relocs.append({
                          'reloc_section':sec.name,
                          'offset':rel['r_offset'],
                          'type':rel['r_info_type'],
                          'symbol':sym_name,
                          'addend':rel.entry.get('r_addend'),
                      })

          out.joinpath('R91_ROM_TARGET_SYMBOL_BYTES.json').write_text(
              json.dumps(recs,indent=2)+'\n'
          )
          out.joinpath('R91_ROM_RELOCATIONS.json').write_text(
              json.dumps(relocs,indent=2)+'\n'
          )

          print(json.dumps(recs,indent=2))
          PY

      - name: Reference staging-layout conflict audit
        shell: bash
        run: |
          set -euo pipefail
          /tmp/r91-venv/bin/python - <<'PY'
          from pathlib import Path
          import json,re

          root=Path('/tmp/r91/sdk')
          out=Path('/tmp/r91/evidence')
          obex=(root/'BT_Audio_APP/bt_audio_app_src/apps/bt_obex_upgrade.c').read_text(errors='ignore')
          rom=(root/'MVsB1_Base_SDK/driver/driver/inc/rom.h').read_text(errors='ignore')
          fc=(root/'BT_Audio_APP/bt_audio_app_src/inc/flash_config.h').read_text(errors='ignore')
          bc=(root/'BT_Audio_APP/bt_audio_app_src/inc/bt_config.h').read_text(errors='ignore')

          m=re.search(r'FLASH_MVA_UPDATE_START_OFFSET\s+(0x[0-9A-Fa-f]+)',obex)
          staging=int(m.group(1),16) if m else None

          def val(name, text):
              mm=re.search(r'#define\s+'+re.escape(name)+r'\s+(?:\(?\s*)?(0x[0-9A-Fa-f]+)',text)
              return int(mm.group(1),16) if mm else None

          const_addr=val('CONST_DATA_ADDR',fc)
          code_addr=val('CODE_ADDR',fc)

          # Capture raw P4 expressions separately because several are base + 0x200000.
          p4={}
          in_p4=False
          for line in fc.splitlines():
              if '#ifdef CFG_CHIP_BP1048P4' in line:
                  in_p4=True; continue
              if in_p4 and line.strip().startswith('#else'):
                  break
              if in_p4:
                  mm=re.search(r'#define\s+([A-Z0-9_]+)\s+(.+)',line)
                  if mm:
                      p4[mm.group(1)]=mm.group(2).split('//')[0].strip()

          obex_flag_default_enabled=bool(
              re.search(r'^\s*#define\s+MVA_BT_OBEX_UPDATE_FUNC_SUPPORT\b',bc,re.M)
          )

          mode1='upgradeMode = 1' in rom and 'assigning the bank b start address' in rom
          mode0='upgradeMode = 0' in rom and 'auto searching' in rom.lower()
          alignment_4k='0x1000' in rom and '4096' in rom

          # Conservative interval note only: staging start < CONST_DATA_ADDR does not prove
          # overlap without actual package size. It merely sets the maximum gap.
          gap_to_const=(const_addr-staging) if staging is not None and const_addr is not None else None

          info={
              'reference_staging_offset':staging,
              'reference_code_addr':code_addr,
              'reference_const_data_addr':const_addr,
              'reference_gap_staging_to_const':gap_to_const,
              'p4_raw_layout_expressions':p4,
              'obex_feature_default_enabled':obex_flag_default_enabled,
              'rom_mode1_explicit_bank_b_address_supported':mode1,
              'rom_mode0_auto_search_supported':mode0,
              'rom_bank_b_address_4k_alignment_required':alignment_4k,
              'obex_crc16_ccitt_init_zero':('CRC16(' in obex and 'uint16_t Crc16 = 0' in obex),
              'obex_write_chunk_bytes':4096 if 'SpiFlashWrite(write_addr, opp_update_buf, 4096' in obex else None,
              'obex_erase_block_bytes':65536 if 'FileTotalLen/65536' in obex else None,
              'obex_apply_mode':1 if 'ROM_BankBUpgradeApply(1, FLASH_MVA_UPDATE_START_OFFSET)' in obex else None,
              'obex_calls_system_reset':'ROM_SysReset();' in obex,
              'staging_offset_comment_warns_real_condition':'MUST be based on the real condition' in obex,
          }
          out.joinpath('R91_REFERENCE_LAYOUT_AUDIT.json').write_text(
              json.dumps(info,indent=2)+'\n'
          )
          print(json.dumps(info,indent=2))
          PY

      - name: Build decision and report
        shell: bash
        run: |
          set -euo pipefail
          /tmp/r91-venv/bin/python - <<'PY'
          from pathlib import Path
          import json

          p=Path('/tmp/r91/evidence')
          layout=json.loads((p/'R91_REFERENCE_LAYOUT_AUDIT.json').read_text())
          syms=json.loads((p/'R91_ROM_TARGET_SYMBOL_BYTES.json').read_text())
          nonobex=(p/'R91_NON_OBEX_BANKB_SOURCE_HITS.txt').read_text(errors='ignore').strip()

          symbol_names={x['name'] for x in syms}
          required={
              'ROM_BankBUpgradeApply',
              'ROM_BankBUpgradeBBankAddrGet',
              'ROM_BankBUpgradeReturnCodeGet',
              'ROM_SysReset',
          }

          decision={
              'SDK_COMMIT_MATCH':True,
              'REFERENCE_OBEX_UPDATE_SOURCE_IMPLEMENTATION_PRESENT':True,
              'REFERENCE_OBEX_FEATURE_DEFAULT_ENABLED':layout['obex_feature_default_enabled'],
              'REFERENCE_STAGING_OFFSET':layout['reference_staging_offset'],
              'REFERENCE_STAGING_OFFSET_WARNED_AS_CONDITIONAL':layout['staging_offset_comment_warns_real_condition'],
              'ROM_MODE1_EXPLICIT_BANKB_ADDR_SUPPORTED':layout['rom_mode1_explicit_bank_b_address_supported'],
              'ROM_MODE0_AUTO_SEARCH_SUPPORTED':layout['rom_mode0_auto_search_supported'],
              'ROM_BANKB_ADDR_4K_ALIGNMENT_REQUIRED':layout['rom_bank_b_address_4k_alignment_required'],
              'ROM_CORE_DUALBANK_SYMBOLS_PRESENT':required.issubset(symbol_names),
              'NON_OBEX_SOURCE_CALLER_TO_BANKB_API_PRESENT':bool(nonobex),
              'REFERENCE_LAYOUT_EQUALS_PRODUCTION':False,
              'REFERENCE_STAGING_OFFSET_SAFE_FOR_PRODUCTION':False,
              'PHONE_DIRECT_USB_BOOTSTRAP_PROVEN_FROM_R91':False,
              'PRODUCTION_FLASH_LAYOUT_PROVEN_FROM_R91':False,
              'PRODUCTION_BACKUP_RECOVERY_PROVEN_FROM_R91':False,
              'LIVE_BOARD_TEST_ALLOWED_FROM_R91':False,
              'FLASH_ALLOWED':False,
          }
          p.joinpath('R91_DECISION.json').write_text(json.dumps(decision,indent=2)+'\n')

          lines=[
              '# R91 BP1048 ROM dual-bank ABI and non-OBEX caller audit',
              '',
              'OFFLINE/STATIC ONLY. No USB/Bluetooth/board access and no flash.',
              '',
              '## Decision',
              '```json',json.dumps(decision,indent=2),'```','',
              '## Reference layout/state-machine facts',
              '```json',json.dumps(layout,indent=2),'```','',
              '## ROM target symbols',
          ]
          for x in syms:
              lines.append(
                  f"- `{x['name']}` size={x['size']} section={x['section']} "
                  f"bytes={x['bytes_hex']}"
              )

          lines += ['','## Non-OBEX Bank-B source callers']
          if nonobex:
              lines.extend('- '+x for x in nonobex.splitlines())
          else:
              lines.append('- none found after excluding OBEX implementation and rom.h declarations')

          lines += [
              '',
              '## Interpretation gate',
              '- The public reference SDK proves a ROM-managed dual-bank upgrade mechanism.',
              '- The OBEX sample stages an MVA at 0x100000, validates trailing CRC16 metadata, calls ROM_BankBUpgradeApply(mode 1, address), then resets.',
              '- The source itself warns that 0x100000 MUST be based on the real condition, so it is not accepted as a production GoloPine staging address.',
              '- A reference ROM API/trampoline does not prove that stock GoloPine production firmware exposes a safe phone-direct caller.',
              '- No live board test follows from R91.',
              '- FLASH_ALLOWED=NO.',
          ]
          p.joinpath('R91_REPORT.md').write_text('\n'.join(lines)+'\n')
          print(json.dumps(decision,indent=2))
          PY
          sed -n '1,850p' /tmp/r91/evidence/R91_REPORT.md

      - name: Package evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/R91_SAFETY.txt /tmp/r91/evidence/ || true
          (cd /tmp/r91/evidence && zip -9 -r /tmp/R91_BP1048_ROM_DUALBANK_ABI_NONOBEX_EVIDENCE.zip .)
          sha256sum /tmp/R91_BP1048_ROM_DUALBANK_ABI_NONOBEX_EVIDENCE.zip \
            > /tmp/R91_BP1048_ROM_DUALBANK_ABI_NONOBEX_EVIDENCE.zip.sha256

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R91-BP1048-ROM-DUALBANK-ABI-NONOBEX-EVIDENCE
          path: |
            /tmp/R91_BP1048_ROM_DUALBANK_ABI_NONOBEX_EVIDENCE.zip
            /tmp/R91_BP1048_ROM_DUALBANK_ABI_NONOBEX_EVIDENCE.zip.sha256
          if-no-files-found: error
