name: OKN DSP V50 CH Gain Probe Test APK

on:
  push:
    branches: [main, master]
    paths: ['.github/workflows/build-v50-test.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.9'
  ANDROID_PLATFORM: 'android-35'
  ANDROID_BUILD_TOOLS: '35.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Restore proven V49 and apply V50 patch
        shell: bash
        run: |
          set -euo pipefail
          BASE_WF="$GITHUB_WORKSPACE/.github/workflows/build-v49-test.yml"
          WORK="$GITHUB_WORKSPACE/v50-test-src"
          test -s "$BASE_WF"
          rm -rf "$WORK" && mkdir -p "$WORK"
          awk '/okn-v49-test[.]tar[.]gz[.]b64.*B64_EOF/ {capture=1; next} capture && /^[[:space:]]*B64_EOF[[:space:]]*$/ {exit} capture {gsub(/^[[:space:]]+/, ""); print}' "$BASE_WF" > "$RUNNER_TEMP/v49.b64"
          base64 -d "$RUNNER_TEMP/v49.b64" > "$RUNNER_TEMP/v49.tar.gz"
          tar -xzf "$RUNNER_TEMP/v49.tar.gz" -C "$WORK"
          cd "$WORK"
          sha256sum -c SOURCE_HASHES.txt
          cat > "$RUNNER_TEMP/v50.patch.gz.b64" <<'PATCH_EOF'
