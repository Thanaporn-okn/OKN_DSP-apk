      - name: Safety invariants
        shell: bash
        run: |
          set -euo pipefail
          cd "$SRC_DIR"
          grep -q "applicationId 'com.okn.dsp.v50test'" app/build.gradle
          grep -q "versionName '50.0.0-test'" app/build.gradle
          grep -q 'android:label="OKN DSP V50 Test"' app/src/main/AndroidManifest.xml
          grep -q 'CH_GAIN_CANDIDATE_IDS = new int[] {22, 23, 24, 25, 26, 27, 28}' app/src/main/java/com/okn/dsp/DspProtocol.java
          grep -q 'CH_GAIN_STEP_DB = 0.5f' app/src/main/java/com/okn/dsp/DspProtocol.java
          grep -q 'channelGainWriteGate = ok == 7' app/src/main/java/com/okn/dsp/BleManager.java
          grep -q 'probeChannelGainCandidates' app/src/main/java/com/okn/dsp/BleManager.java
          grep -q 'VERIFY OK' app/src/main/java/com/okn/dsp/BleManager.java
          grep -q 'PROBE CH GAIN' app/src/main/java/com/okn/dsp/DspView.java
          grep -q 'TX / RX Test Log' app/src/main/java/com/okn/dsp/DspView.java
          if grep -R -nE 'UsbManager|UsbDevice|usb[.]host|FLASH_ERASE_WRITE|firmware flash' app/src/main/java app/src/main/AndroidManifest.xml; then exit 1; fi
          echo V50_SAFETY_PASS

      - name: Protocol self-test
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/protocol-test"; mkdir -p "$T"
          javac -d "$T" "$SRC_DIR"/app/src/main/java/com/okn/dsp/protocol/*.java
          cat > "$T/RunSelfTest.java" <<'JAVA_EOF'
          import com.okn.dsp.protocol.ProtocolSelfTest;
          public final class RunSelfTest { public static void main(String[] args) { ProtocolSelfTest.runOrThrow(); System.out.println("PROTOCOL_SELFTEST_PASS"); } }
          JAVA_EOF
          javac -cp "$T" -d "$T" "$T/RunSelfTest.java"
          java -cp "$T" RunSelfTest

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n1)"; fi
          "$SDKMANAGER" "platforms;$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/v50-gradle.log"
          for attempt in 1 2 3; do
            set +e
            gradle -p "$SRC_DIR" --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee "$LOG"
            rc=${PIPESTATUS[0]}; set -e
            [[ "$rc" -eq 0 ]] && exit 0
            if [[ "$attempt" -lt 3 ]] && grep -Eqi '429|Too Many Requests|HTTP 5[0-9][0-9]|timed out|Connection reset' "$LOG"; then sleep $((attempt*20)); else exit "$rc"; fi
          done

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$SRC_DIR/app/build/outputs/apk/debug/app-debug.apk"; test -s "$APK"
          cp "$APK" dist/OKN_DSP_V50_50.0.0-test-debug.apk
          sha256sum dist/OKN_DSP_V50_50.0.0-test-debug.apk > dist/OKN_DSP_V50_50.0.0-test-debug.apk.sha256
          cat > dist/TEST_SCOPE.txt <<'TXT'
          OKN DSP V50 CH Gain Probe trial build
          BLE only (AB00/AB01/AB02). Candidate CH gain IDs 22..28 are a hypothesis.
          Writes remain LOCKED until all 7 IDs pass read-only FLOAT32 probe in -70..+6 dB.
          Step is 0.5 dB. Every write is read back; mismatch/timeout re-locks controls.
          Disconnect/session loss re-locks controls. No firmware flash. No USB-C transport in this build.
          TXT

      - uses: actions/upload-artifact@v7
        with:
          name: OKN_DSP_V50_TEST_APK
          path: dist/
          if-no-files-found: error
          retention-days: 30
