name: OKN BP1048P4 MASTER V33 PARTIAL DESCRIPTION SALVAGE AND MISSING FRAGMENT FORENSICS OFFLINE

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/OKN_BP1048P4_MASTER_V33_PARTIAL_DESCRIPTION_SALVAGE_MISSING_FRAGMENT_FORENSICS_OFFLINE.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  V32_RUN_ID: "37189653487"
  V32_ARTIFACT_ID: "11298720275"
  EXPECTED_DESCRIPTION_BYTES: "18261"
  CAPTURED_REPORTS: "72"
  FLASH_ALLOWED: "NO"
  ERASE_ALLOWED: "NO"
  WRITE_ALLOWED: "NO"
  FEATURE_REPORT_ALLOWED: "NO"
  LIVE_DSP_ALLOWED: "NO"

jobs:
  v33:
    name: Salvage mapping and prove missing-fragment model OFFLINE
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          test "$ERASE_ALLOWED" = "NO"
          test "$WRITE_ALLOWED" = "NO"
          test "$FEATURE_REPORT_ALLOWED" = "NO"
          test "$LIVE_DSP_ALLOWED" = "NO"
          rm -rf /tmp/v33
          mkdir -p /tmp/v33/{evidence,out}
          cat > /tmp/v33/evidence/00_SCOPE.txt <<EOF
          REVISION=MASTER-V33
          MODE=OFFLINE_V32_ARTIFACT_FORENSICS
          SOURCE_RUN_ID=$V32_RUN_ID
          SOURCE_ARTIFACT_ID=$V32_ARTIFACT_ID
          LIVE_DSP_IO=NO
          FEATURE_REPORT=NO
          FLASH_ALLOWED=NO
          ERASE_ALLOWED=NO
          WRITE_ALLOWED=NO
          EOF

      - name: Download exact V32 evidence artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$V32_ARTIFACT_ID/zip" \
            -o /tmp/v33/v32.zip
          unzip -q /tmp/v33/v32.zip -d /tmp/v33/v32
          test -s /tmp/v33/v32/04_FULL_REPLAY.txt
          test -s /tmp/v33/v32/05_V32_DECISION.json
          test -s /tmp/v33/v32/DEVICE_DESCRIPTION_BYTES.bin
          sha256sum /tmp/v33/v32/* > /tmp/v33/evidence/01_V32_ARTIFACT_SHA256SUMS.txt

      - name: Salvage Device Description inventory and missing-fragment model
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v33/analyze.py <<'PY'
          from pathlib import Path
          import json,re

          root=Path("/tmp/v33")
          ev=root/"evidence"
          src=root/"v32"

          decision=json.loads((src/"05_V32_DECISION.json").read_text())
          raw=(src/"DEVICE_DESCRIPTION_BYTES.bin").read_bytes()
          text=raw.decode("utf-8","replace")

          expected=int(decision["final_dev_description_length"])
          accumulated=int(decision["final_accumulated_bytes"])
          missing=expected-accumulated
          captured_reports=72

          first_contribution=231
          full_contribution=234

          full_missing, tail_missing = divmod(missing, full_contribution)
          missing_report_hypothesis = full_missing + (1 if tail_missing else 0)
          expected_report_hypothesis = captured_reports + missing_report_hypothesis

          exact=[]
          for m in re.finditer(r'\{"ID":(\d+),"type":(\d+),"name":"([^"]+)"',text):
              exact.append({
                  "ID":int(m.group(1)),
                  "type":int(m.group(2)),
                  "name":m.group(3),
                  "offset":m.start(),
                  "evidence":"exact_regex"
              })

          channel_names=[
              "BiquadCascadeLeftChannel",
              "BiquadCascadeRightChannel",
              "BiquadCascadeBassChannel",
              "BiquadCascade4thChannel",
              "BiquadCascade5thChannel",
              "BiquadCascade6thChannel",
              "BiquadCascade7thChannel",
          ]

          channel_hits=[]
          for name in channel_names:
              pos=text.find(name)
              if pos < 0:
                  channel_hits.append({"name":name,"present":False})
                  continue

              lo=max(0,pos-160)
              hi=min(len(text),pos+350)
              ctx=text[lo:hi]

              idm=re.search(
                  r'\{"ID":(\d+),"type":4084,"name":"'+re.escape(name)+r'"',
                  ctx
              )
              descm=re.search(r'"desc":"([^"]*)"',text[pos:hi])

              channel_hits.append({
                  "name":name,
                  "present":True,
                  "offset":pos,
                  "exact_id":int(idm.group(1)) if idm else None,
                  "description":descm.group(1) if descm else None,
                  "id_status":"PROVEN" if idm else "NOT_RECOVERED_FROM_CORRUPTED_PREFIX"
              })

          for h in channel_hits:
              if h.get("name")=="BiquadCascade7thChannel" and h.get("present") and h.get("exact_id") is None:
                  h["structural_candidate_id"]=17
                  h["structural_candidate_status"]="INFERRED_ONLY_NOT_PROVEN"

          important_names=[
              "SaveParams","MasterVolume","BassVolume","BassCutoff",
              "BassBoost","MiddleBoost","TrebleBoost"
          ]
          important=[]
          for name in important_names:
              important.extend(x for x in exact if x["name"]==name)

          json_error=None
          left=text.find("{")
          right=text.rfind("}")
          if left>=0 and right>left:
              try:
                  json.loads(text[left:right+1])
              except Exception as e:
                  json_error={"type":type(e).__name__,"message":str(e)}

          model={
              "revision":"MASTER-V33",
              "classification":"OFFLINE_PARTIAL_DESCRIPTION_SALVAGE_NOT_FOR_FLASH",
              "source_v32_status":decision.get("status"),
              "expected_description_bytes":expected,
              "accumulated_description_bytes":accumulated,
              "missing_description_bytes":missing,
              "captured_reports":captured_reports,
              "first_report_decoded_contribution":first_contribution,
              "full_report_decoded_contribution":full_contribution,
              "missing_full_fragment_equivalents":full_missing,
              "missing_tail_bytes":tail_missing,
              "missing_report_hypothesis":missing_report_hypothesis,
              "expected_total_report_hypothesis":expected_report_hypothesis,
              "model_exact_arithmetic_check":
                  full_missing*full_contribution+tail_missing==missing,
              "partial_json_parse_error":json_error,
              "exact_inventory_count":len(exact),
              "exact_inventory":exact,
              "important_exact_controls":important,
              "channel_mapping":channel_hits,
              "next_capture_transport_requirement":
                  "QUEUED_INTERRUPT_IN_OR_EQUIVALENT_NO_SNAPSHOT_LOSS",
              "new_live_startup_with_0x11_allowed":False,
              "live_capture_authorized":False,
              "flash_allowed":False
          }

          (ev/"02_V33_FORENSICS.json").write_text(
              json.dumps(model,indent=2,ensure_ascii=False)+"\n")

          with (ev/"03_EXACT_INVENTORY.tsv").open("w") as f:
              f.write("ID\ttype\tname\toffset\n")
              for x in exact:
                  f.write(f'{x["ID"]}\t{x["type"]}\t{x["name"]}\t{x["offset"]}\n')

          with (ev/"04_CHANNEL_MAPPING.tsv").open("w") as f:
              f.write("name\tpresent\texact_id\tid_status\tdescription\tstructural_candidate_id\tcandidate_status\n")
              for x in channel_hits:
                  f.write("\t".join([
                      str(x.get("name","")),
                      str(x.get("present","")),
                      str(x.get("exact_id","")),
                      str(x.get("id_status","")),
                      str(x.get("description","")),
                      str(x.get("structural_candidate_id","")),
                      str(x.get("structural_candidate_status","")),
                  ])+"\n")

          status=(
              "SEVEN_REPORTS_MISSING_MODEL_EXACT_AND_PARTIAL_MAPPING_SALVAGED"
              if model["model_exact_arithmetic_check"] and missing_report_hypothesis==7
              else "MISSING_FRAGMENT_MODEL_REVIEW_REQUIRED"
          )

          md=f"""# MASTER V33 FINAL DECISION

          - V32 declared Device Description length: **{expected} bytes**
          - V32 accumulated decoded bytes: **{accumulated} bytes**
          - Missing decoded bytes: **{missing} bytes**
          - Captured V31 reports: **{captured_reports}**
          - Full decoded fragment contribution: **{full_contribution} bytes**
          - Missing-fragment model: **{full_missing} full fragments + {tail_missing} tail bytes**
          - Missing report hypothesis: **{missing_report_hypothesis}**
          - Expected total report hypothesis: **{expected_report_hypothesis}**
          - Exact arithmetic check: **{model['model_exact_arithmetic_check']}**
          - Exact recoverable inventory entries: **{len(exact)}**
          - New live startup containing byte 0x11: **NOT ALLOWED**
          - Live capture authorized: **NO**
          - Flash/erase/write: **NO / NO / NO**

          Status: **{status}**

          The partial decoded text proves several production control and channel
          mappings, but missing fragments corrupt the JSON. The next live capture
          must not reuse the forbidden 0x11 startup path. Before any new hardware
          run, recover a safe no-0x11 entry path and a queued interrupt-IN receive
          path offline.

          Classification:
          **OFFLINE_PARTIAL_DESCRIPTION_SALVAGE_NOT_FOR_FLASH**
          """
          (ev/"05_V33_FINAL_DECISION.md").write_text(md)
          print(md)
          PY

          python3 /tmp/v33/analyze.py
          cat /tmp/v33/evidence/05_V33_FINAL_DECISION.md >> "$GITHUB_STEP_SUMMARY"

      - name: Package evidence
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/v33/evidence/* /tmp/v33/out/
          (cd /tmp/v33/out && sha256sum * > SHA256SUMS.txt)

      - name: Upload V33 evidence
        uses: actions/upload-artifact@v4
        with:
          name: OKN-BP1048P4-MASTER-V33-PARTIAL-DESCRIPTION-SALVAGE-EVIDENCE
          path: /tmp/v33/out/*
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed assertion
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          test "$ERASE_ALLOWED" = "NO"
          test "$WRITE_ALLOWED" = "NO"
          test "$FEATURE_REPORT_ALLOWED" = "NO"
          test "$LIVE_DSP_ALLOWED" = "NO"
          echo "MASTER_V33=PASS"
          echo "LIVE_DSP_IO=NO"
          echo "FLASH_ALLOWED=NO"
