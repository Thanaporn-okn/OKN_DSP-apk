      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Verify generated V9 source identity
        shell: bash
        run: |
          set -euo pipefail
          echo "e40bac569ec09021a9eb5d7751784d2d74383aaa3ff6e3ab7fec7cbabc34dc10  app/src/main/java/com/okn/peramp/DspProtocol.java" | sha256sum -c -
          echo "4723ebfcb692bf7dc99ee392b8d3587ccb24427c9ed7c66a1cf175891ce69c1e  app/src/main/java/com/okn/peramp/BleManager.java" | sha256sum -c -
          echo "cd369723044c10a3cdc601f46d68087e8ab532a1492276e6e6af55aa81d76256  app/src/main/java/com/okn/peramp/MainActivity.java" | sha256sum -c -
          echo "aa4e4f0d1f2db0c774fd7f750b6beef7452c2f0fdcac0b9f087e245e9c342914  app/src/main/java/com/okn/peramp/DspView.java" | sha256sum -c -

      - name: Validate V9 frozen hardware core, restart proof, PEQ safety and no-unknown-TX gate
        shell: bash
        run: |
          set -euo pipefail
          python3 Sources/validate_v38_gate.py
          python3 Sources/validate_v39_reset_v9.py
          python3 Sources/validate_oknpv9.py

      - name: Build Debug and Release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk OKNPV9-debug.apk
          cp app/build/outputs/apk/release/app-release.apk OKNPV9-release.apk

      - name: Verify APK identity and test signing
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging OKNPV9-debug.apk | tee OKNPV9-apk-badging.txt
          grep -q "package: name='com.okn.peramp' versionCode='9000' versionName='9.0.0'" OKNPV9-apk-badging.txt
          grep -q "application-label:'OKN Peramp'" OKNPV9-apk-badging.txt
          {
            echo 'V9 release signing status: TEST SIGNING ONLY - debug key configured in build.gradle.'
            echo 'A user-owned production key is still required for public production distribution.'
            "$APKSIGNER" verify --verbose --print-certs OKNPV9-release.apk
          } | tee OKNPV9-signing.txt

      - name: Package V9 source qualification evidence and checksums
        shell: bash
        run: |
          set -euo pipefail
          zip -qr OKNPV9-source.zip app Sources build.gradle settings.gradle gradle.properties -x '*/build/*' -x '.gradle/*'
          cp Sources/OKNPV9_REVERSE_CHECKPOINT.txt OKNPV9-REVERSE-CHECKPOINT.txt
          cp Sources/OKNPV9_BUILD_NOTES.txt OKNPV9-BUILD-NOTES.txt
          cp Sources/V9_PRODUCTION_RELEASE_QUALIFICATION_PLAN.txt OKNPV9-PRODUCTION-RELEASE-QUALIFICATION-PLAN.txt
          cp Sources/V9_HARDWARE_BASELINE_PROOF.txt OKNPV9-V8-HARDWARE-BASELINE-PROOF.txt
          cp Sources/V9_OUTPUT_GAIN_STATIC_DISCOVERY.txt OKNPV9-OUTPUT-GAIN-STATIC-DISCOVERY.txt
          sha256sum OKNPV9-debug.apk OKNPV9-release.apk OKNPV9-source.zip OKNPV9-REVERSE-CHECKPOINT.txt OKNPV9-BUILD-NOTES.txt OKNPV9-PRODUCTION-RELEASE-QUALIFICATION-PLAN.txt OKNPV9-V8-HARDWARE-BASELINE-PROOF.txt OKNPV9-OUTPUT-GAIN-STATIC-DISCOVERY.txt OKNPV9-signing.txt > OKNPV9-SHA256SUMS.txt
          cat OKNPV9-SHA256SUMS.txt

      - name: Upload OKNPV9 artifact
        uses: actions/upload-artifact@v7
        with:
          name: OKNPV9
          path: |
            OKNPV9-debug.apk
            OKNPV9-release.apk
            OKNPV9-source.zip
            OKNPV9-SHA256SUMS.txt
            OKNPV9-apk-badging.txt
            OKNPV9-signing.txt
            OKNPV9-REVERSE-CHECKPOINT.txt
            OKNPV9-BUILD-NOTES.txt
            OKNPV9-PRODUCTION-RELEASE-QUALIFICATION-PLAN.txt
            OKNPV9-V8-HARDWARE-BASELINE-PROOF.txt
            OKNPV9-OUTPUT-GAIN-STATIC-DISCOVERY.txt
          if-no-files-found: error
          retention-days: 30
