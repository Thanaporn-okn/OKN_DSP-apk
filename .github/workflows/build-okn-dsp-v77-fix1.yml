name: Build OKN DSP V77 Connection Epoch Health Gate Binding BUILD FIX 1

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_ANDROID_V77_CONNECTION_EPOCH_HEALTH_GATE_BINDING_BUILD_FIX1.zip'
      - '.github/workflows/build-okn-dsp-v77-fix1.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify V77 BUILD FIX 1 source
        shell: bash
        run: |
          set -euo pipefail
          echo '070e0778e5f707123e5e821528dc10acd806e30755aebe19e6e449deb58dbbfd  OKN_DSP_ANDROID_V77_CONNECTION_EPOCH_HEALTH_GATE_BINDING_BUILD_FIX1.zip' | sha256sum -c -
          rm -rf /tmp/okn_v77
          mkdir -p /tmp/okn_v77
          unzip -q OKN_DSP_ANDROID_V77_CONNECTION_EPOCH_HEALTH_GATE_BINDING_BUILD_FIX1.zip -d /tmp/okn_v77
          cd /tmp/okn_v77
          python3 preflight_v77.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/okn_v77
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and package artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn_v77/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          mkdir -p artifact
          cp "$APK" artifact/OKN_DSP_V77_CONNECTION_EPOCH_HEALTH_GATE_BINDING_BUILD_FIX1-debug.apk
          cp /tmp/okn_v77/README_V77.txt artifact/
          cp /tmp/okn_v77/evidence/OKN_DSP_V77_BUILD_FIX1.txt artifact/
          cp /tmp/okn_v77/evidence/OKN_DSP_V77_CONNECTION_EPOCH_HEALTH_GATE_BINDING_PLAN.txt artifact/
          cp /tmp/okn_v77/evidence/OKN_DSP_V77_CONNECTION_EPOCH_HEALTH_GATE_BINDING_PLAN.json artifact/
          sha256sum artifact/OKN_DSP_V77_CONNECTION_EPOCH_HEALTH_GATE_BINDING_BUILD_FIX1-debug.apk > artifact/OKN_DSP_V77_CONNECTION_EPOCH_HEALTH_GATE_BINDING_BUILD_FIX1-debug.sha256
          ls -lh artifact

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-V77-CONNECTION-EPOCH-HEALTH-GATE-BINDING-BUILD-FIX1-debug-apk
          path: artifact/
          if-no-files-found: error
          retention-days: 30
