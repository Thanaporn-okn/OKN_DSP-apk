name: R140 exact official Windows .NET USBHID IL static reverse

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R140_EXACT_OFFICIAL_WINDOWS_DOTNET_USBHID_IL_STATIC_REVERSE.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r140-official-windows-dotnet-usbhid-il-${{ github.ref }}
  cancel-in-progress: true

env:
  FLASH_ALLOWED: "NO"
  R139_RUN_ID: "35942006697"
  R139_JOB_ID: "107451721855"
  R139_EVIDENCE_ARTIFACT_ID: "10785341483"
  R139_EVIDENCE_ARTIFACT_NAME: "R139-EXACT-OFFICIAL-GOLOPINE-7CH-2026-CLIENTS-STATIC-EVIDENCE"
  R139_EVIDENCE_DIGEST: "sha256:e7013afd9e81d0a0a40d4acac6e95aea63cf3a9944cc26bf5f9949a585af65e0"
  R139_ACQUIRED_ARTIFACT_ID: "10785516143"
  R139_ACQUIRED_ARTIFACT_NAME: "R139-ACQUIRED-OFFICIAL-GOLOPINE-7CH-CLIENTS"
  R139_ACQUIRED_ARTIFACT_DIGEST: "sha256:94cf50b5d821e02f4303236fe42c5748434a70a1f914c91a6794d5c2d71097ab"
  R139_ACQUIRED_INNER_ZIP_SHA256: "47847664d699fc0fdd85a3861c438916524715803655dc25a23f1d34ee3bf375"
  WINDOWS_ZIP_SHA256: "f14b0c4baad70a8b0d5dc3b2783819cc2ef6e1a9c6ec2adcf17f1557059edd2a"
  WINDOWS_EXE_SHA256: "3ca54171c53f7badd963ffe6851b8b3e2faf8aee8ba2afcb7040990e22ae09b2"
  ANDROID_ZIP_SHA256: "974f74fa99420875e64f50a9763f33f3b67a726755f8bfccd4549f944958d319"
  ANDROID_APK_SHA256: "6c2d977f66609b3217f1bd72460aacb299f841bc654bf39f4d209132ca92907c"
  PROD_VID_DEC: "6324"
  PROD_PID_DEC: "1719"
  PROD_VID_HEX: "18B4"
  PROD_PID_HEX: "06B7"

jobs:
  static_reverse:
    name: STATIC ONLY - official managed IL USBHID - no execution - no USB - no board
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r140/r139 /tmp/r140/acquired /tmp/r140/windows /tmp/r140/android /tmp/r140/evidence
          cat > /tmp/r140/evidence/R140_SAFETY.txt <<'EOF'
          R140_MODE=OFFLINE_STATIC_MANAGED_IL_USBHID_REVERSE_ONLY
          R140_VENDOR_BINARY_EXECUTED=NO
          R140_WINDOWS_EXE_EXECUTED=NO
          R140_ANDROID_APK_EXECUTED=NO
          R140_MONODIS_READS_VENDOR_EXE_AS_INERT_DATA_ONLY=YES
          R140_USB_DEVICE_ACCESS=NO
          R140_BOARD_CONTACT=NO
          R140_AA55_SENT=NO
          R140_RUNTIME_0X11_SENT=NO
          R140_RUNTIME_0XFE_SENT=NO
          R140_FLASHBOOT_COMMAND_SENT=NO
          R140_FLASH_READ_EXECUTED=NO
          R140_FLASH_ERASE_EXECUTED=NO
          R140_FLASH_WRITE_EXECUTED=NO
          R140_ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD=NO
          HARDWARE_MODIFICATION=FORBIDDEN
          REFERENCE_OR_TOOL_EVIDENCE_IS_NOT_PRODUCTION_SAFETY_PROOF=YES
          FLASH_ALLOWED=NO
          EOF

      - name: Download pinned R139 acquired official clients as inert data
        uses: actions/download-artifact@v4
        with:
          name: R139-ACQUIRED-OFFICIAL-GOLOPINE-7CH-CLIENTS
          path: /tmp/r140/r139
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 35942006697

      - name: Download pinned R139 evidence for continuity only
        uses: actions/download-artifact@v4
        with:
          name: R139-EXACT-OFFICIAL-GOLOPINE-7CH-2026-CLIENTS-STATIC-EVIDENCE
          path: /tmp/r140/r139-evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 35942006697

      - name: Install static tooling only
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            file unzip mono-utils binutils python3 >/dev/null
          monodis --version > /tmp/r140/evidence/R140_MONODIS_VERSION.txt 2>&1 || true

      - name: Verify pinned artifact payload hashes and extract clients
        shell: bash
        run: |
          set -euo pipefail
          ACQ="$(find /tmp/r140/r139 -maxdepth 2 -type f -name 'R139_ACQUIRED_OFFICIAL_GOLOPINE_7CH_CLIENTS.zip' -print -quit)"
          test -n "$ACQ"
          echo "${R139_ACQUIRED_INNER_ZIP_SHA256}  ${ACQ}" | sha256sum -c -
          unzip -q "$ACQ" -d /tmp/r140/acquired

          WINZIP=/tmp/r140/acquired/windows_2026-04-08.zip
          ANDZIP=/tmp/r140/acquired/android_2026-04-01.zip
          test -f "$WINZIP"; test -f "$ANDZIP"
          echo "${WINDOWS_ZIP_SHA256}  ${WINZIP}" | sha256sum -c -
          echo "${ANDROID_ZIP_SHA256}  ${ANDZIP}" | sha256sum -c -
          unzip -q "$WINZIP" -d /tmp/r140/windows
          unzip -q "$ANDZIP" -d /tmp/r140/android

          WINEXE="$(find /tmp/r140/windows -type f -name 'golopine_audio_turning_release_2026-04-08.exe' ! -path '*/__MACOSX/*' -print -quit)"
          APK="$(find /tmp/r140/android -type f -name 'golopine_audio_turning_release_2026-04-01.apk' ! -path '*/__MACOSX/*' -print -quit)"
          test -n "$WINEXE"; test -n "$APK"
          echo "${WINDOWS_EXE_SHA256}  ${WINEXE}" | sha256sum -c -
          echo "${ANDROID_APK_SHA256}  ${APK}" | sha256sum -c -
          printf '%s\n' "$WINEXE" > /tmp/r140/WINEXE_PATH
          printf '%s\n' "$APK" > /tmp/r140/APK_PATH
          file "$WINEXE" > /tmp/r140/evidence/R140_WINDOWS_FILE_TYPE.txt
          find /tmp/r140/r139-evidence -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/r140/evidence/R140_R139_EVIDENCE_FILES.txt

      - name: Disassemble official managed executable to IL without executing it
        shell: bash
        run: |
          set -euo pipefail
          WINEXE="$(cat /tmp/r140/WINEXE_PATH)"
          monodis --assembly "$WINEXE" > /tmp/r140/evidence/R140_ASSEMBLY.txt 2>&1 || true
          monodis --typedef "$WINEXE" > /tmp/r140/evidence/R140_TYPEDEF.txt 2>&1 || true
          monodis --method "$WINEXE" > /tmp/r140/evidence/R140_METHOD_TABLE.txt 2>&1 || true
          monodis "$WINEXE" > /tmp/r140/R140_FULL.il 2>/tmp/r140/evidence/R140_MONODIS_STDERR.txt
          test -s /tmp/r140/R140_FULL.il
          sha256sum /tmp/r140/R140_FULL.il > /tmp/r140/evidence/R140_FULL_IL.sha256

      - name: Analyze managed IL exact VID PID HID transport and packet construction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re,hashlib

          ilp=Path('/tmp/r140/R140_FULL.il')
          text=ilp.read_text(errors='replace')
          lines=text.splitlines()
          ev=Path('/tmp/r140/evidence')

          VID=6324; PID=1719
          vid_hex='0x18b4'; pid_hex='0x6b7'
          read_re=re.compile(r'HidD_GetInputReport|HidRead|ReadFile|GetHidDeviceList|HidD_GetAttributes|HidD_GetSerialNumberString|HidP_GetCaps|get_InputReportLength',re.I)
          write_re=re.compile(r'HidD_SetOutputReport|HidD_SetFeature|WriteFile|HidWrite|SetOutputReport|SetFeature|Send|Write',re.I)
          usb_re=re.compile(r'USBHID|UsbHidReporterDeviceInfo|HIDInterface|HidDevice|GetHidDeviceList|VendorID|ProductID|reportID|reportBuff|HIDD_ATTRIBUTES|HIDP_CAPS',re.I)
          protocol_re=re.compile(r'DSTechAcutatorCommand|CreateSigmaDSPsingleVariableUpdateCommand|reportID|reportBuff|HID_RETURN|USB_DEVICE_PATHDATA|AudioPort|packet|command',re.I)
          dangerous_re=re.compile(r'upgrade|update|firmware|flash|erase|program|bootloader|burn',re.I)

          # Split IL into method-like blocks using .method boundaries. This is conservative and keeps raw text evidence.
          starts=[]
          for i,l in enumerate(lines):
              if re.match(r'^\s*\.method\b',l): starts.append(i)
          methods=[]
          for k,s in enumerate(starts):
              e=starts[k+1] if k+1<len(starts) else len(lines)
              block='\n'.join(lines[s:e])
              header=' '.join(lines[s:min(e,s+4)])[:1200]
              # Include decimal and common hex forms emitted by disassemblers/decompilers.
              vid_hits=[]; pid_hits=[]
              for j,l in enumerate(lines[s:e],s+1):
                  ll=l.lower()
                  if re.search(r'\b6324\b|\b0x0*18b4\b|\b626?4\b(?!)', ll):
                      # The third alternative is intentionally impossible; retained only to keep matching exact.
                      vid_hits.append({'line':j,'text':l[:800]})
                  if re.search(r'\b1719\b|\b0x0*6b7\b', ll):
                      pid_hits.append({'line':j,'text':l[:800]})
              # Explicit ldc values can be decimal or hex.
              if not vid_hits:
                  for j,l in enumerate(lines[s:e],s+1):
                      m=re.search(r'\bldc\.i4(?:\.s)?\s+(-?0x[0-9a-f]+|-?\d+)',l,re.I)
                      if m:
                          try:v=int(m.group(1),0)
                          except:continue
                          if v==VID: vid_hits.append({'line':j,'text':l[:800]})
              if not pid_hits:
                  for j,l in enumerate(lines[s:e],s+1):
                      m=re.search(r'\bldc\.i4(?:\.s)?\s+(-?0x[0-9a-f]+|-?\d+)',l,re.I)
                      if m:
                          try:v=int(m.group(1),0)
                          except:continue
                          if v==PID: pid_hits.append({'line':j,'text':l[:800]})
              sem_usb=bool(usb_re.search(block)); sem_read=bool(read_re.search(block)); sem_write=bool(write_re.search(block)); sem_protocol=bool(protocol_re.search(block)); sem_danger=bool(dangerous_re.search(block))

              # Recover local packet-byte construction clues: constants 0..255 near stelem.i1 / SetValue / report buffer stores.
              packet=[]
              bl=lines[s:e]
              for q,l in enumerate(bl):
                  if re.search(r'stelem\.i1|set_Item|reportBuff|ReportBuffer|SetOutputReport|SetFeature|GetInputReport',l,re.I):
                      lo=max(0,q-8); hi=min(len(bl),q+9)
                      nearby=[]
                      for z in bl[lo:hi]:
                          m=re.search(r'\bldc\.i4(?:\.s)?\s+(-?0x[0-9a-f]+|-?\d+)',z,re.I)
                          if m:
                              try:v=int(m.group(1),0)
                              except:continue
                              if 0<=v<=255: nearby.append(v)
                      if nearby:
                          packet.append({'line':s+q+1,'instruction':l[:500],'nearby_byte_constants':nearby[-16:]})
              if vid_hits or pid_hits or sem_usb or sem_read or sem_write or sem_protocol or sem_danger:
                  methods.append({
                      'start_line':s+1,'end_line':e,'header':header,
                      'vid_hits':vid_hits[:30],'pid_hits':pid_hits[:30],
                      'contains_both_production_ids':bool(vid_hits and pid_hits),
                      'usb_semantics':sem_usb,'read_semantics':sem_read,'write_semantics':sem_write,
                      'protocol_semantics':sem_protocol,'dangerous_update_semantics':sem_danger,
                      'packet_byte_clues':packet[:120],
                      'evidence_excerpt':'\n'.join(lines[s:min(e,s+220)])[:30000]
                  })

          both=[m for m in methods if m['contains_both_production_ids']]
          both_usb=[m for m in both if m['usb_semantics']]
          prod_read_only=[m for m in both_usb if m['read_semantics'] and not m['write_semantics'] and not m['dangerous_update_semantics']]
          prod_write=[m for m in both_usb if m['write_semantics'] or m['dangerous_update_semantics']]
          read_methods=[m for m in methods if m['read_semantics']]
          write_methods=[m for m in methods if m['write_semantics']]
          usb_methods=[m for m in methods if m['usb_semantics']]

          # Global exact IL hit lines as independent evidence.
          global_vid=[]; global_pid=[]
          for i,l in enumerate(lines,1):
              ll=l.lower()
              if re.search(r'\b6324\b|\b0x0*18b4\b',ll): global_vid.append({'line':i,'text':l[:800]})
              if re.search(r'\b1719\b|\b0x0*6b7\b',ll): global_pid.append({'line':i,'text':l[:800]})

          out={
              'windows_exe_sha256':'3ca54171c53f7badd963ffe6851b8b3e2faf8aee8ba2afcb7040990e22ae09b2',
              'managed_il_sha256':hashlib.sha256(ilp.read_bytes()).hexdigest(),
              'production_vid_dec':VID,'production_pid_dec':PID,
              'global_exact_vid_il_hits':global_vid[:500],
              'global_exact_pid_il_hits':global_pid[:500],
              'interesting_method_count':len(methods),
              'usb_semantic_method_count':len(usb_methods),
              'hid_read_method_count':len(read_methods),
              'hid_write_or_send_method_count':len(write_methods),
              'method_with_both_production_ids_count':len(both),
              'usb_method_with_both_production_ids_count':len(both_usb),
              'production_linked_read_only_candidate_count':len(prod_read_only),
              'production_linked_write_or_danger_candidate_count':len(prod_write),
              'methods':methods,
              'production_linked_methods':both_usb,
              'production_linked_read_only_candidates':prod_read_only,
              'production_linked_write_or_danger_candidates':prod_write,
          }
          (ev/'R140_MANAGED_IL_USBHID_ANALYSIS.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          PY

      - name: Correct R139 Android literal-hit interpretation with exact static scan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,json,struct,re,hashlib
          ev=Path('/tmp/r140/evidence')
          apk=Path(Path('/tmp/r140/APK_PATH').read_text().strip())
          rows=[]
          with zipfile.ZipFile(apk) as z:
              for n in z.namelist():
                  if n.endswith('/'): continue
                  b=z.read(n)
                  counts={
                      'ascii_18B4':b.count(b'18B4')+b.count(b'18b4'),
                      'ascii_06B7':b.count(b'06B7')+b.count(b'06b7'),
                      'ascii_6324':b.count(b'6324'),
                      'ascii_1719':b.count(b'1719'),
                      'le16_0x18B4':b.count(struct.pack('<H',0x18B4)),
                      'le16_0x06B7':b.count(struct.pack('<H',0x06B7)),
                      'le32_6324':b.count(struct.pack('<I',6324)),
                      'le32_1719':b.count(struct.pack('<I',1719)),
                  }
                  semantic=[]
                  for pat in [b'vendorId',b'productId',b'UsbManager',b'UsbDevice',b'USB_DEVICE_ATTACHED',b'hidUsage',b'GoloPineDSPAudioTurning',b'Bluetooth',b'flutter_blue_plus']:
                      if pat in b: semantic.append(pat.decode('latin1'))
                  if any(counts.values()) or semantic:
                      rows.append({'entry':n,'size':len(b),'sha256':hashlib.sha256(b).hexdigest(),'counts':counts,'semantic_strings':semantic})
          exact_ascii_18=sum(x['counts']['ascii_18B4'] for x in rows)
          exact_ascii_6=sum(x['counts']['ascii_06B7'] for x in rows)
          manifest_usb_attach=False
          with zipfile.ZipFile(apk) as z:
              m=z.read('AndroidManifest.xml')
              # Binary AXML keeps string-pool text as UTF-16LE.
              manifest_usb_attach=('android.hardware.usb.action.USB_DEVICE_ATTACHED'.encode('utf-16le') in m)
          out={
              'apk_sha256':'6c2d977f66609b3217f1bd72460aacb299f841bc654bf39f4d209132ca92907c',
              'entry_evidence':rows,
              'exact_ascii_18B4_total':exact_ascii_18,
              'exact_ascii_06B7_total':exact_ascii_6,
              'manifest_usb_device_attached_string_present':manifest_usb_attach,
              'important_correction':'R139 broad production-hit regex matched many numeric substrings in Flutter/native data. Exact token/resource evidence must be used instead; broad hit count alone does not prove VID/PID linkage.'
          }
          (ev/'R140_ANDROID_R139_HIT_CORRECTION.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          PY

      - name: Build fail-closed R140 decision and report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          ev=Path('/tmp/r140/evidence')
          d=json.loads((ev/'R140_MANAGED_IL_USBHID_ANALYSIS.json').read_text())
          a=json.loads((ev/'R140_ANDROID_R139_HIT_CORRECTION.json').read_text())
          both=d['usb_method_with_both_production_ids_count']
          ro=d['production_linked_read_only_candidate_count']
          wr=d['production_linked_write_or_danger_candidate_count']
          decision={
            'R139_RUN_ID':35942006697,
            'R139_JOB_ID':107451721855,
            'R139_EVIDENCE_ARTIFACT_ID':10785341483,
            'R139_ACQUIRED_ARTIFACT_ID':10785516143,
            'WINDOWS_EXE_SHA256':'3ca54171c53f7badd963ffe6851b8b3e2faf8aee8ba2afcb7040990e22ae09b2',
            'ANDROID_APK_SHA256':'6c2d977f66609b3217f1bd72460aacb299f841bc654bf39f4d209132ca92907c',
            'OFFICIAL_WINDOWS_MANAGED_DOTNET_CONFIRMED':True,
            'GLOBAL_EXACT_VID_IL_HIT_COUNT':len(d['global_exact_vid_il_hits']),
            'GLOBAL_EXACT_PID_IL_HIT_COUNT':len(d['global_exact_pid_il_hits']),
            'USB_SEMANTIC_METHOD_COUNT':d['usb_semantic_method_count'],
            'HID_READ_METHOD_COUNT':d['hid_read_method_count'],
            'HID_WRITE_OR_SEND_METHOD_COUNT':d['hid_write_or_send_method_count'],
            'USB_METHOD_WITH_BOTH_PRODUCTION_6324_1719_COUNT':both,
            'PRODUCTION_LINKED_READ_ONLY_CANDIDATE_COUNT':ro,
            'PRODUCTION_LINKED_WRITE_OR_DANGER_CANDIDATE_COUNT':wr,
            'ANDROID_EXACT_ASCII_18B4_TOTAL':a['exact_ascii_18B4_total'],
            'ANDROID_EXACT_ASCII_06B7_TOTAL':a['exact_ascii_06B7_total'],
            'ANDROID_MANIFEST_USB_DEVICE_ATTACHED_STRING_PRESENT':a['manifest_usb_device_attached_string_present'],
            'R139_BROAD_ANDROID_PRODUCTION_HIT_COUNT_ACCEPTED_AS_PROOF':False,
            'OFFICIAL_WINDOWS_PRODUCTION_USBHID_LINKAGE_STATICALLY_PROVEN':bool(both),
            'IMPORTANT_INTERPRETATION':'Managed IL/static evidence can establish how the official client selects USB HID devices and builds reports. It does not by itself prove a report is safe for the production board or authorize any transfer.',
            'READ_ONLY_IDENTIFY_PATH_STATICALLY_PROVEN_FOR_PRODUCTION':False,
            'SAFE_READ_ONLY_STOCK_BACKUP_PROVEN':False,
            'PRODUCTION_BOOTSTRAP_BRIDGE_PROVEN':False,
            'PRODUCTION_RECOVERY_USB_IDENTITY_PROVEN':False,
            'ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD':False,
            'AA55_LIVE_RETEST_ALLOWED':False,
            'RUNTIME_0X11_ALLOWED':False,
            'RUNTIME_0XFE_ALLOWED':False,
            'VENDOR_BINARY_EXECUTED':False,
            'USB_DEVICE_ACCESSED':False,
            'BOARD_CONTACTED':False,
            'FLASH_ALLOWED':False,
            'NEXT':(
              'Deep-static trace the exact production-linked USBHID method(s), their callers, handle selection, ReportID/reportBuff construction, and downstream HidD_GetInputReport versus SetOutputReport/SetFeature calls. Keep every live transfer blocked.'
              if both else
              'Trace VendorID/ProductID field assignments, constructors, configuration/resource deserialization, and GetHidDeviceList filtering in managed IL to recover production device selection. Keep every live transfer blocked.'
            )
          }
          (ev/'R140_DECISION.json').write_text(json.dumps(decision,indent=2,ensure_ascii=False)+'\n')
          (ev/'R140_REPORT_TH.md').write_text(
            '# R140 official Windows .NET USBHID managed-IL static reverse\n\n'
            f'- exact VID IL hits: {decision["GLOBAL_EXACT_VID_IL_HIT_COUNT"]}\n'
            f'- exact PID IL hits: {decision["GLOBAL_EXACT_PID_IL_HIT_COUNT"]}\n'
            f'- USB semantic methods: {decision["USB_SEMANTIC_METHOD_COUNT"]}\n'
            f'- USB methods containing both 6324/1719: {both}\n'
            f'- production-linked read-only candidates: {ro}\n'
            f'- production-linked write/danger candidates: {wr}\n'
            f'- Android exact ASCII 18B4 / 06B7: {a["exact_ascii_18B4_total"]} / {a["exact_ascii_06B7_total"]}\n\n'
            '## Safety\n- Offline static only.\n- Vendor EXE/APK not executed.\n- No USB/board access.\n- AA55 / 0x11 / 0xFE / erase / program / flash remain blocked.\n- FLASH_ALLOWED=NO\n'
          )
          print(json.dumps(decision,indent=2,ensure_ascii=False))
          PY

      - name: Package R140 evidence
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/r140/R140_FULL.il /tmp/r140/evidence/R140_FULL.il
          cd /tmp/r140/evidence
          zip -9 -r /tmp/R140_EXACT_OFFICIAL_WINDOWS_DOTNET_USBHID_IL_STATIC_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/R140_EXACT_OFFICIAL_WINDOWS_DOTNET_USBHID_IL_STATIC_EVIDENCE.zip > /tmp/R140_EXACT_OFFICIAL_WINDOWS_DOTNET_USBHID_IL_STATIC_EVIDENCE.zip.sha256

      - name: Upload R140 evidence
        uses: actions/upload-artifact@v4
        with:
          name: R140-EXACT-OFFICIAL-WINDOWS-DOTNET-USBHID-IL-STATIC-EVIDENCE
          path: |
            /tmp/R140_EXACT_OFFICIAL_WINDOWS_DOTNET_USBHID_IL_STATIC_EVIDENCE.zip
            /tmp/R140_EXACT_OFFICIAL_WINDOWS_DOTNET_USBHID_IL_STATIC_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'R140_VENDOR_BINARY_EXECUTED=NO' /tmp/r140/evidence/R140_SAFETY.txt
          grep -F 'R140_WINDOWS_EXE_EXECUTED=NO' /tmp/r140/evidence/R140_SAFETY.txt
          grep -F 'R140_ANDROID_APK_EXECUTED=NO' /tmp/r140/evidence/R140_SAFETY.txt
          grep -F 'R140_USB_DEVICE_ACCESS=NO' /tmp/r140/evidence/R140_SAFETY.txt
          grep -F 'R140_BOARD_CONTACT=NO' /tmp/r140/evidence/R140_SAFETY.txt
          grep -F 'R140_AA55_SENT=NO' /tmp/r140/evidence/R140_SAFETY.txt
          grep -F 'R140_RUNTIME_0X11_SENT=NO' /tmp/r140/evidence/R140_SAFETY.txt
