name: Build OKN DSP V71 Stale GATT Callback Isolation

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_ANDROID_V71_STALE_GATT_CALLBACK_ISOLATION.zip'
      - '.github/workflows/build-okn-dsp-v71.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify V71 source
        shell: bash
        run: |
          set -euo pipefail
          echo '495de0e9920c6c26b7cd7b3cb16b1167b1d4f8523796cc9a915e4a24842271d5  OKN_DSP_ANDROID_V71_STALE_GATT_CALLBACK_ISOLATION.zip' | sha256sum -c -
          rm -rf /tmp/okn_v71
          mkdir -p /tmp/okn_v71
          unzip -q OKN_DSP_ANDROID_V71_STALE_GATT_CALLBACK_ISOLATION.zip -d /tmp/okn_v71
          ROOT=/tmp/okn_v71
          set -euo pipefail
          check_file() { test -f "$1" || { echo "ERROR missing $1"; exit 1; }; echo "OK file: $1"; }
          check_text() { grep -Fq "$1" "$2" || { echo "ERROR missing marker '$1' in $2"; exit 1; }; echo "OK marker: $1"; }
          MAIN="$ROOT/app/src/main/java/com/okn/dsp/MainActivity.kt"
          UNIFIED="$ROOT/app/src/main/java/com/okn/dsp/UnifiedControlActivity.kt"
          SCALAR="$ROOT/app/src/main/java/com/okn/dsp/ScalarControlActivity.kt"
          LIVE="$ROOT/app/src/main/java/com/okn/dsp/LiveEqActivity.kt"
          SAVEPOL="$ROOT/app/src/main/java/com/okn/dsp/protocol/SaveParamsPolicy.kt"
          EQPOL="$ROOT/app/src/main/java/com/okn/dsp/protocol/LiveEqPolicy.kt"
          EQCODEC="$ROOT/app/src/main/java/com/okn/dsp/protocol/EqBandCodec.kt"
          SCALARPOL="$ROOT/app/src/main/java/com/okn/dsp/protocol/VerifiedScalarControls.kt"
          GATE="$ROOT/app/src/main/java/com/okn/dsp/protocol/WriteGate.kt"
          GRADLE="$ROOT/app/build.gradle.kts"
          MANIFEST="$ROOT/app/src/main/AndroidManifest.xml"
          V70CAP="$ROOT/evidence/OKN_DSP_V70_POWER_CYCLE_RECONNECT_RUNTIME_SUCCESS_CAPTURE.txt"
          for f in "$MAIN" "$UNIFIED" "$SCALAR" "$LIVE" "$SAVEPOL" "$EQPOL" "$EQCODEC" "$SCALARPOL" "$GATE" "$GRADLE" "$MANIFEST" "$V70CAP"; do check_file "$f"; done
          check_file "$ROOT/README_V71.txt"
          check_file "$ROOT/evidence/OKN_DSP_V71_STALE_GATT_CALLBACK_ISOLATION_PLAN.txt"
          check_file "$ROOT/evidence/OKN_DSP_V71_STALE_GATT_CALLBACK_ISOLATION_PLAN.json"
          
          check_text 'versionCode = 71' "$GRADLE"
          check_text '5.2.0-v71-stale-gatt-callback-isolation' "$GRADLE"
          check_text 'OKN DSP V71 — PRODUCTION STALE-GATT CALLBACK ISOLATION' "$MAIN"
          check_text 'UNIFIED V71 • V70 VERIFIED SCOPE + STALE-GATT CALLBACK ISOLATION' "$MAIN"
          check_text 'UnifiedControlActivity::class.java' "$MAIN"
          check_text '.UnifiedControlActivity' "$MANIFEST"
          
          check_text 'const val enabled: Boolean = false' "$GATE"
          check_text 'const val unifiedVerifiedScalarWritesEnabled: Boolean = true' "$GATE"
          check_text 'const val unifiedVerifiedEqWritesEnabled: Boolean = true' "$GATE"
          python3 - "$SCALARPOL" <<'PY'
          import re,sys
          from pathlib import Path
          s=Path(sys.argv[1]).read_text()
          ids=[int(x) for x in re.findall(r'VerifiedScalarControl\((\d+),',s)]
          assert ids==[2,3,8,9,10,13,11],ids
          print('OK: scalar allow-list exactly [2,3,8,9,10,13,11]')
          PY
          
          # Final V70 runtime evidence is embedded byte-for-byte.
          echo 'b2201c420d9bfaadae5eea583558c15a334ba99dd3f46ed6a2061957c40c6761  '"$V70CAP" | sha256sum -c -
          check_text 'V70_UNIFIED_POWER_CYCLE_PROOF_ARMED userAction=true scalarExpected=7 eqExpected=105 disconnectRequired=true writesSent=0' "$V70CAP"
          check_text 'V70_UNIFIED_POWER_CYCLE_PROOF_DISCONNECT_OBSERVED armed=true disconnectObserved=true writesSent=0' "$V70CAP"
          check_text 'V70_UNIFIED_POWER_CYCLE_PERSISTENCE_PROOF_RESULT verified=true countsOk=true scalarMismatch=0 eqMismatch=0 scalarExpected=7 eqExpected=105 disconnectObserved=true userArmed=true' "$V70CAP"
          check_text 'freshAuthSession=true writesSent=0 sensorsCompared=false' "$V70CAP"
          
          # Production modules remain byte-for-byte unchanged.
          echo '01f6aca6f2131bd41ca4fd1d674d879cade425ccc7ddef77e63718e8e124ffed  '"$SCALAR" | sha256sum -c -
          echo '3240ca56c81b7960098ae9fb6ea7421d32e74b11e42810ce4c5b71b35d7ab8d0  '"$LIVE" | sha256sum -c -
          echo '88005dba77d2b84597f5bd5e23eaaacec7d25b59dc0f38b8affbde2d2cfbeb85  '"$SAVEPOL" | sha256sum -c -
          echo 'cfb046aa09acaf8429176a9b99e988ea06347f3daeea988b7c118d056400d2bc  '"$EQPOL" | sha256sum -c -
          echo '4f033a406e363b2418af9b39fa2e42a13674b09f9de2bb7acf1eb6ff1918cd58  '"$EQCODEC" | sha256sum -c -
          
          # V70 writer/verify/save/persistence behavior remains.
          for marker in \
           'V71_UNIFIED_SCALAR_PREFLIGHT_START' \
           'V71_UNIFIED_TARGET_DESCRIPTOR_VERIFY' \
           'V71_UNIFIED_RESTORE_DESCRIPTOR_VERIFY' \
           'V71_UNIFIED_EQ_PREFLIGHT_START' \
           'V71_UNIFIED_EQ_TARGET_DESCRIPTOR_VERIFY' \
           'V71_UNIFIED_EQ_RESTORE_DESCRIPTOR_VERIFY' \
           'V71_UNIFIED_SAVE_PRECHECK_RESULT' \
           'V71_UNIFIED_SAVE_POSTCHECK_RESULT' \
           'V71_UNIFIED_PERSISTENT_SAVE_COMPLETE' \
           'V71_UNIFIED_POWER_CYCLE_PERSISTENCE_PROOF_RESULT' \
           'REFRESH ALL • SAME SESSION' \
           'sensorReadOnly=true' \
           'genericWrites=false'; do check_text "$marker" "$UNIFIED"; done
          check_text 'SaveParamsPolicy.encodeTrigger()' "$UNIFIED"
          check_text '570000000700000000' "$SAVEPOL"
          check_text 'LiveEqPolicy.isWritable(original)' "$UNIFIED"
          check_text 'payloadBytes=48' "$UNIFIED"
          
          # V71 stale-GATT invariant must guard all 7 callbacks before callback-local state/log mutation.
          check_text 'private fun isCurrentGatt(callbackGatt: BluetoothGatt, callback: String): Boolean' "$UNIFIED"
          check_text 'V71_UNIFIED_STALE_GATT_CALLBACK_IGNORED' "$UNIFIED"
          check_text 'V71_UNIFIED_ACTIVE_GATT_ASSIGNED callbackIdentityGuard=true' "$UNIFIED"
          check_text 'val oldGatt = gatt' "$UNIFIED"
          check_text 'gatt = null' "$UNIFIED"
          python3 - "$UNIFIED" <<'PY'
          from pathlib import Path
          import sys,re
          u=Path(sys.argv[1]).read_text()
          # Writer surface identical to V70.
          assert u.count('UfeCodec.encodeFloat32Write')==2, u.count('UfeCodec.encodeFloat32Write')
          assert u.count('LiveEqPolicy.encodeWrite')==1, u.count('LiveEqPolicy.encodeWrite')
          assert u.count('LiveEqPolicy.encodeRestore')==1, u.count('LiveEqPolicy.encodeRestore')
          assert u.count('SaveParamsPolicy.encodeTrigger()')==1, u.count('SaveParamsPolicy.encodeTrigger()')
          assert u.count('UfeCodec.encodeWrite(')==0, u.count('UfeCodec.encodeWrite(')
          assert u.count('EqBandCodec.encode')==0, u.count('EqBandCodec.encode')
          # All callbacks guarded.
          expected={
          'onConnectionStateChange':'onConnectionStateChange',
          'onMtuChanged':'onMtuChanged',
          'onServicesDiscovered':'onServicesDiscovered',
          'onDescriptorWrite':'onDescriptorWrite',
          'onCharacteristicWrite':'onCharacteristicWrite',
          'onCharacteristicChanged33':'onCharacteristicChanged33',
          'onCharacteristicChangedLegacy':'onCharacteristicChangedLegacy',
          }
          for label in expected.values():
              needle=f'if (!isCurrentGatt(g, "{label}")) return'
              assert needle in u, needle
          assert u.count('if (!isCurrentGatt(g,')==7, u.count('if (!isCurrentGatt(g,')
          # The state callback must guard before logging GATT_STATE, ensuring stale disconnect cannot mutate proof/session state.
          pos=u.index('override fun onConnectionStateChange')
          guard=u.index('if (!isCurrentGatt(g, "onConnectionStateChange")) return',pos)
          log=u.index('record("META", "GATT_STATE',pos)
          assert guard < log
          # Both notification overloads guard before handleAb02.
          for label in ['onCharacteristicChanged33','onCharacteristicChangedLegacy']:
              guard=u.index(f'if (!isCurrentGatt(g, "{label}")) return')
              handle=u.index('handleAb02',guard)
              assert guard < handle
          print('OK: V71 writer surface unchanged and all 7 GATT callbacks identity-guarded')
          PY
          
          if grep -R -n -F 'UfeCodec.encodeWrite(7' "$ROOT/app/src/main/java/com/okn/dsp" | grep -v 'SaveParamsPolicy.kt'; then
            echo 'ERROR: direct SaveParams ID7 writer outside policy'; exit 1
          fi
          
          echo 'OK: V71 static preflight passed'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/okn_v71
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and package artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn_v71/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          mkdir -p artifact
          cp "$APK" artifact/OKN_DSP_V71_STALE_GATT_CALLBACK_ISOLATION-debug.apk
          cp /tmp/okn_v71/README_V71.txt artifact/
          cp /tmp/okn_v71/evidence/OKN_DSP_V71_STALE_GATT_CALLBACK_ISOLATION_PLAN.txt artifact/
          cp /tmp/okn_v71/evidence/OKN_DSP_V71_STALE_GATT_CALLBACK_ISOLATION_PLAN.json artifact/
          sha256sum artifact/OKN_DSP_V71_STALE_GATT_CALLBACK_ISOLATION-debug.apk > artifact/OKN_DSP_V71_STALE_GATT_CALLBACK_ISOLATION-debug.sha256
          ls -lh artifact

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-V71-STALE-GATT-CALLBACK-ISOLATION-debug-apk
          path: artifact/
          if-no-files-found: error
          retention-days: 30
