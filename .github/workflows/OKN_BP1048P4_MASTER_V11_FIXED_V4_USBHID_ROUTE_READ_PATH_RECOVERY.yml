            if($jitProc.HasExited){ break }
          }

          if(-not $ready){
            if(-not $jitProc.HasExited){
              Stop-Process -Id $jitProc.Id -Force -ErrorAction SilentlyContinue
            }
            throw "JIT map process did not produce map"
          }

          Copy-Item $map "$root\evidence\04_JIT_POINTER_MAP.txt" -Force
          "JIT_PROCESS_ID=$($jitProc.Id)" |
            Set-Content "$root\evidence\04A_JIT_PROCESS.txt"

          try{
            python "$root\analyze_jit.py" $jitProc.Id $map
            if($LASTEXITCODE -ne 0){ throw "JIT analyzer failed with exit code $LASTEXITCODE" }
          } finally {
            if(-not $jitProc.HasExited){
              Stop-Process -Id $jitProc.Id -Force -ErrorAction SilentlyContinue
            }
          }

