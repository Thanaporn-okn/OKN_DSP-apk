name: Build OKN DSP V97 Stable Explicit Connect

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_ANDROID_V97_STABLE_EXPLICIT_CONNECT.zip'
      - '.github/workflows/build-okn-dsp-v97.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify V97 source
        shell: bash
        run: |
          set -euo pipefail
          echo '39241502e92c9908353f080eb569872f97f45716f38925b8d3b4c6921ba736a0  OKN_DSP_ANDROID_V97_STABLE_EXPLICIT_CONNECT.zip' | sha256sum -c -
          rm -rf /tmp/okn_v97
          mkdir -p /tmp/okn_v97
          unzip -q OKN_DSP_ANDROID_V97_STABLE_EXPLICIT_CONNECT.zip -d /tmp/okn_v97
          test -f /tmp/okn_v97/preflight_v97.py
          test -f /tmp/okn_v97/evidence/OKN_DSP_V97_UI_REFERENCE.png

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run V97 preflight and verify stable signing certificate
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/okn_v97
          python3 preflight_v97.py
          echo 'ba1c52f2607c09953c52fdd79c5f72026aaf0adb8aa44bcba277f7d9b49d9511  app/okn_dsp_stable_debug.keystore' | sha256sum -c -
          CERT=$(keytool -list -v -keystore app/okn_dsp_stable_debug.keystore -storepass android -alias androiddebugkey | awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr 'A-F' 'a-f')
          test "$CERT" = 'c3da85af2e978dbd0ed9bb695e5c79a263189595c116ad93a1ded75a2eb98397'
          echo "Stable signing certificate SHA-256: $CERT"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build stable-signed V97 APK
        working-directory: /tmp/okn_v97
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK signer
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find /tmp/okn_v97/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          CERT=$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' | tr 'A-F' 'a-f')
          test "$CERT" = 'c3da85af2e978dbd0ed9bb695e5c79a263189595c116ad93a1ded75a2eb98397'
          cp "$APK" /tmp/OKN_DSP_V97_STABLE_EXPLICIT_CONNECT-debug.apk
          echo "APK=$APK"
          echo "Signer SHA-256=$CERT"

      - name: Upload V97 APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-V97-STABLE-EXPLICIT-CONNECT-debug-apk
          path: /tmp/OKN_DSP_V97_STABLE_EXPLICIT_CONNECT-debug.apk
          if-no-files-found: error
          retention-days: 30
