name: Build OKN DSP V97 Connect UI Parent Fix

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_ANDROID_V97_CONNECT_UI_PARENT_FIX.zip'
      - '.github/workflows/build-okn-dsp-v97.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and unpack V97 source
        shell: bash
        run: |
          set -euo pipefail
          echo 'a293a689a9161a2dbab39f7a3a1b7aa2c1d426824ac884f632942ca69db7afc3  OKN_DSP_ANDROID_V97_CONNECT_UI_PARENT_FIX.zip' | sha256sum -c -
          rm -rf /tmp/okn_v97
          mkdir -p /tmp/okn_v97
          unzip -q OKN_DSP_ANDROID_V97_CONNECT_UI_PARENT_FIX.zip -d /tmp/okn_v97
          test -f /tmp/okn_v97/preflight_v97.py
          test -f /tmp/okn_v97/evidence/OKN_DSP_V97_UI_REFERENCE.png
          cd /tmp/okn_v97
          python3 preflight_v97.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify stable signing key
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/okn_v97
          echo 'ba1c52f2607c09953c52fdd79c5f72026aaf0adb8aa44bcba277f7d9b49d9511  app/okn_dsp_stable_debug.keystore' | sha256sum -c -
          CERT=$(keytool -list -v \
            -keystore app/okn_dsp_stable_debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            | awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr 'A-F' 'a-f')
          test "$CERT" = 'c3da85af2e978dbd0ed9bb695e5c79a263189595c116ad93a1ded75a2eb98397'
          echo "Stable signer SHA-256: $CERT"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build stable-signed V97 APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p /tmp/okn_v97 :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK signer and prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          APK='/tmp/okn_v97/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          CERT=$($APKSIGNER verify --print-certs "$APK" \
            | awk -F': ' '/certificate SHA-256 digest:/{print $2; exit}' \
            | tr -d ':' | tr 'A-F' 'a-f')
          test "$CERT" = 'c3da85af2e978dbd0ed9bb695e5c79a263189595c116ad93a1ded75a2eb98397'
          mkdir -p /tmp/okn_v97_out
          cp "$APK" /tmp/okn_v97_out/OKN_DSP_V97.apk
          sha256sum /tmp/okn_v97_out/OKN_DSP_V97.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN_DSP_V97_APK
          path: /tmp/okn_v97_out/OKN_DSP_V97.apk
          if-no-files-found: error
          retention-days: 30
