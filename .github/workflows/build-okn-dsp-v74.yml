name: Build OKN DSP V74 GATT Arm Before Write Ordering Fix

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_ANDROID_V74_GATT_ARM_BEFORE_WRITE_ORDERING_FIX.zip'
      - '.github/workflows/build-okn-dsp-v74.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify V74 source
        shell: bash
        run: |
          set -euo pipefail
          echo '54ed27121ec660a8282377cd39b2daa79f686935703ebf689f9c66860a51ee3c  OKN_DSP_ANDROID_V74_GATT_ARM_BEFORE_WRITE_ORDERING_FIX.zip' | sha256sum -c -
          rm -rf /tmp/okn_v74
          mkdir -p /tmp/okn_v74
          unzip -q OKN_DSP_ANDROID_V74_GATT_ARM_BEFORE_WRITE_ORDERING_FIX.zip -d /tmp/okn_v74
          cd /tmp/okn_v74
          python3 preflight_v74.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/okn_v74
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and package artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn_v74/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          mkdir -p artifact
          cp "$APK" artifact/OKN_DSP_V74_GATT_ARM_BEFORE_WRITE_ORDERING_FIX-debug.apk
          cp /tmp/okn_v74/README_V74.txt artifact/
          cp /tmp/okn_v74/evidence/OKN_DSP_V74_GATT_ARM_BEFORE_WRITE_ORDERING_FIX_PLAN.txt artifact/
          cp /tmp/okn_v74/evidence/OKN_DSP_V74_GATT_ARM_BEFORE_WRITE_ORDERING_FIX_PLAN.json artifact/
          sha256sum artifact/OKN_DSP_V74_GATT_ARM_BEFORE_WRITE_ORDERING_FIX-debug.apk > artifact/OKN_DSP_V74_GATT_ARM_BEFORE_WRITE_ORDERING_FIX-debug.sha256
          ls -lh artifact

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-V74-GATT-ARM-BEFORE-WRITE-debug-apk
          path: artifact/
          if-no-files-found: error
          retention-days: 30
