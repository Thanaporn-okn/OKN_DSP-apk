name: Build OKN DSP REAL V1 FIXED

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "OKN_DSP_REAL_V1_FIXED.zip"
      - ".github/workflows/build-okn-dsp-real-v1-fixed.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source
          mkdir source
          unzip -q OKN_DSP_REAL_V1_FIXED.zip -d source
          ROOT=$(find source -name settings.gradle.kts -printf '%h\n' | head -n 1)
          test -n "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p "$ROOT" :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p out
          cp "$ROOT/app/build/outputs/apk/debug/app-debug.apk" out/OKN_DSP_REAL_V1_FIXED-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-REAL-V1-FIXED-APK
          path: out/OKN_DSP_REAL_V1_FIXED-debug.apk
          if-no-files-found: error
          retention-days: 30
