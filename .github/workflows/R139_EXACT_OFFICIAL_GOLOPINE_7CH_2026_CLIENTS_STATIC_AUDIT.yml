name: R139 exact official GoloPine 7CH 2026 clients static audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R139_EXACT_OFFICIAL_GOLOPINE_7CH_2026_CLIENTS_STATIC_AUDIT.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r139-official-golopine-7ch-2026-clients-${{ github.ref }}
  cancel-in-progress: true

env:
  FLASH_ALLOWED: "NO"
  R138_RUN_ID: "35899010548"
  R138_JOB_ID: "107310073996"
  R138_EVIDENCE_ARTIFACT_ID: "10767573372"
  R138_EVIDENCE_ARTIFACT_NAME: "R138-EXACT-PRIMARY-COMMUNITY-GDRIVE-RESILIENT-STATIC-EVIDENCE"
  R138_EVIDENCE_DIGEST: "sha256:1e13e5d8d7b09edd497905d3085d13c921a1143a2615adc925d979861fba3151"
  OFFICIAL_7CH_PAGE: "https://golodsp.com/7%E9%80%9A%E9%81%93%E9%9F%B3%E9%A2%91%E5%89%8D%E7%BA%A7/"
  OFFICIAL_ANDROID_ZIP: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-01.apk_.zip"
  OFFICIAL_WINDOWS_ZIP: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-08.exe_.zip"
  PROD_VID_HEX: "18B4"
  PROD_PID_HEX: "06B7"

jobs:
  static_audit:
    name: STATIC ONLY - official GoloPine 7CH clients - no execution - no USB - no board
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r139/input /tmp/r139/r138 /tmp/r139/downloads /tmp/r139/unpacked/android /tmp/r139/unpacked/windows /tmp/r139/evidence
          cat > /tmp/r139/evidence/R139_SAFETY.txt <<'EOF'
          R139_MODE=OFFICIAL_GOLOPINE_7CH_2026_CLIENTS_OFFLINE_STATIC_AUDIT
          R139_VENDOR_BINARY_EXECUTED=NO
          R139_ANDROID_APK_EXECUTED=NO
          R139_WINDOWS_EXE_EXECUTED=NO
          R139_INSTALLER_EXECUTED=NO
          R139_USB_DEVICE_ACCESS=NO
          R139_BOARD_CONTACT=NO
          R139_AA55_SENT=NO
          R139_RUNTIME_0X11_SENT=NO
          R139_RUNTIME_0XFE_SENT=NO
          R139_FLASHBOOT_COMMAND_SENT=NO
          R139_FLASH_READ_EXECUTED=NO
          R139_FLASH_ERASE_EXECUTED=NO
          R139_FLASH_WRITE_EXECUTED=NO
          R139_ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD=NO
          HARDWARE_MODIFICATION=FORBIDDEN
          REFERENCE_OR_CLIENT_EVIDENCE_IS_NOT_LIVE_AUTHORIZATION=YES
          FLASH_ALLOWED=NO
          EOF

      - name: Download pinned R138 evidence for continuity only
        uses: actions/download-artifact@v4
        with:
          name: R138-EXACT-PRIMARY-COMMUNITY-GDRIVE-RESILIENT-STATIC-EVIDENCE
          path: /tmp/r139/r138
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 35899010548

      - name: Install static tooling only
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            file unzip zip curl binutils python3-pip >/dev/null
          python3 -m pip install --disable-pip-version-check --no-input pefile capstone >/dev/null

      - name: Record official source URLs and continuity
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r139/evidence/R139_OFFICIAL_SOURCES.json <<EOF
          {
            "official_7ch_page": "${OFFICIAL_7CH_PAGE}",
            "android_label": "Latest 1Apr2026 Android APP Audio Turning",
            "android_zip": "${OFFICIAL_ANDROID_ZIP}",
            "windows_label": "Windows DSTech_AudioDSP_Client 08Apr2026",
            "windows_zip": "${OFFICIAL_WINDOWS_ZIP}",
            "r138_run_id": ${R138_RUN_ID},
            "r138_job_id": ${R138_JOB_ID},
            "r138_artifact_id": ${R138_EVIDENCE_ARTIFACT_ID},
            "r138_artifact_digest": "${R138_EVIDENCE_DIGEST}"
          }
          EOF
          find /tmp/r139/r138 -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/r139/evidence/R139_R138_ARTIFACT_FILES.txt

      - name: Acquire exact official client ZIPs as inert data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, json, hashlib

          targets=[
            ('ANDROID_2026_04_01', 'https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-01.apk_.zip', Path('/tmp/r139/downloads/android_2026-04-01.zip')),
            ('WINDOWS_2026_04_08', 'https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-08.exe_.zip', Path('/tmp/r139/downloads/windows_2026-04-08.zip')),
          ]
          rows=[]
          for label,url,out in targets:
              cmd=['curl','-L','--fail','--retry','3','--retry-delay','2','--connect-timeout','20','--max-time','300','-A','Mozilla/5.0','-o',str(out),url]
              cp=subprocess.run(cmd,capture_output=True,text=True)
              row={'label':label,'url':url,'curl_rc':cp.returncode,'stderr_tail':cp.stderr[-5000:]}
              if out.exists() and out.stat().st_size:
                  data=out.read_bytes(); head=data[:8192].lower()
                  row.update({'size':len(data),'sha256':hashlib.sha256(data).hexdigest(),'html_like':b'<html' in head or b'<!doctype html' in head})
              else:
                  row.update({'size':0,'sha256':None,'html_like':None})
              rows.append(row)
          Path('/tmp/r139/evidence/R139_DOWNLOAD_RESULTS.json').write_text(json.dumps(rows,indent=2)+'\n')
          print(json.dumps(rows,indent=2))
          PY

      - name: Extract valid client archives without executing contents
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json,hashlib
          pairs=[
            (Path('/tmp/r139/downloads/android_2026-04-01.zip'),Path('/tmp/r139/unpacked/android'),'ANDROID'),
            (Path('/tmp/r139/downloads/windows_2026-04-08.zip'),Path('/tmp/r139/unpacked/windows'),'WINDOWS'),
          ]
          rows=[]
          for src,dst,label in pairs:
              row={'label':label,'source':str(src),'extracted':False,'files':[]}
              if src.exists() and src.stat().st_size:
                  test=subprocess.run(['unzip','-tq',str(src)],capture_output=True,text=True)
                  row['zip_test_rc']=test.returncode
                  if test.returncode==0:
                      dst.mkdir(parents=True,exist_ok=True)
                      cp=subprocess.run(['unzip','-oq',str(src),'-d',str(dst)],capture_output=True,text=True)
                      row['extract_rc']=cp.returncode
                      row['extracted']=cp.returncode==0
                      for p in sorted(dst.rglob('*')):
                          if p.is_file():
                              data=p.read_bytes()
                              row['files'].append({'path':str(p.relative_to(dst)),'size':len(data),'sha256':hashlib.sha256(data).hexdigest()})
              rows.append(row)
          Path('/tmp/r139/evidence/R139_EXTRACTION.json').write_text(json.dumps(rows,indent=2,ensure_ascii=False)+'\n')
          PY
          find /tmp/r139/unpacked -type f -printf '%P\t%s\n' | sort > /tmp/r139/evidence/R139_EXTRACTED_FILE_LIST.tsv
          find /tmp/r139/unpacked -type f -print0 | sort -z | xargs -0 -r sha256sum > /tmp/r139/evidence/R139_EXTRACTED_SHA256.txt

      - name: Static audit official Android APK and Windows client
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re,hashlib,struct,zipfile
          import pefile
          from capstone import Cs,CS_ARCH_X86,CS_MODE_32
          from capstone.x86 import X86_OP_IMM

          ev=Path('/tmp/r139/evidence')
          PROD_VID=0x18B4; PROD_PID=0x06B7
          prod_re=re.compile(r'18b4|06b7|6324|1719|vid[_ :=-]*18b4|pid[_ :=-]*06b7',re.I)
          usb_re=re.compile(r'usbmanager|usbdevice|usbinterface|usbendpoint|bulktransfer|controltransfer|requestpermission|hid|setupapi|hidd_|winusb|deviceinterface|createfile|readfile|writefile',re.I)
          protocol_re=re.compile(r'aa55|55aa|ufe|report.?id|endpoint|interface|packet|frame|checksum|crc|command|cmd|readsn|serial|version',re.I)
          dangerous_re=re.compile(r'firmware|upgrade|update|flash|bootloader|erase|program|burn|download.?firmware|chiperas|codedata|bootdat|constdat|cnfgdat|btupdat|upinfo',re.I)

          def strings_from_bytes(data):
              vals=[]
              for m in re.finditer(rb'[\x20-\x7e]{5,}',data): vals.append(m.group().decode('latin1','replace'))
              for m in re.finditer(rb'(?:[\x20-\x7e]\x00){5,}',data): vals.append(m.group().decode('utf-16le','replace'))
              return vals

          android={'apk_files':[],'production_hits':[],'usb_hits':[],'protocol_hits':[],'dangerous_hits':[],'zip_entries':[]}
          for apk in sorted(Path('/tmp/r139/unpacked/android').rglob('*.apk')):
              data=apk.read_bytes(); row={'path':str(apk),'size':len(data),'sha256':hashlib.sha256(data).hexdigest()}
              try:
                  with zipfile.ZipFile(apk) as z:
                      names=z.namelist(); row['entry_count']=len(names); android['zip_entries'] += names[:5000]
                      scan=[]
                      for n in names:
                          if n.endswith('/') or not re.search(r'classes.*\.dex$|AndroidManifest\.xml$|resources\.arsc$|res/|assets/|lib/',n,re.I): continue
                          try: b=z.read(n)
                          except Exception: continue
                          for s in strings_from_bytes(b):
                              if prod_re.search(s) or usb_re.search(s) or protocol_re.search(s) or dangerous_re.search(s): scan.append({'entry':n,'text':s[:700]})
                      row['interesting_strings']=scan[:5000]
              except Exception as e:
                  row['zip_error']=repr(e)
              android['apk_files'].append(row)
              for x in row.get('interesting_strings',[]):
                  t=x['text']
                  if prod_re.search(t): android['production_hits'].append(x)
                  if usb_re.search(t): android['usb_hits'].append(x)
                  if protocol_re.search(t): android['protocol_hits'].append(x)
                  if dangerous_re.search(t): android['dangerous_hits'].append(x)

          windows={'exe_files':[],'production_text_hits':[],'production_code_immediates':[],'usb_imports':[],'usb_strings':[],'protocol_hits':[],'dangerous_hits':[]}
          import_re=re.compile(r'hid|setupapi|cfgmgr|winusb|createfile|readfile|writefile|deviceio|usb',re.I)
          for exe in sorted(Path('/tmp/r139/unpacked/windows').rglob('*.exe')):
              data=exe.read_bytes(); vals=strings_from_bytes(data)
              row={'path':str(exe),'size':len(data),'sha256':hashlib.sha256(data).hexdigest(),'imports':[],'exact_code_immediates':[]}
              try:
                  pe=pefile.PE(str(exe),fast_load=False); row['pe_parse_ok']=True
                  for e in getattr(pe,'DIRECTORY_ENTRY_IMPORT',[]):
                      dll=(e.dll or b'').decode('latin1','replace')
                      for imp in e.imports:
                          name=imp.name.decode('latin1','replace') if imp.name else f'ord:{imp.ordinal}'
                          if import_re.search(dll) or import_re.search(name): row['imports'].append({'dll':dll,'name':name,'iat':hex(imp.address)})
                  if pe.FILE_HEADER.Machine==0x14c:
                      md=Cs(CS_ARCH_X86,CS_MODE_32); md.detail=True; ib=pe.OPTIONAL_HEADER.ImageBase
                      for sec in pe.sections:
                          if sec.Characteristics & 0x20000000:
                              for ins in md.disasm(sec.get_data(),ib+sec.VirtualAddress):
                                  for op in ins.operands:
                                      if op.type==X86_OP_IMM and (op.imm & 0xffffffff) in {PROD_VID,PROD_PID}:
                                          row['exact_code_immediates'].append({'va':hex(ins.address),'value':hex(op.imm & 0xffffffff),'instruction':f'{ins.mnemonic} {ins.op_str}'})
              except Exception as e:
                  row['pe_parse_ok']=False; row['pe_error']=repr(e)
              row['production_strings']=[s[:700] for s in vals if prod_re.search(s)][:1000]
              row['usb_strings']=[s[:700] for s in vals if usb_re.search(s)][:2000]
              row['protocol_strings']=[s[:700] for s in vals if protocol_re.search(s)][:3000]
              row['dangerous_strings']=[s[:700] for s in vals if dangerous_re.search(s)][:3000]
              windows['exe_files'].append(row)
              windows['production_text_hits'] += [{'file':str(exe),'text':s} for s in row['production_strings']]
              windows['production_code_immediates'] += [{'file':str(exe),**x} for x in row['exact_code_immediates']]
              windows['usb_imports'] += [{'file':str(exe),**x} for x in row['imports']]
              windows['usb_strings'] += [{'file':str(exe),'text':s} for s in row['usb_strings']]
              windows['protocol_hits'] += [{'file':str(exe),'text':s} for s in row['protocol_strings']]
              windows['dangerous_hits'] += [{'file':str(exe),'text':s} for s in row['dangerous_strings']]

          out={'production_runtime_vid':'0x18B4','production_runtime_pid':'0x06B7','android':android,'windows':windows}
          (ev/'R139_OFFICIAL_CLIENT_STATIC_AUDIT.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          PY

      - name: Build fail-closed R139 decision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          ev=Path('/tmp/r139/evidence')
          dl=json.loads((ev/'R139_DOWNLOAD_RESULTS.json').read_text())
          ex=json.loads((ev/'R139_EXTRACTION.json').read_text())
          a=json.loads((ev/'R139_OFFICIAL_CLIENT_STATIC_AUDIT.json').read_text())
          ok=[x for x in dl if x.get('size',0)>0 and not x.get('html_like')]
          android=a['android']; windows=a['windows']
          prod_android=len(android['production_hits'])
          prod_win_text=len(windows['production_text_hits'])
          prod_win_code=len(windows['production_code_immediates'])
          decision={
            'R138_RUN_ID':35899010548,
            'R138_JOB_ID':107310073996,
            'R138_EVIDENCE_ARTIFACT_ID':10767573372,
            'R138_EVIDENCE_DIGEST':'sha256:1e13e5d8d7b09edd497905d3085d13c921a1143a2615adc925d979861fba3151',
            'OFFICIAL_SOURCE_PAGE':'https://golodsp.com/7%E9%80%9A%E9%81%93%E9%9F%B3%E9%A2%91%E5%89%8D%E7%BA%A7/',
            'OFFICIAL_CLIENT_DOWNLOAD_SUCCESS_COUNT':len(ok),
            'OFFICIAL_CLIENT_DOWNLOAD_SUCCESS_LABELS':[x['label'] for x in ok],
            'ANDROID_APK_COUNT':len(android['apk_files']),
            'WINDOWS_EXE_COUNT':len(windows['exe_files']),
            'ANDROID_PRODUCTION_ID_STRING_HIT_COUNT':prod_android,
            'WINDOWS_PRODUCTION_ID_STRING_HIT_COUNT':prod_win_text,
            'WINDOWS_PRODUCTION_ID_CODE_IMMEDIATE_HIT_COUNT':prod_win_code,
            'WINDOWS_USB_IMPORT_HIT_COUNT':len(windows['usb_imports']),
            'ANDROID_USB_API_STRING_HIT_COUNT':len(android['usb_hits']),
            'ANDROID_PROTOCOL_STRING_HIT_COUNT':len(android['protocol_hits']),
            'WINDOWS_PROTOCOL_STRING_HIT_COUNT':len(windows['protocol_hits']),
            'ANDROID_DANGEROUS_UPDATE_STRING_HIT_COUNT':len(android['dangerous_hits']),
            'WINDOWS_DANGEROUS_UPDATE_STRING_HIT_COUNT':len(windows['dangerous_hits']),
            'IMPORTANT_INTERPRETATION':'These are official GoloPine 7-channel client artifacts and are materially stronger application-side evidence than generic ACPWorkbench/PCTools. Static client evidence still does not authorize live transmission or establish a safe stock-firmware backup path.',
            'OFFICIAL_CLIENT_PRODUCTION_18B4_06B7_LINKAGE_PROVEN': bool(prod_android or prod_win_text or prod_win_code),
            'SAFE_READ_ONLY_STOCK_BACKUP_PROVEN':False,
            'PRODUCTION_BOOTSTRAP_BRIDGE_PROVEN':False,
            'PRODUCTION_RECOVERY_USB_IDENTITY_PROVEN':False,
            'ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD':False,
            'AA55_LIVE_RETEST_ALLOWED':False,
            'RUNTIME_0X11_ALLOWED':False,
            'RUNTIME_0XFE_ALLOWED':False,
            'VENDOR_BINARY_EXECUTED':False,
            'USB_DEVICE_ACCESSED':False,
            'BOARD_CONTACTED':False,
            'FLASH_ALLOWED':False,
            'NEXT':('Deep-static reverse the official client transport path around exact production identity/API hits, recovering read/write packet construction and separating read-only queries from state-changing commands. Do not transmit anything live.' if (prod_android or prod_win_text or prod_win_code) else 'If the official clients download successfully but contain no literal production IDs, deep-static reverse their USB device-selection and packet construction paths to determine how the exact production board is matched without relying on literal VID/PID strings. No live transmission is authorized.')
          }
          (ev/'R139_DECISION.json').write_text(json.dumps(decision,indent=2,ensure_ascii=False)+'\n')
          (ev/'R139_REPORT_TH.md').write_text(
            '# R139 official GoloPine 7CH 2026 clients static audit\n\n'
            f'- official downloads acquired: {len(ok)}/2\n'
            f'- Android APK files: {len(android["apk_files"])}\n'
            f'- Windows EXE files: {len(windows["exe_files"])}\n'
            f'- Android production-ID hits: {prod_android}\n'
            f'- Windows production-ID text hits: {prod_win_text}\n'
            f'- Windows production-ID code immediates: {prod_win_code}\n'
            f'- Windows USB import hits: {len(windows["usb_imports"])}\n\n'
            '## Safety\n- Offline static only.\n- No APK/EXE executed.\n- No USB/board access.\n- AA55 / 0x11 / 0xFE / erase / program / flash remain blocked.\n- FLASH_ALLOWED=NO\n')
          print(json.dumps(decision,indent=2,ensure_ascii=False))
          PY

      - name: Package R139 evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r139/evidence
          zip -9 -r /tmp/R139_EXACT_OFFICIAL_GOLOPINE_7CH_2026_CLIENTS_STATIC_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/R139_EXACT_OFFICIAL_GOLOPINE_7CH_2026_CLIENTS_STATIC_EVIDENCE.zip > /tmp/R139_EXACT_OFFICIAL_GOLOPINE_7CH_2026_CLIENTS_STATIC_EVIDENCE.zip.sha256

      - name: Package acquired official clients
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r139/downloads
          zip -9 -r /tmp/R139_ACQUIRED_OFFICIAL_GOLOPINE_7CH_CLIENTS.zip . >/dev/null || true
          if [ ! -s /tmp/R139_ACQUIRED_OFFICIAL_GOLOPINE_7CH_CLIENTS.zip ]; then
            echo NO_OFFICIAL_CLIENTS_ACQUIRED > /tmp/R139_NO_OFFICIAL_CLIENTS_ACQUIRED.txt
            zip -9 /tmp/R139_ACQUIRED_OFFICIAL_GOLOPINE_7CH_CLIENTS.zip /tmp/R139_NO_OFFICIAL_CLIENTS_ACQUIRED.txt >/dev/null
          fi
          sha256sum /tmp/R139_ACQUIRED_OFFICIAL_GOLOPINE_7CH_CLIENTS.zip > /tmp/R139_ACQUIRED_OFFICIAL_GOLOPINE_7CH_CLIENTS.zip.sha256

      - name: Upload R139 evidence
        uses: actions/upload-artifact@v4
        with:
          name: R139-EXACT-OFFICIAL-GOLOPINE-7CH-2026-CLIENTS-STATIC-EVIDENCE
          path: |
            /tmp/R139_EXACT_OFFICIAL_GOLOPINE_7CH_2026_CLIENTS_STATIC_EVIDENCE.zip
            /tmp/R139_EXACT_OFFICIAL_GOLOPINE_7CH_2026_CLIENTS_STATIC_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Upload acquired official clients
        uses: actions/upload-artifact@v4
        with:
          name: R139-ACQUIRED-OFFICIAL-GOLOPINE-7CH-CLIENTS
          path: |
            /tmp/R139_ACQUIRED_OFFICIAL_GOLOPINE_7CH_CLIENTS.zip
            /tmp/R139_ACQUIRED_OFFICIAL_GOLOPINE_7CH_CLIENTS.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'R139_VENDOR_BINARY_EXECUTED=NO' /tmp/r139/evidence/R139_SAFETY.txt
          grep -F 'R139_ANDROID_APK_EXECUTED=NO' /tmp/r139/evidence/R139_SAFETY.txt
          grep -F 'R139_WINDOWS_EXE_EXECUTED=NO' /tmp/r139/evidence/R139_SAFETY.txt
          grep -F 'R139_USB_DEVICE_ACCESS=NO' /tmp/r139/evidence/R139_SAFETY.txt
          grep -F 'R139_BOARD_CONTACT=NO' /tmp/r139/evidence/R139_SAFETY.txt
          grep -F 'R139_AA55_SENT=NO' /tmp/r139/evidence/R139_SAFETY.txt
          grep -F 'R139_RUNTIME_0X11_SENT=NO' /tmp/r139/evidence/R139_SAFETY.txt
          grep -F 'R139_RUNTIME_0XFE_SENT=NO' /tmp/r139/evidence/R139_SAFETY.txt
          grep -F '"FLASH_ALLOWED": false' /tmp/r139/evidence/R139_DECISION.json
          echo R139_OFFICIAL_CLIENT_STATIC_AUDIT_COMPLETE=YES
          echo FLASH_ALLOWED=NO
