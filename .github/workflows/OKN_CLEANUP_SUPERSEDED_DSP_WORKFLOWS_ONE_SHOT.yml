name: OKN Cleanup Superseded DSP Workflows - ONE SHOT

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/OKN_CLEANUP_SUPERSEDED_DSP_WORKFLOWS_ONE_SHOT.yml'

permissions:
  contents: write

jobs:
  cleanup:
    name: Remove superseded workflow files
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Verify workflows that must remain
        shell: bash
        run: |
          set -euo pipefail

          KEEPERS=(
            ".github/workflows/OKN_BP1048P4_MASTER_FIXED_V3_OFFLINE_VENDOR_PROTOCOL_RECOVERY_EVIDENCE.yml"
            ".github/workflows/OKN_BP1048P4_R60_EVIDENCE_GATE_S25_USB_C_ONLY_FIXED_V3.yml"
            ".github/workflows/OKN_BP1048P4_R61_FIXED_V4_PASSIVE_USB_EVIDENCE_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_BP1048P4_R62_PASSIVE_HID_DESCRIPTOR_COMPLETION_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_BP1048P4_R63_PASSIVE_IF3_FORCE_CLAIM_DESCRIPTOR_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_BP1048P4_R64_PASSIVE_VENDOR_HID_GET_REPORT_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_BP1048P4_R65_FIXED_V2_PROTOCOL_SAFETY_MAP_INPUT_ONLY_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_BP1048P4_R66_ONE_SHOT_VERSION_QUERY_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_BP1048P4_R67_READONLY_VERSION_RESPONSE_RECOVERY_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_BP1048P4_R68_SAME_SESSION_VERSION_RESPONSE_CAPTURE_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_DSP_AutoBuild.yml"
          )

          for f in "${KEEPERS[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "ERROR: required keeper is missing: $f"
              exit 1
            fi
            echo "KEEP: $f"
          done

      - name: Delete superseded workflows
        shell: bash
        run: |
          set -euo pipefail

          DELETE_FILES=(
            ".github/workflows/OKN_BP1048P4_MASTER_OFFLINE_VENDOR_PROTOCOL_RECOVERY_EVIDENCE.yml"
            ".github/workflows/OKN_BP1048P4_MASTER_FIXED_V2_OFFLINE_VENDOR_PROTOCOL_RECOVERY_EVIDENCE.yml"
            ".github/workflows/OKN_BP1048P4_R61_PASSIVE_USB_EVIDENCE_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_BP1048P4_R61_FIXED_V2_PASSIVE_USB_EVIDENCE_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_BP1048P4_R61_FIXED_V3_PASSIVE_USB_EVIDENCE_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_BP1048P4_R65_PROTOCOL_SAFETY_MAP_INPUT_ONLY_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_BP1048P4_R69_STATIC_GOLOPINE_DSTECH_PROTOCOL_EXTRACTION.yml"
          )

          for f in "${DELETE_FILES[@]}"; do
            if [[ -e "$f" ]]; then
              echo "DELETE: $f"
              rm -f -- "$f"
            else
              echo "SKIP: already missing: $f"
            fi
          done

      - name: Self-remove cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          SELF=".github/workflows/OKN_CLEANUP_SUPERSEDED_DSP_WORKFLOWS_ONE_SHOT.yml"

          if [[ -e "$SELF" ]]; then
            echo "DELETE SELF: $SELF"
            rm -f -- "$SELF"
          else
            echo "SELF already absent"
          fi

      - name: Final safety verification
        shell: bash
        run: |
          set -euo pipefail

          KEEPERS=(
            ".github/workflows/OKN_BP1048P4_MASTER_FIXED_V3_OFFLINE_VENDOR_PROTOCOL_RECOVERY_EVIDENCE.yml"
            ".github/workflows/OKN_BP1048P4_R60_EVIDENCE_GATE_S25_USB_C_ONLY_FIXED_V3.yml"
            ".github/workflows/OKN_BP1048P4_R61_FIXED_V4_PASSIVE_USB_EVIDENCE_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_BP1048P4_R62_PASSIVE_HID_DESCRIPTOR_COMPLETION_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_BP1048P4_R63_PASSIVE_IF3_FORCE_CLAIM_DESCRIPTOR_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_BP1048P4_R64_PASSIVE_VENDOR_HID_GET_REPORT_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_BP1048P4_R65_FIXED_V2_PROTOCOL_SAFETY_MAP_INPUT_ONLY_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_BP1048P4_R66_ONE_SHOT_VERSION_QUERY_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_BP1048P4_R67_READONLY_VERSION_RESPONSE_RECOVERY_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_BP1048P4_R68_SAME_SESSION_VERSION_RESPONSE_CAPTURE_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_DSP_AutoBuild.yml"
          )

          for f in "${KEEPERS[@]}"; do
            test -f "$f" || {
              echo "ERROR: keeper disappeared: $f"
              exit 1
            }
          done

          echo
          echo "Remaining workflow files:"
          find .github/workflows -maxdepth 1 -type f -name '*.yml' -printf '%f\n' | sort

          echo
          echo "Pending Git changes:"
          git status --short

      - name: Commit and push cleanup
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A .github/workflows
          git commit -m "cleanup: remove superseded DSP workflows"
          git push origin "HEAD:${GITHUB_REF_NAME}"
