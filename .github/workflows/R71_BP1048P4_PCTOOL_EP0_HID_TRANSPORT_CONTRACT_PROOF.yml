name: R71 BP1048P4 PCTOOL EP0 HID transport contract proof

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R71_BP1048P4_PCTOOL_EP0_HID_TRANSPORT_CONTRACT_PROOF.yml"

permissions:
  contents: read

concurrency:
  group: r71-bp1048p4-pctool-ep0-hid-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_REPO: https://github.com/leadercxn/bp1048_sdk_v0.1.12.git
  SDK_COMMIT: 8105bd864b04995d81c9f9ae77cb158259f39015
  FLASH_BOOT_C: BT_Audio_APP/bt_audio_app_src/device/flash_boot.c
  EXPECTED_FLASHBOOT_SHA256: 6b632435152478ecd6a8c3697b044caf253630f70923b27c8cbe8baa509148a6

jobs:
  ep0-hid-proof:
    name: Exact PCTOOL HID descriptor and EP0 contract / STATIC ONLY / NO FLASH
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git gcc python3

      - name: Fetch pinned SDK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/bp1048_r71
          git init -q /tmp/bp1048_r71
          cd /tmp/bp1048_r71
          git remote add origin "$SDK_REPO"
          git fetch -q --depth=1 origin "$SDK_COMMIT"
          git checkout -q --detach FETCH_HEAD

          test "$(git rev-parse HEAD)" = "$SDK_COMMIT"
          test -s "$FLASH_BOOT_C"

          echo "R71_SDK_COMMIT=$(git rev-parse HEAD)" \
            | tee /tmp/R71_SDK_STATE.txt

      - name: Extract exact 64KiB flashboot blob
        id: blob
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/bp1048_r71
          SRC="$ROOT/$FLASH_BOOT_C"

          find "$ROOT" -type d -print0 |
          while IFS= read -r -d '' d; do
            printf -- '-I%s\n' "$d"
          done > /tmp/R71_INCLUDE_DIRS.rsp

          gcc -E -P \
            @/tmp/R71_INCLUDE_DIRS.rsp \
            -DFUNC_OS_EN=1 \
            -DCFG_APP_CONFIG \
            -DHAVE_CONFIG_H \
            "$SRC" > /tmp/R71_FLASH_BOOT_PREPROCESSED.c

          python3 - <<'PY'
          from pathlib import Path
          import ast, re

          text=Path("/tmp/R71_FLASH_BOOT_PREPROCESSED.c").read_text(
              encoding="latin-1", errors="replace"
          )
          m=re.search(
              r"const\s+unsigned\s+char\s+flash_data\s*\[\s*65536\s*\]"
              r"\s*=\s*\{(.*?)\}\s*;",
              text,re.S
          )
          if not m:
              raise SystemExit("flash_data[65536] not found")

          body=m.group(1)
          toks=[]
          cur=[]
          depth=0
          for ch in body:
              if ch=="(":
                  depth+=1
              elif ch==")":
                  depth-=1
              if ch=="," and depth==0:
                  t="".join(cur).strip()
                  if t:
                      toks.append(t)
                  cur=[]
              else:
                  cur.append(ch)
          t="".join(cur).strip()
          if t:
              toks.append(t)

          def ev(expr):
              expr=re.sub(r'(?<=\d)[uUlL]+\b','',expr)
              node=ast.parse(expr,mode="eval")
              allowed=(
                  ast.Expression,ast.Constant,ast.BinOp,ast.UnaryOp,
                  ast.Add,ast.Sub,ast.Mult,ast.FloorDiv,ast.Mod,
                  ast.LShift,ast.RShift,ast.BitOr,ast.BitAnd,ast.BitXor,
                  ast.UAdd,ast.USub,ast.Invert
              )
              for n in ast.walk(node):
                  if not isinstance(n,allowed):
                      raise ValueError(type(n).__name__)
              return int(eval(
                  compile(node,"<flash_data>","eval"),
                  {"__builtins__":{}},{}
              ))

          vals=[ev(x) for x in toks]
          if len(vals)!=65536 or any(not 0<=x<=255 for x in vals):
              raise SystemExit("flashboot extraction mismatch")

          Path("/tmp/R71_FLASHBOOT_64K.bin").write_bytes(bytes(vals))
          PY

          echo "${EXPECTED_FLASHBOOT_SHA256}  /tmp/R71_FLASHBOOT_64K.bin" \
            | sha256sum -c -

          {
            echo "R71_FLASHBOOT_BYTES=$(wc -c < /tmp/R71_FLASHBOOT_64K.bin)"
            echo "R71_FLASHBOOT_SHA256=$EXPECTED_FLASHBOOT_SHA256"
          } | tee /tmp/R71_FLASHBOOT_STATE.txt

      - name: Prove exact descriptor tree byte for byte
        id: descriptors
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json

          b=Path("/tmp/R71_FLASHBOOT_64K.bin").read_bytes()

          REPORT_OFF=0xBB78
          CONFIG_OFF=0xBB9C
          IF_OFF=0xBBA5
          HID_OFF=0xBBAE
          PAD_OFF=0xBBB7
          DEVICE_OFF=0xBBB8
          LANGID_OFF=0xBBCC

          expected_report=bytes.fromhex(
              "06 00 FF "        # Usage Page FF00
              "0A 55 AA "        # Usage AA55
              "A1 01 "           # Collection Application
              "15 00 "           # Logical Minimum 0
              "26 FF 00 "        # Logical Maximum 255
              "75 08 "           # Report Size 8
              "96 00 01 "        # Report Count 256
              "09 01 "
              "81 02 "           # Input Data,Var,Abs
              "96 00 01 "        # Report Count 256
              "09 01 "
              "91 02 "           # Output Data,Var,Abs
              "95 01 "           # Report Count 1
              "09 01 "
              "B1 02 "           # Feature Data,Var,Abs
              "C0"
          )
          expected_config=bytes.fromhex("09 02 1B 00 01 01 00 80 32")
          expected_if=bytes.fromhex("09 04 00 00 00 03 00 00 00")
          expected_hid=bytes.fromhex("09 21 00 01 00 01 22 24 00")
          expected_device=bytes.fromhex(
              "12 01 10 01 00 00 00 40 "
              "00 00 44 22 00 01 00 00 00 01"
          )
          expected_langid=bytes.fromhex("04 03 09 04")

          checks=[
              ("report",REPORT_OFF,expected_report),
              ("config",CONFIG_OFF,expected_config),
              ("interface",IF_OFF,expected_if),
              ("hid",HID_OFF,expected_hid),
              ("device",DEVICE_OFF,expected_device),
              ("langid",LANGID_OFF,expected_langid),
          ]
          for name,off,exp in checks:
              got=b[off:off+len(exp)]
              if got!=exp:
                  raise SystemExit(
                      f"{name} descriptor mismatch at 0x{off:04X}: "
                      f"got={got.hex()} expected={exp.hex()}"
                  )

          if b[PAD_OFF] != 0:
              raise SystemExit("expected one zero padding byte before device descriptor")

          # Structural invariants.
          if len(expected_report) != 0x24:
              raise SystemExit("report descriptor length is not 36")
          if expected_config[2] | (expected_config[3]<<8) != 27:
              raise SystemExit("config total length is not 27")
          if HID_OFF + 9 != PAD_OFF:
              raise SystemExit("HID descriptor layout mismatch")
          if CONFIG_OFF + 27 != PAD_OFF:
              raise SystemExit("config tree does not end at padding byte")
          if DEVICE_OFF != PAD_OFF + 1:
              raise SystemExit("device descriptor does not follow padding")

          # Parse exact identity.
          d=expected_device
          vid=d[8] | (d[9]<<8)
          pid=d[10] | (d[11]<<8)
          bcdusb=d[2] | (d[3]<<8)

          lines=[
              "R71_DESCRIPTOR_TREE_EXACT_MATCH=YES",
              f"R71_HID_REPORT_OFFSET=0x{REPORT_OFF:04X}",
              f"R71_HID_REPORT_LENGTH={len(expected_report)}",
              f"R71_CONFIG_OFFSET=0x{CONFIG_OFF:04X}",
              "R71_CONFIG_TOTAL_LENGTH=27",
              f"R71_INTERFACE_OFFSET=0x{IF_OFF:04X}",
              "R71_INTERFACE_NUMBER=0",
              "R71_INTERFACE_ALT=0",
              "R71_INTERFACE_CLASS=0x03",
              "R71_INTERFACE_SUBCLASS=0x00",
              "R71_INTERFACE_PROTOCOL=0x00",
              "R71_INTERFACE_ENDPOINT_COUNT=0",
              f"R71_HID_DESCRIPTOR_OFFSET=0x{HID_OFF:04X}",
              "R71_HID_REPORT_DESCRIPTOR_TYPE=0x22",
              "R71_HID_REPORT_DESCRIPTOR_LENGTH=36",
              f"R71_DEVICE_DESCRIPTOR_OFFSET=0x{DEVICE_OFF:04X}",
              f"R71_DEVICE_BCDUSB=0x{bcdusb:04X}",
              f"R71_REFERENCE_BOOTLOADER_VID=0x{vid:04X}",
              f"R71_REFERENCE_BOOTLOADER_PID=0x{pid:04X}",
              "R71_DEVICE_CLASS=0x00",
              "R71_EP0_MAX_PACKET=64",
              "R71_DEVICE_NUM_CONFIGS=1",
              "R71_DEVICE_I_MANUFACTURER=0",
              "R71_DEVICE_I_PRODUCT=0",
              "R71_DEVICE_I_SERIAL=0",
              f"R71_LANGID_DESCRIPTOR_OFFSET=0x{LANGID_OFF:04X}",
              "R71_LANGID=0x0409",
          ]

          Path("/tmp/R71_DESCRIPTOR_PROOF.txt").write_text(
              "\n".join(lines)+"\n",encoding="utf-8"
          )

          Path("/tmp/R71_DESCRIPTOR_BYTES.json").write_text(
              json.dumps({
                  name:{
                      "offset":off,
                      "length":len(exp),
                      "hex":exp.hex()
                  }
                  for name,off,exp in checks
              },indent=2)+"\n",
              encoding="utf-8"
          )
          print("\n".join(lines))
          PY

      - name: Prove HID report semantics and EP0-only transport shape
        id: hid_contract
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          b=Path("/tmp/R71_FLASHBOOT_64K.bin").read_bytes()
          r=b[0xBB78:0xBB78+36]

          # Exact report descriptor semantics.
          required=[
              bytes.fromhex("06 00 FF"),   # Usage Page 0xFF00
              bytes.fromhex("0A 55 AA"),   # Usage 0xAA55
              bytes.fromhex("75 08"),      # Report Size 8
              bytes.fromhex("96 00 01 09 01 81 02"),  # 256-byte Input
              bytes.fromhex("96 00 01 09 01 91 02"),  # 256-byte Output
              bytes.fromhex("95 01 09 01 B1 02"),      # 1-byte Feature
          ]
          for seq in required:
              if seq not in r:
                  raise SystemExit("required HID report sequence missing: "+seq.hex())

          # No Report ID item (0x85), so wValue low byte is zero.
          if 0x85 in r:
              raise SystemExit("unexpected HID Report ID item")

          lines=[
              "R71_USAGE_PAGE=0xFF00",
              "R71_USAGE=0xAA55",
              "R71_REPORT_ID_PRESENT=NO",
              "R71_INPUT_REPORT_BYTES=256",
              "R71_OUTPUT_REPORT_BYTES=256",
              "R71_FEATURE_REPORT_BYTES=1",
              "R71_INTERRUPT_ENDPOINTS=0",
              "R71_PCTOOL_TRANSPORT_CLASS=HID",
              "R71_PCTOOL_DATA_PATH=CONTROL_ENDPOINT_0",
              "R71_PCTOOL_EP0_ONLY_HID_PROVEN=YES",

              # Standard HID class-control request values derived from the
              # exact descriptor.  These are an offline host contract; live
              # production bootloader response is still unproven.
              "R71_GET_INPUT_BMREQUESTTYPE=0xA1",
              "R71_GET_INPUT_BREQUEST=0x01",
              "R71_GET_INPUT_WVALUE=0x0100",
              "R71_GET_INPUT_WINDEX=0x0000",
              "R71_GET_INPUT_WLENGTH=256",

              "R71_SET_OUTPUT_BMREQUESTTYPE=0x21",
              "R71_SET_OUTPUT_BREQUEST=0x09",
              "R71_SET_OUTPUT_WVALUE=0x0200",
              "R71_SET_OUTPUT_WINDEX=0x0000",
              "R71_SET_OUTPUT_WLENGTH=256",

              "R71_GET_FEATURE_BMREQUESTTYPE=0xA1",
              "R71_GET_FEATURE_BREQUEST=0x01",
              "R71_GET_FEATURE_WVALUE=0x0300",
              "R71_GET_FEATURE_WINDEX=0x0000",
              "R71_GET_FEATURE_WLENGTH=1",

              "R71_SET_FEATURE_BMREQUESTTYPE=0x21",
              "R71_SET_FEATURE_BREQUEST=0x09",
              "R71_SET_FEATURE_WVALUE=0x0300",
              "R71_SET_FEATURE_WINDEX=0x0000",
              "R71_SET_FEATURE_WLENGTH=1",

              "R71_CONTROL_REQUEST_CONTRACT_DESCRIPTOR_DERIVED=YES",
              "R71_LIVE_BOOTLOADER_CONTROL_RESPONSE_PROVEN=NO",
          ]

          Path("/tmp/R71_HID_CONTRACT.txt").write_text(
              "\n".join(lines)+"\n",encoding="utf-8"
          )
          print("\n".join(lines))
          PY

      - name: Prove compact updater command vocabulary table
        id: commands
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          b=Path("/tmp/R71_FLASHBOOT_64K.bin").read_bytes()

          expected={
              "chiperas":0xCB98,
              "upinfo":0xCBA4,
              "btupdat":0xCBAC,
              "cnfgdat":0xCBB4,
              "constdat":0xCBBC,
              "codedata":0xCBC8,
              "bootdat":0xCBD4,
              "cxxx":0xCBDC,
          }

          lines=[]
          for name,off in expected.items():
              raw=name.encode("ascii")
              if b[off:off+len(raw)] != raw:
                  raise SystemExit(
                      f"command {name} mismatch at 0x{off:04X}"
                  )
              lines.append(
                  f"R71_COMMAND_{name.upper()}_OFFSET=0x{off:04X}"
              )

          # All command names are clustered into one 0x4c-byte readonly region.
          lo=min(expected.values())
          hi=max(off+len(name) for name,off in expected.items())
          if hi-lo > 0x4C:
              raise SystemExit("command vocabulary is not compact")

          lines += [
              f"R71_COMMAND_TABLE_MIN_OFFSET=0x{lo:04X}",
              f"R71_COMMAND_TABLE_MAX_END=0x{hi:04X}",
              "R71_COMMAND_VOCABULARY_COMPACT=YES",
              "R71_COMMAND_WIRE_FRAMING_PROVEN=NO",
              "R71_UPINFO_READONLY_SEMANTICS_PROVEN=NO",
              "R71_CXXX_READONLY_SEMANTICS_PROVEN=NO",
          ]

          Path("/tmp/R71_COMMAND_TABLE.txt").write_text(
              "\n".join(lines)+"\n",encoding="utf-8"
          )
          print("\n".join(lines))
          PY

      - name: Correct R70 descriptor interpretation
        id: correction
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/R71_R70_CORRECTION.txt <<'EOF'
          R71_R70_DEVICE_DESCRIPTOR_WAS_REAL=YES
          R71_R70_CONFIGURATION_WAS_REAL=YES

          # R70 searched only for configurations AFTER a device descriptor.
          # The actual blob stores report -> config -> interface -> HID ->
          # padding -> device, so R70 incorrectly printed NEAR_CONFIG=NO.
          R71_CONFIG_PRECEDES_DEVICE_DESCRIPTOR=YES
          R71_CONFIG_ENDS_ONE_PADDING_BYTE_BEFORE_DEVICE=YES
          R71_R70_NEAR_CONFIGURATION_FOUND_NO_WAS_SCANNER_LIMITATION=YES

          # R70's generic UTF-16 scan produced many false positives.
          # Device descriptor string indexes are all zero; only LANGID bytes
          # are retained as descriptor evidence here.
          R71_R70_GENERIC_UTF16_STRING_CANDIDATES_NOT_IDENTITY_EVIDENCE=YES

          # VID 0 is unusual and is only proven as a literal in this reference
          # blob. Do not call it a production live identity yet.
          R71_REFERENCE_BLOB_LITERAL_VID_PID_PROVEN=YES
          R71_PRODUCTION_LIVE_BOOTLOADER_VID_PID_PROVEN=NO
          EOF

          cat /tmp/R71_R70_CORRECTION.txt

      - name: Build R71 decision
        id: decision
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/R71_DECISION.txt <<'EOF'
          R71_REFERENCE_PCTOOL_EP0_HID_TRANSPORT_PROVEN=YES
          R71_REFERENCE_PCTOOL_INTERFACE_NUMBER=0
          R71_REFERENCE_PCTOOL_INTERRUPT_ENDPOINTS=0
          R71_REFERENCE_PCTOOL_INPUT_REPORT_BYTES=256
          R71_REFERENCE_PCTOOL_OUTPUT_REPORT_BYTES=256
          R71_REFERENCE_PCTOOL_FEATURE_REPORT_BYTES=1
          R71_REFERENCE_PCTOOL_VID=0x0000
          R71_REFERENCE_PCTOOL_PID=0x2244

          R71_ANDROID_USB_HOST_CONTROL_TRANSFER_SHAPE_DERIVED=YES
          R71_COMMAND_WIRE_FRAMING_PROVEN=NO
          R71_SAFE_READBACK_COMMAND_PROVEN=NO
          R71_PRODUCTION_FIRST_BOOTSTRAP_PROVEN=NO
          R71_PRODUCTION_LIVE_BOOTLOADER_IDENTITY_PROVEN=NO

          R71_VENDOR_CODE_EXECUTED=NO
          R71_BOARD_USB_ACCESSED=NO
          R71_FLASH_WRITE_EXECUTED=NO
          R71_FLASH_ERASE_EXECUTED=NO
          FLASH_ALLOWED=NO
          EOF

          cat /tmp/R71_DECISION.txt

      - name: Remove flashboot binary before upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/R71_FLASHBOOT_64K.bin
          test ! -e /tmp/R71_FLASHBOOT_64K.bin
          echo "R71_FLASHBOOT_BINARY_RETAINED=NO" \
            | tee /tmp/R71_TRANSIENT_STATE.txt

      - name: Build R71 evidence bundle
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          OUT=/tmp/R71_BP1048P4_PCTOOL_EP0_HID_EVIDENCE
          rm -rf "$OUT"
          mkdir -p "$OUT"

          for f in \
            R71_SDK_STATE.txt \
            R71_FLASHBOOT_STATE.txt \
            R71_DESCRIPTOR_PROOF.txt \
            R71_DESCRIPTOR_BYTES.json \
            R71_HID_CONTRACT.txt \
            R71_COMMAND_TABLE.txt \
            R71_R70_CORRECTION.txt \
            R71_DECISION.txt \
            R71_TRANSIENT_STATE.txt; do
            test -f "/tmp/$f" && cp "/tmp/$f" "$OUT/"
          done

          cat > "$OUT/README.txt" <<'EOF'
          R71 corrects and strengthens R70.

          Exact reference flashboot layout:
          0xBB78: 36-byte HID report descriptor
          0xBB9C: 27-byte configuration tree
          0xBBA5: interface 0, HID, zero interrupt endpoints
          0xBBAE: HID descriptor, report length 36
          0xBBB7: one zero padding byte
          0xBBB8: device descriptor, literal VID:PID 0000:2244
          0xBBCC: LANGID descriptor 0409

          HID report:
          - Usage Page FF00 / Usage AA55
          - Input 256 bytes
          - Output 256 bytes
          - Feature 1 byte
          - no Report ID

          With no interrupt endpoints, PCTOOL HID data is carried on EP0 using
          HID class control requests. The standard control-transfer request
          shape is derived offline from the descriptor. Live production
          bootloader identity/response and safe readback remain unproven.

          Static analysis only. No USB hardware or flash operation.
          EOF

          (
            cd /tmp
            zip -qr \
              R71_BP1048P4_PCTOOL_EP0_HID_EVIDENCE.zip \
              R71_BP1048P4_PCTOOL_EP0_HID_EVIDENCE
            sha256sum \
              R71_BP1048P4_PCTOOL_EP0_HID_EVIDENCE.zip \
              > R71_BP1048P4_PCTOOL_EP0_HID_EVIDENCE.zip.sha256
          )

          cat /tmp/R71_BP1048P4_PCTOOL_EP0_HID_EVIDENCE.zip.sha256

      - name: Upload R71 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R71-BP1048P4-PCTOOL-EP0-HID-EVIDENCE
          path: |
            /tmp/R71_BP1048P4_PCTOOL_EP0_HID_EVIDENCE.zip
            /tmp/R71_BP1048P4_PCTOOL_EP0_HID_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: R71 final gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          cat /tmp/R71_DESCRIPTOR_PROOF.txt 2>/dev/null || true
          cat /tmp/R71_HID_CONTRACT.txt 2>/dev/null || true
          cat /tmp/R71_COMMAND_TABLE.txt 2>/dev/null || true
          cat /tmp/R71_R70_CORRECTION.txt 2>/dev/null || true
          cat /tmp/R71_DECISION.txt 2>/dev/null || true

          test "${{ steps.blob.outcome }}" = "success"
          test "${{ steps.descriptors.outcome }}" = "success"
          test "${{ steps.hid_contract.outcome }}" = "success"
          test "${{ steps.commands.outcome }}" = "success"
          test "${{ steps.correction.outcome }}" = "success"
          test "${{ steps.decision.outcome }}" = "success"

          grep -F 'R71_DESCRIPTOR_TREE_EXACT_MATCH=YES' /tmp/R71_DESCRIPTOR_PROOF.txt
          grep -F 'R71_PCTOOL_EP0_ONLY_HID_PROVEN=YES' /tmp/R71_HID_CONTRACT.txt
          grep -F 'R71_INPUT_REPORT_BYTES=256' /tmp/R71_HID_CONTRACT.txt
          grep -F 'R71_OUTPUT_REPORT_BYTES=256' /tmp/R71_HID_CONTRACT.txt
          grep -F 'R71_FEATURE_REPORT_BYTES=1' /tmp/R71_HID_CONTRACT.txt
          grep -F 'R71_CONFIG_PRECEDES_DEVICE_DESCRIPTOR=YES' /tmp/R71_R70_CORRECTION.txt
          grep -F 'R71_REFERENCE_PCTOOL_EP0_HID_TRANSPORT_PROVEN=YES' /tmp/R71_DECISION.txt
          grep -F 'R71_VENDOR_CODE_EXECUTED=NO' /tmp/R71_DECISION.txt
          grep -F 'R71_BOARD_USB_ACCESSED=NO' /tmp/R71_DECISION.txt
          grep -F 'FLASH_ALLOWED=NO' /tmp/R71_DECISION.txt
          grep -F 'R71_FLASHBOOT_BINARY_RETAINED=NO' /tmp/R71_TRANSIENT_STATE.txt

          echo "R71_PCTOOL_EP0_HID_TRANSPORT_CONTRACT_PROOF=PASS"
          echo "FLASH_ALLOWED=NO"
