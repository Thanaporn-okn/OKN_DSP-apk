name: OKN BP1048P4 MASTER V51 MEGA OFFICIAL EXTERNAL PRODUCTION-EVIDENCE ACQUISITION OFFLINE

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/OKN_BP1048P4_MASTER_V51_MEGA_OFFICIAL_EXTERNAL_PRODUCTION_EVIDENCE_ACQUISITION_OFFLINE.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  REQUIRED_PHONE: "Samsung Galaxy S25+"
  REQUIRED_PATH: "Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only"
  TARGET_RUNTIME_VID_PID: "6324:1719"
  REFERENCE_RECOVERY_VID_PID: "0000:2244"

  V50_ARTIFACT_ID: "11302991497"

  GOLOPINE_PAGE: "https://golodsp.com/7%E9%80%9A%E9%81%93%E9%9F%B3%E9%A2%91%E5%89%8D%E7%BA%A7/"
  GOLOPINE_ANDROID_OLD: "https://golodsp.com/wp-content/uploads/2026/02/1Android-APP-golopine-tuning-250401.zip"
  GOLOPINE_ANDROID_NEW: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-01.apk_.zip"
  GOLOPINE_ANDROID_DOC: "https://golodsp.com/wp-content/uploads/2026/02/2Android-APP-Instructions-for-using-GoloPine-tuning-software-for-mobile-phones-Android.docx"
  GOLOPINE_WINDOWS_OLD: "https://golodsp.com/wp-content/uploads/2026/02/4-27Nov2025_Windows-DSTech_AudioDSP_Client.zip"
  GOLOPINE_WINDOWS_NEW: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-08.exe_.zip"
  GOLOPINE_WINDOWS_DOC: "https://golodsp.com/wp-content/uploads/2026/02/5Windows-PC-Instructions-for-using-GoloPine-tuning-software-for-over-Win10.docx"

  EXPECTED_WINDOWS_NEW_EXE_SHA256: "3ca54171c53f7badd963ffe6851b8b3e2faf8aee8ba2afcb7040990e22ae09b2"

  LIVE_DSP_ALLOWED: "NO"
  HOST_TO_DSP_IO: "NO"
  FEATURE_REPORT_ALLOWED: "NO"
  NEW_LIVE_0X11_ALLOWED: "NO"
  STARTUP_COMMAND_ALLOWED: "NO"
  AUTH_REPLY_ALLOWED: "NO"
  FLASH_ALLOWED: "NO"
  ERASE_ALLOWED: "NO"
  WRITE_ALLOWED: "NO"
  SOLDERING_ALLOWED: "NO"
  BOARD_MODIFICATION_ALLOWED: "NO"
  EXTERNAL_PROGRAMMER_ALLOWED: "NO"

jobs:
  v51:
    name: Acquire new official production evidence in one large OFFLINE pass
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Gate 0 - hard physical and safety constraints
        shell: bash
        run: |
          set -euo pipefail

          test "$REQUIRED_PHONE" = "Samsung Galaxy S25+"
          test "$REQUIRED_PATH" = "Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only"
          test "$TARGET_RUNTIME_VID_PID" = "6324:1719"

          test "$LIVE_DSP_ALLOWED" = "NO"
          test "$HOST_TO_DSP_IO" = "NO"
          test "$FEATURE_REPORT_ALLOWED" = "NO"
          test "$NEW_LIVE_0X11_ALLOWED" = "NO"
          test "$STARTUP_COMMAND_ALLOWED" = "NO"
          test "$AUTH_REPLY_ALLOWED" = "NO"
          test "$FLASH_ALLOWED" = "NO"
          test "$ERASE_ALLOWED" = "NO"
          test "$WRITE_ALLOWED" = "NO"

          test "$SOLDERING_ALLOWED" = "NO"
          test "$BOARD_MODIFICATION_ALLOWED" = "NO"
          test "$EXTERNAL_PROGRAMMER_ALLOWED" = "NO"

          rm -rf /tmp/v51
          mkdir -p /tmp/v51/{downloads,v50,official,wp,archive,evidence,out,extract}

          cat > /tmp/v51/evidence/00_SCOPE.txt <<'EOF'
          REVISION=MASTER-V51
          MODE=OFFLINE_EXTERNAL_EVIDENCE_ACQUISITION

          REQUIRED PHYSICAL PATH:
          Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only

          GOAL:
          Obtain genuinely NEW production evidence instead of re-mining the same
          local corpus. V51 uses public official GoloPine resources and archived
          official-domain metadata only.

          COMBINED TASKS:
          1. Download all known official GoloPine Android/Windows packages + docs.
          2. Crawl GoloPine WordPress REST media index and page/sitemaps.
          3. Discover older/hidden official-domain attachment candidates.
          4. Query Internet Archive CDX metadata for removed official-domain files.
          5. Static-only old-vs-new Windows client comparison.
          6. Static-only old-vs-new Android package comparison.
          7. Extract official DOCX/PDF textual instructions.
          8. Search all newly acquired official material for updater/recovery,
             backup/readback, production layout/entry, Device Description schema,
             CH7 ID17 and IDs 22..28.
          9. Produce a single strict production-evidence matrix.

          NO vendor executable is executed.
          NO USB I/O.
          NO APK live test.
          NO live frame.
          NO flash/erase/write.
          FLASH_ALLOWED=NO
          EOF

      - name: Gate 1 - download V50 exact blocker matrix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          curl -fL --retry 5 --retry-all-errors \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V50_ARTIFACT_ID}/zip" \
            -o /tmp/v51/downloads/v50.zip

          unzip -q /tmp/v51/downloads/v50.zip -d /tmp/v51/v50

          test -s /tmp/v51/v50/07_V50_FINAL_MATRIX.json
          cp /tmp/v51/v50/07_V50_FINAL_MATRIX.json \
             /tmp/v51/evidence/01_V50_INPUT_MATRIX.json

      - name: Gate 2 - download all known official GoloPine packages and instructions
        shell: bash
        run: |
          set -euo pipefail

          fetch() {
            local url="$1"
            local out="$2"
            curl -fL --retry 6 --retry-all-errors \
              --connect-timeout 20 --max-time 180 \
              "$url" -o "$out"
          }

          fetch "$GOLOPINE_PAGE" /tmp/v51/official/product_page.html
          fetch "$GOLOPINE_ANDROID_OLD" /tmp/v51/official/android_old.zip
          fetch "$GOLOPINE_ANDROID_NEW" /tmp/v51/official/android_new.zip
          fetch "$GOLOPINE_ANDROID_DOC" /tmp/v51/official/android_instructions.docx
          fetch "$GOLOPINE_WINDOWS_OLD" /tmp/v51/official/windows_old.zip
          fetch "$GOLOPINE_WINDOWS_NEW" /tmp/v51/official/windows_new.zip
          fetch "$GOLOPINE_WINDOWS_DOC" /tmp/v51/official/windows_instructions.docx

          sha256sum /tmp/v51/official/* \
            > /tmp/v51/evidence/02_OFFICIAL_KNOWN_DOWNLOAD_SHA256.txt

          find /tmp/v51/official -maxdepth 1 -type f -printf '%f %s bytes\n' | sort \
            > /tmp/v51/evidence/03_OFFICIAL_KNOWN_DOWNLOAD_SIZES.txt

      - name: Gate 3 - crawl GoloPine WordPress media and sitemap indexes
        shell: bash
        run: |
          set -euo pipefail

          # WordPress REST root / media pagination. Failures are recorded, not fatal.
          curl -fL --retry 3 --retry-all-errors \
            "https://golodsp.com/wp-json/" \
            -o /tmp/v51/wp/wp-json-root.json || true

          : > /tmp/v51/wp/media_all.jsonl
          for page in $(seq 1 20); do
            code="$(curl -sS -L -w '%{http_code}' \
              -o "/tmp/v51/wp/media_${page}.json" \
              "https://golodsp.com/wp-json/wp/v2/media?per_page=100&page=${page}" || true)"
            if [ "$code" != "200" ]; then
              echo "STOP_PAGE=$page HTTP=$code" >> /tmp/v51/evidence/04_WP_MEDIA_FETCH_STATUS.txt
              break
            fi
            cat "/tmp/v51/wp/media_${page}.json" >> /tmp/v51/wp/media_all.jsonl
            echo >> /tmp/v51/wp/media_all.jsonl
          done

          for u in \
            "https://golodsp.com/wp-sitemap.xml" \
            "https://golodsp.com/wp-sitemap-posts-page-1.xml" \
            "https://golodsp.com/wp-sitemap-posts-post-1.xml" \
            "https://golodsp.com/wp-sitemap-users-1.xml"; do
            name="$(echo "$u" | sed 's#https://golodsp.com/##; s#[/?=&]#_#g')"
            curl -fL --retry 3 --retry-all-errors "$u" \
              -o "/tmp/v51/wp/${name}" || true
          done

          python3 - <<'PY'
          from pathlib import Path
          import json,re,html
          root=Path("/tmp/v51/wp")
          candidates=[]
          seen=set()

          for p in root.glob("media_*.json"):
              try:
                  data=json.loads(p.read_text())
              except Exception:
                  continue
              if not isinstance(data,list):
                  continue
              for m in data:
                  url=m.get("source_url") or ""
                  title=((m.get("title") or {}).get("rendered") or "")
                  desc=((m.get("description") or {}).get("rendered") or "")
                  text=" ".join([url,title,desc])
                  if re.search(r'firmware|upgrade|update|recovery|boot|BP1048|DSP|GoloPine|DSTech|audio',text,re.I):
                      if url and url not in seen:
                          seen.add(url)
                          candidates.append({
                              "id":m.get("id"),
                              "date":m.get("date"),
                              "title":html.unescape(re.sub("<[^>]+>","",title)),
                              "url":url,
                              "mime_type":m.get("mime_type"),
                          })

          Path("/tmp/v51/evidence/05_WP_MEDIA_CANDIDATES.json").write_text(
              json.dumps(candidates,indent=2,ensure_ascii=False)+"\n")
          print("WP_MEDIA_CANDIDATES",len(candidates))
          PY

      - name: Gate 4 - acquire newly discovered official attachment files safely
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json,re,urllib.parse
          p=Path("/tmp/v51/evidence/05_WP_MEDIA_CANDIDATES.json")
          items=json.loads(p.read_text()) if p.exists() else []
          allow_ext={".zip",".docx",".pdf",".txt",".bin",".img",".mva",".fw",".rom",".apk",".exe"}
          urls=[]
          for x in items:
              u=x.get("url","")
              path=urllib.parse.urlparse(u).path.lower()
              ext=Path(path).suffix
              # Also include .apk_.zip and .exe_.zip because suffix is .zip.
              if ext in allow_ext:
                  urls.append(u)

          # Keep discovery bounded.
          urls=urls[:120]
          Path("/tmp/v51/wp/download_urls.txt").write_text("\n".join(urls)+"\n")
          print("SAFE_ATTACHMENT_URL_COUNT",len(urls))
          PY

          mkdir -p /tmp/v51/official/discovered
          n=0
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            n=$((n+1))
            base="$(basename "${url%%\?*}")"
            base="${base:-attachment_${n}}"
            dest="/tmp/v51/official/discovered/${n}_${base}"
            # Hard size cap 80 MiB.
            size="$(curl -sSIL "$url" | awk 'BEGIN{IGNORECASE=1}/^content-length:/{gsub("\r","",$2); x=$2}END{print x+0}')"
            if [ "${size:-0}" -gt 83886080 ]; then
              echo "SKIP_TOO_LARGE $size $url" >> /tmp/v51/evidence/06_DISCOVERED_DOWNLOAD_STATUS.txt
              continue
            fi
            if curl -fL --retry 3 --retry-all-errors --max-time 180 "$url" -o "$dest"; then
              echo "OK $url -> $dest" >> /tmp/v51/evidence/06_DISCOVERED_DOWNLOAD_STATUS.txt
            else
              rm -f "$dest"
              echo "FAIL $url" >> /tmp/v51/evidence/06_DISCOVERED_DOWNLOAD_STATUS.txt
            fi
          done < /tmp/v51/wp/download_urls.txt

          find /tmp/v51/official/discovered -type f -print0 \
            | sort -z | xargs -0 -r sha256sum \
            > /tmp/v51/evidence/07_DISCOVERED_ATTACHMENT_SHA256.txt

      - name: Gate 5 - Internet Archive official-domain historical attachment discovery
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 3 --retry-all-errors \
            "https://web.archive.org/cdx/search/cdx?url=golodsp.com/wp-content/uploads/*&output=json&fl=timestamp,original,mimetype,statuscode,digest,length&filter=statuscode:200&collapse=urlkey&limit=5000" \
            -o /tmp/v51/archive/golodsp_uploads_cdx.json || true

          python3 - <<'PY'
          from pathlib import Path
          import json,re
          p=Path("/tmp/v51/archive/golodsp_uploads_cdx.json")
          rows=[]
          if p.exists():
              try:
                  data=json.loads(p.read_text())
                  if data and isinstance(data,list):
                      header=data[0]
                      for r in data[1:]:
                          d=dict(zip(header,r))
                          u=d.get("original","")
                          if re.search(r'firmware|upgrade|update|recovery|boot|BP1048|DSP|GoloPine|DSTech|audio',u,re.I):
                              rows.append(d)
              except Exception as e:
                  rows=[{"parse_error":repr(e)}]
          Path("/tmp/v51/evidence/08_WAYBACK_OFFICIAL_CANDIDATES.json").write_text(
              json.dumps(rows,indent=2,ensure_ascii=False)+"\n")
          print("WAYBACK_CANDIDATES",len(rows))
          PY

      - name: Gate 6 - recursively unpack archives without executing vendor binaries
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import zipfile, shutil

          src=Path("/tmp/v51/official")
          dst=Path("/tmp/v51/extract")
          seen=set()

          # First copy known/discovered files into extraction workspace.
          for p in src.rglob("*"):
              if not p.is_file():
                  continue
              rel=p.relative_to(src)
              q=dst/rel
              q.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(p,q)

          for _ in range(6):
              todo=[p for p in dst.rglob("*.zip") if p not in seen]
              if not todo:
                  break
              for z in todo:
                  seen.add(z)
                  d=z.with_suffix(z.suffix+".unpacked")
                  d.mkdir(parents=True,exist_ok=True)
                  try:
                      with zipfile.ZipFile(z) as q:
                          # basic traversal safety
                          for m in q.infolist():
                              target=(d/m.filename).resolve()
                              if not str(target).startswith(str(d.resolve())):
                                  raise RuntimeError("zip traversal")
                          q.extractall(d)
                  except Exception:
                      pass

          print("ARCHIVES_UNPACKED",len(seen))
          PY

          find /tmp/v51/extract -type f -printf '%P\n' | sort \
            > /tmp/v51/evidence/09_EXTRACTED_FILE_INVENTORY.txt

      - name: Gate 7 - extract text from DOCX and static strings/metadata from packages
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install --quiet --disable-pip-version-check pefile dnfile >/dev/null 2>&1 || true

          python3 - <<'PY'
          from pathlib import Path
          import zipfile,re,html,subprocess,json,hashlib,os

          root=Path("/tmp/v51/extract")
          out=Path("/tmp/v51/evidence")
          corpus=[]
          file_records=[]

          def add_record(p,kind,text):
              corpus.append(f"\n===== FILE={p.relative_to(root)} KIND={kind} =====\n{text}\n")

          for p in sorted(x for x in root.rglob("*") if x.is_file()):
              rec={
                  "path":str(p.relative_to(root)),
                  "size":p.stat().st_size,
                  "sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
              }
              suffix=p.suffix.lower()

              if suffix==".docx":
                  try:
                      with zipfile.ZipFile(p) as z:
                          xml=z.read("word/document.xml").decode(errors="replace")
                      txt=re.sub(r'<w:tab[^>]*/>','\t',xml)
                      txt=re.sub(r'</w:p>','\n',txt)
                      txt=re.sub(r'<[^>]+>','',txt)
                      txt=html.unescape(txt)
                      add_record(p,"DOCX_TEXT",txt)
                      rec["docx_text_chars"]=len(txt)
                  except Exception as e:
                      rec["docx_error"]=repr(e)

              elif suffix in {".exe",".dll"}:
                  ascii_s=subprocess.run(
                      ["strings","-a","-n","4",str(p)],
                      stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,check=False
                  ).stdout.decode(errors="replace")
                  utf16_s=subprocess.run(
                      ["strings","-el","-n","4",str(p)],
                      stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,check=False
                  ).stdout.decode(errors="replace")
                  text=ascii_s+"\n"+utf16_s
                  add_record(p,"PE_STRINGS",text)
                  rec["string_chars"]=len(text)

                  try:
                      import pefile
                      pe=pefile.PE(str(p),fast_load=False)
                      rec["is_dotnet"]=bool(
                          len(pe.OPTIONAL_HEADER.DATA_DIRECTORY)>14 and
                          pe.OPTIONAL_HEADER.DATA_DIRECTORY[14].VirtualAddress
                      )
                  except Exception:
                      pass

                  try:
                      import dnfile
                      dn=dnfile.dnPE(str(p))
                      names=[]
                      if dn.net and dn.net.mdtables.MethodDef:
                          for rid,row in enumerate(dn.net.mdtables.MethodDef.rows,1):
                              names.append({
                                  "token":f"0x{(0x06000000|rid):08X}",
                                  "name":str(row.Name),
                                  "rva":int(row.Rva or 0),
                              })
                      rec["method_count"]=len(names)
                      rec["interesting_methods"]=[
                          x for x in names
                          if re.search(r'usb|hid|feature|write|send|boot|loader|upgrade|update|recovery|flash|firmware|backup|read',x["name"],re.I)
                      ][:2000]
                  except Exception:
                      pass

              elif suffix in {".apk",".dex",".so",".bin",".img",".mva",".fw",".rom"}:
                  text=subprocess.run(
                      ["strings","-a","-n","4",str(p)],
                      stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,check=False
                  ).stdout.decode(errors="replace")
                  add_record(p,"BINARY_STRINGS",text)
                  rec["string_chars"]=len(text)

              else:
                  if p.stat().st_size < 3_000_000:
                      try:
                          raw=p.read_bytes()
                          if b'\x00' not in raw[:4096]:
                              txt=raw.decode("utf-8",errors="replace")
                              add_record(p,"TEXT",txt)
                      except Exception:
                          pass

              file_records.append(rec)

          (out/"10_OFFICIAL_STATIC_FILE_METADATA.json").write_text(
              json.dumps(file_records,indent=2,ensure_ascii=False)+"\n")
          (out/"11_OFFICIAL_TEXT_CORPUS.txt").write_text("".join(corpus),encoding="utf-8")
          print("STATIC_FILE_RECORDS",len(file_records))
          print("CORPUS_CHARS",sum(len(x) for x in corpus))
          PY

      - name: Gate 8 - old-vs-new official Windows and Android delta analysis
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json,re,hashlib

          root=Path("/tmp/v51/extract")
          records=json.loads(Path("/tmp/v51/evidence/10_OFFICIAL_STATIC_FILE_METADATA.json").read_text())

          def classify(path):
              p=path.lower()
              if p.startswith("windows_old.zip.unpacked/"): return "win_old"
              if p.startswith("windows_new.zip.unpacked/"): return "win_new"
              if p.startswith("android_old.zip.unpacked/"): return "and_old"
              if p.startswith("android_new.zip.unpacked/"): return "and_new"
              return None

          groups={k:[] for k in ["win_old","win_new","and_old","and_new"]}
          for r in records:
              g=classify(r["path"])
              if g:
                  groups[g].append(r)

          def interesting_names(rows):
              vals=set()
              for r in rows:
                  for m in r.get("interesting_methods",[]):
                      vals.add(m["name"])
              return vals

          win_old=interesting_names(groups["win_old"])
          win_new=interesting_names(groups["win_new"])

          keyword_re=re.compile(r'firmware|upgrade|update|recovery|boot|flash|backup|readback|loader|dfu',re.I)

          result={
              "group_file_counts":{k:len(v) for k,v in groups.items()},
              "windows_old_interesting_methods_only":sorted(x for x in win_old-win_new if keyword_re.search(x)),
              "windows_new_interesting_methods_only":sorted(x for x in win_new-win_old if keyword_re.search(x)),
              "windows_interesting_methods_common":sorted(x for x in win_old&win_new if keyword_re.search(x)),
          }
          Path("/tmp/v51/evidence/12_OLD_NEW_CLIENT_DELTA.json").write_text(
              json.dumps(result,indent=2,ensure_ascii=False)+"\n")
          print(json.dumps(result,indent=2,ensure_ascii=False))
          PY

      - name: Gate 9 - search NEW official corpus for each V50 production blocker
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json,re

          corpus=Path("/tmp/v51/evidence/11_OFFICIAL_TEXT_CORPUS.txt").read_text(errors="replace")
          v50=json.loads(Path("/tmp/v51/v50/07_V50_FINAL_MATRIX.json").read_text())

          # Discovery patterns are deliberately broad. Promotion below is strict.
          patterns={
              "runtime_updater":[
                  r'6324',r'1719',r'bootloader',r'recovery',r'upgrade',r'updater',
                  r'firmware update',r'firmware upgrade'
              ],
              "backup":[r'backup',r'readback',r'read flash',r'flash read',r'dump flash'],
              "layout":[r'flash map',r'memory map',r'linker',r'entry point',r'load address',
                        r'0x[0-9A-Fa-f]{6,8}'],
              "schema":[r'BiquadCascade7thChannel',r'i2sout1R',r'"ID"\s*:\s*17',
                        r'"ID"\s*:\s*2[2-8]'],
              "recovery_identity":[r'2244',r'recovery.*VID',r'recovery.*PID',
                                   r'VID.*PID',r'USB.*recovery'],
          }

          discovery={k:sum(len(re.findall(p,corpus,re.I)) for p in ps) for k,ps in patterns.items()}

          # Strict promotion: require official corpus to spell out exact production facts.
          exact_runtime_pair=bool(re.search(r'6324.{0,40}1719|1719.{0,40}6324',corpus,re.I|re.S))
          exact_recovery_pair=bool(re.search(r'0000.{0,20}2244|2244.{0,20}0000',corpus,re.I|re.S))
          no11_phrase=bool(re.search(r'(without|no).{0,30}(0x11|byte 11)|0x11.{0,30}(not required|unused)',corpus,re.I|re.S))
          nonfeature_phrase=bool(re.search(r'(without|no).{0,30}feature|feature.{0,30}(not required|unused)',corpus,re.I|re.S))

          exact_ch7=bool(re.search(
              r'BiquadCascade7thChannel.{0,500}"ID"\s*:\s*17|"ID"\s*:\s*17.{0,500}BiquadCascade7thChannel',
              corpus,re.I|re.S
          ))

          # IDs 22..28 global-free needs an explicit complete-schema statement.
          gain_global_free=bool(re.search(
              r'(IDs?\s*22\s*(?:\.\.|-|through)\s*28).{0,200}(free|unused|available)',
              corpus,re.I|re.S
          ))

          backup_proven=bool(re.search(
              r'(complete|full).{0,80}(flash|firmware).{0,80}(backup|readback|dump).{0,80}(read[- ]?only|without write)',
              corpus,re.I|re.S
          ))

          layout_proven=bool(re.search(
              r'(production|GoloPine|DSTech).{0,100}(flash map|memory map|load address|entry point)',
              corpus,re.I|re.S
          ))

