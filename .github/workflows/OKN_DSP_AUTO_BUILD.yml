name: OKN DSP Auto Build

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "OKN_DSP_V*_PHASE*_Sources.zip"
      - ".github/workflows/OKN_DSP_AUTO_BUILD.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: okn-dsp-auto-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find newest OKN DSP source package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(ls -1t OKN_DSP_V*_PHASE*_Sources.zip 2>/dev/null | head -n 1 || true)"
          if [ -z "$ZIP_FILE" ]; then
            echo "No OKN_DSP_V*_PHASE*_Sources.zip found in repository root."
            exit 1
          fi
          BASE="${ZIP_FILE%_Sources.zip}"
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Using $ZIP_FILE"

      - name: Extract source package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work release
          mkdir -p work release/Sources
          unzip -q "${{ steps.package.outputs.zip }}" -d work
          test -f work/Sources/project/settings.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: work/Sources/project
        shell: bash
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Package APK and SHA256 inside Sources
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ steps.package.outputs.base }}"
          APK="work/Sources/project/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" "release/${BASE}-debug.apk"
          cp -R work/Sources/. release/Sources/
          sha256sum "release/${BASE}-debug.apk" > "release/Sources/${BASE}_APK.sha256"
          sha256sum "${{ steps.package.outputs.zip }}" > "release/Sources/${BASE}_SOURCE_ZIP.sha256"
          echo "Built: ${BASE}-debug.apk"
          cat "release/Sources/${BASE}_APK.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.base }}
          path: release/
          if-no-files-found: error
          retention-days: 30
