name: OKN_DSP Auto Build

on:
  push:
    paths:
      - 'OKN_DSP_V*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select newest OKN_DSP source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name 'OKN_DSP_V*.zip' -printf '%f\n' | sort -V | tail -n 1)"
          if [ -z "$ZIP" ]; then
            echo "No OKN_DSP_V*.zip found in repository root"
            exit 1
          fi
          VERSION="$(basename "$ZIP" .zip | sed -E 's/^OKN_DSP_//')"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using $ZIP ($VERSION)"

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _okn_src
          mkdir -p _okn_src
          unzip -q "${{ steps.source.outputs.zip }}" -d _okn_src
          ROOT="$(dirname "$(find _okn_src -maxdepth 4 -type f -name settings.gradle.kts | head -n 1)")"
          if [ ! -f "$ROOT/settings.gradle.kts" ]; then
            echo "Android project root not found after unzip"
            exit 1
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          gradle --no-daemon clean assembleDebug

      - name: Prepare APK and SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find "$PROJECT_ROOT/app/build/outputs/apk/debug" -type f -name '*.apk' | head -n 1)"
          if [ ! -f "$APK" ]; then
            echo "APK not found"
            exit 1
          fi
          OUT="dist/OKN_DSP_${{ steps.source.outputs.version }}_debug.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "dist/OKN_DSP_${{ steps.source.outputs.version }}_debug.apk.sha256"
          cp "${{ steps.source.outputs.zip }}" dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN_DSP_${{ steps.source.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="okn-dsp-${{ steps.source.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "OKN_DSP ${{ steps.source.outputs.version }}" \
              --notes "Automatic build from ${{ steps.source.outputs.zip }}"
          fi
