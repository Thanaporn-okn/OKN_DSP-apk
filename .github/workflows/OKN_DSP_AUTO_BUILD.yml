name: OKN_DSP Auto Build

on:
  push:
    paths:
      - 'OKN_DSP_V*_SOURCE.zip'
      - '.github/workflows/OKN_DSP_AUTO_BUILD.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest uploaded Version ZIP
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ZIP="$(ls -1 OKN_DSP_V*_SOURCE.zip 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "${SOURCE_ZIP:-}" ]; then
            echo "No OKN_DSP_V*_SOURCE.zip found"
            exit 1
          fi
          VERSION="$(basename "$SOURCE_ZIP" _SOURCE.zip)"
          echo "source_zip=$SOURCE_ZIP" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION from $SOURCE_ZIP"

      - name: Unpack source ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -q "${{ steps.meta.outputs.source_zip }}" -d buildsrc
          test -f buildsrc/settings.gradle
          test -f buildsrc/app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p buildsrc --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      - name: Create APK + SHA256 in Sources
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          APK_SRC="buildsrc/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_SRC"
          cp "$APK_SRC" "${VERSION}.apk"
          mkdir -p buildsrc/Sources
          sha256sum "${VERSION}.apk" > "buildsrc/Sources/${VERSION}.apk.sha256"
          sha256sum "${{ steps.meta.outputs.source_zip }}" > "buildsrc/Sources/${VERSION}_SOURCE.zip.sha256"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.version }}-APK
          path: |
            ${{ steps.meta.outputs.version }}.apk
            buildsrc/Sources/${{ steps.meta.outputs.version }}.apk.sha256
            buildsrc/Sources/${{ steps.meta.outputs.version }}_SOURCE.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload build error log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.version || 'OKN_DSP_BUILD' }}-ERROR-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 14
