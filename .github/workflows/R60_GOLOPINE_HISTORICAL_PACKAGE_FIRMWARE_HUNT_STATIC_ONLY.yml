name: R60 GoloPine historical package firmware hunt static only

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r60-golopine-historical-package-hunt-${{ github.ref }}
  cancel-in-progress: true

env:
  OLD_WIN_URL: https://golodsp.com/wp-content/uploads/2026/02/4-27Nov2025_Windows-DSTech_AudioDSP_Client.zip
  OLD_ANDROID_URL: https://golodsp.com/wp-content/uploads/2026/02/1Android-APP-golopine-tuning-250401.zip

jobs:
  r60-static-historical-hunt:
    name: Static scan historical GoloPine packages / NO EXECUTION / NO FLASH
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl unzip zip file binutils p7zip-full python3

      - name: Download historical official packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r60/downloads

          curl -fL --retry 3 --retry-delay 2 \
            "$OLD_WIN_URL" \
            -o /tmp/r60/downloads/golopine_windows_2025-11-27.zip

          curl -fL --retry 3 --retry-delay 2 \
            "$OLD_ANDROID_URL" \
            -o /tmp/r60/downloads/golopine_android_250401.zip

          unzip -t /tmp/r60/downloads/golopine_windows_2025-11-27.zip
          unzip -t /tmp/r60/downloads/golopine_android_250401.zip

          sha256sum /tmp/r60/downloads/*.zip \
            | tee /tmp/r60/HISTORICAL_DOWNLOAD_SHA256.txt

          file /tmp/r60/downloads/*.zip \
            | tee /tmp/r60/HISTORICAL_DOWNLOAD_FILETYPES.txt

      - name: Extract package trees
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r60/win /tmp/r60/android

          unzip -q /tmp/r60/downloads/golopine_windows_2025-11-27.zip \
            -d /tmp/r60/win
          unzip -q /tmp/r60/downloads/golopine_android_250401.zip \
            -d /tmp/r60/android

          {
            echo "=== WINDOWS 27NOV2025 ==="
            find /tmp/r60/win -type f -printf '%P\t%s\n' | sort
            echo
            echo "=== ANDROID 250401 ==="
            find /tmp/r60/android -type f -printf '%P\t%s\n' | sort
          } | tee /tmp/r60/HISTORICAL_PACKAGE_FILE_LIST.txt

      - name: Inventory PE APK and nested archive resources
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/r60/SEVENZIP_INVENTORY.txt

          find /tmp/r60/win /tmp/r60/android -type f -print0 |
          while IFS= read -r -d '' f; do
            case "${f,,}" in
              *.exe|*.dll|*.zip|*.apk|*.jar)
                {
                  echo "===== $f ====="
                  7z l -slt "$f" 2>/dev/null || true
                } >> /tmp/r60/SEVENZIP_INVENTORY.txt
                ;;
            esac
          done

          sed -n '1,1500p' /tmp/r60/SEVENZIP_INVENTORY.txt

      - name: Recursively scan binary signatures and firmware candidates
        id: scan
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import io, json, zipfile, hashlib

          roots = [
              ("windows_2025", Path("/tmp/r60/win")),
              ("android_250401", Path("/tmp/r60/android")),
          ]

          sigs = {
              "MVA_MAGIC_4D56B158": bytes.fromhex("4d56b158"),
              "APP_MAGIC_C9BDBEB0": bytes.fromhex("c9bdbeb0"),
              "CRC16_XMODEM_TABLE_PREFIX_LE": bytes.fromhex("0000211042206330"),
          }

          ascii_needles = [
              b"MVB1X", b"FastCRC", b"fastcrc",
              b"code_crc", b"boot_crc", b"code_len", b"boot_len",
              b"ActualCode CRC", b"ActualCode",
              b"01PKG", b"02PKG", b"03PKG", b"04PKG", b"05PKG",
              b"chiperas", b"codedata", b"bootdat", b"constdat",
              b"cnfgdat", b"btupdat", b"upinfo", b"cxxx",
              b"FLASH_BOOT_EN", b"BP1048P4",
          ]

          dedicated = {".mva",".img",".fw",".rom",".ota",".dfu",".hex"}
          findings = []
          candidates = []
          scanned = 0

          def scan_blob(label, data, depth=0):
              nonlocal_scanned[0] += 1
              sha = hashlib.sha256(data).hexdigest()
              size = len(data)

              for name, sig in sigs.items():
                  offs=[]
                  start=0
                  while True:
                      i=data.find(sig,start)
                      if i < 0: break
                      offs.append(i)
                      start=i+1
                      if len(offs)>=64: break
                  if offs:
                      findings.append({
                          "kind":"binary_signature",
                          "label":label,
                          "signature":name,
                          "offsets":offs,
                          "size":size,
                          "sha256":sha,
                      })

              for needle in ascii_needles:
                  if needle in data:
                      findings.append({
                          "kind":"ascii",
                          "label":label,
                          "needle":needle.decode("ascii","replace"),
                          "size":size,
                          "sha256":sha,
                      })

              base = label.split("!")[-1].lower()
              suffix = Path(base).suffix.lower()
              framework_bin = (
                  base.endswith("assetmanifest.bin") or
                  base.endswith("debugprobeskt.bin")
              )
              generic = (
                  suffix in {".bin",".dat"} and
                  size >= 65536 and
                  not framework_bin
              )
              if suffix in dedicated or generic:
                  candidates.append({
                      "label":label,
                      "suffix":suffix,
                      "size":size,
                      "sha256":sha,
                      "classification":(
                          "dedicated_firmware_extension"
                          if suffix in dedicated
                          else "large_generic_binary"
                      ),
                  })

              if depth >= 5:
                  return

              if suffix in {".zip",".apk",".jar"}:
                  try:
                      with zipfile.ZipFile(io.BytesIO(data)) as z:
                          for info in z.infolist():
                              if info.is_dir():
                                  continue
                              try:
                                  child=z.read(info)
                              except Exception:
                                  continue
                              scan_blob(f"{label}!{info.filename}", child, depth+1)
                  except zipfile.BadZipFile:
                      pass

          nonlocal_scanned=[0]
          for root_name, root in roots:
              for p in root.rglob("*"):
                  if p.is_file():
                      scan_blob(
                          f"{root_name}/{p.relative_to(root).as_posix()}",
                          p.read_bytes(),
                          0
                      )

          Path("/tmp/r60/FINDINGS.json").write_text(
              json.dumps(findings,indent=2,ensure_ascii=False)+"\n",
              encoding="utf-8"
          )
          Path("/tmp/r60/CANDIDATES.json").write_text(
              json.dumps(candidates,indent=2,ensure_ascii=False)+"\n",
              encoding="utf-8"
          )

          summary = [
              f"SCANNED_BLOBS={nonlocal_scanned[0]}",
              f"FINDINGS={len(findings)}",
              f"FIRMWARE_CANDIDATES={len(candidates)}",
              "MVA_MAGIC_HITS="+str(sum(
                  1 for x in findings
                  if x.get("signature")=="MVA_MAGIC_4D56B158"
              )),
              "APP_MAGIC_HITS="+str(sum(
                  1 for x in findings
                  if x.get("signature")=="APP_MAGIC_C9BDBEB0"
              )),
              "CRC16_TABLE_PREFIX_HITS="+str(sum(
                  1 for x in findings
                  if x.get("signature")=="CRC16_XMODEM_TABLE_PREFIX_LE"
              )),
          ]
          Path("/tmp/r60/SCAN_SUMMARY.txt").write_text(
              "\n".join(summary)+"\n",encoding="utf-8"
          )
          print("\n".join(summary))
          print("=== candidates ===")
          for x in candidates[:100]:
              print(json.dumps(x,ensure_ascii=False))
          print("=== findings ===")
          for x in findings[:300]:
              print(json.dumps(x,ensure_ascii=False))
          PY

      - name: Scan ASCII and UTF-16LE strings
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/r60/INTERESTING_STRINGS.txt

          find /tmp/r60/win /tmp/r60/android -type f -print0 |
          while IFS= read -r -d '' f; do
            case "${f,,}" in
              *.exe|*.dll|*.apk|*.dex|*.so|*.dat|*.bin)
                {
                  echo "===== ASCII $f ====="
                  strings -a -n 5 "$f" 2>/dev/null |
                    grep -Eai \
                    'MVB1X|FastCRC|code_crc|boot_crc|code_len|boot_len|ActualCode|01PKG|02PKG|03PKG|04PKG|05PKG|chiperas|codedata|bootdat|constdat|cnfgdat|btupdat|upinfo|cxxx|FLASH_BOOT|BP1048' \
                    | head -n 1000 || true

                  echo "===== UTF16LE $f ====="
                  strings -a -el -n 5 "$f" 2>/dev/null |
                    grep -Eai \
                    'MVB1X|FastCRC|code_crc|boot_crc|code_len|boot_len|ActualCode|01PKG|02PKG|03PKG|04PKG|05PKG|chiperas|codedata|bootdat|constdat|cnfgdat|btupdat|upinfo|cxxx|FLASH_BOOT|BP1048' \
                    | head -n 1000 || true
                } >> /tmp/r60/INTERESTING_STRINGS.txt
                ;;
            esac
          done

          sed -n '1,2000p' /tmp/r60/INTERESTING_STRINGS.txt

      - name: Historical package decision
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json

          findings=json.loads(Path("/tmp/r60/FINDINGS.json").read_text())
          candidates=json.loads(Path("/tmp/r60/CANDIDATES.json").read_text())

          mva=any(x.get("signature")=="MVA_MAGIC_4D56B158" for x in findings)
          app=any(x.get("signature")=="APP_MAGIC_C9BDBEB0" for x in findings)
          crc=any(x.get("signature")=="CRC16_XMODEM_TABLE_PREFIX_LE" for x in findings)
          metadata=bool(findings)
          candidate=bool(candidates)

          lines=[
              f"R60_MVA_MAGIC_FOUND={'YES' if mva else 'NO'}",
              f"R60_APP_MAGIC_FOUND={'YES' if app else 'NO'}",
              f"R60_CRC16_TABLE_PATTERN_FOUND={'YES' if crc else 'NO'}",
              f"R60_STATIC_METADATA_FINDINGS={'YES' if metadata else 'NO'}",
              f"R60_CREDIBLE_FIRMWARE_CANDIDATE_FOUND={'YES' if candidate else 'NO'}",
              f"R60_HISTORICAL_PACKAGE_PATH_HAS_NEW_EVIDENCE={'YES' if (metadata or candidate) else 'NO'}",
              "R60_RECOVERY_VALIDATED=NO",
              "R60_PRODUCTION_LAYOUT_PROVEN=NO",
              "R60_FLASH_COMMAND_EXECUTED=NO",
              "FLASH_ALLOWED=NO",
          ]
          Path("/tmp/r60/R60_DECISION.txt").write_text(
              "\n".join(lines)+"\n",encoding="utf-8"
          )
          print("\n".join(lines))
          PY

      - name: Build evidence bundle
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          OUT=/tmp/R60_GOLOPINE_HISTORICAL_PACKAGE_FIRMWARE_HUNT_EVIDENCE
          rm -rf "$OUT"
          mkdir -p "$OUT"

          for f in \
            HISTORICAL_DOWNLOAD_SHA256.txt \
            HISTORICAL_DOWNLOAD_FILETYPES.txt \
            HISTORICAL_PACKAGE_FILE_LIST.txt \
            SEVENZIP_INVENTORY.txt \
            FINDINGS.json \
            CANDIDATES.json \
            SCAN_SUMMARY.txt \
            INTERESTING_STRINGS.txt \
            R60_DECISION.txt; do
            test -f "/tmp/r60/$f" && cp "/tmp/r60/$f" "$OUT/"
          done

          cat > "$OUT/README.txt" <<'EOF'
          R60 historical official package scan.
          Sources:
          - Windows DSTech_AudioDSP_Client 27-Nov-2025
          - Android GoloPine tuning package 250401
          Static analysis only.
          No vendor executable is run.
          No USB device is accessed.
          No erase/program/flash action is performed.
          EOF

          (
            cd /tmp
            zip -qr \
              R60_GOLOPINE_HISTORICAL_PACKAGE_FIRMWARE_HUNT_EVIDENCE.zip \
              R60_GOLOPINE_HISTORICAL_PACKAGE_FIRMWARE_HUNT_EVIDENCE
            sha256sum \
              R60_GOLOPINE_HISTORICAL_PACKAGE_FIRMWARE_HUNT_EVIDENCE.zip \
              > R60_GOLOPINE_HISTORICAL_PACKAGE_FIRMWARE_HUNT_EVIDENCE.zip.sha256
          )

          cat /tmp/R60_GOLOPINE_HISTORICAL_PACKAGE_FIRMWARE_HUNT_EVIDENCE.zip.sha256

      - name: Upload R60 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R60-GOLOPINE-HISTORICAL-PACKAGE-FIRMWARE-HUNT-EVIDENCE
          path: |
            /tmp/R60_GOLOPINE_HISTORICAL_PACKAGE_FIRMWARE_HUNT_EVIDENCE.zip
            /tmp/R60_GOLOPINE_HISTORICAL_PACKAGE_FIRMWARE_HUNT_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: R60 final gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          cat /tmp/r60/SCAN_SUMMARY.txt 2>/dev/null || true
          cat /tmp/r60/R60_DECISION.txt 2>/dev/null || true

          test -s /tmp/r60/HISTORICAL_DOWNLOAD_SHA256.txt
          test -s /tmp/r60/HISTORICAL_PACKAGE_FILE_LIST.txt
          test -s /tmp/r60/FINDINGS.json
          test -s /tmp/r60/CANDIDATES.json
          test -s /tmp/r60/R60_DECISION.txt

          grep -F 'R60_FLASH_COMMAND_EXECUTED=NO' /tmp/r60/R60_DECISION.txt
          grep -F 'FLASH_ALLOWED=NO' /tmp/r60/R60_DECISION.txt

          echo "R60_HISTORICAL_STATIC_HUNT=PASS"
          echo "FLASH_ALLOWED=NO"
