          echo "Embedded archive SHA256:"
          sha256sum "$ARCHIVE"
          tar -xJf "$ARCHIVE" -C "$WORK"

          SRC_DIR="$(find "$WORK" -mindepth 1 -maxdepth 2 -type f -name settings.gradle -printf '%h\n' | head -n1)"
          if [[ -z "${SRC_DIR:-}" || ! -f "$SRC_DIR/app/build.gradle" ]]; then
            echo 'ERROR: Android project not found after embedded archive extraction.'
            exit 1
          fi

          VERSION_NAME="$(sed -n "s/.*versionName[[:space:]]*['\"]\([^'\"]*\)['"].*/\1/p" "$SRC_DIR/app/build.gradle" | head -n1)"
          VERSION_CODE="$(sed -n 's/.*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' "$SRC_DIR/app/build.gradle" | head -n1)"
          if [[ -z "$VERSION_NAME" || -z "$VERSION_CODE" ]]; then
            echo 'ERROR: versionName/versionCode not found.'
            exit 1
          fi

          SOURCE_LABEL="embedded-OKN_DSP_V50_Dark_Aurora"
          echo "SRC_DIR=$SRC_DIR" >> "$GITHUB_ENV"
          echo "SOURCE_LABEL=$SOURCE_LABEL" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Source=$SOURCE_LABEL Version=$VERSION_NAME ($VERSION_CODE)"

      - name: Verify packaged SHA256 manifest
        shell: bash
        run: |
          set -euo pipefail
          cd "$SRC_DIR"
          test -f Sources/SHA256SUMS.txt
          sha256sum -c Sources/SHA256SUMS.txt

      - name: Run DSP safety validations (version-aware)
        shell: bash
        run: |
          set -euo pipefail
          cd "$SRC_DIR"

          echo "Validating source version ${VERSION_NAME} (code ${VERSION_CODE})"
          python3 Sources/validate_v38_gate.py
          python3 Sources/validate_v39_reset.py

          MAJOR="${VERSION_NAME%%.*}"
          case "$MAJOR" in
            50)
              test -f Sources/validate_v49_bass_buttons.py
              echo 'Running V50 compatibility safety check with V49 BassVolume ID8 ±1 dB validator.'
              python3 Sources/validate_v49_bass_buttons.py
