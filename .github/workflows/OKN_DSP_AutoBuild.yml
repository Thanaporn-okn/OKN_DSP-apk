name: OKN DSP Auto Build

on:
  push:
    paths:
      - 'OKN_DSP_V*_Sources.zip'
      - '.github/workflows/OKN_DSP_AutoBuild.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: okn-dsp-autobuild
  cancel-in-progress: false

jobs:
  build-latest-version:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find latest OKN_DSP source ZIP
        id: src
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'OKN_DSP_V*_Sources.zip' -printf '%f\n' | sort -V | tail -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "No OKN_DSP_V*_Sources.zip found in repository root."
            exit 1
          fi
          VERSION="$(echo "$ZIP_FILE" | sed -E 's/^OKN_DSP_(V[0-9]+)_Sources\.zip$/\1/')"
          if ! [[ "$VERSION" =~ ^V[0-9]+$ ]]; then
            echo "Cannot determine version from $ZIP_FILE"
            exit 1
          fi
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $ZIP_FILE ($VERSION)"

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q "${{ steps.src.outputs.zip }}" -d buildsrc
          mapfile -t DIRS < <(find buildsrc -mindepth 1 -maxdepth 1 -type d | sort)
          if [ "${#DIRS[@]}" -ne 1 ]; then
            echo "Source ZIP must contain exactly one project directory."
            find buildsrc -maxdepth 2 -type d -print
            exit 1
          fi
          SRC_DIR="${DIRS[0]}"
          test -f "$SRC_DIR/settings.gradle"
          test -f "$SRC_DIR/app/build.gradle"
          test -f "$SRC_DIR/Sources/VERSION.txt"
          echo "SRC_DIR=$SRC_DIR" >> "$GITHUB_ENV"

      - name: Verify version coherence
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ steps.src.outputs.version }}"
          ACTUAL="$(sed -n 's/^VERSION=//p' "$SRC_DIR/Sources/VERSION.txt" | head -n 1)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Version mismatch: filename=$EXPECTED VERSION.txt=$ACTUAL"
            exit 1
          fi
          echo "Version coherence PASS: $ACTUAL"

      - name: Verify source SHA256
        shell: bash
        run: |
          set -euo pipefail
          cd "$SRC_DIR"
          test -f Sources/SHA256SUMS.txt
          sha256sum -c Sources/SHA256SUMS.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p "$SRC_DIR" :app:assembleDebug

      - name: Package APK and SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$SRC_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          OUT="dist/OKN_DSP_${{ steps.src.outputs.version }}-debug.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "dist/OKN_DSP_${{ steps.src.outputs.version }}-debug.apk.sha256"
          cp "$SRC_DIR/Sources/SHA256SUMS.txt" "dist/OKN_DSP_${{ steps.src.outputs.version }}_SOURCE_SHA256SUMS.txt"
          cat "dist/OKN_DSP_${{ steps.src.outputs.version }}-debug.apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN_DSP_${{ steps.src.outputs.version }}_APK
          path: |
            dist/OKN_DSP_${{ steps.src.outputs.version }}-debug.apk
            dist/OKN_DSP_${{ steps.src.outputs.version }}-debug.apk.sha256
            dist/OKN_DSP_${{ steps.src.outputs.version }}_SOURCE_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
