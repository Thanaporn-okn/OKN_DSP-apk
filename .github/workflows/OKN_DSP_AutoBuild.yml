name: OKN_DSP Auto Build

on:
  push:
    branches: [ main, master ]
    paths:
      - 'OKN_DSP_V*.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Version ZIP
        id: src
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(ls -1v OKN_DSP_V*.zip 2>/dev/null | tail -n 1)"
          test -n "$ZIP"
          BASENAME="${ZIP%.zip}"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "name=$BASENAME" >> "$GITHUB_OUTPUT"

      - name: Unpack Sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _okn_build
          mkdir -p _okn_build
          unzip -q "${{ steps.src.outputs.zip }}" -d _okn_build
          PROJECT="$(find _okn_build -maxdepth 3 -name settings.gradle -printf '%h\n' | head -n 1)"
          test -n "$PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT"
          gradle --no-daemon clean :app:assembleDebug

      - name: Create APK SHA256 inside Sources
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          mkdir -p "$PROJECT/Sources"
          sha256sum "$APK" > "$PROJECT/Sources/${{ steps.src.outputs.name }}_APK_SHA256.txt"
          mkdir -p _okn_artifact/Sources
          cp "$APK" "_okn_artifact/${{ steps.src.outputs.name }}.apk"
          cp "$PROJECT/Sources/${{ steps.src.outputs.name }}_APK_SHA256.txt" _okn_artifact/Sources/
          find "$PROJECT/Sources" -maxdepth 1 -type f -name '*SHA256*.txt' -exec cp {} _okn_artifact/Sources/ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.src.outputs.name }}
          path: _okn_artifact/
          if-no-files-found: error
