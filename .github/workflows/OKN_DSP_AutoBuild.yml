name: OKN DSP Auto Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_V*_Sources.zip'
      - 'app/**'
      - 'Sources/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/OKN_DSP_AutoBuild.yml'
  pull_request:
    paths:
      - 'OKN_DSP_V*_Sources.zip'
      - 'app/**'
      - 'Sources/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/OKN_DSP_AutoBuild.yml'

permissions:
  contents: read

concurrency:
  group: okn-dsp-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.9'
  ANDROID_PLATFORM: 'android-35'
  ANDROID_BUILD_TOOLS: '35.0.0'

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Auto-detect latest OKN DSP source
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          WORK="$GITHUB_WORKSPACE/OKN_DSP_BUILD_SOURCE"
          rm -rf "$WORK"
          mkdir -p "$WORK"

          REPO_DIR=""
          REPO_CODE=0
          if [[ -f "$ROOT/settings.gradle" && -f "$ROOT/app/build.gradle" ]]; then
            REPO_DIR="$ROOT"
            REPO_CODE="$(sed -n 's/.*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' "$ROOT/app/build.gradle" | head -n1)"
            REPO_CODE="${REPO_CODE:-0}"
          fi

          ZIP_DIR=""
          ZIP_CODE=0
          mapfile -t ZIPS < <(find "$ROOT" -maxdepth 2 -type f -name 'OKN_DSP_V*_Sources.zip' -print | sort -V)
          if (( ${#ZIPS[@]} > 0 )); then
            SOURCE_ZIP="${ZIPS[$((${#ZIPS[@]} - 1))]}"
            echo "Newest packaged source: $SOURCE_ZIP"
            unzip -q "$SOURCE_ZIP" -d "$WORK"
            ZIP_DIR="$(find "$WORK" -mindepth 1 -maxdepth 2 -type f -name settings.gradle -printf '%h\n' | head -n1)"
            if [[ -z "${ZIP_DIR:-}" || ! -f "$ZIP_DIR/app/build.gradle" ]]; then
              echo 'ERROR: Android project not found after ZIP extraction.'
              find "$WORK" -maxdepth 4 -type f | sort | head -200
              exit 1
            fi
            ZIP_CODE="$(sed -n 's/.*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' "$ZIP_DIR/app/build.gradle" | head -n1)"
            ZIP_CODE="${ZIP_CODE:-0}"
          fi

          if (( ZIP_CODE >= REPO_CODE && ZIP_CODE > 0 )); then
            SRC_DIR="$ZIP_DIR"
            SOURCE_LABEL="$(basename "$SOURCE_ZIP" .zip)"
          elif (( REPO_CODE > 0 )); then
            SRC_DIR="$REPO_DIR"
            SOURCE_LABEL="repo-tree"
          else
            echo 'ERROR: no valid OKN DSP Android source found.'
            exit 1
          fi

          echo "Repository tree versionCode: $REPO_CODE"
          echo "Packaged ZIP versionCode:    $ZIP_CODE"
          echo "Selected source:             $SOURCE_LABEL"

          VERSION_NAME="$(sed -n "s/.*versionName[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" "$SRC_DIR/app/build.gradle" | head -n1)"
          VERSION_CODE="$(sed -n 's/.*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' "$SRC_DIR/app/build.gradle" | head -n1)"
          if [[ -z "$VERSION_NAME" || -z "$VERSION_CODE" ]]; then
            echo 'ERROR: versionName/versionCode not found.'
            exit 1
          fi

          echo "SRC_DIR=$SRC_DIR" >> "$GITHUB_ENV"
          echo "SOURCE_LABEL=$SOURCE_LABEL" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Source=$SOURCE_LABEL Version=$VERSION_NAME ($VERSION_CODE)"

      - name: Verify packaged SHA256 manifest
        shell: bash
        run: |
          set -euo pipefail
          cd "$SRC_DIR"
          test -f Sources/SHA256SUMS.txt
          sha256sum -c Sources/SHA256SUMS.txt

      - name: Run DSP safety validations (version-aware)
        shell: bash
        run: |
          set -euo pipefail
          cd "$SRC_DIR"

          echo "Validating source version ${VERSION_NAME} (code ${VERSION_CODE})"
          python3 Sources/validate_v38_gate.py
          python3 Sources/validate_v39_reset.py

          MAJOR="${VERSION_NAME%%.*}"
          case "$MAJOR" in
            47)
              test -f Sources/validate_v47_bass_volume.py
              echo 'Running V47 BassVolume ID8 0..+74 dB validator.'
              python3 Sources/validate_v47_bass_volume.py
              ;;
            46)
              test -f Sources/validate_v46_bass_volume.py
              echo 'Running V46 BassVolume-ID8-only validator.'
              python3 Sources/validate_v46_bass_volume.py
              ;;
            45)
              test -f Sources/validate_v45_music_safe_eq.py
              echo 'Running V45 music-safe interactive EQ validator.'
              python3 Sources/validate_v45_music_safe_eq.py
              ;;
            44)
              test -f Sources/validate_v44_hifi_coexistence.py
              echo 'Running V44 Hi-Fi coexistence validator.'
              python3 Sources/validate_v44_hifi_coexistence.py
              ;;
            43)
              test -f Sources/validate_v43_audio_guard.py
              echo 'Running V43 Audio Guard validator (V42 divisor check is intentionally NOT used).'
              python3 Sources/validate_v43_audio_guard.py
              ;;
            42)
              test -f Sources/validate_v42_audio_ui.py
              echo 'Running V42 Audio/UI validator.'
              python3 Sources/validate_v42_audio_ui.py
              ;;
            *)
              echo "ERROR: no approved version-specific safety validator for V${MAJOR}."
              exit 1
              ;;
          esac

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Google no longer serves the legacy `tools` SDK package.
          # Install only platform-tools here; cmdline-tools are provided by the action.
          packages: 'platform-tools'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK" || ! -d "$SDK" ]]; then
            echo 'ERROR: Android SDK is not available on this runner.'
            exit 1
          fi

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n1 || true)"
          fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo 'ERROR: sdkmanager not found.'
            exit 1
          fi

          echo "Using SDK: $SDK"
          echo "Using sdkmanager: $SDKMANAGER"

          # setup-android@v4 already accepts licenses and installs platform-tools.
          # Install only the project-specific Android platform/build-tools here.
          "$SDKMANAGER" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Verify Gradle project is visible to setup-gradle
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SRC_DIR/settings.gradle"
          test -f "$SRC_DIR/build.gradle"
          test -f "$SRC_DIR/app/build.gradle"
          echo "Gradle source directory: $SRC_DIR"
          echo 'Gradle files visible under GITHUB_WORKSPACE:'
          find "$GITHUB_WORKSPACE" -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \
               -o -name 'build.gradle' -o -name 'build.gradle.kts' \
               -o -name 'gradle-wrapper.properties' \) \
            -print | sort
          if ! find "$GITHUB_WORKSPACE" -type f \
              \( -name '*.gradle' -o -name '*.gradle.kts' -o -name 'gradle-wrapper.properties' \) \
              -print -quit | grep -q .; then
            echo 'ERROR: setup-gradle basic cache cannot see any Gradle build files in GITHUB_WORKSPACE.'
            exit 1
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: basic

      - name: Build signed Release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p "$SRC_DIR" :app:assembleRelease --stacktrace

      - name: Package APK + SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          APK="$SRC_DIR/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          OUT="$GITHUB_WORKSPACE/dist/OKN_DSP_V${VERSION_NAME%%.*}_${VERSION_NAME}_release.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "${OUT}.sha256"
          cp "$SRC_DIR/Sources/VERSION.txt" "$GITHUB_WORKSPACE/dist/VERSION.txt"
          cat "${OUT}.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: OKN_DSP_${{ env.VERSION_NAME }}_APK
          path: |
            dist/*.apk
            dist/*.sha256
            dist/VERSION.txt
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo '## OKN DSP automatic build'
            echo
            echo "- Source: \`${SOURCE_LABEL:-unknown}\`"
            echo "- Version: \`${VERSION_NAME:-unknown}\` (code \`${VERSION_CODE:-unknown}\`)"
            echo '- Safety checks: V38 gate + V39 reset + version-specific Hi-Fi/EQ coexistence validator'
            echo '- Build: signed Release APK'
            echo '- Firmware flashing/programming: not performed'
          } >> "$GITHUB_STEP_SUMMARY"
