name: OKN DSP Auto Build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/OKN_DSP_AutoBuild.yml'
  pull_request:
    paths:
      - '.github/workflows/OKN_DSP_AutoBuild.yml'

permissions:
  contents: read

concurrency:
  group: okn-dsp-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.9'
  ANDROID_PLATFORM: 'android-35'
  ANDROID_BUILD_TOOLS: '35.0.0'

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

