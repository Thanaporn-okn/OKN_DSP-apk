name: OKN_DSP Auto Build

on:
  push:
    paths:
      - 'OKN_DSP_V*_Sources.zip'
      - '.github/workflows/OKN_DSP_AutoBuild.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select newest OKN_DSP source archive
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ZIP="$(find . -maxdepth 1 -type f -name 'OKN_DSP_V*_Sources.zip' -printf '%f\n' | sort -V | tail -n 1)"
          if [ -z "$SOURCE_ZIP" ]; then
            echo "No OKN_DSP_V*_Sources.zip file was found in the repository root."
            exit 1
          fi
          VERSION="$(basename "$SOURCE_ZIP" | sed -E 's/^OKN_DSP_(V[0-9]+)_Sources\.zip$/\1/')"
          APP_DIR="$RUNNER_TEMP/okn_dsp_${VERSION}"
          mkdir -p "$APP_DIR"
          unzip -q -o "$SOURCE_ZIP" -d "$APP_DIR"
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android/iOS platform files and install packages
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          flutter --version
          chmod +x tool/bootstrap_platforms.sh
          ./tool/bootstrap_platforms.sh

      - name: Analyze Dart code
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          flutter test

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          flutter build apk --release
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk "release/OKN_DSP_${APP_VERSION}.apk"
          sha256sum "release/OKN_DSP_${APP_VERSION}.apk" > "release/OKN_DSP_${APP_VERSION}.apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN_DSP_${{ env.APP_VERSION }}_APK
          path: |
            ${{ env.APP_DIR }}/release/OKN_DSP_${{ env.APP_VERSION }}.apk
            ${{ env.APP_DIR }}/release/OKN_DSP_${{ env.APP_VERSION }}.apk.sha256
          if-no-files-found: error
          retention-days: 30
