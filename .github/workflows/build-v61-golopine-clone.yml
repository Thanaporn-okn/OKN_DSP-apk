      - name: Static V61 UI and fail-closed checks
        shell: bash
        run: |
          set -euo pipefail
          cd "$SRC_DIR"
          test "$(find app/src/main/assets/i18n -name '*.json' | wc -l)" -eq 17
          grep -q 'versionCode 1061' app/build.gradle
          grep -q "versionName '61.0.0-clone'" app/build.gradle
          grep -q 'UiDeviceTransport' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -q 'UiResetChannelBands' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -q 'UiOutputMutedState' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -q 'spaceW(4)' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -Fq '"UiDeviceTransport": "การเชื่อมต่ออุปกรณ์"' app/src/main/assets/i18n/th_TH.json
          grep -Fq '"UiResetChannelBands": "รีเซ็ตทั้ง 15 แบนด์"' app/src/main/assets/i18n/th_TH.json
          grep -q 'LIVE_BOARD_USB' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -q 'HOST_TO_DEVICE_USB' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -q 'FLASH_ERASE_WRITE' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -q 'FLASH_ALLOWED' app/src/main/java/com/okn/golopineclone/MainActivity.java
          ! grep -R -n '<uses-permission' app/src/main/AndroidManifest.xml
          ! grep -R -n 'android.bluetooth\|android.hardware.usb\|UsbManager\|BluetoothGatt\|HttpURLConnection\|java.net' app/src/main/java
          ! grep -R -n 'INTERNET\|BLUETOOTH_CONNECT\|BLUETOOTH_SCAN\|WRITE_EXTERNAL_STORAGE' app/src/main/AndroidManifest.xml
          grep -q 'UiNoDeviceTelemetry' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -q 'refreshOutputMuteSummary' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -q 'UiMutedChannels' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -q 'UiUnmute' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -Fq '"UiNoDeviceTelemetry": "โหมดออฟไลน์ไม่มีการอ่านค่าฮาร์ดแวร์แบบสด"' app/src/main/assets/i18n/th_TH.json
          grep -Fq '"UiUnmute": "เปิดเสียง"' app/src/main/assets/i18n/th_TH.json
          grep -Fq 'addMetric(grid, i18n.get("UiPowerStageVoltage"), "—")' app/src/main/java/com/okn/golopineclone/MainActivity.java
          echo 'V61 clone UI/fail-closed checks PASS'

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$SRC_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Package APK and source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$SRC_DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/out/OKN_GoloPine_Clone_V61-debug.apk"
          cd "$SRC_DIR"
          zip -qr "$GITHUB_WORKSPACE/out/OKN_GoloPine_Clone_V61_Source.zip" . -x 'app/build/*' '.gradle/*'
          cd "$GITHUB_WORKSPACE/out"
          sha256sum OKN_GoloPine_Clone_V61-debug.apk OKN_GoloPine_Clone_V61_Source.zip > SHA256.txt
          cat > BUILD_SCOPE.txt <<'EOF'
          V61 refinement from the real-device V60 test clip:
          - HOME uses dash placeholders for hardware-only telemetry while offline.
          - Explicit note that no live hardware telemetry is being read.
          - PEQ 15-band cards show gain units in dB.
          - OUTPUT shows muted channel count and clearer mute/unmute actions.
          - CH1-CH7 output trim remains -70..+6 dB in exact 0.5 dB steps.
          - Fail-closed: no Bluetooth/USB/network permission or host-to-device transport.
          EOF
          sed -i 's/^[[:space:]]*//' BUILD_SCOPE.txt

      - name: Upload V61 artifact
        uses: actions/upload-artifact@v7
        with:
          name: OKN_GOLOPINE_CLONE_V61
          path: out/*
          if-no-files-found: error
