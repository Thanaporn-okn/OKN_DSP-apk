name: OKN Final Workflow Cleanup - KEEP ONLY 3

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/OKN_FINAL_CLEANUP_KEEP_ONLY_3.yml'

permissions:
  contents: write

jobs:
  cleanup:
    name: Delete old workflows and keep only 3
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Verify 3 workflows that must remain
        shell: bash
        run: |
          set -euo pipefail

          KEEPERS=(
            ".github/workflows/OKN_BP1048P4_MASTER_V15_COMMAND_CALLSITE_REPORT_OBJECT_PROOF.yml"
            ".github/workflows/OKN_BP1048P4_V14_BOUNDED_JIT_VENDOR_GET_DEVICE_DESCRIPTION_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_DSP_AutoBuild.yml"
          )

          for f in "${KEEPERS[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "ERROR: required keeper is missing: $f"
              exit 1
            fi
            echo "KEEP: $f"
          done

      - name: Delete 27 superseded workflows
        shell: bash
        run: |
          set -euo pipefail

          DELETE_FILES=(
            ".github/workflows/OKN_BP1048P4_MASTER_FIXED_V3_OFFLINE_VENDOR_PROTOCOL_RECOVERY_EVIDENCE.yml"
            ".github/workflows/OKN_BP1048P4_MASTER_FIXED_V4_DOTNET_PROTOCOL_DECOMPILE.yml"
            ".github/workflows/OKN_BP1048P4_MASTER_V11_FIXED_V2_USBHID_ROUTE_READ_PATH_RECOVERY.yml"
            ".github/workflows/OKN_BP1048P4_MASTER_V11_FIXED_V3_USBHID_ROUTE_READ_PATH_RECOVERY.yml"
            ".github/workflows/OKN_BP1048P4_MASTER_V11_FIXED_V4_USBHID_ROUTE_READ_PATH_RECOVERY.yml"
            ".github/workflows/OKN_BP1048P4_MASTER_V11_USBHID_ROUTE_READ_PATH_RECOVERY.yml"
            ".github/workflows/OKN_BP1048P4_MASTER_V13_CONNECT_SEQUENCE_HID_BUFFER_SEMANTICS.yml"
            ".github/workflows/OKN_BP1048P4_MASTER_V5_FIXED_RAW_IL_HID_PROTOCOL_RECOVERY.yml"
            ".github/workflows/OKN_BP1048P4_MASTER_V5_RAW_IL_DOTNET_HID_PROTOCOL_RECOVERY.yml"
            ".github/workflows/OKN_BP1048P4_MASTER_V6_FIXED_WINDOWS_RUNTIME_TARGET_RVA_RECOVERY.yml"
            ".github/workflows/OKN_BP1048P4_MASTER_V6_WINDOWS_RUNTIME_PROTOCOL_RECOVERY.yml"
            ".github/workflows/OKN_BP1048P4_MASTER_V7_ORIGINAL_ASSEMBLY_PURE_COMMAND_EXTRACTION.yml"
            ".github/workflows/OKN_BP1048P4_MASTER_V8_FIXED_PURE_EXTERNAL_JIT_CAPTURE.yml"
            ".github/workflows/OKN_BP1048P4_MASTER_V8_PURE_PROTOCOL_JIT_DISASSEMBLY.yml"
            ".github/workflows/OKN_BP1048P4_MASTER_V9_UFE_PERIPHERAL_FRAME_RECOVERY.yml"
            ".github/workflows/OKN_BP1048P4_R60_EVIDENCE_GATE_S25_USB_C_ONLY_FIXED_V3.yml"
            ".github/workflows/OKN_BP1048P4_R61_FIXED_V4_PASSIVE_USB_EVIDENCE_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_BP1048P4_R62_PASSIVE_HID_DESCRIPTOR_COMPLETION_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_BP1048P4_R63_PASSIVE_IF3_FORCE_CLAIM_DESCRIPTOR_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_BP1048P4_R64_PASSIVE_VENDOR_HID_GET_REPORT_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_BP1048P4_R65_FIXED_V2_PROTOCOL_SAFETY_MAP_INPUT_ONLY_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_BP1048P4_R66_ONE_SHOT_VERSION_QUERY_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_BP1048P4_R67_READONLY_VERSION_RESPONSE_RECOVERY_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_BP1048P4_R68_SAME_SESSION_VERSION_RESPONSE_CAPTURE_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_BP1048P4_V10_FIXED_V2_VENDOR_GET_DEVICE_DESCRIPTION_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_BP1048P4_V10_VENDOR_GET_DEVICE_DESCRIPTION_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_BP1048P4_V12_EXACT_VENDOR_GET_DEVICE_DESCRIPTION_S25_USB_C_ONLY.yml"
          )

          for f in "${DELETE_FILES[@]}"; do
            if [[ -e "$f" ]]; then
              echo "DELETE: $f"
              rm -f -- "$f"
            else
              echo "SKIP: already missing: $f"
            fi
          done

      - name: Remove this one-shot cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          SELF=".github/workflows/OKN_FINAL_CLEANUP_KEEP_ONLY_3.yml"
          if [[ -e "$SELF" ]]; then
            echo "DELETE SELF: $SELF"
            rm -f -- "$SELF"
          fi

      - name: Final safety verification
        shell: bash
        run: |
          set -euo pipefail

          test -f ".github/workflows/OKN_BP1048P4_MASTER_V15_COMMAND_CALLSITE_REPORT_OBJECT_PROOF.yml"
          test -f ".github/workflows/OKN_BP1048P4_V14_BOUNDED_JIT_VENDOR_GET_DEVICE_DESCRIPTION_S25_USB_C_ONLY.yml"
          test -f ".github/workflows/OKN_DSP_AutoBuild.yml"

          mapfile -t REMAINING < <(
            find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -printf '%f\n' | sort
          )

          echo "Remaining workflow files:"
          printf '  %s\n' "${REMAINING[@]}"

          if (( ${#REMAINING[@]} != 3 )); then
            echo "ERROR: expected exactly 3 workflow files after cleanup, found ${#REMAINING[@]}"
            exit 1
          fi

          printf '%s\n' "${REMAINING[@]}" | grep -Fxq "OKN_BP1048P4_MASTER_V15_COMMAND_CALLSITE_REPORT_OBJECT_PROOF.yml"
          printf '%s\n' "${REMAINING[@]}" | grep -Fxq "OKN_BP1048P4_V14_BOUNDED_JIT_VENDOR_GET_DEVICE_DESCRIPTION_S25_USB_C_ONLY.yml"
          printf '%s\n' "${REMAINING[@]}" | grep -Fxq "OKN_DSP_AutoBuild.yml"

          echo
          echo "Git changes:"
          git status --short

      - name: Commit and push cleanup
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A .github/workflows
          git commit -m "cleanup: keep only active DSP workflows"
          git push origin "HEAD:${GITHUB_REF_NAME}"
