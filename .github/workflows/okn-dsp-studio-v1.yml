name: OKN DSP Studio 1.0.11 Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/okn-dsp-studio-v1.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract embedded source
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/okn-source.tar.xz.b64 <<'OKN_SOURCE_B64'
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          C+YUDGfwJEARL7UKuMpBsP2i7TuplU5mrmUcRyfR8J5pRw761+pAKThrCEYgRp/D0AuR3AZUrvZg13cKOrv9Mol6fl9gtdEQkrqk6RoPoRmx2Nvbvgig2nELv3mhALR9UYblix/gAAGUnQyA8DO6R7tsscRn+wIAAAAABFla
          OKN_SOURCE_B64
          base64 --decode /tmp/okn-source.tar.xz.b64 > /tmp/okn-source.tar.xz
          tar -tJf /tmp/okn-source.tar.xz > /dev/null
          tar -xJf /tmp/okn-source.tar.xz -C "$GITHUB_WORKSPACE" --no-same-owner
          test -s app/src/main/java/com/okn/peramp/BleManager.java
          test -s app/src/main/java/com/okn/peramp/LabPage.java
          test -s Sources/validate_studio.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate protocol and crossover safety
        run: python3 Sources/validate_studio.py

      - name: Validate PEQ safety gate
        run: python3 Sources/validate_v38_gate.py

      - name: Build debug and release APKs
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Verify APK outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release.apk
          echo 'APK files exist. Release uses debug signing unless signing secrets are configured.'

      - name: Upload APKs and source validation
        uses: actions/upload-artifact@v4
        with:
          name: OKN_DSP_Studio_1_0_11
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            Sources/validate_studio.py
            Sources/validate_v38_gate.py
            Sources/DSP_STUDIO_NOTES.txt
