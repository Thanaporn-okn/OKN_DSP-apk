      # Fail fast: ตรวจความปลอดภัยก่อน (ใช้แค่ Python, ไม่ต้องรอตั้ง Java/SDK/Gradle)
      - name: Validate protocol and crossover safety
        run: python3 Sources/validate_studio.py

      - name: Validate PEQ safety gate
        run: python3 Sources/validate_v38_gate.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9 (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # runner ubuntu-latest มี Android SDK ติดตั้งมาแล้ว: ติดตั้งเฉพาะเมื่อขาดจริง
      - name: Ensure Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -n "$SDK" ] && [ -d "$SDK/platforms/$ANDROID_PLATFORM" ] && [ -d "$SDK/build-tools/$ANDROID_BUILD_TOOLS" ]; then
            echo "Android SDK already present at $SDK"
          else
            echo "Installing missing Android SDK packages"
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager "platforms;$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS" 'platform-tools'
          fi

      - name: Build debug and release APKs
        run: gradle assembleDebug assembleRelease --no-daemon --parallel --build-cache --stacktrace

      - name: Verify APK outputs
        shell: bash
        run: |
          set -euo pipefail
          for f in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
            test -s "$f"
          done
          {
            echo '### APK outputs'
            echo '| File | Size | SHA-256 |'
            echo '|---|---|---|'
            for f in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"
            done
            echo
            echo 'Release uses debug signing unless signing secrets are configured.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs and source validation
        uses: actions/upload-artifact@v4
        with:
          name: OKN_DSP_Studio_1_0_14
          if-no-files-found: error
          retention-days: 14
          compression-level: 0   # APK บีบอัดอยู่แล้ว ไม่ต้องบีบซ้ำ
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            Sources/validate_studio.py
            Sources/validate_v38_gate.py
            Sources/DSP_STUDIO_NOTES.txt
