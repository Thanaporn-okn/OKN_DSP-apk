name: OKN DSP Studio 1.0.14 Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/okn-dsp-studio-v1.yml'

permissions:
  contents: read

# ยกเลิกรันเก่าที่ค้างอยู่เมื่อมีรันใหม่ (ประหยัดเวลา/โควตา)
concurrency:
  group: okn-dsp-studio-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
  ANDROID_PLATFORM: android-35
  ANDROID_BUILD_TOOLS: 35.0.0

