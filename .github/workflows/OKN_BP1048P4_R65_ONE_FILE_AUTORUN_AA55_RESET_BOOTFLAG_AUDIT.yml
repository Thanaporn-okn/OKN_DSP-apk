name: OKN BP1048P4 R65 ONE-FILE AUTO AA55 Reset BootFlag Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/OKN_BP1048P4_R65_ONE_FILE_AUTORUN_AA55_RESET_BOOTFLAG_AUDIT.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  TARGET_SOC: "MVSilicon BP1048P4"
  REQUIRED_PHONE: "Samsung Galaxy S25+"
  REQUIRED_PATH: "Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only"

  SDK_REPO: "https://github.com/leadercxn/bp1048_sdk_v0.1.12.git"
  SDK_COMMIT: "8105bd864b04995d81c9f9ae77cb158259f39015"

  TOOLCHAIN_REPO: "https://github.com/xingrz/nds-builder.git"
  TOOLCHAIN_COMMIT: "572969caccb1d0c576b2893c905fa7b3396815e4"
  TOOLCHAIN_SHA256: "a231682172de4af23ac94726c021a824f1ae7d1f7c72a4619093b90caa7de0e4"

  R64_ARTIFACT_ID: "11304828809"

  LIVE_USB_ALLOWED: "NO"
  FEATURE_REPORT_ALLOWED: "NO"
  RUNTIME_0X11_ALLOWED: "NO"
  FLASH_READ_ALLOWED: "NO"
  FLASH_WRITE_ALLOWED: "NO"
  FLASH_ERASE_ALLOWED: "NO"
  FLASH_ALLOWED: "NO"

jobs:
  r65-aa55-reset-bootflag:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Hard fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          test "$TARGET_SOC" = "MVSilicon BP1048P4"
          test "$REQUIRED_PHONE" = "Samsung Galaxy S25+"
          test "$REQUIRED_PATH" = "Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only"
          for v in LIVE_USB_ALLOWED FEATURE_REPORT_ALLOWED RUNTIME_0X11_ALLOWED FLASH_READ_ALLOWED FLASH_WRITE_ALLOWED FLASH_ERASE_ALLOWED FLASH_ALLOWED; do
            test "${!v}" = "NO"
          done

          rm -rf /tmp/r65
          mkdir -p /tmp/r65/{sdk,toolchain,r64,evidence,out}

          cat > /tmp/r65/evidence/00_SCOPE.txt <<'EOF'
          REVISION=R65
          TARGET=MVSilicon BP1048P4
          REQUIRED_PATH=Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only

          PURPOSE:
          Prove or reject the hypothesis:
          "Feature AA/55 latch + a runtime software reset can enter FlashBoot"
          without flash writes and without runtime 0x11.

          STATIC/OFFLINE ONLY.
          NO USB COMMAND EXECUTION.
          NO FEATURE REPORT EXECUTION.
          NO RESET EXECUTION.
          NO FLASH READ/WRITE/ERASE.
          FLASH_ALLOWED=NO
          EOF

      - name: Install NDS32 runtime compatibility
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libc6-i386 lib32z1 xz-utils binutils file unzip git >/dev/null
          dpkg -s libc6-i386 lib32z1 > /tmp/r65/evidence/00B_RUNTIME_PACKAGES.txt

      - name: Download exact successful R64 evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${R64_ARTIFACT_ID}/zip" \
            -o /tmp/r65/R64.zip
          unzip -q /tmp/r65/R64.zip -d /tmp/r65/r64
          test -s /tmp/r65/r64/12_R64_TRANSPORT_DECISION.json
          grep -q '"direct_runtime_usb_to_rom_bankb_call_path_proven": false' \
            /tmp/r65/r64/12_R64_TRANSPORT_DECISION.json

      - name: Clone exact public SDK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/r65/sdk
          git clone --filter=blob:none --no-checkout "$SDK_REPO" /tmp/r65/sdk
          git -C /tmp/r65/sdk fetch --depth 1 origin "$SDK_COMMIT"
          git -C /tmp/r65/sdk checkout -q --detach "$SDK_COMMIT"
          test "$(git -C /tmp/r65/sdk rev-parse HEAD)" = "$SDK_COMMIT"
          echo "SDK_COMMIT_MATCH=YES" > /tmp/r65/evidence/01_SDK_IDENTITY.txt

      - name: Fetch exact NDS32 toolchain
        shell: bash
        run: |
          set -euo pipefail
          git init -q /tmp/r65/toolchain-src
          git -C /tmp/r65/toolchain-src remote add origin "$TOOLCHAIN_REPO"
          git -C /tmp/r65/toolchain-src fetch -q --depth 1 origin "$TOOLCHAIN_COMMIT"
          git -C /tmp/r65/toolchain-src checkout -q --detach FETCH_HEAD
          T=/tmp/r65/toolchain-src/nds32le-elf-mculib-v3s.4.9.4.txz
          echo "${TOOLCHAIN_SHA256}  ${T}" | sha256sum -c -
          tar -xJf "$T" -C /tmp/r65/toolchain
          TC=/tmp/r65/toolchain/nds32le-elf-mculib-v3s/bin
          "$TC/nds32le-elf-nm" --version > /tmp/r65/evidence/01B_NM_VERSION.txt
          "$TC/nds32le-elf-objdump" --version > /tmp/r65/evidence/01C_OBJDUMP_VERSION.txt
          echo "$TC" >> "$GITHUB_PATH"

      - name: Exact source census for latch reset and boot flag
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r65/sdk

          {
            echo "=== pc_upgrade ==="
            git grep -n -I -E 'pc_upgrade' -- . || true

            echo
            echo "=== FlashBoot handoff ==="
            git grep -n -I -E \
              'ADR_FLASH_BOOT_FLAGE|SREG_FLASH_BOOT_FLAGE|start_up_grate|AppResourceUsbDevice|jump_fun' \
              -- . || true

            echo
            echo "=== runtime reset variable ==="
            git grep -n -I -E \
              'gCtrlVars\.sys_reset|sys_reset|Communication_Effect_0x01|Comm_Effect_0x01' \
              -- . || true

            echo
            echo "=== actual MCU reset APIs ==="
            git grep -n -I -E \
              'Reset_McuSystem|Reset_FlagGet|Reset_FlagClear|watchdog|WDG_' \
              -- . || true

            echo
            echo "=== user-register/reset-persistence APIs ==="
            git grep -n -I -E \
              'ROM_UserRegisterGet|ROM_UserRegisterSet|ROM_UserRegisterClear|UserRegister' \
              -- . || true
          } > /tmp/r65/evidence/02_SOURCE_CENSUS.txt

          git grep -n -I -E 'pc_upgrade' -- . \
            > /tmp/r65/evidence/03_PC_UPGRADE_XREFS.txt || true
          git grep -n -I -E \
            'ADR_FLASH_BOOT_FLAGE|SREG_FLASH_BOOT_FLAGE|start_up_grate|AppResourceUsbDevice|jump_fun' \
            -- . > /tmp/r65/evidence/04_BOOTFLAG_XREFS.txt || true
          git grep -n -I -E \
            'gCtrlVars\.sys_reset|sys_reset|Communication_Effect_0x01|Comm_Effect_0x01' \
            -- . > /tmp/r65/evidence/05_SYSRESET_XREFS.txt || true
          git grep -n -I -E \
            'Reset_McuSystem|Reset_FlagGet|Reset_FlagClear' \
            -- . > /tmp/r65/evidence/06_RESET_API_XREFS.txt || true

      - name: Prove exact source relationships
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          S=Path("/tmp/r65/sdk")
          E=Path("/tmp/r65/evidence")

          text_files=[]
          for p in S.rglob("*"):
              if not p.is_file():
                  continue
              if ".git" in p.parts:
                  continue
              if p.suffix.lower() not in {".c",".h",".cpp",".cc",".s",".asm",".inc",".txt"}:
                  continue
              try:
                  t=p.read_text(errors="replace")
              except Exception:
                  continue
              text_files.append((p,t))

          def rows(term):
              out=[]
              for p,t in text_files:
                  for no,line in enumerate(t.splitlines(),1):
                      if term in line:
                          out.append({
                              "path":str(p.relative_to(S)),
                              "line":no,
                              "text":line.strip()
                          })
              return out

          pc_rows=rows("pc_upgrade")
          boot_addr_rows=rows("ADR_FLASH_BOOT_FLAGE")
          boot_sreg_rows=rows("SREG_FLASH_BOOT_FLAGE")
          startup_rows=rows("start_up_grate")
          sys_rows=rows("gCtrlVars.sys_reset")
          reset_rows=rows("Reset_McuSystem")

          # Public SDK truth we need to distinguish:
          # 1) AA feature latch variable pc_upgrade
          # 2) actual FlashBoot selection word at 0x4000100C
          # 3) start_up_grate is the bridge that writes PC/updata then jumps to 0
          pc_set_aa=False
          pc_get_55=False
          pc_get_calls_startup=False
          pc_directly_writes_bootflag=False

          for p,t in text_files:
              if "pc_upgrade" not in t:
                  continue
              if re.search(r'0xAA.*?pc_upgrade\s*=\s*1|pc_upgrade\s*=\s*1.*?0xAA',t,re.I|re.S):
                  pc_set_aa=True
              if re.search(r'pc_upgrade.*?0x55|0x55.*?pc_upgrade',t,re.I|re.S):
                  pc_get_55=True
              if re.search(r'pc_upgrade.*?start_up_grate\s*\(\s*AppResourceUsbDevice\s*\)',t,re.I|re.S):
                  pc_get_calls_startup=True
              if re.search(r'pc_upgrade.*?(ADR_FLASH_BOOT_FLAGE|SREG_FLASH_BOOT_FLAGE)',t,re.I|re.S):
                  pc_directly_writes_bootflag=True

          upgrade = S/"BT_Audio_APP/bt_audio_app_src/device/upgrade.c"
          ut=upgrade.read_text(errors="replace")

          start_clears_flag=bool(re.search(
              r'\*\s*\(uint32_t\s*\*\)\s*ADR_FLASH_BOOT_FLAGE\s*=\s*0\s*;',
              ut
          ))
          start_sets_pc=bool(re.search(
              r'SREG_FLASH_BOOT_FLAGE\.PC\s*=\s*1',ut
          ))
          start_sets_updata=bool(re.search(
              r'SREG_FLASH_BOOT_FLAGE\.updata\s*=\s*1',ut
          ))
          start_jumps_zero=bool(re.search(
              r'jump_fun\s*=\s*\(fun\)\s*0\s*;.*?jump_fun\s*\(\s*\)',
              ut,re.S
          ))
          bootflag_addr_4000100c="0x4000100C" in ut

          # Runtime control 0x01 writes only gCtrlVars.sys_reset in reference source.
          comm = S/"BT_Audio_APP/bt_audio_app_src/audio/communication.c"
          ct=comm.read_text(errors="replace")
          ctrl01_sets_sysreset=bool(re.search(
              r'case\s+1\s*:.*?gCtrlVars\.sys_reset\s*=\s*TmpData',
              ct,re.I|re.S
          ))

          # Search for any consumer/read of sys_reset outside its write/query serialization.
          sys_consumers=[]
          for r in sys_rows:
              txt=r["text"]
              write_or_query=(
                  "gCtrlVars.sys_reset =" in txt
                  or "&gCtrlVars.sys_reset" in txt
                  or "sys_reset;" in txt
              )
              if not write_or_query:
                  sys_consumers.append(r)

          # Stronger function-level test: any source function containing both
          # sys_reset and Reset_McuSystem indicates a direct reset consumer candidate.
          function_candidates=[]
          for p,t in text_files:
              if "sys_reset" in t and "Reset_McuSystem" in t:
                  function_candidates.append(str(p.relative_to(S)))

          # Any source outside upgrade.c writes actual FlashBoot flag address/register?
          outside_bootflag_writers=[]
          for r in boot_addr_rows + boot_sreg_rows:
              if r["path"].endswith("bt_audio_app_src/device/upgrade.c"):
                  continue
              line=r["text"]
              if "=" in line or "memcpy" in line:
                  outside_bootflag_writers.append(r)

          state={
              "sdk_commit":"8105bd864b04995d81c9f9ae77cb158259f39015",
              "feature_aa_sets_pc_upgrade":pc_set_aa,
              "feature_get_armed_returns_55_evidence":pc_get_55,
              "armed_feature_get_calls_start_up_grate_usb":pc_get_calls_startup,
              "pc_upgrade_directly_writes_flashboot_flag":pc_directly_writes_bootflag,
              "flashboot_flag_address_is_0x4000100c":bootflag_addr_4000100c,
              "start_up_grate_clears_flag_first":start_clears_flag,
              "start_up_grate_sets_pc_bit":start_sets_pc,
              "start_up_grate_sets_updata_bit":start_sets_updata,
              "start_up_grate_jumps_to_zero":start_jumps_zero,
              "runtime_control_0x01_subindex1_sets_sys_reset":ctrl01_sets_sysreset,
              "sys_reset_consumer_rows":sys_consumers,
              "source_files_with_both_sys_reset_and_Reset_McuSystem":function_candidates,
              "outside_upgrade_c_bootflag_writer_rows":outside_bootflag_writers,
          }

          # Conservative decision:
          # AA latch alone is not the FlashBoot selection word.
          # A software reset after merely latching pc_upgrade cannot substitute for
          # start_up_grate unless another path writes 0x4000100C first.
          state["aa_latch_is_same_as_flashboot_flag"]=False
          state["runtime_sys_reset_proven_to_write_flashboot_flag"]=bool(outside_bootflag_writers)
          state["runtime_sys_reset_proven_to_call_Reset_McuSystem"]=bool(function_candidates)
          state["aa55_plus_runtime_reset_flashboot_entry_proven"]=(
              pc_set_aa
              and ctrl01_sets_sysreset
              and bool(outside_bootflag_writers)
              and bool(function_candidates)
          )
          state["live_test_allowed"]=False
          state["flash_allowed"]=False

          (E/"07_R65_SOURCE_RELATIONSHIPS.json").write_text(
              json.dumps(state,indent=2,ensure_ascii=False)+"\n"
          )
          print(json.dumps(state,indent=2,ensure_ascii=False))
          PY

      - name: Audit Reset_McuSystem binary implementation and references
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r65/sdk

          : > /tmp/r65/evidence/08_RESET_SYMBOLS.txt
          : > /tmp/r65/evidence/09_RESET_DISASSEMBLY.txt

          N=0
          while IFS= read -r a; do
            N=$((N+1))
            TMP=/tmp/r65/nm.$N.txt
            nds32le-elf-nm -A "$a" > "$TMP" 2>/dev/null || {
              echo "nm failed for $a" >&2
              exit 1
            }
            grep -E '\bReset_McuSystem$' "$TMP" \
              >> /tmp/r65/evidence/08_RESET_SYMBOLS.txt || true
          done < <(find . -type f -name '*.a' | sort)

          cut -d: -f1 /tmp/r65/evidence/08_RESET_SYMBOLS.txt | sort -u | while IFS= read -r a; do
            test -n "$a" || continue
            test -f "$a" || continue
            echo "===== $a =====" >> /tmp/r65/evidence/09_RESET_DISASSEMBLY.txt
            nds32le-elf-objdump -dr "$a" 2>/dev/null | \
              grep -E -B20 -A60 '<Reset_McuSystem>|Reset_McuSystem' \
              >> /tmp/r65/evidence/09_RESET_DISASSEMBLY.txt || true
          done

          cat /tmp/r65/evidence/08_RESET_SYMBOLS.txt
          sed -n '1,600p' /tmp/r65/evidence/09_RESET_DISASSEMBLY.txt

      - name: Cross-check startup flag versus reset hypothesis
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          E=Path("/tmp/r65/evidence")
          d=json.loads((E/"07_R65_SOURCE_RELATIONSHIPS.json").read_text())

          # These must hold for the public reference path.
          assert d["flashboot_flag_address_is_0x4000100c"] is True
          assert d["start_up_grate_sets_pc_bit"] is True
          assert d["start_up_grate_sets_updata_bit"] is True
          assert d["start_up_grate_jumps_to_zero"] is True
          assert d["runtime_control_0x01_subindex1_sets_sys_reset"] is True

          # Critical safety/engineering conclusion:
          # merely changing sys_reset is not proven to write the FlashBoot flag.
          if d["runtime_sys_reset_proven_to_write_flashboot_flag"]:
              raise SystemExit(
                  "Unexpected alternate boot-flag writer found; exact callgraph review required"
              )

          d["r65_hypothesis_result"]="REJECTED_IN_PUBLIC_REFERENCE"
          d["reason"]=(
              "AA/55 pc_upgrade latch and FlashBoot selection word are distinct. "
              "The reference runtime sys_reset control is not proven to write "
              "0x4000100C or to bridge to start_up_grate."
          )
          d["next_offline_target"]=(
              "AUDIT_ROM_USER_REGISTER_AND_OTHER_NON_FLASH_PERSISTENT_BOOT_REQUEST_SURFACES"
          )

          (E/"10_R65_FINAL_DECISION.json").write_text(
              json.dumps(d,indent=2,ensure_ascii=False)+"\n"
          )
          print(json.dumps(d,indent=2,ensure_ascii=False))
          PY

      - name: Build R65 final report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          E=Path("/tmp/r65/evidence")
          d=json.loads((E/"10_R65_FINAL_DECISION.json").read_text())

          lines=[
              "# R65 BP1048P4 AA/55 + reset + boot-flag audit",
              "",
              "Required physical path:",
              "**Samsung Galaxy S25+ -> USB-C -> DSP board USB-C only**",
              "",
              "Key findings:",
              f"- FlashBoot selection flag address is 0x4000100C: **{d['flashboot_flag_address_is_0x4000100c']}**",
              f"- start_up_grate sets PC bit: **{d['start_up_grate_sets_pc_bit']}**",
              f"- start_up_grate sets updata bit: **{d['start_up_grate_sets_updata_bit']}**",
              f"- start_up_grate jumps to address zero: **{d['start_up_grate_jumps_to_zero']}**",
              f"- runtime control 0x01/subindex1 sets sys_reset: **{d['runtime_control_0x01_subindex1_sets_sys_reset']}**",
              f"- runtime sys_reset writes FlashBoot flag: **{d['runtime_sys_reset_proven_to_write_flashboot_flag']}**",
              f"- runtime sys_reset direct Reset_McuSystem bridge proven: **{d['runtime_sys_reset_proven_to_call_Reset_McuSystem']}**",
              "",
              "Decision:",
              "**AA/55 latch + runtime software-reset is NOT a proven FlashBoot entry path in the public reference.**",
              "",
              "Why:",
              "- `pc_upgrade` latch and the real FlashBoot selection word are different state.",
              "- The actual selection word is written by `start_up_grate()`.",
              "- No alternate runtime writer to 0x4000100C was accepted.",
              "- Therefore a reset cannot be treated as a replacement for the guarded start_up_grate handoff.",
              "",
              "Next offline target:",
              "Audit ROM UserRegister / retention / other non-flash persistent boot-request surfaces.",
              "",
              "No live AA/55, reset, 0x11, erase, or write was executed.",
              "FLASH_ALLOWED=NO",
          ]
          (E/"11_R65_FINAL_REPORT.md").write_text("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY

          cat /tmp/r65/evidence/11_R65_FINAL_REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Package R65 evidence
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/r65/evidence/* /tmp/r65/out/
          (cd /tmp/r65/out && sha256sum * > SHA256SUMS.txt)

      - name: Upload R65 evidence
        uses: actions/upload-artifact@v4
        with:
          name: R65_BP1048P4_AA55_RESET_BOOTFLAG_AUDIT
          path: /tmp/r65/out/*
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed assertion
        shell: bash
        run: |
          set -euo pipefail
          for v in LIVE_USB_ALLOWED FEATURE_REPORT_ALLOWED RUNTIME_0X11_ALLOWED FLASH_READ_ALLOWED FLASH_WRITE_ALLOWED FLASH_ERASE_ALLOWED FLASH_ALLOWED; do
            test "${!v}" = "NO"
          done
          grep -q '"r65_hypothesis_result": "REJECTED_IN_PUBLIC_REFERENCE"' \
            /tmp/r65/evidence/10_R65_FINAL_DECISION.json
          grep -q '"flash_allowed": false' \
            /tmp/r65/evidence/10_R65_FINAL_DECISION.json
          echo "R65_AA55_RESET_BOOTFLAG_AUDIT=PASS"
          echo "FLASH_ALLOWED=NO"
