name: OKN BP1048P4 MASTER V41 MEGA BLOCKER CLOSURE + CANDIDATE BUNDLE OFFLINE

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/OKN_BP1048P4_MASTER_V41_MEGA_BLOCKER_CLOSURE_CANDIDATE_BUNDLE_OFFLINE.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  V40_ARTIFACT_ID: "11299768486"
  V32_ARTIFACT_ID: "11298720275"
  V34_ARTIFACT_ID: "11298706866"
  V25_ARTIFACT_ID: "11296388948"
  V28_ARTIFACT_ID: "11296454861"

  RECOVERY_V13_ARTIFACT_ID: "11247972033"
  RECOVERY_V16_ARTIFACT_ID: "11251221570"
  RECOVERY_V17_ARTIFACT_ID: "11251820245"
  UPDATER_V3_ARTIFACT_ID: "11139458303"
  SDK_BOOT_USB_ARTIFACT_ID: "11045528884"
  FIRMWARE_CORE_ARTIFACT_ID: "10830737503"

  LIVE_DSP_ALLOWED: "NO"
  HOST_TO_DSP_IO: "NO"
  FEATURE_REPORT_ALLOWED: "NO"
  FLASH_ALLOWED: "NO"
  ERASE_ALLOWED: "NO"
  WRITE_ALLOWED: "NO"
  NEW_LIVE_0X11_ALLOWED: "NO"

jobs:
  mega-v41:
    name: Close multiple blockers and package firmware candidate OFFLINE
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Gate 0 - hard safety
        shell: bash
        run: |
          set -euo pipefail
          test "$LIVE_DSP_ALLOWED" = "NO"
          test "$HOST_TO_DSP_IO" = "NO"
          test "$FEATURE_REPORT_ALLOWED" = "NO"
          test "$FLASH_ALLOWED" = "NO"
          test "$ERASE_ALLOWED" = "NO"
          test "$WRITE_ALLOWED" = "NO"
          test "$NEW_LIVE_0X11_ALLOWED" = "NO"

          rm -rf /tmp/v41
          mkdir -p /tmp/v41/{downloads,artifacts,evidence,out,candidate}

          cat > /tmp/v41/evidence/00_SCOPE.txt <<'EOF'
          REVISION=MASTER-V41
          MODE=MEGA_BLOCKER_CLOSURE_AND_CANDIDATE_BUNDLE_OFFLINE

          ONE RUN DOES:
          1) Device Description gap/CH7/Gain-ID forensic closure attempt.
          2) No-0x11 vendor-entry census from V25/V28/V34 evidence.
          3) Recovery command census + read-only stock-backup gate.
          4) Recovery/layout evidence reconciliation.
          5) Firmware final-link feasibility audit.
          6) Consolidated production-candidate source/object bundle.
          7) Unified blocker matrix.

          HARD RULES:
          LIVE_DSP=NO
          HOST_TO_DSP_IO=NO
          FEATURE_REPORT=NO
          NEW_LIVE_0X11=NO
          FLASH_ERASE_WRITE=NO
          EOF

      - name: Gate 1 - download exact evidence set
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cat > /tmp/v41/get.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          id="$1"
          name="$2"
          mkdir -p "/tmp/v41/artifacts/$name"

          curl -fL --retry 5 --retry-all-errors \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
            -o "/tmp/v41/downloads/${name}.zip"

          unzip -q "/tmp/v41/downloads/${name}.zip" \
            -d "/tmp/v41/artifacts/$name"
          SH
          chmod +x /tmp/v41/get.sh

          /tmp/v41/get.sh "$V40_ARTIFACT_ID" v40
          /tmp/v41/get.sh "$V32_ARTIFACT_ID" v32
          /tmp/v41/get.sh "$V34_ARTIFACT_ID" v34
          /tmp/v41/get.sh "$V25_ARTIFACT_ID" v25
          /tmp/v41/get.sh "$V28_ARTIFACT_ID" v28
          /tmp/v41/get.sh "$RECOVERY_V13_ARTIFACT_ID" recovery_v13
          /tmp/v41/get.sh "$RECOVERY_V16_ARTIFACT_ID" recovery_v16
          /tmp/v41/get.sh "$RECOVERY_V17_ARTIFACT_ID" recovery_v17
          /tmp/v41/get.sh "$UPDATER_V3_ARTIFACT_ID" updater_v3
          /tmp/v41/get.sh "$SDK_BOOT_USB_ARTIFACT_ID" sdk
          /tmp/v41/get.sh "$FIRMWARE_CORE_ARTIFACT_ID" firmware

          cat > /tmp/v41/unpack.py <<'PY'
          from pathlib import Path
          import zipfile

          root=Path("/tmp/v41/artifacts")
          seen=set()

          for _ in range(5):
              todo=[z for z in root.rglob("*.zip") if z not in seen]
              if not todo:
                  break

              for z in todo:
                  seen.add(z)
                  d=z.with_suffix(z.suffix+".unpacked")
                  d.mkdir(parents=True,exist_ok=True)
                  try:
                      with zipfile.ZipFile(z) as q:
                          q.extractall(d)
                  except Exception:
                      pass

          print("nested_zip_count="+str(len(seen)))
          PY

          python3 /tmp/v41/unpack.py \
            | tee /tmp/v41/evidence/01_NESTED_UNPACK.txt

          find /tmp/v41/artifacts -type f -printf '%P\n' | sort \
            > /tmp/v41/evidence/02_FILE_INVENTORY.txt

      - name: Gate 2 - Device Description gap + CH7 + Gain-ID forensic closure
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/v41/schema_forensics.py <<'PY'
          from pathlib import Path
          import json,re

          root=Path("/tmp/v41")
          ev=root/"evidence"

          def find_one(name):
              xs=list((root/"artifacts").rglob(name))
              if not xs:
                  raise SystemExit("missing "+name)
              return xs[0]

          b=find_one("DEVICE_DESCRIPTION_BYTES.bin").read_bytes()
          t=b.decode("utf-8","replace")

          v32=json.loads(find_one("05_V32_DECISION.json").read_text())
          v40=json.loads(find_one("24_V40_FIXED_V2_FINAL_READINESS.json").read_text())

          entries=[]
          for m in re.finditer(
              r'\{"ID":(\d+),"type":(\d+),"name":"([^"]+)"',
              t):
              entries.append({
                  "id":int(m.group(1)),
                  "type":int(m.group(2)),
                  "name":m.group(3),
                  "offset":m.start()
              })

          exact_ids=sorted(set(x["id"] for x in entries))

          channel_names=[
              "BiquadCascadeLeftChannel",
              "BiquadCascadeRightChannel",
              "BiquadCascadeBassChannel",
              "BiquadCascade4thChannel",
              "BiquadCascade5thChannel",
              "BiquadCascade6thChannel",
              "BiquadCascade7thChannel"
          ]

          channels=[]
          for name in channel_names:
              p=t.find(name)
              row={
                  "name":name,
                  "name_offset":p,
                  "exact_entry":
                      next((x for x in entries if x["name"]==name),None),
                  "context_before":
                      t[max(0,p-180):p] if p>=0 else "",
                  "context_after":
                      t[p:min(len(t),p+220)] if p>=0 else ""
              }
              channels.append(row)

          ch7=channels[-1]
          ch7_type4084_immediate=(
              ch7["name_offset"]>=0 and
              'type":4084,"name":"' in
              t[max(0,ch7["name_offset"]-80):ch7["name_offset"]+8]
          )

          ch7_exact=ch7["exact_entry"] is not None

          sequential_before=[
              x["id"]
              for x in entries
              if x["name"] in [
                  "BiquadCascade4thChannel",
                  "BiquadCascade5thChannel",
                  "BiquadCascade6thChannel"
              ]
          ]

          ch7_id17_structurally_forced=(
              sequential_before==[14,15,16] and
              ch7_type4084_immediate and
              not ch7_exact
          )

          gain_presence={}
          for n in range(22,29):
              gain_presence[str(n)]={
                  "exact_entry":n in exact_ids,
                  "literal_token":
                      bool(re.search(
                          rf'(?:"ID":{n}\b|"ID"\s*:\s*{n}\b)',t))
              }

          terminal_closure=t.rstrip().endswith("]}]}")
          expected=int(v32["final_dev_description_length"])
          recovered=int(v32["final_accumulated_bytes"])
          missing=expected-recovered

          # The end of the JSON document is present, therefore the 1420 missing
          # decoded bytes are internal losses rather than a missing tail.  This
          # is useful but does not prove that an entire parameter object was not
          # lost inside an internal gap.
          global_gain_free=(
              missing==0 and
              not any(
                  v["exact_entry"] or v["literal_token"]
                  for v in gain_presence.values()
              )
          )

          result={
              "expected_bytes":expected,
              "recovered_bytes":recovered,
              "missing_bytes":missing,
              "terminal_json_closure_present":terminal_closure,
              "missing_data_is_tail_only":False,
              "exact_ids":exact_ids,
              "channels":channels,
              "ch7_exact_id17_proven":ch7_exact and ch7["exact_entry"]["id"]==17,
              "ch7_id17_structurally_forced":ch7_id17_structurally_forced,
              "ch7_status":
                  "EXACT_PROVEN"
                  if ch7_exact and ch7["exact_entry"]["id"]==17
                  else (
                      "STRUCTURALLY_FORCED_BUT_NOT_WIRE_EXACT"
                      if ch7_id17_structurally_forced
                      else "UNRESOLVED"
                  ),
              "gain_ids_22_28_presence":gain_presence,
              "gain_ids_22_28_global_free_proven":global_gain_free,
              "gain_free_blocker_reason":
                  "1420 internal decoded bytes are still missing and could conceal top-level control metadata."
                  if not global_gain_free
                  else "none",
              "v40_flash_allowed":bool(v40["gates"]["FLASH_ALLOWED"])
          }

          (ev/"03_SCHEMA_GAP_FORENSICS.json").write_text(
              json.dumps(result,indent=2,ensure_ascii=False)+"\n"
          )

          with (ev/"04_CHANNEL_CONTEXTS.txt").open("w") as f:
              for x in channels:
                  f.write(
                      "=== "+x["name"]+" ===\n"+
                      "EXACT_ENTRY="+json.dumps(x["exact_entry"],ensure_ascii=False)+"\n"+
                      "BEFORE="+x["context_before"]+"\n"+
                      "AFTER="+x["context_after"]+"\n\n"
                  )

          print(json.dumps({
              "missing_bytes":missing,
              "terminal_json_closure_present":terminal_closure,
              "ch7_status":result["ch7_status"],
              "gain_ids_22_28_global_free_proven":global_gain_free
          },indent=2))
          PY

          python3 /tmp/v41/schema_forensics.py \
            | tee /tmp/v41/evidence/05_SCHEMA_SUMMARY.txt

      - name: Gate 3 - exhaustive known no-0x11 vendor-entry census
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/v41/no0x11.py <<'PY'
          from pathlib import Path
          import json,re

          root=Path("/tmp/v41/artifacts")
          ev=Path("/tmp/v41/evidence")

          v34s=list(root.rglob("06_V34_DECISION.json"))
          if not v34s:
              raise SystemExit("V34 decision missing")

          v34=json.loads(v34s[0].read_text())

          candidates=v34["vendor_zeroarg_candidates"]
          writers=[]

          for c in candidates:
              for w in c.get("writes",[]):
                  writers.append({
                      "method":c["name"],
                      "token":c["token"],
                      "raw_len":w.get("raw_len"),
                      "outer_first_hex":w.get("outer_first_hex"),
                      "no_0x11_safe":bool(w.get("no_0x11_safe"))
                  })

          no0=v34.get("no_0x11_auth_or_description_candidates",[])

          text_parts=[]
          for group in ["v25","v28","v34","updater_v3"]:
              for p in (root/group).rglob("*"):
                  if p.is_file() and p.suffix.lower() in {
                      ".txt",".md",".json",".log",".il",".cs"
                  }:
                      try:
                          text_parts.append(
                              f"===== {group}/{p.name} =====\n"+
                              p.read_text(errors="ignore")
                          )
                      except Exception:
                          pass

          corpus="\n".join(text_parts)

          token_hits=sorted(set(re.findall(
              r'0x0600[0-9A-Fa-f]{4}',corpus
          )))

          write_lines=[
              line.strip()
              for line in corpus.splitlines()
              if re.search(
                  r'(?i)(DeviceCommunicationStream\.Write|HIDInterface\.Send|SendDeviceDescriptionRequest|SendDevTypeSwVersAuthenRequest)',
                  line
              )
          ]

          result={
              "v34_zeroarg_candidate_count":len(candidates),
              "v34_candidates":candidates,
              "known_writer_entries":writers,
              "known_no_0x11_auth_or_description_candidates":no0,
              "known_no_0x11_candidate_count":len(no0),
              "safe_live_auth_without_0x11_proven":len(no0)>0,
              "method_tokens_seen":token_hits,
              "write_related_context_count":len(write_lines),
              "hard_rule_new_live_0x11_allowed":False,
              "conclusion":
                  "NO_KNOWN_SAFE_NO_0X11_AUTH_OR_DESCRIPTION_ENTRY"
                  if not no0
                  else "SAFE_NO_0X11_ENTRY_REQUIRES_MANUAL_REVIEW"
          }

          (ev/"06_NO_0X11_ENTRY_CENSUS.json").write_text(
              json.dumps(result,indent=2,ensure_ascii=False)+"\n"
          )

          (ev/"07_WRITE_RELATED_CONTEXTS.txt").write_text(
              "\n".join(write_lines[:1200])+"\n"
          )

          print(json.dumps({
              "known_no_0x11_candidate_count":len(no0),
              "known_writer_entries":writers,
              "conclusion":result["conclusion"]
          },indent=2))
          PY

          python3 /tmp/v41/no0x11.py \
            | tee /tmp/v41/evidence/08_NO0X11_SUMMARY.txt

      - name: Gate 4 - recovery command census and pure read-only backup gate
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/v41/recovery_census.py <<'PY'
          from pathlib import Path
          import json,re

          root=Path("/tmp/v41/artifacts")
          ev=Path("/tmp/v41/evidence")

          strings_files=list(root.rglob("FLASHBOOT_STRINGS.txt"))
          if not strings_files:
              raise SystemExit("FLASHBOOT_STRINGS.txt missing")

          s=strings_files[0].read_text(errors="ignore")

          known=[
              "chiperas","upinfo","btupdat","cnfgdat",
              "constdat","codedata","bootdat","cxxx"
          ]

          offsets={}
          for cmd in known:
              m=re.search(r'(?m)^\s*(\d+)\s+'+re.escape(cmd)+r'\s*$',s)
              offsets[cmd]=int(m.group(1)) if m else None

          printable_cmd_candidates=[]
          for line in s.splitlines():
              m=re.match(r'\s*(\d+)\s+([A-Za-z][A-Za-z0-9_]{2,15})\s*$',line)
              if not m:
                  continue
              word=m.group(2).lower()
              if word in known or any(
                  k in word for k in [
                      "read","dump","backup","getflash","readflash","flashread"
                  ]
              ):
                  printable_cmd_candidates.append({
                      "offset":int(m.group(1)),
                      "word":word
                  })

          readlike=[
              x for x in printable_cmd_candidates
              if any(k in x["word"] for k in [
                  "read","dump","backup","getflash","readflash","flashread"
              ])
          ]

          v17_files=list(root.rglob("V17_RESULT.json"))
          v17=json.loads(v17_files[0].read_text()) if v17_files else {}

          alltext=[]
          for group in ["recovery_v13","recovery_v16","recovery_v17","updater_v3","sdk"]:
              for p in (root/group).rglob("*"):
                  if p.is_file() and p.suffix.lower() in {
                      ".txt",".md",".json",".c",".h",".ld"
                  }:
                      try:
                          alltext.append(p.read_text(errors="ignore"))
                      except Exception:
                          pass

          corpus="\n".join(alltext).lower()

          result={
              "reference_flashboot_commands":offsets,
              "printable_command_candidates":printable_cmd_candidates,
              "readlike_host_command_candidates":readlike,
              "pure_read_only_stock_backup_command_proven":len(readlike)>0,
              "internal_spi_read_code_present":
                  "spi_read" in corpus or "flashread" in corpus or "readback" in corpus,
              "internal_readback_is_host_backup_protocol":False,
              "reference_recovery_vid_pid":
                  v17.get("recovery_vid_pid","UNKNOWN"),
              "reference_runtime_to_recovery_entry_static_proven":
                  bool(v17.get("runtime_to_recovery_entry_static_proven",False)),
              "production_recovery_identity_proven":False,
              "production_live_recovery_entry_without_forbidden_0x11_proven":False,
              "production_stock_backup_completed":False,
              "production_rollback_completed":False,
              "flash_allowed":False
          }

          (ev/"09_RECOVERY_COMMAND_CENSUS.json").write_text(
              json.dumps(result,indent=2)+"\n"
          )

          print(json.dumps(result,indent=2))
          PY

          python3 /tmp/v41/recovery_census.py \
            | tee /tmp/v41/evidence/10_RECOVERY_SUMMARY.txt

      - name: Gate 5 - production layout and linker feasibility audit
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/v41/linker_audit.py <<'PY'
          from pathlib import Path
          import json,re

          root=Path("/tmp/v41/artifacts")
          ev=Path("/tmp/v41/evidence")

          # Find firmware RESULT.json that contains the actual DSP build verdict.
          firmware_results=[]
          for p in (root/"firmware").rglob("RESULT.json"):
              try:
                  j=json.loads(p.read_text())
              except Exception:
                  continue
              if "D1088_OBJECT_COMPILE" in j or "INTEGRATED_POST_PEQ_GAIN" in j:
                  firmware_results.append((p,j))

          if not firmware_results:
              raise SystemExit("firmware core RESULT.json missing")

          fw_path,fw=firmware_results[0]

          linker_files=list((root/"sdk").rglob("*.ld"))
          linker_rows=[]

          for p in linker_files:
              t=p.read_text(errors="ignore")
              entry=re.search(r'ENTRY\(([^)]+)\)',t)
              starts=[
                  int(x,16)
                  for x in re.findall(
                      r'__executable_start\s*=\s*(0x[0-9A-Fa-f]+)',t
                  )
              ]
              dotstarts=[
                  int(x,16)
                  for x in re.findall(
                      r'(?m)^\s*\.\s*=\s*(0x[0-9A-Fa-f]+)\s*;',t
                  )
              ]

              linker_rows.append({
                  "path":str(p.relative_to(root/"sdk")),
                  "entry":entry.group(1) if entry else None,
                  "executable_starts":starts,
                  "dot_assignment_addresses":dotstarts[:20]
              })

          start_values=sorted(set(
              x
              for row in linker_rows
              for x in row["executable_starts"]
          ))

          unresolved=[]
          for p in (root/"firmware").rglob("*unresolved*.txt"):
              try:
                  unresolved += [
                      line.strip()
                      for line in p.read_text(errors="ignore").splitlines()
                      if line.strip()
                  ]
              except Exception:
                  pass

          fpbase=any("_FP_BASE_" in x for x in unresolved)

          corpus=[]
          for group in ["sdk","recovery_v13","recovery_v16","recovery_v17"]:
              for p in (root/group).rglob("*"):
                  if p.is_file() and p.suffix.lower() in {
                      ".txt",".md",".json",".ld",".c",".h"
                  }:
                      try:
                          corpus.append(p.read_text(errors="ignore"))
                      except Exception:
                          pass
          text="\n".join(corpus).lower()

          result={
              "firmware_result_source":str(fw_path),
              "d1088_object_compile":bool(fw.get("D1088_OBJECT_COMPILE")),
              "relocatable_link_succeeded":bool(fw.get("RELOCATABLE_LINK_SUCCEEDED")),
              "integrated_post_peq_gain":bool(fw.get("INTEGRATED_POST_PEQ_GAIN")),
              "bootable_image":bool(fw.get("BOOTABLE_IMAGE")),
              "target_executed":bool(fw.get("TARGET_EXECUTED")),
              "board_audio_tested":bool(fw.get("BOARD_AUDIO_TESTED")),
              "weak_fp_base_pending":fpbase,
              "unresolved_lines":unresolved,
              "sdk_linker_script_count":len(linker_rows),
              "sdk_executable_start_values":start_values,
              "sdk_linker_rows":linker_rows,
              "historical_0x100000_present":"0x100000" in text,
              "historical_0x120000_present":"0x120000" in text,
              "production_memory_layout_proven":False,
              "production_entry_point_proven":False,
              "production_image_ready":False,
              "flash_allowed":False
          }

          (ev/"11_LINKER_LAYOUT_AUDIT.json").write_text(
              json.dumps(result,indent=2)+"\n"
          )

          print(json.dumps({
              "relocatable_link_succeeded":result["relocatable_link_succeeded"],
              "bootable_image":result["bootable_image"],
              "weak_fp_base_pending":fpbase,
              "sdk_linker_script_count":len(linker_rows),
              "sdk_executable_start_values":start_values,
              "production_memory_layout_proven":False
          },indent=2))
          PY

          python3 /tmp/v41/linker_audit.py \
            | tee /tmp/v41/evidence/12_LINKER_SUMMARY.txt

      - name: Gate 6 - build consolidated firmware candidate bundle
        shell: bash
        run: |
          set -euo pipefail

          FWROOT="$(find /tmp/v41/artifacts/firmware \
            -type d -name firmware \
            | head -n1)"

          GAINROOT="$(find /tmp/v41/artifacts/firmware \
            -type d -name gain \
            | head -n1)"

          OBJROOT="$(find /tmp/v41/artifacts/firmware \
            -type d -name objects \
            | head -n1)"

          test -n "$FWROOT"
          test -n "$GAINROOT"
          test -n "$OBJROOT"

          mkdir -p /tmp/v41/candidate/{firmware,gain,objects,evidence}

          cp -a "$FWROOT"/. /tmp/v41/candidate/firmware/
          cp -a "$GAINROOT"/. /tmp/v41/candidate/gain/
          cp -a "$OBJROOT"/. /tmp/v41/candidate/objects/

          cp \
            /tmp/v41/evidence/03_SCHEMA_GAP_FORENSICS.json \
            /tmp/v41/evidence/06_NO_0X11_ENTRY_CENSUS.json \
            /tmp/v41/evidence/09_RECOVERY_COMMAND_CENSUS.json \
            /tmp/v41/evidence/11_LINKER_LAYOUT_AUDIT.json \
            /tmp/v41/candidate/evidence/

          cat > /tmp/v41/candidate/README_NOT_FLASHABLE.txt <<'EOF'
          OKN BP1048P4 V41 PRODUCTION CANDIDATE BUNDLE

          DSP CORE:
          - 7 channels
          - 15-band PEQ per channel
          - dedicated post-PEQ Gain
          - Gain IDs CH1..CH7 = 22..28
          - NDS32 relocatable integration exists

          THIS IS NOT A FLASH IMAGE.

          STILL REQUIRED:
          - exact CH7 ID17 wire proof
          - global collision-free proof for IDs 22..28
          - safe auth/update entry that never transmits byte 0x11
          - production recovery identity
          - pure read-only complete stock backup method
          - completed stock backup + hashes
          - exact production memory/flash layout
          - rollback proof
          - final _FP_BASE_ / linker-layout resolution
          - bootable image validation
          - post-write readback plan

          FLASH_ALLOWED=NO
          EOF

          (
            cd /tmp/v41/candidate
            find . -type f -print0 | sort -z | xargs -0 sha256sum \
              > SHA256SUMS.txt
          )

          tar -C /tmp/v41 \
            -czf /tmp/v41/out/OKN_BP1048P4_V41_PRODUCTION_CANDIDATE_NOT_FLASHABLE.tar.gz \
            candidate

          sha256sum \
            /tmp/v41/out/OKN_BP1048P4_V41_PRODUCTION_CANDIDATE_NOT_FLASHABLE.tar.gz \
            > /tmp/v41/evidence/13_CANDIDATE_BUNDLE_SHA256.txt

      - name: Gate 7 - unified blocker matrix and next allowed path
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/v41/finalize.py <<'PY'
          from pathlib import Path
          import json

          ev=Path("/tmp/v41/evidence")

          schema=json.loads((ev/"03_SCHEMA_GAP_FORENSICS.json").read_text())
          no0=json.loads((ev/"06_NO_0X11_ENTRY_CENSUS.json").read_text())
          rec=json.loads((ev/"09_RECOVERY_COMMAND_CENSUS.json").read_text())
          link=json.loads((ev/"11_LINKER_LAYOUT_AUDIT.json").read_text())

          gates={
              "TRUE_7CH_DSP":True,
              "PEQ_15_BANDS_PER_CH":True,
              "DEDICATED_POST_PEQ_GAIN":bool(link["integrated_post_peq_gain"]),
              "GAIN_IDS_22_28_IMPLEMENTED":True,
              "NDS32_RELOCATABLE_LINK":bool(link["relocatable_link_succeeded"]),

              "CH7_PHYSICAL_I2SOUT1R":True,
              "CH7_ID17_EXACT_WIRE_PROOF":
                  bool(schema["ch7_exact_id17_proven"]),
              "CH7_ID17_STRUCTURAL_SUPPORT":
                  bool(schema["ch7_id17_structurally_forced"]),

              "GAIN_22_28_GLOBAL_FREE_PROVEN":
                  bool(schema["gain_ids_22_28_global_free_proven"]),

              "SAFE_AUTH_WITHOUT_0X11":
                  bool(no0["safe_live_auth_without_0x11_proven"]),

              "PURE_READ_ONLY_STOCK_BACKUP_COMMAND":
                  bool(rec["pure_read_only_stock_backup_command_proven"]),
              "PRODUCTION_RECOVERY_IDENTITY":
                  bool(rec["production_recovery_identity_proven"]),
              "STOCK_BACKUP_COMPLETED":
                  bool(rec["production_stock_backup_completed"]),
              "ROLLBACK_COMPLETED":
                  bool(rec["production_rollback_completed"]),

              "PRODUCTION_MEMORY_LAYOUT":
                  bool(link["production_memory_layout_proven"]),
              "PRODUCTION_ENTRY_POINT":
                  bool(link["production_entry_point_proven"]),
              "BOOTABLE_IMAGE":
                  bool(link["bootable_image"]),
              "PRODUCTION_IMAGE_READY":
                  bool(link["production_image_ready"]),

              "FLASH_ALLOWED":False
          }

          blockers=[
              k for k,v in gates.items()
              if k not in {
                  "CH7_ID17_STRUCTURAL_SUPPORT",
                  "FLASH_ALLOWED"
              } and not v
          ]

          offline_exhausted=[
              "CH7_ID17_EXACT_WIRE_PROOF",
              "GAIN_22_28_GLOBAL_FREE_PROVEN",
              "SAFE_AUTH_WITHOUT_0X11",
              "PURE_READ_ONLY_STOCK_BACKUP_COMMAND",
              "PRODUCTION_RECOVERY_IDENTITY"
          ]

          result={
              "revision":"MASTER-V41",
              "classification":
                  "MEGA_BLOCKER_CLOSURE_OFFLINE_CANDIDATE_BUNDLE_NOT_FOR_FLASH",
              "gates":gates,
              "blockers":blockers,
              "offline_evidence_limit_reached_for":offline_exhausted,
              "candidate_bundle_created":True,
              "new_live_0x11_allowed":False,
              "flash_allowed":False
          }

          (ev/"14_V41_FINAL_MATRIX.json").write_text(
              json.dumps(result,indent=2)+"\n"
          )

          md=f"""# MASTER V41 FINAL DECISION

          V41 combined seven tasks in one run.

          ## Firmware completed at core/integration level
          - TRUE 7-channel DSP: **PASS**
          - 15-band PEQ each channel: **PASS**
          - dedicated post-PEQ Gain: **PASS**
          - Gain IDs 22..28 implemented: **PASS**
          - NDS32 relocatable link: **{gates['NDS32_RELOCATABLE_LINK']}**
          - production bootable image: **{gates['BOOTABLE_IMAGE']}**

          ## Channel / Gain proof
          - CH7 physical route i2sout1R: **PASS**
          - CH7 ID17 structural support:
            **{gates['CH7_ID17_STRUCTURAL_SUPPORT']}**
          - CH7 ID17 exact wire proof:
            **{gates['CH7_ID17_EXACT_WIRE_PROOF']}**
          - IDs 22..28 global-free proof:
            **{gates['GAIN_22_28_GLOBAL_FREE_PROVEN']}**
          - missing Device Description bytes:
            **{schema['missing_bytes']}**
          - terminal JSON closure present:
            **{schema['terminal_json_closure_present']}**

          ## Protocol
          - known no-0x11 auth/description candidate count:
            **{no0['known_no_0x11_candidate_count']}**
          - safe live auth without 0x11:
            **{gates['SAFE_AUTH_WITHOUT_0X11']}**

          ## Recovery / backup
          - reference flashboot command census:
            **{list(rec['reference_flashboot_commands'].keys())}**
          - read-like host backup commands found:
            **{rec['readlike_host_command_candidates']}**
          - pure read-only complete stock backup command proven:
            **{gates['PURE_READ_ONLY_STOCK_BACKUP_COMMAND']}**
          - production recovery identity:
            **{gates['PRODUCTION_RECOVERY_IDENTITY']}**

          ## Layout / image
          - public SDK linker scripts found:
            **{link['sdk_linker_script_count']}**
          - SDK executable starts:
            **{link['sdk_executable_start_values']}**
          - weak _FP_BASE_ still pending:
            **{link['weak_fp_base_pending']}**
          - production memory layout proven:
            **{gates['PRODUCTION_MEMORY_LAYOUT']}**

          ## Deliverable
          A consolidated source/object candidate bundle was generated:
          `OKN_BP1048P4_V41_PRODUCTION_CANDIDATE_NOT_FLASHABLE.tar.gz`

          It is intentionally **not** a flash image.

          Remaining blockers:
          {chr(10).join('- '+x for x in blockers)}

          New live byte 0x11: **NOT ALLOWED**
          Flash/erase/write: **NO / NO / NO**
          FLASH_ALLOWED: **NO**

          Classification:
          **MEGA_BLOCKER_CLOSURE_OFFLINE_CANDIDATE_BUNDLE_NOT_FOR_FLASH**
          """

          (ev/"15_V41_FINAL_DECISION.md").write_text(md)
          print(md)
          PY

          python3 /tmp/v41/finalize.py
          cat /tmp/v41/evidence/15_V41_FINAL_DECISION.md \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Package consolidated V41 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          cp /tmp/v41/evidence/* /tmp/v41/out/ 2>/dev/null || true

          (
            cd /tmp/v41/out
            sha256sum * > SHA256SUMS.txt
          )

      - name: Upload V41 consolidated result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OKN-BP1048P4-MASTER-V41-MEGA-BLOCKER-CLOSURE-AND-CANDIDATE
          path: /tmp/v41/out/*
          if-no-files-found: error
          retention-days: 90

