name: OKN BP1048P4 R91 AUTO-RUN Reconstruct FlashBoot64K MVA Parser

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/OKN_BP1048P4_R91_AUTO_RUN_RECONSTRUCT_FLASHBOOT64K_MVA_PARSER.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: okn-r91-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_REPO: "https://github.com/leadercxn/bp1048_sdk_v0.1.12.git"
  SDK_COMMIT: "8105bd864b04995d81c9f9ae77cb158259f39015"
  OUT: "/tmp/r91"
  BOARD_USB_ACCESS: "NO"
  HOST_TO_DEVICE_USB: "NO"
  FLASH_ERASE_WRITE: "NO"
  FLASH_ALLOWED: "NO"

jobs:
  mine:
    name: Reconstruct embedded FlashBoot64K and mine MVA parser / STATIC ONLY
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fail-closed scope gate
        shell: bash
        run: |
          set -euo pipefail
          test "$BOARD_USB_ACCESS" = "NO"
          test "$HOST_TO_DEVICE_USB" = "NO"
          test "$FLASH_ERASE_WRITE" = "NO"
          test "$FLASH_ALLOWED" = "NO"
          rm -rf "$OUT"
          mkdir -p "$OUT/evidence" "$OUT/public"
          cat > "$OUT/evidence/00_SCOPE.txt" <<'EOF'
          REVISION=R91
          MODE=OFFLINE_STATIC_ONLY
          TARGET=MVSilicon_BP1048P4
          BOARD_USB_ACCESS=NO
          LIVE_USB_COMMANDS=NO
          AA55_RETEST=NO
          CONTROL_0X11_LIVE=NO
          ERASE=NO
          WRITE=NO
          FLASH_ALLOWED=NO
          GOAL=Reconstruct_embedded_65536_byte_FlashBoot_and_recover_MVA_parser_evidence
          EOF

      - name: Pin exact SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone -q "$SDK_REPO" "$OUT/sdk"
          git -C "$OUT/sdk" checkout -q "$SDK_COMMIT"
          test "$(git -C "$OUT/sdk" rev-parse HEAD)" = "$SDK_COMMIT"
          printf 'SDK_COMMIT=%s\n' "$(git -C "$OUT/sdk" rev-parse HEAD)" \
            > "$OUT/evidence/01_PIN.txt"

      - name: Reconstruct BP1048P4 FlashBoot 64K variants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re,json,hashlib,ast

          root=Path(os.environ["OUT"])/"sdk"
          ev=Path(os.environ["OUT"])/"evidence"

          src_rel="BT_Audio_APP/bt_audio_app_src/device/flash_boot.c"
          cfg_rel="BT_Audio_APP/bt_audio_app_src/inc/flash_config.h"
          hdr_rel="BT_Audio_APP/bt_audio_app_src/inc/flash_boot.h"
          app_rel="BT_Audio_APP/bt_audio_app_src/inc/app_config.h"

          src=(root/src_rel).read_text(errors="ignore")
          cfg=(root/cfg_rel).read_text(errors="ignore")
          hdr=(root/hdr_rel).read_text(errors="ignore")
          app=(root/app_rel).read_text(errors="ignore")

          m=re.search(
              r'const\s+unsigned\s+char\s+flash_data\s*\[\s*65536\s*\]\s*=\s*\{',
              src
          )
          if not m:
              raise SystemExit("flash_data[65536] initializer not found")

          start=m.end()
          end=src.find("};",start)
          if end<0:
              raise SystemExit("flash_data initializer terminator not found")

          body=src[start:end]
          body=re.sub(r'/\*[\s\S]*?\*/','',body)
          body=re.sub(r'//[^\n]*','',body)

          tokens=[x.strip() for x in body.split(",") if x.strip()]

          # Target-specific values from the CFG_CHIP_BP1048P4 branch in flash_config.h.
          base_macros={
              "CONST_DATA_ADDR":0x198000,
              "USER_DATA_ADDR":0x1F0000+0x200000,
              "AUDIO_EFFECT_ADDR":0x1C8000+0x200000,
              "BOOT_UART_CONFIG":(3<<4)+0,
              "JUDGEMENT_STANDARD":0x55,
          }

          # The only reference ambiguity relevant to the blob is SD_PORT.
          # UP_PORT = BTTOOL_OFF(0) + PCTOOL_ON(8) + UDisk_ON(4) + SD_PORT(1 or 2).
          variants={
              "BP1048P4_SD_A15A16A17":{"UP_PORT":0x0D,"SD_PORT":1},
              "BP1048P4_SD_A20A21A22":{"UP_PORT":0x0E,"SD_PORT":2},
          }

          def eval_token(tok,macros):
              s=tok
              # Remove common integer suffixes if present.
              s=re.sub(r'(?<=\b[0-9A-Fa-fxX])[uUlL]+\b','',s)
              for name,val in sorted(macros.items(),key=lambda kv:-len(kv[0])):
                  s=re.sub(rf'\b{re.escape(name)}\b',str(val),s)
              if re.search(r'[A-Za-z_]',re.sub(r'0[xX][0-9A-Fa-f]+','',s)):
                  raise ValueError(f"unresolved identifier in token: {tok!r} -> {s!r}")
              if not re.fullmatch(r'[\s0-9A-Fa-fxX()+\-*/%<>&|~]+',s):
                  raise ValueError(f"unsafe token: {tok!r} -> {s!r}")
              v=eval(s,{"__builtins__":{}},{})
              if not isinstance(v,int) or not 0<=v<=255:
                  raise ValueError(f"token out of byte range: {tok!r} -> {v!r}")
              return v

          results=[]
          for name,extra in variants.items():
              macros={**base_macros,**extra}
              vals=[]
              unresolved=[]
              for idx,t in enumerate(tokens):
                  try:
                      vals.append(eval_token(t,macros))
                  except Exception as e:
                      unresolved.append({"index":idx,"token":t,"error":str(e)})
              if unresolved:
                  (ev/f"02_{name}_UNRESOLVED.json").write_text(
                      json.dumps(unresolved,indent=2,ensure_ascii=False)+'\n'
                  )
                  raise SystemExit(f"{name}: unresolved initializer tokens: {len(unresolved)}")

              data=bytes(vals)
              if len(data)!=65536:
                  raise SystemExit(f"{name}: reconstructed length {len(data)}, expected 65536")

              p=ev/f"flash_data_{name}.bin"
              p.write_bytes(data)
              results.append({
                  "variant":name,
                  "bytes":len(data),
                  "sha256":hashlib.sha256(data).hexdigest(),
                  "first256_hex":data[:256].hex().upper(),
                  "macro_values":{k:hex(v) for k,v in macros.items()},
              })

          # Record exact source configuration evidence and active BP1048P4 branch text.
          b0=cfg.find("#ifdef CFG_CHIP_BP1048P4")
          b1=cfg.find("#else",b0)
          bpbranch=cfg[b0:b1] if b0>=0 and b1>=0 else ""

          # Locate every project occurrence of the key selection macros.
          macro_contexts=[]
          for p in sorted(root.rglob("*")):
              if not p.is_file() or p.suffix.lower() not in {
                  ".c",".h",".mk",".txt",".prefs",".cproject",".project"
              }:
                  continue
              try:lines=p.read_text(errors="ignore").splitlines()
              except Exception:continue
              for i,line in enumerate(lines):
                  if ("CFG_CHIP_BP1048P4" in line or
                      "CFG_RES_CARD_GPIO" in line or
                      "SDIO_A15_A16_A17" in line or
                      "SDIO_A20_A21_A22" in line):
                      lo=max(0,i-2); hi=min(len(lines),i+4)
                      macro_contexts.append({
                          "path":str(p.relative_to(root)),
                          "line":i+1,
                          "context":"\n".join(f"{j+1}: {lines[j]}" for j in range(lo,hi))
                      })

          (ev/"02_RECONSTRUCTION.json").write_text(
              json.dumps(results,indent=2,ensure_ascii=False)+'\n')
          (ev/"03_BP1048P4_CONFIG_EVIDENCE.json").write_text(
              json.dumps({
                  "flash_config_bp1048p4_branch":bpbranch,
                  "flash_boot_header":hdr[:12000],
                  "app_config_chip_excerpt":"\n".join(
                      x for x in app.splitlines()
                      if "CFG_CHIP_" in x or "CFG_RES_CARD_GPIO" in x
                  )[:20000],
                  "macro_contexts":macro_contexts,
              },indent=2,ensure_ascii=False)+'\n'
          )

          print(json.dumps(results,indent=2))
          PY

      - name: Mine strings marker offsets and binary neighborhoods
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re,json,hashlib,collections,subprocess

          ev=Path(os.environ["OUT"])/"evidence"
          blobs=sorted(ev.glob("flash_data_BP1048P4_*.bin"))

          markers=[
              b"bootdat",b"codedata",b"constdat",b"cnfgdat",b"btupdat",
              b"upinfo",b"cxxx",b"MVA",b"mva",b"CRC",b"crc",
              b"upgrade",b"update",b"flash",b"Flash",b"PC",b"USB",b"HID"
          ]

          all_reports=[]
          for p in blobs:
              data=p.read_bytes()

              # Printable strings with exact offsets.
              strings=[]
              for m in re.finditer(rb'[\x20-\x7e]{4,}',data):
                  strings.append({
                      "offset":m.start(),
                      "offset_hex":hex(m.start()),
                      "length":len(m.group()),
                      "string":m.group().decode("ascii",errors="ignore"),
                  })

              high=[]
              for s in strings:
                  low=s["string"].lower()
                  if any(k in low for k in (
                      "boot","code","const","cnfg","config","updat","mva",
                      "flash","crc","usb","hid","error","magic","data"
                  )):
                      high.append(s)

              windows=[]
              for marker in markers:
                  start=0
                  seen=0
                  while True:
                      i=data.find(marker,start)
                      if i<0: break
                      lo=max(0,i-128); hi=min(len(data),i+len(marker)+256)
                      windows.append({
                          "marker":marker.decode("ascii",errors="ignore"),
                          "offset":i,
                          "offset_hex":hex(i),
                          "window_start":lo,
                          "window_end":hi,
                          "window_hex":data[lo:hi].hex().upper(),
                          "ascii":"".join(
                              chr(b) if 32<=b<=126 else "."
                              for b in data[lo:hi]
                          ),
                      })
                      seen+=1
                      if seen>=50: break
                      start=i+1

              # Search for exact known MVA trailer/CRC-related constants and judgement byte.
              constants={
                  "judgement_0x55_offsets":[i for i,b in enumerate(data) if b==0x55][:2000],
                  "config_0x30_offsets":[i for i,b in enumerate(data) if b==0x30][:2000],
                  "marker_counts":{
                      m.decode("ascii",errors="ignore"):data.count(m)
                      for m in markers
                  },
              }

              name=p.stem
              (ev/f"04_{name}_STRINGS.json").write_text(
                  json.dumps(strings,indent=2,ensure_ascii=False)+'\n')
              (ev/f"05_{name}_HIGH_STRINGS.json").write_text(
                  json.dumps(high,indent=2,ensure_ascii=False)+'\n')
              (ev/f"06_{name}_MARKER_WINDOWS.json").write_text(
                  json.dumps(windows,indent=2,ensure_ascii=False)+'\n')
              (ev/f"07_{name}_CONSTANTS.json").write_text(
                  json.dumps(constants,indent=2)+'\n')

              all_reports.append({
                  "blob":p.name,
                  "sha256":hashlib.sha256(data).hexdigest(),
                  "printable_strings":len(strings),
                  "high_value_strings":len(high),
                  "marker_windows":len(windows),
                  "marker_counts":constants["marker_counts"],
                  "high_value_preview":high[:120],
              })

          (ev/"08_FLASHBOOT_MINER_SUMMARY.json").write_text(
              json.dumps(all_reports,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(all_reports,indent=2,ensure_ascii=False))
          PY

      - name: Search public GitHub for exact FlashBoot source lineage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json,subprocess,base64,urllib.parse,re

          ev=Path(os.environ["OUT"])/"evidence"
          queries=[
              '"flash_data" "65536" "flash_boot"',
              '"bootdat" "codedata" "constdat"',
              '"btupdat" "upinfo" "cxxx"',
              '"JUDGEMENT_STANDARD" "PCTOOL_ON"',
              '"Tue Feb 02 19:28:27 2021"',
              '"MVA_MAGIC_ERR" "PROCESS_CODE_ERR"',
              '"MVA_CONFIG_OFFEST_ERR"',
              '"ROM_BOOT_DBUpgrade_Apply"',
              '"DUAL_BAND_NVRAM_MAJIC_ADDR"',
          ]

          searches=[]
          unique={}

          def run(cmd,timeout=30):
              return subprocess.run(
                  cmd,capture_output=True,text=True,errors="ignore",
                  timeout=timeout,check=False,
                  env={**os.environ,"GH_TOKEN":os.environ["GH_TOKEN"]}
              )

          for q in queries:
              p=run([
                  "gh","api","search/code","-X","GET",
                  "-f",f"q={q}","-f","per_page=100",
                  "-H","Accept: application/vnd.github+json"
              ])
              rec={"query":q,"rc":p.returncode,"stderr":p.stderr[-3000:],"items":[]}
              if p.returncode==0:
                  try:j=json.loads(p.stdout)
                  except Exception:j={}
                  for x in j.get("items",[])[:100]:
                      repo=(x.get("repository") or {}).get("full_name")
                      path=x.get("path")
                      branch=(x.get("repository") or {}).get("default_branch") or "master"
                      item={
                          "repository":repo,"path":path,"sha":x.get("sha"),
                          "html_url":x.get("html_url"),"default_branch":branch
                      }
                      rec["items"].append(item)
                      if repo and path:
                          unique[(repo,path,branch)]=item
              searches.append(rec)

          fetched=[]
          for idx,((repo,path,branch),meta) in enumerate(list(unique.items())[:120],1):
              enc="/".join(urllib.parse.quote(x,safe="") for x in path.split("/"))
              api=f"repos/{repo}/contents/{enc}"
              p=run(["gh","api","-X","GET",api,"-f",f"ref={branch}"],20)
              row={**meta,"rc":p.returncode}
              if p.returncode==0:
                  try:
                      j=json.loads(p.stdout)
                      content=base64.b64decode(j.get("content","")).decode("utf-8",errors="ignore")
                  except Exception as e:
                      content=""
                      row["decode_error"]=repr(e)
                  row["bytes"]=len(content.encode("utf-8",errors="ignore"))
                  row["high_lines"]=[]
                  lines=content.splitlines()
                  for i,line in enumerate(lines):
                      if re.search(
                          r'flash_data|bootdat|codedata|constdat|cnfgdat|btupdat|'
                          r'upinfo|cxxx|MVA_|JUDGEMENT_STANDARD|DUAL_BAND|BankB|CRC',
                          line,re.I
                      ):
                          lo=max(0,i-3); hi=min(len(lines),i+7)
                          row["high_lines"].append({
                              "line":i+1,
                              "context":"\n".join(
                                  f"{k+1}: {lines[k]}" for k in range(lo,hi)
                              )
                          })
                  if row["high_lines"]:
                      safe=re.sub(r'[^A-Za-z0-9_.-]','_',f"{repo}_{path}")[-180:]
                      Path(os.environ["OUT"],"public",f"{idx:03d}_{safe}.txt").write_text(
                          content,encoding="utf-8",errors="ignore"
                      )
              else:
                  row["stderr"]=p.stderr[-1000:]
              fetched.append(row)

          (ev/"09_PUBLIC_SEARCH.json").write_text(
              json.dumps(searches,indent=2,ensure_ascii=False)+'\n')
          (ev/"10_PUBLIC_FETCHED_HIGH_CONTEXTS.json").write_text(
              json.dumps(fetched,indent=2,ensure_ascii=False)+'\n')

          print(json.dumps({
              "queries":len(searches),
              "unique_hits":len(unique),
              "fetched":len(fetched),
              "files_with_high_context":sum(bool(x.get("high_lines")) for x in fetched)
          },indent=2))
          PY

      - name: Rank exact MVA header evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json,re

          ev=Path(os.environ["OUT"])/"evidence"
          miner=json.loads((ev/"08_FLASHBOOT_MINER_SUMMARY.json").read_text())
          public=json.loads((ev/"10_PUBLIC_FETCHED_HIGH_CONTEXTS.json").read_text())

          marker_evidence=[]
          for b in miner:
              for key,count in b["marker_counts"].items():
                  if count:
                      marker_evidence.append({
                          "blob":b["blob"],"marker":key,"count":count
                      })

          public_evidence=[]
          for f in public:
              if f.get("high_lines"):
                  score=0
                  joined="\n".join(x["context"] for x in f["high_lines"]).lower()
                  for k,w in (
                      ("flash_data",8),("bootdat",6),("codedata",6),
                      ("constdat",6),("cnfgdat",6),("btupdat",6),
                      ("upinfo",5),("cxxx",5),("mva_magic",8),
                      ("mva_header",8),("judgement_standard",5),
                      ("dual_band",3),("crc",2)
                  ):
                      if k in joined: score+=w
                  public_evidence.append({
                      "score":score,
                      "repository":f.get("repository"),
                      "path":f.get("path"),
                      "default_branch":f.get("default_branch"),
                      "high_lines":f.get("high_lines")[:80],
                  })
          public_evidence.sort(key=lambda x:-x["score"])

          # Exact proof remains conservative. Presence of ASCII section names alone
          # does not prove header offsets or magic semantics.
          decision={
              "embedded_flashboot_65536_reconstructed":all(
                  x.get("marker_windows") is not None for x in miner
              ),
              "flashboot_variants":miner,
              "marker_evidence":marker_evidence,
              "ranked_public_evidence":public_evidence[:100],
              "mva_header_magic_exactly_proven":False,
              "mva_header_field_offsets_exactly_proven":False,
              "production_exact_flashboot_hash_proven":False,
              "production_readback_proven":False,
              "flash_allowed":False,
          }

          (ev/"11_RANKED_PUBLIC_EVIDENCE.json").write_text(
              json.dumps(public_evidence[:100],indent=2,ensure_ascii=False)+'\n')
          (ev/"12_DECISION.json").write_text(
              json.dumps(decision,indent=2,ensure_ascii=False)+'\n')

          md=[
              "# R91 Reconstructed FlashBoot64K MVA Parser Miner","",
              "## Reconstructed reference FlashBoot variants",
          ]
          for b in miner:
              md += [
                  f"### {b['blob']}",
                  f"- SHA256: `{b['sha256']}`",
                  f"- printable strings: **{b['printable_strings']}**",
                  f"- high-value strings: **{b['high_value_strings']}**",
                  f"- marker windows: **{b['marker_windows']}**",
                  f"- marker counts: `{b['marker_counts']}`",""
              ]

          md += ["## Highest-value public source evidence"]
          if public_evidence:
              for x in public_evidence[:25]:
                  md.append(
                      f"- score {x['score']} `{x['repository']}/{x['path']}`"
                  )
          else:
              md.append("- none")

          md += [
              "","## Gate",
              "- The SDK-embedded 64 KiB FlashBoot reference image is reconstructed offline.",
              "- Exact production FlashBoot hash is still not proven.",
              "- ASCII section-name presence alone is not accepted as exact MVA header magic/offset proof.",
              "- No USB command is sent to the production board.",
              "- No erase/write/flash is performed.",
              "- `FLASH_ALLOWED=NO`",
          ]
          (ev/"13_REPORT.md").write_text("\n".join(md)+'\n')

          print(json.dumps({
              "variants":len(miner),
              "marker_evidence":marker_evidence,
              "public_ranked":len(public_evidence),
              "flash_allowed":False
          },indent=2))
          PY

      - name: Fail-closed safety audit
        shell: bash
        run: |
          set -euo pipefail
          test "$BOARD_USB_ACCESS" = "NO"
          test "$HOST_TO_DEVICE_USB" = "NO"
          test "$FLASH_ERASE_WRITE" = "NO"
          test "$FLASH_ALLOWED" = "NO"
          python3 - <<'PY'
          from pathlib import Path
          import os,json
          ev=Path(os.environ["OUT"])/"evidence"
          d=json.loads((ev/"12_DECISION.json").read_text())
          assert d["production_readback_proven"] is False
          assert d["flash_allowed"] is False
          result={
            "offline_static_only":True,
            "board_usb_access":False,
            "host_to_device_usb":False,
            "aa55":False,
            "control_0x11_live":False,
            "erase":False,
            "write":False,
            "flash_allowed":False,
          }
          (ev/"14_SAFETY_AUDIT.json").write_text(json.dumps(result,indent=2)+'\n')
          print("R91_SAFETY_AUDIT=PASS",json.dumps(result))
          PY

      - name: Build evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          cd "$OUT"
          sha256sum evidence/* > SHA256SUMS.txt
          cp SHA256SUMS.txt evidence/
          zip -9 -r R91_RECONSTRUCTED_FLASHBOOT64K_MVA_PARSER.zip evidence public >/dev/null
          sha256sum R91_RECONSTRUCTED_FLASHBOOT64K_MVA_PARSER.zip \
            | tee R91_RECONSTRUCTED_FLASHBOOT64K_MVA_PARSER.zip.sha256

      - name: Publish summary
        shell: bash
        run: |
          set -euo pipefail
          {
            cat "$OUT/evidence/13_REPORT.md"
            echo
            cat "$OUT/R91_RECONSTRUCTED_FLASHBOOT64K_MVA_PARSER.zip.sha256"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload R91 evidence
        uses: actions/upload-artifact@v7
        with:
          name: R91-RECONSTRUCTED-FLASHBOOT64K-MVA-PARSER
          path: |
            /tmp/r91/R91_RECONSTRUCTED_FLASHBOOT64K_MVA_PARSER.zip
            /tmp/r91/R91_RECONSTRUCTED_FLASHBOOT64K_MVA_PARSER.zip.sha256
            /tmp/r91/evidence/**
            /tmp/r91/public/**
          if-no-files-found: error
          retention-days: 30

  diagnose-r91:
    name: Capture R91 run diagnostics
    if: ${{ always() }}
    needs: mine
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Capture exact run state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.mine.result }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r91diag
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          AUTH=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          curl -fsSL "${AUTH[@]}" \
            "$API/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" \
            -o /tmp/r91diag/jobs.json

          curl -fsSL "${AUTH[@]}" \
            "$API/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            -o /tmp/r91diag/artifacts.json

          python3 - <<'PY'
          import json,os
          from pathlib import Path
          jobs=json.loads(Path('/tmp/r91diag/jobs.json').read_text()).get('jobs',[])
          build=next((x for x in jobs if x.get('name')=='Reconstruct embedded FlashBoot64K and mine MVA parser / STATIC ONLY'),None)
          report={
            'run_id':os.environ.get('GITHUB_RUN_ID'),
            'run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),
            'repository':os.environ.get('GITHUB_REPOSITORY'),
            'head_sha':os.environ.get('GITHUB_SHA'),
            'ref':os.environ.get('GITHUB_REF'),
            'event':os.environ.get('GITHUB_EVENT_NAME'),
            'build_result':os.environ.get('BUILD_RESULT'),
            'build_job':build,
          }
          Path('/tmp/r91diag/summary.json').write_text(
              json.dumps(report,indent=2,ensure_ascii=False)+'\n'
          )
          if build and build.get('id'):
              Path('/tmp/r91diag/build_job_id.txt').write_text(str(build['id']))
          PY

          : > /tmp/r91diag/build-log-tail.txt
          if [ -s /tmp/r91diag/build_job_id.txt ]; then
            JOB_ID="$(cat /tmp/r91diag/build_job_id.txt)"
            set +e
            curl -fsSL "${AUTH[@]}" "$API/actions/jobs/$JOB_ID/logs" \
              -o /tmp/r91diag/build.log
            RC=$?
            set -e
            if [ "$RC" -eq 0 ]; then
              tail -n 300 /tmp/r91diag/build.log > /tmp/r91diag/build-log-tail.txt
            else
              printf 'JOB_LOG_DOWNLOAD_FAILED rc=%s\n' "$RC" > /tmp/r91diag/build-log-tail.txt
            fi
          fi

          {
            echo '# R91 LAST GITHUB ACTIONS DIAGNOSTIC'
            echo
            echo "- Run ID: \`$GITHUB_RUN_ID\`"
            echo "- Attempt: \`$GITHUB_RUN_ATTEMPT\`"
            echo "- Event: \`$GITHUB_EVENT_NAME\`"
            echo "- Ref: \`$GITHUB_REF\`"
            echo "- Head SHA: \`$GITHUB_SHA\`"
            echo "- Result: \`$BUILD_RESULT\`"
            echo
            echo '## Job / step metadata'
            echo '~~~json'
            cat /tmp/r91diag/summary.json
            echo '~~~'
            echo
            echo '## Artifacts'
            echo '~~~json'
            cat /tmp/r91diag/artifacts.json
            echo '~~~'
            echo
            echo '## Job log tail'
            echo '~~~text'
            cat /tmp/r91diag/build-log-tail.txt
            echo '~~~'
          } > /tmp/r91diag/R91_LAST_DIAGNOSTIC.md

      - name: Persist diagnostic to main with race-safe rebase
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/r91diag/R91_LAST_DIAGNOSTIC.md .github/R91_LAST_DIAGNOSTIC.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/R91_LAST_DIAGNOSTIC.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record R91 Actions diagnostic [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Upload diagnostic
        uses: actions/upload-artifact@v7
        with:
          name: R91-RUN-DIAGNOSTIC
          path: |
            /tmp/r91diag/R91_LAST_DIAGNOSTIC.md
            /tmp/r91diag/summary.json
            /tmp/r91diag/jobs.json
            /tmp/r91diag/artifacts.json
            /tmp/r91diag/build-log-tail.txt
          if-no-files-found: error
          retention-days: 30
