      - name: Source and protocol preflight
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -f app/src/main/java/com/okn/preamp/MainActivity.java
          test -f app/src/main/java/com/okn/preamp/BleController.java
          grep -q "applicationId 'com.okn.preamp'" app/build.gradle
          grep -q "versionCode 3" app/build.gradle
          grep -q "versionName '3.0.0'" app/build.gradle
          grep -q '0000ab00-0000-1000-8000-00805f9b34fb' app/src/main/java/com/okn/preamp/BleController.java
          grep -q '570000000700000000' app/src/main/java/com/okn/preamp/UfeProtocol.java
          ! grep -R -nE 'WebView|setBackgroundResource\(.*screenshot|unknownWrite|genericWrite\(' app/src/main/java
          javac tools/ProtocolSelfTest.java
          java -cp tools ProtocolSelfTest
          rm -f tools/ProtocolSelfTest.class
          echo OKNPV3_SOURCE_PREFLIGHT_PASS

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Locate and prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n1 || true)"
          fi
          test -x "$SDKMANAGER"
          echo "Using sdkmanager: $SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          set -o pipefail
          "$SDKMANAGER" "platforms;${{ env.ANDROID_PLATFORM }}" "build-tools;${{ env.ANDROID_BUILD_TOOLS }}"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build installable APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK identity and create checksums
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          OUT="$RUNNER_TEMP/OKN_Preamp_V3.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee "$RUNNER_TEMP/OKN_Preamp_V3.apk.sha256"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          AAPT="$SDK/build-tools/${{ env.ANDROID_BUILD_TOOLS }}/aapt"
          "$AAPT" dump badging "$OUT" | head -25 | tee "$RUNNER_TEMP/apk_badging.txt"
          grep -q "package: name='com.okn.preamp'" "$RUNNER_TEMP/apk_badging.txt"
          grep -q "versionCode='3'" "$RUNNER_TEMP/apk_badging.txt"
          grep -q "versionName='3.0.0'" "$RUNNER_TEMP/apk_badging.txt"
          grep -q "application-label:'OKN Preamp'" "$RUNNER_TEMP/apk_badging.txt"

      - name: Package source reconstructed from this one YML
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          zip -qr "$RUNNER_TEMP/OKN_Preamp_V3_Source.zip" . -x '.gradle/*' 'app/build/*' '*.class'
          unzip -t "$RUNNER_TEMP/OKN_Preamp_V3_Source.zip" >/dev/null
          sha256sum "$RUNNER_TEMP/OKN_Preamp_V3_Source.zip" | tee "$RUNNER_TEMP/OKN_Preamp_V3_Source.zip.sha256"

      - name: Upload OKN Preamp V3 APK
        uses: actions/upload-artifact@v6
        with:
          name: OKN-Preamp-V3-APK
          path: |
            ${{ runner.temp }}/OKN_Preamp_V3.apk
            ${{ runner.temp }}/OKN_Preamp_V3.apk.sha256
            ${{ runner.temp }}/apk_badging.txt
          if-no-files-found: error

      - name: Upload reconstructed source
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: OKN-Preamp-V3-Source
          path: |
            ${{ runner.temp }}/OKN_Preamp_V3_Source.zip
            ${{ runner.temp }}/OKN_Preamp_V3_Source.zip.sha256
          if-no-files-found: warn
