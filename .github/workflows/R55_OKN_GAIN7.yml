name: R55 OKN GAIN7

"on":
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'firmware/**'
      - 'vendor_patch/**'
      - 'host/**'
      - 'tools/**'
      - 'Makefile'
      - 'OKN_BP1048P4_R55_TRUE7CH_CLEAN_GAIN/**'
      - '.github/workflows/R55_OKN_GAIN7.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - 'vendor_patch/**'
      - 'host/**'
      - 'tools/**'
      - 'Makefile'
      - 'OKN_BP1048P4_R55_TRUE7CH_CLEAN_GAIN/**'

permissions:
  contents: read

concurrency:
  group: r55-okn-gain7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-r55:
    name: Verify TRUE 7CH gain
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Locate R55 project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "Makefile" && -f "firmware/dsp/okn_gain7.c" ]]; then
            ROOT="$GITHUB_WORKSPACE"
          elif [[ -f "OKN_BP1048P4_R55_TRUE7CH_CLEAN_GAIN/Makefile" ]]; then
            ROOT="$GITHUB_WORKSPACE/OKN_BP1048P4_R55_TRUE7CH_CLEAN_GAIN"
          else
            echo "R55 project not found"
            exit 1
          fi

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "R55_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Using: $ROOT"

      - name: Check required R55 files
        shell: bash
        run: |
          set -euo pipefail
          cd "$R55_ROOT"

          test -f firmware/dsp/okn_gain7.c
          test -f firmware/dsp/okn_gain7.h
          test -f firmware/control/okn_proto.c
          test -f firmware/control/okn_proto.h
          test -f firmware/integration/okn_r55_core.c
          test -f host/test_r55.c
          test -f tools/check_no_eq_gain.py
          test -f Makefile

      - name: Guard - gain must not use EQ
        shell: bash
        run: |
          set -euo pipefail
          cd "$R55_ROOT"
          python tools/check_no_eq_gain.py

      - name: Guard - no stock sink-volume as custom 7CH gain
        shell: bash
        run: |
          set -euo pipefail
          cd "$R55_ROOT"

          if grep -RniE 'AudioCoreSinkVolSet[[:space:]]*\(' \
              firmware/dsp firmware/control firmware/integration; then
            echo "FAIL: custom R55 gain path calls AudioCoreSinkVolSet()"
            exit 1
          fi

          echo "CUSTOM_GAIN_NO_AUDIOCORESINKVOLSET_PASS"

      - name: Build and run host tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$R55_ROOT"
          make clean
          make all

      - name: Verify TRUE7CH symbols
        shell: bash
        run: |
          set -euo pipefail
          cd "$R55_ROOT"

          grep -q 'OKN_GAIN7_CHANNELS' firmware/dsp/okn_gain7.h
          grep -q 'okn_gain7_process_topology' firmware/dsp/okn_gain7.c
          grep -q 'OKN_CMD_SET_GAIN' firmware/control/okn_proto.h
          echo "TRUE7CH_SYMBOL_CHECK_PASS"

      - name: Create verification report
        shell: bash
        run: |
          set -euo pipefail
          cd "$R55_ROOT"

          mkdir -p ci_out
          {
            echo "OKN BP1048P4 R55"
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_ID"
            echo "TRUE 7CH PCM gain: VERIFIED BY HOST TEST"
            echo "EQ used as gain: NO"
            echo "AudioCoreSinkVolSet used as custom gain: NO"
            echo "Automatic board flash: DISABLED"
            echo "Production image generation: NOT PERFORMED"
            echo "UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > ci_out/R55_OKN_REPORT.txt

          sha256sum \
            firmware/dsp/okn_gain7.c \
            firmware/dsp/okn_gain7.h \
            firmware/control/okn_proto.c \
            firmware/control/okn_proto.h \
            firmware/integration/okn_r55_core.c \
            firmware/integration/okn_r55_core.h \
            > ci_out/R55_OKN_SHA256.txt

      - name: Pack checked source
        shell: bash
        run: |
          set -euo pipefail
          cd "$R55_ROOT"

          tar -czf ci_out/R55_OKN_GAIN7_SOURCE.tar.gz \
            firmware \
            vendor_patch \
            host/test_r55.c \
            tools \
            Makefile \
            README_TH.md \
            STATUS_R55.txt \
            BUILD_TOOLCHAIN_TH.md \
            FIRST_FLASH_GATE_TH.md \
            NEXT_BOARD_TEST_R55_TH.md

      - name: Upload R55 checked artifact
        uses: actions/upload-artifact@v6
        with:
          name: R55_OKN_GAIN7_${{ github.run_number }}
          path: |
            ${{ steps.project.outputs.root }}/ci_out/R55_OKN_REPORT.txt
            ${{ steps.project.outputs.root }}/ci_out/R55_OKN_SHA256.txt
            ${{ steps.project.outputs.root }}/ci_out/R55_OKN_GAIN7_SOURCE.tar.gz
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
