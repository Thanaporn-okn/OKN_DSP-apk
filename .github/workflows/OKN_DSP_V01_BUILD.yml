name: OKN-DSP v0.1.0 package CI

on:
  push:
    branches:
      - 'okn-dsp-v0.1.0'
  workflow_dispatch:

permissions:
  contents: read

env:
  FLASH_ALLOWED: 'NO'
  BOARD_USB_ACCESS: 'NO'
  FINAL_INSTALL_PATH: 'SAMSUNG_S25_PLUS_USB_C_DIRECT_TO_DSP_USB_C_ONLY'
  HARDWARE_MODIFICATION: 'FORBIDDEN'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Safety gate
        run: |
          echo "FLASH_ALLOWED=NO"
          echo "BOARD_USB_ACCESS=NO"
          echo "NO_STOCK_USB_TX=YES"
          echo "NO_ERASE_PROGRAM_FLASH=YES"

      - name: Restore exact OKN-DSP v0.1.0 source package
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/okn_source.b64 <<'B64'

B64
          base64 -d /tmp/okn_source.b64 > /tmp/OKN-DSP-v0.1.0-source.zip
          echo '066ded33823ff093113ed9c13539c73a8a32b108478692373e8c2d6c5298d435  /tmp/OKN-DSP-v0.1.0-source.zip' | sha256sum -c -
          unzip -q /tmp/OKN-DSP-v0.1.0-source.zip -d /tmp/okn

      - name: Firmware host build and tests
        run: |
          set -euo pipefail
          cmake -S /tmp/okn/OKN-DSP/firmware -B /tmp/okn/OKN-DSP/firmware/build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build /tmp/okn/OKN-DSP/firmware/build
          ctest --test-dir /tmp/okn/OKN-DSP/firmware/build --output-on-failure

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android protocol/model host test
        run: |
          set -euo pipefail
          cd /tmp/okn/OKN-DSP
          mkdir -p android-app/host-test/out
          javac -Xlint:all -Werror -d android-app/host-test/out             android-app/app/src/main/java/com/okn/dsp/DspModel.java             android-app/app/src/main/java/com/okn/dsp/OknPacket.java             android-app/host-test/OknPacketHostTest.java
          java -cp android-app/host-test/out com.okn.dsp.OknPacketHostTest

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build OKN-DSP APK
        working-directory: /tmp/okn/OKN-DSP/android-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify build safety flags
        shell: bash
        run: |
          set -euo pipefail
          grep -R 'OKN_RUNTIME_USB_TX_ENABLED", "false"' /tmp/okn/OKN-DSP/android-app/app/build.gradle.kts
          grep -R 'OKN_PRODUCTION_FLASH_ENABLED", "false"' /tmp/okn/OKN-DSP/android-app/app/build.gradle.kts

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          sha256sum /tmp/OKN-DSP-v0.1.0-source.zip > /tmp/OKN-DSP-v0.1.0-source.zip.sha256
          cp /tmp/okn/OKN-DSP/android-app/app/build/outputs/apk/debug/app-debug.apk /tmp/OKN-DSP-v0.1.0-debug.apk
          sha256sum /tmp/OKN-DSP-v0.1.0-debug.apk > /tmp/OKN-DSP-v0.1.0-debug.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-v0.1.0-package
          path: |
            /tmp/OKN-DSP-v0.1.0-source.zip
            /tmp/OKN-DSP-v0.1.0-source.zip.sha256
            /tmp/OKN-DSP-v0.1.0-debug.apk
            /tmp/OKN-DSP-v0.1.0-debug.apk.sha256
          if-no-files-found: error
