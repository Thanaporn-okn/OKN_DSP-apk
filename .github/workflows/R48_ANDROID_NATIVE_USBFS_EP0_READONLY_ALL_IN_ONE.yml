      - name: R48 hard safety and native-load gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYSAFE'
          from pathlib import Path
          root=Path('/tmp/r48src/r48_src')
          k=(root/'android_template/MainActivity.kt.in').read_text()
          c=(root/'android_template/usbfs_diag.cpp.in').read_text()
          d=(root/'lib/usb_readonly.dart').read_text()

          forbidden=[
              'HID_SET_REPORT','USB_DIR_OUT','bulkTransfer','UsbRequest',
              'setConfiguration','setInterface','SpiFlashErase','SpiFlashWrite',
              'SaveParams','Reset_McuSystem','0x58','0x57','0x11',
          ]
          bad=[x for x in forbidden if x in k]
          if bad:
              raise SystemExit('forbidden R48 native token(s): '+', '.join(bad))

          required=[
              'HID_GET_REPORT = 0x01','HID_GET_IDLE = 0x02',
              'HID_REPORT_TYPE_INPUT = 0x01','HID_REPORT_TYPE_FEATURE = 0x03',
              'USB_GET_STATUS = 0x00','USB_GET_INTERFACE = 0x0A',
              'RUNTIME_GET_REPORT_REQUEST_TYPE','RUNTIME_STANDARD_INTERFACE_IN',
              'nativeUsbfsControlTransfer','connection.fileDescriptor',
              'ep0_unclaimed','ep0_claimed','claimInterface(iface4, true)',
              'ensureNativeLibraryLoaded','nativeLoadAttempted','nativeLoadError',
              'native_usbfs_unavailable','NOT_SENT'
          ]
          for token in required:
              if token not in k:
                  raise SystemExit('missing R48 proof token: '+token)

          # Critical launch regression guard: native library may not be loaded by a class/companion initializer.
          compact=''.join(k.split())
          if 'init{System.loadLibrary("usbfsdiag")}' in compact:
              raise SystemExit('R48 regression: eager System.loadLibrary still present at app startup')
          if 'try{System.loadLibrary("usbfsdiag")' not in compact:
              raise SystemExit('R48 lazy load try/catch missing')

          if 'USBDEVFS_CONTROL' not in c:
              raise SystemExit('native usbfs control path missing')
          if 'System.loadLibrary("usbfsdiag")' not in k or 'ensureNativeLibraryLoaded' not in k:
              raise SystemExit('R48 lazy native loader missing')
          if any(x in c for x in ['USBDEVFS_SUBMITURB','USBDEVFS_BULK','USBDEVFS_RESET']):
              raise SystemExit('forbidden usbfs operation')
          if "'ep0Semantics'" not in d:
              raise SystemExit('Dart EP0 method missing')
          print('PASS R48 safety: launch-safe lazy JNI + read-only EP0 only')
          PYSAFE

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android scaffold and overlay R48 source
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          rm -rf /tmp/okn_r48_app
          flutter create --platforms=android --org com.okn.dsp --project-name okn_dsp_r48 /tmp/okn_r48_app

          rm -rf /tmp/okn_r48_app/lib /tmp/okn_r48_app/test
          cp -a "$R48_SRC/lib" /tmp/okn_r48_app/lib
          cp -a "$R48_SRC/test" /tmp/okn_r48_app/test
          cp "$R48_SRC/pubspec.yaml" /tmp/okn_r48_app/pubspec.yaml
          cp "$R48_SRC/analysis_options.yaml" /tmp/okn_r48_app/analysis_options.yaml
          cp "$R48_SRC/README_R48_TH.txt" /tmp/okn_r48_app/README_R48_TH.txt

          MAIN="$(find /tmp/okn_r48_app/android/app/src/main/kotlin -name MainActivity.kt | head -n1)"
          test -f "$MAIN"
          PKG="$(sed -n 's/^package[[:space:]]\+//p' "$MAIN" | head -n1)"
          test -n "$PKG"
          sed "s/^package __PACKAGE__$/package $PKG/" "$R48_SRC/android_template/MainActivity.kt.in" > "$MAIN"

          MANIFEST=/tmp/okn_r48_app/android/app/src/main/AndroidManifest.xml
          python3 - <<'PYMAN'
          from pathlib import Path
          p=Path('/tmp/okn_r48_app/android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          marker='    <application'
          feature='    <uses-feature android:name="android.hardware.usb.host" android:required="false" />\n'
          if marker not in s:
              raise SystemExit('AndroidManifest application marker missing')
          if 'android.hardware.usb.host' not in s:
              s=s.replace(marker,feature+marker,1)
          p.write_text(s)
          PYMAN

          # Native bridge stays optional at runtime and is linked for 16 KiB page-size devices.
          NDK="$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          test -n "$NDK"
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++"
          test -x "$CLANG"
          CPPDIR=/tmp/okn_r48_app/android/app/src/main/cpp
          JNIDIR=/tmp/okn_r48_app/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$CPPDIR" "$JNIDIR"
          PKG_JNI="$(python3 - "$PKG" <<'PYJNI'
          import sys
          pkg=sys.argv[1]
          print(pkg.replace('_','_1').replace('.','_')+'_MainActivity')
          PYJNI
          )"
          sed "s/__JNI_CLASS__/$PKG_JNI/g" "$R48_SRC/android_template/usbfs_diag.cpp.in" > "$CPPDIR/usbfs_diag.cpp"
          "$CLANG" -std=c++17 -shared -fPIC -O2 -nostdlib++ \
            -Wl,--no-undefined -Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384 \
            "$CPPDIR/usbfs_diag.cpp" -o "$JNIDIR/libusbfsdiag.so"
          test -s "$JNIDIR/libusbfsdiag.so"
          file "$JNIDIR/libusbfsdiag.so"
          readelf -lW "$JNIDIR/libusbfsdiag.so" | grep ' LOAD '
          readelf -dW "$JNIDIR/libusbfsdiag.so" | tee /tmp/r48_dynamic.txt
          if grep -q 'libc++_shared.so' /tmp/r48_dynamic.txt; then
            echo 'FAIL: native bridge unexpectedly depends on libc++_shared.so' >&2
            exit 1
          fi
          readelf -Ws "$JNIDIR/libusbfsdiag.so" | grep -q 'nativeUsbfsControlTransfer'
          python3 - "$JNIDIR/libusbfsdiag.so" <<'PYELF'
          import subprocess,sys,re
          out=subprocess.check_output(['readelf','-lW',sys.argv[1]],text=True)
          aligns=[]
          for line in out.splitlines():
              if line.lstrip().startswith('LOAD '):
                  token=line.split()[-1]
                  aligns.append(int(token,16))
          if not aligns or min(aligns) < 16384:
              raise SystemExit(f'ELF LOAD alignment is not 16 KiB safe: {aligns}')
          print('PASS native ELF LOAD alignment:', aligns)
          PYELF

          echo "R48_APP=/tmp/okn_r48_app" >> "$GITHUB_ENV"
          echo "R48_MAIN_ACTIVITY=$MAIN" >> "$GITHUB_ENV"
          echo "R48_NATIVE_CPP=$CPPDIR/usbfs_diag.cpp" >> "$GITHUB_ENV"

      - name: Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$R48_APP"
          flutter pub get

      - name: Protocol and regression unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$R48_APP"
          flutter test

      - name: Static analysis
        shell: bash
        run: |
          set -euo pipefail
          cd "$R48_APP"
          flutter analyze

      - name: Build arm64 Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$R48_APP"
          flutter build apk --debug --target-platform android-arm64
          test -s build/app/outputs/flutter-apk/app-debug.apk
          unzip -l build/app/outputs/flutter-apk/app-debug.apk | grep -q 'lib/arm64-v8a/libusbfsdiag.so'
          readelf -dW "$R48_APP/android/app/src/main/jniLibs/arm64-v8a/libusbfsdiag.so" | tee /tmp/r48_post_dynamic.txt
          ! grep -q 'libc++_shared.so' /tmp/r48_post_dynamic.txt
          readelf -Ws "$R48_APP/android/app/src/main/jniLibs/arm64-v8a/libusbfsdiag.so" | grep -q 'nativeUsbfsControlTransfer'

      - name: Post-build R48 native-load and safety audit
        shell: bash
        run: |
          set -euo pipefail
          K="$R48_MAIN_ACTIVITY"
          C="$R48_NATIVE_CPP"
          ! grep -Eq 'HID_SET_REPORT|USB_DIR_OUT|bulkTransfer|UsbRequest|setConfiguration|setInterface|SpiFlashErase|SpiFlashWrite|SaveParams|Reset_McuSystem|0x58|0x57|0x11' "$K"
          grep -q 'ensureNativeLibraryLoaded' "$K"
          grep -q 'native_usbfs_unavailable' "$K"
          grep -q 'System.loadLibrary("usbfsdiag")' "$K"
          ! python3 - "$K" <<'PYEAGER'
          from pathlib import Path
          import sys
          k=''.join(Path(sys.argv[1]).read_text().split())
          raise SystemExit(0 if 'init{System.loadLibrary("usbfsdiag")}' in k else 1)
          PYEAGER
          grep -q 'USBDEVFS_CONTROL' "$C"
          ! grep -Eq 'USBDEVFS_SUBMITURB|USBDEVFS_BULK|USBDEVFS_RESET' "$C"
          echo 'PASS post-build R48: no eager JNI load; read-only EP0 only'

      - name: Package R48 APK and evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/r48_out
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp "$R48_APP/build/app/outputs/flutter-apk/app-debug.apk" "$OUT/OKN_DSP_R48_NATIVE_USBFS_EP0_READONLY_debug.apk"
          cp /tmp/OKN_DSP_R48_NATIVE_USBFS_EP0_READONLY_Source.zip "$OUT/OKN_DSP_R48_NATIVE_USBFS_EP0_READONLY_Source.zip"
          cp "$R48_APP/README_R48_TH.txt" "$OUT/README_R48_TH.txt"
          cp "$R48_MAIN_ACTIVITY" "$OUT/MainActivity_R48_NATIVE_USBFS_EP0.kt"
          cp "$R48_NATIVE_CPP" "$OUT/usbfs_diag_R48.cpp"
          cat > "$OUT/R48_SAFETY_STATE.txt" <<'EOF'
          R44_4_BASELINE_ZERO_CONFIRMED_ON_REAL_BOARD=YES
          R45_PREVIOUS_APK_LAUNCH_FAILURE_REPORTED=YES
          EAGER_NATIVE_LIBRARY_LOAD=NO
          NATIVE_LIBRARY_LOAD=LAZY_TRY_CATCH
          NATIVE_LIBCXX_SHARED_DEPENDENCY=NO
          NATIVE_16K_PAGE_LINKING=YES
          RUNTIME_INTERFACE=4
          R30_SIGNATURE_REQUIRED=YES
          SET_REPORT=NO
          UFE_COMMANDS=NO
          CONTROL_0x11=NO
          FLASH_ERASE_PROGRAM_COMMIT=NO
          RESET=NO
          JAVA_CONTROLTRANSFER_DIRECT=YES
          JAVA_CONTROLTRANSFER_OFFSET1=YES
          NATIVE_USBDEVFS_CONTROL=OPTIONAL_LAZY
          TEST_BEFORE_AND_AFTER_CLAIM_IF4=YES
          EOF
          (cd "$OUT" && sha256sum * > SHA256SUMS.txt)

      - name: Upload R48 APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN_DSP_R48_NATIVE_USBFS_EP0_READONLY_APK
          path: /tmp/r48_out/*
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        shell: bash
        run: |
          {
            echo '## R48 Android native usbfs EP0 read-only cross-check'
            echo '- Continues from R47: Feature branch is alive while IF4 Input GET_REPORT remains 0 B'
            echo '- Repairs the R45.1 alternate path: native usbfs loads lazily and exposes load/JNI errors on-screen'
            echo '- Native usbfs library is 16 KiB aligned and audited to have no libc++_shared dependency'
            echo '- Compares Java controlTransfer with direct USBDEVFS_CONTROL ioctl on the same opened device FD'
            echo '- No SET_REPORT, no 0x58/0x57/0x11, no flash/reset path'
          } >> "$GITHUB_STEP_SUMMARY"
