name: Build OKN DSP Probe APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_Probe_Source.zip'
      - '.github/workflows/OKN_DSP_Probe_AutoBuild.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Do not install the removed legacy SDK package named "tools".
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK 35 packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          sdkmanager --list_installed

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract Source.zip
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/OKN_DSP_Probe_Source.zip"
          rm -rf "$GITHUB_WORKSPACE/_okn_src"
          mkdir -p "$GITHUB_WORKSPACE/_okn_src"
          unzip -q "$GITHUB_WORKSPACE/OKN_DSP_Probe_Source.zip" -d "$GITHUB_WORKSPACE/_okn_src"

          if [ -f "$GITHUB_WORKSPACE/_okn_src/settings.gradle" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE/_okn_src"
          else
            SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/_okn_src" -name settings.gradle -type f -print -quit)"
            test -n "$SETTINGS_FILE"
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"

      # Backward-compatibility fix: V1/V2 source used a UsbConstants member
      # that Android does not define. This makes the workflow build old ZIPs too.
      - name: Apply USB recipient compatibility fix
        shell: bash
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/okn/dsp/probe/UsbProbe.java')
          if not p.exists():
              raise SystemExit(f'Missing source: {p}')
          s = p.read_text(encoding='utf-8')
          old = 'UsbConstants.USB_DIR_IN | UsbConstants.USB_TYPE_STANDARD | UsbConstants.USB_RECIP_INTERFACE'
          new = 'UsbConstants.USB_DIR_IN | UsbConstants.USB_TYPE_STANDARD | 0x01'
          if old in s:
              s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')
              print('Applied Android UsbConstants compatibility fix.')
          else:
              print('Compatibility fix already present; no source change needed.')
          PY

      - name: Validate project
        shell: bash
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          java -version
          gradle --version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ! grep -R "UsbConstants.USB_RECIP_INTERFACE" app/src/main/java

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Collect APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="${{ steps.extract.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/OKN_DSP_Probe_V1_0_1.apk"
          cd "$GITHUB_WORKSPACE"
          sha256sum OKN_DSP_Probe_V1_0_1.apk | tee OKN_DSP_Probe_V1_0_1_SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: OKN_DSP_Probe_V1_0_1_APK
          path: |
            OKN_DSP_Probe_V1_0_1.apk
            OKN_DSP_Probe_V1_0_1_SHA256.txt
          if-no-files-found: error
          retention-days: 30
