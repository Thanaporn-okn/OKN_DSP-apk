name: Build OKN DSP Probe V11 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_Probe_Source.zip'
      - '.github/workflows/OKN_DSP_Probe_AutoBuild.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Accept licenses and install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          # `yes` can receive SIGPIPE after sdkmanager exits. Temporarily disable
          # pipefail so that a successful license dialog is not misreported as a
          # workflow failure; the package install below remains the hard check.
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          set -o pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract Source.zip
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/OKN_DSP_Probe_Source.zip"
          rm -rf "$GITHUB_WORKSPACE/_okn_src"
          mkdir -p "$GITHUB_WORKSPACE/_okn_src"
          unzip -q "$GITHUB_WORKSPACE/OKN_DSP_Probe_Source.zip" -d "$GITHUB_WORKSPACE/_okn_src"
          if [ -f "$GITHUB_WORKSPACE/_okn_src/settings.gradle" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE/_okn_src"
          else
            SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/_okn_src" -name settings.gradle -type f -print -quit)"
            test -n "$SETTINGS_FILE"
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Validate V11 source and safety gates
        shell: bash
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f BUTTON_COMMAND_MAP_TH.md
          grep -q "OKN DSP Probe V11.0.0" app/src/main/java/com/okn/dsp/probe/MainActivity.java
          grep -q "versionName '11.0.0'" app/build.gradle
          grep -q "Store current JSON as Snapshot A (LOCAL ONLY)" app/src/main/java/com/okn/dsp/probe/MainActivity.java
          grep -q "Compare Snapshot A" app/src/main/java/com/okn/dsp/probe/MainActivity.java
          grep -q "631C062443FD3844558001F3EDA0CCF8" app/src/main/java/com/okn/dsp/probe/BluetoothProbe.java
          grep -q "661C0624" app/src/main/java/com/okn/dsp/probe/BluetoothProbe.java
          grep -q 'authSent = writeNoResponse(g, AUTH16' app/src/main/java/com/okn/dsp/probe/BluetoothProbe.java
          grep -q 'descriptorSent = writeNoResponse(g, enc, "DESC_REQ")' app/src/main/java/com/okn/dsp/probe/BluetoothProbe.java
          test "$(grep -c 'writeNoResponse(g,' app/src/main/java/com/okn/dsp/probe/BluetoothProbe.java)" -eq 2
          ! grep -R "USB_DIR_OUT" app/src/main/java/com/okn/dsp/probe/UsbProbe.java
          ! grep -R "acpReadFirmwareVersion" app/src/main/java
          ! grep -R "encodeWrite" app/src/main/java
          grep -q "SPP V7 PASSIVE complete" app/src/main/java/com/okn/dsp/probe/BluetoothProbe.java
          grep -q "USB HID V6 PASSIVE-READ" app/src/main/java/com/okn/dsp/probe/UsbProbe.java
          java -version
          gradle --version

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Collect APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="${{ steps.extract.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/OKN_DSP_Probe_V11_0_0.apk"
          cd "$GITHUB_WORKSPACE"
          sha256sum OKN_DSP_Probe_V11_0_0.apk | tee OKN_DSP_Probe_V11_0_0_SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: OKN_DSP_Probe_V11_0_0_APK
          path: |
            OKN_DSP_Probe_V11_0_0.apk
            OKN_DSP_Probe_V11_0_0_SHA256.txt
          if-no-files-found: error
          retention-days: 30
