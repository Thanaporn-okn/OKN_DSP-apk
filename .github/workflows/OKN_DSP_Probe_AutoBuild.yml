name: Build OKN DSP Probe APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_Probe_Source.zip'
      - '.github/workflows/OKN_DSP_Probe_AutoBuild.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses and install SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Source.zip
        id: extract
        shell: bash
        run: |
          set -e
          test -f OKN_DSP_Probe_Source.zip
          rm -rf "$GITHUB_WORKSPACE/_okn_src"
          mkdir -p "$GITHUB_WORKSPACE/_okn_src"
          unzip -q OKN_DSP_Probe_Source.zip -d "$GITHUB_WORKSPACE/_okn_src"

          if [ -f "$GITHUB_WORKSPACE/_okn_src/settings.gradle" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE/_okn_src"
          else
            SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/_okn_src" -name settings.gradle -type f -print -quit)"
            test -n "$SETTINGS_FILE"
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"

      - name: Validate project
        shell: bash
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Collect APK and checksum
        shell: bash
        run: |
          set -e
          APK="${{ steps.extract.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/OKN_DSP_Probe_V1.apk"
          cd "$GITHUB_WORKSPACE"
          sha256sum OKN_DSP_Probe_V1.apk | tee OKN_DSP_Probe_V1_SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN_DSP_Probe_V1_APK
          path: |
            OKN_DSP_Probe_V1.apk
            OKN_DSP_Probe_V1_SHA256.txt
          if-no-files-found: error
