name: Build OKN_DSP UI Demo v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_UI_DEMO_v1.zip'
      - '.github/workflows/build-okn-dsp-ui-demo-v1.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unpack project
        run: |
          rm -rf okn_ui_project
          mkdir okn_ui_project
          unzip -q -o OKN_DSP_UI_DEMO_v1.zip -d okn_ui_project

      - name: Build debug APK
        run: gradle -p okn_ui_project --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p out
          cp okn_ui_project/app/build/outputs/apk/debug/app-debug.apk out/OKN_DSP_UI_DEMO_v1.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN_DSP_UI_DEMO_v1_APK
          path: out/OKN_DSP_UI_DEMO_v1.apk
          if-no-files-found: error
          retention-days: 30
