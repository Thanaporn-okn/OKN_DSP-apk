      - name: Safety guard - packet generation only
        shell: bash
        run: |
          set -euo pipefail
          SRC="$R42_SRC/lib"
          FORBIDDEN='writeCharacteristic|writeDescriptor|BluetoothGatt|BluetoothSocket|UsbDevice|UsbManager|SpiFlashErase|SpiFlashWrite|SaveParams|Communication_Effect_0x11'
          if grep -RniE "$FORBIDDEN" "$SRC"; then
            echo 'ERROR: R42 UI source contains hardware transmit/destructive path.' >&2
            exit 1
          fi
          grep -q 'gainIdFirst = 22' "$SRC/ufe_protocol.dart"
          grep -q 'eqIdFirst = 30' "$SRC/ufe_protocol.dart"
          grep -q 'writeControl = 0x57' "$SRC/ufe_protocol.dart"
          grep -q 'readControl = 0x58' "$SRC/ufe_protocol.dart"
          grep -q 'readResponse = 0x60' "$SRC/ufe_protocol.dart"
          echo 'PASS: local UI + exact R41 packet generation only.'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android scaffold and overlay R42 source
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          rm -rf /tmp/okn_r42_app
          flutter create --platforms=android --org com.okn.dsp --project-name okn_dsp_r42 /tmp/okn_r42_app
          rm -rf /tmp/okn_r42_app/lib /tmp/okn_r42_app/test
          cp -a "$R42_SRC/lib" /tmp/okn_r42_app/lib
          cp -a "$R42_SRC/test" /tmp/okn_r42_app/test
          cp "$R42_SRC/pubspec.yaml" /tmp/okn_r42_app/pubspec.yaml
          cp "$R42_SRC/analysis_options.yaml" /tmp/okn_r42_app/analysis_options.yaml
          cp "$R42_SRC/README_R42_TH.txt" /tmp/okn_r42_app/README_R42_TH.txt
          echo 'R42_APP=/tmp/okn_r42_app' >> "$GITHUB_ENV"

      - name: Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$R42_APP"
          flutter pub get

      - name: Protocol unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$R42_APP"
          flutter test

      - name: Static analysis
        shell: bash
        run: |
          set -euo pipefail
          cd "$R42_APP"
          flutter analyze

      - name: Build installable debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$R42_APP"
          flutter build apk --debug
          test -s build/app/outputs/flutter-apk/app-debug.apk

      - name: Package APK and source evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/r42_out
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp "$R42_APP/build/app/outputs/flutter-apk/app-debug.apk" "$OUT/OKN_DSP_R42_TRUE7CH_UI_debug.apk"
          cp /tmp/OKN_DSP_R42_TRUE7CH_UI_Source.zip "$OUT/OKN_DSP_R42_TRUE7CH_UI_Source.zip"
          cp "$R42_APP/README_R42_TH.txt" "$OUT/README_R42_TH.txt"
          flutter --version > "$OUT/FLUTTER_VERSION.txt"
          (cd "$OUT" && sha256sum * > SHA256SUMS.txt)

      - name: Upload R42 APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN_DSP_R42_TRUE7CH_UI_APK
          path: /tmp/r42_out/*
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        shell: bash
        run: |
          {
            echo '## R42 Android TRUE7CH UI'
            echo '- CH1..CH7 dedicated gain buttons: -70..+6 dB, 0.5 dB step'
            echo '- 15 PEAKING EQ bands per channel'
            echo '- R41 packet IDs: gain 22..28, EQ 30..36'
            echo '- Protocol tests + flutter analyze + debug APK build required'
            echo '- Hardware transport: LOCKED / not included'
          } >> "$GITHUB_STEP_SUMMARY"
