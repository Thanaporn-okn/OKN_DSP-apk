      - name: Verify frozen BLE and DSP core
        shell: bash
        run: |
          set -euo pipefail
          echo "d04458da9e590825c33e19b3726087144d0da03ddeedebd2bee2a25e47cf3ce0  app/src/main/java/com/okn/peramp/DspProtocol.java" | sha256sum -c -
          echo "2ba18e3e721422448bf0220d59a245a8a2b5c26021936f69b124a1c6623d776e  app/src/main/java/com/okn/peramp/BleManager.java" | sha256sum -c -

      - name: Validate 7CH Parametric EQ and fail-closed gates
        shell: bash
        run: |
          set -euo pipefail
          python3 Sources/validate_v38_gate.py
          python3 Sources/validate_v39_reset.py
          python3 Sources/validate_oknpv2.py

      - name: Build Debug and Release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk OKNPV2-debug.apk
          cp app/build/outputs/apk/release/app-release.apk OKNPV2-release.apk

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging OKNPV2-debug.apk | tee OKNPV2-apk-badging.txt
          grep -q "package: name='com.okn.peramp' versionCode='2000' versionName='2.0.0'" OKNPV2-apk-badging.txt
          grep -q "application-label:'OKN Peramp'" OKNPV2-apk-badging.txt

      - name: Package generated source and checksums
        shell: bash
        run: |
          set -euo pipefail
          zip -qr OKNPV2-source.zip app Sources build.gradle settings.gradle gradle.properties -x '*/build/*' -x '.gradle/*'
          sha256sum OKNPV2-debug.apk OKNPV2-release.apk OKNPV2-source.zip > OKNPV2-SHA256SUMS.txt
          cat OKNPV2-SHA256SUMS.txt

      - name: Upload OKNPV2 artifact
        uses: actions/upload-artifact@v7
        with:
          name: OKNPV2
          path: |
            OKNPV2-debug.apk
            OKNPV2-release.apk
            OKNPV2-source.zip
            OKNPV2-SHA256SUMS.txt
            OKNPV2-apk-badging.txt
          if-no-files-found: error
          retention-days: 30
