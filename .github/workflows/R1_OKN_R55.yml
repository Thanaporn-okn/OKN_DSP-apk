      - name: Test TRUE7CH dedicated gain
        shell: bash
        run: |
          set -euo pipefail
          cd "$R55_ROOT"
          make clean
          make test

      - name: Run ASAN and UBSAN
        shell: bash
        run: |
          set -euo pipefail
          cd "$R55_ROOT"
          make sanitize

      - name: Verify no EQ-as-Gain
        shell: bash
        run: |
          set -euo pipefail
          cd "$R55_ROOT"
          python3 tools/audit.py
          python3 - <<'PYCHK'
          import json
          s=json.load(open('R55_STATUS.json', encoding='utf-8'))
          assert s['target'] == 'MVSilicon BP1048P4'
          assert s['channels'] == 7
          assert s['gain_via_eq'] is False
          assert s['gain_ids'] == [22,23,24,25,26,27,28]
          assert s['no_hardware_reconfiguration'] is True
          print('PASS: BP1048P4 TRUE7CH dedicated gain; EQ is not used as gain')
          PYCHK

      - name: Package verified R55
        shell: bash
        run: |
          set -euo pipefail
          cd "$R55_ROOT"
          make clean
          cd ..
          zip -qr "$GITHUB_WORKSPACE/R55_OKN_TRUE7CH_VERIFIED.zip" "$(basename "$R55_ROOT")"
          cd "$GITHUB_WORKSPACE"
          sha256sum R55_OKN_TRUE7CH_VERIFIED.zip | tee R55_OKN_TRUE7CH_VERIFIED.sha256
          cat > R55_FLASH_STATUS.txt <<'EOF'
          R55 TRUE7CH runtime core: HOST VERIFIED
          Dedicated Gain CH1..CH7: YES
          Gain via EQ: NO
          Hardware reconfiguration: NO
          Stock-to-custom first-flash: NOT YET PROVEN
          Do not treat this workflow artifact as a proven production flash image.
          EOF

      - name: Upload R55 artifact
        uses: actions/upload-artifact@v4
        with:
          name: R55_OKN_TRUE7CH_VERIFIED
          path: |
            R55_OKN_TRUE7CH_VERIFIED.zip
            R55_OKN_TRUE7CH_VERIFIED.sha256
            R55_FLASH_STATUS.txt
          if-no-files-found: error
          retention-days: 30
