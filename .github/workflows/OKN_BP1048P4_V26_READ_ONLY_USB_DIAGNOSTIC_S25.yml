name: OKN BP1048P4 V26 READ-ONLY USB DIAGNOSTIC S25

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/OKN_BP1048P4_V26_READ_ONLY_USB_DIAGNOSTIC_S25.yml'

permissions:
  contents: read

env:
  REQUIRED_PATH: "Samsung Galaxy S25+ -> USB-C cable -> DSP USB-C port only"
  SOLDER_ALLOWED: "NO"
  BOARD_MOD_ALLOWED: "NO"
  JTAG_ALLOWED: "NO"
  SDP_ALLOWED: "NO"
  AICE_ALLOWED: "NO"
  HARDWARE_PROBE_ALLOWED: "NO"
  USB_SET_REPORT_ALLOWED: "NO"
  FLASHBOOT_TRIGGER_ALLOWED: "NO"
  FLASH_ERASE_ALLOWED: "NO"
  FLASH_WRITE_ALLOWED: "NO"

jobs:
  build:
    name: Build V26 read-only USB diagnostic APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: ONE CLICK - generate read-only diagnostic, safety-check, build APK
        shell: bash
        run: |
          set -euo pipefail

          test "$REQUIRED_PATH" = "Samsung Galaxy S25+ -> USB-C cable -> DSP USB-C port only"
          for v in SOLDER_ALLOWED BOARD_MOD_ALLOWED JTAG_ALLOWED SDP_ALLOWED AICE_ALLOWED HARDWARE_PROBE_ALLOWED USB_SET_REPORT_ALLOWED FLASHBOOT_TRIGGER_ALLOWED FLASH_ERASE_ALLOWED FLASH_WRITE_ALLOWED; do
            test "${!v}" = "NO"
          done

          rm -rf /tmp/v26
          mkdir -p \
            /tmp/v26/app/app/src/main/java/com/okn/bp1048p4diag \
            /tmp/v26/app/app/src/main/res/xml \
            /tmp/v26/out \
            /tmp/v26/evidence

          A=/tmp/v26/app

          cat > /tmp/v26/evidence/V26_PURPOSE.txt <<'EOF'
          TARGET=MVSilicon BP1048P4
          PHONE=Samsung Galaxy S25+
          PATH=Samsung Galaxy S25+ -> USB-C cable -> DSP USB-C port only
          MODE=READ_ONLY_DIAGNOSTIC
          USB_SET_REPORT=FORBIDDEN
          FLASHBOOT_TRIGGER_AA=FORBIDDEN
          ERASE=FORBIDDEN
          WRITE=FORBIDDEN
          SOLDERING=FORBIDDEN
          BOARD_MODIFICATION=FORBIDDEN

          Goal:
          Fingerprint the actual board firmware using only standard USB read operations:
          - VID/PID
          - device bcdDevice/version
          - manufacturer/product/serial
          - configurations/interfaces/endpoints
          - Android raw descriptor bytes
          - HID descriptor and HID report descriptor GET_DESCRIPTOR reads for interfaces 3 and 4
          EOF

          cat > "$A/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'OKN_BP1048P4_V26_DIAG'
          include ':app'
          EOF

          cat > "$A/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > "$A/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > "$A/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.okn.bp1048p4diag'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.okn.bp1048p4diag'
                  minSdk 29
                  targetSdk 35
                  versionCode 26
                  versionName '26.0'
              }
          }
          EOF

          cat > "$A/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature
                  android:name="android.hardware.usb.host"
                  android:required="true" />

              <application
                  android:allowBackup="false"
                  android:label="OKN BP1048P4 V26 DIAG"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED" />
                      </intent-filter>

                      <meta-data
                          android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED"
                          android:resource="@xml/device_filter" />
                  </activity>
              </application>
          </manifest>
          EOF

          cat > "$A/app/src/main/res/xml/device_filter.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <usb-device vendor-id="25380" product-id="5913" />
              <usb-device vendor-id="0" product-id="8772" />
          </resources>
          EOF

          cat > "$A/app/src/main/java/com/okn/bp1048p4diag/MainActivity.java" <<'JAVA'
          package com.okn.bp1048p4diag;

          import android.app.Activity;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.hardware.usb.UsbConfiguration;
          import android.hardware.usb.UsbDevice;
          import android.hardware.usb.UsbDeviceConnection;
          import android.hardware.usb.UsbEndpoint;
          import android.hardware.usb.UsbInterface;
          import android.hardware.usb.UsbManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.security.MessageDigest;
          import java.util.Locale;
          import java.util.Map;

          public class MainActivity extends Activity {
              private static final String ACTION_USB_PERMISSION =
                  "com.okn.bp1048p4diag.USB_PERMISSION";

              private static final int RUNTIME_VID = 0x6324;
              private static final int RUNTIME_PID = 0x1719;
              private static final int RECOVERY_VID = 0x0000;
              private static final int RECOVERY_PID = 0x2244;

              private UsbManager usb;
              private UsbDevice selected;
              private TextView status;

              private final BroadcastReceiver permissionReceiver =
                  new BroadcastReceiver() {
                      @Override public void onReceive(Context context, Intent intent) {
                          if (!ACTION_USB_PERMISSION.equals(intent.getAction())) return;

                          UsbDevice d;
                          if (Build.VERSION.SDK_INT >= 33) {
                              d = intent.getParcelableExtra(
                                  UsbManager.EXTRA_DEVICE, UsbDevice.class);
                          } else {
                              d = intent.getParcelableExtra(UsbManager.EXTRA_DEVICE);
                          }

                          boolean granted = intent.getBooleanExtra(
                              UsbManager.EXTRA_PERMISSION_GRANTED, false);

                          log("USB permission=" + granted + deviceText(d));

                          if (granted && d != null) {
                              selected = d;
                              diagnostic();
                          }
                      }
                  };

              @Override protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  usb = (UsbManager) getSystemService(Context.USB_SERVICE);

                  IntentFilter f = new IntentFilter(ACTION_USB_PERMISSION);
                  if (Build.VERSION.SDK_INT >= 33) {
                      registerReceiver(
                          permissionReceiver,
                          f,
                          Context.RECEIVER_NOT_EXPORTED);
                  } else {
                      registerReceiver(permissionReceiver, f);
                  }

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(28, 28, 28, 28);

                  TextView title = new TextView(this);
                  title.setText("OKN • BP1048P4 • V26 READ-ONLY DIAGNOSTIC");
                  title.setTextSize(20);
                  root.addView(title);

                  TextView note = new TextView(this);
                  note.setText(
                      "\nSamsung Galaxy S25+ → USB-C → DSP USB-C เท่านั้น\n" +
                      "รุ่นนี้เป็น READ-ONLY\n" +
                      "ไม่มี SET_REPORT • ไม่มี AA • ไม่มี erase • ไม่มี write\n");
                  root.addView(note);

                  addButton(root, "1) สแกน USB", v -> scan());
                  addButton(root, "2) ขอสิทธิ์ USB", v -> requestPermission());
                  addButton(root, "3) รัน USB Diagnostic แบบ READ-ONLY", v -> diagnostic());

                  status = new TextView(this);
                  status.setTextIsSelectable(true);
                  status.setText("\nLog:\n");
                  root.addView(status);

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(root);
                  setContentView(scroll);

                  scan();
              }

              private Button addButton(
                  LinearLayout root,
                  String text,
                  View.OnClickListener listener) {

                  Button b = new Button(this);
                  b.setText(text);
                  b.setAllCaps(false);
                  b.setOnClickListener(listener);
                  root.addView(b);
                  return b;
              }

              private void log(String s) {
                  status.append(s + "\n");
              }

              private void toast(String s) {
                  Toast.makeText(this, s, Toast.LENGTH_SHORT).show();
                  log(s);
              }

              private String deviceText(UsbDevice d) {
                  if (d == null) return "";

                  return String.format(
                      Locale.US,
                      " [%04X:%04X id=%d name=%s]",
                      d.getVendorId(),
                      d.getProductId(),
                      d.getDeviceId(),
                      d.getDeviceName());
              }

              private boolean supported(UsbDevice d) {
                  if (d == null) return false;

                  boolean runtime =
                      d.getVendorId() == RUNTIME_VID &&
                      d.getProductId() == RUNTIME_PID;

                  boolean recovery =
                      d.getVendorId() == RECOVERY_VID &&
                      d.getProductId() == RECOVERY_PID;

                  return runtime || recovery;
              }

              private void scan() {
                  selected = null;

                  Map<String, UsbDevice> map = usb.getDeviceList();
                  log("USB devices=" + map.size());

                  for (UsbDevice d : map.values()) {
                      log("พบ" + deviceText(d));

                      if (supported(d)) {
                          selected = d;
                      }
                  }

                  if (selected == null) {
                      log("ยังไม่พบ BP1048P4");
                      return;
                  }

                  log("selected" + deviceText(selected));
                  log("permission=" + usb.hasPermission(selected));
              }

              private void requestPermission() {
                  if (selected == null) scan();

                  if (selected == null) {
                      toast("ยังไม่พบ DSP");
                      return;
                  }

                  if (usb.hasPermission(selected)) {
                      log("มีสิทธิ์ USB แล้ว");
                      diagnostic();
                      return;
                  }

                  Intent i = new Intent(ACTION_USB_PERMISSION)
                      .setPackage(getPackageName());

                  PendingIntent pi = PendingIntent.getBroadcast(
                      this,
                      selected.getDeviceId(),
                      i,
                      PendingIntent.FLAG_UPDATE_CURRENT |
                          PendingIntent.FLAG_MUTABLE);

                  usb.requestPermission(selected, pi);
              }

              private void diagnostic() {
                  if (selected == null) scan();

                  if (selected == null) {
                      toast("ยังไม่พบ DSP");
                      return;
                  }

                  if (!usb.hasPermission(selected)) {
                      requestPermission();
                      return;
                  }

                  log("=== V26 READ-ONLY DIAGNOSTIC BEGIN ===");
                  log("device=" + deviceText(selected));

                  safeString("manufacturer", () -> selected.getManufacturerName());
                  safeString("product", () -> selected.getProductName());
                  safeString("serial", () -> selected.getSerialNumber());
                  safeString("usbVersion", () -> selected.getVersion());

                  log("deviceClass=" + selected.getDeviceClass());
                  log("deviceSubclass=" + selected.getDeviceSubclass());
                  log("deviceProtocol=" + selected.getDeviceProtocol());
                  log("configurationCount=" + selected.getConfigurationCount());
                  log("interfaceCount=" + selected.getInterfaceCount());

                  for (int c = 0; c < selected.getConfigurationCount(); c++) {
                      UsbConfiguration cfg = selected.getConfiguration(c);

                      log(String.format(
                          Locale.US,
                          "CFG[%d] id=%d maxPower=%dmA selfPowered=%s remoteWakeup=%s interfaces=%d",
                          c,
                          cfg.getId(),
                          cfg.getMaxPower(),
                          cfg.isSelfPowered(),
                          cfg.isRemoteWakeup(),
                          cfg.getInterfaceCount()));
                  }

                  for (int n = 0; n < selected.getInterfaceCount(); n++) {
                      UsbInterface intf = selected.getInterface(n);

                      log(String.format(
                          Locale.US,
                          "IF[%d] id=%d alt=%d class=%d sub=%d proto=%d eps=%d",
                          n,
                          intf.getId(),
                          intf.getAlternateSetting(),
                          intf.getInterfaceClass(),
                          intf.getInterfaceSubclass(),
                          intf.getInterfaceProtocol(),
                          intf.getEndpointCount()));

                      for (int e = 0; e < intf.getEndpointCount(); e++) {
                          UsbEndpoint ep = intf.getEndpoint(e);

                          log(String.format(
                              Locale.US,
                              " EP[%d] addr=0x%02X dir=%d type=%d maxPacket=%d interval=%d",
                              e,
                              ep.getAddress(),
                              ep.getDirection(),
                              ep.getType(),
                              ep.getMaxPacketSize(),
                              ep.getInterval()));
                      }
                  }

                  UsbDeviceConnection conn = usb.openDevice(selected);
                  if (conn == null) {
                      log("openDevice failed");
                      return;
                  }

                  try {
                      byte[] raw = conn.getRawDescriptors();

                      if (raw != null) {
                          log("rawDescriptorBytes=" + raw.length);
                          log("rawDescriptorSHA256=" + sha256(raw));
                          log("rawDescriptorHex=" + hex(raw, 512));
                      } else {
                          log("rawDescriptorBytes=null");
                      }

                      // Standard USB read-only requests.
                      readHidDescriptors(conn, selected, 3);
                      readHidDescriptors(conn, selected, 4);

                  } catch (Exception e) {
                      log("diagnostic error=" + e);
                  } finally {
                      conn.close();
                  }

                  log("=== V26 READ-ONLY DIAGNOSTIC END ===");
              }

              private void readHidDescriptors(
                  UsbDeviceConnection conn,
                  UsbDevice d,
                  int interfaceId) {

                  UsbInterface intf = findInterface(d, interfaceId);

                  if (intf == null) {
                      log("IF " + interfaceId + " not present");
                      return;
                  }

                  if (intf.getInterfaceClass() != 3) {
                      log("IF " + interfaceId + " is not HID");
                      return;
                  }

                  byte[] hid = new byte[64];

                  int h = conn.controlTransfer(
                      0x81,
                      0x06,
                      0x2100,
                      interfaceId,
                      hid,
                      hid.length,
                      1500);

                  log(
                      "IF" + interfaceId +
                      " GET_DESCRIPTOR(HID) len=" + h +
                      " hex=" + (h > 0 ? hexPrefix(hid, h) : "--"));

                  byte[] report = new byte[1024];

                  int r = conn.controlTransfer(
                      0x81,
                      0x06,
                      0x2200,
                      interfaceId,
                      report,
                      report.length,
                      1500);

                  if (r > 0) {
                      byte[] exact = new byte[r];
                      System.arraycopy(report, 0, exact, 0, r);

                      log(
                          "IF" + interfaceId +
                          " GET_DESCRIPTOR(REPORT) len=" + r);

                      log(
                          "IF" + interfaceId +
                          " reportSHA256=" + sha256(exact));

                      log(
                          "IF" + interfaceId +
                          " reportHex=" + hex(exact, 1024));
                  } else {
                      log(
                          "IF" + interfaceId +
                          " GET_DESCRIPTOR(REPORT) len=" + r);
                  }
              }

              private UsbInterface findInterface(UsbDevice d, int id) {
                  for (int n = 0; n < d.getInterfaceCount(); n++) {
                      UsbInterface x = d.getInterface(n);
                      if (x.getId() == id) return x;
                  }
                  return null;
              }

              private interface StringCall {
                  String get() throws Exception;
              }

              private void safeString(String name, StringCall call) {
                  try {
                      log(name + "=" + call.get());
                  } catch (Exception e) {
                      log(name + "=<error:" + e.getClass().getSimpleName() + ">");
                  }
              }

              private static String sha256(byte[] b) {
                  try {
                      MessageDigest md = MessageDigest.getInstance("SHA-256");
                      return fullHex(md.digest(b));
                  } catch (Exception e) {
                      return "<sha-error>";
                  }
              }

              private static String fullHex(byte[] b) {
                  StringBuilder s = new StringBuilder();
                  for (byte x : b) {
                      s.append(String.format(Locale.US, "%02X", x & 0xff));
                  }
                  return s.toString();
              }

              private static String hexPrefix(byte[] b, int len) {
                  int n = Math.min(len, b.length);
                  StringBuilder s = new StringBuilder();
                  for (int i = 0; i < n; i++) {
                      s.append(String.format(Locale.US, "%02X", b[i] & 0xff));
                  }
                  return s.toString();
              }

              private static String hex(byte[] b, int maxBytes) {
                  int n = Math.min(b.length, maxBytes);
                  StringBuilder s = new StringBuilder();

                  for (int i = 0; i < n; i++) {
                      if (i > 0 && (i % 16) == 0) s.append('|');
                      s.append(String.format(Locale.US, "%02X", b[i] & 0xff));
                  }

                  if (b.length > n) {
                      s.append("...TRUNCATED");
                  }

                  return s.toString();
              }

              @Override protected void onDestroy() {
                  try {
                      unregisterReceiver(permissionReceiver);
                  } catch (Exception ignored) {}

                  super.onDestroy();
              }
          }
          JAVA

          # Fail closed: V26 must not contain the proven runtime SET_REPORT/AA trigger.
          JAVA_SRC="$A/app/src/main/java/com/okn/bp1048p4diag/MainActivity.java"

          if grep -n -F 'controlTransfer(0x21' "$JAVA_SRC"; then
            echo "FAIL: host-to-device class control transfer found"
            exit 1
          fi

          if grep -n -F '0x09,' "$JAVA_SRC"; then
            echo "FAIL: HID SET_REPORT request found"
            exit 1
          fi

          if grep -n -F '0xAA' "$JAVA_SRC"; then
            echo "FAIL: FlashBoot AA trigger found"
            exit 1
          fi

          if grep -n -E 'chiperas|bootdat|codedata|constdat|cnfgdat|btupdat|upinfo' "$JAVA_SRC"; then
            echo "FAIL: recovery command found"
            exit 1
          fi

          cat > /tmp/v26/evidence/V26_STATUS.json <<'EOF'
          {
            "version": "26.0",
            "target": "MVSilicon BP1048P4",
            "required_phone": "Samsung Galaxy S25+",
            "required_path": "Samsung Galaxy S25+ -> USB-C cable -> DSP USB-C port only",
            "mode": "read-only diagnostic",
            "runtime_vid_pid": "6324:1719",
            "recovery_vid_pid": "0000:2244",
            "host_to_device_class_transfer_enabled": false,
            "hid_set_report_enabled": false,
            "flashboot_AA_trigger_enabled": false,
            "erase_enabled": false,
            "write_enabled": false,
            "raw_descriptor_read": true,
            "standard_hid_descriptor_read": true,
            "standard_hid_report_descriptor_read": true
          }
          EOF

          SDKMAN="$(command -v sdkmanager || true)"
          if [ -n "$SDKMAN" ]; then
            set +o pipefail
            yes | "$SDKMAN" --licenses >/dev/null 2>&1 || true
            set -o pipefail
            "$SDKMAN" \
              "platforms;android-35" \
              "build-tools;35.0.0" \
              >/dev/null 2>&1 || true
          fi

          cd /tmp/v26
          curl -fL --retry 3 --connect-timeout 15 \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o gradle.zip

          unzip -q gradle.zip
          export PATH="/tmp/v26/gradle-8.9/bin:$PATH"

          cd "$A"
          gradle --no-daemon :app:assembleDebug

          cp \
            "$A/app/build/outputs/apk/debug/app-debug.apk" \
            /tmp/v26/out/OKN_BP1048P4_V26_READ_ONLY_USB_DIAGNOSTIC.apk

          cd "$A"
          zip -9 -r \
            /tmp/v26/out/OKN_BP1048P4_V26_ANDROID_SOURCE.zip \
            . >/dev/null

          cp /tmp/v26/evidence/V26_PURPOSE.txt /tmp/v26/out/
          cp /tmp/v26/evidence/V26_STATUS.json /tmp/v26/out/

          sha256sum /tmp/v26/out/* \
            > /tmp/v26/out/SHA256SUMS.txt

          {
            echo "# BP1048P4 V26 READ-ONLY USB DIAGNOSTIC"
            echo
            echo "- Required path: **Samsung Galaxy S25+ → USB-C → DSP USB-C only**"
            echo "- Host-to-device class transfer: **DISABLED**"
            echo "- HID SET_REPORT: **DISABLED**"
            echo "- FlashBoot AA trigger: **DISABLED**"
            echo "- Erase/write: **DISABLED**"
            echo "- Raw USB descriptor fingerprinting: **ENABLED**"
            echo "- HID descriptor/report-descriptor GET reads: **ENABLED**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload V26 diagnostic APK + source + evidence
        uses: actions/upload-artifact@v7
        with:
          name: OKN-BP1048P4-V26-READ-ONLY-USB-DIAGNOSTIC
          path: /tmp/v26/out/*
          if-no-files-found: error
          retention-days: 90
