name: R145 exact official Windows key IV validation framing static audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R145_EXACT_OFFICIAL_WINDOWS_KEYIV_VALIDATION_FRAMING_STATIC_AUDIT.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r145-official-windows-keyiv-framing-${{ github.ref }}
  cancel-in-progress: true

env:
  FLASH_ALLOWED: "NO"
  R144_RUN_ID: "35977132464"
  R144_JOB_ID: "107560150567"
  R144_ARTIFACT_ID: "10798506585"
  R144_ARTIFACT_NAME: "R144-EXACT-OFFICIAL-WINDOWS-PE32-CONCRETE-KEYIV-PATH-STATIC-EVIDENCE"
  R144_ARTIFACT_DIGEST: "sha256:8855412a7ce2cd5280400d0a706c51ab0c86949a036926965cbd205e508c7fcf"
  WINDOWS_EXE_SHA256: "3ca54171c53f7badd963ffe6851b8b3e2faf8aee8ba2afcb7040990e22ae09b2"
  EXPECTED_KEY_HEX: "ef3259221c86959fd2122f8afb00fb208a42a068d0554a0ee526b8f7d6c844b3"
  EXPECTED_IV_HEX: "617b47f3146321e35d2bf8852ec8cf0d"
  H15_RESOURCE_NAME: "h15IL2i6yy2BZV8RqM.YuRwd1JALC4oy32W66"

jobs:
  static_audit:
    name: STATIC ONLY - corrected key/IV validation + framing audit - no execution - no USB - no board
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r145/r144 /tmp/r145/evidence
          cat > /tmp/r145/evidence/R145_SAFETY.txt <<'EOF'
          R145_MODE=OFFLINE_STATIC_KEYIV_VALIDATION_FRAMING_AUDIT_ONLY
          R145_VENDOR_BINARY_EXECUTED=NO
          R145_WINDOWS_EXE_EXECUTED=NO
          R145_USB_DEVICE_ACCESS=NO
          R145_BOARD_CONTACT=NO
          R145_AA55_SENT=NO
          R145_RUNTIME_0X11_SENT=NO
          R145_RUNTIME_0XFE_SENT=NO
          R145_FLASHBOOT_COMMAND_SENT=NO
          R145_FLASH_READ_EXECUTED=NO
          R145_FLASH_ERASE_EXECUTED=NO
          R145_FLASH_WRITE_EXECUTED=NO
          R145_ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD=NO
          HARDWARE_MODIFICATION=FORBIDDEN
          FLASH_ALLOWED=NO
          EOF

      - name: Download pinned R144 evidence
        uses: actions/download-artifact@v4
        with:
          name: R144-EXACT-OFFICIAL-WINDOWS-PE32-CONCRETE-KEYIV-PATH-STATIC-EVIDENCE
          path: /tmp/r145/r144
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 35977132464

      - name: Verify and extract pinned R144 evidence
        shell: bash
        run: |
          set -euo pipefail
          OUTER="$(find /tmp/r145/r144 -maxdepth 2 -type f -name 'R144_EXACT_OFFICIAL_WINDOWS_PE32_CONCRETE_KEYIV_PATH_STATIC_EVIDENCE.zip' -print -quit)"
          test -n "$OUTER"
          sha256sum "$OUTER" > /tmp/r145/evidence/R145_R144_INNER_ZIP.sha256
          unzip -q "$OUTER" -d /tmp/r145/evidence/r144
          test -s /tmp/r145/evidence/r144/R144_PE32_CONCRETE_KEYIV_PATH.json
          test -s /tmp/r145/evidence/r144/R144_H15_FRAMING_STATIC_ANALYSIS.json
          test -s /tmp/r145/evidence/r144/r143/R143_N9_METHOD.il
          test -s /tmp/r145/evidence/r144/r143/r142/r141/r140/R140_FIXED_FULL.il
          test -s /tmp/r145/evidence/r144/r143/r142/R142_RESOURCE_PROXY_MAP_STATIC_ANALYSIS.json
          test -s /tmp/r145/evidence/r144/r143/r142/R142_EXTRACTED_MANAGED_RESOURCES/02_h15IL2i6yy2BZV8RqM.YuRwd1JALC4oy32W66.bin
          grep -F '"FLASH_ALLOWED": false' /tmp/r145/evidence/r144/R144_DECISION.json

      - name: Correct R144 wrapper validator from actual IL body
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,json,hashlib

          ev=Path('/tmp/r145/evidence')
          r144=json.loads((ev/'r144/R144_PE32_CONCRETE_KEYIV_PATH.json').read_text())
          full=(ev/'r144/r143/r142/r141/r140/R140_FIXED_FULL.il').read_text(errors='replace')

          def method_block(name):
              # Match exact end marker, then walk back to the closest .method.
              marker=f'// end of method q71r2Rj8SiD9GF1BI50::{name}'
              end=full.find(marker)
              if end < 0:
                  return None
              start=full.rfind('\n\t.method ',0,end)
              if start < 0:
                  start=full.rfind('\n.method ',0,end)
              if start < 0:
                  return None
              return full[start:end+len(marker)]

          wrappers={}
          names=[
            'gH6uphNOsYQyRXDZmHu',
            'oNNQE6NTi9uesXTTGZJ',
            'B5fr4WNvBYuVpLZQQQQ',
            'YoMYlpKfA3xZZIkL5Uo',
            'sWg0PuN2fLSfxi2LB0D',
            'qfkv4ZNDynVciIciQy6',
            'VnHlfpNorSGR6U9GUOp',
            'RMHoOvNN1BGBrZfKGy1',
            'it3eekNKjtbEQVI5up2',
            'HVJrNANRJZcM7WNOuLw',
            'Q2CVcdNXO7dpP5ufbGy',
            'trEuKPNkgB3p5fLuROn',
          ]
          for name in names:
              b=method_block(name)
              wrappers[name]={
                  'present':bool(b),
                  'sha256':hashlib.sha256(b.encode()).hexdigest() if b else None,
                  'body':b[:5000] if b else None
              }

          checks={
            'get_manifest_resource_stream':bool(re.search(
                r'Assembly::GetManifestResourceStream\(string\)', wrappers['gH6uphNOsYQyRXDZmHu']['body'] or '')),
            'base_stream':bool(re.search(
                r'BinaryReader::get_BaseStream\(\)', wrappers['oNNQE6NTi9uesXTTGZJ']['body'] or '')),
            'stream_length':bool(re.search(
                r'Stream::get_Length\(\)', wrappers['B5fr4WNvBYuVpLZQQQQ']['body'] or '')),
            'stream_position':bool(re.search(
                r'Stream::get_Position\(\)', wrappers['YoMYlpKfA3xZZIkL5Uo']['body'] or '')),
            'binaryreader_readbytes':bool(re.search(
                r'BinaryReader::ReadBytes\(int32\)', wrappers['sWg0PuN2fLSfxi2LB0D']['body'] or '')),
            'binaryreader_readint32':bool(re.search(
                r'BinaryReader::ReadInt32\(\)', full)),
            'create_decryptor':bool(re.search(
                r'SymmetricAlgorithm::CreateDecryptor\(uint8\[\], uint8\[\]\)',
                wrappers['VnHlfpNorSGR6U9GUOp']['body'] or '')),
            'stream_write':bool(re.search(
                r'Stream::Write\(uint8\[\], int32, int32\)',
                wrappers['RMHoOvNN1BGBrZfKGy1']['body'] or '')),
            'flush_final_block':bool(re.search(
                r'CryptoStream::FlushFinalBlock\(\)',
                wrappers['it3eekNKjtbEQVI5up2']['body'] or '')),
            'memorystream_to_array':bool(re.search(
                r'MemoryStream::ToArray\(\)',
                wrappers['HVJrNANRJZcM7WNOuLw']['body'] or '')),
            'cipher_mode_setter':bool(re.search(
                r'SymmetricAlgorithm::set_Mode',
                wrappers['Q2CVcdNXO7dpP5ufbGy']['body'] or '')),
            'symmetric_algorithm_factory':bool(re.search(
                r'::t2QjAoPE2q\(\)',
                wrappers['trEuKPNkgB3p5fLuROn']['body'] or '')),
          }

          key_ok=(r144.get('key_hex')==__import__('os').environ['EXPECTED_KEY_HEX'] and r144.get('key_length')==32)
          iv_ok=(r144.get('iv_hex')==__import__('os').environ['EXPECTED_IV_HEX'] and r144.get('iv_length')==16)
          alias_ok=all([
              r144.get('key_alias_local17_to_local47'),
              r144.get('iv_alias_local100_to_local8'),
              r144.get('create_decryptor_callsite_uses_local47_local8'),
          ])
          wrapper_ok=checks['create_decryptor']
          corrected=bool(key_ok and iv_ok and alias_ok and wrapper_ok)

          out={
              'r144_original_wrapper_boolean':r144.get('wrapper_calls_SymmetricAlgorithm_CreateDecryptor'),
              'r144_original_keyiv_boolean':False,
              'validator_bug':'R144 searched the whole IL for an overly specific text form and returned false although the VnH wrapper body directly calls SymmetricAlgorithm::CreateDecryptor(uint8[], uint8[]).',
              'wrapper_semantic_checks':checks,
              'wrapper_bodies':wrappers,
              'key_exact_match':key_ok,
              'iv_exact_match':iv_ok,
              'alias_and_callsite_match':alias_ok,
              'create_decryptor_wrapper_body_match':wrapper_ok,
              'PE32_CREATEDECRYPTOR_KEYIV_STATICALLY_RECOVERED_CORRECTED':corrected,
              'key_hex':r144.get('key_hex'),
              'iv_hex':r144.get('iv_hex'),
              'path_state_count_to_crypto':r144.get('path_state_count_to_crypto'),
              'path_reaches_crypto_state_402':r144.get('path_reaches_crypto_state_402'),
              'important_interpretation':'The corrected conclusion is limited to static reconstruction of the PE32 protector key/IV and their CreateDecryptor call linkage. It is not a claim that the encrypted h15 payload has been decrypted or that production USB behavior is proven.'
          }
          (ev/'R145_CORRECTED_KEYIV_VALIDATION.json').write_text(json.dumps(out,indent=2)+'\n')
          if not corrected:
              raise SystemExit('corrected key/IV proof did not pass')
          PY

      - name: Audit exact h15 CLR resource framing and crypto-stream semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,struct,hashlib,re,math,collections

          ev=Path('/tmp/r145/evidence')
          resources=json.loads((ev/'r144/r143/r142/R142_RESOURCE_PROXY_MAP_STATIC_ANALYSIS.json').read_text())
          full=(ev/'r144/r143/r142/r141/r140/R140_FIXED_FULL.il').read_text(errors='replace')
          n9=(ev/'r144/r143/R143_N9_METHOD.il').read_text(errors='replace')
          h15p=ev/'r144/r143/r142/R142_EXTRACTED_MANAGED_RESOURCES/02_h15IL2i6yy2BZV8RqM.YuRwd1JALC4oy32W66.bin'
          h15=h15p.read_bytes()
          blob=(ev/'r144/r143/r142/r141/R141_FIXED_MANAGED_RESOURCE_BLOB.bin').read_bytes()

          hentry=next(e for e in resources['resources'] if e['name']=='h15IL2i6yy2BZV8RqM.YuRwd1JALC4oy32W66')
          off=hentry['offset']
          declared=struct.unpack_from('<I',blob,off)[0]
          prefix=blob[off:off+4]
          payload_from_blob=blob[off+4:off+4+declared]

          # Exact wrapper semantics, not inferred names.
          facts={
            'manifest_resource_wrapper_calls_GetManifestResourceStream':bool(re.search(
                r'Assembly::GetManifestResourceStream\(string\)',full)),
            'custom_reader_constructs_BinaryReader_over_Stream':bool(re.search(
                r'newobj instance void \[mscorlib\]System\.IO\.BinaryReader::\.ctor\(class \[mscorlib\]System\.IO\.Stream\)',full)),
            'readbytes_wrapper_calls_BinaryReader_ReadBytes':bool(re.search(
                r'BinaryReader::ReadBytes\(int32\)',full)),
            'readint32_wrapper_calls_BinaryReader_ReadInt32':bool(re.search(
                r'BinaryReader::ReadInt32\(\)',full)),
            'crypto_write_wrapper_calls_Stream_Write':bool(re.search(
                r'Stream::Write\(uint8\[\], int32, int32\)',full)),
            'crypto_finalize_wrapper_calls_FlushFinalBlock':bool(re.search(
                r'CryptoStream::FlushFinalBlock\(\)',full)),
            'crypto_output_wrapper_calls_MemoryStream_ToArray':bool(re.search(
                r'MemoryStream::ToArray\(\)',full)),
            'n9_constructs_CryptoStream_Write_mode':bool(re.search(
                r'CryptoStream::\.ctor\(class \[mscorlib\]System\.IO\.Stream, class \[mscorlib\]System\.Security\.Cryptography\.ICryptoTransform, valuetype \[mscorlib\]System\.Security\.Cryptography\.CryptoStreamMode\)',
                n9)),
          }

          # Important distinction: R144's regex proves callsite shapes exist but not
          # complete runtime order through all data-dependent branches of the flattened state machine.
          callsites={
            'get_resource_literal_count':n9.count('h15IL2i6yy2BZV8RqM.YuRwd1JALC4oy32W66'),
            'ReadBytes_wrapper_call_count':n9.count('::sWg0PuN2fLSfxi2LB0D('),
            'ReadInt32_wrapper_call_count':n9.count('::qfkv4ZNDynVciIciQy6('),
            'CreateDecryptor_wrapper_call_count':n9.count('::VnHlfpNorSGR6U9GUOp('),
            'StreamWrite_wrapper_call_count':n9.count('::RMHoOvNN1BGBrZfKGy1('),
            'FlushFinalBlock_wrapper_call_count':n9.count('::it3eekNKjtbEQVI5up2('),
          }

          def entropy(b):
              if not b:return 0.0
              c=collections.Counter(b); n=len(b)
              return -sum((v/n)*math.log2(v/n) for v in c.values())

          out={
              'h15_manifest_offset':off,
              'h15_length_prefix_hex':prefix.hex(),
              'h15_declared_length_from_prefix':declared,
              'h15_extracted_payload_length':len(h15),
              'h15_payload_matches_managed_blob_exactly':payload_from_blob==h15,
              'h15_sha256':hashlib.sha256(h15).hexdigest(),
              'h15_entropy':round(entropy(h15),4),
              'h15_mod_16':len(h15)%16,
              'h15_plus_4byte_cli_prefix_mod_16':(len(h15)+4)%16,
              'wrapper_semantic_facts':facts,
              'n9_callsite_counts':callsites,
              'DIRECT_AES_CBC_DECRYPTION_AUTHORIZED_BY_STATIC_FRAMING':False,
              'WHY_DIRECT_DECRYPTION_NOT_YET_AUTHORIZED':'The exact embedded payload length is 607967 (mod16=15). Static IL confirms CreateDecryptor/CryptoStream plumbing, but the flattened method still contains data-dependent control flow. The current evidence does not prove which exact byte slice reaches TransformFinalBlock; adding/removing bytes would be a guess.',
              'NEXT_STATIC_TARGET':'Perform data-aware static execution of the N9 flattened state machine using the known embedded resource bytes only, tracking BinaryReader BaseStream position, ReadInt32/ReadBytes operations, and crypto input slice. No vendor code execution and no USB.'
          }
          (ev/'R145_H15_RESOURCE_FRAMING_AUDIT.json').write_text(json.dumps(out,indent=2)+'\n')
          if not out['h15_payload_matches_managed_blob_exactly']:
              raise SystemExit('h15 payload extraction mismatch')
          PY

      - name: Build fail-closed R145 decision and report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          ev=Path('/tmp/r145/evidence')
          k=json.loads((ev/'R145_CORRECTED_KEYIV_VALIDATION.json').read_text())
          f=json.loads((ev/'R145_H15_RESOURCE_FRAMING_AUDIT.json').read_text())

          decision={
            'R144_RUN_ID':35977132464,
            'R144_JOB_ID':107560150567,
            'R144_ARTIFACT_ID':10798506585,
            'R144_ARTIFACT_DIGEST':'sha256:8855412a7ce2cd5280400d0a706c51ab0c86949a036926965cbd205e508c7fcf',
            'R144_VALIDATOR_FALSE_NEGATIVE_CONFIRMED':True,
            'PE32_CREATEDECRYPTOR_KEYIV_STATICALLY_RECOVERED':k['PE32_CREATEDECRYPTOR_KEYIV_STATICALLY_RECOVERED_CORRECTED'],
            'PE32_KEY_HEX':k['key_hex'],
            'PE32_IV_HEX':k['iv_hex'],
            'CREATEDECRYPTOR_WRAPPER_BODY_PROVEN':k['create_decryptor_wrapper_body_match'],
            'H15_DECLARED_LENGTH':f['h15_declared_length_from_prefix'],
            'H15_EXTRACTED_LENGTH':f['h15_extracted_payload_length'],
            'H15_PAYLOAD_MATCHES_CLR_RESOURCE_BLOB':f['h15_payload_matches_managed_blob_exactly'],
            'H15_MOD_16':f['h15_mod_16'],
            'DIRECT_AES_CBC_DECRYPTION_AUTHORIZED_BY_STATIC_FRAMING':False,
            'H15_PLAINTEXT_RECOVERED':False,
            'PROTECTED_HID_METHOD_BODIES_RECOVERED':False,
            'PRODUCTION_VIDPID_RECOVERED_FROM_PROTECTED_METHOD_BODIES':False,
            'OFFICIAL_WINDOWS_PRODUCTION_USBHID_LINKAGE_STATICALLY_PROVEN':False,
            'READ_ONLY_IDENTIFY_PATH_STATICALLY_PROVEN_FOR_PRODUCTION':False,
            'SAFE_READ_ONLY_STOCK_BACKUP_PROVEN':False,
            'PRODUCTION_BOOTSTRAP_BRIDGE_PROVEN':False,
            'PRODUCTION_RECOVERY_USB_IDENTITY_PROVEN':False,
            'ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD':False,
            'AA55_LIVE_RETEST_ALLOWED':False,
            'RUNTIME_0X11_ALLOWED':False,
            'RUNTIME_0XFE_ALLOWED':False,
            'VENDOR_BINARY_EXECUTED':False,
            'USB_DEVICE_ACCESSED':False,
            'BOARD_CONTACTED':False,
            'FLASH_ALLOWED':False,
            'NEXT':'Data-aware static execution of N9 using only the embedded h15 bytes: track stream position and exact bytes consumed by BinaryReader wrappers until the CreateDecryptor/CryptoStream path yields a proven block-aligned ciphertext slice. Do not guess padding or framing.'
          }
          (ev/'R145_DECISION.json').write_text(json.dumps(decision,indent=2)+'\n')
          (ev/'R145_REPORT_TH.md').write_text(
              '# R145 corrected key/IV validation + h15 framing audit\n\n'
              f'- R144 validator false-negative: {decision["R144_VALIDATOR_FALSE_NEGATIVE_CONFIRMED"]}\n'
              f'- PE32 key/IV statically recovered: {decision["PE32_CREATEDECRYPTOR_KEYIV_STATICALLY_RECOVERED"]}\n'
              f'- key: {decision["PE32_KEY_HEX"]}\n'
              f'- IV: {decision["PE32_IV_HEX"]}\n'
              f'- CreateDecryptor wrapper body proven: {decision["CREATEDECRYPTOR_WRAPPER_BODY_PROVEN"]}\n'
              f'- h15 exact length/mod16: {decision["H15_EXTRACTED_LENGTH"]}/{decision["H15_MOD_16"]}\n'
              f'- h15 payload matches CLR resource blob: {decision["H15_PAYLOAD_MATCHES_CLR_RESOURCE_BLOB"]}\n'
              '- direct AES-CBC decryption remains blocked until exact input framing is statically proven\n\n'
              'FLASH_ALLOWED=NO\n')
          print(json.dumps(decision,indent=2))
          PY

      - name: Package R145 evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r145/evidence
          zip -9 -r /tmp/R145_EXACT_OFFICIAL_WINDOWS_KEYIV_VALIDATION_FRAMING_STATIC_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/R145_EXACT_OFFICIAL_WINDOWS_KEYIV_VALIDATION_FRAMING_STATIC_EVIDENCE.zip > /tmp/R145_EXACT_OFFICIAL_WINDOWS_KEYIV_VALIDATION_FRAMING_STATIC_EVIDENCE.zip.sha256

      - name: Upload R145 evidence
        uses: actions/upload-artifact@v4
        with:
          name: R145-EXACT-OFFICIAL-WINDOWS-KEYIV-VALIDATION-FRAMING-STATIC-EVIDENCE
          path: |
            /tmp/R145_EXACT_OFFICIAL_WINDOWS_KEYIV_VALIDATION_FRAMING_STATIC_EVIDENCE.zip
            /tmp/R145_EXACT_OFFICIAL_WINDOWS_KEYIV_VALIDATION_FRAMING_STATIC_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'R145_VENDOR_BINARY_EXECUTED=NO' /tmp/r145/evidence/R145_SAFETY.txt
          grep -F 'R145_WINDOWS_EXE_EXECUTED=NO' /tmp/r145/evidence/R145_SAFETY.txt
          grep -F 'R145_USB_DEVICE_ACCESS=NO' /tmp/r145/evidence/R145_SAFETY.txt
          grep -F 'R145_BOARD_CONTACT=NO' /tmp/r145/evidence/R145_SAFETY.txt
          grep -F 'R145_AA55_SENT=NO' /tmp/r145/evidence/R145_SAFETY.txt
          grep -F 'R145_RUNTIME_0X11_SENT=NO' /tmp/r145/evidence/R145_SAFETY.txt
          grep -F 'R145_RUNTIME_0XFE_SENT=NO' /tmp/r145/evidence/R145_SAFETY.txt
          grep -F '"PE32_CREATEDECRYPTOR_KEYIV_STATICALLY_RECOVERED": true' /tmp/r145/evidence/R145_DECISION.json
          grep -F '"DIRECT_AES_CBC_DECRYPTION_AUTHORIZED_BY_STATIC_FRAMING": false' /tmp/r145/evidence/R145_DECISION.json
          grep -F '"FLASH_ALLOWED": false' /tmp/r145/evidence/R145_DECISION.json
          echo R145_KEYIV_VALIDATION_FRAMING_STATIC_AUDIT_COMPLETE=YES
          echo FLASH_ALLOWED=NO
