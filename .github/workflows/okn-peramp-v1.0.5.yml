      - name: Validate verified protocol and UI gates
        shell: bash
        run: |
          set -euo pipefail
          BLE=app/src/main/java/com/okn/peramp/BleClient.java
          DSP=app/src/main/java/com/okn/peramp/DspProtocol.java
          UI=app/src/main/java/com/okn/peramp/MainActivity.java

          grep -q '0000ab00-0000-1000-8000-00805f9b34fb' "$BLE"
          grep -q '0000ab01-0000-1000-8000-00805f9b34fb' "$BLE"
          grep -q '0000ab02-0000-1000-8000-00805f9b34fb' "$BLE"
          grep -q 'WRITE_TYPE_NO_RESPONSE' "$BLE"
          grep -q '631C062443FD3844558001F3EDA0CCF8' "$DSP"
          grep -q '661C0624' "$DSP"
          grep -q 'AES/CFB8/NoPadding' "$DSP"
          grep -q '2AAF948632A59FF8F2B23E6E4193FD21' "$DSP"
          grep -q '10E7D2F443924938A28D759BAC0E9E22' "$DSP"
          grep -q 'static final int\[\] VERIFIED_SCALARS = {2, 3, 8, 9, 10, 13, 11}' "$DSP"
          grep -q 'static final int\[\] EQ_IDS = {4, 5, 6, 14, 15, 16, 17}' "$DSP"
          grep -q 'EQ_RECORD_BYTES = 48' "$DSP"
          grep -q 'ByteBuffer.allocate(9 + data.length)' "$DSP"
          grep -q 'ByteOrder.LITTLE_ENDIAN' "$DSP"
          grep -q 'TrebleBoost ID11 remains WRITE LOCKED' "$DSP"
          grep -q 'V105 SCALAR PRECHECK' "$DSP"
          grep -q 'V105 EQ PRECHECK' "$DSP"
          grep -q 'WRITE_PRECHECK' "$DSP"
          grep -q 'WRITE_VERIFY' "$DSP"
          grep -q 'ROLLBACK_VERIFY' "$DSP"
          grep -q 'V105 ROLLBACK VERIFIED' "$DSP"
          grep -q 'V105 SAVE PRECHECK' "$DSP"
          grep -q 'V105 SAVE VERIFIED' "$DSP"
          grep -q 'strict production safe-PEQ baseline' "$DSP"
          grep -q 'final class GuardedTxn' "$DSP"
          grep -q 'RAM_DIRTY=true' "$DSP"
          grep -q 'versionCode 5' app/build.gradle
          grep -q "versionName '1.0.5'" app/build.gradle

          if grep -q 'scalarValues.put(id, v);' "$DSP"; then
            echo "Unexpected optimistic scalar cache write found" >&2
            exit 1
          fi

          if grep -RqiE 'TX 59|SVC_HERA|SVC_FFE|profile=AUTO' app/src/main/java/com/okn/peramp; then
            echo 'ERROR: legacy guessed transport marker found'
            grep -RniE 'TX 59|SVC_HERA|SVC_FFE|profile=AUTO' app/src/main/java/com/okn/peramp || true
            exit 1
          fi

          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          s=Path('app/src/main/java/com/okn/peramp/MainActivity.java').read_text(encoding='utf-8')
          m=re.search(r'DEFAULT_FREQS = \{([^}]*)\}', s)
          assert m, 'DEFAULT_FREQS not found'
          bands=[x.strip() for x in m.group(1).split(',') if x.strip()]
          assert len(bands)==15, f'expected 15 EQ bands, got {len(bands)}'
          m=re.search(r'CHANNEL_NAMES = \{([^}]*)\}', s)
          assert m, 'CHANNEL_NAMES not found'
          channels=re.findall(r'"([^"]+)"', m.group(1))
          assert channels == ['CH1 LEFT','CH2 RIGHT','CH3 BASS','CH4','CH5','CH6','CH7'], channels
          for page in ['HOME','BLUETOOTH','MASTER','CHANNEL','15-BAND EQ','X-OVER','DELAY','EFFECTS','PRESET','DRC','REVERB','PROTOCOL']:
              assert f'"{page}"' in s, page

          # Re-check the previously captured real-device authentication vector.
          auth32=bytes.fromhex('D024E38C00000000420DA6E8FDDF06895D514A274A2181DEB2F457CA70A60EC1')
          key='2AAF948632A59FF8F2B23E6E4193FD21'
          iv='01'*16
          p=subprocess.run(['openssl','enc','-aes-128-cfb8','-d','-K',key,'-iv',iv,'-nopad'], input=auth32[8:], stdout=subprocess.PIPE, check=True).stdout
          assert p.hex().upper() == '060708080D07405C0168DEEB916838D752E0D696BB3655E6', p.hex()
          rand=p[8:]
          c=subprocess.run(['openssl','enc','-aes-128-cfb8','-e','-K',rand.hex(),'-iv',iv,'-nopad'], input=bytes.fromhex('661C0624'), stdout=subprocess.PIPE, check=True).stdout
          assert c.hex().upper() == '5DFCB7E5', c.hex()
          print('Protocol vector: PASS; 661C0624 -> 5DFCB7E5')
          print('EQ bands:', len(bands), 'channels:', len(channels))
          print('Generated project validation: PASS')
          PY

      - name: Build debug APK
        id: apk_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p dist
          gradle --version | tee dist/gradle-version.txt
          gradle --no-daemon --stacktrace --warning-mode all clean assembleDebug 2>&1 | tee dist/build.log

      - name: Verify APK
        if: steps.apk_build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" dist/OKN-Peramp-v1.0.5-debug.apk
          AAPT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/build-tools/35.0.0/aapt2"
          "$AAPT" dump badging "$APK" | tee dist/apk-badging.txt
          grep -q "package: name='com.okn.peramp.debug'" dist/apk-badging.txt
          grep -q "versionCode='5'" dist/apk-badging.txt
          grep -q "versionName='1.0.5-debug'" dist/apk-badging.txt
          grep -q "application-label:'OKN Peramp'" dist/apk-badging.txt
          sha256sum dist/OKN-Peramp-v1.0.5-debug.apk | tee dist/SHA256SUMS.txt

      - name: Package generated source
        if: steps.apk_build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          zip -qr dist/OKN-Peramp-v1.0.5-source.zip settings.gradle build.gradle gradle.properties EXTRACTED_REFERENCE.md app -x 'app/build/*'
          sha256sum dist/OKN-Peramp-v1.0.5-source.zip >> dist/SHA256SUMS.txt
          ls -lh dist

      - name: Upload OKN Peramp v1.0.5
        if: steps.apk_build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: OKN-Peramp-v1.0.5
          path: |
            dist/OKN-Peramp-v1.0.5-debug.apk
            dist/OKN-Peramp-v1.0.5-source.zip
            dist/SHA256SUMS.txt
            dist/apk-badging.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OKN-Peramp-v1.0.5-build-diagnostics
          path: |
            dist/ci-context.txt
            dist/build.log
            dist/gradle-version.txt
            dist/apk-badging.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Write workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "# OKN Peramp v1.0.5"
            echo
            if [ -s dist/OKN-Peramp-v1.0.5-debug.apk ]; then
              echo "✅ APK generated and package/version verification passed."
              echo "Artifact: **OKN-Peramp-v1.0.5**"
              echo "Protocol: verified AB00/Auth16/AES-CFB8/UFE core"
            else
              echo "❌ APK was not generated."
              echo "Download **OKN-Peramp-v1.0.5-build-diagnostics** and inspect build.log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail workflow if APK build failed
        if: steps.apk_build.outcome != 'success'
        shell: bash
        run: exit 1
