# OKN Peramp v1.0.5 - guarded production writer + verified GoloPine protocol
# Single-file workflow: save as .github/workflows/okn-peramp.yml and commit/push.
# v1.0.5 preserves the proven v1.0.4 transport and adds fresh-readback guarded scalar/EQ writes, rollback and guarded manual SaveParams.
name: Build OKN Peramp

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - ".github/workflows/okn-peramp.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare diagnostics
        shell: bash
        run: |
          mkdir -p dist
          {
            echo "OKN Peramp v1.0.5 CI diagnostics"
            echo "UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Runner: ${RUNNER_OS:-unknown} ${RUNNER_ARCH:-unknown}"
            echo "Commit: ${GITHUB_SHA:-unknown}"
          } > dist/ci-context.txt

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android 35 SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          sdkmanager --list_installed | grep -E "platforms;android-35|build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

