name: R107 BP10xx HID thunk and BP10 embedded loader static reverse

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R107_BP10XX_HID_THUNK_BP10_LOADER_STATIC_REVERSE.yml"

permissions:
  contents: read

concurrency:
  group: r107-bp10xx-hid-thunk-loader-${{ github.ref }}
  cancel-in-progress: true

env:
  DRIVE_FILE_ID: 15hdF2vnnUMVtIFKhZPGLPwBSEZpyqP2H
  SOURCE_ZIP: MVAssistant_BP10xx_V1.8.11.zip
  EXPECTED_ZIP_SHA256: 8074b3488453e268dc755fa88b2d0bc8ef14fc8c51c3de4e3a783279c195878f
  EXPECTED_EXE_SHA256: a62a968f6e9dc06473390ec26d8e1a6ad70d88c242f05acb2463e5081ec12799
  FLASH_ALLOWED: "NO"

jobs:
  static-reverse:
    name: STATIC ONLY - NO EXECUTION - NO USB - NO BOARD - NO FLASH
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r107/input /tmp/r107/extract /tmp/r107/evidence
          cat > /tmp/r107/evidence/R107_SAFETY.txt <<'EOF'
          R107_MODE=STATIC_OFFLINE_ONLY
          R107_VENDOR_BINARY_EXECUTED=NO
          R107_USB_DEVICE_ACCESS=NO
          R107_BOARD_CONTACT=NO
          R107_AA55_SENT=NO
          R107_LINEIN_AA55_SENT=NO
          R107_RUNTIME_0X11_SENT=NO
          R107_SEND_CHIPERAS_CODEDATA_BOOTDAT_CONSTDAT_CNFGDAT_BTUPDAT_UPINFO_CXXX=NO
          R107_FLASH_READ_EXECUTED=NO
          R107_FLASH_ERASE_EXECUTED=NO
          R107_FLASH_WRITE_EXECUTED=NO
          R107_ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BP1048P4=NO
          R107_VENDOR_EMBEDDED_BLOB_EXECUTED=NO
          FINAL_REQUIRED_TRANSPORT=SAMSUNG_S25_PLUS_USB_C_DIRECT_TO_DSP_USB_C
          HARDWARE_MODIFICATION=FORBIDDEN
          FLASH_ALLOWED=NO
          EOF

      - name: Install static tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq file unzip python3-pip jq >/dev/null
          python3 -m pip install --disable-pip-version-check --no-input gdown pefile capstone >/dev/null

      - name: Acquire exact pinned EXE
        shell: bash
        run: |
          set -euo pipefail
          ZIP="/tmp/r107/input/$SOURCE_ZIP"
          python3 -m gdown "$DRIVE_FILE_ID" -O "$ZIP" >/tmp/r107/evidence/R107_GDOWN_STDOUT.txt 2>/tmp/r107/evidence/R107_GDOWN_STDERR.txt || true
          if [ ! -s "$ZIP" ]; then
            curl --fail --location --retry 3 --retry-all-errors \
              "https://drive.usercontent.google.com/download?id=$DRIVE_FILE_ID&export=download&confirm=t" \
              -o "$ZIP"
          fi
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = "$EXPECTED_ZIP_SHA256"
          unzip -q "$ZIP" -d /tmp/r107/extract
          EXE="$(find /tmp/r107/extract -type f -name 'MVAssistant_BP10xx_V1.8.11.exe' -print -quit)"
          test -n "$EXE"
          test "$(sha256sum "$EXE" | awk '{print $1}')" = "$EXPECTED_EXE_SHA256"
          chmod a-x "$EXE" || true
          cp "$EXE" /tmp/r107/input/MVAssistant.exe
          {
            echo "ZIP_SHA256=$EXPECTED_ZIP_SHA256"
            echo "EXE_SHA256=$EXPECTED_EXE_SHA256"
            echo "EXE_SIZE=$(stat -c '%s' "$EXE")"
            echo "PIN_MATCH=YES"
          } > /tmp/r107/evidence/R107_BINARY_PIN.txt

      - name: Resolve import thunks and exact ReadFile WriteFile callsites
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import pefile, json, bisect
          from capstone import Cs, CS_ARCH_X86, CS_MODE_32
          from capstone.x86 import X86_OP_MEM, X86_OP_IMM

          p=Path("/tmp/r107/input/MVAssistant.exe")
          pe=pefile.PE(str(p), fast_load=False)
          b=p.read_bytes(); ib=pe.OPTIONAL_HEADER.ImageBase

          iat={}
          for ent in getattr(pe,"DIRECTORY_ENTRY_IMPORT",[]):
              dll=ent.dll.decode(errors="replace")
              for imp in ent.imports:
                  name=imp.name.decode(errors="replace") if imp.name else f"ord:{imp.ordinal}"
                  iat[imp.address]=f"{dll}!{name}"

          text=next(s for s in pe.sections if s.Name.rstrip(b"\0")==b".text")
          blob=b[text.PointerToRawData:text.PointerToRawData+text.SizeOfRawData]
          base=ib+text.VirtualAddress
          md=Cs(CS_ARCH_X86,CS_MODE_32); md.detail=True
          ins=list(md.disasm(blob,base))
          byaddr={x.address:x for x in ins}
          addrs=[x.address for x in ins]

          # Import-thunk map: entry instruction that jmp/call [absolute IAT].
          thunks={}
          direct_iat_calls=[]
          for x in ins:
              if not x.operands: continue
              op=x.operands[0]
              if op.type==X86_OP_MEM and op.mem.base==0 and op.mem.index==0:
                  ptr=op.mem.disp & 0xffffffff
                  if ptr in iat:
                      if x.mnemonic=="jmp":
                          thunks[x.address]=iat[ptr]
                      elif x.mnemonic=="call":
                          direct_iat_calls.append({"site":x.address,"import":iat[ptr]})

          # Direct calls to local thunks.
          resolved=[]
          for x in ins:
              if x.mnemonic!="call" or not x.operands: continue
              op=x.operands[0]
              if op.type==X86_OP_IMM:
                  target=op.imm & 0xffffffff
                  if target in thunks:
                      resolved.append({"site":x.address,"thunk":target,"import":thunks[target]})

          interesting_imports=[
              "KERNEL32.dll!ReadFile","KERNEL32.dll!WriteFile","KERNEL32.dll!WaitForSingleObject",
              "KERNEL32.dll!WaitForSingleObjectEx","KERNEL32.dll!ResetEvent","KERNEL32.dll!SetEvent",
              "KERNEL32.dll!CreateEventW","KERNEL32.dll!CancelIo","KERNEL32.dll!GetLastError",
              "KERNEL32.dll!CreateFileW","KERNEL32.dll!CreateFileA","KERNEL32.dll!DeviceIoControl"
          ]
          io=[x for x in direct_iat_calls+resolved if x["import"] in interesting_imports]

          Path("/tmp/r107/evidence/R107_IMPORT_THUNK_MAP.json").write_text(
              json.dumps([{"thunk":k,"import":v} for k,v in sorted(thunks.items())],indent=2)+"\n")
          Path("/tmp/r107/evidence/R107_RESOLVED_IO_CALLS.json").write_text(json.dumps(io,indent=2)+"\n")

          # Exact fixed local targets seen in R106.
          targets=[0x436390,0x436398,0x4363c0,0x4363e8,0x408494,0x408620,0x408714,0x409a08,0x409940]
          out=[]
          for va in targets:
              idx=bisect.bisect_left(addrs,va)
              out.append(f"===== target 0x{va:08X} =====")
              for x in ins[max(0,idx-8):min(len(ins),idx+80)]:
                  mark=">>" if x.address==va else "  "
                  resolved_name=""
                  if x.mnemonic in ("call","jmp") and x.operands:
                      op=x.operands[0]
                      if op.type==X86_OP_IMM and (op.imm&0xffffffff) in thunks:
                          resolved_name=" ; "+thunks[op.imm&0xffffffff]
                      elif op.type==X86_OP_MEM and op.mem.base==0 and op.mem.index==0 and (op.mem.disp&0xffffffff) in iat:
                          resolved_name=" ; "+iat[op.mem.disp&0xffffffff]
                  out.append(f"{mark} 0x{x.address:08X}: {x.mnemonic:8s} {x.op_str}{resolved_name}")
              out.append("")
          Path("/tmp/r107/evidence/R107_FIXED_TARGET_DISASM.txt").write_text("\n".join(out)+"\n")

          print("IMPORT_THUNK_COUNT",len(thunks))
          print("INTERESTING_IO_CALL_COUNT",len(io))
          for va in [0x436390,0x436398,0x4363c0,0x4363e8]:
              print(f"TARGET_{va:08X}={thunks.get(va,'NOT_DIRECT_THUNK')}")
          PY

      - name: Recover HID Read Send helper semantics and report lengths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import pefile,json,bisect,re
          from capstone import Cs,CS_ARCH_X86,CS_MODE_32

          p=Path("/tmp/r107/input/MVAssistant.exe")
          pe=pefile.PE(str(p),fast_load=False); b=p.read_bytes(); ib=pe.OPTIONAL_HEADER.ImageBase
          s=next(x for x in pe.sections if x.Name.rstrip(b"\0")==b".text")
          md=Cs(CS_ARCH_X86,CS_MODE_32); md.detail=False
          ins=list(md.disasm(b[s.PointerToRawData:s.PointerToRawData+s.SizeOfRawData],ib+s.VirtualAddress))
          addrs=[x.address for x in ins]

          def dump(start,max_ins=700):
              i=bisect.bisect_left(addrs,start)
              out=[]; seen_start=False
              for x in ins[i:i+max_ins]:
                  if x.address<start: continue
                  out.append(f"0x{x.address:08X}: {x.mnemonic:8s} {x.op_str}")
                  if x.mnemonic=="ret" and len(out)>10: break
              return out

          helpers={
            "HID_READ_HELPER_0x408494":dump(0x408494),
            "HID_SEND_HELPER_0x408620":dump(0x408620),
            "HID_CONNECT_HELPER_0x408714":dump(0x408714),
            "HID_ASYNC_0x409A08":dump(0x409A08),
          }
          text=[]
          for name,lines in helpers.items():
              text.append("===== "+name+" ====="); text.extend(lines); text.append("")
          Path("/tmp/r107/evidence/R107_HID_HELPERS_FULL_DISASM.txt").write_text("\n".join(text)+"\n")

          # Extract globals likely HIDP_CAPS report lengths from helper assembly.
          refs={}
          for name,lines in helpers.items():
              hits=[]
              for line in lines:
                  if re.search(r"\[0xeaa1e[0-9a-f]\]",line,re.I):
                      hits.append(line)
              refs[name]=hits
          Path("/tmp/r107/evidence/R107_HID_REPORT_LENGTH_GLOBAL_REFS.json").write_text(
              json.dumps(refs,indent=2)+"\n"
          )
          PY

      - name: Confirm static PC-to-dongle handshake construction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import pefile,json,bisect
          from capstone import Cs,CS_ARCH_X86,CS_MODE_32

          p=Path("/tmp/r107/input/MVAssistant.exe")
          pe=pefile.PE(str(p),fast_load=False); b=p.read_bytes(); ib=pe.OPTIONAL_HEADER.ImageBase
          s=next(x for x in pe.sections if x.Name.rstrip(b"\0")==b".text")
          md=Cs(CS_ARCH_X86,CS_MODE_32)
          ins=list(md.disasm(b[s.PointerToRawData:s.PointerToRawData+s.SizeOfRawData],ib+s.VirtualAddress))
          addrs=[x.address for x in ins]

          def range_dump(a,z):
              i=bisect.bisect_left(addrs,a); out=[]
              for x in ins[i:]:
                  if x.address>=z: break
                  out.append(f"0x{x.address:08X}: {x.mnemonic:8s} {x.op_str}")
              return out

          lines=range_dump(0x42DD90,0x42E120)
          Path("/tmp/r107/evidence/R107_DONGLE_HANDSHAKE_DISASM.txt").write_text("\n".join(lines)+"\n")

          facts={
            "PC_TO_DONGLE_STATIC_HANDSHAKE_1_SEND_ASCII":"ISOK?FLASH",
            "PC_TO_DONGLE_STATIC_HANDSHAKE_1_REPORT_LENGTH":64,
            "PC_TO_DONGLE_STATIC_HANDSHAKE_1_EXPECT_PREFIX":"ISOK!",
            "PC_TO_DONGLE_STATIC_HANDSHAKE_2_SEND_PREFIX":"PSOK?",
            "PC_TO_DONGLE_STATIC_HANDSHAKE_2_APPENDS_FOUR_BYTES":True,
            "PC_TO_DONGLE_STATIC_HANDSHAKE_2_REPORT_LENGTH":64,
            "PC_TO_DONGLE_STATIC_HANDSHAKE_2_EXPECT_PREFIX":"PSOK!",
            "AUTHORIZED_FOR_BP1048P4":False
          }
          Path("/tmp/r107/evidence/R107_PC_DONGLE_HANDSHAKE_FACTS.json").write_text(
              json.dumps(facts,indent=2)+"\n")
          PY

      - name: Analyze programmer VID PID selection statically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import pefile,bisect,json
          from capstone import Cs,CS_ARCH_X86,CS_MODE_32

