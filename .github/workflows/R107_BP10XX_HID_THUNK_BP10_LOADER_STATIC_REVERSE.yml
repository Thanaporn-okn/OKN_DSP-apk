      - name: Locate BP10 activation branch and embedded blob candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import pefile,bisect,json,re,hashlib,math
          from capstone import Cs,CS_ARCH_X86,CS_MODE_32

          p=Path("/tmp/r107/input/MVAssistant.exe")
          pe=pefile.PE(str(p),fast_load=False); b=p.read_bytes(); ib=pe.OPTIONAL_HEADER.ImageBase
          s=next(x for x in pe.sections if x.Name.rstrip(b"\0")==b".text")
          md=Cs(CS_ARCH_X86,CS_MODE_32); md.detail=False
          ins=list(md.disasm(b[s.PointerToRawData:s.PointerToRawData+s.SizeOfRawData],ib+s.VirtualAddress))
          addrs=[x.address for x in ins]

          # Full relevant activation control-flow neighborhood including BP10 type==3 branch.
          i=bisect.bisect_left(addrs,0x42DC80)
          lines=[]
          for x in ins[i:]:
              if x.address>=0x42E900: break
              lines.append(f"0x{x.address:08X}: {x.mnemonic:8s} {x.op_str}")
          Path("/tmp/r107/evidence/R107_BP10_ACTIVATION_BRANCH_DISASM.txt").write_text("\n".join(lines)+"\n")

          # Look for immediate .rdata addresses and likely lengths in this branch.
          rdata=next(x for x in pe.sections if x.Name.rstrip(b"\0")==b".rdata")
          rlo=ib+rdata.VirtualAddress; rhi=rlo+rdata.Misc_VirtualSize
          candidates=[]
          for n,line in enumerate(lines):
              for m in re.finditer(r"0x([0-9a-fA-F]+)",line):
                  val=int(m.group(1),16)
                  if rlo <= val < rhi:
                      candidates.append({"line_index":n,"va":val,"line":line})
          # Unique addresses only.
          seen=set(); uniq=[]
          for c in candidates:
              if c["va"] in seen: continue
              seen.add(c["va"]); uniq.append(c)

          # Hash known fixed blob observed in AP82/P40 branch without exporting bytes.
          def va_to_off(va):
              rva=va-ib
              return pe.get_offset_from_rva(rva)

          blob_summaries=[]
          for va,size,label in [
              (0xCCCD40,0x8C00,"FIXED_0x8C00_BLOB_REFERENCE_BRANCH")
          ]:
              try:
                  off=va_to_off(va); x=b[off:off+size]
              except Exception:
                  continue
              counts=[0]*256
              for q in x: counts[q]+=1
              ent=0.0
              if x:
                  for c in counts:
                      if c:
                          p0=c/len(x); ent-=p0*math.log2(p0)
              strs=re.findall(rb"[\x20-\x7e]{5,}",x)
              blob_summaries.append({
                  "label":label,"va":f"0x{va:08X}","size":size,
                  "sha256":hashlib.sha256(x).hexdigest(),
                  "entropy":round(ent,5),
                  "head64":x[:64].hex(),
                  "tail64":x[-64:].hex(),
                  "interesting_ascii":[s.decode("ascii","replace")[:200] for s in strs[:100]
                    if re.search(rb"BP10|flash|boot|USB|UART|CRC|code|data|upgrade",s,re.I)][:40]
              })

          Path("/tmp/r107/evidence/R107_ACTIVATION_RDATA_REFERENCES.json").write_text(
              json.dumps(uniq,indent=2)+"\n")
          Path("/tmp/r107/evidence/R107_KNOWN_BLOB_SUMMARIES.json").write_text(
              json.dumps(blob_summaries,indent=2)+"\n")
          print("ACTIVATION_RDATA_UNIQUE_REFERENCES",len(uniq))
          PY

      - name: Automatically identify BP10 branch copied embedded blobs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,json,pefile,hashlib,math

          p=Path("/tmp/r107/input/MVAssistant.exe")
          pe=pefile.PE(str(p),fast_load=False); b=p.read_bytes(); ib=pe.OPTIONAL_HEADER.ImageBase
          txt=Path("/tmp/r107/evidence/R107_BP10_ACTIVATION_BRANCH_DISASM.txt").read_text().splitlines()

          # Heuristic: find sequences assigning a plausible blob length to global eaa75c,
          # malloc(length), then loading ESI with .rdata VA before rep movsb.
          rows=[]
          for i,line in enumerate(txt):
              m=re.search(r"mov\s+dword ptr \[0xeaa75c\],\s*0x([0-9a-fA-F]+)",line)
              if not m: continue
              size=int(m.group(1),16)
              window=txt[i:i+80]
              src=None
              for z in window:
                  q=re.search(r"mov\s+esi,\s*0x([0-9a-fA-F]+)",z)
                  if q:
                      v=int(q.group(1),16)
                      if 0xBB2000 <= v < 0xEB0000:
                          src=v; break
              if src is None: continue
              try:
                  off=pe.get_offset_from_rva(src-ib)
                  x=b[off:off+size]
              except Exception:
                  continue
              counts=[0]*256
              for q in x: counts[q]+=1
              ent=0
              if x:
                  for c in counts:
                      if c:
                          p0=c/len(x); ent-=p0*math.log2(p0)
              strings=re.findall(rb"[\x20-\x7e]{5,}",x)
              rows.append({
                  "source_va":f"0x{src:08X}","size":size,
                  "sha256":hashlib.sha256(x).hexdigest(),
                  "entropy":round(ent,5),
                  "head64":x[:64].hex(),
                  "tail64":x[-64:].hex(),
                  "ascii_sample":[s.decode("ascii","replace")[:160] for s in strings[:80]]
              })

          Path("/tmp/r107/evidence/R107_BP10_BRANCH_BLOB_CANDIDATES.json").write_text(
              json.dumps(rows,indent=2,ensure_ascii=False)+"\n")
          print("BP10_BRANCH_BLOB_CANDIDATES",len(rows))
          PY

      - name: Search embedded blob candidates for architecture and protocol markers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          ev=Path("/tmp/r107/evidence")
          rows=json.loads((ev/"R107_BP10_BRANCH_BLOB_CANDIDATES.json").read_text())
          out=[]
          for r in rows:
              sample="\n".join(r.get("ascii_sample",[]))
              out.append({
                  "source_va":r["source_va"],"size":r["size"],"sha256":r["sha256"],"entropy":r["entropy"],
                  "has_bp10":bool(re.search(r"BP10|BP1048",sample,re.I)),
                  "has_usb":bool(re.search(r"USB|HID|OTG",sample,re.I)),
                  "has_uart":bool(re.search(r"UART",sample,re.I)),
                  "has_flash":bool(re.search(r"flash|erase|program|verify",sample,re.I)),
                  "has_crc":bool(re.search(r"CRC|checksum",sample,re.I)),
                  "has_upgrade":bool(re.search(r"upgrade|download",sample,re.I)),
              })
          (ev/"R107_BP10_BLOB_MARKERS.json").write_text(json.dumps(out,indent=2)+"\n")
          PY

      - name: Build fail-closed decision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          ev=Path("/tmp/r107/evidence")
          thunks=json.loads((ev/"R107_IMPORT_THUNK_MAP.json").read_text())
          io=json.loads((ev/"R107_RESOLVED_IO_CALLS.json").read_text())
          blobs=json.loads((ev/"R107_BP10_BRANCH_BLOB_CANDIDATES.json").read_text())
          marks=json.loads((ev/"R107_BP10_BLOB_MARKERS.json").read_text())
          h=json.loads((ev/"R107_PC_DONGLE_HANDSHAKE_FACTS.json").read_text())

          d={
            "PINNED_BP10XX_EXE":True,
            "PROGRAMMER_DONGLE_VID_PID_PAIR_1":"0633:5322",
            "PROGRAMMER_DONGLE_VID_PID_PAIR_2":"0288:7966",
            "PC_TO_DONGLE_ISOK_HANDSHAKE_STATICALLY_PROVEN":True,
            "PC_TO_DONGLE_PSOK_HANDSHAKE_STATICALLY_PROVEN":True,
            "IMPORT_THUNK_COUNT":len(thunks),
            "RESOLVED_INTERESTING_IO_CALL_COUNT":len(io),
            "BP10_BRANCH_EMBEDDED_BLOB_CANDIDATE_COUNT":len(blobs),
            "BP10_BLOB_MARKER_SUMMARY":marks,
            "PC_TO_DONGLE_PROTOCOL_IS_NOT_DONGLE_TO_DSP_PROTOCOL":True,
            "DONGLE_TO_TARGET_USB_PROTOCOL_PROVEN":False,
            "PRODUCTION_GOLOPINE_BP1048P4_BOOT_ENTRY_PROVEN":False,
            "PRODUCTION_RECOVERY_USB_IDENTITY_PROVEN":False,
            "SAFE_READ_ONLY_PRODUCTION_BACKUP_PROVEN":False,
            "ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD":False,
            "NEXT":"OFFLINE_REVERSE_BP10_EMBEDDED_LOADER_AND_DONGLE_TARGET_ROLE_ONLY",
            "FLASH_ALLOWED":False
          }
          (ev/"R107_DECISION.json").write_text(json.dumps(d,indent=2,ensure_ascii=False)+"\n")
          report=[
            "# R107 BP10xx HID thunk + BP10 embedded loader static reverse",
            "",
            "Static/offline only. Nothing is executed or transmitted.",
            "",
            "```json",json.dumps(d,indent=2,ensure_ascii=False),"```",
            "",
            "Important separation:",
