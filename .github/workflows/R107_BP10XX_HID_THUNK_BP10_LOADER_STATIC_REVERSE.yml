            "PAIR_1_EXTERNAL_REFERENCE":"Hummingbird M / MV Otp Burn reported as HID VID_0633 PID_5322",
            "PAIR_2_EXTERNAL_IDENTITY_UNVERIFIED":True,
            "THESE_ARE_PROGRAMMER_DONGLE_IDENTITIES_NOT_PRODUCTION_DSP_IDENTITIES":True
          }
