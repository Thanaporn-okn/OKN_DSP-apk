          Classification: **STATIC_ANALYSIS_ONLY_NOT_FOR_FLASH**
          """
          (e/'34_MASTER_DOSSIER.md').write_text(md)
          print(md)
          PY
          cat /tmp/okn_master/evidence/34_MASTER_DOSSIER.md >> "$GITHUB_STEP_SUMMARY"

      - name: Produce review index and checksums
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "READ THESE FIRST:"
            echo "34_MASTER_DOSSIER.md"
            echo "33_MASTER_PROTOCOL_CANDIDATES.json"
            echo "17_ANDROID_USB_CALLS.json"
            echo "16_ANDROID_FOCUSED_EXCERPTS.txt"
            echo "13_ANDROID_MANIFEST_USB_FILTERS.txt"
            echo "29_WINDOWS_PROTOCOL_STRINGS.txt"
            echo "28_WINDOWS_PE_IMPORTS.json"
            echo "03_ANDROID_VENDOR_MANUAL.txt"
            echo "04_WINDOWS_VENDOR_MANUAL.txt"
            echo "30_PINNED_SDK_PROTOCOL_UPDATE_HITS.txt"
            echo "31_PROJECT_FIRMWARE_RECOVERY_INVENTORY.txt"
          } > /tmp/okn_master/evidence/00_READ_FIRST.txt

          cp /tmp/okn_master/evidence/* /tmp/okn_master/out/
          (cd /tmp/okn_master/out && sha256sum * > SHA256SUMS.txt)

          # Never redistribute official vendor binaries/packages in the artifact.
          test ! -e /tmp/okn_master/out/vendor.apk
          test ! -e /tmp/okn_master/out/vendor.exe
          test ! -e /tmp/okn_master/out/golopine_android.zip
          test ! -e /tmp/okn_master/out/golopine_windows.zip
          test ! -e /tmp/okn_master/out/android_manual.docx
          test ! -e /tmp/okn_master/out/windows_manual.docx

