          PY

      - name: Build compact master review dossier
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          e=Path('/tmp/okn_master/evidence')
          c=json.loads((e/'33_MASTER_PROTOCOL_CANDIDATES.json').read_text())

          md = f"""# OKN BP1048P4 MASTER OFFLINE DOSSIER

          ## Hard safety state
          - Live DSP access: **NO**
          - Host-to-device I/O: **NO**
          - Flash/write/erase/recovery commands: **NO**
