        gcc -std=c11 -Wall -Wextra -Werror -Ifirmware/include -Igain -Ifirmware/platform/bp1048p4 board_test.c firmware/platform/bp1048p4/okn_board_bp1048p4.c
        -o /tmp/board-test

        /tmp/board-test

        gcc -std=c11 -O1 -g -fsanitize=address,undefined -Igain -Ifirmware/include gain/gain7.c firmware/src/okn_dsp.c firmware/src/okn_protocol.c
        firmware/src/okn_control.c firmware/tests/test_pipeline.c -lm -o /tmp/pipeline-san

        ASAN_OPTIONS=detect_leaks=0 /tmp/pipeline-san | tee evidence/sanitizers.txt

        gcc -std=c11 -O1 -g -fsanitize=address,undefined -Igain -Ifirmware/include gain/gain7.c firmware/src/okn_dsp.c firmware/src/okn_audio_pcm.c
        firmware/tests/test_audio_pcm.c -lm -o /tmp/pcm-san

        ASAN_OPTIONS=detect_leaks=0 /tmp/pcm-san | tee evidence/pcm-sanitizers.txt

        '
    - name: Acquire pinned compiler for build only
      run: 'set -euo pipefail

        sudo apt-get update

        sudo apt-get install -y libc6-i386 lib32z1

        git init toolchain-source

        git -C toolchain-source remote add origin https://github.com/xingrz/nds-builder.git

        git -C toolchain-source fetch --depth 1 origin 572969caccb1d0c576b2893c905fa7b3396815e4

        git -C toolchain-source checkout --detach FETCH_HEAD

        echo ''a231682172de4af23ac94726c021a824f1ae7d1f7c72a4619093b90caa7de0e4  toolchain-source/nds32le-elf-mculib-v3s.4.9.4.txz''
        | sha256sum -c -

        mkdir toolchain

        tar -xJf toolchain-source/nds32le-elf-mculib-v3s.4.9.4.txz -C toolchain

        '
    - name: Compile D1088 objects and inspect architecture
      run: "set -euo pipefail\ncompiler=\"$PWD/toolchain/nds32le-elf-mculib-v3s/bin/nds32le-elf-gcc\"\nreader=\"$PWD/toolchain/nds32le-elf-mculib-v3s/bin/nds32le-elf-readelf\"\
        \nnmtool=\"$PWD/toolchain/nds32le-elf-mculib-v3s/bin/nds32le-elf-nm\"\n\"$compiler\" --version | tee evidence/compiler.txt\n\
        \"$compiler\" -dumpmachine | tee evidence/target.txt\nfor src in gain/gain7.c firmware/src/okn_dsp.c firmware/src/okn_protocol.c\
        \ firmware/src/okn_control.c firmware/src/okn_audio_pcm.c firmware/platform/bp1048p4/okn_board_bp1048p4.c; do\n obj=\"\
        objects/$(basename \"$src\" .c).o\"\n \"$compiler\" -std=c11 -O2 -Wall -Wextra -Werror -ffreestanding -mcpu=d1088-spu\
        \ -mext-dsp -Ifirmware/include -Ifirmware/platform/bp1048p4 -Igain -c \"$src\" -o \"$obj\"\n \"$reader\" -h \"$obj\"\
        \ >> evidence/elf-headers.txt\n \"$nmtool\" -u \"$obj\" >> evidence/unresolved-symbols.txt\ndone\npython3 - <<'PY'\n\
        import json,pathlib,struct\nobjects=list(pathlib.Path('objects').glob('*.o'))\nassert len(objects)==6, 'Expected all\
        \ six target objects'\nfor p in objects:\n b=p.read_bytes();assert b[:6]==b'\\x7fELF\\x01\\x01';assert struct.unpack_from('<H',b,16)[0]==1;assert\
        \ struct.unpack_from('<H',b,18)[0]==167\nresult={'D1088_OBJECT_COMPILE':True,'TARGET_EXECUTED':False,'TARGET_LINK_COMPLETE':False,'BOOTABLE_IMAGE':False,'BOARD_AUDIO_TESTED':False,'S25_USB_FLASH_TESTED':False,'FLASH_ALLOWED':False,'NOTE':'Gain\
        \ V2 integrated after PEQ; host pipeline tests passed. Target execution, production BSP and bootable image remain\
        \ unproven.'}\npathlib.Path('evidence/RESULT.json').write_text(json.dumps(result,indent=2))\nprint(json.dumps(result,indent=2))\n\
        PY\n"
    - name: Resolve runtime libraries in relocatable link only
      run: "set -euo pipefail\ncompiler=\"$PWD/toolchain/nds32le-elf-mculib-v3s/bin/nds32le-elf-gcc\"\nnmtool=\"$PWD/toolchain/nds32le-elf-mculib-v3s/bin/nds32le-elf-nm\"\
        \nreader=\"$PWD/toolchain/nds32le-elf-mculib-v3s/bin/nds32le-elf-readelf\"\n\"$compiler\" -mcpu=d1088-spu -mext-dsp\
        \ -r -nostdlib -Wl,--start-group objects/gain7.o objects/okn_dsp.o objects/okn_protocol.o objects/okn_control.o objects/okn_audio_pcm.o\
        \ objects/okn_board_bp1048p4.o -lm -lc -lgcc -Wl,--end-group -Wl,-Map,evidence/combined.map -o objects/combined.o\
        \ 2>&1 | tee evidence/link-log.txt\n\"$nmtool\" -u objects/combined.o | tee evidence/combined-unresolved.txt\n\"$reader\"\
        \ -h objects/combined.o > evidence/combined-header.txt\npython3 - <<'PY'\nimport json\nimport pathlib\nimport struct\n\
        \ndef undefined_symbols(data):\n    assert data[:6] == bytes([127, 69, 76, 70, 1, 1])\n    assert struct.unpack_from('<HH',\
        \ data, 16) == (1, 167)\n    offset = struct.unpack_from('<I', data, 32)[0]\n    size, count = struct.unpack_from('<HH',\
        \ data, 46)\n    assert size == 40 and count > 0\n    sections = [struct.unpack_from('<10I', data, offset+i*size)\
        \ for i in range(count)]\n    result = []\n    tables = 0\n    for section in sections:\n        if section[1] !=\
        \ 2:\n            continue\n        tables += 1\n        assert section[9] == 16 and section[5] % 16 == 0\n      \
        \  strings = sections[section[6]]\n        assert strings[1] == 3\n        names = data[strings[4]:strings[4]+strings[5]]\n\
        \        for i in range(0, section[5], 16):\n            name, value, length, info, other, index = struct.unpack_from('<IIIBBH',\
        \ data, section[4]+i)\n            if index != 0 or name == 0:\n                continue\n            end = names.index(b'\\\
        0', name)\n            result.append({'name': names[name:end].decode('ascii'), 'binding': info >> 4})\n    assert\
        \ tables == 1\n    return result\n\ndef classify(symbols):\n    strong = [s for s in symbols if s['binding'] != 2]\n\
        \    weak = [s for s in symbols if s['binding'] == 2]\n    unexpected = [s for s in weak if s['name'] != '_FP_BASE_']\n\
        \    return strong, weak, unexpected\n\ndef evaluate(data):\n    symbols = undefined_symbols(data)\n    strong, weak,\
        \ unexpected = classify(symbols)\n    return {\n        'RELOCATABLE_LINK_SUCCEEDED': True,\n        'STRONG_UNDEFINED_SYMBOLS':\
        \ strong,\n        'WEAK_UNDEFINED_SYMBOLS': weak,\n        'UNEXPECTED_WEAK_UNDEFINED_SYMBOLS': unexpected,\n   \
        \     'STRONG_RUNTIME_SYMBOLS_RESOLVED': not strong,\n        'ALL_UNDEFINED_SYMBOLS_RESOLVED': not symbols,\n   \
        \     'RELOCATABLE_LINK_CHECK_PASSED': not strong and not unexpected,\n        'FP_BASE_FINAL_LINK_REVIEW_REQUIRED':\
        \ any(s['name'] == '_FP_BASE_' for s in weak),\n        'TARGET_LINK_COMPLETE': False,\n        'BOOTABLE_IMAGE':\
        \ False,\n        'TARGET_EXECUTED': False,\n        'BOARD_AUDIO_TESTED': False,\n        'S25_USB_FLASH_TESTED':\
        \ False,\n        'FLASH_ALLOWED': False,\n        'LINK_CHECK_SCOPE': 'Relocatable core only. Known weak _FP_BASE_\
        \ remains pending final layout/relaxation review. No symbol value assigned or production memory map assumed.'\n  \
        \  }\n\nif __name__ == '__main__':\n    out = pathlib.Path('evidence/RESULT.json')\n    result = json.loads(out.read_text())\n\
        \    result.pop('RUNTIME_SYMBOLS_RESOLVED', None)\n    result.update(evaluate(pathlib.Path('objects/combined.o').read_bytes()))\n\
        \    result['INTEGRATED_POST_PEQ_GAIN'] = True\n    result['PCM16_ADAPTER_COMPILED'] = True\n    result['PHYSICAL_CHANNEL_ROUTING_PROVEN']\
        \ = False\n    result['STARTUP_IMPLEMENTED'] = False\n    out.write_text(json.dumps(result, indent=2))\n    print(json.dumps(result,\
        \ indent=2))\n    if not result['RELOCATABLE_LINK_CHECK_PASSED']:\n        raise SystemExit('Unresolved strong or\
        \ unexpected weak symbols remain')\n\nPY\n"
    - name: Upload sources and build evidence
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: OKN-PCM16-D1088-NOT-FLASHABLE
        path: 'evidence/

          objects/

          gain/

          firmware/

          board_test.c

          Makefile

          README_TH.md

          BOARD_INTEGRATION_FINDINGS.json'
        retention-days: 30
      if: always()
