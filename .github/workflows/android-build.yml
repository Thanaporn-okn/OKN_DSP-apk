name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Find ZIP
      run: |
        ls -la
        find . -name "*.zip"

    - name: Extract ZIP
      run: |
        mkdir project
        unzip -o *.zip -d project
        find project -maxdepth 3 -type f | head -50

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Find Android Project
      run: |
        cd project
        find . -name "build.gradle"
        find . -name "settings.gradle"

    - name: Build APK
      run: |
        cd project/OKN_DSP_v2
        gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: OKN_DSP_APK
        path: project/OKN_DSP_v2/app/build/outputs/apk/debug/*.apk
