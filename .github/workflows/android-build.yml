name: Build Android APK V39

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'

    - name: Find Project
      run: |
        ls -la
        find . -name pubspec.yaml

    - name: Prepare Flutter
      run: |
        if [ ! -f pubspec.yaml ]; then
          flutter create .
        fi

    - name: Flutter Clean
      run: |
        flutter clean
        flutter pub get

    - name: Fix Android Embedding
      run: |
        sed -i 's/android:name="io.flutter.app.FlutterApplication"/android:name="${applicationName}"/g' android/app/src/main/AndroidManifest.xml || true

    - name: Build APK
      run: |
        flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: OKN_DSP_BP1048P4_V39_APK
        path: build/app/outputs/flutter-apk/app-release.apk
