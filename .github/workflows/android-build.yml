name: Build Android APK V39

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17


    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: "3.24.5"


    - name: Check Files
      run: |
        ls -la


    - name: Create Flutter Project
      run: |
        if [ ! -f pubspec.yaml ]; then
          flutter create --project-name okn_dsp_bp1048p4 .
        fi


    - name: Flutter Repair
      run: |
        flutter clean
        flutter pub get


    - name: Fix Android Manifest
      run: |
        if [ -f android/app/src/main/AndroidManifest.xml ]; then
          sed -i 's/io.flutter.app.FlutterApplication/${applicationName}/g' android/app/src/main/AndroidManifest.xml || true
        fi


    - name: Build APK
      run: |
        flutter build apk --release


    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: OKN_DSP_BP1048P4_V39_APK
        path: build/app/outputs/flutter-apk/app-release.apk
