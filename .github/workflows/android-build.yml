name: Heavy Market - ZIP to APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heavy-market-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_RUN_NUMBER: ${{ github.run_number }}
      CI_BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Find newest HeavyMarket ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ZIP_FILES < <(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname 'HeavyMarket*.zip' -print | sort -V)

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "ERROR: ไม่พบ HeavyMarket*.zip ที่ root ของ repository"
            exit 1
          fi

          ZIP_FILE="${ZIP_FILES[-1]}"
          echo "ใช้ Source ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract source ZIP automatically
        id: extract
        shell: bash
        env:
          ZIP_FILE: ${{ steps.source.outputs.zip_file }}
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/heavy-market-source"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          unzip -q "$ZIP_FILE" -d "$DEST"

          if [ -f "$DEST/gradlew" ]; then
            PROJECT_DIR="$DEST"
          else
            GRADLEW_FILE="$(find "$DEST" -maxdepth 4 -type f -name gradlew -print -quit)"
            if [ -z "$GRADLEW_FILE" ]; then
              echo "ERROR: แตก ZIP แล้วไม่พบ gradlew"
              find "$DEST" -maxdepth 3 -type f -print | head -200 || true
              exit 1
            fi
            PROJECT_DIR="$(dirname "$GRADLEW_FILE")"
          fi

          test -f "$PROJECT_DIR/settings.gradle.kts" || test -f "$PROJECT_DIR/settings.gradle"
          test -d "$PROJECT_DIR/app"

          echo "Project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Detect and install required Android SDK
        id: android_sdk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          BUILD_FILE="app/build.gradle.kts"
          if [ ! -f "$BUILD_FILE" ]; then
            BUILD_FILE="app/build.gradle"
          fi

          COMPILE_SDK="$(sed -nE 's/^[[:space:]]*compileSdk[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' "$BUILD_FILE" | head -n 1)"
          if [ -z "$COMPILE_SDK" ]; then
            COMPILE_SDK="36"
          fi

          echo "Detected compileSdk=$COMPILE_SDK"
          echo "compile_sdk=$COMPILE_SDK" >> "$GITHUB_OUTPUT"

          SDKMANAGER="$(find "${ANDROID_SDK_ROOT}/cmdline-tools" -path '*/bin/sdkmanager' -type f | grep -E '/[0-9]+(\.[0-9]+)*/bin/sdkmanager$' | sort -V | tail -n 1 || true)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;36.0.0"

      - name: Validate project files
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -f gradlew
          test -f app/build.gradle.kts
          chmod +x gradlew
          echo "GITHUB_RUN_NUMBER=$GITHUB_RUN_NUMBER"
          echo "compileSdk=${{ steps.android_sdk.outputs.compile_sdk }}"
          find . -maxdepth 2 -type f | sort | head -200

      - name: Unit tests and Debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon clean testDebugUnitTest assembleDebug --stacktrace

      - name: Inspect APK outputs
        if: always()
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          cd "$PROJECT_DIR"
          find app/build/outputs -type f -print 2>/dev/null || true

      - name: Prepare Debug APK with automatic version
        id: debug_apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print | head -n 1)"

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "ERROR: Build จบแต่ไม่พบ Debug APK"
            exit 1
          fi

          OUT="$RUNNER_TEMP/HeavyMarket-v${VERSION}-debug.apk"
          cp "$APK" "$OUT"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: HeavyMarket-v${{ steps.debug_apk.outputs.version }}-debug
          path: ${{ steps.debug_apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Check Release signing secrets
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "ไม่มี Signing Secrets: ข้าม Release APK แต่ Debug APK ยัง build ตามปกติ"
          fi

      - name: Decode Release keystore
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/heavymarket-release.jks"

      - name: Build signed Release APK
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
          SIGNING_STORE_FILE: ${{ runner.temp }}/heavymarket-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleRelease --stacktrace

      - name: Prepare signed Release APK
        if: steps.signing.outputs.enabled == 'true'
        id: release_apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' -print | head -n 1)"
          test -n "$APK"
          test -f "$APK"

          OUT="$RUNNER_TEMP/HeavyMarket-v${VERSION}-release.apk"
          cp "$APK" "$OUT"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Upload signed Release APK artifact
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: HeavyMarket-v${{ steps.release_apk.outputs.version }}-release
          path: ${{ steps.release_apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
