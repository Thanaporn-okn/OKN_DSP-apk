name: Build Android APK ZIP AUTO V6

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          ZIP=$(find . -name "*.zip" | head -1)
          echo "ZIP=$ZIP" >> $GITHUB_ENV
          test -n "$ZIP"

      - name: Extract ZIP
        run: |
          mkdir source
          unzip -o "$ZIP" -d source

      - name: Find Flutter Project
        run: |
          ROOT=$(find source -name pubspec.yaml -printf '%h\n' | head -1)
          echo "ROOT=$ROOT" >> $GITHUB_ENV
          test -n "$ROOT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"

      - - name: Repair Flutter Android
  run: |
    cd "$ROOT"
    flutter create --project-name okn_dsp_controller .
    flutter pub get

      - name: Build APK
        run: |
          cd "$ROOT"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN_DSP_V6_APK
          path: ${{ env.ROOT }}/build/app/outputs/flutter-apk/*.apk
