name: Build Android APK ZIP AUTO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          ZIP=$(find . -name "*.zip" | head -1)
          echo ZIP=$ZIP
          test -n "$ZIP"

      - name: Extract Project
        run: |
          mkdir source
          unzip -o $(find . -name "*.zip" | head -1) -d source
          find source -maxdepth 3 -name pubspec.yaml

      - name: Find Flutter Root
        run: |
          ROOT=$(find source -name pubspec.yaml | head -1 | xargs dirname)
          echo ROOT=$ROOT >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      - name: Get Packages
        run: |
          cd $ROOT
          flutter pub get

      - name: Build APK
        run: |
          cd $ROOT
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN_DSP_V5.8_APK
          path: ${{ env.ROOT }}/build/app/outputs/flutter-apk/*.apk
