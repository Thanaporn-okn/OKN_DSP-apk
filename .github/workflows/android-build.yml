name: Build OKN_DSP APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: List files
        run: |
          ls -la

      - name: Extract Project
        run: |
          unzip -o OKN_DSP_GITHUB_BUILD.zip -d project

      - name: Build APK
        run: |
          cd project
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN_DSP_APK
          path: project/app/build/outputs/apk/debug/*.apk
