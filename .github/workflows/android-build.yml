name: Build OKN_DSP APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show files
        run: |
          ls -la

      - name: Extract Android Project
        run: |
          unzip -o OKN_DSP_AUTO_BUILD_V3.zip -d build_source
          ls -la build_source
          ls -la build_source/OKN_DSP_PROJECT

      - name: Build APK
        run: |
          cd build_source/OKN_DSP_PROJECT
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN_DSP_APK
          path: build_source/OKN_DSP_PROJECT/app/build/outputs/apk/debug/*.apk
