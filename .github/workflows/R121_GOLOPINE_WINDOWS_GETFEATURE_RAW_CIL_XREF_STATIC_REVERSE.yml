name: R121 GoloPine Windows getFeature raw-CIL xref static reverse

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R121_GOLOPINE_WINDOWS_GETFEATURE_RAW_CIL_XREF_STATIC_REVERSE.yml"

permissions:
  contents: read

concurrency:
  group: r121-golopine-getfeature-cil-${{ github.ref }}
  cancel-in-progress: true

env:
  NEW_URL: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-08.exe_.zip"
  EXPECTED_NEW_ZIP_SHA256: "f14b0c4baad70a8b0d5dc3b2783819cc2ef6e1a9c6ec2adcf17f1557059edd2a"
  EXPECTED_NEW_EXE_SHA256: "3ca54171c53f7badd963ffe6851b8b3e2faf8aee8ba2afcb7040990e22ae09b2"
  FLASH_ALLOWED: "NO"

jobs:
  static-reverse:
    name: STATIC ONLY - raw CIL getFeature xref - no execution - no USB - no board
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r121/input /tmp/r121/pkg /tmp/r121/evidence
          cat > /tmp/r121/evidence/R121_SAFETY.txt <<'EOF'
          R121_MODE=STATIC_RAW_CIL_ONLY
          R121_VENDOR_BINARY_EXECUTED=NO
          R121_INSTALLER_EXECUTED=NO
          R121_USB_DEVICE_ACCESS=NO
          R121_BOARD_CONTACT=NO
          R121_AA55_SENT=NO
          R121_RUNTIME_0X11_SENT=NO
          R121_FLASHBOOT_COMMAND_SENT=NO
          R121_FLASH_READ_EXECUTED=NO
          R121_FLASH_ERASE_EXECUTED=NO
          R121_FLASH_WRITE_EXECUTED=NO
          R121_ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD=NO
          FINAL_REQUIRED_TRANSPORT=SAMSUNG_S25_PLUS_USB_C_DIRECT_TO_DSP_USB_C
          HARDWARE_MODIFICATION=FORBIDDEN
          FLASH_ALLOWED=NO
          EOF

      - name: Install pinned static .NET parsers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            curl unzip p7zip-full jq file python3-pip >/dev/null
          python3 -m pip install --disable-pip-version-check --no-input \
            "dnfile==0.18.0" "dncil==1.0.2" "pefile>=2024.8.26" >/dev/null
          python3 - <<'PY' > /tmp/r121/evidence/R121_TOOL_VERSIONS.txt
          import importlib.metadata
          for n in ("dnfile","dncil","pefile"):
              print(n, importlib.metadata.version(n))
          PY

      - name: Acquire exact official Windows client
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            "$NEW_URL" -o /tmp/r121/input/new.zip
          test "$(sha256sum /tmp/r121/input/new.zip | awk '{print $1}')" = "$EXPECTED_NEW_ZIP_SHA256"
          7z x -y /tmp/r121/input/new.zip -o/tmp/r121/pkg >/dev/null

          EXE="$(find /tmp/r121/pkg -type f -iname '*.exe' ! -path '*/__MACOSX/*' -print -quit)"
          test -n "$EXE"
          test "$(sha256sum "$EXE" | awk '{print $1}')" = "$EXPECTED_NEW_EXE_SHA256"
          cp "$EXE" /tmp/r121/input/golopine.exe
          chmod a-x /tmp/r121/input/golopine.exe || true

          {
            echo "ZIP_SHA256=$EXPECTED_NEW_ZIP_SHA256"
            echo "EXE_SHA256=$EXPECTED_NEW_EXE_SHA256"
            echo "PIN_MATCH=YES"
          } > /tmp/r121/evidence/R121_BINARY_PIN.txt

      - name: Disassemble every recoverable managed method with dncil
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          from pathlib import Path
          from typing import Any
          import json, re
          import dnfile

          from dnfile.enums import MetadataTables
          from dncil.cil.body import CilMethodBody
          from dncil.cil.error import MethodBodyFormatError
          from dncil.clr.token import Token, StringToken, InvalidToken
          from dncil.cil.body.reader import CilMethodBodyReaderBase

          PE_PATH="/tmp/r121/input/golopine.exe"
          OUT=Path("/tmp/r121/evidence")
          pe=dnfile.dnPE(PE_PATH)

          DOTNET_META_TABLES_BY_INDEX={table.value:table.name for table in MetadataTables}

          class DnfileMethodBodyReader(CilMethodBodyReaderBase):
              def __init__(self, pe, row):
                  self.pe=pe
                  self.offset=self.pe.get_offset_from_rva(row.Rva)
              def read(self,n):
                  data=self.pe.get_data(self.pe.get_rva_from_offset(self.offset),n)
                  self.offset += n
                  return data
              def tell(self):
                  return self.offset
              def seek(self,offset):
                  self.offset=offset
                  return self.offset

          def resolve_token(token):
              if isinstance(token,StringToken):
                  try:
                      us=pe.net.user_strings.get(token.rid)
                      if us is None or isinstance(us,bytes) or us.value is None:
                          return {"kind":"invalid_string_token","token":hex(token.value)}
                      return {"kind":"user_string","value":us.value,"token":hex(token.value)}
                  except Exception:
                      return {"kind":"invalid_string_token","token":hex(token.value)}

              if not isinstance(token,Token):
                  return None

              table_name=DOTNET_META_TABLES_BY_INDEX.get(token.table,"")
              if not table_name:
                  return {"kind":"invalid_token","token":hex(token.value)}
              table=getattr(pe.net.mdtables,table_name,None)
              if table is None:
                  return {"kind":"invalid_token","token":hex(token.value)}
              try:
                  row=table.rows[token.rid-1]
              except Exception:
                  return {"kind":"invalid_token","token":hex(token.value)}

              if isinstance(row,dnfile.mdtable.MemberRefRow):
                  parent=""
                  try:
                      pr=row.Class.row
                      if isinstance(pr,dnfile.mdtable.TypeRefRow):
                          parent=(str(pr.TypeNamespace)+"."+str(pr.TypeName)).strip(".")
                      elif isinstance(pr,dnfile.mdtable.TypeDefRow):
                          parent=(str(pr.TypeNamespace)+"."+str(pr.TypeName)).strip(".")
                      elif isinstance(pr,dnfile.mdtable.TypeSpecRow):
                          parent="TypeSpec"
                      else:
                          parent=type(pr).__name__
                  except Exception:
                      parent=""
                  return {
                      "kind":"MemberRef",
                      "name":str(row.Name),
                      "parent":parent,
                      "token":hex(token.value)
                  }

              if isinstance(row,dnfile.mdtable.MethodDefRow):
                  return {
                      "kind":"MethodDef",
                      "name":str(row.Name),
                      "rva":int(row.Rva or 0),
                      "token":hex(token.value)
                  }

              if isinstance(row,dnfile.mdtable.TypeRefRow):
                  return {
                      "kind":"TypeRef",
                      "name":(str(row.TypeNamespace)+"."+str(row.TypeName)).strip("."),
                      "token":hex(token.value)
                  }

              if isinstance(row,dnfile.mdtable.TypeDefRow):
                  return {
                      "kind":"TypeDef",
                      "name":(str(row.TypeNamespace)+"."+str(row.TypeName)).strip("."),
                      "token":hex(token.value)
                  }

              return {
                  "kind":type(row).__name__,
                  "text":str(row),
                  "token":hex(token.value)
              }

          # Map MethodDef RID to owning TypeDef from MethodList ranges.
          method_rows=list(pe.net.mdtables.MethodDef.rows)
          typedef_rows=list(pe.net.mdtables.TypeDef.rows)
          owner_by_rid={}
          for i,td in enumerate(typedef_rows):
              try:
                  start=int(td.MethodList[0].row_index)
              except Exception:
                  try:
                      start=int(td.MethodList.row_index)
                  except Exception:
                      continue
              if i+1 < len(typedef_rows):
                  try:
                      end=int(typedef_rows[i+1].MethodList[0].row_index)-1
                  except Exception:
                      try:
                          end=int(typedef_rows[i+1].MethodList.row_index)-1
                      except Exception:
                          end=len(method_rows)
              else:
                  end=len(method_rows)
              owner=(str(td.TypeNamespace)+"."+str(td.TypeName)).strip(".")
              for rid in range(start,end+1):
                  owner_by_rid[rid]=owner

          parsed=[]
          errors=[]
          getfeature_rids=[]
          feature_named=[]
          for rid,row in enumerate(method_rows,1):
              name=str(row.Name)
              owner=owner_by_rid.get(rid,"")
              if "feature" in name.lower():
                  feature_named.append({
                      "rid":rid,
                      "token":hex(0x06000000|rid),
                      "owner":owner,
                      "name":name,
                      "rva":int(row.Rva or 0)
                  })
              if name.lower()=="getfeature":
                  getfeature_rids.append(rid)

              try:
                  if not row.Rva:
                      continue
                  if row.Flags.mdAbstract or row.Flags.mdPinvokeImpl:
                      continue
                  if not row.ImplFlags.miIL:
                      continue
                  body=CilMethodBody(DnfileMethodBodyReader(pe,row))
              except Exception as e:
                  errors.append({
                      "rid":rid,"owner":owner,"name":name,
                      "rva":int(row.Rva or 0),
                      "error":type(e).__name__+": "+str(e)
                  })
                  continue

              inst=[]
              for ins in body.instructions:
                  op=ins.operand
                  resolved=resolve_token(op)
                  val=None
                  if isinstance(op,int):
                      val=op
                  elif isinstance(op,list):
                      val=op
                  elif isinstance(op,Token):
                      val=hex(op.value)
                  else:
                      try:
                          val=str(op) if op is not None else None
                      except Exception:
                          val=None
                  inst.append({
                      "offset":int(ins.offset),
                      "mnemonic":str(ins.mnemonic),
                      "operand":val,
                      "resolved":resolved,
                      "bytes":ins.get_bytes().hex()
                  })

              parsed.append({
                  "rid":rid,
                  "token":hex(0x06000000|rid),
                  "owner":owner,
                  "name":name,
                  "rva":int(row.Rva or 0),
                  "instruction_count":len(inst),
                  "instructions":inst
              })

          OUT.joinpath("R121_ALL_PARSED_METHODS.json").write_text(
              json.dumps(parsed,indent=2,ensure_ascii=False)+"\n"
          )
          OUT.joinpath("R121_PARSE_ERRORS.json").write_text(
              json.dumps(errors,indent=2,ensure_ascii=False)+"\n"
          )
          OUT.joinpath("R121_FEATURE_NAMED_METHODS.json").write_text(
              json.dumps(feature_named,indent=2,ensure_ascii=False)+"\n"
          )

          summary={
              "methoddef_total":len(method_rows),
              "parsed_method_count":len(parsed),
              "parse_error_count":len(errors),
              "getFeature_rids":getfeature_rids,
              "feature_named_methods":feature_named
          }
          OUT.joinpath("R121_PARSE_SUMMARY.json").write_text(
              json.dumps(summary,indent=2,ensure_ascii=False)+"\n"
          )
          print(json.dumps(summary,indent=2,ensure_ascii=False))
          PY

      - name: Resolve getFeature body callers and AA55 constants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          ev=Path("/tmp/r121/evidence")
          allm=json.loads((ev/"R121_ALL_PARSED_METHODS.json").read_text())
          summ=json.loads((ev/"R121_PARSE_SUMMARY.json").read_text())
          targets=set(summ["getFeature_rids"])
          target_tokens={0x06000000|rid for rid in targets}

          def const_value(ins):
              m=ins["mnemonic"].lower()
              op=ins.get("operand")
              table={
                  "ldc.i4.m1":-1,
                  "ldc.i4.0":0,"ldc.i4.1":1,"ldc.i4.2":2,"ldc.i4.3":3,
                  "ldc.i4.4":4,"ldc.i4.5":5,"ldc.i4.6":6,"ldc.i4.7":7,"ldc.i4.8":8
              }
              if m in table: return table[m]
              if m in ("ldc.i4","ldc.i4.s") and isinstance(op,int):
                  return op
              return None

          get_bodies=[]
          callers=[]
          feature_related=[]
          aa55_methods=[]

          for m in allm:
              if m["rid"] in targets:
                  get_bodies.append(m)

              constants=[]
              calls=[]
              strings=[]
              for idx,ins in enumerate(m["instructions"]):
                  cv=const_value(ins)
                  if cv is not None:
                      constants.append((idx,cv))

                  r=ins.get("resolved") or {}
                  if r.get("kind") in ("MethodDef","MemberRef"):
                      calls.append((idx,r))
                  if r.get("kind")=="user_string":
                      strings.append((idx,r.get("value","")))

              has_aa=any((v==170 or v==-86 or (v & 0xff)==0xaa) for _,v in constants)
              has_55=any((v==85 or (v & 0xff)==0x55) for _,v in constants)
              if has_aa and has_55:
                  aa55_methods.append(m)

              calls_get=False
              for idx,r in calls:
                  tok=r.get("token")
                  try:
                      tv=int(tok,16) if tok else None
                  except Exception:
                      tv=None
                  if tv in target_tokens or (
                      r.get("kind")=="MethodDef" and r.get("name","").lower()=="getfeature"
                  ):
                      calls_get=True
                      callers.append({
                          "method_rid":m["rid"],
                          "owner":m["owner"],
                          "name":m["name"],
                          "call_instruction_index":idx,
                          "has_aa_constant":has_aa,
                          "has_55_constant":has_55,
                          "instructions":m["instructions"]
                      })

              feature_call_names=[
                  r.get("name","") for _,r in calls
                  if re.search(r"feature|hidd_getfeature|hidd_setfeature",r.get("name",""),re.I)
              ]
              if feature_call_names or "feature" in m["name"].lower():
                  feature_related.append({
                      "rid":m["rid"],"owner":m["owner"],"name":m["name"],
                      "feature_call_names":feature_call_names,
                      "has_aa_constant":has_aa,
                      "has_55_constant":has_55,
                      "instructions":m["instructions"]
                  })

          ev.joinpath("R121_GETFEATURE_BODIES.json").write_text(
              json.dumps(get_bodies,indent=2,ensure_ascii=False)+"\n"
          )
          ev.joinpath("R121_GETFEATURE_CALLERS.json").write_text(
              json.dumps(callers,indent=2,ensure_ascii=False)+"\n"
          )
          ev.joinpath("R121_FEATURE_RELATED_METHODS.json").write_text(
              json.dumps(feature_related,indent=2,ensure_ascii=False)+"\n"
          )
          ev.joinpath("R121_AA55_CONSTANT_METHODS.json").write_text(
              json.dumps(aa55_methods,indent=2,ensure_ascii=False)+"\n"
          )

          summary={
              "getFeature_body_count":len(get_bodies),
              "getFeature_caller_count":len(callers),
              "feature_related_method_count":len(feature_related),
              "aa55_constant_method_count":len(aa55_methods),
              "callers_with_AA_and_55":sum(
                  1 for x in callers if x["has_aa_constant"] and x["has_55_constant"]
              )
          }
          ev.joinpath("R121_XREF_SUMMARY.json").write_text(
              json.dumps(summary,indent=2,ensure_ascii=False)+"\n"
          )
          print(json.dumps(summary,indent=2))
          PY

      - name: Classify native HID calls inside getFeature and callers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          ev=Path("/tmp/r121/evidence")
          bodies=json.loads((ev/"R121_GETFEATURE_BODIES.json").read_text())
          callers=json.loads((ev/"R121_GETFEATURE_CALLERS.json").read_text())
          feature=json.loads((ev/"R121_FEATURE_RELATED_METHODS.json").read_text())

          rows=[]
          for group_name,group in (
              ("getFeature_body",bodies),
              ("getFeature_caller",callers),
              ("feature_related",feature),
          ):
              for m in group:
                  inst=m.get("instructions",[])
                  calls=[]
                  for x in inst:
                      r=x.get("resolved") or {}
                      if r.get("kind") in ("MethodDef","MemberRef"):
                          name=r.get("name","")
                          parent=r.get("parent","")
                          if re.search(
                              r"hid|feature|createfile|deviceiocontrol|readfile|writefile|setupdi",
                              name+" "+parent,re.I
                          ):
                              calls.append({
                                  "offset":x["offset"],
                                  "mnemonic":x["mnemonic"],
                                  "target":r
                              })
                  rows.append({
                      "group":group_name,
                      "rid":m.get("rid") or m.get("method_rid"),
                      "owner":m.get("owner"),
                      "name":m.get("name"),
                      "interesting_calls":calls
                  })

          ev.joinpath("R121_NATIVE_HID_CALL_CLASSIFICATION.json").write_text(
              json.dumps(rows,indent=2,ensure_ascii=False)+"\n"
          )
          PY

      - name: Verify R120 residual hits are metadata or obfuscation strings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,json

          p=Path("/tmp/r121/input/golopine.exe")
          b=p.read_bytes()
          strings=[(m.start(),m.group(0).decode("latin1","replace"))
                   for m in re.finditer(rb"[\x20-\x7e]{4,}",b)]

          rows=[]
          ctxpat=re.compile(r"hid|feature|report|usb|firmware|upgrade|boot|flash",re.I)
          for token in ("6324","1719","18B4","06B7"):
              for i,(off,s) in enumerate(strings):
                  if token.lower() not in s.lower():
                      continue
                  lo=max(0,i-15); hi=min(len(strings),i+16)
                  ctx=" | ".join(x[1] for x in strings[lo:hi])
                  rows.append({
                      "token":token,
                      "offset":off,
                      "string":s[:600],
                      "explicit_hid_usb_update_context":bool(ctxpat.search(ctx)),
                      "context":ctx[:5000]
                  })

          Path("/tmp/r121/evidence/R121_PRODUCTION_ID_RESIDUAL_CONTEXT.json").write_text(
              json.dumps(rows,indent=2,ensure_ascii=False)+"\n"
          )
          PY

      - name: Build closure decision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          ev=Path("/tmp/r121/evidence")
          ps=json.loads((ev/"R121_PARSE_SUMMARY.json").read_text())
          xs=json.loads((ev/"R121_XREF_SUMMARY.json").read_text())
          bodies=json.loads((ev/"R121_GETFEATURE_BODIES.json").read_text())
          callers=json.loads((ev/"R121_GETFEATURE_CALLERS.json").read_text())
          native=json.loads((ev/"R121_NATIVE_HID_CALL_CLASSIFICATION.json").read_text())
          ids=json.loads((ev/"R121_PRODUCTION_ID_RESIDUAL_CONTEXT.json").read_text())

          get_native=[]
          for r in native:
              if r["group"]=="getFeature_body":
                  get_native.extend(r["interesting_calls"])

          setfeature_targets=[
              c["target"]
              for r in native for c in r["interesting_calls"]
              if re.search(r"setfeature|hidd_setfeature",c["target"].get("name",""),re.I)
          ]
          getfeature_targets=[
              c["target"]
              for r in native for c in r["interesting_calls"]
              if re.search(r"getfeature|hidd_getfeature",c["target"].get("name",""),re.I)
          ]

          id_context_hits=sum(1 for x in ids if x["explicit_hid_usb_update_context"])

          coverage=(ps["parsed_method_count"]/ps["methoddef_total"]) if ps["methoddef_total"] else 0.0

          d={
              "PINNED_OFFICIAL_GOLOPINE_08APR2026_WINDOWS_CLIENT":True,
              "METHODDEF_TOTAL":ps["methoddef_total"],
              "RAW_CIL_PARSED_METHOD_COUNT":ps["parsed_method_count"],
              "RAW_CIL_PARSE_ERROR_COUNT":ps["parse_error_count"],
              "RAW_CIL_PARSE_COVERAGE":coverage,

              "GETFEATURE_BODY_RECOVERED":xs["getFeature_body_count"]>0,
              "GETFEATURE_CALLER_COUNT":xs["getFeature_caller_count"],
              "FEATURE_RELATED_METHOD_COUNT":xs["feature_related_method_count"],
              "METHODS_WITH_AA_AND_55_CONSTANTS":xs["aa55_constant_method_count"],
              "GETFEATURE_CALLERS_WITH_AA_AND_55":xs["callers_with_AA_and_55"],

              "GETFEATURE_NATIVE_HID_TARGETS":getfeature_targets,
              "SETFEATURE_NATIVE_HID_TARGETS":setfeature_targets,
              "PRODUCTION_ID_RESIDUAL_WITH_EXPLICIT_HID_USB_UPDATE_CONTEXT":id_context_hits,

              "REFERENCE_STYLE_BOOTSTRAP_SIGNATURE_REQUIRED":[
                  "host SetFeature path",
                  "AA constant used to arm upgrade state",
                  "GetFeature path returning/expecting 55",
                  "same method/call graph links those operations"
              ],

              "OFFICIAL_WINDOWS_CLIENT_CONTAINS_REFERENCE_STYLE_AA55_BOOTSTRAP_CALL_GRAPH":(
                  xs["callers_with_AA_and_55"]>0 and len(setfeature_targets)>0
              ),

              "IMPORTANT_LIMITATION":(
                  "A generic getFeature wrapper or HID transport support is not evidence of the reference AA55 bootstrap. "
                  "The bootstrap requires a linked SetFeature/AA and GetFeature/55 state machine."
              ),

              "PRODUCTION_BOOTSTRAP_BRIDGE_PROVEN":False,
              "PRODUCTION_FLASHBOOT_REENUMERATION_PROVEN":False,
              "PRODUCTION_RECOVERY_USB_IDENTITY_PROVEN":False,
              "SAFE_READ_ONLY_STOCK_BACKUP_PROVEN":False,
              "ANY_DISCOVERED_WRITE_AUTHORIZED_FOR_BOARD":False,

              "NEXT":(
                  "If the AA55 SetFeature/GetFeature call graph is absent with high CIL parse coverage, close the official Windows tuning client as the production bootstrap source and pivot to MV_AP82xx_BP10xx_PC_Tools / production firmware artifacts. "
                  "If such a call graph is recovered, reverse only those exact methods offline."
              ),
              "FLASH_ALLOWED":False
          }

          ev.joinpath("R121_DECISION.json").write_text(
              json.dumps(d,indent=2,ensure_ascii=False)+"\n"
          )
          report=[
              "# R121 — raw CIL xref of GoloPine Windows HID Feature path",
              "",
              "Static only; executable is never launched and no hardware is contacted.",
              "",
              "```json",
              json.dumps(d,indent=2,ensure_ascii=False),
              "```",
              "",
              "A generic HID getFeature implementation is not the BP1048 bootstrap unless AA/55 SetFeature/GetFeature state linkage is recovered.",
              "",
              "FLASH_ALLOWED=NO"
          ]
          ev.joinpath("R121_REPORT_TH.md").write_text("\n".join(report)+"\n")
          print(json.dumps(d,indent=2,ensure_ascii=False))
          PY

      - name: Package evidence without full all-method dump
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/r121/evidence/R121_ALL_PARSED_METHODS.json
          cd /tmp/r121/evidence
          zip -9 -r /tmp/R121_GOLOPINE_WINDOWS_GETFEATURE_CIL_XREF_EVIDENCE.zip .
          sha256sum /tmp/R121_GOLOPINE_WINDOWS_GETFEATURE_CIL_XREF_EVIDENCE.zip \
            > /tmp/R121_GOLOPINE_WINDOWS_GETFEATURE_CIL_XREF_EVIDENCE.zip.sha256

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: R121-GOLOPINE-WINDOWS-GETFEATURE-CIL-XREF-EVIDENCE
          path: |
            /tmp/R121_GOLOPINE_WINDOWS_GETFEATURE_CIL_XREF_EVIDENCE.zip
            /tmp/R121_GOLOPINE_WINDOWS_GETFEATURE_CIL_XREF_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'R121_VENDOR_BINARY_EXECUTED=NO' /tmp/r121/evidence/R121_SAFETY.txt
