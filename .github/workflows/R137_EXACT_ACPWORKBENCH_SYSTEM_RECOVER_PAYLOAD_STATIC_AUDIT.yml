name: R137 exact ACPWorkbench system recover payload static audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R137_EXACT_ACPWORKBENCH_SYSTEM_RECOVER_PAYLOAD_STATIC_AUDIT.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r137-acpworkbench-system-recover-payload-${{ github.ref }}
  cancel-in-progress: true

env:
  FLASH_ALLOWED: "NO"
  R127_RUN_ID: "35865759674"
  R127_ACQUIRED_ARTIFACT_NAME: "R127-ACQUIRED-PUBLIC-FILES"
  R127_INNER_ZIP_SHA256: "d217dff170352179ee3d6a70b8e3a58b98b41ef2d365a4551daff4124ce21be6"
  DSP_ALT_RAR_SHA256: "8e692b4cf7779f2edb0ad47209fa46204717848568dd4572846cb75294cae2b3"
  R136_RUN_ID: "35897534468"
  R136_JOB_ID: "107305090899"
  R136_EVIDENCE_ARTIFACT_ID: "10767074881"
  R136_EVIDENCE_ARTIFACT_NAME: "R136-EXACT-ACPWORKBENCH-RECOVERY-BACKUP-UPDATE-STATIC-EVIDENCE"
  R136_EVIDENCE_DIGEST: "sha256:934396ac446dad87341c8f8703a91505470293af0892dc6c3c412072c7fbee21"
  PROD_VID_HEX: "18B4"
  PROD_PID_HEX: "06B7"

jobs:
  static_audit:
    name: STATIC ONLY - system Recover semantics and payload inventory - no execution - no USB - no board
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r137/input /tmp/r137/acquired /tmp/r137/dsp /tmp/r137/r136 /tmp/r137/text /tmp/r137/evidence
          cat > /tmp/r137/evidence/R137_SAFETY.txt <<'EOF'
          R137_MODE=OFFLINE_STATIC_ACPWORKBENCH_SYSTEM_RECOVER_PAYLOAD_AUDIT
          R137_VENDOR_BINARY_EXECUTED=NO
          R137_INSTALLER_EXECUTED=NO
          R137_USB_DEVICE_ACCESS=NO
          R137_BOARD_CONTACT=NO
          R137_AA55_SENT=NO
          R137_RUNTIME_0X11_SENT=NO
          R137_RUNTIME_0XFE_SENT=NO
          R137_FLASHBOOT_COMMAND_SENT=NO
          R137_FLASH_READ_EXECUTED=NO
          R137_FLASH_ERASE_EXECUTED=NO
          R137_FLASH_WRITE_EXECUTED=NO
          R137_ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD=NO
          HARDWARE_MODIFICATION=FORBIDDEN
          REFERENCE_OR_TOOL_EVIDENCE_IS_NOT_PRODUCTION_PROOF=YES
          FLASH_ALLOWED=NO
          EOF

      - name: Download pinned R127 acquired files as inert data
        uses: actions/download-artifact@v4
        with:
          name: R127-ACQUIRED-PUBLIC-FILES
          path: /tmp/r137/input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 35865759674

      - name: Download pinned R136 evidence for continuity only
        uses: actions/download-artifact@v4
        with:
          name: R136-EXACT-ACPWORKBENCH-RECOVERY-BACKUP-UPDATE-STATIC-EVIDENCE
          path: /tmp/r137/r136
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 35897534468

      - name: Install static tooling only
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq file unzip p7zip-full poppler-utils python3-pip >/dev/null
          python3 -m pip install --disable-pip-version-check --no-input pefile >/dev/null

      - name: Verify pinned package and extract inert DSP package
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r137/input
          test -f R127_ACQUIRED_PUBLIC_FILES.zip
          echo "${R127_INNER_ZIP_SHA256}  R127_ACQUIRED_PUBLIC_FILES.zip" | sha256sum -c -
          unzip -q R127_ACQUIRED_PUBLIC_FILES.zip -d /tmp/r137/acquired
          DSP_RAR="$(find /tmp/r137/acquired/DSP_SOFTWARE_ALTERNATE -maxdepth 2 -type f -name '*.rar' -print -quit)"
          test -n "$DSP_RAR"
          echo "${DSP_ALT_RAR_SHA256}  ${DSP_RAR}" | sha256sum -c -
          7z x -y -o/tmp/r137/dsp "$DSP_RAR" >/tmp/r137/evidence/R137_7Z_DSP_EXTRACT.txt
          find /tmp/r137/dsp -type f -printf '%P\t%s\n' | sort > /tmp/r137/evidence/R137_DSP_FILE_LIST.tsv
          find /tmp/r137/r136 -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/r137/evidence/R137_R136_ARTIFACT_FILES.txt

      - name: Extract exact manual config and changelog contexts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            rel="${f#/tmp/r137/dsp/}"
            safe="$(printf '%s' "$rel" | tr '/ ' '__' | tr -cd '[:alnum:]_.-')"
            case "${f,,}" in
              *.pdf) pdftotext -layout "$f" "/tmp/r137/text/${safe}.txt" || true ;;
              *.ini|*.txt|*/changelog|*.xml) cp "$f" "/tmp/r137/text/${safe}.txt" || true ;;
            esac
          done < <(find /tmp/r137/dsp -type f -print0)
          find /tmp/r137/text -type f -printf '%f\t%s\n' | sort > /tmp/r137/evidence/R137_TEXT_FILE_LIST.tsv

      - name: Analyze system Recover semantics payload inventory and binary references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re,hashlib,math,collections,subprocess

          root=Path('/tmp/r137/dsp'); textroot=Path('/tmp/r137/text'); ev=Path('/tmp/r137/evidence')
          PROD_TEXT_RE=re.compile(r'18b4|06b7|6324|1719|vid[_ :=-]*18b4|pid[_ :=-]*06b7',re.I)
          recover_re=re.compile(r'system_recover_enable|\brecover\b|\brecovery\b|\breset\b|\bsleep\b|恢复|复位|休眠',re.I)
          backup_re=re.compile(r'backup|back\s*up|read\s*back|readback|dump|save\s+firmware|read\s+firmware|export.*firmware|flash.*read|read.*flash|rom.*read',re.I)
          update_re=re.compile(r'firmware|online\s*update|onlineupdata|update|upgrade|flash|download|program|burn|erase|boot',re.I)
          format_re=re.compile(r'\.(?:bin|hex|img|rom|fw|firmware|mva|bt|dat|dsp|upd|upg|dfu|ini|xml)\b',re.I)

          contexts=[]
          for p in sorted(textroot.glob('*')):
              raw=p.read_bytes()
              txt=None; enc_used=None
              for enc in ('utf-8','utf-16le','latin1'):
                  try:
                      t=raw.decode(enc,'ignore')
                      if t.strip(): txt=t; enc_used=enc; break
                  except Exception: pass
              if txt is None: continue
              lines=txt.splitlines()
              for i,line in enumerate(lines):
                  kinds=[]
                  if recover_re.search(line): kinds.append('system_recover_reset_sleep')
                  if backup_re.search(line): kinds.append('stock_backup_readback')
                  if update_re.search(line): kinds.append('update_firmware')
                  if PROD_TEXT_RE.search(line): kinds.append('production_identity')
                  if format_re.search(line): kinds.append('file_format_reference')
                  if not kinds: continue
                  lo=max(0,i-6); hi=min(len(lines),i+7)
                  contexts.append({
                      'file':p.name,'line':i+1,'encoding':enc_used,'kinds':kinds,
                      'text':line[:1000],
                      'context':[{'line':j+1,'text':lines[j][:1000]} for j in range(lo,hi)]
                  })

          def entropy(data):
              if not data: return 0.0
              c=collections.Counter(data); n=len(data)
              return -sum((v/n)*math.log2(v/n) for v in c.values())

          payloads=[]
          ignored_ext={'.exe','.dll','.pdf','.ini','.txt','.xml','.jpg','.jpeg','.png','.bmp','.ico','.gif'}
          for p in sorted(root.rglob('*')):
              if not p.is_file(): continue
              rel=str(p.relative_to(root)); data=p.read_bytes(); ext=p.suffix.lower()
              # Candidate payload = non-document/non-executable data, or name suggests firmware/update/flash/boot.
              name_signal=bool(re.search(r'firmware|update|upgrade|flash|boot|rom|image|dsp|download|burn',rel,re.I))
              candidate=(ext not in ignored_ext) or name_signal
              if candidate:
                  try:
                      fdesc=subprocess.check_output(['file','-b',str(p)],text=True,errors='replace').strip()
                  except Exception: fdesc=''
                  payloads.append({
                      'file':rel,'size':len(data),'extension':ext,'sha256':hashlib.sha256(data).hexdigest(),
                      'file_type':fdesc,'entropy':round(entropy(data),4),
                      'first64_hex':data[:64].hex(),
                      'name_suggests_update_or_firmware':name_signal,
                      'contains_production_text':bool(PROD_TEXT_RE.search(data.decode('latin1','ignore')))
                  })

          # Static strings from EXE/DLL only. Never execute them.
          binary_refs=[]
          for p in sorted(list(root.rglob('*.exe'))+list(root.rglob('*.dll'))):
              data=p.read_bytes(); vals=[]
              for m in re.finditer(rb'[\x20-\x7e]{5,}',data):
                  s=m.group().decode('latin1','replace')
                  if recover_re.search(s) or backup_re.search(s) or update_re.search(s) or format_re.search(s) or PROD_TEXT_RE.search(s):
                      vals.append(s[:600])
              for m in re.finditer(rb'(?:[\x20-\x7e]\x00){5,}',data):
                  s=m.group().decode('utf-16le','replace')
                  if recover_re.search(s) or backup_re.search(s) or update_re.search(s) or format_re.search(s) or PROD_TEXT_RE.search(s):
                      vals.append(s[:600])
              binary_refs.append({'file':str(p.relative_to(root)),'strings':list(dict.fromkeys(vals))[:500]})

          config_recover=[]
          for c in contexts:
              if any(k in c['kinds'] for k in ('system_recover_reset_sleep','stock_backup_readback')):
                  config_recover.append(c)

          out={
              'production_runtime_vid':'0x18B4','production_runtime_pid':'0x06B7',
              'semantic_contexts':contexts,
              'recover_backup_contexts':config_recover,
              'payload_candidates':payloads,
              'binary_static_references':binary_refs,
          }
          (ev/'R137_SYSTEM_RECOVER_PAYLOAD_AUDIT.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          PY

      - name: Build fail-closed R137 decision and report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          ev=Path('/tmp/r137/evidence')
          d=json.loads((ev/'R137_SYSTEM_RECOVER_PAYLOAD_AUDIT.json').read_text())
          ctx=d['semantic_contexts']; payload=d['payload_candidates']; bref=d['binary_static_references']
          recover=[x for x in ctx if 'system_recover_reset_sleep' in x['kinds']]
          backup=[x for x in ctx if 'stock_backup_readback' in x['kinds']]
          prod=[x for x in ctx if 'production_identity' in x['kinds']]
          # system_recover_enable and UI Recover are not stock-backup proof unless explicit readback/backup language occurs in same context.
          recover_with_backup=[]
          for x in recover:
              blob='\n'.join(z['text'] for z in x['context'])
              if re.search(r'backup|back\s*up|read\s*back|readback|dump|save\s+firmware|read\s+firmware|flash.*read|read.*flash|rom.*read',blob,re.I):
                  recover_with_backup.append(x)
          plausible_payload=[x for x in payload if x['size']>=1024 and x['name_suggests_update_or_firmware'] and not re.search(r'\.exe$|\.dll$|\.pdf$|\.ini$|\.txt$|\.xml$',x['file'],re.I)]
          binary_prod=[{'file':x['file'],'strings':[s for s in x['strings'] if re.search(r'18b4|06b7|6324|1719',s,re.I)]} for x in bref]
          binary_prod=[x for x in binary_prod if x['strings']]
          decision={
              'R136_RUN_ID':35897534468,
              'R136_JOB_ID':107305090899,
              'R136_EVIDENCE_ARTIFACT_ID':10767074881,
              'DSP_ALT_RAR_SHA256':'8e692b4cf7779f2edb0ad47209fa46204717848568dd4572846cb75294cae2b3',
              'SYSTEM_RECOVER_RESET_SLEEP_CONTEXT_COUNT':len(recover),
              'EXPLICIT_STOCK_BACKUP_READBACK_CONTEXT_COUNT':len(backup),
              'RECOVER_CONTEXT_WITH_EXPLICIT_BACKUP_READBACK_COUNT':len(recover_with_backup),
              'PRODUCTION_ID_TEXT_CONTEXT_COUNT':len(prod),
              'BINARY_PRODUCTION_ID_STRING_REFERENCE_COUNT':sum(len(x['strings']) for x in binary_prod),
              'PAYLOAD_CANDIDATE_COUNT':len(payload),
              'PLAUSIBLE_FIRMWARE_UPDATE_PAYLOAD_COUNT':len(plausible_payload),
              'PLAUSIBLE_FIRMWARE_UPDATE_PAYLOADS':plausible_payload[:100],
              'SYSTEM_RECOVER_IS_STOCK_FIRMWARE_BACKUP_PROVEN':False,
              'ACPWORKBENCH_PRODUCTION_18B4_06B7_LINKAGE_PROVEN':False,
              'SAFE_READ_ONLY_STOCK_BACKUP_PROVEN':False,
              'PRODUCTION_BOOTSTRAP_BRIDGE_PROVEN':False,
              'PRODUCTION_RECOVERY_USB_IDENTITY_PROVEN':False,
              'ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD':False,
              'AA55_LIVE_RETEST_ALLOWED':False,
              'RUNTIME_0X11_ALLOWED':False,
              'RUNTIME_0XFE_ALLOWED':False,
              'VENDOR_BINARY_EXECUTED':False,
              'USB_DEVICE_ACCESSED':False,
              'BOARD_CONTACTED':False,
              'FLASH_ALLOWED':False,
              'IMPORTANT_INTERPRETATION':'system_recover_enable / UI Recover are only ACPWorkbench feature semantics unless independently tied to a read-back or stock-firmware backup flow. No such semantics authorize live use.',
              'NEXT':('Statically characterize the inert firmware/update payload candidate(s) and references only; do not execute or transmit them.' if plausible_payload else 'No production identity or stock-backup linkage and no plausible standalone firmware payload were proven in this package. Close ACPWorkbench as a production recovery/backup source and pivot to acquiring exact production firmware/update artifacts or production-specific documentation. No live transmission is authorized.')
          }
          (ev/'R137_DECISION.json').write_text(json.dumps(decision,indent=2,ensure_ascii=False)+'\n')
          report=[
              '# R137 ACPWorkbench System Recover / payload static audit','',
              f'- Recover/Reset/Sleep contexts: {len(recover)}',
              f'- explicit stock backup/readback contexts: {len(backup)}',
              f'- Recover contexts also containing explicit backup/readback: {len(recover_with_backup)}',
              f'- production-ID text contexts: {len(prod)}',
              f'- plausible standalone firmware/update payloads: {len(plausible_payload)}','',
              '## Safety','- Offline static only.','- No vendor EXE/DLL executed.','- No USB/board access.',
              '- AA55 / 0x11 / 0xFE / erase / program / flash remain blocked.','- FLASH_ALLOWED=NO']
          (ev/'R137_REPORT_TH.md').write_text('\n'.join(report)+'\n')
          print(json.dumps(decision,indent=2,ensure_ascii=False))
          PY

      - name: Package R137 evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r137/evidence
          zip -9 -r /tmp/R137_EXACT_ACPWORKBENCH_SYSTEM_RECOVER_PAYLOAD_STATIC_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/R137_EXACT_ACPWORKBENCH_SYSTEM_RECOVER_PAYLOAD_STATIC_EVIDENCE.zip > /tmp/R137_EXACT_ACPWORKBENCH_SYSTEM_RECOVER_PAYLOAD_STATIC_EVIDENCE.zip.sha256

      - name: Upload R137 evidence
        uses: actions/upload-artifact@v4
        with:
          name: R137-EXACT-ACPWORKBENCH-SYSTEM-RECOVER-PAYLOAD-STATIC-EVIDENCE
          path: |
            /tmp/R137_EXACT_ACPWORKBENCH_SYSTEM_RECOVER_PAYLOAD_STATIC_EVIDENCE.zip
            /tmp/R137_EXACT_ACPWORKBENCH_SYSTEM_RECOVER_PAYLOAD_STATIC_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'R137_VENDOR_BINARY_EXECUTED=NO' /tmp/r137/evidence/R137_SAFETY.txt
          grep -F 'R137_USB_DEVICE_ACCESS=NO' /tmp/r137/evidence/R137_SAFETY.txt
          grep -F 'R137_BOARD_CONTACT=NO' /tmp/r137/evidence/R137_SAFETY.txt
          grep -F 'R137_AA55_SENT=NO' /tmp/r137/evidence/R137_SAFETY.txt
          grep -F 'R137_RUNTIME_0X11_SENT=NO' /tmp/r137/evidence/R137_SAFETY.txt
          grep -F 'R137_RUNTIME_0XFE_SENT=NO' /tmp/r137/evidence/R137_SAFETY.txt
          grep -F '"FLASH_ALLOWED": false' /tmp/r137/evidence/R137_DECISION.json
          echo R137_STATIC_AUDIT_COMPLETE=YES
          echo FLASH_ALLOWED=NO
