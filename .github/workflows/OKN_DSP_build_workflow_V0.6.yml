name: Build OKN DSP APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  PROJECT_ZIP: OKN_DSP_Android_BLE_Logger_V0.6.zip

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate project ZIP
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$PROJECT_ZIP" ]]; then
            echo "ZIP_PATH=$PROJECT_ZIP" >> "$GITHUB_ENV"
          else
            found=$(find . -maxdepth 3 -type f -name '*.zip' -print | head -n 1 || true)
            if [[ -z "$found" ]]; then
              echo "No project ZIP found. Upload OKN_DSP_Android_BLE_Logger_V0.6.zip to the repository root."
              exit 1
            fi
            echo "ZIP_PATH=$found" >> "$GITHUB_ENV"
          fi

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir project
          unzip -q "$ZIP_PATH" -d project
          root=$(find project -type f -name settings.gradle.kts -print -quit | xargs -r dirname)
          if [[ -z "$root" ]]; then
            echo "settings.gradle.kts not found in ZIP"
            exit 1
          fi
          echo "PROJECT_ROOT=$root" >> "$GITHUB_ENV"
          echo "Project root: $root"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-v0.6.0-debug
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: success()
        run: |
          {
            echo '## OKN DSP APK v0.6.0'
            echo 'Build completed successfully.'
            echo 'Artifact: **OKN-DSP-v0.6.0-debug**'
          } >> "$GITHUB_STEP_SUMMARY"
