      - name: Sanity-check recovered protocol and 15-band UI
        shell: bash
        run: |
          set -euo pipefail
          grep -q "UFE_WRITE_ACTUATOR_COMMAND = 87" app/src/main/java/com/okn/peramp/DspProtocol.java
          grep -q "UFE_READ_SENSOR_ACTUATOR_JSON_COMMAND = 89" app/src/main/java/com/okn/peramp/DspProtocol.java
          grep -q "40af0001-9479-43f6-ae95-c45fb2afb9d2" app/src/main/java/com/okn/peramp/BleClient.java
          grep -q "0000ab00-0000-1000-8000-00805f9b34fb" app/src/main/java/com/okn/peramp/BleClient.java
          grep -q "0000ffe0-0000-1000-8000-00805f9b34fb" app/src/main/java/com/okn/peramp/BleClient.java
          python3 - <<'PY'
          import re
          s=open("app/src/main/java/com/okn/peramp/MainActivity.java", encoding="utf-8").read()
          m=re.search(r"DEFAULT_FREQS = \{([^}]*)\}", s)
          assert m, "DEFAULT_FREQS not found"
          vals=[x.strip() for x in m.group(1).split(",") if x.strip()]
          assert len(vals)==15, f"expected 15 EQ bands, got {len(vals)}"
          print("EQ bands:", vals)
          PY

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Package outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/OKN-Peramp-debug.apk
          sha256sum dist/OKN-Peramp-debug.apk | tee dist/SHA256SUMS.txt
          zip -qr dist/OKN-Peramp-source.zip settings.gradle build.gradle gradle.properties EXTRACTED_REFERENCE.md app
          ls -lh dist

      - name: Upload OKN Peramp artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OKN-Peramp
          path: dist/*
          if-no-files-found: error
          retention-days: 30
