name: OKN BP1048P4 MASTER V54 MEGA NEW FIRMWARE V2 + ANDROID APP BUILD

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/OKN_BP1048P4_MASTER_V54_MEGA_NEW_FIRMWARE_V2_PLUS_ANDROID_APP_BUILD.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  REQUIRED_PHONE: "Samsung Galaxy S25+"
  REQUIRED_PATH: "Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only"
  SDK_REPO: "https://github.com/leadercxn/bp1048_sdk_v0.1.12.git"
  SDK_COMMIT: "8105bd864b04995d81c9f9ae77cb158259f39015"
  TOOLCHAIN_REPO: "https://github.com/xingrz/nds-builder.git"
  TOOLCHAIN_COMMIT: "572969caccb1d0c576b2893c905fa7b3396815e4"
  TOOLCHAIN_SHA256: "a231682172de4af23ac94726c021a824f1ae7d1f7c72a4619093b90caa7de0e4"
  SOURCE_ZIP_SHA256: "05b408f1d7b066acfaca0f869365f163a5050bc1968b229c70370f1be2efa58d"
  FLASH_ALLOWED: "NO"
  ERASE_ALLOWED: "NO"
  WRITE_ALLOWED: "NO"
  FEATURE_REPORT_ALLOWED: "NO"
  NEW_LIVE_0X11_ALLOWED: "NO"
  SOLDERING_ALLOWED: "NO"
  BOARD_MODIFICATION_ALLOWED: "NO"
  EXTERNAL_PROGRAMMER_ALLOWED: "NO"

jobs:
  v54:
    name: Build our firmware and Android app in one run
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Gate 0 - immutable rules
        shell: bash
        run: |
          set -euo pipefail
          test "$REQUIRED_PATH" = "Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only"
          test "$FLASH_ALLOWED" = "NO"
          test "$FEATURE_REPORT_ALLOWED" = "NO"
          test "$NEW_LIVE_0X11_ALLOWED" = "NO"
          test "$SOLDERING_ALLOWED" = "NO"
          test "$BOARD_MODIFICATION_ALLOWED" = "NO"
          test "$EXTERNAL_PROGRAMMER_ALLOWED" = "NO"
          rm -rf /tmp/v54
          mkdir -p /tmp/v54/{src,sdk,toolchain-source,toolchain,build,evidence,out}

      - name: Materialize V2 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYSRC'
          import base64,pathlib
          pathlib.Path('/tmp/v54/source.zip').write_bytes(base64.b64decode(''))
          PYSRC
          echo "$SOURCE_ZIP_SHA256  /tmp/v54/source.zip" | sha256sum -c -
          unzip -q /tmp/v54/source.zip -d /tmp/v54/src
          P=/tmp/v54/src/OKN_BP1048P4_NEW_FIRMWARE_V2
          test -s "$P/src/okn7_protocol.c"
          test -s "$P/android_app/app/src/main/java/com/okn/bp1048p4/MainActivity.java"
          find "$P" -type f -printf '%P\n' | sort > /tmp/v54/evidence/00_SOURCE_INVENTORY.txt

      - name: Host DSP + firmware protocol tests
        shell: bash
        run: |
          set -euo pipefail
          P=/tmp/v54/src/OKN_BP1048P4_NEW_FIRMWARE_V2
          gcc -std=c11 -Wall -Wextra -Werror -I"$P/tests/stub" -I"$P/src" \
            "$P/tests/stub/eq_stub.c" "$P/src/okn7_dsp.c" "$P/tests/test_okn7.c" \
            -o /tmp/v54/build/test_dsp
          /tmp/v54/build/test_dsp | tee /tmp/v54/evidence/01_HOST_DSP_TEST.txt
          gcc -std=c11 -Wall -Wextra -Werror -I"$P/tests/stub" -I"$P/src" \
            "$P/tests/stub/eq_stub.c" "$P/src/okn7_dsp.c" "$P/src/okn7_protocol.c" \
            "$P/tests/test_okn7_protocol.c" -o /tmp/v54/build/test_protocol
          /tmp/v54/build/test_protocol | tee /tmp/v54/evidence/02_HOST_PROTOCOL_TEST.txt

      - name: JVM cross-check Android packet codec
        shell: bash
        run: |
          set -euo pipefail
          P=/tmp/v54/src/OKN_BP1048P4_NEW_FIRMWARE_V2
          mkdir -p /tmp/v54/build/java
          javac -d /tmp/v54/build/java \
            "$P/android_app/app/src/main/java/com/okn/bp1048p4/Protocol.java" \
            "$P/tests/ProtocolJvmTest.java"
          java -cp /tmp/v54/build/java ProtocolJvmTest | tee /tmp/v54/evidence/03_JAVA_PROTOCOL_TEST.txt

      - name: Clone pinned SDK and apply our runtime bridge
        shell: bash
        run: |
          set -euo pipefail
          P=/tmp/v54/src/OKN_BP1048P4_NEW_FIRMWARE_V2
          git clone -q "$SDK_REPO" /tmp/v54/sdk/repo
          git -C /tmp/v54/sdk/repo checkout -q "$SDK_COMMIT"
          test "$(git -C /tmp/v54/sdk/repo rev-parse HEAD)" = "$SDK_COMMIT"
          python3 "$P/integration/patch_sdk.py" /tmp/v54/sdk/repo "$P" | tee /tmp/v54/evidence/04_SDK_PATCH.txt
          grep -q "OKN7_USB_REPORT_BYTES" /tmp/v54/sdk/repo/BT_Audio_APP/bt_audio_app_src/audio/communication.c

      - name: Acquire exact NDS32 D1088 toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libc6-i386 lib32z1 xz-utils
          git init -q /tmp/v54/toolchain-source
          git -C /tmp/v54/toolchain-source remote add origin "$TOOLCHAIN_REPO"
          git -C /tmp/v54/toolchain-source fetch -q --depth 1 origin "$TOOLCHAIN_COMMIT"
          git -C /tmp/v54/toolchain-source checkout -q --detach FETCH_HEAD
          echo "$TOOLCHAIN_SHA256  /tmp/v54/toolchain-source/nds32le-elf-mculib-v3s.4.9.4.txz" | sha256sum -c -
          tar -xJf /tmp/v54/toolchain-source/nds32le-elf-mculib-v3s.4.9.4.txz -C /tmp/v54/toolchain
          CC=/tmp/v54/toolchain/nds32le-elf-mculib-v3s/bin/nds32le-elf-gcc
          "$CC" --version | tee /tmp/v54/evidence/05_COMPILER.txt
          "$CC" -dumpmachine | tee /tmp/v54/evidence/06_TARGET.txt

      - name: Target compile all new firmware modules
        shell: bash
        run: |
          set -euo pipefail
          P=/tmp/v54/src/OKN_BP1048P4_NEW_FIRMWARE_V2
          S=/tmp/v54/sdk/repo
          CC=/tmp/v54/toolchain/nds32le-elf-mculib-v3s/bin/nds32le-elf-gcc
          CFLAGS="-mcpu=d1088-spu -mext-dsp -Os -ffunction-sections -fdata-sections -Wall -Wextra"
          INC="-I$P/src -I$P/integration -I$S/MVsB1_Base_SDK/middleware/audio/inc -I$S/MVsB1_Base_SDK/middleware/mv_utils/inc -I$S/MVsB1_Base_SDK/driver/driver/inc -I$S/MVsB1_Base_SDK/driver/driver_api/inc"
          for src in "$P/src/okn7_dsp.c" "$P/src/okn7_protocol.c" "$P/src/okn7_target_io.c" "$P/integration/okn7_bt_audio_hook.c"; do
            b="$(basename "$src" .c)"
            "$CC" $CFLAGS $INC -c "$src" -o "/tmp/v54/build/$b.o"
          done
          /tmp/v54/toolchain/nds32le-elf-mculib-v3s/bin/nds32le-elf-readelf -h /tmp/v54/build/okn7_protocol.o > /tmp/v54/evidence/07_TARGET_OBJECT_HEADER.txt

      - name: Relocatable link against real MVSilicon libraries
        shell: bash
        run: |
          set -euo pipefail
          S=/tmp/v54/sdk/repo
          CC=/tmp/v54/toolchain/nds32le-elf-mculib-v3s/bin/nds32le-elf-gcc
          "$CC" -mcpu=d1088-spu -mext-dsp -r -nostdlib \
            /tmp/v54/build/okn7_dsp.o /tmp/v54/build/okn7_protocol.o \
            /tmp/v54/build/okn7_target_io.o /tmp/v54/build/okn7_bt_audio_hook.o \
            -Wl,--start-group \
            "$S/MVsB1_Base_SDK/middleware/audio/libAudioEffectLibrary.a" \
            "$S/MVsB1_Base_SDK/driver/driver/libDriver.a" \
            -lm -lc -lgcc -ldsp -Wl,--end-group \
            -Wl,-Map,/tmp/v54/evidence/08_OKN7_V2_COMBINED.map \
            -o /tmp/v54/build/OKN7_BP1048P4_V2_combined.o \
            2>&1 | tee /tmp/v54/evidence/09_RELOC_LINK.txt
          test -s /tmp/v54/build/OKN7_BP1048P4_V2_combined.o

      - name: Static USB runtime safety audit
        shell: bash
        run: |
          set -euo pipefail
          P=/tmp/v54/src/OKN_BP1048P4_NEW_FIRMWARE_V2
          grep -q "0x0200" "$P/android_app/app/src/main/java/com/okn/bp1048p4/UsbHidTransport.java"
          grep -q "0x0100" "$P/android_app/app/src/main/java/com/okn/bp1048p4/UsbHidTransport.java"
          ! grep -q "0x0300" "$P/android_app/app/src/main/java/com/okn/bp1048p4/UsbHidTransport.java"
          grep -q "0x11 forbidden" "$P/android_app/app/src/main/java/com/okn/bp1048p4/Protocol.java"
          grep -q "0x11u" "$P/src/okn7_protocol.c"

      - name: Build Android controller APK
        shell: bash
        run: |
          set -euo pipefail
          P=/tmp/v54/src/OKN_BP1048P4_NEW_FIRMWARE_V2/android_app
          curl -fL --retry 5 --retry-all-errors https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/v54/gradle.zip
          unzip -q /tmp/v54/gradle.zip -d /tmp/v54
          cd "$P"
          /tmp/v54/gradle-8.9/bin/gradle --no-daemon :app:assembleDebug | tee /tmp/v54/evidence/10_ANDROID_BUILD.txt
          APK="$P/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" /tmp/v54/build/OKN_BP1048P4_V2_CONTROLLER.apk
          sha256sum "$APK" > /tmp/v54/evidence/11_APK_SHA256.txt

      - name: Build reference-layout smoke image - never first flash
        shell: bash
        run: |
          set -euo pipefail
          P=/tmp/v54/src/OKN_BP1048P4_NEW_FIRMWARE_V2
          S=/tmp/v54/sdk/repo
          CC=/tmp/v54/toolchain/nds32le-elf-mculib-v3s/bin/nds32le-elf-gcc
          OBJCOPY=/tmp/v54/toolchain/nds32le-elf-mculib-v3s/bin/nds32le-elf-objcopy
          cat > /tmp/v54/build/main_ref.c <<'EOF'
          #include "okn7_dsp.h"
          #include "okn7_protocol.h"
          static okn7_dsp_t g;
          int main(void){okn7_dsp_init(&g,48000u);okn7_protocol_bind(&g);for(;;){}return 0;}
          EOF
          INC="-I$P/src -I$S/MVsB1_Base_SDK/middleware/audio/inc -I$S/MVsB1_Base_SDK/middleware/mv_utils/inc -I$S/MVsB1_Base_SDK/driver/driver/inc -I$S/MVsB1_Base_SDK/driver/driver_api/inc"
          "$CC" -mcpu=d1088-spu -mext-dsp -Os $INC -c /tmp/v54/build/main_ref.c -o /tmp/v54/build/main_ref.o
          set +e
          "$CC" -nostartfiles -static -mcmodel=medium -ldsp -mext-dsp \
            -T"$S/MVsB1_Base_SDK/examples/Example_GPIO/nds32-ae210p.ld" -Wl,--gc-sections \
            "$S/MVsB1_Base_SDK/examples/Example_GPIO/Debug/startup/crt0.o" \
            "$S/MVsB1_Base_SDK/examples/Example_GPIO/Debug/startup/init-default.o" \
            "$S/MVsB1_Base_SDK/examples/Example_GPIO/Debug/startup/interrupt.o" \
            "$S/MVsB1_Base_SDK/examples/Example_GPIO/Debug/startup/retarget.o" \
            /tmp/v54/build/main_ref.o /tmp/v54/build/okn7_dsp.o /tmp/v54/build/okn7_protocol.o \
            -Wl,--start-group "$S/MVsB1_Base_SDK/middleware/audio/libAudioEffectLibrary.a" "$S/MVsB1_Base_SDK/driver/driver/libDriver.a" -lm -lc -lgcc -ldsp -Wl,--end-group \
            -Wl,-Map,/tmp/v54/evidence/12_REFERENCE_LINK.map \
            -o /tmp/v54/build/OKN7_V2_REFERENCE_LAYOUT_SMOKE.adx > /tmp/v54/evidence/13_REFERENCE_LINK.log 2>&1
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            "$OBJCOPY" -S -O binary /tmp/v54/build/OKN7_V2_REFERENCE_LAYOUT_SMOKE.adx /tmp/v54/build/OKN7_V2_REFERENCE_LAYOUT_NOT_FOR_FIRST_FLASH.bin
            echo "REFERENCE_LINK_SUCCEEDED=true" > /tmp/v54/evidence/14_REFERENCE_RESULT.txt
          else
            echo "REFERENCE_LINK_SUCCEEDED=false" > /tmp/v54/evidence/14_REFERENCE_RESULT.txt
          fi
          echo "PRODUCTION_LAYOUT_PROVEN=false" >> /tmp/v54/evidence/14_REFERENCE_RESULT.txt
          echo "FIRST_FLASH_ALLOWED=false" >> /tmp/v54/evidence/14_REFERENCE_RESULT.txt

      - name: Package firmware + APK + source
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/v54/source.zip /tmp/v54/out/OKN_BP1048P4_NEW_FIRMWARE_V2_PLUS_ANDROID_APP_SOURCE.zip
          cp /tmp/v54/build/OKN7_BP1048P4_V2_combined.o /tmp/v54/out/
          cp /tmp/v54/build/OKN_BP1048P4_V2_CONTROLLER.apk /tmp/v54/out/
          cp /tmp/v54/build/OKN7_V2_REFERENCE_LAYOUT_SMOKE.adx /tmp/v54/out/ 2>/dev/null || true
          cp /tmp/v54/build/OKN7_V2_REFERENCE_LAYOUT_NOT_FOR_FIRST_FLASH.bin /tmp/v54/out/ 2>/dev/null || true
          cp /tmp/v54/evidence/* /tmp/v54/out/
          cat > /tmp/v54/out/15_V54_FINAL_DECISION.md <<'EOF'
          # V54 — OUR FIRMWARE + OUR ANDROID APP

          Built together:
          - 7-channel DSP firmware
          - 15 PEQ/channel
          - dedicated Gain after PEQ
          - Gain IDs 22..28 owned by our new schema
          - our ASCII HID runtime protocol + CRC
          - hard rejection of byte 0x11
          - HID Output/Input only; no Feature report
          - Samsung S25+ Android controller
          - CH1..CH7 Gain +/-
          - mute
          - 15 PEQ band +/- controls
          - D1088 target objects + MVSilicon library link

          Runtime app/firmware is now our own design. The stock Device Description is no longer a runtime dependency.
          First deployment onto a stock board is still a separate bootstrap step. Any reference-layout BIN emitted here is NOT_FOR_FIRST_FLASH.
          FLASH_ALLOWED=NO
          EOF
          (cd /tmp/v54/out && sha256sum * > SHA256SUMS.txt)

      - name: Upload V54 combined implementation artifact
        uses: actions/upload-artifact@v7
        with:
          name: OKN-BP1048P4-MASTER-V54-OUR-FIRMWARE-V2-PLUS-ANDROID-APP
          path: /tmp/v54/out/*
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed assertion
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          test "$NEW_LIVE_0X11_ALLOWED" = "NO"
          test "$FEATURE_REPORT_ALLOWED" = "NO"
          test -s /tmp/v54/build/OKN7_BP1048P4_V2_combined.o
          test -s /tmp/v54/build/OKN_BP1048P4_V2_CONTROLLER.apk
          grep -q "no-0x11" /tmp/v54/evidence/02_HOST_PROTOCOL_TEST.txt
          echo "MASTER_V54=PASS"
          echo "OUR_FIRMWARE=BUILT"
          echo "OUR_ANDROID_APP=BUILT"
          echo "FLASH_ALLOWED=NO"
