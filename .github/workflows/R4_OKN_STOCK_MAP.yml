name: R4_OKN_STOCK_MAP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/okn/dsp/r4

          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "R4_OKN_STOCK_MAP"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
          }

          android {
            namespace 'com.okn.dsp.r4'
            compileSdk 35

            defaultConfig {
              applicationId "com.okn.dsp.r4"
              minSdk 26
              targetSdk 35
              versionCode 4
              versionName "4.0-stock-map"
            }

            buildTypes {
              debug { debuggable true }
              release { minifyEnabled false }
            }

            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-feature
              android:name="android.hardware.usb.host"
              android:required="true"/>

            <application
              android:allowBackup="false"
              android:label="R4 OKN STOCK MAP"
              android:theme="@android:style/Theme.Material.Light.NoActionBar">

              <activity
                android:name=".MainActivity"
                android:exported="true">

                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>

              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/okn/dsp/r4/MainActivity.java <<'EOF'
          package com.okn.dsp.r4;

          import android.app.Activity;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.hardware.usb.UsbConstants;
          import android.hardware.usb.UsbDevice;
          import android.hardware.usb.UsbDeviceConnection;
          import android.hardware.usb.UsbInterface;
          import android.hardware.usb.UsbManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;

          public final class MainActivity extends Activity {
            private static final String ACTION_USB_PERMISSION =
                "com.okn.dsp.r4.USB_PERMISSION";

            private static final int VID = 0x6324;
            private static final int PID = 0x1719;
            private static final int IF4 = 4;

            private static final int HID_GET_REPORT = 0x01;
            private static final int HID_SET_REPORT = 0x09;
            private static final int REPORT_INPUT = 1;
            private static final int REPORT_OUTPUT = 2;
            private static final int REPORT_FEATURE = 3;

            private static final int EFFECT_GAIN = 15;

            private UsbManager usb;
            private UsbDevice dev;
            private TextView logView;
            private final StringBuilder log = new StringBuilder();

            private final BroadcastReceiver receiver =
                new BroadcastReceiver() {
                  @Override public void onReceive(Context c, Intent i) {
                    if (!ACTION_USB_PERMISSION.equals(i.getAction())) return;

                    UsbDevice d;
                    if (Build.VERSION.SDK_INT >= 33) {
                      d = i.getParcelableExtra(
                          UsbManager.EXTRA_DEVICE,
                          UsbDevice.class);
                    } else {
                      @SuppressWarnings("deprecation")
                      UsbDevice old =
                          i.getParcelableExtra(UsbManager.EXTRA_DEVICE);
                      d = old;
                    }

                    boolean granted = i.getBooleanExtra(
                        UsbManager.EXTRA_PERMISSION_GRANTED,
                        false);

                    add("USB permission=" + granted);

                    if (granted && d != null && isTarget(d)) {
                      dev = d;
                      baseline();
                    }
                  }
                };

            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              usb = (UsbManager)getSystemService(Context.USB_SERVICE);

              IntentFilter f = new IntentFilter(ACTION_USB_PERMISSION);
              if (Build.VERSION.SDK_INT >= 33) {
                registerReceiver(
                    receiver,
                    f,
                    Context.RECEIVER_NOT_EXPORTED);
              } else {
                registerReceiver(receiver, f);
              }

              LinearLayout root = new LinearLayout(this);
              root.setOrientation(LinearLayout.VERTICAL);
              root.setPadding(24,24,24,24);

              TextView title = new TextView(this);
              title.setText("R4 OKN — STOCK DSP MAP");
              title.setTextSize(20);
              root.addView(title);

              TextView safety = new TextView(this);
              safety.setText(
                  "READ-ONLY stock commands. Reads DAC0/DACX/I2S and " +
                  "real GainControl effects. No EQ write. " +
                  "No parameter write. No flash/erase/reset.");
              root.addView(safety);

              Button scan = new Button(this);
              scan.setText("1. SCAN + BASELINE");
              scan.setOnClickListener(v -> scan());
              root.addView(scan);

              Button run = new Button(this);
              run.setText("2. READ STOCK MAP");
              run.setOnClickListener(v ->
                  new Thread(this::mapWorker, "r4-map").start());
              root.addView(run);

              Button copy = new Button(this);
              copy.setText("3. COPY LOG");
              copy.setOnClickListener(v -> copyLog());
              root.addView(copy);

              logView = new TextView(this);
              logView.setTextIsSelectable(true);

              ScrollView sv = new ScrollView(this);
              sv.addView(logView);

              root.addView(
                  sv,
                  new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      0,
                      1f));

              setContentView(root);

              add("R4 STOCK protocol mapper");
              add("Target 6324:1719 / IF4 HID DATA");
              scan();
            }

            @Override protected void onDestroy() {
              try { unregisterReceiver(receiver); }
              catch (Throwable ignored) {}
              super.onDestroy();
            }

            private boolean isTarget(UsbDevice d) {
              return d.getVendorId() == VID &&
                     d.getProductId() == PID;
            }

            private void scan() {
              dev = null;
              add("");
              add("=== SCAN ===");

              for (Map.Entry<String,UsbDevice> e :
                  usb.getDeviceList().entrySet()) {

                UsbDevice d = e.getValue();

                add(String.format(
                    Locale.US,
                    "%04X:%04X ifaces=%d",
                    d.getVendorId(),
                    d.getProductId(),
                    d.getInterfaceCount()));

                if (isTarget(d)) dev = d;
              }

              if (dev == null) {
                add("Target 6324:1719 not found.");
                return;
              }

              add("Exact target found.");

              if (!usb.hasPermission(dev)) {
                int flags = PendingIntent.FLAG_UPDATE_CURRENT;

                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                  flags |= PendingIntent.FLAG_MUTABLE;
                }

                PendingIntent pi = PendingIntent.getBroadcast(
                    this,
                    0,
                    new Intent(ACTION_USB_PERMISSION)
                        .setPackage(getPackageName()),
                    flags);

                add("Requesting USB permission...");
                usb.requestPermission(dev, pi);
              } else {
                baseline();
              }
            }

            private UsbInterface findIf4() {
              if (dev == null) return null;

              for (int i = 0; i < dev.getInterfaceCount(); i++) {
                UsbInterface f = dev.getInterface(i);
                if (f.getId() == IF4) return f;
              }

              return null;
            }

            private void baseline() {
              UsbInterface f4 = findIf4();

              add("");
              add("=== BASELINE ===");

              if (f4 == null) {
                add("IF4 missing.");
                return;
              }

              add(
                  "IF4 id=" + f4.getId() +
                  " class=" + f4.getInterfaceClass() +
                  " eps=" + f4.getEndpointCount());

              if (f4.getInterfaceClass() !=
                  UsbConstants.USB_CLASS_HID) {
                add("REFUSED: IF4 is not HID.");
                return;
              }

              UsbDeviceConnection c = usb.openDevice(dev);

              if (c == null) {
                add("openDevice failed.");
                return;
              }

              try {
                byte[] feat = new byte[8];

                int rc = c.controlTransfer(
                    0xA1,
                    HID_GET_REPORT,
                    REPORT_FEATURE << 8,
                    IF4,
                    feat,
                    feat.length,
                    1000);

                add(
                    "Feature8 rc=" + rc +
                    " data=" + hex(feat, rc));
              } finally {
                c.close();
              }
            }

            private void mapWorker() {
              if (dev == null || !isTarget(dev)) {
                add("Target missing. Press SCAN first.");
                return;
              }

              if (!usb.hasPermission(dev)) {
                add("USB permission missing.");
                return;
              }

              UsbInterface f4 = findIf4();

              if (f4 == null ||
                  f4.getInterfaceClass() !=
                  UsbConstants.USB_CLASS_HID) {
                add("REFUSED: IF4 HID missing.");
                return;
              }

              UsbDeviceConnection c = usb.openDevice(dev);

              if (c == null) {
                add("openDevice failed.");
                return;
              }

              boolean claimed = false;

              try {
                claimed = c.claimInterface(f4, true);

                add("");
                add("=== STOCK MAP ===");
                add("claim IF4=" + claimed);

                if (!claimed) return;

                show(query(c, 0x00, new byte[0], "VERSION"));
                show(query(c, 0x02, new byte[0], "SYSTEM"));

                Resp dac0 =
                    query(c, 0x09, new byte[0], "DAC0");
                show(dac0);
                parseDac("DAC0", dac0);

                Resp dacx =
                    query(c, 0x0A, new byte[0], "DACX");
                show(dacx);
                parseDac("DACX", dacx);

                show(query(c, 0x0B, new byte[0], "I2S0"));
                show(query(c, 0x0C, new byte[0], "I2S1"));

                Resp list =
                    query(
                        c,
                        0x80,
                        new byte[]{0},
                        "EFFECT_LIST");

                show(list);

                List<Integer> gainIndexes =
                    parseEffectList(list);

                add("");
                add("GAIN EFFECT COUNT=" + gainIndexes.size());

                for (int index : gainIndexes) {
                  Resp nameResp =
                      query(
                          c,
                          0x80,
                          new byte[]{(byte)index},
                          "NAME#" + index);

                  String name = parseName(nameResp);

                  int control = 0x80 + index;

                  Resp gainResp =
                      query(
                          c,
                          control,
                          new byte[0],
                          "GAIN#" + index);

                  Gain g = parseGain(gainResp);

                  add(String.format(
                      Locale.US,
                      "GAIN index=%d control=0x%02X " +
                      "name=\"%s\" enable=%s mute=%s rawGain=%s",
                      index,
                      control,
                      name,
                      g == null ? "?" : Integer.toString(g.enable),
                      g == null ? "?" : Integer.toString(g.mute),
                      g == null ? "?" : Integer.toString(g.rawGain)));
                }

                add("");
                add("R4 DONE — READ ONLY");

              } catch (Throwable t) {
                add(
                    "ERROR " +
                    t.getClass().getSimpleName() +
                    ": " +
                    t.getMessage());
              } finally {
                if (claimed) {
                  try { c.releaseInterface(f4); }
                  catch (Throwable ignored) {}
                }

                c.close();
              }
            }

            private Resp query(
                UsbDeviceConnection c,
                int control,
                byte[] payload,
                String label) throws Exception {

              byte[] tx = new byte[256];

              tx[0] = (byte)0xA5;
              tx[1] = (byte)0x5A;
              tx[2] = (byte)(control & 0xFF);
              tx[3] = (byte)(payload.length & 0xFF);

              System.arraycopy(
                  payload,
                  0,
                  tx,
                  4,
                  payload.length);

              tx[4 + payload.length] = 0x16;

              add(
                  label +
                  " TX=" +
                  hex(tx, payload.length + 5));

              int out = c.controlTransfer(
                  0x21,
                  HID_SET_REPORT,
                  REPORT_OUTPUT << 8,
                  IF4,
                  tx,
                  tx.length,
                  1500);

              add(label + " SET_REPORT rc=" + out);

              if (out != 256) {
                return new Resp(
                    label,
                    control,
                    out,
                    0,
                    new byte[0]);
              }

              Thread.sleep(25);

              byte[] best = new byte[0];
              int bestRc = 0;

              for (int i = 1; i <= 4; i++) {
                byte[] rx = new byte[256];

                int rc = c.controlTransfer(
                    0xA1,
                    HID_GET_REPORT,
                    REPORT_INPUT << 8,
                    IF4,
                    rx,
                    rx.length,
                    1000);

                add(
                    label +
                    " GET_REPORT #" + i +
                    " rc=" + rc +
                    (rc > 0
                        ? " rx=" + hex(
                            rx,
                            logicalLength(rx, rc))
                        : ""));

                if (rc > 0) {
                  bestRc = rc;
                  best = rx;

                  if (validControl(
                      rx,
                      rc,
                      control)) {
                    break;
                  }
                }

                Thread.sleep(15);
              }

              return new Resp(
                  label,
                  control,
                  out,
                  bestRc,
                  best);
            }

            private void show(Resp r) {
              if (r.rxRc <= 0) {
                add(r.label + " RESULT=<no response>");
                return;
              }

              if (!validControl(
                  r.rx,
                  r.rxRc,
                  r.control)) {
                add(
                    r.label +
                    " RESULT=<unexpected/stale response>");
                return;
              }

              add(
                  r.label +
                  " RESULT=VALID control=0x" +
                  String.format(
                      Locale.US,
                      "%02X",
                      r.control));
            }

            private boolean validControl(
                byte[] b,
                int n,
                int control) {

              return n >= 5 &&
                  (b[0] & 0xFF) == 0xA5 &&
                  (b[1] & 0xFF) == 0x5A &&
                  (b[2] & 0xFF) == (control & 0xFF);
            }

            private int logicalLength(
                byte[] b,
                int n) {

              if (n < 5) return Math.max(0, n);

              if ((b[0] & 0xFF) != 0xA5 ||
                  (b[1] & 0xFF) != 0x5A) {
                return Math.min(n, 64);
              }

              int total =
                  (b[3] & 0xFF) + 5;

              return Math.min(
                  Math.min(total, n),
                  128);
            }

            private void parseDac(
                String label,
                Resp r) {

              if (r.rxRc < 16 ||
                  !validControl(
                      r.rx,
                      r.rxRc,
                      r.control)) {
                return;
              }

              int payloadLen =
                  r.rx[3] & 0xFF;

              if (payloadLen < 9) return;

              int mute = u16le(r.rx, 9);
              int left = u16le(r.rx, 11);
              int right = u16le(r.rx, 13);

              add(
                  label +
                  " muteRaw=" + mute +
                  " LvolRaw=" + left +
                  " RvolRaw=" + right);
            }

            private List<Integer> parseEffectList(
                Resp r) {

              List<Integer> gains =
                  new ArrayList<>();

              if (r.rxRc < 7 ||
                  !validControl(
                      r.rx,
                      r.rxRc,
                      0x80)) {
                add("EFFECT LIST invalid/no response.");
                return gains;
              }

              int payloadLen =
                  r.rx[3] & 0xFF;

              int listIndex =
                  r.rx[4] & 0xFF;

              int sum =
                  r.rx[5] & 0xFF;

              add(
                  "EFFECT LIST index=" +
                  listIndex +
                  " effect_sum=" +
                  sum +
                  " payloadLen=" +
                  payloadLen);

              int pairs =
                  Math.max(
                      0,
                      (payloadLen - 2) / 2);

              int count =
                  Math.min(
                      sum,
                      pairs);

              StringBuilder types =
                  new StringBuilder();

              for (int i = 0; i < count; i++) {
                int type =
                    u16le(
                        r.rx,
                        6 + i * 2);

                int index = i + 1;

                if (i > 0) types.append(' ');

                types
                    .append(index)
                    .append(':')
                    .append(type);

                if (type == EFFECT_GAIN) {
                  gains.add(index);
                }
              }

              add("EFFECT TYPES " + types);
              return gains;
            }

            private String parseName(Resp r) {
              if (r.rxRc < 6 ||
                  !validControl(
                      r.rx,
                      r.rxRc,
                      0x80)) {
                return "<no-name>";
              }

              int payloadLen =
                  r.rx[3] & 0xFF;

              int len =
                  Math.min(
                      25,
                      Math.max(
                          0,
                          Math.min(
                              payloadLen - 1,
                              r.rxRc - 5)));

              if (len <= 0) {
                return "<no-name>";
              }

              byte[] s = new byte[len];

              System.arraycopy(
                  r.rx,
                  5,
                  s,
                  0,
                  len);

              String name =
                  new String(
                      s,
                      StandardCharsets.US_ASCII)
                      .replace("\u0000", "")
                      .trim();

              return name.isEmpty()
                  ? "<blank>"
                  : name;
            }

            private Gain parseGain(Resp r) {
              if (r.rxRc < 12 ||
                  !validControl(
                      r.rx,
                      r.rxRc,
                      r.control)) {
                return null;
              }

              int payloadLen =
                  r.rx[3] & 0xFF;

              if (payloadLen < 7) {
                return null;
              }

              if ((r.rx[4] & 0xFF) != 0xFF) {
                return null;
              }

              return new Gain(
                  u16le(r.rx, 5),
                  u16le(r.rx, 7),
                  u16le(r.rx, 9));
            }

            private static int u16le(
                byte[] b,
                int off) {

              if (off < 0 ||
                  off + 1 >= b.length) {
                return -1;
              }

              return
                  (b[off] & 0xFF) |
                  ((b[off + 1] & 0xFF) << 8);
            }

            private void copyLog() {
              ClipboardManager cb =
                  (ClipboardManager)
                  getSystemService(
                      CLIPBOARD_SERVICE);

              cb.setPrimaryClip(
                  ClipData.newPlainText(
                      "R4 OKN log",
                      log.toString()));

              add("Log copied.");
            }

            private void add(String s) {
              synchronized (log) {
                log.append(s).append('\n');
              }

              runOnUiThread(() -> {
                synchronized (log) {
                  logView.setText(log.toString());
                }
              });
            }

            private static String hex(
                byte[] a,
                int n) {

              if (a == null ||
                  n <= 0) {
                return "<none>";
              }

              int lim =
                  Math.min(
                      Math.min(
                          n,
                          a.length),
                      128);

              StringBuilder b =
                  new StringBuilder();

              for (int i = 0; i < lim; i++) {
                if (i > 0) b.append(' ');

                b.append(
                    String.format(
                        Locale.US,
                        "%02X",
                        a[i] & 0xFF));
              }

              return b.toString();
            }

            private static final class Resp {
              final String label;
              final int control;
              final int txRc;
              final int rxRc;
              final byte[] rx;

              Resp(
                  String label,
                  int control,
                  int txRc,
                  int rxRc,
                  byte[] rx) {

                this.label = label;
                this.control = control;
                this.txRc = txRc;
                this.rxRc = rxRc;
                this.rx = rx;
              }
            }

            private static final class Gain {
              final int enable;
              final int mute;
              final int rawGain;

              Gain(
                  int enable,
                  int mute,
                  int rawGain) {

                this.enable = enable;
                this.mute = mute;
                this.rawGain = rawGain;
              }
            }
          }
          EOF

      - name: Safety audit
        shell: bash
        run: |
          set -euo pipefail

          J=app/src/main/java/com/okn/dsp/r4/MainActivity.java

          grep -q 'VID = 0x6324' "$J"
          grep -q 'PID = 0x1719' "$J"
          grep -q 'IF4 = 4' "$J"
          grep -q 'EFFECT_GAIN = 15' "$J"

          grep -q '0x09, new byte\[0\], "DAC0"' "$J"
          grep -q '0x0A, new byte\[0\], "DACX"' "$J"
          grep -q '0x0B, new byte\[0\], "I2S0"' "$J"
          grep -q '0x0C, new byte\[0\], "I2S1"' "$J"
          grep -q '0x80,' "$J"

          ! grep -Eq \
            'SpiFlashErase|SpiFlashWrite|Reset_McuSystem|AudioDAC_VolSet|programFlash|flashWrite|enterBootloader' \
            "$J"

          echo "PASS R4 READ-ONLY STOCK MAP"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK=app/build/outputs/apk/debug/app-debug.apk

          test -s "$APK"

          cp "$APK" R4_OKN_STOCK_MAP.apk

          sha256sum \
            R4_OKN_STOCK_MAP.apk \
            | tee R4_OKN_STOCK_MAP_SHA256.txt

          cat > R4_STATUS.txt <<'EOF'
          R4 OKN STOCK MAP
          Target USB: 6324:1719
          HID DATA: IF4 / EP0

          READ-ONLY STOCK CONTROLS:
          0x00 version
          0x02 system
          0x09 DAC0
          0x0A DACX
          0x0B I2S0
          0x0C I2S1
          0x80 effect map / effect names

          Effect type 15 is treated as real GainControl.
          Each discovered GainControl is queried read-only.

          EQ write: NONE
          Parameter write: NONE
          Flash/erase/reset: NONE
          EOF

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: R4_OKN_STOCK_MAP_APK
          path: |
            R4_OKN_STOCK_MAP.apk
            R4_OKN_STOCK_MAP_SHA256.txt
            R4_STATUS.txt
          if-no-files-found: error
          retention-days: 30
