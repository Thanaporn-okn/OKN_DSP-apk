name: R157 N9 local29 local81 nonnull local93 loop branch audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R157_N9_LOCAL29_LOCAL81_NONNULL_LOCAL93_LOOP_BRANCH_AUDIT.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r157-n9-local29-local81-local93-${{ github.ref }}
  cancel-in-progress: true

env:
  FLASH_ALLOWED: "NO"
  R156_RUN_ID: "36025785849"
  R156_JOB_ID: "107721839523"
  R156_ARTIFACT_ID: "10819138866"
  R156_ARTIFACT_NAME: "R156-N9-LOCAL77-LOCAL79-REMAINDER-LOOP-SYMBOLIC-BRANCH-EVIDENCE"
  R156_ARTIFACT_DIGEST: "sha256:dfb6050eaf45e340216410c0c54d9753365f38dbb4233cdc4038b1fcf0d37364"

jobs:
  static_audit:
    name: STATIC ONLY - local29/local81 nonnull and local93 loop - no execution - no USB - no board
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r157/r156 /tmp/r157/evidence
          cat > /tmp/r157/evidence/R157_SAFETY.txt <<'EOF'
          R157_MODE=OFFLINE_STATIC_LOCAL29_LOCAL81_NONNULL_LOCAL93_LOOP_BRANCH_AUDIT_ONLY
          R157_VENDOR_BINARY_EXECUTED=NO
          R157_WINDOWS_EXE_EXECUTED=NO
          R157_DLL_EXECUTED=NO
          R157_APK_EXECUTED=NO
          R157_USB_DEVICE_ACCESS=NO
          R157_BOARD_CONTACT=NO
          R157_AA55_SENT=NO
          R157_LINEIN_AA55_SENT=NO
          R157_RUNTIME_0X11_SENT=NO
          R157_RUNTIME_0XFE_SENT=NO
          R157_FLASHBOOT_COMMAND_SENT=NO
          R157_FLASH_READ_EXECUTED=NO
          R157_FLASH_ERASE_EXECUTED=NO
          R157_FLASH_WRITE_EXECUTED=NO
          R157_OFFLINE_DECRYPT_EXECUTED=NO
          R157_ONE_BYTE_REPAIR_GUESS_ALLOWED=NO
          R157_ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD=NO
          HARDWARE_MODIFICATION=FORBIDDEN
          FLASH_ALLOWED=NO
          EOF

      - name: Download pinned R156 evidence
        uses: actions/download-artifact@v4
        with:
          name: R156-N9-LOCAL77-LOCAL79-REMAINDER-LOOP-SYMBOLIC-BRANCH-EVIDENCE
          path: /tmp/r157/r156
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 36025785849

      - name: Verify and extract pinned R156 evidence
        shell: bash
        run: |
          set -euo pipefail
          OUTER="$(find /tmp/r157/r156 -maxdepth 2 -type f -name 'R156_N9_LOCAL77_LOCAL79_REMAINDER_LOOP_SYMBOLIC_BRANCH_EVIDENCE.zip' -print -quit)"
          SUM="$(find /tmp/r157/r156 -maxdepth 2 -type f -name 'R156_N9_LOCAL77_LOCAL79_REMAINDER_LOOP_SYMBOLIC_BRANCH_EVIDENCE.zip.sha256' -print -quit)"
          test -n "$OUTER"; test -n "$SUM"
          EXPECTED="$(awk '{print $1}' "$SUM")"
          ACTUAL="$(sha256sum "$OUTER" | awk '{print $1}')"
          test "$EXPECTED" = "$ACTUAL"
          unzip -q "$OUTER" -d /tmp/r157/evidence/r156
          test -s /tmp/r157/evidence/r156/R156_DECISION.json
          test -s /tmp/r157/evidence/r156/r155/r154/r153/r152/r151/r150/R150_DECISION.json
          test -s /tmp/r157/evidence/r156/r155/r154/r153/r152/r151/r150/r149/r148/r147/r146/r145/r144/r143/R143_N9_METHOD.il
          grep -F '"UNACCOUNTED_CONDITIONAL_COUNT_AFTER_R156": 6' /tmp/r157/evidence/r156/R156_DECISION.json
          grep -F '"H15_REMAINDER_BYTES_MOD4": 3' /tmp/r157/evidence/r156/R156_DECISION.json
          grep -F '"OFFLINE_DECRYPT_AUTHORIZED": false' /tmp/r157/evidence/r156/R156_DECISION.json
          grep -F '"FLASH_ALLOWED": false' /tmp/r157/evidence/r156/R156_DECISION.json

      - name: Prove local29 local81 nonnull and local93 loop semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,json

          ev=Path('/tmp/r157/evidence')
          root=ev/'r156'
          prev=json.loads((root/'R156_DECISION.json').read_text())
          r150=json.loads((root/'r155/r154/r153/r152/r151/r150/R150_DECISION.json').read_text())
          n9=(root/'r155/r154/r153/r152/r151/r150/r149/r148/r147/r146/r145/r144/r143/R143_N9_METHOD.il').read_text(errors='replace')

          if r150['H15_LENGTH'] != 607967:
              raise SystemExit('h15 length changed')
          h15_len=r150['H15_LENGTH']

          # State668 allocates local37 as byte[local27.Length]. R150 proves local27 is the complete
          # read-only h15 alias, so local37 is a non-null byte array of exactly 607967 bytes.
          facts={
            'state668_allocates_local37_from_local27_length':bool(re.search(
              r'IL_4031:\s*ldloc\.s 27\s*\n\s*IL_4033:\s*ldlen\s*\n\s*IL_4034:\s*conv\.i4\s*\n\s*IL_4035:\s*newarr \[mscorlib\]System\.Byte\s*\n\s*IL_403a:\s*stloc\.s 37',n9)),
            'state96_assigns_local29_from_local37_then_dispatch206':bool(re.search(
              r'IL_658f:\s*ldloc\.s 37\s*\n\s*IL_6591:\s*stloc\.s 29\s*\n\s*IL_6593:\s*ldc\.i4 206\s*\n\s*IL_6598:\s*br IL_0012',n9)),
            'state206_reads_local29_length_div8_then_dispatch510':bool(re.search(
              r'IL_2687:\s*ldloc\.s 29\s*\n\s*IL_2689:\s*ldlen\s*\n\s*IL_268a:\s*conv\.i4\s*\n\s*IL_268b:\s*ldc\.i4\.8\s*\n\s*IL_268c:\s*div\s*\n\s*IL_268d:\s*stloc\.s 7\s*\n\s*IL_268f:\s*ldc\.i4 510\s*\n\s*IL_2694:\s*br IL_0012',n9)),
            'state510_aliases_local29_to_local81_and_tests_nonnull':bool(re.search(
              r'IL_2955:\s*ldloc\.s 29\s*\n\s*IL_2957:\s*dup\s*\n\s*IL_2958:\s*stloc\.s 81\s*\n\s*IL_295a:\s*brtrue IL_1265',n9)),
            'state655_tests_local81_length_nonzero':bool(re.search(
              r'IL_1265:\s*ldloc\.s 81\s*\n\s*IL_1267:\s*ldlen\s*\n\s*IL_1268:\s*conv\.i4\s*\n\s*IL_1269:\s*brtrue IL_44aa',n9)),
            'local7_single_assignment_from_local29_length_div8':re.findall(r'(?m)^\s*(IL_[0-9A-Fa-f]+):\s*stloc\.s 7\s*$',n9)==['IL_268d'],
            'local93_initializes_zero':bool(re.search(
              r'IL_3c66:\s*ldc\.i4\.0\s*\n\s*IL_3c67:\s*stloc\.s 93',n9)),
            'local93_only_other_store_is_plus_one':bool(re.search(
              r'IL_554f:\s*ldloc\.s 93\s*\n\s*IL_5551:\s*ldc\.i4\.1\s*\n\s*IL_5552:\s*add\s*\n\s*IL_5553:\s*stloc\.s 93\s*\n\s*IL_5555:\s*ldc\.i4 667\s*\n\s*IL_555a:\s*br IL_0012',n9)),
            'state667_is_local93_lt_local7_guard':bool(re.search(
              r'IL_6710:\s*ldloc\.s 93\s*\n\s*IL_6712:\s*ldloc\.s 7\s*\n\s*IL_6714:\s*blt IL_4952',n9)),
          }
          if not all(facts.values()):
              raise SystemExit('R157 structural proof incomplete: '+repr({k:v for k,v in facts.items() if not v}))

          local29_stores=re.findall(r'(?m)^\s*(IL_[0-9A-Fa-f]+):\s*stloc\.s 29\s*$',n9)
          if local29_stores != ['IL_6591','IL_65fc']:
              raise SystemExit('local29 store set changed: '+repr(local29_stores))
          local93_stores=re.findall(r'(?m)^\s*(IL_[0-9A-Fa-f]+):\s*stloc\.s 93\s*$',n9)
          if local93_stores != ['IL_3c67','IL_5553']:
              raise SystemExit('local93 store set changed: '+repr(local93_stores))

          # The second local29 store is in state281's decrypt/output block and therefore cannot
          # explain the earlier state96->206->510 cluster. The pre-decrypt local29 is local37.
          if not bool(re.search(
              r'IL_65d1:\s*newobj instance void \[mscorlib\]System\.IO\.MemoryStream::\.ctor\(\).*?IL_65fc:\s*stloc\.s 29',n9,re.S)):
              raise SystemExit('post-decrypt local29 store not located inside state281 block')

          local37_len=h15_len
          local29_len=local37_len
          local81_len=local29_len
          local7=local29_len//8
          if (local37_len,local29_len,local81_len,local7)!=(607967,607967,607967,75995):
              raise SystemExit('derived lengths changed')

          old=prev['remaining_unaccounted_conditionals']
          by_state={x['state']:x for x in old}
          expected={
            510:'IL_295a: brtrue IL_1265',
            655:'IL_1269: brtrue IL_44aa',
            667:'IL_6714: blt IL_4952',
          }
          for st,line in expected.items():
              if st not in by_state or by_state[st].get('branch_line')!=line:
                  raise SystemExit(f'expected unresolved branch changed state {st}: {by_state.get(st)}')

          out={
            'H15_LENGTH':h15_len,
            'LOCAL37_LENGTH':local37_len,
            'LOCAL29_LENGTH_PREDECRYPT':local29_len,
            'LOCAL81_LENGTH_AT_STATE655':local81_len,
            'LOCAL7_VALUE_FLOOR_LOCAL29_DIV8':local7,
            'LOCAL29_STORE_LABELS':local29_stores,
            'LOCAL93_STORE_LABELS':local93_stores,
            'RAW_IL_FACTS':facts,
            'STATE510_LOCAL29_NONNULL_BRANCH_TAKEN':True,
            'STATE655_LOCAL81_LENGTH_NONZERO_BRANCH_TAKEN':True,
            'LOCAL93_INITIAL_VALUE':0,
            'LOCAL93_UPDATE':'local93 = local93 + 1',
            'STATE667_SYMBOLIC_LOOP_PREDICATE':'local93 < local7',
            'STATE667_GUARD_BOUND_LOCAL7':local7,
            'STATE667_BRANCH_IS_VISIT_INDEX_DEPENDENT':True,
            'SYMBOLICALLY_ACCOUNTED_CONDITIONAL_STATES':[667],
            'CONSTANTLY_RESOLVED_CONDITIONAL_STATES':[510,655],
            'ACCOUNTED_CONDITIONAL_COUNT':3,
            'POST_LOOP_LOCAL47_KEY_CANDIDATE_HEX':prev['POST_LOOP_LOCAL47_KEY_CANDIDATE_HEX'],
            'OFFLINE_DECRYPT_AUTHORIZED':False,
            'H15_PLAINTEXT_RECOVERED':False,
            'ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD':False,
            'FLASH_ALLOWED':False,
            'interpretation':(
              'The pre-decrypt local29 object is the non-null local37 byte array, whose length equals the complete h15 length 607967. '
              'State206 dereferences local29.Length and dispatches directly to state510. State510 aliases that same object into local81, '
              'so its non-null branch is taken; state655 then observes local81.Length=607967, so its nonzero branch is taken. local7 is '
              '607967/8 = 75995, and local93 is a zero-based +1 loop index guarded by state667 local93<local7; state667 is therefore '
              'accounted symbolically by visit/index rather than forced to one constant outcome. No decryption or live-frame authorization follows.'),
          }
          (ev/'R157_LOCAL29_LOCAL81_NONNULL_LOCAL93_LOOP_BRANCH_MODEL.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - name: Rebase unresolved conditionals and build fail-closed R157 decision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          ev=Path('/tmp/r157/evidence')
          prev=json.loads((ev/'r156/R156_DECISION.json').read_text())
          proof=json.loads((ev/'R157_LOCAL29_LOCAL81_NONNULL_LOCAL93_LOOP_BRANCH_MODEL.json').read_text())
          old=prev['remaining_unaccounted_conditionals']
          if len(old)!=6:
              raise SystemExit(f'expected 6 unresolved from R156, got {len(old)}')
          if (old[0].get('state'),old[0].get('branch_line')) != (510,'IL_295a: brtrue IL_1265'):
              raise SystemExit('next R156 conditional changed: '+repr(old[0]))

          accounted={510,655,667}
          present={x['state'] for x in old if x['state'] in accounted}
          if present != accounted:
              raise SystemExit(f'not all R157 states present: {present} vs {accounted}')
          remaining=[x for x in old if x['state'] not in accounted]
          if len(remaining)!=3:
              raise SystemExit(f'expected 3 remaining after R157 cluster, got {len(remaining)}')

          decision={
            'R156_UNACCOUNTED_CONDITIONAL_COUNT':len(old),
            'R157_ACCOUNTED_CONDITIONAL_COUNT':3,
            'R157_CONSTANTLY_RESOLVED_CONDITIONAL_STATES':[510,655],
            'R157_SYMBOLICALLY_ACCOUNTED_CONDITIONAL_STATES':[667],
            'UNACCOUNTED_CONDITIONAL_COUNT_AFTER_R157':len(remaining),
            'NEXT_UNACCOUNTED_CONDITIONAL':remaining[0] if remaining else None,
            'LOCAL29_LENGTH_PREDECRYPT':proof['LOCAL29_LENGTH_PREDECRYPT'],
            'LOCAL81_LENGTH_AT_STATE655':proof['LOCAL81_LENGTH_AT_STATE655'],
            'LOCAL7_VALUE_FLOOR_LOCAL29_DIV8':proof['LOCAL7_VALUE_FLOOR_LOCAL29_DIV8'],
            'STATE510_LOCAL29_NONNULL_BRANCH_TAKEN':proof['STATE510_LOCAL29_NONNULL_BRANCH_TAKEN'],
            'STATE655_LOCAL81_LENGTH_NONZERO_BRANCH_TAKEN':proof['STATE655_LOCAL81_LENGTH_NONZERO_BRANCH_TAKEN'],
            'STATE667_BRANCH_IS_VISIT_INDEX_DEPENDENT':proof['STATE667_BRANCH_IS_VISIT_INDEX_DEPENDENT'],
            'POST_LOOP_LOCAL47_KEY_CANDIDATE_HEX':proof['POST_LOOP_LOCAL47_KEY_CANDIDATE_HEX'],
            'INDEPENDENT_FULL_PATH_BRANCH_COVERAGE_PROVEN':len(remaining)==0,
            'OFFLINE_DECRYPT_AUTHORIZED':False,
            'H15_PLAINTEXT_RECOVERED':False,
            'ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD':False,
            'AA55_LIVE_RETEST_ALLOWED':False,
            'RUNTIME_0X11_ALLOWED':False,
            'RUNTIME_0XFE_ALLOWED':False,
            'FLASH_ALLOWED':False,
            'remaining_unaccounted_conditionals':remaining,
            'NEXT':(
              'Resolve the next raw-IL environment/object branch cluster at state246 IL_22e1 and state605 IL_1fce. '
              'Trace KIoEb3NS3a1HTR21GpN and SMPFNLNr5St51O5T1Ai wrappers from the own-assembly object and classify whether '
              'their outcomes are static assembly metadata facts or runtime-environment-dependent. Then resolve state292 local28!=4. '
              'Preserve h15 unchanged, preserve the state404-corrected local47 key candidate, and do not decrypt or authorize any live frame.'),
          }
          (ev/'R157_DECISION.json').write_text(json.dumps(decision,indent=2)+'\n')
          (ev/'R157_REPORT_TH.md').write_text(
            '# R157 local29/local81 non-null + local93 loop branch audit\n\n'
            f'- R156 unaccounted conditionals: {decision["R156_UNACCOUNTED_CONDITIONAL_COUNT"]}\n'
            f'- accounted in R157: {decision["R157_ACCOUNTED_CONDITIONAL_COUNT"]}\n'
            f'- remaining: {decision["UNACCOUNTED_CONDITIONAL_COUNT_AFTER_R157"]}\n'
            f'- pre-decrypt local29 length: {decision["LOCAL29_LENGTH_PREDECRYPT"]}\n'
            f'- state655 local81 length: {decision["LOCAL81_LENGTH_AT_STATE655"]}\n'
            f'- local7 = floor(local29.Length/8): {decision["LOCAL7_VALUE_FLOOR_LOCAL29_DIV8"]}\n'
            '- state510 local29 non-null branch: taken\n'
            '- state655 local81 length nonzero branch: taken\n'
            '- state667 local93<local7: symbolic loop guard\n'
            '- offline decrypt authorized: False\n- h15 plaintext recovered: False\n\n'
            f'NEXT: {decision["NEXT"]}\n\nFLASH_ALLOWED=NO\n')
          print(json.dumps(decision,indent=2))
          PY

      - name: Package R157 evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r157/evidence
          zip -9 -r /tmp/R157_N9_LOCAL29_LOCAL81_NONNULL_LOCAL93_LOOP_BRANCH_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/R157_N9_LOCAL29_LOCAL81_NONNULL_LOCAL93_LOOP_BRANCH_EVIDENCE.zip > /tmp/R157_N9_LOCAL29_LOCAL81_NONNULL_LOCAL93_LOOP_BRANCH_EVIDENCE.zip.sha256

      - name: Upload R157 evidence
        uses: actions/upload-artifact@v4
        with:
          name: R157-N9-LOCAL29-LOCAL81-NONNULL-LOCAL93-LOOP-BRANCH-EVIDENCE
          path: |
            /tmp/R157_N9_LOCAL29_LOCAL81_NONNULL_LOCAL93_LOOP_BRANCH_EVIDENCE.zip
            /tmp/R157_N9_LOCAL29_LOCAL81_NONNULL_LOCAL93_LOOP_BRANCH_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'R157_VENDOR_BINARY_EXECUTED=NO' /tmp/r157/evidence/R157_SAFETY.txt
          grep -F 'R157_USB_DEVICE_ACCESS=NO' /tmp/r157/evidence/R157_SAFETY.txt
          grep -F 'R157_BOARD_CONTACT=NO' /tmp/r157/evidence/R157_SAFETY.txt
          grep -F 'R157_OFFLINE_DECRYPT_EXECUTED=NO' /tmp/r157/evidence/R157_SAFETY.txt
          grep -F '"R157_ACCOUNTED_CONDITIONAL_COUNT": 3' /tmp/r157/evidence/R157_DECISION.json
          grep -F '"UNACCOUNTED_CONDITIONAL_COUNT_AFTER_R157": 3' /tmp/r157/evidence/R157_DECISION.json
          grep -F '"STATE510_LOCAL29_NONNULL_BRANCH_TAKEN": true' /tmp/r157/evidence/R157_DECISION.json
          grep -F '"STATE655_LOCAL81_LENGTH_NONZERO_BRANCH_TAKEN": true' /tmp/r157/evidence/R157_DECISION.json
          grep -F '"LOCAL7_VALUE_FLOOR_LOCAL29_DIV8": 75995' /tmp/r157/evidence/R157_DECISION.json
          grep -F '"OFFLINE_DECRYPT_AUTHORIZED": false' /tmp/r157/evidence/R157_DECISION.json
          grep -F '"H15_PLAINTEXT_RECOVERED": false' /tmp/r157/evidence/R157_DECISION.json
          grep -F '"FLASH_ALLOWED": false' /tmp/r157/evidence/R157_DECISION.json
          echo R157_N9_LOCAL29_LOCAL81_NONNULL_LOCAL93_LOOP_BRANCH_AUDIT_COMPLETE=YES
          echo FLASH_ALLOWED=NO
