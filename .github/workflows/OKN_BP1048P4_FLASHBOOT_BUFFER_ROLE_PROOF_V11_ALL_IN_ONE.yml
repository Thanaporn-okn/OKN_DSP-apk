name: OKN BP1048P4 Flashboot Buffer Role Proof V11 - All In One

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: okn-bp1048p4-buffer-role-proof-v11-${{ github.ref }}
  cancel-in-progress: true

env:
  FLASH_ALLOWED: "NO"

jobs:
  buffer_roles:
    name: Prove upinfo/chiperas buffer roles - NO USB - NO FLASH
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          mkdir -p /tmp/v11/evidence
          cat > /tmp/v11/evidence/SAFETY.txt <<'EOF'
          MODE=OFFLINE_STATIC_BUFFER_ROLE_PROOF_ONLY
          TARGET=MVSilicon_BP1048P4
          USB_OR_BOARD_CONTACT=NO
          TARGET_FIRMWARE_EXECUTED=NO
          FLASH_READ_EXECUTED=NO
          FLASH_ERASE_EXECUTED=NO
          FLASH_WRITE_EXECUTED=NO
          LIVE_BOOT_ENTRY_AUTHORIZED=NO
          LIVE_FLASH_AUTHORIZED=NO
          FLASH_ALLOWED=NO
          EOF

      - name: Checkout public BP1048 SDK
        uses: actions/checkout@v4
        with:
          repository: leadercxn/bp1048_sdk_v0.1.12
          ref: master
          path: bp1048-sdk
          fetch-depth: 1

      - name: Reconstruct exact image
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib,json,re,subprocess

          ROOT=Path("bp1048-sdk")
          OUT=Path("/tmp/v11/evidence")
          text=(ROOT/"BT_Audio_APP/bt_audio_app_src/device/flash_boot.c").read_text(errors="replace")

          m=re.search(
              r"(?:static\s+|const\s+|unsigned\s+|signed\s+)*"
              r"(?:char|uint8_t|uint8|u8|BYTE)\s+flash_data\s*"
              r"\[\s*(?P<n>\d+)\s*\]\s*=\s*\{(?P<body>.*?)\};",
              text,re.I|re.S
          )
          assert m
          body=re.sub(r"/\*.*?\*/","",m.group("body"),flags=re.S)
          body=re.sub(r"//[^\r\n]*","",body)
          vals=[int(x,16) for x in re.findall(r"0[xX]([0-9A-Fa-f]{1,2})\b",body)]
          assert int(m.group("n"))==65536
          assert len(vals)==65520

          raw=bytes(vals)+bytes(65536-len(vals))
          (OUT/"flash_data_65536.bin").write_bytes(raw)

          meta={
              "sdk_commit":subprocess.check_output(
                  ["git","-C",str(ROOT),"rev-parse","HEAD"],text=True
              ).strip(),
              "sha256":hashlib.sha256(raw).hexdigest(),
              "runtime_gp":0x20026CB0,
              "runtime_base":0x2001A9A8,
              "upinfo_file_offset":0xCB94,
              "peer_file_offset":0xDB8C,
              "compare_length":0x5C,
              "rx_like_helper":0x0DFE,
              "tx_like_helper":0x0FC0,
              "memcmp_like_helper":0xABEC,
              "USB_OR_BOARD_CONTACTED":False,
              "LIVE_FLASH_AUTHORIZED":False,
              "FLASH_ALLOWED":False
          }
          (OUT/"META.json").write_text(json.dumps(meta,indent=2)+"\n")
          PYCODE

      - name: Build GNU NDS32 objdump
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/v11/toolchain /tmp/v11/build
          cd /tmp/v11/toolchain
          curl -fL --retry 3 --connect-timeout 20 \
            https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz \
            -o binutils-2.44.tar.xz
          tar -xf binutils-2.44.tar.xz
          cd /tmp/v11/build
          ../toolchain/binutils-2.44/configure \
            --target=nds32le-elf \
            --disable-nls --disable-werror --disable-gdb \
            --disable-gprofng --disable-gas --disable-ld --disable-gold \
            >/tmp/v11/evidence/NDS32_BUILD.log 2>&1
          make -j2 all-binutils >>/tmp/v11/evidence/NDS32_BUILD.log 2>&1
          find /tmp/v11/build -type f -name '*objdump' -perm -111 -print \
            > /tmp/v11/evidence/OBJDUMP_CANDIDATES.txt

      - name: Disassemble
        shell: bash
        run: |
          set -euo pipefail
          OBJDUMP="$(find /tmp/v11/build -type f -name '*objdump' -perm -111 | head -1)"
          "$OBJDUMP" -D -b binary -m nds32 --adjust-vma=0 \
            /tmp/v11/evidence/flash_data_65536.bin \
            > /tmp/v11/evidence/NDS32_DISASSEMBLY.txt \
            2>/tmp/v11/evidence/NDS32_DISASSEMBLY.stderr.txt

      - name: Prove buffer roles and call-clobber semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib,json,re

          OUT=Path("/tmp/v11/evidence")
          raw=(OUT/"flash_data_65536.bin").read_bytes()
          meta=json.loads((OUT/"META.json").read_text())

          GP=meta["runtime_gp"]
          BASE=meta["runtime_base"]
          A=meta["upinfo_file_offset"]
          B=meta["peer_file_offset"]
          N=meta["compare_length"]

          lines=(OUT/"NDS32_DISASSEMBLY.txt").read_text(errors="replace").splitlines()
          rr=re.compile(r"^\s*([0-9A-Fa-f]+):\s+(?:[0-9A-Fa-f]{2,8}\s+)+(.+?)\s*$")
          ins=[]
          for ln,line in enumerate(lines,1):
              m=rr.match(line)
              if m:
                  ins.append({
                      "line":ln,
                      "addr":int(m.group(1),16),
                      "text":m.group(2).strip(),
                      "raw":line,
                  })

          def ascii_col(bs):
              return "".join(chr(x) if 32<=x<=126 else "." for x in bs)

          def hexdump(base,bs,width=16):
              out=[]
              for i in range(0,len(bs),width):
                  c=bs[i:i+width]
                  hx=" ".join(f"{x:02X}" for x in c)
                  out.append(f"{base+i:04X}: {hx:<47}  {ascii_col(c)}")
              return out

          block_a=raw[A:A+N]
          block_b=raw[B:B+N]
          diffs=[i for i,(x,y) in enumerate(zip(block_a,block_b)) if x!=y]
          equal=N-len(diffs)

          # Printable strings fully/partially within a block.
          def block_strings(start,length):
              end=start+length
              found=[]
              i=start
              while i<end:
                  if 32<=raw[i]<=126:
                      j=i
                      while j<end and 32<=raw[j]<=126:
                          j+=1
                      if j-i>=3:
                          found.append({
                              "offset":i,
                              "relative":i-start,
                              "text":raw[i:j].decode("ascii",errors="replace")
                          })
                      i=j+1
                  else:
                      i+=1
              return found

          strings_a=block_strings(A,N)
          strings_b=block_strings(B,N)

          # Exact command locations relative to A.
          command_names=[
              b"upinfo",b"btupdat",b"cnfgdat",b"constdat",
              b"codedata",b"cxxx",b"check_user_code"
          ]
          command_members=[]
          for s in command_names:
              p=raw.find(s,A,A+N)
              if p>=0:
                  command_members.append({
                      "text":s.decode(),
                      "offset":p,
                      "relative":p-A
                  })

          # Instruction parsing.
          addigp=re.compile(
              r"\baddi\.gp\s+(\$[A-Za-z0-9]+)\s*,\s*#?"
              r"(-?0x[0-9A-Fa-f]+|-?\d+)",re.I
          )
          jal=re.compile(r"\bjal\s+(?:0x)?([0-9A-Fa-f]+)\b",re.I)
          mem=re.compile(
              r"\b(?P<op>lbi|lbsi|lhi|lhsi|lwi|sbi|shi|swi)"
              r"(?:\.[A-Za-z0-9]+)?\s+"
              r"(?P<rt>\$[A-Za-z0-9]+)\s*,\s*"
              r"\[(?P<base>\$[A-Za-z0-9]+)"
              r"(?:\s*\+\s*#?(?P<off>-?0x[0-9A-Fa-f]+|-?\d+))?\]",
              re.I
          )

          def pint(s):
              try: return int(s.strip().replace("#",""),0)
              except: return None

          # All GP constructions into either block (including interior offsets).
          refs_a=[]
          refs_b=[]
          for x in ins:
              m=addigp.search(x["text"])
              if not m:
                  continue
              reg,imm_s=m.groups()
              imm=pint(imm_s)
              if imm is None:
                  continue
              runtime=(GP+imm)&0xffffffff
              off=(runtime-BASE)&0xffffffff
              rec={
                  "addr":x["addr"],"reg":reg,"imm":imm,
                  "runtime":runtime,"file_offset":off,"text":x["text"]
              }
              if A<=off<A+N:
                  refs_a.append(rec)
              if B<=off<B+N:
                  refs_b.append(rec)

          # Exact disassembly windows.
          windows=[
              ("UPINFO_COMPARE",0x55D0,0x566C),
              ("CHIPERAS_RX",0x56E0,0x5840),
              ("UPINFO_REGION",0x54E0,0x56C0),
          ]
          window_text={}
          for name,lo,hi in windows:
              rows=[x["raw"] for x in ins if lo<=x["addr"]<=hi]
              txt="\n".join(rows)
              window_text[name]=txt
              (OUT/f"{name}.asm").write_text(txt+"\n")

          # Analyze helper bodies structurally to prove direction.
          helper_targets={
              "rx_like":0x0DFE,
              "tx_like":0x0FC0,
          }
          ret_rx=re.compile(r"\b(ret|ret5|jr\s+\$lp|pop25)\b",re.I)
          by_addr={x["addr"]:i for i,x in enumerate(ins)}
          helper_roles={}

          for label,target in helper_targets.items():
              idx=by_addr[target]
              rs=[
                  j for j in range(idx+1,min(len(ins),idx+300))
                  if ret_rx.search(ins[j]["text"])
              ]
              end=rs[0] if rs else min(len(ins)-1,idx+260)
              rows=ins[idx:end+1]

              reads_by_base=[]
              writes_by_base=[]
              mmio_reads=[]
              mmio_writes=[]
              for x in rows:
                  mm=mem.search(x["text"])
                  if mm:
                      op=mm.group("op").lower()
                      rec={
                          "addr":x["addr"],"op":op,
                          "rt":mm.group("rt"),"base":mm.group("base"),
                          "text":x["text"]
                      }
                      if op.startswith("l"):
                          reads_by_base.append(rec)
                      else:
                          writes_by_base.append(rec)

                  # Keep explicit MMIO-looking references.
                  if "0x40007" in x["text"].lower() or "0x40030" in x["text"].lower():
                      if re.search(r"\blw|\blb|\blh",x["text"],re.I):
                          mmio_reads.append({"addr":x["addr"],"text":x["text"]})
                      if re.search(r"\bsw|\bsb|\bsh",x["text"],re.I):
                          mmio_writes.append({"addr":x["addr"],"text":x["text"]})

              # Direction proof uses exact known saved pointer registers from body.
              if target==0x0DFE:
                  direction_evidence=[
                      x for x in writes_by_base if x["base"]=="$r7"
                  ]
                  role="hardware-to-memory / RX-like"
              else:
                  direction_evidence=[
                      x for x in reads_by_base if x["base"]=="$r6"
                  ]
                  role="memory-to-hardware / TX-like"

              helper_roles[label]={
                  "target":target,
                  "role":role,
                  "direction_evidence":direction_evidence,
                  "mmio_reads":mmio_reads,
                  "mmio_writes":mmio_writes,
              }

          # Trace uses of r0 after memcmp call 0x5602 until it is overwritten.
          call_addr=0x5602
          idx=by_addr[call_addr]
          post=[]
          overwritten=False
          # Any instruction mentioning r0 is retained. Stop at a clear destination
          # overwrite of r0 after recording it.
          first_reg=re.compile(r"^[A-Za-z0-9_.]+\s+(\$[A-Za-z0-9]+)")
          for x in ins[idx+1:min(len(ins),idx+35)]:
              t=x["text"]
              if re.search(r"(?<![A-Za-z0-9])\$r0(?![A-Za-z0-9])",t):
                  post.append({"addr":x["addr"],"text":t})
              m=first_reg.search(t)
              if m and m.group(1)=="$r0":
                  # stores/calls/branches do not define r0.
                  mnemonic=t.split(None,1)[0].lower()
                  if not mnemonic.startswith(("swi","shi","sbi","jal","j","b")):
                      overwritten=True
                      break

          # Find calls to 0x0DFE and 0x0FC0 in focus region.
          focus_calls=[]
          for i,x in enumerate(ins):
              if not (0x5400<=x["addr"]<=0x5900):
                  continue
              jm=jal.search(x["text"])
              if not jm:
                  continue
              target=int(jm.group(1),16)
              if target in (0x0DFE,0x0FC0,0xABEC):
                  focus_calls.append({
                      "addr":x["addr"],"target":target,"text":x["text"]
                  })

          result={
              "revision":"BUFFER_ROLE_PROOF_V11",
              "block_a":{
                  "offset":A,"runtime":BASE+A,"length":N,
                  "sha256":hashlib.sha256(block_a).hexdigest(),
                  "strings":strings_a,
              },
              "block_b":{
                  "offset":B,"runtime":BASE+B,"length":N,
                  "sha256":hashlib.sha256(block_b).hexdigest(),
                  "strings":strings_b,
              },
              "equal_bytes":equal,
              "different_bytes":len(diffs),
              "first_differences":[
                  {"relative":i,"a":block_a[i],"b":block_b[i]}
                  for i in diffs[:80]
              ],
              "command_members_in_block_a":command_members,
              "gp_refs_block_a":refs_a,
              "gp_refs_block_b":refs_b,
              "helper_roles":helper_roles,
              "memcmp_return_r0_uses":post,
              "focus_calls":focus_calls,
              "USB_OR_BOARD_CONTACTED":False,
              "LIVE_FLASH_AUTHORIZED":False,
              "FLASH_ALLOWED":False
          }
          (OUT/"BUFFER_ROLE_PROOF.json").write_text(
              json.dumps(result,indent=2,ensure_ascii=False)+"\n"
          )

          md=[
              "# BP1048P4 Buffer Role Proof V11",
              "",
              f"64 KiB SHA256: `{meta['sha256']}`",
              f"runtime `$gp`: `0x{GP:08X}`",
              f"runtime image base: `0x{BASE:08X}`",
              "",
              "## 92-byte compare at 0x5602",
              f"- side A file `0x{A:04X}` runtime `0x{BASE+A:08X}` length `0x{N:X}`",
              f"- side B file `0x{B:04X}` runtime `0x{BASE+B:08X}` length `0x{N:X}`",
              f"- equal bytes: **{equal}/{N}**",
              f"- different bytes: **{len(diffs)}/{N}**",
              f"- A SHA256 `{hashlib.sha256(block_a).hexdigest()}`",
              f"- B SHA256 `{hashlib.sha256(block_b).hexdigest()}`",
              "",
              "### Strings inside side A",
          ]
          for s in strings_a:
              md.append(
                  f"- `+0x{s['relative']:02X}` / file `0x{s['offset']:04X}`: `{s['text']}`"
              )
          if not strings_a:
              md.append("- none")

          md+=["","### Strings inside side B"]
          for s in strings_b:
              md.append(
                  f"- `+0x{s['relative']:02X}` / file `0x{s['offset']:04X}`: `{s['text']}`"
              )
          if not strings_b:
              md.append("- none")

          md+=["","### Command/diagnostic names contained inside the 92-byte A block"]
          for x in command_members:
              md.append(
                  f"- `+0x{x['relative']:02X}` `{x['text']}`"
              )

          md+=["","### Side A hexdump"]
          md.extend("    "+x for x in hexdump(A,block_a))
          md+=["","### Side B hexdump"]
          md.extend("    "+x for x in hexdump(B,block_b))

          md+=["","## GP references into the compared blocks"]
          md.append("### Block A")
          for x in refs_a:
              md.append(
                  f"- code `0x{x['addr']:04X}` `{x['text']}` → file `0x{x['file_offset']:04X}`"
              )
          if not refs_a:
              md.append("- none")
          md.append("### Block B")
          for x in refs_b:
              md.append(
                  f"- code `0x{x['addr']:04X}` `{x['text']}` → file `0x{x['file_offset']:04X}`"
              )
          if not refs_b:
              md.append("- none")

          md+=["","## Helper direction proof"]
          for label,h in helper_roles.items():
              md.append(
                  f"- `0x{h['target']:04X}`: **{h['role']}**"
              )
              for e in h["direction_evidence"][:12]:
                  md.append(
                      f"  - code `0x{e['addr']:04X}` `{e['text']}`"
                  )

          md+=["","## r0 uses immediately after memcmp call 0x5602"]
          for x in post:
              md.append(f"- `0x{x['addr']:04X}` `{x['text']}`")
          if not post:
              md.append("- no r0 use recovered before overwrite")

          md+=["","## Focus calls 0x5400–0x5900"]
          for c in focus_calls:
              md.append(
                  f"- `0x{c['addr']:04X} → 0x{c['target']:04X}` `{c['text']}`"
              )

          md+=["","## Exact assembly around upinfo compare"]
          for line in window_text["UPINFO_COMPARE"].splitlines():
              md.append("    "+line)

          md+=["","## Exact assembly around chiperas/RX area"]
          for line in window_text["CHIPERAS_RX"].splitlines():
              md.append("    "+line)

          md+=["","## Decision"]
          md.append("- `0x0DFE` is treated as RX/read-like only from its explicit memory-write direction; it is not a string-compare helper.")
          md.append("- The `0x5602` call compares 92 bytes. The label `upinfo` is therefore not assumed to be a standalone command check merely because the block begins with that printable text.")
          md.append("- `$r0` after `0xABEC` is treated as the compare return value; prior pointer-liveness claims across that call are discarded.")
          md.append("- No command is authorized for live board use.")
          md.append("- USB/board contacted: **NO**")
          md.append("- Flash read/erase/write: **NO**")
          md.append("- `FLASH_ALLOWED=NO`")

          (OUT/"BUFFER_ROLE_PROOF_SUMMARY.md").write_text("\n".join(md)+"\n")
          PYCODE

      - name: Publish summary
        shell: bash
        run: |
          set -euo pipefail
          cat /tmp/v11/evidence/BUFFER_ROLE_PROOF_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Package evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v11/evidence
          zip -9 -r /tmp/OKN_BP1048P4_BUFFER_ROLE_PROOF_V11_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/OKN_BP1048P4_BUFFER_ROLE_PROOF_V11_EVIDENCE.zip \
            > /tmp/OKN_BP1048P4_BUFFER_ROLE_PROOF_V11_EVIDENCE.zip.sha256

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: OKN-BP1048P4-BUFFER-ROLE-PROOF-V11-EVIDENCE
          path: |
            /tmp/OKN_BP1048P4_BUFFER_ROLE_PROOF_V11_EVIDENCE.zip
            /tmp/OKN_BP1048P4_BUFFER_ROLE_PROOF_V11_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/v11/evidence/BUFFER_ROLE_PROOF.json"))
          assert d["USB_OR_BOARD_CONTACTED"] is False
          assert d["LIVE_FLASH_AUTHORIZED"] is False
          assert d["FLASH_ALLOWED"] is False
          print("BUFFER_ROLE_PROOF_V11_GATE=PASS")
          PY
          echo FLASH_ALLOWED=NO
