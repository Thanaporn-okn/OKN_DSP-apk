name: R95 BP1048P4 Flash Burner Lite vs AndeSight programming path audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r95-bp1048p4-flash-burner-role-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_REPO: https://github.com/leadercxn/bp1048_sdk_v0.1.12.git
  SDK_COMMIT: 8105bd864b04995d81c9f9ae77cb158259f39015
  P4_DATASHEET_URL: https://www.wolftech-radio.com/filedownload/2975009
  P4_DATASHEET_SHA256: 816fc62c30a64c31b62e9ae7720242487e4e8b26c8281efb828f037a757a063a
  ANDESIGHT_MANUAL_URL: https://fpga.andestech.com/site/3/document/download/AndeSight_STD_v5.3_IDE_User_Manual_UM271_V1.3.pdf
  FLASH_ALLOWED: 'NO'

jobs:
  offline-role-audit:
    name: OFFLINE Flash Burner/AndeSight role audit - no execution/no USB/no board/no flash
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r95/evidence
          cat > /tmp/r95/evidence/R95_SAFETY.txt <<'EOF'
          R95_STATIC_ONLY=YES
          BOARD_CONTACT=NO
          USB_DEVICE_ACCESS=NO
          DEBUG_PROBE_ACCESS=NO
          VENDOR_BINARY_EXECUTION=NO
          SEND_AA55=NO
          SEND_0X11=NO
          SEND_CHIPERAS_CODEDATA_BOOTDAT_CONSTDAT_CNFGDAT_BTUPDAT_UPINFO_CXXX=NO
          R79_PHYSICAL_REPLUG_AUTORUN=NO
          ERASE_PROGRAM_FLASH=NO
          FLASH_BURNER_LITE_EQUALS_ANDESIGHT_FLASH_BURNER=UNPROVEN
          BP1048B2_EQUALS_BP1048P4=NO
          FLASH_ALLOWED=NO
          PURPOSE=SEPARATE_ANDESIGHT_DEBUG_FLASH_PATH_FROM_UNCHARACTERIZED_FLASH_BURNER_LITE_AND_TEST_FOR_DIRECT_USB_EVIDENCE
          EOF
          cat /tmp/r95/evidence/R95_SAFETY.txt

      - name: Install static analysis tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq file binutils poppler-utils
          python3 -m venv /tmp/r95-venv
          /tmp/r95-venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir pefile
          echo "/tmp/r95-venv/bin" >> "$GITHUB_PATH"

      - name: Clone exact public SDK commit
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "$SDK_REPO" /tmp/r95/sdk
          cd /tmp/r95/sdk
          git fetch --depth=1 origin "$SDK_COMMIT"
          git checkout --detach "$SDK_COMMIT"
          test "$(git rev-parse HEAD)" = "$SDK_COMMIT"
          printf 'SDK_COMMIT_MATCH=YES\nSDK_HEAD=%s\n' "$(git rev-parse HEAD)" \
            > /tmp/r95/evidence/R95_SDK_GATE.txt

      - name: Acquire exact BP1048P4 datasheet and official AndeSight manual
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --location --retry 4 --connect-timeout 20 \
            "$P4_DATASHEET_URL" -o /tmp/r95/p4.pdf
          P4_SHA="$(sha256sum /tmp/r95/p4.pdf | awk '{print $1}')"
          echo "P4_DATASHEET_SHA256=$P4_SHA"
          test "$P4_SHA" = "$P4_DATASHEET_SHA256"
          pdftotext -layout /tmp/r95/p4.pdf /tmp/r95/evidence/R95_BP1048P4_DATASHEET.txt

          curl --fail --location --retry 4 --connect-timeout 20 \
            "$ANDESIGHT_MANUAL_URL" -o /tmp/r95/andesight.pdf
          file /tmp/r95/andesight.pdf | tee /tmp/r95/evidence/R95_ANDESIGHT_MANUAL_FILETYPE.txt
          sha256sum /tmp/r95/andesight.pdf \
            > /tmp/r95/evidence/R95_ANDESIGHT_MANUAL_SHA256.txt
          pdftotext -layout /tmp/r95/andesight.pdf /tmp/r95/evidence/R95_ANDESIGHT_MANUAL.txt

      - name: Preserve and hash SDK flash-burner artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r95/sdk

          cp MVsB1_Base_SDK/tools/readme.txt \
            /tmp/r95/evidence/R95_SDK_TOOLS_README.txt
          cp MVsB1_Base_SDK/tools/b1_download_v1.7.exe \
            /tmp/r95/b1_download_v1.7.exe

          sha256sum /tmp/r95/b1_download_v1.7.exe \
            > /tmp/r95/evidence/R95_B1_DOWNLOAD_SHA256.txt
          file /tmp/r95/b1_download_v1.7.exe \
            | tee /tmp/r95/evidence/R95_B1_DOWNLOAD_FILETYPE.txt

          grep -RInaE \
            'AndeSight|Flash Burner|Flash Driver|AICE|ICEman|SW_CLK|SW_D|CFG_FUNC_SW_DEBUG_EN|debug|burner' \
            --exclude-dir=.git . \
            > /tmp/r95/evidence/R95_SDK_FLASH_DEBUG_HITS.txt || true

          sed -n '1,500p' /tmp/r95/evidence/R95_SDK_FLASH_DEBUG_HITS.txt

      - name: Static inspect b1_download_v1.7.exe without execution
        shell: bash
        run: |
          set -euo pipefail

          strings -a -t x /tmp/r95/b1_download_v1.7.exe \
            > /tmp/r95/evidence/R95_B1_DOWNLOAD_STRINGS_ALL.txt || true

          grep -Ei \
            'AndeSight|Flash Burner|Flash Driver|ICEman|AICE|JTAG|SWD|SW_CLK|SW_D|debug|target|burn|flash|USB|HID|WinUSB|SetupDi|libusb|FTDI|FT232|CreateFile|ReadFile|WriteFile|DeviceIoControl|socket|telnet' \
            /tmp/r95/evidence/R95_B1_DOWNLOAD_STRINGS_ALL.txt \
            > /tmp/r95/evidence/R95_B1_DOWNLOAD_INTERESTING_STRINGS.txt || true

          objdump -x /tmp/r95/b1_download_v1.7.exe \
            > /tmp/r95/evidence/R95_B1_DOWNLOAD_OBJDUMP_X.txt 2>&1 || true
          nm -an /tmp/r95/b1_download_v1.7.exe \
            > /tmp/r95/evidence/R95_B1_DOWNLOAD_NM.txt 2>&1 || true

          /tmp/r95-venv/bin/python - <<'PY'
          from pathlib import Path
          import json

          exe=Path('/tmp/r95/b1_download_v1.7.exe')
          out=Path('/tmp/r95/evidence')
          result={
              'pe_parse_ok':False,
              'machine':None,
              'imports':[],
              'transport_imports':[],
              'error':None
          }
          try:
              import pefile
              pe=pefile.PE(str(exe),fast_load=False)
              result['pe_parse_ok']=True
              result['machine']=hex(pe.FILE_HEADER.Machine)
              imports=[]
              for ent in getattr(pe,'DIRECTORY_ENTRY_IMPORT',[]):
                  dll=ent.dll.decode(errors='ignore')
                  for imp in ent.imports:
                      name=imp.name.decode(errors='ignore') if imp.name else f'ordinal_{imp.ordinal}'
                      imports.append({'dll':dll,'name':name})
              result['imports']=imports
              needles=('hid','winusb','setup','usb','ftdi','ft232','createfile','readfile','writefile',
                       'deviceiocontrol','ws2_32','winsock')
              result['transport_imports']=[
                  x for x in imports
                  if any(n in (x['dll']+'!'+x['name']).lower() for n in needles)
              ]
          except Exception as e:
              result['error']=type(e).__name__+': '+str(e)

          out.joinpath('R95_B1_DOWNLOAD_PE_AUDIT.json').write_text(
              json.dumps(result,indent=2)+'\n'
          )
          print(json.dumps(result,indent=2))
          PY

          sed -n '1,700p' /tmp/r95/evidence/R95_B1_DOWNLOAD_INTERESTING_STRINGS.txt

      - name: Extract exact P4-only programming and pin evidence
        shell: bash
        run: |
          set -euo pipefail

          grep -InaE \
            'USB 2\.0|OTG|USB_DM|USB_DP|SW_CLK|SW_D|固件烧录|Flash Burner Lite|Bootloader|双 Bank|固件加密|调试器|专用烧录器' \
            /tmp/r95/evidence/R95_BP1048P4_DATASHEET.txt \
            > /tmp/r95/evidence/R95_P4_PROGRAMMING_PIN_HITS.txt || true

          cat /tmp/r95/evidence/R95_P4_PROGRAMMING_PIN_HITS.txt

      - name: Extract official AndeSight flash-programming architecture
        shell: bash
        run: |
          set -euo pipefail

          grep -InaE \
            'Flash programming using a flash burner|ICEman|Debug Module|flash burner|target_burn|Flash Programming Wizard|Flash Burner Settings|socket protocols|telnet protocols|target system' \
            /tmp/r95/evidence/R95_ANDESIGHT_MANUAL.txt \
            > /tmp/r95/evidence/R95_ANDESIGHT_FLASH_ARCH_HITS.txt || true

          sed -n '1,1200p' /tmp/r95/evidence/R95_ANDESIGHT_FLASH_ARCH_HITS.txt

      - name: Build conservative role decision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          p=Path('/tmp/r95/evidence')
          p4=(p/'R95_P4_PROGRAMMING_PIN_HITS.txt').read_text(errors='ignore')
          sdk=(p/'R95_SDK_FLASH_DEBUG_HITS.txt').read_text(errors='ignore')
          readme=(p/'R95_SDK_TOOLS_README.txt').read_text(errors='ignore')
          arch=(p/'R95_ANDESIGHT_FLASH_ARCH_HITS.txt').read_text(errors='ignore')
          pe=json.loads((p/'R95_B1_DOWNLOAD_PE_AUDIT.json').read_text())
          strs=(p/'R95_B1_DOWNLOAD_INTERESTING_STRINGS.txt').read_text(errors='ignore')

          p4_flash_lite='Flash Burner Lite' in p4
          p4_dual_bank=('Bootloader' in p4 and ('双 Bank' in p4 or 'Bank' in p4))
          p4_usb_pins=('USB_DM' in p4 and 'USB_DP' in p4)
          p4_debug_pins=('SW_CLK' in p4 and 'SW_D' in p4)

          sdk_andesight_driver=(
              'AndeSight->Flash Burner' in readme or
              ('Flash Burner' in readme and 'Flash Driver' in readme)
          )
          andesight_debug_module=(
              'Debug Module' in arch and
              'ICEman' in arch
          )

          b1_direct_usb_static=any(
              any(n in (x['dll']+'!'+x['name']).lower()
                  for n in ('hid','winusb','setup','usb','ftdi','ft232'))
              for x in pe.get('transport_imports',[])
          )
          b1_socket_static=any(
              'ws2_32' in (x['dll']+'!'+x['name']).lower() or
              'winsock' in (x['dll']+'!'+x['name']).lower()
              for x in pe.get('transport_imports',[])
          ) or bool(re.search(r'socket|ICEman|telnet',strs,re.I))

          decision={
              'P4_DATASHEET_EXACT_SHA_MATCH':True,
              'P4_DATASHEET_FLASH_BURNER_LITE_SUPPORTED':p4_flash_lite,
              'P4_DATASHEET_BOOTLOADER_DUAL_BANK_SUPPORTED':p4_dual_bank,
              'P4_DATASHEET_USB_DM_DP_PINS_PRESENT':p4_usb_pins,
              'P4_DATASHEET_SW_CLK_SW_D_PINS_PRESENT':p4_debug_pins,
              'SDK_ANDESIGHT_FLASH_BURNER_DRIVER_PRESENT':sdk_andesight_driver,
              'OFFICIAL_ANDESIGHT_FLASH_PROGRAMMING_USES_ICEMAN_DEBUG_MODULE':andesight_debug_module,
              'B1_DOWNLOAD_PE_PARSE_OK':pe.get('pe_parse_ok',False),
              'B1_DOWNLOAD_STATIC_DIRECT_USB_HOST_IMPORT_EVIDENCE':b1_direct_usb_static,
              'B1_DOWNLOAD_STATIC_ICEMAN_SOCKET_STYLE_EVIDENCE':b1_socket_static,
              'FLASH_BURNER_LITE_EQUALS_ANDESIGHT_FLASH_BURNER_PROVEN':False,
              'FLASH_BURNER_LITE_USES_USB_DM_DP_DIRECT_PROVEN':False,
              'FLASH_BURNER_LITE_USES_SW_CLK_SW_D_PROVEN':False,
              'ANDESIGHT_FLASH_PATH_IS_PHONE_DIRECT_USB_C':False,
              'BP1048P4_PHONE_DIRECT_FIRST_BOOTSTRAP_PROVEN_FROM_R95':False,
              'PRODUCTION_RECOVERY_USB_IDENTITY_PROVEN_FROM_R95':False,
              'READ_ONLY_PRODUCTION_BACKUP_PATH_PROVEN_FROM_R95':False,
              'LIVE_BOARD_TEST_ALLOWED_FROM_R95':False,
              'FLASH_ALLOWED':False,
          }
          p.joinpath('R95_DECISION.json').write_text(json.dumps(decision,indent=2)+'\n')

          lines=[
              '# R95 BP1048P4 Flash Burner Lite vs AndeSight programming path audit',
              '',
              'OFFLINE/STATIC ONLY. No vendor executable was run. No board, USB or debug probe access.',
              '',
              '## Decision',
              '```json',json.dumps(decision,indent=2),'```','',
              '## Exact BP1048P4 datasheet evidence',
          ]
          lines.extend('- '+x for x in p4.splitlines() if x.strip())
          lines += ['','## SDK AndeSight/Flash Burner evidence']
          lines.extend('- '+x[:1800] for x in sdk.splitlines()[:500] if x.strip())
          lines += ['','## Official AndeSight architecture evidence']
          lines.extend('- '+x[:1800] for x in arch.splitlines()[:600] if x.strip())
          lines += [
              '',
              '## Interpretation gate',
              '- The BP1048P4 datasheet independently lists USB pins and serial-debug pins; it does not state that Flash Burner Lite uses either set.',
              '- The SDK tool readme explicitly places its b1_download flash driver under AndeSight -> Flash Burner.',
              '- Official AndeSight documentation describes this class of flash programming as ICEman/Debug-Module target access, so that SDK path is a debug/programming path, not the required Samsung S25+ USB-C application/recovery transport.',
              '- R95 intentionally does not equate the datasheet term "Flash Burner Lite" with the AndeSight Flash Burner unless direct product/tool evidence proves it.',
              '- Therefore Flash Burner Lite remains a separate unresolved tool/transport target.',
              '- No live board test follows from R95.',
              '- FLASH_ALLOWED=NO.',
          ]
          p.joinpath('R95_REPORT.md').write_text('\n'.join(lines)+'\n')
          print(json.dumps(decision,indent=2))
          PY

          sed -n '1,1000p' /tmp/r95/evidence/R95_REPORT.md

      - name: Package evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/r95/evidence && zip -9 -r /tmp/R95_BP1048P4_FLASH_BURNER_ROLE_EVIDENCE.zip .)
          sha256sum /tmp/R95_BP1048P4_FLASH_BURNER_ROLE_EVIDENCE.zip \
            > /tmp/R95_BP1048P4_FLASH_BURNER_ROLE_EVIDENCE.zip.sha256

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R95-BP1048P4-FLASH-BURNER-ROLE-EVIDENCE
          path: |
            /tmp/R95_BP1048P4_FLASH_BURNER_ROLE_EVIDENCE.zip
            /tmp/R95_BP1048P4_FLASH_BURNER_ROLE_EVIDENCE.zip.sha256
          if-no-files-found: error
