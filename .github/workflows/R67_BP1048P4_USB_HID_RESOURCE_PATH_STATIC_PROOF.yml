name: R67 BP1048P4 USB HID resource path static proof

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R67_BP1048P4_USB_HID_RESOURCE_PATH_STATIC_PROOF.yml"

permissions:
  contents: read

concurrency:
  group: r67-bp1048p4-usb-hid-resource-path-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_REPO: https://github.com/leadercxn/bp1048_sdk_v0.1.12.git
  SDK_COMMIT: 8105bd864b04995d81c9f9ae77cb158259f39015

jobs:
  static-proof:
    name: USB HID init vs resource registration / STATIC ONLY / NO FLASH
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch pinned BP1048 SDK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/bp1048_r67
          git init -q /tmp/bp1048_r67
          cd /tmp/bp1048_r67
          git remote add origin "$SDK_REPO"
          git fetch -q --depth=1 origin "$SDK_COMMIT"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SDK_COMMIT"
          echo "R67_SDK_COMMIT=$(git rev-parse HEAD)" | tee /tmp/R67_SDK_STATE.txt

      - name: Enumerate every USB init and resource callsite
        id: callsites
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/bp1048_r67

          {
            echo "=== OTG_DeviceInit ==="
            grep -RInF --include='*.c' --include='*.h' \
              'OTG_DeviceInit' "$ROOT" || true
            echo
            echo "=== OTG_DeviceModeSel(HID ==="
            grep -RInF --include='*.c' --include='*.h' \
              'OTG_DeviceModeSel(HID' "$ROOT" || true
            echo
            echo "=== SetDeviceInitState ==="
            grep -RInF --include='*.c' --include='*.h' \
              'SetDeviceInitState' "$ROOT" || true
            echo
            echo "=== ResourceRegister(AppResourceUsbDevice) ==="
            grep -RInF --include='*.c' --include='*.h' \
              'ResourceRegister(AppResourceUsbDevice)' "$ROOT" || true
            echo
            echo "=== ResourceDeregister(AppResourceUsbDevice) ==="
            grep -RInF --include='*.c' --include='*.h' \
              'ResourceDeregister(AppResourceUsbDevice)' "$ROOT" || true
            echo
            echo "=== start_up_grate(AppResourceUsbDevice) ==="
            grep -RInF --include='*.c' --include='*.h' \
              'start_up_grate(AppResourceUsbDevice)' "$ROOT" || true
          } | tee /tmp/R67_CALLSITES.txt

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("/tmp/bp1048_r67")
          rows = []

          needles = {
              "OTG_DeviceInit": "OTG_DeviceInit",
              "OTG_DeviceModeSel_HID": "OTG_DeviceModeSel(HID",
              "SetDeviceInitState": "SetDeviceInitState",
              "ResourceRegister_USB": "ResourceRegister(AppResourceUsbDevice)",
              "ResourceDeregister_USB": "ResourceDeregister(AppResourceUsbDevice)",
              "start_up_grate_USB": "start_up_grate(AppResourceUsbDevice)",
          }

          for p in root.rglob("*"):
              if p.suffix.lower() not in {".c", ".h"}:
                  continue
              try:
                  text = p.read_text(encoding="latin-1")
              except Exception:
                  continue
              for lineno, line in enumerate(text.splitlines(), 1):
                  for kind, needle in needles.items():
                      if needle in line:
                          rows.append({
                              "kind": kind,
                              "path": str(p.relative_to(root)),
                              "line": lineno,
                              "text": line.strip(),
                          })

          def count(kind):
              return sum(1 for r in rows if r["kind"] == kind)

          def outside_device_detect(kind):
              return [
                  r for r in rows
                  if r["kind"] == kind
                  and not r["path"].endswith("device/device_detect.c")
              ]

          outside_init = outside_device_detect("OTG_DeviceInit")
          outside_hid = outside_device_detect("OTG_DeviceModeSel_HID")

          lines = [
              f"R67_OTG_DEVICE_INIT_CALLS={count('OTG_DeviceInit')}",
              f"R67_OTG_HID_MODESEL_CALLS={count('OTG_DeviceModeSel_HID')}",
              f"R67_SET_DEVICE_INIT_STATE_CALLS={count('SetDeviceInitState')}",
              f"R67_USB_RESOURCE_REGISTER_CALLS={count('ResourceRegister_USB')}",
              f"R67_USB_RESOURCE_DEREGISTER_CALLS={count('ResourceDeregister_USB')}",
              f"R67_USB_BOOT_ENTRY_CALLS={count('start_up_grate_USB')}",
              f"R67_OTG_INIT_OUTSIDE_DEVICE_DETECT_CALLS={len(outside_init)}",
              f"R67_HID_MODESEL_OUTSIDE_DEVICE_DETECT_CALLS={len(outside_hid)}",
          ]

          # Presence of a call outside device_detect does not automatically
          # prove runtime reachability; save the exact sites for inspection.
          lines += [
              "R67_REFERENCE_HAS_SEPARATE_HID_INIT_CALLSITE=" +
              ("YES" if (outside_init or outside_hid) else "NO"),
          ]

          Path("/tmp/R67_CALLSITE_COUNTS.txt").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )

          with Path("/tmp/R67_OUTSIDE_DEVICE_DETECT_CALLS.txt").open(
              "w", encoding="utf-8"
          ) as f:
              for r in outside_init + outside_hid:
                  f.write(
                      f"{r['kind']}\t{r['path']}:{r['line']}\t{r['text']}\n"
                  )

          print(Path("/tmp/R67_CALLSITE_COUNTS.txt").read_text(), end="")
          print("=== outside device_detect ===")
          print(Path("/tmp/R67_OUTSIDE_DEVICE_DETECT_CALLS.txt").read_text(), end="")
          PY

      - name: Prove AppMode ordering and USB early-return gate
        id: mode_gate
        shell: bash
        run: |
          set -euo pipefail

          MODEH=/tmp/bp1048_r67/BT_Audio_APP/bt_audio_app_src/inc/mode_switch_api.h
          DET=/tmp/bp1048_r67/BT_Audio_APP/bt_audio_app_src/device/device_detect.c

          python3 - "$MODEH" "$DET" <<'PY'
          from pathlib import Path
          import re, sys

          modeh = Path(sys.argv[1]).read_text(encoding="latin-1").splitlines()
          det = Path(sys.argv[2]).read_text(encoding="latin-1").splitlines()

          # Parse enum order rather than assuming numeric values.
          enum_start = next(
              i for i,x in enumerate(modeh)
              if re.search(r"typedef\s+enum", x)
          )
          enum_end = next(
              i for i in range(enum_start, len(modeh))
              if "}AppMode" in modeh[i].replace(" ", "")
          )

          names = []
          for x in modeh[enum_start:enum_end+1]:
              m = re.match(r"\s*(AppMode[A-Za-z0-9_]+)\s*(?:=\s*([0-9]+))?\s*,?", x)
              if m:
                  names.append((m.group(1), m.group(2)))

          values = {}
          cur = -1
          for name, explicit in names:
              if explicit is not None:
                  cur = int(explicit)
              else:
                  cur += 1
              values[name] = cur

          required = [
              "AppModeIdle",
              "AppModeWaitingPlay",
              "AppModeRestPlay",
              "AppModeLineAudioPlay",
              "AppModeUsbDevicePlay",
          ]
          for x in required:
              if x not in values:
                  raise SystemExit(f"missing AppMode enum member: {x}")

          early = next(
              i for i,x in enumerate(det)
              if "if(GetSystemMode()<AppModeLineAudioPlay)" in x.replace(" ", "")
              or "if(GetSystemMode()<AppModeLineAudioPlay)" in x
          )
          link = next(
              i for i,x in enumerate(det)
              if "InOrOut = OTG_PortDeviceIsLink();" in x
          )

          if not early < link:
              raise SystemExit("USB early-return is not before USB link test")

          lines = [
              f"R67_APPMODE_IDLE={values['AppModeIdle']}",
              f"R67_APPMODE_WAITING={values['AppModeWaitingPlay']}",
              f"R67_APPMODE_REST={values['AppModeRestPlay']}",
              f"R67_APPMODE_LINE={values['AppModeLineAudioPlay']}",
              f"R67_APPMODE_USB_DEVICE={values['AppModeUsbDevicePlay']}",
              f"R67_USB_EARLY_RETURN_LINE={early+1}",
              f"R67_USB_LINK_TEST_LINE={link+1}",
              "R67_USB_EARLY_RETURN_PRECEDES_LINK_TEST=YES",
              "R67_WAITING_MODE_IS_BELOW_LINE_THRESHOLD=" +
              ("YES" if values["AppModeWaitingPlay"] < values["AppModeLineAudioPlay"] else "NO"),
              "R67_REST_MODE_IS_BELOW_LINE_THRESHOLD=" +
              ("YES" if values["AppModeRestPlay"] < values["AppModeLineAudioPlay"] else "NO"),
          ]

          Path("/tmp/R67_MODE_GATE.txt").write_text(
              "\n".join(lines)+"\n",
              encoding="utf-8",
          )
          print("\n".join(lines))
          PY

      - name: Prove registration occurs only after USB event path
        id: registration
        shell: bash
        run: |
          set -euo pipefail

          SVC=/tmp/bp1048_r67/BT_Audio_APP/bt_audio_app_src/services/device_service.c
          DET=/tmp/bp1048_r67/BT_Audio_APP/bt_audio_app_src/device/device_detect.c

          python3 - "$DET" "$SVC" <<'PY'
          from pathlib import Path
          import sys

          det = Path(sys.argv[1]).read_text(encoding="latin-1").splitlines()
          svc = Path(sys.argv[2]).read_text(encoding="latin-1").splitlines()

          def find(lines, needle):
              return next(i for i,x in enumerate(lines) if needle in x)

          link = find(det, "InOrOut = OTG_PortDeviceIsLink();")
          state = find(det, "Ret |= USB_DEVICE_STATE_BIT;")
          event = find(det, "Ret |= USB_DEVICE_EVENT_BIT;")

          svc_event = find(svc, "if(Plug & USB_DEVICE_EVENT_BIT)")
          svc_state = find(svc, "if(Plug & USB_DEVICE_STATE_BIT)")
          reg = find(svc, "ResourceRegister(AppResourceUsbDevice);")
          dereg = find(svc, "ResourceDeregister(AppResourceUsbDevice);")

          if not (link < state and link < event):
              raise SystemExit("device-detect USB event construction order unexpected")
          if not (svc_event < svc_state < reg):
              raise SystemExit("device-service USB registration order unexpected")

          lines = [
              f"R67_DETECT_USB_LINK_LINE={link+1}",
              f"R67_DETECT_USB_STATE_LINE={state+1}",
              f"R67_DETECT_USB_EVENT_LINE={event+1}",
              f"R67_SERVICE_USB_EVENT_LINE={svc_event+1}",
              f"R67_SERVICE_USB_STATE_LINE={svc_state+1}",
              f"R67_SERVICE_USB_REGISTER_LINE={reg+1}",
              f"R67_SERVICE_USB_DEREGISTER_LINE={dereg+1}",
              "R67_USB_RESOURCE_REGISTRATION_REQUIRES_DEVICE_EVENT=YES",
              "R67_FEATURE_AA_DOES_NOT_REGISTER_USB_RESOURCE=YES",
          ]

          Path("/tmp/R67_REGISTRATION_PATH.txt").write_text(
              "\n".join(lines)+"\n",
              encoding="utf-8",
          )
          print("\n".join(lines))
          PY

      - name: Classify R46G implications without repeating live probe
        id: decision
        shell: bash
        run: |
          set -euo pipefail

          getv() {
            grep -E "^$1=" "$2" | tail -n1 | cut -d= -f2-
          }

          SEP="$(getv R67_REFERENCE_HAS_SEPARATE_HID_INIT_CALLSITE /tmp/R67_CALLSITE_COUNTS.txt)"
          WAIT="$(getv R67_WAITING_MODE_IS_BELOW_LINE_THRESHOLD /tmp/R67_MODE_GATE.txt)"
          REST="$(getv R67_REST_MODE_IS_BELOW_LINE_THRESHOLD /tmp/R67_MODE_GATE.txt)"

          cat > /tmp/R67_DECISION.txt <<EOF
          R67_REFERENCE_HAS_SEPARATE_HID_INIT_CALLSITE=$SEP
          R67_WAITING_MODE_USB_DETECT_CAN_EARLY_RETURN=$WAIT
          R67_REST_MODE_USB_DETECT_CAN_EARLY_RETURN=$REST

          # Production facts already established by R46G/R66:
          R67_PRODUCTION_FEATURE_AA_ACCEPTED=YES
          R67_PRODUCTION_GET55_ACTIVE=YES
          R67_PRODUCTION_RUNTIME_REMAINED_ACTIVE=YES

          # Reference-source facts:
          R67_USB_RESOURCE_REGISTRATION_REQUIRES_DEVICE_EVENT=YES
          R67_FEATURE_AA_DOES_NOT_REGISTER_USB_RESOURCE=YES

          # This checkpoint intentionally does not invent production mode state.
          R67_PRODUCTION_SYSTEM_MODE_AT_FEATURE_GET_PROVEN=NO
          R67_PRODUCTION_USB_RESOURCE_BIT_AT_GET_PROVEN=NO
          R67_PRODUCTION_FLASH_BOOT_EN_PROVEN=NO

          R67_REPEAT_R46G_REQUIRED=NO
          R67_STOCK_FIRST_BOOTSTRAP_PROVEN=NO
          R67_STOCK_BACKUP_PROVEN=NO
          R67_RECOVERY_PROVEN=NO

          R67_FLASH_WRITE_EXECUTED=NO
          R67_FLASH_ERASE_EXECUTED=NO
          FLASH_ALLOWED=NO
          EOF

          cat /tmp/R67_DECISION.txt

      - name: Build R67 evidence bundle
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          OUT=/tmp/R67_BP1048P4_USB_HID_RESOURCE_PATH_EVIDENCE
          rm -rf "$OUT"
          mkdir -p "$OUT"

          for f in \
            R67_SDK_STATE.txt \
            R67_CALLSITES.txt \
            R67_CALLSITE_COUNTS.txt \
            R67_OUTSIDE_DEVICE_DETECT_CALLS.txt \
            R67_MODE_GATE.txt \
            R67_REGISTRATION_PATH.txt \
            R67_DECISION.txt; do
            test -f "/tmp/$f" && cp "/tmp/$f" "$OUT/"
          done

          cat > "$OUT/README.txt" <<'EOF'
          R67 statically maps every reference-SDK USB HID init and
          AppResourceUsbDevice registration path.

          Purpose:
          - determine whether HID tuning can initialize independently of
            USB-resource registration in the reference SDK
          - prove the GetSystemMode early-return relation to USB link detection
          - avoid repeating the already-completed R46G AA->55 live-board probe

          No USB hardware is accessed.
          No erase/program/flash operation is performed.
          EOF

          (
            cd /tmp
            zip -qr \
              R67_BP1048P4_USB_HID_RESOURCE_PATH_EVIDENCE.zip \
              R67_BP1048P4_USB_HID_RESOURCE_PATH_EVIDENCE
            sha256sum \
              R67_BP1048P4_USB_HID_RESOURCE_PATH_EVIDENCE.zip \
              > R67_BP1048P4_USB_HID_RESOURCE_PATH_EVIDENCE.zip.sha256
          )

          cat /tmp/R67_BP1048P4_USB_HID_RESOURCE_PATH_EVIDENCE.zip.sha256

      - name: Upload R67 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R67-BP1048P4-USB-HID-RESOURCE-PATH-EVIDENCE
          path: |
            /tmp/R67_BP1048P4_USB_HID_RESOURCE_PATH_EVIDENCE.zip
            /tmp/R67_BP1048P4_USB_HID_RESOURCE_PATH_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: R67 final gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          cat /tmp/R67_CALLSITE_COUNTS.txt
          cat /tmp/R67_MODE_GATE.txt
          cat /tmp/R67_REGISTRATION_PATH.txt
          cat /tmp/R67_DECISION.txt

          test "${{ steps.callsites.outcome }}" = "success"
          test "${{ steps.mode_gate.outcome }}" = "success"
          test "${{ steps.registration.outcome }}" = "success"
          test "${{ steps.decision.outcome }}" = "success"

          grep -F 'R67_USB_EARLY_RETURN_PRECEDES_LINK_TEST=YES' /tmp/R67_MODE_GATE.txt
          grep -F 'R67_USB_RESOURCE_REGISTRATION_REQUIRES_DEVICE_EVENT=YES' /tmp/R67_REGISTRATION_PATH.txt
          grep -F 'R67_FEATURE_AA_DOES_NOT_REGISTER_USB_RESOURCE=YES' /tmp/R67_REGISTRATION_PATH.txt
          grep -F 'R67_REPEAT_R46G_REQUIRED=NO' /tmp/R67_DECISION.txt
          grep -F 'R67_FLASH_WRITE_EXECUTED=NO' /tmp/R67_DECISION.txt
          grep -F 'FLASH_ALLOWED=NO' /tmp/R67_DECISION.txt

          echo "R67_USB_HID_RESOURCE_PATH_STATIC_PROOF=PASS"
          echo "FLASH_ALLOWED=NO"
