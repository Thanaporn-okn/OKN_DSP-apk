      - name: Protocol self-test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import math, struct

          def f32(x):
              return struct.pack("<f", x)

          def ufe_write(actuator_id, offset, payload):
              return (
                  bytes([0x57]) +
                  actuator_id.to_bytes(4, "big") +
                  offset.to_bytes(2, "big") +
                  len(payload).to_bytes(2, "big") +
                  payload
              )

          # Proven SaveParams exact plaintext.
          assert ufe_write(7, 0, b"").hex().upper() == "570000000700000000"

          # Proven EQ CH1 / ID4 / Band4 offset = (4-1)*48 = 144.
          f = 100.0
          q = 2.23
          gain = -0.5
          A = 10 ** (gain / 40)
          w0 = 2 * math.pi * f / 44100.0
          alpha = math.sin(w0) / (2 * q)
          a0 = 1 + alpha / A
          coeff = [
              (1 + alpha * A) / a0,
              (-2 * math.cos(w0)) / a0,
              (1 - alpha * A) / a0,
              (-2 * math.cos(w0)) / a0,
              (1 - alpha / A) / a0,
          ]
          record = (
              struct.pack("<i", 12) +
              f32(100.0) + f32(0.0) + f32(2.23) +
              f32(-0.5) + f32(0.0) + f32(0.0) +
              b"".join(f32(x) for x in coeff)
          )
          packet = ufe_write(4, 144, record).hex().upper()

          expected = (
              "570000000400900030"
              "0C0000000000C8420000000052B80E40"
              "000000BF0000000000000000"
              "FDF37F3F9D22FFBF805E7E3F9D22FFBF7D527E3F"
          )
          assert packet == expected, (packet, expected)
          print("Protocol self-test PASS")
          PY

