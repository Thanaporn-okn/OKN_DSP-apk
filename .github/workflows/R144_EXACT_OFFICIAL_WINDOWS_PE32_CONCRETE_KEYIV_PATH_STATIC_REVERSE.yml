name: R144 exact official Windows PE32 concrete key IV path static reverse

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R144_EXACT_OFFICIAL_WINDOWS_PE32_CONCRETE_KEYIV_PATH_STATIC_REVERSE.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r144-official-windows-pe32-keyiv-${{ github.ref }}
  cancel-in-progress: true

env:
  FLASH_ALLOWED: "NO"
  R143_RUN_ID: "35963244963"
  R143_JOB_ID: "107516134414"
  R143_ARTIFACT_ID: "10793326684"
  R143_ARTIFACT_NAME: "R143-EXACT-OFFICIAL-WINDOWS-H15-CRYPTO-KEYIV-PATCHSTREAM-STATIC-EVIDENCE"
  R143_ARTIFACT_DIGEST: "sha256:b0392f46b4a2f13974013e5fdb50d0ddcd81fcf9cd452958404d746701d392df"
  WINDOWS_EXE_SHA256: "3ca54171c53f7badd963ffe6851b8b3e2faf8aee8ba2afcb7040990e22ae09b2"
  EXPECTED_KEY_HEX: "ef3259221c86959fd2122f8afb00fb208a42a068d0554a0ee526b8f7d6c844b3"
  EXPECTED_IV_HEX: "617b47f3146321e35d2bf8852ec8cf0d"

jobs:
  static_reverse:
    name: STATIC ONLY - PE32 concrete key/IV path - no execution - no USB - no board
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r144/r143 /tmp/r144/evidence
          cat > /tmp/r144/evidence/R144_SAFETY.txt <<'EOF'
          R144_MODE=OFFLINE_STATIC_PE32_CONCRETE_PATH_ONLY
          R144_VENDOR_BINARY_EXECUTED=NO
          R144_WINDOWS_EXE_EXECUTED=NO
          R144_USB_DEVICE_ACCESS=NO
          R144_BOARD_CONTACT=NO
          R144_AA55_SENT=NO
          R144_RUNTIME_0X11_SENT=NO
          R144_RUNTIME_0XFE_SENT=NO
          R144_FLASHBOOT_COMMAND_SENT=NO
          R144_FLASH_READ_EXECUTED=NO
          R144_FLASH_ERASE_EXECUTED=NO
          R144_FLASH_WRITE_EXECUTED=NO
          R144_ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD=NO
          HARDWARE_MODIFICATION=FORBIDDEN
          FLASH_ALLOWED=NO
          EOF

      - name: Download pinned R143 evidence
        uses: actions/download-artifact@v4
        with:
          name: R143-EXACT-OFFICIAL-WINDOWS-H15-CRYPTO-KEYIV-PATCHSTREAM-STATIC-EVIDENCE
          path: /tmp/r144/r143
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 35963244963

      - name: Verify and extract pinned R143 evidence
        shell: bash
        run: |
          set -euo pipefail
          OUTER="$(find /tmp/r144/r143 -maxdepth 2 -type f -name 'R143_EXACT_OFFICIAL_WINDOWS_H15_CRYPTO_KEYIV_PATCHSTREAM_STATIC_EVIDENCE.zip' -print -quit)"
          test -n "$OUTER"
          sha256sum "$OUTER" > /tmp/r144/evidence/R144_R143_INNER_ZIP.sha256
          unzip -q "$OUTER" -d /tmp/r144/evidence/r143
          test -s /tmp/r144/evidence/r143/R143_DECISION.json
          test -s /tmp/r144/evidence/r143/R143_N9_METHOD.il
          test -s /tmp/r144/evidence/r143/r142/R142_EXTRACTED_MANAGED_RESOURCES/02_h15IL2i6yy2BZV8RqM.YuRwd1JALC4oy32W66.bin
          test -s /tmp/r144/evidence/r143/r142/r141/r140/R140_FIXED_FULL.il
          grep -F '"FLASH_ALLOWED": false' /tmp/r144/evidence/r143/R143_DECISION.json

      - name: Reconstruct exact PE32 flattened path and crypto key IV
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json, hashlib

          ev=Path('/tmp/r144/evidence')
          lines=(ev/'r143/R143_N9_METHOD.il').read_text(errors='replace').splitlines()

          sw=next(x for x in lines if 'IL_0012: switch (' in x)
          labels=re.search(r'switch \((.*)\)',sw).group(1).split(', ')
          state_of={lab:i for i,lab in enumerate(labels)}

          label_line={}
          for i,l in enumerate(lines):
              m=re.match(r'\s*(IL_[0-9A-Fa-f]+):',l)
              if m and m.group(1) in state_of:
                  label_line[m.group(1)]=i
          ordered=sorted(label_line.items(), key=lambda x:x[1])
          blocks={}
          for n,(lab,s) in enumerate(ordered):
              e=ordered[n+1][1] if n+1<len(ordered) else len(lines)
              blocks[state_of[lab]]=lines[s:e]

          def simple_expr(xs):
              st=[]
              for x in xs:
                  m=re.search(r'ldc\.i4(?:\.s)?\s+(-?\d+)',x)
                  m2=re.search(r'ldc\.i4\.(\d)',x)
                  if m: st.append(int(m.group(1)) & 0xffffffff)
                  elif m2: st.append(int(m2.group(1)) & 0xffffffff)
                  elif re.search(r':\s+add$',x):
                      if len(st)<2:return None
                      b=st.pop();a=st.pop();st.append((a+b)&0xffffffff)
                  elif re.search(r':\s+sub$',x):
                      if len(st)<2:return None
                      b=st.pop();a=st.pop();st.append((a-b)&0xffffffff)
                  elif re.search(r':\s+xor$',x):
                      if len(st)<2:return None
                      b=st.pop();a=st.pop();st.append((a^b)&0xffffffff)
                  elif 'conv.u1' in x:
                      if not st:return None
                      st[-1]&=0xff
                  elif re.search(r'ldloc|ldarg|call|ldfld|ldsfld',x):
                      return None
              return st[-1] if len(st)==1 else None

          def const_before(bl,j,maxback=8):
              best=None
              for back in range(1,maxback+1):
                  if j-back<0:break
                  v=simple_expr(bl[j-back:j])
                  if v is not None:best=v
              return best

          # Proven visible-IL opaque predicate semantics:
          # zfos5... => ldnull, ldnull, ceq => true
          # omTje... => ldnull => false/null
          # tFjb... => IntPtr.Size; official file is PE32 Intel 80386, so concrete protector path uses 4.
          nahe=False

          def next_state(st,nahe):
              bl=blocks[st]

              # Static field update first.
              for j,x in enumerate(bl):
                  if 'stsfld bool' in x and 'NaheA732Kj' in x:
                      v=const_before(bl,j,4)
                      if v is not None: nahe=bool(v)

              # Static field conditional.
              for j,x in enumerate(bl):
                  if 'ldsfld bool' in x and 'NaheA732Kj' in x and j+1<len(bl):
                      m=re.search(r'br(true|false)\s+(IL_[0-9A-Fa-f]+)',bl[j+1])
                      if m:
                          take=nahe if m.group(1)=='true' else (not nahe)
                          if take and m.group(2) in state_of:
                              return state_of[m.group(2)],nahe,'Nahe'
                          break

              # Proven opaque predicates.
              for j,x in enumerate(bl):
                  known=None
                  if '::zfos5ENLukrcbiO4qNQ()' in x: known=True
                  elif '::omTjeHNp0inHSoSsOBH()' in x: known=False
                  if known is None or j+1>=len(bl): continue
                  m=re.search(r'br(true|false)\s+(IL_[0-9A-Fa-f]+)',bl[j+1])
                  if not m: continue
                  take=known if m.group(1)=='true' else (not known)
                  if take:
                      t=m.group(2)
                      if t=='IL_0012':
                          v=const_before(bl,j,8)
                          if v is not None:return int(v),nahe,'opaque-take'
                      if t in state_of:return state_of[t],nahe,'opaque-direct'
                  else:
                      for k in range(j+2,min(len(bl),j+9)):
                          if 'br IL_0012' in bl[k]:
                              v=const_before(bl,k,6)
                              if v is not None:return int(v),nahe,'opaque-fall'

              # PE32 IntPtr.Size == 4 path.
              for j,x in enumerate(bl):
                  if '::tFjbT6Nj4GDWeki27kh()' not in x: continue
                  for k in range(j+1,min(len(bl),j+6)):
                      m=re.search(r'(bne\.un|beq)\s+(IL_[0-9A-Fa-f]+)',bl[k])
                      if not m: continue
                      c=const_before(bl,k,5)
                      if c is None: break
                      take=(4!=c) if m.group(1)=='bne.un' else (4==c)
                      if take and m.group(2) in state_of:
                          return state_of[m.group(2)],nahe,'PE32-IntPtr'
                      break

              # Dispatcher via local95 -> IL_000e.
              for j,x in enumerate(bl):
                  if re.search(r'stloc(?:\.s)?\s+95\b',x):
                      v=const_before(bl,j,10)
                      if v is not None and any('br IL_000e' in y for y in bl[j:j+6]):
                          if 0<=int(v)<len(labels):return int(v),nahe,'local95'

              # Direct dispatcher constant.
              for j,x in enumerate(bl):
                  if 'br IL_0012' in x:
                      v=const_before(bl,j,8)
                      if v is not None and 0<=int(v)<len(labels):
                          return int(v),nahe,'switch'

              raise RuntimeError(f'unresolved state {st} {labels[st]}')

          # Start state is visible IL: ldc.i4 392; stloc 95.
          path=[]
          st=392
          for step in range(2000):
              path.append(st)
              if st==402: break  # IL_23ed: SymmetricAlgorithm + CreateDecryptor callsite
              st,nahe,_=next_state(st,nahe)
          else:
              raise RuntimeError('crypto state not reached')
          if path[-1]!=402:
              raise RuntimeError('crypto state not reached')

          scalar={55:0,104:0}
          arrays={17:{},100:{}}
          events=[]

          def process_block(step,st):
              bl=blocks[st]
              for j,x in enumerate(bl):
                  for loc in (55,104):
                      if re.search(rf'stloc(?:\.s)?\s+{loc}\b',x):
                          v=const_before(bl,j,10)
                          if v is not None:
                              scalar[loc]=int(v)&0xffffffff
                              events.append({'step':step,'state':st,'label':labels[st],'event':'set_scalar','local':loc,'value':scalar[loc]})

                  if 'stelem.i1' not in x: continue
                  win=bl[max(0,j-10):j+1]
                  for target,maxlen in ((17,32),(100,16)):
                      pos=[k for k,z in enumerate(win) if re.search(rf'ldloc(?:\.s)?\s+{target}\b',z)]
                      if not pos: continue
                      p=pos[-1]
                      idx=None; ip=None
                      for k in range(p+1,len(win)-1):
                          m=re.search(r'ldc\.i4(?:\.s)?\s+(-?\d+)',win[k]) or re.search(r'ldc\.i4\.(\d)',win[k])
                          if m:
                              idx=int(m.group(1));ip=k;break
                      if idx is None or not 0<=idx<maxlen: continue
                      expr=win[ip+1:-1]
                      value=None;source=None
                      for z in expr:
                          mm=re.search(r'ldloc(?:\.s)?\s+(\d+)',z)
                          if mm and int(mm.group(1)) in scalar:
                              sl=int(mm.group(1)); value=scalar[sl]&0xff; source=f'local{sl}'
                      if value is None:
                          v=simple_expr(expr)
                          if v is not None:value=int(v)&0xff;source='direct'
                      if value is not None:
                          arrays[target][idx]=value
                          events.append({'step':step,'state':st,'label':labels[st],'event':'store_byte','array_local':target,'index':idx,'value':value,'source':source})

          for step,st in enumerate(path):
              process_block(step,st)

          if len(arrays[17])!=32 or len(arrays[100])!=16:
              raise RuntimeError(f'incomplete arrays key={len(arrays[17])}/32 iv={len(arrays[100])}/16')

          key=bytes(arrays[17][i] for i in range(32))
          iv=bytes(arrays[100][i] for i in range(16))

          # Exact visible alias and CreateDecryptor call evidence.
          text='\n'.join(lines)
          alias_key=bool(re.search(r'ldloc 17\s*\n\s*IL_[0-9A-Fa-f]+:\s+stloc\.s 47',text))
          alias_iv=bool(re.search(r'ldloc 100\s*\n\s*IL_[0-9A-Fa-f]+:\s+stloc\.s 8',text))
          create_site=bool(re.search(r'ldloc\.s 47\s*\n\s*IL_[0-9A-Fa-f]+:\s+ldloc\.s 8\s*\n\s*IL_[0-9A-Fa-f]+:\s+call object .*::VnHlfpNorSGR6U9GUOp',text))
          wrapper=bool(re.search(r'SymmetricAlgorithm::CreateDecryptor\(uint8\[\], uint8\[\]\)',text))
          mode_cbc=bool(re.search(r'ldc\.i4\.1\s*\n\s*IL_[0-9A-Fa-f]+:\s+call void .*::Q2CVcdNXO7dpP5ufbGy',text))

          out={
              'concrete_runtime_assumption':'Official client is PE32 Intel 80386; protector IntPtr.Size branch is evaluated as 4.',
              'proven_opaque_predicates':{
                  'zfos5ENLukrcbiO4qNQ':True,
                  'omTjeHNp0inHSoSsOBH':None,
                  'NaheA732Kj_initial':False
              },
              'path_state_count_to_crypto':len(path),
              'path_reaches_crypto_state_402':path[-1]==402,
              'path_states':path,
              'path_labels':[labels[x] for x in path],
              'key_alias_local17_to_local47':alias_key,
              'iv_alias_local100_to_local8':alias_iv,
              'create_decryptor_callsite_uses_local47_local8':create_site,
              'wrapper_calls_SymmetricAlgorithm_CreateDecryptor':wrapper,
              'cipher_mode_value_1_visible_before_setup':mode_cbc,
              'key_length':len(key),'key_hex':key.hex(),'key_sha256':hashlib.sha256(key).hexdigest(),
              'iv_length':len(iv),'iv_hex':iv.hex(),'iv_sha256':hashlib.sha256(iv).hexdigest(),
              'array_write_events':events,
          }
          (ev/'R144_PE32_CONCRETE_KEYIV_PATH.json').write_text(json.dumps(out,indent=2)+'\n')

          expected_key='ef3259221c86959fd2122f8afb00fb208a42a068d0554a0ee526b8f7d6c844b3'
          expected_iv='617b47f3146321e35d2bf8852ec8cf0d'
          if key.hex()!=expected_key or iv.hex()!=expected_iv:
              raise RuntimeError(f'key/iv mismatch key={key.hex()} iv={iv.hex()}')
          PY

      - name: Verify h15 source framing and block alignment without decrypting vendor payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,re,struct,math,collections

          ev=Path('/tmp/r144/evidence')
          il=(ev/'r143/R143_N9_METHOD.il').read_text(errors='replace')
          h15=(ev/'r143/r142/R142_EXTRACTED_MANAGED_RESOURCES/02_h15IL2i6yy2BZV8RqM.YuRwd1JALC4oy32W66.bin').read_bytes()

          def entropy(b):
              c=collections.Counter(b);n=len(b)
              return -sum((v/n)*math.log2(v/n) for v in c.values()) if b else 0.0

          full_resource_read=bool(re.search(
              r'ldloc\.s 114.*?call object .*::oNNQE6NTi9uesXTTGZJ.*?'
              r'call int64 .*::B5fr4WNvBYuVpLZQQQQ.*?conv\.i4.*?'
              r'call object .*::sWg0PuN2fLSfxi2LB0D.*?stloc\.s 12',
              il,re.S))
          crypto_write_full_local12=bool(re.search(
              r'ldloc\.s 65.*?ldloc\.s 12.*?ldc\.i4\.0.*?ldloc\.s 12.*?ldlen.*?'
              r'call void .*::RMHoOvNN1BGBrZfKGy1',
              il,re.S))
          crypto_final=bool(re.search(r'ldloc\.s 65.*?call void .*::it3eekNKjtbEQVI5up2',il,re.S))

          out={
              'h15_size':len(h15),
              'h15_sha256':hashlib.sha256(h15).hexdigest(),
              'h15_entropy':round(entropy(h15),4),
              'h15_mod_16':len(h15)%16,
              'h15_first64_hex':h15[:64].hex(),
              'n9_reads_full_resource_length_into_local12':full_resource_read,
              'n9_writes_full_local12_to_crypto_stream':crypto_write_full_local12,
              'n9_calls_crypto_finalization_wrapper':crypto_final,
              'aes_cbc_block_alignment_satisfied_by_extracted_payload':(len(h15)%16==0),
              'important_interpretation':'R144 recovers the PE32-path key and IV statically, but does not claim plaintext recovery. The extracted h15 payload length is not 16-byte aligned, so direct AES-CBC decryption of that extracted payload is intentionally not attempted. The next step must resolve exact resource-stream framing/transform semantics rather than guessing bytes.'
          }
          (ev/'R144_H15_FRAMING_STATIC_ANALYSIS.json').write_text(json.dumps(out,indent=2)+'\n')
          PY

      - name: Build fail-closed R144 decision and report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          ev=Path('/tmp/r144/evidence')
          k=json.loads((ev/'R144_PE32_CONCRETE_KEYIV_PATH.json').read_text())
          h=json.loads((ev/'R144_H15_FRAMING_STATIC_ANALYSIS.json').read_text())

          proven=all([
              k['path_reaches_crypto_state_402'],
              k['key_alias_local17_to_local47'],
              k['iv_alias_local100_to_local8'],
              k['create_decryptor_callsite_uses_local47_local8'],
              k['wrapper_calls_SymmetricAlgorithm_CreateDecryptor'],
              k['key_length']==32,
              k['iv_length']==16,
          ])

          decision={
            'R143_RUN_ID':35963244963,
            'R143_JOB_ID':107516134414,
            'R143_ARTIFACT_ID':10793326684,
            'R143_ARTIFACT_DIGEST':'sha256:b0392f46b4a2f13974013e5fdb50d0ddcd81fcf9cd452958404d746701d392df',
            'WINDOWS_EXE_SHA256':'3ca54171c53f7badd963ffe6851b8b3e2faf8aee8ba2afcb7040990e22ae09b2',
            'PE32_CONCRETE_PATH_STATE_COUNT_TO_CREATEDECRYPTOR':k['path_state_count_to_crypto'],
            'PE32_CONCRETE_KEY_HEX':k['key_hex'],
            'PE32_CONCRETE_IV_HEX':k['iv_hex'],
            'PE32_CREATEDECRYPTOR_KEYIV_STATICALLY_RECOVERED':proven,
            'H15_SIZE':h['h15_size'],
            'H15_MOD_16':h['h15_mod_16'],
            'N9_READS_FULL_H15_RESOURCE_INTO_LOCAL12':h['n9_reads_full_resource_length_into_local12'],
            'N9_WRITES_FULL_LOCAL12_TO_CRYPTOSTREAM':h['n9_writes_full_local12_to_crypto_stream'],
            'H15_DIRECT_CBC_BLOCK_ALIGNMENT_OK':h['aes_cbc_block_alignment_satisfied_by_extracted_payload'],
            'H15_PLAINTEXT_RECOVERED':False,
            'PROTECTED_HID_METHOD_BODIES_RECOVERED':False,
            'PRODUCTION_VIDPID_RECOVERED_FROM_PROTECTED_METHOD_BODIES':False,
            'OFFICIAL_WINDOWS_PRODUCTION_USBHID_LINKAGE_STATICALLY_PROVEN':False,
            'READ_ONLY_IDENTIFY_PATH_STATICALLY_PROVEN_FOR_PRODUCTION':False,
            'SAFE_READ_ONLY_STOCK_BACKUP_PROVEN':False,
            'PRODUCTION_BOOTSTRAP_BRIDGE_PROVEN':False,
            'PRODUCTION_RECOVERY_USB_IDENTITY_PROVEN':False,
            'ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD':False,
            'AA55_LIVE_RETEST_ALLOWED':False,
            'RUNTIME_0X11_ALLOWED':False,
            'RUNTIME_0XFE_ALLOWED':False,
            'VENDOR_BINARY_EXECUTED':False,
            'USB_DEVICE_ACCESSED':False,
            'BOARD_CONTACTED':False,
            'FLASH_ALLOWED':False,
            'NEXT':'Trace exact h15 resource-stream framing plus CryptoStream wrapper/final-block semantics and compare CLR resource stream bytes against the extracted managed-resource payload. Do not guess padding, execute vendor code, or transmit USB.'
          }
          (ev/'R144_DECISION.json').write_text(json.dumps(decision,indent=2)+'\n')
          (ev/'R144_REPORT_TH.md').write_text(
              '# R144 official Windows PE32 concrete key/IV path\n\n'
              f'- path states to CreateDecryptor: {decision["PE32_CONCRETE_PATH_STATE_COUNT_TO_CREATEDECRYPTOR"]}\n'
              f'- key recovered: {decision["PE32_CREATEDECRYPTOR_KEYIV_STATICALLY_RECOVERED"]}\n'
              f'- key: {decision["PE32_CONCRETE_KEY_HEX"]}\n'
              f'- IV: {decision["PE32_CONCRETE_IV_HEX"]}\n'
              f'- h15 size/mod16: {decision["H15_SIZE"]}/{decision["H15_MOD_16"]}\n'
              f'- direct CBC alignment OK: {decision["H15_DIRECT_CBC_BLOCK_ALIGNMENT_OK"]}\n'
              '- plaintext not claimed\n\n'
              'FLASH_ALLOWED=NO\n')
          print(json.dumps(decision,indent=2))
          PY

      - name: Package R144 evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r144/evidence
          zip -9 -r /tmp/R144_EXACT_OFFICIAL_WINDOWS_PE32_CONCRETE_KEYIV_PATH_STATIC_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/R144_EXACT_OFFICIAL_WINDOWS_PE32_CONCRETE_KEYIV_PATH_STATIC_EVIDENCE.zip > /tmp/R144_EXACT_OFFICIAL_WINDOWS_PE32_CONCRETE_KEYIV_PATH_STATIC_EVIDENCE.zip.sha256

      - name: Upload R144 evidence
        uses: actions/upload-artifact@v4
        with:
          name: R144-EXACT-OFFICIAL-WINDOWS-PE32-CONCRETE-KEYIV-PATH-STATIC-EVIDENCE
          path: |
            /tmp/R144_EXACT_OFFICIAL_WINDOWS_PE32_CONCRETE_KEYIV_PATH_STATIC_EVIDENCE.zip
            /tmp/R144_EXACT_OFFICIAL_WINDOWS_PE32_CONCRETE_KEYIV_PATH_STATIC_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'R144_VENDOR_BINARY_EXECUTED=NO' /tmp/r144/evidence/R144_SAFETY.txt
          grep -F 'R144_WINDOWS_EXE_EXECUTED=NO' /tmp/r144/evidence/R144_SAFETY.txt
          grep -F 'R144_USB_DEVICE_ACCESS=NO' /tmp/r144/evidence/R144_SAFETY.txt
          grep -F 'R144_BOARD_CONTACT=NO' /tmp/r144/evidence/R144_SAFETY.txt
          grep -F 'R144_AA55_SENT=NO' /tmp/r144/evidence/R144_SAFETY.txt
          grep -F 'R144_RUNTIME_0X11_SENT=NO' /tmp/r144/evidence/R144_SAFETY.txt
          grep -F 'R144_RUNTIME_0XFE_SENT=NO' /tmp/r144/evidence/R144_SAFETY.txt
          grep -F '"FLASH_ALLOWED": false' /tmp/r144/evidence/R144_DECISION.json
          echo R144_PE32_CONCRETE_KEYIV_STATIC_REVERSE_COMPLETE=YES
          echo FLASH_ALLOWED=NO
