      - name: Static audit V10 source
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/v10/app/app/src/main/java/com/okn/bp1048p4v10/MainActivity.java

          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/v10/app/app/src/main/java/com/okn/bp1048p4v10/MainActivity.java')
          t=p.read_text()

          required=[
              'RUNTIME_VID=0x6324',
              'RUNTIME_PID=0x1719',
              'EXPECTED_RAW_SHA=',
              'EXPECTED_IF3_SHA=',
              'EXPECTED_IF4_SHA=',
              'new byte[]{0x04,0x66,0x1C,0x06,0x24}',
              'v10_get_device_description_used',
              'claimInterface(vendor,false)',
              'V10_EXACT_RUNTIME_FINGERPRINT_OK=',
              'V10_GET_DESCRIPTION_SET_REPORT_RESULT=',
              'V10_GET_DEVICE_DESCRIPTION_RESPONSE_SEEN=',
              'EXPORT_HOST_TO_DEVICE_SCOPE=ONE_VENDOR_GET_DEVICE_DESCRIPTION_ONLY',
              'EXPORT_FEATURE_REPORT_USED=false',
              'EXPORT_FLASH_ALLOWED=NO'
          ]
          missing=[x for x in required if x not in t]
          if missing:
              raise SystemExit('V10 missing required token(s): '+repr(missing))

          forbidden=[
              '0x0300',
              'bulkTransfer(',
              'UsbRequest',
              'setConfiguration(',
              'setInterface(',
              'SpiFlashErase',
              'SpiFlashWrite',
              'start_up_grate',
              'FLASH_BOOT_EN'
          ]
          bad=[x for x in forbidden if x in t]
          if bad:
              raise SystemExit('V10 forbidden token(s): '+repr(bad))

          if t.count('controlTransfer(0x21,0x09,0x0200') != 0:
              # The source intentionally formats the call across lines.
              pass

          # Exactly one host-to-device USB control transfer must exist.
          if t.count('0x21,0x09,0x0200') != 1:
              raise SystemExit('V10 must contain exactly one host-to-device SET_REPORT call site')

          if t.count('0xA1,0x01,0x0100') != 1:
              raise SystemExit('V10 must contain exactly one Input GET_REPORT call site')

          if 'new byte[]{0x04,0x66,0x1C,0x06,0x24}' not in t:
              raise SystemExit('V10 vendor GET DEVICE DESCRIPTION payload mismatch')

          print('V10_SOURCE_STATIC_AUDIT=PASS')
          PY

          ! grep -q -F '0x0300' "$SRC"
          ! grep -q -E 'bulkTransfer\(|UsbRequest|setConfiguration\(|setInterface\(' "$SRC"

          cp "$SRC" /tmp/v10/evidence/MainActivity.java
          sha256sum "$SRC" | tee /tmp/v10/evidence/01_MAINACTIVITY_SHA256.txt

      - name: Build V10 APK
        shell: bash
        run: |
          set -euo pipefail

          SDKMAN="$(command -v sdkmanager || true)"
          if [ -n "$SDKMAN" ]; then
            set +o pipefail
            yes | "$SDKMAN" --licenses >/dev/null 2>&1 || true
            set -o pipefail
            "$SDKMAN" "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true
          fi

          cd /tmp/v10
          curl -fL --retry 4 --retry-all-errors --connect-timeout 20 \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o gradle.zip
          unzip -q gradle.zip
          export PATH="/tmp/v10/gradle-8.9/bin:$PATH"

          cd /tmp/v10/app
          gradle --no-daemon --stacktrace :app:assembleDebug \
            | tee /tmp/v10/evidence/02_GRADLE_BUILD.txt

          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"

          cp "$APK" /tmp/v10/out/OKN_BP1048P4_V10_VENDOR_GET_DEVICE_DESCRIPTION.apk
          sha256sum "$APK" | tee /tmp/v10/evidence/03_APK_SHA256.txt

      - name: APK packaged-source audit all DEX files
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/v10/out/OKN_BP1048P4_V10_VENDOR_GET_DEVICE_DESCRIPTION.apk

          unzip -l "$APK" | tee /tmp/v10/evidence/04_APK_FILE_LIST.txt

          rm -rf /tmp/v10/dex_audit
          mkdir -p /tmp/v10/dex_audit
          unzip -q "$APK" 'classes*.dex' -d /tmp/v10/dex_audit

          : > /tmp/v10/evidence/05_DEX_STRINGS.txt
          for dex in /tmp/v10/dex_audit/classes*.dex; do
            test -s "$dex"
            echo "===== $(basename "$dex") =====" >> /tmp/v10/evidence/05_DEX_STRINGS.txt
            strings "$dex" >> /tmp/v10/evidence/05_DEX_STRINGS.txt
          done

          DEX_COUNT="$(find /tmp/v10/dex_audit -maxdepth 1 -type f -name 'classes*.dex' | wc -l)"
          echo "DEX_COUNT=$DEX_COUNT" | tee /tmp/v10/evidence/05A_DEX_AUDIT_SUMMARY.txt
          test "$DEX_COUNT" -ge 1

          grep -q -F 'V10_GET_DEVICE_DESCRIPTION_RESPONSE_SEEN=' /tmp/v10/evidence/05_DEX_STRINGS.txt
          grep -q -F 'ONE_VENDOR_GET_DEVICE_DESCRIPTION_ONLY' /tmp/v10/evidence/05_DEX_STRINGS.txt

          # The raw byte array is compiled as byte constants, so the contiguous hex text
          # is optional in DEX strings. The source audit above is authoritative for payload.
          grep -q -F '04661C0624' /tmp/v10/evidence/05_DEX_STRINGS.txt || true

          echo "V10_ALL_DEX_PACKAGED_SOURCE_AUDIT=PASS" \
            | tee -a /tmp/v10/evidence/05A_DEX_AUDIT_SUMMARY.txt

          cat > /tmp/v10/evidence/06_V10_FINAL_DECISION.md <<'EOF'
          # OKN BP1048P4 V10

          - Official vendor GET DEVICE DESCRIPTION command recovered offline: `66 1C 06 24`
          - Vendor HID Send length wrapper recovered from JIT: one payload-length byte
          - Android candidate Output report data: `04 66 1C 06 24` + zero padding to 256 bytes
          - Exact physical runtime fingerprint required before button is enabled
          - One persistent user-confirmed host-to-device request only
          - Same-session Input GET_REPORT: 256 bytes, repeated capture only
          - Feature GET_REPORT: **DISABLED**
          - Feature SET_REPORT: **DISABLED**
          - Arbitrary HID output: **DISABLED**
          - Recovery/update/erase/flash: **DISABLED**
          - `FLASH_ALLOWED=NO`
          - Classification: **READ_ONLY_VENDOR_QUERY_DIAGNOSTIC_NOT_FOR_FLASH**
          EOF

          cp /tmp/v10/evidence/* /tmp/v10/out/
          (cd /tmp/v10/out && sha256sum * > SHA256SUMS.txt)

