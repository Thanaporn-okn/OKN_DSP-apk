name: OKN BP1048P4 V10 FIXED V2 VENDOR GET DEVICE DESCRIPTION S25 USB-C ONLY

"on":
  workflow_dispatch:

permissions:
  contents: read

env:
  REQUIRED_PHONE: "Samsung Galaxy S25+"
  REQUIRED_PATH: "Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only"
  TARGET_SOC: "MVSilicon BP1048P4"
  RUNTIME_VID_HEX: "6324"
  RUNTIME_PID_HEX: "1719"
  FLASH_ALLOWED: "NO"
  ERASE_ALLOWED: "NO"
  WRITE_ALLOWED: "NO"
  HID_FEATURE_REPORT_ALLOWED: "NO"
  GENERAL_HID_OUTPUT_ALLOWED: "NO"
  HOST_TO_DEVICE_ALLOWED: "ONE_VENDOR_GET_DEVICE_DESCRIPTION_ONLY"

jobs:
  v10-build:
    name: V10 FIXED V2 vendor GET DEVICE DESCRIPTION read-only capture APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$REQUIRED_PHONE" = "Samsung Galaxy S25+"
          test "$REQUIRED_PATH" = "Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only"
          test "$FLASH_ALLOWED" = "NO"
          test "$ERASE_ALLOWED" = "NO"
          test "$WRITE_ALLOWED" = "NO"
          test "$HID_FEATURE_REPORT_ALLOWED" = "NO"
          test "$GENERAL_HID_OUTPUT_ALLOWED" = "NO"
          test "$HOST_TO_DEVICE_ALLOWED" = "ONE_VENDOR_GET_DEVICE_DESCRIPTION_ONLY"

          rm -rf /tmp/v10
          mkdir -p /tmp/v10/{app,evidence,out}

          cat > /tmp/v10/evidence/00_READ_FIRST.txt <<'EOF'
          OKN BP1048P4 V10
          PURPOSE=ONE USER-CONFIRMED VENDOR GET DEVICE DESCRIPTION REQUEST
          REQUIRED_PHONE=Samsung Galaxy S25+
          REQUIRED_PATH=Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only
          EXPECTED_RUNTIME_USB=6324:1719

          VENDOR_EVIDENCE:
          Official GoloPine/DSTech Windows client SHA256:
          3CA54171C53F7BADD963FFE6851B8B3E2FAF8AEE8BA2AFCB7040990E22AE09B2

          MASTER V9 recovered:
          GetDevcieDescriptionCommand.ToByteArray() = 66 1C 06 24

          MASTER V8/V9 JIT recovered:
          HIDInterface.Send(byte[]) prepends one payload-length byte.
          Hid.Write(report) uses report ID 0 in the Windows HID API buffer.
          Android control SET_REPORT already identifies report ID 0 in wValue=0x0200,
          so the candidate 256-byte USB report data starts:
          04 66 1C 06 24 00 00 ... 00

          IMPORTANT:
          This is a vendor-derived transport candidate, not yet a captured USB bus trace.
          It is used only for a read-only GET DEVICE DESCRIPTION request.
          Feature reports are forbidden.
          No firmware/update/erase/flash/recovery command exists in this APK.
          FLASH_ALLOWED=NO
          NOT_FOR_FLASH
          EOF

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate minimal Android project
        shell: bash
        run: |
          set -euo pipefail
          A=/tmp/v10/app
          mkdir -p "$A/app/src/main/java/com/okn/bp1048p4v10" "$A/app/src/main/res/xml"

          cat > "$A/settings.gradle" <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name='OKN_BP1048P4_V10_VENDOR_GET_DESCRIPTION'
          include ':app'
          EOF

          cat > "$A/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > "$A/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > "$A/app/build.gradle" <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.okn.bp1048p4v10'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.okn.bp1048p4v10'
                  minSdk 29
                  targetSdk 35
                  versionCode 10
                  versionName '10.0'
              }
          }
          EOF

          cat > "$A/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.usb.host" android:required="true"/>
              <application
                  android:allowBackup="false"
                  android:label="OKN BP1048P4 V10 GET DESCRIPTION"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED"
                          android:resource="@xml/device_filter"/>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > "$A/app/src/main/res/xml/device_filter.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <usb-device vendor-id="25380" product-id="5913"/>
          </resources>
          EOF

          cat > "$A/app/src/main/java/com/okn/bp1048p4v10/MainActivity.java" <<'JAVA'
          package com.okn.bp1048p4v10;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.hardware.usb.UsbDevice;
          import android.hardware.usb.UsbDeviceConnection;
          import android.hardware.usb.UsbInterface;
          import android.hardware.usb.UsbManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.SystemClock;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import java.security.MessageDigest;
          import java.util.HashMap;
          import java.util.Locale;
          import java.util.Map;

          @SuppressWarnings("deprecation")
          public class MainActivity extends Activity {
              private static final int RUNTIME_VID=0x6324;
              private static final int RUNTIME_PID=0x1719;
              private static final int RECOVERY_VID=0x0000;
              private static final int RECOVERY_PID=0x2244;
              private static final int SAVE_EVIDENCE=101;
              private static final String ACTION_USB_PERMISSION="com.okn.bp1048p4v10.USB_PERMISSION";

              private static final String EXPECTED_RAW_SHA=
                  "C7E861A6F28EB832E16450D3A35B64C557BEA4E0CC15FF1EB94C45E348C84001";
              private static final String EXPECTED_IF3_SHA=
                  "BAFE7C0E6A251EB36B11362B18106DFF3DC0010A831A3B8B6CD49DBF4A9AE2C3";
              private static final String EXPECTED_IF4_SHA=
                  "78510751B31DCC204CD6CA2FE023F05CF84B75227A279E8E1FBAF7D6C3A21B6F";

              // Recovered from official vendor client:
              // GetDevcieDescriptionCommand.ToByteArray() = 66 1C 06 24
              // HIDInterface.Send(byte[]) adds one length byte => 04 66 1C 06 24.
              private static final byte[] GET_DEVICE_DESCRIPTION_PAYLOAD=
                  new byte[]{0x04,0x66,0x1C,0x06,0x24};

              private UsbManager usb;
              private TextView log;
              private Button queryButton;
              private long t0;
              private int permissionRequestedFor=-1;

              private boolean descriptorEvidenceComplete=false;
              private boolean rawFingerprintOk=false;
              private boolean if3FingerprintOk=false;
              private boolean if4FingerprintOk=false;
              private boolean exactFingerprintOk=false;

              private boolean queryAttempted=false;
              private boolean responseSeen=false;
              private int nonZeroResponseCount=0;

              private final StringBuilder evidence=new StringBuilder();

              private final BroadcastReceiver permissionRx=new BroadcastReceiver(){
                  @Override public void onReceive(Context c, Intent i){
                      if(!ACTION_USB_PERMISSION.equals(i.getAction()))return;
                      UsbDevice d=getDevice(i);
                      boolean granted=i.getBooleanExtra(UsbManager.EXTRA_PERMISSION_GRANTED,false);
                      permissionRequestedFor=-1;
                      line("USB_PERMISSION_RESULT="+granted+dev(d));
                      if(granted && runtime(d)) readDescriptors(d);
                  }
              };

              private final BroadcastReceiver usbRx=new BroadcastReceiver(){
                  @Override public void onReceive(Context c, Intent i){
                      String a=i.getAction();
                      if(UsbManager.ACTION_USB_DEVICE_ATTACHED.equals(a)){
                          line("USB_ATTACHED=true");
                          scan(true);
                      }else if(UsbManager.ACTION_USB_DEVICE_DETACHED.equals(a)){
                          line("USB_DETACHED=true");
                          permissionRequestedFor=-1;
                          exactFingerprintOk=false;
                          updateButton();
                      }
                  }
              };

              @Override protected void onCreate(Bundle b){
                  super.onCreate(b);
                  t0=SystemClock.elapsedRealtime();
                  usb=(UsbManager)getSystemService(Context.USB_SERVICE);
                  queryAttempted=getPreferences(MODE_PRIVATE)
                      .getBoolean("v10_get_device_description_used",false);

                  evidence.append("EVIDENCE_FORMAT=OKN_BP1048P4_V10_VENDOR_GET_DEVICE_DESCRIPTION\n");
                  evidence.append("REQUIRED_PHONE=Samsung Galaxy S25+\n");
                  evidence.append("REQUIRED_PATH=Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only\n");
                  evidence.append("EXPECTED_RUNTIME_VID_PID=6324:1719\n");
                  evidence.append("VENDOR_EXE_SHA256=3CA54171C53F7BADD963FFE6851B8B3E2FAF8AEE8BA2AFCB7040990E22AE09B2\n");
                  evidence.append("V9_GET_DEVICE_DESCRIPTION_COMMAND_HEX=661C0624\n");
                  evidence.append("V10_VENDOR_DERIVED_HID_PAYLOAD_HEX=04661C0624\n");
                  evidence.append("V10_OUTPUT_REPORT_BYTES=256\n");
                  evidence.append("V10_REPORT_ID=0\n");
                  evidence.append("V10_FEATURE_REPORT_ALLOWED=false\n");
                  evidence.append("V10_GENERAL_OUTPUT_ALLOWED=false\n");
                  evidence.append("V10_ONLY_HOST_TO_DEVICE_COMMAND=GET_DEVICE_DESCRIPTION\n");
                  evidence.append("FLASH_WRITE_ERASE_RECOVERY=false\n");
                  evidence.append("FLASH_ALLOWED=NO\n");

                  IntentFilter pf=new IntentFilter(ACTION_USB_PERMISSION);
                  IntentFilter uf=new IntentFilter();
                  uf.addAction(UsbManager.ACTION_USB_DEVICE_ATTACHED);
                  uf.addAction(UsbManager.ACTION_USB_DEVICE_DETACHED);

                  if(Build.VERSION.SDK_INT>=33){
                      registerReceiver(permissionRx,pf,Context.RECEIVER_NOT_EXPORTED);
                      registerReceiver(usbRx,uf);
                  }else{
                      registerReceiver(permissionRx,pf);
                      registerReceiver(usbRx,uf);
                  }

                  LinearLayout root=new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(28,28,28,28);

                  TextView title=new TextView(this);
                  title.setText("OKN BP1048P4 V10 — Vendor GET DEVICE DESCRIPTION");
                  title.setTextSize(20);
                  root.addView(title);

                  TextView note=new TextView(this);
                  note.setText(
                      "\nSamsung Galaxy S25+ → USB-C → DSP USB-C only\n"+
                      "1) Verify exact physical board fingerprints\n"+
                      "2) Send ONE vendor read-only GET DEVICE DESCRIPTION request\n"+
                      "3) Capture only Input reports from the same IF4 session\n\n"+
                      "Vendor-derived report data: 04 66 1C 06 24 + zero padding to 256 bytes\n"+
                      "No Feature GET/SET • no arbitrary HID output • no updater/recovery • no erase/flash\n"+
                      "If the one-shot latch was already used, reinstall/clear app data before another attempt.\n");
                  root.addView(note);

                  add(root,"REQUEST USB PERMISSION + VERIFY EXACT BOARD",v->scan(true));
                  add(root,"SCAN WITHOUT PERMISSION REQUEST",v->scan(false));
                  queryButton=add(root,"RUN ONE-TIME VENDOR GET DEVICE DESCRIPTION",v->confirmQuery());
                  queryButton.setEnabled(false);
                  add(root,"SAVE FULL EVIDENCE REPORT",v->saveEvidence());

                  log=new TextView(this);
                  log.setTextIsSelectable(true);
                  log.setText("\nLog:\n");
                  root.addView(log);

                  ScrollView s=new ScrollView(this);
                  s.addView(root);
                  setContentView(s);
                  scan(false);
              }

              private Button add(LinearLayout r,String text,android.view.View.OnClickListener l){
                  Button b=new Button(this);
                  b.setText(text);
                  b.setAllCaps(false);
                  b.setOnClickListener(l);
                  r.addView(b);
                  return b;
              }

              private UsbDevice getDevice(Intent i){
                  if(Build.VERSION.SDK_INT>=33)
                      return i.getParcelableExtra(UsbManager.EXTRA_DEVICE,UsbDevice.class);
                  return i.getParcelableExtra(UsbManager.EXTRA_DEVICE);
              }

              private void line(String s){
                  long ms=SystemClock.elapsedRealtime()-t0;
                  String row=String.format(Locale.US,"[%06dms] %s\n",ms,s);
                  evidence.append(row);
                  if(log!=null)log.append(row);
              }

              private String dev(UsbDevice d){
                  if(d==null)return "";
                  return String.format(Locale.US," [%04X:%04X id=%d name=%s]",
                      d.getVendorId(),d.getProductId(),d.getDeviceId(),d.getDeviceName());
              }

              private boolean runtime(UsbDevice d){
                  return d!=null && d.getVendorId()==RUNTIME_VID && d.getProductId()==RUNTIME_PID;
              }

              private boolean recovery(UsbDevice d){
                  return d!=null && d.getVendorId()==RECOVERY_VID && d.getProductId()==RECOVERY_PID;
              }

              private void updateButton(){
                  if(queryButton!=null)
                      queryButton.setEnabled(exactFingerprintOk && !queryAttempted);
                  line("V10_QUERY_BUTTON_ENABLED="+(exactFingerprintOk && !queryAttempted));
              }

              private void requestPermission(UsbDevice d){
                  if(d==null || usb.hasPermission(d))return;
                  if(permissionRequestedFor==d.getDeviceId())return;
                  Intent intent=new Intent(ACTION_USB_PERMISSION).setPackage(getPackageName());
                  PendingIntent pi=PendingIntent.getBroadcast(
                      this,d.getDeviceId(),intent,
                      PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_MUTABLE);
                  permissionRequestedFor=d.getDeviceId();
                  line("USB_PERMISSION_REQUESTED=true"+dev(d));
                  usb.requestPermission(d,pi);
              }

              private void scan(boolean request){
                  Map<String,UsbDevice> m=usb.getDeviceList();
                  line("USB_DEVICE_COUNT="+m.size());
                  UsbDevice target=null;
                  boolean recoverySeen=false;
                  for(UsbDevice d:m.values()){
                      line("USB_DEVICE="+dev(d)+" permission="+usb.hasPermission(d));
                      if(runtime(d))target=d;
                      if(recovery(d))recoverySeen=true;
                  }
                  line("RECOVERY_DEVICE_PRESENT="+recoverySeen);

                  if(target==null){
                      line("V10_RUNTIME_TARGET_FOUND=false");
                      exactFingerprintOk=false;
                      updateButton();
                      return;
                  }

                  line("V10_RUNTIME_TARGET_FOUND=true");
                  if(!usb.hasPermission(target)){
                      line("V10_RUNTIME_PERMISSION=false");
                      if(request)requestPermission(target);
                      updateButton();
                      return;
                  }
                  line("V10_RUNTIME_PERMISSION=true");
                  readDescriptors(target);
              }

              private Map<Integer,Integer> hidLengths(byte[] raw){
                  Map<Integer,Integer> out=new HashMap<>();
                  int p=0,currentIf=-1,currentClass=-1;
                  while(raw!=null && p+2<=raw.length){
                      int len=raw[p]&255;
                      int type=raw[p+1]&255;
                      if(len<2 || p+len>raw.length)break;
                      if(type==0x04 && len>=9){
                          currentIf=raw[p+2]&255;
                          currentClass=raw[p+5]&255;
                      }else if(type==0x21 && currentClass==3 && currentIf>=0 && len>=9){
                          int num=raw[p+5]&255;
                          int q=p+6;
                          for(int k=0;k<num && q+2<p+len;k++,q+=3){
                              int dtype=raw[q]&255;
                              int dlen=(raw[q+1]&255)|((raw[q+2]&255)<<8);
                              if(dtype==0x22 && dlen>0){
                                  out.put(currentIf,dlen);
                                  break;
                              }
                          }
                      }
                      p+=len;
                  }
                  return out;
              }

              private int readReportDescriptor(
                  UsbDeviceConnection c,UsbInterface x,int expected,String phase){
                  int ask=expected>0?expected:4096;
                  byte[] b=new byte[ask];
                  int r=c.controlTransfer(0x81,0x06,0x2200,x.getId(),b,b.length,1500);
                  line("IF"+x.getId()+"_"+phase+"_REPORT_DESCRIPTOR_RESULT="+r+" expected="+expected);
                  if(r>0){
                      byte[] exact=new byte[r];
                      System.arraycopy(b,0,exact,0,r);
                      String sh=sha256(exact);
                      line("IF"+x.getId()+"_REPORT_SHA256="+sh);
                      line("IF"+x.getId()+"_REPORT_HEX="+hex(exact));
                      if(x.getId()==3 && r==33)if3FingerprintOk=EXPECTED_IF3_SHA.equals(sh);
                      if(x.getId()==4 && r==36)if4FingerprintOk=EXPECTED_IF4_SHA.equals(sh);
                  }
                  return r;
              }

              private void readDescriptors(UsbDevice d){
                  descriptorEvidenceComplete=false;
                  rawFingerprintOk=false;
                  if3FingerprintOk=false;
                  if4FingerprintOk=false;
                  exactFingerprintOk=false;

                  if(!usb.hasPermission(d)){
                      line("DESCRIPTOR_ABORT_NO_PERMISSION=true");
                      updateButton();
                      return;
                  }

                  UsbDeviceConnection c=usb.openDevice(d);
                  if(c==null){
                      line("DESCRIPTOR_OPEN_DEVICE_NULL=true");
                      updateButton();
                      return;
                  }

                  try{
                      byte[] raw=c.getRawDescriptors();
                      if(raw==null || raw.length==0){
                          line("RAW_DESCRIPTOR_EMPTY=true");
                          return;
                      }

                      String rawSha=sha256(raw);
                      rawFingerprintOk=EXPECTED_RAW_SHA.equals(rawSha);
                      line("RAW_DESCRIPTOR_BYTES="+raw.length);
                      line("RAW_DESCRIPTOR_SHA256="+rawSha);
                      line("RAW_DESCRIPTOR_FINGERPRINT_OK="+rawFingerprintOk);

                      Map<Integer,Integer> lens=hidLengths(raw);
                      line("HID_REPORT_DESCRIPTOR_LENGTHS="+lens);

                      UsbInterface if3=null,if4=null;
                      for(int i=0;i<d.getInterfaceCount();i++){
                          UsbInterface x=d.getInterface(i);
                          line(String.format(Locale.US,
                              "IF[%d] id=%d class=%d sub=%d proto=%d eps=%d",
                              i,x.getId(),x.getInterfaceClass(),x.getInterfaceSubclass(),
                              x.getInterfaceProtocol(),x.getEndpointCount()));
                          if(x.getInterfaceClass()==3 && x.getId()==3)if3=x;
                          if(x.getInterfaceClass()==3 && x.getId()==4)if4=x;
                      }

                      if(if4!=null){
                          int exp=lens.containsKey(4)?lens.get(4):36;
                          readReportDescriptor(c,if4,exp,"UNCLAIMED");
                      }

                      if(if3!=null){
                          int exp=lens.containsKey(3)?lens.get(3):33;
                          int r=readReportDescriptor(c,if3,exp,"UNCLAIMED");
                          if(r<=0){
                              boolean claimed=c.claimInterface(if3,false);
                              line("IF3_NONFORCED_CLAIM="+claimed);
                              if(claimed){
                                  try{readReportDescriptor(c,if3,exp,"CLAIM_FALSE");}
                                  finally{
                                      boolean rel=c.releaseInterface(if3);
                                      line("IF3_NONFORCED_RELEASE="+rel);
                                  }
                              }
                          }
                          if(!if3FingerprintOk){
                              boolean claimed=c.claimInterface(if3,true);
                              line("IF3_TEMP_FORCE_CLAIM="+claimed);
                              if(claimed){
                                  try{readReportDescriptor(c,if3,exp,"TEMP_FORCE_TRUE");}
                                  finally{
                                      boolean rel=c.releaseInterface(if3);
                                      line("IF3_TEMP_FORCE_RELEASE="+rel);
                                  }
                              }
                          }
                      }

                      descriptorEvidenceComplete=rawFingerprintOk && if3FingerprintOk && if4FingerprintOk;
                      exactFingerprintOk=descriptorEvidenceComplete;
                      line("V10_DESCRIPTOR_EVIDENCE_COMPLETE="+descriptorEvidenceComplete);
                      line("V10_EXACT_RUNTIME_FINGERPRINT_OK="+exactFingerprintOk);
                  }finally{
                      c.close();
                      updateButton();
                  }
              }

              private void confirmQuery(){
                  if(queryAttempted){
                      line("V10_QUERY_BLOCKED_ALREADY_USED=true");
                      return;
                  }
                  if(!descriptorEvidenceComplete || !exactFingerprintOk){
                      line("V10_QUERY_BLOCKED_FINGERPRINT_NOT_VERIFIED=true");
                      return;
                  }

                  new AlertDialog.Builder(this)
                      .setTitle("V10 vendor GET DEVICE DESCRIPTION")
                      .setMessage(
                          "ส่ง Output report เพียงครั้งเดียว:\n"+
                          "04 66 1C 06 24 + zero padding to 256 bytes\n\n"+
                          "คำสั่ง 66 1C 06 24 ถูกดึงจาก GetDevcieDescriptionCommand.ToByteArray() "+
                          "ของซอฟต์แวร์ GoloPine/DSTech ทางการ\n\n"+
                          "ไม่มี Feature report / updater / erase / flash")
                      .setNegativeButton("CANCEL",null)
                      .setPositiveButton("RUN ONCE",(d,w)->runQueryOnce())
                      .show();
              }

              private void runQueryOnce(){
                  if(queryAttempted){
                      line("V10_QUERY_BLOCKED_ALREADY_USED=true");
                      return;
                  }
                  if(!descriptorEvidenceComplete || !exactFingerprintOk){
                      line("V10_QUERY_BLOCKED_FINGERPRINT_NOT_VERIFIED=true");
                      return;
                  }

                  UsbDevice target=null;
                  boolean recoverySeen=false;
                  for(UsbDevice d:usb.getDeviceList().values()){
                      if(runtime(d))target=d;
                      if(recovery(d))recoverySeen=true;
                  }

                  if(recoverySeen){
                      line("V10_QUERY_BLOCKED_RECOVERY_DEVICE_PRESENT=true");
                      return;
                  }
                  if(target==null){
                      line("V10_QUERY_BLOCKED_RUNTIME_NOT_FOUND=true");
                      return;
                  }
                  if(!usb.hasPermission(target)){
                      line("V10_QUERY_BLOCKED_NO_PERMISSION=true");
                      return;
                  }

                  queryAttempted=true;
                  boolean persisted=getPreferences(MODE_PRIVATE).edit()
                      .putBoolean("v10_get_device_description_used",true).commit();
                  if(queryButton!=null)queryButton.setEnabled(false);

                  line("V10_QUERY_ATTEMPT_LATCHED=true");
                  line("V10_QUERY_ATTEMPT_PERSISTED="+persisted);
                  if(!persisted){
                      line("V10_QUERY_ABORT_PERSISTENCE_FAILED=true");
                      return;
                  }

                  UsbDeviceConnection c=usb.openDevice(target);
                  if(c==null){
                      line("V10_QUERY_OPEN_DEVICE_NULL=true");
                      return;
                  }

                  UsbInterface vendor=null;
                  for(int i=0;i<target.getInterfaceCount();i++){
                      UsbInterface x=target.getInterface(i);
                      if(x.getInterfaceClass()==3 && x.getId()==4){
                          vendor=x;
                          break;
                      }
                  }

                  if(vendor==null){
                      line("V10_QUERY_BLOCKED_IF4_MISSING=true");
                      c.close();
                      return;
                  }

                  boolean claimed=false;
                  try{
                      claimed=c.claimInterface(vendor,false);
                      line("V10_QUERY_IF4_CLAIM_FORCE_FALSE="+claimed);
                      if(!claimed){
                          line("V10_QUERY_ABORT_NO_NONFORCED_CLAIM=true");
                          return;
                      }

                      byte[] outReport=new byte[256];
                      System.arraycopy(
                          GET_DEVICE_DESCRIPTION_PAYLOAD,0,
                          outReport,0,GET_DEVICE_DESCRIPTION_PAYLOAD.length);

                      line("V10_VENDOR_COMMAND_TO_BYTE_ARRAY_HEX=661C0624");
                      line("V10_VENDOR_DERIVED_USB_REPORT_PREFIX_HEX=04661C0624");
                      line("V10_VENDOR_DERIVED_USB_REPORT_ZERO_PAD_BYTES=251");
                      line("V10_SET_REPORT_BMREQUESTTYPE=0x21");
                      line("V10_SET_REPORT_BREQUEST=0x09");
                      line("V10_SET_REPORT_WVALUE=0x0200");
                      line("V10_SET_REPORT_WINDEX="+vendor.getId());
                      line("V10_SET_REPORT_WLENGTH=256");

                      int wo=c.controlTransfer(
                          0x21,0x09,0x0200,vendor.getId(),
                          outReport,outReport.length,1500);

                      line("V10_GET_DESCRIPTION_SET_REPORT_RESULT="+wo+" requestedBytes=256");
                      if(wo!=256){
                          line("V10_QUERY_ABORT_OUTPUT_NOT_FULL=true");
                          return;
                      }

                      line("V10_INPUT_CAPTURE_BEGIN=true");
                      int consecutiveEmpty=0;

                      for(int n=0;n<32;n++){
                          SystemClock.sleep(n==0?50:25);

                          byte[] input=new byte[256];
                          int ri=c.controlTransfer(
                              0xA1,0x01,0x0100,vendor.getId(),
                              input,input.length,1000);

                          line("V10_INPUT_REPORT_"+n+"_RESULT="+ri+" requestedBytes=256");

                          if(ri<=0){
                              consecutiveEmpty++;
                              if(responseSeen && consecutiveEmpty>=3){
                                  line("V10_INPUT_CAPTURE_STOP_AFTER_EMPTY_COUNT="+consecutiveEmpty);
                                  break;
                              }
                              continue;
                          }

                          consecutiveEmpty=0;
                          byte[] exact=new byte[ri];
                          System.arraycopy(input,0,exact,0,ri);

                          boolean nonZero=false;
                          for(byte z:exact){
                              if(z!=0){nonZero=true;break;}
                          }

                          line("V10_INPUT_REPORT_"+n+"_SHA256="+sha256(exact));
                          line("V10_INPUT_REPORT_"+n+"_HEX="+hex(exact));
                          line("V10_INPUT_REPORT_"+n+"_NONZERO="+nonZero);

                          if(nonZero){
                              responseSeen=true;
                              nonZeroResponseCount++;

                              int declared=exact[0]&255;
                              int available=Math.max(0,ri-1);
                              int take=Math.min(declared,available);
                              line("V10_INPUT_REPORT_"+n+"_DECLARED_PAYLOAD_LENGTH="+declared);
                              line("V10_INPUT_REPORT_"+n+"_AVAILABLE_AFTER_LENGTH="+available);

                              if(take>0){
                                  byte[] payload=new byte[take];
                                  System.arraycopy(exact,1,payload,0,take);
                                  line("V10_INPUT_REPORT_"+n+"_PAYLOAD_HEX="+hex(payload));
                                  line(String.format(
                                      Locale.US,
                                      "V10_INPUT_REPORT_%d_PAYLOAD_HEADER=0x%02X",
                                      n,payload[0]&255));
                              }
                          }
                      }

                      line("V10_INPUT_CAPTURE_NONZERO_REPORTS="+nonZeroResponseCount);
                      line("V10_GET_DEVICE_DESCRIPTION_RESPONSE_SEEN="+responseSeen);
                      line("V10_INPUT_CAPTURE_END=true");
                  }finally{
                      if(claimed){
                          boolean rel=c.releaseInterface(vendor);
                          line("V10_QUERY_IF4_RELEASE="+rel);
                      }
                      c.close();
                      line("V10_QUERY_SESSION_END=true");
                  }
              }

              private void saveEvidence(){
                  Intent i=new Intent(Intent.ACTION_CREATE_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("text/plain");
                  i.putExtra(Intent.EXTRA_TITLE,"OKN_BP1048P4_V10_GET_DEVICE_DESCRIPTION_EVIDENCE.txt");
                  startActivityForResult(i,SAVE_EVIDENCE);
              }

              @Override protected void onActivityResult(int requestCode,int resultCode,Intent data){
                  super.onActivityResult(requestCode,resultCode,data);
                  if(requestCode==SAVE_EVIDENCE && resultCode==RESULT_OK && data!=null){
                      try(OutputStream os=getContentResolver().openOutputStream(data.getData())){
                          String footer=
                              "\nEXPORT_EXACT_RUNTIME_FINGERPRINT_OK="+exactFingerprintOk+
                              "\nEXPORT_QUERY_ATTEMPTED="+queryAttempted+
                              "\nEXPORT_RESPONSE_SEEN="+responseSeen+
                              "\nEXPORT_NONZERO_REPORT_COUNT="+nonZeroResponseCount+
                              "\nEXPORT_HOST_TO_DEVICE_SCOPE=ONE_VENDOR_GET_DEVICE_DESCRIPTION_ONLY"+
                              "\nEXPORT_FEATURE_REPORT_USED=false"+
                              "\nEXPORT_FLASH_WRITE_ERASE_RECOVERY=false"+
                              "\nEXPORT_FLASH_ALLOWED=NO\n";
                          os.write((evidence.toString()+footer).getBytes(StandardCharsets.UTF_8));
                          line("EVIDENCE_EXPORT_OK=true");
                      }catch(Exception ex){
                          line("EVIDENCE_EXPORT_ERROR="+ex);
                      }
                  }
              }

              private static String hex(byte[] b){
                  StringBuilder s=new StringBuilder(b.length*2);
                  for(byte x:b)s.append(String.format(Locale.US,"%02X",x&255));
                  return s.toString();
              }

              private static String sha256(byte[] b){
                  try{
                      MessageDigest md=MessageDigest.getInstance("SHA-256");
                      return hex(md.digest(b));
                  }catch(Exception e){
                      return "SHA256_ERROR";
                  }
              }

              @Override protected void onDestroy(){
                  try{unregisterReceiver(permissionRx);}catch(Exception ignored){}
                  try{unregisterReceiver(usbRx);}catch(Exception ignored){}
                  super.onDestroy();
              }
          }
