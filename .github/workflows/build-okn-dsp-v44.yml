name: Build OKN DSP V44 WRITE57 Descriptor Race Fix

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_ANDROID_V44_WRITE57_DESCRIPTOR_RACE_FIX.zip'
      - '.github/workflows/build-okn-dsp-v44.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify V44 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/okn_v44
          mkdir -p /tmp/okn_v44
          unzip -q OKN_DSP_ANDROID_V44_WRITE57_DESCRIPTOR_RACE_FIX.zip -d /tmp/okn_v44

          check_file() {
            if [ ! -f "$1" ]; then
              echo "ERROR: missing file: $1"
              exit 1
            fi
            echo "OK file: $1"
          }

          check_text() {
            local needle="$1"
            local file="$2"
            if ! grep -Fq "$needle" "$file"; then
              echo "ERROR: missing marker '$needle' in $file"
              exit 1
            fi
            echo "OK marker: $needle"
          }

          APP=/tmp/okn_v44/app/src/main/java/com/okn/dsp/EvidenceLabActivity.kt
          GATE=/tmp/okn_v44/app/src/main/java/com/okn/dsp/protocol/WriteGate.kt
          GRADLE=/tmp/okn_v44/app/build.gradle.kts

          check_file "$APP"
          check_file "$GATE"
          check_file /tmp/okn_v44/evidence/OKN_DSP_V44_DESCRIPTOR_VERIFY_PLAN.txt
          check_file /tmp/okn_v44/evidence/OKN_DSP_V44_DESCRIPTOR_VERIFY_PLAN.json
          check_file /tmp/okn_v44/README_V44.txt

          check_text 'versionCode = 44' "$GRADLE"
          check_text '2.6.0-v44-write57-descriptor-racefix' "$GRADLE"
          check_text 'V44_BASELINE_DESCRIPTOR' "$APP"
          check_text 'V44_WRITE_TARGET_PLAIN' "$APP"
          check_text 'V44_TARGET_DESC_HEADER_RECOVERED_FROM_STAGE3' "$APP"
          check_text 'V44_RESTORE_DESC_HEADER_RECOVERED_FROM_STAGE5' "$APP"
          check_text 'V44_FAILSAFE_WINDOW_MS=15000' "$APP"
          check_text 'V44_TARGET_REFRESH_FAILSAFE_REARM_MS=12000' "$APP"
          check_text 'writeProofStage = nextStage' "$APP"
          check_text 'V44_TARGET_DESCRIPTOR_VERIFY' "$APP"
          check_text 'V44_RESTORE_DESCRIPTOR_VERIFY' "$APP"
          check_text 'V44_CONTROLLED_WRITE_PROOF_COMPLETE' "$APP"
          check_text 'controlledMasterVolumeProofEnabled: Boolean = true' "$GATE"
          check_text 'const val enabled: Boolean = false' "$GATE"

          echo 'V44 source restored and verifier race/timing safety fix verified'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/okn_v44
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and package artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn_v44/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          mkdir -p artifact
          cp "$APK" artifact/OKN_DSP_V44_WRITE57_DESCRIPTOR_RACE_FIX-debug.apk
          cp /tmp/okn_v44/evidence/OKN_DSP_V44_DESCRIPTOR_VERIFY_PLAN.txt artifact/
          cp /tmp/okn_v44/evidence/OKN_DSP_V44_DESCRIPTOR_VERIFY_PLAN.json artifact/
          cp /tmp/okn_v44/README_V44.txt artifact/
          sha256sum artifact/OKN_DSP_V44_WRITE57_DESCRIPTOR_RACE_FIX-debug.apk > artifact/OKN_DSP_V44_WRITE57_DESCRIPTOR_RACE_FIX-debug.sha256
          ls -lh artifact

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-V44-WRITE57-DESCRIPTOR-RACE-FIX-debug-apk
          path: artifact/
          if-no-files-found: error
          retention-days: 30
