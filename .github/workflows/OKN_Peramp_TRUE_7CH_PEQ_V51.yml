      - name: Verify frozen real-board BLE and DSP core
        shell: bash
        run: |
          set -euo pipefail
          echo "8b1e30b525d5a2aad85a836ad43a20ed9416d121afb9bafef7e02b224380b45f  app/src/main/java/com/okn/dsp/DspProtocol.java" | sha256sum -c -
          echo "15cfc4bd64723e7508694d19ab271f173b91fc78acd5118ddcbbfae90e50bff9  app/src/main/java/com/okn/dsp/BleManager.java" | sha256sum -c -

      - name: Validate TRUE 7CH Parametric EQ gates
        shell: bash
        run: |
          set -euo pipefail
          python3 Sources/validate_v38_gate.py
          python3 Sources/validate_v51_true_peq_ui.py
          grep -q "versionCode 1051" app/build.gradle
          grep -q "versionName '50.1.0'" app/build.gradle

      - name: Build debug and release APKs
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle :app:assembleDebug :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk OKN-Peramp-TRUE-7CH-PEQ-V51-debug.apk
          cp app/build/outputs/apk/release/app-release.apk OKN-Peramp-TRUE-7CH-PEQ-V51-release.apk
          test -s OKN-Peramp-TRUE-7CH-PEQ-V51-debug.apk
          test -s OKN-Peramp-TRUE-7CH-PEQ-V51-release.apk
          unzip -t OKN-Peramp-TRUE-7CH-PEQ-V51-debug.apk >/dev/null
          unzip -t OKN-Peramp-TRUE-7CH-PEQ-V51-release.apk >/dev/null
          aapt dump badging OKN-Peramp-TRUE-7CH-PEQ-V51-debug.apk | head -8
          sha256sum OKN-Peramp-TRUE-7CH-PEQ-V51-debug.apk OKN-Peramp-TRUE-7CH-PEQ-V51-release.apk > OKN-Peramp-TRUE-7CH-PEQ-V51-SHA256.txt

      - name: Package generated source
        shell: bash
        run: |
          set -euo pipefail
          zip -r OKN-Peramp-TRUE-7CH-PEQ-V51-source.zip app Sources build.gradle settings.gradle gradle.properties -x "*/build/*"
          unzip -t OKN-Peramp-TRUE-7CH-PEQ-V51-source.zip >/dev/null

      - name: Upload APK source and hashes
        uses: actions/upload-artifact@v6
        with:
          name: OKN-Peramp-TRUE-7CH-Parametric-EQ-V51
          path: |
            OKN-Peramp-TRUE-7CH-PEQ-V51-debug.apk
            OKN-Peramp-TRUE-7CH-PEQ-V51-release.apk
            OKN-Peramp-TRUE-7CH-PEQ-V51-source.zip
            OKN-Peramp-TRUE-7CH-PEQ-V51-SHA256.txt
          if-no-files-found: error
          retention-days: 30
