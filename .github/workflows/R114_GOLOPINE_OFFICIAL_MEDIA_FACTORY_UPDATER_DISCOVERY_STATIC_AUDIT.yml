name: R114 GoloPine official media factory-updater discovery static audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R114_GOLOPINE_OFFICIAL_MEDIA_FACTORY_UPDATER_DISCOVERY_STATIC_AUDIT.yml"

permissions:
  contents: read

concurrency:
  group: r114-golopine-media-discovery-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE: "https://golodsp.com"
  PRODUCT_PAGE: "https://golodsp.com/7%E9%80%9A%E9%81%93%E9%9F%B3%E9%A2%91%E5%89%8D%E7%BA%A7/"
  FLASH_ALLOWED: "NO"

jobs:
  discover:
    name: STATIC PUBLIC-SITE DISCOVERY ONLY - no execution - no USB - no board
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r114/raw /tmp/r114/candidates /tmp/r114/evidence
          cat > /tmp/r114/evidence/R114_SAFETY.txt <<'EOF'
          R114_MODE=PUBLIC_SITE_STATIC_DISCOVERY_ONLY
          R114_VENDOR_BINARY_EXECUTED=NO
          R114_INSTALLER_EXECUTED=NO
          R114_APK_EXECUTED=NO
          R114_NATIVE_LIBRARY_EXECUTED=NO
          R114_USB_DEVICE_ACCESS=NO
          R114_BOARD_CONTACT=NO
          R114_BLE_CONNECTION=NO
          R114_AA55_SENT=NO
          R114_RUNTIME_0X11_SENT=NO
          R114_FLASH_READ_EXECUTED=NO
          R114_FLASH_ERASE_EXECUTED=NO
          R114_FLASH_WRITE_EXECUTED=NO
          R114_ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD=NO
          FINAL_REQUIRED_TRANSPORT=SAMSUNG_S25_PLUS_USB_C_DIRECT_TO_DSP_USB_C
          HARDWARE_MODIFICATION=FORBIDDEN
          FLASH_ALLOWED=NO
          EOF

      - name: Install static tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            file unzip p7zip-full binutils jq python3-pip >/dev/null
          python3 -m pip install --disable-pip-version-check --no-input pefile >/dev/null

      - name: Fetch official product page and WordPress discovery endpoints
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --location --retry 4 --retry-all-errors \
            "$PRODUCT_PAGE" -o /tmp/r114/raw/product_page.html

          curl --location --retry 3 --retry-all-errors \
            "$SITE/wp-sitemap.xml" -o /tmp/r114/raw/wp-sitemap.xml || true

          curl --location --retry 3 --retry-all-errors \
            "$SITE/wp-json/wp/v2/media?per_page=100&page=1" \
            -D /tmp/r114/raw/media_page1_headers.txt \
            -o /tmp/r114/raw/media_page1.json || true

          curl --location --retry 3 --retry-all-errors \
            "$SITE/wp-json/wp/v2/pages?per_page=100&page=1&_fields=id,link,slug,title,content" \
            -D /tmp/r114/raw/pages_page1_headers.txt \
            -o /tmp/r114/raw/pages_page1.json || true

          {
            echo "SITE=$SITE"
            echo "PRODUCT_PAGE=$PRODUCT_PAGE"
            echo "PRODUCT_PAGE_SHA256=$(sha256sum /tmp/r114/raw/product_page.html | awk '{print $1}')"
            echo "SITEMAP_BYTES=$(stat -c '%s' /tmp/r114/raw/wp-sitemap.xml 2>/dev/null || echo 0)"
            echo "MEDIA_PAGE1_BYTES=$(stat -c '%s' /tmp/r114/raw/media_page1.json 2>/dev/null || echo 0)"
            echo "PAGES_PAGE1_BYTES=$(stat -c '%s' /tmp/r114/raw/pages_page1.json 2>/dev/null || echo 0)"
          } > /tmp/r114/evidence/R114_ENDPOINT_STATUS.txt

      - name: Enumerate WordPress media pages if REST API is available
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re,subprocess,os

          raw=Path("/tmp/r114/raw")
          first=raw/"media_page1.json"

          def load_json(p):
              try:
                  return json.loads(p.read_text(errors="replace"))
              except Exception:
                  return None

          obj=load_json(first)
          media=[]
          rest_ok=isinstance(obj,list)

          if rest_ok:
              media.extend(obj)
              # Try up to 20 pages. Stop on empty/invalid page.
              for page in range(2,21):
                  out=raw/f"media_page{page}.json"
                  url=f"https://golodsp.com/wp-json/wp/v2/media?per_page=100&page={page}"
                  cp=subprocess.run(
                      ["curl","--silent","--show-error","--location","--retry","3",
                       "--retry-all-errors",url,"-o",str(out)],
                      check=False
                  )
                  if cp.returncode!=0:
                      break
                  x=load_json(out)
                  if not isinstance(x,list) or not x:
                      break
                  media.extend(x)

          rows=[]
          for m in media:
              rows.append({
                  "id":m.get("id"),
                  "date":m.get("date"),
                  "slug":m.get("slug"),
                  "type":m.get("type"),
                  "mime_type":m.get("mime_type"),
                  "link":m.get("link"),
                  "source_url":m.get("source_url"),
                  "title":(m.get("title") or {}).get("rendered"),
                  "caption":(m.get("caption") or {}).get("rendered"),
                  "description":(m.get("description") or {}).get("rendered"),
              })

          Path("/tmp/r114/evidence/R114_MEDIA_INDEX.json").write_text(
              json.dumps({
                  "rest_api_available":rest_ok,
                  "media_count":len(rows),
                  "items":rows
              },indent=2,ensure_ascii=False)+"\n"
          )
          PY

      - name: Extract all official download URLs from pages and sitemaps
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,json,html
          from urllib.parse import urljoin,urlparse

          raw=Path("/tmp/r114/raw")
          texts=[]
          for p in raw.glob("*"):
              if p.is_file():
                  try:
                      texts.append((p.name,p.read_text(errors="replace")))
                  except Exception:
                      pass

          urls=[]
          pat=re.compile(r'https?://[^\s"\'<>]+',re.I)
          href=re.compile(r'(?:href|src)=["\']([^"\']+)["\']',re.I)

          for src,t in texts:
              for u in pat.findall(t):
                  urls.append((src,html.unescape(u)))
              for u in href.findall(t):
                  urls.append((src,urljoin("https://golodsp.com/",html.unescape(u))))

          # Include source_url from WP media JSON.
          idx=Path("/tmp/r114/evidence/R114_MEDIA_INDEX.json")
          if idx.exists():
              try:
                  obj=json.loads(idx.read_text())
                  for m in obj.get("items",[]):
                      u=m.get("source_url")
                      if u: urls.append(("wp-media",u))
              except Exception:
                  pass

          cleaned=[]
          seen=set()
          for src,u in urls:
              u=u.rstrip(").,;'\"")
              try:
                  host=urlparse(u).netloc.lower()
              except Exception:
                  continue
              if host not in ("golodsp.com","www.golodsp.com"):
                  continue
              if u in seen: continue
              seen.add(u)
              cleaned.append({"source":src,"url":u})

          Path("/tmp/r114/evidence/R114_OFFICIAL_URLS.json").write_text(
              json.dumps(cleaned,indent=2,ensure_ascii=False)+"\n"
          )
          PY

      - name: Rank factory updater firmware recovery candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          from urllib.parse import urlparse,unquote

          ev=Path("/tmp/r114/evidence")
          urls=json.loads((ev/"R114_OFFICIAL_URLS.json").read_text())
          media=json.loads((ev/"R114_MEDIA_INDEX.json").read_text())

          strong=[
              ("bp1048",12),("bp10",8),("firmware",12),("bootloader",12),
              ("recovery",12),("upgrade",8),("updater",10),("update",5),
              ("factory",10),("flash",10),("burner",10),("mvassistant",12),
              ("mvsilicon",10),("programmer",10),("download",2),
              ("ota",6),("dfu",8),("mva",8)
          ]
          ext_score={
              ".zip":4,".rar":4,".7z":4,".exe":3,".apk":2,
              ".bin":10,".hex":10,".img":10,".mva":12,".fw":12,".dfu":12
          }

          # Known tuning clients should not dominate.
          known_tuning=[
              "dsttech_audiodsp_client",
              "golopine_audio_turning",
              "golopine-tuning",
              "android-app",
          ]

          candidates=[]
          for r in urls:
              u=r["url"]
              decoded=unquote(u).lower()
              score=0; reasons=[]
              for term,w in strong:
                  if term in decoded:
                      score+=w; reasons.append(term)
              for ext,w in ext_score.items():
                  if urlparse(decoded).path.endswith(ext):
                      score+=w; reasons.append(ext)
              if any(x in decoded for x in known_tuning):
                  score-=8; reasons.append("known_tuning_penalty")
              if score>0:
                  candidates.append({
                      "url":u,"source":r["source"],"score":score,"reasons":reasons
                  })

          # Add WordPress title/caption/description context to existing/source URLs.
          byurl={x["url"]:x for x in candidates}
          for m in media.get("items",[]):
              u=m.get("source_url")
              if not u: continue
              ctx=" ".join(str(m.get(k) or "") for k in ("slug","title","caption","description","mime_type")).lower()
              bonus=0; rs=[]
              for term,w in strong:
                  if term in ctx:
                      bonus+=w; rs.append("meta:"+term)
              if bonus:
                  if u not in byurl:
                      byurl[u]={"url":u,"source":"wp-media-meta","score":0,"reasons":[]}
                  byurl[u]["score"]+=bonus
                  byurl[u]["reasons"]+=rs

          candidates=sorted(byurl.values(),key=lambda x:(-x["score"],x["url"]))
          Path("/tmp/r114/evidence/R114_CANDIDATE_RANKING.json").write_text(
              json.dumps(candidates,indent=2,ensure_ascii=False)+"\n"
          )
          PY

      - name: Download top suspicious official packages as inert data only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess,hashlib,os,re
          from urllib.parse import urlparse,unquote

          ev=Path("/tmp/r114/evidence")
          cands=json.loads((ev/"R114_CANDIDATE_RANKING.json").read_text())
          outdir=Path("/tmp/r114/candidates")
          outdir.mkdir(exist_ok=True)

          # Strictly public static acquisition from official host only.
          chosen=[]
          for c in cands:
              if len(chosen)>=20: break
              u=c["url"]
              path=urlparse(u).path.lower()
              if not any(path.endswith(x) for x in (
                  ".zip",".rar",".7z",".exe",".apk",".bin",".hex",".img",".mva",".fw",".dfu"
              )):
                  continue
              # Avoid re-downloading known tuning clients unless score is very high.
              if c["score"]<8: continue

              name=Path(unquote(urlparse(u).path)).name or f"candidate_{len(chosen)}"
              safe=re.sub(r"[^A-Za-z0-9._-]+","_",name)
              dest=outdir/f"{len(chosen):02d}_{safe}"

              cp=subprocess.run([
                  "curl","--fail","--location","--retry","3","--retry-all-errors",
                  "--max-filesize","209715200",u,"-o",str(dest)
              ],check=False)
              if cp.returncode!=0 or not dest.exists() or dest.stat().st_size==0:
                  try: dest.unlink()
                  except Exception: pass
                  continue

              chosen.append({
                  **c,
                  "local_name":dest.name,
                  "size":dest.stat().st_size,
                  "sha256":hashlib.sha256(dest.read_bytes()).hexdigest()
              })

          Path("/tmp/r114/evidence/R114_DOWNLOADED_CANDIDATES.json").write_text(
              json.dumps(chosen,indent=2,ensure_ascii=False)+"\n"
          )
          PY

      - name: Static inspect downloaded candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re,hashlib,subprocess,zipfile,math

          root=Path("/tmp/r114/candidates")
          rows=[]
          terms=re.compile(
              r"BP1048|BP10|MVAssistant|MVSilicon|firmware|bootloader|recovery|"
              r"chiperas|codedata|bootdat|constdat|cnfgdat|btupdat|upinfo|"
              r"VID_|PID_|6324|1719|0633|5322|0288|7966|flash|erase|"
              r"programmer|CRC|checksum|signature|MVB1X|01PKG|02PKG|03PKG|04PKG|05PKG",
              re.I
          )

          for p in sorted(root.glob("*")):
              if not p.is_file(): continue
              b=p.read_bytes()
              try:
                  typ=subprocess.check_output(["file","-b",str(p)],text=True).strip()
              except Exception:
                  typ=""
              strings=[x.decode("latin1","replace") for x in re.findall(rb"[\x20-\x7e]{5,}",b)]
              hits=[s[:500] for s in strings if terms.search(s)][:500]

              zip_entries=[]
              try:
                  with zipfile.ZipFile(p) as z:
                      for zi in z.infolist()[:3000]:
                          if terms.search(zi.filename):
                              zip_entries.append({
                                  "name":zi.filename,
                                  "size":zi.file_size,
                                  "compressed":zi.compress_size
                              })
              except Exception:
                  pass

              rows.append({
                  "file":p.name,
                  "size":len(b),
                  "sha256":hashlib.sha256(b).hexdigest(),
                  "file_type":typ,
                  "string_hits":hits,
                  "interesting_archive_entries":zip_entries[:500],
              })

          Path("/tmp/r114/evidence/R114_STATIC_CANDIDATE_INSPECTION.json").write_text(
              json.dumps(rows,indent=2,ensure_ascii=False)+"\n"
          )
          PY

      - name: Build fail-closed discovery decision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          ev=Path("/tmp/r114/evidence")
          media=json.loads((ev/"R114_MEDIA_INDEX.json").read_text())
          rank=json.loads((ev/"R114_CANDIDATE_RANKING.json").read_text())
          dl=json.loads((ev/"R114_DOWNLOADED_CANDIDATES.json").read_text())
          inspect=json.loads((ev/"R114_STATIC_CANDIDATE_INSPECTION.json").read_text())

          d={
              "OFFICIAL_SITE":"https://golodsp.com",
              "WORDPRESS_MEDIA_API_AVAILABLE":media["rest_api_available"],
              "WORDPRESS_MEDIA_COUNT":media["media_count"],
              "RANKED_CANDIDATE_COUNT":len(rank),
              "DOWNLOADED_STATIC_CANDIDATE_COUNT":len(dl),
              "TOP_RANKED_CANDIDATES":rank[:30],
              "DOWNLOADED_CANDIDATES":dl,
              "STATIC_INSPECTION_SUMMARY":[{
                  "file":x["file"],
                  "size":x["size"],
                  "sha256":x["sha256"],
                  "file_type":x["file_type"],
                  "string_hit_count":len(x["string_hits"]),
                  "interesting_archive_entry_count":len(x["interesting_archive_entries"])
              } for x in inspect],
              "PRODUCTION_FIRST_BOOTSTRAP_PROVEN":False,
              "PRODUCTION_RECOVERY_USB_IDENTITY_PROVEN":False,
              "SAFE_READ_ONLY_STOCK_BACKUP_PROVEN":False,
              "IMAGE_LAYOUT_ACCEPTANCE_PROVEN":False,
              "ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD":False,
              "NEXT":"Deep-static reverse only genuinely production-specific factory/updater/image candidates found here. If none exist, official public tuning/download surface is exhausted and a production updater/image must come from another vendor channel or an observed official update workflow.",
              "FLASH_ALLOWED":False
          }

          (ev/"R114_DECISION.json").write_text(json.dumps(d,indent=2,ensure_ascii=False)+"\n")
          report=[
              "# R114 GoloPine official media factory/updater discovery",
              "",
              "Public official-site discovery and static inspection only. No downloaded binary is executed and no hardware is contacted.",
              "",
              "```json",
              json.dumps(d,indent=2,ensure_ascii=False),
              "```",
              "",
              "FLASH_ALLOWED=NO"
          ]
          (ev/"R114_REPORT.md").write_text("\n".join(report)+"\n")
          print(json.dumps(d,indent=2,ensure_ascii=False))
          PY

      - name: Package evidence only
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r114/evidence
          zip -9 -r /tmp/R114_GOLOPINE_OFFICIAL_MEDIA_DISCOVERY_EVIDENCE.zip .
          sha256sum /tmp/R114_GOLOPINE_OFFICIAL_MEDIA_DISCOVERY_EVIDENCE.zip \
            > /tmp/R114_GOLOPINE_OFFICIAL_MEDIA_DISCOVERY_EVIDENCE.zip.sha256

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: R114-GOLOPINE-OFFICIAL-MEDIA-DISCOVERY-EVIDENCE
          path: |
            /tmp/R114_GOLOPINE_OFFICIAL_MEDIA_DISCOVERY_EVIDENCE.zip
            /tmp/R114_GOLOPINE_OFFICIAL_MEDIA_DISCOVERY_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'R114_VENDOR_BINARY_EXECUTED=NO' /tmp/r114/evidence/R114_SAFETY.txt
          grep -F 'R114_USB_DEVICE_ACCESS=NO' /tmp/r114/evidence/R114_SAFETY.txt
          grep -F 'R114_ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD=NO' /tmp/r114/evidence/R114_SAFETY.txt
          grep -F '"FLASH_ALLOWED": false' /tmp/r114/evidence/R114_DECISION.json
          cat /tmp/r114/evidence/R114_DECISION.json
          echo R114_PUBLIC_DISCOVERY_COMPLETE=YES
          echo FLASH_ALLOWED=NO
