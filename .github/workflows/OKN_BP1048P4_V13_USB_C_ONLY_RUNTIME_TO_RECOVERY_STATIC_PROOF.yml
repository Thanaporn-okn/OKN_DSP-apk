name: OKN BP1048P4 V13 USB-C ONLY RUNTIME TO RECOVERY STATIC PROOF

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/OKN_BP1048P4_V13_USB_C_ONLY_RUNTIME_TO_RECOVERY_STATIC_PROOF.yml'

permissions:
  contents: read

env:
  SDK_REPO: "https://github.com/leadercxn/bp1048_sdk_v0.1.12.git"
  SDK_COMMIT: "8105bd864b04995d81c9f9ae77cb158259f39015"

  PHONE_PATH_REQUIRED: "Samsung Galaxy S25+ -> USB-C cable -> DSP USB-C only"

  SOLDER_ALLOWED: "NO"
  BOARD_MOD_ALLOWED: "NO"
  JTAG_ALLOWED: "NO"
  SDP_ALLOWED: "NO"
  AICE_ALLOWED: "NO"
  HARDWARE_PROBE_ALLOWED: "NO"
  USB_COMMAND_ALLOWED: "NO"
  FLASH_READ_ALLOWED: "NO"
  FLASH_WRITE_ALLOWED: "NO"
  FLASH_ERASE_ALLOWED: "NO"

jobs:
  static_proof:
    name: V13 find USB-only runtime-to-recovery entry path
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Enforce USB-C-only project constraints
        shell: bash
        run: |
          set -euo pipefail
          test "$SOLDER_ALLOWED" = "NO"
          test "$BOARD_MOD_ALLOWED" = "NO"
          test "$JTAG_ALLOWED" = "NO"
          test "$SDP_ALLOWED" = "NO"
          test "$AICE_ALLOWED" = "NO"
          test "$HARDWARE_PROBE_ALLOWED" = "NO"
          test "$USB_COMMAND_ALLOWED" = "NO"
          test "$FLASH_READ_ALLOWED" = "NO"
          test "$FLASH_WRITE_ALLOWED" = "NO"
          test "$FLASH_ERASE_ALLOWED" = "NO"

          rm -rf /tmp/v13
          mkdir -p /tmp/v13/evidence /tmp/v13/bin

          cat > /tmp/v13/evidence/PROJECT_CONSTRAINTS.txt <<'EOF'
          REQUIRED_PHYSICAL_PATH=Samsung Galaxy S25+ -> USB-C cable -> DSP USB-C port only
          SOLDER_ALLOWED=NO
          BOARD_MODIFICATION_ALLOWED=NO
          DEBUG_PIN_CONNECTION_ALLOWED=NO
          JTAG_ALLOWED=NO
          SDP_ALLOWED=NO
          AICE_ALLOWED=NO
          HARDWARE_PROBE_ALLOWED=NO
          USB_COMMAND_SENT=NO
          TARGET_CONNECTED=NO
          FLASH_READ_EXECUTED=NO
          FLASH_WRITE_EXECUTED=NO
          FLASH_ERASE_EXECUTED=NO
          RUNTIME_DESTRUCTIVE_OPCODE_0x11_EXECUTED=NO
          EOF

      - name: Fetch exact pinned SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone -q "$SDK_REPO" /tmp/v13/sdk
          git -C /tmp/v13/sdk checkout -q "$SDK_COMMIT"
          test "$(git -C /tmp/v13/sdk rev-parse HEAD)" = "$SDK_COMMIT"
          git -C /tmp/v13/sdk rev-parse HEAD > /tmp/v13/evidence/SDK_COMMIT.txt

      - name: Inventory USB runtime recovery and reset evidence
        shell: bash
        run: |
          set -euo pipefail
          S=/tmp/v13/sdk
          E=/tmp/v13/evidence

          cd "$S"

          {
            echo '=== HID / USB receive / report callbacks ==='
            git grep -n -I -E \
              'HIDUsb_Rx|HIDUsb_Tx|hid_send_data|UsbLoadAudioMode|HID|SET_REPORT|GET_REPORT|SetReport|GetReport|Feature|report.?id|CFG_COMMUNICATION_BY_USB|UsbInterrupt|USB.*Callback|USB.*Rx|USB.*Recv' \
              -- BT_Audio_APP MVsB1_Base_SDK || true

            echo
            echo '=== Runtime parser / reset controls ==='
            git grep -n -I -E \
              'Communication_Effect|sys_reset|system_reset|Reset_McuSystem|Reset_FlagGet|Reset_FlagClear|watchdog|WDG_|reboot|Reboot' \
              -- BT_Audio_APP MVsB1_Base_SDK || true

            echo
            echo '=== Upgrade / recovery / loader terms ==='
            git grep -n -I -E \
              'DualBank|ObexUpgrade|ObexUpdate|upgrade|Upgrade|update.mode|bootloader|Bootloader|FlashBoot|recovery|Recovery|ISP|download.mode|DownloadMode|boot.flag|boot_flag|update.flag|update_flag|boot.mode|boot_mode' \
              -- BT_Audio_APP MVsB1_Base_SDK || true

            echo
            echo '=== Backup / persistent reset-state terms ==='
            git grep -n -I -E \
              'BACKUP_|backup register|backup_reg|retention|Reset_Flag|reset.flag|reset_flag|POR|Power On Reset|CPU Debug Reset|System Reset' \
              -- BT_Audio_APP MVsB1_Base_SDK || true

            echo
            echo '=== USB VID/PID literal and byte-order candidates ==='
            git grep -n -I -E \
              '0x6324|0X6324|0x1719|0X1719|0x2244|0X2244|6324|1719|2244|0x24[ ,]+0x63|0x19[ ,]+0x17|0x44[ ,]+0x22' \
              -- BT_Audio_APP MVsB1_Base_SDK || true
          } > "$E/STATIC_SOURCE_HITS.txt"

          # Dedicated files for the most important questions.
          git grep -n -I -E 'sys_reset|system_reset' -- BT_Audio_APP MVsB1_Base_SDK \
            > "$E/SYS_RESET_XREFS.txt" || true

          git grep -n -I -E 'Reset_McuSystem|Reset_FlagGet|Reset_FlagClear' -- BT_Audio_APP MVsB1_Base_SDK \
            > "$E/RESET_API_XREFS.txt" || true

          git grep -n -I -E \
            'HIDUsb_Rx|UsbLoadAudioMode|CFG_COMMUNICATION_BY_USB|SET_REPORT|GET_REPORT|Feature|report.?id' \
            -- BT_Audio_APP MVsB1_Base_SDK \
            > "$E/USB_HID_XREFS.txt" || true

          git grep -n -I -E \
            'DualBank|ObexUpgrade|ObexUpdate|bootloader|FlashBoot|recovery|ISP|download.mode|boot.flag|boot_flag|update.flag|update_flag' \
            -- BT_Audio_APP MVsB1_Base_SDK \
            > "$E/UPGRADE_RECOVERY_XREFS.txt" || true

      - name: Extract source context around high-signal matches
        shell: bash
        run: |
          set -euo pipefail
          S=/tmp/v13/sdk
          E=/tmp/v13/evidence

          python3 - <<'PY'
          from pathlib import Path
          import re, json

          S=Path('/tmp/v13/sdk')
          E=Path('/tmp/v13/evidence')

          patterns=[
              r'\bHIDUsb_Rx\b',
              r'\bUsbLoadAudioMode\b',
              r'\bCommunication_Effect_Process\b',
              r'\bCommunication_Effect_Config\b',
              r'\bsys_reset\b',
              r'\bReset_McuSystem\b',
              r'\bReset_FlagGet\b',
              r'\bReset_FlagClear\b',
              r'\bDualBankUpdateReboot\b',
              r'\bObexUpgradeStart\b',
              r'\bObexUpgradeEnd\b',
              r'\bObexUpdateProc\b',
              r'\bBACKUP_[A-Za-z0-9_]+\b',
              r'(?i)\b(?:bootloader|flashboot|recovery|download.?mode|boot.?flag|update.?flag)\b',
              r'(?i)\b(?:set_report|get_report|feature report)\b',
          ]

          exts={'.c','.h','.cpp','.cc','.s','.S','.asm','.inc','.cfg','.prefs','.launch','.txt','.map','.lst'}
          hits=[]
          for p in S.rglob('*'):
              if not p.is_file() or p.suffix not in exts:
                  continue
              try:
                  txt=p.read_text(errors='replace')
              except Exception:
                  continue
              lines=txt.splitlines()
              for i,line in enumerate(lines):
                  for pat in patterns:
                      if re.search(pat,line):
                          lo=max(0,i-12)
                          hi=min(len(lines),i+13)
                          hits.append({
                              'path':str(p.relative_to(S)),
                              'line':i+1,
                              'pattern':pat,
                              'context':'\n'.join(
                                  f'{n+1:6d}: {lines[n]}' for n in range(lo,hi)
                              )
                          })
                          break

          # Deduplicate by file+line.
          uniq=[]
          seen=set()
          for h in hits:
              k=(h['path'],h['line'])
              if k not in seen:
                  seen.add(k); uniq.append(h)

          (E/'SOURCE_CONTEXT.json').write_text(
              json.dumps(uniq[:2000],indent=2,ensure_ascii=False)+'\n'
          )

          with (E/'SOURCE_CONTEXT.txt').open('w') as f:
              for h in uniq[:2000]:
                  f.write(f"\n===== {h['path']}:{h['line']} =====\n")
                  f.write(h['context'])
                  f.write('\n')
          PY

      - name: Inspect tracked prebuilt binaries and libraries statically
        shell: bash
        run: |
          set -euo pipefail
          S=/tmp/v13/sdk
          E=/tmp/v13/evidence
          B=/tmp/v13/bin

          find "$S" -type f \( \
              -iname '*.elf' -o -iname '*.axf' -o -iname '*.out' -o \
              -iname '*.bin' -o -iname '*.a' -o -iname '*.o' -o \
              -iname '*.lib' -o -iname '*.exe' \
            \) -print | sort > "$E/BINARY_INVENTORY.txt"

          python3 - <<'PY'
          from pathlib import Path
          import shutil, os, hashlib, json

          S=Path('/tmp/v13/sdk')
          B=Path('/tmp/v13/bin')
          E=Path('/tmp/v13/evidence')
          rows=[]
          for line in (E/'BINARY_INVENTORY.txt').read_text(errors='replace').splitlines():
              p=Path(line)
              if not p.exists(): continue
              size=p.stat().st_size
              # Cap copies to 20 MB/file to avoid pathological artifacts.
              if size > 20*1024*1024:
                  rows.append({'path':str(p.relative_to(S)),'size':size,'copied':False})
                  continue
              dst=B/f'{len(rows):04d}_{p.name}'
              shutil.copy2(p,dst)
              rows.append({
                  'path':str(p.relative_to(S)),
                  'size':size,
                  'copied':True,
                  'copy':str(dst),
                  'sha256':hashlib.sha256(dst.read_bytes()).hexdigest()
              })
          (E/'BINARY_INVENTORY.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY

          : > "$E/BINARY_STRINGS_HITS.txt"
          : > "$E/BINARY_SYMBOL_HITS.txt"

          find "$B" -type f -print0 | while IFS= read -r -d '' f; do
            echo "===== $f =====" >> "$E/BINARY_STRINGS_HITS.txt"
            strings -a -n 4 "$f" 2>/dev/null | \
              grep -iE \
              'HIDUsb|UsbLoad|Communication_Effect|sys_reset|Reset_McuSystem|DualBank|ObexUpgrade|bootloader|FlashBoot|recovery|chiperas|bootdat|codedata|constdat|cnfgdat|btupdat|upinfo|SET_REPORT|GET_REPORT|6324|1719|2244' \
              >> "$E/BINARY_STRINGS_HITS.txt" || true

            echo "===== $f =====" >> "$E/BINARY_SYMBOL_HITS.txt"
            nm -A "$f" 2>/dev/null | \
              grep -iE \
              'HIDUsb|UsbLoad|Communication_Effect|sys_reset|Reset_McuSystem|DualBank|ObexUpgrade|boot|upgrade|recovery|reset' \
              >> "$E/BINARY_SYMBOL_HITS.txt" || true
          done

      - name: Prove runtime system-reset control semantics
        shell: bash
        run: |
          set -euo pipefail
          S=/tmp/v13/sdk
          E=/tmp/v13/evidence

          python3 - <<'PY'
          from pathlib import Path
          import re,json

          S=Path('/tmp/v13/sdk')
          E=Path('/tmp/v13/evidence')
          comm=S/'BT_Audio_APP/bt_audio_app_src/audio/communication.c'
          txt=comm.read_text(errors='replace')

          # The runtime control parser demonstrably exposes system reset as
          # control 0x01 / sub-index 1. This is only a configuration variable
          # until a consumer that causes MCU reset is independently proven.
          control01_system_reset=bool(re.search(
              r'case\s+1\s*:\s*////?system reset.*?gCtrlVars\.sys_reset\s*=\s*TmpData',
              txt,re.I|re.S
          ))

          # Search all text sources for reads/usages, excluding the assignment
          # line in communication.c as much as possible.
          use_rows=[]
          call_rows=[]
          for p in S.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {
                  '.c','.h','.cpp','.cc','.s','.asm','.inc','.txt','.map','.lst'
              }:
                  continue
              try: t=p.read_text(errors='replace')
              except Exception: continue
              for no,line in enumerate(t.splitlines(),1):
                  if 'sys_reset' in line:
                      use_rows.append({'path':str(p.relative_to(S)),'line':no,'text':line.strip()})
                  if 'Reset_McuSystem' in line:
                      call_rows.append({'path':str(p.relative_to(S)),'line':no,'text':line.strip()})

          non_assignment_sys_reset=[
              r for r in use_rows
              if not (
                  r['path'].endswith('audio/communication.c')
                  and 'gCtrlVars.sys_reset' in r['text']
                  and '=' in r['text']
              )
          ]

          actual_reset_calls=[
              r for r in call_rows
              if re.search(r'\bReset_McuSystem\s*\(',r['text'])
              and not re.search(r'^\s*(?:void|extern)\s+Reset_McuSystem',r['text'])
          ]

          result={
              'runtime_control_0x01_subindex_1_sets_sys_reset':control01_system_reset,
              'sys_reset_all_source_rows':use_rows,
              'sys_reset_non_assignment_rows':non_assignment_sys_reset,
              'reset_mcu_system_rows':call_rows,
              'reset_mcu_system_call_candidates':actual_reset_calls,
              'usb_to_actual_mcu_reset_call_chain_proven':False
          }

          # We deliberately do NOT infer reachability merely from both symbols
          # being present. A real consumer/call chain is required.
          (E/'V13_RUNTIME_RESET_ANALYSIS.json').write_text(
              json.dumps(result,indent=2,ensure_ascii=False)+'\n'
          )
          PY

      - name: Classify recovery-entry candidates without executing anything
        shell: bash
        run: |
          set -euo pipefail
          E=/tmp/v13/evidence

          python3 - <<'PY'
          from pathlib import Path
          import json,re

          E=Path('/tmp/v13/evidence')
          src=(E/'STATIC_SOURCE_HITS.txt').read_text(errors='replace')
          ctx=(E/'SOURCE_CONTEXT.txt').read_text(errors='replace')
          bstr=(E/'BINARY_STRINGS_HITS.txt').read_text(errors='replace')
          bsym=(E/'BINARY_SYMBOL_HITS.txt').read_text(errors='replace')
          reset=json.loads((E/'V13_RUNTIME_RESET_ANALYSIS.json').read_text())

          alltxt='\n'.join([src,ctx,bstr,bsym])

          known_recovery_commands=[
              'cxxx','chiperas','bootdat','codedata','constdat','cnfgdat','btupdat','upinfo'
          ]
          recovery_cmd_presence={x:(x.lower() in alltxt.lower()) for x in known_recovery_commands}

          candidate_terms=[]
          for term in [
              'DualBankUpdateReboot','ObexUpgradeStart','ObexUpgradeEnd','ObexUpdateProc',
              'Reset_McuSystem','Reset_FlagGet','Reset_FlagClear',
              'bootloader','FlashBoot','recovery','download mode',
              'boot_flag','boot flag','update_flag','update flag',
              'SET_REPORT','GET_REPORT'
          ]:
              if term.lower() in alltxt.lower():
                  candidate_terms.append(term)

          # Hard requirement for declaring USB-only transition proven:
          # there must be a source/binary evidence chain that ties USB receive or
          # report handling to a reboot/reset plus a recovery-entry condition.
          usb_evidence=bool(re.search(
              r'HIDUsb_Rx|UsbLoadAudioMode|SET_REPORT|GET_REPORT|CFG_COMMUNICATION_BY_USB',
              alltxt,re.I
          ))
          reset_evidence=bool(re.search(r'Reset_McuSystem|sys_reset|reboot',alltxt,re.I))
          recovery_condition_evidence=bool(re.search(
              r'boot.?flag|update.?flag|download.?mode|FlashBoot|recovery',
              alltxt,re.I
          ))

          result={
              'project_transport_requirement':
                  'Samsung Galaxy S25+ -> USB-C -> DSP USB-C only',
              'runtime_vid_pid':'6324:1719',
              'recovery_vid_pid':'0000:2244',
              'usb_handling_evidence_present':usb_evidence,
              'reset_or_reboot_evidence_present':reset_evidence,
              'recovery_condition_evidence_present':recovery_condition_evidence,
              'runtime_control_0x01_subindex_1_sets_sys_reset':
                  reset['runtime_control_0x01_subindex_1_sets_sys_reset'],
              'usb_to_actual_mcu_reset_call_chain_proven':
                  reset['usb_to_actual_mcu_reset_call_chain_proven'],
              'known_recovery_command_strings_seen':recovery_cmd_presence,
              'candidate_terms_seen':candidate_terms,
              'usb_only_runtime_to_recovery_entry_proven':False,
              'why_not_yet_proven':
                  'Presence of USB/reset/upgrade terms is insufficient. A concrete static chain from runtime USB input to reset/reboot and a recovery-selection condition must be demonstrated before any live USB test.',
              'runtime_opcode_0x11_may_be_used_for_entry':False,
              'runtime_opcode_0x11_policy':'FORBIDDEN; known destructive flash RMW path',
              'SOLDER_ALLOWED':False,
              'BOARD_MOD_ALLOWED':False,
              'JTAG_ALLOWED':False,
              'SDP_ALLOWED':False,
              'AICE_ALLOWED':False,
              'USB_COMMAND_ALLOWED':False,
              'FLASH_WRITE_ALLOWED':False
          }

          (E/'V13_RESULT.json').write_text(
              json.dumps(result,indent=2,ensure_ascii=False)+'\n'
          )

          md=[
              '# BP1048P4 V13 — USB-C-only runtime → recovery static proof','',
              '- Required deployment path: **Samsung Galaxy S25+ → USB-C cable → DSP USB-C port only**.',
              '- No soldering, board modification, JTAG, SDP, AICE, debug pins, or external programmer is permitted.',
              f"- Runtime control `0x01`, sub-index `1` sets `gCtrlVars.sys_reset`: **{result['runtime_control_0x01_subindex_1_sets_sys_reset']}**.",
              f"- Concrete USB → MCU reset call chain proven: **{result['usb_to_actual_mcu_reset_call_chain_proven']}**.",
              f"- Recovery-selection condition evidence present: **{result['recovery_condition_evidence_present']}**.",
              f"- USB-only runtime → recovery entry proven: **{result['usb_only_runtime_to_recovery_entry_proven']}**.",
              '- Runtime opcode `0x11` remains forbidden because it is a destructive flash read-modify-write path.',
              '- No USB command or flash operation was executed.'
          ]
          (E/'V13_REPORT.md').write_text('\n'.join(md)+'\n')
          PY

          cat "$E/V13_REPORT.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Final fail-closed assertions
        shell: bash
        run: |
          set -euo pipefail

          test "$SOLDER_ALLOWED" = "NO"
          test "$BOARD_MOD_ALLOWED" = "NO"
          test "$JTAG_ALLOWED" = "NO"
          test "$SDP_ALLOWED" = "NO"
          test "$AICE_ALLOWED" = "NO"
          test "$HARDWARE_PROBE_ALLOWED" = "NO"
          test "$USB_COMMAND_ALLOWED" = "NO"
          test "$FLASH_READ_ALLOWED" = "NO"
          test "$FLASH_WRITE_ALLOWED" = "NO"
          test "$FLASH_ERASE_ALLOWED" = "NO"

          python3 - <<'PY'
          from pathlib import Path
          import json

          E=Path('/tmp/v13/evidence')
          safety=(E/'PROJECT_CONSTRAINTS.txt').read_text()
          for x in [
              'REQUIRED_PHYSICAL_PATH=Samsung Galaxy S25+ -> USB-C cable -> DSP USB-C port only',
              'SOLDER_ALLOWED=NO',
              'BOARD_MODIFICATION_ALLOWED=NO',
              'DEBUG_PIN_CONNECTION_ALLOWED=NO',
              'JTAG_ALLOWED=NO',
              'SDP_ALLOWED=NO',
              'AICE_ALLOWED=NO',
              'HARDWARE_PROBE_ALLOWED=NO',
              'USB_COMMAND_SENT=NO',
              'TARGET_CONNECTED=NO',
              'FLASH_READ_EXECUTED=NO',
              'FLASH_WRITE_EXECUTED=NO',
              'FLASH_ERASE_EXECUTED=NO',
              'RUNTIME_DESTRUCTIVE_OPCODE_0x11_EXECUTED=NO'
          ]:
              assert x in safety, x

          assert (E/'SDK_COMMIT.txt').read_text().strip() == \
              '8105bd864b04995d81c9f9ae77cb158259f39015'

          r=json.loads((E/'V13_RESULT.json').read_text())

          assert r['project_transport_requirement'] == \
              'Samsung Galaxy S25+ -> USB-C -> DSP USB-C only'
          assert r['runtime_opcode_0x11_may_be_used_for_entry'] is False
          assert r['SOLDER_ALLOWED'] is False
          assert r['BOARD_MOD_ALLOWED'] is False
          assert r['JTAG_ALLOWED'] is False
          assert r['SDP_ALLOWED'] is False
          assert r['AICE_ALLOWED'] is False
          assert r['USB_COMMAND_ALLOWED'] is False
          assert r['FLASH_WRITE_ALLOWED'] is False

          print('V13_USB_C_ONLY_RUNTIME_TO_RECOVERY_STATIC_AUDIT_COMPLETE=YES')
          print('REQUIRED_PATH=S25_PLUS_USB_C_TO_DSP_USB_C_ONLY')
          print('SOLDER_ALLOWED=NO')
          print('BOARD_MOD_ALLOWED=NO')
          print('JTAG_ALLOWED=NO')
          print('SDP_ALLOWED=NO')
          print('AICE_ALLOWED=NO')
          print('USB_COMMAND_ALLOWED=NO')
          print('FLASH_WRITE_ALLOWED=NO')
          PY

      - name: Package V13 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v13/evidence
          zip -9 -r /tmp/OKN_BP1048P4_V13_USB_C_ONLY_RUNTIME_TO_RECOVERY_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/OKN_BP1048P4_V13_USB_C_ONLY_RUNTIME_TO_RECOVERY_EVIDENCE.zip \
            > /tmp/OKN_BP1048P4_V13_USB_C_ONLY_RUNTIME_TO_RECOVERY_EVIDENCE.zip.sha256

      - name: Upload V13 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OKN-BP1048P4-V13-USB-C-ONLY-RUNTIME-TO-RECOVERY-EVIDENCE
          path: |
            /tmp/OKN_BP1048P4_V13_USB_C_ONLY_RUNTIME_TO_RECOVERY_EVIDENCE.zip
            /tmp/OKN_BP1048P4_V13_USB_C_ONLY_RUNTIME_TO_RECOVERY_EVIDENCE.zip.sha256
            /tmp/v13/evidence/V13_REPORT.md
            /tmp/v13/evidence/V13_RESULT.json
            /tmp/v13/evidence/V13_RUNTIME_RESET_ANALYSIS.json
            /tmp/v13/evidence/STATIC_SOURCE_HITS.txt
            /tmp/v13/evidence/SYS_RESET_XREFS.txt
            /tmp/v13/evidence/RESET_API_XREFS.txt
            /tmp/v13/evidence/USB_HID_XREFS.txt
            /tmp/v13/evidence/UPGRADE_RECOVERY_XREFS.txt
            /tmp/v13/evidence/SOURCE_CONTEXT.txt
            /tmp/v13/evidence/SOURCE_CONTEXT.json
            /tmp/v13/evidence/BINARY_INVENTORY.txt
            /tmp/v13/evidence/BINARY_INVENTORY.json
            /tmp/v13/evidence/BINARY_STRINGS_HITS.txt
            /tmp/v13/evidence/BINARY_SYMBOL_HITS.txt
            /tmp/v13/evidence/SDK_COMMIT.txt
            /tmp/v13/evidence/PROJECT_CONSTRAINTS.txt
          if-no-files-found: warn
          retention-days: 90
