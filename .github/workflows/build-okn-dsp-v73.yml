name: Build OKN DSP V73 Persistent Diagnostics Safe GATT Uncertainty

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_ANDROID_V73_PERSISTENT_DIAGNOSTICS_SAFE_GATT_UNCERTAINTY.zip'
      - '.github/workflows/build-okn-dsp-v73.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify V73 source
        shell: bash
        run: |
          set -euo pipefail
          echo 'b9291f5d4a8cf4614bf56c8c0bd009c17dc5a493f2f89c807566771514f8b22b  OKN_DSP_ANDROID_V73_PERSISTENT_DIAGNOSTICS_SAFE_GATT_UNCERTAINTY.zip' | sha256sum -c -
          rm -rf /tmp/okn_v73
          mkdir -p /tmp/okn_v73
          unzip -q OKN_DSP_ANDROID_V73_PERSISTENT_DIAGNOSTICS_SAFE_GATT_UNCERTAINTY.zip -d /tmp/okn_v73
          cd /tmp/okn_v73
          python3 preflight_v73.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/okn_v73
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and package artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn_v73/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          mkdir -p artifact
          cp "$APK" artifact/OKN_DSP_V73_PERSISTENT_DIAGNOSTICS_SAFE_GATT_UNCERTAINTY-debug.apk
          cp /tmp/okn_v73/README_V73.txt artifact/
          cp /tmp/okn_v73/evidence/OKN_DSP_V73_PERSISTENT_DIAGNOSTICS_SAFE_GATT_UNCERTAINTY_PLAN.txt artifact/
          cp /tmp/okn_v73/evidence/OKN_DSP_V73_PERSISTENT_DIAGNOSTICS_SAFE_GATT_UNCERTAINTY_PLAN.json artifact/
          sha256sum artifact/OKN_DSP_V73_PERSISTENT_DIAGNOSTICS_SAFE_GATT_UNCERTAINTY-debug.apk > artifact/OKN_DSP_V73_PERSISTENT_DIAGNOSTICS_SAFE_GATT_UNCERTAINTY-debug.sha256
          ls -lh artifact

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-V73-PERSISTENT-DIAGNOSTICS-SAFE-GATT-debug-apk
          path: artifact/
          if-no-files-found: error
          retention-days: 30
