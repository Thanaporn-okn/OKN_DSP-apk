name: OKN DSP Auto Build

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'OKN_DSP_V*.zip'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select uploaded version ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^OKN_DSP_V[0-9]+\.zip$' | head -n 1 || true)"
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(ls -1t OKN_DSP_V*.zip 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$ZIP_FILE" ]; then
            echo "No OKN_DSP_V*.zip found in repository root."
            exit 1
          fi
          VERSION_NAME="${ZIP_FILE%.zip}"
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build_workspace
          mkdir -p build_workspace
          unzip -q "${{ steps.project.outputs.zip }}" -d build_workspace
          PROJECT_DIR="$(find build_workspace -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "settings.gradle.kts not found in ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug

      - name: Package APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          VERSION="${{ steps.project.outputs.version }}"
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "out/${VERSION}_Phase1.apk"
          sha256sum "out/${VERSION}_Phase1.apk" > "out/${VERSION}_Phase1.apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.project.outputs.version }}_Phase1
          path: out/*
          if-no-files-found: error
