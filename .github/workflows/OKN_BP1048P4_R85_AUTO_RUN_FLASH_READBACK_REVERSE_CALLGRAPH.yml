name: OKN BP1048P4 R85 AUTO-RUN Flash Readback Reverse Callgraph

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/OKN_BP1048P4_R85_AUTO_RUN_FLASH_READBACK_REVERSE_CALLGRAPH.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: okn-r85-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_REPO: "https://github.com/leadercxn/bp1048_sdk_v0.1.12.git"
  SDK_COMMIT: "8105bd864b04995d81c9f9ae77cb158259f39015"
  OUT: "/tmp/r85"
  BOARD_USB_ACCESS: "NO"
  HOST_TO_DEVICE_USB: "NO"
  FLASH_ERASE_WRITE: "NO"
  FLASH_ALLOWED: "NO"

jobs:
  static-map:
    name: Reverse callgraph from every SpiFlashRead / STATIC ONLY / NO USB / NO FLASH
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fail-closed scope gate
        shell: bash
        run: |
          set -euo pipefail
          test "$BOARD_USB_ACCESS" = "NO"
          test "$HOST_TO_DEVICE_USB" = "NO"
          test "$FLASH_ERASE_WRITE" = "NO"
          test "$FLASH_ALLOWED" = "NO"
          rm -rf "$OUT"
          mkdir -p "$OUT/evidence"
          cat > "$OUT/evidence/00_SCOPE.txt" <<'EOF'
          REVISION=R85
          MODE=OFFLINE_STATIC_ONLY
          TARGET=MVSilicon_BP1048P4
          BOARD_USB_ACCESS=NO
          LIVE_USB_COMMANDS=NO
          AA55_RETEST=NO
          CONTROL_0X11_LIVE=NO
          ERASE=NO
          WRITE=NO
          FLASH_ALLOWED=NO
          GOAL=Prove_or_disprove_host_visible_non_destructive_flash_readback_from_source
          EOF

      - name: Pin exact SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone -q "$SDK_REPO" "$OUT/sdk"
          git -C "$OUT/sdk" checkout -q "$SDK_COMMIT"
          test "$(git -C "$OUT/sdk" rev-parse HEAD)" = "$SDK_COMMIT"
          printf 'SDK_COMMIT=%s\n' "$(git -C "$OUT/sdk" rev-parse HEAD)" > "$OUT/evidence/01_PIN.txt"

      - name: Build robust function map dispatcher map and reverse callgraph
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re,json,hashlib,collections

          root=Path(os.environ["OUT"])/"sdk"
          ev=Path(os.environ["OUT"])/"evidence"

          def strip_line_comment(s):
              out=[]; i=0; state="code"
              while i<len(s):
                  if state=="code" and i+1<len(s) and s[i:i+2]=="//":
                      break
                  out.append(s[i]); i+=1
              return "".join(out)

          def match_brace(text, open_pos):
              depth=0; i=open_pos; state="code"
              while i<len(text):
                  c=text[i]; n=text[i+1] if i+1<len(text) else ""
                  if state=="code":
                      if c=="/" and n=="/": state="line"; i+=2; continue
                      if c=="/" and n=="*": state="block"; i+=2; continue
                      if c=='"': state="str"; i+=1; continue
                      if c=="'": state="char"; i+=1; continue
                      if c=="{": depth+=1
                      elif c=="}":
                          depth-=1
                          if depth==0: return i
                  elif state=="line":
                      if c=="\n": state="code"
                  elif state=="block":
                      if c=="*" and n=="/": state="code"; i+=2; continue
                  elif state=="str":
                      if c=="\\": i+=2; continue
                      if c=='"': state="code"
                  elif state=="char":
                      if c=="\\": i+=2; continue
                      if c=="'": state="code"
                  i+=1
              return None

          def line_no(text,pos): return text.count("\n",0,pos)+1

          # Robust declaration finder:
          # - accepts trailing // comments after signature
          # - accepts brace on same or following lines
          # - skips prototypes containing ;
          sig_re=re.compile(
              r'(?m)^[ \t]*(?:[A-Za-z_]\w*|struct\s+[A-Za-z_]\w*|enum\s+[A-Za-z_]\w*|union\s+[A-Za-z_]\w*)'
              r'(?:[ \t\*]+[A-Za-z_]\w*|[ \t\*]+)*[ \t\*]+'
              r'(?P<name>[A-Za-z_]\w*)[ \t]*\((?P<args>[^;\n{}]*)\)[ \t]*(?://[^\n]*)?$'
          )

          functions=[]
          by_key={}
          by_name=collections.defaultdict(list)
          source_files=[]

          for p in sorted(root.rglob("*")):
              if not p.is_file() or p.suffix.lower() not in {".c",".h"}:
                  continue
              try:
                  text=p.read_text(errors="ignore")
              except Exception:
                  continue
              rel=str(p.relative_to(root))
              source_files.append({
                  "path":rel,"bytes":p.stat().st_size,
                  "sha256":hashlib.sha256(p.read_bytes()).hexdigest()
              })
              for m in sig_re.finditer(text):
                  name=m.group("name")
                  # Look for opening brace before next declaration/prototype.
                  pos=m.end()
                  tail=text[pos:pos+300]
                  bm=re.search(r'^[ \t\r\n]*(?:/\*.*?\*/[ \t\r\n]*)?\{',tail,re.S)
                  if not bm: continue
                  op=pos+bm.start()+tail[bm.start():bm.end()].rfind("{")
                  cl=match_brace(text,op)
                  if cl is None: continue
                  body=text[m.start():cl+1]
                  key=f"{rel}:{line_no(text,m.start())}:{name}"
                  rec={
                      "key":key,"name":name,"path":rel,
                      "start_line":line_no(text,m.start()),
                      "end_line":line_no(text,cl),
                      "body":body,
                  }
                  functions.append(rec)
                  by_key[key]=rec
                  by_name[name].append(rec)

          # If a same-name function occurs more than once, calls fan out to all occurrences.
          call_re=re.compile(r'\b([A-Za-z_]\w*)\s*\(')
          for f in functions:
              f["calls"]=sorted(set(x for x in call_re.findall(f["body"]) if x!=f["name"]))
              b=f["body"]
              f["flash_read"]=("SpiFlashRead(" in b or "SpiFlashReadWpr(" in b)
              f["flash_erase"]=any(x in b for x in (
                  "SpiFlashErase(","FlashChipErase(","FlashSectorErase("
              ))
              f["flash_write"]=any(x in b for x in (
                  "SpiFlashWrite(","MV_UserWriteData("
              ))
              f["host_tx"]=any(x in b for x in (
                  "Communication_Effect_Send(","hid_send_data(","OTG_DeviceControlSend("
              ))
              f["runtime_handler"]=(
                  f["name"].startswith("Communication_Effect_") or
                  f["name"].startswith("Comm_")
              )

          # Build graph by function key, resolving calls by name.
          edges=collections.defaultdict(set)
          reverse=collections.defaultdict(set)
          for f in functions:
              for cname in f["calls"]:
                  for callee in by_name.get(cname,[]):
                      edges[f["key"]].add(callee["key"])
                      reverse[callee["key"]].add(f["key"])

          # Extract exact runtime dispatcher mapping from communication.c using a tolerant window.
          dispatch=[]
          comm_path=root/"BT_Audio_APP/bt_audio_app_src/audio/communication.c"
          comm=comm_path.read_text(errors="ignore") if comm_path.exists() else ""
          case_re=re.compile(
              r'case\s+(0x[0-9A-Fa-f]+|\d+)\s*:[\s\S]{0,500}?'
              r'(Communication_Effect_[A-Za-z0-9_]+)\s*\('
          )
          for m in case_re.finditer(comm):
              dispatch.append({
                  "case":m.group(1),
                  "handler":m.group(2),
                  "path":"BT_Audio_APP/bt_audio_app_src/audio/communication.c",
                  "line":line_no(comm,m.start()),
                  "excerpt":comm[m.start():m.start()+650]
              })

          # Exact 0x11 proof.
          x11_dispatch=[x for x in dispatch if x["case"].lower()=="0x11"]
          x11_defs=[f for f in functions if f["name"]=="Communication_Effect_0x11"]
          userwrite_defs=[f for f in functions if f["name"]=="MV_UserWriteData"]

          def ancestors(start_key,max_depth=10):
              out=[]; seen={start_key}; q=collections.deque([(start_key,[start_key])])
              while q:
                  cur,path=q.popleft()
                  if len(path)>max_depth: continue
                  for parent in reverse.get(cur,()):
                      if parent in seen: continue
                      seen.add(parent)
                      pth=[parent]+path
                      out.append(pth)
                      q.append((parent,pth))
              return out

          def descendants(start_key,max_depth=10):
              out=[]; seen={start_key}; q=collections.deque([(start_key,[start_key])])
              while q:
                  cur,path=q.popleft()
                  if len(path)>max_depth: continue
                  for child in edges.get(cur,()):
                      if child in seen: continue
                      seen.add(child)
                      pth=path+[child]
                      out.append(pth)
                      q.append((child,pth))
              return out

          flash_read_funcs=[f for f in functions if f["flash_read"]]
          read_records=[]

          for rf in flash_read_funcs:
              anc=ancestors(rf["key"],12)
              runtime_paths=[]
              for pth in anc:
                  rootf=by_key[pth[0]]
                  if rootf["runtime_handler"] or rootf["name"] in {"hid_recive_data","Communication_Effect"}:
                      runtime_paths.append(pth)

              # For each runtime root path, inspect every reachable node from the root for destructive ops.
              classified=[]
              for pth in runtime_paths[:100]:
                  root_key=pth[0]
                  reach={root_key}
                  for dp in descendants(root_key,12):
                      reach.update(dp)
                  destruct=[
                      by_key[k]["key"] for k in reach
                      if by_key[k]["flash_erase"] or by_key[k]["flash_write"]
                  ]
                  tx=[
                      by_key[k]["key"] for k in reach if by_key[k]["host_tx"]
                  ]
                  classified.append({
                      "runtime_root":by_key[root_key]["key"],
                      "path_to_flash_read":[by_key[k]["key"] for k in pth],
                      "reachable_host_tx":tx[:80],
                      "reachable_destructive":destruct[:80],
                      "non_destructive_candidate":bool(tx) and not destruct,
                  })

              read_records.append({
                  "flash_read_function":rf["key"],
                  "runtime_paths":classified,
              })

          candidates=[]
          for rr in read_records:
              for p in rr["runtime_paths"]:
                  if p["non_destructive_candidate"]:
                      candidates.append({
                          "flash_read_function":rr["flash_read_function"],
                          **p
                      })

          # Build direct source contexts for every SpiFlashRead.
          read_contexts=[]
          for p in sorted(root.rglob("*")):
              if not p.is_file() or p.suffix.lower() not in {".c",".h"}: continue
              try:t=p.read_text(errors="ignore")
              except:continue
              ls=t.splitlines()
              for i,line in enumerate(ls):
                  if "SpiFlashRead(" in line or "SpiFlashReadWpr(" in line:
                      lo=max(0,i-8); hi=min(len(ls),i+12)
                      read_contexts.append({
                          "path":str(p.relative_to(root)),
                          "line":i+1,
                          "context":"\n".join(f"{j+1}: {ls[j]}" for j in range(lo,hi))
                      })

          # Focused exact function excerpts.
          focus_names={
              "MV_UserWriteData","Communication_Effect_0x11",
              "Communication_Effect_Send","hid_recive_data","hid_send_data"
          }
          focus=[
              {k:f[k] for k in ("key","name","path","start_line","end_line","flash_read","flash_erase","flash_write","host_tx","body")}
              for f in functions if f["name"] in focus_names
          ]

          decision={
              "sdk_commit":os.environ["SDK_COMMIT"],
              "source_files":len(source_files),
              "functions_parsed":len(functions),
              "dispatcher_rows":len(dispatch),
              "x11_dispatch_rows":x11_dispatch,
              "MV_UserWriteData_definition_count":len(userwrite_defs),
              "Communication_Effect_0x11_definition_count":len(x11_defs),
              "flash_read_function_count":len(flash_read_funcs),
              "host_reachable_flash_read_records":sum(bool(x["runtime_paths"]) for x in read_records),
              "non_destructive_host_visible_candidates":candidates,
              "production_generic_full_flash_readback_proven":False,
              "live_0x11_allowed":False,
              "flash_allowed":False,
          }

          (ev/"02_SOURCE_FILES.json").write_text(json.dumps(source_files,indent=2)+'\n')
          (ev/"03_FUNCTIONS.json").write_text(json.dumps(functions,indent=2,ensure_ascii=False)+'\n')
          (ev/"04_DISPATCH.json").write_text(json.dumps(dispatch,indent=2,ensure_ascii=False)+'\n')
          (ev/"05_FLASH_READ_CONTEXTS.json").write_text(json.dumps(read_contexts,indent=2,ensure_ascii=False)+'\n')
          (ev/"06_REVERSE_CALLGRAPH.json").write_text(json.dumps(read_records,indent=2,ensure_ascii=False)+'\n')
          (ev/"07_FOCUS_EXCERPTS.json").write_text(json.dumps(focus,indent=2,ensure_ascii=False)+'\n')
          (ev/"08_DECISION.json").write_text(json.dumps(decision,indent=2,ensure_ascii=False)+'\n')

          report=[
              "# R85 Flash Readback Reverse Callgraph","",
              f"- SDK commit: `{os.environ['SDK_COMMIT']}`",
              f"- source files: **{len(source_files)}**",
              f"- functions parsed: **{len(functions)}**",
              f"- dispatcher rows: **{len(dispatch)}**",
              f"- 0x11 dispatcher rows: **{len(x11_dispatch)}**",
              f"- MV_UserWriteData definitions: **{len(userwrite_defs)}**",
              f"- Communication_Effect_0x11 definitions: **{len(x11_defs)}**",
              f"- functions containing SpiFlashRead*: **{len(flash_read_funcs)}**",
              f"- host-reachable flash-read functions: **{decision['host_reachable_flash_read_records']}**",
              f"- non-destructive host-visible candidates: **{len(candidates)}**","",
              "## Exact dispatcher evidence",
          ]
          for d in x11_dispatch:
              report += [f"- `{d['path']}:{d['line']}` case `{d['case']}` -> `{d['handler']}`"]
          report += ["","## Candidate paths"]
          if candidates:
              for c in candidates[:80]:
                  report += [
                      f"- root `{c['runtime_root']}`",
                      f"  - read `{c['flash_read_function']}`",
                      f"  - path `{c['path_to_flash_read']}`",
                      f"  - TX `{c['reachable_host_tx']}`",
                  ]
          else:
              report += ["- No non-destructive host-visible flash-read path proven by this source map."]
          report += [
              "","## Gate",
              "- Internal `SpiFlashRead*` alone is not proof of a host dump protocol.",
              "- Runtime `0x11` remains live-forbidden because its known write branch reaches read/erase/write/verify.",
              "- No erase/write or USB traffic is performed by R85.",
              "- `FLASH_ALLOWED=NO`",
          ]
          (ev/"09_REPORT.md").write_text("\n".join(report)+'\n')

          print(json.dumps({
              "functions_parsed":len(functions),
              "dispatcher_rows":len(dispatch),
              "x11_dispatch_rows":len(x11_dispatch),
              "MV_UserWriteData_defs":len(userwrite_defs),
              "flash_read_funcs":len(flash_read_funcs),
              "host_reachable_flash_read_records":decision["host_reachable_flash_read_records"],
              "non_destructive_candidates":len(candidates)
          },indent=2))
          PY

      - name: Fail-closed behavior audit without self-matching literal blacklist
        shell: bash
        run: |
          set -euo pipefail
          # Audit actual environment/scope and generated decision rather than grepping
          # the workflow text for blacklist strings that necessarily appear in the audit itself.
          test "$BOARD_USB_ACCESS" = "NO"
          test "$HOST_TO_DEVICE_USB" = "NO"
          test "$FLASH_ERASE_WRITE" = "NO"
          test "$FLASH_ALLOWED" = "NO"

          python3 - <<'PY'
          from pathlib import Path
          import os,json
          ev=Path(os.environ["OUT"])/"evidence"
          d=json.loads((ev/"08_DECISION.json").read_text())
          assert d["live_0x11_allowed"] is False
          assert d["flash_allowed"] is False
          result={
            "offline_static_only":True,
            "board_usb_access":False,
            "host_to_device_usb":False,
            "erase":False,
            "write":False,
            "live_0x11":False,
            "flash_allowed":False,
            "audit_method":"scope_and_generated_behavior_not_self_grep",
          }
          (ev/"10_SAFETY_AUDIT.json").write_text(json.dumps(result,indent=2)+'\n')
          print("R85_SAFETY_AUDIT=PASS",json.dumps(result))
          PY

      - name: Build evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          cd "$OUT"
          sha256sum evidence/* > SHA256SUMS.txt
          cp SHA256SUMS.txt evidence/
          zip -9 -r R85_FLASH_READBACK_REVERSE_CALLGRAPH.zip evidence >/dev/null
          sha256sum R85_FLASH_READBACK_REVERSE_CALLGRAPH.zip | tee R85_FLASH_READBACK_REVERSE_CALLGRAPH.zip.sha256

      - name: Publish summary
        shell: bash
        run: |
          set -euo pipefail
          {
            cat "$OUT/evidence/09_REPORT.md"
            echo
            cat "$OUT/R85_FLASH_READBACK_REVERSE_CALLGRAPH.zip.sha256"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload R85 evidence
        uses: actions/upload-artifact@v7
        with:
          name: R85-FLASH-READBACK-REVERSE-CALLGRAPH
          path: |
            /tmp/r85/R85_FLASH_READBACK_REVERSE_CALLGRAPH.zip
            /tmp/r85/R85_FLASH_READBACK_REVERSE_CALLGRAPH.zip.sha256
            /tmp/r85/evidence/**
          if-no-files-found: error
          retention-days: 30

  diagnose-r85:
    name: Capture R85 run diagnostics
    if: ${{ always() }}
    needs: static-map
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout main for diagnostic report
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Capture exact run state and log tail
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.static-map.result }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r85diag
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          AUTH=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          curl -fsSL "${AUTH[@]}" "$API/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" \
            -o /tmp/r85diag/jobs.json

          python3 - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads(Path('/tmp/r85diag/jobs.json').read_text())
          jobs=j.get('jobs',[])
          build=next((x for x in jobs if x.get('name')=='Reverse callgraph from every SpiFlashRead / STATIC ONLY / NO USB / NO FLASH'),None)
          report={
            'run_id':os.environ.get('GITHUB_RUN_ID'),
            'run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),
            'repository':os.environ.get('GITHUB_REPOSITORY'),
            'head_sha':os.environ.get('GITHUB_SHA'),
            'ref':os.environ.get('GITHUB_REF'),
            'event':os.environ.get('GITHUB_EVENT_NAME'),
            'build_result':os.environ.get('BUILD_RESULT'),
            'build_job':build,
          }
          Path('/tmp/r85diag/summary.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n')
          if build and build.get('id'):
              Path('/tmp/r85diag/build_job_id.txt').write_text(str(build['id']))
          PY

          : > /tmp/r85diag/build-log-tail.txt
          if [ -s /tmp/r85diag/build_job_id.txt ]; then
            JOB_ID="$(cat /tmp/r85diag/build_job_id.txt)"
            set +e
            curl -fsSL "${AUTH[@]}" "$API/actions/jobs/$JOB_ID/logs" -o /tmp/r85diag/build.log
            RC=$?
            set -e
            if [ "$RC" -eq 0 ]; then
              tail -n 260 /tmp/r85diag/build.log > /tmp/r85diag/build-log-tail.txt
            else
              printf 'JOB_LOG_DOWNLOAD_FAILED rc=%s\n' "$RC" > /tmp/r85diag/build-log-tail.txt
            fi
          fi

          {
            echo '# R85 LAST GITHUB ACTIONS DIAGNOSTIC'
            echo
            echo "- Run ID: \`$GITHUB_RUN_ID\`"
            echo "- Attempt: \`$GITHUB_RUN_ATTEMPT\`"
            echo "- Event: \`$GITHUB_EVENT_NAME\`"
            echo "- Ref: \`$GITHUB_REF\`"
            echo "- Head SHA: \`$GITHUB_SHA\`"
            echo "- Static-map result: \`$BUILD_RESULT\`"
            echo
            echo '## Job / step metadata'
            echo '~~~json'
            cat /tmp/r85diag/summary.json
            echo '~~~'
            echo
            echo '## Static-map job log tail'
            echo '~~~text'
            cat /tmp/r85diag/build-log-tail.txt
            echo '~~~'
          } > /tmp/r85diag/R85_LAST_DIAGNOSTIC.md

      - name: Persist diagnostic report to main
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/r85diag/R85_LAST_DIAGNOSTIC.md .github/R85_LAST_DIAGNOSTIC.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/R85_LAST_DIAGNOSTIC.md
          if git diff --cached --quiet; then
            echo "R85_DIAGNOSTIC_UNCHANGED=true"
            exit 0
          fi
          git commit -m "Record R85 Actions diagnostic [skip ci]"
          git push origin HEAD:main

      - name: Upload diagnostic report
        uses: actions/upload-artifact@v7
        with:
          name: R85-RUN-DIAGNOSTIC
          path: |
            /tmp/r85diag/R85_LAST_DIAGNOSTIC.md
            /tmp/r85diag/summary.json
            /tmp/r85diag/build-log-tail.txt
          if-no-files-found: error
          retention-days: 30
