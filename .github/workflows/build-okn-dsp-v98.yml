name: Build OKN DSP V98 Master Reference Modular

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_ANDROID_V98_MASTER_REFERENCE_MODULAR.zip'
      - 'OKN_DSP_V98_SHA256.txt'
      - '.github/workflows/build-okn-dsp-v98.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and extract V98 source
        shell: bash
        run: |
          set -euo pipefail
          echo 'cc25d90730a3a99648478b8c69369054a404b4e423a33145445d310d191bbd9c  OKN_DSP_ANDROID_V98_MASTER_REFERENCE_MODULAR.zip' | sha256sum -c -
          rm -rf /tmp/okn_v98
          mkdir -p /tmp/okn_v98
          unzip -q OKN_DSP_ANDROID_V98_MASTER_REFERENCE_MODULAR.zip -d /tmp/okn_v98
          test -f /tmp/okn_v98/preflight_v98.py
          test -f /tmp/okn_v98/evidence/OKN_DSP_V98_UI_MASTER_REFERENCE.png

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run V98 preflight and verify stable signing identity
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/okn_v98
          python3 preflight_v98.py
          echo 'ba1c52f2607c09953c52fdd79c5f72026aaf0adb8aa44bcba277f7d9b49d9511  app/okn_dsp_stable_debug.keystore' | sha256sum -c -
          CERT=$(keytool -list -v -keystore app/okn_dsp_stable_debug.keystore -storepass android -alias androiddebugkey | awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr 'A-F' 'a-f')
          test "$CERT" = 'c3da85af2e978dbd0ed9bb695e5c79a263189595c116ad93a1ded75a2eb98397'
          echo "Stable signing certificate SHA-256: $CERT"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build V98 stable-signed debug APK
        working-directory: /tmp/okn_v98
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK signer and package artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn_v98/app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -f "$APK"
          "$APKSIGNER" verify --verbose "$APK"
          CERT=$($APKSIGNER verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' | tr 'A-F' 'a-f')
          test "$CERT" = 'c3da85af2e978dbd0ed9bb695e5c79a263189595c116ad93a1ded75a2eb98397'
          mkdir -p /tmp/v98_artifact
          cp "$APK" /tmp/v98_artifact/OKN_DSP_V98_MASTER_REFERENCE_MODULAR-debug.apk
          cp /tmp/okn_v98/README_V98.txt /tmp/v98_artifact/
          cp /tmp/okn_v98/evidence/OKN_DSP_V98_STATIC_VALIDATION.txt /tmp/v98_artifact/
          printf '%s\n' "$CERT" > /tmp/v98_artifact/OKN_DSP_V98_APK_CERT_SHA256.txt
          sha256sum /tmp/v98_artifact/OKN_DSP_V98_MASTER_REFERENCE_MODULAR-debug.apk > /tmp/v98_artifact/OKN_DSP_V98_APK_SHA256.txt

      - name: Upload V98 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN_DSP_V98_MASTER_REFERENCE_MODULAR
          path: /tmp/v98_artifact/
          if-no-files-found: error
          retention-days: 30
