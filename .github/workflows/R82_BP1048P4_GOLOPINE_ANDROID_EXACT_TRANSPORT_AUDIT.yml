name: R82 BP1048P4 official GoloPine Android exact transport audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r82-bp1048p4-golopine-android-transport-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_ZIP_URL: https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-01.apk_.zip
  R81_EXPECTED_ZIP_SHA256: 974f74fa99420875e64f50a9763f33f3b67a726755f8bfccd4549f944958d319
  R81_EXPECTED_APK_SHA256: 6c2d977f66609b3217f1bd72460aacb299f841bc654bf39f4d209132ca92907c
  FLASH_ALLOWED: 'NO'

jobs:
  exact-static-audit:
    name: OFFLINE exact Android transport audit - no board/no USB/no APK execution/no flash
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/R82_SAFETY.txt <<'EOF'
          R82_STATIC_ONLY=YES
          SOURCE=OFFICIAL_GOLOPINE_ANDROID_2026-04-01
          BOARD_CONTACT=NO
          USB_DEVICE_ACCESS=NO
          APK_EXECUTION=NO
          ERASE_PROGRAM_FLASH=NO
          SEND_0X11=NO
          SEND_AA55=NO
          SEND_CHIPERAS_CODEDATA_BOOTDAT_CONSTDAT_CNFGDAT_BTUPDAT_UPINFO_CXXX=NO
          R79_PHYSICAL_REPLUG_AUTORUN=NO
          FLASH_ALLOWED=NO
          PURPOSE=PROVE_EXACT_ANDROID_TRANSPORT_REFERENCES_BEFORE_ANY_LIVE_PROBE
          EOF
          cat /tmp/R82_SAFETY.txt

      - name: Acquire official package and enforce R81 SHA pins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r82/unpacked /tmp/r82/apk
          curl --fail --location --retry 4 --connect-timeout 20 \
            "$APK_ZIP_URL" -o /tmp/r82/golopine_android_20260401.zip
          ZIP_SHA="$(sha256sum /tmp/r82/golopine_android_20260401.zip | awk '{print $1}')"
          printf '%s  %s\n' "$ZIP_SHA" /tmp/r82/golopine_android_20260401.zip | tee /tmp/R82_ZIP_SHA256.txt
          test "$ZIP_SHA" = "$R81_EXPECTED_ZIP_SHA256"
          unzip -q /tmp/r82/golopine_android_20260401.zip -d /tmp/r82/unpacked
          APK="$(find /tmp/r82/unpacked -type f -iname '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" /tmp/r82/golopine_android_20260401.apk
          APK_SHA="$(sha256sum /tmp/r82/golopine_android_20260401.apk | awk '{print $1}')"
          printf '%s  %s\n' "$APK_SHA" /tmp/r82/golopine_android_20260401.apk | tee /tmp/R82_APK_SHA256.txt
          test "$APK_SHA" = "$R81_EXPECTED_APK_SHA256"
          unzip -q /tmp/r82/golopine_android_20260401.apk -d /tmp/r82/apk
          echo 'R81_SHA_PINS_MATCH=YES' | tee /tmp/R82_SHA_GATE.txt

      - name: Manifest exact USB versus Bluetooth surface
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/R82_BADGING.txt
          : > /tmp/R82_MANIFEST.txt
          AAPT="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name aapt 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging /tmp/r82/golopine_android_20260401.apk > /tmp/R82_BADGING.txt 2>&1 || true
            "$AAPT" dump xmltree /tmp/r82/golopine_android_20260401.apk AndroidManifest.xml > /tmp/R82_MANIFEST.txt 2>&1 || true
          fi
          python3 - <<'PY'
          from pathlib import Path
          import json
          t=(Path('/tmp/R82_BADGING.txt').read_text(errors='ignore')+'\n'+Path('/tmp/R82_MANIFEST.txt').read_text(errors='ignore'))
          checks={
            'MANIFEST_USB_HOST_FEATURE':'android.hardware.usb.host' in t,
            'MANIFEST_USB_DEVICE_ATTACHED':'android.hardware.usb.action.USB_DEVICE_ATTACHED' in t or 'USB_DEVICE_ATTACHED' in t,
            'MANIFEST_USB_ACCESSORY_ATTACHED':'android.hardware.usb.action.USB_ACCESSORY_ATTACHED' in t or 'USB_ACCESSORY_ATTACHED' in t,
            'MANIFEST_BLUETOOTH_PERMISSION':'android.permission.BLUETOOTH' in t,
            'MANIFEST_BLUETOOTH_CONNECT':'android.permission.BLUETOOTH_CONNECT' in t,
            'MANIFEST_BLUETOOTH_SCAN':'android.permission.BLUETOOTH_SCAN' in t,
          }
          Path('/tmp/R82_MANIFEST_EXACT.json').write_text(json.dumps(checks,indent=2)+'\n')
          print(json.dumps(checks,indent=2))
          PY
          grep -Ei 'package:|sdkVersion|targetSdkVersion|usb|bluetooth|launchable-activity|uses-feature|uses-permission' \
            /tmp/R82_BADGING.txt /tmp/R82_MANIFEST.txt > /tmp/R82_MANIFEST_RELEVANT.txt || true
          cat /tmp/R82_MANIFEST_RELEVANT.txt

      - name: Exact DEX class and method reference audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('/tmp/r82/apk')
          dexes=sorted(root.glob('classes*.dex'))
          exact={
            'USB_MANAGER': b'Landroid/hardware/usb/UsbManager;',
            'USB_DEVICE': b'Landroid/hardware/usb/UsbDevice;',
            'USB_CONNECTION': b'Landroid/hardware/usb/UsbDeviceConnection;',
            'USB_INTERFACE': b'Landroid/hardware/usb/UsbInterface;',
            'USB_ENDPOINT': b'Landroid/hardware/usb/UsbEndpoint;',
            'USB_REQUEST': b'Landroid/hardware/usb/UsbRequest;',
            'USB_ATTACHED_ACTION': b'android.hardware.usb.action.USB_DEVICE_ATTACHED',
            'CONTROL_TRANSFER': b'controlTransfer',
            'BULK_TRANSFER': b'bulkTransfer',
            'CLAIM_INTERFACE': b'claimInterface',
            'GET_DEVICE_LIST': b'getDeviceList',
            'REQUEST_PERMISSION': b'requestPermission',
            'BT_ADAPTER': b'Landroid/bluetooth/BluetoothAdapter;',
            'BT_DEVICE': b'Landroid/bluetooth/BluetoothDevice;',
            'BT_GATT': b'Landroid/bluetooth/BluetoothGatt;',
            'BT_SOCKET': b'Landroid/bluetooth/BluetoothSocket;',
            'BT_CLASSIC_CHANNEL': b'com.matteogassend/bluetooth_classic/status',
            'USB_SERIAL_PLUGIN': b'usb_serial',
            'FLUTTER_LIBSERIALPORT': b'flutter_libserialport',
            'LIBSERIALPORT': b'libserialport',
          }
          per={}
          joined=b''
          for p in dexes:
            b=p.read_bytes(); joined += b
            per[p.name]={k:(v in b) for k,v in exact.items()}
          out={
            'dex_files':[p.name for p in dexes],
            'aggregate':{k:(v in joined) for k,v in exact.items()},
            'per_dex':per,
          }
          Path('/tmp/R82_DEX_EXACT.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          # Printable DEX strings useful for identifying registered plugins/channels.
          strings=[]
          for p in dexes:
            b=p.read_bytes()
            for m in re.finditer(rb'[\x20-\x7e]{4,}', b):
              s=m.group().decode('utf-8','ignore')
              sl=s.lower()
              if any(x in sl for x in ['bluetooth','usb','serial','gatt','socket','flutterplugin','methodchannel','eventchannel','com.example.aufe']):
                strings.append(f'{p.name}\t{s}')
          Path('/tmp/R82_DEX_TRANSPORT_STRINGS.txt').write_text('\n'.join(dict.fromkeys(strings))+'\n')
          PY
          cat /tmp/R82_DEX_TRANSPORT_STRINGS.txt

          DEXDUMP="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name dexdump 2>/dev/null | sort -V | tail -1 || true)"
          : > /tmp/R82_DEXDUMP_TRANSPORT_HITS.txt
          if [ -n "$DEXDUMP" ]; then
            for d in /tmp/r82/apk/classes*.dex; do
              "$DEXDUMP" -d "$d" 2>/dev/null | \
                grep -Ei -C 4 'android/hardware/usb|UsbManager|UsbDevice|UsbDeviceConnection|controlTransfer|bulkTransfer|claimInterface|Bluetooth(Adapter|Device|Gatt|Socket)|bluetooth_classic|usb_serial|libserialport' \
                >> /tmp/R82_DEXDUMP_TRANSPORT_HITS.txt || true
            done
          fi
          sed -n '1,1200p' /tmp/R82_DEXDUMP_TRANSPORT_HITS.txt

      - name: Flutter AOT exact transport/plugin strings and anchor neighborhoods
        shell: bash
        run: |
          set -euo pipefail
          APP_SO="$(find /tmp/r82/apk -type f -path '*/arm64-v8a/libapp.so' -print -quit)"
          test -n "$APP_SO"
          strings -a -t x "$APP_SO" > /tmp/R82_LIBAPP_ALL_STRINGS_WITH_OFFSETS.txt
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          lines=Path('/tmp/R82_LIBAPP_ALL_STRINGS_WITH_OFFSETS.txt').read_text(errors='ignore').splitlines()
          terms=[
            'android.hardware.usb','UsbManager','UsbDevice','UsbDeviceConnection','UsbInterface','UsbEndpoint',
            'controlTransfer','bulkTransfer','claimInterface','getDeviceList','requestPermission',
            'usb_serial','UsbPort','UsbEvent','flutter_libserialport','libserialport','serialport',
            'Bluetooth','bluetooth_classic','BluetoothGatt','BluetoothSocket','gatt','RFCOMM',
            'vendorId','productId','Vendor ID','Product ID',
            'Sent Device Type and software version authentication request data',
            'firmware','bootloader','recovery','upgrade','MVAssistant','.MVA','BP1048P4','BP1048',
          ]
          hits=[]
          for i,line in enumerate(lines):
            for t in terms:
              if t.lower() in line.lower():
                hits.append({'index':i,'term':t,'line':line})
          Path('/tmp/R82_LIBAPP_EXACT_HITS.json').write_text(json.dumps(hits,indent=2,ensure_ascii=False)+'\n')
          seen=set(); blocks=[]
          for h in hits:
            i=h['index']
            a=max(0,i-18); b=min(len(lines),i+19)
            key=(a,b)
            if key in seen: continue
            seen.add(key)
            blocks.append(f"===== anchor term={h['term']} index={i} =====")
            blocks.extend(lines[a:b])
          Path('/tmp/R82_LIBAPP_ANCHOR_CONTEXT.txt').write_text('\n'.join(blocks)+'\n')
          print('LIBAPP_HIT_COUNT',len(hits))
          for h in hits:
            print(h['term'], h['line'][:400])
          PY
          sed -n '1,1600p' /tmp/R82_LIBAPP_ANCHOR_CONTEXT.txt

      - name: Firmware/update payload inventory gate
        shell: bash
        run: |
          set -euo pipefail
          find /tmp/r82/apk -type f | sed 's#^/tmp/r82/apk/##' | sort > /tmp/R82_APK_PATHS.txt
          grep -Ei '\.(mva|bin|hex|img|fw|dfu|rom|upd|dat)$|firmware|upgrade|update|boot|recover' \
            /tmp/R82_APK_PATHS.txt > /tmp/R82_PAYLOAD_CANDIDATE_PATHS.txt || true
          cat /tmp/R82_PAYLOAD_CANDIDATE_PATHS.txt
          find /tmp/r82/apk -type f -name '*.so' -printf '%P\n' | sort > /tmp/R82_NATIVE_LIBS.txt
          cat /tmp/R82_NATIVE_LIBS.txt

      - name: Build conservative R82 decision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          m=json.loads(Path('/tmp/R82_MANIFEST_EXACT.json').read_text())
          d=json.loads(Path('/tmp/R82_DEX_EXACT.json').read_text())['aggregate']
          a=json.loads(Path('/tmp/R82_LIBAPP_EXACT_HITS.json').read_text())
          terms=[x['term'].lower() for x in a]
          usb_dex=any(d[k] for k in ['USB_MANAGER','USB_DEVICE','USB_CONNECTION','CONTROL_TRANSFER','BULK_TRANSFER','CLAIM_INTERFACE','GET_DEVICE_LIST'])
          bt_dex=any(d[k] for k in ['BT_ADAPTER','BT_DEVICE','BT_GATT','BT_SOCKET','BT_CLASSIC_CHANNEL'])
          app_usb=any(t in terms for t in ['usbmanager','usbdevice','usbdeviceconnection','controltransfer','bulktransfer','claiminterface','getdevicelist','usb_serial','flutter_libserialport','libserialport'])
          app_bt=any(t in terms for t in ['bluetooth','bluetooth_classic','bluetoothgatt','bluetoothsocket','gatt','rfcomm'])
          dec={
            'R81_SHA_PINS_MATCH':Path('/tmp/R82_SHA_GATE.txt').read_text().strip().endswith('YES'),
            'MANIFEST_USB_HOST_OR_ATTACH':bool(m['MANIFEST_USB_HOST_FEATURE'] or m['MANIFEST_USB_DEVICE_ATTACHED'] or m['MANIFEST_USB_ACCESSORY_ATTACHED']),
            'DEX_ANDROID_USB_API_EXACT':usb_dex,
            'LIBAPP_USB_PLUGIN_OR_API_STRING':app_usb,
            'DEX_BLUETOOTH_API_EXACT':bt_dex,
            'LIBAPP_BLUETOOTH_STRING':app_bt,
            'R81_VENDOR_PRODUCT_FIELDS_PRESENT':any(t in terms for t in ['vendorid','productid']),
            'USB_TRANSPORT_PROVEN':bool(usb_dex and app_usb),
            'BLUETOOTH_TRANSPORT_EVIDENCE':bool(bt_dex or app_bt),
            'EXACT_BOOT_ENTRY_PROVEN':False,
            'RECOVERY_USB_IDENTITY_PROVEN':False,
            'READ_ONLY_IDENTIFY_STATUS_PROVEN':False,
            'LIVE_BOARD_TEST_ALLOWED_FROM_R82':False,
            'FLASH_ALLOWED':False,
          }
          Path('/tmp/R82_DECISION.json').write_text(json.dumps(dec,indent=2)+'\n')
          print(json.dumps(dec,indent=2))
          lines=['# R82 GoloPine Android exact transport audit','',
                 'OFFLINE/STATIC ONLY. No APK execution, no board/USB access, no flash.','',
                 '```json',json.dumps(dec,indent=2),'```','',
                 'Interpretation gate:',
                 '- Do not infer USB host from vendorId/productId strings alone.',
                 '- USB transport requires exact Android USB API/plugin evidence, not substring hits.',
                 '- Boot/recovery/update remains unproven until an exact app-specific call path is recovered.',
                 '- FLASH_ALLOWED=NO.']
          Path('/tmp/R82_REPORT.md').write_text('\n'.join(lines)+'\n')
          PY
          cat /tmp/R82_REPORT.md

      - name: Package evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/R82_BP1048P4_GOLOPINE_ANDROID_EXACT_TRANSPORT_EVIDENCE
          cp -a /tmp/R82_*.txt /tmp/R82_*.json /tmp/R82_*.md \
            /tmp/R82_BP1048P4_GOLOPINE_ANDROID_EXACT_TRANSPORT_EVIDENCE/ 2>/dev/null || true
          (cd /tmp && zip -qr R82_BP1048P4_GOLOPINE_ANDROID_EXACT_TRANSPORT_EVIDENCE.zip R82_BP1048P4_GOLOPINE_ANDROID_EXACT_TRANSPORT_EVIDENCE)
          sha256sum /tmp/R82_BP1048P4_GOLOPINE_ANDROID_EXACT_TRANSPORT_EVIDENCE.zip \
            > /tmp/R82_BP1048P4_GOLOPINE_ANDROID_EXACT_TRANSPORT_EVIDENCE.zip.sha256

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R82-BP1048P4-GOLOPINE-ANDROID-EXACT-TRANSPORT-EVIDENCE
          path: |
            /tmp/R82_BP1048P4_GOLOPINE_ANDROID_EXACT_TRANSPORT_EVIDENCE.zip
            /tmp/R82_BP1048P4_GOLOPINE_ANDROID_EXACT_TRANSPORT_EVIDENCE.zip.sha256
          if-no-files-found: error
