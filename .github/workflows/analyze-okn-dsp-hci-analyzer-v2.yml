name: OKN DSP HCI Analyzer V2

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find V1 analysis artifact ZIP
        run: |
          set -e
          FILE=$(find . -maxdepth 2 -type f -name 'OKN_DSP_HCI_ANALYSIS*.zip' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "ไม่พบ OKN_DSP_HCI_ANALYSIS*.zip ใน repository"
            exit 1
          fi
          echo "Using $FILE"
          python3 scripts/analyze_v2.py --input "$FILE" --output out
      - name: Upload V2 analysis
        uses: actions/upload-artifact@v4
        with:
          name: OKN_DSP_HCI_ANALYSIS_V2
          path: out/
