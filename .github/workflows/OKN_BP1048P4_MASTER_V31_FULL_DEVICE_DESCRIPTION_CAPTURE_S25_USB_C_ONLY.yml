name: OKN BP1048P4 MASTER V31 FULL DEVICE DESCRIPTION CAPTURE S25 USB-C ONLY

"on":
  workflow_dispatch:
    inputs:
      challenge_hex:
        description: "32-byte challenge HEX from V31 app. Leave blank on first run to build APK only."
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  GOLOPINE_WINDOWS_URL: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-08.exe_.zip"
  EXPECTED_VENDOR_SHA256: "3ca54171c53f7badd963ffe6851b8b3e2faf8aee8ba2afcb7040990e22ae09b2"

  REQUIRED_PHONE: "Samsung Galaxy S25+"
  REQUIRED_PATH: "Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only"

  FLASH_ALLOWED: "NO"
  ERASE_ALLOWED: "NO"
  FIRMWARE_WRITE_ALLOWED: "NO"
  FEATURE_REPORT_ALLOWED: "NO"
  UPDATE_COMMAND_ALLOWED: "NO"
  RECOVERY_COMMAND_ALLOWED: "NO"

jobs:
  build-v31-apk:
    name: Build bounded same-session S25+ auth diagnostic APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail

          test "$REQUIRED_PHONE" = "Samsung Galaxy S25+"
          test "$REQUIRED_PATH" = "Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only"
          test "$FLASH_ALLOWED" = "NO"
          test "$ERASE_ALLOWED" = "NO"
          test "$FIRMWARE_WRITE_ALLOWED" = "NO"
          test "$FEATURE_REPORT_ALLOWED" = "NO"
          test "$UPDATE_COMMAND_ALLOWED" = "NO"
          test "$RECOVERY_COMMAND_ALLOWED" = "NO"

          rm -rf /tmp/v31
          mkdir -p /tmp/v31/{app,evidence,out}

          cat > /tmp/v31/evidence/00_READ_FIRST.txt <<'EOF'
          OKN BP1048P4 MASTER V31

          PURPOSE:
          Same-session authentication plus read-only full Device Description capture.

          REQUIRED PHYSICAL PATH:
          Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only

          PROVEN BEFORE V31:
          - Runtime USB identity 6324:1719.
          - Exact V25 raw/IF3/IF4 fingerprints.
          - Cross-session challenge changes.
          - Official vendor parser generates a challenge-specific 4-byte reply.
          - V28 FIXED V2 runtime JIT identifies the USB HID DeviceCommunicationStream:
            BHWnxZ6spmGFPV1vs95.neOkHj6BdZDIamOJWhM.Write(Byte[])
            metadata token 0x0600043A.
          - Its JIT allocates input.Length + 1.
          - HIDInterface.Send(Byte[]) metadata token 0x06000496 also allocates input.Length + 1.
          - Therefore a raw 4-byte vendor reply is framed as:
            05 04 <4 reply bytes>
            then zero-padded to the 256-byte Android Output report.
          - This is consistent with the already-proven V17 16-byte startup path:
            raw16 -> 10 raw16 -> 11 10 raw16.
          - V30 replay proved the first four real post-auth reports are accepted by
            the official parser without exception.
          - V30 parser reported DevDescriptionLength=18261 decoded bytes.
          - Four reports were insufficient; parser remained
            UFE_STREAM_GETTING_DEVICE_DESCRIPTION.
          - V31 therefore captures at least 79 non-zero post-auth Input reports,
            and up to 90, without sending any additional host-to-device command.

          V31 ALLOWS ONLY:
          1) one proven startup handshake,
          2) Input GET_REPORT capture,
          3) one manually supplied 4-byte challenge-specific auth reply in the SAME open USB session,
          4) Input GET_REPORT capture after auth.

          V31 DOES NOT:
          - send Feature reports,
          - send updater/recovery commands,
          - erase flash,
          - write firmware,
          - enter bootloader,
          - send any arbitrary third command.

          FLASH_ALLOWED=NO
          NOT_FOR_FLASH
          EOF

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail
          A=/tmp/v31/app
          mkdir -p "$A/app/src/main/java/com/okn/bp1048p4v31" "$A/app/src/main/res/xml"

          cat > "$A/settings.gradle" <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name='OKN_BP1048P4_V31_SAME_SESSION_AUTH'
          include ':app'
          EOF

          cat > "$A/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > "$A/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > "$A/app/build.gradle" <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.okn.bp1048p4v31'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.okn.bp1048p4v31'
                  minSdk 29
                  targetSdk 35
                  versionCode 31
                  versionName '31.0'
              }
          }
          EOF

          cat > "$A/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.usb.host" android:required="true"/>
              <application
                  android:allowBackup="false"
                  android:label="OKN BP1048P4 V31 Same Session Auth">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED"
                          android:resource="@xml/device_filter"/>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > "$A/app/src/main/res/xml/device_filter.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <usb-device vendor-id="25380" product-id="5913"/>
          </resources>
          EOF

          cat > "$A/app/src/main/java/com/okn/bp1048p4v31/MainActivity.java" <<'JAVA'
          package com.okn.bp1048p4v31;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.hardware.usb.UsbDevice;
          import android.hardware.usb.UsbDeviceConnection;
          import android.hardware.usb.UsbInterface;
          import android.hardware.usb.UsbManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.SystemClock;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import java.security.MessageDigest;
          import java.util.Arrays;
          import java.util.HashMap;
          import java.util.Locale;
          import java.util.Map;

          @SuppressWarnings("deprecation")
          public class MainActivity extends Activity {
              private static final int RUNTIME_VID=0x6324;
              private static final int RUNTIME_PID=0x1719;
              private static final int SAVE_EVIDENCE=129;
              private static final String ACTION_USB_PERMISSION=
                  "com.okn.bp1048p4v31.USB_PERMISSION";

              private static final String EXPECTED_RAW_SHA=
                  "C7E861A6F28EB832E16450D3A35B64C557BEA4E0CC15FF1EB94C45E348C84001";
              private static final String EXPECTED_IF3_SHA=
                  "BAFE7C0E6A251EB36B11362B18106DFF3DC0010A831A3B8B6CD49DBF4A9AE2C3";
              private static final String EXPECTED_IF4_SHA=
                  "78510751B31DCC204CD6CA2FE023F05CF84B75227A279E8E1FBAF7D6C3A21B6F";

              // Proven V17 startup Android report prefix.
              private static final byte[] STARTUP_PREFIX=new byte[]{
                  0x11,0x10,0x63,0x1C,0x06,0x24,0x43,(byte)0xFD,
                  0x38,0x44,0x55,(byte)0x80,0x01,(byte)0xF3,
                  (byte)0xED,(byte)0xA0,(byte)0xCC,(byte)0xF8
              };

              private UsbManager usb;
              private TextView log;
              private TextView challengeView;
              private EditText replyEdit;
              private Button startButton;
              private Button authButton;
              private long t0;
              private int permissionRequestedFor=-1;

              private boolean rawFingerprintOk=false;
              private boolean if3FingerprintOk=false;
              private boolean if4FingerprintOk=false;
              private boolean exactFingerprintOk=false;

              private UsbDevice sessionDevice=null;
              private UsbInterface sessionIf=null;
              private UsbDeviceConnection sessionConn=null;
              private boolean sessionClaimed=false;
              private boolean startupSent=false;
              private boolean challengeReady=false;
              private boolean authSent=false;
              private byte[] currentChallenge=null;

              private final StringBuilder evidence=new StringBuilder();

              private final BroadcastReceiver permissionRx=new BroadcastReceiver(){
                  @Override public void onReceive(Context c,Intent i){
                      if(!ACTION_USB_PERMISSION.equals(i.getAction()))return;
                      UsbDevice d=getDevice(i);
                      boolean granted=i.getBooleanExtra(UsbManager.EXTRA_PERMISSION_GRANTED,false);
                      permissionRequestedFor=-1;
                      line("USB_PERMISSION_RESULT="+granted+dev(d));
                      if(granted && runtime(d))readDescriptors(d);
                  }
              };

              private final BroadcastReceiver usbRx=new BroadcastReceiver(){
                  @Override public void onReceive(Context c,Intent i){
                      if(UsbManager.ACTION_USB_DEVICE_DETACHED.equals(i.getAction())){
                          line("USB_DETACHED=true");
                          closeSession("DETACH");
                          exactFingerprintOk=false;
                          updateButtons();
                      }else if(UsbManager.ACTION_USB_DEVICE_ATTACHED.equals(i.getAction())){
                          line("USB_ATTACHED=true");
                          scan(true);
                      }
                  }
              };

              @Override protected void onCreate(Bundle b){
                  super.onCreate(b);

                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  t0=SystemClock.elapsedRealtime();
                  usb=(UsbManager)getSystemService(Context.USB_SERVICE);

                  evidence.append("EVIDENCE_FORMAT=OKN_BP1048P4_V31_SAME_SESSION_AUTH\n");
                  evidence.append("REQUIRED_PHONE=Samsung Galaxy S25+\n");
                  evidence.append("REQUIRED_PATH=Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only\n");
                  evidence.append("EXPECTED_RUNTIME_VID_PID=6324:1719\n");
                  evidence.append("V28_USB_STREAM_WRITE_TOKEN=0x0600043A\n");
                  evidence.append("V28_HIDINTERFACE_SEND_TOKEN=0x06000496\n");
                  evidence.append("V31_AUTH_WIRE_RULE=05 04 <4 reply bytes>\n");
                  evidence.append("FEATURE_REPORT_USED=false\n");
                  evidence.append("FLASH_WRITE_ERASE_RECOVERY=false\n");
                  evidence.append("FLASH_ALLOWED=NO\n");

                  IntentFilter pf=new IntentFilter(ACTION_USB_PERMISSION);
                  IntentFilter uf=new IntentFilter();
                  uf.addAction(UsbManager.ACTION_USB_DEVICE_ATTACHED);
                  uf.addAction(UsbManager.ACTION_USB_DEVICE_DETACHED);

                  if(Build.VERSION.SDK_INT>=33){
                      registerReceiver(permissionRx,pf,Context.RECEIVER_NOT_EXPORTED);
                      registerReceiver(usbRx,uf);
                  }else{
                      registerReceiver(permissionRx,pf);
                      registerReceiver(usbRx,uf);
                  }

                  LinearLayout root=new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(28,28,28,28);

                  TextView title=new TextView(this);
                  title.setText("OKN BP1048P4 V31 — Full Device Description Capture");
                  title.setTextSize(20);
                  root.addView(title);

                  TextView note=new TextView(this);
                  note.setText(
                      "\nทำตามลำดับและห้ามถอดสายระหว่าง challenge กับ auth reply:\n"+
                      "1) VERIFY EXACT BOARD\n"+
                      "2) START SESSION + CAPTURE CHALLENGE\n"+
                      "3) COPY CHALLENGE แล้วเปิด GitHub Actions V31 อีกครั้ง ใส่ challenge_hex\n"+
                      "4) เอา AUTH_REPLY_HEX 8 ตัวมาใส่ช่องด้านล่าง\n"+
                      "5) กลับมาหน้านี้แล้วกด SEND AUTH REPLY + CAPTURE FULL DEVICE DESCRIPTION\n"+
                      "6) รอจน log หยุด แล้ว SAVE FULL EVIDENCE REPORT\n\n"+
                      "เป้าหมายอ่านอย่างเดียว: >=79 reports (สูงสุด 90) เพื่อเก็บ Device Description 18261 bytes\n"+
                      "ไม่ Feature report • ไม่ updater • ไม่ recovery • ไม่ flash/erase/write firmware\n");
                  root.addView(note);

                  add(root,"REQUEST USB PERMISSION + VERIFY EXACT BOARD",v->scan(true));

                  startButton=add(root,"START SESSION + CAPTURE CHALLENGE",v->confirmStart());
                  startButton.setEnabled(false);

                  challengeView=new TextView(this);
                  challengeView.setText("\nChallenge: <not captured>\n");
                  challengeView.setTextIsSelectable(true);
                  root.addView(challengeView);

                  add(root,"COPY CHALLENGE HEX",v->copyChallenge());

                  replyEdit=new EditText(this);
                  replyEdit.setHint("AUTH_REPLY_HEX exactly 8 hex chars, e.g. 7427956A");
                  replyEdit.setSingleLine(true);
                  root.addView(replyEdit);

                  authButton=add(root,"SEND AUTH REPLY + CAPTURE FULL DEVICE DESCRIPTION",v->confirmAuth());
                  authButton.setEnabled(false);

                  add(root,"CLOSE CURRENT SESSION",v->closeSession("USER"));
                  add(root,"SAVE FULL EVIDENCE REPORT",v->saveEvidence());

                  log=new TextView(this);
                  log.setTextIsSelectable(true);
                  log.setText("\nLog:\n");
                  root.addView(log);

                  ScrollView sv=new ScrollView(this);
                  sv.addView(root);
                  setContentView(sv);

                  scan(false);
              }

              private Button add(LinearLayout r,String text,android.view.View.OnClickListener l){
                  Button b=new Button(this);
                  b.setText(text);
                  b.setAllCaps(false);
                  b.setOnClickListener(l);
                  r.addView(b);
                  return b;
              }

              private void line(String s){
                  long ms=SystemClock.elapsedRealtime()-t0;
                  String row=String.format(Locale.US,"[%06dms] %s\n",ms,s);
                  evidence.append(row);
                  runOnUiThread(()->{
                      if(log!=null)log.append(row);
                  });
              }

              private UsbDevice getDevice(Intent i){
                  if(Build.VERSION.SDK_INT>=33)
                      return i.getParcelableExtra(UsbManager.EXTRA_DEVICE,UsbDevice.class);
                  return i.getParcelableExtra(UsbManager.EXTRA_DEVICE);
              }

              private String dev(UsbDevice d){
                  if(d==null)return " device=<NULL>";
                  return String.format(
                      Locale.US," vid=%04X pid=%04X id=%d ifaces=%d",
                      d.getVendorId(),d.getProductId(),d.getDeviceId(),d.getInterfaceCount());
              }

              private boolean runtime(UsbDevice d){
                  return d!=null &&
                      d.getVendorId()==RUNTIME_VID &&
                      d.getProductId()==RUNTIME_PID;
              }

              private void updateButtons(){
                  if(startButton!=null)
                      startButton.setEnabled(
                          exactFingerprintOk && sessionConn==null && !startupSent);

                  if(authButton!=null)
                      authButton.setEnabled(
                          sessionConn!=null && sessionClaimed &&
                          challengeReady && !authSent);
              }

              private void requestPermission(UsbDevice d){
                  if(d==null || usb.hasPermission(d))return;
                  if(permissionRequestedFor==d.getDeviceId())return;

                  Intent intent=new Intent(ACTION_USB_PERMISSION).setPackage(getPackageName());
                  PendingIntent pi=PendingIntent.getBroadcast(
                      this,d.getDeviceId(),intent,
                      PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_MUTABLE);

                  permissionRequestedFor=d.getDeviceId();
                  usb.requestPermission(d,pi);
                  line("USB_PERMISSION_REQUESTED=true"+dev(d));
              }

              private void scan(boolean request){
                  UsbDevice target=null;
                  Map<String,UsbDevice> m=usb.getDeviceList();
                  line("USB_DEVICE_COUNT="+m.size());

                  for(UsbDevice d:m.values()){
                      line("USB_DEVICE="+dev(d)+" permission="+usb.hasPermission(d));
                      if(runtime(d))target=d;
                  }

                  if(target==null){
                      exactFingerprintOk=false;
                      line("V31_RUNTIME_TARGET_FOUND=false");
                      updateButtons();
                      return;
                  }

                  line("V31_RUNTIME_TARGET_FOUND=true");

                  if(!usb.hasPermission(target)){
                      line("V31_RUNTIME_PERMISSION=false");
                      if(request)requestPermission(target);
                      updateButtons();
                      return;
                  }

                  line("V31_RUNTIME_PERMISSION=true");
                  readDescriptors(target);
              }

              private Map<Integer,Integer> hidLengths(byte[] raw){
                  Map<Integer,Integer> out=new HashMap<>();
                  int p=0,currentIf=-1,currentClass=-1;

                  while(raw!=null && p+2<=raw.length){
                      int len=raw[p]&255;
                      int type=raw[p+1]&255;
                      if(len<2 || p+len>raw.length)break;

                      if(type==0x04 && len>=9){
                          currentIf=raw[p+2]&255;
                          currentClass=raw[p+5]&255;
                      }else if(type==0x21 && currentClass==3 && currentIf>=0 && len>=9){
                          int num=raw[p+5]&255;
                          int q=p+6;
                          for(int k=0;k<num && q+2<p+len;k++,q+=3){
                              int dtype=raw[q]&255;
                              int dlen=(raw[q+1]&255)|((raw[q+2]&255)<<8);
                              if(dtype==0x22 && dlen>0){
                                  out.put(currentIf,dlen);
                                  break;
                              }
                          }
                      }
                      p+=len;
                  }
                  return out;
              }

              private int readReportDescriptor(
                  UsbDeviceConnection c,UsbInterface x,int expected,String phase){

                  byte[] b=new byte[expected>0?expected:4096];

                  int r=c.controlTransfer(
                      0x81,0x06,0x2200,x.getId(),b,b.length,1500);

                  line("IF"+x.getId()+"_"+phase+"_REPORT_DESCRIPTOR_RESULT="+r);

                  if(r>0){
                      byte[] exact=Arrays.copyOf(b,r);
                      String sh=sha256(exact);
                      line("IF"+x.getId()+"_REPORT_SHA256="+sh);

                      if(x.getId()==3 && r==33)if3FingerprintOk=EXPECTED_IF3_SHA.equals(sh);
                      if(x.getId()==4 && r==36)if4FingerprintOk=EXPECTED_IF4_SHA.equals(sh);
                  }

                  return r;
              }

              private void readDescriptors(UsbDevice d){
                  rawFingerprintOk=false;
                  if3FingerprintOk=false;
                  if4FingerprintOk=false;
                  exactFingerprintOk=false;

                  UsbDeviceConnection c=usb.openDevice(d);
                  if(c==null){
                      line("DESCRIPTOR_OPEN_DEVICE_NULL=true");
                      updateButtons();
                      return;
                  }

                  try{
                      byte[] raw=c.getRawDescriptors();
                      if(raw==null || raw.length==0){
                          line("RAW_DESCRIPTOR_EMPTY=true");
                          return;
                      }

                      String rawSha=sha256(raw);
                      rawFingerprintOk=EXPECTED_RAW_SHA.equals(rawSha);

                      line("RAW_DESCRIPTOR_BYTES="+raw.length);
                      line("RAW_DESCRIPTOR_SHA256="+rawSha);
                      line("RAW_DESCRIPTOR_FINGERPRINT_OK="+rawFingerprintOk);

                      Map<Integer,Integer> lens=hidLengths(raw);
                      line("HID_REPORT_DESCRIPTOR_LENGTHS="+lens);

                      UsbInterface if3=null,if4=null;

                      for(int i=0;i<d.getInterfaceCount();i++){
                          UsbInterface x=d.getInterface(i);
                          if(x.getInterfaceClass()==3 && x.getId()==3)if3=x;
                          if(x.getInterfaceClass()==3 && x.getId()==4)if4=x;
                      }

                      if(if4!=null)
                          readReportDescriptor(c,if4,lens.containsKey(4)?lens.get(4):36,"UNCLAIMED");

                      if(if3!=null){
                          int exp=lens.containsKey(3)?lens.get(3):33;
                          int rr=readReportDescriptor(c,if3,exp,"UNCLAIMED");

                          if(rr<=0){
                              boolean cl=c.claimInterface(if3,false);
                              line("IF3_NONFORCED_CLAIM="+cl);
                              if(cl){
                                  try{ readReportDescriptor(c,if3,exp,"CLAIM_FALSE"); }
                                  finally{ line("IF3_NONFORCED_RELEASE="+c.releaseInterface(if3)); }
                              }
                          }

                          if(!if3FingerprintOk){
                              boolean cl=c.claimInterface(if3,true);
                              line("IF3_TEMP_FORCE_CLAIM="+cl);
                              if(cl){
                                  try{ readReportDescriptor(c,if3,exp,"TEMP_FORCE_TRUE"); }
                                  finally{ line("IF3_TEMP_FORCE_RELEASE="+c.releaseInterface(if3)); }
                              }
                          }
                      }

                      exactFingerprintOk=
                          rawFingerprintOk && if3FingerprintOk && if4FingerprintOk;

                      line("V31_EXACT_RUNTIME_FINGERPRINT_OK="+exactFingerprintOk);

                  }finally{
                      c.close();
                      updateButtons();
                  }
              }

              private void confirmStart(){
                  if(!exactFingerprintOk || sessionConn!=null || startupSent){
                      line("V31_START_BLOCKED=true");
                      return;
                  }

                  new AlertDialog.Builder(this)
                      .setTitle("Start same-session auth gate")
                      .setMessage(
                          "ส่ง startup handshake เดิม 1 ครั้ง แล้วเก็บ challenge\n"+
                          "จากนั้นจะถือ USB session เปิดไว้จนกว่าจะใส่ auth reply\n\n"+
                          "ไม่มี Feature / updater / recovery / flash")
                      .setNegativeButton("CANCEL",null)
                      .setPositiveButton("START",(d,w)->startSession())
                      .show();
              }

              private void startSession(){
                  UsbDevice target=null;
                  for(UsbDevice d:usb.getDeviceList().values())
                      if(runtime(d))target=d;

                  if(target==null || !usb.hasPermission(target)){
                      line("V31_START_ABORT_TARGET_OR_PERMISSION=true");
                      return;
                  }

                  UsbInterface vendor=null;
                  for(int i=0;i<target.getInterfaceCount();i++){
                      UsbInterface x=target.getInterface(i);
                      if(x.getInterfaceClass()==3 && x.getId()==4){
                          vendor=x;
                          break;
                      }
                  }

                  if(vendor==null){
                      line("V31_START_ABORT_IF4_MISSING=true");
                      return;
                  }

                  UsbDeviceConnection c=usb.openDevice(target);
                  if(c==null){
                      line("V31_START_OPEN_NULL=true");
                      return;
                  }

                  boolean claimed=c.claimInterface(vendor,false);
                  line("V31_IF4_CLAIM_FORCE_FALSE="+claimed);

                  if(!claimed){
                      c.close();
                      line("V31_START_ABORT_CLAIM=false");
                      return;
                  }

                  sessionDevice=target;
                  sessionIf=vendor;
                  sessionConn=c;
                  sessionClaimed=true;

                  byte[] report=new byte[256];
                  System.arraycopy(STARTUP_PREFIX,0,report,0,STARTUP_PREFIX.length);

                  int wo=sessionConn.controlTransfer(
                      0x21,0x09,0x0200,sessionIf.getId(),
                      report,report.length,1500);

                  startupSent=true;
                  line("V31_STARTUP_SET_REPORT_RESULT="+wo);
                  line("V31_STARTUP_PREFIX_HEX="+hex(STARTUP_PREFIX));

                  if(wo!=256){
                      line("V31_START_ABORT_OUTPUT_NOT_FULL=true");
                      closeSession("STARTUP_OUTPUT_FAIL");
                      return;
                  }

                  currentChallenge=null;

                  for(int n=0;n<96;n++){
                      SystemClock.sleep(n==0?50:25);

                      byte[] input=new byte[256];

                      int ri=sessionConn.controlTransfer(
                          0xA1,0x01,0x0100,sessionIf.getId(),
                          input,input.length,1000);

                      line("V31_CHALLENGE_INPUT_"+n+"_RESULT="+ri);

                      if(ri<=0)continue;

                      byte[] exact=Arrays.copyOf(input,ri);
                      boolean nonZero=false;
                      for(byte z:exact)if(z!=0){nonZero=true;break;}
                      if(!nonZero)continue;

                      int declared=exact[0]&255;
                      int take=Math.min(declared,Math.max(0,ri-1));

                      line("V31_CHALLENGE_DECLARED_LENGTH="+declared);

                      if(take==32){
                          currentChallenge=new byte[32];
                          System.arraycopy(exact,1,currentChallenge,0,32);
                          challengeReady=true;

                          String h=hex(currentChallenge);
                          line("V31_CHALLENGE_HEX="+h);
                          line("V31_CHALLENGE_SHA256="+sha256(currentChallenge));

                          challengeView.setText("\nChallenge: "+h+"\n");
                          break;
                      }
                  }

                  line("V31_CHALLENGE_READY="+challengeReady);
                  line("V31_SESSION_HELD_OPEN="+(sessionConn!=null && sessionClaimed));
                  updateButtons();
              }

              private void copyChallenge(){
                  if(!challengeReady || currentChallenge==null){
                      line("V31_COPY_CHALLENGE_BLOCKED=true");
                      return;
                  }

                  String h=hex(currentChallenge);
                  ClipboardManager cm=(ClipboardManager)getSystemService(CLIPBOARD_SERVICE);
                  cm.setPrimaryClip(ClipData.newPlainText("V31 challenge",h));
                  line("V31_CHALLENGE_COPIED=true");
              }

              private void confirmAuth(){
                  if(sessionConn==null || !sessionClaimed || !challengeReady || authSent){
                      line("V31_AUTH_BLOCKED_SESSION_STATE=true");
                      return;
                  }

                  String s=replyEdit.getText().toString().trim().replace(" ","").toUpperCase(Locale.US);

                  if(!s.matches("[0-9A-F]{8}")){
                      line("V31_AUTH_BLOCKED_BAD_HEX=true");
                      replyEdit.setError("ต้องเป็น HEX 8 ตัว");
                      return;
                  }

                  final String reply=s;

                  new AlertDialog.Builder(this)
                      .setTitle("Send challenge-specific auth reply")
                      .setMessage(
                          "จะส่ง reply "+reply+" ใน USB session ที่ยังเปิดอยู่\n"+
                          "wire framing: 05 04 "+reply.substring(0,2)+" "+reply.substring(2,4)+" "+
                          reply.substring(4,6)+" "+reply.substring(6,8)+"\n\n"+
                          "หลังจากนั้นอ่าน response เท่านั้น ไม่มี flash")
                      .setNegativeButton("CANCEL",null)
                      .setPositiveButton("SEND ONCE",(d,w)->sendAuth(reply))
                      .show();
              }

              private void sendAuth(String replyHex){
                  if(sessionConn==null || !sessionClaimed || !challengeReady || authSent){
                      line("V31_AUTH_ABORT_SESSION_STATE=true");
                      return;
                  }

                  byte[] reply=hexToBytes(replyHex);
                  byte[] report=new byte[256];

                  report[0]=0x05;
                  report[1]=0x04;
                  System.arraycopy(reply,0,report,2,4);

                  line("V31_AUTH_RAW_REPLY_HEX="+replyHex);
                  line("V31_AUTH_ANDROID_WIRE_PREFIX_HEX="+
                      hex(Arrays.copyOf(report,6)));

                  int wo=sessionConn.controlTransfer(
                      0x21,0x09,0x0200,sessionIf.getId(),
                      report,report.length,1500);

                  authSent=true;
                  line("V31_AUTH_SET_REPORT_RESULT="+wo);

                  if(wo!=256){
                      line("V31_AUTH_ABORT_OUTPUT_NOT_FULL=true");
                      closeSession("AUTH_OUTPUT_FAIL");
                      return;
                  }

                  int nonZeroCount=0;
                  int idleAfterMinimum=0;
                  final int minimumReports=79;
                  final int maximumReports=90;

                  line("V31_EXPECTED_DEVICE_DESCRIPTION_DECODED_BYTES=18261");
                  line("V31_MINIMUM_POST_AUTH_REPORT_TARGET="+minimumReports);
                  line("V31_MAXIMUM_POST_AUTH_REPORT_TARGET="+maximumReports);

                  for(int n=0;n<240;n++){
                      SystemClock.sleep(n==0?50:20);

                      byte[] input=new byte[256];

                      int ri=sessionConn.controlTransfer(
                          0xA1,0x01,0x0100,sessionIf.getId(),
                          input,input.length,500);

                      line("V31_POST_AUTH_INPUT_"+n+"_RESULT="+ri);

                      if(ri<=0){
                          if(nonZeroCount>=minimumReports){
                              idleAfterMinimum++;
                              line("V31_IDLE_AFTER_MINIMUM="+idleAfterMinimum);
                              if(idleAfterMinimum>=8)break;
                          }
                          continue;
                      }

                      byte[] exact=Arrays.copyOf(input,ri);
                      boolean nonZero=false;
                      for(byte z:exact)if(z!=0){nonZero=true;break;}

                      if(!nonZero){
                          if(nonZeroCount>=minimumReports){
                              idleAfterMinimum++;
                              line("V31_ZERO_AFTER_MINIMUM="+idleAfterMinimum);
                              if(idleAfterMinimum>=8)break;
                          }
                          continue;
                      }

                      idleAfterMinimum=0;
                      nonZeroCount++;

                      line("V31_POST_AUTH_REPORT_"+nonZeroCount+"_SHA256="+sha256(exact));
                      line("V31_POST_AUTH_REPORT_"+nonZeroCount+"_HEX="+hex(exact));

                      int declared=exact[0]&255;
                      int take=Math.min(declared,Math.max(0,ri-1));

                      line("V31_POST_AUTH_REPORT_"+nonZeroCount+"_DECLARED_LENGTH="+declared);

                      if(take>0){
                          byte[] payload=new byte[take];
                          System.arraycopy(exact,1,payload,0,take);
                          line("V31_POST_AUTH_REPORT_"+nonZeroCount+"_PAYLOAD_HEX="+hex(payload));
                      }

                      if(nonZeroCount>=maximumReports)break;
                  }

                  line("V31_POST_AUTH_NONZERO_REPORT_COUNT="+nonZeroCount);
                  line("V31_MINIMUM_REPORT_TARGET_REACHED="+(nonZeroCount>=minimumReports));
                  line("V31_DEVICE_RESPONSE_SEEN="+(nonZeroCount>0));
                  line("V31_FEATURE_REPORT_USED=false");
                  line("V31_FLASH_WRITE_ERASE_RECOVERY=false");

                  updateButtons();
              }

              private void closeSession(String why){
                  line("V31_CLOSE_SESSION_REASON="+why);

                  if(sessionConn!=null){
                      if(sessionClaimed && sessionIf!=null){
                          try{
                              line("V31_IF4_RELEASE="+sessionConn.releaseInterface(sessionIf));
                          }catch(Exception ex){
                              line("V31_RELEASE_EXCEPTION="+ex.getClass().getName());
                          }
                      }

                      try{ sessionConn.close(); }catch(Exception ignored){}
                  }

                  sessionConn=null;
                  sessionIf=null;
                  sessionDevice=null;
                  sessionClaimed=false;

                  line("V31_SESSION_HELD_OPEN=false");
                  updateButtons();
              }

              private void saveEvidence(){
                  Intent i=new Intent(Intent.ACTION_CREATE_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("text/plain");
                  i.putExtra(
                      Intent.EXTRA_TITLE,
                      "OKN_BP1048P4_V31_SAME_SESSION_AUTH_EVIDENCE.txt");

                  startActivityForResult(i,SAVE_EVIDENCE);
              }

              @Override protected void onActivityResult(
                  int requestCode,int resultCode,Intent data){

                  super.onActivityResult(requestCode,resultCode,data);

                  if(requestCode==SAVE_EVIDENCE &&
                     resultCode==RESULT_OK && data!=null){

                      try(OutputStream os=
                          getContentResolver().openOutputStream(data.getData())){

                          String footer=
                              "\nEXPORT_EXACT_RUNTIME_FINGERPRINT_OK="+exactFingerprintOk+
                              "\nEXPORT_STARTUP_SENT="+startupSent+
                              "\nEXPORT_CHALLENGE_READY="+challengeReady+
                              "\nEXPORT_AUTH_SENT="+authSent+
                              "\nEXPORT_FEATURE_REPORT_USED=false"+
                              "\nEXPORT_FLASH_WRITE_ERASE_RECOVERY=false"+
                              "\nEXPORT_FLASH_ALLOWED=NO\n";

                          os.write(
                              (evidence.toString()+footer)
                              .getBytes(StandardCharsets.UTF_8));

                          line("EVIDENCE_EXPORT_OK=true");

                      }catch(Exception ex){
                          line("EVIDENCE_EXPORT_ERROR="+ex);
                      }
                  }
              }

              private static byte[] hexToBytes(String s){
                  byte[] b=new byte[s.length()/2];
                  for(int i=0;i<b.length;i++)
                      b[i]=(byte)Integer.parseInt(s.substring(i*2,i*2+2),16);
                  return b;
              }

              private static String hex(byte[] b){
                  StringBuilder s=new StringBuilder(b.length*2);
                  for(byte x:b)s.append(String.format(Locale.US,"%02X",x&255));
                  return s.toString();
              }

              private static String sha256(byte[] b){
                  try{
                      MessageDigest md=MessageDigest.getInstance("SHA-256");
                      return hex(md.digest(b));
                  }catch(Exception e){
                      return "SHA256_ERROR";
                  }
              }

              @Override protected void onDestroy(){
                  closeSession("ACTIVITY_DESTROY");
                  try{unregisterReceiver(permissionRx);}catch(Exception ignored){}
                  try{unregisterReceiver(usbRx);}catch(Exception ignored){}
                  super.onDestroy();
              }
          }
