  compute-auth-reply:
    name: Compute challenge-specific reply with official vendor parser OFFLINE
    if: ${{ inputs.challenge_hex != '' }}
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Validate challenge and safety
        shell: pwsh
        env:
          CHALLENGE_HEX: ${{ inputs.challenge_hex }}
        run: |
          $ErrorActionPreference="Stop"

          foreach($n in @(
            "FLASH_ALLOWED","ERASE_ALLOWED","FIRMWARE_WRITE_ALLOWED",
            "FEATURE_REPORT_ALLOWED","UPDATE_COMMAND_ALLOWED","RECOVERY_COMMAND_ALLOWED"
          )){
            if((Get-Item "Env:$n").Value -ne "NO"){ throw "$n must be NO" }
          }

          $c=$env:CHALLENGE_HEX.Trim().Replace(" ","").ToUpperInvariant()
          if($c -notmatch '^[0-9A-F]{64}$'){
            throw "challenge_hex must be exactly 64 hex chars (32 bytes)"
          }

          $root="C:\okn_v31oracle"
          if(Test-Path $root){Remove-Item -Recurse -Force $root}
          New-Item -ItemType Directory -Force -Path `
            "$root\download","$root\pkg","$root\harness","$root\out" | Out-Null

          $c | Set-Content "$root\challenge.txt"

      - name: Acquire exact official vendor binary
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v31oracle"

          curl.exe -fL --retry 6 --retry-all-errors --retry-delay 2 `
            --connect-timeout 20 --max-time 300 `
            $env:GOLOPINE_WINDOWS_URL -o "$root\download\vendor.zip"
          if($LASTEXITCODE -ne 0){throw "vendor download failed"}

          Expand-Archive -Force "$root\download\vendor.zip" "$root\pkg"

          $exe=Get-ChildItem "$root\pkg" -Recurse -File -Filter *.exe |
            Where-Object {$_.FullName -notmatch '\\__MACOSX\\' -and $_.Name -notlike '._*'} |
            Sort-Object Length -Descending | Select-Object -First 1

          if(-not $exe){throw "vendor EXE missing"}
          Copy-Item $exe.FullName "$root\vendor.exe" -Force

          $sha=(Get-FileHash "$root\vendor.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne $env:EXPECTED_VENDOR_SHA256){throw "vendor SHA changed"}

      - name: Build offline parser oracle
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v31oracle"

          @'
          using System;
          using System.IO;
          using System.Linq;
          using System.Reflection;
          using System.Reflection.Emit;
          using System.Runtime.CompilerServices;
          using System.Collections.Generic;
          using System.Threading;

          public static class Sink
          {
              public static readonly List<byte[]> Writes=new List<byte[]>();
              public static void Clear(){lock(Writes){Writes.Clear();}}
              public static void Record(byte[] b){
                  lock(Writes){Writes.Add(b==null?null:(byte[])b.Clone());}
              }
              public static byte[][] Snapshot(){
                  lock(Writes){return Writes.Select(x=>x==null?null:(byte[])x.Clone()).ToArray();}
              }
          }

          public static class Oracle
          {
              static string Hex(byte[] b){
                  return b==null?"<NULL>":BitConverter.ToString(b).Replace("-","");
              }

              static byte[] FromHex(string s){
                  byte[] b=new byte[s.Length/2];
                  for(int i=0;i<b.Length;i++)b[i]=Convert.ToByte(s.Substring(i*2,2),16);
                  return b;
              }

              static object InvokeBounded(MethodInfo m,object target,object[] args,int ms){
                  object result=null; Exception error=null;
                  Thread t=new Thread(delegate(){
                      try{result=m.Invoke(target,args);}catch(Exception ex){error=ex;}
                  });
                  t.IsBackground=true;t.Start();
                  if(!t.Join(ms)){try{t.Abort();}catch{};return null;}
                  if(error!=null)throw error;
                  return result;
              }

              static void DefaultRet(ILGenerator il,Type ret){
                  if(ret==typeof(void)){il.Emit(OpCodes.Ret);return;}
                  if(ret.IsValueType){
                      LocalBuilder l=il.DeclareLocal(ret);
                      il.Emit(OpCodes.Ldloca_S,l);il.Emit(OpCodes.Initobj,ret);
                      il.Emit(OpCodes.Ldloc,l);il.Emit(OpCodes.Ret);return;
                  }
                  il.Emit(OpCodes.Ldnull);il.Emit(OpCodes.Ret);
              }

              static MethodAttributes Vis(MethodInfo m){
                  MethodAttributes a=MethodAttributes.Virtual|MethodAttributes.HideBySig;
                  if(m.IsPublic)a|=MethodAttributes.Public;
                  else if(m.IsFamily)a|=MethodAttributes.Family;
                  else if(m.IsAssembly)a|=MethodAttributes.Assembly;
                  else a|=MethodAttributes.Private;
                  if(m.IsSpecialName)a|=MethodAttributes.SpecialName;
                  return a;
              }

              static Type CaptureType(Type baseType){
                  AssemblyBuilder ab=AppDomain.CurrentDomain.DefineDynamicAssembly(
                      new AssemblyName("OKN_V31_CAPTURE"),AssemblyBuilderAccess.Run);
                  TypeBuilder tb=ab.DefineDynamicModule("main").DefineType(
                      "OKN.CaptureStream",TypeAttributes.Public|TypeAttributes.Class,baseType);

                  ConstructorInfo bc=baseType.GetConstructor(
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance,
                      null,Type.EmptyTypes,null);

                  ConstructorBuilder cb=tb.DefineConstructor(
                      MethodAttributes.Public,CallingConventions.Standard,Type.EmptyTypes);
                  ILGenerator ci=cb.GetILGenerator();
                  ci.Emit(OpCodes.Ldarg_0);ci.Emit(OpCodes.Call,bc);ci.Emit(OpCodes.Ret);

                  foreach(MethodInfo m in baseType.GetMethods(
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance)
                      .Where(m=>m.IsVirtual&&!m.IsFinal&&
                          (m.IsAbstract||m.Name=="Write"||m.Name=="ReadBytes"||
                           m.Name=="ReadLine"||m.Name=="Connect"||m.Name=="Disconnect"))
                      .GroupBy(m=>m.ToString()).Select(g=>g.First()))
                  {
                      Type[] ps=m.GetParameters().Select(x=>x.ParameterType).ToArray();
                      MethodBuilder b=tb.DefineMethod(m.Name,Vis(m),m.ReturnType,ps);
                      ILGenerator il=b.GetILGenerator();

                      if(m.Name=="Write"&&ps.Length==1&&ps[0]==typeof(byte[])){
                          il.Emit(OpCodes.Ldarg_1);
                          il.Emit(OpCodes.Call,typeof(Sink).GetMethod("Record"));
                          DefaultRet(il,m.ReturnType);
                      }else DefaultRet(il,m.ReturnType);

                      tb.DefineMethodOverride(b,m);
                  }

                  return tb.CreateType();
              }

              static void Connected(object stream,Type baseType){
                  Type e=baseType.GetNestedType("ConnectionStatus",
                      BindingFlags.Public|BindingFlags.NonPublic);
                  object v=Enum.Parse(e,"Connected");
                  FieldInfo f=baseType.GetFields(
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance)
                      .FirstOrDefault(x=>x.FieldType==e);
                  if(f!=null){f.SetValue(stream,v);return;}
                  MethodInfo m=baseType.GetMethod("UpdateDeviceConnStatus",
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance);
                  m.Invoke(stream,new object[]{v});
              }

              static string Status(object bridge,Type t){
                  PropertyInfo p=t.GetProperty("StreamStatus",
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance);
                  if(p!=null){
                      object v=p.GetValue(bridge,null);
                      if(v!=null)return v.ToString();
                  }
                  return "<UNKNOWN>";
              }

              public static void Main(string[] a){
                  string exe=Path.GetFullPath(a[0]);
                  string challengeHex=a[1];
                  string outFile=Path.GetFullPath(a[2]);
                  Directory.SetCurrentDirectory(Path.GetDirectoryName(exe));

                  Assembly asm=Assembly.LoadFile(exe);
                  RuntimeHelpers.RunModuleConstructor(asm.ManifestModule.ModuleHandle);

                  Type baseType=asm.GetType("DSTech_AudioDSP_Client.DeviceCommunicationStream",true);
                  Type bridgeType=asm.GetType("DSTech_AudioDSP_Client.UFEcommandBridge",true);
                  Type cap=CaptureType(baseType);

                  object stream=Activator.CreateInstance(cap);
                  Connected(stream,baseType);

                  object bridge=bridgeType.GetConstructor(new[]{baseType}).Invoke(new[]{stream});

                  MethodInfo req=bridgeType.GetMethod("SendDevTypeSwVersAuthenRequest",
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance);

                  Sink.Clear();
                  InvokeBounded(req,bridge,null,1500);
                  Thread.Sleep(80);
                  Sink.Clear();

                  MethodInfo fbl=bridgeType.GetMethod("FBL3HEmTva",
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance);

                  byte[] challenge=FromHex(challengeHex);

                  InvokeBounded(fbl,bridge,new object[]{stream,challenge,EventArgs.Empty},3000);
                  Thread.Sleep(150);

                  byte[][] w=Sink.Snapshot();
                  string status=Status(bridge,bridgeType);

                  if(w.Length<1||w[0]==null||w[0].Length!=4||
                     status!="UFE_STREAM_GETTING_DEVICE_DESCRIPTION")
                      Environment.Exit(2);

                  string reply=Hex(w[0]);
                  string wire="0504"+reply;

                  File.WriteAllText(outFile,
                      "CHALLENGE_HEX="+challengeHex+Environment.NewLine+
                      "AUTH_REPLY_HEX="+reply+Environment.NewLine+
                      "ANDROID_WIRE_HEX="+wire+Environment.NewLine+
                      "POST_AUTH_STREAM_STATUS="+status+Environment.NewLine+
                      "REAL_HID_IO=NO"+Environment.NewLine+
                      "FLASH_ALLOWED=NO"+Environment.NewLine);

                  Console.WriteLine("AUTH_REPLY_HEX="+reply);
                  Console.WriteLine("ANDROID_WIRE_HEX="+wire);
                  Console.WriteLine("POST_AUTH_STREAM_STATUS="+status);
                  Environment.Exit(0);
              }
          }
          '@ | Set-Content "$root\harness\Oracle.cs"

          $csc="$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          & $csc /nologo /platform:x86 /target:exe `
            /out:"$root\harness\Oracle.exe" "$root\harness\Oracle.cs"
          if($LASTEXITCODE -ne 0){throw "oracle compile failed"}

      - name: Compute reply
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v31oracle"
          $c=(Get-Content "$root\challenge.txt" -Raw).Trim()

          & "$root\harness\Oracle.exe" `
            "$root\vendor.exe" `
            "$c" `
            "$root\out\V31_AUTH_REPLY.txt"

          if($LASTEXITCODE -ne 0){throw "vendor parser oracle failed"}

          $r=Get-Content "$root\out\V31_AUTH_REPLY.txt" -Raw

          $reply=[regex]::Match($r,'AUTH_REPLY_HEX=([0-9A-F]{8})').Groups[1].Value
          $wire=[regex]::Match($r,'ANDROID_WIRE_HEX=([0-9A-F]{12})').Groups[1].Value

          if(-not $reply -or -not $wire){throw "reply parse failed"}

          @"
          # V31 SAME-SESSION AUTH REPLY

          Challenge: `$c`

          **AUTH_REPLY_HEX: `$reply`**

          Android wire prefix: `$wire`

          Return to the still-open V31 app session, paste only the 8-character
          AUTH_REPLY_HEX, then press SEND AUTH REPLY + CAPTURE DEVICE RESPONSE.

          Do not disconnect the USB-C cable and do not restart the app before sending.
          Flash remains disabled.
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Upload challenge-specific reply
        uses: actions/upload-artifact@v7
        with:
          name: OKN-BP1048P4-V31-CHALLENGE-SPECIFIC-AUTH-REPLY
          path: C:\okn_v31oracle\out\V31_AUTH_REPLY.txt
          if-no-files-found: error
          retention-days: 7

      - name: Final oracle fail-closed assertion
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v31oracle"

          $r=Get-Content "$root\out\V31_AUTH_REPLY.txt" -Raw
          if($r -notmatch 'REAL_HID_IO=NO'){throw "bad HID state"}
          if($r -notmatch 'FLASH_ALLOWED=NO'){throw "bad flash state"}

          "V31_ORACLE=PASS"
          "REAL_HID_IO=NO"
          "FLASH_ALLOWED=NO"
