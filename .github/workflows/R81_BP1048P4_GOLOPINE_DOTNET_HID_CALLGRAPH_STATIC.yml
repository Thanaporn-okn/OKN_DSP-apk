name: R81 BP1048P4 GoloPine .NET HID callgraph static reverse

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R81_BP1048P4_GOLOPINE_DOTNET_HID_CALLGRAPH_STATIC.yml"

permissions:
  contents: read

concurrency:
  group: r81-bp1048p4-golopine-dotnet-hid-callgraph-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLOPINE_PACKAGE_URL: https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-08.exe_.zip
  EXPECTED_EXE_NAME: golopine_audio_turning_release_2026-04-08.exe
  EXPECTED_EXE_SIZE: "3307008"
  EXPECTED_EXE_SHA256: 3ca54171c53f7badd963ffe6851b8b3e2faf8aee8ba2afcb7040990e22ae09b2

jobs:
  static-dotnet-reverse:
    name: Static .NET IL / HID callgraph / resource carve ONLY - NO USB - NO FLASH
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Declare immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/R81_SAFETY.txt <<'EOF'
          R81_MODE=STATIC_OFFLINE_ONLY
          R81_TARGET_BINARY_EXECUTED=NO
          R81_WINE_MONO_DOTNET_TARGET_EXECUTION=NO
          R81_BOARD_USB_ACCESSED=NO
          R81_AA55_SENT=NO
          R81_LINEIN_AA55_SENT=NO
          R81_RUNTIME_0X11_SENT=NO
          R81_LEGACY_FLASHBOOT_COMMANDS_SENT=NO
          R81_FLASH_READ_EXECUTED=NO
          R81_FLASH_ERASE_EXECUTED=NO
          R81_FLASH_WRITE_EXECUTED=NO
          R81_REFERENCE_0000_2244_ASSUMED_PRODUCTION=NO
          R81_BP1048B2_TOOL_USED_ON_BP1048P4=NO
          FLASH_ALLOWED=NO
          EOF
          cat /tmp/R81_SAFETY.txt

      - name: Download and pin official production client
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/r81 && mkdir -p /tmp/r81/extract
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 \
            "$GOLOPINE_PACKAGE_URL" -o /tmp/r81/pkg.zip
          unzip -q /tmp/r81/pkg.zip -d /tmp/r81/extract
          EXE="$(find /tmp/r81/extract -type f -name "$EXPECTED_EXE_NAME" -print -quit)"
          test -n "$EXE" -a -f "$EXE"
          chmod a-x "$EXE" || true
          SIZE="$(stat -c '%s' "$EXE")"
          SHA="$(sha256sum "$EXE" | awk '{print $1}')"
          test "$SIZE" = "$EXPECTED_EXE_SIZE"
          test "$SHA" = "$EXPECTED_EXE_SHA256"
          {
            echo "R81_EXE_NAME=$(basename "$EXE")"
            echo "R81_EXE_SIZE=$SIZE"
            echo "R81_EXE_SHA256=$SHA"
            echo "R81_SHA256_PIN_MATCH=YES"
          } | tee /tmp/R81_BINARY_PIN.txt
          echo "exe=$EXE" >> "$GITHUB_OUTPUT"

      - name: Install static .NET disassembler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mono-utils >/dev/null
          command -v monodis | tee /tmp/R81_MONODIS_PATH.txt
          monodis --version 2>&1 | head -n 5 | tee /tmp/R81_MONODIS_VERSION.txt || true

      - name: Static CLR metadata and IL extraction - never execute target
        shell: bash
        run: |
          set -euo pipefail
          EXE='${{ steps.pin.outputs.exe }}'
          file "$EXE" | tee /tmp/R81_FILETYPE.txt
          objdump -x "$EXE" > /tmp/R81_OBJDUMP_X.txt 2>&1 || true
          monodis --assembly "$EXE" > /tmp/R81_ASSEMBLY.txt 2>&1 || true
          monodis --assemblyref "$EXE" > /tmp/R81_ASSEMBLYREF.txt 2>&1 || true
          monodis --module "$EXE" > /tmp/R81_MODULE.txt 2>&1 || true
          monodis --manifest "$EXE" > /tmp/R81_MANIFEST.txt 2>&1 || true
          monodis --typedef "$EXE" > /tmp/R81_TYPEDEF.txt 2>&1 || true
          monodis --method "$EXE" > /tmp/R81_METHODS.txt 2>&1 || true
          monodis --implmap "$EXE" > /tmp/R81_IMPLMAP.txt 2>&1 || true
          monodis --userstrings "$EXE" > /tmp/R81_USERSTRINGS.txt 2>&1 || true
          monodis "$EXE" > /tmp/R81_FULL_IL.txt 2>/tmp/R81_MONODIS_IL_STDERR.txt || true
          wc -l /tmp/R81_FULL_IL.txt /tmp/R81_IMPLMAP.txt /tmp/R81_USERSTRINGS.txt | tee /tmp/R81_IL_COUNTS.txt

      - name: Extract HID PInvoke callers and nearby report construction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          ilp=Path('/tmp/R81_FULL_IL.txt')
          text=ilp.read_text('utf-8',errors='replace') if ilp.exists() else ''
          lines=text.splitlines()
          needles=[
            'HidD_SetFeature','HidD_GetInputReport','HidD_GetAttributes',
            'HidD_GetSerialNumberString','HidD_GetPreparsedData','HidP_GetCaps',
            'SetupDiGetClassDevs','SetupDiEnumDeviceInterfaces',
            'SetupDiGetDeviceInterfaceDetail','CreateFile','getFeature'
          ]

          # Build method ranges from IL method headers/end markers.
          ranges=[]
          starts=[]
          for i,l in enumerate(lines):
            if re.match(r'^\s*\.method\b',l): starts.append(i)
          for si,s in enumerate(starts):
            e=(starts[si+1]-1) if si+1<len(starts) else len(lines)-1
            ranges.append((s,e))

          def method_for(idx):
            for s,e in ranges:
              if s<=idx<=e: return s,e
            return max(0,idx-50),min(len(lines)-1,idx+50)

          out=[]; seen=set(); hit_summary=[]
          for needle in needles:
            hits=[i for i,l in enumerate(lines) if needle.casefold() in l.casefold()]
            hit_summary.append(f'{needle}={len(hits)}')
            for i in hits:
              s,e=method_for(i)
              key=(s,e)
              if key in seen: continue
              seen.add(key)
              out.append(f'===== METHOD_LINES_{s+1}_{e+1} MATCH={needle} =====')
              # keep bounded excerpt, but enough to capture array/report construction
              if e-s>320:
                a=max(s,i-140); b=min(e,i+180)
              else:
                a=s; b=e
              for n in range(a,b+1):
                out.append(f'{n+1:07d}: {lines[n]}')
              out.append('')

          Path('/tmp/R81_HID_CALLER_XREF.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          Path('/tmp/R81_HID_CALL_COUNTS.txt').write_text('\n'.join(hit_summary)+'\n',encoding='utf-8')

          # Interesting constants are evidence only, never transmitted.
          const_patterns={
            'CONST_AA': r'(?i)(?:ldc\.i4(?:\.s)?\s+(?:0x)?(?:aa|170)\b|\b0xAA\b)',
            'CONST_55': r'(?i)(?:ldc\.i4(?:\.s)?\s+(?:0x)?(?:55|85)\b|\b0x55\b)',
            'CONST_11': r'(?i)(?:ldc\.i4(?:\.s)?\s+(?:0x)?(?:11|17)\b|\b0x11\b)',
            'CONST_FF': r'(?i)(?:ldc\.i4(?:\.s)?\s+(?:0x)?(?:ff|255)\b|\b0xFF\b)',
          }
          c=[]
          for name,pat in const_patterns.items():
            rx=re.compile(pat)
            idx=[i for i,l in enumerate(lines) if rx.search(l)]
            c.append(f'{name}_IL_HITS={len(idx)}')
            for i in idx[:100]:
              lo=max(0,i-4); hi=min(len(lines),i+5)
              c.append(f'--- {name} line {i+1} ---')
              c.extend(f'{n+1:07d}: {lines[n]}' for n in range(lo,hi))
          Path('/tmp/R81_CONSTANT_CONTEXT.txt').write_text('\n'.join(c)+'\n',encoding='utf-8')
          PY

      - name: Parse PE sections and carve embedded resource signatures
        shell: bash
        run: |
          set -euo pipefail
          EXE='${{ steps.pin.outputs.exe }}'
          python3 - "$EXE" <<'PY'
          from pathlib import Path
          import sys,struct,hashlib,math,re
          p=Path(sys.argv[1]); b=p.read_bytes()
          out=[]
          if b[:2]!=b'MZ': raise SystemExit('not MZ')
          peoff=struct.unpack_from('<I',b,0x3c)[0]
          if b[peoff:peoff+4]!=b'PE\0\0': raise SystemExit('not PE')
          coff=peoff+4
          machine,nsec,ts,ptrsym,nsym,opt_size,chars=struct.unpack_from('<HHIIIHH',b,coff)
          opt=coff+20; sect=opt+opt_size
          out.append(f'PE_OFFSET=0x{peoff:x}')
          out.append(f'SECTION_COUNT={nsec}')
          for i in range(nsec):
            off=sect+i*40
            name=b[off:off+8].split(b'\0',1)[0].decode('ascii','replace')
            vsize,vaddr,rawsize,rawptr=struct.unpack_from('<IIII',b,off+8)
            blob=b[rawptr:rawptr+rawsize]
            if blob:
              counts={x:blob.count(bytes([x])) for x in set(blob)}
              ent=-sum((c/len(blob))*math.log2(c/len(blob)) for c in counts.values())
            else: ent=0
            out.append(f'SECTION[{i}] name={name} VA=0x{vaddr:x} VSIZE=0x{vsize:x} RAW=0x{rawptr:x}+0x{rawsize:x} entropy={ent:.4f} sha256={hashlib.sha256(blob).hexdigest()}')
          Path('/tmp/R81_PE_SECTIONS.txt').write_text('\n'.join(out)+'\n')

          sigs={
            'ZIP':b'PK\x03\x04','7Z':bytes.fromhex('377abcaf271c'),'GZIP':bytes.fromhex('1f8b08'),
            'RAR4':b'Rar!\x1a\x07\x00','RAR5':b'Rar!\x1a\x07\x01\x00','PNG':bytes.fromhex('89504e470d0a1a0a'),
            'MZ':b'MZ','MVA_MAGIC':bytes.fromhex('4d56b158')
          }
          s=[]
          for name,magic in sigs.items():
            pos=0; offs=[]
            while True:
              x=b.find(magic,pos)
              if x<0: break
              offs.append(x); pos=x+1
              if len(offs)>=500: break
            s.append(f'{name}_COUNT={len(offs)}')
            if offs: s.append(f'{name}_OFFSETS=' + ','.join(hex(x) for x in offs[:200]))
          Path('/tmp/R81_CARVE_SIGNATURES.txt').write_text('\n'.join(s)+'\n')
          PY

      - name: Produce R81 evidence-only decision
        shell: bash
        run: |
          set -euo pipefail
          HID_SET="$(grep -E '^HidD_SetFeature=' /tmp/R81_HID_CALL_COUNTS.txt | cut -d= -f2 || echo 0)"
          HID_IN="$(grep -E '^HidD_GetInputReport=' /tmp/R81_HID_CALL_COUNTS.txt | cut -d= -f2 || echo 0)"
          IL_LINES="$(wc -l < /tmp/R81_FULL_IL.txt || echo 0)"
          cat > /tmp/R81_DECISION.txt <<EOF
          R81_PINNED_PRODUCTION_CLIENT=YES
          R81_DOTNET_IL_LINES=$IL_LINES
          R81_HIDD_SETFEATURE_IL_REFERENCES=$HID_SET
          R81_HIDD_GETINPUTREPORT_IL_REFERENCES=$HID_IN
          R81_HID_CALLGRAPH_EVIDENCE_FILE=R81_HID_CALLER_XREF.txt
          R81_CONSTANT_CONTEXT_IS_STATIC_ONLY=YES
          R81_NO_PACKET_IS_AUTHORIZED_FOR_BOARD_TRANSMISSION=YES
          R81_BOOT_ENTRY_PROVEN=NO
          R81_RECOVERY_USB_IDENTITY_PROVEN=NO
          R81_SAFE_READONLY_IDENTIFY_PROVEN=NO
          R81_NEXT=ANALYZE_HID_CALLER_XREF_AND_REPORT_CONSTRUCTION_OFFLINE
          FLASH_ALLOWED=NO
          EOF
          cat /tmp/R81_DECISION.txt

      - name: Build evidence bundle without vendor EXE or full IL
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/R81_BP1048P4_GOLOPINE_DOTNET_HID_CALLGRAPH_EVIDENCE
          rm -rf "$OUT" && mkdir -p "$OUT"
          for f in \
            R81_SAFETY.txt R81_BINARY_PIN.txt R81_MONODIS_PATH.txt R81_MONODIS_VERSION.txt \
            R81_FILETYPE.txt R81_ASSEMBLY.txt R81_ASSEMBLYREF.txt R81_MODULE.txt \
            R81_MANIFEST.txt R81_TYPEDEF.txt R81_METHODS.txt R81_IMPLMAP.txt \
            R81_IL_COUNTS.txt R81_MONODIS_IL_STDERR.txt R81_HID_CALL_COUNTS.txt \
            R81_HID_CALLER_XREF.txt R81_CONSTANT_CONTEXT.txt R81_PE_SECTIONS.txt \
            R81_CARVE_SIGNATURES.txt R81_DECISION.txt; do
            test -f "/tmp/$f" && cp "/tmp/$f" "$OUT/"
          done
          cat > "$OUT/README.txt" <<'EOF'
          R81 is STATIC OFFLINE reverse evidence from the pinned current GoloPine production client.
          The target EXE was NEVER executed. No board/USB access occurred. No flash read/erase/write occurred.
          Full vendor IL and vendor EXE are deliberately excluded from the artifact; only bounded call-site evidence and metadata are retained.
          Any AA/55/11/FF constants in evidence are static observations only and are NOT authorized to transmit.
          FLASH_ALLOWED=NO.
          EOF
          (cd /tmp && zip -qr R81_BP1048P4_GOLOPINE_DOTNET_HID_CALLGRAPH_EVIDENCE.zip "$(basename "$OUT")")
          sha256sum /tmp/R81_BP1048P4_GOLOPINE_DOTNET_HID_CALLGRAPH_EVIDENCE.zip | tee /tmp/R81_EVIDENCE_ZIP_SHA256.txt

      - name: Upload R81 evidence
        uses: actions/upload-artifact@v4
        with:
          name: R81-BP1048P4-GOLOPINE-DOTNET-HID-CALLGRAPH-EVIDENCE
          path: |
            /tmp/R81_BP1048P4_GOLOPINE_DOTNET_HID_CALLGRAPH_EVIDENCE.zip
            /tmp/R81_EVIDENCE_ZIP_SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Final safety gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'R81_TARGET_BINARY_EXECUTED=NO' /tmp/R81_SAFETY.txt
          grep -F 'R81_BOARD_USB_ACCESSED=NO' /tmp/R81_SAFETY.txt
          grep -F 'R81_FLASH_WRITE_EXECUTED=NO' /tmp/R81_SAFETY.txt
          grep -F 'R81_FLASH_ERASE_EXECUTED=NO' /tmp/R81_SAFETY.txt
          grep -F 'FLASH_ALLOWED=NO' /tmp/R81_SAFETY.txt
          cat /tmp/R81_HID_CALL_COUNTS.txt
          cat /tmp/R81_DECISION.txt
          echo 'R81_STATIC_REVERSE_COMPLETE=YES'
          echo 'FLASH_ALLOWED=NO'
