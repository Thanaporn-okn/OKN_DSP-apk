          WPM_WRITES=[]
          GLOBAL_NESTED_SWITCHES=[]
          GLOBAL_SNAPSHOTS=[]
          UNKNOWN_CALLS=[]
          KEY_WRITE_EVENTS=[]
          PARSER_VIOLATIONS=[]
