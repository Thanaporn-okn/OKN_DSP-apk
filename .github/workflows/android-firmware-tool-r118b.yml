              if p.region=="array" and isinstance(p.buf,(bytes,bytearray)):
                  off=p.offset
                  if 0<=off and off+n<=len(p.buf):
                      return bytes(p.buf[off:off+n])
              return None

          def provenance_context(s):
              readers={}
              for i,v in enumerate(s.locals):
                  if isinstance(v,Reader): readers[str(i)]=v.s.pos
              return {
                  "step":s.steps,
                  "current_main_state":s.statics.get("__last_main_state"),
                  "reader_positions":readers,
              }

          def ptr_write(s,p,data,source="unknown"):
              if isinstance(p,LocalRef):
