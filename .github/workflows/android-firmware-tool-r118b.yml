          class Ptr:
              def __init__(self,region,offset=0,buf=None):
                  self.region=region
                  self.offset=int(offset)
                  self.buf=buf
              def __repr__(self):
                  return f"Ptr({self.region},{self.offset:#x})"

          class LocalRef:
              def __init__(self,index): self.index=int(index)
              def __repr__(self): return f"LocalRef({self.index})"

          class FieldRef:
