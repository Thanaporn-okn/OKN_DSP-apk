          RM=json.loads((OUT/"evidence/10_RESOURCE_MAP.json").read_text())
          RESOURCE_BY_NAME={r["name"]:(OUT/"resources"/r["file"]).read_bytes() for r in RM}

          # Exact self-assembly public-key token reconstructed from the static IL
          # .publickey blob. Assembly.GetName().GetPublicKeyToken() is used by the
          # protector before the stage1 transform; R118 incorrectly left this as
          # UNKNOWN and also failed to model the adjacent Array.Reverse call.
          ALL_IL=(OUT/"il/all.il").read_text(errors="ignore")
          OFFICIAL_PUBLIC_KEY_TOKEN=b""
          asm_match=re.search(r'(?ms)^\.assembly\s+(?!extern\b)[^\n{]+\{(.*?)^\}',ALL_IL)
          if asm_match:
              pk_match=re.search(r'(?is)\.publickey\s*=\s*\((.*?)\)',asm_match.group(1))
              if pk_match:
                  hx=re.sub(r'[^0-9A-Fa-f]','',pk_match.group(1))
                  if hx and len(hx)%2==0:
                      pk=bytes.fromhex(hx)
                      OFFICIAL_PUBLIC_KEY_TOKEN=hashlib.sha1(pk).digest()[-8:][::-1]

          # Static PE image model. This is only a bytearray representation of the
          # official EXE on the runner; the target executable is never started.
          PE=pefile.PE(str(OUT/"dstech.exe"),fast_load=False)
          MODULE_BASE=int(PE.OPTIONAL_HEADER.ImageBase)
          MODULE_SIZE=int(PE.OPTIONAL_HEADER.SizeOfImage)
          MODULE_IMAGE=bytearray(MODULE_SIZE)
          RAW_EXE=(OUT/"dstech.exe").read_bytes()
          hdr=min(len(RAW_EXE),int(PE.OPTIONAL_HEADER.SizeOfHeaders))
          MODULE_IMAGE[:hdr]=RAW_EXE[:hdr]
          for sec in PE.sections:
              va=int(sec.VirtualAddress)
              data=sec.get_data()
              end=min(MODULE_SIZE,va+len(data))
              if 0<=va<end:
                  MODULE_IMAGE[va:end]=data[:end-va]
          MODULE_WRITES=[]

          class U:
              def __init__(self,name="unknown"): self.name=name
              def __repr__(self): return f"U({self.name})"
          def unk(v): return isinstance(v,U)

          class Stream:
              def __init__(self,data=b""): self.data=bytes(data); self.pos=0
          class Reader:
              def __init__(self,s): self.s=s
          class SymAlg:
              def __init__(self): self.mode=1
          class Transform:
