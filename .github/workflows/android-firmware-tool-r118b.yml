                          "region":"module",
                          "pointer_provenance":"PE_IMAGE",
                          "rva":off,
                          "rva_hex":hex(off),
                          "size":len(data),
                          "old_hex":old.hex().upper(),
                          "new_hex":bytes(data).hex().upper(),
                          "source":source,
                          "covers_update_rva_A3F4":off <= 0xA3F4 < off+len(data),
                          "source_context":provenance_context(s),
                      }
                      MODULE_WRITES.append(evt)
                      return True

              if p.region=="array" and isinstance(p.buf,bytearray):
                  off=p.offset
                  if 0<=off and off+len(data)<=len(p.buf):
                      p.buf[off:off+len(data)]=data
