                  struct.pack_into("<Q",q,off,v ^ 0x3800CD0D)
              qmatch=(bytes(q[:qlen])==stage2[:qlen])

          result={
            "source_length":len(source),
            "source_sha256":hashlib.sha256(source).hexdigest(),
            "state313_source_length":ev313.get("source_local27_len"),
            "state313_source_sha256":ev313.get("source_local27_sha256"),
            "state313_source_equals_h15":ev313.get("source_local27_sha256")==hashlib.sha256(source).hexdigest(),
            "state313_initial_accumulator":ev313.get("local105"),
            "state313_key_hex":keyhex,
            "key_length":len(key),
            "key_write_event_count":len(key17),
            "key_concrete_indices":concrete_indices,
            "key_all_32_indices_observed":concrete_indices==list(range(32)),
            "key_observed_value_sets":value_sets,
            "key_unique_value_per_index":unique_value_per_index,
            "state313_key_matches_unique_writes":key_matches_unique_writes,
            "exact_il_transform_links":exact_il,
            "exact_il_transform_links_all":all(exact_il.values()),
            "reference_recompute_compare_len":compare_len,
            "reference_recompute_matches_stage1_prefix":prefix_match,
            "qword_xor_compare_len":qlen,
            "qword_xor_matches_stage2_prefix":qmatch,
            "hashtable_ctor_events":ctor,
            "derived_state565_capacities":derived_caps,
            "parser_violations":violations,
            "parser_input_semantically_valid":len(violations)==0,
            "native_path_semantically_trusted":len(violations)==0,
            "stage2_first_int_is_not_a_format_proof":True,
            "interpretation":"If transform links and recomputation match but parser sanity fails, do not treat later native/JIT/WPM control flow as executed semantics. Next target becomes key/path provenance or a missing pre-parser transform, while the JIT-store architecture remains independently proven statically."
          }
          (ev/"49_STAGE1_KEY_PARSER_SANITY.json").write_text(json.dumps(result,indent=2,ensure_ascii=False)+"\n")
          print(json.dumps(result,indent=2,ensure_ascii=False))
          PY

