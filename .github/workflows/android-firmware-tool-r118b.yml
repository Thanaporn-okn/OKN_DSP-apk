          def deref_value(s,v):
              if isinstance(v,LocalRef): return s.locals[v.index]
              if isinstance(v,StaticRef): return s.statics.get(v.name,U("static:"+v.name))
              return v

          def ptr_add(v,delta):
              if isinstance(v,Ptr) and isinstance(delta,int):
                  return Ptr(v.region,v.offset+delta,v.buf)
              return None

          def ptr_read(s,p,n):
              if isinstance(p,LocalRef):
                  v=s.locals[p.index]
                  if isinstance(v,int):
                      return v
                  return 0
              if not isinstance(p,Ptr):
                  return None
              if p.region=="module":
                  off=p.offset
                  if 0<=off and off+n<=len(MODULE_IMAGE):
