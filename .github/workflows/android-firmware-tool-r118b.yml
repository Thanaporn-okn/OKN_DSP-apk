              l30=U(((l30>>1) | U(l86<<1)) ^ l75)  # dead local, kept to mirror IL
              l74=U(U(l74<<11) | (l74>>21))
              l89=U(l89+l75)
              l89=U(l89 ^ U(l89<<6))
              l89=U(l89+l11)
              l89=U(l89 ^ (l89>>11))
              l89=U(l89+l74)
              l89=U(l89 ^ U(l89<<1))
              l89=U(l89+l89)
              l89=U((U(U(l64<<16)+l11) ^ l11) - l89)
              return U(acc+l89)

          recomputed=None; prefix_match=False; compare_len=0
          if key and len(key)%4==0 and len(source)>=4:
              kws=[struct.unpack_from("<I",key,i)[0] for i in range(0,len(key),4)]
              total=(len(source)+3)//4
              complete=max(0,total-1)
              outb=bytearray(len(source))
              acc=0
              for ii in range(complete):
                  acc=U(acc+kws[ii%len(kws)])
                  acc=il_state46(acc)
                  src=struct.unpack_from("<I",source,ii*4)[0]
                  struct.pack_into("<I",outb,ii*4,U(acc^src))
              recomputed=bytes(outb)
              compare_len=complete*4
              prefix_match=bool(stage1) and stage1[:compare_len]==recomputed[:compare_len]

          # Static links proving the buffers/index/key relationships used by the loop.
          exact_il={
            "source_local12_to_local27":"IL_0fa8: ldloc.s 12" in n9 and "IL_0faa: stloc.s 27" in n9,
            "key_local17_to_local47":"IL_2f34: ldloc 17" in n9 and "IL_2f38: stloc.s 47" in n9,
            "initial_accumulator_zero":"IL_261f: ldc.i4.0" in n9 and "IL_2620: stloc.s 105" in n9,
            "index_times_4":"IL_1940: ldloc.s 38" in n9 and "IL_1942: ldc.i4.4" in n9,
            "key_word_state117":sw["all_targets"][117]=="IL_57bb",
            "key_add_state299":sw["all_targets"][299]=="IL_6117" and "IL_6117: ldloc.s 105" in n9 and "IL_6119: ldloc.s 53" in n9,
            "source_word_state342":sw["all_targets"][342]=="IL_61af",
            "mix_state46":sw["all_targets"][46]=="IL_5be0",
            "xor_output_state57":sw["all_targets"][57]=="IL_1172" and "IL_1172: ldloc.s 105" in n9 and "IL_1174: ldloc.s 82" in n9,
            "loop_increment_state451":sw["all_targets"][451]=="IL_50eb",
            "loop_test_state458":sw["all_targets"][458]=="IL_4121",
          }

          # Key write provenance: concrete writes only, grouped by byte index.
          kw=vm.get("key_write_events",[])
          key17=[x for x in kw if "key_local17" in x.get("roles",[])]
          byidx=collections.defaultdict(list)
          for x in key17: byidx[x.get("index")].append(x)
          concrete_indices=sorted(i for i,xs in byidx.items() if isinstance(i,int) and all(isinstance(x.get("value"),int) for x in xs))
          value_sets={str(i):sorted(set(x.get("value") for x in xs if isinstance(x.get("value"),int))) for i,xs in byidx.items() if isinstance(i,int)}
          unique_value_per_index=all(len(v)==1 for v in value_sets.values()) and len(value_sets)==32
          key_matches_unique_writes=(
              len(key)==32 and unique_value_per_index and
              all(key[i]==value_sets[str(i)][0] for i in range(32))
          )

          # Parser fail-closed checks. R117 had a saturating multi-GB ReadBytes and a
          # ~1.9B Hashtable capacity, which a real .NET process cannot silently accept.
          violations=list(vm.get("parser_violations",[]))
          ctor=list(vm.get("hashtable_ctor_events",[]))
          reads=[x for x in vm.get("global_events",[]) if x.get("kind") in ("ReadInt32","ReadBytes")]
          if not violations:
              for x in reads:
                  if x.get("kind")=="ReadBytes" and isinstance(x.get("requested"),int):
                      rem=x.get("remaining_before")
                      if isinstance(rem,int) and x["requested"]>rem:
                          violations.append({"kind":"READBYTES_EXCEEDS_REMAINING","event":x})
          for x in ctor:
              c=x.get("capacity")
              if isinstance(c,int) and (c<0 or c>1000000):
                  violations.append({"kind":"IMPLAUSIBLE_HASHTABLE_CAPACITY","event":x})

          # If older path did not emit ctor events, tie state565's static +1 constructor
          # to the ReadInt32 at the exact reader position snapshot.
          snaps=[x for x in vm.get("main_state_snapshots",[]) if x.get("main_state")==565]
          derived_caps=[]
          for s in snaps:
              pos=s.get("reader_pos")
              q=next((x for x in reads if x.get("kind")=="ReadInt32" and x.get("before")==pos),None)
              if q and isinstance(q.get("value"),int): derived_caps.append(q["value"]+1)
          for c in derived_caps:
              if c<0 or c>1000000:
                  violations.append({"kind":"DERIVED_STATE565_HASHTABLE_CAPACITY_IMPLAUSIBLE","capacity":c})

          # Qword stage2 literal check on complete qwords.
          qmatch=False; qlen=0
          if stage1 and stage2:
              qlen=(len(stage1)//8)*8
              q=bytearray(stage1)
              for off in range(0,qlen,8):
