name: OKN BP1048P4 MASTER V55 FIXED V2 MEGA FULL SDK INTEGRATION + DUAL I2S + ANDROID BUILD

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/OKN_BP1048P4_MASTER_V55_FIXED_V2_MEGA_FULL_SDK_INTEGRATION_DUAL_I2S_ANDROID_BUILD.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  REQUIRED_PHONE: "Samsung Galaxy S25+"
  REQUIRED_PATH: "Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only"
  SDK_REPO: "https://github.com/leadercxn/bp1048_sdk_v0.1.12.git"
  SDK_COMMIT: "8105bd864b04995d81c9f9ae77cb158259f39015"
  TOOLCHAIN_REPO: "https://github.com/xingrz/nds-builder.git"
  TOOLCHAIN_COMMIT: "572969caccb1d0c576b2893c905fa7b3396815e4"
  TOOLCHAIN_SHA256: "a231682172de4af23ac94726c021a824f1ae7d1f7c72a4619093b90caa7de0e4"
  SOURCE_ZIP_SHA256: "83dc1b0107d62d00d11107c7b4d9c4227a8083db87795b4d44192733f4ed9717"

  FLASH_ALLOWED: "NO"
  FEATURE_REPORT_ALLOWED: "NO"
  NEW_LIVE_0X11_ALLOWED: "NO"
  SOLDERING_ALLOWED: "NO"
  BOARD_MODIFICATION_ALLOWED: "NO"
  EXTERNAL_PROGRAMMER_ALLOWED: "NO"

jobs:
  v55:
    name: Integrate our firmware into full public SDK path and build app
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Gate 0 - immutable project rules
        shell: bash
        run: |
          set -euo pipefail
          test "$REQUIRED_PATH" = "Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only"
          test "$FLASH_ALLOWED" = "NO"
          test "$FEATURE_REPORT_ALLOWED" = "NO"
          test "$NEW_LIVE_0X11_ALLOWED" = "NO"
          test "$SOLDERING_ALLOWED" = "NO"
          test "$BOARD_MODIFICATION_ALLOWED" = "NO"
          test "$EXTERNAL_PROGRAMMER_ALLOWED" = "NO"
          rm -rf /tmp/v55
          mkdir -p /tmp/v55/{src,sdk,toolchain-source,toolchain,build,evidence,out}

      - name: Materialize V3 implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,pathlib
          pathlib.Path("/tmp/v55/source.zip").write_bytes(base64.b64decode(""""""))
          PY
          echo "$SOURCE_ZIP_SHA256  /tmp/v55/source.zip" | sha256sum -c -
          unzip -q /tmp/v55/source.zip -d /tmp/v55/src
          P=/tmp/v55/src/OKN_BP1048P4_NEW_FIRMWARE_V3
          test -s "$P/src/okn7_dual_i2s.c"
          test -s "$P/integration/patch_full_sdk.py"
          find "$P" -type f -printf '%P\n' | sort > /tmp/v55/evidence/00_SOURCE_INVENTORY.txt

      - name: Host regression tests
        shell: bash
        run: |
          set -euo pipefail
          P=/tmp/v55/src/OKN_BP1048P4_NEW_FIRMWARE_V3

          gcc -std=c11 -Wall -Wextra -Werror -I"$P/tests/stub" -I"$P/src"             "$P/tests/stub/eq_stub.c" "$P/src/okn7_dsp.c" "$P/tests/test_okn7.c"             -o /tmp/v55/build/test_dsp
          /tmp/v55/build/test_dsp | tee /tmp/v55/evidence/01_DSP_TEST.txt

          gcc -std=c11 -Wall -Wextra -Werror -I"$P/tests/stub" -I"$P/src"             "$P/tests/stub/eq_stub.c" "$P/src/okn7_dsp.c" "$P/src/okn7_protocol.c"             "$P/tests/test_okn7_protocol.c" -o /tmp/v55/build/test_protocol
          /tmp/v55/build/test_protocol | tee /tmp/v55/evidence/02_PROTOCOL_TEST.txt

          python3 "$P/tests/test_v3_static.py" | tee /tmp/v55/evidence/03_V3_STATIC_TEST.txt

      - name: Clone pinned public SDK and apply full integration
        shell: bash
        run: |
          set -euo pipefail
          P=/tmp/v55/src/OKN_BP1048P4_NEW_FIRMWARE_V3
          git clone -q "$SDK_REPO" /tmp/v55/sdk/repo
          git -C /tmp/v55/sdk/repo checkout -q "$SDK_COMMIT"
          test "$(git -C /tmp/v55/sdk/repo rev-parse HEAD)" = "$SDK_COMMIT"

          python3 "$P/integration/patch_full_sdk.py" /tmp/v55/sdk/repo "$P"             | tee /tmp/v55/evidence/04_FULL_SDK_PATCH.txt

          grep -q "okn7_protocol_handle_output"             /tmp/v55/sdk/repo/BT_Audio_APP/bt_audio_app_src/audio/communication.c
          grep -q "okn7_bt_audio_postprocess"             /tmp/v55/sdk/repo/BT_Audio_APP/bt_audio_app_src/audio/audio_effect_process.c

      - name: Acquire exact D1088 toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libc6-i386 lib32z1 xz-utils
          git init -q /tmp/v55/toolchain-source
          git -C /tmp/v55/toolchain-source remote add origin "$TOOLCHAIN_REPO"
          git -C /tmp/v55/toolchain-source fetch -q --depth 1 origin "$TOOLCHAIN_COMMIT"
          git -C /tmp/v55/toolchain-source checkout -q --detach FETCH_HEAD
          echo "$TOOLCHAIN_SHA256  /tmp/v55/toolchain-source/nds32le-elf-mculib-v3s.4.9.4.txz" | sha256sum -c -
          tar -xJf /tmp/v55/toolchain-source/nds32le-elf-mculib-v3s.4.9.4.txz -C /tmp/v55/toolchain

          CC=/tmp/v55/toolchain/nds32le-elf-mculib-v3s/bin/nds32le-elf-gcc
          "$CC" --version | tee /tmp/v55/evidence/05_COMPILER.txt
          "$CC" -dumpmachine | tee /tmp/v55/evidence/06_TARGET.txt

      - name: Generate SDK-wide include response file
        shell: bash
        run: |
          set -euo pipefail
          S=/tmp/v55/sdk/repo
          P=/tmp/v55/src/OKN_BP1048P4_NEW_FIRMWARE_V3
          : > /tmp/v55/build/includes.rsp
          printf '%s\n' "-I$P/src" "-I$P/integration"             "-I$S/BT_Audio_APP/bt_audio_app_src/audio/okn7"             >> /tmp/v55/build/includes.rsp
          find "$S/BT_Audio_APP" "$S/MVsB1_Base_SDK" -type d | sort |             while IFS= read -r d; do printf '%s\n' "-I$d"; done             >> /tmp/v55/build/includes.rsp
          wc -l /tmp/v55/build/includes.rsp | tee /tmp/v55/evidence/07_INCLUDE_COUNT.txt

      - name: Target compile our complete V3 modules
        shell: bash
        run: |
          set -euo pipefail
          P=/tmp/v55/src/OKN_BP1048P4_NEW_FIRMWARE_V3
          CC=/tmp/v55/toolchain/nds32le-elf-mculib-v3s/bin/nds32le-elf-gcc
          CFLAGS="-mcpu=d1088-spu -mext-dsp -Os -ffunction-sections -fdata-sections -Wall -Wextra"

          for src in             "$P/src/okn7_dsp.c"             "$P/src/okn7_protocol.c"             "$P/src/okn7_target_io.c"             "$P/src/okn7_dual_i2s.c"             "$P/integration/okn7_bt_audio_hook.c"; do
            base="$(basename "$src" .c)"
            "$CC" $CFLAGS @/tmp/v55/build/includes.rsp -c "$src" -o "/tmp/v55/build/$base.o"
          done

          echo "OUR_MODULES_TARGET_COMPILE=PASS" | tee /tmp/v55/evidence/08_OUR_MODULES_COMPILE.txt

      - name: Compile patched public-SDK runtime bridge and audio graph
        shell: bash
        run: |
          set -euo pipefail
          S=/tmp/v55/sdk/repo
          CC=/tmp/v55/toolchain/nds32le-elf-mculib-v3s/bin/nds32le-elf-gcc
          CFLAGS="-mcpu=d1088-spu -mext-dsp -Os -ffunction-sections -fdata-sections -w"

          "$CC" $CFLAGS @/tmp/v55/build/includes.rsp             -c "$S/BT_Audio_APP/bt_audio_app_src/audio/communication.c"             -o /tmp/v55/build/communication_patched.o

          "$CC" $CFLAGS @/tmp/v55/build/includes.rsp             -c "$S/BT_Audio_APP/bt_audio_app_src/audio/audio_effect_process.c"             -o /tmp/v55/build/audio_effect_process_patched.o

          echo "PATCHED_COMMUNICATION_COMPILE=PASS" | tee /tmp/v55/evidence/09_PATCHED_SDK_COMPILE.txt
          echo "PATCHED_AUDIO_GRAPH_COMPILE=PASS" >> /tmp/v55/evidence/09_PATCHED_SDK_COMPILE.txt

      - name: Relocatable integration link with real MVSilicon libraries
        shell: bash
        run: |
          set -euo pipefail
          S=/tmp/v55/sdk/repo
          CC=/tmp/v55/toolchain/nds32le-elf-mculib-v3s/bin/nds32le-elf-gcc

          "$CC" -mcpu=d1088-spu -mext-dsp -r -nostdlib             /tmp/v55/build/okn7_dsp.o             /tmp/v55/build/okn7_protocol.o             /tmp/v55/build/okn7_target_io.o             /tmp/v55/build/okn7_dual_i2s.o             /tmp/v55/build/okn7_bt_audio_hook.o             -Wl,--start-group             "$S/MVsB1_Base_SDK/middleware/audio/libAudioEffectLibrary.a"             "$S/MVsB1_Base_SDK/driver/driver/libDriver.a"             -lm -lc -lgcc -ldsp             -Wl,--end-group             -Wl,-Map,/tmp/v55/evidence/10_V3_INTEGRATION.map             -o /tmp/v55/build/OKN7_BP1048P4_V3_integration.o

          test -s /tmp/v55/build/OKN7_BP1048P4_V3_integration.o
          /tmp/v55/toolchain/nds32le-elf-mculib-v3s/bin/nds32le-elf-nm -u             /tmp/v55/build/OKN7_BP1048P4_V3_integration.o             > /tmp/v55/evidence/11_V3_UNRESOLVED.txt || true

      - name: Build Android controller APK
        shell: bash
        run: |
          set -euo pipefail
          A=/tmp/v55/src/OKN_BP1048P4_NEW_FIRMWARE_V3/android_app
          curl -fL --retry 5 --retry-all-errors             https://services.gradle.org/distributions/gradle-8.9-bin.zip             -o /tmp/v55/gradle.zip
          unzip -q /tmp/v55/gradle.zip -d /tmp/v55

          cd "$A"
          /tmp/v55/gradle-8.9/bin/gradle --no-daemon :app:assembleDebug             | tee /tmp/v55/evidence/12_ANDROID_BUILD.txt

          APK="$A/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" /tmp/v55/build/OKN_BP1048P4_V3_CONTROLLER.apk
          sha256sum "$APK" > /tmp/v55/evidence/13_APK_SHA256.txt

      - name: Create full SDK overlay and build matrix
        shell: bash
        run: |
          set -euo pipefail
          P=/tmp/v55/src/OKN_BP1048P4_NEW_FIRMWARE_V3
          S=/tmp/v55/sdk/repo

          mkdir -p /tmp/v55/build/overlay
          cp -a "$S/BT_Audio_APP/bt_audio_app_src/audio/okn7" /tmp/v55/build/overlay/
          cp "$S/BT_Audio_APP/bt_audio_app_src/audio/communication.c" /tmp/v55/build/overlay/
          cp "$S/BT_Audio_APP/bt_audio_app_src/audio/audio_effect_process.c" /tmp/v55/build/overlay/
          cp "$P/firmware_manifest_template.json" /tmp/v55/build/overlay/

          tar -C /tmp/v55/build/overlay -czf             /tmp/v55/build/OKN_BP1048P4_V3_FULL_SDK_OVERLAY.tar.gz .

          python3 - <<'PY'
          import json,hashlib,pathlib
          b=pathlib.Path("/tmp/v55/build")
          result={
            "revision":"V55",
            "firmware_implementation":"V3",
            "android_app_built":True,
            "target_d1088_integration_object_built":True,
            "patched_communication_compiled":True,
            "patched_audio_effect_process_compiled":True,
            "dual_i2s0_i2s1_backend_built":True,
            "channels":7,
            "peq_bands_per_channel":15,
            "gain_ids":[22,23,24,25,26,27,28],
            "runtime_no_0x11":True,
            "runtime_feature_report":False,
            "required_path":"Samsung Galaxy S25+ -> USB-C -> DSP board USB-C",
            "first_flash_allowed":False,
            "artifacts":{
              "apk_sha256":hashlib.sha256((b/"OKN_BP1048P4_V3_CONTROLLER.apk").read_bytes()).hexdigest(),
              "integration_object_sha256":hashlib.sha256((b/"OKN7_BP1048P4_V3_integration.o").read_bytes()).hexdigest(),
              "overlay_sha256":hashlib.sha256((b/"OKN_BP1048P4_V3_FULL_SDK_OVERLAY.tar.gz").read_bytes()).hexdigest()
            }
          }
          pathlib.Path("/tmp/v55/evidence/14_V55_BUILD_MATRIX.json").write_text(json.dumps(result,indent=2)+"\n")
          PY

      - name: Package V55 implementation artifact
        shell: bash
        run: |
          set -euo pipefail

          cp /tmp/v55/source.zip /tmp/v55/out/OKN_BP1048P4_NEW_FIRMWARE_V3_FIXED_V2_PLUS_ANDROID_APP_SOURCE.zip
          cp /tmp/v55/build/OKN7_BP1048P4_V3_integration.o /tmp/v55/out/
          cp /tmp/v55/build/communication_patched.o /tmp/v55/out/
          cp /tmp/v55/build/audio_effect_process_patched.o /tmp/v55/out/
          cp /tmp/v55/build/okn7_dual_i2s.o /tmp/v55/out/
          cp /tmp/v55/build/OKN_BP1048P4_V3_CONTROLLER.apk /tmp/v55/out/
          cp /tmp/v55/build/OKN_BP1048P4_V3_FULL_SDK_OVERLAY.tar.gz /tmp/v55/out/
          cp /tmp/v55/evidence/* /tmp/v55/out/

          cat > /tmp/v55/out/15_V55_FINAL_DECISION.md <<'EOF'
          # V55 — FULL SDK INTEGRATION BUILD

          This run advances implementation, not stock-protocol archaeology.

          Built/checked:
          - our 7CH / 15-PEQ / post-PEQ Gain firmware
          - Gain IDs 22..28
          - our HID Output/Input runtime protocol
          - no Feature report
          - no live 0x11
          - dual I2S0 + I2S1 backend
          - patched public-SDK communication.c
          - patched public-SDK AudioEffectProcess
          - Android controller APK
          - full integration source overlay

          First deployment onto the currently-stock board remains the separate
          bootstrap gate. V55 performs no destructive board I/O.

          FLASH_ALLOWED=NO
          EOF

          (cd /tmp/v55/out && sha256sum * > SHA256SUMS.txt)

      - name: Upload V55 implementation
        uses: actions/upload-artifact@v7
        with:
          name: OKN-BP1048P4-MASTER-V55-FULL-SDK-INTEGRATION-DUAL-I2S-ANDROID
          path: /tmp/v55/out/*
          if-no-files-found: error
          retention-days: 90

      - name: Final assertions
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          test "$FEATURE_REPORT_ALLOWED" = "NO"
          test "$NEW_LIVE_0X11_ALLOWED" = "NO"
          test -s /tmp/v55/build/OKN7_BP1048P4_V3_integration.o
          test -s /tmp/v55/build/OKN_BP1048P4_V3_CONTROLLER.apk
          grep -q "PATCHED_AUDIO_GRAPH_COMPILE=PASS" /tmp/v55/evidence/09_PATCHED_SDK_COMPILE.txt
          echo "MASTER_V55=PASS"
          echo "FULL_SDK_INTEGRATION=COMPILED"
          echo "DUAL_I2S=COMPILED"
          echo "ANDROID_APP=BUILT"
          echo "FLASH_ALLOWED=NO"
