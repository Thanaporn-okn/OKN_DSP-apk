      - name: R45 hard safety gate - read-only EP0 only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYSAFE'
          from pathlib import Path
          import re
          root=Path('/tmp/r45src/r45_android_source')
          k=(root/'android_template/MainActivity.kt.in').read_text()
          c=(root/'android_template/usbfs_diag.cpp.in').read_text()
          d=(root/'lib/usb_readonly.dart').read_text()

          forbidden_native=[
              'HID_SET_REPORT','USB_DIR_OUT','bulkTransfer','UsbRequest',
              'setConfiguration','setInterface','SpiFlashErase','SpiFlashWrite',
              'SaveParams','Reset_McuSystem','0x58','0x57','0x11',
          ]
          bad=[x for x in forbidden_native if x in k]
          if bad:
              raise SystemExit('forbidden native write/control token(s): '+', '.join(bad))

          required=[
              '"ep0Semantics"','private fun ep0Semantics',
              'HID_GET_REPORT = 0x01','HID_GET_IDLE = 0x02',
              'HID_REPORT_TYPE_INPUT = 0x01','HID_REPORT_TYPE_FEATURE = 0x03',
              'USB_GET_STATUS = 0x00','USB_GET_INTERFACE = 0x0A',
              'RUNTIME_GET_REPORT_REQUEST_TYPE',
              'RUNTIME_STANDARD_INTERFACE_IN',
              'controlTransfer(', 'bufferOffset',
              'nativeUsbfsControlTransfer', 'connection.fileDescriptor',
              'ep0_unclaimed','ep0_claimed','claimInterface(iface4, true)',
              'NOT_SENT'
          ]
          for token in required:
              if token not in k:
                  raise SystemExit('missing R45 proof token: '+token)

          if k.count('controlTransfer(') != 3:
              raise SystemExit('R45 expects GET_DESCRIPTOR + Java direct + Java offset controlTransfer call sites')
          if 'USBDEVFS_CONTROL' not in c or '__JNI_CLASS__' not in c:
              raise SystemExit('native usbfs read path template missing')
          if any(x in c for x in ['USBDEVFS_SUBMITURB','USBDEVFS_BULK','USBDEVFS_RESET']):
              raise SystemExit('forbidden native usbfs operation')
          if "'ep0Semantics'" not in d:
              raise SystemExit('Dart does not call R45 EP0 method')
          print('PASS R45 safety: no SET_REPORT/UFE/write/reset path; Java + native usbfs IN-only probes')
          PYSAFE

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android scaffold and overlay R45 source
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          rm -rf /tmp/okn_r45_app
          flutter create --platforms=android --org com.okn.dsp --project-name okn_dsp_r45 /tmp/okn_r45_app

          rm -rf /tmp/okn_r45_app/lib /tmp/okn_r45_app/test
          cp -a "$R45_SRC/lib" /tmp/okn_r45_app/lib
          cp -a "$R45_SRC/test" /tmp/okn_r45_app/test
          cp "$R45_SRC/pubspec.yaml" /tmp/okn_r45_app/pubspec.yaml
          cp "$R45_SRC/analysis_options.yaml" /tmp/okn_r45_app/analysis_options.yaml
          cp "$R45_SRC/README_R45_TH.txt" /tmp/okn_r45_app/README_R45_TH.txt

          MAIN="$(find /tmp/okn_r45_app/android/app/src/main/kotlin -name MainActivity.kt | head -n1)"
          test -f "$MAIN"
          PKG="$(sed -n 's/^package[[:space:]]\+//p' "$MAIN" | head -n1)"
          test -n "$PKG"
          sed "s/^package __PACKAGE__$/package $PKG/" "$R45_SRC/android_template/MainActivity.kt.in" > "$MAIN"

          MANIFEST=/tmp/okn_r45_app/android/app/src/main/AndroidManifest.xml
          python3 - <<'PYMAN'
          from pathlib import Path
          p=Path('/tmp/okn_r45_app/android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          marker='    <application'
          feature='    <uses-feature android:name="android.hardware.usb.host" android:required="false" />\n'
          if marker not in s:
              raise SystemExit('AndroidManifest application marker missing')
          if 'android.hardware.usb.host' not in s:
              s=s.replace(marker,feature+marker,1)
          p.write_text(s)
          PYMAN

          # Compile tiny arm64 JNI bridge directly with the NDK already present on the GitHub runner.
          NDK="$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          test -n "$NDK"
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++"
          test -x "$CLANG"
          CPPDIR=/tmp/okn_r45_app/android/app/src/main/cpp
          JNIDIR=/tmp/okn_r45_app/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$CPPDIR" "$JNIDIR"
          PKG_JNI="$(python3 - "$PKG" <<'PYJNI'
          import sys
          pkg=sys.argv[1]
          print(pkg.replace('_','_1').replace('.','_')+'_MainActivity')
          PYJNI
          )"
          sed "s/__JNI_CLASS__/$PKG_JNI/g" "$R45_SRC/android_template/usbfs_diag.cpp.in" > "$CPPDIR/usbfs_diag.cpp"
          "$CLANG" -std=c++17 -shared -fPIC -O2 "$CPPDIR/usbfs_diag.cpp" -o "$JNIDIR/libusbfsdiag.so"
          test -s "$JNIDIR/libusbfsdiag.so"
          file "$JNIDIR/libusbfsdiag.so"

          echo "R45_APP=/tmp/okn_r45_app" >> "$GITHUB_ENV"
          echo "R45_MAIN_ACTIVITY=$MAIN" >> "$GITHUB_ENV"
          echo "R45_NATIVE_CPP=$CPPDIR/usbfs_diag.cpp" >> "$GITHUB_ENV"

      - name: Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$R45_APP"
          flutter pub get

      - name: Protocol and regression unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$R45_APP"
          flutter test

      - name: Static analysis
        shell: bash
        run: |
          set -euo pipefail
          cd "$R45_APP"
          flutter analyze

      - name: Build arm64 Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$R45_APP"
          flutter build apk --debug --target-platform android-arm64
          test -s build/app/outputs/flutter-apk/app-debug.apk
          unzip -l build/app/outputs/flutter-apk/app-debug.apk | grep -q 'lib/arm64-v8a/libusbfsdiag.so'

      - name: Post-build read-only safety audit
        shell: bash
        run: |
          set -euo pipefail
          K="$R45_MAIN_ACTIVITY"
          C="$R45_NATIVE_CPP"
          ! grep -Eq 'HID_SET_REPORT|USB_DIR_OUT|bulkTransfer|UsbRequest|setConfiguration|setInterface|SpiFlashErase|SpiFlashWrite|SaveParams|Reset_McuSystem|0x58|0x57|0x11' "$K"
          grep -q 'HID_GET_REPORT = 0x01' "$K"
          grep -q 'HID_GET_IDLE = 0x02' "$K"
          grep -q 'HID_REPORT_TYPE_FEATURE = 0x03' "$K"
          grep -q 'nativeUsbfsControlTransfer' "$K"
          grep -q 'connection.fileDescriptor' "$K"
          grep -q 'ep0_unclaimed' "$K"
          grep -q 'ep0_claimed' "$K"
          grep -q 'USBDEVFS_CONTROL' "$C"
          ! grep -Eq 'USBDEVFS_SUBMITURB|USBDEVFS_BULK|USBDEVFS_RESET' "$C"
          echo 'PASS post-build R45: read-only EP0 Java direct/offset + native usbfs ioctl'

      - name: Package R45 APK and evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/r45_out
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp "$R45_APP/build/app/outputs/flutter-apk/app-debug.apk" "$OUT/OKN_DSP_R45_EP0_HID_SEMANTICS_debug.apk"
          cp /tmp/OKN_DSP_R45_EP0_HID_SEMANTICS_Source.zip "$OUT/OKN_DSP_R45_EP0_HID_SEMANTICS_Source.zip"
          cp "$R45_APP/README_R45_TH.txt" "$OUT/README_R45_TH.txt"
          cp "$R45_MAIN_ACTIVITY" "$OUT/MainActivity_R45_EP0_HID_SEMANTICS.kt"
          cp "$R45_NATIVE_CPP" "$OUT/usbfs_diag_R45.cpp"
          cat > "$OUT/R45_SAFETY_STATE.txt" <<'EOF'
          R44_4_BASELINE_ZERO_CONFIRMED_ON_REAL_BOARD=YES
          RUNTIME_INTERFACE=4
          R30_SIGNATURE_REQUIRED=YES
          SET_REPORT=NO
          UFE_COMMANDS=NO
          CONTROL_0x11=NO
          FLASH_ERASE_PROGRAM_COMMIT=NO
          RESET=NO
          JAVA_CONTROLTRANSFER_DIRECT=YES
          JAVA_CONTROLTRANSFER_OFFSET1=YES
          NATIVE_USBDEVFS_CONTROL=YES
          STANDARD_GET_STATUS=YES
          STANDARD_GET_INTERFACE=YES
          HID_GET_REPORT_INPUT_ID0=YES
          HID_GET_REPORT_FEATURE_ID0=YES
          HID_GET_IDLE_ID0=YES
          TEST_BEFORE_AND_AFTER_CLAIM_IF4=YES
          EOF
          (cd "$OUT" && sha256sum * > SHA256SUMS.txt)

      - name: Upload R45 APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN_DSP_R45_EP0_HID_SEMANTICS_APK
          path: /tmp/r45_out/*
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        shell: bash
        run: |
          {
            echo '## R45 Android EP0/HID semantics diagnostic'
            echo '- Triggered by real-board R44.4 result: GET_REPORT IF4 = 0 B for all baseline sizes before/after claim'
            echo '- No SET_REPORT and no UFE command is sent'
            echo '- Compares Java controlTransfer direct, Java offset overload, and native USBDEVFS_CONTROL ioctl'
            echo '- Probes standard EP0 GET_STATUS/GET_INTERFACE and HID GET_REPORT Input/Feature + GET_IDLE on IF4'
            echo '- Runs both before and after claimInterface(IF4,true)'
          } >> "$GITHUB_STEP_SUMMARY"
