name: OKN DSP Studio 1.0.10 Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Sources/OKN_DSP_Studio_1.0.10_Source.zip'
      - '.github/workflows/OKN_DSP_Studio_1.0.10_Build.yml'

permissions:
  contents: read


concurrency:
  group: okn-dsp-studio-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
  ANDROID_PLATFORM: android-35
  ANDROID_BUILD_TOOLS: 35.0.0


jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP from repository
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="Sources/OKN_DSP_Studio_1.0.10_Source.zip"
          test -s "$ZIP_PATH"
          unzip -tq "$ZIP_PATH"
          unzip -oq "$ZIP_PATH" -d "$GITHUB_WORKSPACE"
          for d in app/src/main/res/mipmap-*; do
            [ -d "$d" ] && [ -s "$d/ic_launcher.png" ] && cp "$d/ic_launcher.png" "$d/ic_launcher_round.png"
          done
          test -s app/src/main/java/com/okn/peramp/BleManager.java
          test -s app/src/main/java/com/okn/peramp/LabPage.java
          test -s Sources/validate_studio.py
          test -s Sources/validate_v38_gate.py

      - name: Validate protocol and crossover safety
        run: python3 Sources/validate_studio.py

      - name: Validate PEQ safety gate
        run: python3 Sources/validate_v38_gate.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Ensure Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -n "$SDK" ] && [ -d "$SDK/platforms/$ANDROID_PLATFORM" ] && [ -d "$SDK/build-tools/$ANDROID_BUILD_TOOLS"; then
            echo "Android SDK already present at $SDK"
          else
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager "platforms;$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS" 'platform-tools'
          fi

      - name: Build debug and release APKs
        run: gradle assembleDebug assembleRelease --no-daemon --parallel --build-cache --stacktrace

      - name: Verify APK outputs and summarize
        shell: bash
        run: |
          set -euo pipefail
          for f in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do test -s "$f"; done
          {
            echo '### APK outputs'
            echo '| File | Size | SHA-256 |'
            echo '|---|---|---|'
            for f in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"
            done
            echo
            echo 'Release uses debug signing unless signing secrets are configured.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs and validation files
        uses: actions/upload-artifact@v4
        with:
          name: OKN_DSP_Studio_1_0_10
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            Sources/validate_studio.py
            Sources/validate_v38_gate.py
            Sources/DSP_STUDIO_NOTES.txt
