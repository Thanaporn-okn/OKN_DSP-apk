name: Build OKN Peramp APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_Peramp_Source_Only.zip'
      - '.github/workflows/android*.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          fi
          if [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$ANDROID_SDK_ROOT" -name sdkmanager -type f -print || true
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract OKN Peramp source
        shell: bash
        run: |
          set -euo pipefail
          test -f OKN_Peramp_Source_Only.zip
          rm -rf OKN_Peramp_build
          mkdir -p OKN_Peramp_build
          unzip -q OKN_Peramp_Source_Only.zip -d OKN_Peramp_build

          echo "Checking Gradle project..."
          test -f OKN_Peramp_build/settings.gradle
          test -f OKN_Peramp_build/build.gradle
          test -f OKN_Peramp_build/app/build.gradle

          echo "Source extracted successfully"
          find OKN_Peramp_build -maxdepth 3 -type f | sort

      - name: Build debug APK
        working-directory: OKN_Peramp_build
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -f OKN_Peramp_build/app/build/outputs/apk/debug/app-debug.apk
          ls -lh OKN_Peramp_build/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN-Peramp-debug
          path: OKN_Peramp_build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
