      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Validate protocol and crossover safety
        run: python3 Sources/validate_studio.py

      - name: Validate PEQ safety gate
        run: python3 Sources/validate_v38_gate.py

      - name: Configure production signing (optional)
        shell: bash
        env:
          OKN_KEYSTORE_BASE64: ${{ secrets.OKN_KEYSTORE_BASE64 }}
          OKN_KEYSTORE_PASSWORD: ${{ secrets.OKN_KEYSTORE_PASSWORD }}
          OKN_KEY_ALIAS: ${{ secrets.OKN_KEY_ALIAS }}
          OKN_KEY_PASSWORD: ${{ secrets.OKN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${OKN_KEYSTORE_BASE64}" ]]; then
            echo 'Production signing secrets not configured; release APK will use the debug certificate.'
            echo 'OKN_PRODUCTION_SIGNING=disabled' >> "$GITHUB_ENV"
            exit 0
          fi
          for key in OKN_KEYSTORE_PASSWORD OKN_KEY_ALIAS OKN_KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              echo "Missing required signing secret: ${key}" >&2
              exit 1
            fi
          done
          key_path="$RUNNER_TEMP/okn-release.jks"
          printf '%s' "$OKN_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          test -s "$key_path"
          echo "OKN_KEYSTORE_FILE=$key_path" >> "$GITHUB_ENV"
          echo 'OKN_PRODUCTION_SIGNING=enabled' >> "$GITHUB_ENV"

      - name: Build debug and release APKs
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleRelease

      - name: Verify APK outputs and signatures
        shell: bash
        run: |
          set -euo pipefail
          debug_apk=app/build/outputs/apk/debug/app-debug.apk
          release_apk=app/build/outputs/apk/release/app-release.apk
          test -s "$debug_apk"
          test -s "$release_apk"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          mkdir -p build-verification
          "$apksigner" verify --verbose --print-certs "$debug_apk" > build-verification/debug-signature.txt
          "$apksigner" verify --verbose --print-certs "$release_apk" > build-verification/release-signature.txt
          {
            echo 'OKN DSP Studio 1.0.7 build verification'
            echo "Commit: $GITHUB_SHA"
            echo "Workflow run: $GITHUB_RUN_ID"
            echo "Production signing configured: ${OKN_PRODUCTION_SIGNING:-unknown}"
            echo 'APK SHA-256:'
            sha256sum "$debug_apk" "$release_apk"
            echo 'Release certificate:'
            cat build-verification/release-signature.txt
          } > build-verification/BUILD_MANIFEST.txt
          cat build-verification/BUILD_MANIFEST.txt

      - name: Upload APKs and source validation
        uses: actions/upload-artifact@v7
        with:
          name: OKN_DSP_Studio_1_0_7
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            Sources/validate_studio.py
            Sources/validate_v38_gate.py
            Sources/DSP_STUDIO_NOTES.txt
            build-verification/BUILD_MANIFEST.txt
            build-verification/debug-signature.txt
            build-verification/release-signature.txt
