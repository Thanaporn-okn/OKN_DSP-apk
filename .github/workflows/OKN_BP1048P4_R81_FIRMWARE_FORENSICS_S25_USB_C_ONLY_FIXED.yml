name: OKN BP1048P4 R81 Firmware Forensics S25 USB-C ONLY

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/OKN_BP1048P4_R81_FIRMWARE_FORENSICS_S25_USB_C_ONLY.yml'
      - 'firmware/**'
      - 'Firmware/**'
      - '**/*.mva'
      - '**/*.bin'
      - '**/*.img'
      - '**/*.fw'
      - '**/*.rom'
      - '**/*.ota'
      - '**/*.dfu'
      - '**/*.upd'
      - '**/*.adx'
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/OKN_BP1048P4_R81_FIRMWARE_FORENSICS_S25_USB_C_ONLY.yml'
      - 'firmware/**'
      - 'Firmware/**'
      - '**/*.mva'
      - '**/*.bin'
      - '**/*.img'
      - '**/*.fw'
      - '**/*.rom'
      - '**/*.ota'
      - '**/*.dfu'
      - '**/*.upd'
      - '**/*.adx'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: okn-r81-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: /tmp/okn-r81
  REQUIRED_PHONE: "Samsung Galaxy S25+"
  REQUIRED_PATH: "Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only"
  SDK_REPO: "https://github.com/leadercxn/bp1048_sdk_v0.1.12.git"
  SDK_COMMIT: "8105bd864b04995d81c9f9ae77cb158259f39015"
  PROJECT_TGZ_SHA256: "0f83fe6af3c733972e9ec560e93a6dcd9a78d0c0b7f4c7468c3d5e6881d9e7f9"
  FLASH_ALLOWED: "NO"
  HOST_TO_DEVICE_USB_ALLOWED: "NO"
  ERASE_ALLOWED: "NO"
  WRITE_ALLOWED: "NO"

jobs:
  build-forensics:
    name: Build passive S25+ USB forensics APK + offline firmware analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$REQUIRED_PHONE" = "Samsung Galaxy S25+"
          test "$REQUIRED_PATH" = "Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only"
          test "$FLASH_ALLOWED" = "NO"
          test "$HOST_TO_DEVICE_USB_ALLOWED" = "NO"
          test "$ERASE_ALLOWED" = "NO"
          test "$WRITE_ALLOWED" = "NO"
          rm -rf "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR"/evidence "$PROJECT_DIR"/out "$PROJECT_DIR"/sdk
          cat > "$PROJECT_DIR/evidence/00_SAFETY_GATE.txt" <<'EOF'
          TARGET=MVSilicon BP1048P4
          PHONE=Samsung Galaxy S25+
          PATH=Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only
          SOLDERING=NO
          BOARD_MODIFICATION=NO
          JTAG_SDP_AICE=NO
          EXTERNAL_PROGRAMMER=NO
          HOST_TO_DEVICE_USB=NO
          AA55=NO
          CONTROL_0X11=NO
          RECOVERY_OUTPUT_COMMANDS=NO
          ERASE=NO
          WRITE=NO
          FULL_FLASH_READBACK_PROVEN=NO
          EOF

      - name: Reconstruct complete Android project embedded in this one YML
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r81-project.tgz.b64 <<'R81_PROJECT_B64'
