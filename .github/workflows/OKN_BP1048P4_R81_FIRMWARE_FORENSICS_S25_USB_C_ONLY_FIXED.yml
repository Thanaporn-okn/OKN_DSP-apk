      - name: Pin SDK and recover firmware-writing evidence OFFLINE
        shell: bash
        run: |
          set -euo pipefail
          git clone -q "$SDK_REPO" "$PROJECT_DIR/sdk/repo"
          git -C "$PROJECT_DIR/sdk/repo" checkout -q "$SDK_COMMIT"
          test "$(git -C "$PROJECT_DIR/sdk/repo" rev-parse HEAD)" = "$SDK_COMMIT"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('/tmp/okn-r81/sdk/repo'); ev=Path('/tmp/okn-r81/evidence')
          keys=['start_up_grate','pc_upgrade','SpiFlashRead','SpiFlashReadWpr','SpiFlashWrite',
                'SpiFlashErase','FlashChipErase','FlashSectorErase','chiperas','bootdat','codedata',
                'constdat','cnfgdat','btupdat','upinfo','cxxx','upgrade','flashboot','HID','USB']
          inventory=[]; hits=[]
          for p in sorted(root.rglob('*')):
            if not p.is_file(): continue
            try: b=p.read_bytes()
            except Exception: continue
            rel=str(p.relative_to(root))
            inventory.append({'path':rel,'size':len(b),'sha256':hashlib.sha256(b).hexdigest()})
            if len(b)>3_000_000: continue
            t=b.decode('utf-8','ignore')
            for n,line in enumerate(t.splitlines(),1):
              ks=[k for k in keys if k.lower() in line.lower()]
              if ks: hits.append({'path':rel,'line':n,'keywords':ks,'text':line[:500]})
          (ev/'01_SDK_FILE_INVENTORY.json').write_text(json.dumps(inventory,indent=2)+'\n')
          (ev/'02_SDK_FLASH_PROTOCOL_EXCERPTS.json').write_text(json.dumps(hits,indent=2,ensure_ascii=False)+'\n')
          md=['# R81 SDK flash/protocol static evidence','',
              'Pinned SDK commit: `8105bd864b04995d81c9f9ae77cb158259f39015`','',
              f'Files inventoried: **{len(inventory)}**',f'Keyword excerpts: **{len(hits)}**','',
              'OFFLINE ONLY — this step executes no target firmware and sends no USB traffic.','',
              '## High-value excerpts']
          for x in hits[:350]:
            txt=x['text'].replace('`','')
            md.append(f"- `{x['path']}:{x['line']}` [{', '.join(x['keywords'])}] `{txt}`")
          (ev/'03_SDK_FLASH_PROTOCOL_REPORT.md').write_text('\n'.join(md)+'\n')
          PY

      - name: Inventory firmware/update artifacts already in repository OFFLINE
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,math,re,os
          repo=Path(os.environ['GITHUB_WORKSPACE']); ev=Path('/tmp/okn-r81/evidence')
          exts={'.mva','.bin','.img','.fw','.rom','.ota','.dfu','.upd','.adx','.hex','.elf','.apk','.exe','.zip'}
          skip={'.git','.gradle','build'}
          def entropy(b):
            if not b:return 0.0
            c=[0]*256
            for x in b:c[x]+=1
            return round(-sum((n/len(b))*math.log2(n/len(b)) for n in c if n),5)
          def astrings(b):
            return [m.group().decode('ascii','replace') for m in list(re.finditer(rb'[ -~]{5,120}',b))[:80]]
          items=[]
          for p in sorted(repo.rglob('*')):
            if not p.is_file() or p.suffix.lower() not in exts or any(x in skip for x in p.parts): continue
            try:
              size=p.stat().st_size
              h=hashlib.sha256(); sample=b''
              with p.open('rb') as f:
                while True:
                  chunk=f.read(1024*1024)
                  if not chunk: break
                  h.update(chunk)
                  if len(sample)<2*1024*1024: sample += chunk[:2*1024*1024-len(sample)]
            except Exception: continue
            items.append({'path':str(p.relative_to(repo)),'size':size,'sha256':h.hexdigest(),
                          'sample_entropy':entropy(sample),'first64_hex':sample[:64].hex().upper(),
                          'ascii_strings_sample':astrings(sample)})
          (ev/'04_REPO_FIRMWARE_UPDATE_CANDIDATES.json').write_text(json.dumps(items,indent=2,ensure_ascii=False)+'\n')
          md=['# R81 repository firmware/update candidates','',f'candidate_count: **{len(items)}**','']
          for x in items:
            md += [f"## {x['path']}",f"- size: {x['size']}",f"- SHA256: `{x['sha256']}`",
                   f"- sample entropy: {x['sample_entropy']}",f"- first64: `{x['first64_hex']}`",'']
          md += ['## Gate','- Exact production full-flash backup: **NOT PROVEN by filename alone**',
                 '- Validate every candidate offline before any write-path work.','- `FLASH_ALLOWED=NO`']
          (ev/'05_REPO_FIRMWARE_UPDATE_REPORT.md').write_text('\n'.join(md)+'\n')
          PY

      - name: Fail-closed static USB safety audit
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          from pathlib import Path
          import re,hashlib,json
          root=Path('.')
          java='\n'.join(p.read_text(errors='ignore') for p in sorted((root/'app/src/main/java').rglob('*.java')))
          eng=(root/'app/src/main/java/com/okn/bp1048p4r81/UsbCaptureEngine.java').read_text()
          required=['captureReadOnlySnapshot','HID_FEATURE_REPORT_WVALUE','0x0300','GET_REPORT',
                    'getRawDescriptors','ZipOutputStream','FULL FIRMWARE DUMP — LOCKED']
          missing=[x for x in required if x not in java]
          if missing: raise SystemExit('R81 missing '+repr(missing))
          forbidden=['HID_OUTPUT_SET_REPORT_BM','HID_SET_REPORT_REQ','HID_OUTPUT_REPORT_WVALUE',
                     'public void runExactVersionQueryOnce','bulkTransfer(','UsbRequest',
                     'SpiFlashErase(','SpiFlashWrite(','FlashChipErase(','FlashSectorErase(']
          bad=[x for x in forbidden if x in java]
          if bad: raise SystemExit('R81 forbidden live primitive '+repr(bad))
          calls=[]; lines=eng.splitlines()
          for i,line in enumerate(lines):
            if 'controlTransfer(' in line:
              frag=' '.join(lines[i:i+8]); calls.append(frag)
              if 'HID_GET_DESCRIPTOR_BM' not in frag and 'HID_INPUT_GET_REPORT_BM' not in frag:
                raise SystemExit('R81 non-whitelisted controlTransfer '+frag)
          if len(calls)<4: raise SystemExit('R81 passive read callsites missing')
          if re.search(r'controlTransfer\s*\(\s*0x(?:0?1|2?1|4?1|6?1)',java,re.I):
            raise SystemExit('R81 literal host-to-device controlTransfer found')
          if '0x09,' in eng or 'SET_REPORT' in eng:
            raise SystemExit('R81 SET_REPORT found in capture engine')
          rows=[]
          for p in sorted(root.rglob('*')):
            if p.is_file() and '/build/' not in str(p) and '/sdk/' not in str(p):
              rows.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p}")
          (root/'SOURCE_SHA256SUMS.txt').write_text('\n'.join(rows)+'\n')
          result={'control_transfer_calls':len(calls),'device_to_host_only':True,'host_to_device_usb':False,
                  'set_report':False,'aa55':False,'control_0x11':False,'erase':False,'write':False,
                  'full_flash_readback_proven':False}
          (root/'R81_USB_SAFETY_AUDIT.json').write_text(json.dumps(result,indent=2)+'\n')
          print('R81_USB_SAFETY_AUDIT=PASS',json.dumps(result))
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: yes
          log-accepted-android-sdk-licenses: false

      - name: Verify Android SDK licenses and packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --version
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1
          set -o pipefail
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"

      - name: Install Gradle 8.9 (same path proven by successful R69 build)
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 20 https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle-8.9-bin.zip
          rm -rf /tmp/gradle-8.9
          unzip -q /tmp/gradle-8.9-bin.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build APK and package evidence
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" out/OKN_BP1048P4_R81_USB_FIRMWARE_FORENSICS.apk
          sha256sum out/OKN_BP1048P4_R81_USB_FIRMWARE_FORENSICS.apk | tee out/OKN_BP1048P4_R81_USB_FIRMWARE_FORENSICS.apk.sha256
          cp README_R81_TH.md KNOWN_PROTOCOL_R81.md R81_STATUS.txt SOURCE_SHA256SUMS.txt R81_USB_SAFETY_AUDIT.json out/
          cp evidence/* out/
          zip -9 -r out/OKN_BP1048P4_R81_GENERATED_SOURCE.zip settings.gradle build.gradle gradle.properties app README_R81_TH.md KNOWN_PROTOCOL_R81.md R81_STATUS.txt SOURCE_SHA256SUMS.txt R81_USB_SAFETY_AUDIT.json -x 'app/build/*' 'app/.gradle/*' '.gradle/*' >/dev/null
          sha256sum out/OKN_BP1048P4_R81_GENERATED_SOURCE.zip | tee out/OKN_BP1048P4_R81_GENERATED_SOURCE.zip.sha256

      - name: Publish GitHub step summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# OKN BP1048P4 R81 — Firmware Forensics'
            echo ''
            echo '- Samsung S25+ -> USB-C -> DSP USB-C only'
            echo '- APK live USB direction: device -> host only'
            echo '- Raw descriptors + HID descriptors + IF4 Input/Feature GET_REPORT capture'
            echo '- Pinned SDK flash/protocol evidence generated offline'
            echo '- Repository firmware/update candidates inventoried offline'
            echo '- AA55 / Output SET_REPORT / 0x11 / recovery writer commands: DISABLED'
            echo '- Full arbitrary flash readback: NOT YET PROVEN; full-dump gate remains locked'
            echo '- FLASH_ALLOWED=NO'
            echo ''
            cat "$PROJECT_DIR/out/OKN_BP1048P4_R81_USB_FIRMWARE_FORENSICS.apk.sha256"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload R81 APK source and forensic evidence
        uses: actions/upload-artifact@v7
        with:
          name: OKN_BP1048P4_R81_USB_FIRMWARE_FORENSICS
          path: /tmp/okn-r81/out/**
          if-no-files-found: error
          retention-days: 30


  diagnose-r81:
    name: Capture R81 run diagnostics
    if: ${{ always() }}
    needs: build-forensics
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout main for diagnostic report
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Capture exact run job/step state and failed log tail
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build-forensics.result }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r81diag
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          AUTH=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          curl -fsSL "${AUTH[@]}" "$API/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" \
            -o /tmp/r81diag/jobs.json

          python3 - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads(Path('/tmp/r81diag/jobs.json').read_text())
          jobs=j.get('jobs',[])
          build=next((x for x in jobs if x.get('name')=='Build passive S25+ USB forensics APK + offline firmware analysis'),None)
          report={
            'run_id':os.environ.get('GITHUB_RUN_ID'),
            'run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),
            'repository':os.environ.get('GITHUB_REPOSITORY'),
            'head_sha':os.environ.get('GITHUB_SHA'),
            'ref':os.environ.get('GITHUB_REF'),
            'event':os.environ.get('GITHUB_EVENT_NAME'),
            'build_result':os.environ.get('BUILD_RESULT'),
            'build_job':build,
          }
          Path('/tmp/r81diag/summary.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n')
          if build and build.get('id'):
              Path('/tmp/r81diag/build_job_id.txt').write_text(str(build['id']))
          PY

          : > /tmp/r81diag/build-log-tail.txt
          if [ -s /tmp/r81diag/build_job_id.txt ]; then
            JOB_ID="$(cat /tmp/r81diag/build_job_id.txt)"
            set +e
            curl -fsSL "${AUTH[@]}" "$API/actions/jobs/$JOB_ID/logs" -o /tmp/r81diag/build.log
            RC=$?
            set -e
            if [ "$RC" -eq 0 ]; then
              tail -n 180 /tmp/r81diag/build.log > /tmp/r81diag/build-log-tail.txt
            else
              printf 'JOB_LOG_DOWNLOAD_FAILED rc=%s\n' "$RC" > /tmp/r81diag/build-log-tail.txt
            fi
          fi

          {
            echo '# R81 LAST GITHUB ACTIONS DIAGNOSTIC'
            echo
            echo "- Run ID: \`$GITHUB_RUN_ID\`"
            echo "- Attempt: \`$GITHUB_RUN_ATTEMPT\`"
            echo "- Event: \`$GITHUB_EVENT_NAME\`"
            echo "- Ref: \`$GITHUB_REF\`"
            echo "- Head SHA: \`$GITHUB_SHA\`"
            echo "- Build result: \`$BUILD_RESULT\`"
            echo
            echo '## Job / step metadata'
            echo '~~~json'
            cat /tmp/r81diag/summary.json
            echo '~~~'
            echo
            echo '## Build job log tail'
            echo '~~~text'
            cat /tmp/r81diag/build-log-tail.txt
            echo '~~~'
          } > /tmp/r81diag/R81_LAST_DIAGNOSTIC.md

      - name: Persist diagnostic report to main
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/r81diag/R81_LAST_DIAGNOSTIC.md .github/R81_LAST_DIAGNOSTIC.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/R81_LAST_DIAGNOSTIC.md
          if git diff --cached --quiet; then
            echo "R81_DIAGNOSTIC_UNCHANGED=true"
            exit 0
          fi
          git commit -m "Record R81 Actions diagnostic [skip ci]"
          git push origin HEAD:main

      - name: Upload diagnostic report
        uses: actions/upload-artifact@v7
        with:
          name: R81-RUN-DIAGNOSTIC
          path: |
            /tmp/r81diag/R81_LAST_DIAGNOSTIC.md
            /tmp/r81diag/summary.json
            /tmp/r81diag/build-log-tail.txt
          if-no-files-found: error
          retention-days: 30
