name: Build OKN_DSP Android

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Find and expand OKN_DSP source package
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 1 -type f -name 'OKN_DSP_v*.zip' -printf '%f\n' | sort -V | tail -n 1)"
          if [ -n "$ZIP" ]; then
            echo "Expanding newest source package: $ZIP"
            rm -rf /tmp/okn_zip
            mkdir -p /tmp/okn_zip
            unzip -q "$ZIP" -d /tmp/okn_zip

            ROOT="$(find /tmp/okn_zip -maxdepth 3 -type f -name pubspec.yaml -printf '%h\n' | head -n 1)"
            if [ -z "$ROOT" ]; then
              echo "ERROR: $ZIP does not contain pubspec.yaml"
              exit 1
            fi

            # The newest ZIP is the source of truth for this build.
            rm -rf lib test assets Sources android
            rm -f pubspec.yaml analysis_options.yaml BUILD_VERSION.txt README.md .gitignore
            cp -a "$ROOT"/. .
            test -f pubspec.yaml
            echo "has_source=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -f pubspec.yaml ]; then
            echo "No version ZIP found; using Flutter source already present at repository root."
            echo "has_source=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "No pubspec.yaml or OKN_DSP_v*.zip found. Nothing to build on this push."
          echo "has_source=false" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        if: steps.source.outputs.has_source == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        if: steps.source.outputs.has_source == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preserve OKN_DSP source
        if: steps.source.outputs.has_source == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/okn_dsp_source
          mkdir -p /tmp/okn_dsp_source
          for item in lib test assets Sources pubspec.yaml analysis_options.yaml BUILD_VERSION.txt README.md .gitignore; do
            if [ -e "$item" ]; then
              cp -a "$item" /tmp/okn_dsp_source/
            fi
          done

      - name: Generate Android platform project
        if: steps.source.outputs.has_source == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          flutter create \
            --platforms=android \
            --org com.okn \
            --project-name okn_dsp \
            .

      - name: Restore OKN_DSP source
        if: steps.source.outputs.has_source == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf lib test assets Sources
          cp -a /tmp/okn_dsp_source/lib ./lib
          cp -a /tmp/okn_dsp_source/test ./test
          cp -a /tmp/okn_dsp_source/assets ./assets
          cp -a /tmp/okn_dsp_source/Sources ./Sources
          cp -a /tmp/okn_dsp_source/pubspec.yaml ./pubspec.yaml
          cp -a /tmp/okn_dsp_source/analysis_options.yaml ./analysis_options.yaml
          cp -a /tmp/okn_dsp_source/BUILD_VERSION.txt ./BUILD_VERSION.txt
          cp -a /tmp/okn_dsp_source/README.md ./README.md
          cp -a /tmp/okn_dsp_source/.gitignore ./.gitignore

      - name: Configure Android permissions and app name
        if: steps.source.outputs.has_source == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text()
          permissions = '''
              <uses-feature android:name="android.hardware.bluetooth_le" android:required="false" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
          '''
          if 'android.permission.BLUETOOTH_SCAN' not in text:
              text = text.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' + permissions,
              )
          text = text.replace('android:label="okn_dsp"', 'android:label="OKN_DSP"')
          p.write_text(text)
          PY

      - name: Install dependencies
        if: steps.source.outputs.has_source == 'true'
        run: flutter pub get

      - name: Generate launcher icons
        if: steps.source.outputs.has_source == 'true'
        run: dart run flutter_launcher_icons

      - name: Analyze
        if: steps.source.outputs.has_source == 'true'
        run: flutter analyze --no-fatal-infos

      - name: Test
        if: steps.source.outputs.has_source == 'true'
        run: flutter test

      - name: Build release APK
        if: steps.source.outputs.has_source == 'true'
        run: flutter build apk --release

      - name: Package APK and SHA256
        if: steps.source.outputs.has_source == 'true'
        id: package
        shell: bash
        run: |
          set -euxo pipefail
          VERSION="$(awk '/^version:/ {print $2}' pubspec.yaml | tr '+.' '_')"
          NAME="OKN_DSP_${VERSION}"
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk "release/${NAME}.apk"
          sha256sum "release/${NAME}.apk" > Sources/APK_SHA256.txt
          cp Sources/APK_SHA256.txt release/APK_SHA256.txt
          echo "artifact_name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        if: steps.source.outputs.has_source == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            release/*.apk
            release/APK_SHA256.txt
          if-no-files-found: error
          retention-days: 30
