name: Build OKN_DSP ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_v*.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find newest OKN_DSP ZIP
        id: project
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'OKN_DSP_v*.zip' -printf '%f\n' | sort -V | tail -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No OKN_DSP_v*.zip found in repository root"
            exit 1
          fi
          VERSION=$(echo "$ZIP_FILE" | sed -n 's/^OKN_DSP_\(v[0-9][0-9]*\)\.zip$/\1/p')
          if [ -z "$VERSION" ]; then VERSION="build"; fi
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract project
        shell: bash
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q "${{ steps.project.outputs.zip }}" -d buildsrc

      - name: Build debug APK
        working-directory: buildsrc
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        shell: bash
        run: |
          cp buildsrc/app/build/outputs/apk/debug/app-debug.apk "OKN_DSP_${{ steps.project.outputs.version }}-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN_DSP_${{ steps.project.outputs.version }}_APK
          path: OKN_DSP_${{ steps.project.outputs.version }}-debug.apk
          if-no-files-found: error
