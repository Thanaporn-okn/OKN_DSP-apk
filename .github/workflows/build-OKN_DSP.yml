name: Build OKN_DSP APK

on:
  push:
    paths:
      - 'OKN_DSP_v*_source.zip'
      - '.github/workflows/build-OKN_DSP.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest OKN_DSP source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'OKN_DSP_v*_source.zip' -printf '%f\n' | sort -V | tail -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "No OKN_DSP_v*_source.zip yet. Upload the source ZIP and this workflow will run automatically."
            echo "SKIP_BUILD=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "SKIP_BUILD=false" >> "$GITHUB_ENV"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          BASE="${ZIP_FILE%_source.zip}"
          echo "BUILD_NAME=$BASE" >> "$GITHUB_ENV"
          echo "Building $ZIP_FILE"

      - name: Extract project
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          rm -rf project
          mkdir project
          unzip -q "$ZIP_FILE" -d project
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts

      - name: Static preflight
        if: env.SKIP_BUILD != 'true'
        working-directory: project
        shell: bash
        run: |
          PREFLIGHT="$(find . -maxdepth 1 -type f -name 'preflight_*.py' | sort -V | tail -n 1)"
          if [ -n "$PREFLIGHT" ]; then python3 "$PREFLIGHT"; else echo "No preflight script; continuing."; fi

      - name: Set up JDK 17
        if: env.SKIP_BUILD != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: env.SKIP_BUILD != 'true'
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        if: env.SKIP_BUILD != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        if: env.SKIP_BUILD != 'true'
        working-directory: project
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          APK="$(find project/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" "${BUILD_NAME}.apk"
          ls -lh "${BUILD_NAME}.apk"

      - name: Upload APK artifact
        if: env.SKIP_BUILD != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}-APK
          path: ${{ env.BUILD_NAME }}.apk
          if-no-files-found: error
          retention-days: 30
