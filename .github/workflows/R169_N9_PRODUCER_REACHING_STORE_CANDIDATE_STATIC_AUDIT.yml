name: R169 N9 producer reaching-store candidate static audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R169_N9_PRODUCER_REACHING_STORE_CANDIDATE_STATIC_AUDIT.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r169-static-${{ github.ref }}
  cancel-in-progress: true

env:
  FLASH_ALLOWED: "NO"

jobs:
  static_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          mkdir -p /tmp/r169/evidence
          cat > /tmp/r169/evidence/R169_SAFETY.txt <<'EOF'
          MODE=OFFLINE_STATIC_IL_TEXT_ONLY
          FLASH_ALLOWED=NO
          USB_OR_BOARD_CONTACT=NO
          VENDOR_EXE_DLL_APK_EXECUTED=NO
          OFFLINE_DECRYPT_EXECUTED=NO
          AA55_OR_LINEIN_AA55_SENT=NO
          RUNTIME_0X11_OR_0XFE_SENT=NO
          FLASH_READ_ERASE_WRITE_EXECUTED=NO
          DISCOVERED_FRAME_LIVE_AUTHORIZED=NO
          HARDWARE_MODIFICATION=FORBIDDEN
          EOF

      - name: Download pinned R168 evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: "10854264595"
          path: /tmp/r169/r168
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 36115263136

      - name: Download pinned R157 raw evidence chain
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: "10820682068"
          path: /tmp/r169/r157
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 36028455796

      - name: Trace producer/store candidates without execution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import collections, hashlib, io, json, re, zipfile

          base = Path("/tmp/r169")
          out = base / "evidence"
          out.mkdir(parents=True, exist_ok=True)

          def open_inner(folder, name, expected_sha):
              p = base / folder / name
              data = p.read_bytes()
              got = hashlib.sha256(data).hexdigest()
              assert got == expected_sha, (name, got, expected_sha)
              sha_file = p.with_name(p.name + ".sha256")
              assert sha_file.exists(), f"missing {sha_file.name}"
              assert sha_file.read_text().split()[0] == expected_sha
              return zipfile.ZipFile(io.BytesIO(data))

          r168 = open_inner(
              "r168",
              "R168_N9_LOCAL37_REACHING_DEFINITIONS_EVIDENCE.zip",
              "a943f4f999ebfc194ce6a6e7eac5cf86d5c034aa64ec6bf77c1270f1a2b64713",
          )
          prior = json.loads(r168.read("R168_DECISION.json"))
          assert prior["revision"] == "R168"
          assert prior["LOCAL37_FOUR_BYTE_WORD_WRITE_SURFACE_PROVEN"] is True
          assert prior["LOCAL67_SINGLE_DEFINITION_PROVEN"] is True
          assert prior["EXACT_LOCAL37_BYTES_PROVEN"] is False
          assert prior["OFFLINE_DECRYPT_AUTHORIZED"] is False
          assert prior["FLASH_ALLOWED"] is False

          r157 = open_inner(
              "r157",
              "R157_N9_LOCAL29_LOCAL81_NONNULL_LOCAL93_LOOP_BRANCH_EVIDENCE.zip",
              "f974c64c63eea5f2b940c76101f4ab6e769803f5630a2d87d21d08679c321609",
          )

          prefix = "r156/r155/r154/r153/r152/r151/r150/r149/r148/r147/r146/r145/r144/r143/"
          raw = r157.read(prefix + "R143_N9_METHOD.il")
          assert hashlib.sha256(raw).hexdigest() == "5a3964c1f4bd8db455e6882a4ce6f90667e1a9abc6e1fafd10440b31006e4a33"
          text = raw.decode()

          r155 = json.loads(r157.read("r156/r155/R155_DECISION.json"))
          r156 = json.loads(r157.read("r156/R156_DECISION.json"))
          assert r155["R155_SYMBOLICALLY_ACCOUNTED_CONDITIONAL_STATES"] == [33, 215, 458]
          assert r156["LOCAL77_MONOTONIC_ZERO_TO_GUARD_EXIT_3"] is True
          assert r156["LOCAL79_MONOTONIC_ZERO_TO_GUARD_EXIT_3"] is True

          rows = []
          for line in text.splitlines():
              m = re.match(r"\s*(IL_[0-9a-f]+):\s+(\S+)(?:\s+(.*))?$", line)
              if m:
                  rows.append((m.group(1), m.group(2), (m.group(3) or "").split(" //", 1)[0].strip()))
          pos = {lab: i for i, (lab, _, _) in enumerate(rows)}

          sm = re.search(r"IL_0012:\s+switch \((.*?)\)\n", text, re.S)
          assert sm
          targets = [x.strip() for x in sm.group(1).split(",")]
          assert len(targets) == 689
          state_of = {lab: i for i, lab in enumerate(targets)}

          target_positions = sorted((pos[lab], st, lab) for st, lab in enumerate(targets))
          blocks = {}
          for i, (p0, st, lab) in enumerate(target_positions):
              p1 = target_positions[i + 1][0] if i + 1 < len(target_positions) else len(rows)
              blocks[st] = rows[p0:p1]

          def store_sites(local):
              ret = []
              for st, block in blocks.items():
                  for lab, op, arg in block:
                      if op in ("stloc", "stloc.s") and arg == str(local):
                          ret.append((st, lab))
              return sorted(ret)

          expected_stores = {
              105: [(46, "IL_5d20"), (235, "IL_2620"), (299, "IL_611c"), (368, "IL_47f6"), (664, "IL_488e")],
              82:  [(342, "IL_61d4"), (523, "IL_5a87"), (589, "IL_3dd8"), (596, "IL_37c3"), (669, "IL_53c1")],
              76:  [(2, "IL_21e0"), (15, "IL_5444"), (370, "IL_55e3")],
              24:  [(57, "IL_1177")],
              22:  [(239, "IL_1c9c")],
              37:  [(668, "IL_403a")],
              67:  [(313, "IL_1944")],
          }
          for local, expected in expected_stores.items():
              assert store_sites(local) == expected, (local, store_sites(local))

          # Conservative dispatcher graph:
          # - direct branch target that is itself a switch target
          # - literal state values that are immediately dispatched through IL_0012/IL_000e
          succ = {st: set() for st in blocks}
          for st, block in blocks.items():
              for i, (_, op, arg) in enumerate(block):
                  if op.startswith("br") or op in ("beq", "bne.un", "blt", "ble", "bgt", "bge"):
                      if arg in state_of:
                          succ[st].add(state_of[arg])
                  n = None
                  if op in ("ldc.i4", "ldc.i4.s"):
                      try:
                          n = int(arg)
                      except Exception:
                          pass
                  elif op.startswith("ldc.i4."):
                      tail = op[len("ldc.i4."):]
                      if tail.isdigit():
                          n = int(tail)
                  if n is not None and 0 <= n < len(targets):
                      near = block[i+1:i+7]
                      if any(
                          (x[1] == "br" and x[2] in ("IL_0012", "IL_000e"))
                          or (x[1] in ("stloc", "stloc.s") and x[2] == "95")
                          for x in near
                      ):
                          succ[st].add(n)

          def reachable(start):
              seen = {start}
              q = collections.deque([start])
              while q:
                  u = q.popleft()
                  for v in succ[u]:
                      if v not in seen:
                          seen.add(v)
                          q.append(v)
              return seen

          rev = {st: set() for st in blocks}
          for u, vs in succ.items():
              for v in vs:
                  rev[v].add(u)

          def reverse_reachable(goal):
              seen = {goal}
              q = collections.deque([goal])
              while q:
                  u = q.popleft()
                  for v in rev[u]:
                      if v not in seen:
                          seen.add(v)
                          q.append(v)
              return seen

          def shortest(start, goal):
              q = collections.deque([(start, [start])])
              seen = {start}
              while q:
                  u, path = q.popleft()
                  if u == goal:
                      return path
                  for v in sorted(succ[u]):
                      if v not in seen:
                          seen.add(v)
                          q.append((v, path + [v]))
              return None

          from_alloc = reachable(668)
          to_word_producer = reverse_reachable(57)
          to_remainder_producer = reverse_reachable(239)
          to_state96 = reverse_reachable(96)

          candidate = {}
          for producer_name, producer_state, backset in [
              ("local24_word", 57, to_word_producer),
              ("local22_remainder", 239, to_remainder_producer),
          ]:
              candidate[producer_name] = {}
              for local in (105, 82, 76):
                  cands = []
                  for st, lab in expected_stores[local]:
                      if st in from_alloc and st in backset and producer_state in reachable(st):
                          cands.append({
                              "state": st,
                              "label": lab,
                              "path_668_to_store": shortest(668, st),
                              "path_store_to_producer": shortest(st, producer_state),
                          })
                  candidate[producer_name][str(local)] = cands

          # There must be at least one conservative candidate for local105/local82 on word path.
          assert candidate["local24_word"]["105"]
          assert candidate["local24_word"]["82"]

          result = {
              "revision": "R169",
              "R168_RUN_ID": 36115263136,
              "R168_JOB_ID": 108007751883,
              "R168_ARTIFACT_ID": 10854264595,
              "R168_ARTIFACT_DIGEST": "sha256:fc3b6c0f384a1c970b1be302f27f0724dadc6051954929052d88f6ec4ec4e2ee",
              "R168_INNER_SHA256": "a943f4f999ebfc194ce6a6e7eac5cf86d5c034aa64ec6bf77c1270f1a2b64713",
              "N9_SHA256": hashlib.sha256(raw).hexdigest(),
              "DISPATCH_STATE_COUNT": len(targets),
              "CONSERVATIVE_DISPATCH_GRAPH_BUILT": True,
              "LOCAL24_WORD_PRODUCER_STATE": 57,
              "LOCAL22_REMAINDER_PRODUCER_STATE": 239,
              "LOCAL105_STORE_SITES_PINNED": expected_stores[105],
              "LOCAL82_STORE_SITES_PINNED": expected_stores[82],
              "LOCAL76_STORE_SITES_PINNED": expected_stores[76],
              "PRODUCER_REACHING_STORE_CANDIDATES": candidate,
              "CANDIDATE_ANALYSIS_IS_OVERAPPROXIMATION": True,
              "EXACT_PER_VISIT_REACHING_STORE_SELECTION_PROVEN": False,
              "LOCAL76_REACHING_DEFINITION_FULLY_RESOLVED": False,
              "LOCAL82_REACHING_DEFINITION_FULLY_RESOLVED": False,
              "LOCAL105_REACHING_DEFINITION_FULLY_RESOLVED": False,
              "R155_R156_LOOP_FACTS_PRESERVED": True,
              "EXACT_LOCAL37_BYTES_PROVEN": False,
              "LOCAL29_BYTES_AT_STATE94_PROVEN": False,
              "OFFLINE_DECRYPT_AUTHORIZED": False,
              "H15_PLAINTEXT_RECOVERED": False,
              "ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD": False,
              "FLASH_ALLOWED": False,
              "NEXT": "R170: replace the conservative graph candidates with per-visit exact reaching-definition selection using the proven local38/local77/local79 schedules and exact branch predicates. Only after local105/local82/local76 stores are selected for each producer visit may local37 bytes be reconstructed offline."
          }

          (out / "R169_DECISION.json").write_text(json.dumps(result, indent=2) + "\n")
          (out / "R169_REACHING_STORE_CANDIDATES.json").write_text(json.dumps(candidate, indent=2) + "\n")
          (out / "R168_DECISION.json").write_text(json.dumps(prior, indent=2) + "\n")
          print(json.dumps(result, indent=2))
          PYCODE

      - name: Package R169 evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r169/evidence
          zip -9 -r /tmp/R169_N9_PRODUCER_REACHING_STORE_CANDIDATE_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/R169_N9_PRODUCER_REACHING_STORE_CANDIDATE_EVIDENCE.zip \
            > /tmp/R169_N9_PRODUCER_REACHING_STORE_CANDIDATE_EVIDENCE.zip.sha256

      - name: Upload R169 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: R169-N9-PRODUCER-REACHING-STORE-CANDIDATE-STATIC-EVIDENCE
          path: |
            /tmp/R169_N9_PRODUCER_REACHING_STORE_CANDIDATE_EVIDENCE.zip
            /tmp/R169_N9_PRODUCER_REACHING_STORE_CANDIDATE_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          grep -F '"CONSERVATIVE_DISPATCH_GRAPH_BUILT": true' /tmp/r169/evidence/R169_DECISION.json
          grep -F '"EXACT_PER_VISIT_REACHING_STORE_SELECTION_PROVEN": false' /tmp/r169/evidence/R169_DECISION.json
          grep -F '"EXACT_LOCAL37_BYTES_PROVEN": false' /tmp/r169/evidence/R169_DECISION.json
          grep -F '"OFFLINE_DECRYPT_AUTHORIZED": false' /tmp/r169/evidence/R169_DECISION.json
          grep -F '"FLASH_ALLOWED": false' /tmp/r169/evidence/R169_DECISION.json
          echo R169_PRODUCER_REACHING_STORE_CANDIDATE_AUDIT_COMPLETE=YES
          echo FLASH_ALLOWED=NO
