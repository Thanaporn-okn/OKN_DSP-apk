name: OKN BP1048P4 MASTER V9 UFE PERIPHERAL FRAME RECOVERY

"on":
  workflow_dispatch:

permissions:
  contents: read

env:
  GOLOPINE_WINDOWS_URL: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-08.exe_.zip"
  LIVE_DSP_CONNECTED: "NO"
  USB_TARGET_ACCESS: "NO"
  HOST_TO_DSP_IO: "NO"
  HID_CONNECT_ALLOWED: "NO"
  HID_SEND_ALLOWED: "NO"
  HID_WRITE_ALLOWED: "NO"
  FEATURE_REPORT_ALLOWED: "NO"
  FLASH_ALLOWED: "NO"
  ERASE_ALLOWED: "NO"
  WRITE_ALLOWED: "NO"

jobs:
  master-v9:
    name: MASTER V9 UFE peripheral frame recovery offline
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Safety gate and workspace
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          foreach($n in @(
            "LIVE_DSP_CONNECTED","USB_TARGET_ACCESS","HOST_TO_DSP_IO",
            "HID_CONNECT_ALLOWED","HID_SEND_ALLOWED","HID_WRITE_ALLOWED",
            "FEATURE_REPORT_ALLOWED","FLASH_ALLOWED","ERASE_ALLOWED","WRITE_ALLOWED"
          )){
            if((Get-Item "Env:$n").Value -ne "NO"){ throw "$n must be NO" }
          }

          $root="C:\okn_v9"
          if(Test-Path $root){ Remove-Item -Recurse -Force $root }
          New-Item -ItemType Directory -Force -Path `
            "$root\download","$root\pkg","$root\harness","$root\jit",`
            "$root\evidence","$root\out" | Out-Null

          @"
          MODE=UFE_PERIPHERAL_FRAME_RECOVERY_OFFLINE
          LIVE_DSP_CONNECTED=NO
          USB_TARGET_ACCESS=NO
          HOST_TO_DSP_IO=NO
          HID_CONNECT_ALLOWED=NO
          HID_SEND_ALLOWED=NO
          HID_WRITE_ALLOWED=NO
          FEATURE_REPORT_ALLOWED=NO
          FLASH_ALLOWED=NO
          "@ | Set-Content "$root\evidence\00_SAFETY.txt"

      - name: Download untouched official vendor EXE
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v9"

          curl.exe -fL --retry 6 --retry-all-errors --retry-delay 2 `
            --connect-timeout 20 --max-time 300 `
            $env:GOLOPINE_WINDOWS_URL -o "$root\download\vendor.zip"
          if($LASTEXITCODE -ne 0){ throw "download failed" }

          Expand-Archive -Force "$root\download\vendor.zip" "$root\pkg"

          $exe=Get-ChildItem "$root\pkg" -Recurse -File -Filter *.exe |
            Where-Object {
              $_.FullName -notmatch '\\__MACOSX\\' -and $_.Name -notlike '._*'
            } |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if(-not $exe){ throw "vendor EXE missing" }
          if($exe.Length -lt 100000){ throw "vendor EXE too small" }

          Copy-Item $exe.FullName "$root\vendor.exe" -Force
          $b=[IO.File]::ReadAllBytes("$root\vendor.exe")
          if($b[0] -ne 0x4D -or $b[1] -ne 0x5A){ throw "not MZ" }

          @"
          FILE=$($exe.FullName)
          BYTES=$($exe.Length)
          SHA256=$((Get-FileHash "$root\vendor.exe" -Algorithm SHA256).Hash)
          ORIGINAL_BINARY_MODIFIED=NO
          "@ | Set-Content "$root\evidence\01_VENDOR_IDENTITY.txt"

      - name: Build x86 pure UFE frame probe and JIT pointer helper
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v9"

          @'
          using System;
          using System.IO;
          using System.Linq;
          using System.Reflection;
          using System.Runtime.CompilerServices;
          using System.Runtime.Serialization;
          using System.Collections;
          using System.Collections.Generic;

          class UfeProbe
          {
              static List<string> L=new List<string>();

              static string Hex(object o)
              {
                  if(o==null)return "<NULL>";
                  if(o is byte[])return BitConverter.ToString((byte[])o).Replace("-","");
                  var en=o as IEnumerable<byte>;
                  if(en!=null)
                  {
                      try{return BitConverter.ToString(en.ToArray()).Replace("-","");}
                      catch(Exception ex){return "<ENUM_EXCEPTION:"+ex.GetBaseException().Message+">";}
                  }
                  return Convert.ToString(o,System.Globalization.CultureInfo.InvariantCulture);
              }

              static object NewLoose(Type t)
              {
                  try{return Activator.CreateInstance(t,true);}
                  catch{
                      try{return FormatterServices.GetUninitializedObject(t);}
                      catch{return null;}
                  }
              }

              static object Sample(Type t,int mode,int addr)
              {
                  if(t==typeof(byte))return (byte)(mode==0?0:mode==1?1:0x57);
                  if(t==typeof(sbyte))return (sbyte)(mode==0?0:1);
                  if(t==typeof(short))return (short)(mode==0?0:mode==1?1:addr);
                  if(t==typeof(ushort))return (ushort)(mode==0?0:mode==1?1:addr);
                  if(t==typeof(int))return mode==0?0:mode==1?1:addr;
                  if(t==typeof(uint))return (uint)(mode==0?0:mode==1?1:addr);
                  if(t==typeof(long))return (long)(mode==0?0:mode==1?1:addr);
                  if(t==typeof(ulong))return (ulong)(mode==0?0:mode==1?1:addr);
                  if(t==typeof(float))return mode==0?0f:mode==1?0.5f:1f;
                  if(t==typeof(double))return mode==0?0d:mode==1?0.5d:1d;
                  if(t==typeof(bool))return mode!=0;
                  if(t==typeof(string))return mode==0?"":"X";
                  if(t==typeof(byte[]))
                  {
                      if(mode==0)return new byte[0];
                      if(mode==1)return new byte[]{0,0,0,0};
                      return new byte[]{0x40,0,0,0};
                  }
                  if(t.IsEnum)
                  {
                      Array a=Enum.GetValues(t);
                      if(a.Length==0)return Activator.CreateInstance(t);
                      return a.GetValue(Math.Min(mode,a.Length-1));
                  }
                  Type n=Nullable.GetUnderlyingType(t);
                  if(n!=null)return Sample(n,mode,addr);
                  if(t.IsArray)
                  {
                      Type e=t.GetElementType();
                      Array a=Array.CreateInstance(e,mode==0?0:1);
                      if(a.Length==1)
                      {
                          object v=Sample(e,mode,addr);
                          if(v!=null)a.SetValue(v,0);
                      }
                      return a;
                  }
                  if(t.IsGenericType && t.GetGenericTypeDefinition()==typeof(List<>))
                  {
                      return Activator.CreateInstance(t);
                  }
                  return null;
              }

              static void Fill(object o,int mode,int addr)
              {
                  if(o==null)return;
                  Type t=o.GetType();

                  foreach(var f in t.GetFields(
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance))
                  {
                      if(f.IsInitOnly)continue;
                      object v=Sample(f.FieldType,mode,addr);
                      if(v!=null)
                      {
                          try{f.SetValue(o,v);}catch{}
                      }
                  }

                  foreach(var p in t.GetProperties(
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance))
                  {
                      if(!p.CanWrite || p.GetIndexParameters().Length!=0)continue;
                      object v=Sample(p.PropertyType,mode,addr);
                      if(v!=null)
                      {
                          try{p.SetValue(o,v,null);}catch{}
                      }
                  }
              }

              static void Inventory(Type t)
              {
                  if(t==null)return;
                  L.Add("TYPE "+t.FullName+" BASE="+(t.BaseType==null?"<NULL>":t.BaseType.FullName));

                  if(t.IsEnum)
                  {
                      foreach(object v in Enum.GetValues(t))
                          L.Add(" ENUM "+Enum.GetName(t,v)+"="+Convert.ToInt64(v));
                  }

                  foreach(var f in t.GetFields(
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Static|BindingFlags.Instance))
                  {
                      string c="";
                      try{if(f.IsLiteral)c=" CONST="+Convert.ToString(f.GetRawConstantValue());}catch{}
                      L.Add(" FIELD "+f.FieldType.FullName+" "+f.Name+c);
                  }

                  foreach(var p in t.GetProperties(
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Static|BindingFlags.Instance))
                      L.Add(" PROPERTY "+p.PropertyType.FullName+" "+p.Name+
                            " RW="+p.CanRead+"/"+p.CanWrite);

                  foreach(var c in t.GetConstructors(
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance))
                      L.Add(" CTOR "+c.ToString());

                  foreach(var m in t.GetMethods(
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Static|
                      BindingFlags.Instance|BindingFlags.DeclaredOnly))
                      L.Add(" METHOD "+m.ToString()+" RETURN="+m.ReturnType.FullName);
              }

              static void TryToByteArray(object o,string label)
              {
                  if(o==null){L.Add(label+"=<NULL_OBJECT>");return;}
                  MethodInfo m=o.GetType().GetMethod("ToByteArray",
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance,
                      null,Type.EmptyTypes,null);
                  if(m==null){L.Add(label+"=NO_ToByteArray");return;}
                  try{
                      object r=m.Invoke(o,null);
                      L.Add(label+"="+Hex(r));
                  }catch(Exception ex){
                      L.Add(label+"_EXCEPTION="+ex.GetBaseException().ToString());
                  }
              }

              static void Main(string[] a)
              {
                  string exe=Path.GetFullPath(a[0]);
                  string outp=Path.GetFullPath(a[1]);
                  Directory.SetCurrentDirectory(Path.GetDirectoryName(exe));

                  L.Add("MODE=PURE_UFE_FRAME_ONLY");
                  L.Add("ENTRYPOINT_INVOKED=NO");
                  L.Add("HID_CONNECT_INVOKED=NO");
                  L.Add("HID_SEND_INVOKED=NO");
                  L.Add("HID_WRITE_INVOKED=NO");
                  L.Add("FEATURE_REPORT_INVOKED=NO");

                  try
                  {
                      Assembly asm=Assembly.LoadFile(exe);
                      RuntimeHelpers.RunModuleConstructor(asm.ManifestModule.ModuleHandle);
                      L.Add("MODULE_INITIALIZER=SUCCESS");

                      string[] names={
                          "DSTech_AudioDSP_Client.UFEHeader",
                          "DSTech_AudioDSP_Client.UFEtype",
                          "DSTech_AudioDSP_Client.Actuator",
                          "DSTech_AudioDSP_Client.Sensor",
                          "DSTech_AudioDSP_Client.PeriperalCommand",
                          "DSTech_AudioDSP_Client.GetDevcieDescriptionCommand",
                          "DSTech_AudioDSP_Client.WriteActuatorPeriperalCommand",
                          "DSTech_AudioDSP_Client.ReadActuatorPeriperalCommand",
                          "DSTech_AudioDSP_Client.ReadSensorPeriperalCommand",
                          "DSTech_AudioDSP_Client.ReadSensorBulkCommand",
                          "DSTech_AudioDSP_Client.ReadSensorFifoCommand",
                          "DSTech_AudioDSP_Client.UFEcommandBridge",
                          "DSTech_AudioDSP_Client.DeviceCommunicationStream",
                          "DSTech_AudioDSP_Client.DSTechAcutatorCommand",
                          "DSTech_AudioDSP_Client.report",
                          "DSTech_AudioDSP_Client.HIDInterface",
                          "DSTech_AudioDSP_Client.Hid"
                      };
                      foreach(string n in names)Inventory(asm.GetType(n,false));

                      Type getDesc=asm.GetType("DSTech_AudioDSP_Client.GetDevcieDescriptionCommand",false);
                      if(getDesc!=null)
                      {
                          object o=NewLoose(getDesc);
                          TryToByteArray(o,"GET_DEVICE_DESCRIPTION");
                      }

                      Type pc=asm.GetType("DSTech_AudioDSP_Client.PeriperalCommand",false);
                      if(pc!=null && !pc.IsAbstract)
                      {
                          object o=NewLoose(pc);
                          TryToByteArray(o,"PERIPHERAL_BASE");
                      }

                      Type act=asm.GetType("DSTech_AudioDSP_Client.Actuator",false);
                      Type wac=asm.GetType("DSTech_AudioDSP_Client.WriteActuatorPeriperalCommand",false);
                      Type rac=asm.GetType("DSTech_AudioDSP_Client.ReadActuatorPeriperalCommand",false);

                      if(act!=null)
                      {
                          int[] addresses={0,1,0x57,0x58,0x1234};

                          foreach(int mode in new[]{0,1,2})
                          foreach(int addr in addresses)
                          foreach(int cascade in new[]{0,1,2})
                          {
                              object ao=NewLoose(act);
                              Fill(ao,mode,addr);

                              L.Add("ACTUATOR_STATE_BEGIN mode="+mode+" addr="+addr+" cascade="+cascade);
                              foreach(var f in act.GetFields(
                                  BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance))
                              {
                                  try{
                                      object v=f.GetValue(ao);
                                      L.Add(" ACT_FIELD "+f.Name+"="+Hex(v));
                                  }catch{}
                              }
                              foreach(var p in act.GetProperties(
                                  BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance))
                              {
                                  if(!p.CanRead || p.GetIndexParameters().Length!=0)continue;
                                  try{
                                      object v=p.GetValue(ao,null);
                                      L.Add(" ACT_PROP "+p.Name+"="+Hex(v));
                                  }catch{}
                              }
                              L.Add("ACTUATOR_STATE_END");

                              if(wac!=null)
                              {
                                  foreach(var c in wac.GetConstructors(
                                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance))
                                  {
                                      var ps=c.GetParameters();
                                      if(ps.Length==2 && ps[0].ParameterType==act &&
                                         ps[1].ParameterType==typeof(int))
                                      {
                                          try{
                                              object cmd=c.Invoke(new object[]{ao,cascade});
                                              TryToByteArray(cmd,
                                                  "WRITE_ACT mode="+mode+" addr="+addr+
                                                  " cascade="+cascade);
                                          }catch(Exception ex){
                                              L.Add("WRITE_ACT_CTOR_EXCEPTION mode="+mode+
                                                    " addr="+addr+" cascade="+cascade+" => "+
                                                    ex.GetBaseException().ToString());
                                          }
                                      }
                                  }
                              }

                              if(rac!=null)
                              {
                                  foreach(var c in rac.GetConstructors(
                                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance))
                                  {
                                      var ps=c.GetParameters();
                                      if(ps.Length==2 && ps[0].ParameterType==act &&
                                         ps[1].ParameterType==typeof(int))
                                      {
                                          try{
                                              object cmd=c.Invoke(new object[]{ao,cascade});
                                              TryToByteArray(cmd,
                                                  "READ_ACT mode="+mode+" addr="+addr+
                                                  " cascade="+cascade);
                                          }catch(Exception ex){
                                              L.Add("READ_ACT_CTOR_EXCEPTION mode="+mode+
                                                    " addr="+addr+" cascade="+cascade+" => "+
                                                    ex.GetBaseException().ToString());
                                          }
                                      }
                                  }
                              }
                          }
                      }

                      // Identify concrete DeviceCommunicationStream subclasses and their write methods.
                      Type dcs=asm.GetType("DSTech_AudioDSP_Client.DeviceCommunicationStream",false);
                      if(dcs!=null)
                      {
                          foreach(Type t in asm.GetTypes().Where(x=>x!=null && x!=dcs && dcs.IsAssignableFrom(x)))
                          {
                              L.Add("DCS_SUBCLASS "+t.FullName);
                              foreach(var m in t.GetMethods(
                                  BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance|
                                  BindingFlags.DeclaredOnly))
                              {
                                  if(m.Name=="Write" || m.Name=="WriteLine" ||
                                     m.Name.ToLowerInvariant().Contains("send"))
                                      L.Add(" DCS_METHOD "+m.ToString());
                              }
                          }
                      }
                  }
                  catch(Exception ex)
                  {
                      L.Add("TOP_EXCEPTION="+ex.ToString());
                  }

                  File.WriteAllLines(outp,L.ToArray());
              }
          }
          '@ | Set-Content "$root\harness\UfeProbe.cs"

          @'
          using System;
          using System.IO;
          using System.Linq;
          using System.Reflection;
          using System.Runtime.CompilerServices;
          using System.Threading;
          using System.Collections.Generic;

          class JitPtrProbe
          {
              static void Main(string[] a)
              {
                  string exe=Path.GetFullPath(a[0]);
                  string typeName=a[1];
                  string methodName=a[2];
                  string outp=Path.GetFullPath(a[3]);
                  Directory.SetCurrentDirectory(Path.GetDirectoryName(exe));

                  var L=new List<string>();
                  L.Add("PID="+System.Diagnostics.Process.GetCurrentProcess().Id);
                  L.Add("TYPE="+typeName);
                  L.Add("METHOD="+methodName);

                  try
                  {
                      Assembly asm=Assembly.LoadFile(exe);
                      RuntimeHelpers.RunModuleConstructor(asm.ManifestModule.ModuleHandle);
                      Type t=asm.GetType(typeName,false);
                      if(t==null)
                      {
                          L.Add("TYPE_NOT_FOUND=1");
                          File.WriteAllLines(outp,L.ToArray());
                          return;
                      }

                      var ms=t.GetMethods(
                          BindingFlags.Public|BindingFlags.NonPublic|
                          BindingFlags.Static|BindingFlags.Instance)
                          .Where(x=>x.Name==methodName).ToArray();

                      L.Add("OVERLOADS="+ms.Length);
                      foreach(var m in ms)
                      {
                          try
                          {
                              RuntimeHelpers.PrepareMethod(m.MethodHandle);
                              IntPtr p=m.MethodHandle.GetFunctionPointer();
                              L.Add("PTR|"+m.MetadataToken.ToString("X8")+"|"+
                                    p.ToInt64().ToString("X")+"|"+m.ToString());
                          }
                          catch(Exception ex)
                          {
                              L.Add("PREPARE_EXCEPTION|"+m+"|"+ex.GetBaseException());
                          }
                      }

                      File.WriteAllLines(outp,L.ToArray());
                      Console.WriteLine("READY");
                      Console.Out.Flush();
                      Thread.Sleep(20000);
                  }
                  catch(Exception ex)
                  {
                      L.Add("TOP_EXCEPTION="+ex.ToString());
                      try{File.WriteAllLines(outp,L.ToArray());}catch{}
                  }
              }
          }
          '@ | Set-Content "$root\harness\JitPtrProbe.cs"

          $csc="$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          if(-not(Test-Path $csc)){throw "x86 csc missing"}

          & $csc /nologo /platform:x86 /target:exe `
            /out:"$root\harness\UfeProbe.exe" "$root\harness\UfeProbe.cs"
          if($LASTEXITCODE -ne 0){throw "UfeProbe compile failed"}

          & $csc /nologo /platform:x86 /target:exe `
            /out:"$root\harness\JitPtrProbe.exe" "$root\harness\JitPtrProbe.cs"
          if($LASTEXITCODE -ne 0){throw "JitPtrProbe compile failed"}

      - name: Static audit no hardware I O
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v9"
          $s=(Get-Content "$root\harness\UfeProbe.cs" -Raw) + "`n" +
             (Get-Content "$root\harness\JitPtrProbe.cs" -Raw)

          if($s -match 'EntryPoint\.Invoke'){throw "entrypoint invoke forbidden"}
          if($s -match 'HidD_SetOutputReport'){throw "output report forbidden"}
          if($s -match 'HidD_SetFeature'){throw "feature report forbidden"}
          if($s -match 'WriteFile\('){throw "WriteFile forbidden"}
          if($s -match 'GetMethod\("Send".*Invoke'){throw "Send invocation forbidden"}
          if($s -match 'GetMethod\("Write".*Invoke'){throw "Write invocation forbidden"}
          if($s -match 'GetMethod\("Connect".*Invoke'){throw "Connect invocation forbidden"}

          "STATIC_AUDIT=PASS" | Set-Content "$root\evidence\02_STATIC_AUDIT.txt"

      - name: Execute pure UFE ToByteArray probes
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v9"

          $p=Start-Process `
            -FilePath "$root\harness\UfeProbe.exe" `
            -ArgumentList @("$root\vendor.exe","$root\evidence\03_UFE_PURE_OUTPUTS.txt") `
            -WorkingDirectory $root `
            -PassThru -Wait -NoNewWindow

          "EXIT_CODE=$($p.ExitCode)" | Set-Content "$root\evidence\03A_UFE_EXIT.txt"
          if(-not(Test-Path "$root\evidence\03_UFE_PURE_OUTPUTS.txt")){
            throw "UFE pure output missing"
          }

          Get-Content "$root\evidence\03_UFE_PURE_OUTPUTS.txt" | Select-Object -First 400

      - name: Capture JIT for peripheral and queue framing methods
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference="Continue"
          $root="C:\okn_v9"
          python -m pip install --disable-pip-version-check --quiet capstone

          @'
          from pathlib import Path
          import ctypes,sys,json,struct

          pid=int(sys.argv[1]); info=Path(sys.argv[2]); outdir=Path(sys.argv[3]); label=sys.argv[4]

          k=ctypes.WinDLL("kernel32",use_last_error=True)
          k.OpenProcess.argtypes=[ctypes.c_uint32,ctypes.c_int,ctypes.c_uint32]
          k.OpenProcess.restype=ctypes.c_void_p
          k.ReadProcessMemory.argtypes=[
              ctypes.c_void_p,ctypes.c_void_p,ctypes.c_void_p,
              ctypes.c_size_t,ctypes.POINTER(ctypes.c_size_t)
          ]
          k.ReadProcessMemory.restype=ctypes.c_int
          k.CloseHandle.argtypes=[ctypes.c_void_p]

          h=k.OpenProcess(0x0010|0x0400,False,pid)
          if not h: raise SystemExit("OpenProcess failed")

          def rpm(addr,n):
              b=(ctypes.c_ubyte*n)(); got=ctypes.c_size_t()
              ok=k.ReadProcessMemory(h,ctypes.c_void_p(addr),ctypes.byref(b),n,ctypes.byref(got))
              return bool(ok),bytes(b[:got.value])

          def u32(addr):
              ok,b=rpm(addr,4)
              return struct.unpack("<I",b)[0] if ok and len(b)==4 else None

          def follow(cur):
              chain=[]
              for _ in range(12):
                  ok,b=rpm(cur,32)
                  if not ok or len(b)<2:break
                  chain.append({"addr":cur,"first16":b[:16].hex().upper()})
                  if b[0]==0xE9 and len(b)>=5:
                      cur=cur+5+struct.unpack_from("<i",b,1)[0]; continue
                  if b[0]==0xEB:
                      cur=cur+2+struct.unpack_from("<b",b,1)[0]; continue
                  if b[:2]==b"\xFF\x25" and len(b)>=6:
                      slot=struct.unpack_from("<I",b,2)[0]; nxt=u32(slot)
                      if nxt:cur=nxt;continue
                  if b[0]==0x68 and len(b)>=6 and b[5]==0xC3:
                      cur=struct.unpack_from("<I",b,1)[0];continue
                  if b[0]==0xB8 and len(b)>=7 and b[5:7]==b"\xFF\xE0":
                      cur=struct.unpack_from("<I",b,1)[0];continue
                  break
              return cur,chain

          rows=[]
          for line in info.read_text(errors="ignore").splitlines():
              if not line.startswith("PTR|"):continue
              _,tok,ptrhex,sig=line.split("|",3)
              entry=int(ptrhex,16); resolved,chain=follow(entry)
              ok,b=rpm(resolved,2048)
              safe="".join(c if c.isalnum() else "_" for c in (label+"_"+tok))
              if ok and b:(outdir/(safe+"_resolved.bin")).write_bytes(b)
              rows.append({
                  "token":tok,"signature":sig,
                  "entry_hex":f"0x{entry:X}","resolved_hex":f"0x{resolved:X}",
                  "read_ok":ok,"bytes":len(b),"jump_chain":chain
              })

          k.CloseHandle(h)
          (outdir/(label+"_jit.json")).write_text(json.dumps(rows,indent=2)+"\n")
          '@ | Set-Content "$root\readjit.py"

          $targets=@(
            @("DSTech_AudioDSP_Client.PeriperalCommand","ToByteArray","PERIPHERAL_BASE"),
            @("DSTech_AudioDSP_Client.GetDevcieDescriptionCommand","ToByteArray","GET_DESC"),
            @("DSTech_AudioDSP_Client.WriteActuatorPeriperalCommand","ToByteArray","WRITE_ACT"),
            @("DSTech_AudioDSP_Client.ReadActuatorPeriperalCommand","ToByteArray","READ_ACT"),
            @("DSTech_AudioDSP_Client.UFEcommandBridge","sendCommandFromQueue","QUEUE_SEND"),
            @("DSTech_AudioDSP_Client.UFEcommandBridge","sendCommandFromQueuePop","QUEUE_SEND_POP"),
            @("DSTech_AudioDSP_Client.UFEcommandBridge","appendWriteActuatorCommand","QUEUE_APPEND_WRITE"),
            @("DSTech_AudioDSP_Client.HIDInterface","Send","HID_SEND"),
            @("DSTech_AudioDSP_Client.Hid","Write","HID_WRITE")
          )

          foreach($t in $targets){
            $type=$t[0];$method=$t[1];$label=$t[2]
            $info="$root\jit\$label.txt"
            $p=Start-Process `
              -FilePath "$root\harness\JitPtrProbe.exe" `
              -ArgumentList @("$root\vendor.exe",$type,$method,$info) `
              -WorkingDirectory $root `
              -RedirectStandardOutput "$root\evidence\JIT_${label}_console.txt" `
              -RedirectStandardError "$root\evidence\JIT_${label}_stderr.txt" `
              -PassThru

            $ready=$false
            for($i=0;$i -lt 60;$i++){
              Start-Sleep -Milliseconds 100
              if(Test-Path $info){$ready=$true;break}
              if($p.HasExited){break}
            }

            if($ready){
              try{
                python "$root\readjit.py" $p.Id $info "$root\evidence" $label `
                  *> "$root\evidence\JIT_${label}_read.txt"
              }catch{
                "READ_EXCEPTION=$($_.Exception.Message)" |
                  Set-Content "$root\evidence\JIT_${label}_error.txt"
              }
            }else{
              "POINTER_INFO_MISSING=1" |
                Set-Content "$root\evidence\JIT_${label}_missing.txt"
            }

            if(-not $p.HasExited){
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Disassemble captured JIT
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v9"

          @'
          from pathlib import Path
          import json
          from capstone import Cs,CS_ARCH_X86,CS_MODE_32

          ev=Path(r"C:\okn_v9\evidence")
          md=Cs(CS_ARCH_X86,CS_MODE_32)
          idx=[];out=[]

          for p in sorted(ev.glob("*_resolved.bin")):
              b=p.read_bytes()
              ins=[]
              for x in md.disasm(b,0):
                  ins.append(f"{x.address:04X}: {x.mnemonic} {x.op_str}".rstrip())
                  if len(ins)>=700:break
              idx.append({"file":p.name,"bytes":len(b),"instructions":len(ins)})
              out.append("\n===== "+p.name+" =====\n"+"\n".join(ins)+"\n")

          (ev/"04_JIT_DISASSEMBLY.txt").write_text("".join(out))
          (ev/"05_JIT_INDEX.json").write_text(json.dumps(idx,indent=2)+"\n")
          '@ | Set-Content "$root\disasm.py"

          python "$root\disasm.py"
          Get-ChildItem "$root\evidence" -Filter *_resolved.bin -File | Remove-Item -Force

      - name: Derive protocol candidate map
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v9"

          @'
          from pathlib import Path
          import re,json

          ev=Path(r"C:\okn_v9\evidence")
          pure=(ev/"03_UFE_PURE_OUTPUTS.txt").read_text(errors="ignore")
          jit=(ev/"04_JIT_DISASSEMBLY.txt").read_text(errors="ignore")
          idx=json.loads((ev/"05_JIT_INDEX.json").read_text())

          writes=[]
          reads=[]
          for l in pure.splitlines():
              m=re.match(r"WRITE_ACT mode=(\d+) addr=(\d+) cascade=(\d+)=(.*)",l)
              if m:
                  writes.append({
                      "mode":int(m.group(1)),"addr":int(m.group(2)),
                      "cascade":int(m.group(3)),"output":m.group(4)
                  })
              m=re.match(r"READ_ACT mode=(\d+) addr=(\d+) cascade=(\d+)=(.*)",l)
              if m:
                  reads.append({
                      "mode":int(m.group(1)),"addr":int(m.group(2)),
                      "cascade":int(m.group(3)),"output":m.group(4)
                  })

          candidate={
              "revision":"MASTER-V9",
              "ufe_write_header":87 if "UFE_WRITE_ACTUATOR_COMMAND=87" in pure else None,
              "ufe_read_header":88 if "UFE_READ_SENSOR_ACTUATOR_COMMAND=88" in pure else None,
              "get_device_description_output":next(
                  (x.split("=",1)[1] for x in pure.splitlines()
                   if x.startswith("GET_DEVICE_DESCRIPTION=")),None
              ),
              "write_actuator_outputs":writes[:500],
              "read_actuator_outputs":reads[:500],
              "jit_capture_count":len(idx),
              "jit_nonempty":bool(jit.strip()),
              "exact_wire_frame_proven":False,
              "live_dsp_connected":False,
              "host_to_dsp_io":False,
              "hid_send_invoked":False,
              "hid_write_invoked":False,
              "feature_report_invoked":False,
              "flash_allowed":False
          }

          good=[x for x in writes if re.fullmatch(r"[0-9A-Fa-f]+",x["output"] or "")]
          candidate["write_actuator_hex_success_count"]=len(good)

          if good:
              candidate["status"]="UFE_WRITE_ACTUATOR_BYTES_RECOVERED_LINK_TO_HID_LENGTH_WRAPPER_REVIEW"
          elif idx:
              candidate["status"]="UFE_TOBYTEARRAY_JIT_CAPTURED_RECONSTRUCTION_REQUIRED"
          else:
              candidate["status"]="UFE_FRAME_EXTRACTION_INCONCLUSIVE"

          (ev/"06_V9_PROTOCOL_CANDIDATES.json").write_text(
              json.dumps(candidate,indent=2)+"\n"
          )

          md=f"""# MASTER V9 FINAL DECISION

          - UFE WRITE header discovered: **{candidate['ufe_write_header']}**
          - UFE READ header discovered: **{candidate['ufe_read_header']}**
          - WriteActuator ToByteArray hex successes: **{candidate['write_actuator_hex_success_count']}**
          - JIT captures: **{candidate['jit_capture_count']}**
          - Exact wire frame proven automatically: **NO**
          - HID Send/Write invoked: **NO / NO**
          - Feature report invoked: **NO**
          - Host-to-DSP I/O: **NO**
          - Flash allowed: **NO**

          Status: **{candidate['status']}**

          Classification: **OFFLINE_UFE_PROTOCOL_RECOVERY_NOT_FOR_FLASH**
          """
          (ev/"07_V9_FINAL_DECISION.md").write_text(md)
          print(md)
          '@ | Set-Content "$root\derive.py"

          python "$root\derive.py"
          Get-Content "$root\evidence\07_V9_FINAL_DECISION.md" >> $env:GITHUB_STEP_SUMMARY

      - name: Package focused evidence
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v9"
          Copy-Item "$root\evidence\*" "$root\out\" -Force

          if(Test-Path "$root\out\vendor.exe"){throw "vendor EXE leak"}
          if(Test-Path "$root\out\UfeProbe.exe"){throw "probe binary leak"}
          if(Test-Path "$root\out\JitPtrProbe.exe"){throw "jit probe leak"}

          Get-ChildItem "$root\out" -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content "$root\out\SHA256SUMS.txt"

      - name: Upload V9 evidence
        uses: actions/upload-artifact@v7
        with:
          name: OKN-BP1048P4-MASTER-V9-UFE-PERIPHERAL-FRAME-EVIDENCE
          path: C:\okn_v9\out\*
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed assertion
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v9"

          foreach($n in @(
            "LIVE_DSP_CONNECTED","USB_TARGET_ACCESS","HOST_TO_DSP_IO",
            "HID_CONNECT_ALLOWED","HID_SEND_ALLOWED","HID_WRITE_ALLOWED",
            "FEATURE_REPORT_ALLOWED","FLASH_ALLOWED","ERASE_ALLOWED","WRITE_ALLOWED"
          )){
            if((Get-Item "Env:$n").Value -ne "NO"){throw "$n changed"}
          }

          $d=Get-Content "$root\evidence\06_V9_PROTOCOL_CANDIDATES.json" -Raw | ConvertFrom-Json
          if($d.live_dsp_connected -ne $false){throw "bad DSP state"}
          if($d.host_to_dsp_io -ne $false){throw "bad host-to-DSP state"}
          if($d.hid_send_invoked -ne $false){throw "bad HID send state"}
          if($d.hid_write_invoked -ne $false){throw "bad HID write state"}
          if($d.feature_report_invoked -ne $false){throw "bad feature report state"}
          if($d.flash_allowed -ne $false){throw "bad flash state"}

          "MASTER_V9=PASS"
          "HID_IO=NO"
          "HOST_TO_DSP_IO=NO"
          "FLASH_ALLOWED=NO"
