name: OKN BP1048P4 MASTER V23 AUTH + PROTOCOL MAP OFFLINE

"on":
  workflow_dispatch:

permissions:
  contents: read

env:
  GOLOPINE_WINDOWS_URL: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-08.exe_.zip"
  EXPECTED_VENDOR_SHA256: "3ca54171c53f7badd963ffe6851b8b3e2faf8aee8ba2afcb7040990e22ae09b2"

  REQUIRED_PHONE: "Samsung Galaxy S25+"
  REQUIRED_PHYSICAL_PATH: "Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only"

  LIVE_DSP_CONNECTED: "NO"
  USB_TARGET_ACCESS: "NO"
  HOST_TO_DSP_IO: "NO"
  REAL_HID_OBJECT_ALLOWED: "NO"
  REAL_HID_CONNECT_ALLOWED: "NO"
  REAL_HID_SEND_ALLOWED: "NO"
  REAL_HID_READ_ALLOWED: "NO"
  REAL_HID_WRITE_ALLOWED: "NO"
  FEATURE_REPORT_ALLOWED: "NO"
  FLASH_ALLOWED: "NO"
  ERASE_ALLOWED: "NO"
  WRITE_ALLOWED: "NO"

jobs:
  master-v23:
    name: Map exact auth/device-description/update protocol OFFLINE
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          for n in \
            LIVE_DSP_CONNECTED USB_TARGET_ACCESS HOST_TO_DSP_IO \
            REAL_HID_OBJECT_ALLOWED REAL_HID_CONNECT_ALLOWED \
            REAL_HID_SEND_ALLOWED REAL_HID_READ_ALLOWED REAL_HID_WRITE_ALLOWED \
            FEATURE_REPORT_ALLOWED FLASH_ALLOWED ERASE_ALLOWED WRITE_ALLOWED
          do
            test "${!n}" = "NO"
          done

          rm -rf /tmp/v23
          mkdir -p /tmp/v23/{download,pkg,tools,evidence,decomp,out}

          cat > /tmp/v23/evidence/00_SAFETY_AND_SCOPE.txt <<EOF
          REVISION=MASTER-V23
          MODE=OFFLINE_AUTH_AND_PROTOCOL_MAP
          REQUIRED_PHONE=${REQUIRED_PHONE}
          REQUIRED_PATH=${REQUIRED_PHYSICAL_PATH}
          SOLDERING_REQUIRED=NO
          BOARD_MODIFICATION_REQUIRED=NO
          LIVE_DSP_CONNECTED=NO
          USB_TARGET_ACCESS=NO
          HOST_TO_DSP_IO=NO
          REAL_HID_OBJECT_ALLOWED=NO
          FEATURE_REPORT_ALLOWED=NO
          FLASH_ALLOWED=NO
          ERASE_ALLOWED=NO
          WRITE_ALLOWED=NO
          EOF

      - name: Acquire exact official vendor binary and pin SHA256
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 6 --retry-all-errors --retry-delay 2 \
            --connect-timeout 20 --max-time 300 \
            "$GOLOPINE_WINDOWS_URL" -o /tmp/v23/download/vendor.zip

          unzip -q /tmp/v23/download/vendor.zip -d /tmp/v23/pkg

          EXE="$(find /tmp/v23/pkg -type f -iname '*.exe' \
            ! -path '*/__MACOSX/*' ! -name '._*' \
            -printf '%s %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"

          test -n "$EXE"
          cp "$EXE" /tmp/v23/vendor.exe

          ACTUAL_SHA="$(sha256sum /tmp/v23/vendor.exe | awk '{print $1}')"
          test "$ACTUAL_SHA" = "$EXPECTED_VENDOR_SHA256"

          {
            echo "SHA256=$ACTUAL_SHA"
            echo "ORIGINAL_BINARY_MODIFIED=NO"
            echo "SOURCE_URL=$GOLOPINE_WINDOWS_URL"
          } > /tmp/v23/evidence/01_VENDOR_IDENTITY.txt

      - name: Install ILSpy and collect assembly inventory
        shell: bash
        run: |
          set -euo pipefail

          dotnet tool install ilspycmd --tool-path /tmp/v23/tools
          /tmp/v23/tools/ilspycmd --version \
            | tee /tmp/v23/evidence/02_ILSPY_VERSION.txt

          TOOL=/tmp/v23/tools/ilspycmd

          "$TOOL" -l c /tmp/v23/vendor.exe \
            > /tmp/v23/evidence/03_CLASS_LIST.txt 2>&1 || true

          strings -a -n 4 /tmp/v23/vendor.exe \
            > /tmp/v23/evidence/04_ASCII_STRINGS.txt || true

          strings -el -n 4 /tmp/v23/vendor.exe \
            > /tmp/v23/evidence/05_UTF16_STRINGS.txt || true

      - name: Select and decompile protocol relevant types
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/v23/select_types.py <<'PY'
          from pathlib import Path
          import re, json

          ev = Path("/tmp/v23/evidence")
          text = (ev/"03_CLASS_LIST.txt").read_text(errors="ignore")
          names = []

          for line in text.splitlines():
              s = line.strip()
              # ilspycmd -l c usually emits lines such as:
              # Class Namespace.TypeName
              m = re.search(r'^(?:Class|Struct|Interface|Enum)\s+(.+)$', s)
              if m:
                  n = m.group(1).strip()
                  if n and n not in names:
                      names.append(n)

          keywords = [
              "UFEcommandBridge", "DeviceCommunicationStream", "HID",
              "HardwareCommand", "CommandConverter", "MainWindow",
              "Firmware", "Upgrade", "Flash", "Boot", "Update",
              "DeviceDescription", "GeneralDeviceInfo", "UFEDevice"
          ]

          selected = []
          for n in names:
              low = n.lower()
              if any(k.lower() in low for k in keywords):
                  selected.append(n)

          # Keep the critical roots even if the listing format changed.
          critical = [
              "DSTech_AudioDSP_Client.UFEcommandBridge",
              "DSTech_AudioDSP_Client.DeviceCommunicationStream",
              "DSTech_AudioDSP_Client.HardwareCommandConverter",
              "DSTech_AudioDSP_Client.MainWindow"
          ]
          for n in critical:
              if n not in selected:
                  selected.insert(0, n)

          # Deduplicate and cap to keep the action bounded.
          out = []
          for n in selected:
              if n not in out:
                  out.append(n)
          out = out[:120]

          (ev/"06_SELECTED_TYPES.txt").write_text("\n".join(out) + "\n")
          (ev/"06_SELECTED_TYPES.json").write_text(json.dumps(out, indent=2) + "\n")
          print(f"selected_types={len(out)}")
          PY

          python /tmp/v23/select_types.py

          TOOL=/tmp/v23/tools/ilspycmd
          mkdir -p /tmp/v23/decomp

          while IFS= read -r TYPE; do
            [ -n "$TYPE" ] || continue
            SAFE="$(printf '%s' "$TYPE" | tr -c 'A-Za-z0-9._+-' '_')"

            "$TOOL" -t "$TYPE" /tmp/v23/vendor.exe \
              > "/tmp/v23/decomp/${SAFE}.cs.txt" 2>&1 || true

            if ! "$TOOL" -il -t "$TYPE" /tmp/v23/vendor.exe \
              > "/tmp/v23/decomp/${SAFE}.il.txt" 2>&1; then
              "$TOOL" --ilcode -t "$TYPE" /tmp/v23/vendor.exe \
                > "/tmp/v23/decomp/${SAFE}.il.txt" 2>&1 || true
            fi
          done < /tmp/v23/evidence/06_SELECTED_TYPES.txt

          find /tmp/v23/decomp -type f -maxdepth 1 -printf '%f\n' \
            | sort > /tmp/v23/evidence/07_DECOMPILED_FILES.txt

      - name: Reconstruct auth state machine and packet candidates
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/v23/reconstruct.py <<'PY'
          from pathlib import Path
          import re, json, hashlib

          root = Path("/tmp/v23")
          ev = root/"evidence"
          dc = root/"decomp"

          files = list(dc.glob("*.txt"))
          blobs = {}
          for p in files:
              try:
                  blobs[p.name] = p.read_text(errors="ignore")
              except Exception:
                  pass

          all_text = "\n".join(blobs.values())
          ascii_strings = (ev/"04_ASCII_STRINGS.txt").read_text(errors="ignore")
          utf16_strings = (ev/"05_UTF16_STRINGS.txt").read_text(errors="ignore")
          string_text = ascii_strings + "\n" + utf16_strings

          auth_terms = [
              "FBL3HEmTva",
              "SendDevTypeSwVersAuthenRequest",
              "UFE_STREAM_GETTING_DEVICE_DESCRIPTION",
              "DevTypeSwVersAuthen",
              "Authen"
          ]

          device_terms = [
              "DeviceDescription",
              "GETTING_DEVICE_DESCRIPTION",
              "DevDescriptionLength",
              "RemoteDevice",
              "swVersion",
              "hwVersion",
              "manufacturer",
              "serviceTag"
          ]

          transport_terms = [
              "HID_SEND", "HID_WRITE", "Write(", "ReadBytes", "ReadLine",
              "DeviceCommunicationStream", "Send", "Receive"
          ]

          update_terms = [
              "firmware", "upgrade", "flash", "erase", "bootloader", "boot",
              "updatefile", "update file", ".bin", ".hex", ".img", "download"
          ]

          backup_terms = [
              "backup", "dump", "readflash", "read flash", "readback",
              "export", "save", "upload", "memory"
          ]

          def contexts(text, term, before=45, after=110, max_hits=8):
              lines = text.splitlines()
              hits = [i for i,x in enumerate(lines) if term.lower() in x.lower()]
              out = []
              for i in hits[:max_hits]:
                  a=max(0,i-before); b=min(len(lines),i+after+1)
                  out.append(
                      f"===== TERM={term} HIT_LINE={i+1} RANGE={a+1}-{b} =====\n" +
                      "\n".join(f"{j+1:06d}: {lines[j]}" for j in range(a,b))
                  )
              return "\n\n".join(out), len(hits)

          # Critical auth/device contexts from all selected decompilations.
          auth_chunks=[]
          auth_hits={}
          for term in auth_terms:
              c,n=contexts(all_text,term)
              auth_hits[term]=n
              if c: auth_chunks.append(c)
          (ev/"08_AUTH_STATE_MACHINE_CONTEXTS.txt").write_text("\n\n".join(auth_chunks))

          dev_chunks=[]
          dev_hits={}
          for term in device_terms:
              c,n=contexts(all_text,term)
              dev_hits[term]=n
              if c: dev_chunks.append(c)
          (ev/"09_DEVICE_DESCRIPTION_CONTEXTS.txt").write_text("\n\n".join(dev_chunks))

          transport_chunks=[]
          transport_hits={}
          for term in transport_terms:
              c,n=contexts(all_text,term,before=30,after=70,max_hits=10)
              transport_hits[term]=n
              if c: transport_chunks.append(c)
          (ev/"10_TRANSPORT_CONTEXTS.txt").write_text("\n\n".join(transport_chunks))

          update_chunks=[]
          update_hits={}
          for term in update_terms:
              c,n=contexts(all_text + "\n" + string_text,term,before=28,after=55,max_hits=14)
              update_hits[term]=n
              if c: update_chunks.append(c)
          (ev/"11_UPDATE_BOOT_FLASH_CONTEXTS.txt").write_text("\n\n".join(update_chunks))

          backup_chunks=[]
          backup_hits={}
          for term in backup_terms:
              c,n=contexts(all_text + "\n" + string_text,term,before=28,after=55,max_hits=12)
              backup_hits[term]=n
              if c: backup_chunks.append(c)
          (ev/"12_BACKUP_READ_CONTEXTS.txt").write_text("\n\n".join(backup_chunks))

          # Pull likely packet/constant lines from UFE bridge and transport areas.
          packet_lines=[]
          patterns=[
              r'new\s+byte\s*\[\s*\]\s*\{[^}]{1,500}\}',
              r'new\s+byte\s*\[[^\]]+\]',
              r'0x[0-9A-Fa-f]{2,8}',
              r'Write\s*\(',
              r'ReadBytes\s*\(',
              r'Send\w*\s*\(',
              r'UFE_STREAM_[A-Z0-9_]+'
          ]
          for fn,txt in blobs.items():
              if not any(k in fn.lower() for k in ["ufecommandbridge","devicecommunication","hid","hardwarecommand","mainwindow"]):
                  continue
              lines=txt.splitlines()
              for i,line in enumerate(lines):
                  if any(re.search(p,line) for p in patterns):
                      packet_lines.append(f"{fn}:{i+1}: {line}")
          (ev/"13_PACKET_AND_STATE_CANDIDATES.txt").write_text("\n".join(packet_lines[:12000])+"\n")

          # Extract method signatures from C# output.
          sigs=[]
          sig_re=re.compile(
              r'^\s*(?:public|private|protected|internal|static|virtual|sealed|override|async|unsafe|extern|new|\s)+'
              r'[\w<>\[\],.?+`]+\s+([A-Za-z_][A-Za-z0-9_<>]*)\s*\([^;]*\)'
          )
          for fn,txt in blobs.items():
              if not fn.endswith(".cs.txt"):
                  continue
              for i,line in enumerate(txt.splitlines()):
                  m=sig_re.search(line)
                  if not m:
                      continue
                  name=m.group(1)
                  low=(name+" "+line).lower()
                  if any(k in low for k in [
                      "auth","device","description","firm","upgrade","flash","erase","boot",
                      "send","write","read","update","command","download","upload","save"
                  ]):
                      sigs.append(f"{fn}:{i+1}: {line.strip()}")
          (ev/"14_PROTOCOL_METHOD_SIGNATURES.txt").write_text("\n".join(sigs[:8000])+"\n")

          # Conservative booleans: map/recovery only, never authorization.
          auth_roots_present = (
              auth_hits.get("FBL3HEmTva",0) > 0 and
              auth_hits.get("SendDevTypeSwVersAuthenRequest",0) > 0
          )
          post_auth_state_present = auth_hits.get("UFE_STREAM_GETTING_DEVICE_DESCRIPTION",0) > 0
          device_path_present = sum(dev_hits.values()) > 0

          # Update/backup names are candidates only; generic "update" is intentionally excluded.
          strong_update = {
              k:v for k,v in update_hits.items()
              if k in ["firmware","upgrade","flash","erase","bootloader","updatefile","update file",".bin",".hex",".img"]
              and v > 0
          }
          strong_backup = {
              k:v for k,v in backup_hits.items()
              if k in ["backup","dump","readflash","read flash","readback"]
              and v > 0
          }

          model = {
              "revision":"MASTER-V23",
              "classification":"OFFLINE_PROTOCOL_RECONSTRUCTION_NOT_FOR_FLASH",
              "required_phone":"Samsung Galaxy S25+",
              "required_path":"Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only",
              "vendor_sha256":hashlib.sha256((root/"vendor.exe").read_bytes()).hexdigest(),
              "decompiled_file_count":len(files),
              "auth_hits":auth_hits,
              "device_hits":dev_hits,
              "transport_hits":transport_hits,
              "update_hits":update_hits,
              "backup_hits":backup_hits,
              "auth_roots_present":auth_roots_present,
              "post_auth_get_device_description_state_present":post_auth_state_present,
              "device_description_path_candidates_present":device_path_present,
              "strong_update_boot_flash_name_hits":strong_update,
              "strong_backup_read_name_hits":strong_backup,
              "exact_live_auth_port_proven":False,
              "exact_stock_backup_path_proven":False,
              "exact_flash_layout_proven":False,
              "exact_rollback_path_proven":False,
              "real_hid_invoked":False,
              "host_to_dsp_io":False,
              "flash_allowed":False
          }

          if auth_roots_present and post_auth_state_present and device_path_present:
              status="AUTH_TO_DEVICE_DESCRIPTION_STATIC_PATH_MAPPED_CONTINUE_WITH_BOUNDED_READ_ONLY_S25_GATE"
          elif auth_roots_present:
              status="AUTH_ROOTS_MAPPED_DEVICE_DESCRIPTION_PATH_STILL_INCOMPLETE"
          else:
              status="AUTH_PROTOCOL_RECONSTRUCTION_INCOMPLETE_MORE_STATIC_RECOVERY_REQUIRED"

          model["status"]=status
          (ev/"15_V23_DECISION.json").write_text(json.dumps(model,indent=2)+"\n")

          md=f"""# MASTER V23 FINAL DECISION

          - Required phone: **Samsung Galaxy S25+**
          - Physical path: **USB-C cable -> DSP board USB-C port only**
          - Soldering / board modification: **NO / NO**
          - Decompiled evidence files: **{len(files)}**
          - Auth roots present: **{auth_roots_present}**
          - Post-auth GET DEVICE DESCRIPTION state present: **{post_auth_state_present}**
          - Device-description path candidates present: **{device_path_present}**
          - Strong update/boot/flash name hits: **{len(strong_update)}**
          - Strong backup/read name hits: **{len(strong_backup)}**
          - Hardware contacted: **NO**
          - Flash/erase/write: **NO / NO / NO**
          - Stock backup path proven: **NO**
          - Flash layout proven: **NO**
          - Rollback path proven: **NO**

          Status: **{status}**

          Next gate: if auth -> device-description mapping is complete, build one bounded
          Samsung S25+ read-only verifier that performs startup/auth/device-description
          only. Do not implement erase/write/flash until stock backup, exact layout and
          rollback are independently proven.

          Classification: **OFFLINE_PROTOCOL_RECONSTRUCTION_NOT_FOR_FLASH**
          """
          (ev/"16_V23_FINAL_DECISION.md").write_text(md)
          print(md)
          PY

          python /tmp/v23/reconstruct.py

          cat /tmp/v23/evidence/16_V23_FINAL_DECISION.md >> "$GITHUB_STEP_SUMMARY"

      - name: Package focused evidence
        shell: bash
        run: |
          set -euo pipefail

          cp /tmp/v23/evidence/* /tmp/v23/out/

          # Do not upload vendor executable or decompiled source tree.
          test ! -e /tmp/v23/out/vendor.exe

          (
            cd /tmp/v23/out
            sha256sum * > SHA256SUMS.txt
          )

      - name: Upload V23 evidence
        uses: actions/upload-artifact@v4
        with:
          name: OKN-BP1048P4-MASTER-V23-AUTH-PROTOCOL-MAP-OFFLINE-EVIDENCE
          path: /tmp/v23/out/*
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed assertion
        shell: bash
        run: |
          set -euo pipefail

          for n in \
            LIVE_DSP_CONNECTED USB_TARGET_ACCESS HOST_TO_DSP_IO \
            REAL_HID_OBJECT_ALLOWED REAL_HID_CONNECT_ALLOWED \
            REAL_HID_SEND_ALLOWED REAL_HID_READ_ALLOWED REAL_HID_WRITE_ALLOWED \
            FEATURE_REPORT_ALLOWED FLASH_ALLOWED ERASE_ALLOWED WRITE_ALLOWED
          do
            test "${!n}" = "NO"
          done

          python - <<'PY'
          import json
          p="/tmp/v23/evidence/15_V23_DECISION.json"
          d=json.load(open(p))
          assert d["real_hid_invoked"] is False
          assert d["host_to_dsp_io"] is False
          assert d["flash_allowed"] is False
          assert d["exact_stock_backup_path_proven"] is False
          assert d["exact_flash_layout_proven"] is False
          assert d["exact_rollback_path_proven"] is False
          print("MASTER_V23=PASS")
          print("REAL_HID_IO=NO")
          print("HOST_TO_DSP_IO=NO")
          print("FLASH_ALLOWED=NO")
          PY
