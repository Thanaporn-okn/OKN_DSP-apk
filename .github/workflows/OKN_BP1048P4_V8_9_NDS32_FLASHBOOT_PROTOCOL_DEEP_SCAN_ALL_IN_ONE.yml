name: OKN BP1048P4 V8.9 NDS32 RUNTIME-FIXED FLASHBOOT PROTOCOL DEEP SCAN — ALL IN ONE

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/OKN_BP1048P4_V8_9_NDS32_FLASHBOOT_PROTOCOL_DEEP_SCAN_ALL_IN_ONE.yml'

permissions:
  contents: read

env:
  FLASH_ALLOWED: "NO"
  SDK_REPO: "https://github.com/leadercxn/bp1048_sdk_v0.1.12.git"
  SDK_COMMIT: "8105bd864b04995d81c9f9ae77cb158259f39015"
  R2_REPO: "https://github.com/radareorg/radare2.git"
  R2_COMMIT: "1ae9dfaf7fe5b6d74414145aa13fa8ef427adf57"
  EXPECTED_FLASHBOOT_SHA256: "8b330805479a3b6cf4ddc907890d6f161b3843764569efaabdb6ff4cd5fe2ef3"

jobs:
  flashboot_nds32_deep_scan:
    name: Exact 64K FlashBoot + NDS32 xrefs V8.9 (OFFLINE / NO USB)
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          rm -rf /tmp/v89
          mkdir -p /tmp/v89/{sdk,evidence,r2-prefix}
          cat > /tmp/v89/evidence/SAFETY.txt <<'EOF'
          MODE=OFFLINE_FLASHBOOT_STATIC_REVERSE_ENGINEERING
          PHYSICAL_USB_BOARD_PRESENT=NO
          USB_COMMAND_SENT=NO
          HID_SET_REPORT_SENT=NO
          HID_SET_FEATURE_SENT=NO
          BOOT_ENTRY_EXECUTED=NO
          FLASH_READ_EXECUTED=NO
          FLASH_ERASE_EXECUTED=NO
          FLASH_WRITE_EXECUTED=NO
          FLASH_ALLOWED=NO
          EOF

      - name: Fetch pinned BP1048 SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone -q "$SDK_REPO" /tmp/v89/sdk-src
          git -C /tmp/v89/sdk-src checkout -q "$SDK_COMMIT"
          test "$(git -C /tmp/v89/sdk-src rev-parse HEAD)" = "$SDK_COMMIT"
          git -C /tmp/v89/sdk-src rev-parse HEAD > /tmp/v89/evidence/SDK_COMMIT.txt

      - name: Rebuild exact BP1048P4 64K FlashBoot and recover static tables
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re, struct

          S=Path('/tmp/v89/sdk-src')
          E=Path('/tmp/v89/evidence')
          fb=(S/'BT_Audio_APP/bt_audio_app_src/device/flash_boot.c').read_text(errors='replace')
          fc=(S/'BT_Audio_APP/bt_audio_app_src/inc/flash_config.h').read_text(errors='replace')
          h=(S/'BT_Audio_APP/bt_audio_app_src/inc/flash_boot.h').read_text(errors='replace')

          def define_expr(text,name,contains=None):
              rx=re.compile(r'^\s*#define\s+'+re.escape(name)+r'\s+(.+?)\s*(?://.*)?$',re.M)
              vals=[m.group(1).strip() for m in rx.finditer(text)]
              if contains is not None:
                  vals=[x for x in vals if contains in x]
              if not vals:
                  raise RuntimeError('missing #define '+name)
              return vals[0].split('/*',1)[0].strip()

          def safe_eval(expr,names):
              expr=expr.strip()
              if not re.fullmatch(r'[A-Za-z0-9_xX()+\-<>&| \t]+',expr):
                  raise RuntimeError('unsafe expression: '+expr)
              return int(eval(expr,{'__builtins__':{}},dict(names)))

          names={}
          names['CONST_DATA_ADDR']=safe_eval(define_expr(fc,'CONST_DATA_ADDR'),names)
          names['AUDIO_EFFECT_ADDR']=safe_eval(define_expr(fc,'AUDIO_EFFECT_ADDR','0x200000'),names)
          names['USER_DATA_ADDR']=safe_eval(define_expr(fc,'USER_DATA_ADDR','0x200000'),names)
          for n in ['BOOT_UART_TX_OFF','BOOT_UART_BAUD_RATE_512000','JUDGEMENT_STANDARD',
                    'UDisk_ON','PCTOOL_ON','BTTOOL_OFF','SD_A15A16A17']:
              names[n]=safe_eval(define_expr(h,n),names)
          names['BOOT_UART_TX_PIN']=names['BOOT_UART_TX_OFF']
          names['BOOT_UART_BAUD_RATE']=names['BOOT_UART_BAUD_RATE_512000']
          names['BOOT_UART_CONFIG']=safe_eval(define_expr(h,'BOOT_UART_CONFIG'),names)
          names['SD_PORT']=names['SD_A15A16A17']
          names['UP_PORT']=safe_eval(define_expr(h,'UP_PORT'),names)

          m=re.search(r'flash_data\s*\[\s*65536\s*\]\s*=\s*\{(.*?)\};',fb,re.S)
          if not m:
              raise RuntimeError('flash_data[65536] initializer not found')
          body=re.sub(r'/\*.*?\*/','',m.group(1),flags=re.S)
          body=re.sub(r'//[^\n]*','',body)
          parts=[x.strip() for x in body.split(',') if x.strip()]
          vals=[]
          for i,expr in enumerate(parts):
              v=safe_eval(expr,names)
              if not 0 <= v <= 0xFF:
                  raise RuntimeError(f'byte {i} out of range: {expr} -> {v}')
              vals.append(v)
          if len(vals) != 65536:
              raise RuntimeError(f'FlashBoot length={len(vals)}, expected=65536')
          b=bytes(vals)
          sha=hashlib.sha256(b).hexdigest()
          expected=__import__('os').environ['EXPECTED_FLASHBOOT_SHA256'].lower()
          if sha != expected:
              raise RuntimeError(f'FlashBoot SHA mismatch got={sha} expected={expected}')
          (E/'FLASH_BOOT_REBUILT.bin').write_bytes(b)
          (E/'FLASH_BOOT_REBUILT.bin.sha256').write_text(sha+'\n')

          # Exact recovery HID report/config/device descriptors from the rebuilt image.
          report_desc=bytes.fromhex(
              '06 00 FF 0A 55 AA A1 01 15 00 26 FF 00 75 08 '
              '96 00 01 09 01 81 02 96 00 01 09 01 91 02 '
              '95 01 09 01 B1 02 C0')
          rd_off=b.find(report_desc)
          cfg_pat=bytes.fromhex('09 02 1B 00 01 01 00 80 32 09 04 00 00 00 03 00 00 00 09 21')
          cfg_off=b.find(cfg_pat)
          if rd_off < 0 or cfg_off < 0:
              raise RuntimeError('recovery HID descriptor set not found')

          devices=[]
          for i in range(len(b)-18):
              if b[i:i+2] != b'\x12\x01':
                  continue
              d=b[i:i+18]
              bcd=d[2]|(d[3]<<8)
              if 0x0100 <= bcd <= 0x0300 and d[7] in (8,16,32,64):
                  devices.append({
                      'offset':i,'bcdUSB':bcd,'class':d[4],'subclass':d[5],'protocol':d[6],
                      'ep0':d[7],'vid':d[8]|(d[9]<<8),'pid':d[10]|(d[11]<<8),
                      'bcdDevice':d[12]|(d[13]<<8),'iManufacturer':d[14],
                      'iProduct':d[15],'iSerial':d[16],'configs':d[17]
                  })
          recovery=next((d for d in devices if d['pid']==0x2244),None)
          if not recovery:
              raise RuntimeError('PID 0x2244 descriptor not found')

          commands=['chiperas','upinfo','btupdat','cnfgdat','constdat','codedata','bootdat','cxxx']
          cmd_offsets={}
          for s in commands:
              o=b.find(s.encode()+b'\x00')
              if o < 0:
                  o=b.find(s.encode())
              if o < 0:
                  raise RuntimeError('missing command '+s)
              cmd_offsets[s]=o
          table_blob=b''.join(struct.pack('<I',cmd_offsets[s]) for s in commands)
          table_off=b.find(table_blob)
          if table_off < 0:
              raise RuntimeError('ordered command pointer table not found')

          labels={
              'command_table':table_off,
              'cmd_cxxx_debug':b.find(b'cmd_cxxx :'),
              'cmd_cxxx_ack':b.find(b' cmd_cxxx ACK %02X %02X %02X %02X '),
              'pc_upgrade_boot':b.find(b'pc upgrata boot'),
              'pc_upgrade_code':b.find(b'pc upgrata code'),
              'pc_upgrade_const':b.find(b'pc upgrata const'),
              'pc_upgrade_config':b.find(b'pc upgrata config'),
              'pc_upgrade_ok':b.find(b'pc upgrata ok'),
              'pc_is_ok':b.find(b'PC IS OK'),
              'usbc':b.find(b'USBC'),
              'hid_report_descriptor':rd_off,
              'usb_config_descriptor':cfg_off,
              'usb_device_descriptor':recovery['offset'],
          }
          labels.update({'cmd_'+k:v for k,v in cmd_offsets.items()})
          (E/'TARGET_ADDRESSES.json').write_text(json.dumps(labels,indent=2)+'\n')

          cmd={
              'table_offset':f'0x{table_off:08X}',
              'commands':[{'index':i,'name':s,'string_offset':f'0x{cmd_offsets[s]:08X}',
                           'slot':f'0x{table_off+i*4:08X}'} for i,s in enumerate(commands)]
          }
          (E/'FLASH_BOOT_COMMAND_TABLE.json').write_text(json.dumps(cmd,indent=2)+'\n')
          usb={
              'flashboot_sha256':sha,'flashboot_bytes':len(b),
              'device_descriptor_offset':f"0x{recovery['offset']:08X}",
              'vid':f"0x{recovery['vid']:04X}",'pid':f"0x{recovery['pid']:04X}",
              'bcdUSB':f"0x{recovery['bcdUSB']:04X}",'ep0_max_packet':recovery['ep0'],
              'interface_class':3,'interface_subclass':0,'interface_protocol':0,
              'interrupt_endpoints':0,'usage_page':'0xFF00','usage':'0xAA55',
              'input_report_bytes':256,'output_report_bytes':256,'feature_report_bytes':1,
              'control_endpoint_only':True,
              'important_correction':'Recovery descriptor VID is 0x0000; do not reuse runtime VID 0x6324.',
              'FLASH_ALLOWED':False
          }
          (E/'FLASH_BOOT_USB_FACTS.json').write_text(json.dumps(usb,indent=2)+'\n')

          # Raw static evidence around high-signal objects.
          def hexctx(off,before=64,after=128):
              lo=max(0,off-before); hi=min(len(b),off+after)
              out=[]
              for p in range(lo,hi,16):
                  x=b[p:p+16]
                  asc=''.join(chr(v) if 32<=v<127 else '.' for v in x)
                  out.append(f'{p:08X}: {x.hex(" ").upper():47s}  {asc}')
              return '\n'.join(out)
          chunks=[]
          for name,off in labels.items():
              if off is None or off < 0: continue
              chunks += [f'===== {name} @ 0x{off:08X} =====',hexctx(off),'']
          (E/'HIGH_SIGNAL_HEX_CONTEXTS.txt').write_text('\n'.join(chunks)+'\n')

          # All printable strings in protocol region, preserving offsets.
          lines=[]; i=0xB800
          while i < min(len(b),0xCC80):
              if 32 <= b[i] < 127:
                  j=i
                  while j < min(len(b),0xCC80) and 32 <= b[j] < 127: j+=1
                  if j-i >= 4:
                      lines.append(f'0x{i:08X}\t'+b[i:j].decode('ascii',errors='replace'))
                  i=j
              else:
                  i+=1
          (E/'PROTOCOL_REGION_STRINGS.tsv').write_text('\n'.join(lines)+'\n')
          PY

      - name: Build pinned radare2 with NDS32 support + loader self-test
        id: r2build
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config git make gcc g++ meson ninja-build python3 >/dev/null
          git clone -q "$R2_REPO" /tmp/v89/r2-src
          git -C /tmp/v89/r2-src checkout -q "$R2_COMMIT"
          test "$(git -C /tmp/v89/r2-src rev-parse HEAD)" = "$R2_COMMIT"
          cd /tmp/v89/r2-src
          ./configure --prefix=/tmp/v89/r2-prefix > /tmp/v89/evidence/R2_CONFIGURE.log 2>&1
          make -j2 > /tmp/v89/evidence/R2_BUILD.log 2>&1
          make install > /tmp/v89/evidence/R2_INSTALL.log 2>&1

          # radare2 is linked against the freshly installed shared libraries.
          # GitHub runners do not search a custom prefix automatically, so make
          # the runtime loader path explicit and persist it for later steps.
          R2_PREFIX=/tmp/v89/r2-prefix
          export LD_LIBRARY_PATH="$R2_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          printf 'LD_LIBRARY_PATH=%s\n' "$LD_LIBRARY_PATH" > /tmp/v89/evidence/R2_RUNTIME_ENV.txt

          ldd "$R2_PREFIX/bin/radare2" | tee /tmp/v89/evidence/R2_LDD.txt
          if grep -q 'not found' /tmp/v89/evidence/R2_LDD.txt; then
            echo 'radare2 shared-library resolution failed' >&2
            exit 41
          fi

          "$R2_PREFIX/bin/radare2" -v | tee /tmp/v89/evidence/R2_VERSION.txt
          "$R2_PREFIX/bin/radare2" -L > /tmp/v89/evidence/R2_PLUGINS.txt

          # Validate NDS32 by actually selecting the architecture, not merely by
          # checking that a radare2 executable exists.
          "$R2_PREFIX/bin/radare2" -q -n -a nds32 -b 32 -m 0 \
            -c 'e asm.arch;q' /tmp/v89/evidence/FLASH_BOOT_REBUILT.bin \
            | tee /tmp/v89/evidence/R2_NDS32_PLUGIN.txt
          grep -qi 'nds32' /tmp/v89/evidence/R2_NDS32_PLUGIN.txt

      - name: NDS32 endian probe and full static analysis
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, os, re, subprocess

          E=Path('/tmp/v89/evidence')
          B=E/'FLASH_BOOT_REBUILT.bin'
          R=Path('/tmp/v89/r2-prefix/bin/radare2')
          targets=json.loads((E/'TARGET_ADDRESSES.json').read_text())

          status={
              'radare2_available':False,
              'radare2_version_exit':None,
              'nds32_select_exit':None,
              'selected_cfg_bigendian':None,
              'analysis_exit':None,
              'function_snapshot_exit':None,
              'xref_snapshot_exit':None,
              'disassembly_exit':None,
              'function_count':0,
              'xref_count':0,
              'target_xref_count':0,
              'command_table_xrefs':0,
              'wire_framing_proven':False,
              'flash_readback_proven':False,
              'FLASH_ALLOWED':False
          }

          # Belt-and-suspenders loader fix: preserve the prefix library path even
          # if GITHUB_ENV handling changes. subprocess inherits this environment.
          lib=str(Path('/tmp/v89/r2-prefix/lib'))
          prior=os.environ.get('LD_LIBRARY_PATH','')
          os.environ['LD_LIBRARY_PATH']=lib+(':'+prior if prior else '')

          def run(args,timeout=120):
              p=subprocess.run(args,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,
                               text=True,errors='replace',timeout=timeout,env=os.environ.copy())
              return p.returncode,p.stdout

          if not R.exists():
              (E/'R2_ANALYSIS_STATUS.json').write_text(json.dumps(status,indent=2)+'\n')
              (E/'R2_FAILURE.txt').write_text('radare2 executable missing after install\n')
              raise SystemExit(31)

          rc_v,vout=run([str(R),'-v'],30)
          rc_a,aout=run([str(R),'-q','-n','-a','nds32','-b','32','-m','0',
                         '-c','e asm.arch;q',str(B)],30)
          status['radare2_version_exit']=rc_v
          status['nds32_select_exit']=rc_a
          status['radare2_available']=(rc_v==0 and rc_a==0 and 'nds32' in aout.lower())
          (E/'R2_RUNTIME_SELFTEST.txt').write_text(
              'VERSION_RC='+str(rc_v)+'\n'+vout+'\nNDS32_RC='+str(rc_a)+'\n'+aout+'\n')
          if not status['radare2_available']:
              (E/'R2_ANALYSIS_STATUS.json').write_text(json.dumps(status,indent=2)+'\n')
              (E/'R2_FAILURE.txt').write_text('radare2/NDS32 runtime self-test failed\n')
              raise SystemExit(32)

          # NDS32 instruction bytes are architecture-specific; probe both config modes and
          # choose the one producing fewer invalid/unknown lines and more control/data ops.
          probe_offsets=[0x0,0x1000,0x3000,0x5000,0x7000,0x9000,0xA800]
          scores={}; probe_text={}
          for be in ('false','true'):
              chunks=[]
              for off in probe_offsets:
                  rc,out=run([str(R),'-q','-n','-a','nds32','-b','32','-e',f'cfg.bigendian={be}',
                              '-m','0','-c',f'pd 180 @ 0x{off:X};q',str(B)],60)
                  if rc != 0:
                      (E/'R2_FAILURE.txt').write_text(
                          f'endian probe failed be={be} off=0x{off:X} rc={rc}\n'+out)
                      raise SystemExit(33)
                  chunks.append(out)
              txt='\n'.join(chunks)
              low=txt.lower()
              good=sum(low.count(x) for x in [' lwi',' swi',' addi',' sethi',' ori',' jal',' jral',' beq',' bne',' ret',' lbi',' sbi'])
              bad=low.count('invalid')+low.count('unknown')+low.count('undefined')
              scores[be]=good*3-bad*5
              probe_text[be]=txt
              (E/f'R2_ENDIAN_PROBE_{be}.txt').write_text(txt)
          selected=max(scores,key=scores.get)
          status['selected_cfg_bigendian']=(selected=='true')
          (E/'R2_ENDIAN_SCORE.json').write_text(json.dumps(scores,indent=2)+'\n')

          # Run one deep pass and dump functions/xrefs/disassembly. Raw binary base is 0.
          script=';'.join([
              'e scr.color=false',
              f'e cfg.bigendian={selected}',
              'e anal.hasnext=true',
              'e anal.jmptbl=true',
              'af @ 0',
              'aaa',
              'aac',
              'aar',
              'aav',
              'afl',
              'ax',
              'q'
          ])
          rc,out=run([str(R),'-q','-n','-a','nds32','-b','32','-m','0','-c',script,str(B)],240)
          status['analysis_exit']=rc
          (E/'R2_DEEP_ANALYSIS.txt').write_text(out)
          if rc != 0:
              (E/'R2_ANALYSIS_STATUS.json').write_text(json.dumps(status,indent=2)+'\n')
              raise SystemExit(34)

          # Separate machine-readable function/xref snapshots.
          rc_f,aflj=run([str(R),'-q','-n','-a','nds32','-b','32','-e',f'cfg.bigendian={selected}',
                         '-m','0','-c','af @ 0;aaa;aflj;q',str(B)],180)
          rc_x,axj=run([str(R),'-q','-n','-a','nds32','-b','32','-e',f'cfg.bigendian={selected}',
                        '-m','0','-c','af @ 0;aaa;aac;aar;aav;axj;q',str(B)],180)
          status['function_snapshot_exit']=rc_f
          status['xref_snapshot_exit']=rc_x
          (E/'R2_FUNCTIONS.json').write_text(aflj)
          (E/'R2_XREFS.json').write_text(axj)
          if rc_f != 0 or rc_x != 0:
              (E/'R2_ANALYSIS_STATUS.json').write_text(json.dumps(status,indent=2)+'\n')
              raise SystemExit(35)

          def parse_json_blob(s,default):
              s=s.strip()
              try: return json.loads(s)
              except Exception:
                  # Some r2 builds emit a banner/warning line before JSON.
                  for opener,closer in [('[',']'),('{','}')]:
                      a=s.find(opener); z=s.rfind(closer)
                      if a>=0 and z>a:
                          try:return json.loads(s[a:z+1])
                          except:pass
                  return default
          funcs=parse_json_blob(aflj,[])
          xrefs=parse_json_blob(axj,[])
          status['function_count']=len(funcs) if isinstance(funcs,list) else 0
          status['xref_count']=len(xrefs) if isinstance(xrefs,list) else 0

          target_rows=[]
          addr_to_name={int(v):k for k,v in targets.items() if isinstance(v,int) and v>=0}
          if isinstance(xrefs,list):
              for x in xrefs:
                  try: to=int(x.get('to'))
                  except: continue
                  if to in addr_to_name:
                      target_rows.append({'target_name':addr_to_name[to],**x})
          status['target_xref_count']=len(target_rows)
          status['command_table_xrefs']=sum(1 for x in target_rows if x.get('target_name')=='command_table')
          (E/'R2_TARGET_XREFS.json').write_text(json.dumps(target_rows,indent=2)+'\n')

          # Dump text xrefs and nearby functions for every target. This is intentionally
          # evidence-only: no automatic claim that a command is read/write based on name.
          sections=[]
          for name,off in targets.items():
              if not isinstance(off,int) or off<0: continue
              rc1,axt=run([str(R),'-q','-n','-a','nds32','-b','32','-e',f'cfg.bigendian={selected}',
                           '-m','0','-c',f'af @ 0;aaa;aac;aar;aav;axt @ 0x{off:X};q',str(B)],180)
              sections += [f'===== {name} @ 0x{off:08X} =====',axt.strip(),'']
          (E/'R2_TARGET_XREFS.txt').write_text('\n'.join(sections)+'\n')

          # Full code-region disassembly and a high-signal grep useful for the next pass.
          rc_d,dis=run([str(R),'-q','-n','-a','nds32','-b','32','-e',f'cfg.bigendian={selected}',
                        '-m','0','-c','pd 24000 @ 0;q',str(B)],180)
          status['disassembly_exit']=rc_d
          (E/'R2_CODE_DISASSEMBLY.txt').write_text(dis)
          if rc_d != 0:
              (E/'R2_ANALYSIS_STATUS.json').write_text(json.dumps(status,indent=2)+'\n')
              raise SystemExit(36)
          sig=[]
          for line in dis.splitlines():
              if re.search(r'\b(gp|sethi|ori|lwi|swi|lbi|sbi|jal|jral|beq|bne)\b',line,re.I):
                  if re.search(r'(0x0000c|0x0000d|0x0000e|\bgp\b)',line,re.I):
                      sig.append(line)
          (E/'R2_HIGH_SIGNAL_INSTRUCTIONS.txt').write_text('\n'.join(sig[:30000])+'\n')
          if status['function_count'] <= 0:
              (E/'R2_FAILURE.txt').write_text('NDS32 analysis returned zero functions; refusing false-green result\n')
              (E/'R2_ANALYSIS_STATUS.json').write_text(json.dumps(status,indent=2)+'\n')
              raise SystemExit(37)
          (E/'R2_ANALYSIS_STATUS.json').write_text(json.dumps(status,indent=2)+'\n')
          PY

      - name: Build corrected V8.9 evidence report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          E=Path('/tmp/v89/evidence')
          usb=json.loads((E/'FLASH_BOOT_USB_FACTS.json').read_text())
          cmd=json.loads((E/'FLASH_BOOT_COMMAND_TABLE.json').read_text())
          r2=json.loads((E/'R2_ANALYSIS_STATUS.json').read_text())

          report=[
              '# BP1048P4 V8.9 FlashBoot static protocol report','',
              '## Corrections carried forward from V8.7',
              '- V8.7 exact code-start normalization was successful: the previous off-by-one-looking method labels were legacy columns, not authoritative identities.',
              '- Recovery USB must be described from the FlashBoot descriptor itself: **VID 0x0000 / PID 0x2244**. Runtime VID 0x6324 must not be copied onto recovery mode.',
              '', '## Proven from exact 64K FlashBoot image',
              f"- SHA-256: `{usb['flashboot_sha256']}`",
              '- recovery interface: vendor HID, interface class 3, no interrupt endpoints',
              '- EP0 max packet: 64 bytes',
              '- report descriptor: Input 256 B, Output 256 B, Feature 1 B',
              '- Usage Page 0xFF00 / Usage 0xAA55',
              f"- PC command pointer table: `{cmd['table_offset']}`",
              '- ordered strings: `chiperas, upinfo, btupdat, cnfgdat, constdat, codedata, bootdat, cxxx`',
              '', '## NDS32 static analysis',
              f"- radare2 + NDS32 runtime healthy: **{r2['radare2_available']}**",
              f"- radare2 version self-test exit: **{r2['radare2_version_exit']}**",
              f"- NDS32 select self-test exit: **{r2['nds32_select_exit']}**",
              f"- deep analysis exit: **{r2['analysis_exit']}**",
              f"- selected cfg.bigendian: **{r2['selected_cfg_bigendian']}**",
              f"- analyzed functions: **{r2['function_count']}**",
              f"- total xrefs: **{r2['xref_count']}**",
              f"- xrefs landing on high-signal targets: **{r2['target_xref_count']}**",
              f"- xrefs to command pointer table: **{r2['command_table_xrefs']}**",
              '', '## Still intentionally not claimed',
              '- Feature report byte value/meaning: **NOT PROVEN**',
              '- exact host PC wire framing: **NOT PROVEN**',
              '- flash readback opcode/address/length framing: **NOT PROVEN**',
              '- erase/write execution: **DISABLED**',
              '- `FLASH_ALLOWED=NO`',
              '', '## Highest-value files for the next pass',
              '- `R2_TARGET_XREFS.txt` / `R2_TARGET_XREFS.json`',
              '- `R2_CODE_DISASSEMBLY.txt`',
              '- `R2_HIGH_SIGNAL_INSTRUCTIONS.txt`',
              '- `PROTOCOL_REGION_STRINGS.tsv`',
              '- `TARGET_ADDRESSES.json`',
              '- `FLASH_BOOT_REBUILT.bin`'
          ]
          (E/'V8_9_REPORT.md').write_text('\n'.join(report)+'\n')
          status={
              'flashboot_exact_sha_verified':True,
              'recovery_vid':'0x0000','recovery_pid':'0x2244',
              'recovery_hid_256_in_256_out_feature_1_proven':True,
              'pc_command_table_proven':True,
              'nds32_static_analysis_available':bool(r2['radare2_available'] and r2['analysis_exit']==0 and r2['function_count']>0),
              'nds32_target_xrefs':r2['target_xref_count'],
              'host_pc_wire_protocol_proven':False,
              'flash_read_wire_protocol_proven':False,
              'flash_write_enabled':False,
              'FLASH_ALLOWED':False
          }
          (E/'V8_9_STATUS.json').write_text(json.dumps(status,indent=2)+'\n')
          PY
          cat /tmp/v89/evidence/V8_9_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '## Target xrefs (first 180 lines)' >> "$GITHUB_STEP_SUMMARY"
          head -180 /tmp/v89/evidence/R2_TARGET_XREFS.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '## High-signal instructions (first 180 lines)' >> "$GITHUB_STEP_SUMMARY"
          head -180 /tmp/v89/evidence/R2_HIGH_SIGNAL_INSTRUCTIONS.txt >> "$GITHUB_STEP_SUMMARY" || true

