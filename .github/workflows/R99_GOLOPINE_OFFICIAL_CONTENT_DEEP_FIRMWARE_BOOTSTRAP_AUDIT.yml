name: R99 GoloPine official content deep firmware bootstrap audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r99-golopine-official-content-deep-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE: https://golodsp.com
  FLASH_ALLOWED: 'NO'

jobs:
  deep-official-audit:
    name: OFFLINE/public official content deep audit - no execution/no USB/no board/no flash
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r99/evidence /tmp/r99/files /tmp/r99/extracted
          cat > /tmp/r99/evidence/R99_SAFETY.txt <<'EOF'
          R99_PUBLIC_OFFICIAL_SITE_ONLY=YES
          BOARD_CONTACT=NO
          USB_DEVICE_ACCESS=NO
          PHONE_LIVE_TEST=NO
          VENDOR_BINARY_EXECUTION=NO
          SEND_AA55=NO
          SEND_0X11=NO
          SEND_CHIPERAS_CODEDATA_BOOTDAT_CONSTDAT_CNFGDAT_BTUPDAT_UPINFO_CXXX=NO
          R79_PHYSICAL_REPLUG_AUTORUN=NO
          ERASE_PROGRAM_FLASH=NO
          FINAL_REQUIRED_TRANSPORT=SAMSUNG_S25_PLUS_USB_C_DIRECT_TO_DSP_USB_C
          HARDWARE_MODIFICATION=FORBIDDEN
          FLASH_ALLOWED=NO
          PURPOSE=CRAWL_ALL_PUBLIC_GOLOPINE_CONTENT_AND_DEEP_INSPECT_DOCUMENT_ARCHIVE_AND_VIDEO_METADATA_FOR_FIRMWARE_BOOTSTRAP_EVIDENCE
          EOF
          cat /tmp/r99/evidence/R99_SAFETY.txt

      - name: Install static content tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip p7zip-full file ffmpeg poppler-utils
          python3 -m venv /tmp/r99-venv
          /tmp/r99-venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir \
            requests beautifulsoup4 lxml
          echo "/tmp/r99-venv/bin" >> "$GITHUB_PATH"

      - name: Crawl all public WordPress pages posts media and attachment relations
        shell: bash
        run: |
          set -euo pipefail
          /tmp/r99-venv/bin/python - <<'PY'
          from pathlib import Path
          import requests,json,time,re
          from bs4 import BeautifulSoup

          site='https://golodsp.com'
          ev=Path('/tmp/r99/evidence')
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 R99-static-audit'})

          def wp_all(kind):
              out=[]
              errors=[]
              page=1
              total_pages=None
              while True:
                  try:
                      r=s.get(f'{site}/wp-json/wp/v2/{kind}',
                              params={'per_page':100,'page':page},timeout=30)
                  except Exception as e:
                      errors.append({'kind':kind,'page':page,'error':repr(e)})
                      break
                  if r.status_code==400 and page>1:
                      break
                  if r.status_code!=200:
                      errors.append({'kind':kind,'page':page,'status':r.status_code,'text':r.text[:1000]})
                      break
                  if total_pages is None:
                      total_pages=int(r.headers.get('X-WP-TotalPages','1') or 1)
                  arr=r.json()
                  out.extend(arr)
                  if page>=total_pages:
                      break
                  page+=1
                  time.sleep(0.05)
              return out,errors

          pages,e1=wp_all('pages')
          posts,e2=wp_all('posts')
          media,e3=wp_all('media')

          def simplify_doc(x):
              return {
                  'id':x.get('id'),
                  'date':x.get('date'),
                  'slug':x.get('slug'),
                  'link':x.get('link'),
                  'title':(x.get('title') or {}).get('rendered',''),
                  'content':(x.get('content') or {}).get('rendered',''),
                  'excerpt':(x.get('excerpt') or {}).get('rendered',''),
              }

          s_pages=[simplify_doc(x) for x in pages]
          s_posts=[simplify_doc(x) for x in posts]

          s_media=[]
          for x in media:
              s_media.append({
                  'id':x.get('id'),
                  'date':x.get('date'),
                  'slug':x.get('slug'),
                  'link':x.get('link'),
                  'parent':x.get('post'),
                  'title':(x.get('title') or {}).get('rendered',''),
                  'caption':(x.get('caption') or {}).get('rendered',''),
                  'description':(x.get('description') or {}).get('rendered',''),
                  'mime_type':x.get('mime_type'),
                  'media_type':x.get('media_type'),
                  'source_url':x.get('source_url'),
              })

          ev.joinpath('R99_PAGES.json').write_text(json.dumps(s_pages,indent=2,ensure_ascii=False)+'\n')
          ev.joinpath('R99_POSTS.json').write_text(json.dumps(s_posts,indent=2,ensure_ascii=False)+'\n')
          ev.joinpath('R99_MEDIA.json').write_text(json.dumps(s_media,indent=2,ensure_ascii=False)+'\n')
          ev.joinpath('R99_REST_ERRORS.json').write_text(json.dumps(e1+e2+e3,indent=2)+'\n')

          # Strip HTML and search all public textual content.
          terms=[
              'firmware','upgrade','update','bootloader','boot','flash','mva','bp1048','bp1048p4',
              'recovery','burner','programmer','download mode','usb upgrade',
              '烧录','升级','固件','程序','引导','下载模式','恢复'
          ]
          hits=[]

          for kind,arr in [('page',s_pages),('post',s_posts)]:
              for x in arr:
                  blob=' '.join([x.get('title',''),x.get('content',''),x.get('excerpt','')])
                  text=' '.join(BeautifulSoup(blob,'lxml').stripped_strings)
                  low=text.lower()
                  mh=[t for t in terms if t.lower() in low]
                  if mh:
                      hits.append({
                          'kind':kind,'id':x['id'],'title':x['title'],'link':x['link'],
                          'terms':mh,'text':text[:30000]
                      })

          for x in s_media:
              blob=' '.join(str(x.get(k) or '') for k in
                            ('title','caption','description','slug','source_url'))
              low=blob.lower()
              mh=[t for t in terms if t.lower() in low]
              if mh:
                  hits.append({
                      'kind':'media','id':x['id'],'title':x['title'],'link':x['link'],
                      'source_url':x['source_url'],'terms':mh,'text':blob[:30000]
                  })

          ev.joinpath('R99_PUBLIC_TEXT_TERM_HITS.json').write_text(
              json.dumps(hits,indent=2,ensure_ascii=False)+'\n'
          )

          print(json.dumps({
              'page_count':len(s_pages),
              'post_count':len(s_posts),
              'media_count':len(s_media),
              'rest_error_count':len(e1+e2+e3),
              'public_text_term_hit_count':len(hits)
          },indent=2))
          PY

      - name: Download all non-image public official attachments for static inspection
        shell: bash
        run: |
          set -euo pipefail
          /tmp/r99-venv/bin/python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse,unquote
          import requests,json,hashlib,re

          ev=Path('/tmp/r99/evidence')
          out=Path('/tmp/r99/files')
          media=json.loads((ev/'R99_MEDIA.json').read_text())
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 R99-static-audit'})

          allowed_mime_prefixes=('application/','video/','audio/','text/')
          results=[]

          for idx,x in enumerate(media):
              mime=(x.get('mime_type') or '').lower()
              if not mime.startswith(allowed_mime_prefixes):
                  continue
              u=x.get('source_url')
              if not u:
                  continue
              rec={
                  'media_id':x.get('id'),
                  'title':x.get('title'),
                  'mime_type':mime,
                  'source_url':u,
              }
              try:
                  r=s.get(u,timeout=60,allow_redirects=True)
                  rec['status']=r.status_code
                  rec['final_url']=r.url
                  rec['content_type']=r.headers.get('content-type','')
                  data=r.content
                  rec['size']=len(data)
                  rec['sha256']=hashlib.sha256(data).hexdigest()
                  if r.status_code==200 and 0 < len(data) < 300_000_000:
                      name=Path(unquote(urlparse(r.url).path)).name or f'media_{x["id"]}.bin'
                      safe=re.sub(r'[^A-Za-z0-9._-]+','_',name)
                      dst=out/f'{idx:03d}_{x["id"]}_{safe}'
                      dst.write_bytes(data)
                      rec['local_path']=str(dst)
              except Exception as e:
                  rec['error']=repr(e)
              results.append(rec)

          ev.joinpath('R99_DOWNLOADED_NONIMAGE_MEDIA.json').write_text(
              json.dumps(results,indent=2,ensure_ascii=False)+'\n'
          )
          print(json.dumps(results,indent=2,ensure_ascii=False))
          PY

      - name: Extract DOCX text and recursively list archive member names
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,json,re,hashlib,os,shutil

          files=Path('/tmp/r99/files')
          ev=Path('/tmp/r99/evidence')
          ext=Path('/tmp/r99/extracted')
          ext.mkdir(exist_ok=True)

          terms=[
              'firmware','upgrade','update','bootloader','boot','flash','mva','bp1048','bp1048p4',
              'recovery','burner','programmer','download mode','usb upgrade',
              '烧录','升级','固件','程序','引导','下载模式','恢复'
          ]

          docx_records=[]
          archive_records=[]
          nested_queue=[]

          for p in files.iterdir() if files.exists() else []:
              if not p.is_file():
                  continue
              low=p.name.lower()

              # DOCX is ZIP: extract XML text directly, no office execution.
              if low.endswith('.docx') and zipfile.is_zipfile(p):
                  texts=[]
                  try:
                      with zipfile.ZipFile(p) as z:
                          for n in z.namelist():
                              if n.startswith('word/') and n.endswith('.xml'):
                                  b=z.read(n)
                                  s=b.decode('utf-8','ignore')
                                  s=re.sub(r'<[^>]+>',' ',s)
                                  texts.append(s)
                      joined=' '.join(texts)
                      hits=[t for t in terms if t.lower() in joined.lower()]
                      docx_records.append({
                          'file':p.name,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                          'term_hits':hits,'text':joined[:150000]
                      })
                  except Exception as e:
                      docx_records.append({'file':p.name,'error':repr(e)})

              # Every ZIP gets a full filename inventory.
              if zipfile.is_zipfile(p):
                  try:
                      with zipfile.ZipFile(p) as z:
                          members=[]
                          for zi in z.infolist():
                              rec={'name':zi.filename,'size':zi.file_size}
                              lowm=zi.filename.lower()
                              rec['term_hits']=[t for t in terms if t.lower() in lowm]
                              members.append(rec)

                              # Extract small nested archives/docs/videos only for more static inspection.
                              suffix=Path(zi.filename).suffix.lower()
                              if suffix in ('.zip','.docx','.txt','.md','.srt','.vtt','.mp4','.mov','.avi','.mkv') and zi.file_size < 250_000_000:
                                  try:
                                      data=z.read(zi)
                                      sub=ext/(re.sub(r'[^A-Za-z0-9._-]+','_',p.name+'__'+zi.filename))
                                      sub.write_bytes(data)
                                      nested_queue.append(str(sub))
                                  except Exception:
                                      pass

                          archive_records.append({
                              'file':p.name,
                              'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                              'members':members
                          })
                  except Exception as e:
                      archive_records.append({'file':p.name,'error':repr(e)})

          ev.joinpath('R99_DOCX_TEXT_AUDIT.json').write_text(
              json.dumps(docx_records,indent=2,ensure_ascii=False)+'\n'
          )
          ev.joinpath('R99_ARCHIVE_MEMBER_AUDIT.json').write_text(
              json.dumps(archive_records,indent=2,ensure_ascii=False)+'\n'
          )
          ev.joinpath('R99_EXTRACTED_NESTED_FILES.json').write_text(
              json.dumps(nested_queue,indent=2,ensure_ascii=False)+'\n'
          )

          print('DOCX_RECORDS',len(docx_records))
          print('ARCHIVE_RECORDS',len(archive_records))
          PY

      - name: Inspect nested text docs archives and video metadata/subtitles
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/r99/evidence/R99_NESTED_TEXT_TERM_HITS.txt
          : > /tmp/r99/evidence/R99_VIDEO_METADATA.txt
          : > /tmp/r99/evidence/R99_VIDEO_SUBTITLE_TEXT.txt
          : > /tmp/r99/evidence/R99_NESTED_ARCHIVE_LISTINGS.txt

          find /tmp/r99/extracted -type f -print0 | while IFS= read -r -d '' f; do
            typ="$(file -b "$f" || true)"

            # Plain text/subtitles.
            case "${f,,}" in
              *.txt|*.md|*.srt|*.vtt)
                grep -InaE \
                  'firmware|upgrade|update|bootloader|boot|flash|mva|bp1048|recovery|burner|programmer|download mode|usb upgrade|烧录|升级|固件|程序|引导|下载模式|恢复' \
                  "$f" \
                  | sed "s#^#$(basename "$f"):#" \
                  >> /tmp/r99/evidence/R99_NESTED_TEXT_TERM_HITS.txt || true
                ;;
            esac

            # Nested ZIP listing.
            if 7z l "$f" >/dev/null 2>&1; then
              7z l "$f" 2>/dev/null \
                | sed "s#^#$(basename "$f")\t#" \
                >> /tmp/r99/evidence/R99_NESTED_ARCHIVE_LISTINGS.txt || true
            fi

            # Video/audio metadata and embedded subtitle streams.
            if ffprobe -v error "$f" >/dev/null 2>&1; then
              echo "===== $(basename "$f") =====" >> /tmp/r99/evidence/R99_VIDEO_METADATA.txt
              ffprobe -v error -show_format -show_streams "$f" \
                >> /tmp/r99/evidence/R99_VIDEO_METADATA.txt 2>&1 || true

              # Extract embedded text subtitles if present; fail-soft.
              for si in 0 1 2 3 4; do
                ffmpeg -v error -i "$f" -map "0:s:$si" -f webvtt - 2>/dev/null \
                  >> /tmp/r99/evidence/R99_VIDEO_SUBTITLE_TEXT.txt || true
              done
            fi
          done

          echo '=== nested term hits ==='
          sed -n '1,1200p' /tmp/r99/evidence/R99_NESTED_TEXT_TERM_HITS.txt
          echo '=== nested archive listings ==='
          sed -n '1,1600p' /tmp/r99/evidence/R99_NESTED_ARCHIVE_LISTINGS.txt
          echo '=== video subtitle text ==='
          sed -n '1,1200p' /tmp/r99/evidence/R99_VIDEO_SUBTITLE_TEXT.txt

      - name: Search all extracted official text for firmware bootstrap language
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          ev=Path('/tmp/r99/evidence')
          docs=json.loads((ev/'R99_DOCX_TEXT_AUDIT.json').read_text())
          arcs=json.loads((ev/'R99_ARCHIVE_MEMBER_AUDIT.json').read_text())
          public=json.loads((ev/'R99_PUBLIC_TEXT_TERM_HITS.json').read_text())
          nested=(ev/'R99_NESTED_TEXT_TERM_HITS.txt').read_text(errors='ignore')
          subs=(ev/'R99_VIDEO_SUBTITLE_TEXT.txt').read_text(errors='ignore')

          high_terms=[
              'firmware update','firmware upgrade','upgrade firmware','bootloader','recovery',
              'mva','flash burner','programmer','download mode','usb upgrade',
              '固件升级','升级固件','烧录','下载模式','恢复模式'
          ]

          high=[]
          for x in public:
              blob=x.get('text','')
              hits=[t for t in high_terms if t.lower() in blob.lower()]
              if hits:
                  high.append({'source':'public','item':x,'high_terms':hits})

          for x in docs:
              blob=x.get('text','')
              hits=[t for t in high_terms if t.lower() in blob.lower()]
              if hits:
                  high.append({
                      'source':'docx','file':x.get('file'),'high_terms':hits,
                      'text':blob[:80000]
                  })

          for x in arcs:
              for m in x.get('members',[]):
                  blob=m.get('name','')
                  hits=[t for t in high_terms if t.lower() in blob.lower()]
                  if hits:
                      high.append({
                          'source':'archive_member','file':x.get('file'),
                          'member':m,'high_terms':hits
                      })

          for label,blob in [('nested_text',nested),('video_subtitles',subs)]:
              hits=[t for t in high_terms if t.lower() in blob.lower()]
              if hits:
                  high.append({'source':label,'high_terms':hits,'text':blob[:120000]})

          ev.joinpath('R99_HIGH_CONFIDENCE_BOOTSTRAP_CONTENT_HITS.json').write_text(
              json.dumps(high,indent=2,ensure_ascii=False)+'\n'
          )
          print(json.dumps({'high_confidence_hit_count':len(high)},indent=2))
          PY

      - name: Build fail-closed decision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          p=Path('/tmp/r99/evidence')
          pages=json.loads((p/'R99_PAGES.json').read_text())
          posts=json.loads((p/'R99_POSTS.json').read_text())
          media=json.loads((p/'R99_MEDIA.json').read_text())
          errs=json.loads((p/'R99_REST_ERRORS.json').read_text())
          down=json.loads((p/'R99_DOWNLOADED_NONIMAGE_MEDIA.json').read_text())
          docs=json.loads((p/'R99_DOCX_TEXT_AUDIT.json').read_text())
          arcs=json.loads((p/'R99_ARCHIVE_MEMBER_AUDIT.json').read_text())
          high=json.loads((p/'R99_HIGH_CONFIDENCE_BOOTSTRAP_CONTENT_HITS.json').read_text())

          decision={
              'OFFICIAL_REST_CRAWL_COMPLETE_WITHOUT_ERRORS':len(errs)==0,
              'PUBLIC_PAGE_COUNT':len(pages),
              'PUBLIC_POST_COUNT':len(posts),
              'PUBLIC_MEDIA_COUNT':len(media),
              'DOWNLOADED_NONIMAGE_MEDIA_COUNT':len([x for x in down if x.get('local_path')]),
              'DOCX_DEEP_AUDIT_COUNT':len(docs),
              'ARCHIVE_DEEP_AUDIT_COUNT':len(arcs),
              'HIGH_CONFIDENCE_FIRMWARE_BOOTSTRAP_CONTENT_HIT_COUNT':len(high),
              'OFFICIAL_GOLOPINE_7CH_STOCK_FIRMWARE_PACKAGE_FOUND':False,
              'OFFICIAL_PHONE_DIRECT_USB_C_FIRMWARE_UPDATE_PROCEDURE_FOUND':False,
              'PRODUCTION_FLASHBOOT_64K_PRESENT_PROVEN':False,
              'PRODUCTION_FLASH_BOOT_EN_PROVEN':False,
              'PRODUCTION_RECOVERY_USB_IDENTITY_PROVEN':False,
              'READ_ONLY_PRODUCTION_BACKUP_PATH_PROVEN':False,
              'PHONE_DIRECT_PRODUCTION_BOOTSTRAP_PROVEN':False,
              'LIVE_BOARD_TEST_ALLOWED_FROM_R99':False,
              'FLASH_ALLOWED':False,
          }

          # Do not auto-promote keyword hits to proof.
          p.joinpath('R99_DECISION.json').write_text(json.dumps(decision,indent=2)+'\n')

          lines=[
              '# R99 GoloPine official content deep firmware/bootstrap audit',
              '',
              'PUBLIC OFFICIAL CONTENT / STATIC INSPECTION ONLY. No board or USB access.',
              '',
              '## Decision',
              '```json',json.dumps(decision,indent=2),'```','',
              '## High-confidence content hits requiring review',
          ]
          if high:
              for x in high[:250]:
                  lines.append('- '+json.dumps(x,ensure_ascii=False)[:5000])
          else:
              lines.append('- none')

          lines += [
              '',
              '## Interpretation gate',
              '- R99 closes the metadata blind spot left by R98 by parsing public page/post content, DOCX XML, archive member names, nested text, and video metadata/subtitles.',
              '- Keyword hits are not accepted as proof of a firmware package or phone-direct updater unless the exact file/procedure identifies the GoloPine 7CH production target and the transport.',
              '- No PC/programmer/debug path is accepted as the final solution.',
              '- No AA55 repeat, no R79, no 0x11, no board modification, no flash.',
              '- FLASH_ALLOWED=NO.',
          ]
          p.joinpath('R99_REPORT.md').write_text('\n'.join(lines)+'\n')
          print(json.dumps(decision,indent=2))
          PY

          sed -n '1,1200p' /tmp/r99/evidence/R99_REPORT.md

      - name: Package evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/r99/evidence && zip -9 -r /tmp/R99_GOLOPINE_OFFICIAL_CONTENT_DEEP_AUDIT_EVIDENCE.zip .)
          sha256sum /tmp/R99_GOLOPINE_OFFICIAL_CONTENT_DEEP_AUDIT_EVIDENCE.zip \
            > /tmp/R99_GOLOPINE_OFFICIAL_CONTENT_DEEP_AUDIT_EVIDENCE.zip.sha256

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R99-GOLOPINE-OFFICIAL-CONTENT-DEEP-AUDIT-EVIDENCE
          path: |
            /tmp/R99_GOLOPINE_OFFICIAL_CONTENT_DEEP_AUDIT_EVIDENCE.zip
            /tmp/R99_GOLOPINE_OFFICIAL_CONTENT_DEEP_AUDIT_EVIDENCE.zip.sha256
          if-no-files-found: error
