name: OKN BP1048P4 R70 All-in-One Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install API 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Reconstruct R70 Android project from this single workflow
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/OKN_BP1048P4_R70_FirmwareForensics"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          mkdir -p "$ROOT"
          cat > "$ROOT/KNOWN_PROTOCOL.md.b64" <<'OKN_R70_B64'
          
          OKN_R70_B64
          base64 -d "$ROOT/KNOWN_PROTOCOL.md.b64" > "$ROOT/KNOWN_PROTOCOL.md"
          rm -f "$ROOT/KNOWN_PROTOCOL.md.b64"
          mkdir -p "$ROOT"
          cat > "$ROOT/R70_BUILD_STATE.txt.b64" <<'OKN_R70_B64'
          
          OKN_R70_B64
          base64 -d "$ROOT/R70_BUILD_STATE.txt.b64" > "$ROOT/R70_BUILD_STATE.txt"
          rm -f "$ROOT/R70_BUILD_STATE.txt.b64"
          mkdir -p "$ROOT"
          cat > "$ROOT/R70_STATUS.txt.b64" <<'OKN_R70_B64'
          
          OKN_R70_B64
          base64 -d "$ROOT/R70_STATUS.txt.b64" > "$ROOT/R70_STATUS.txt"
          rm -f "$ROOT/R70_STATUS.txt.b64"
          mkdir -p "$ROOT"
          cat > "$ROOT/README_R70_TH.md.b64" <<'OKN_R70_B64'
          
          OKN_R70_B64
          base64 -d "$ROOT/README_R70_TH.md.b64" > "$ROOT/README_R70_TH.md"
          rm -f "$ROOT/README_R70_TH.md.b64"
          mkdir -p "$ROOT"
          cat > "$ROOT/README_TH.md.b64" <<'OKN_R70_B64'
          
          OKN_R70_B64
          base64 -d "$ROOT/README_TH.md.b64" > "$ROOT/README_TH.md"
          rm -f "$ROOT/README_TH.md.b64"
          mkdir -p "$ROOT"
          cat > "$ROOT/RESEARCH_NOTES.md.b64" <<'OKN_R70_B64'
          
          OKN_R70_B64
          base64 -d "$ROOT/RESEARCH_NOTES.md.b64" > "$ROOT/RESEARCH_NOTES.md"
          rm -f "$ROOT/RESEARCH_NOTES.md.b64"
          mkdir -p "$ROOT"
          cat > "$ROOT/SAFETY_GATE.txt.b64" <<'OKN_R70_B64'
          
          OKN_R70_B64
          base64 -d "$ROOT/SAFETY_GATE.txt.b64" > "$ROOT/SAFETY_GATE.txt"
          rm -f "$ROOT/SAFETY_GATE.txt.b64"
          mkdir -p "$ROOT/app"
          cat > "$ROOT/app/build.gradle.b64" <<'OKN_R70_B64'
          
          OKN_R70_B64
          base64 -d "$ROOT/app/build.gradle.b64" > "$ROOT/app/build.gradle"
          rm -f "$ROOT/app/build.gradle.b64"
          mkdir -p "$ROOT/app/src/main"
          cat > "$ROOT/app/src/main/AndroidManifest.xml.b64" <<'OKN_R70_B64'
          
          OKN_R70_B64
          base64 -d "$ROOT/app/src/main/AndroidManifest.xml.b64" > "$ROOT/app/src/main/AndroidManifest.xml"
          rm -f "$ROOT/app/src/main/AndroidManifest.xml.b64"
          mkdir -p "$ROOT/app/src/main/java/com/okn/bp1048p4r70"
          cat > "$ROOT/app/src/main/java/com/okn/bp1048p4r70/CaptureAnalyzer.java.b64" <<'OKN_R70_B64'
          
          
          OKN_R70_B64
          base64 -d "$ROOT/app/src/main/java/com/okn/bp1048p4r70/CaptureAnalyzer.java.b64" > "$ROOT/app/src/main/java/com/okn/bp1048p4r70/CaptureAnalyzer.java"
          rm -f "$ROOT/app/src/main/java/com/okn/bp1048p4r70/CaptureAnalyzer.java.b64"
          mkdir -p "$ROOT/app/src/main/java/com/okn/bp1048p4r70"
          cat > "$ROOT/app/src/main/java/com/okn/bp1048p4r70/CaptureStore.java.b64" <<'OKN_R70_B64'
          
          OKN_R70_B64
          base64 -d "$ROOT/app/src/main/java/com/okn/bp1048p4r70/CaptureStore.java.b64" > "$ROOT/app/src/main/java/com/okn/bp1048p4r70/CaptureStore.java"
          rm -f "$ROOT/app/src/main/java/com/okn/bp1048p4r70/CaptureStore.java.b64"
          mkdir -p "$ROOT/app/src/main/java/com/okn/bp1048p4r70"
          cat > "$ROOT/app/src/main/java/com/okn/bp1048p4r70/FirmwareReadbackStrategy.java.b64" <<'OKN_R70_B64'
          
          OKN_R70_B64
          base64 -d "$ROOT/app/src/main/java/com/okn/bp1048p4r70/FirmwareReadbackStrategy.java.b64" > "$ROOT/app/src/main/java/com/okn/bp1048p4r70/FirmwareReadbackStrategy.java"
          rm -f "$ROOT/app/src/main/java/com/okn/bp1048p4r70/FirmwareReadbackStrategy.java.b64"
          mkdir -p "$ROOT/app/src/main/java/com/okn/bp1048p4r70"
          cat > "$ROOT/app/src/main/java/com/okn/bp1048p4r70/MainActivity.java.b64" <<'OKN_R70_B64'
          
          
          
          
          OKN_R70_B64
          base64 -d "$ROOT/app/src/main/java/com/okn/bp1048p4r70/MainActivity.java.b64" > "$ROOT/app/src/main/java/com/okn/bp1048p4r70/MainActivity.java"
          rm -f "$ROOT/app/src/main/java/com/okn/bp1048p4r70/MainActivity.java.b64"
          mkdir -p "$ROOT/app/src/main/java/com/okn/bp1048p4r70"
          cat > "$ROOT/app/src/main/java/com/okn/bp1048p4r70/NoProvenReadbackStrategy.java.b64" <<'OKN_R70_B64'
          
          OKN_R70_B64
          base64 -d "$ROOT/app/src/main/java/com/okn/bp1048p4r70/NoProvenReadbackStrategy.java.b64" > "$ROOT/app/src/main/java/com/okn/bp1048p4r70/NoProvenReadbackStrategy.java"
          rm -f "$ROOT/app/src/main/java/com/okn/bp1048p4r70/NoProvenReadbackStrategy.java.b64"
          mkdir -p "$ROOT/app/src/main/java/com/okn/bp1048p4r70"
          cat > "$ROOT/app/src/main/java/com/okn/bp1048p4r70/ProtocolFacts.java.b64" <<'OKN_R70_B64'
          
          OKN_R70_B64
          base64 -d "$ROOT/app/src/main/java/com/okn/bp1048p4r70/ProtocolFacts.java.b64" > "$ROOT/app/src/main/java/com/okn/bp1048p4r70/ProtocolFacts.java"
          rm -f "$ROOT/app/src/main/java/com/okn/bp1048p4r70/ProtocolFacts.java.b64"
          mkdir -p "$ROOT/app/src/main/java/com/okn/bp1048p4r70"
          cat > "$ROOT/app/src/main/java/com/okn/bp1048p4r70/UsbCaptureEngine.java.b64" <<'OKN_R70_B64'
          
          
          
          
          
          OKN_R70_B64
          base64 -d "$ROOT/app/src/main/java/com/okn/bp1048p4r70/UsbCaptureEngine.java.b64" > "$ROOT/app/src/main/java/com/okn/bp1048p4r70/UsbCaptureEngine.java"
          rm -f "$ROOT/app/src/main/java/com/okn/bp1048p4r70/UsbCaptureEngine.java.b64"
          mkdir -p "$ROOT/app/src/main/res/xml"
          cat > "$ROOT/app/src/main/res/xml/device_filter.xml.b64" <<'OKN_R70_B64'
          
          OKN_R70_B64
          base64 -d "$ROOT/app/src/main/res/xml/device_filter.xml.b64" > "$ROOT/app/src/main/res/xml/device_filter.xml"
          rm -f "$ROOT/app/src/main/res/xml/device_filter.xml.b64"
          mkdir -p "$ROOT"
          cat > "$ROOT/build.gradle.b64" <<'OKN_R70_B64'
          cGx1Z2lucyB7CiAgICBpZCAiY29tLmFuZHJvaWQuYXBwbGljYXRpb24iIHZlcnNpb24gIjguNy4zIiBhcHBseSBmYWxzZQp9Cg==
          OKN_R70_B64
          base64 -d "$ROOT/build.gradle.b64" > "$ROOT/build.gradle"
          rm -f "$ROOT/build.gradle.b64"
          mkdir -p "$ROOT"
          cat > "$ROOT/gradle.properties.b64" <<'OKN_R70_B64'
          b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD1mYWxzZQphbmRyb2lkLm5vblRyYW5zaXRpdmVSQ2xhc3M9dHJ1ZQo=
          OKN_R70_B64
          base64 -d "$ROOT/gradle.properties.b64" > "$ROOT/gradle.properties"
          rm -f "$ROOT/gradle.properties.b64"
          mkdir -p "$ROOT"
          cat > "$ROOT/settings.gradle.b64" <<'OKN_R70_B64'
          
          OKN_R70_B64
          base64 -d "$ROOT/settings.gradle.b64" > "$ROOT/settings.gradle"
          rm -f "$ROOT/settings.gradle.b64"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Static safety gate
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          ! grep -RniE 'SpiFlashErase[[:space:]]*\(|SpiFlashWrite[[:space:]]*\(|FlashChipErase[[:space:]]*\(|FlashSectorErase[[:space:]]*\(' app/src/main/java
          grep -Rni 'NoProvenReadbackStrategy' app/src/main/java
          ! grep -RniE 'chiperas[[:space:]]*\(' app/src/main/java || { echo 'Blocked destructive flash command'; exit 1; }

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle-8.9-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          gradle --no-daemon :app:assembleDebug

      - name: Package APK, source and hashes
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r70-out"
          rm -rf "$OUT" && mkdir -p "$OUT"
          cp "$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk" "$OUT/OKN_BP1048P4_R70_FirmwareForensics.apk"
          sha256sum "$OUT/OKN_BP1048P4_R70_FirmwareForensics.apk" | tee "$OUT/OKN_BP1048P4_R70_FirmwareForensics.apk.sha256.txt"
          (cd "$PROJECT_ROOT" && zip -qr "$OUT/OKN_BP1048P4_R70_SOURCE.zip" . -x "app/build/*" ".gradle/*")
          sha256sum "$OUT/OKN_BP1048P4_R70_SOURCE.zip" | tee "$OUT/OKN_BP1048P4_R70_SOURCE.zip.sha256.txt"
          cp "$PROJECT_ROOT/R70_STATUS.txt" "$OUT/"
          cp "$PROJECT_ROOT/SAFETY_GATE.txt" "$OUT/"
          echo "OUT_DIR=$OUT" >> "$GITHUB_ENV"

      - name: Upload R70 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OKN_BP1048P4_R70_ALL_OUTPUTS
          path: |
            ${{ env.OUT_DIR }}/OKN_BP1048P4_R70_FirmwareForensics.apk
            ${{ env.OUT_DIR }}/OKN_BP1048P4_R70_FirmwareForensics.apk.sha256.txt
            ${{ env.OUT_DIR }}/OKN_BP1048P4_R70_SOURCE.zip
            ${{ env.OUT_DIR }}/OKN_BP1048P4_R70_SOURCE.zip.sha256.txt
            ${{ env.OUT_DIR }}/R70_STATUS.txt
            ${{ env.OUT_DIR }}/SAFETY_GATE.txt
          if-no-files-found: error

      - name: Build summary
        shell: bash
        run: |
          {
            echo '## OKN BP1048P4 R70'
            echo ''
            echo 'Physical path: Samsung Galaxy S25+ -> USB-C -> DSP board USB-C only.'
            echo ''
            echo 'R70 snapshot/capture build contains no proven full-flash readback opcode and no authorized flash erase/write path.'
            echo ''
            cat "$OUT_DIR/OKN_BP1048P4_R70_FirmwareForensics.apk.sha256.txt"
          } >> "$GITHUB_STEP_SUMMARY"
