      - name: Firmware host build and unit tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S /tmp/okn-r4-work/okn-r4/firmware                 -B /tmp/okn-r4-work/okn-r4/firmware/build                 -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build /tmp/okn-r4-work/okn-r4/firmware/build
          ctest --test-dir /tmp/okn-r4-work/okn-r4/firmware/build --output-on-failure

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android protocol/model host test
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/okn-r4-work/okn-r4
          rm -rf android-app/host-test/out
          mkdir -p android-app/host-test/out
          javac -Xlint:all -Werror -d android-app/host-test/out             android-app/app/src/main/java/com/okn/dsp/DspModel.java             android-app/app/src/main/java/com/okn/dsp/OknPacket.java             android-app/host-test/OknPacketHostTest.java
          java -cp android-app/host-test/out com.okn.dsp.OknPacketHostTest

      - name: Verify Bluetooth + safety source gates
        shell: bash
        run: |
          set -euo pipefail
          APP=/tmp/okn-r4-work/okn-r4/android-app/app

          grep -F 'applicationId = "com.okn.dsp.r4"' "$APP/build.gradle.kts"
          grep -F 'android.permission.BLUETOOTH_SCAN' "$APP/src/main/AndroidManifest.xml"
          grep -F 'android.permission.BLUETOOTH_CONNECT' "$APP/src/main/AndroidManifest.xml"
          grep -F '00001101-0000-1000-8000-00805F9B34FB'             "$APP/src/main/java/com/okn/dsp/BluetoothInspector.java"
          grep -F 'connectGatt'             "$APP/src/main/java/com/okn/dsp/BluetoothInspector.java"

          grep -F 'OKN_RUNTIME_USB_TX_ENABLED", "false"' "$APP/build.gradle.kts"
          grep -F 'OKN_PRODUCTION_FLASH_ENABLED", "false"' "$APP/build.gradle.kts"

          if grep -RInE             'getOutputStream\(|writeCharacteristic\(|chiperas|codedata|bootdat|constdat|cnfgdat|btupdat|upinfo|SpiFlashWrite|SpiFlashErase'             "$APP/src/main/java"; then
            echo "Forbidden Bluetooth/DSP/flash write symbol found"
            exit 1
          fi

          echo "R4_BLUETOOTH_AND_SAFETY_GATE=PASS"

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build OKN-DSP R4 APK
        working-directory: /tmp/okn-r4-work/okn-r4/android-app
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn-r4-work/okn-r4/android-app/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          cp "$APK" /tmp/OKN-DSP-R4-v0.1.2-usb-bluetooth.apk
          sha256sum /tmp/OKN-DSP-R4-v0.1.2-usb-bluetooth.apk             > /tmp/OKN-DSP-R4-v0.1.2-usb-bluetooth.apk.sha256
          sha256sum /tmp/OKN-DSP-R4-v0.1.2-source.zip             > /tmp/OKN-DSP-R4-v0.1.2-source.zip.sha256

      - name: Create phone test instructions
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/R4_NEXT_STEPS_TH.txt <<'EOF'
          OKN-DSP R4 USB + BLUETOOTH

          1. ติดตั้ง OKN-DSP-R4-v0.1.2-usb-bluetooth.apk บน Samsung S25+
          2. เปิดแอปและอนุญาต Bluetooth
          3. กดค้นหา Bluetooth Classic + BLE
          4. แตะชื่อ DSP:
             - ถ้ายังไม่ Pair แอปจะเริ่ม Pair
             - ถ้าเป็น BLE แอปจะ GATT connect + discover services
             - ถ้ามี standard SPP แอปจะ RFCOMM connect แบบ NO-TX
             - ถ้าเป็น Bluetooth Audio ให้กด Bluetooth Settings แล้วเลือกเชื่อมจาก Android
          5. USB-C ยังคงใช้ตรง S25+ -> DSP สำหรับ descriptor collector
          6. ส่งภาพหน้าจอ Bluetooth status/service UUID กลับมา

          SAFETY:
          - NO RFCOMM TX
          - NO BLE characteristic write
          - NO DSP runtime TX
          - NO erase/program/flash
          EOF

      - name: Upload OKN-DSP R4 package
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-R4-USB-BLUETOOTH-ALL-IN-ONE
          path: |
            /tmp/OKN-DSP-R4-v0.1.2-usb-bluetooth.apk
            /tmp/OKN-DSP-R4-v0.1.2-usb-bluetooth.apk.sha256
            /tmp/OKN-DSP-R4-v0.1.2-source.zip
            /tmp/OKN-DSP-R4-v0.1.2-source.zip.sha256
            /tmp/R4_NEXT_STEPS_TH.txt
          if-no-files-found: error
          retention-days: 30
