name: OKN-DSP R4 ALL-IN-ONE USB + Bluetooth

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/R4_OKN_DSP_USB_BLUETOOTH_ALL_IN_ONE.yml'

permissions:
  contents: read

env:
  FLASH_ALLOWED: 'NO'
  DSP_TX_ALLOWED: 'NO'
  USB_OUT_ALLOWED: 'NO'
  BLE_WRITE_ALLOWED: 'NO'
  RFCOMM_TX_ALLOWED: 'NO'
  BOARD_USB_ACCESS_IN_CI: 'NO'
  HARDWARE_MODIFICATION: 'FORBIDDEN'
  FINAL_INSTALL_PATH: 'SAMSUNG_S25_PLUS_USB_C_DIRECT_TO_DSP_USB_C_ONLY'
  ANDROID_HOME: '/usr/local/lib/android/sdk'
  ANDROID_SDK_ROOT: '/usr/local/lib/android/sdk'

jobs:
  build-r4:
    name: Build OKN-DSP R4 USB + Bluetooth APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          echo "OKN_DSP_R4=YES"
          echo "FLASH_ALLOWED=NO"
          echo "DSP_TX_ALLOWED=NO"
          echo "USB_OUT_ALLOWED=NO"
          echo "BLE_WRITE_ALLOWED=NO"
          echo "RFCOMM_TX_ALLOWED=NO"
          echo "BOARD_USB_ACCESS_IN_CI=NO"
          echo "HARDWARE_MODIFICATION=FORBIDDEN"

