name: R117 BP1048 SDK exact bootstrap bridge static reverse

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R117_BP1048_SDK_EXACT_BOOTSTRAP_BRIDGE_STATIC_REVERSE.yml"

permissions:
  contents: read

concurrency:
  group: r117-bp1048-sdk-bootstrap-bridge-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_REPO: "leadercxn/bp1048_sdk_v0.1.12"
  SDK_COMMIT: "8105bd864b04995d81c9f9ae77cb158259f39015"
  FLASH_ALLOWED: "NO"

jobs:
  static-reverse:
    name: STATIC ONLY - exact SDK source correlation - no execution - no USB - no board
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r117/sdk /tmp/r117/evidence
          cat > /tmp/r117/evidence/R117_SAFETY.txt <<'EOF'
          R117_MODE=STATIC_SOURCE_REVERSE_ONLY
          R117_VENDOR_FIRMWARE_EXECUTED=NO
          R117_TOOL_BINARY_EXECUTED=NO
          R117_USB_DEVICE_ACCESS=NO
          R117_BOARD_CONTACT=NO
          R117_AA55_SENT=NO
          R117_RUNTIME_0X11_SENT=NO
          R117_CONTROL_0XFE_SENT=NO
          R117_FLASHBOOT_COMMAND_SENT=NO
          R117_FLASH_READ_EXECUTED=NO
          R117_FLASH_ERASE_EXECUTED=NO
          R117_FLASH_WRITE_EXECUTED=NO
          R117_ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD=NO
          FINAL_REQUIRED_TRANSPORT=SAMSUNG_S25_PLUS_USB_C_DIRECT_TO_DSP_USB_C
          HARDWARE_MODIFICATION=FORBIDDEN
          FLASH_ALLOWED=NO
          EOF

      - name: Install static analysis tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            curl unzip file binutils jq >/dev/null

      - name: Acquire exact public BP1048 SDK commit as source only
        shell: bash
        run: |
          set -euo pipefail
          URL="https://codeload.github.com/${SDK_REPO}/zip/${SDK_COMMIT}"
          curl --fail --location --retry 5 --retry-all-errors \
            "$URL" -o /tmp/r117/sdk.zip
          unzip -q /tmp/r117/sdk.zip -d /tmp/r117/sdk
          ROOT="$(find /tmp/r117/sdk -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$ROOT"
          echo "$ROOT" > /tmp/r117/sdk_root.txt
          {
            echo "SDK_REPO=$SDK_REPO"
            echo "SDK_COMMIT=$SDK_COMMIT"
            echo "ARCHIVE_SHA256=$(sha256sum /tmp/r117/sdk.zip | awk '{print $1}')"
            echo "ARCHIVE_SIZE=$(stat -c '%s' /tmp/r117/sdk.zip)"
          } > /tmp/r117/evidence/R117_SDK_PIN.txt

      - name: Extract exact 0x11 handler and bootstrap function
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          root=Path(Path("/tmp/r117/sdk_root.txt").read_text().strip())
          srcroot=root/"BT_Audio_APP"/"bt_audio_app_src"

          files=[p for p in srcroot.rglob("*") if p.is_file() and p.suffix.lower() in (".c",".h")]
          corpus={}
          for p in files:
              try:
                  corpus[p]=p.read_text(errors="replace")
              except Exception:
                  pass

          def extract_function(text,name):
              # Find a real definition, not a prototype/call.
              pat=re.compile(r'(?m)^[ \t]*(?:[A-Za-z_][\w\s\*\(\)]*?[ \t]+)?'+re.escape(name)+r'[ \t]*\([^;]*?\)[ \t\r\n]*\{')
              for m in pat.finditer(text):
                  brace=text.find("{",m.start())
                  if brace<0: continue
                  depth=0
                  for i in range(brace,len(text)):
                      ch=text[i]
                      if ch=="{": depth+=1
                      elif ch=="}":
                          depth-=1
                          if depth==0:
                              return text[m.start():i+1]
              return None

          wanted=["Communication_Effect_0x11","MV_UserWriteData","start_up_grate"]
          found={}
          for name in wanted:
              for p,t in corpus.items():
                  body=extract_function(t,name)
                  if body:
                      found[name]={"path":str(p.relative_to(root)),"body":body}
                      break

          for name,v in found.items():
              Path(f"/tmp/r117/evidence/R117_{name}.txt").write_text(
                  f"FILE={v['path']}\n\n{v['body']}\n",encoding="utf-8"
              )

          h11=found.get("Communication_Effect_0x11",{}).get("body","")
          userwrite=found.get("MV_UserWriteData",{}).get("body","")
          boot=found.get("start_up_grate",{}).get("body","")

          facts={
              "COMMUNICATION_EFFECT_0X11_FOUND":"Communication_Effect_0x11" in found,
              "MV_USER_WRITE_DATA_FOUND":"MV_UserWriteData" in found,
              "START_UP_GRATE_FOUND":"start_up_grate" in found,
              "0X11_CALLS_MV_USER_WRITE_DATA":"MV_UserWriteData" in h11,
              "0X11_DIRECTLY_CALLS_START_UP_GRATE":"start_up_grate" in h11,
              "0X11_DIRECTLY_REFERENCES_APPRESOURCEUSBDEVICE":"AppResourceUsbDevice" in h11,
              "0X11_DIRECTLY_REFERENCES_FLASH_BOOT_FLAG":"SREG_FLASH_BOOT_FLAGE" in h11,
              "MV_USER_WRITE_DATA_CALLS_SPIFLASHWRITE":"SpiFlashWrite" in userwrite,
              "MV_USER_WRITE_DATA_CALLS_SPIFLASHREAD":"SpiFlashRead" in userwrite,
              "0X11_VERSION_RESPONSE_CONTROL_0X11":bool(re.search(r'tx_buf\s*\[\s*2\s*\]\s*=\s*0x11',h11,re.I)),
              "0X11_VERSION_RESPONSE_TYPE_0X30":bool(re.search(r'tx_buf\s*\[\s*4\s*\]\s*=\s*0x30',h11,re.I)),
              "START_UP_GRATE_HAS_PC_FLAG":".PC" in boot and "AppResourceUsbDevice" in boot,
              "START_UP_GRATE_HAS_UPDATE_FLAG":".updata" in boot,
              "START_UP_GRATE_JUMPS_TO_ZERO":bool(re.search(r'jump_fun\s*=\s*\(\s*fun\s*\)\s*0',boot)),
              "START_UP_GRATE_TOUCHES_BOOT_FLAG_ADDRESS":"ADR_FLASH_BOOT_FLAGE" in boot,
          }
          Path("/tmp/r117/evidence/R117_EXACT_FUNCTION_FACTS.json").write_text(
              json.dumps(facts,indent=2,ensure_ascii=False)+"\n"
          )
          print(json.dumps(facts,indent=2))
          PY

      - name: Find every source caller and reference to start_up_grate and AppResourceUsbDevice
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,json

          root=Path(Path("/tmp/r117/sdk_root.txt").read_text().strip())
          srcroot=root/"BT_Audio_APP"/"bt_audio_app_src"

          terms=[
              "start_up_grate",
              "AppResourceUsbDevice",
              "UsbLoadAudioMode",
              "HIDUsb_Rx",
              "HIDUsb_Tx",
              "GET_REPORT",
              "SET_REPORT",
              "FEATURE",
              "Feature",
          ]

          rows=[]
          for p in srcroot.rglob("*"):
              if not p.is_file() or p.suffix.lower() not in (".c",".h"):
                  continue
              t=p.read_text(errors="replace")
              lines=t.splitlines()
              for term in terms:
                  for i,line in enumerate(lines):
                      if term not in line:
                          continue
                      a=max(0,i-6); z=min(len(lines),i+8)
                      rows.append({
                          "term":term,
                          "path":str(p.relative_to(root)),
                          "line":i+1,
                          "text":line,
                          "context":"\n".join(f"{n+1}: {lines[n]}" for n in range(a,z))
                      })

          Path("/tmp/r117/evidence/R117_SOURCE_REFERENCES.json").write_text(
              json.dumps(rows,indent=2,ensure_ascii=False)+"\n"
          )

          # Separate actual call-like appearances of start_up_grate.
          callers=[]
          for r in rows:
              if r["term"]!="start_up_grate": continue
              line=r["text"]
              # Definition line is retained but flagged.
              definition=bool(re.search(r'\bvoid\s+start_up_grate\s*\(',line))
              calllike="start_up_grate(" in line.replace(" ","")
              callers.append({**r,"definition":definition,"calllike":calllike})
          Path("/tmp/r117/evidence/R117_START_UP_GRATE_REFERENCES.json").write_text(
              json.dumps(callers,indent=2,ensure_ascii=False)+"\n"
          )
          PY

      - name: Search for USB HID Feature bridge candidates including AA55
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,json

          root=Path(Path("/tmp/r117/sdk_root.txt").read_text().strip())
          srcroot=root/"BT_Audio_APP"/"bt_audio_app_src"

          candidates=[]
          for p in srcroot.rglob("*"):
              if not p.is_file() or p.suffix.lower() not in (".c",".h"):
                  continue
              t=p.read_text(errors="replace")
              low=t.lower()
              # Require USB/HID/report semantics and AA/55 tokens in the same source file.
              usb=bool(re.search(r'usb|hid|report|feature',t,re.I))
              aa=bool(re.search(r'0x0*aa\b|\b170\b',t,re.I))
              v55=bool(re.search(r'0x0*55\b|\b85\b',t,re.I))
              if usb and (aa or v55):
                  hits=[]
                  for m in re.finditer(r'0x0*(?:aa|55)\b|\b(?:170|85)\b',t,re.I):
                      a=max(0,m.start()-1000); z=min(len(t),m.end()+1800)
                      ctx=t[a:z]
                      if re.search(r'usb|hid|report|feature',ctx,re.I):
                          hits.append(ctx)
                          if len(hits)>=30: break
                  if hits:
                      candidates.append({
                          "path":str(p.relative_to(root)),
                          "has_aa":aa,
                          "has_55":v55,
                          "contexts":hits
                      })

          Path("/tmp/r117/evidence/R117_AA55_USB_HID_CANDIDATES.json").write_text(
              json.dumps(candidates,indent=2,ensure_ascii=False)+"\n"
          )
          PY

      - name: Inspect precompiled archives for hidden bridge symbols
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat /tmp/r117/sdk_root.txt)"
          : > /tmp/r117/evidence/R117_ARCHIVE_SYMBOL_HITS.txt
          : > /tmp/r117/evidence/R117_BINARY_STRING_HITS.txt

          while IFS= read -r -d '' f; do
            echo "===== $f =====" >> /tmp/r117/evidence/R117_ARCHIVE_SYMBOL_HITS.txt
            nm -A "$f" 2>/dev/null | \
              grep -Ei 'start_up_grate|UsbLoadAudioMode|AppResourceUsbDevice|HIDUsb|flash.?boot|upgrade' \
              >> /tmp/r117/evidence/R117_ARCHIVE_SYMBOL_HITS.txt || true

            echo "===== $f =====" >> /tmp/r117/evidence/R117_BINARY_STRING_HITS.txt
            strings -a "$f" 2>/dev/null | \
              grep -Ei 'start_up_grate|UsbLoadAudioMode|AppResourceUsbDevice|HIDUsb|flash.?boot|upgrade|chiperas|upinfo|codedata|bootdat|cxxx' \
              >> /tmp/r117/evidence/R117_BINARY_STRING_HITS.txt || true
          done < <(find "$ROOT" -type f \( -name '*.a' -o -name '*.o' -o -name '*.elf' -o -name '*.out' \) -print0)

      - name: Inspect exact upgrade.c transition and flash flag layout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,json

          root=Path(Path("/tmp/r117/sdk_root.txt").read_text().strip())
          p=root/"BT_Audio_APP"/"bt_audio_app_src"/"device"/"upgrade.c"
          t=p.read_text(errors="replace")

          # Preserve only relevant transition context.
          keys=[
              "ADR_FLASH_BOOT_FLAGE",
              "typedef struct _ST_FLASH_BOOT_FLAGE",
              "void start_up_grate",
              "AppResourceUsbDevice",
              "jump_fun = (fun)0",
          ]
          contexts={}
          for k in keys:
              i=t.find(k)
              if i>=0:
                  contexts[k]=t[max(0,i-1000):min(len(t),i+5000)]

          Path("/tmp/r117/evidence/R117_UPGRADE_TRANSITION_CONTEXTS.json").write_text(
              json.dumps(contexts,indent=2,ensure_ascii=False)+"\n"
          )

          facts={
              "BOOT_FLAG_ADDRESS_0X4000100C":"0x4000100C" in t,
              "PC_RESOURCE_SETS_PC_FLAG":bool(re.search(r'AppResourceUsbDevice[\s\S]{0,800}\.PC\s*=\s*1',t)),
              "PC_RESOURCE_SETS_UPDATE_FLAG":bool(re.search(r'AppResourceUsbDevice[\s\S]{0,1000}\.updata\s*=\s*1',t)),
              "JUMP_VECTOR_ZERO":bool(re.search(r'jump_fun\s*=\s*\(\s*fun\s*\)\s*0',t)),
              "CALLS_JUMP_FUN":bool(re.search(r'jump_fun\s*\(\s*\)',t)),
          }
          Path("/tmp/r117/evidence/R117_UPGRADE_TRANSITION_FACTS.json").write_text(
              json.dumps(facts,indent=2)+"\n"
          )
          PY

      - name: Build exact bridge decision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          ev=Path("/tmp/r117/evidence")
          fn=json.loads((ev/"R117_EXACT_FUNCTION_FACTS.json").read_text())
          refs=json.loads((ev/"R117_START_UP_GRATE_REFERENCES.json").read_text())
          aa=json.loads((ev/"R117_AA55_USB_HID_CANDIDATES.json").read_text())
          up=json.loads((ev/"R117_UPGRADE_TRANSITION_FACTS.json").read_text())
          sym=(ev/"R117_ARCHIVE_SYMBOL_HITS.txt").read_text(errors="replace")
          bstr=(ev/"R117_BINARY_STRING_HITS.txt").read_text(errors="replace")

          nondef_calls=[
              r for r in refs
              if r.get("calllike") and not r.get("definition")
          ]

          d={
              "SDK_COMMIT":"8105bd864b04995d81c9f9ae77cb158259f39015",
              "REFERENCE_0X11_HANDLER_SOURCE_RECOVERED":fn["COMMUNICATION_EFFECT_0X11_FOUND"],
              "REFERENCE_0X11_HAS_VERSION_RESPONSE":fn["0X11_VERSION_RESPONSE_CONTROL_0X11"],
              "REFERENCE_0X11_WRITE_BRANCH_CALLS_MV_USER_WRITE_DATA":fn["0X11_CALLS_MV_USER_WRITE_DATA"],
              "REFERENCE_MV_USER_WRITE_DATA_WRITES_FLASH":fn["MV_USER_WRITE_DATA_CALLS_SPIFLASHWRITE"],
              "REFERENCE_0X11_CALLS_BOOTSTRAP":fn["0X11_DIRECTLY_CALLS_START_UP_GRATE"],
              "REFERENCE_0X11_TOUCHES_BOOT_FLAG":fn["0X11_DIRECTLY_REFERENCES_FLASH_BOOT_FLAG"],
              "REFERENCE_0X11_CLASSIFICATION":"PCTOOLS_VERSION_QUERY_PLUS_CUSTOM_FLASH_DATA_WRITE; NOT THE start_up_grate BRIDGE",
              "REFERENCE_START_UP_GRATE_SETS_PC_UPDATE_FLAGS":up["PC_RESOURCE_SETS_PC_FLAG"] and up["PC_RESOURCE_SETS_UPDATE_FLAG"],
              "REFERENCE_START_UP_GRATE_JUMPS_VECTOR_ZERO":up["JUMP_VECTOR_ZERO"] and up["CALLS_JUMP_FUN"],
              "START_UP_GRATE_SOURCE_CALL_SITES":nondef_calls,
              "START_UP_GRATE_NONDEFINITION_CALL_COUNT":len(nondef_calls),
              "AA55_USB_HID_SOURCE_CANDIDATE_FILE_COUNT":len(aa),
              "PRECOMPILED_ARCHIVE_HAS_START_UP_GRATE_REFERENCE":"start_up_grate" in sym,
              "PRECOMPILED_ARCHIVE_HAS_USBLOADAUDIOMODE_REFERENCE":"UsbLoadAudioMode" in sym or "UsbLoadAudioMode" in bstr,
              "KEY_CLOSURE":[
                  "Reference SDK 0x11 is not the flashboot transition. Its write form writes user flash data through MV_UserWriteData/SpiFlashWrite, while its query form returns version data.",
                  "The actual reference bootstrap primitive is start_up_grate(AppResourceUsbDevice): set PC+updata flags at the boot-flag register, tear down runtime state, then jump to address 0.",
                  "The unresolved item is therefore the caller/trigger that invokes start_up_grate(AppResourceUsbDevice), not the 0x11 command itself.",
                  "No result here authorizes sending 0x11, AA55, or flashboot commands to the production GoloPine board."
              ],
              "PRODUCTION_CALLER_MATCH_PROVEN":False,
              "PRODUCTION_FIRST_BOOTSTRAP_PROVEN":False,
              "PRODUCTION_RECOVERY_USB_IDENTITY_PROVEN":False,
              "SAFE_READ_ONLY_STOCK_BACKUP_PROVEN":False,
              "NEXT":(
                  "If a source or archive call-site to start_up_grate(AppResourceUsbDevice) is found in this artifact, reverse only that exact trigger offline and compare it with the production IF4 Feature-report evidence. "
                  "If no call-site is present, the bridge is hidden in omitted/precompiled USB code or a different production firmware branch; do not guess live bytes."
              ),
              "FLASH_ALLOWED":False
          }

          (ev/"R117_DECISION.json").write_text(
              json.dumps(d,indent=2,ensure_ascii=False)+"\n"
          )

          report=[
              "# R117 BP1048 exact bootstrap bridge static reverse",
              "",
              "## Main closure",
              "",
              "- 0x11 is no longer a bootstrap candidate in the reference SDK.",
              "- Its write branch reaches flash writes; its query branch returns version information.",
              "- start_up_grate(AppResourceUsbDevice) is the actual reference transition primitive and jumps to vector 0 after setting PC/update boot flags.",
              "- The remaining unknown is the exact USB/HID trigger/caller that reaches that function.",
              "",
              "No live command is authorized.",
              "",
              "FLASH_ALLOWED=NO"
          ]
          (ev/"R117_REPORT_TH.md").write_text("\n".join(report)+"\n")
          print(json.dumps(d,indent=2,ensure_ascii=False))
          PY

      - name: Package evidence only
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r117/evidence
          zip -9 -r /tmp/R117_BP1048_SDK_BOOTSTRAP_BRIDGE_STATIC_EVIDENCE.zip .
          sha256sum /tmp/R117_BP1048_SDK_BOOTSTRAP_BRIDGE_STATIC_EVIDENCE.zip \
            > /tmp/R117_BP1048_SDK_BOOTSTRAP_BRIDGE_STATIC_EVIDENCE.zip.sha256

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: R117-BP1048-SDK-BOOTSTRAP-BRIDGE-STATIC-EVIDENCE
          path: |
            /tmp/R117_BP1048_SDK_BOOTSTRAP_BRIDGE_STATIC_EVIDENCE.zip
            /tmp/R117_BP1048_SDK_BOOTSTRAP_BRIDGE_STATIC_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'R117_USB_DEVICE_ACCESS=NO' /tmp/r117/evidence/R117_SAFETY.txt
          grep -F 'R117_RUNTIME_0X11_SENT=NO' /tmp/r117/evidence/R117_SAFETY.txt
          grep -F 'R117_AA55_SENT=NO' /tmp/r117/evidence/R117_SAFETY.txt
          grep -F '"REFERENCE_0X11_CLASSIFICATION": "PCTOOLS_VERSION_QUERY_PLUS_CUSTOM_FLASH_DATA_WRITE; NOT THE start_up_grate BRIDGE"' /tmp/r117/evidence/R117_DECISION.json
          grep -F '"FLASH_ALLOWED": false' /tmp/r117/evidence/R117_DECISION.json
          echo R117_STATIC_REVERSE_COMPLETE=YES
          echo FLASH_ALLOWED=NO
