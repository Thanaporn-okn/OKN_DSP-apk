name: OKN DSP Studio 16.3 - Real-time crossover (LIVE LPF/HPF/Phase)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/OKN_DSP_STUDIO_16_3.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build OKN DSP Studio 16.3
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 35 non-interactively
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Generate OKN DSP Studio project
        run: |
          set -euo pipefail
          rm -rf app Sources build.gradle settings.gradle gradle.properties payload.tar.gz payload.tar.gz.b64
