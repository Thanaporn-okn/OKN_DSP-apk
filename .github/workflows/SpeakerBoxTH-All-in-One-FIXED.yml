          SPEAKERBOX_PAYLOAD
          base64 --decode /tmp/speakerbox-project.b64 > /tmp/speakerbox-project.tar.gz
          tar -xzf /tmp/speakerbox-project.tar.gz -C "$GITHUB_WORKSPACE"
          rm -f /tmp/speakerbox-project.b64 /tmp/speakerbox-project.tar.gz

          echo "Generated Android source files:"
          find app/src -type f | sort


      - name: Verify generated project
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/okn/speakerbox/MainActivity.kt
          test -f app/src/main/assets/drivers.json
          python3 -m json.tool app/src/main/assets/drivers.json >/dev/null
          echo "SpeakerBox TH source verification passed."


      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Run unit tests
        shell: bash
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Copy APK with friendly name
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SpeakerBoxTH-v4-debug.apk
          sha256sum dist/SpeakerBoxTH-v4-debug.apk | tee dist/SpeakerBoxTH-v4-debug.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: SpeakerBoxTH-v4-debug-apk
          path: |
            dist/SpeakerBoxTH-v4-debug.apk
            dist/SpeakerBoxTH-v4-debug.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports if build fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: SpeakerBoxTH-v4-test-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
