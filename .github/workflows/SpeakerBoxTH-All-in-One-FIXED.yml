name: SpeakerBox TH - All in One Build

# FIXED: Restore/Verify source before setup-gradle; upload-artifact upgraded to v7
# ไฟล์เดียวจบ: Workflow นี้มี Source Android v4 ฝังอยู่ภายใน
# วิธีใช้: บันทึกไฟล์นี้เป็น .github/workflows/speakerbox-th-all-in-one.yml แล้ว Run workflow

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: speakerbox-th-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Generate source, test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Restore SpeakerBox TH source embedded in this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app
          rm -f settings.gradle.kts build.gradle.kts gradle.properties
