name: R149 N9 pre-decrypt runtime patch destination static audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R149_N9_PREDECRYPT_RUNTIME_PATCH_DESTINATION_STATIC_AUDIT.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r149-n9-predecrypt-patch-destination-static-${{ github.ref }}
  cancel-in-progress: true

env:
  FLASH_ALLOWED: "NO"
  R148_RUN_ID: "36015008369"
  R148_JOB_ID: "107685155723"
  R148_ARTIFACT_ID: "10813748285"
  R148_ARTIFACT_NAME: "R148-N9-DOTNET-CRYPTO-SEMANTICS-CONTRADICTION-STATIC-EVIDENCE"
  R148_ARTIFACT_DIGEST: "sha256:e4e8756b389d4f55183be19052cb9c6c69f5220f103d6576867cbfc2fff59133"
  H15_RESOURCE_NAME: "h15IL2i6yy2BZV8RqM.YuRwd1JALC4oy32W66"

jobs:
  static_audit:
    name: STATIC ONLY - pre-decrypt patch destination correlation - no execution - no USB - no board
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r149/r148 /tmp/r149/evidence
          cat > /tmp/r149/evidence/R149_SAFETY.txt <<'EOF'
          R149_MODE=OFFLINE_STATIC_PREDECRYPT_RUNTIME_PATCH_DESTINATION_AUDIT_ONLY
          R149_VENDOR_BINARY_EXECUTED=NO
          R149_WINDOWS_EXE_EXECUTED=NO
          R149_DLL_EXECUTED=NO
          R149_APK_EXECUTED=NO
          R149_USB_DEVICE_ACCESS=NO
          R149_BOARD_CONTACT=NO
          R149_AA55_SENT=NO
          R149_LINEIN_AA55_SENT=NO
          R149_RUNTIME_0X11_SENT=NO
          R149_RUNTIME_0XFE_SENT=NO
          R149_FLASHBOOT_COMMAND_SENT=NO
          R149_FLASH_READ_EXECUTED=NO
          R149_FLASH_ERASE_EXECUTED=NO
          R149_FLASH_WRITE_EXECUTED=NO
          R149_OFFLINE_DECRYPT_EXECUTED=NO
          R149_ONE_BYTE_REPAIR_GUESS_ALLOWED=NO
          R149_ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD=NO
          HARDWARE_MODIFICATION=FORBIDDEN
          FLASH_ALLOWED=NO
          EOF

      - name: Download pinned R148 evidence
        uses: actions/download-artifact@v4
        with:
          name: R148-N9-DOTNET-CRYPTO-SEMANTICS-CONTRADICTION-STATIC-EVIDENCE
          path: /tmp/r149/r148
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 36015008369

      - name: Verify and extract pinned R148 evidence
        shell: bash
        run: |
          set -euo pipefail
          OUTER="$(find /tmp/r149/r148 -maxdepth 2 -type f -name 'R148_N9_DOTNET_CRYPTO_SEMANTICS_CONTRADICTION_STATIC_EVIDENCE.zip' -print -quit)"
          SUM="$(find /tmp/r149/r148 -maxdepth 2 -type f -name 'R148_N9_DOTNET_CRYPTO_SEMANTICS_CONTRADICTION_STATIC_EVIDENCE.zip.sha256' -print -quit)"
          test -n "$OUTER"
          test -n "$SUM"
          EXPECTED="$(awk '{print $1}' "$SUM")"
          ACTUAL="$(sha256sum "$OUTER" | awk '{print $1}')"
          test "$EXPECTED" = "$ACTUAL"
          cp "$OUTER" /tmp/r149/evidence/R148_INNER.zip
          cp "$SUM" /tmp/r149/evidence/R148_INNER.zip.sha256.source
          printf '%s  %s\n' "$ACTUAL" R148_INNER.zip > /tmp/r149/evidence/R149_R148_INNER_ZIP.sha256
          unzip -q "$OUTER" -d /tmp/r149/evidence/r148

          test -s /tmp/r149/evidence/r148/R148_DECISION.json
          test -s /tmp/r149/evidence/r148/R148_FINALBLOCK_CONTRADICTION.json
          test -s /tmp/r149/evidence/r148/r147/r146/r145/r144/R144_PE32_CONCRETE_KEYIV_PATH.json
          test -s /tmp/r149/evidence/r148/r147/r146/r145/r144/r143/R143_N9_METHOD.il
          test -s /tmp/r149/evidence/r148/r147/r146/r145/r144/r143/r142/R142_PROXY_TOKEN_RESOLUTION.json
          test -s /tmp/r149/evidence/r148/r147/r146/r145/r144/r143/r142/r141/R141_FIXED_METHOD_TABLE.txt
          test -s /tmp/r149/evidence/r148/r147/r146/r145/r144/r143/r142/r141/r140/R140_FIXED_FULL.il
          test -s /tmp/r149/evidence/r148/r147/r146/r145/r144/r143/r142/R142_EXTRACTED_MANAGED_RESOURCES/02_h15IL2i6yy2BZV8RqM.YuRwd1JALC4oy32W66.bin

          grep -F '"STATIC_SEMANTICS_CONTRADICTION_CONFIRMED": true' /tmp/r149/evidence/r148/R148_DECISION.json
          grep -F '"CRYPTOSTREAM_WRITE_LENGTH": 607967' /tmp/r149/evidence/r148/R148_DECISION.json
          grep -F '"OFFLINE_DECRYPT_AUTHORIZED": false' /tmp/r149/evidence/r148/R148_DECISION.json
          grep -F '"H15_PLAINTEXT_RECOVERED": false' /tmp/r149/evidence/r148/R148_DECISION.json
          grep -F '"FLASH_ALLOWED": false' /tmp/r149/evidence/r148/R148_DECISION.json

      - name: Map exact MethodDef tokens RVAs and known replacement surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re,hashlib

          ev=Path('/tmp/r149/evidence')
          root=ev/'r148/r147/r146/r145/r144/r143/r142'
          full=(root/'r141/r140/R140_FIXED_FULL.il').read_text(errors='replace')
          method_table=(root/'r141/R141_FIXED_METHOD_TABLE.txt').read_text(errors='replace')
          proxy=json.loads((root/'R142_PROXY_TOKEN_RESOLUTION.json').read_text())
          h15=(root/'R142_EXTRACTED_MANAGED_RESOURCES/02_h15IL2i6yy2BZV8RqM.YuRwd1JALC4oy32W66.bin').read_bytes()

          targets=[
            'N9jju8llVi',
            'gH6uphNOsYQyRXDZmHu','sWg0PuN2fLSfxi2LB0D','qfkv4ZNDynVciIciQy6',
            't2QjAoPE2q','trEuKPNkgB3p5fLuROn','Q2CVcdNXO7dpP5ufbGy',
            'VnHlfpNorSGR6U9GUOp','RMHoOvNN1BGBrZfKGy1','it3eekNKjtbEQVI5up2','HVJrNANRJZcM7WNOuLw',
            'k1AjZJVRlM','bf6jCcnr8J','nEgLdGKpl9ybhlqqVWH',
            'BVUDNWKaRepeWLIgaBG','mPc1IeK1xtUZnJaFY6v','sr6wPbKWSDX3hWy8TAY',
            'Bjp8CNKZDSll9YMJaBT','l5ZnY5KdvdQ3hp82Mw5','smTOlANPCcfAgZC8AQ4'
          ]

          proxy_targets={x.get('target_token') for x in proxy.get('resolved_proxy_pairs',[])}

          def method_body(name):
              marker=f'}} // end of method q71r2Rj8SiD9GF1BI50::{name}'
              end=full.find(marker)
              if end < 0:
                  return ''
              start=max(full.rfind('\n\t.method ',0,end),full.rfind('\n\t\t.method ',0,end))
              return full[start:end+len(marker)] if start >= 0 else ''

          rows={}
          for name in targets:
              rid=None
              for line in method_table.splitlines():
                  if re.search(r'\b'+re.escape(name)+r'\b',line):
                      m=re.match(r'\s*(\d+):',line)
                      if m:
                          rid=int(m.group(1)); break
              if rid is None:
                  raise SystemExit(f'method row not found: {name}')
              token=0x06000000+rid
              body=method_body(name)
              if not body:
                  raise SystemExit(f'method body not found: {name}')
              mrva=re.search(r'Method begins at RVA 0x([0-9a-fA-F]+)',body)
              msize=re.search(r'Code size: (\d+) \(0x([0-9a-fA-F]+)\)',body)
              if not mrva or not msize:
                  raise SystemExit(f'RVA/code size not found: {name}')
              tok=f'0x{token:08X}'
              rows[name]={
                'methoddef_rid':rid,
                'methoddef_token':tok,
                'rva':int(mrva.group(1),16),
                'rva_hex':'0x'+mrva.group(1).upper(),
                'code_size':int(msize.group(1)),
                'proxy_token_map_target':tok in proxy_targets,
                'pst_initializer_for_same_method_token':f".cctor$PST{token:08X}" in full,
                'ldftn_reference_count':len(re.findall(r'ldftn[^\n]*::'+re.escape(name)+r'\(',full)),
                'ldtoken_method_reference_count':len(re.findall(r'ldtoken[^\n]*::'+re.escape(name)+r'\b',full)),
              }

          out={
            'h15_length':len(h15),
            'h15_sha256':hashlib.sha256(h15).hexdigest(),
            'target_method_count':len(rows),
            'methods':rows,
            'crypto_path_methods_in_proxy_token_map':[n for n in targets[:11] if rows[n]['proxy_token_map_target']],
            'crypto_path_methods_have_same_token_PST_initializer':[n for n in targets[:11] if rows[n]['pst_initializer_for_same_method_token']],
            'interpretation':(
              'MethodDef token/RVA mapping is static metadata evidence only. Absence from the proxy map or PST token names '
              'does not by itself prove that native runtime patching cannot target a method.'),
          }
          (ev/'R149_METHODDEF_RVA_PATCH_SURFACE_MAP.json').write_text(json.dumps(out,indent=2)+'\n')
          if len(h15)!=607967:
              raise SystemExit('h15 length changed')
          PY

      - name: Correlate the proven first CreateDecryptor path with patch primitives
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          ev=Path('/tmp/r149/evidence')
          base=ev/'r148/r147/r146/r145/r144'
          n9=(base/'r143/R143_N9_METHOD.il').read_text(errors='replace')
          full=(base/'r143/r142/r141/r140/R140_FIXED_FULL.il').read_text(errors='replace')
          r144=json.loads((base/'R144_PE32_CONCRETE_KEYIV_PATH.json').read_text())
          r148=json.loads((ev/'r148/R148_DECISION.json').read_text())

          sm=re.search(r'IL_0012:\s*switch \(([^)]*)\)',n9)
          if not sm:
              raise SystemExit('N9 state switch not found')
          state_labels=[x.strip() for x in sm.group(1).split(',')]
          label_offsets={x:int(x.split('_')[1],16) for x in state_labels}
          label_positions={}
          for lab in state_labels:
              mm=re.search(r'(?m)^\s*'+re.escape(lab)+r':',n9)
              if not mm:
                  raise SystemExit(f'state label missing: {lab}')
              label_positions[lab]=mm.start()
          ordered=sorted(state_labels,key=lambda x:label_offsets[x])
          segments={}
          for i,lab in enumerate(ordered):
              st=label_positions[lab]
              en=label_positions[ordered[i+1]] if i+1<len(ordered) else len(n9)
              segments[lab]=n9[st:en]

          primitive_patterns={
            'patch_map_field_XdYe0BEvZM':'XdYe0BEvZM',
            'patch_map_add_nEgLdGKpl9ybhlqqVWH':'nEgLdGKpl9ybhlqqVWH',
            'WriteProcessMemory_wrapper_bf6jCcnr8J':'bf6jCcnr8J',
            'VirtualProtect_hook_k1AjZJVRlM':'k1AjZJVRlM',
            'PrepareDelegate_wrapper_BVUDNWKaRepeWLIgaBG':'BVUDNWKaRepeWLIgaBG',
            'PrepareMethod_wrapper_l5ZnY5KdvdQ3hp82Mw5':'l5ZnY5KdvdQ3hp82Mw5',
            'native_delegate_PkhePv6ogG':'PkhePv6ogG',
            'native_delegate_zXNeHItKH9':'zXNeHItKH9',
            'Marshal_Write':'System.Runtime.InteropServices.Marshal::Write',
          }

          path_labels=r144['path_labels']
          path_states=r144['path_states']
          if len(path_labels)!=len(path_states) or path_states[-1]!=402:
              raise SystemExit('R144 path shape changed')

          hits=[]
          for step,(state,lab) in enumerate(zip(path_states,path_labels)):
              seg=segments[lab]
              for kind,pat in primitive_patterns.items():
                  if pat in seg:
                      lines=[x.strip() for x in seg.splitlines() if pat in x]
                      hits.append({'step':step,'state':state,'label':lab,'kind':kind,'lines':lines[:8]})

          pst_blocks=re.findall(
            r"\.method specialname rtspecialname static privatescope\s+void '\.cctor\$PST[0-9A-F]+' \(\) cil managed noinlining\s*\{.*?\}\s*// end of method .*?::\.cctor",
            full,re.S)
          pst_n9_first=sum('IL_0000: call void Q9Wet0jLP4YxXSyJBiC.q71r2Rj8SiD9GF1BI50::N9jju8llVi()' in b for b in pst_blocks)

          # Exact static patch machinery facts. These are structural facts, not execution.
          facts={
            'k1_hook_reads_candidate_native_pointer': all(x in full for x in [
              'k1AjZJVRlM',
              'Marshal::ReadInt32(native int, int32)',
              'Marshal::ReadInt64(native int, int32)',
              'Hashtable::get_Item(object)']),
            'k1_hook_can_replace_pointer_and_length': all(x in full for x in [
              'Marshal::WriteIntPtr(native int, int32, native int)',
              'Marshal::WriteInt32(native int, int32, int32)']),
            'n9_patch_map_add_uses_base_plus_decoded_offset': all(x in n9 for x in [
              'IL_623a: ldsfld object Q9Wet0jLP4YxXSyJBiC.q71r2Rj8SiD9GF1BI50::XdYe0BEvZM',
              'IL_623f: ldloc.s 68',
              'IL_6241: ldloc.s 109',
              'IL_6244: add',
              'IL_6251: call void Q9Wet0jLP4YxXSyJBiC.q71r2Rj8SiD9GF1BI50::nEgLdGKpl9ybhlqqVWH(object, object, object)']),
            'local68_is_process_module_base_int64': all(x in n9 for x in [
              'IL_2445: ldloca.s 23',
              'IL_2447: call instance int64 [mscorlib]System.IntPtr::ToInt64()',
              'IL_244c: stloc.s 68']),
            'base_address_wrapper_exact': 'ProcessModule::get_BaseAddress()' in full,
            'local109_depends_on_reader_ReadInt32_minus_local99': all(x in n9 for x in [
              'IL_3b84: ldloc.s 114',
              'IL_3b86: call int32 Q9Wet0jLP4YxXSyJBiC.q71r2Rj8SiD9GF1BI50::qfkv4ZNDynVciIciQy6(object)',
              'IL_3b8b: ldloc.s 99',
              'IL_3b8d: sub',
              'IL_3b8e: stloc.s 109']),
          }

          out={
            'r144_path_state_count_to_first_CreateDecryptor':len(path_states),
            'r144_path_final_state':path_states[-1],
            'pre_CreateDecryptor_known_patch_primitive_hits':hits,
            'pre_CreateDecryptor_known_patch_primitive_hit_count':len(hits),
            'NO_KNOWN_PATCH_PRIMITIVE_ON_PROVEN_FIRST_CREATEDECRYPTOR_PATH':len(hits)==0,
            'pst_initializer_count':len(pst_blocks),
            'pst_initializers_call_N9_at_IL_0000_count':pst_n9_first,
            'ALL_PST_INITIALIZERS_CALL_N9_FIRST':len(pst_blocks)==619 and pst_n9_first==619,
            'patch_mechanism_facts':facts,
            'all_patch_mechanism_facts':all(facts.values()),
            'r148_semantics_contradiction_still_pinned':r148.get('STATIC_SEMANTICS_CONTRADICTION_CONFIRMED') is True,
            'interpretation':(
              'Along the already-proven 473-state PE32 path to the first CreateDecryptor call, none of the known N9 patch-map, '
              'WriteProcessMemory, PrepareMethod/PrepareDelegate, or native-hook primitives is reached. All 619 PST initializers '
              'invoke N9 as their first IL call. Therefore the visible known N9/PST mechanism does not statically establish a '
              'pre-decrypt replacement of the crypto helpers. This does not exclude an unmodeled mechanism outside the proven path.'),
          }
          (ev/'R149_PREDECRYPT_PATCH_PATH_CORRELATION.json').write_text(json.dumps(out,indent=2)+'\n')
          if not out['NO_KNOWN_PATCH_PRIMITIVE_ON_PROVEN_FIRST_CREATEDECRYPTOR_PATH']:
              raise SystemExit('known patch primitive unexpectedly appears on pre-decrypt path')
          if not out['ALL_PST_INITIALIZERS_CALL_N9_FIRST']:
              raise SystemExit('PST/N9 first-call invariant not proven')
          if not out['all_patch_mechanism_facts']:
              raise SystemExit('patch mechanism structural proof incomplete')
          PY

      - name: Build fail-closed R149 decision and report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          ev=Path('/tmp/r149/evidence')
          m=json.loads((ev/'R149_METHODDEF_RVA_PATCH_SURFACE_MAP.json').read_text())
          p=json.loads((ev/'R149_PREDECRYPT_PATCH_PATH_CORRELATION.json').read_text())
          r148=json.loads((ev/'r148/R148_DECISION.json').read_text())

          crypto_names=[
            'N9jju8llVi','gH6uphNOsYQyRXDZmHu','sWg0PuN2fLSfxi2LB0D','qfkv4ZNDynVciIciQy6',
            't2QjAoPE2q','trEuKPNkgB3p5fLuROn','Q2CVcdNXO7dpP5ufbGy','VnHlfpNorSGR6U9GUOp',
            'RMHoOvNN1BGBrZfKGy1','it3eekNKjtbEQVI5up2','HVJrNANRJZcM7WNOuLw']
          proxy_hits=m['crypto_path_methods_in_proxy_token_map']
          pst_hits=m['crypto_path_methods_have_same_token_PST_initializer']

          known_predecrypt_replacement_proven=(
            (not p['NO_KNOWN_PATCH_PRIMITIVE_ON_PROVEN_FIRST_CREATEDECRYPTOR_PATH']) or
            bool(proxy_hits) or bool(pst_hits))

          decision={
            'R148_RUN_ID':36015008369,
            'R148_JOB_ID':107685155723,
            'R148_ARTIFACT_ID':10813748285,
            'R148_ARTIFACT_DIGEST':'sha256:e4e8756b389d4f55183be19052cb9c6c69f5220f103d6576867cbfc2fff59133',
            'H15_LENGTH':m['h15_length'],
            'H15_SHA256':m['h15_sha256'],
            'R148_STATIC_SEMANTICS_CONTRADICTION_CONFIRMED':r148['STATIC_SEMANTICS_CONTRADICTION_CONFIRMED'],
            'TARGET_METHOD_COUNT':m['target_method_count'],
            'CRYPTO_PATH_METHOD_COUNT':len(crypto_names),
            'CRYPTO_PATH_METHODS_IN_PROXY_TOKEN_MAP':proxy_hits,
            'CRYPTO_PATH_METHODS_WITH_SAME_TOKEN_PST_INITIALIZER':pst_hits,
            'PRE_CREATEDECRYPTOR_KNOWN_PATCH_PRIMITIVE_HIT_COUNT':p['pre_CreateDecryptor_known_patch_primitive_hit_count'],
            'NO_KNOWN_PATCH_PRIMITIVE_ON_PROVEN_FIRST_CREATEDECRYPTOR_PATH':p['NO_KNOWN_PATCH_PRIMITIVE_ON_PROVEN_FIRST_CREATEDECRYPTOR_PATH'],
            'ALL_619_PST_INITIALIZERS_CALL_N9_FIRST':p['ALL_PST_INITIALIZERS_CALL_N9_FIRST'],
            'VISIBLE_KNOWN_PREDECRYPT_CRYPTO_HELPER_REPLACEMENT_PROVEN':known_predecrypt_replacement_proven,
            'RUNTIME_PATCH_DESTINATION_HYPOTHESIS_RESOLVES_15_BYTE_REMAINDER':False,
            'ONE_BYTE_REPAIR_GUESS_ALLOWED':False,
            'OFFLINE_DECRYPT_AUTHORIZED':False,
            'H15_PLAINTEXT_RECOVERED':False,
            'ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD':False,
            'AA55_LIVE_RETEST_ALLOWED':False,
            'RUNTIME_0X11_ALLOWED':False,
            'RUNTIME_0XFE_ALLOWED':False,
            'FLASH_ALLOWED':False,
            'NEXT':(
              'The known N9/PST/proxy runtime-patch mechanisms do not explain the first-decrypt 15-byte remainder on the proven path. '
              'Next perform a first-call-only static audit of the resource stream and BinaryReader construction, including exact CLR '
              'manifest-resource length semantics, custom reader constructor/seek behavior, every operation on local12 before '
              'CryptoStream.Write, and any outer exception/control-flow edge around state 281. Preserve h15 at exactly 607967 bytes; '
              'do not add/remove a byte and do not decrypt until a statically proven framing/flow explanation exists.'),
          }
          (ev/'R149_DECISION.json').write_text(json.dumps(decision,indent=2)+'\n')
          (ev/'R149_REPORT_TH.md').write_text(
            '# R149 pre-decrypt runtime patch destination static audit\n\n'
            f'- R148 semantics contradiction remains confirmed: {decision["R148_STATIC_SEMANTICS_CONTRADICTION_CONFIRMED"]}\n'
            f'- known patch primitives on proven 473-state path before first CreateDecryptor: {decision["PRE_CREATEDECRYPTOR_KNOWN_PATCH_PRIMITIVE_HIT_COUNT"]}\n'
            f'- all 619 PST initializers call N9 first: {decision["ALL_619_PST_INITIALIZERS_CALL_N9_FIRST"]}\n'
            f'- crypto-path methods present as proxy-token targets: {decision["CRYPTO_PATH_METHODS_IN_PROXY_TOKEN_MAP"]}\n'
            f'- crypto-path methods with same-token PST initializer: {decision["CRYPTO_PATH_METHODS_WITH_SAME_TOKEN_PST_INITIALIZER"]}\n'
            f'- visible known pre-decrypt crypto-helper replacement proven: {decision["VISIBLE_KNOWN_PREDECRYPT_CRYPTO_HELPER_REPLACEMENT_PROVEN"]}\n'
            '- runtime-patch hypothesis resolves the 15-byte remainder: False\n'
            '- offline decrypt authorized: False\n'
            '- h15 plaintext recovered: False\n\n'
            f'NEXT: {decision["NEXT"]}\n\n'
            'FLASH_ALLOWED=NO\n')
          print(json.dumps(decision,indent=2))
          PY

      - name: Package R149 evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r149/evidence
          zip -9 -r /tmp/R149_N9_PREDECRYPT_RUNTIME_PATCH_DESTINATION_STATIC_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/R149_N9_PREDECRYPT_RUNTIME_PATCH_DESTINATION_STATIC_EVIDENCE.zip \
            > /tmp/R149_N9_PREDECRYPT_RUNTIME_PATCH_DESTINATION_STATIC_EVIDENCE.zip.sha256

      - name: Upload R149 evidence
        uses: actions/upload-artifact@v4
        with:
          name: R149-N9-PREDECRYPT-RUNTIME-PATCH-DESTINATION-STATIC-EVIDENCE
          path: |
            /tmp/R149_N9_PREDECRYPT_RUNTIME_PATCH_DESTINATION_STATIC_EVIDENCE.zip
            /tmp/R149_N9_PREDECRYPT_RUNTIME_PATCH_DESTINATION_STATIC_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'R149_VENDOR_BINARY_EXECUTED=NO' /tmp/r149/evidence/R149_SAFETY.txt
          grep -F 'R149_USB_DEVICE_ACCESS=NO' /tmp/r149/evidence/R149_SAFETY.txt
          grep -F 'R149_BOARD_CONTACT=NO' /tmp/r149/evidence/R149_SAFETY.txt
          grep -F 'R149_AA55_SENT=NO' /tmp/r149/evidence/R149_SAFETY.txt
          grep -F 'R149_RUNTIME_0X11_SENT=NO' /tmp/r149/evidence/R149_SAFETY.txt
          grep -F 'R149_RUNTIME_0XFE_SENT=NO' /tmp/r149/evidence/R149_SAFETY.txt
          grep -F 'R149_OFFLINE_DECRYPT_EXECUTED=NO' /tmp/r149/evidence/R149_SAFETY.txt
