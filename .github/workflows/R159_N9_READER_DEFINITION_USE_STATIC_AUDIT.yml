name: R159 N9 reader definition use static audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R159_N9_READER_DEFINITION_USE_STATIC_AUDIT.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: r159-static-${{ github.ref }}
  cancel-in-progress: true
env:
  FLASH_ALLOWED: "NO"
jobs:
  static_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          mkdir -p /tmp/r159/evidence
          cat > /tmp/r159/evidence/R159_SAFETY.txt <<'EOF'
          MODE=OFFLINE_STATIC_IL_TEXT_ONLY
          FLASH_ALLOWED=NO
          USB_OR_BOARD_CONTACT=NO
          VENDOR_EXE_DLL_APK_EXECUTED=NO
          OFFLINE_DECRYPT_EXECUTED=NO
          AA55_OR_LINEIN_AA55_SENT=NO
          RUNTIME_0X11_OR_0XFE_SENT=NO
          FLASH_READ_ERASE_WRITE_EXECUTED=NO
          ONE_BYTE_REPAIR_GUESS_ALLOWED=NO
          DISCOVERED_FRAME_LIVE_AUTHORIZED=NO
          HARDWARE_MODIFICATION=FORBIDDEN
          EOF
      - name: Download pinned R158 result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10826767839'
          path: /tmp/r159/r158
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 36040669786
      - name: Download pinned R157 raw evidence chain
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10820682068'
          path: /tmp/r159/r157
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 36028455796
      - name: Audit all reader and status definitions without execution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib, json, re

          def audit(n9_bytes, full_bytes, decision, out):
              n9 = n9_bytes.decode('utf-8', 'strict')
              full = full_bytes.decode('utf-8', 'strict')
              assert decision['UNACCOUNTED_CONDITIONAL_COUNT_AFTER_R158'] == 3
              assert decision['FLASH_ALLOWED'] is False
              assert decision['OFFLINE_DECRYPT_AUTHORIZED'] is False
              instructions = []
              for line in n9.splitlines():
                  m = re.match(r'\s*(IL_[0-9a-f]+):\s+(\S+)(?:\s+(.*))?$', line)
                  if m:
                      instructions.append((m[1], m[2], (m[3] or '').strip(), line.strip()))
              def stores(local):
                  return [x[0] for x in instructions if x[1] in ('stloc', 'stloc.s') and x[2] == str(local)]
              expected = {114: ['IL_2213', 'IL_51fe'], 28: ['IL_1970', 'IL_6680'], 29: ['IL_6591', 'IL_65fc']}
              for local, labels in expected.items():
                  assert stores(local) == labels, (local, stores(local))
                  assert not any(x[1] in ('ldloca', 'ldloca.s') and x[2] == str(local) for x in instructions), 'address alias needs review'
              def at(label):
                  return next(i for i, x in enumerate(instructions) if x[0] == label)
              def window(label, before=8, after=4):
                  i = at(label)
                  return '\n'.join(x[3] for x in instructions[max(0,i-before):i+after+1])
              checks = {
                  'reader_resource_constructor': 'GetManifestResourceStream' in full and 'gH6uphNOsYQyRXDZmHu' in window('IL_2213') and 'h15IL2i6yy2BZV8RqM.YuRwd1JALC4oy32W66' in window('IL_2213'),
                  'reader_memory_constructor': 'IL_51f2: ldloc.s 29' in window('IL_51fe') and 'System.IO.MemoryStream::.ctor(uint8[])' in window('IL_51fe'),
                  'first_local28_read': 'IL_1969: ldloc.s 114' in window('IL_1970') and 'qfkv4ZNDynVciIciQy6' in window('IL_1970'),
                  'second_local28_read': 'IL_6679: ldloc.s 114' in window('IL_6680') and 'qfkv4ZNDynVciIciQy6' in window('IL_6680'),
                  'local29_copy_source': instructions[at('IL_6591')-1][3] == 'IL_658f: ldloc.s 37',
                  'local29_alternate_source': 'HVJrNANRJZcM7WNOuLw' in window('IL_65fc'),
              }
              assert all(checks.values()), checks
              out.mkdir(parents=True, exist_ok=True)
              # List textual uses; these are not runtime execution order or cursor proofs.
              inventory = {str(local): [window(x[0]) for x in instructions if x[1] in ('ldloc','ldloc.s','stloc','stloc.s') and x[2] == str(local)] for local in expected}
              result = {
                  'revision': 'R159',
                  'R158_RUN_ID': 36040669786, 'R158_JOB_ID': 107771762557,
                  'R158_ARTIFACT_ID': 10826767839,
                  'N9_SHA256': hashlib.sha256(n9_bytes).hexdigest(),
                  'FULL_IL_SHA256': hashlib.sha256(full_bytes).hexdigest(),
                  'EXACT_STORE_SITES': expected, 'STATIC_SOURCE_CHECKS': checks,
                  'LOCAL114_SINGLE_SOURCE_ASSUMPTION_VALID': False,
                  'LOCAL28_SINGLE_STORE_ASSUMPTION_VALID': False,
                  'READER_CURSOR_AT_STATE292_PROVEN': False,
                  'PRODUCTION_ASSEMBLY_LOAD_CONTEXT_PROVEN': False,
                  'UNACCOUNTED_CONDITIONAL_COUNT_AFTER_R159': 3,
                  'remaining_unaccounted_conditionals': decision['remaining_unaccounted_conditionals'],
                  'INDEPENDENT_FULL_PATH_BRANCH_COVERAGE_PROVEN': False,
                  'OFFLINE_DECRYPT_AUTHORIZED': False, 'H15_PLAINTEXT_RECOVERED': False,
                  'ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD': False, 'FLASH_ALLOWED': False,
                  'NEXT': 'Prove which of the two reader definitions and local28 stores reaches state292, including intervening reads and seeks. Text order is not runtime order. Keep states246/605 unresolved until assembly load context is proven.'
              }
              (out/'R159_DECISION.json').write_text(json.dumps(result,indent=2)+'\n')
              (out/'R159_LOCAL_DEFINITION_USE_INVENTORY.json').write_text(json.dumps(inventory,indent=2)+'\n')
              (out/'R159_REPORT_TH.md').write_text('R159: local114 มีจุดกำหนดค่า 2 แห่ง, local28 มี 2 แห่ง และ local29 มี 2 แห่ง\nยังห้ามสมมติว่า reader หรือค่าที่เทียบ 4 มาจากแหล่งเดียว\nรายการนี้เป็น static inventory ไม่ใช่หลักฐานลำดับทำงานจริง\nยังเหลือ 3 เงื่อนไข ไม่ถอดรหัส ไม่ติดต่อบอร์ด FLASH_ALLOWED=NO\n')
              print(json.dumps(result,indent=2))


          import io
          base=Path('/tmp/r159')
          def inner(folder, name, expected):
              data=(base/folder/name).read_bytes()
              assert hashlib.sha256(data).hexdigest()==expected, 'pinned inner digest mismatch'
              assert (base/folder/(name+'.sha256')).read_text().split()[0]==expected
              return zipfile.ZipFile(io.BytesIO(data))
          import zipfile
          prior=inner('r158','R158_N9_ASSEMBLY_LOCATION_AND_READER_STATUS_EVIDENCE.zip','77cd6a1a34357f919e48985e28225c45afac45d98429f25c033606c97a07ae1e')
          decision=json.loads(prior.read('R158_DECISION.json'))
          chain=inner('r157','R157_N9_LOCAL29_LOCAL81_NONNULL_LOCAL93_LOOP_BRANCH_EVIDENCE.zip','f974c64c63eea5f2b940c76101f4ab6e769803f5630a2d87d21d08679c321609')
          prefix='r156/r155/r154/r153/r152/r151/r150/r149/r148/r147/r146/r145/r144/r143/'
          n9=chain.read(prefix+'R143_N9_METHOD.il')
          full=chain.read(prefix+'r142/r141/r140/R140_FIXED_FULL.il')
          assert hashlib.sha256(n9).hexdigest()=='5a3964c1f4bd8db455e6882a4ce6f90667e1a9abc6e1fafd10440b31006e4a33'
          assert hashlib.sha256(full).hexdigest()=='aa1d369c8be7ee8d7b358fc5b0f6b0874f46711a9249fee70f413b900d234c66'
          audit(n9, full, decision, base/'evidence')
          (base/'evidence/R158_DECISION.json').write_bytes(prior.read('R158_DECISION.json'))
          result=json.loads((base/'evidence/R159_DECISION.json').read_text())
          assert result['FLASH_ALLOWED'] is False
          assert result['OFFLINE_DECRYPT_AUTHORIZED'] is False
          assert result['UNACCOUNTED_CONDITIONAL_COUNT_AFTER_R159']==3
          PYCODE
      - name: Package evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r159/evidence
          zip -9 -r /tmp/R159_N9_READER_DEFINITION_USE_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/R159_N9_READER_DEFINITION_USE_EVIDENCE.zip > /tmp/R159_N9_READER_DEFINITION_USE_EVIDENCE.zip.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: R159-N9-READER-DEFINITION-USE-STATIC-EVIDENCE
          path: |
            /tmp/R159_N9_READER_DEFINITION_USE_EVIDENCE.zip
            /tmp/R159_N9_READER_DEFINITION_USE_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90
