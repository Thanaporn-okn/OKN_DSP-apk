name: OKN Facebook Product Tracker APK Builder

"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "Facebook_Product_Tracker_READY*.zip"
      - ".github/workflows/OKN_FPT_AutoBuilder.yml"

permissions:
  contents: read

concurrency:
  group: okn-fpt-apk-builder-${{ github.ref }}
  cancel-in-progress: true

env:
  FALLBACK_GRADLE_VERSION: "8.11.1"

jobs:
  build-apk:
    name: Auto Extract and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Find ZIP, extract, and detect Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          if [[ -f "Facebook_Product_Tracker_READY.zip" ]]; then
            ZIP="$GITHUB_WORKSPACE/Facebook_Product_Tracker_READY.zip"
          else
            ZIP_NAME="$(
              find "$GITHUB_WORKSPACE" -maxdepth 1 -type f \
                -name 'Facebook_Product_Tracker_READY*.zip' \
                -printf '%f\n' \
              | sort -V \
              | tail -n 1
            )"

            if [[ -z "${ZIP_NAME:-}" ]]; then
              echo "::error::No Facebook_Product_Tracker_READY*.zip found in repository root"
              exit 1
            fi
            ZIP="$GITHUB_WORKSPACE/$ZIP_NAME"
          fi

          ZIP_BASE="$(basename "$ZIP")"
          echo "Using source ZIP: $ZIP_BASE"

          BUILD_SRC="$GITHUB_WORKSPACE/buildsrc"
          rm -rf "$BUILD_SRC"
          mkdir -p "$BUILD_SRC"
          unzip -q -o "$ZIP" -d "$BUILD_SRC"

          SETTINGS_FILE="$(
            find "$BUILD_SRC" -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit
          )"

          if [[ -z "${SETTINGS_FILE:-}" ]]; then
            echo "::error::settings.gradle/settings.gradle.kts not found after extracting ZIP"
            find "$BUILD_SRC" -maxdepth 6 -type f | sort | head -300
            exit 1
          fi

          ANDROID_DIR="$(dirname "$SETTINGS_FILE")"

          if [[ -f "$ANDROID_DIR/app/build.gradle" ]]; then
            APP_GRADLE="$ANDROID_DIR/app/build.gradle"
          elif [[ -f "$ANDROID_DIR/app/build.gradle.kts" ]]; then
            APP_GRADLE="$ANDROID_DIR/app/build.gradle.kts"
          else
            echo "::error::app/build.gradle(.kts) not found under $ANDROID_DIR"
            exit 1
          fi

          COMPILE_SDK="$(
            grep -Eo 'compileSdk(Version)?[[:space:]=]+[0-9]+' "$APP_GRADLE" \
              | grep -Eo '[0-9]+' \
              | head -n 1 || true
          )"
          COMPILE_SDK="${COMPILE_SDK:-35}"

          BUILD_TOOLS="$(
            grep -Eo 'buildToolsVersion[[:space:]=]+["'\''`][0-9.]+["'\''`]' "$APP_GRADLE" \
              | grep -Eo '[0-9]+(\.[0-9]+)+' \
              | head -n 1 || true
          )"
          BUILD_TOOLS="${BUILD_TOOLS:-${COMPILE_SDK}.0.0}"

          VERSION_NAME="$(
            grep -Eo 'versionName[[:space:]=]+["'\''`][^"'\''`]+["'\''`]' "$APP_GRADLE" \
              | sed -E 's/.*["'\''`]([^"'\''`]+)["'\''`].*/\1/' \
              | head -n 1 || true
          )"
          VERSION_NAME="${VERSION_NAME:-0.0.${GITHUB_RUN_NUMBER}}"

          if [[ -f "$ANDROID_DIR/gradlew" ]]; then
            HAS_WRAPPER=true
            chmod +x "$ANDROID_DIR/gradlew"
          else
            HAS_WRAPPER=false
          fi

          {
            echo "ANDROID_DIR=$ANDROID_DIR"
            echo "APP_GRADLE=$APP_GRADLE"
            echo "COMPILE_SDK=$COMPILE_SDK"
            echo "BUILD_TOOLS=$BUILD_TOOLS"
            echo "VERSION_NAME=$VERSION_NAME"
            echo "HAS_WRAPPER=$HAS_WRAPPER"
          } >> "$GITHUB_ENV"

          {
            echo "zip_name=$ZIP_BASE"
            echo "android_dir=$ANDROID_DIR"
            echo "compile_sdk=$COMPILE_SDK"
            echo "build_tools=$BUILD_TOOLS"
            echo "version_name=$VERSION_NAME"
            echo "has_wrapper=$HAS_WRAPPER"
          } >> "$GITHUB_OUTPUT"

          echo "Android project : $ANDROID_DIR"
          echo "compileSdk      : $COMPILE_SDK"
          echo "Build Tools     : $BUILD_TOOLS"
          echo "versionName     : $VERSION_NAME"
          echo "Gradle wrapper  : $HAS_WRAPPER"

      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ANDROID_DIR/app/src/main/AndroidManifest.xml"
          echo "AndroidManifest.xml: OK"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK automatically
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: >-
            platform-tools
            platforms;android-${{ steps.project.outputs.compile_sdk }}
            build-tools;${{ steps.project.outputs.build_tools }}

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-$COMPILE_SDK"
          test -d "$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          test -x "$ANDROID_HOME/platform-tools/adb"
          echo "Android SDK packages: OK"

      - name: Set up Gradle from wrapper
        if: steps.project.outputs.has_wrapper == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Set up fallback Gradle
        if: steps.project.outputs.has_wrapper != 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.FALLBACK_GRADLE_VERSION }}
          cache-provider: basic

      - name: Show build environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          echo "ANDROID_DIR=$ANDROID_DIR"
          echo "COMPILE_SDK=$COMPILE_SDK"
          echo "BUILD_TOOLS=$BUILD_TOOLS"
          echo "VERSION_NAME=$VERSION_NAME"

          if [[ "$HAS_WRAPPER" == "true" ]]; then
            "$ANDROID_DIR/gradlew" --version
          else
            gradle --version
          fi

      - name: Build APK automatically
        shell: bash
        env:
          TRACKER_WEB_URL: ${{ vars.TRACKER_WEB_URL }}
        run: |
          set -euo pipefail
          cd "$ANDROID_DIR"

          if [[ "$HAS_WRAPPER" == "true" ]]; then
            ./gradlew \
              --no-daemon \
              --stacktrace \
              :app:assembleDebug \
              -PTRACKER_WEB_URL="${TRACKER_WEB_URL:-}"
          else
            gradle \
              --no-daemon \
              --stacktrace \
              :app:assembleDebug \
              -PTRACKER_WEB_URL="${TRACKER_WEB_URL:-}"
          fi

      - name: Find, rename, and checksum APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find "$ANDROID_DIR/app/build/outputs/apk" \
              -type f -name '*.apk' \
              ! -name '*unaligned*' \
              | sort \
              | head -n 1
          )"

          if [[ -z "${APK:-}" || ! -f "$APK" ]]; then
            echo "::error::No APK found after build"
            find "$ANDROID_DIR/app/build/outputs" -type f 2>/dev/null | sort || true
            exit 1
          fi

          SAFE_VERSION="$(printf '%s' "$VERSION_NAME" | tr -cs 'A-Za-z0-9._-' '-')"
          DIST="$GITHUB_WORKSPACE/dist"
          mkdir -p "$DIST"

          OUT="$DIST/FacebookProductTracker-v${SAFE_VERSION}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"

          APK_NAME="$(basename "$OUT")"
          APK_SIZE="$(du -h "$OUT" | awk '{print $1}')"
          APK_SHA="$(cut -d' ' -f1 "$OUT.sha256")"

          {
            echo "## OKN Facebook Product Tracker APK Builder"
            echo ""
            echo "✅ Build สำเร็จ"
            echo ""
            echo "- Source ZIP: `${{ steps.project.outputs.zip_name }}`"
            echo "- APK: `$APK_NAME`"
            echo "- Version: `$VERSION_NAME`"
            echo "- compileSdk: `$COMPILE_SDK`"
            echo "- Build Tools: `$BUILD_TOOLS`"
            echo "- Size: `$APK_SIZE`"
            echo "- SHA-256: `$APK_SHA`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: FacebookProductTracker-APK-${{ github.run_number }}
          path: |
            dist/*.apk
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
