name: Build Android APK v4

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-v4-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '9.6.0'
  ANDROID_API: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'
  COMPOSE_BOM: '2026.06.00'

jobs:
  build-apk:
    name: Build build.apk v4
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "$GITHUB_WORKSPACE/settings.gradle.kts" || -f "$GITHUB_WORKSPACE/settings.gradle" ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
            echo "Using expanded Android project at repository root."
          else
            EXTRACT_DIR="$RUNNER_TEMP/android-project-v4"
            rm -rf "$EXTRACT_DIR"
            mkdir -p "$EXTRACT_DIR"

            mapfile -t ZIP_FILES < <(
              find "$GITHUB_WORKSPACE" -maxdepth 5 -type f -name '*.zip' \
                ! -path '*/.git/*' | sort
            )

            if (( ${#ZIP_FILES[@]} == 0 )); then
              echo '::error::No Android project and no ZIP source file were found.'
              exit 2
            fi

            SOURCE_ZIP="${ZIP_FILES[${#ZIP_FILES[@]}-1]}"
            echo "Extracting source ZIP: $SOURCE_ZIP"
            unzip -q -o "$SOURCE_ZIP" -d "$EXTRACT_DIR"

            SETTINGS_FILE="$(find "$EXTRACT_DIR" -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | head -n 1 || true)"
            if [[ -z "$SETTINGS_FILE" ]]; then
              echo '::error::ZIP was extracted, but settings.gradle(.kts) was not found.'
              exit 3
            fi
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

          test -d "$ANDROID_HOME/platforms/android-${ANDROID_API}"
          test -d "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Patch project for AGP 9 built-in Kotlin and API 36
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          def patch_text(path: Path, fn):
              if not path.exists():
                  return
              old = path.read_text(encoding='utf-8')
              new = fn(old)
              if new != old:
                  path.write_text(new, encoding='utf-8')
                  print(f'Patched {path}')

          def patch_root_kts(s: str) -> str:
              # AGP 9+ has built-in Kotlin; applying kotlin-android again causes
              # "Cannot add extension with name kotlin".
              s = re.sub(r'^\s*id\("org\.jetbrains\.kotlin\.android"\).*\n', '', s, flags=re.M)
              return s

          def patch_app_kts(s: str) -> str:
              s = re.sub(r'^\s*id\("org\.jetbrains\.kotlin\.android"\)\s*\n', '', s, flags=re.M)
              # Old project only used this block for Java/Kotlin target 17.
              # Built-in Kotlin inherits android.compileOptions.targetCompatibility.
              s = re.sub(r'\n?kotlin\s*\{\s*jvmToolchain\(17\)\s*\}\s*', '\n', s, flags=re.S)
              s = re.sub(r'compileSdk\s*=\s*37', 'compileSdk = 36', s)
              s = re.sub(r'targetSdk\s*=\s*37', 'targetSdk = 36', s)
              s = re.sub(r'compose-bom:[0-9]{4}\.[0-9]{2}\.[0-9]{2}', 'compose-bom:2026.06.00', s)
              # Keep v4 identity when building v3 payloads.
              s = re.sub(r'versionCode\s*=\s*3\b', 'versionCode = 4', s)
              s = re.sub(r'versionName\s*=\s*"0\.3\.0"', 'versionName = "0.4.0"', s)
              return s

          def patch_root_groovy(s: str) -> str:
              s = re.sub(r"^\s*id\s+['\"]org\.jetbrains\.kotlin\.android['\"].*\n", '', s, flags=re.M)
              return s

          def patch_app_groovy(s: str) -> str:
              s = re.sub(r"^\s*id\s+['\"]org\.jetbrains\.kotlin\.android['\"]\s*\n", '', s, flags=re.M)
              s = re.sub(r'compileSdk(?:Version)?\s+37\b', 'compileSdk 36', s)
              s = re.sub(r'targetSdk(?:Version)?\s+37\b', 'targetSdk 36', s)
              s = re.sub(r'compose-bom:[0-9]{4}\.[0-9]{2}\.[0-9]{2}', 'compose-bom:2026.06.00', s)
              return s

          patch_text(root / 'build.gradle.kts', patch_root_kts)
          patch_text(root / 'app/build.gradle.kts', patch_app_kts)
          patch_text(root / 'build.gradle', patch_root_groovy)
          patch_text(root / 'app/build.gradle', patch_app_groovy)

          props = root / 'gradle.properties'
          if props.exists():
              s = props.read_text(encoding='utf-8')
              s = re.sub(r'^org\.gradle\.configuration-cache=.*$', 'org.gradle.configuration-cache=false', s, flags=re.M)
              # Make sure an old opt-out does not disable AGP 9 built-in Kotlin.
              s = re.sub(r'^android\.builtInKotlin=false\s*$', 'android.builtInKotlin=true', s, flags=re.M)
              props.write_text(s, encoding='utf-8')

          # Hard fail if the incompatible plugin is still applied anywhere in normal build files.
          offenders = []
          for p in list(root.glob('*.gradle*')) + list((root / 'app').glob('*.gradle*')):
              if p.is_file() and 'org.jetbrains.kotlin.android' in p.read_text(encoding='utf-8'):
                  offenders.append(str(p))
          if offenders:
              raise SystemExit('kotlin-android still present in: ' + ', '.join(offenders))
          PY

          echo '--- root build file ---'
          sed -n '1,80p' build.gradle.kts 2>/dev/null || sed -n '1,80p' build.gradle
          echo '--- app build file ---'
          sed -n '1,130p' app/build.gradle.kts 2>/dev/null || sed -n '1,130p' app/build.gradle
          echo '--- gradle.properties ---'
          cat gradle.properties || true

      - name: Show build environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          sdkmanager --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Build APK - attempt 1
        id: build1
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set +e
          set -o pipefail
          gradle --no-daemon --no-configuration-cache --stacktrace :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build-attempt-1.log"
          STATUS=${PIPESTATUS[0]}
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build APK - clean retry
        id: build2
        if: steps.build1.outputs.status != '0'
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set +e
          set -o pipefail
          gradle --stop >/dev/null 2>&1 || true
          rm -rf .gradle app/build build
          gradle --no-daemon --no-configuration-cache --refresh-dependencies --stacktrace clean :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build-attempt-2.log"
          STATUS=${PIPESTATUS[0]}
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Combine diagnostic log
        if: always()
        shell: bash
        run: |
          {
            echo '===== FB Market build v4 ====='
            echo "Run: $GITHUB_RUN_NUMBER"
            echo "Commit: $GITHUB_SHA"
            echo "Android API: $ANDROID_API"
            echo "Build Tools: $ANDROID_BUILD_TOOLS"
            echo "Gradle: $GRADLE_VERSION"
            echo "Compose BOM: $COMPOSE_BOM"
            echo
            [[ -f build-attempt-1.log ]] && cat build-attempt-1.log
            if [[ -f build-attempt-2.log ]]; then
              echo
              echo '===== CLEAN RETRY ====='
              cat build-attempt-2.log
            fi
          } > build-v4.log

      - name: Verify build succeeded
        shell: bash
        run: |
          set -euo pipefail
          FIRST='${{ steps.build1.outputs.status }}'
          SECOND='${{ steps.build2.outputs.status }}'

          if [[ "$FIRST" != '0' && "$SECOND" != '0' ]]; then
            echo '::error::Both Android build attempts failed. See build-v4.log artifact.'
            tail -n 250 build-v4.log || true
            exit 1
          fi

      - name: Prepare build.apk
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR='${{ steps.project.outputs.project_dir }}'
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*debug*.apk' | head -n 1 || true)"
          if [[ -z "$APK" || ! -f "$APK" ]]; then
            echo '::error::Gradle reported success but no debug APK was found.'
            exit 4
          fi

          cp "$APK" "$GITHUB_WORKSPACE/build.apk"
          sha256sum "$GITHUB_WORKSPACE/build.apk" > "$GITHUB_WORKSPACE/build.apk.sha256"
          ls -lh "$GITHUB_WORKSPACE/build.apk" "$GITHUB_WORKSPACE/build.apk.sha256"

      - name: Upload build.apk directly
        uses: actions/upload-artifact@v7
        with:
          path: build.apk
          archive: false
          retention-days: 30
          if-no-files-found: error

      - name: Upload checksum directly
        uses: actions/upload-artifact@v7
        with:
          path: build.apk.sha256
          archive: false
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          path: build-v4.log
          archive: false
          retention-days: 30
          if-no-files-found: warn
