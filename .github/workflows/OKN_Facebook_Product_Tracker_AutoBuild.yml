name: OKN Facebook Product Tracker - Auto Build APK

"on":
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - "Facebook_Product_Tracker_READY.zip"
      - ".github/workflows/OKN_Facebook_Product_Tracker_AutoBuild.yml"

permissions:
  contents: read

concurrency:
  group: okn-facebook-product-tracker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Extract ZIP and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The source is intentionally kept as one ZIP in the repository.
      # IMPORTANT: unzip before setup-gradle because setup-gradle scans Gradle files.
      - name: Extract source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/Facebook_Product_Tracker_READY.zip"
          if [[ ! -f "$ZIP" ]]; then
            echo "::error::Missing Facebook_Product_Tracker_READY.zip in repository root"
            exit 1
          fi

          BUILD_SRC="$GITHUB_WORKSPACE/buildsrc"
          rm -rf "$BUILD_SRC"
          mkdir -p "$BUILD_SRC"
          unzip -q -o "$ZIP" -d "$BUILD_SRC"

          SETTINGS_FILE="$(find "$BUILD_SRC" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -path '*/android/*' -print -quit)"
          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "::error::Android settings.gradle/settings.gradle.kts not found after ZIP extraction"
            find "$BUILD_SRC" -maxdepth 6 -type f | sort | head -250
            exit 1
          fi

          ANDROID_DIR="$(dirname "$SETTINGS_FILE")"
          if [[ ! -f "$ANDROID_DIR/app/build.gradle" && ! -f "$ANDROID_DIR/app/build.gradle.kts" ]]; then
            echo "::error::app/build.gradle(.kts) not found under $ANDROID_DIR"
            exit 1
          fi

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "android_dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project detected: $ANDROID_DIR"

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ANDROID_DIR/settings.gradle" -o -f "$ANDROID_DIR/settings.gradle.kts"
          test -f "$ANDROID_DIR/app/src/main/AndroidManifest.xml"
          test -f "$ANDROID_DIR/app/src/main/assets/index.html"
          echo "LOCAL DEMO asset found and ready"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          accept-android-sdk-licenses: "yes"
          log-accepted-android-sdk-licenses: false

      - name: Accept licenses and install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          sdkmanager --list_installed | grep -E "platform-tools|platforms;android-35|build-tools;35.0.0" || true

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
          cache-provider: basic

      - name: Show build environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_DIR=$ANDROID_DIR"

      # Empty TRACKER_WEB_URL means the APK opens the built-in LOCAL DEMO immediately.
      # The user can later set a HTTPS backend URL from the Server button in the app.
      - name: Build installable debug APK
        shell: bash
        env:
          TRACKER_WEB_URL: ""
        run: |
          set -euo pipefail
          gradle \
            --no-daemon \
            --stacktrace \
            -p "$ANDROID_DIR" \
            :app:assembleDebug \
            -PTRACKER_WEB_URL="$TRACKER_WEB_URL"

      - name: Verify and package APK
        id: package
        shell: bash
        run: |
          set -euo pipefail

          APK="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -f "$APK" ]]; then
            echo "::error::APK was not produced at $APK"
            find "$ANDROID_DIR/app/build/outputs" -type f 2>/dev/null | sort || true
            exit 1
          fi

          DIST="$GITHUB_WORKSPACE/dist"
          mkdir -p "$DIST"
          OUT="$DIST/FacebookProductTracker-v1.1.0.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"

          APK_SIZE="$(du -h "$OUT" | awk '{print $1}')"
          APK_SHA="$(cut -d' ' -f1 "$OUT.sha256")"
          echo "size=$APK_SIZE" >> "$GITHUB_OUTPUT"
          echo "sha=$APK_SHA" >> "$GITHUB_OUTPUT"

          {
            echo "## Facebook Product Tracker APK"
            echo ""
            echo "✅ Build completed"
            echo ""
            echo "- APK: \`FacebookProductTracker-v1.1.0.apk\`"
            echo "- Size: \`$APK_SIZE\`"
            echo "- SHA-256: \`$APK_SHA\`"
            echo "- Startup mode: \`LOCAL DEMO\` (no server setup required)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: FacebookProductTracker-APK
          path: |
            dist/FacebookProductTracker-v1.1.0.apk
            dist/FacebookProductTracker-v1.1.0.apk.sha256
          if-no-files-found: error
          retention-days: 30
