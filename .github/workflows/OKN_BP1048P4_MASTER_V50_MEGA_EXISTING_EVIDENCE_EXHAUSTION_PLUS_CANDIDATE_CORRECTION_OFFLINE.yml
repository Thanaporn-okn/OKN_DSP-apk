              req.append(external_requirements[k])
              req.append("")
          (ev/"09_NEXT_REQUIRED_EXTERNAL_EVIDENCE.md").write_text("\n".join(req)+"\n")

          print((ev/"08_V50_FINAL_DECISION.md").read_text())
          PY

          cp /tmp/v50/evidence/* /tmp/v50/out/
          cp /tmp/v50/candidate/* /tmp/v50/out/ 2>/dev/null || true
          (cd /tmp/v50/out && sha256sum * > SHA256SUMS.txt)

      - name: Upload V50 consolidated result
        uses: actions/upload-artifact@v7
        with:
          name: OKN-BP1048P4-MASTER-V50-MEGA-EXISTING-EVIDENCE-EXHAUSTION
          path: /tmp/v50/out/*
          if-no-files-found: error
          retention-days: 90

