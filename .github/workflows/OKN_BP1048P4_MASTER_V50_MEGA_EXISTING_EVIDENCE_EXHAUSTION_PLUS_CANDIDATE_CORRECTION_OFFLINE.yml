              f"- source/object candidate copied into artifact: **{cand['preferred_candidate_copied']}**",
              f"- V29/V30 -> V32 decoded prefix cross-session consistent: **{desc['cross_session_prefix_consistent']}**",
              f"- complete 18261-byte Device Description reconstructed: **{desc['complete_18261_bytes_reconstructed']}**",
              f"- CH7 ID17 exact wire proof: **{ids['ch7_id17_exact_same_context']}**",
              f"- Gain IDs 22..28 globally free: **{ids['gain_ids_22_28_global_free_proven']}**",
              f"- safe runtime->updater without 0x11/Feature: **{proto['production_safe_no_0x11_no_feature_updater_entry_proven']}**",
              "",
              "Remaining blockers:"
          ]
          lines += [f"- {x}" for x in blockers]
          lines += [
              "",
              "Conclusion:",
              "**The currently collected evidence has been exhausted for these blockers.**",
              "Repeating more offline mining over the same corpus is not expected to close them.",
              "",
              "Hard rules:",
