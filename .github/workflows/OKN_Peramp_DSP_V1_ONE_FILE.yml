name: Build OKN Peramp DSP V1 - ONE FILE

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/OKN_Peramp_DSP_V1_ONE_FILE.yml'

permissions:
  contents: read

concurrency:
  group: okn-peramp-dsp-v1-onefile-${{ github.ref }}
  cancel-in-progress: true

