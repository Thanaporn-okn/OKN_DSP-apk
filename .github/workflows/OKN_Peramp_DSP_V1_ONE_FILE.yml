          tr -d ' \n\r\t' < "$B64" | base64 --decode > "$TGZ"
          echo "${SOURCE_SHA256}  $TGZ" | sha256sum -c -
          tar -xzf "$TGZ" -C "$WORK"

          test -f "$WORK/settings.gradle"
          test -f "$WORK/build.gradle"
          test -f "$WORK/app/build.gradle"
          test -f "$WORK/app/src/main/AndroidManifest.xml"
          test -f "$WORK/tools/preflight.py"
          test -f "$WORK/tools/protocol_smoke.sh"

          echo "PROJECT_DIR=$WORK" >> "$GITHUB_ENV"
          echo "Embedded source restored: PASS"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Verify Java 17
        shell: bash
        run: |
          set -euo pipefail
          java -version
          javac -version
          java -version 2>&1 | grep -q 'version "17\.'

      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi

          echo "sdkmanager=$SDKMANAGER"
          "$SDKMANAGER" --version

          # Keep the runner's preinstalled command-line tools. Do not replace them.
          # Accept licenses non-interactively; ignore only the expected broken-pipe exit from `yes`.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          set -o pipefail

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

          test -d "$SDK_ROOT/platforms/${ANDROID_PLATFORM}"
          test -d "$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}"
          echo "Android SDK: PASS"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Verify Gradle
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle --version | grep -q 'Gradle 8.9'

      - name: Run project preflight
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 tools/preflight.py

      - name: Run DSP protocol smoke test
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          bash tools/protocol_smoke.sh

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          rm -rf "$GITHUB_WORKSPACE/dist"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/OKN_Peramp_DSP_V1-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/dist/OKN_Peramp_DSP_V1-debug.apk" \
            > "$GITHUB_WORKSPACE/dist/OKN_Peramp_DSP_V1-debug.apk.sha256"

          ls -lh "$GITHUB_WORKSPACE/dist"
          cat "$GITHUB_WORKSPACE/dist/OKN_Peramp_DSP_V1-debug.apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN-Peramp-DSP-V1-APK
          path: |
            dist/OKN_Peramp_DSP_V1-debug.apk
            dist/OKN_Peramp_DSP_V1-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: success()
        shell: bash
        run: |
          {
            echo "## OKN Peramp DSP V1 - ONE FILE"
            echo ""
            echo "- Embedded source restore: PASS"
            echo "- Source SHA256: ${SOURCE_SHA256}"
            echo "- Java 17: PASS"
            echo "- Android SDK 35: PASS"
            echo "- Gradle 8.9: PASS"
            echo "- Project preflight: PASS"
            echo "- DSP protocol smoke: PASS"
            echo "- APK compile: PASS"
            echo "- APK: OKN_Peramp_DSP_V1-debug.apk"
            echo "- Artifact: OKN-Peramp-DSP-V1-APK"
          } >> "$GITHUB_STEP_SUMMARY"
