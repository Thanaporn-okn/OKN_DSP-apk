name: Build OKN DSP V64 ID3 Production Global Control

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_ANDROID_V64_ID3_PRODUCTION_GLOBAL_CONTROL.zip'
      - '.github/workflows/build-okn-dsp-v64.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify V64 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/okn_v64
          mkdir -p /tmp/okn_v64
          unzip -q OKN_DSP_ANDROID_V64_ID3_PRODUCTION_GLOBAL_CONTROL.zip -d /tmp/okn_v64

          check_file() { test -f "$1" || { echo "ERROR missing $1"; exit 1; }; echo "OK file: $1"; }
          check_text() { grep -Fq "$1" "$2" || { echo "ERROR missing marker '$1' in $2"; exit 1; }; echo "OK marker: $1"; }

          MAIN=/tmp/okn_v64/app/src/main/java/com/okn/dsp/MainActivity.kt
          SCALAR=/tmp/okn_v64/app/src/main/java/com/okn/dsp/ScalarControlActivity.kt
          LIVE=/tmp/okn_v64/app/src/main/java/com/okn/dsp/LiveEqActivity.kt
          ID3PROOF=/tmp/okn_v64/app/src/main/java/com/okn/dsp/RemindSoundProofActivity.kt
          POLICY=/tmp/okn_v64/app/src/main/java/com/okn/dsp/protocol/SaveParamsPolicy.kt
          SCALARPOL=/tmp/okn_v64/app/src/main/java/com/okn/dsp/protocol/VerifiedScalarControls.kt
          GATE=/tmp/okn_v64/app/src/main/java/com/okn/dsp/protocol/WriteGate.kt
          MANIFEST=/tmp/okn_v64/app/src/main/AndroidManifest.xml
          GRADLE=/tmp/okn_v64/app/build.gradle.kts

          for f in "$MAIN" "$SCALAR" "$LIVE" "$ID3PROOF" "$POLICY" "$SCALARPOL" "$GATE" "$MANIFEST" "$GRADLE"; do check_file "$f"; done
          check_file /tmp/okn_v64/README_V64.txt
          check_file /tmp/okn_v64/evidence/OKN_DSP_V64_ID3_PRODUCTION_PROMOTION_PLAN.txt
          check_file /tmp/okn_v64/evidence/OKN_DSP_V64_ID3_PRODUCTION_PROMOTION_PLAN.json
          check_file /tmp/okn_v64/evidence/OKN_DSP_V63_ID3_RUNTIME_PROOF_SUCCESS_CAPTURE.txt
          check_file /tmp/okn_v64/evidence/OKN_DSP_V62_GLOBAL_CONTROLS_PRODUCTION_SUCCESS_CAPTURE.txt
          check_file /tmp/okn_v64/evidence/OKN_DSP_V62_LIVE_EQ_PRODUCTION_SUCCESS_CAPTURE.txt

          check_text 'versionCode = 64' "$GRADLE"
          check_text '4.5.0-v64-id3-production-global-control' "$GRADLE"

          # Production launcher only exposes real production modules; the proof button is retired.
          check_text 'OKN DSP V64 — PRODUCTION VERIFIED CONTROL HUB' "$MAIN"
          check_text 'REAL DSP CONTROLS ONLY • NO MOCK EQ • NO LOCAL PRESET WRITE • GENERIC WRITES LOCKED' "$MAIN"
          check_text 'ScalarControlActivity::class.java' "$MAIN"
          check_text 'LiveEqActivity::class.java' "$MAIN"
          check_text 'EvidenceLabActivity::class.java' "$MAIN"
          check_text 'GLOBAL CONTROLS • 7 VERIFIED REAL DSP CONTROLS' "$MAIN"
          if grep -Fq 'RemindSoundProofActivity::class.java' "$MAIN"; then
            echo 'ERROR: retired V63 proof button still exposed on production launcher'
            exit 1
          fi
          if grep -Fq '.RemindSoundProofActivity' "$MANIFEST"; then
            echo 'ERROR: retired V63 proof activity still declared in production manifest'
            exit 1
          fi
          if grep -Eq 'SeekBar|LOCAL EQ PRESETS|renderPresets|savePreset\(|loadPreset\(|pendingChanges' "$MAIN"; then
            echo 'ERROR: mock/local launcher controls present'
            exit 1
          fi

          # Generic writes remain locked. Verified scalar + EQ production gates remain enabled.
          check_text 'const val enabled: Boolean = false' "$GATE"
          check_text 'verifiedScalarControlsEnabled: Boolean = true' "$GATE"
          check_text 'liveEqEditorEnabled: Boolean = true' "$GATE"
          check_text 'verifiedScalarPersistentSaveEnabled: Boolean = true' "$GATE"
          check_text 'ID3 RemindSoundVolume is now in the production scalar allow-list' "$GATE"

          # Exact SaveParams policy remains centralized.
          check_text 'const val ACTUATOR_ID = 7' "$POLICY"
          check_text 'UfeCodec.encodeWrite(ACTUATOR_ID, 0, byteArrayOf())' "$POLICY"
          check_text '570000000700000000' "$POLICY"
          if grep -R -n -F 'UfeCodec.encodeWrite(7' /tmp/okn_v64/app/src/main/java/com/okn/dsp | grep -v 'SaveParamsPolicy.kt'; then
            echo 'ERROR: direct SaveParams ID7 write exists outside SaveParamsPolicy'
            exit 1
          fi

          # Production scalar allow-list is exactly the seven runtime-proved controls including ID3.
          for marker in \
            'VerifiedScalarControl(2, "MasterVolume"' \
            'VerifiedScalarControl(3, "RemindSoundVolume"' \
            'VerifiedScalarControl(8, "BassVolume"' \
            'VerifiedScalarControl(9, "BassCutoff"' \
            'VerifiedScalarControl(10, "BassBoost"' \
            'VerifiedScalarControl(13, "MiddleBoost"' \
            'VerifiedScalarControl(11, "TrebleBoost"'; do
            check_text "$marker" "$SCALARPOL"
          done
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('/tmp/okn_v64/app/src/main/java/com/okn/dsp/protocol/VerifiedScalarControls.kt').read_text()
          ids=[int(x) for x in re.findall(r'VerifiedScalarControl\((\d+),', s)]
          assert ids == [2,3,8,9,10,13,11], ids
          print('OK: V64 production scalar allow-list exactly 7 controls including ID3')
          PY

          # V63 runtime proof evidence must contain target verify + exact restore completion.
          PROOFCAP=/tmp/okn_v64/evidence/OKN_DSP_V63_ID3_RUNTIME_PROOF_SUCCESS_CAPTURE.txt
          check_text 'V63_ID3_INITIAL_READY ready=true live=-70.0 safeTarget=-69.0 saveParams=false' "$PROOFCAP"
          check_text 'V63_ID3_TARGET_DESCRIPTOR_VERIFY id=3 expected=-69.0 actual=-69.0 verified=true' "$PROOFCAP"
          check_text 'V63_ID3_RESTORE_DESCRIPTOR_VERIFY id=3 expected=-70.0 actual=-70.0 verified=true' "$PROOFCAP"
          check_text 'V63_REMIND_SOUND_ID3_PROOF_COMPLETE id=3 baseline=-70.0 target=-69.0 targetVerified=true restored=true saveParamsSent=false persistence=RAM_ONLY' "$PROOFCAP"

          # V64 scalar production path retains guarded write/readback/rollback/save semantics.
          check_text 'V64_SCALAR_RUNTIME_EVIDENCE ids=2,3,8,9,10,13,11 source=V44+V45+V62+V63' "$SCALAR"
          check_text 'V64_SCALAR_WRITE_PLAIN=' "$SCALAR"
          check_text 'V64_TARGET_DESCRIPTOR_VERIFY' "$SCALAR"
          check_text 'V64_SCALAR_WRITE_COMPLETE' "$SCALAR"
          check_text 'V64_FAILSAFE_RESTORE_PLAIN=' "$SCALAR"
          check_text 'V64_RESTORE_DESCRIPTOR_VERIFY' "$SCALAR"
          check_text 'V64_SCALAR_SAVEPARAMS_TRIGGER_PLAIN=' "$SCALAR"
          check_text 'V64_SCALAR_PERSISTENT_SAVE_COMPLETE' "$SCALAR"
          check_text 'V64 GLOBAL CONTROLS READY • seven verified scalar controls loaded' "$SCALAR"
          check_text 'handler.post { onDescriptorComplete(mode, obj) }' "$SCALAR"

          # EQ production path is carried forward unchanged except V64 labels.
          check_text 'V64_LIVE_EQ_WRITE_PLAIN=' "$LIVE"
          check_text 'V64_TARGET_DESCRIPTOR_VERIFY' "$LIVE"
          check_text 'V64_EQ_ROLLBACK_WRITE_PLAIN=' "$LIVE"
          check_text 'V64_ROLLBACK_DESCRIPTOR_VERIFY' "$LIVE"
          check_text 'V64_SAVEPARAMS_TRIGGER_PLAIN=' "$LIVE"
          check_text 'V64_PERSISTENT_SAVE_COMPLETE' "$LIVE"
          check_text 'handler.post { onDescriptorComplete(mode, obj) }' "$LIVE"

          # APPLY/verify paths must not auto-save. SaveParams remains an explicit separate action.
          python3 - <<'PY'
          from pathlib import Path
          scalar=Path('/tmp/okn_v64/app/src/main/java/com/okn/dsp/ScalarControlActivity.kt').read_text()
          live=Path('/tmp/okn_v64/app/src/main/java/com/okn/dsp/LiveEqActivity.kt').read_text()
          policy_call='SaveParamsPolicy.encodeTrigger()'
          assert scalar.count(policy_call) == 1, scalar.count(policy_call)
          assert live.count(policy_call) == 1, live.count(policy_call)
          assert 'VerifiedScalarControl(3, "RemindSoundVolume"' in Path('/tmp/okn_v64/app/src/main/java/com/okn/dsp/protocol/VerifiedScalarControls.kt').read_text()
          print('OK: V64 keeps explicit-only SaveParams and production ID3 promotion')
          PY

          echo 'OK: V64 ID3 production promotion invariants verified'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/okn_v64
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and package artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn_v64/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          mkdir -p artifact
          cp "$APK" artifact/OKN_DSP_V64_ID3_PRODUCTION_GLOBAL_CONTROL-debug.apk
          cp /tmp/okn_v64/README_V64.txt artifact/
          cp /tmp/okn_v64/evidence/OKN_DSP_V64_ID3_PRODUCTION_PROMOTION_PLAN.txt artifact/
          cp /tmp/okn_v64/evidence/OKN_DSP_V64_ID3_PRODUCTION_PROMOTION_PLAN.json artifact/
          sha256sum artifact/OKN_DSP_V64_ID3_PRODUCTION_GLOBAL_CONTROL-debug.apk > artifact/OKN_DSP_V64_ID3_PRODUCTION_GLOBAL_CONTROL-debug.sha256
          ls -lh artifact

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-V64-ID3-PRODUCTION-GLOBAL-CONTROL-debug-apk
          path: artifact/
          if-no-files-found: error
          retention-days: 30
