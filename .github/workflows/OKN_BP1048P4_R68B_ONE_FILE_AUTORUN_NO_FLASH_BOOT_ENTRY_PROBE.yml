name: OKN BP1048P4 R68B ONE-FILE AUTO NO-FLASH Boot Entry Probe APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/OKN_BP1048P4_R68B_ONE_FILE_AUTORUN_NO_FLASH_BOOT_ENTRY_PROBE.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_SOC: "MVSilicon BP1048P4"
  REQUIRED_PHONE: "Samsung Galaxy S25+"
  REQUIRED_PATH: "Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only"
  SDK_REPO: "https://github.com/leadercxn/bp1048_sdk_v0.1.12.git"
  SDK_COMMIT: "8105bd864b04995d81c9f9ae77cb158259f39015"
  RUNTIME_VID_HEX: "6324"
  RUNTIME_PID_HEX: "1719"
  RUNTIME_IFACE: "4"
  FLASH_ALLOWED: "NO"
  ERASE_ALLOWED: "NO"
  FIRMWARE_WRITE_ALLOWED: "NO"
  RUNTIME_OUTPUT_REPORT_ALLOWED: "NO"
  FEATURE_BOOT_PROBE_MODE: "MANUAL_ONLY"

jobs:
  r68b-build-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Immutable no-flash gate
        shell: bash
        run: |
          set -euo pipefail
          test "$TARGET_SOC" = "MVSilicon BP1048P4"
          test "$REQUIRED_PHONE" = "Samsung Galaxy S25+"
          test "$REQUIRED_PATH" = "Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only"
          test "$FLASH_ALLOWED" = "NO"
          test "$ERASE_ALLOWED" = "NO"
          test "$FIRMWARE_WRITE_ALLOWED" = "NO"
          test "$RUNTIME_OUTPUT_REPORT_ALLOWED" = "NO"
          test "$FEATURE_BOOT_PROBE_MODE" = "MANUAL_ONLY"

          rm -rf /tmp/r68b
          mkdir -p /tmp/r68b/{sdk,app/app/src/main/java/com/okn/r68b,app/app/src/main/res/xml,app/app/src/main/res/values,evidence,out}

      - name: Clone exact public SDK and prove reference boot chain
        shell: bash
        run: |
          set -euo pipefail

          git clone --filter=blob:none --no-checkout "$SDK_REPO" /tmp/r68b/sdk
          git -C /tmp/r68b/sdk fetch --depth 1 origin "$SDK_COMMIT"
          git -C /tmp/r68b/sdk checkout -q --detach "$SDK_COMMIT"
          test "$(git -C /tmp/r68b/sdk rev-parse HEAD)" = "$SDK_COMMIT"

          STD=/tmp/r68b/sdk/MVsB1_Base_SDK/driver/driver_api/src/otg/device/otg_device_standard_request.c
          UPG=/tmp/r68b/sdk/BT_Audio_APP/bt_audio_app_src/device/upgrade.c
          DET=/tmp/r68b/sdk/BT_Audio_APP/bt_audio_app_src/device/device_detect.c
          SVC=/tmp/r68b/sdk/BT_Audio_APP/bt_audio_app_src/services/device_service.c
          MODE=/tmp/r68b/sdk/BT_Audio_APP/bt_audio_app_src/apps/mode_switch_api.c
          BOOT=/tmp/r68b/sdk/BT_Audio_APP/bt_audio_app_src/inc/flash_boot.h

          grep -q 'Request\[0\] == 0xAA' "$STD"
          grep -q 'pc_upgrade = 1' "$STD"
          grep -q 'Setup\[0\] = 0x55' "$STD"
          grep -q 'start_up_grate(AppResourceUsbDevice)' "$STD"
          grep -q '#define FLASH_BOOT_EN      1' "$BOOT"
          grep -q 'PCTOOL_ON' "$BOOT"
          grep -q 'ResourceValue(AppResourceUsbDevice)' "$UPG"
          grep -q 'SREG_FLASH_BOOT_FLAGE.PC = 1' "$UPG"
          grep -q 'SREG_FLASH_BOOT_FLAGE.updata = 1' "$UPG"
          grep -q 'jump_fun = (fun)0' "$UPG"
          grep -q 'OTG_PortDeviceIsLink()' "$DET"
          grep -q 'USB_DEVICE_STATE_BIT' "$DET"
          grep -q 'USB_DEVICE_EVENT_BIT' "$DET"
          grep -q 'ResourceRegister(AppResourceUsbDevice)' "$SVC"
          grep -q 'ResourceDeregister(AppResourceUsbDevice)' "$SVC"
          grep -q 'return ModeResourceReady & Resources' "$MODE"
          grep -q '#define DEVICE_SERVICE_TIMEOUT.*1' "$SVC"
          grep -q 'TimeOutSet(&ScanTimer, 10)' "$SVC"

          cat > /tmp/r68b/evidence/01_REFERENCE_CHAIN.txt <<'EOF'
          SDK_COMMIT=8105bd864b04995d81c9f9ae77cb158259f39015
          FEATURE_SET_AA_ARMS_PC_UPGRADE=YES
          FEATURE_GET_ARMED_RETURNS_55=YES
          FEATURE_GET_CALLS_START_UP_GRATE_USB=YES
          PUBLIC_FLASH_BOOT_EN=1
          PUBLIC_PCTOOL_PATH=ENABLED
          START_UP_GRATE_REQUIRES_AppResourceUsbDevice=YES
          USB_LINK_DETECTOR=OTG_PortDeviceIsLink
          USB_RESOURCE_REGISTER=ResourceRegister(AppResourceUsbDevice)
          DEVICE_SERVICE_SCAN_TIMER_MS=10
          BOOT_FLAG_PC_AND_UPDATE_BITS=YES
          JUMP_TARGET=0
          PRODUCTION_EXECUTION_PROVEN=NO
          FLASH_ALLOWED=NO
          EOF

      - name: Generate Android probe project
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/r68b/app

          cat > "$ROOT/settings.gradle" <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "OKN_R68B_BootProbe"
          include(":app")
          EOF

          cat > "$ROOT/build.gradle" <<'EOF'
          plugins {
              id "com.android.application" version "8.7.3" apply false
          }
          EOF

          cat > "$ROOT/app/build.gradle" <<'EOF'
          plugins { id "com.android.application" }

          android {
              namespace "com.okn.r68b"
              compileSdk 35

              defaultConfig {
                  applicationId "com.okn.r68b"
                  minSdk 29
                  targetSdk 35
                  versionCode 680
                  versionName "68.0"
              }
          }
          EOF

          cat > "$ROOT/app/src/main/res/values/styles.xml" <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
              </style>
          </resources>
          EOF

          cat > "$ROOT/app/src/main/res/xml/device_filter.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <usb-device vendor-id="25380" product-id="5913" />
          </resources>
          EOF

          cat > "$ROOT/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.usb.host" android:required="true"/>
              <application
                  android:theme="@style/AppTheme"
                  android:label="OKN R68B Boot Probe"
                  android:allowBackup="false">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED"
                          android:resource="@xml/device_filter"/>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > "$ROOT/app/src/main/java/com/okn/r68b/MainActivity.java" <<'EOF'
          package com.okn.r68b;

          import android.app.Activity;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.hardware.usb.UsbDevice;
          import android.hardware.usb.UsbDeviceConnection;
          import android.hardware.usb.UsbEndpoint;
          import android.hardware.usb.UsbInterface;
          import android.hardware.usb.UsbManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.SystemClock;
          import android.text.method.ScrollingMovementMethod;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.util.Locale;
          import java.util.Map;

          public class MainActivity extends Activity {
              private static final int RUNTIME_VID = 0x6324;
              private static final int RUNTIME_PID = 0x1719;
              private static final int HID_DATA_IFACE = 4;

              // HID Feature report only: report type=3, report ID=0.
              private static final int FEATURE_REPORT_TYPE_VALUE = 0x0300;
              private static final int FEATURE_BYTES = 8;

              private static final long MIN_STABLE_MS = 2000;
              private static final long OBSERVE_MS = 10000;
              private static final String ACTION_USB_PERMISSION =
                      "com.okn.r68b.USB_PERMISSION";

              private UsbManager usbManager;
              private UsbDevice runtimeDevice;
              private UsbDeviceConnection connection;
              private UsbInterface hidInterface;
              private long openedAtElapsed = 0;

              private TextView status;
              private TextView logView;
              private Button probeButton;
              private final StringBuilder log = new StringBuilder();

              private final BroadcastReceiver permissionReceiver = new BroadcastReceiver() {
                  @Override public void onReceive(Context context, Intent intent) {
                      if (!ACTION_USB_PERMISSION.equals(intent.getAction())) return;
                      UsbDevice d = intent.getParcelableExtra(UsbManager.EXTRA_DEVICE);
                      boolean granted = intent.getBooleanExtra(
                              UsbManager.EXTRA_PERMISSION_GRANTED, false);
                      append("USB permission result: " + granted);
                      if (granted && d != null) openRuntime(d);
                  }
              };

              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  usbManager = (UsbManager)getSystemService(Context.USB_SERVICE);

                  IntentFilter pf = new IntentFilter(ACTION_USB_PERMISSION);
                  if (Build.VERSION.SDK_INT >= 33) {
                      registerReceiver(permissionReceiver, pf, Context.RECEIVER_NOT_EXPORTED);
                  } else {
                      registerReceiver(permissionReceiver, pf);
                  }

                  buildUi();
                  append("R68B started.");
                  append("No firmware erase/write commands exist in this app.");
                  append("Probe is MANUAL ONLY and only sends HID Feature AA then Feature GET.");
                  scanOnly();
              }

              private void buildUi() {
                  ScrollView sc = new ScrollView(this);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(28, 28, 28, 48);
                  sc.addView(root);

                  TextView title = new TextView(this);
                  title.setText("OKN BP1048P4 — R68B Boot Entry Probe");
                  title.setTextSize(22);
                  root.addView(title);

                  TextView warning = new TextView(this);
                  warning.setText(
                      "NO FLASH COMMANDS. This probe can request a transition out of runtime USB. " +
                      "It does not erase or write firmware. Start only with the board connected " +
                      "directly to the Samsung S25+ by USB-C.");
                  warning.setTextSize(16);
                  root.addView(warning);

                  status = new TextView(this);
                  status.setText("Not connected");
                  status.setTextSize(16);
                  root.addView(status);

                  Button scan = new Button(this);
                  scan.setText("1. SCAN USB DEVICES");
                  scan.setOnClickListener(v -> scanOnly());
                  root.addView(scan);

                  Button connect = new Button(this);
                  connect.setText("2. CONNECT RUNTIME 6324:1719");
                  connect.setOnClickListener(v -> connectRuntime());
                  root.addView(connect);

                  probeButton = new Button(this);
                  probeButton.setText("3. MANUAL BOOT-ENTRY PROBE (AA → GET)");
                  probeButton.setEnabled(false);
                  probeButton.setOnClickListener(v -> startProbe());
                  root.addView(probeButton);

                  Button copy = new Button(this);
                  copy.setText("COPY LOG");
                  copy.setOnClickListener(v -> {
                      ClipboardManager cm = (ClipboardManager)getSystemService(
                              Context.CLIPBOARD_SERVICE);
                      cm.setPrimaryClip(ClipData.newPlainText("R68B log", log.toString()));
                      status.setText("Log copied");
                  });
                  root.addView(copy);

                  logView = new TextView(this);
                  logView.setTextSize(13);
                  logView.setGravity(Gravity.START);
                  logView.setMovementMethod(new ScrollingMovementMethod());
                  root.addView(logView);

                  setContentView(sc);
              }

              private static String id(UsbDevice d) {
                  return String.format(Locale.US, "%04X:%04X", d.getVendorId(), d.getProductId());
              }

              private void append(String s) {
                  String line = String.format(Locale.US, "%8d ms  %s",
                          SystemClock.elapsedRealtime(), s);
                  log.append(line).append('\n');
                  runOnUiThread(() -> {
                      if (logView != null) logView.setText(log.toString());
                  });
              }

              private void scanOnly() {
                  append("USB scan:");
                  Map<String,UsbDevice> devices = usbManager.getDeviceList();
                  if (devices.isEmpty()) {
                      append("  no USB devices visible");
                  }
                  for (UsbDevice d : devices.values()) {
                      append("  " + id(d) +
                              " devId=" + d.getDeviceId() +
                              " ifaces=" + d.getInterfaceCount());
                      for (int i=0; i<d.getInterfaceCount(); i++) {
                          UsbInterface f = d.getInterface(i);
                          append("    if#" + f.getId() +
                                  " class=" + f.getInterfaceClass() +
                                  " sub=" + f.getInterfaceSubclass() +
                                  " proto=" + f.getInterfaceProtocol() +
                                  " eps=" + f.getEndpointCount());
                          for (int e=0; e<f.getEndpointCount(); e++) {
                              UsbEndpoint ep = f.getEndpoint(e);
                              append("      ep=0x" +
                                      Integer.toHexString(ep.getAddress()) +
                                      " type=" + ep.getType() +
                                      " dir=" + ep.getDirection() +
                                      " max=" + ep.getMaxPacketSize());
                          }
                      }
                  }
              }

              private UsbDevice findRuntime() {
                  for (UsbDevice d : usbManager.getDeviceList().values()) {
                      if (d.getVendorId() == RUNTIME_VID &&
                          d.getProductId() == RUNTIME_PID) return d;
                  }
                  return null;
              }

              private void connectRuntime() {
                  UsbDevice d = findRuntime();
                  if (d == null) {
                      status.setText("Runtime 6324:1719 not found");
                      append("CONNECT: runtime 6324:1719 not found");
                      return;
                  }
                  if (!usbManager.hasPermission(d)) {
                      PendingIntent pi = PendingIntent.getBroadcast(
                              this, 0,
                              new Intent(ACTION_USB_PERMISSION).setPackage(getPackageName()),
                              PendingIntent.FLAG_MUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                      usbManager.requestPermission(d, pi);
                      status.setText("Approve USB permission");
                      append("CONNECT: requested Android USB permission");
                      return;
                  }
                  openRuntime(d);
              }

              private void openRuntime(UsbDevice d) {
                  closeUsb();
                  UsbInterface found = null;
                  for (int i=0; i<d.getInterfaceCount(); i++) {
                      UsbInterface f = d.getInterface(i);
                      if (f.getId() == HID_DATA_IFACE) {
                          found = f;
                          break;
                      }
                  }
                  if (found == null) {
                      status.setText("Interface 4 not found");
                      append("OPEN: interface 4 not found");
                      return;
                  }

                  UsbDeviceConnection c = usbManager.openDevice(d);
                  if (c == null) {
                      status.setText("openDevice failed");
                      append("OPEN: openDevice failed");
                      return;
                  }
                  if (!c.claimInterface(found, true)) {
                      c.close();
                      status.setText("claim interface 4 failed");
                      append("OPEN: claim interface 4 failed");
                      return;
                  }

                  runtimeDevice = d;
                  hidInterface = found;
                  connection = c;
                  openedAtElapsed = SystemClock.elapsedRealtime();
                  probeButton.setEnabled(true);
                  status.setText("Connected. Wait ≥2 s before probe.");
                  append("OPEN: runtime " + id(d) + " interface 4 claimed");
                  append("OPEN: stable timer started; minimum 2000 ms");
              }

              private void startProbe() {
                  if (connection == null || runtimeDevice == null) {
                      status.setText("Connect runtime first");
                      return;
                  }

                  long stable = SystemClock.elapsedRealtime() - openedAtElapsed;
                  if (stable < MIN_STABLE_MS) {
                      long left = MIN_STABLE_MS - stable;
                      status.setText("Wait " + left + " ms, then press probe again");
                      append("PROBE blocked: USB stable only " + stable + " ms");
                      return;
                  }

                  probeButton.setEnabled(false);
                  status.setText("Probe running...");
                  append("PROBE start after stable=" + stable + " ms");

                  new Thread(() -> {
                      try {
                          byte[] set = new byte[FEATURE_BYTES];
                          set[0] = (byte)0xAA;

                          int wr = connection.controlTransfer(
                                  0x21, 0x09,
                                  FEATURE_REPORT_TYPE_VALUE,
                                  HID_DATA_IFACE,
                                  set, set.length, 1000);
                          append("Feature SET AA result=" + wr);
                          if (wr != FEATURE_BYTES) {
                              append("STOP: SET did not transfer 8 bytes");
                              setStatus("SET failed: " + wr);
                              return;
                          }

                          SystemClock.sleep(150);

                          byte[] get = new byte[FEATURE_BYTES];
                          int rd = connection.controlTransfer(
                                  0xA1, 0x01,
                                  FEATURE_REPORT_TYPE_VALUE,
                                  HID_DATA_IFACE,
                                  get, get.length, 1500);

                          append("Feature GET result=" + rd +
                                  " first=0x" + (rd > 0
                                  ? String.format(Locale.US, "%02X", get[0] & 0xFF)
                                  : "--"));

                          if (rd > 0 && (get[0] & 0xFF) == 0x55) {
                              append("ACK55 observed. Now observe USB detach/re-enumeration only.");
                          } else {
                              append("ACK55 not observed; no further host-to-device request will be sent.");
                          }

                          observeUsb();
                      } catch (Throwable t) {
                          append("PROBE exception: " + t.getClass().getSimpleName() +
                                  ": " + t.getMessage());
                          observeUsb();
                      }
                  }, "R68B-Probe").start();
              }

              private void observeUsb() {
                  long start = SystemClock.elapsedRealtime();
                  boolean runtimeSeen = false;
                  boolean runtimeGone = false;
                  String lastSet = "";

                  while (SystemClock.elapsedRealtime() - start < OBSERVE_MS) {
                      StringBuilder now = new StringBuilder();
                      boolean rt = false;
                      for (UsbDevice d : usbManager.getDeviceList().values()) {
                          if (now.length() > 0) now.append(",");
                          now.append(id(d));
                          if (d.getVendorId() == RUNTIME_VID &&
                              d.getProductId() == RUNTIME_PID) rt = true;
                      }

                      String set = now.toString();
                      if (!set.equals(lastSet)) {
                          append("OBSERVE USB set: [" + set + "]");
                          lastSet = set;
                      }

                      if (rt) runtimeSeen = true;
                      if (runtimeSeen && !rt) runtimeGone = true;

                      SystemClock.sleep(200);
                  }

                  boolean finalRuntime = findRuntime() != null;
                  append("OBSERVE done: runtimeSeen=" + runtimeSeen +
                          " runtimeGone=" + runtimeGone +
                          " finalRuntime=" + finalRuntime);

                  if (runtimeGone) {
                      setStatus("Runtime detached. Check log for new VID:PID.");
                  } else if (finalRuntime) {
                      setStatus("Runtime stayed 6324:1719; no re-enumeration observed.");
                  } else {
                      setStatus("Runtime not visible at end; inspect USB log.");
                  }
              }

              private void setStatus(String s) {
                  runOnUiThread(() -> status.setText(s));
              }

              private void closeUsb() {
                  if (connection != null) {
                      try {
                          if (hidInterface != null) connection.releaseInterface(hidInterface);
                      } catch (Throwable ignored) {}
                      try { connection.close(); } catch (Throwable ignored) {}
                  }
                  connection = null;
                  hidInterface = null;
                  runtimeDevice = null;
                  openedAtElapsed = 0;
                  if (probeButton != null) probeButton.setEnabled(false);
              }

              @Override protected void onDestroy() {
                  closeUsb();
                  try { unregisterReceiver(permissionReceiver); } catch (Throwable ignored) {}
                  super.onDestroy();
              }
          }
          EOF

      - name: Static safety audit of generated APK source
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/r68b/app/app/src/main/java/com/okn/r68b/MainActivity.java

          test -s "$SRC"
          grep -q 'FEATURE_REPORT_TYPE_VALUE = 0x0300' "$SRC"
          grep -q 'set\[0\] = (byte)0xAA' "$SRC"
          grep -q 'connection.controlTransfer(' "$SRC"
          grep -q 'MIN_STABLE_MS = 2000' "$SRC"
          grep -q 'OBSERVE_MS = 10000' "$SRC"

          # R68B must not contain the runtime 256-byte Output-report transport.
          ! grep -q '0x0200' "$SRC"
          ! grep -q 'SpiFlash' "$SRC"
          ! grep -q 'FlashErase' "$SRC"
          ! grep -q 'FlashWrite' "$SRC"
          ! grep -q 'firmware.*write' "$SRC" || {
            # Human UI text may mention that writes do not exist; reject executable-like
            # write APIs separately below.
            true
          }

          # Exactly two HID control-transfer request patterns are allowed:
          # Feature SET_REPORT and Feature GET_REPORT.
          python3 - <<'PY'
          from pathlib import Path
          import re,json

          p=Path("/tmp/r68b/app/app/src/main/java/com/okn/r68b/MainActivity.java")
          t=p.read_text()
          calls=re.findall(
              r'connection\.controlTransfer\s*\(\s*(0x[0-9A-Fa-f]+)\s*,\s*(0x[0-9A-Fa-f]+)',
              t,re.S
          )
          allowed={("0x21","0x09"),("0xA1","0x01")}
          normalized={(a,b) for a,b in calls}
          if normalized != allowed:
              raise SystemExit(f"unexpected controlTransfer request set: {normalized}")

          result={
              "control_transfer_pairs":calls,
              "allowed_pairs_only":True,
              "runtime_output_report_present":False,
              "flash_erase_api_present":False,
              "flash_write_api_present":False,
              "automatic_probe_on_app_start":False,
              "manual_button_required":True,
              "minimum_usb_stable_ms":2000,
              "observe_after_get_ms":10000,
              "flash_allowed":False,
          }
          Path("/tmp/r68b/evidence/02_APK_STATIC_SAFETY.json").write_text(
              json.dumps(result,indent=2)+"\n"
          )
          print(json.dumps(result,indent=2))
          PY

      - name: Build Samsung S25+ probe APK
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 5 --retry-all-errors \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o /tmp/r68b-gradle.zip
          unzip -q /tmp/r68b-gradle.zip -d /tmp

          cd /tmp/r68b/app
          /tmp/gradle-8.9/bin/gradle --no-daemon :app:assembleDebug \
            | tee /tmp/r68b/evidence/03_ANDROID_BUILD.txt

          APK=/tmp/r68b/app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" /tmp/r68b/out/OKN_BP1048P4_R68B_NO_FLASH_BOOT_ENTRY_PROBE.apk
          sha256sum /tmp/r68b/out/OKN_BP1048P4_R68B_NO_FLASH_BOOT_ENTRY_PROBE.apk \
            | tee /tmp/r68b/evidence/04_APK_SHA256.txt

      - name: Build usage and interpretation report
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/r68b/evidence/05_R68B_REPORT_TH.md <<'EOF'
          # R68B — BP1048P4 S25+ NO-FLASH Boot Entry Probe

          Required physical path:
          Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C only.

          This APK does NOT contain firmware erase/write logic.
          It does NOT use the runtime 256-byte Output-report transport.
          It only has two HID Feature control transfers:
          - SET_REPORT Feature, 8 bytes, first byte AA
          - GET_REPORT Feature, 8 bytes

          Probe behavior:
          1. Scan USB and confirm runtime 6324:1719.
          2. Connect/claim interface 4.
          3. Wait at least 2 seconds so the reference 10 ms device-service scan
             has ample time to register AppResourceUsbDevice.
          4. User manually presses the boot-entry probe button.
          5. App sends Feature AA, waits 150 ms, sends Feature GET.
          6. App records whether first response byte is 55.
          7. App sends no additional host-to-device request.
          8. App observes all USB VID:PID changes for 10 seconds.

          Interpretation:
          - ACK55 + runtime stays 6324:1719:
            pc_upgrade branch responded, but production boot handoff still did not
            detach/re-enumerate. This points away from a simple 10 ms resource race.
          - ACK55 + runtime disappears + new VID:PID appears:
            production runtime-to-FlashBoot transition is observed. Record the new
            VID:PID/descriptors; do NOT send recovery erase/write commands yet.
          - SET/GET fails:
            record the exact transfer result and USB descriptor log.

          The app does not prove flash layout, backup, rollback or image acceptance.
          FLASH_ALLOWED=NO
          EOF

          cat > /tmp/r68b/evidence/06_BUILD_STATE.txt <<'EOF'
          REVISION=R68B
          TARGET=MVSilicon_BP1048P4
          PHONE=Samsung_Galaxy_S25+
          PHYSICAL_PATH=PHONE_USB_C_TO_DSP_USB_C_ONLY
          MODE=MANUAL_NO_FLASH_BOOT_ENTRY_PROBE
          RUNTIME_VID_PID=6324:1719
          RUNTIME_INTERFACE=4
          FEATURE_SET_AA=ENABLED_MANUAL_ONLY
          FEATURE_GET=ENABLED_MANUAL_ONLY
          MIN_USB_STABLE_MS=2000
          USB_OBSERVE_MS=10000
          RUNTIME_OUTPUT_REPORT=DISABLED
          FIRMWARE_ERASE=ABSENT
          FIRMWARE_WRITE=ABSENT
          FLASH_ALLOWED=NO
          EOF

          cp /tmp/r68b/evidence/01_REFERENCE_CHAIN.txt /tmp/r68b/out/
          cp /tmp/r68b/evidence/02_APK_STATIC_SAFETY.json /tmp/r68b/out/
          cp /tmp/r68b/evidence/03_ANDROID_BUILD.txt /tmp/r68b/out/
          cp /tmp/r68b/evidence/04_APK_SHA256.txt /tmp/r68b/out/
          cp /tmp/r68b/evidence/05_R68B_REPORT_TH.md /tmp/r68b/out/
          cp /tmp/r68b/evidence/06_BUILD_STATE.txt /tmp/r68b/out/

          cp -R /tmp/r68b/app /tmp/r68b/out/R68B_ANDROID_SOURCE
          rm -rf /tmp/r68b/out/R68B_ANDROID_SOURCE/app/build \
                 /tmp/r68b/out/R68B_ANDROID_SOURCE/.gradle

          (cd /tmp/r68b/out && sha256sum \
            OKN_BP1048P4_R68B_NO_FLASH_BOOT_ENTRY_PROBE.apk \
            01_REFERENCE_CHAIN.txt \
            02_APK_STATIC_SAFETY.json \
            05_R68B_REPORT_TH.md \
            06_BUILD_STATE.txt \
            > SHA256SUMS.txt)

          cat /tmp/r68b/evidence/05_R68B_REPORT_TH.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload R68B APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: R68B_BP1048P4_S25_NO_FLASH_BOOT_ENTRY_PROBE
          path: /tmp/r68b/out/*
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed assertion
        shell: bash
        run: |
          set -euo pipefail

          test "$FLASH_ALLOWED" = "NO"
          test "$ERASE_ALLOWED" = "NO"
          test "$FIRMWARE_WRITE_ALLOWED" = "NO"
          test "$RUNTIME_OUTPUT_REPORT_ALLOWED" = "NO"
          test "$FEATURE_BOOT_PROBE_MODE" = "MANUAL_ONLY"

          test -s /tmp/r68b/out/OKN_BP1048P4_R68B_NO_FLASH_BOOT_ENTRY_PROBE.apk
          grep -q '"allowed_pairs_only": true' /tmp/r68b/evidence/02_APK_STATIC_SAFETY.json
          grep -q '"manual_button_required": true' /tmp/r68b/evidence/02_APK_STATIC_SAFETY.json
          grep -q '"flash_allowed": false' /tmp/r68b/evidence/02_APK_STATIC_SAFETY.json

          echo "R68B_APK_BUILD_AND_STATIC_SAFETY_GATE=PASS"
          echo "FLASH_ALLOWED=NO"
