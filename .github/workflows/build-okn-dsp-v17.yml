name: Build OKN DSP V17 Packet Capture

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Find V17 ZIP
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 1 -type f -iname '*V17*.zip' | head -n 1)"
          test -n "$ZIP" || { echo "V17 ZIP not found at repository root"; exit 1; }
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract V17
        shell: bash
        run: |
          set -e
          rm -rf payload temp_app
          mkdir payload
          unzip -q "$ZIP" -d payload
          if [ -d payload/OKN_DSP_V17_PROJECT ]; then
            cp -r payload/OKN_DSP_V17_PROJECT/. payload/
            rm -rf payload/OKN_DSP_V17_PROJECT
          fi
          test -f payload/pubspec.yaml
          test -f payload/lib/main.dart
          test -f payload/android_patch/MainActivity.kt

      - name: Create clean Flutter Android project
        run: flutter create --platforms=android --org com.okn --project-name okn_dsp temp_app

      - name: Install V17 files
        shell: bash
        run: |
          set -e
          rm -rf temp_app/lib
          mkdir -p temp_app/lib
          cp payload/pubspec.yaml temp_app/pubspec.yaml
          cp payload/lib/main.dart temp_app/lib/main.dart
          mkdir -p temp_app/android/app/src/main/kotlin/com/okn/okn_dsp
          cp payload/android_patch/MainActivity.kt temp_app/android/app/src/main/kotlin/com/okn/okn_dsp/MainActivity.kt

      - name: Install Bluetooth permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("temp_app/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          perms = '''
          <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>
          <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>
          <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30"/>
          <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation"/>
          <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
          '''
          if 'android.permission.BLUETOOTH_SCAN' not in s:
              s = s.replace('<application', perms + '\n    <application', 1)
          p.write_text(s)
          PY

      - name: Get packages
        working-directory: temp_app
        run: flutter pub get

      - name: Analyze
        working-directory: temp_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        working-directory: temp_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN_DSP_V17_APK
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
