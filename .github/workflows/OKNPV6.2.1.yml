      # setup-gradle scans Gradle project files, so the generated project must exist first.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Verify frozen protocol core and V6.2 shared-Band1 safety verifier
        shell: bash
        run: |
          set -euo pipefail
          echo "e40bac569ec09021a9eb5d7751784d2d74383aaa3ff6e3ab7fec7cbabc34dc10  app/src/main/java/com/okn/peramp/DspProtocol.java" | sha256sum -c -
          echo "e797ec76c7066b82d71f205330ae77b7810deed1b2c284bc1c7fc209bad9ef38  app/src/main/java/com/okn/peramp/BleManager.java" | sha256sum -c -

      - name: Validate PEQ safety reset shared-Band1 lock and V6.2 no-unknown-TX gate
        shell: bash
        run: |
          set -euo pipefail
          python3 Sources/validate_v38_gate.py
          python3 Sources/validate_v39_reset_v62.py
          python3 Sources/validate_oknpv62.py

      - name: Build Debug and Release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk OKNPV62-debug.apk
          cp app/build/outputs/apk/release/app-release.apk OKNPV62-release.apk

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging OKNPV62-debug.apk | tee OKNPV62-apk-badging.txt
          grep -q "package: name='com.okn.peramp' versionCode='6200' versionName='6.2.0'" OKNPV62-apk-badging.txt
          grep -q "application-label:'OKN Peramp'" OKNPV62-apk-badging.txt

      - name: Package generated source evidence and checksums (V6.2.1 fix)
        shell: bash
        run: |
          set -euo pipefail
          zip -qr OKNPV62-source.zip app Sources build.gradle settings.gradle gradle.properties -x '*/build/*' -x '.gradle/*'
          cp Sources/OKNPV61_REVERSE_CHECKPOINT.txt OKNPV62-REVERSE-CHECKPOINT.txt
          cp Sources/OKNPV62_BUILD_NOTES.txt OKNPV62-BUILD-NOTES.txt
          sha256sum OKNPV62-debug.apk OKNPV62-release.apk OKNPV62-source.zip OKNPV62-REVERSE-CHECKPOINT.txt OKNPV62-BUILD-NOTES.txt > OKNPV62-SHA256SUMS.txt
          cat OKNPV62-SHA256SUMS.txt

      - name: Upload OKNPV6.2.1 artifact
        uses: actions/upload-artifact@v7
        with:
          name: OKNPV621
          path: |
            OKNPV62-debug.apk
            OKNPV62-release.apk
            OKNPV62-source.zip
            OKNPV62-SHA256SUMS.txt
            OKNPV62-apk-badging.txt
            OKNPV62-REVERSE-CHECKPOINT.txt
            OKNPV62-BUILD-NOTES.txt
          if-no-files-found: error
          retention-days: 30
