name: Build OKN DSP V76 Production Session Health Gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_ANDROID_V76_PRODUCTION_SESSION_HEALTH_GATE.zip'
      - '.github/workflows/build-okn-dsp-v76.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify V76 source
        shell: bash
        run: |
          set -euo pipefail
          echo '1101bf36b2e0092e6ec823faf539670455c17a92496d7f07f736575145561436  OKN_DSP_ANDROID_V76_PRODUCTION_SESSION_HEALTH_GATE.zip' | sha256sum -c -
          rm -rf /tmp/okn_v76
          mkdir -p /tmp/okn_v76
          unzip -q OKN_DSP_ANDROID_V76_PRODUCTION_SESSION_HEALTH_GATE.zip -d /tmp/okn_v76
          cd /tmp/okn_v76
          python3 preflight_v76.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/okn_v76
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and package artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn_v76/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          mkdir -p artifact
          cp "$APK" artifact/OKN_DSP_V76_PRODUCTION_SESSION_HEALTH_GATE-debug.apk
          cp /tmp/okn_v76/README_V76.txt artifact/
          cp /tmp/okn_v76/evidence/OKN_DSP_V76_PRODUCTION_SESSION_HEALTH_GATE_PLAN.txt artifact/
          cp /tmp/okn_v76/evidence/OKN_DSP_V76_PRODUCTION_SESSION_HEALTH_GATE_PLAN.json artifact/
          sha256sum artifact/OKN_DSP_V76_PRODUCTION_SESSION_HEALTH_GATE-debug.apk > artifact/OKN_DSP_V76_PRODUCTION_SESSION_HEALTH_GATE-debug.sha256
          ls -lh artifact

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-V76-PRODUCTION-SESSION-HEALTH-GATE-debug-apk
          path: artifact/
          if-no-files-found: error
          retention-days: 30
