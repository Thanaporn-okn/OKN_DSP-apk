name: OKN BP1048P4 SPI Flash API + Verify Flow V13 - All In One

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: okn-bp1048p4-spiflash-verify-v13-${{ github.ref }}
  cancel-in-progress: true

env:
  FLASH_ALLOWED: "NO"

jobs:
  spiflash_verify:
    name: Match SPI flash APIs + prove write/readback flow - NO USB - NO FLASH
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          mkdir -p /tmp/v13/evidence
          cat > /tmp/v13/evidence/SAFETY.txt <<'EOF'
          MODE=OFFLINE_STATIC_SPIFLASH_API_MATCH_ONLY
          TARGET=MVSilicon_BP1048P4
          USB_OR_BOARD_CONTACT=NO
          TARGET_FIRMWARE_EXECUTED=NO
          FEATURE_55_SENT=NO
          FEATURE_AA_SENT=NO
          FLASH_READ_EXECUTED=NO
          FLASH_ERASE_EXECUTED=NO
          FLASH_WRITE_EXECUTED=NO
          LIVE_BOOT_ENTRY_AUTHORIZED=NO
          LIVE_FLASH_AUTHORIZED=NO
          FLASH_ALLOWED=NO
          EOF

      - name: Checkout public BP1048 SDK
        uses: actions/checkout@v4
        with:
          repository: leadercxn/bp1048_sdk_v0.1.12
          ref: master
          path: bp1048-sdk
          fetch-depth: 1

      - name: Reconstruct exact image and extract source evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib,json,re,subprocess

          ROOT=Path("bp1048-sdk")
          OUT=Path("/tmp/v13/evidence")

          src=ROOT/"BT_Audio_APP/bt_audio_app_src/device/flash_boot.c"
          text=src.read_text(errors="replace")
          m=re.search(
              r"(?:static\s+|const\s+|unsigned\s+|signed\s+)*"
              r"(?:char|uint8_t|uint8|u8|BYTE)\s+flash_data\s*"
              r"\[\s*(?P<n>\d+)\s*\]\s*=\s*\{(?P<body>.*?)\};",
              text,re.I|re.S
          )
          assert m
          body=re.sub(r"/\*.*?\*/","",m.group("body"),flags=re.S)
          body=re.sub(r"//[^\r\n]*","",body)
          vals=[int(x,16) for x in re.findall(
              r"0[xX]([0-9A-Fa-f]{1,2})\b",body
          )]
          assert int(m.group("n"))==65536 and len(vals)==65520
          raw=bytes(vals)+bytes(65536-len(vals))
          (OUT/"flash_data_65536.bin").write_bytes(raw)

          # Exact source evidence for SPI flash APIs and upgrade write/readback code.
          source_files=[]
          for p in ROOT.rglob("*"):
              if not p.is_file() or ".git" in p.parts:
                  continue
              try:
                  if p.stat().st_size > 2_000_000:
                      continue
              except Exception:
                  continue
              if p.suffix.lower() not in {
                  ".c",".h",".s",".S",".asm",".txt",".ld",".sag"
              }:
                  continue
              source_files.append(p)

          api_hits=[]
          patterns=[
              r"\bSpiFlashRead\s*\(",
              r"\bSpiFlashWrite\s*\(",
              r"\bSpiFlashErase\w*\s*\(",
              r"\bSpiFlash\w+\s*\(",
              r"\bFLASH_NONE_ERR\b",
          ]

          for p in source_files:
              try:
                  lines=p.read_text(errors="replace").splitlines()
              except Exception:
                  continue
              rel=str(p.relative_to(ROOT))
              for i,line in enumerate(lines):
                  if any(re.search(rx,line,re.I) for rx in patterns):
                      lo=max(0,i-4)
                      hi=min(len(lines),i+5)
                      api_hits.append({
                          "file":rel,
                          "line":i+1,
                          "context":"\n".join(
                              f"{j+1:5d}: {lines[j]}" for j in range(lo,hi)
                          )
                      })

          # Targeted upgrade-source contexts.
          upgrade_hits=[]
          upgrade_needles=[
              "SpiFlashWrite","SpiFlashRead","opp_update_buf",
              "4096","memcmp","code_crc","codeCRC","const_offset",
              "config_offset","EncryptFlag","boot_crc","upgrade package",
              "Make mva","chip erase"
          ]
          for p in source_files:
              rel=str(p.relative_to(ROOT))
              if not any(k in rel.lower() for k in (
                  "upgrade","flash","boot","obex"
              )):
                  continue
              try:
                  lines=p.read_text(errors="replace").splitlines()
              except Exception:
                  continue
              for i,line in enumerate(lines):
                  low=line.lower()
                  matched=[n for n in upgrade_needles if n.lower() in low]
                  if matched:
                      lo=max(0,i-8)
                      hi=min(len(lines),i+9)
                      upgrade_hits.append({
                          "file":rel,
                          "line":i+1,
                          "matched":matched,
                          "context":"\n".join(
                              f"{j+1:5d}: {lines[j]}" for j in range(lo,hi)
                          )
                      })

          meta={
              "revision":"SPIFLASH_API_VERIFY_V13",
              "sdk_commit":subprocess.check_output(
                  ["git","-C",str(ROOT),"rev-parse","HEAD"],text=True
              ).strip(),
              "sha256":hashlib.sha256(raw).hexdigest(),
              "runtime_gp":0x20026CB0,
              "runtime_base":0x2001A9A8,
              "read_like_helper":0x0DFE,
              "write_like_helper":0x0FC0,
              "memset_helper":0xAC50,
              "memcmp_helper":0xABEC,
              "strlen_helper":0xAD0C,
              "api_hits":api_hits[:600],
              "upgrade_hits":upgrade_hits[:400],
              "USB_OR_BOARD_CONTACTED":False,
              "LIVE_FLASH_AUTHORIZED":False,
              "FLASH_ALLOWED":False
          }
          (OUT/"META.json").write_text(
              json.dumps(meta,indent=2,ensure_ascii=False)+"\n"
          )

          (OUT/"SOURCE_SPI_FLASH_API_HITS.txt").write_text(
              "\n\n".join(
                  f"### {x['file']}:{x['line']}\n{x['context']}"
                  for x in api_hits
              )+"\n"
          )
          (OUT/"SOURCE_UPGRADE_HITS.txt").write_text(
              "\n\n".join(
                  f"### {x['file']}:{x['line']} [{', '.join(x['matched'])}]\n{x['context']}"
                  for x in upgrade_hits
              )+"\n"
          )
          PYCODE

      - name: Build GNU NDS32 objdump
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/v13/toolchain /tmp/v13/build
          cd /tmp/v13/toolchain
          curl -fL --retry 3 --connect-timeout 20 \
            https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz \
            -o binutils-2.44.tar.xz
          tar -xf binutils-2.44.tar.xz
          cd /tmp/v13/build
          ../toolchain/binutils-2.44/configure \
            --target=nds32le-elf \
            --disable-nls --disable-werror --disable-gdb \
            --disable-gprofng --disable-gas --disable-ld --disable-gold \
            >/tmp/v13/evidence/NDS32_BUILD.log 2>&1
          make -j2 all-binutils >>/tmp/v13/evidence/NDS32_BUILD.log 2>&1
          find /tmp/v13/build -type f -name '*objdump' -perm -111 -print \
            > /tmp/v13/evidence/OBJDUMP_CANDIDATES.txt

      - name: Disassemble
        shell: bash
        run: |
          set -euo pipefail
          OBJDUMP="$(find /tmp/v13/build -type f -name '*objdump' -perm -111 | head -1)"
          "$OBJDUMP" -D -b binary -m nds32 --adjust-vma=0 \
            /tmp/v13/evidence/flash_data_65536.bin \
            > /tmp/v13/evidence/NDS32_DISASSEMBLY.txt \
            2>/tmp/v13/evidence/NDS32_DISASSEMBLY.stderr.txt

      - name: Prove flash read/write roles and verify sequence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import collections,json,re

          OUT=Path("/tmp/v13/evidence")
          raw=(OUT/"flash_data_65536.bin").read_bytes()
          meta=json.loads((OUT/"META.json").read_text())

          READ=meta["read_like_helper"]
          WRITE=meta["write_like_helper"]
          MEMSET=meta["memset_helper"]
          MEMCMP=meta["memcmp_helper"]
          STRLEN=meta["strlen_helper"]

          lines=(OUT/"NDS32_DISASSEMBLY.txt").read_text(errors="replace").splitlines()
          rr=re.compile(
              r"^\s*([0-9A-Fa-f]+):\s+(?:[0-9A-Fa-f]{2,8}\s+)+(.+?)\s*$"
          )
          ins=[]
          for ln,line in enumerate(lines,1):
              m=rr.match(line)
              if m:
                  ins.append({
                      "line":ln,"addr":int(m.group(1),16),
                      "text":m.group(2).strip(),"raw":line
                  })
          by_addr={x["addr"]:i for i,x in enumerate(ins)}

          jal_rx=re.compile(r"\bjal\s+(?:0x)?([0-9A-Fa-f]+)\b",re.I)
          ret_rx=re.compile(r"\b(ret|ret5|jr\s+\$lp|pop25)\b",re.I)
          mem_rx=re.compile(
              r"\b(?P<op>lbi|lbsi|lhi|lhsi|lwi|sbi|shi|swi)"
              r"(?:\.[A-Za-z0-9]+)?\s+"
              r"(?P<rt>\$[A-Za-z0-9]+)\s*,\s*"
              r"\[(?P<base>\$[A-Za-z0-9]+)",
              re.I
          )

          # Helper body classifier.
          def helper_body(target,max_ins=320):
              idx=by_addr[target]
              ends=[
                  j for j in range(idx+1,min(len(ins),idx+max_ins))
                  if ret_rx.search(ins[j]["text"])
              ]
              end=ends[0] if ends else min(len(ins)-1,idx+max_ins-1)
              return ins[idx:end+1]

          helper_report={}
          for name,target in [
              ("read_like",READ),("write_like",WRITE),
              ("memset",MEMSET),("memcmp",MEMCMP),("strlen",STRLEN)
          ]:
              rows=helper_body(target)
              loads=[]
              stores=[]
              calls=[]
              for x in rows:
                  mm=mem_rx.search(x["text"])
                  if mm:
                      rec={
                          "addr":x["addr"],
                          "op":mm.group("op").lower(),
                          "rt":mm.group("rt"),
                          "base":mm.group("base"),
                          "text":x["text"]
                      }
                      if rec["op"].startswith("l"):
                          loads.append(rec)
                      else:
                          stores.append(rec)
                  jm=jal_rx.search(x["text"])
                  if jm:
                      calls.append({
                          "addr":x["addr"],
                          "target":int(jm.group(1),16),
                          "text":x["text"]
                      })

              helper_report[name]={
                  "target":target,
                  "start":rows[0]["addr"],
                  "end":rows[-1]["addr"],
                  "loads":loads,
                  "stores":stores,
                  "calls":calls,
                  "body":"\n".join(x["raw"] for x in rows)
              }
              (OUT/f"HELPER_{target:04X}.asm").write_text(
                  helper_report[name]["body"]+"\n"
              )

          # Direction proof for first two args:
          # READ saves input r1 -> r7 and stores controller data through r7.
          read_dest_writes=[
              x for x in helper_report["read_like"]["stores"]
              if x["base"]=="$r7"
          ]
          # WRITE saves input r1 -> r6 and loads payload through r6.
          write_source_reads=[
              x for x in helper_report["write_like"]["loads"]
              if x["base"]=="$r6"
          ]

          # All calls to read/write-like helpers.
          calls=[]
          for idx,x in enumerate(ins):
              jm=jal_rx.search(x["text"])
              if not jm:
                  continue
              target=int(jm.group(1),16)
              if target in (READ,WRITE,MEMSET,MEMCMP):
                  calls.append({
                      "idx":idx,"addr":x["addr"],"target":target,
                      "text":x["text"]
                  })

          # Exact verification sequence around 55xx.
          flow_rows=[x for x in ins if 0x5560<=x["addr"]<=0x5624]
          flow_calls=[]
          for x in flow_rows:
              jm=jal_rx.search(x["text"])
              if jm:
                  target=int(jm.group(1),16)
                  flow_calls.append({
                      "addr":x["addr"],"target":target,"text":x["text"]
                  })

          expected=[
              (0x55B8,WRITE),
              (0x55C4,MEMSET),
              (0x55F6,READ),
              (0x5602,MEMCMP),
          ]
          sequence_matches=all(
              any(c["addr"]==a and c["target"]==t for c in flow_calls)
              for a,t in expected
          )

          # Recover normalized address-building instruction signature before
          # WRITE @55B8 and READ @55F6.  Both are expected to build a little-
          # endian u32 from r6+8..+11, then subtract 0x1000.
          def preceding_signature(call_addr):
              idx=by_addr[call_addr]
              rows=ins[max(0,idx-18):idx]
              keep=[]
              for x in rows:
                  t=x["text"]
                  if (
                      "$r6 + #8" in t or "$r6 + #9" in t or
                      "$r6 + #0xa" in t or "$r6 + #0xb" in t or
                      "slli" in t or "or33" in t or
                      ("addi" in t and "#-4096" in t)
                  ):
                      # strip address/raw bytes; compare only asm mnemonic text
                      keep.append(t)
              return keep

          sig_write=preceding_signature(0x55B8)
          sig_read=preceding_signature(0x55F6)

          # Because the two sequences use the same destination/source registers,
          # exact text equality is meaningful after limiting to the address-build ops.
          same_address_builder=(sig_write==sig_read and len(sig_write)>=8)

          # Full exact region.
          (OUT/"VERIFY_FLOW_5560_5624.asm").write_text(
              "\n".join(x["raw"] for x in flow_rows)+"\n"
          )

          # Search all places where WRITE is followed later by READ using the same
          # helper pair within 80 instructions (static pattern only).
          write_read_pairs=[]
          for c in calls:
              if c["target"]!=WRITE:
                  continue
              later=[
                  d for d in calls
                  if d["idx"]>c["idx"] and d["idx"]<=c["idx"]+80
                  and d["target"]==READ
              ]
              if later:
                  write_read_pairs.append({
                      "write_addr":c["addr"],
                      "read_addr":later[0]["addr"],
                      "instruction_distance":later[0]["idx"]-c["idx"]
                  })

          # Source evidence filtered to strongest contexts.
          api_hits=meta["api_hits"]
          strong_source=[]
          for h in api_hits:
              low=h["context"].lower()
              if (
                  "spiflashread" in low or "spiflashwrite" in low or
                  "spiflasherase" in low
              ):
                  strong_source.append(h)

          upgrade_hits=meta["upgrade_hits"]

          result={
              "revision":"SPIFLASH_API_VERIFY_V13",
              "helper_report":helper_report,
              "read_destination_writes":read_dest_writes,
              "write_source_reads":write_source_reads,
              "verify_flow_calls":flow_calls,
              "verify_sequence_matches":sequence_matches,
              "write_address_signature":sig_write,
              "read_address_signature":sig_read,
              "same_address_builder":same_address_builder,
              "write_read_pairs":write_read_pairs,
              "source_api_hits":strong_source[:250],
              "source_upgrade_hits":upgrade_hits[:250],
              "USB_OR_BOARD_CONTACTED":False,
              "LIVE_FLASH_AUTHORIZED":False,
              "FLASH_ALLOWED":False
          }
          (OUT/"SPIFLASH_API_VERIFY.json").write_text(
              json.dumps(result,indent=2,ensure_ascii=False)+"\n"
          )

          md=[
              "# BP1048P4 SPI Flash API + Verify Flow V13",
              "",
              f"64 KiB SHA256: `{meta['sha256']}`",
              "",
              "## Helper direction evidence",
              f"- `0x{READ:04X}`: stores through saved input-buffer register `$r7`: "
              f"**{len(read_dest_writes)}** matching store(s)",
          ]
          for x in read_dest_writes[:12]:
              md.append(f"  - `0x{x['addr']:04X}` `{x['text']}`")
          md.append(
              f"- `0x{WRITE:04X}`: loads payload through saved input-buffer register `$r6`: "
              f"**{len(write_source_reads)}** matching load(s)"
          )
          for x in write_source_reads[:20]:
              md.append(f"  - `0x{x['addr']:04X}` `{x['text']}`")

          md+=["","## 0x55xx write-clear-read-compare sequence"]
          md.append(f"- expected sequence present: **{sequence_matches}**")
          for c in flow_calls:
              label={
                  WRITE:"WRITE-like",
                  READ:"READ-like",
                  MEMSET:"memset",
                  MEMCMP:"memcmp"
              }.get(c["target"],f"0x{c['target']:04X}")
              md.append(
                  f"- `0x{c['addr']:04X}` → `0x{c['target']:04X}` **{label}**"
              )

          md+=["","## Address builder before WRITE and READ"]
          md.append(f"- same normalized address-builder sequence: **{same_address_builder}**")
          md.append("### Before WRITE-like 0x55B8")
          for t in sig_write:
              md.append(f"- `{t}`")
          md.append("### Before READ-like 0x55F6")
          for t in sig_read:
              md.append(f"- `{t}`")

          md+=["","## Static WRITE→READ pairs elsewhere"]
          if write_read_pairs:
              for p in write_read_pairs[:80]:
                  md.append(
                      f"- WRITE `0x{p['write_addr']:04X}` → READ `0x{p['read_addr']:04X}` "
                      f"after {p['instruction_distance']} instructions"
                  )
          else:
              md.append("- none in bounded scan")

          md+=["","## Exact 0x5560–0x5624 assembly"]
          for x in flow_rows:
              md.append("    "+x["raw"])

          md+=["","## Public SDK SPI flash API source evidence"]
          if strong_source:
              for h in strong_source[:40]:
                  md.append(f"### `{h['file']}:{h['line']}`")
                  for line in h["context"].splitlines():
                      md.append("    "+line)
          else:
              md.append("- no source prototype/usage hit found")

          md+=["","## Upgrade-source write/readback evidence"]
          if upgrade_hits:
              shown=0
              seen=set()
              for h in upgrade_hits:
                  key=(h["file"],h["line"])
                  if key in seen:
                      continue
                  seen.add(key)
                  md.append(
                      f"### `{h['file']}:{h['line']}` — "
                      f"{', '.join(h['matched'])}"
                  )
                  for line in h["context"].splitlines():
                      md.append("    "+line)
                  shown+=1
                  if shown>=24:
                      break
          else:
              md.append("- none")

          md+=["","## Interpretation"]
          md.append("- If SDK prototypes/usage match the binary argument order, `0x0DFE` can be promoted from generic read-like to `SpiFlashRead`-like and `0x0FC0` from generic write-like to `SpiFlashWrite`-like.")
          md.append("- The sequence `WRITE-like → memset → READ-like → memcmp` using the same reconstructed address is strong evidence of a write/readback verification path, not a USB command-string comparison.")
          md.append("- This workflow performs no live flash operation; it only analyzes the embedded 64 KiB image and public source.")
          md.append("- USB/board contacted: **NO**")
          md.append("- Flash read/erase/write executed: **NO**")
          md.append("- `FLASH_ALLOWED=NO`")

          (OUT/"SPIFLASH_API_VERIFY_SUMMARY.md").write_text(
              "\n".join(md)+"\n"
          )
          PYCODE

      - name: Publish summary
        shell: bash
        run: |
          set -euo pipefail
          cat /tmp/v13/evidence/SPIFLASH_API_VERIFY_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Package evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v13/evidence
          zip -9 -r /tmp/OKN_BP1048P4_SPIFLASH_API_VERIFY_V13_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/OKN_BP1048P4_SPIFLASH_API_VERIFY_V13_EVIDENCE.zip \
            > /tmp/OKN_BP1048P4_SPIFLASH_API_VERIFY_V13_EVIDENCE.zip.sha256

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: OKN-BP1048P4-SPIFLASH-API-VERIFY-V13-EVIDENCE
          path: |
            /tmp/OKN_BP1048P4_SPIFLASH_API_VERIFY_V13_EVIDENCE.zip
            /tmp/OKN_BP1048P4_SPIFLASH_API_VERIFY_V13_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/v13/evidence/SPIFLASH_API_VERIFY.json"))
          assert d["USB_OR_BOARD_CONTACTED"] is False
          assert d["LIVE_FLASH_AUTHORIZED"] is False
          assert d["FLASH_ALLOWED"] is False
          print("SPIFLASH_API_VERIFY_V13_GATE=PASS")
          PY
          echo FLASH_ALLOWED=NO
