name: OKN BP1048P4 R69 ONE-FILE AUTO USB Reset Event Probe APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/OKN_BP1048P4_R69_ONE_FILE_AUTORUN_USB_RESET_EVENT_PROBE.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FLASH_ALLOWED: "NO"
  ERASE_ALLOWED: "NO"
  FIRMWARE_WRITE_ALLOWED: "NO"
  RUNTIME_OUTPUT_REPORT_ALLOWED: "NO"

jobs:
  build-r69:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = NO
          test "$ERASE_ALLOWED" = NO
          test "$FIRMWARE_WRITE_ALLOWED" = NO
          test "$RUNTIME_OUTPUT_REPORT_ALLOWED" = NO
          rm -rf /tmp/r69
          mkdir -p /tmp/r69/app/app/src/main/java/com/okn/r69 /tmp/r69/app/app/src/main/res/values /tmp/r69/app/app/src/main/res/xml /tmp/r69/out /tmp/r69/evidence

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail
          R=/tmp/r69/app
          cat > "$R/settings.gradle" <<'EOT'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='OKN_R69'
          include ':app'
          EOT
          cat > "$R/build.gradle" <<'EOT'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOT
          cat > "$R/app/build.gradle" <<'EOT'
          plugins { id 'com.android.application' }
          android { namespace 'com.okn.r69'; compileSdk 35
            defaultConfig { applicationId 'com.okn.r69'; minSdk 29; targetSdk 35; versionCode 690; versionName '69.0' }
          }
          EOT
          cat > "$R/app/src/main/res/values/styles.xml" <<'EOT'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:fontFamily">sans</item></style></resources>
          EOT
          cat > "$R/app/src/main/res/xml/device_filter.xml" <<'EOT'
          <?xml version="1.0" encoding="utf-8"?><resources><usb-device vendor-id="25380" product-id="5913"/></resources>
          EOT
          cat > "$R/app/src/main/AndroidManifest.xml" <<'EOT'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-feature android:name="android.hardware.usb.host" android:required="true"/>
            <application android:theme="@style/AppTheme" android:label="OKN R69 USB Reset Probe" android:allowBackup="false">
              <activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                <intent-filter><action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED"/></intent-filter>
                <meta-data android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED" android:resource="@xml/device_filter"/>
              </activity>
            </application>
          </manifest>
          EOT
          cat > "$R/app/src/main/java/com/okn/r69/MainActivity.java" <<'EOT'
          package com.okn.r69;
          import android.app.*; import android.content.*; import android.hardware.usb.*; import android.os.*; import android.widget.*; import java.util.*; import java.util.concurrent.atomic.AtomicBoolean;
          public class MainActivity extends Activity {
            static final int VID=0x6324, PID=0x1719, IFACE=4, FEATURE=0x0300, FLEN=8; static final long STABLE=2000, WATCH=12000, POLL=20;
            static final String PERM="com.okn.r69.USB_PERMISSION"; UsbManager um; UsbDevice dev; UsbDeviceConnection con; UsbInterface ui; long opened;
            TextView st,lv; Button pb; StringBuilder log=new StringBuilder(); AtomicBoolean busy=new AtomicBoolean(false); volatile int det=0,att=0;
            final BroadcastReceiver rx=new BroadcastReceiver(){ public void onReceive(Context c,Intent i){ String a=i.getAction(); UsbDevice d=i.getParcelableExtra(UsbManager.EXTRA_DEVICE);
              if(PERM.equals(a)){ boolean ok=i.getBooleanExtra(UsbManager.EXTRA_PERMISSION_GRANTED,false); add("PERMISSION "+ok+" "+desc(d)); if(ok&&d!=null) open(d); return; }
              if(UsbManager.ACTION_USB_DEVICE_DETACHED.equals(a)){det++;add("EVENT DETACH #"+det+" "+desc(d));}
              if(UsbManager.ACTION_USB_DEVICE_ATTACHED.equals(a)){att++;add("EVENT ATTACH #"+att+" "+desc(d));}
            }};
            public void onCreate(Bundle b){ super.onCreate(b); um=(UsbManager)getSystemService(USB_SERVICE); ui(); IntentFilter f=new IntentFilter(); f.addAction(PERM); f.addAction(UsbManager.ACTION_USB_DEVICE_ATTACHED); f.addAction(UsbManager.ACTION_USB_DEVICE_DETACHED); if(Build.VERSION.SDK_INT>=33) registerReceiver(rx,f,Context.RECEIVER_NOT_EXPORTED); else registerReceiver(rx,f); add("R69 started. NO flash/write. Feature AA->GET only."); scan(); }
            void ui(){ ScrollView s=new ScrollView(this); LinearLayout l=new LinearLayout(this); l.setOrientation(LinearLayout.VERTICAL); l.setPadding(24,24,24,36); s.addView(l); TextView t=new TextView(this); t.setText("OKN BP1048P4 — R69 USB Reset Event Probe"); t.setTextSize(21); l.addView(t); st=new TextView(this); l.addView(st); Button a=new Button(this); a.setText("1. SCAN"); a.setOnClickListener(v->scan()); l.addView(a); Button c=new Button(this); c.setText("2. CONNECT 6324:1719"); c.setOnClickListener(v->connect()); l.addView(c); pb=new Button(this); pb.setText("3. MANUAL AA → GET + EVENT WATCH"); pb.setEnabled(false); pb.setOnClickListener(v->probe()); l.addView(pb); Button cp=new Button(this); cp.setText("COPY LOG"); cp.setOnClickListener(v->{((android.content.ClipboardManager)getSystemService(CLIPBOARD_SERVICE)).setPrimaryClip(ClipData.newPlainText("R69",log.toString()));st.setText("Log copied");}); l.addView(cp); lv=new TextView(this); lv.setTextSize(12); l.addView(lv); setContentView(s); }
            String desc(UsbDevice d){ return d==null?"null":String.format(Locale.US,"%04X:%04X devId=%d ifaces=%d name=%s",d.getVendorId(),d.getProductId(),d.getDeviceId(),d.getInterfaceCount(),d.getDeviceName()); }
            void add(String x){ String z=SystemClock.elapsedRealtime()+" ms  "+x; log.append(z).append('\n'); runOnUiThread(()->lv.setText(log.toString())); }
            UsbDevice rt(){ for(UsbDevice d:um.getDeviceList().values()) if(d.getVendorId()==VID&&d.getProductId()==PID)return d; return null; }
            void scan(){ add("SCAN"); for(UsbDevice d:um.getDeviceList().values()) add(desc(d)); }
            void connect(){ UsbDevice d=rt(); if(d==null){st.setText("6324:1719 not found");return;} if(!um.hasPermission(d)){ PendingIntent p=PendingIntent.getBroadcast(this,0,new Intent(PERM).setPackage(getPackageName()),PendingIntent.FLAG_MUTABLE|PendingIntent.FLAG_UPDATE_CURRENT); um.requestPermission(d,p); } else open(d); }
            void open(UsbDevice d){ close(); UsbInterface f=null; for(int i=0;i<d.getInterfaceCount();i++) if(d.getInterface(i).getId()==IFACE){f=d.getInterface(i);break;} if(f==null){add("IF4 missing");return;} UsbDeviceConnection c=um.openDevice(d); if(c==null||!c.claimInterface(f,true)){add("open/claim failed"); if(c!=null)c.close();return;} dev=d;ui=f;con=c;opened=SystemClock.elapsedRealtime();pb.setEnabled(true);st.setText("Connected; wait ≥2 s");add("OPEN "+desc(d)); }
            void probe(){ if(con==null)return; long stable=SystemClock.elapsedRealtime()-opened; if(stable<STABLE){st.setText("Wait "+(STABLE-stable)+" ms");return;} if(busy.getAndSet(true))return; pb.setEnabled(false); det=att=0; final int oldId=dev.getDeviceId(); final String oldName=dev.getDeviceName(); new Thread(()->{ try{ add("PROBE stable="+stable+" oldId="+oldId); byte[] aa=new byte[FLEN]; aa[0]=(byte)0xAA; int wr=con.controlTransfer(0x21,0x09,FEATURE,IFACE,aa,aa.length,1000); add("SET AA="+wr); if(wr!=8){done("SET failed");return;} SystemClock.sleep(150); byte[] g=new byte[FLEN]; int rd=con.controlTransfer(0xA1,0x01,FEATURE,IFACE,g,g.length,1500); int first=rd>0?(g[0]&255):-1; add(String.format(Locale.US,"GET=%d first=%s",rd,first>=0?String.format("0x%02X",first):"--")); try{con.releaseInterface(ui);}catch(Throwable e){} try{con.close();}catch(Throwable e){} con=null;ui=null; add("POST-GET USB connection released; observation only"); long start=SystemClock.elapsedRealtime(); boolean absent=false,newid=false; int last=-999; String lastn=""; while(SystemClock.elapsedRealtime()-start<WATCH){ UsbDevice q=rt(); if(q==null){ if(!absent){absent=true;add("POLL runtime ABSENT");}} else { if(q.getDeviceId()!=last||!q.getDeviceName().equals(lastn)){add("POLL "+desc(q));last=q.getDeviceId();lastn=q.getDeviceName();} if(q.getDeviceId()!=oldId||!q.getDeviceName().equals(oldName))newid=true; } SystemClock.sleep(POLL);} add("SUMMARY ack55="+(first==0x55)+" detachEvents="+det+" attachEvents="+att+" absentSeen="+absent+" newRuntimeIdentitySeen="+newid+" final="+desc(rt())); done(det>0||att>0||absent||newid?"Reset/re-enumeration evidence observed":"No detach/reset evidence; runtime continuous"); }catch(Throwable e){add("EXCEPTION "+e);done("Exception; copy log");}},"R69").start(); }
            void done(String x){busy.set(false);runOnUiThread(()->{st.setText(x);pb.setEnabled(false);});}
            void close(){ if(con!=null){try{if(ui!=null)con.releaseInterface(ui);}catch(Throwable e){}try{con.close();}catch(Throwable e){}}con=null;ui=null;dev=null;if(pb!=null)pb.setEnabled(false);}
            protected void onDestroy(){close();try{unregisterReceiver(rx);}catch(Throwable e){}super.onDestroy();}
          }
          EOT

      - name: Static safety audit
        shell: bash
        run: |
          set -euo pipefail
          S=/tmp/r69/app/app/src/main/java/com/okn/r69/MainActivity.java
          grep -q 'controlTransfer(0x21,0x09,FEATURE' "$S"
          grep -q 'controlTransfer(0xA1,0x01,FEATURE' "$S"
          grep -q 'ACTION_USB_DEVICE_DETACHED' "$S"
          grep -q 'ACTION_USB_DEVICE_ATTACHED' "$S"
          grep -q 'POLL=20' "$S"
          ! grep -q '0x0200' "$S"
          ! grep -q 'SpiFlashErase' "$S"
          ! grep -q 'SpiFlashWrite' "$S"
          ! grep -q 'MV_UserWriteData' "$S"
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          t=Path('/tmp/r69/app/app/src/main/java/com/okn/r69/MainActivity.java').read_text()
          calls=re.findall(r'con\.controlTransfer\((0x[0-9A-Fa-f]+),(0x[0-9A-Fa-f]+)',t)
          assert set(calls)=={('0x21','0x09'),('0xA1','0x01')},calls
          d={'allowed_control_transfers':calls,'detach_attach_events':True,'poll_ms':20,'post_get_connection_released':True,'runtime_output_report':False,'flash_write':False,'flash_erase':False,'flash_allowed':False}
          Path('/tmp/r69/evidence/01_SAFETY.json').write_text(json.dumps(d,indent=2)+'\n')
          print(d)
          PY

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/g.zip
          unzip -q /tmp/g.zip -d /tmp
          cd /tmp/r69/app
          /tmp/gradle-8.9/bin/gradle --no-daemon :app:assembleDebug | tee /tmp/r69/evidence/02_BUILD.txt
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/r69/out/OKN_BP1048P4_R69_USB_RESET_EVENT_PROBE.apk
          sha256sum /tmp/r69/out/OKN_BP1048P4_R69_USB_RESET_EVENT_PROBE.apk | tee /tmp/r69/evidence/03_APK_SHA256.txt

      - name: Package evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r69/evidence/04_README_TH.txt <<'EOT'
          R69 distinguishes a true no-jump case from a very fast USB reset/re-enumeration.
          After Feature GET it sends no more host-to-device requests, releases IF4, closes the USB connection,
          listens for Android DETACH/ATTACH broadcasts, and polls runtime presence/deviceId every 20 ms for 12 s.
          No runtime Output report, no 0x11, no erase, no firmware write.
          FLASH_ALLOWED=NO
          EOT
          cp /tmp/r69/evidence/* /tmp/r69/out/
          cp -R /tmp/r69/app /tmp/r69/out/R69_ANDROID_SOURCE
          rm -rf /tmp/r69/out/R69_ANDROID_SOURCE/app/build /tmp/r69/out/R69_ANDROID_SOURCE/.gradle

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: R69_BP1048P4_USB_RESET_EVENT_PROBE
          path: /tmp/r69/out/*
          if-no-files-found: error
          retention-days: 90

      - name: Final gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = NO
          grep -q '"flash_allowed": false' /tmp/r69/evidence/01_SAFETY.json
          test -s /tmp/r69/out/OKN_BP1048P4_R69_USB_RESET_EVENT_PROBE.apk
          echo R69_BUILD_PASS
          echo FLASH_ALLOWED=NO
