name: Build OKN_DSP APK

on:
  push:
    paths:
      - 'OKN_DSP_V*_Source.zip'
      - '.github/workflows/build-okn-dsp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Select latest OKN_DSP source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'OKN_DSP_V*_Source.zip' -printf '%f\n' | sort -V | tail -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "No OKN_DSP_V*_Source.zip found in repository root."
            exit 1
          fi
          VERSION="${ZIP_FILE#OKN_DSP_}"
          VERSION="${VERSION%_Source.zip}"
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $ZIP_FILE ($VERSION)"

      - name: Extract and verify source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf okn_build
          mkdir okn_build
          unzip -q "${{ steps.source.outputs.zip }}" -d okn_build
          cd okn_build
          sha256sum -c SHA256SUMS.txt

      - name: Generate Android platform files
        working-directory: okn_build
        run: flutter create . --platforms=android --project-name okn_dsp --org com.okn

      - name: Set Android launcher name
        working-directory: okn_build
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/android:label="okn_dsp"/android:label="OKN_DSP"/' android/app/src/main/AndroidManifest.xml

      - name: Resolve packages
        working-directory: okn_build
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: okn_build
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: okn_build
        run: flutter build apk --release

      - name: Prepare APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp okn_build/build/app/outputs/flutter-apk/app-release.apk "release/OKN_DSP_${{ steps.source.outputs.version }}.apk"
          cd release
          sha256sum "OKN_DSP_${{ steps.source.outputs.version }}.apk" > "OKN_DSP_${{ steps.source.outputs.version }}.apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN_DSP_${{ steps.source.outputs.version }}_APK
          path: |
            release/OKN_DSP_${{ steps.source.outputs.version }}.apk
            release/OKN_DSP_${{ steps.source.outputs.version }}.apk.sha256
          if-no-files-found: error
          retention-days: 30
