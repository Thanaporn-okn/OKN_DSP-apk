name: OKN_DSP - Auto Build APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'OKN_DSP_V*_Sources.zip'
      - '.github/workflows/build-okn-dsp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: okn-dsp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Select newest source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'OKN_DSP_V*_Sources.zip' -printf '%f\n' | sort -V | tail -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: no OKN_DSP_V*_Sources.zip found in repository root"
            exit 1
          fi
          VERSION="${ZIP_FILE#OKN_DSP_}"
          VERSION="${VERSION%_Sources.zip}"
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Selected $ZIP_FILE ($VERSION)"

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _okn_build
          mkdir -p _okn_build
          unzip -q "${{ steps.source.outputs.zip }}" -d _okn_build
          PROJECT_DIR="$(dirname "$(find _okn_build -type f -name pubspec.yaml -print -quit)")"
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml not found in source ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Verify source SHA256 manifest
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -f Sources/SHA256SUMS.txt
          sha256sum -c Sources/SHA256SUMS.txt

      - name: Generate Android platform files
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter create \
            --no-pub \
            --platforms=android \
            --org com.okn \
            --project-name okn_dsp \
            .

      - name: Set Android launcher label
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:label="okn_dsp"/android:label="OKN_DSP"/' "$MANIFEST"

      - name: Resolve Flutter packages
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Analyze source
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Prepare APK + SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          APK="release/OKN_DSP_${{ steps.source.outputs.version }}.apk"
          cp "$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk" "$APK"
          sha256sum "$APK" > "$APK.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN_DSP_${{ steps.source.outputs.version }}_APK
          path: |
            release/OKN_DSP_${{ steps.source.outputs.version }}.apk
            release/OKN_DSP_${{ steps.source.outputs.version }}.apk.sha256
          if-no-files-found: error
          retention-days: 30
