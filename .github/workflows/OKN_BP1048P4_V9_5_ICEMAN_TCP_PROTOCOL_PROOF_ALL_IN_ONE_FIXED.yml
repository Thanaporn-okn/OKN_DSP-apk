name: OKN BP1048P4 V9.5 ICEMAN TCP PROTOCOL PROOF ALL IN ONE FIXED

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/OKN_BP1048P4_V9_5_ICEMAN_TCP_PROTOCOL_PROOF_ALL_IN_ONE.yml'
      - '.github/workflows/OKN_BP1048P4_V9_5_ICEMAN_TCP_PROTOCOL_PROOF_ALL_IN_ONE_FIXED.yml'

permissions:
  contents: read

env:
  FLASH_ALLOWED: "NO"
  SDK_REPO: "https://github.com/leadercxn/bp1048_sdk_v0.1.12.git"
  SDK_COMMIT: "8105bd864b04995d81c9f9ae77cb158259f39015"
  B1_EXE_REL: "MVsB1_Base_SDK/tools/b1_download_v1.7.exe"
  EXPECTED_B1_GIT_BLOB_SHA1: "dd2503e5a78d9b7c12f8b680a6be83d090adb966"
  EXPECTED_B1_SIZE: "1146395"

jobs:
  static_protocol_proof:
    name: V9.5 reconstruct ICEman TCP framing and flash-read dataflow
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          rm -rf /tmp/v95
          mkdir -p /tmp/v95/{sdk,evidence}
          cat > /tmp/v95/evidence/SAFETY.txt <<'EOF'
          MODE=OFFLINE_STATIC_REVERSE_ENGINEERING
          TARGET=b1_download_v1.7.exe
          TARGET_EXECUTED=NO
          WINE_EXECUTED=NO
          ICEMAN_CONNECTION_OPENED=NO
          PHYSICAL_DEBUG_ADAPTER_PRESENT=NO
          PHYSICAL_BP1048_BOARD_PRESENT=NO
          TCP_COMMAND_SENT=NO
          USB_COMMAND_SENT=NO
          UART_COMMAND_SENT=NO
          FLASH_READ_EXECUTED=NO
          FLASH_ERASE_EXECUTED=NO
          FLASH_WRITE_EXECUTED=NO
          FLASH_ALLOWED=NO
          EOF

      - name: Fetch pinned SDK and verify target
        shell: bash
        run: |
          set -euo pipefail
          git clone -q "$SDK_REPO" /tmp/v95/sdk-src
          git -C /tmp/v95/sdk-src checkout -q "$SDK_COMMIT"
          test "$(git -C /tmp/v95/sdk-src rev-parse HEAD)" = "$SDK_COMMIT"
          EXE="/tmp/v95/sdk-src/$B1_EXE_REL"
          test -f "$EXE"
          test "$(stat -c '%s' "$EXE")" = "$EXPECTED_B1_SIZE"
          test "$(git -C /tmp/v95/sdk-src hash-object "$B1_EXE_REL")" = "$EXPECTED_B1_GIT_BLOB_SHA1"
          git -C /tmp/v95/sdk-src rev-parse HEAD > /tmp/v95/evidence/SDK_COMMIT.txt
          git -C /tmp/v95/sdk-src hash-object "$B1_EXE_REL" > /tmp/v95/evidence/B1_GIT_BLOB_SHA1.txt
          sha256sum "$EXE" > /tmp/v95/evidence/B1_SHA256.txt
          file "$EXE" > /tmp/v95/evidence/B1_FILE_TYPE.txt

      - name: Extract symbols disassembly data and strings
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          EXE="/tmp/v95/sdk-src/$B1_EXE_REL"
          E=/tmp/v95/evidence
          nm -a -C "$EXE" > "$E/B1_NM_SYMBOLS.txt" 2>&1 || true
          objdump -d -C -l "$EXE" > "$E/B1_DISASSEMBLY.txt" 2>&1 || true
          objdump -h "$EXE" > "$E/B1_OBJDUMP_H.txt" 2>&1 || true
          objdump -p "$EXE" > "$E/B1_OBJDUMP_P.txt" 2>&1 || true
          objdump -s -j .data "$EXE" > "$E/B1_DATA_HEX.txt" 2>&1 || true
          strings -a -t x "$EXE" > "$E/B1_STRINGS_ASCII_OFFSETS.txt"

      - name: Prove ICEman transport and packet framing
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          E=Path('/tmp/v95/evidence')
          d=(E/'B1_DISASSEMBLY.txt').read_text(errors='replace')
          n=(E/'B1_NM_SYMBOLS.txt').read_text(errors='replace')
          p=(E/'B1_OBJDUMP_P.txt').read_text(errors='replace')
          s=(E/'B1_STRINGS_ASCII_OFFSETS.txt').read_text(errors='replace')

          def func(name):
              # Match exact demangled function label and stop at the next function label.
              rx=re.compile(r'(?ms)^([0-9A-Fa-f]{8}) <'+re.escape(name)+r'(?:\([^\n>]*\))?>:\n(.*?)(?=^[0-9A-Fa-f]{8} <|\Z)')
              m=rx.search(d)
              if not m:
                  raise RuntimeError('function not found: '+name)
              return int(m.group(1),16),m.group(2)

          wanted=['send_cmd','outw','outb','outh','out_io','fastin','fastout','multi_out_new','multi_in','inb','inh','inw','initial_socket','mxic_read','Verification','nds32_verify']
          F={}
          A={}
          for x in wanted:
              A[x],F[x]=func(x)
              (E/f'DISASM_{x}.txt').write_text(f'{A[x]:08x} <{x}>:\n'+F[x])

          def need(name,*patterns):
              body=F[name]
              for pat in patterns:
                  if re.search(pat,body,re.I|re.M) is None:
                      raise RuntimeError(f'{name}: missing proof pattern {pat!r}')

          # Socket transport: AF_INET=2, SOCK_STREAM=1, connect().
          need('initial_socket',r'movl\s+\$0x2,\(%esp\)',r'movl\s+\$0x1,0x4\(%esp\)',r'call\s+.*<socket>',r'call\s+.*<connect>')
          if '--port:' not in s or '2354' not in s or 'ICEman' not in s:
              raise RuntimeError('ICEman/default port strings not found')
          network=[x for x in ['socket','connect','read','write'] if re.search(r'\b'+x+r'\b',p,re.I)]
          if network != ['socket','connect','read','write']:
              raise RuntimeError('expected socket/connect/read/write imports not all present: '+repr(network))

          # Primitive command framing proven directly from util.cpp-generated machine code.
          # Request byte 1 is deliberately labelled reserved/unspecified: this client does not initialize it.
          specs={
            'send_cmd': {'cmd':'caller-supplied','request_bytes':'1','response_bytes':'2','request':'[CMD]','response':'[CMD, STATUS]'},
            'outw': {'cmd':'0x1A','request_bytes':'10','response_bytes':'2','request':'[1A, RSV, ADDR_LE32, VALUE_LE32]','response':'[1A, STATUS]'},
            'inw': {'cmd':'0x1B','request_bytes':'6','response_bytes':'6','request':'[1B, RSV, ADDR_LE32]','response':'[1B, STATUS, DATA_LE32]'},
            'fastin': {'cmd':'0x1C','request_bytes':'10','response_bytes':'LEN+2','request':'[1C, RSV, ADDR_LE32, LEN_LE32]','response':'[1C, STATUS, DATA[LEN]]'},
            'out_io': {'cmd':'0x1F','request_bytes':'2048 fixed','response_bytes':'LEN+2','request':'[1F, RSV, ADDR_LE32, LEN_LE32, RSV2, DATA...] padded/fixed to 0x800','response':'[1F, STATUS, ...]'},
            'fastout': {'cmd':'0x20','request_bytes':'LEN+12','response_bytes':'2','request':'[20, RSV, ADDR_LE32, LEN_LE32, RSV2, DATA[LEN]]','response':'[20, STATUS]'},
            'outb': {'cmd':'0x2A','request_bytes':'7','response_bytes':'2','request':'[2A, RSV, ADDR_LE32, VALUE8]','response':'[2A, STATUS]'},
            'inb': {'cmd':'0x2B','request_bytes':'6','response_bytes':'3','request':'[2B, RSV, ADDR_LE32]','response':'[2B, STATUS, DATA8]'},
            'outh': {'cmd':'0x4A','request_bytes':'8','response_bytes':'2','request':'[4A, RSV, ADDR_LE32, VALUE_LE16]','response':'[4A, STATUS]'},
            'inh': {'cmd':'0x4B','request_bytes':'6','response_bytes':'4','request':'[4B, RSV, ADDR_LE32]','response':'[4B, STATUS, DATA_LE16]'},
            'multi_out_new': {'cmd':'0x5A/0x5B/0x5C','request_bytes':'2+8*N','response_bytes':'2','request':'[CMD, COUNT8, repeated {ADDR_LE32, VALUE_LE32}]','response':'[CMD, STATUS]','count_max':256},
            'multi_in': {'cmd':'0x5D/0x5E/0x5F','request_bytes':'2+4*N','response_bytes':'2+4*N','request':'[CMD, COUNT8, repeated ADDR_LE32]','response':'[CMD, STATUS, packed data...]','count_max':256},
          }

          # Fixed-size single primitives.
          need('send_cmd',r'movl\s+\$0x1,0x8\(%esp\)',r'call\s+.*<write>',r'movl\s+\$0x2,0x8\(%esp\)',r'call\s+.*<read>',r'cmp\s+%bl',r'cmpb\s+\$0x0')
          need('outw',r'movb\s+\$0x1a',r'movl\s+\$0xa,0x8\(%esp\)',r'movl\s+\$0x2,0x8\(%esp\)',r'cmpb\s+\$0x1a')
          need('outb',r'movb\s+\$0x2a',r'movl\s+\$0x7,0x8\(%esp\)',r'movl\s+\$0x2,0x8\(%esp\)',r'cmpb\s+\$0x2a')
          need('outh',r'movb\s+\$0x4a',r'movl\s+\$0x8,0x8\(%esp\)',r'movl\s+\$0x2,0x8\(%esp\)',r'cmpb\s+\$0x4a')
          need('inb',r'movb\s+\$0x2b',r'movl\s+\$0x6,0x8\(%esp\)',r'movl\s+\$0x3,0x8\(%esp\)',r'cmpb\s+\$0x2b')
          need('inh',r'movb\s+\$0x4b',r'movl\s+\$0x6,0x8\(%esp\)',r'movl\s+\$0x4,0x8\(%esp\)',r'cmpb\s+\$0x4b')
          need('inw',r'movb\s+\$0x1b',r'movl\s+\$0x6,0x8\(%esp\)',r'movl\s+\$0x6,0x8\(%esp\)',r'cmpb\s+\$0x1b')

          # Bulk primitives.
          need('fastin',r'movb\s+\$0x1c',r'movl\s+\$0xa,0x8\(%esp\)',r'lea\s+0x2\(%ebx\)',r'0x22\(%esp,%eax,1\)',r'cmpb\s+\$0x1c')
          need('fastout',r'movb\s+\$0x20',r'add\s+\$0xc,%ebx',r'call\s+.*<memcpy>',r'movl\s+\$0x2,0x8\(%esp\)',r'cmpb\s+\$0x20')
          need('out_io',r'movb\s+\$0x1f',r'movl\s+\$0x800,0x8\(%esp\)',r'add\s+\$0x2,%ebx',r'cmpb\s+\$0x1f')
          # GNU objdump prints either `cmp` or `cmpl` depending on operand form. Accept both.
          need('multi_out_new',r'cmp(?:l)?\s+\$0x100',r'cmp(?:l)?\s+\$0x5a',r'cmp(?:l)?\s+\$0x5b',r'cmp(?:l)?\s+\$0x5c',r'lea\s+0x2\(,%eax,8\)')
          need('multi_in',r'cmp(?:l)?\s+\$0x100',r'cmp(?:l)?\s+\$0x5d',r'cmp(?:l)?\s+\$0x5e',r'cmp(?:l)?\s+\$0x5f',r'lea\s+0x2\(,%esi,4\)')

          out={
            'target':'b1_download_v1.7.exe',
            'transport':'TCP socket client to ICEman',
            'iceman_default_port':2354,
            'byte_order':'little-endian for address/value/length fields',
            'request_byte_1':'reserved/unspecified by this client for single-address operations',
            'response_byte_1':'status; explicitly checked by send_cmd/outw and otherwise often ignored by read helpers',
            'packet_primitives':specs,
            'FLASH_ALLOWED':False,
          }
          (E/'V9_5_ICEMAN_PACKET_MAP.json').write_text(json.dumps(out,indent=2)+'\n')
          PY

      - name: Prove debugger flash read path to ICEman fastin
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          E=Path('/tmp/v95/evidence')
          d=(E/'B1_DISASSEMBLY.txt').read_text(errors='replace')
          n=(E/'B1_NM_SYMBOLS.txt').read_text(errors='replace')

          def fn(name):
              m=re.search(r'(?ms)^([0-9A-Fa-f]{8}) <'+re.escape(name)+r'(?:\([^\n>]*\))?>:\n(.*?)(?=^[0-9A-Fa-f]{8} <|\Z)',d)
              if not m: raise RuntimeError('missing '+name)
              return int(m.group(1),16),m.group(2)
          def need(body,*patterns):
              for pat in patterns:
                  if not re.search(pat,body,re.I|re.M):
                      raise RuntimeError('missing pattern '+pat)

          ma,m=fn('mxic_read')
          fa,f=fn('fastin')
          va,v=fn('Verification')
          na,nv=fn('nds32_verify')

          # mxic_read uses a fixed 1 KiB read window implemented as two 512-byte fastin reads.
          need(m,
               r'lea\s+0x400\(%ebx\),%edi',
               r'movl\s+\$0x40007014,\(%esp\)',
               r'call\s+.*<outw',
               r'movl\s+\$0xb,\(%esp\)',
               r'call\s+.*<SpiCodeFlashSendCmd_Multi',
               r'add\s+\$0x200,%ebx',
               r'movl\s+\$0x200,0x4\(%esp\)',
               r'movl\s+\$0x40007002,\(%esp\)',
               r'call\s+.*<fastin',
               r'cmp\s+%edi,%ebx')

          # Verify layer caps comparison chunks at 0x400 and calls gpFlash->read through slot +0x0C.
          need(v,r'cmp\s+\$0x400,%edi',r'mov\s+\$0x400,%ebp',r'call\s+\*0xc\(%eax\)',r'call\s+.*<strncmp>')
          need(nv,r'call\s+.*<Verification')

          # Main selects flash_MXIC into gpFlash; preserve direct evidence for structure correlation.
          if 'movl   $0x4143c0,0x421060' not in d:
              raise RuntimeError('gpFlash <- flash_MXIC assignment not found')
          if not re.search(r'004143c0\s+[Dd]\s+flash_MXIC',n):
              raise RuntimeError('flash_MXIC symbol not found')
          if not re.search(r'00421060\s+[Bb]\s+gpFlash',n):
              raise RuntimeError('gpFlash symbol not found')

          # Direct main call sites also pass length 0x400 to mxic_read.
          direct=len(re.findall(r'call\s+\s*4036e0\s+<mxic_read',d))
          if direct < 4:
              raise RuntimeError('unexpectedly few direct mxic_read call sites: '+str(direct))

          out={
            'mxic_read_address':f'0x{ma:08X}',
            'fastin_address':f'0x{fa:08X}',
            'verification_address':f'0x{va:08X}',
            'flash_controller_address_register':'0x40007014',
            'flash_controller_data_register':'0x40007002',
            'spi_flash_command':'0x0B FAST READ',
            'mxic_read_effective_window_bytes':1024,
            'mxic_read_fastin_calls_per_window':2,
            'fastin_bytes_per_call':512,
            'verification_chunk_cap_bytes':1024,
            'gpFlash_symbol':'0x00421060',
            'flash_MXIC_symbol':'0x004143C0',
            'gpFlash_read_slot_offset':'0x0C',
            'direct_mxic_read_call_sites':direct,
            'dataflow':'Flash -> BP1048 memory-mapped SPI controller -> ICEman fastin read -> downloader buffer -> Verification/Record_content',
            'stock_bp1048_usb_involved':False,
            'FLASH_ALLOWED':False,
          }
          (E/'V9_5_FLASH_READ_DATAFLOW.json').write_text(json.dumps(out,indent=2)+'\n')
          PY

      - name: Build V9.5 report and protocol spec
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          python3 - <<'PY'
          from pathlib import Path
          import json
          E=Path('/tmp/v95/evidence')
          p=json.loads((E/'V9_5_ICEMAN_PACKET_MAP.json').read_text())
          f=json.loads((E/'V9_5_FLASH_READ_DATAFLOW.json').read_text())

          rows=[]
          for name,x in p['packet_primitives'].items():
              rows.append(f"| `{name}` | `{x['cmd']}` | {x['request_bytes']} | {x['response_bytes']} | `{x['request']}` | `{x['response']}` |")
          md=[
            '# BP1048P4 V9.5 — ICEman TCP protocol proof','',
            '- `b1_download_v1.7.exe` is a TCP client to **ICEman**, default port **2354**.',
            '- The following frame map is reconstructed directly from the downloader machine code; the target EXE was never executed.',
            '- Multi-byte address/value/length fields are little-endian.',
            '- Byte 1 in single-address requests is not initialized by this client, so V9.5 labels it **RSV/unspecified** rather than assuming zero.',
            '- Response byte 1 behaves as status; some read helpers only validate the echoed command byte.',
            '',
            '| Helper | Cmd | Request size | Response size | Request | Response |',
            '|---|---:|---:|---:|---|---|',
            *rows,
            '',
            '## Flash read dataflow','',
            f"- `mxic_read` sets flash address via `{f['flash_controller_address_register']}`.",
            f"- It issues SPI `{f['spi_flash_command']}` through `SpiCodeFlashSendCmd_Multi`.",
            f"- It reads from `{f['flash_controller_data_register']}` using ICEman `fastin`.",
            f"- One `mxic_read` window is **{f['mxic_read_effective_window_bytes']} bytes**, implemented as **{f['mxic_read_fastin_calls_per_window']} × {f['fastin_bytes_per_call']}-byte** reads.",
            '- `Verification` caps chunks at 0x400 bytes and dispatches through `gpFlash + 0x0C`; main assigns `gpFlash = flash_MXIC`.',
            '- This proves a debugger/ICE readback route, **not** a stock BP1048 runtime/recovery USB firmware-dump route.',
            '- `FLASH_ALLOWED=NO`; no socket connection, target read, erase, or write occurred.'
          ]
          (E/'V9_5_REPORT.md').write_text('\n'.join(md)+'\n')
          (E/'V9_5_PROTOCOL_SPEC.md').write_text('\n'.join(md)+'\n')

          result={
            'iceman_tcp_protocol_frame_map_proven':True,
            'iceman_default_port':2354,
            'debugger_flash_read_dataflow_proven':True,
            'mxic_read_window_bytes':1024,
            'fastin_chunk_bytes':512,
            'stock_runtime_usb_flash_dump_path_proven':False,
            'stock_recovery_usb_flash_dump_path_proven':False,
            'android_direct_usb_flash_dump_path_proven':False,
            'next_target':'classify ICEman server-side/adapter requirement and determine whether a compatible non-proprietary transport can implement the same register read operations',
            'FLASH_ALLOWED':False,
          }
          (E/'V9_5_RESULT.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
          cat /tmp/v95/evidence/V9_5_REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Final fail-closed assertions
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          python3 - <<'PY'
          from pathlib import Path
          import json
          E=Path('/tmp/v95/evidence')
          s=(E/'SAFETY.txt').read_text()
          for x in ['TARGET_EXECUTED=NO','ICEMAN_CONNECTION_OPENED=NO','TCP_COMMAND_SENT=NO','FLASH_READ_EXECUTED=NO','FLASH_ERASE_EXECUTED=NO','FLASH_WRITE_EXECUTED=NO','FLASH_ALLOWED=NO']:
              assert x in s
          assert (E/'SDK_COMMIT.txt').read_text().strip() == '8105bd864b04995d81c9f9ae77cb158259f39015'
          assert (E/'B1_GIT_BLOB_SHA1.txt').read_text().strip() == 'dd2503e5a78d9b7c12f8b680a6be83d090adb966'
          p=json.loads((E/'V9_5_ICEMAN_PACKET_MAP.json').read_text())
          f=json.loads((E/'V9_5_FLASH_READ_DATAFLOW.json').read_text())
          r=json.loads((E/'V9_5_RESULT.json').read_text())
          assert p['iceman_default_port'] == 2354
          assert p['packet_primitives']['fastin']['cmd'] == '0x1C'
          assert p['packet_primitives']['inw']['cmd'] == '0x1B'
          assert p['packet_primitives']['outw']['cmd'] == '0x1A'
          assert f['mxic_read_effective_window_bytes'] == 1024
          assert f['fastin_bytes_per_call'] == 512
          assert f['stock_bp1048_usb_involved'] is False
          assert r['iceman_tcp_protocol_frame_map_proven'] is True
          assert r['debugger_flash_read_dataflow_proven'] is True
          assert r['stock_runtime_usb_flash_dump_path_proven'] is False
          assert r['stock_recovery_usb_flash_dump_path_proven'] is False
          assert r['FLASH_ALLOWED'] is False
          print('V9_5_ICEMAN_PROTOCOL_PROOF_COMPLETE=YES')
          print('FLASH_ALLOWED=NO')
          PY

      - name: Package V9.5 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          cd /tmp/v95/evidence
          zip -9 -r /tmp/OKN_BP1048P4_V9_5_ICEMAN_PROTOCOL_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/OKN_BP1048P4_V9_5_ICEMAN_PROTOCOL_EVIDENCE.zip > /tmp/OKN_BP1048P4_V9_5_ICEMAN_PROTOCOL_EVIDENCE.zip.sha256

      - name: Upload V9.5 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OKN-BP1048P4-V9_5-ICEMAN-PROTOCOL-EVIDENCE
          path: |
            /tmp/OKN_BP1048P4_V9_5_ICEMAN_PROTOCOL_EVIDENCE.zip
            /tmp/OKN_BP1048P4_V9_5_ICEMAN_PROTOCOL_EVIDENCE.zip.sha256
            /tmp/v95/evidence/V9_5_REPORT.md
            /tmp/v95/evidence/V9_5_RESULT.json
            /tmp/v95/evidence/V9_5_PROTOCOL_SPEC.md
            /tmp/v95/evidence/V9_5_ICEMAN_PACKET_MAP.json
            /tmp/v95/evidence/V9_5_FLASH_READ_DATAFLOW.json
            /tmp/v95/evidence/DISASM_*.txt
            /tmp/v95/evidence/B1_NM_SYMBOLS.txt
            /tmp/v95/evidence/B1_DATA_HEX.txt
            /tmp/v95/evidence/B1_SHA256.txt
            /tmp/v95/evidence/B1_GIT_BLOB_SHA1.txt
            /tmp/v95/evidence/SDK_COMMIT.txt
            /tmp/v95/evidence/SAFETY.txt
          if-no-files-found: warn
          retention-days: 90
