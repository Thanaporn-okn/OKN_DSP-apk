name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project ZIP
        run: |
          rm -rf android_project
          mkdir android_project
          unzip -q OKN_DSP_ANDROID_V1.zip -d android_project
          echo "=== extracted files ==="
          find android_project -maxdepth 3 -type f | sort | head -100

      - name: Build debug APK
        run: |
          gradle -p android_project :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-debug-apk
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
