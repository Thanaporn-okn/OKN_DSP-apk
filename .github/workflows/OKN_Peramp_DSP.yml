name: Build OKN Peramp DSP V6 - VISIBLE VERIFIED WRITE

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/OKN_Peramp_DSP.yml'
      - '.github/workflows/OKN_Peramp_DSP_V1_ONE_FILE.yml'

permissions:
  contents: read

concurrency:
  group: okn-peramp-dsp-v6-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.9'
  ANDROID_PLATFORM: 'android-35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  V1_WORKFLOW: '.github/workflows/OKN_Peramp_DSP_V1_ONE_FILE.yml'
  PATCH_SHA256: '98e8feb3dfddcf6b55851af1ff86ab69c9e944f6c4658ac1b7271f82116ea4f8'
  V3_PATCH_SHA256: 'e042d68841a9564ced9a126d3eababa6666d066298417c003c89c32e8a9f8273'
  V4_PATCH_SHA256: 'a15d48fe5baeaa929e43b2053538316738dc9b70e5dfe0fd678e079fb406e39e'
  V5_PATCH_SHA256: 'ff84265141a52970421d07e84a36d82ae2d826309f7ee8828ea18384b754f7ca'
  V6_PATCH_SHA256: 'a4deec0960f447113b228b8df238f19a19bd1db67cfc3bdabf11d087a096f9c9'

jobs:
  build-apk:
    name: Build OKN Peramp DSP V6 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore V1 source and apply V2 + V3 + V4 + V5 + V6 patches
        shell: bash
        run: |
          set -euo pipefail
          test -s "$V1_WORKFLOW"

          WORK="$RUNNER_TEMP/okn_peramp_dsp_v2"
          V1_B64="$RUNNER_TEMP/okn_v1.b64"
          V1_TGZ="$RUNNER_TEMP/okn_v1.tar.gz"
          PATCH_B64="$RUNNER_TEMP/v2_patch.b64"
          PATCH_GZ="$RUNNER_TEMP/v2.patch.gz"
          PATCH_FILE="$RUNNER_TEMP/v2.patch"
          rm -rf "$WORK" "$V1_B64" "$V1_TGZ" "$PATCH_B64" "$PATCH_GZ" "$PATCH_FILE"
          mkdir -p "$WORK"

          awk '
            /cat > "\$B64" <<'"'"'OKN_SOURCE_B64'"'"'/ {capture=1; next}
            capture && /^[[:space:]]+OKN_SOURCE_B64[[:space:]]*$/ {capture=0; exit}
            capture {print}
          ' "$V1_WORKFLOW" > "$V1_B64"
          test -s "$V1_B64"
          tr -d ' \n\r\t' < "$V1_B64" | base64 --decode > "$V1_TGZ"

          V1_SHA="$(sed -n "s/^[[:space:]]*SOURCE_SHA256:[[:space:]]*'\([0-9a-f]*\)'.*/\1/p" "$V1_WORKFLOW" | head -1)"
          test -n "$V1_SHA"
          echo "$V1_SHA  $V1_TGZ" | sha256sum -c -
          tar -xzf "$V1_TGZ" -C "$WORK"

          cat > "$PATCH_B64" <<'OKN_V2_PATCH_B64'
