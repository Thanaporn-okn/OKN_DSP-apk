name: Build OKN Peramp DSP V2 - FAST ONE FILE

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/OKN_Peramp_DSP_V2_FAST_ONE_FILE.yml'
      - '.github/workflows/OKN_Peramp_DSP_V1_ONE_FILE.yml'

permissions:
  contents: read

concurrency:
  group: okn-peramp-dsp-v2-fast-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.9'
  ANDROID_PLATFORM: 'android-35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  V1_WORKFLOW: '.github/workflows/OKN_Peramp_DSP_V1_ONE_FILE.yml'
  PATCH_SHA256: '98e8feb3dfddcf6b55851af1ff86ab69c9e944f6c4658ac1b7271f82116ea4f8'

jobs:
  build-apk:
    name: Build OKN Peramp DSP V2 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore V1 source and apply V2 patch
        shell: bash
        run: |
          set -euo pipefail
          test -s "$V1_WORKFLOW"

          WORK="$RUNNER_TEMP/okn_peramp_dsp_v2"
          V1_B64="$RUNNER_TEMP/okn_v1.b64"
          V1_TGZ="$RUNNER_TEMP/okn_v1.tar.gz"
          PATCH_B64="$RUNNER_TEMP/v2_patch.b64"
          PATCH_GZ="$RUNNER_TEMP/v2.patch.gz"
          PATCH_FILE="$RUNNER_TEMP/v2.patch"
          rm -rf "$WORK" "$V1_B64" "$V1_TGZ" "$PATCH_B64" "$PATCH_GZ" "$PATCH_FILE"
          mkdir -p "$WORK"

          awk '
            /cat > "\$B64" <<'"'"'OKN_SOURCE_B64'"'"'/ {capture=1; next}
            capture && /^[[:space:]]+OKN_SOURCE_B64[[:space:]]*$/ {capture=0; exit}
            capture {print}
          ' "$V1_WORKFLOW" > "$V1_B64"
          test -s "$V1_B64"
          tr -d ' \n\r\t' < "$V1_B64" | base64 --decode > "$V1_TGZ"

          V1_SHA="$(sed -n "s/^[[:space:]]*SOURCE_SHA256:[[:space:]]*'\([0-9a-f]*\)'.*/\1/p" "$V1_WORKFLOW" | head -1)"
          test -n "$V1_SHA"
          echo "$V1_SHA  $V1_TGZ" | sha256sum -c -
          tar -xzf "$V1_TGZ" -C "$WORK"

          cat > "$PATCH_B64" <<'OKN_V2_PATCH_B64'
          H4sICPzpxWoCA3YyLnBhdGNoANU8a2/bWHbf8yvuCJg1NXpTkl/ZzIwiyxl3HNuxHE8HaWBQ5JXFCUUyJGVHzRrYnQ6w06Kfii7a
