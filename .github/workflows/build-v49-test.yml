name: OKN DSP V49 Real Board Test APK

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build-v49-test.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: okn-dsp-v49-test-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.9'
  ANDROID_PLATFORM: 'android-35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  EXPECTED_ARCHIVE_SHA256: 'ac0f832837acb2f45253159a320308da7b34124656c338aa845f5473c9b8ae87'

jobs:
  build:
    name: Build installable V49 BLE test APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

