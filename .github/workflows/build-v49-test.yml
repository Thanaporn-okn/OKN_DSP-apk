      - name: Safety invariants
        shell: bash
        run: |
          set -euo pipefail
          cd "$SRC_DIR"
          grep -q "applicationId 'com.okn.dsp.v49test'" app/build.gradle
          grep -q 'android:label="OKN DSP V49 Test"' app/src/main/AndroidManifest.xml
          grep -q "static final boolean ENABLED = true" app/src/main/java/com/okn/dsp/protocol/WriteGate.java
          grep -q "ID_BASS_VOLUME" app/src/main/java/com/okn/dsp/DspProtocol.java
          grep -q "adjustBassVolumeBy(-1f)" app/src/main/java/com/okn/dsp/DspView.java
          grep -q "adjustBassVolumeBy(1f)" app/src/main/java/com/okn/dsp/DspView.java
          grep -q "BLUETOOTH_SCAN" app/src/main/AndroidManifest.xml
          grep -q "maven-central.storage-download.googleapis.com" settings.gradle
          if grep -R -nE "UsbManager|UsbDevice|usb\.host|FLASH_ERASE_WRITE|firmware flash" app/src/main/java app/src/main/AndroidManifest.xml; then
            echo 'ERROR: unexpected USB/flash path found in this V49 BLE trial build.'
            exit 1
          fi
          echo 'V49 BLE trial safety invariants: PASS'

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n1 || true)"
          fi
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/v49-gradle-build.log"
          for attempt in 1 2 3; do
            echo "=== Gradle build attempt $attempt/3 ==="
            set +e
            gradle -p "$SRC_DIR" --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee "$LOG"
            rc=${PIPESTATUS[0]}
            set -e
            if [[ "$rc" -eq 0 ]]; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]] && grep -Eqi '429|Too Many Requests|HTTP 5[0-9][0-9]|timed out|Connection reset' "$LOG"; then
              sleep_seconds=$((attempt * 20))
              echo "Transient repository/network failure detected; retrying in ${sleep_seconds}s."
              sleep "$sleep_seconds"
              continue
            fi
            exit "$rc"
          done

      - name: Package APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$SRC_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" dist/OKN_DSP_V49_49.0.0-test-debug.apk
          sha256sum dist/OKN_DSP_V49_49.0.0-test-debug.apk | tee dist/OKN_DSP_V49_49.0.0-test-debug.apk.sha256
          cat > dist/TEST_SCOPE.txt <<'TXT'
          OKN DSP V49 trial build
          Application ID: com.okn.dsp.v49test (can coexist with the normal app)
          App label: OKN DSP V49 Test
          Transport: BLE only (AB00/AB01/AB02)
          Scan accepts device names containing GOLOPINE, DSP, or OKN
          Runtime Java source: byte-identical to uploaded V49 source
          Build repository config: Google Cloud-hosted Maven Central mirror to avoid CI 429 rate limits
          BassVolume: ID8, 0..+40 dB, slider + dedicated -1/+1 dB buttons
          MasterVolume: ID2
          BassCutoff: ID9
          EQ: verified 7CH map 4,5,6,14,15,16,17
          Firmware flashing: not included
          USB-C DSP transport: not included in this V49 source
          Build signing: Android debug signing for trial installation
          TXT

      - name: Upload test APK
        uses: actions/upload-artifact@v7
        with:
          name: OKN_DSP_V49_TEST_APK
