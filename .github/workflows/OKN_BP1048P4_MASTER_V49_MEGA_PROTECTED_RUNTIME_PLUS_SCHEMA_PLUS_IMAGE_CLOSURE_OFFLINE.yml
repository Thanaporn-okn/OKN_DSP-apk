name: OKN BP1048P4 MASTER V49 MEGA PROTECTED-RUNTIME + SCHEMA + IMAGE CLOSURE OFFLINE

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/OKN_BP1048P4_MASTER_V49_MEGA_PROTECTED_RUNTIME_PLUS_SCHEMA_PLUS_IMAGE_CLOSURE_OFFLINE.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  REQUIRED_PHONE: "Samsung Galaxy S25+"
  REQUIRED_PATH: "Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only"

  V48_ARTIFACT_ID: "11302547875"
  V47_ARTIFACT_ID: "11302342592"
  V28_ARTIFACT_ID: "11296454861"
  V25_ARTIFACT_ID: "11296388948"
  V22_JIT_ARTIFACT_ID: "11295425318"
  V22_DIRECT_ARTIFACT_ID: "11295335094"
  V21_ARTIFACT_ID: "11295056015"
  V32_ARTIFACT_ID: "11298720275"
  V33_ARTIFACT_ID: "11298985578"
  FIRMWARE_CORE_ARTIFACT_ID: "10830737503"

  LIVE_DSP_ALLOWED: "NO"
  HOST_TO_DSP_IO: "NO"
  FEATURE_REPORT_ALLOWED: "NO"
  NEW_LIVE_0X11_ALLOWED: "NO"
  STARTUP_COMMAND_ALLOWED: "NO"
  AUTH_REPLY_ALLOWED: "NO"
  FLASH_ALLOWED: "NO"
  ERASE_ALLOWED: "NO"
  WRITE_ALLOWED: "NO"
  SOLDERING_ALLOWED: "NO"
  BOARD_MODIFICATION_ALLOWED: "NO"
  EXTERNAL_PROGRAMMER_ALLOWED: "NO"

jobs:
  v49:
    name: Close multiple remaining blockers from existing protected-runtime evidence OFFLINE
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Gate 0 - immutable safety and physical path
        shell: bash
        run: |
          set -euo pipefail
          test "$REQUIRED_PHONE" = "Samsung Galaxy S25+"
          test "$REQUIRED_PATH" = "Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only"
          test "$LIVE_DSP_ALLOWED" = "NO"
          test "$HOST_TO_DSP_IO" = "NO"
          test "$FEATURE_REPORT_ALLOWED" = "NO"
          test "$NEW_LIVE_0X11_ALLOWED" = "NO"
          test "$STARTUP_COMMAND_ALLOWED" = "NO"
          test "$AUTH_REPLY_ALLOWED" = "NO"
          test "$FLASH_ALLOWED" = "NO"
          test "$ERASE_ALLOWED" = "NO"
          test "$WRITE_ALLOWED" = "NO"
          test "$SOLDERING_ALLOWED" = "NO"
          test "$BOARD_MODIFICATION_ALLOWED" = "NO"
          test "$EXTERNAL_PROGRAMMER_ALLOWED" = "NO"

          rm -rf /tmp/v49
          mkdir -p /tmp/v49/{downloads,artifacts,evidence,out}

          cat > /tmp/v49/evidence/00_SCOPE.txt <<'EOF'
          REVISION=MASTER-V49
          MODE=MEGA_BATCH_OFFLINE_ONLY

          PHYSICAL REQUIREMENT:
          Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only.

          V49 combines:
          1. protected/JIT runtime evidence reconciliation,
          2. hidden updater/recovery-entry search,
          3. Device Description / CH7 / Gain-ID closure search,
          4. firmware source/object and image-feasibility reconciliation,
          5. final blocker matrix.

          No new live USB I/O, no APK, no Feature report, no 0x11,
          no auth/startup replay, no flash/erase/write.
          EOF

      - name: Gate 1 - acquire all exact prior evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          get_artifact() {
            local id="$1"
            local name="$2"
            mkdir -p "/tmp/v49/artifacts/$name"
            curl -fL --retry 5 --retry-all-errors \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              -o "/tmp/v49/downloads/${name}.zip"
            unzip -q "/tmp/v49/downloads/${name}.zip" -d "/tmp/v49/artifacts/$name"
          }

          get_artifact "$V48_ARTIFACT_ID" v48
          get_artifact "$V47_ARTIFACT_ID" v47
          get_artifact "$V28_ARTIFACT_ID" v28
          get_artifact "$V25_ARTIFACT_ID" v25
          get_artifact "$V22_JIT_ARTIFACT_ID" v22jit
          get_artifact "$V22_DIRECT_ARTIFACT_ID" v22direct
          get_artifact "$V21_ARTIFACT_ID" v21
          get_artifact "$V32_ARTIFACT_ID" v32
          get_artifact "$V33_ARTIFACT_ID" v33
          get_artifact "$FIRMWARE_CORE_ARTIFACT_ID" firmware_core

          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path("/tmp/v49/artifacts")
          seen=set()
          for _ in range(6):
              todo=[p for p in root.rglob("*.zip") if p not in seen]
              if not todo: break
              for z in todo:
                  seen.add(z)
                  d=z.with_suffix(z.suffix+".unpacked")
                  d.mkdir(parents=True,exist_ok=True)
                  try:
                      with zipfile.ZipFile(z) as q:
                          q.extractall(d)
                  except Exception:
                      pass
          print("NESTED_ZIPS",len(seen))
          PY

          find /tmp/v49/artifacts -type f -printf '%P\n' | sort \
            > /tmp/v49/evidence/01_ARTIFACT_INVENTORY.txt

      - name: Gate 2 - protected/JIT method and write-stack reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,json

          root=Path("/tmp/v49/artifacts")
          text=[]
          provenance=[]
          for p in root.rglob("*"):
              if not p.is_file() or p.stat().st_size > 5_000_000:
                  continue
              try:
                  raw=p.read_bytes()
                  if b'\x00' in raw[:4096]:
                      continue
                  s=raw.decode(errors='replace')
                  text.append(f"\n===== {p.relative_to(root)} =====\n{s}")
                  provenance.append(str(p.relative_to(root)))
              except Exception:
                  pass

          corpus="\n".join(text)

          tokens=[
              "0600043A","06000453","06000496",
              "06000783","06000784","06000795"
          ]
          names=[
              "DeviceCommunicationStream.Write",
              "HIDInterface.Send",
              "SendDeviceDescriptionRequest",
              "SendDevTypeSwVersAuthenRequest",
              "UFEcommandBridge",
              "start_up_grate","bootloader","recovery","upgrade","updater",
              "firmware update","flash update"
          ]

          token_hits={t:len(re.findall(re.escape(t),corpus,re.I)) for t in tokens}
          name_hits={n:len(re.findall(re.escape(n),corpus,re.I)) for n in names}

          # Capture exact contexts around updater/recovery/boot terms that also mention
          # known transport methods. Context is discovery evidence only.
          lines=corpus.splitlines()
          contexts=[]
          for i,line in enumerate(lines):
              if re.search(r'bootloader|recovery|upgrade|updater|firmware update|flash update|start_up_grate',line,re.I):
                  ctx="\n".join(lines[max(0,i-10):min(len(lines),i+11)])
                  if re.search(r'Write|Send|HIDInterface|DeviceCommunicationStream|UsbHID',ctx,re.I):
                      contexts.append(ctx)

          uniq=[]
          seen=set()
          for c in contexts:
              k=re.sub(r'\s+',' ',c)
              if k in seen: continue
              seen.add(k); uniq.append(c)

          result={
              "token_hits":token_hits,
              "name_hits":name_hits,
              "transport_adjacent_boot_or_update_context_count":len(uniq),
              "contexts":uniq[:500],
              "classification":"DISCOVERY_ONLY_NOT_PRODUCTION_PROOF"
          }
          Path("/tmp/v49/evidence/02_PROTECTED_RUNTIME_RECONCILIATION.json").write_text(
              json.dumps(result,indent=2,ensure_ascii=False)+"\n")
          print("CONTEXTS",len(uniq))
          PY

      - name: Gate 3 - hidden no-0x11 no-Feature updater-entry candidate filter
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          d=json.loads(Path("/tmp/v49/evidence/02_PROTECTED_RUNTIME_RECONCILIATION.json").read_text())
          candidates=[]
          for ctx in d["contexts"]:
              lower=ctx.lower()
              if "0x11" in lower or "feature" in lower:
                  continue
              if any(x in lower for x in [
                  "senddevtypeswversauthenrequest",
                  "auth reply","challenge"
              ]):
                  continue
              if any(x in lower for x in [
                  "chiperas","codedata","bootdat","constdat",
                  "cnfgdat","btupdat","upinfo","cxxx"
              ]):
                  continue
              candidates.append(ctx)

          # Existing V47/V48 are authoritative unless a candidate has an exact
          # method token + exact frame + exact production identity transition.
          promoted=[]
          for ctx in candidates:
              has_token=bool(re.search(r'0600[0-9A-Fa-f]{4}|0x0600[0-9A-Fa-f]{4}',ctx))
              has_frame=bool(re.search(r'(?:\b[0-9A-Fa-f]{2}\b[\s:,-]*){4,}',ctx))
              has_prod_transition=bool(re.search(r'6324.*1719.*(?:2244|recovery|updater)|(?:2244|recovery|updater).*6324.*1719',ctx,re.I|re.S))
              if has_token and has_frame and has_prod_transition:
                  promoted.append(ctx)

          result={
              "filtered_candidate_context_count":len(candidates),
              "promotable_exact_candidate_count":len(promoted),
              "production_safe_runtime_to_updater_no_0x11_no_feature_proven":False,
              "candidates":candidates[:300],
              "promoted":promoted[:50],
          }
          Path("/tmp/v49/evidence/03_HIDDEN_ENTRY_FILTER.json").write_text(
              json.dumps(result,indent=2,ensure_ascii=False)+"\n")
          print(json.dumps({k:v for k,v in result.items() if k not in ("candidates","promoted")},indent=2))
          PY

      - name: Gate 4 - Device Description CH7 and Gain-ID closure search
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,json

          root=Path("/tmp/v49/artifacts")
          corpus=[]
          for p in root.rglob("*"):
              if not p.is_file() or p.stat().st_size > 3_000_000:
                  continue
              try:
                  raw=p.read_bytes()
                  if b'\x00' not in raw[:4096]:
                      corpus.append(raw.decode(errors='replace'))
              except Exception:
                  pass
          s="\n".join(corpus)

          terms={
              "BiquadCascade7thChannel":len(re.findall(r'BiquadCascade7thChannel',s,re.I)),
              "i2sout1R":len(re.findall(r'i2sout1R',s,re.I)),
              "ID17_context":len(re.findall(r'(?:ID|id)\s*[:=]?\s*17',s)),
              "ID22_context":len(re.findall(r'(?:ID|id)\s*[:=]?\s*22',s)),
              "ID23_context":len(re.findall(r'(?:ID|id)\s*[:=]?\s*23',s)),
              "ID24_context":len(re.findall(r'(?:ID|id)\s*[:=]?\s*24',s)),
              "ID25_context":len(re.findall(r'(?:ID|id)\s*[:=]?\s*25',s)),
              "ID26_context":len(re.findall(r'(?:ID|id)\s*[:=]?\s*26',s)),
              "ID27_context":len(re.findall(r'(?:ID|id)\s*[:=]?\s*27',s)),
              "ID28_context":len(re.findall(r'(?:ID|id)\s*[:=]?\s*28',s)),
          }

          exact_ch7=False
          # Require explicit same nearby context, not separate occurrence.
          for m in re.finditer(r'BiquadCascade7thChannel|i2sout1R',s,re.I):
              ctx=s[max(0,m.start()-500):m.end()+500]
              if re.search(r'(?:ID|id)\s*[:=]?\s*17\b',ctx):
                  exact_ch7=True
                  break

          # Global-free cannot be proven from partial Device Description unless
          # a complete 18261-byte decoded description is present.
          complete_desc=bool(re.search(r'(?:accumulated|decoded).*18261|18261.*(?:accumulated|decoded)',s,re.I))
          gain_conflicts=[]
          if complete_desc:
              for n in range(22,29):
                  if re.search(rf'(?:ID|id)\s*[:=]?\s*{n}\b',s):
                      gain_conflicts.append(n)

          result={
              "term_counts":terms,
              "complete_18261_byte_device_description_proven":complete_desc,
              "ch7_id17_exact_same_context_proven":exact_ch7,
              "gain_ids_22_28_conflicts_if_complete":gain_conflicts,
              "gain_ids_22_28_global_free_proven": bool(complete_desc and not gain_conflicts),
          }
          Path("/tmp/v49/evidence/04_SCHEMA_GAIN_CLOSURE.json").write_text(
              json.dumps(result,indent=2)+"\n")
          print(json.dumps(result,indent=2))
          PY

      - name: Gate 5 - firmware source/object and image-feasibility closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import tarfile,hashlib,json,re,os

          root=Path("/tmp/v49/artifacts")
          candidates=list(root.rglob("*PRODUCTION_CANDIDATE_NOT_FLASHABLE.tar.gz"))
          candidate_present=bool(candidates)
          members=[]
          if candidates:
              with tarfile.open(candidates[0],"r:gz") as t:
                  for m in t.getmembers():
                      if m.isfile():
                          members.append({"name":m.name,"size":m.size})

          image_like=[
              x for x in members
              if Path(x["name"]).suffix.lower() in {".bin",".img",".mva",".fw",".rom"}
          ]
          elf_like=[
              x for x in members
              if Path(x["name"]).suffix.lower() in {".elf",".axf",".out"}
          ]
          obj_like=[
              x for x in members
              if Path(x["name"]).suffix.lower() in {".o",".a"}
          ]

          result={
              "candidate_bundle_present":candidate_present,
              "candidate_file_count":len(members),
              "image_like_files":image_like,
              "elf_like_files":elf_like,
              "object_or_archive_count":len(obj_like),
              "bootable_image_present_in_candidate":bool(image_like or elf_like),
              "production_layout_proven":False,
              "production_entry_point_proven":False,
              "candidate_flashable":False,
          }
          Path("/tmp/v49/evidence/05_IMAGE_FEASIBILITY.json").write_text(
              json.dumps(result,indent=2)+"\n")
          print(json.dumps(result,indent=2))
          PY

      - name: Gate 6 - one-pass final blocker matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          v48=json.loads(Path("/tmp/v49/artifacts/v48/14_V48_FINAL_MATRIX.json").read_text())
          hidden=json.loads(Path("/tmp/v49/evidence/03_HIDDEN_ENTRY_FILTER.json").read_text())
          schema=json.loads(Path("/tmp/v49/evidence/04_SCHEMA_GAIN_CLOSURE.json").read_text())
          image=json.loads(Path("/tmp/v49/evidence/05_IMAGE_FEASIBILITY.json").read_text())

          gates=dict(v48["gates"])
          gates["runtime_to_updater_no_0x11_no_feature_proven"] = bool(
              hidden["production_safe_runtime_to_updater_no_0x11_no_feature_proven"]
          )
          gates["ch7_id17_exact_wire_proven"] = bool(
              schema["ch7_id17_exact_same_context_proven"]
          )
          gates["gain_ids_22_28_global_free_proven"] = bool(
              schema["gain_ids_22_28_global_free_proven"]
          )
          gates["bootable_production_image_proven"] = bool(
              image["bootable_image_present_in_candidate"]
              and image["production_layout_proven"]
              and image["production_entry_point_proven"]
          )

          required=[
              "runtime_to_updater_no_0x11_no_feature_proven",
              "production_recovery_identity_proven",
              "pure_read_only_stock_backup_command_proven",
              "production_stock_backup_completed",
              "production_flash_layout_proven",
              "production_entry_point_proven",
              "bootable_production_image_proven",
              "ch7_id17_exact_wire_proven",
              "gain_ids_22_28_global_free_proven",
          ]
          blockers=[x for x in required if not gates.get(x,False)]

          # Fail closed. Even if no blockers remain, a separate reviewed live
          # workflow is required; V49 itself never authorizes flash.
          final={
              "revision":"MASTER-V49",
              "required_phone":"Samsung Galaxy S25+",
              "required_path":"Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only",
              "soldering_allowed":False,
              "board_modification_allowed":False,
              "external_programmer_allowed":False,
              "gates":gates,
              "remaining_blockers":blockers,
              "filtered_hidden_entry_candidates":
                  hidden["filtered_candidate_context_count"],
              "promotable_hidden_entry_candidates":
                  hidden["promotable_exact_candidate_count"],
              "complete_device_description_proven":
                  schema["complete_18261_byte_device_description_proven"],
              "candidate_flashable":False,
              "new_live_0x11_allowed":False,
              "feature_report_live_allowed":False,
              "host_to_dsp_io":False,
              "flash_allowed":False,
              "next_allowed_action":
                  "OFFLINE_TARGET_REMAINING_BLOCKERS_WITH_NEW_EXTERNAL_PRODUCTION_EVIDENCE"
                  if blockers else
                  "INDEPENDENT_REVIEW_BEFORE_SEPARATE_LIVE_FIRST_FLASH_WORKFLOW"
          }
          Path("/tmp/v49/evidence/06_V49_FINAL_MATRIX.json").write_text(
              json.dumps(final,indent=2)+"\n")

          md=f"""# MASTER V49 FINAL DECISION

          Physical path remains fixed:
          **Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only**

          Hardware constraints:
          - soldering: **NO**
          - board modification: **NO**
          - external programmer/JTAG/SDP/AICE: **NO**

          Combined offline closure results:
          - hidden no-0x11/non-Feature entry contexts after filtering:
            **{final['filtered_hidden_entry_candidates']}**
          - promotable exact hidden entry candidates:
            **{final['promotable_hidden_entry_candidates']}**
          - complete 18261-byte Device Description proven:
            **{final['complete_device_description_proven']}**
          - CH7 ID17 exact wire proof:
            **{gates['ch7_id17_exact_wire_proven']}**
          - Gain IDs 22..28 globally free:
            **{gates['gain_ids_22_28_global_free_proven']}**
          - bootable production image:
            **{gates['bootable_production_image_proven']}**

          Remaining blockers:
          {chr(10).join("- "+x for x in blockers) if blockers else "- NONE"}

          Hard live rules:
          - new live 0x11: **NO**
          - Feature report: **NO**
          - host-to-DSP I/O in V49: **NO**
          - flash/erase/write: **NO / NO / NO**
          - `FLASH_ALLOWED = NO`

          Next allowed action:
          **{final['next_allowed_action']}**
          """
          Path("/tmp/v49/evidence/07_V49_FINAL_DECISION.md").write_text(md)
          print(md)
          PY

          cp /tmp/v49/evidence/* /tmp/v49/out/
          (cd /tmp/v49/out && sha256sum * > SHA256SUMS.txt)

      - name: Upload V49 consolidated evidence
        uses: actions/upload-artifact@v7
        with:
          name: OKN-BP1048P4-MASTER-V49-MEGA-PROTECTED-RUNTIME-SCHEMA-IMAGE-EVIDENCE
          path: /tmp/v49/out/*
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed assertion
        shell: bash
        run: |
          set -euo pipefail
          test "$REQUIRED_PATH" = "Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only"
          test "$SOLDERING_ALLOWED" = "NO"
          test "$BOARD_MODIFICATION_ALLOWED" = "NO"
          test "$EXTERNAL_PROGRAMMER_ALLOWED" = "NO"
          test "$LIVE_DSP_ALLOWED" = "NO"
          test "$HOST_TO_DSP_IO" = "NO"
          test "$FEATURE_REPORT_ALLOWED" = "NO"
          test "$NEW_LIVE_0X11_ALLOWED" = "NO"
          test "$FLASH_ALLOWED" = "NO"
          test "$ERASE_ALLOWED" = "NO"
          test "$WRITE_ALLOWED" = "NO"
          grep -q '"flash_allowed": false' /tmp/v49/evidence/06_V49_FINAL_MATRIX.json
          echo "MASTER_V49=PASS"
          echo "S25_USB_C_ONLY=YES"
          echo "NO_SOLDER_NO_BOARD_MOD=YES"
          echo "FLASH_ALLOWED=NO"
