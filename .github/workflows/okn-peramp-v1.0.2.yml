# OKN Peramp v1.0.2 - single-file GitHub Actions workflow
# Put this file at .github/workflows/okn-peramp.yml then run "Build OKN Peramp".
# This revision adds BLE sequencing fixes and always-uploaded build diagnostics.
name: Build OKN Peramp

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - ".github/workflows/okn-peramp.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare diagnostics
        shell: bash
        run: |
          mkdir -p dist
          {
            echo "OKN Peramp CI diagnostics"
            echo "UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Runner: ${RUNNER_OS:-unknown} ${RUNNER_ARCH:-unknown}"
            echo "Commit: ${GITHUB_SHA:-unknown}"
          } > dist/ci-context.txt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          # setup-android@v3 defaults to "tools platform-tools".
          # The legacy "tools" package no longer exists on the current SDK repo,
          # so explicitly install no extra packages here.
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Accept licenses and install Android 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          sdkmanager --list_installed | grep -E "platforms;android-35|build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

