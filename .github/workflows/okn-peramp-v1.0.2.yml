      - name: Validate generated project
        shell: bash
        run: |
          set -euo pipefail
          grep -q "UFE_WRITE_ACTUATOR_COMMAND = 87" app/src/main/java/com/okn/peramp/DspProtocol.java
          grep -q "UFE_READ_SENSOR_ACTUATOR_JSON_COMMAND = 89" app/src/main/java/com/okn/peramp/DspProtocol.java
          grep -q "40af0001-9479-43f6-ae95-c45fb2afb9d2" app/src/main/java/com/okn/peramp/BleClient.java
          grep -q "0000ab00-0000-1000-8000-00805f9b34fb" app/src/main/java/com/okn/peramp/BleClient.java
          grep -q "0000ffe0-0000-1000-8000-00805f9b34fb" app/src/main/java/com/okn/peramp/BleClient.java
          grep -q "onDescriptorWrite" app/src/main/java/com/okn/peramp/BleClient.java
          grep -q "startServiceDiscovery" app/src/main/java/com/okn/peramp/BleClient.java
          python3 - <<'PY'
          import re
          s=open("app/src/main/java/com/okn/peramp/MainActivity.java", encoding="utf-8").read()
          m=re.search(r"DEFAULT_FREQS = \{([^}]*)\}", s)
          assert m, "DEFAULT_FREQS not found"
          vals=[x.strip() for x in m.group(1).split(",") if x.strip()]
          assert len(vals)==15, f"expected 15 EQ bands, got {len(vals)}"
          channels=re.search(r"CHANNEL_NAMES = \{([^}]*)\}", s)
          assert channels, "CHANNEL_NAMES not found"
          print("EQ bands:", vals)
          print("Generated project validation: PASS")
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gradle --version | tee dist/gradle-version.txt
          gradle --no-daemon --stacktrace --warning-mode all clean assembleDebug 2>&1 | tee dist/build.log

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" dist/OKN-Peramp-v1.0.2-debug.apk
          AAPT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/build-tools/35.0.0/aapt2"
          if [ -x "$AAPT" ]; then
            "$AAPT" dump badging "$APK" | tee dist/apk-badging.txt
            grep -q "package: name='com.okn.peramp.debug'" dist/apk-badging.txt
            grep -q "application-label:'OKN Peramp'" dist/apk-badging.txt
          else
            echo "aapt2 not found at $AAPT" | tee dist/apk-badging.txt
          fi
          sha256sum dist/OKN-Peramp-v1.0.2-debug.apk | tee dist/SHA256SUMS.txt

      - name: Package source
        shell: bash
        run: |
          set -euo pipefail
          zip -qr dist/OKN-Peramp-v1.0.2-source.zip settings.gradle build.gradle gradle.properties EXTRACTED_REFERENCE.md app
          ls -lh dist

      - name: Upload OKN Peramp APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN-Peramp-v1.0.2
          path: |
            dist/OKN-Peramp-v1.0.2-debug.apk
            dist/OKN-Peramp-v1.0.2-source.zip
            dist/SHA256SUMS.txt
            dist/apk-badging.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OKN-Peramp-build-diagnostics
          path: |
            dist/ci-context.txt
            dist/build.log
            dist/gradle-version.txt
            dist/apk-badging.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Write workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "# OKN Peramp build"
            echo
            if [ -s dist/OKN-Peramp-v1.0.2-debug.apk ]; then
              echo "✅ APK generated successfully."
              echo
              echo "Artifact: **OKN-Peramp-v1.0.2**"
            else
              echo "❌ APK was not generated."
              echo
              echo "Download artifact **OKN-Peramp-build-diagnostics** and inspect **build.log**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
