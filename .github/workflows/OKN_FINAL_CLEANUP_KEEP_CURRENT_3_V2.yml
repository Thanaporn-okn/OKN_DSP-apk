name: OKN Final Cleanup - Keep Only Current 3

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/OKN_FINAL_CLEANUP_KEEP_CURRENT_3_V2.yml'

permissions:
  contents: write

jobs:
  cleanup:
    name: Remove superseded DSP workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Verify workflows that must remain
        shell: bash
        run: |
          set -euo pipefail

          KEEPERS=(
            ".github/workflows/OKN_BP1048P4_MASTER_V24_AUTH_CORE_EXITFIX_CALLGRAPH_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_BP1048P4_MASTER_V25_CROSS_SESSION_CHALLENGE_CAPTURE_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_DSP_AutoBuild.yml"
          )

          for f in "${KEEPERS[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "ERROR: required keeper is missing: $f"
              exit 1
            fi
            echo "KEEP: $f"
          done

      - name: Delete superseded workflow files
        shell: bash
        run: |
          set -euo pipefail

          DELETE_FILES=(
            ".github/workflows/OKN_BP1048P4_MASTER_V15_COMMAND_CALLSITE_REPORT_OBJECT_PROOF.yml"
            ".github/workflows/OKN_BP1048P4_MASTER_V16_REAL_GOLOPINE_HANDSHAKE_CAPTURE.yml"
            ".github/workflows/OKN_BP1048P4_MASTER_V18_REAL_RESPONSE_PARSER_NEXT_COMMAND_CAPTURE.yml"
            ".github/workflows/OKN_BP1048P4_MASTER_V19_AUTH_RESPONSE_VECTOR_SWEEP.yml"
            ".github/workflows/OKN_BP1048P4_MASTER_V19_FIXED_V2_AUTH_RESPONSE_VECTOR_SWEEP.yml"
            ".github/workflows/OKN_BP1048P4_MASTER_V19_FIXED_V3_AUTH_RESPONSE_VECTOR_SWEEP.yml"
            ".github/workflows/OKN_BP1048P4_MASTER_V20_AUTH_FULL_BIT_MODEL_VALIDATION.yml"
            ".github/workflows/OKN_BP1048P4_MASTER_V21_AUTH_NONLINEAR_EXACT_METHOD_RECOVERY.yml"
            ".github/workflows/OKN_BP1048P4_MASTER_V22_AUTH_JIT_RECOVERY_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_BP1048P4_MASTER_V22_DIRECT_AUTH_METHOD_ORACLE_VALIDATION.yml"
            ".github/workflows/OKN_BP1048P4_MASTER_V23_AUTH_CORE_ISOLATION_CALLGRAPH_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_BP1048P4_MASTER_V23_AUTH_PROTOCOL_MAP_OFFLINE.yml"
            ".github/workflows/OKN_BP1048P4_MASTER_V24_AUTH_INTERMEDIATE_TRACE_POSTPROCESS_RECOVERY.yml"
            ".github/workflows/OKN_BP1048P4_MASTER_V24_FIXED_V2_AUTH_INTERMEDIATE_TRACE_POSTPROCESS_RECOVERY.yml"
            ".github/workflows/OKN_BP1048P4_V14_BOUNDED_JIT_VENDOR_GET_DEVICE_DESCRIPTION_S25_USB_C_ONLY.yml"
            ".github/workflows/OKN_BP1048P4_V17_REAL_GOLOPINE_STARTUP_HANDSHAKE_S25_USB_C_ONLY.yml"
          )

          for f in "${DELETE_FILES[@]}"; do
            if [[ -e "$f" ]]; then
              echo "DELETE: $f"
              rm -f -- "$f"
            else
              echo "SKIP (already missing): $f"
            fi
          done

      - name: Remove this one-shot cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          SELF=".github/workflows/OKN_FINAL_CLEANUP_KEEP_CURRENT_3_V2.yml"

          if [[ -e "$SELF" ]]; then
            echo "DELETE SELF: $SELF"
            rm -f -- "$SELF"
          fi

      - name: Final safety verification
        shell: bash
        run: |
          set -euo pipefail

          KEEPERS=(
            "OKN_BP1048P4_MASTER_V24_AUTH_CORE_EXITFIX_CALLGRAPH_S25_USB_C_ONLY.yml"
            "OKN_BP1048P4_MASTER_V25_CROSS_SESSION_CHALLENGE_CAPTURE_S25_USB_C_ONLY.yml"
            "OKN_DSP_AutoBuild.yml"
          )

          for name in "${KEEPERS[@]}"; do
            test -f ".github/workflows/$name" || {
              echo "ERROR: keeper disappeared: $name"
              exit 1
            }
          done

          mapfile -t REMAINING < <(
            find .github/workflows -maxdepth 1 -type f               \( -name '*.yml' -o -name '*.yaml' \)               -printf '%f\n' | sort
          )

          echo "Remaining workflows:"
          printf '  %s\n' "${REMAINING[@]}"

          if (( ${#REMAINING[@]} != 3 )); then
            echo "ERROR: expected exactly 3 workflow files, found ${#REMAINING[@]}"
            echo "Nothing will be pushed."
            exit 1
          fi

          for name in "${KEEPERS[@]}"; do
            printf '%s\n' "${REMAINING[@]}" | grep -Fxq "$name"
          done

          echo
          echo "Git changes:"
          git status --short

      - name: Commit and push cleanup
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet && git diff --cached --quiet; then
            echo "No cleanup changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A .github/workflows
          git commit -m "cleanup: keep only current DSP workflows"
          git push origin "HEAD:${GITHUB_REF_NAME}"
