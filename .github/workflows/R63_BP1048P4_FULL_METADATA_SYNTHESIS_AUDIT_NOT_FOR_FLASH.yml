          compile_vendor=${{ steps.compile_vendor.outcome }}
          compile_r51=${{ steps.compile_r51.outcome }}
          compile_audio_bridge=${{ steps.compile_audio_bridge.outcome }}
          audio_callgraph=${{ steps.audio_callgraph.outcome }}
          hid_callgraph=${{ steps.hid_callgraph.outcome }}
          compat=${{ steps.compat.outcome }}
          full_link=${{ steps.full_link.outcome }}
          final_symbol_gate=${{ steps.final_symbol_gate.outcome }}
          r57_analysis_image=${{ steps.r57_analysis_image.outcome }}
          r57_flash_contract=${{ steps.r57_flash_contract.outcome }}
          r57_layout_audit=${{ steps.r57_layout_audit.outcome }}
          r58_header_normalization=${{ steps.r58_header_normalization.outcome }}
          r63_metadata_synthesis=${{ steps.r63_metadata_synthesis.outcome }}
          r57_board_binding=${{ steps.r57_board_binding.outcome }}
          r57_recovery=${{ steps.r57_recovery.outcome }}
          r57_readiness=${{ steps.r57_readiness.outcome }}

          SAFETY STATUS: NOT FOR FLASH

          R57 creates a transient analysis-only raw image and deletes it before artifact upload.
          This stage preserves the R56F runtime proof and adds image/header/layout, board-binding, and recovery readiness audits.

          Proven in R56:
          - live vendor DAC0 stereo buffer calls R51 processing
