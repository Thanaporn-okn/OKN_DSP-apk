          nds32le-elf-readelf -lW "$ELF" > /tmp/R57_ELF_PROGRAM_HEADERS.txt
          nds32le-elf-objdump -h "$ELF" > /tmp/R57_ELF_OBJDUMP_HEADERS.txt

          wc -c "$BIN" | tee /tmp/R57_ANALYSIS_BIN_SIZE.txt
          sha256sum "$BIN" > /tmp/R57_ANALYSIS_BIN_SHA256.txt

          python3 - <<'PY'
          from pathlib import Path
          b = Path("/tmp/R57_ANALYSIS_ONLY_DO_NOT_FLASH.bin").read_bytes()
          for off, size, name in [
              (0x000000, 0x100, "BOOT_HEAD_000000"),
              (0x0000A0, 0x60,  "BOOT_META_0000A0"),
              (0x010000, 0x100, "APP_HEAD_010000"),
              (0x0100A0, 0x60,  "APP_META_0100A0"),
          ]:
              chunk = b[off:off+size]
              Path(f"/tmp/R57_{name}.hex").write_text(
                  "\n".join(
                      f"{off+i:08x}: " +
                      " ".join(f"{x:02x}" for x in chunk[i:i+16])
                      for i in range(0, len(chunk), 16)
                  ) + "\n",
                  encoding="ascii",
              )
          PY

          echo "R57_ANALYSIS_RAW_IMAGE=CREATED_TRANSIENTLY"
          echo "R57_FLASH_ACTION=NONE"

      - name: Extract BP1048P4 flash contract from pinned SDK
        id: r57_flash_contract
        if: steps.r57_analysis_image.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          SDK=/tmp/bp1048
          cat > /tmp/r57_flash_probe.c <<'EOF'
          #include "flash_config.h"
          EOF

          nds32le-elf-gcc \
            -E -dM \
            @/tmp/R55_INCLUDES.rsp \
            -DFUNC_OS_EN=1 \
            -DCFG_APP_CONFIG \
            -DHAVE_CONFIG_H \
            /tmp/r57_flash_probe.c \
            > /tmp/R57_FLASH_MACROS.txt

          python3 - <<'PY'
          from pathlib import Path
          import ast, json, re

          text = Path("/tmp/R57_FLASH_MACROS.txt").read_text(
              encoding="latin-1", errors="replace"
          )

          macros = {}
          for line in text.splitlines():
              m = re.match(r"#define\s+([A-Za-z_][A-Za-z0-9_]*)\s+(.+)$", line)
              if m:
                  macros[m.group(1)] = m.group(2).strip()

          wanted = [
              "CODE_ADDR",
              "CONST_DATA_ADDR",
              "AUDIO_EFFECT_ADDR",
              "FLASHFS_ADDR",
              "USER_DATA_ADDR",
              "BP_DATA_ADDR",
              "BT_DATA_ADDR",
              "USER_CONFIG_ADDR",
              "BT_CONFIG_ADDR",
          ]

          def expand(expr, depth=0):
              if depth > 20:
                  raise ValueError("macro expansion recursion")
              expr = expr.split("//", 1)[0].strip()
              expr = re.sub(
                  r"\b([A-Za-z_][A-Za-z0-9_]*)\b",
                  lambda m: (
                      f"({expand(macros[m.group(1)], depth+1)})"
                      if m.group(1) in macros else m.group(1)
                  ),
                  expr,
              )
              return expr

          def safe_eval(expr):
              node = ast.parse(expr, mode="eval")
              allowed = (
                  ast.Expression, ast.Constant, ast.BinOp, ast.UnaryOp,
                  ast.Add, ast.Sub, ast.Mult, ast.FloorDiv, ast.Div,
                  ast.Mod, ast.LShift, ast.RShift, ast.BitOr, ast.BitAnd,
                  ast.BitXor, ast.UAdd, ast.USub, ast.Invert, ast.ParenExpr
                  if hasattr(ast, "ParenExpr") else ast.Expression,
              )
              for n in ast.walk(node):
                  if not isinstance(n, allowed):
                      raise ValueError(f"unsupported expression node: {type(n).__name__}")
              return int(eval(compile(node, "<macro>", "eval"), {"__builtins__": {}}, {}))

          out = {}
          for name in wanted:
              if name not in macros:
                  raise SystemExit(f"missing flash macro: {name}")
              expanded = expand(macros[name])
              # Reject unresolved C identifiers, but allow hexadecimal
              # literals such as 0x0 / 0x3F0000.  A word-boundary identifier
              # pattern does not mistake the "x" in 0x... for a macro name.
              if re.search(r"\b[A-Za-z_][A-Za-z0-9_]*\b", expanded):
                  raise SystemExit(f"unresolved flash macro {name}: {expanded}")
              out[name] = safe_eval(expanded)

          Path("/tmp/R57_FLASH_CONTRACT.json").write_text(
              json.dumps(out, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          with Path("/tmp/R57_FLASH_CONTRACT.txt").open("w", encoding="utf-8") as f:
              for k, v in out.items():
                  f.write(f"{k}=0x{v:08X}\n")

          print(Path("/tmp/R57_FLASH_CONTRACT.txt").read_text(), end="")
          PY

          FLASH_BOOT_H="$SDK/BT_Audio_APP/bt_audio_app_src/inc/flash_boot.h"
          UPGRADE_C="$SDK/BT_Audio_APP/bt_audio_app_src/device/upgrade.c"
          FLASH_BOOT_C="$SDK/BT_Audio_APP/bt_audio_app_src/device/flash_boot.c"

          grep -Eq '^[[:space:]]*#define[[:space:]]+FLASH_BOOT_EN[[:space:]]+1' "$FLASH_BOOT_H"
          grep -F 'PCTOOL_ON' "$FLASH_BOOT_H"
          grep -F 'AppResourceUsbDevice' "$UPGRADE_C"
          grep -F 'jump_fun = (fun)0;' "$UPGRADE_C"
          grep -F '0xC9, 0xBD, 0xBE, 0xB0' "$FLASH_BOOT_C"

          {
            echo "REFERENCE_FLASH_BOOT_EN=YES"
            echo "REFERENCE_PC_UPDATE_SOURCE=YES"
            echo "REFERENCE_JUMP_TO_FLASHBOOT_ADDRESS_0=YES"
            echo "REFERENCE_HEADER_MAGIC_C9BDBEB0=YES"
          } > /tmp/R57_REFERENCE_BOOT_CONTRACT.txt

      - name: Audit ELF entry vector app header and code-region bounds
        id: r57_layout_audit
        if: steps.r57_flash_contract.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json, re

          bin_path = Path("/tmp/R57_ANALYSIS_ONLY_DO_NOT_FLASH.bin")
          data = bin_path.read_bytes()
          contract = json.loads(
              Path("/tmp/R57_FLASH_CONTRACT.json").read_text(encoding="utf-8")
          )
          hdr = Path("/tmp/R57_ELF_HEADER.txt").read_text(
              encoding="latin-1", errors="replace"
          )
          sec = Path("/tmp/R57_ELF_SECTIONS.txt").read_text(
              encoding="latin-1", errors="replace"
          )

          def yes(v): return "YES" if v else "NO"

          m = re.search(r"Entry point address:\s*(0x[0-9A-Fa-f]+)", hdr)
          entry = int(m.group(1), 16) if m else -1

          vector = -1
          for line in sec.splitlines():
              if re.search(r"\s\.vector\s", line):
                  # readelf -SW: [Nr] Name Type Address Off Size ...
                  mm = re.search(
                      r"\]\s+\.vector\s+\S+\s+([0-9A-Fa-f]+)\s+",
                      line
                  )
                  if mm:
                      vector = int(mm.group(1), 16)
                      break

          APP_BASE = 0x10000
          BOOT_META = 0xC0
          APP_META = APP_BASE + 0xC0
          APP_VERSION = APP_BASE + 0xB8
          APP_LEN = APP_BASE + 0xE0
          MAGIC = bytes.fromhex("c9 bd be b0")

          boot_magic = data[BOOT_META:BOOT_META+4] if len(data) >= BOOT_META+4 else b""
          app_magic = data[APP_META:APP_META+4] if len(data) >= APP_META+4 else b""
          version = data[APP_VERSION:APP_VERSION+4] if len(data) >= APP_VERSION+4 else b""

          code_len = 0
          len_sum_stored = -1
          len_sum_calc = -2
          if len(data) >= APP_LEN + 4:
              l0, l1, l2, chk = data[APP_LEN:APP_LEN+4]
              code_len = l0 | (l1 << 8) | (l2 << 16)
              len_sum_stored = chk
              len_sum_calc = (l0 + l1 + l2) & 0xFF

          const_addr = int(contract["CONST_DATA_ADDR"])
          file_size = len(data)

          entry_ok = entry == APP_BASE
          vector_ok = vector == APP_BASE
          boot_magic_ok = boot_magic == MAGIC
          app_magic_ok = app_magic == MAGIC
          len_checksum_ok = len_sum_stored == len_sum_calc
          code_len_sane = (
              code_len > 0 and
              APP_BASE + code_len <= const_addr
          )
          image_fits = file_size <= const_addr
          header_ready = app_magic_ok and len_checksum_ok and code_len_sane
          layout_ready = entry_ok and vector_ok and image_fits

          lines = [
              f"ELF_ENTRY=0x{entry:08X}" if entry >= 0 else "ELF_ENTRY=UNKNOWN",
              f"VECTOR_ADDR=0x{vector:08X}" if vector >= 0 else "VECTOR_ADDR=UNKNOWN",
              f"ANALYSIS_BIN_BYTES={file_size}",
              f"CONST_DATA_ADDR=0x{const_addr:08X}",
              f"BOOT_HEADER_MAGIC={boot_magic.hex()}",
              f"APP_HEADER_MAGIC={app_magic.hex()}",
              f"APP_VERSION_BYTES={version.hex()}",
              f"APP_CODE_LENGTH_FIELD={code_len}",
              f"APP_LENGTH_CHECKSUM_STORED={len_sum_stored}",
              f"APP_LENGTH_CHECKSUM_CALC={len_sum_calc}",
              f"ENTRY_AT_0x10000={yes(entry_ok)}",
              f"VECTOR_AT_0x10000={yes(vector_ok)}",
              f"BOOT_MAGIC_C9BDBEB0={yes(boot_magic_ok)}",
              f"APP_MAGIC_C9BDBEB0={yes(app_magic_ok)}",
              f"APP_LENGTH_CHECKSUM_OK={yes(len_checksum_ok)}",
              f"APP_CODE_LENGTH_SANE={yes(code_len_sane)}",
              f"CODE_REGION_FITS_BEFORE_CONST={yes(image_fits)}",
              f"R57_APP_HEADER_READY={yes(header_ready)}",
              f"R57_IMAGE_LAYOUT_READY={yes(layout_ready)}",
          ]

          Path("/tmp/R57_IMAGE_LAYOUT_STATE.txt").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          print("\n".join(lines))
          PY

      - name: Audit proven app length metadata normalization hypothesis
        id: r58_header_normalization
        if: steps.r57_layout_audit.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          src = Path("/tmp/R57_ANALYSIS_ONLY_DO_NOT_FLASH.bin")
          dst = Path("/tmp/R58_ANALYSIS_HEADER_NORMALIZED_DO_NOT_FLASH.bin")
          data = bytearray(src.read_bytes())

          APP_BASE = 0x10000
          MAGIC_OFF = APP_BASE + 0xC0
          VER_OFF = APP_BASE + 0xB8
          LEN_OFF = APP_BASE + 0xE0
          CONST_ADDR = 0x198000
          MAGIC = bytes.fromhex("c9 bd be b0")

          if len(data) <= APP_BASE:
              raise SystemExit("analysis image is shorter than app base")

          # R58 hypothesis under audit:
          # the application code image begins at 0x10000 and its image length is
          # the file-backed app span through the last emitted byte.
          candidate_len = len(data) - APP_BASE

          if candidate_len <= 0 or candidate_len > 0xFFFFFF:
              raise SystemExit(f"candidate length out of 24-bit range: {candidate_len}")
          if APP_BASE + candidate_len > CONST_ADDR:
              raise SystemExit("candidate app length overlaps CONST_DATA_ADDR")

          before = bytes(data)
          magic_before = before[MAGIC_OFF:MAGIC_OFF+4]
          version_before = before[VER_OFF:VER_OFF+4]
          old_meta = before[LEN_OFF:LEN_OFF+4]

          if magic_before != MAGIC:
              raise SystemExit(
                  f"unexpected app magic before normalization: {magic_before.hex()}"
              )

          l0 = candidate_len & 0xFF
          l1 = (candidate_len >> 8) & 0xFF
          l2 = (candidate_len >> 16) & 0xFF
          chk = (l0 + l1 + l2) & 0xFF

          data[LEN_OFF:LEN_OFF+4] = bytes((l0, l1, l2, chk))
          after = bytes(data)

          # Hard invariant: R58 may alter ONLY the four proven length/check bytes.
          changed = [i for i, (a, b) in enumerate(zip(before, after)) if a != b]
          expected = list(range(LEN_OFF, LEN_OFF + 4))
          if changed != expected:
              raise SystemExit(
                  f"unexpected changed byte positions: {changed[:32]} expected {expected}"
              )

          if after[MAGIC_OFF:MAGIC_OFF+4] != magic_before:
              raise SystemExit("app magic changed unexpectedly")
          if after[VER_OFF:VER_OFF+4] != version_before:
              raise SystemExit("app version changed unexpectedly")

          n0, n1, n2, n3 = after[LEN_OFF:LEN_OFF+4]
          decoded = n0 | (n1 << 8) | (n2 << 16)
          checksum_ok = ((n0 + n1 + n2) & 0xFF) == n3
          sane = (
              decoded == candidate_len and
              decoded > 0 and
              APP_BASE + decoded <= CONST_ADDR
          )

          if not checksum_ok or not sane:
              raise SystemExit("normalized candidate length metadata is inconsistent")

          # R28 established the FastCRC COVERAGE ranges, but not enough evidence
          # exists to write the excluded metadata fields.  Produce a deterministic
          # SHA-256 fingerprint of exactly the included bytes instead of inventing
          # a FastCRC algorithm/storage value.
          app = after[APP_BASE:APP_BASE + candidate_len]
          ranges = [
              (0x0000, 0x00A4),
              (0x00A8, 0x00BC),
              (0x00C0, 0x00CC),
              (0x00D4, 0x00E4),
              (0x00EC, candidate_len),
          ]

          covered = bytearray()
          for a, b in ranges:
              if not (0 <= a <= b <= candidate_len):
                  raise SystemExit(f"FastCRC coverage range invalid: {a:#x}..{b:#x}")
              covered += app[a:b]

          dst.write_bytes(after)

          Path("/tmp/R58_FASTCRC_COVERAGE_FINGERPRINT.txt").write_text(
              "\n".join([
                  f"R58_CANDIDATE_APP_LENGTH={candidate_len}",
                  f"R58_FASTCRC_COVERED_BYTES={len(covered)}",
                  "R58_FASTCRC_COVERAGE_SHA256=" + hashlib.sha256(covered).hexdigest(),
                  "R58_FASTCRC_INCLUDED_1=0x0000..0x00A3",
                  "R58_FASTCRC_INCLUDED_2=0x00A8..0x00BB",
                  "R58_FASTCRC_INCLUDED_3=0x00C0..0x00CB",
                  "R58_FASTCRC_INCLUDED_4=0x00D4..0x00E3",
                  f"R58_FASTCRC_INCLUDED_5=0x00EC..0x{candidate_len-1:06X}",
                  "R58_FASTCRC_EXCLUDED=0xA4..A7,0xBC..BF,0xCC..D3,0xE4..EB",
                  "R58_FASTCRC_VALUE_WRITTEN=NO",
              ]) + "\n",
              encoding="utf-8",
          )

          Path("/tmp/R58_HEADER_NORMALIZATION_STATE.txt").write_text(
              "\n".join([
                  f"R58_ANALYSIS_IMAGE_BYTES={len(after)}",
                  f"R58_APP_BASE=0x{APP_BASE:08X}",
                  f"R58_CANDIDATE_APP_LENGTH={candidate_len}",
                  f"R58_CANDIDATE_APP_LENGTH_HEX=0x{candidate_len:06X}",
                  f"R58_OLD_LENGTH_META={old_meta.hex()}",
                  "R58_NEW_LENGTH_META=" + after[LEN_OFF:LEN_OFF+4].hex(),
                  "R58_MAGIC_UNCHANGED=YES",
                  "R58_VERSION_UNCHANGED=YES",
                  "R58_ONLY_E0_E3_CHANGED=YES",
                  "R58_LENGTH_CHECKSUM_OK=YES",
                  "R58_LENGTH_WITHIN_CODE_REGION=YES",
                  "R58_CANDIDATE_LENGTH_METADATA_SELF_CONSISTENT=YES",
                  "R58_FASTCRC_COVERAGE_KNOWN=YES",
                  "R58_FASTCRC_ALGORITHM_AND_STORAGE_PROVEN=NO",
                  "R58_EXCLUDED_METADATA_FIELDS_RESOLVED=NO",
                  "R58_FULL_APP_METADATA_READY=NO",
                  "FLASH_ALLOWED=NO",
              ]) + "\n",
              encoding="utf-8",
          )

          Path("/tmp/R58_HEADER_NORMALIZED_SHA256.txt").write_text(
              hashlib.sha256(after).hexdigest() +
              "  R58_ANALYSIS_HEADER_NORMALIZED_DO_NOT_FLASH.bin\n",
              encoding="ascii",
          )

          print(Path("/tmp/R58_HEADER_NORMALIZATION_STATE.txt").read_text(), end="")
          print(Path("/tmp/R58_FASTCRC_COVERAGE_FINGERPRINT.txt").read_text(), end="")
          PY

          test -s /tmp/R58_ANALYSIS_HEADER_NORMALIZED_DO_NOT_FLASH.bin
          test -s /tmp/R58_HEADER_NORMALIZATION_STATE.txt
          test -s /tmp/R58_FASTCRC_COVERAGE_FINGERPRINT.txt

      - name: Apply proven boot fast4K metadata and compute app fastCRC
        id: r63_metadata_synthesis
        if: steps.r58_header_normalization.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import struct

          src = Path("/tmp/R58_ANALYSIS_HEADER_NORMALIZED_DO_NOT_FLASH.bin")
          dst = Path("/tmp/R63_METADATA_SYNTHESIZED_DO_NOT_FLASH.bin")
          data = bytearray(src.read_bytes())
          before = bytes(data)

          APP_BASE = 0x10000
          BOOT_FAST_END = 0x1000
          BOOT_SIZE_FIELD = 0xA4
          BOOT_CRC_FIELD = 0xBC
          APP_MAGIC_OFF = APP_BASE + 0xC0
          APP_LEN_OFF = APP_BASE + 0xE0
          MAGIC = bytes.fromhex("c9 bd be b0")

          if len(data) <= APP_BASE + 0xEC:
              raise SystemExit("image too short for app metadata")
          if data[APP_MAGIC_OFF:APP_MAGIC_OFF+4] != MAGIC:
              raise SystemExit("app magic mismatch")

          # Exact CRC16/CCITT-XMODEM table-form contract proven in R62.
          def crc16_xmodem_ranges(buf, ranges):
              crc = 0
              for a, z in ranges:
                  if not (0 <= a <= z <= len(buf)):
                      raise SystemExit(f"invalid CRC range {a:#x}..{z:#x}")
                  for byte in buf[a:z]:
                      crc ^= byte << 8
                      for _ in range(8):
                          crc = (((crc << 1) ^ 0x1021) & 0xFFFF) \
                              if (crc & 0x8000) else ((crc << 1) & 0xFFFF)
              return crc

          boot_ranges = [
              (0x0000, 0x00A4),
              (0x00A8, 0x00BC),
              (0x00C0, 0x00CC),
              (0x00D4, 0x00E4),
              (0x00EC, 0x1000),
          ]

          if len(data) < BOOT_FAST_END:
              raise SystemExit("image shorter than 4KB boot fastCRC window")

          boot_crc_before = crc16_xmodem_ranges(data, boot_ranges)

          # Exact b1_download_v1.7 address-zero writeback semantics from R62.
          data[BOOT_SIZE_FIELD:BOOT_SIZE_FIELD+4] = struct.pack("<I", 0x10001000)
          data[BOOT_CRC_FIELD:BOOT_CRC_FIELD+4] = struct.pack("<I", boot_crc_before)

          boot_crc_after = crc16_xmodem_ranges(data, boot_ranges)
          if boot_crc_after != boot_crc_before:
              raise SystemExit(
                  f"boot CRC changed after excluded metadata writeback: "
                  f"{boot_crc_before:04X}->{boot_crc_after:04X}"
              )

          # R58 normalized app +0xE0..E3. Decode it and compute the exact
          # FastCRC VALUE over the R28/R62-proven coverage shape.
          l0, l1, l2, chk = data[APP_LEN_OFF:APP_LEN_OFF+4]
          app_len = l0 | (l1 << 8) | (l2 << 16)

          if app_len <= 0:
              raise SystemExit("app length is zero")
          if ((l0 + l1 + l2) & 0xFF) != chk:
              raise SystemExit("app length checksum mismatch")
          if APP_BASE + app_len > len(data):
              raise SystemExit(
                  f"app length exceeds image: {app_len} > {len(data)-APP_BASE}"
              )

          app = data[APP_BASE:APP_BASE+app_len]
          app_ranges = [
              (0x0000, 0x00A4),
              (0x00A8, 0x00BC),
              (0x00C0, 0x00CC),
              (0x00D4, 0x00E4),
              (0x00EC, app_len),
          ]
          app_crc = crc16_xmodem_ranges(app, app_ranges)

          after = bytes(data)

          # R63 is allowed to change ONLY the proven address-zero downloader
          # writeback fields relative to the already-R58-normalized image.
          changed = [
              i for i, (a, b) in enumerate(zip(before, after))
              if a != b
          ]
          expected = list(range(0xA4, 0xA8)) + list(range(0xBC, 0xC0))
          if changed != expected:
              raise SystemExit(
                  f"unexpected R63 changed offsets: {changed[:64]} "
                  f"expected {expected}"
              )

          dst.write_bytes(after)

          Path("/tmp/R63_METADATA_SYNTHESIS_STATE.txt").write_text(
              "\n".join([
                  f"R63_IMAGE_BYTES={len(after)}",
                  "R63_BOOT_FAST4KCRC_ALGORITHM=CRC16_CCITT_XMODEM",
                  "R63_BOOT_FAST4KCRC_POLY=0x1021",
                  "R63_BOOT_FAST4KCRC_INIT=0x0000",
                  "R63_BOOT_FAST4KCRC_COVERED_BYTES=4072",
                  f"R63_BOOT_FAST4KCRC=0x{boot_crc_before:04X}",
                  "R63_BOOT_A4_DWORD=0x10001000",
                  f"R63_BOOT_BC_DWORD=0x{boot_crc_before:04X}",
                  "R63_BOOT_METADATA_WRITEBACK_PROVEN=YES",
                  "R63_BOOT_CRC_STABLE_AFTER_WRITEBACK=YES",
                  f"R63_APP_LENGTH={app_len}",
                  f"R63_APP_LENGTH_HEX=0x{app_len:06X}",
                  "R63_APP_LENGTH_CHECKSUM_READY=YES",
                  f"R63_APP_FASTCRC_VALUE=0x{app_crc:04X}",
                  "R63_APP_FASTCRC_VALUE_COMPUTED=YES",
                  "R63_APP_FASTCRC_COVERAGE_PROVEN=YES",
                  "R63_APP_FASTCRC_STORAGE_OFFSET_PROVEN=NO",
                  "R63_APP_CC_D3_METADATA_RESOLVED=NO",
                  "R63_APP_E4_EB_METADATA_RESOLVED=NO",
                  "R63_FULL_APP_METADATA_READY=NO",
                  "R63_PRODUCTION_FIRST_BOOTSTRAP_READY=NO",
                  "FLASH_ALLOWED=NO",
              ]) + "\n",
              encoding="utf-8",
          )

          Path("/tmp/R63_METADATA_SYNTHESIZED_SHA256.txt").write_text(
              hashlib.sha256(after).hexdigest() +
              "  R63_METADATA_SYNTHESIZED_DO_NOT_FLASH.bin\n",
              encoding="ascii",
          )

          # Header-only evidence; do not retain the binary in the artifact.
          def dump(base, size, name):
              chunk = after[base:base+size]
              Path(f"/tmp/{name}.hex").write_text(
                  "\n".join(
                      f"{base+i:08x}: " +
                      " ".join(f"{x:02x}" for x in chunk[i:i+16])
                      for i in range(0, len(chunk), 16)
                  ) + "\n",
                  encoding="ascii",
              )

          dump(0x80, 0x80, "R63_BOOT_HEADER_0080")
          dump(APP_BASE + 0x80, 0x80, "R63_APP_HEADER_10080")

          print(Path("/tmp/R63_METADATA_SYNTHESIS_STATE.txt").read_text(), end="")
          PY

          test -s /tmp/R63_METADATA_SYNTHESIZED_DO_NOT_FLASH.bin
          test -s /tmp/R63_METADATA_SYNTHESIS_STATE.txt
          test -s /tmp/R63_METADATA_SYNTHESIZED_SHA256.txt

      - name: Audit production-board binding evidence
        id: r57_board_binding
        if: steps.r57_layout_audit.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          BINDING="$GITHUB_WORKSPACE/board/OKN_BP1048P4_PRODUCTION_BINDING.json"

          python3 - <<'PY'
          from pathlib import Path
          import json, os

          p = Path(os.environ["GITHUB_WORKSPACE"]) / "board" / "OKN_BP1048P4_PRODUCTION_BINDING.json"

          required_true = [
              "ch3_dacx_physical_output_verified",
              "i2s0_pinout_verified",
              "i2s1_pinout_verified",
              "dma6_i2s0_verified",
              "dma7_i2s1_verified",
          ]

          ready = False
          reason = "production binding manifest not present"

          if p.exists():
              try:
                  obj = json.loads(p.read_text(encoding="utf-8"))
                  missing = [k for k in required_true if obj.get(k) is not True]
                  evidence = obj.get("evidence", "")
                  if missing:
                      reason = "manifest fields not verified: " + ",".join(missing)
                  elif not isinstance(evidence, str) or not evidence.strip():
                      reason = "manifest evidence field is empty"
                  else:
                      ready = True
                      reason = "all required production binding fields verified"
              except Exception as e:
                  reason = "binding manifest parse error: " + str(e)

          lines = [
              "R56_REFERENCE_I2S0_PINS=GPIOA0..GPIOA4",
              "R56_REFERENCE_I2S1_PINS=GPIOA7..GPIOA11",
              "R56_REFERENCE_I2S0_DMA=6",
              "R56_REFERENCE_I2S1_DMA=7",
              "R56_CH3_DACX_LOGICAL=YES",
              f"PRODUCTION_BINDING_MANIFEST_PRESENT={'YES' if p.exists() else 'NO'}",
              f"R57_PRODUCTION_BOARD_BINDING_READY={'YES' if ready else 'NO'}",
              "BOARD_BINDING_REASON=" + reason,
          ]
          Path("/tmp/R57_BOARD_BINDING_STATE.txt").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          print("\n".join(lines))
          PY

      - name: Audit first-flash boot entry and recovery readiness
        id: r57_recovery
        if: steps.r57_layout_audit.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          {
            find "$GITHUB_WORKSPACE" -type f \
              \( -iname '*.mva' \
                 -o -iname '*factory*.bin' \
                 -o -iname '*recovery*.bin' \
                 -o -iname '*stock*.bin' \
                 -o -iname '*factory*.img' \
                 -o -iname '*recovery*.img' \) \
              -print || true
          } > /tmp/R57_RECOVERY_CANDIDATES.txt

          if [ -s /tmp/R57_RECOVERY_CANDIDATES.txt ]; then
            STOCK_RECOVERY_PRESENT=YES
          else
            STOCK_RECOVERY_PRESENT=NO
          fi

          # The public SDK proves the reference path exists, but this CI does not
          # contain the production board's currently-running firmware image and
          # therefore cannot prove that its Feature-AA/55 path actually jumps.
          cat > /tmp/R57_RECOVERY_STATE.txt <<EOF
          REFERENCE_SDK_FLASH_BOOT_EN=YES
          REFERENCE_SDK_PC_UPDATE_PATH=YES
          PRODUCTION_STOCK_BOOT_ENTRY_PROVEN=NO
          STOCK_RECOVERY_CANDIDATE_PRESENT=$STOCK_RECOVERY_PRESENT
          FULL_STOCK_FLASH_READBACK_PROVEN=NO
          ROLLBACK_PATH_PROVEN=NO
          R57_RECOVERY_READY=NO
          EOF

          cat /tmp/R57_RECOVERY_STATE.txt
          echo "Recovery candidates:"
          cat /tmp/R57_RECOVERY_CANDIDATES.txt || true

      - name: Compute R57 flash-readiness decision
        id: r57_readiness
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          get_state() {
            local key="$1"
            shift
            for f in "$@"; do
              if [ -f "$f" ]; then
                v="$(grep -E "^${key}=" "$f" | tail -n1 | cut -d= -f2- || true)"
                if [ -n "$v" ]; then
                  printf '%s' "$v"
                  return 0
                fi
              fi
            done
            printf 'UNKNOWN'
          }

          HEADER_READY="$(get_state R63_FULL_APP_METADATA_READY /tmp/R63_METADATA_SYNTHESIS_STATE.txt)"
          LAYOUT_READY="$(get_state R57_IMAGE_LAYOUT_READY /tmp/R57_IMAGE_LAYOUT_STATE.txt)"
          BOARD_READY="$(get_state R57_PRODUCTION_BOARD_BINDING_READY /tmp/R57_BOARD_BINDING_STATE.txt)"
          RECOVERY_READY="$(get_state R57_RECOVERY_READY /tmp/R57_RECOVERY_STATE.txt)"
          PROD_BOOT="$(get_state PRODUCTION_STOCK_BOOT_ENTRY_PROVEN /tmp/R57_RECOVERY_STATE.txt)"

          FLASH_ALLOWED=NO
          if [ "$HEADER_READY" = YES ] && \
             [ "$LAYOUT_READY" = YES ] && \
             [ "$BOARD_READY" = YES ] && \
             [ "$RECOVERY_READY" = YES ] && \
             [ "$PROD_BOOT" = YES ]; then
            FLASH_ALLOWED=YES
          fi

          cat > /tmp/R57_FLASH_READINESS.txt <<EOF
          R63_FULL_APP_METADATA_READY=$HEADER_READY
          R57_IMAGE_LAYOUT_READY=$LAYOUT_READY
          R57_PRODUCTION_BOARD_BINDING_READY=$BOARD_READY
          R57_RECOVERY_READY=$RECOVERY_READY
          PRODUCTION_STOCK_BOOT_ENTRY_PROVEN=$PROD_BOOT
          FLASH_ALLOWED=$FLASH_ALLOWED
          EOF

          cat /tmp/R57_FLASH_READINESS.txt

          # R57 is an audit workflow. It must never perform erase/program/write.
          echo "R57_FLASH_PROGRAM_COMMANDS_EXECUTED=NO" \
            >> /tmp/R57_FLASH_READINESS.txt

          # Do not retain the transient raw binary in artifacts.
          rm -f /tmp/R57_ANALYSIS_ONLY_DO_NOT_FLASH.bin
          rm -f /tmp/R58_ANALYSIS_HEADER_NORMALIZED_DO_NOT_FLASH.bin
          rm -f /tmp/R63_METADATA_SYNTHESIZED_DO_NOT_FLASH.bin
          test ! -e /tmp/R57_ANALYSIS_ONLY_DO_NOT_FLASH.bin
          test ! -e /tmp/R58_ANALYSIS_HEADER_NORMALIZED_DO_NOT_FLASH.bin
          test ! -e /tmp/R63_METADATA_SYNTHESIZED_DO_NOT_FLASH.bin
          test ! -e /tmp/R63_METADATA_SYNTHESIZED_DO_NOT_FLASH.bin
          test ! -e /tmp/R58_ANALYSIS_HEADER_NORMALIZED_DO_NOT_FLASH.bin

      - name: Build R63 evidence bundle
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          OUT=/tmp/R63_BP1048P4_FULL_METADATA_SYNTHESIS_EVIDENCE
          rm -rf "$OUT"
          mkdir -p "$OUT"

          cp -f /tmp/R55_TOOLCHAIN.txt "$OUT/" 2>/dev/null || true
