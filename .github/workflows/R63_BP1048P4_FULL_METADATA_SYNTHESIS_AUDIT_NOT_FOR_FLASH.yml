      - name: Build active source graph from vendor Eclipse project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          sdk = Path("/tmp/bp1048")
          app = sdk / "BT_Audio_APP"
          project = ET.parse(app / ".project").getroot()
          cproject = ET.parse(app / ".cproject").getroot()

          exclusions = set()
          for e in cproject.iter("entry"):
              raw = e.attrib.get("excluding", "")
              exclusions.update(x for x in raw.split("|") if x)

          sources = {}
          local = app / "bt_audio_app_src"
          for p in local.rglob("*"):
              if p.is_file() and p.suffix.lower() in {".c", ".s"}:
                  logical = p.relative_to(app).as_posix()
                  sources[p.resolve()] = logical

          for link in project.iter("link"):
              name = (link.findtext("name") or "").strip()
              typ = (link.findtext("type") or "").strip()
              uri = (link.findtext("locationURI") or "").strip().replace(
                  "&amp;", "&"
              )
              if typ != "1" or not name.lower().endswith((".c", ".s")):
                  continue

              if uri.startswith("PARENT-1-PROJECT_LOC/"):
                  p = sdk / uri[len("PARENT-1-PROJECT_LOC/"):]
              elif uri.startswith("WORKSPACE_LOC/"):
                  p = sdk / uri[len("WORKSPACE_LOC/"):]
              else:
                  continue

              if p.is_file():
                  sources[p.resolve()] = name

          def norm(x):
              x = x.replace("\\", "/").lower().replace("_", "")
              while "//" in x:
                  x = x.replace("//", "/")
              return x.strip("/")

          exn = sorted({norm(x) for x in exclusions})
          active = []
          excluded = []

          for physical, logical in sorted(
              sources.items(), key=lambda x: x[1].lower()
          ):
              ln = norm(logical)
              matches = [e for e in exn if ln == e or ln.endswith("/" + e)]
              if matches:
                  excluded.append((str(physical), logical, matches[0]))
              else:
                  active.append((str(physical), logical))

          Path("/tmp/R55_ACTIVE_SOURCES.tsv").write_text(
              "".join(f"{p}\t{l}\n" for p, l in active),
              encoding="utf-8",
          )
          Path("/tmp/R55_EXCLUDED_SOURCES.tsv").write_text(
              "".join(f"{p}\t{l}\t{e}\n" for p, l, e in excluded),
              encoding="utf-8",
          )
          Path("/tmp/R55_SOURCE_GRAPH_SUMMARY.txt").write_text(
              f"DISCOVERED={len(sources)}\n"
              f"ACTIVE={len(active)}\n"
              f"EXCLUDED={len(excluded)}\n",
              encoding="ascii",
          )

          if len(active) < 100:
              raise SystemExit(f"unexpectedly small active graph: {len(active)}")

          print(Path("/tmp/R55_SOURCE_GRAPH_SUMMARY.txt").read_text(), end="")
          PY

      - name: Compile full vendor source graph
        id: compile_vendor
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          CC=nds32le-elf-gcc
          COMMON=(
            -Os -g3
            -mcpu=d1088-spu
            -mcmodel=medium
            -mext-dsp
            -mext-zol
            -fsingle-precision-constant
            -ffunction-sections
            -fdata-sections
          )
          APP=(-DFUNC_OS_EN=1 -DCFG_APP_CONFIG -DHAVE_CONFIG_H)

          rm -rf /tmp/r55obj /tmp/r55compile
          mkdir -p /tmp/r55obj /tmp/r55compile
          : > /tmp/R55_COMPILE_RESULTS.tsv

          pass=0
          fail=0
          n=0

          while IFS=$'\t' read -r src logical; do
            test -n "$src" || continue
            n=$((n+1))
            rel="${logical%.*}.o"
            obj="/tmp/r55obj/$rel"
            log="/tmp/r55compile/${n}.log"
            mkdir -p "$(dirname "$obj")"

            set +e
            "$CC" \
              "${COMMON[@]}" \
              @/tmp/R55_INCLUDES.rsp \
              "${APP[@]}" \
              -c "$src" \
              -o "$obj" \
              >"$log" 2>&1
            rc=$?
            set -e

            if [ "$rc" -eq 0 ]; then
              pass=$((pass+1))
              printf 'PASS\t%s\t%s\n' "$logical" "$obj" \
                >> /tmp/R55_COMPILE_RESULTS.tsv
            else
              fail=$((fail+1))
              printf 'FAIL\t%s\t%s\n' "$logical" "$log" \
                >> /tmp/R55_COMPILE_RESULTS.tsv
            fi
          done < /tmp/R55_ACTIVE_SOURCES.tsv

          printf 'TOTAL=%d\nPASS=%d\nFAIL=%d\n' "$n" "$pass" "$fail" \
            | tee /tmp/R55_COMPILE_SUMMARY.txt

          : > /tmp/R55_FIRST_COMPILE_FAILURES.txt
          awk -F '\t' '$1=="FAIL" && n<20 {print $2"\t"$3; n++}' \
            /tmp/R55_COMPILE_RESULTS.tsv |
            while IFS=$'\t' read -r logical log; do
              echo "===== $logical =====" \
                >> /tmp/R55_FIRST_COMPILE_FAILURES.txt
              sed -n '1,120p' "$log" \
                >> /tmp/R55_FIRST_COMPILE_FAILURES.txt
            done

          test "$fail" -eq 0

      - name: Compile R51 core into vendor ABI
        id: compile_r51
        if: steps.compile_vendor.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          CC=nds32le-elf-gcc
          COMMON=(
            -std=gnu11
            -Os -g3
            -mcpu=d1088-spu
            -mcmodel=medium
            -mext-dsp
            -mext-zol
            -fsingle-precision-constant
            -ffunction-sections
            -fdata-sections
            -Wall
            -Wextra
            -Werror
          )

          mkdir -p /tmp/r55_okn_obj

          SRCS=(
            /tmp/r55_okn/firmware/app/okn_r51.c
            /tmp/r55_okn/firmware/dsp/okn_gain7.c
            /tmp/r55_okn/firmware/dsp/okn_peq7.c
            /tmp/r55_okn/firmware/audio/okn_router7.c
            /tmp/r55_okn/firmware/control/okn_usb_proto.c
          )

          for src in "${SRCS[@]}"; do
            obj="/tmp/r55_okn_obj/$(basename "${src%.c}").o"
            "$CC" \
              "${COMMON[@]}" \
              @/tmp/R55_INCLUDES.rsp \
              -c "$src" \
              -o "$obj"
          done

          nds32le-elf-nm -a /tmp/r55_okn_obj/*.o \
            > /tmp/R55_R51_OBJECT_SYMBOLS.txt

          for sym in \
            okn_r51_init \
            okn_r51_handle_usb_report \
            okn_usb_proto_handle \
            okn_gain7_apply \
            okn_peq7_apply
          do
            grep -Eq "[[:space:]]${sym}$" \
              /tmp/R55_R51_OBJECT_SYMBOLS.txt || {
                echo "missing R51 NDS32 object symbol: $sym" >&2
                exit 1
              }
          done

      - name: Compile R56 real audio bridge into vendor ABI
        id: compile_audio_bridge
        if: steps.compile_vendor.outcome == 'success' && steps.compile_r51.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          # R56E: the bridge must depend only on the driver/API headers it uses.
          # app_config.h drags vendor trace.h into this standalone translation unit
          # and is intentionally forbidden here.
          if grep -F '#include "app_config.h"' /tmp/r56gen/okn_r56_audio_bridge.c; then
            echo "R56F bridge unexpectedly includes app_config.h" >&2
            exit 1
          fi

          grep -F '#include "type.h"' /tmp/r56gen/okn_r56_audio_bridge.c >/dev/null || {
            echo "R56F bridge missing MVSilicon type.h before dma.h" >&2
            exit 1
          }

          nds32le-elf-gcc \
            -std=gnu11 \
            -Os -g3 \
            -mcpu=d1088-spu \
            -mcmodel=medium \
            -mext-dsp \
            -mext-zol \
            -fsingle-precision-constant \
            -ffunction-sections \
            -fdata-sections \
            -Wall \
            -Wextra \
            -Werror \
            @/tmp/R55_INCLUDES.rsp \
            -DFUNC_OS_EN=1 \
            -DCFG_APP_CONFIG \
            -DHAVE_CONFIG_H \
            -c /tmp/r56gen/okn_r56_audio_bridge.c \
            -o /tmp/r56_audio_bridge.o

          nds32le-elf-nm -a /tmp/r56_audio_bridge.o \
            > /tmp/R56_AUDIO_BRIDGE_SYMBOLS.txt
          nds32le-elf-readelf -rW /tmp/r56_audio_bridge.o \
            > /tmp/R56_AUDIO_BRIDGE_RELOCS.txt
          nds32le-elf-objdump -dr /tmp/r56_audio_bridge.o \
            > /tmp/R56_AUDIO_BRIDGE_OBJDUMP.txt

          for sym in \
            okn_r56_audio_init \
            okn_r56_audio_process \
            okn_r56_audio_space_ok \
            okn_r56_audio_push
          do
            grep -Eq "[[:space:]]${sym}$" \
              /tmp/R56_AUDIO_BRIDGE_SYMBOLS.txt || {
                echo "missing R56 bridge symbol: $sym" >&2
                exit 1
              }
          done

          for dep in \
            okn_r51_process_stereo \
            AudioI2S_Init \
            AudioI2S0_DataSet \
            AudioI2S1_DataSet \
            AudioI2S0_DataSpaceLenGet \
            AudioI2S1_DataSpaceLenGet \
            GPIO_PortAModeSet
          do
            grep -F "$dep" /tmp/R56_AUDIO_BRIDGE_RELOCS.txt >/dev/null || {
              echo "R56 bridge does not reference: $dep" >&2
              exit 1
            }
          done

          echo "PASS: R56 bridge calls R51 on live stereo samples"
          echo "PASS: R56 bridge references both I2S output APIs"

      - name: Prove real vendor HID object calls R51 and preserves stock fallback
        id: hid_callgraph
        if: steps.compile_vendor.outcome == 'success' && steps.compile_r51.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          COMM_OBJ="$(find /tmp/r55obj -type f -name communication.o | head -n1)"
          test -n "$COMM_OBJ"
          test -s "$COMM_OBJ"

          nds32le-elf-readelf -rW "$COMM_OBJ" \
            > /tmp/R55_COMMUNICATION_RELOCS.txt
          nds32le-elf-objdump -dr "$COMM_OBJ" \
            > /tmp/R55_COMMUNICATION_OBJDUMP.txt
          nds32le-elf-nm -a "$COMM_OBJ" \
            > /tmp/R55_COMMUNICATION_SYMBOLS.txt

          grep -F "okn_r51_init" \
            /tmp/R55_COMMUNICATION_RELOCS.txt
          grep -F "okn_r51_handle_usb_report" \
            /tmp/R55_COMMUNICATION_RELOCS.txt
          grep -F "UsbLoadAudioMode" \
            /tmp/R55_COMMUNICATION_RELOCS.txt

          # Communication_Effect_Send is in the same translation unit, so it
          # may be a local resolved call instead of an undefined relocation.
          grep -Eq "[[:space:]][Tt][[:space:]]+Communication_Effect_Send$" \
            /tmp/R55_COMMUNICATION_SYMBOLS.txt

          echo "PASS: Communication_Effect_Init calls okn_r51_init"
          echo "PASS: HIDUsb_Rx calls okn_r51_handle_usb_report"
          echo "PASS: HIDUsb_Rx still calls stock UsbLoadAudioMode fallback"

      - name: Prove vendor audio core calls the R56 bridge
        id: audio_callgraph
        if: steps.compile_vendor.outcome == 'success' && steps.compile_audio_bridge.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          CORE_OBJ="$(find /tmp/r55obj -type f -name audio_core_api.o | head -n1)"
          MAIN_OBJ="$(find /tmp/r55obj -type f -name main_task.o | head -n1)"

          test -s "$CORE_OBJ"
          test -s "$MAIN_OBJ"

          nds32le-elf-readelf -rW "$CORE_OBJ" \
            > /tmp/R56_AUDIO_CORE_RELOCS.txt
          nds32le-elf-readelf -rW "$MAIN_OBJ" \
            > /tmp/R56_MAIN_TASK_RELOCS.txt

          for sym in \
            okn_r56_audio_process \
            okn_r56_audio_space_ok \
            okn_r56_audio_push
          do
            grep -F "$sym" /tmp/R56_AUDIO_CORE_RELOCS.txt >/dev/null || {
              echo "audio_core_api.o missing R56 relocation: $sym" >&2
              exit 1
            }
          done

          grep -F "okn_r56_audio_init" \
            /tmp/R56_MAIN_TASK_RELOCS.txt >/dev/null
          grep -F "okn_r51_init" \
            /tmp/R56_MAIN_TASK_RELOCS.txt >/dev/null

