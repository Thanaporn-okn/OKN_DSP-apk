          - rollback/recovery image
          EOF

          (
            cd /tmp
            zip -qr \
              R63_BP1048P4_FULL_METADATA_SYNTHESIS_EVIDENCE.zip \
              R63_BP1048P4_FULL_METADATA_SYNTHESIS_EVIDENCE
            sha256sum \
              R63_BP1048P4_FULL_METADATA_SYNTHESIS_EVIDENCE.zip \
              > R63_BP1048P4_FULL_METADATA_SYNTHESIS_EVIDENCE.zip.sha256
          )

          cat \
            /tmp/R63_BP1048P4_FULL_METADATA_SYNTHESIS_EVIDENCE.zip.sha256

      - name: Upload R63 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R63-BP1048P4-FULL-METADATA-SYNTHESIS-EVIDENCE
          path: |
            /tmp/R63_BP1048P4_FULL_METADATA_SYNTHESIS_EVIDENCE.zip
            /tmp/R63_BP1048P4_FULL_METADATA_SYNTHESIS_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: R63 final audit gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          cat /tmp/R55_SOURCE_GRAPH_SUMMARY.txt || true
          cat /tmp/R55_COMPILE_SUMMARY.txt || true
          cat /tmp/R57_IMAGE_LAYOUT_STATE.txt 2>/dev/null || true
          cat /tmp/R58_HEADER_NORMALIZATION_STATE.txt 2>/dev/null || true
          cat /tmp/R63_METADATA_SYNTHESIS_STATE.txt 2>/dev/null || true
          cat /tmp/R58_FASTCRC_COVERAGE_FINGERPRINT.txt 2>/dev/null || true
          cat /tmp/R57_BOARD_BINDING_STATE.txt 2>/dev/null || true
          cat /tmp/R57_RECOVERY_STATE.txt 2>/dev/null || true
          cat /tmp/R57_FLASH_READINESS.txt 2>/dev/null || true
          cat /tmp/R55_FIRST_COMPILE_FAILURES.txt 2>/dev/null || true
          cat /tmp/R56_AUDIO_BRIDGE_RELOCS.txt 2>/dev/null | tail -n 120 || true
          cat /tmp/R55_LINK_FIRST_ERRORS.txt 2>/dev/null || true

          test "${{ steps.compile_vendor.outcome }}" = "success"
          test "${{ steps.compile_r51.outcome }}" = "success"
          test "${{ steps.compile_audio_bridge.outcome }}" = "success"
          test "${{ steps.audio_callgraph.outcome }}" = "success"
          test "${{ steps.hid_callgraph.outcome }}" = "success"
          test "${{ steps.compat.outcome }}" = "success"
          test "${{ steps.full_link.outcome }}" = "success"
          test "${{ steps.final_symbol_gate.outcome }}" = "success"
          test "${{ steps.r57_analysis_image.outcome }}" = "success"
          test "${{ steps.r57_flash_contract.outcome }}" = "success"
          test "${{ steps.r57_layout_audit.outcome }}" = "success"
          test "${{ steps.r58_header_normalization.outcome }}" = "success"
          test "${{ steps.r63_metadata_synthesis.outcome }}" = "success"
          test "${{ steps.r57_board_binding.outcome }}" = "success"
          test "${{ steps.r57_recovery.outcome }}" = "success"
          test "${{ steps.r57_readiness.outcome }}" = "success"

          echo "R63_R56F_RUNTIME_BASE=PASS"
          echo "R63_REAL_7CH_AUDIO_PATH=PASS"
          echo "R63_PEAKING_EQ_BEFORE_DEDICATED_GAIN=PASS"
          cat /tmp/R57_FLASH_READINESS.txt
          test ! -e /tmp/R57_ANALYSIS_ONLY_DO_NOT_FLASH.bin
          echo "R63_TRANSIENT_RAW_BIN_RETAINED=NO"
