        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          ELF=/tmp/R56_BP1048P4_R51_REAL_7CH_AUDIO_PATH_NOT_FOR_FLASH.elf
          BIN=/tmp/R57_ANALYSIS_ONLY_DO_NOT_FLASH.bin

          test -s "$ELF"

          nds32le-elf-objcopy -O binary "$ELF" "$BIN"
          test -s "$BIN"

