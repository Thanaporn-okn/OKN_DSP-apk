          cp -f /tmp/R58_FASTCRC_COVERAGE_FINGERPRINT.txt "$OUT/" 2>/dev/null || true
          cp -f /tmp/R58_HEADER_NORMALIZED_SHA256.txt "$OUT/" 2>/dev/null || true
          cp -f /tmp/R63_METADATA_SYNTHESIS_STATE.txt "$OUT/" 2>/dev/null || true
          cp -f /tmp/R63_METADATA_SYNTHESIZED_SHA256.txt "$OUT/" 2>/dev/null || true
          cp -f /tmp/R63_BOOT_HEADER_0080.hex "$OUT/" 2>/dev/null || true
          cp -f /tmp/R63_APP_HEADER_10080.hex "$OUT/" 2>/dev/null || true
