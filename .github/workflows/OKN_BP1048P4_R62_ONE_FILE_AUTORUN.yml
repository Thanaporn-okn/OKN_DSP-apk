      - name: Repair Windows-origin include case aliases
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('/tmp/bp1048')
          bases=[root/'BT_Audio_APP',root/'MVsB1_Base_SDK/driver',root/'MVsB1_Base_SDK/middleware',root/'develop_lib']
          headers=[]
          for base in bases:
              if base.exists(): headers += [p for p in base.rglob('*') if p.is_file() and p.suffix.lower() in {'.h','.hpp'}]
          by_lower={}
          for p in headers: by_lower.setdefault(p.name.lower(),[]).append(p)
          rx=re.compile(r'^\s*#\s*include\s*[<"]([^">]+)[">]',re.M)
          spellings=set()
          for base in bases:
              if not base.exists(): continue
              for p in base.rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in {'.c','.h','.hpp','.s'}: continue
                  t=p.read_bytes().decode('latin-1')
                  for inc in rx.findall(t):
                      if '/' not in inc and '\\' not in inc: spellings.add(inc)
          for inc in sorted(spellings):
              for target in by_lower.get(inc.lower(),[]):
                  alias=target.with_name(inc)
                  if alias.name==target.name or alias.exists(): continue
                  try: alias.symlink_to(target.name)
                  except OSError: alias.write_bytes(target.read_bytes())
          must=root/'MVsB1_Base_SDK/middleware/rtos/freertos/inc/freertos.h'
          if not must.exists(): raise SystemExit('freertos.h compatibility alias missing')
          PY

      - name: Build include path
