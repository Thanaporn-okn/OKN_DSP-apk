          done
          find "$SDK/BT_Audio_APP" "$SDK/MVsB1_Base_SDK/driver" "$SDK/MVsB1_Base_SDK/middleware" "$SDK/develop_lib" \
            -type f -name '*.h' -printf '%h\n' | sort -u | while read -r d; do
              grep -Fxq -- "-I$d" /tmp/r62_includes.rsp || printf '%s\n' "-I$d" >> /tmp/r62_includes.rsp
            done
          printf '%s\n' "-I$R62_ROOT/firmware/include" >> /tmp/r62_includes.rsp
          printf '%s\n' "-I$R62_ROOT/firmware/src" >> /tmp/r62_includes.rsp
          printf '%s\n' "-I$R62_ROOT/target_sdk" >> /tmp/r62_includes.rsp

      - name: Build active SDK source graph
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          sdk=Path('/tmp/bp1048'); app=sdk/'BT_Audio_APP'
          project=ET.parse(app/'.project').getroot(); cproject=ET.parse(app/'.cproject').getroot()
          exclusions=set()
          for e in cproject.iter('entry'):
              exclusions.update(x for x in e.attrib.get('excluding','').split('|') if x)
          sources={}
          for p in (app/'bt_audio_app_src').rglob('*'):
              if p.is_file() and p.suffix.lower() in {'.c','.s'}: sources[p.resolve()]=p.relative_to(app).as_posix()
          for link in project.iter('link'):
              name=(link.findtext('name') or '').strip(); typ=(link.findtext('type') or '').strip()
              uri=(link.findtext('locationURI') or '').strip().replace('&amp;','&')
              if typ!='1' or not name.lower().endswith(('.c','.s')): continue
              if uri.startswith('PARENT-1-PROJECT_LOC/'): p=sdk/uri[len('PARENT-1-PROJECT_LOC/'):]
              elif uri.startswith('WORKSPACE_LOC/'): p=sdk/uri[len('WORKSPACE_LOC/'):]
              else: continue
              if p.is_file(): sources[p.resolve()]=name
          def norm(x):
              x=x.replace('\\','/').lower().replace('_','')
              while '//' in x: x=x.replace('//','/')
              return x.strip('/')
          exn=[norm(x) for x in exclusions]; active=[]; excluded=[]
          for physical,logical in sorted(sources.items(),key=lambda x:x[1].lower()):
              ln=norm(logical); matches=[e for e in exn if ln==e or ln.endswith('/'+e)]
              if matches: excluded.append((str(physical),logical,matches[0]))
              else: active.append((str(physical),logical))
          Path('/tmp/R62_ACTIVE_SOURCES.tsv').write_text(''.join(f'{p}\t{l}\n' for p,l in active))
          Path('/tmp/R62_SOURCE_GRAPH.txt').write_text(f'DISCOVERED={len(sources)}\nACTIVE={len(active)}\nEXCLUDED={len(excluded)}\n')
          if len(active)<100: raise SystemExit('unexpectedly small active SDK source graph')
          PY

      - name: Compile active SDK application sources
        shell: bash
        run: |
          set -euo pipefail
          CC=nds32le-elf-gcc
          COMMON=(-Os -g3 -mcpu=d1088-spu -mcmodel=medium -mext-dsp -mext-zol -fsingle-precision-constant -ffunction-sections -fdata-sections)
          APP=(-DFUNC_OS_EN=1 -DCFG_APP_CONFIG -DHAVE_CONFIG_H)
          rm -rf /tmp/r62obj /tmp/r62compile; mkdir -p /tmp/r62obj /tmp/r62compile
          : > /tmp/R62_COMPILE_RESULTS.tsv
          pass=0; fail=0; n=0
          while IFS=$'\t' read -r src logical; do
            test -n "$src" || continue; n=$((n+1)); rel="${logical%.*}.o"; obj="/tmp/r62obj/$rel"; log="/tmp/r62compile/$n.log"
            mkdir -p "$(dirname "$obj")"
            set +e; "$CC" "${COMMON[@]}" @/tmp/r62_includes.rsp "${APP[@]}" -c "$src" -o "$obj" >"$log" 2>&1; rc=$?; set -e
            if [ "$rc" -eq 0 ]; then pass=$((pass+1)); printf 'PASS\t%s\t%s\n' "$logical" "$obj" >> /tmp/R62_COMPILE_RESULTS.tsv
            else fail=$((fail+1)); printf 'FAIL\t%s\t%s\n' "$logical" "$log" >> /tmp/R62_COMPILE_RESULTS.tsv; fi
          done < /tmp/R62_ACTIVE_SOURCES.tsv
          printf 'TOTAL=%d\nPASS=%d\nFAIL=%d\n' "$n" "$pass" "$fail" | tee /tmp/R62_COMPILE_SUMMARY.txt
          if [ "$fail" -ne 0 ]; then
            awk -F '\t' '$1=="FAIL" && n<12 {print $2"\t"$3; n++}' /tmp/R62_COMPILE_RESULTS.tsv | while IFS=$'\t' read -r logical log; do
              echo "===== $logical ====="; sed -n '1,120p' "$log"; done
            exit 1
          fi

      - name: Compile OKN R62 DSP and target adapter
        shell: bash
        run: |
          set -euo pipefail
          CC=nds32le-elf-gcc
          COMMON=(-Os -g3 -mcpu=d1088-spu -mcmodel=medium -mext-dsp -mext-zol -fsingle-precision-constant -ffunction-sections -fdata-sections)
          APP=(-DFUNC_OS_EN=1 -DCFG_APP_CONFIG -DHAVE_CONFIG_H)
          ROOT="$R62_ROOT"
          mkdir -p /tmp/r62custom
          for f in okn55_gain7 okn55_peq7 okn55_engine okn55_outputs okn55_ufe okn55_hid256 okn61_runtime; do
            "$CC" "${COMMON[@]}" @/tmp/r62_includes.rsp -c "$ROOT/firmware/src/$f.c" -o "/tmp/r62custom/$f.o"
          done
          "$CC" "${COMMON[@]}" @/tmp/r62_includes.rsp "${APP[@]}" -c "$ROOT/target_sdk/okn61_dual_i2s.c" -o /tmp/r62custom/okn61_dual_i2s.o
          cat > /tmp/r62_uart_mutex_compat.c <<'EOF'
          #include <stddef.h>
          #include "rtos_api.h"
          __attribute__((weak)) osMutexId UART0Mutex = NULL;
          __attribute__((weak)) osMutexId UART1Mutex = NULL;
          EOF
          "$CC" "${COMMON[@]}" @/tmp/r62_includes.rsp "${APP[@]}" -c /tmp/r62_uart_mutex_compat.c -o /tmp/r62custom/r62_uart_mutex_compat.o
          nds32le-elf-nm -a /tmp/r62custom/*.o > /tmp/R62_CUSTOM_SYMBOLS.txt
          for sym in okn61_runtime_init okn61_runtime_control okn61_runtime_process okn61_dual_i2s_init okn61_process_outputs okn61_i2s_push; do
            grep -Eq "[[:space:]]${sym}$" /tmp/R62_CUSTOM_SYMBOLS.txt || { echo "missing custom symbol $sym" >&2; exit 1; }
          done

      - name: Full-link R62 BP1048P4 application
        shell: bash
        run: |
          set -euo pipefail
          SDK=/tmp/bp1048; CC=nds32le-elf-gcc
          ADX=/tmp/R62_BP1048P4_OKN_STANDALONE_NOT_FOR_FIRST_FLASH.adx
          BIN=/tmp/R62_BP1048P4_OKN_STANDALONE_NOT_FOR_FIRST_FLASH.bin
          MAP=/tmp/R62_BP1048P4_OKN_STANDALONE.map
          mapfile -t OBJS < <(find /tmp/r62obj -type f -name '*.o' | sort)
          test "${#OBJS[@]}" -gt 100
          LIBS=(
            "$SDK/MVsB1_Base_SDK/driver/driver/libDriver.a"
            "$SDK/MVsB1_Base_SDK/middleware/audio/libsra.a"
            "$SDK/MVsB1_Base_SDK/middleware/cec/libcec.a"
            "$SDK/MVsB1_Base_SDK/middleware/audio/libsbcenc.a"
            "$SDK/MVsB1_Base_SDK/middleware/audio/libVocalCut.a"
            "$SDK/MVsB1_Base_SDK/middleware/audio/libmp3enc.a"
            "$SDK/MVsB1_Base_SDK/middleware/audio/libAudioEffectLibrary.a"
            "$SDK/MVsB1_Base_SDK/middleware/audio/libresampler.a"
            "$SDK/MVsB1_Base_SDK/middleware/audio/libAudioDecoderLibrary.a"
            "$SDK/MVsB1_Base_SDK/middleware/bluetooth/libBtStack.a"
            "$SDK/MVsB1_Base_SDK/middleware/flashfs/libFlashFS.a"
            "$SDK/MVsB1_Base_SDK/middleware/lrc/libLrc.a"
            "$SDK/MVsB1_Base_SDK/middleware/fatfs/libfatfs.a"
            "$SDK/MVsB1_Base_SDK/middleware/rtc/libRTC.a"
            "$SDK/MVsB1_Base_SDK/middleware/audio/libcvsd_plc.a"
            "$SDK/MVsB1_Base_SDK/middleware/audio/libBlueAEC.a"
            "$SDK/MVsB1_Base_SDK/middleware/xmai/libxmauth.a"
            "$SDK/BT_Audio_APP/bt_audio_app_src/libopus/lib/libopus.a"
          )
          for lib in "${LIBS[@]}"; do test -f "$lib" || { echo "missing lib $lib" >&2; exit 1; }; done
          "$CC" -static -nostartfiles -g3 -mcpu=d1088-spu -mcmodel=medium -mext-dsp \
            -Wl,--gc-sections -Wl,-Map,"$MAP" -T "$SDK/BT_Audio_APP/nds32-ae210p.ld" -o "$ADX" \
            "${OBJS[@]}" /tmp/r62custom/*.o \
            -Wl,--start-group "${LIBS[@]}" -ldsp -lm -Wl,--end-group \
            > /tmp/R62_LINK.log 2>&1 || { sed -n '1,320p' /tmp/R62_LINK.log; exit 1; }
          nds32le-elf-objcopy -O binary "$ADX" "$BIN"
          nds32le-elf-size "$ADX" | tee /tmp/R62_SIZE.txt
          nds32le-elf-nm -a -C "$ADX" > /tmp/R62_SYMBOLS.txt
          nds32le-elf-readelf -Ws "$ADX" > /tmp/R62_SYMBOLS_READELF.txt
          nds32le-elf-readelf -rW "$ADX" > /tmp/R62_RELOCATIONS.txt
          sha256sum "$ADX" "$BIN" "$MAP" > /tmp/R62_SHA256.txt
          for sym in _start Communication_Effect_Config okn61_runtime_init okn61_runtime_control okn61_runtime_process okn61_dual_i2s_init okn61_process_outputs okn61_i2s_push AudioI2S0_DataSet AudioI2S1_DataSet; do
            grep -Eq "[[:space:]]${sym}$" /tmp/R62_SYMBOLS.txt || { echo "missing final symbol $sym" >&2; exit 1; }
          done
          # The old vendor control handler must be dead/garbage-collected from this custom image.
          if grep -Eq '[[:space:]]Communication_Effect_0x11$' /tmp/R62_SYMBOLS.txt; then
            echo 'vendor control 0x11 is still reachable in final image' >&2; exit 1
          fi
          awk '$7=="UND" && ($5=="GLOBAL" || $5=="WEAK") {print}' /tmp/R62_SYMBOLS_READELF.txt > /tmp/R62_RUNTIME_UNRESOLVED.txt
          test ! -s /tmp/R62_RUNTIME_UNRESOLVED.txt
          if grep -Eq '^Relocation section ' /tmp/R62_RELOCATIONS.txt; then cat /tmp/R62_RELOCATIONS.txt; exit 1; fi
          test -s "$BIN"
          printf '%s\n' \
            'REVISION=R62' \
            'TARGET=BP1048P4' \
            'FIRMWARE=OKN_STANDALONE' \
            'DSP=7CH_15BAND_PEQ_PLUS_DEDICATED_GAIN' \
            'CONTROL=0x57_WRITE_0x58_READ_0x60_RESPONSE' \
            'GAIN_IDS=22..28' \
            'PEQ_IDS=30..36' \
            'VENDOR_CONTROL_0x11_REACHABLE=NO' \
            'FLASH_ALLOWED=NO' \
            'FIRST_FLASH_GATE=BOOT_PACKAGE_RECOVERY_READBACK_NOT_YET_PROVEN' \
            > /tmp/R62_BUILD_STATE.txt

      - name: Build Samsung S25+ Android controller APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/r62-gradle.zip
          unzip -q /tmp/r62-gradle.zip -d /tmp
          cd "$R62_ROOT/android_app"
          /tmp/gradle-8.9/bin/gradle --no-daemon :app:assembleDebug | tee /tmp/R62_ANDROID_BUILD.txt
          APK="$R62_ROOT/android_app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" /tmp/OKN_BP1048P4_R62_CONTROLLER.apk
          sha256sum "$APK" > /tmp/R62_APK_SHA256.txt

      - name: Package R62 build evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r62_artifact
          cp /tmp/OKN_BP1048P4_R62_STANDALONE_FW_PLUS_S25_APP_SOURCE.zip /tmp/r62_artifact/
          for f in \
            /tmp/R62_BP1048P4_OKN_STANDALONE_NOT_FOR_FIRST_FLASH.adx \
            /tmp/R62_BP1048P4_OKN_STANDALONE_NOT_FOR_FIRST_FLASH.bin \
            /tmp/R62_BP1048P4_OKN_STANDALONE.map \
            /tmp/R62_SIZE.txt /tmp/R62_SHA256.txt /tmp/R62_SYMBOLS.txt \
            /tmp/R62_RUNTIME_UNRESOLVED.txt /tmp/R62_BUILD_STATE.txt \
            /tmp/R62_COMPILE_SUMMARY.txt /tmp/R62_SOURCE_GRAPH.txt /tmp/R62_LINK.log \
            /tmp/R62_JAVA_PROTOCOL_TEST.txt /tmp/R62_ANDROID_BUILD.txt /tmp/R62_APK_SHA256.txt \
            /tmp/OKN_BP1048P4_R62_CONTROLLER.apk; do
            test -f "$f" && cp "$f" /tmp/r62_artifact/
          done
          cp "$R62_ROOT/R62_STATUS.json" /tmp/r62_artifact/
          cp "$R62_ROOT/README_R62_TH.md" /tmp/r62_artifact/

      - name: Upload R62 firmware candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R62_BP1048P4_OKN_STANDALONE_FW_PLUS_S25_APP
          path: /tmp/r62_artifact
          if-no-files-found: error
