            "$SDK/BT_Audio_APP/bt_audio_app_src/ai/speex/libspeex" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/ai/speex" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/ai" \
            "$SDK/BT_Audio_APP/bt_audio_app_src/inc" \
