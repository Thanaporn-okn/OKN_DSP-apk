name: Build OKN DSP V83 Stable Upgrade Continuity Proof

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_ANDROID_V83_STABLE_UPGRADE_CONTINUITY_PROOF.zip'
      - '.github/workflows/build-okn-dsp-v83.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify V83 source
        shell: bash
        run: |
          set -euo pipefail
          echo 'f47642a319ef3f902bddda4d05985dbdc361f7c262d7ae4021e36361d29f86eb  OKN_DSP_ANDROID_V83_STABLE_UPGRADE_CONTINUITY_PROOF.zip' | sha256sum -c -
          rm -rf /tmp/okn_v83
          mkdir -p /tmp/okn_v83
          unzip -q OKN_DSP_ANDROID_V83_STABLE_UPGRADE_CONTINUITY_PROOF.zip -d /tmp/okn_v83

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run V83 preflight and verify stable signing certificate
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/okn_v83
          python3 preflight_v83.py
          echo 'ba1c52f2607c09953c52fdd79c5f72026aaf0adb8aa44bcba277f7d9b49d9511  app/okn_dsp_stable_debug.keystore' | sha256sum -c -
          CERT=$(keytool -list -v -keystore app/okn_dsp_stable_debug.keystore -storepass android -alias androiddebugkey | awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr 'A-F' 'a-f')
          test "$CERT" = 'c3da85af2e978dbd0ed9bb695e5c79a263189595c116ad93a1ded75a2eb98397'
          echo "Stable signing certificate SHA-256: $CERT"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build stable-signed debug APK
        working-directory: /tmp/okn_v83
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK signing identity and package artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn_v83/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose "$APK"
          CERT=$($APKSIGNER verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' | tr 'A-F' 'a-f')
          test "$CERT" = 'c3da85af2e978dbd0ed9bb695e5c79a263189595c116ad93a1ded75a2eb98397'
          mkdir -p artifact
          cp "$APK" artifact/OKN_DSP_V83_STABLE_UPGRADE_CONTINUITY_PROOF-debug.apk
          cp /tmp/okn_v83/README_V83.txt artifact/
          cp /tmp/okn_v83/evidence/OKN_DSP_V83_STABLE_UPGRADE_CONTINUITY_PROOF_PLAN.txt artifact/
          cp /tmp/okn_v83/evidence/OKN_DSP_V83_STABLE_UPGRADE_CONTINUITY_PROOF_PLAN.json artifact/
          printf '%s\n' "$CERT" > artifact/OKN_DSP_V83_APK_CERT_SHA256.txt
          sha256sum artifact/OKN_DSP_V83_STABLE_UPGRADE_CONTINUITY_PROOF-debug.apk > artifact/OKN_DSP_V83_STABLE_UPGRADE_CONTINUITY_PROOF-debug.sha256
          ls -lh artifact

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-V83-STABLE-UPGRADE-CONTINUITY-PROOF-debug-apk
          path: artifact/
          if-no-files-found: error
          retention-days: 30
