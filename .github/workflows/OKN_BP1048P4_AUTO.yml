name: OKN BP1048P4 AUTO Verify + USB Probe

on:
  workflow_dispatch:
    inputs:
      source_zip:
        description: "Optional source ZIP filename. Leave blank = auto-pick newest OKN...Source*.zip"
        required: false
        default: ""
  push:
    paths:
      - 'OKN_BP1048P4_PHASE3_TRUE7CH_Source*.zip'
      - 'firmware/**'
      - 'tests/**'
      - 'android-usb-probe/**'
      - '.github/workflows/OKN_BP1048P4_AUTO.yml'
  pull_request:
    paths:
      - 'OKN_BP1048P4_PHASE3_TRUE7CH_Source*.zip'
      - 'firmware/**'
      - 'tests/**'
      - 'android-usb-probe/**'
      - '.github/workflows/OKN_BP1048P4_AUTO.yml'

permissions:
  contents: read

concurrency:
  group: okn-bp1048p4-auto-${{ github.ref }}
  cancel-in-progress: true

env:
  WORK_DIR: .okn_auto_source
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  REQUESTED_ZIP: ${{ inputs.source_zip || '' }}

jobs:
  host-core:
    name: Host core + no-EQ-gain guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve newest source automatically
        id: source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"

          # If a complete source tree is already committed, prefer it.
          if [ -f "tests/run_host_tests.sh" ] && [ -f "firmware/src/okn_gain7.c" ]; then
            echo "Using extracted source tree from repository root"
            echo "SRC_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
            echo "SOURCE_DESC=repository-root" >> "$GITHUB_ENV"
            exit 0
          fi

          selected=""
          if [ -n "${REQUESTED_ZIP:-}" ]; then
            if [ ! -f "$REQUESTED_ZIP" ]; then
              echo "Requested ZIP not found: $REQUESTED_ZIP" >&2
              exit 2
            fi
            selected="$REQUESTED_ZIP"
          else
            mapfile -t candidates < <(
              find . -maxdepth 1 -type f \
                -name 'OKN_BP1048P4_PHASE3_TRUE7CH_Source*.zip' \
                -printf '%f\n' | sort -V
            )
            if [ "${#candidates[@]}" -eq 0 ]; then
              echo "No OKN_BP1048P4_PHASE3_TRUE7CH_Source*.zip found" >&2
              exit 3
            fi
            selected="${candidates[$((${#candidates[@]} - 1))]}"
          fi

          echo "Selected source: $selected"
          sha256sum "$selected"
          unzip -q "$selected" -d "$WORK_DIR"

          src="$WORK_DIR"
          if [ ! -f "$src/tests/run_host_tests.sh" ]; then
            marker="$(find "$WORK_DIR" -mindepth 2 -maxdepth 4 -type f -path '*/tests/run_host_tests.sh' -print -quit || true)"
            if [ -n "$marker" ]; then
              src="$(dirname "$(dirname "$marker")")"
            fi
          fi

          test -f "$src/tests/run_host_tests.sh"
          test -f "$src/firmware/src/okn_gain7.c"

          echo "SRC_DIR=$src" >> "$GITHUB_ENV"
          echo "SOURCE_DESC=$selected" >> "$GITHUB_ENV"

      - name: Host tests + no-EQ-gain guard
        shell: bash
        run: |
          set -euo pipefail
          echo "Source: $SOURCE_DESC"
          bash "$SRC_DIR/tests/run_host_tests.sh"

  android-readonly-probe:
    name: Android USB read-only probe APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve newest source automatically
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"

          if [ -f "android-usb-probe/settings.gradle" ]; then
            echo "Using extracted source tree from repository root"
            echo "SRC_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
            echo "SOURCE_DESC=repository-root" >> "$GITHUB_ENV"
          else
            selected=""
            if [ -n "${REQUESTED_ZIP:-}" ]; then
              if [ ! -f "$REQUESTED_ZIP" ]; then
                echo "Requested ZIP not found: $REQUESTED_ZIP" >&2
                exit 2
              fi
              selected="$REQUESTED_ZIP"
            else
              mapfile -t candidates < <(
                find . -maxdepth 1 -type f \
                  -name 'OKN_BP1048P4_PHASE3_TRUE7CH_Source*.zip' \
                  -printf '%f\n' | sort -V
              )
              if [ "${#candidates[@]}" -eq 0 ]; then
                echo "No OKN_BP1048P4_PHASE3_TRUE7CH_Source*.zip found" >&2
                exit 3
              fi
              selected="${candidates[$((${#candidates[@]} - 1))]}"
            fi

            echo "Selected source: $selected"
            sha256sum "$selected"
            unzip -q "$selected" -d "$WORK_DIR"

            src="$WORK_DIR"
            if [ ! -f "$src/android-usb-probe/settings.gradle" ]; then
              marker="$(find "$WORK_DIR" -mindepth 2 -maxdepth 5 -type f -path '*/android-usb-probe/settings.gradle' -print -quit || true)"
              if [ -n "$marker" ]; then
                src="$(dirname "$(dirname "$marker")")"
              fi
            fi

            test -f "$src/android-usb-probe/settings.gradle"
            echo "SRC_DIR=$src" >> "$GITHUB_ENV"
            echo "SOURCE_DESC=$selected" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK automatically
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -111 | sort -V | tail -n1)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

          app_gradle="$SRC_DIR/android-usb-probe/app/build.gradle"
          api="$(grep -Eo 'compileSdk(Version)?[[:space:]=]+[0-9]+' "$app_gradle" | grep -Eo '[0-9]+' | head -n1 || true)"
          if [ -z "$api" ]; then api=35; fi
          echo "ANDROID_API=$api" >> "$GITHUB_ENV"
          echo "Detected compileSdk: $api"

      - name: Install only required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          # Pick the newest available build-tools matching compileSdk.
          build_tools="$(
            "$SDKMANAGER" --list 2>/dev/null |
            awk -F'|' -v api="$ANDROID_API" '
              $1 ~ "^[[:space:]]*build-tools;" api "\\." {
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); print $1
              }' | sort -V | tail -n1
          )"
          if [ -z "$build_tools" ]; then
            build_tools="build-tools;$ANDROID_API.0.0"
          fi
          echo "Build tools package: $build_tools"

          # Pipe yes only into installation of packages we actually need.
          # This avoids the obsolete global-license/setup-android path that
          # previously tried to install the removed package named "tools".
          set +o pipefail
          yes | "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-$ANDROID_API" \
            "$build_tools"
          rc=${PIPESTATUS[1]}
          set -o pipefail
          exit "$rc"

      - name: Build probe APK automatically
        shell: bash
        run: |
          set -euo pipefail

          project="$SRC_DIR/android-usb-probe"
          echo "Source: $SOURCE_DESC"

          if [ -f "$project/gradlew" ]; then
            chmod +x "$project/gradlew"
            (cd "$project" && ./gradlew :app:assembleDebug --no-daemon --stacktrace)
          else
            GRADLE_VERSION="8.10.2"
            curl -fsSL --retry 3 \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -o "/tmp/gradle-${GRADLE_VERSION}-bin.zip"
            rm -rf "/tmp/gradle-${GRADLE_VERSION}"
            unzip -q "/tmp/gradle-${GRADLE_VERSION}-bin.zip" -d /tmp
            "/tmp/gradle-${GRADLE_VERSION}/bin/gradle" \
              -p "$project" \
              :app:assembleDebug \
              --no-daemon \
              --stacktrace
          fi

      - name: Verify APK + stage artifact
        shell: bash
        run: |
          set -euo pipefail

          out="$SRC_DIR/android-usb-probe/app/build/outputs/apk/debug"
          apk="$(find "$out" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          ls -lh "$apk"

          rm -rf "$GITHUB_WORKSPACE/.okn_artifact"
          mkdir -p "$GITHUB_WORKSPACE/.okn_artifact"
          cp "$apk" "$GITHUB_WORKSPACE/.okn_artifact/"

          {
            echo "source=$SOURCE_DESC"
            echo "commit=$GITHUB_SHA"
            echo "android_api=$ANDROID_API"
            sha256sum "$apk"
          } > "$GITHUB_WORKSPACE/.okn_artifact/OKN_BUILD_META.txt"
          cat "$GITHUB_WORKSPACE/.okn_artifact/OKN_BUILD_META.txt"

      - uses: actions/upload-artifact@v5
        with:
          name: OKN_USB_ReadOnly_Probe_debug
          path: .okn_artifact/*
          if-no-files-found: error
          retention-days: 14
