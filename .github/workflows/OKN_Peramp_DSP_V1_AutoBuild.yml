name: Build OKN Peramp DSP V1

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'OKN_Peramp_DSP_V1_Source.zip'
      - '.github/workflows/OKN_Peramp_DSP_V1_AutoBuild.yml'

permissions:
  contents: read

concurrency:
  group: okn-peramp-dsp-v1-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_ZIP: OKN_Peramp_DSP_V1_Source.zip
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.9'
  ANDROID_PLATFORM: 'android-35'
  ANDROID_BUILD_TOOLS: '35.0.0'

jobs:
  build-apk:
    name: Build OKN Peramp DSP V1 APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source archive
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SOURCE_ZIP"
          unzip -t "$SOURCE_ZIP" >/dev/null
          echo "Source archive: PASS"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          WORK="$RUNNER_TEMP/okn_peramp_dsp_v1"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          unzip -q "$SOURCE_ZIP" -d "$WORK"

          PROJECT_DIR="$(find "$WORK" -maxdepth 3 -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -printf '%h\n' | head -n 1)"

          if [ -z "${PROJECT_DIR:-}" ]; then
            echo "ERROR: Android project root not found"
            find "$WORK" -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          test -d "$PROJECT_DIR/app"
          test -f "$PROJECT_DIR/app/build.gradle" -o -f "$PROJECT_DIR/app/build.gradle.kts"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail
          java -version
          javac -version
          java -version 2>&1 | grep -q 'version "17\.'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"

          echo "sdkmanager=$SDKMANAGER"

          # Keep the runner's installed cmdline-tools. Do not replace it.
          # Ignore SIGPIPE/non-zero from `yes` after sdkmanager exits.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          set -o pipefail

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

          test -d "$ANDROID_HOME/platforms/${ANDROID_PLATFORM}"
          test -d "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Verify Gradle
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle --version | grep -q 'Gradle 8.9'

      - name: Run project preflight
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f tools/preflight.py ]; then
            python3 tools/preflight.py
          elif [ -f preflight_v1.py ]; then
            python3 preflight_v1.py
          elif [ -f tools/preflight_v1.py ]; then
            python3 tools/preflight_v1.py
          else
            echo "ERROR: preflight script not found"
            exit 1
          fi

      - name: Run DSP protocol smoke test
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -x tools/protocol_smoke.sh ]; then
            tools/protocol_smoke.sh
          elif [ -f tools/protocol_smoke.sh ]; then
            bash tools/protocol_smoke.sh
          else
            echo "ERROR: tools/protocol_smoke.sh not found"
            exit 1
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "ERROR: expected APK not found: $APK"
            find "$PROJECT_DIR/app/build/outputs" -maxdepth 6 -type f -print 2>/dev/null | sort || true
            exit 1
          fi

          rm -rf "$GITHUB_WORKSPACE/dist"
          mkdir -p "$GITHUB_WORKSPACE/dist"

          cp "$APK" "$GITHUB_WORKSPACE/dist/OKN_Peramp_DSP_V1-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/dist/OKN_Peramp_DSP_V1-debug.apk" \
            > "$GITHUB_WORKSPACE/dist/OKN_Peramp_DSP_V1-debug.apk.sha256"

          ls -lh "$GITHUB_WORKSPACE/dist"
          cat "$GITHUB_WORKSPACE/dist/OKN_Peramp_DSP_V1-debug.apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN-Peramp-DSP-V1-APK
          path: |
            dist/OKN_Peramp_DSP_V1-debug.apk
            dist/OKN_Peramp_DSP_V1-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: success()
        shell: bash
        run: |
          {
            echo "## OKN Peramp DSP V1"
            echo ""
            echo "- Source archive: PASS"
            echo "- Preflight: PASS"
            echo "- DSP protocol smoke: PASS"
            echo "- Android APK compile: PASS"
            echo "- Java: ${JAVA_VERSION}"
            echo "- Gradle: ${GRADLE_VERSION}"
            echo "- Android platform: ${ANDROID_PLATFORM}"
            echo "- Build tools: ${ANDROID_BUILD_TOOLS}"
            echo "- APK: OKN_Peramp_DSP_V1-debug.apk"
            echo "- Artifact: OKN-Peramp-DSP-V1-APK"
          } >> "$GITHUB_STEP_SUMMARY"
