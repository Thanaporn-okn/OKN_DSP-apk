name: Build OKN Peramp DSP V1

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'OKN_Peramp_DSP_V1_Source.zip'
      - '.github/workflows/OKN_Peramp_DSP_V1_AutoBuild.yml'

permissions:
  contents: read

concurrency:
  group: okn-peramp-dsp-v1-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_ZIP: OKN_Peramp_DSP_V1_Source.zip
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.9'
  ANDROID_PLATFORM: 'android-35'
  ANDROID_BUILD_TOOLS: '35.0.0'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -s "${SOURCE_ZIP}"
          unzip -t "${SOURCE_ZIP}" >/dev/null

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          WORK="$RUNNER_TEMP/okn_peramp_dsp_v1"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          unzip -q "${SOURCE_ZIP}" -d "$WORK"

          PROJECT_DIR="$(find "$WORK" -maxdepth 3 -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -printf '%h\n' | head -n 1)"

          if [ -z "${PROJECT_DIR:-}" ]; then
            echo "ERROR: Android project root not found"
            find "$WORK" -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          test -d "$PROJECT_DIR/app"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"

          echo "sdkmanager=$SDKMANAGER"

          # Use the runner's installed cmdline-tools.
          # Do not replace cmdline-tools, which avoids the old license/version issue.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          set -o pipefail

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

          test -d "$ANDROID_HOME/platforms/${ANDROID_PLATFORM}"
          test -d "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Run preflight
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f preflight_v1.py ]; then
            python3 preflight_v1.py
          elif [ -f tools/preflight.py ]; then
            python3 tools/preflight.py
          elif [ -f tools/preflight_v1.py ]; then
            python3 tools/preflight_v1.py
          else
            echo "No preflight script found; continue build."
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name '*.apk' | sort | head -n 1)"

          test -n "${APK:-}"
          test -s "$APK"

          OUT="$RUNNER_TEMP/okn_output"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          cp "$APK" "$OUT/OKN_Peramp_DSP_V1-debug.apk"
          sha256sum "$OUT/OKN_Peramp_DSP_V1-debug.apk" \
            > "$OUT/OKN_Peramp_DSP_V1-debug.apk.sha256"

          echo "OUTPUT_DIR=$OUT" >> "$GITHUB_ENV"

          ls -lh "$OUT"
          cat "$OUT/OKN_Peramp_DSP_V1-debug.apk.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN-Peramp-DSP-V1-APK
          path: |
            ${{ env.OUTPUT_DIR }}/OKN_Peramp_DSP_V1-debug.apk
            ${{ env.OUTPUT_DIR }}/OKN_Peramp_DSP_V1-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: success()
        shell: bash
        run: |
          {
            echo "## OKN Peramp DSP V1"
            echo ""
            echo "- Build: SUCCESS"
            echo "- Java: ${JAVA_VERSION}"
            echo "- Gradle: ${GRADLE_VERSION}"
            echo "- Android: ${ANDROID_PLATFORM}"
            echo "- Build Tools: ${ANDROID_BUILD_TOOLS}"
            echo "- APK: OKN_Peramp_DSP_V1-debug.apk"
            echo "- Artifact: OKN-Peramp-DSP-V1-APK"
          } >> "$GITHUB_STEP_SUMMARY"
