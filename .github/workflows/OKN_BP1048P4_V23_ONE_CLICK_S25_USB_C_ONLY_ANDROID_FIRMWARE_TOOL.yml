name: OKN BP1048P4 V23 ONE CLICK S25 USB-C ONLY ANDROID FIRMWARE TOOL

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/OKN_BP1048P4_V23_ONE_CLICK_S25_USB_C_ONLY_ANDROID_FIRMWARE_TOOL.yml'

permissions:
  contents: read

env:
  REQUIRED_PATH: "Samsung Galaxy S25+ -> USB-C cable -> DSP USB-C port only"
  SOLDER_ALLOWED: "NO"
  BOARD_MOD_ALLOWED: "NO"
  JTAG_ALLOWED: "NO"
  SDP_ALLOWED: "NO"
  AICE_ALLOWED: "NO"
  HARDWARE_PROBE_ALLOWED: "NO"

jobs:
  one_click:
    name: Build one-click BP1048P4 USB-C Android tool
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: ONE CLICK - validate constraints, generate app, build APK, package evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Permanent hardware constraints.
          test "$REQUIRED_PATH" = "Samsung Galaxy S25+ -> USB-C cable -> DSP USB-C port only"
          for v in SOLDER_ALLOWED BOARD_MOD_ALLOWED JTAG_ALLOWED SDP_ALLOWED AICE_ALLOWED HARDWARE_PROBE_ALLOWED; do
            test "${!v}" = "NO"
          done

          rm -rf /tmp/v23
          mkdir -p /tmp/v23/app/app/src/main/java/com/okn/bp1048p4 /tmp/v23/evidence

          cat > /tmp/v23/evidence/PROJECT_CONSTRAINTS.txt <<'EOF'
          TARGET_DSP=MVSilicon BP1048P4
          REQUIRED_PHONE=Samsung Galaxy S25+
          REQUIRED_PHYSICAL_PATH=Samsung Galaxy S25+ -> USB-C cable -> DSP USB-C port only
          SOLDERING=FORBIDDEN
          BOARD_MODIFICATION=FORBIDDEN
          JTAG=FORBIDDEN
          SDP=FORBIDDEN
          AICE=FORBIDDEN
          HARDWARE_PROBE=FORBIDDEN
          STOCK_USB_C_ONLY=YES
          EOF

          # Pull the current repository only to inventory any firmware/MVA samples.
          git clone -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/v23/repo
          find /tmp/v23/repo -type f \( -iname '*.mva' -o -iname '*.bin' -o -iname '*.fw' -o -iname '*.img' \) \
            -printf '%p\t%s\n' | sort > /tmp/v23/evidence/LOCAL_FIRMWARE_CANDIDATES.txt || true

          A=/tmp/v23/app

          cat > "$A/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'OKN_BP1048P4_USB_C'
          include ':app'
          EOF

          cat > "$A/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > "$A/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > "$A/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.okn.bp1048p4'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.okn.bp1048p4'
                  minSdk 29
                  targetSdk 35
                  versionCode 23
                  versionName '23.0'
              }
          }
          EOF

          cat > "$A/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.usb.host" android:required="true" />
              <application
                  android:allowBackup="false"
                  android:label="OKN BP1048P4 USB-C"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED" />
                      </intent-filter>
                      <meta-data
                          android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED"
                          android:resource="@xml/device_filter" />
                  </activity>
              </application>
          </manifest>
          EOF

          mkdir -p "$A/app/src/main/res/xml"
          cat > "$A/app/src/main/res/xml/device_filter.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <!-- Runtime 0x6324:0x1719 -->
              <usb-device vendor-id="25380" product-id="5913" />
              <!-- FlashBoot recovery 0x0000:0x2244 -->
              <usb-device vendor-id="0" product-id="8772" />
          </resources>
          EOF

          cat > "$A/app/src/main/java/com/okn/bp1048p4/MainActivity.java" <<'JAVA'
          package com.okn.bp1048p4;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.graphics.Typeface;
          import android.hardware.usb.UsbDevice;
          import android.hardware.usb.UsbDeviceConnection;
          import android.hardware.usb.UsbInterface;
          import android.hardware.usb.UsbManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.OpenableColumns;
          import android.database.Cursor;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.security.MessageDigest;
          import java.util.Locale;
          import java.util.Map;

          public class MainActivity extends Activity {
              private static final String ACTION_USB_PERMISSION = "com.okn.bp1048p4.USB_PERMISSION";

              private static final int RUNTIME_VID = 0x6324;
              private static final int RUNTIME_PID = 0x1719;
              private static final int RUNTIME_IFACE = 4;
              private static final int RUNTIME_FEATURE_VALUE = 0x0300;

              private static final int RECOVERY_VID = 0x0000;
              private static final int RECOVERY_PID = 0x2244;
              private static final int RECOVERY_IFACE = 0;
              private static final int REPORT_BYTES = 256;
              private static final int BLOCK_BYTES = 4096;
              private static final int REPORTS_PER_BLOCK = 16;

              private UsbManager usb;
              private UsbDevice selected;
              private TextView status;
              private Uri firmwareUri;

              private final BroadcastReceiver usbReceiver = new BroadcastReceiver() {
                  @Override public void onReceive(Context context, Intent intent) {
                      if (ACTION_USB_PERMISSION.equals(intent.getAction())) {
                          UsbDevice d = intent.getParcelableExtra(UsbManager.EXTRA_DEVICE);
                          boolean granted = intent.getBooleanExtra(UsbManager.EXTRA_PERMISSION_GRANTED, false);
                          log("USB permission: " + granted + deviceText(d));
                          if (granted && d != null) selected = d;
                      }
                  }
              };

              @Override protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  usb = (UsbManager) getSystemService(Context.USB_SERVICE);

                  IntentFilter f = new IntentFilter(ACTION_USB_PERMISSION);
                  if (Build.VERSION.SDK_INT >= 33) {
                      registerReceiver(usbReceiver, f, Context.RECEIVER_NOT_EXPORTED);
                  } else {
                      registerReceiver(usbReceiver, f);
                  }

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(28, 28, 28, 28);

                  TextView title = new TextView(this);
                  title.setText("OKN • MVSilicon BP1048P4");
                  title.setTextSize(22);
                  title.setTypeface(Typeface.DEFAULT_BOLD);
                  root.addView(title);

                  TextView path = new TextView(this);
                  path.setText(
                      "\nเส้นทางฮาร์ดแวร์ที่อนุญาตเท่านั้น\n" +
                      "Samsung Galaxy S25+ → สาย USB-C → พอร์ต USB-C บอร์ด DSP\n" +
                      "ห้ามบัดกรี • ห้ามแก้ไขบอร์ด • ไม่ใช้ JTAG / SDP / AICE\n"
                  );
                  root.addView(path);

                  addButton(root, "1) สแกน DSP ทาง USB-C", v -> scan());
                  addButton(root, "2) ขอสิทธิ์ USB", v -> requestPermission());
                  addButton(root, "3) ทดสอบ Runtime แบบไม่เข้า FlashBoot", v -> runtimePreflight());
                  addButton(root, "4) เข้า FlashBoot ผ่าน USB-C", v -> confirmEnterFlashBoot());
                  addButton(root, "5) เลือกไฟล์เฟิร์มแวร์", v -> chooseFirmware());
                  addButton(root, "6) ตรวจไฟล์ / SHA-256 / CRC", v -> inspectFirmware());

                  Button dump = addButton(root, "อ่าน Firmware ทั้งชิป — ยังล็อก", v -> {});
                  dump.setEnabled(false);

                  Button flash = addButton(root, "ลง Firmware — ยังล็อกจนยืนยันไฟล์ BP1048P4", v -> {});
                  flash.setEnabled(false);

                  TextView gate = new TextView(this);
                  gate.setText(
                      "\nเหตุผลที่ 2 ปุ่มสุดท้ายยังล็อก:\n" +
                      "• USB readback ของ stock BP1048P4 ยังไม่มีคำสั่งที่พิสูจน์แล้ว\n" +
                      "• รูปแบบ container/padding ของไฟล์สำหรับบอร์ดตัวนี้ยังต้องยืนยันจาก known-good firmware\n" +
                      "แอปจะไม่เดาคำสั่ง erase/write เพื่อป้องกันบอร์ดเสีย\n"
                  );
                  root.addView(gate);

                  status = new TextView(this);
                  status.setTextIsSelectable(true);
                  status.setTypeface(Typeface.MONOSPACE);
                  status.setText("\nLog:\n");
                  root.addView(status);

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(root);
                  setContentView(scroll);

                  scan();
              }

              private Button addButton(LinearLayout root, String text, View.OnClickListener click) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setAllCaps(false);
                  b.setOnClickListener(click);
                  root.addView(b);
                  return b;
              }

              private void log(String s) {
                  status.append(s + "\n");
              }

              private String deviceText(UsbDevice d) {
                  if (d == null) return "";
                  return String.format(Locale.US, " [%04X:%04X name=%s]",
                      d.getVendorId(), d.getProductId(), d.getDeviceName());
              }

              private boolean isRuntime(UsbDevice d) {
                  return d != null && d.getVendorId() == RUNTIME_VID && d.getProductId() == RUNTIME_PID;
              }

              private boolean isRecovery(UsbDevice d) {
                  return d != null && d.getVendorId() == RECOVERY_VID && d.getProductId() == RECOVERY_PID;
              }

              private void scan() {
                  selected = null;
                  Map<String, UsbDevice> map = usb.getDeviceList();
                  log("USB devices = " + map.size());
                  for (UsbDevice d : map.values()) {
                      log("พบ" + deviceText(d));
                      if (isRuntime(d) || isRecovery(d)) selected = d;
                  }
                  if (selected == null) {
                      log("ยังไม่พบ BP1048P4 runtime/recovery");
                  } else if (isRuntime(selected)) {
                      log("สถานะ: RUNTIME 6324:1719");
                  } else {
                      log("สถานะ: FLASHBOOT RECOVERY 0000:2244");
                  }
              }

              private void requestPermission() {
                  if (selected == null) scan();
                  if (selected == null) {
                      toast("ยังไม่พบ DSP");
                      return;
                  }
                  if (usb.hasPermission(selected)) {
                      log("มีสิทธิ์ USB แล้ว" + deviceText(selected));
                      return;
                  }
                  Intent i = new Intent(ACTION_USB_PERMISSION).setPackage(getPackageName());
                  PendingIntent pi = PendingIntent.getBroadcast(
                      this, 0, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_MUTABLE);
                  usb.requestPermission(selected, pi);
              }

              private UsbInterface findInterface(UsbDevice d, int id) {
                  for (int i = 0; i < d.getInterfaceCount(); i++) {
                      UsbInterface x = d.getInterface(i);
                      if (x.getId() == id) return x;
                  }
                  return null;
              }

              private UsbDeviceConnection openSelected(int ifaceId) {
                  if (selected == null) scan();
                  if (selected == null || !usb.hasPermission(selected)) {
                      toast("ต้องพบ DSP และอนุญาต USB ก่อน");
                      return null;
                  }
                  UsbDeviceConnection c = usb.openDevice(selected);
                  if (c == null) return null;
                  UsbInterface intf = findInterface(selected, ifaceId);
                  if (intf == null || !c.claimInterface(intf, true)) {
                      log("claim interface " + ifaceId + " ไม่สำเร็จ");
                      c.close();
                      return null;
                  }
                  return c;
              }

              private void runtimePreflight() {
                  if (!isRuntime(selected)) {
                      toast("ต้องอยู่โหมด Runtime 6324:1719");
                      return;
                  }
                  UsbDeviceConnection c = openSelected(RUNTIME_IFACE);
                  if (c == null) return;
                  try {
                      byte[] zero = new byte[8];
                      int s = c.controlTransfer(0x21, 0x09, RUNTIME_FEATURE_VALUE,
                          RUNTIME_IFACE, zero, zero.length, 1500);
                      byte[] r = new byte[8];
                      int g = c.controlTransfer(0xA1, 0x01, RUNTIME_FEATURE_VALUE,
                          RUNTIME_IFACE, r, r.length, 1500);
                      log("Runtime preflight SET=" + s + " GET=" + g +
                          " first=" + (g > 0 ? String.format("%02X", r[0] & 0xff) : "--"));
                  } finally {
                      c.close();
                  }
              }

              private void confirmEnterFlashBoot() {
                  if (!isRuntime(selected)) {
                      toast("ต้องอยู่โหมด Runtime 6324:1719");
                      return;
                  }
                  new AlertDialog.Builder(this)
                      .setTitle("เข้า FlashBoot ผ่าน USB-C")
                      .setMessage(
                          "คำสั่งนี้เปลี่ยน DSP จาก Runtime ไป Recovery เท่านั้น " +
                          "ไม่ erase และไม่เขียน firmware\n\n" +
                          "เส้นทางต้องเป็น S25+ → USB-C → DSP USB-C เท่านั้น")
                      .setNegativeButton("ยกเลิก", null)
                      .setPositiveButton("เข้า FlashBoot", (d,w) -> enterFlashBoot())
                      .show();
              }

              private void enterFlashBoot() {
                  UsbDeviceConnection c = openSelected(RUNTIME_IFACE);
                  if (c == null) return;
                  try {
                      byte[] arm = new byte[8];
                      arm[0] = (byte)0xAA;
                      int s = c.controlTransfer(0x21, 0x09, RUNTIME_FEATURE_VALUE,
                          RUNTIME_IFACE, arm, arm.length, 1500);
                      byte[] r = new byte[8];
                      int g = c.controlTransfer(0xA1, 0x01, RUNTIME_FEATURE_VALUE,
                          RUNTIME_IFACE, r, r.length, 1500);
                      log("FlashBoot request SET=" + s + " GET=" + g +
                          " response0=" + (g > 0 ? String.format("%02X", r[0] & 0xff) : "--"));
                  } finally {
                      c.close();
                  }
                  new Handler(Looper.getMainLooper()).postDelayed(this::scan, 1800);
              }

              private void chooseFirmware() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.setType("*/*");
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  startActivityForResult(i, 1048);
              }

              @Override protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == 1048 && resultCode == RESULT_OK && data != null) {
                      firmwareUri = data.getData();
                      log("เลือก firmware: " + fileName(firmwareUri));
                  }
              }

              private String fileName(Uri uri) {
                  if (uri == null) return "(none)";
                  try (Cursor c = getContentResolver().query(uri, null, null, null, null)) {
                      if (c != null && c.moveToFirst()) {
                          int i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                          if (i >= 0) return c.getString(i);
                      }
                  }
                  return uri.toString();
              }

              private void inspectFirmware() {
                  if (firmwareUri == null) {
                      toast("เลือกไฟล์ก่อน");
                      return;
                  }
                  try (InputStream in = getContentResolver().openInputStream(firmwareUri);
                       ByteArrayOutputStream out = new ByteArrayOutputStream()) {
                      byte[] buf = new byte[32768];
                      int n;
                      while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                      byte[] bytes = out.toByteArray();

                      MessageDigest md = MessageDigest.getInstance("SHA-256");
                      String sha = hex(md.digest(bytes));
                      int crc = crc16(bytes, 0, bytes.length, 0);
                      String fast = bytes.length >= 0xEC
                          ? String.format(Locale.US, "%04X", mvaFastCrc(bytes))
                          : "N/A (<0xEC)";

                      log("Firmware name=" + fileName(firmwareUri));
                      log("bytes=" + bytes.length + " mod4096=" + (bytes.length % BLOCK_BYTES));
                      log("SHA-256=" + sha);
                      log(String.format(Locale.US, "CRC16 whole=%04X MVA-fast=%s", crc, fast));
                      log("transfer arithmetic: " + REPORTS_PER_BLOCK + " x " + REPORT_BYTES + " = " + BLOCK_BYTES);
                  } catch (Exception e) {
                      log("inspect error: " + e);
                  }
              }

              private static int crc16(byte[] b, int off, int len, int seed) {
                  int crc = seed & 0xffff;
                  for (int i = off; i < off + len; i++) {
                      crc ^= (b[i] & 0xff) << 8;
                      for (int j = 0; j < 8; j++) {
                          crc = (crc & 0x8000) != 0
                              ? ((crc << 1) ^ 0x1021) & 0xffff
                              : (crc << 1) & 0xffff;
                      }
                  }
                  return crc;
              }

              private static int mvaFastCrc(byte[] b) {
                  int crc = 0;
                  crc = crc16(b, 0x0000, 0x00A4, crc);
                  crc = crc16(b, 0x00A8, 0x0014, crc);
                  crc = crc16(b, 0x00C0, 0x000C, crc);
                  crc = crc16(b, 0x00D4, 0x0010, crc);
                  crc = crc16(b, 0x00EC, b.length - 0x00EC, crc);
                  return crc;
              }

              private static String hex(byte[] b) {
                  StringBuilder s = new StringBuilder();
                  for (byte x : b) s.append(String.format(Locale.US, "%02x", x & 0xff));
                  return s.toString();
              }

              private void toast(String s) {
                  Toast.makeText(this, s, Toast.LENGTH_SHORT).show();
                  log(s);
              }

              @Override protected void onDestroy() {
                  try { unregisterReceiver(usbReceiver); } catch (Exception ignored) {}
                  super.onDestroy();
              }
          }
          JAVA

          cat > "$A/README.md" <<'EOF'
          # OKN BP1048P4 V23 Android USB-C tool

          Permanent hardware path:
          **Samsung Galaxy S25+ -> USB-C cable -> DSP USB-C port only**

          Forbidden:
          - soldering
          - board modification
          - JTAG
          - SDP
          - AICE
          - debug/hardware probe

          Implemented in this APK:
          - enumerate BP1048P4 runtime 6324:1719
          - request Android USB permission
          - runtime Feature-report preflight
          - user-confirmed Runtime -> FlashBoot transition over USB-C
          - detect FlashBoot recovery 0000:2244
          - choose local firmware file
          - SHA-256 + CRC-16/CCITT inspection
          - MVA FastCRC coverage already recovered from prior static proof

          Fail-closed:
          - full stock-USB firmware dump is NOT enabled because V9.4 proved the known
            FLASH_READ 0x03 path belongs to the AndeSight/ICE debugger path, not a
            stock BP1048 USB readback command.
          - erase/write is NOT enabled until one known-good firmware image for the
            exact BP1048P4 board proves container semantics and final 4KB padding.

          Recovery transport facts retained:
          - Output SET_REPORT: bmRequestType 0x21, bRequest 0x09, wValue 0x0200, interface 0
          - Input GET_REPORT:  bmRequestType 0xA1, bRequest 0x01, wValue 0x0100, interface 0
          - 256 bytes/report
          - 16 reports = 4096 bytes
          - ACK status byte offset 8
          - section block order 1..N-1 then block 0
          EOF

          cat > /tmp/v23/evidence/V23_STATUS.json <<'EOF'
          {
            "target": "MVSilicon BP1048P4",
            "required_phone": "Samsung Galaxy S25+",
            "required_path": "Samsung Galaxy S25+ -> USB-C cable -> DSP USB-C port only",
            "soldering_allowed": false,
            "board_modification_allowed": false,
            "jtag_sdp_aice_allowed": false,
            "runtime_vid_pid": "6324:1719",
            "runtime_hid_interface": 4,
            "recovery_vid_pid": "0000:2244",
            "recovery_hid_interface": 0,
            "report_bytes": 256,
            "reports_per_block": 16,
            "block_bytes": 4096,
            "ack_status_offset": 8,
            "block_order": "1..N-1 then 0",
            "crc": "CRC-16/CCITT poly 0x1021 init 0x0000",
            "android_runtime_preflight_implemented": true,
            "android_flashboot_entry_implemented": true,
            "android_firmware_file_inspection_implemented": true,
            "stock_usb_full_firmware_readback_proven": false,
            "full_firmware_dump_enabled": false,
            "flash_erase_write_enabled": false,
            "reason_readback_locked": "Known FLASH_READ 0x03 is SPI-NOR debugger/ICE path evidence, not a proven stock BP1048 USB command.",
            "reason_flash_locked": "Exact-board known-good firmware container semantics and full final-block padding are not yet proven."
          }
          EOF

          SDKMAN="$(command -v sdkmanager || true)"
          if [ -n "$SDKMAN" ]; then
            set +o pipefail
            yes | "$SDKMAN" --licenses >/dev/null 2>&1 || true
            set -o pipefail
            "$SDKMAN" "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true
          fi

          cd /tmp/v23
          curl -fL --retry 3 --connect-timeout 15 \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
          unzip -q gradle.zip
          export PATH="/tmp/v23/gradle-8.9/bin:$PATH"

          java -version
          gradle --version

          cd "$A"
          gradle --no-daemon :app:assembleDebug

          mkdir -p /tmp/v23/out
          cp "$A/app/build/outputs/apk/debug/app-debug.apk" \
             /tmp/v23/out/OKN_BP1048P4_V23_S25_USB_C_ONLY.apk

          cd "$A"
          zip -9 -r /tmp/v23/out/OKN_BP1048P4_V23_ANDROID_SOURCE.zip . >/dev/null

          cp /tmp/v23/evidence/V23_STATUS.json /tmp/v23/out/
          cp /tmp/v23/evidence/PROJECT_CONSTRAINTS.txt /tmp/v23/out/
          cp /tmp/v23/evidence/LOCAL_FIRMWARE_CANDIDATES.txt /tmp/v23/out/
          sha256sum /tmp/v23/out/* > /tmp/v23/out/SHA256SUMS.txt

          {
            echo "# BP1048P4 V23 — ONE CLICK"
            echo
            echo "**Required physical path:** Samsung Galaxy S25+ → USB-C cable → DSP USB-C port only."
            echo
            echo "- Soldering / board modification / JTAG / SDP / AICE: **forbidden**"
            echo "- Android APK built: **YES**"
            echo "- Runtime → FlashBoot USB-C code: **included**"
            echo "- Firmware file inspector: **included**"
            echo "- Full firmware dump: **locked; stock-USB readback command not proven**"
            echo "- Erase/write: **locked; exact-board container/padding proof still required**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK + source + status
