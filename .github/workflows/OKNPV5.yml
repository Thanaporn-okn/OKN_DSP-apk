      # setup-gradle scans Gradle project files, so the generated project must exist first.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Verify protocol core and V5 diagnostic trace
        shell: bash
        run: |
          set -euo pipefail
          echo "1a5d5652449756840cd5c6b07bfc1d5876bd57b4913b8a882e1a7db4e4f8638e  app/src/main/java/com/okn/peramp/DspProtocol.java" | sha256sum -c -
          echo "bfb561779cad6ec90a528f484b24238fc588abb7ae8c3ac3eb7568d3e3c2f828  app/src/main/java/com/okn/peramp/BleManager.java" | sha256sum -c -

      - name: Validate PEQ safety reset and V5 no-unknown-TX gate
        shell: bash
        run: |
          set -euo pipefail
          python3 Sources/validate_v38_gate.py
          python3 Sources/validate_v39_reset_v5.py
          python3 Sources/validate_oknpv5.py

      - name: Build Debug and Release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk OKNPV5-debug.apk
          cp app/build/outputs/apk/release/app-release.apk OKNPV5-release.apk

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging OKNPV5-debug.apk | tee OKNPV5-apk-badging.txt
          grep -q "package: name='com.okn.peramp' versionCode='5000' versionName='5.0.0'" OKNPV5-apk-badging.txt
          grep -q "application-label:'OKN Peramp'" OKNPV5-apk-badging.txt

      - name: Package generated source evidence and checksums
        shell: bash
        run: |
          set -euo pipefail
          zip -qr OKNPV5-source.zip app Sources build.gradle settings.gradle gradle.properties -x '*/build/*' -x '.gradle/*'
          cp Sources/OKNPV5_REVERSE_CHECKPOINT.txt OKNPV5-REVERSE-CHECKPOINT.txt
          sha256sum OKNPV5-debug.apk OKNPV5-release.apk OKNPV5-source.zip OKNPV5-REVERSE-CHECKPOINT.txt > OKNPV5-SHA256SUMS.txt
          cat OKNPV5-SHA256SUMS.txt

      - name: Upload OKNPV5 artifact
        uses: actions/upload-artifact@v7
        with:
          name: OKNPV5
          path: |
            OKNPV5-debug.apk
            OKNPV5-release.apk
            OKNPV5-source.zip
            OKNPV5-SHA256SUMS.txt
            OKNPV5-apk-badging.txt
            OKNPV5-REVERSE-CHECKPOINT.txt
          if-no-files-found: error
          retention-days: 30
