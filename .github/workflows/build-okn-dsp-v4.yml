name: Build OKN DSP V4

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Locate V4 project ZIP
        id: locate
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 1 -type f -name 'OKN_DSP_V4_PROJECT.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "OKN_DSP_V4_PROJECT.zip not found in repository root."
            echo "Upload the V4 ZIP to the repository root, then run this workflow again."
            exit 1
          fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract project files
        shell: bash
        run: |
          set -e
          rm -rf payload temp_app
          mkdir payload
          unzip -q "${{ steps.locate.outputs.zip }}" -d payload
          test -f payload/pubspec.yaml
          test -f payload/lib/main.dart
          test -f payload/android_patch/MainActivity.kt

      - name: Create clean Flutter Android project
        shell: bash
        run: |
          set -e
          flutter create \
            --platforms=android \
            --org com.okn \
            --project-name okn_dsp \
            temp_app

      - name: Install V4 application files
        shell: bash
        run: |
          set -e
          cp payload/pubspec.yaml temp_app/pubspec.yaml
          cp -R payload/lib temp_app/lib
          mkdir -p temp_app/android/app/src/main/kotlin/com/okn/okn_dsp
          cp payload/android_patch/MainActivity.kt \
            temp_app/android/app/src/main/kotlin/com/okn/okn_dsp/MainActivity.kt

          python3 - <<'PY'
          from pathlib import Path
          p = Path("temp_app/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = '''
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN"
                  android:usesPermissionFlags="neverForLocation"/>
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
          '''
          if "android.permission.BLUETOOTH_SCAN" not in s:
              s = s.replace(marker, marker + permissions, 1)
          p.write_text(s)
          PY

      - name: Get packages
        working-directory: temp_app
        run: flutter pub get

      - name: Analyze
        working-directory: temp_app
        run: flutter analyze

      - name: Build APK
        working-directory: temp_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN_DSP_V4_APK
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
