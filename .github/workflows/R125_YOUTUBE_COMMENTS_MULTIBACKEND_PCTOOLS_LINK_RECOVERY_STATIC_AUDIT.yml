name: R125 YouTube comments multi-backend PCTools link recovery static audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R125_YOUTUBE_COMMENTS_MULTIBACKEND_PCTOOLS_LINK_RECOVERY_STATIC_AUDIT.yml"

permissions:
  contents: read

concurrency:
  group: r125-youtube-comments-recovery-${{ github.ref }}
  cancel-in-progress: true

env:
  VIDEO_ID: "oSIWbddW7Rc"
  VIDEO_URL: "https://www.youtube.com/watch?v=oSIWbddW7Rc"
  FLASH_ALLOWED: "NO"

jobs:
  recover:
    name: STATIC PUBLIC COMMENTS/LINK RECOVERY ONLY - no execution - no USB - no board
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r125/raw /tmp/r125/downloads /tmp/r125/evidence
          cat > /tmp/r125/evidence/R125_SAFETY.txt <<'EOF'
          R125_MODE=PUBLIC_METADATA_COMMENTS_AND_LINK_RECOVERY_ONLY
          R125_VENDOR_BINARY_EXECUTED=NO
          R125_INSTALLER_EXECUTED=NO
          R125_USB_DEVICE_ACCESS=NO
          R125_BOARD_CONTACT=NO
          R125_BLE_CONNECTION=NO
          R125_AA55_SENT=NO
          R125_RUNTIME_0X11_SENT=NO
          R125_FLASHBOOT_COMMAND_SENT=NO
          R125_FLASH_READ_EXECUTED=NO
          R125_FLASH_ERASE_EXECUTED=NO
          R125_FLASH_WRITE_EXECUTED=NO
          R125_ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD=NO
          FINAL_REQUIRED_TRANSPORT=SAMSUNG_S25_PLUS_USB_C_DIRECT_TO_DSP_USB_C
          HARDWARE_MODIFICATION=FORBIDDEN
          FLASH_ALLOWED=NO
          EOF

      - name: Install public-link tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            curl jq file unzip p7zip-full binutils python3-pip >/dev/null
          python3 -m pip install --disable-pip-version-check --no-input \
            requests gdown pefile >/dev/null

      - name: Capture YouTube watch HTML and public oEmbed/noembed metadata
        shell: bash
        run: |
          set -euo pipefail

          curl --location --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 60 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            -H 'Accept-Language: en-US,en;q=0.9' \
            "$VIDEO_URL" \
            -o /tmp/r125/raw/watch.html || true

          curl --location --retry 2 --retry-all-errors \
            --connect-timeout 15 --max-time 30 \
            "https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${VIDEO_ID}&format=json" \
            -o /tmp/r125/raw/oembed.json || true

          curl --location --retry 2 --retry-all-errors \
            --connect-timeout 15 --max-time 30 \
            "https://noembed.com/embed?url=https://www.youtube.com/watch?v=${VIDEO_ID}" \
            -o /tmp/r125/raw/noembed.json || true

          {
            for f in /tmp/r125/raw/watch.html /tmp/r125/raw/oembed.json /tmp/r125/raw/noembed.json; do
              if [ -f "$f" ]; then
                echo "$(basename "$f") bytes=$(stat -c '%s' "$f") sha256=$(sha256sum "$f" | awk '{print $1}')"
              fi
            done
          } > /tmp/r125/evidence/R125_INITIAL_FETCH_STATUS.txt

      - name: Try direct YouTube Innertube next/comments API from public watch config
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,json,requests,time,html
          from urllib.parse import urlparse,parse_qs,unquote

          root=Path("/tmp/r125/raw")
          ev=Path("/tmp/r125/evidence")
          watch=(root/"watch.html").read_text(errors="replace") if (root/"watch.html").exists() else ""

          def rx(pattern):
              m=re.search(pattern,watch)
              return m.group(1) if m else None

          key=rx(r'"INNERTUBE_API_KEY":"([^"]+)"')
          client_version=rx(r'"INNERTUBE_CLIENT_VERSION":"([^"]+)"')
          visitor=rx(r'"VISITOR_DATA":"([^"]+)"')

          cfg={
              "api_key_found":bool(key),
              "client_version":client_version,
              "visitor_data_found":bool(visitor),
          }
          ev.joinpath("R125_INNERTUBE_CONFIG.json").write_text(json.dumps(cfg,indent=2)+"\n")

          headers={
              "User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
              "Content-Type":"application/json",
              "Origin":"https://www.youtube.com",
              "Referer":"https://www.youtube.com/watch?v=oSIWbddW7Rc",
          }
          if visitor:
              headers["X-Goog-Visitor-Id"]=visitor

          base_context={
              "client":{
                  "clientName":"WEB",
                  "clientVersion":client_version or "2.20260920.01.00",
                  "hl":"en",
                  "gl":"US",
              }
          }

          responses=[]
          comments=[]
          urls=[]
          seen_comments=set()

          url_re=re.compile(r'https?://[^\s<>"\'\]\)]+',re.I)

          def simple_text(obj):
              if not isinstance(obj,dict): return ""
              if "simpleText" in obj:
                  return str(obj.get("simpleText") or "")
              runs=obj.get("runs")
              if isinstance(runs,list):
                  return "".join(str(r.get("text") or "") for r in runs if isinstance(r,dict))
              return ""

          def walk(obj,path=""):
              if isinstance(obj,dict):
                  # commentRenderer
                  cr=obj.get("commentRenderer")
                  if isinstance(cr,dict):
                      cid=str(cr.get("commentId") or "")
                      text=simple_text(cr.get("contentText") or {})
                      author=simple_text(cr.get("authorText") or {})
                      if cid or text:
                          keyc=cid+"|"+text
                          if keyc not in seen_comments:
                              seen_comments.add(keyc)
                              comments.append({"id":cid,"author":author,"text":text,"source":"innertube"})
                              for u in url_re.findall(html.unescape(text)):
                                  urls.append({"source":"innertube_comment:"+cid,"url":u.rstrip(".,;:!?'\"")})
                  for k,v in obj.items():
                      walk(v,path+"/"+str(k))
              elif isinstance(obj,list):
                  for i,v in enumerate(obj):
                      walk(v,path+f"/{i}")

          continuations=[]

          def collect_continuations(obj):
              found=[]
              def rec(x):
                  if isinstance(x,dict):
                      cc=x.get("continuationCommand")
                      if isinstance(cc,dict):
                          tok=cc.get("token")
                          if tok and isinstance(tok,str):
                              found.append(tok)
                      for v in x.values():
                          rec(v)
                  elif isinstance(x,list):
                      for v in x: rec(v)
              rec(obj)
              return found

          if key:
              endpoint=f"https://www.youtube.com/youtubei/v1/next?key={key}"
              try:
                  r=requests.post(endpoint,headers=headers,json={
                      "context":base_context,
                      "videoId":"oSIWbddW7Rc"
                  },timeout=30)
                  responses.append({"stage":"video_next","status":r.status_code,"bytes":len(r.content),"text_head":r.text[:1000]})
                  if r.ok:
                      obj=r.json()
                      walk(obj)
                      continuations=collect_continuations(obj)
              except Exception as e:
                  responses.append({"stage":"video_next","error":repr(e)})

              # Follow up to 12 continuation tokens, prioritizing comments-related tokens is
              # not reliably detectable, so dedupe and inspect all until comments appear.
              queue=[]
              seen=set()
              for t in continuations:
                  if t not in seen:
                      seen.add(t); queue.append(t)

              attempts=0
              while queue and attempts<12:
                  tok=queue.pop(0)
                  attempts+=1
                  try:
                      r=requests.post(endpoint,headers=headers,json={
                          "context":base_context,
                          "continuation":tok
                      },timeout=30)
                      responses.append({
                          "stage":"continuation",
                          "attempt":attempts,
                          "status":r.status_code,
                          "bytes":len(r.content),
                          "text_head":r.text[:500]
                      })
                      if not r.ok:
                          continue
                      obj=r.json()
                      before=len(comments)
                      walk(obj)
                      for nt in collect_continuations(obj):
                          if nt not in seen:
                              seen.add(nt); queue.append(nt)
                      # Once comment threads are flowing, keep paging but cap at 12.
                  except Exception as e:
                      responses.append({"stage":"continuation","attempt":attempts,"error":repr(e)})

          ev.joinpath("R125_INNERTUBE_ATTEMPTS.json").write_text(
              json.dumps(responses,indent=2,ensure_ascii=False)+"\n"
          )
          ev.joinpath("R125_INNERTUBE_COMMENTS.json").write_text(
              json.dumps(comments,indent=2,ensure_ascii=False)+"\n"
          )
          ev.joinpath("R125_INNERTUBE_URLS.json").write_text(
              json.dumps(urls,indent=2,ensure_ascii=False)+"\n"
          )
          PY

      - name: Query healthy public Invidious instances for comments
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import requests,json,re,html
          from urllib.parse import urlparse

          ev=Path("/tmp/r125/evidence")
          url_re=re.compile(r'https?://[^\s<>"\'\]\)]+',re.I)

          attempts=[]
          comments=[]
          urls=[]
          seen=set()

          try:
              r=requests.get("https://api.invidious.io/instances.json?sort_by=health",timeout=30)
              instances=r.json() if r.ok else []
          except Exception as e:
              attempts.append({"stage":"instance_list","error":repr(e)})
              instances=[]

          candidates=[]
          for item in instances:
              if not isinstance(item,list) or len(item)<2: continue
              host,info=item[0],item[1]
              if not isinstance(info,dict): continue
              if info.get("api") is False: continue
              if info.get("type")=="onion": continue
              uri=info.get("uri") or ("https://"+host)
              if isinstance(uri,str) and uri.startswith("http"):
                  candidates.append(uri.rstrip("/"))
              if len(candidates)>=25: break

          for base in candidates:
              api=f"{base}/api/v1/comments/oSIWbddW7Rc?sort_by=top"
              try:
                  r=requests.get(api,timeout=15,headers={"User-Agent":"Mozilla/5.0"})
                  attempts.append({"base":base,"status":r.status_code,"bytes":len(r.content),"head":r.text[:300]})
                  if not r.ok: continue
                  obj=r.json()
                  def rec(x):
                      if isinstance(x,dict):
                          text=str(x.get("content") or x.get("contentHtml") or "")
                          cid=str(x.get("commentId") or "")
                          author=str(x.get("author") or "")
                          if text:
                              plain=re.sub(r"<[^>]+>"," ",html.unescape(text))
                              key=(cid,plain)
                              if key not in seen:
                                  seen.add(key)
                                  comments.append({"id":cid,"author":author,"text":plain,"source":"invidious:"+base})
                                  for u in url_re.findall(plain):
                                      urls.append({"source":"invidious_comment:"+cid,"url":u.rstrip(".,;:!?'\"")})
                          for v in x.values(): rec(v)
                      elif isinstance(x,list):
                          for v in x: rec(v)
                  rec(obj)
                  if comments:
                      break
              except Exception as e:
                  attempts.append({"base":base,"error":repr(e)})

          ev.joinpath("R125_INVIDIOUS_ATTEMPTS.json").write_text(
              json.dumps(attempts,indent=2,ensure_ascii=False)+"\n"
          )
          ev.joinpath("R125_INVIDIOUS_COMMENTS.json").write_text(
              json.dumps(comments,indent=2,ensure_ascii=False)+"\n"
          )
          ev.joinpath("R125_INVIDIOUS_URLS.json").write_text(
              json.dumps(urls,indent=2,ensure_ascii=False)+"\n"
          )
          PY

      - name: Recover description URLs directly from watch HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse,parse_qs,unquote
          import re,json,html

          watch=Path("/tmp/r125/raw/watch.html")
          text=watch.read_text(errors="replace") if watch.exists() else ""

          # Decode common JSON escapes enough to recover links.
          text=html.unescape(text)
          text=text.replace("\\u0026","&").replace("\\u003d","=").replace("\\/","/")

          url_re=re.compile(r'https?://[^\s<>"\'\]\)]+',re.I)
          rows=[]
          seen=set()

          def unwrap(u):
              try:
                  p=urlparse(u)
                  q=parse_qs(p.query)
                  if "youtube.com/redirect" in u and "q" in q:
                      return unquote(q["q"][0])
              except Exception:
                  pass
              return u

          for u in url_re.findall(text):
              u=unwrap(u.rstrip(".,;:!?'\""))
              if u in seen: continue
              seen.add(u)
              rows.append({"source":"watch_html","url":u})

          Path("/tmp/r125/evidence/R125_WATCH_HTML_URLS.json").write_text(
              json.dumps(rows,indent=2,ensure_ascii=False)+"\n"
          )
          PY

      - name: Merge all recovered URLs and isolate file-share candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse,parse_qs,unquote
          import json,re

          ev=Path("/tmp/r125/evidence")

          rows=[]
          for name in ("R125_INNERTUBE_URLS.json","R125_INVIDIOUS_URLS.json","R125_WATCH_HTML_URLS.json"):
              try: rows.extend(json.loads((ev/name).read_text()))
              except Exception: pass

          comments=[]
          for name in ("R125_INNERTUBE_COMMENTS.json","R125_INVIDIOUS_COMMENTS.json"):
              try: comments.extend(json.loads((ev/name).read_text()))
              except Exception: pass

          # URLs can also be split/obfuscated in comment text; scan for drive IDs and common shares.
          for c in comments:
              t=c.get("text","")
              for m in re.finditer(r'https?://\S+',t,re.I):
                  rows.append({"source":c.get("source","comment"),"url":m.group(0).rstrip(".,;:!?'\"")})

          share_hosts=(
              "drive.google.com","docs.google.com","mega.nz","dropbox.com",
              "mediafire.com","onedrive.live.com","1drv.ms","pan.baidu.com",
              "cloud.mail.ru","github.com","gofile.io","pixeldrain.com",
              "terabox.com","1024tera.com","fshare.vn","4shared.com","box.com"
          )

          dedup=[]
          seen=set()
          for x in rows:
              u=str(x.get("url") or "")
              if not u.startswith("http"): continue
              if u in seen: continue
              seen.add(u)
              dedup.append({"source":x.get("source"),"url":u})

          shares=[
              x for x in dedup
              if any(h in urlparse(x["url"]).netloc.lower() for h in share_hosts)
          ]

          target_comments=[
              c for c in comments
              if re.search(r'google\s*drive|drive\.google|PCTool|PC Tool|BP10|MV_AP82|V2\.2|download|software|软件|网盘',c.get("text",""),re.I)
          ]

          ev.joinpath("R125_ALL_RECOVERED_URLS.json").write_text(
              json.dumps(dedup,indent=2,ensure_ascii=False)+"\n"
          )
          ev.joinpath("R125_FILESHARE_URLS.json").write_text(
              json.dumps(shares,indent=2,ensure_ascii=False)+"\n"
          )
          ev.joinpath("R125_TARGET_COMMENTS.json").write_text(
              json.dumps(target_comments,indent=2,ensure_ascii=False)+"\n"
          )

          print(json.dumps({
              "total_comments":len(comments),
              "target_comments":len(target_comments),
              "all_urls":len(dedup),
              "fileshare_urls":shares
          },indent=2,ensure_ascii=False))
          PY

      - name: Download public Google Drive files/folders as inert data only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import json,subprocess,hashlib

          ev=Path("/tmp/r125/evidence")
          out=Path("/tmp/r125/downloads")
          shares=json.loads((ev/"R125_FILESHARE_URLS.json").read_text())
          rows=[]

          for idx,x in enumerate(shares):
              u=x["url"]
              host=urlparse(u).netloc.lower()
              before={str(p) for p in out.rglob("*") if p.is_file()}
              attempts=[]

              if "drive.google.com" in host or "docs.google.com" in host:
                  for args in (
                      ["gdown","--fuzzy","--continue",u,"-O",str(out/f"gdrive_{idx:02d}")],
                      ["gdown","--folder","--fuzzy","--continue",u,"-O",str(out/f"gdrive_folder_{idx:02d}")],
                  ):
                      try:
                          cp=subprocess.run(args,capture_output=True,text=True,timeout=180)
                          attempts.append({
                              "cmd":" ".join(args[:3])+" ...",
                              "rc":cp.returncode,
                              "stdout":cp.stdout[-5000:],
                              "stderr":cp.stderr[-5000:]
                          })
                          if cp.returncode==0:
                              break
                      except Exception as e:
                          attempts.append({"error":repr(e)})
              else:
                  attempts.append({"skipped":"automatic downloader only handles Google Drive in R125"})

              after=[p for p in out.rglob("*") if p.is_file() and str(p) not in before]
              files=[]
              for p in after:
                  files.append({
                      "path":str(p.relative_to(out)),
                      "size":p.stat().st_size,
                      "sha256":hashlib.sha256(p.read_bytes()).hexdigest()
                  })
              rows.append({"source":x.get("source"),"url":u,"attempts":attempts,"files":files})

          ev.joinpath("R125_DOWNLOAD_RESULTS.json").write_text(
              json.dumps(rows,indent=2,ensure_ascii=False)+"\n"
          )
          PY

      - name: Static inspect all acquired files and archives
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,json,hashlib,subprocess

          root=Path("/tmp/r125/downloads")
          ev=Path("/tmp/r125/evidence")
          key=re.compile(
              r'MV_AP82|BP10|BP1048|PCTool|PC_Tool|V2\.2|MVA|'
              r'PCTools_Config|BT_InfoConfig|Upgrade Finished|READSN|'
              r'flashboot|HidD_SetFeature|HidD_GetFeature|'
              r'chiperas|codedata|bootdat|constdat|cnfgdat|btupdat|upinfo',
              re.I
          )

          rows=[]
          for p in sorted(root.rglob("*")):
              if not p.is_file(): continue
              data=p.read_bytes()
              try:
                  typ=subprocess.check_output(["file","-b",str(p)],text=True).strip()
              except Exception:
                  typ=""
              strings=[
                  m.group(0).decode("latin1","replace")
                  for m in re.finditer(rb"[\x20-\x7e]{5,}",data)
              ]
              hits=[s[:1000] for s in strings if key.search(s)][:1000]
              entries=[]
              try:
                  cp=subprocess.run(["7z","l","-slt",str(p)],capture_output=True,text=True,timeout=45)
                  if cp.returncode==0:
                      entries=[
                          line[7:].strip() for line in cp.stdout.splitlines()
                          if line.startswith("Path = ")
                      ][:5000]
              except Exception:
                  pass
              rows.append({
                  "path":str(p.relative_to(root)),
                  "size":len(data),
                  "sha256":hashlib.sha256(data).hexdigest(),
                  "file_type":typ,
                  "keyword_string_hits":hits,
                  "archive_entries":entries,
                  "interesting_archive_entries":[x for x in entries if key.search(x)][:1000]
              })

          ev.joinpath("R125_STATIC_FILE_INVENTORY.json").write_text(
              json.dumps(rows,indent=2,ensure_ascii=False)+"\n"
          )
          PY

      - name: Build recovery decision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          ev=Path("/tmp/r125/evidence")

          def load(n,d):
              try: return json.loads((ev/n).read_text())
              except Exception: return d

          inn=load("R125_INNERTUBE_COMMENTS.json",[])
          invc=load("R125_INVIDIOUS_COMMENTS.json",[])
          target=load("R125_TARGET_COMMENTS.json",[])
          shares=load("R125_FILESHARE_URLS.json",[])
          dl=load("R125_DOWNLOAD_RESULTS.json",[])
          inv=load("R125_STATIC_FILE_INVENTORY.json",[])
          cfg=load("R125_INNERTUBE_CONFIG.json",{})

          acquired=sum(len(x.get("files",[])) for x in dl)
          strong=[]
          for f in inv:
              blob=" ".join(f.get("keyword_string_hits",[]))+" "+" ".join(f.get("interesting_archive_entries",[]))+" "+f.get("path","")
              if re.search(r'MV_AP82|BP10|PCTool|PC_Tool|PCTools_Config|BT_InfoConfig|flashboot',blob,re.I):
                  strong.append(f)

          d={
              "VIDEO_ID":"oSIWbddW7Rc",
              "INNERTUBE_CONFIG":cfg,
              "INNERTUBE_COMMENT_COUNT":len(inn),
              "INVIDIOUS_COMMENT_COUNT":len(invc),
              "TARGET_COMMENT_COUNT":len(target),
              "TARGET_COMMENTS":target[:100],
              "FILESHARE_URL_COUNT":len(shares),
              "FILESHARE_URLS":shares,
              "ACQUIRED_FILE_COUNT":acquired,
              "STATIC_FILE_COUNT":len(inv),
              "STRONG_PCTOOLS_FILE_COUNT":len(strong),
              "STRONG_PCTOOLS_FILES":strong[:30],

              "R124_FAILURE_CAUSE":"yt-dlp was blocked by YouTube bot/sign-in challenge; R125 bypasses dependence on yt-dlp by using public Innertube configuration plus public Invidious APIs.",
              "PCTOOLS_BINARY_PUBLICLY_ACQUIRED":len(strong)>0,

              "VENDOR_BINARY_EXECUTED":False,
              "USB_DEVICE_ACCESSED":False,
              "BOARD_CONTACTED":False,

              "PRODUCTION_GOLOPINE_BOOTSTRAP_PROVEN":False,
              "PRODUCTION_FLASHBOOT_REENUMERATION_PROVEN":False,
              "PRODUCTION_RECOVERY_USB_IDENTITY_PROVEN":False,
              "SAFE_READ_ONLY_STOCK_BACKUP_PROVEN":False,
              "ANY_DISCOVERED_WRITE_AUTHORIZED_FOR_BOARD":False,

              "NEXT":(
                  "If a strong PCTools file is acquired, pin its exact SHA256 and deep-static reverse it only. "
                  "If comments are recovered but the linked utility is only a Bluetooth-name tool, retain it as possible bootstrap evidence but do not confuse it with a firmware creator. "
                  "If comments remain inaccessible, stop the YouTube path and pivot to vendor/Chinese archive acquisition."
              ),
              "FLASH_ALLOWED":False
          }

          ev.joinpath("R125_DECISION.json").write_text(
              json.dumps(d,indent=2,ensure_ascii=False)+"\n"
          )
          ev.joinpath("R125_REPORT_TH.md").write_text(
              "# R125 — YouTube comments multi-backend link recovery\n\n"
              + "```json\n"+json.dumps(d,indent=2,ensure_ascii=False)+"\n```\n\n"
              + "Static/public evidence only. No executable was launched and no hardware was contacted.\n\n"
              + "FLASH_ALLOWED=NO\n"
          )
          print(json.dumps(d,indent=2,ensure_ascii=False))
          PY

      - name: Package evidence only
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r125/evidence
          zip -9 -r /tmp/R125_YOUTUBE_COMMENTS_PCTOOLS_LINK_RECOVERY_EVIDENCE.zip .
          sha256sum /tmp/R125_YOUTUBE_COMMENTS_PCTOOLS_LINK_RECOVERY_EVIDENCE.zip \
            > /tmp/R125_YOUTUBE_COMMENTS_PCTOOLS_LINK_RECOVERY_EVIDENCE.zip.sha256

