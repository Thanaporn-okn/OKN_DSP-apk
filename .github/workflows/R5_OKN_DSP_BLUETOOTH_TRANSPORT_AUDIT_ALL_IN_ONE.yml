name: OKN-DSP R5 ALL-IN-ONE Bluetooth Transport Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/R5_OKN_DSP_BLUETOOTH_TRANSPORT_AUDIT_ALL_IN_ONE.yml'

permissions:
  contents: read

env:
  FLASH_ALLOWED: 'NO'
  DSP_TX_ALLOWED: 'NO'
  RFCOMM_APP_PAYLOAD_TX_ALLOWED: 'NO'
  BLE_GATT_READ_ALLOWED: 'NO'
  BLE_GATT_WRITE_ALLOWED: 'NO'
  BLE_CCCD_WRITE_ALLOWED: 'NO'
  USB_OUT_ALLOWED: 'NO'
  BOARD_USB_ACCESS_IN_CI: 'NO'
  HARDWARE_MODIFICATION: 'FORBIDDEN'
  ANDROID_HOME: '/usr/local/lib/android/sdk'
  ANDROID_SDK_ROOT: '/usr/local/lib/android/sdk'

jobs:
  build-r5:
    name: Build OKN-DSP R5 Bluetooth transport-audit APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          echo "OKN_DSP_R5=YES"
          echo "FLASH_ALLOWED=NO"
          echo "DSP_TX_ALLOWED=NO"
          echo "RFCOMM_APP_PAYLOAD_TX_ALLOWED=NO"
          echo "BLE_GATT_READ_ALLOWED=NO"
          echo "BLE_GATT_WRITE_ALLOWED=NO"
          echo "BLE_CCCD_WRITE_ALLOWED=NO"
          echo "USB_OUT_ALLOWED=NO"

