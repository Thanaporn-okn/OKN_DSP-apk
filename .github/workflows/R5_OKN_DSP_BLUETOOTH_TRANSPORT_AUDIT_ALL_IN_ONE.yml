      - name: Firmware host build and unit tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S /tmp/okn-r5-work/okn-r5/firmware \
                -B /tmp/okn-r5-work/okn-r5/firmware/build \
                -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build /tmp/okn-r5-work/okn-r5/firmware/build
          ctest --test-dir /tmp/okn-r5-work/okn-r5/firmware/build --output-on-failure

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android protocol-model host test
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/okn-r5-work/okn-r5
          rm -rf android-app/host-test/out
          mkdir -p android-app/host-test/out
          javac -Xlint:all -Werror -d android-app/host-test/out \
            android-app/app/src/main/java/com/okn/dsp/DspModel.java \
            android-app/app/src/main/java/com/okn/dsp/OknPacket.java \
            android-app/host-test/OknPacketHostTest.java
          java -cp android-app/host-test/out com.okn.dsp.OknPacketHostTest

      - name: Verify R5 transport and safety gates
        shell: bash
        run: |
          set -euo pipefail
          APP=/tmp/okn-r5-work/okn-r5/android-app/app
          BT="$APP/src/main/java/com/okn/dsp/BluetoothInspector.java"

          grep -F 'applicationId = "com.okn.dsp.r5"' "$APP/build.gradle.kts"
          grep -F '00001101-0000-1000-8000-00805F9B34FB' "$BT"
          grep -F 'PASSIVE_RX_WINDOW_MS = 15000' "$BT"
          grep -F 'getInputStream()' "$BT"
          grep -F 'getServices()' "$BT"
          grep -F 'getCharacteristics()' "$BT"
          grep -F 'getDescriptors()' "$BT"
          grep -F 'PROPERTY_WRITE_NO_RESPONSE' "$BT"

          # No application-layer RFCOMM output path.
          if grep -RInF 'getOutputStream()' "$APP/src/main/java"; then
            echo "Forbidden RFCOMM output stream found"
            exit 1
          fi

          # No active GATT data read/write or notification subscription.
          if grep -RInE             '\.readCharacteristic\(|\.writeCharacteristic\(|\.writeDescriptor\(|\.setCharacteristicNotification\('             "$APP/src/main/java"; then
            echo "Forbidden active GATT data operation found"
            exit 1
          fi

          # No known flash/update command strings or flash APIs.
          if grep -RInE             'chiperas|codedata|bootdat|constdat|cnfgdat|btupdat|upinfo|SpiFlashWrite|SpiFlashErase'             "$APP/src/main/java"; then
            echo "Forbidden flash/update symbol found"
            exit 1
          fi

          grep -F 'OKN_RUNTIME_USB_TX_ENABLED", "false"' "$APP/build.gradle.kts"
          grep -F 'OKN_PRODUCTION_FLASH_ENABLED", "false"' "$APP/build.gradle.kts"

          echo "R5_TRANSPORT_SAFETY_GATE=PASS"

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build OKN-DSP R5 APK
        working-directory: /tmp/okn-r5-work/okn-r5/android-app
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn-r5-work/okn-r5/android-app/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          cp "$APK" /tmp/OKN-DSP-R5-v0.1.3-bluetooth-audit.apk
          sha256sum /tmp/OKN-DSP-R5-v0.1.3-bluetooth-audit.apk \
            > /tmp/OKN-DSP-R5-v0.1.3-bluetooth-audit.apk.sha256
          sha256sum /tmp/OKN-DSP-R5-v0.1.3-source.zip \
            > /tmp/OKN-DSP-R5-v0.1.3-source.zip.sha256

      - name: Create phone test instructions
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/R5_NEXT_STEPS_TH.txt <<'EOF'
          OKN-DSP R5 BLUETOOTH TRANSPORT AUDIT

          CLASSIC/SPP
          1. เปิด Bluetooth และ Pair GoloPine_DSP_Amplifier ตามปกติ
          2. เปิด OKN-DSP R5
          3. กดค้นหา Bluetooth Classic + BLE
          4. แตะ GoloPine_DSP_Amplifier
          5. R5 จะเชื่อม SPP และฟัง RX อย่างเดียว 15 วินาที
          6. รอ R5_SPP_RX_COMPLETE=YES
          7. ถ่ายภาพค่า SPP_RX_BYTES และ SPP_RX_HEX

          BLE
          1. กดค้นหาอีกครั้ง
          2. แตะ LE-GoloPine_DSP_A
          3. รอ R5_GATT_METADATA_COMPLETE=YES
          4. ถ่ายภาพ SVC / CHR / props / DSC ทั้งหมด

          SAFETY
          - no RFCOMM application payload TX
          - no BLE characteristic read
          - no BLE characteristic write
          - no CCCD write / no notification subscription
          - no DSP runtime TX
          - no erase/program/flash
          EOF

      - name: Upload OKN-DSP R5 package
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-R5-BLUETOOTH-TRANSPORT-AUDIT
          path: |
            /tmp/OKN-DSP-R5-v0.1.3-bluetooth-audit.apk
            /tmp/OKN-DSP-R5-v0.1.3-bluetooth-audit.apk.sha256
            /tmp/OKN-DSP-R5-v0.1.3-source.zip
            /tmp/OKN-DSP-R5-v0.1.3-source.zip.sha256
            /tmp/R5_NEXT_STEPS_TH.txt
          if-no-files-found: error
          retention-days: 30
