name: R81 BP1048P4 official GoloPine Android 20260401 static reverse only

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r81-bp1048p4-golopine-android-static-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_ZIP_URL: https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-01.apk_.zip
  FLASH_ALLOWED: 'NO'

jobs:
  static-only:
    name: OFFLINE/STATIC ONLY - official Android APK - no board/no USB/no execution/no flash
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/R81_SAFETY.txt <<'EOF'
          R81_STATIC_ONLY=YES
          SOURCE=OFFICIAL_GOLOPINE_7CH_PAGE
          APK_VERSION_LABEL=2026-04-01
          BOARD_CONTACT=NO
          USB_DEVICE_ACCESS=NO
          APK_EXECUTION=NO
          ERASE_PROGRAM_FLASH=NO
          SEND_0X11=NO
          SEND_AA55=NO
          SEND_CHIPERAS_CODEDATA_BOOTDAT_CONSTDAT_CNFGDAT_BTUPDAT_UPINFO_CXXX=NO
          R79_PHYSICAL_REPLUG_AUTORUN=NO
          FLASH_ALLOWED=NO
          EOF
          cat /tmp/R81_SAFETY.txt

      - name: Acquire official Android package and pin SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r81
          curl --fail --location --retry 4 --connect-timeout 20 \
            "$APK_ZIP_URL" -o /tmp/r81/golopine_android_20260401.zip
          sha256sum /tmp/r81/golopine_android_20260401.zip | tee /tmp/R81_OFFICIAL_ZIP_SHA256.txt
          file /tmp/r81/golopine_android_20260401.zip | tee /tmp/R81_OFFICIAL_ZIP_FILETYPE.txt
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          z=Path('/tmp/r81/golopine_android_20260401.zip')
          out=Path('/tmp/r81/unpacked')
          out.mkdir(parents=True, exist_ok=True)
          if not zipfile.is_zipfile(z):
              raise SystemExit('official download is not a ZIP')
          with zipfile.ZipFile(z) as f:
              for i in f.infolist():
                  print(i.filename, i.file_size)
              f.extractall(out)
          PY
          find /tmp/r81/unpacked -type f -printf '%p\n' | tee /tmp/R81_UNPACKED_FILES.txt
          APK="$(find /tmp/r81/unpacked -type f -iname '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" /tmp/r81/golopine_android_20260401.apk
          sha256sum /tmp/r81/golopine_android_20260401.apk | tee /tmp/R81_APK_SHA256.txt
          file /tmp/r81/golopine_android_20260401.apk | tee /tmp/R81_APK_FILETYPE.txt

      - name: Inventory APK container
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r81/apk
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          apk=Path('/tmp/r81/golopine_android_20260401.apk')
          out=Path('/tmp/r81/apk')
          inv=[]
          with zipfile.ZipFile(apk) as z:
              z.extractall(out)
              for i in z.infolist():
                  if i.is_dir(): continue
                  b=z.read(i.filename)
                  inv.append({'path':i.filename,'size':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          Path('/tmp/R81_APK_INVENTORY.json').write_text(json.dumps(inv,indent=2,ensure_ascii=False)+'\n')
          print('APK_FILES', len(inv))
          PY
          find /tmp/r81/apk -type f -maxdepth 5 | sort > /tmp/R81_APK_PATHS.txt

      - name: Extract manifest/package/permissions without executing APK
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/R81_MANIFEST.txt
          : > /tmp/R81_BADGING.txt
          AAPT="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f \( -name aapt -o -name aapt2 \) 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging /tmp/r81/golopine_android_20260401.apk > /tmp/R81_BADGING.txt 2>&1 || true
            "$AAPT" dump xmltree /tmp/r81/golopine_android_20260401.apk AndroidManifest.xml > /tmp/R81_MANIFEST.txt 2>&1 || true
          fi
          cat /tmp/R81_BADGING.txt
          grep -Ei 'package:|sdkVersion|targetSdkVersion|uses-permission|uses-feature|usb|bluetooth|service|receiver|activity' \
            /tmp/R81_BADGING.txt /tmp/R81_MANIFEST.txt | tee /tmp/R81_MANIFEST_HITS.txt || true

      - name: Static DEX/resource/native scan for USB updater/recovery surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('/tmp/r81/apk')
          needles=[
            'android.hardware.usb.host','UsbManager','UsbDevice','UsbInterface','UsbEndpoint','UsbDeviceConnection',
            'USB_DEVICE_ATTACHED','USB_DEVICE_DETACHED','requestPermission','bulkTransfer','controlTransfer',
            'claimInterface','getDeviceList','setInterface','setConfiguration',
            'libusb','hidapi','hidraw','HidD_','WinUSB','CDC','DFU',
            '6324','1719','VID_','PID_','vendorId','productId','vendor_id','product_id',
            'BP1048P4','BP1048','MVAssistant','.MVA','MVA',
            'bootloader','boot loader','recovery','upgrade','update','firmware','download','ota',
            'identify','identity','device info','version','status','readback','backup','read flash',
            'chiperas','codedata','bootdat','constdat','cnfgdat','btupdat','upinfo','erase','program','flash',
            '0x11','AA55','0xAA','0x55'
          ]
          def ascii_strings(b,n=4):
              return [m.group().decode('utf-8','ignore') for m in re.finditer(rb'[\x20-\x7e]{%d,}'%n,b)]
          def utf16_strings(b,n=4):
              out=[]
              for m in re.finditer(rb'(?:[\x20-\x7e]\x00){%d,}'%n,b):
                  out.append(m.group().decode('utf-16le','ignore'))
              return out
          hits=[]
          for p in root.rglob('*'):
              if not p.is_file(): continue
              try: b=p.read_bytes()
              except Exception: continue
              for s in ascii_strings(b)+utf16_strings(b):
                  sl=s.lower()
                  ms=[n for n in needles if n.lower() in sl]
                  if ms:
                      hits.append({'path':str(p.relative_to(root)),'needles':ms,'string':s[:1000]})
          Path('/tmp/R81_KEYWORD_HITS.json').write_text(json.dumps(hits,indent=2,ensure_ascii=False)+'\n')
          groups={
            'USB_HOST':['usbmanager','usbdevice','usbdeviceconnection','bulktransfer','controltransfer','claiminterface','android.hardware.usb.host'],
            'BOOT_RECOVERY':['bootloader','boot loader','recovery'],
            'FW_UPDATE':['firmware','upgrade','update','.mva','mvassistant'],
            'IDENTIFY_STATUS':['identify','identity','version','status','device info','readback','backup'],
            'DESTRUCTIVE':['chiperas','codedata','bootdat','constdat','cnfgdat','btupdat','upinfo','erase','program','flash'],
            'KNOWN_RUNTIME_USB':['6324','1719'],
            'P4':['bp1048p4'],
          }
          text='\n'.join(h['string'].lower() for h in hits)
          state={k:any(x in text for x in xs) for k,xs in groups.items()}
          state.update({
            'R81_STATIC_ONLY':True,
            'APK_EXECUTED':False,
            'BOARD_CONTACT':False,
            'EXACT_BOOT_ENTRY_PROVEN':False,
            'RECOVERY_USB_IDENTITY_PROVEN':False,
            'READ_ONLY_IDENTIFY_STATUS_PROVEN':False,
            'FLASH_ALLOWED':False,
          })
          Path('/tmp/R81_DECISION.json').write_text(json.dumps(state,indent=2)+'\n')
          print(json.dumps(state,indent=2))
          PY

          : > /tmp/R81_NATIVE_SYMBOLS.txt
          for so in $(find /tmp/r81/apk -type f -name '*.so'); do
            echo "===== $so =====" >> /tmp/R81_NATIVE_SYMBOLS.txt
            readelf -Ws "$so" >> /tmp/R81_NATIVE_SYMBOLS.txt 2>/dev/null || true
            strings -a "$so" | grep -Ei 'usb|hid|boot|recover|upgrad|firmware|mva|bp1048|6324|1719|vid|pid|identify|version|status|erase|flash|program' \
              >> /tmp/R81_NATIVE_SYMBOLS.txt || true
          done

      - name: Build human-readable lead report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          dec=json.loads(Path('/tmp/R81_DECISION.json').read_text())
          hits=json.loads(Path('/tmp/R81_KEYWORD_HITS.json').read_text())
          priority=[]
          for h in hits:
              s=h['string'].lower()
              if any(k in s for k in ['usbmanager','usbdeviceconnection','controltransfer','bulktransfer','bootloader','recovery','firmware','upgrade','.mva','bp1048p4','6324','1719','identify','readback','backup']):
                  priority.append(h)
          lines=[
            '# R81 official GoloPine Android 2026-04-01 static reverse evidence',
            '',
            'STATIC/OFFLINE ONLY. APK was not executed. No board/USB access. FLASH_ALLOWED=NO.',
            '',
            '## Conservative decision',
            '```json',json.dumps(dec,indent=2),'```','',
            '## Priority string/resource leads (not proof by themselves)',
          ]
          for h in priority[:500]:
              lines.append(f"- `{h['path']}` :: {h['needles']} :: `{h['string'][:400]}`")
          Path('/tmp/R81_REPORT.md').write_text('\n'.join(lines)+'\n')
          PY
          sed -n '1,260p' /tmp/R81_REPORT.md

      - name: Final safety/decision summary
        shell: bash
        run: |
          set -euo pipefail
          cat /tmp/R81_SAFETY.txt > /tmp/R81_SUMMARY.txt
          cat >> /tmp/R81_SUMMARY.txt <<'EOF'
          PURPOSE=FIND_ANDROID_USB_BOOT_RECOVERY_UPDATE_SURFACE
          LIVE_TEST_REQUESTED=NO
          REPEAT_AA55_REQUIRED=NO
          R79_AUTORUN=NO
          EXACT_BOOT_ENTRY_REMAINS_UNPROVEN_UNLESS_STATIC_CODE_PROVES_CALL_SEQUENCE
          RECOVERY_USB_IDENTITY_REMAINS_UNPROVEN_UNLESS_STATIC_CODE_PROVES_FILTER/DESCRIPTOR
          FLASH_ALLOWED=NO
          EOF
          cat /tmp/R81_SUMMARY.txt

      - name: Package evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/R81_BP1048P4_GOLOPINE_ANDROID_STATIC_EVIDENCE
          cp -a /tmp/R81_*.txt /tmp/R81_*.json /tmp/R81_*.md \
            /tmp/R81_BP1048P4_GOLOPINE_ANDROID_STATIC_EVIDENCE/ 2>/dev/null || true
          (cd /tmp && zip -qr R81_BP1048P4_GOLOPINE_ANDROID_STATIC_EVIDENCE.zip R81_BP1048P4_GOLOPINE_ANDROID_STATIC_EVIDENCE)
          sha256sum /tmp/R81_BP1048P4_GOLOPINE_ANDROID_STATIC_EVIDENCE.zip \
            > /tmp/R81_BP1048P4_GOLOPINE_ANDROID_STATIC_EVIDENCE.zip.sha256

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R81-BP1048P4-GOLOPINE-ANDROID-20260401-STATIC-EVIDENCE
          path: |
            /tmp/R81_BP1048P4_GOLOPINE_ANDROID_STATIC_EVIDENCE.zip
            /tmp/R81_BP1048P4_GOLOPINE_ANDROID_STATIC_EVIDENCE.zip.sha256
          if-no-files-found: error
