name: Build OKN DSP V47 EQ Restore Settle Retry Fix

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_ANDROID_V47_EQ_RESTORE_SETTLE_RETRY_FIX.zip'
      - '.github/workflows/build-okn-dsp-v47.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify V47 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/okn_v47
          mkdir -p /tmp/okn_v47
          unzip -q OKN_DSP_ANDROID_V47_EQ_RESTORE_SETTLE_RETRY_FIX.zip -d /tmp/okn_v47

          check_file() {
            test -f "$1" || { echo "ERROR missing $1"; exit 1; }
            echo "OK file: $1"
          }
          check_text() {
            grep -Fq "$1" "$2" || { echo "ERROR missing marker '$1' in $2"; exit 1; }
            echo "OK marker: $1"
          }

          EQ=/tmp/okn_v47/app/src/main/java/com/okn/dsp/EqProofActivity.kt
          POLICY=/tmp/okn_v47/app/src/main/java/com/okn/dsp/protocol/ControlledEqBandProof.kt
          EQCODEC=/tmp/okn_v47/app/src/main/java/com/okn/dsp/protocol/EqBandCodec.kt
          GATE=/tmp/okn_v47/app/src/main/java/com/okn/dsp/protocol/WriteGate.kt
          MAIN=/tmp/okn_v47/app/src/main/java/com/okn/dsp/MainActivity.kt
          GRADLE=/tmp/okn_v47/app/build.gradle.kts
          MANIFEST=/tmp/okn_v47/app/src/main/AndroidManifest.xml

          check_file "$EQ"
          check_file "$POLICY"
          check_file "$EQCODEC"
          check_file "$GATE"
          check_file "$MAIN"
          check_file "$GRADLE"
          check_file "$MANIFEST"
          check_file /tmp/okn_v47/README_V47.txt
          check_file /tmp/okn_v47/evidence/OKN_DSP_V47_EQ_RESTORE_FIX_PLAN.txt
          check_file /tmp/okn_v47/evidence/OKN_DSP_V47_EQ_RESTORE_FIX_PLAN.json
          check_file /tmp/okn_v47/evidence/OKN_DSP_V46_TARGET_SUCCESS_RESTORE_TIMING_CAPTURE.txt

          check_text 'versionCode = 47' "$GRADLE"
          check_text '2.9.0-v47-eq-restore-settle-retry-fix' "$GRADLE"
          check_text '.EqProofActivity' "$MANIFEST"
          check_text 'V47_EQ_TARGET_WRITE_PLAIN=' "$EQ"
          check_text 'TX_EQ_CH1_BAND4_MINUS0P5DB_V47' "$EQ"
          check_text 'V47_TARGET_DESCRIPTOR_VERIFY' "$EQ"
          check_text 'V47_RESTORE_SETTLE_BEFORE_WRITE_MS=' "$EQ"
          check_text 'restoreSettleBeforeWriteMs = 1500L' "$EQ"
          check_text 'restoreVerifyDelayMs = 1500L' "$EQ"
          check_text 'restoreRetryDelayMs = 2000L' "$EQ"
          check_text 'V47_RESTORE_RETRY_SCHEDULED' "$EQ"
          check_text 'V47_EQ_RESTORE_WRITE_PLAIN=' "$EQ"
          check_text 'TX_EQ_CH1_BAND4_RESTORE_V47_A' "$EQ"
          check_text 'V47_RESTORE_DESCRIPTOR_VERIFY' "$EQ"
          check_text 'V47_CONTROLLED_EQ_WRITE_PROOF_COMPLETE' "$EQ"
          check_text 'V47_FAILSAFE_WINDOW_MS=45000' "$EQ"
          check_text 'saveParams=false' "$EQ"
          check_text 'const val ACTUATOR_ID = 4' "$POLICY"
          check_text 'const val BAND_INDEX_1 = 4' "$POLICY"
          check_text 'const val OFFSET = (BAND_INDEX_1 - 1) * EqBandCodec.BYTES' "$POLICY"
          check_text 'const val STEP_DOWN_DB = 0.5f' "$POLICY"
          check_text 'controlledEqBandProofEnabled: Boolean = true' "$GATE"
          check_text 'verifiedScalarControlsEnabled: Boolean = true' "$GATE"
          check_text 'const val enabled: Boolean = false' "$GATE"
          check_text 'LOCAL ONLY' "$MAIN"
          check_text 'const val BYTES = 48' "$EQCODEC"
          check_text 'const val SAMPLE_RATE_HZ = 44100.0' "$EQCODEC"

          if grep -Fq 'UfeCodec.encodeWrite(7' "$EQ"; then
            echo 'ERROR: V47 EQ proof contains SaveParams ID7 write'
            exit 1
          fi
          echo 'OK: no SaveParams ID7 write in V47 EQ proof'
          echo 'V47 source restored and verified: target proof preserved; restore settle + one retry added'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/okn_v47
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and package artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn_v47/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          mkdir -p artifact
          cp "$APK" artifact/OKN_DSP_V47_EQ_RESTORE_SETTLE_RETRY_FIX-debug.apk
          cp /tmp/okn_v47/README_V47.txt artifact/
          cp /tmp/okn_v47/evidence/OKN_DSP_V47_EQ_RESTORE_FIX_PLAN.txt artifact/
          cp /tmp/okn_v47/evidence/OKN_DSP_V47_EQ_RESTORE_FIX_PLAN.json artifact/
          sha256sum artifact/OKN_DSP_V47_EQ_RESTORE_SETTLE_RETRY_FIX-debug.apk > artifact/OKN_DSP_V47_EQ_RESTORE_SETTLE_RETRY_FIX-debug.sha256
          ls -lh artifact

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-V47-EQ-RESTORE-SETTLE-RETRY-FIX-debug-apk
          path: artifact/
          if-no-files-found: error
          retention-days: 30
