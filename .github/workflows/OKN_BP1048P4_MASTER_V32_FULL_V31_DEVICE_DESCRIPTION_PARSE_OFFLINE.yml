name: OKN BP1048P4 MASTER V32 FULL V31 DEVICE DESCRIPTION PARSE OFFLINE

"on":
  workflow_dispatch:

permissions:
  contents: read

env:
  GOLOPINE_WINDOWS_URL: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-08.exe_.zip"
  EXPECTED_VENDOR_SHA256: "3ca54171c53f7badd963ffe6851b8b3e2faf8aee8ba2afcb7040990e22ae09b2"

  V31_EVIDENCE_SHA256: "cf85c8a4a36d777e0f72cec4bde15c5f834e1422d04f053a102a966d71b6d15e"
  V31_CHALLENGE_HEX: "D024E38C410000004202B94C65A23F2C7C634A6FFB0CA1BE73E866B5A2370645"
  V31_EXPECTED_AUTH_REPLY_HEX: "0A4192D7"

  LIVE_DSP_CONNECTED: "NO"
  USB_TARGET_ACCESS: "NO"
  HOST_TO_DSP_IO: "NO"
  REAL_HID_OBJECT_ALLOWED: "NO"
  REAL_HID_CONNECT_ALLOWED: "NO"
  REAL_HID_SEND_ALLOWED: "NO"
  REAL_HID_READ_ALLOWED: "NO"
  REAL_HID_WRITE_ALLOWED: "NO"
  FEATURE_REPORT_ALLOWED: "NO"
  FLASH_ALLOWED: "NO"
  ERASE_ALLOWED: "NO"
  WRITE_ALLOWED: "NO"

jobs:
  master-v32:
    name: Replay all 72 V31 payloads through official parser OFFLINE
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Safety gate and workspace
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"

          foreach($n in @(
            "LIVE_DSP_CONNECTED","USB_TARGET_ACCESS","HOST_TO_DSP_IO",
            "REAL_HID_OBJECT_ALLOWED","REAL_HID_CONNECT_ALLOWED",
            "REAL_HID_SEND_ALLOWED","REAL_HID_READ_ALLOWED","REAL_HID_WRITE_ALLOWED",
            "FEATURE_REPORT_ALLOWED","FLASH_ALLOWED","ERASE_ALLOWED","WRITE_ALLOWED"
          )){
            if((Get-Item "Env:$n").Value -ne "NO"){ throw "$n must remain NO" }
          }

          $root="C:\okn_v32"
          if(Test-Path $root){Remove-Item -Recurse -Force $root}
          New-Item -ItemType Directory -Force -Path `
            "$root\download","$root\pkg","$root\harness","$root\evidence","$root\out" | Out-Null

          @"
          REVISION=MASTER-V32
          MODE=OFFLINE_FULL_V31_DEVICE_DESCRIPTION_REPLAY
          SOURCE_EVIDENCE_SHA256=$env:V31_EVIDENCE_SHA256
          CHALLENGE_HEX=$env:V31_CHALLENGE_HEX
          EXPECTED_AUTH_REPLY_HEX=$env:V31_EXPECTED_AUTH_REPLY_HEX
          PAYLOAD_COUNT=72
          PAYLOAD_1_TO_71_BYTES=255
          PAYLOAD_72_BYTES=231
          TOTAL_CAPTURED_PAYLOAD_BYTES=18336
          V30_REPORTED_DEVICE_DESCRIPTION_LENGTH=18261
          REAL_HID_IO=NO
          HOST_TO_DSP_IO=NO
          FEATURE_REPORT=NO
          FLASH_ALLOWED=NO
          ERASE_ALLOWED=NO
          WRITE_ALLOWED=NO
          "@ | Set-Content "$root\evidence\00_SCOPE.txt"

          @'
