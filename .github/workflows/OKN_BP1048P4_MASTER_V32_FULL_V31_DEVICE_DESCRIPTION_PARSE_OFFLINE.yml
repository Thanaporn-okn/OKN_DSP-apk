      - name: Validate embedded V31 payload set
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v32"

          $lines=Get-Content "$root\payloads.txt" | Where-Object {$_.Trim() -ne ""}
          if($lines.Count -ne 72){throw "expected 72 payload rows"}

          for($i=0;$i -lt 72;$i++){
            $parts=$lines[$i].Split(':',2)
            $expected=($i+1).ToString("D2")
            if($parts[0] -ne $expected){throw "bad payload index $($parts[0]) expected $expected"}

            $h=$parts[1].Trim()
            if($h -notmatch '^[0-9A-F]+$'){throw "non-hex payload $expected"}

            $bytes=$h.Length/2
            if($i -lt 71 -and $bytes -ne 255){throw "payload $expected must be 255 bytes"}
            if($i -eq 71 -and $bytes -ne 231){throw "payload 72 must be 231 bytes"}
          }

          $total=0
          foreach($line in $lines){$total += ($line.Split(':',2)[1].Trim().Length/2)}
          if($total -ne 18336){throw "unexpected total payload bytes $total"}

          @"
          PAYLOAD_SET_VALID=true
          PAYLOAD_COUNT=72
          TOTAL_CAPTURED_PAYLOAD_BYTES=$total
          FINAL_PAYLOAD_DECLARED_BYTES=231
          "@ | Set-Content "$root\evidence\01_PAYLOAD_VALIDATION.txt"

      - name: Acquire exact official vendor binary
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v32"

          curl.exe -fL --retry 6 --retry-all-errors --retry-delay 2 `
            --connect-timeout 20 --max-time 300 `
            $env:GOLOPINE_WINDOWS_URL -o "$root\download\vendor.zip"
          if($LASTEXITCODE -ne 0){throw "vendor download failed"}

          Expand-Archive -Force "$root\download\vendor.zip" "$root\pkg"

          $exe=Get-ChildItem "$root\pkg" -Recurse -File -Filter *.exe |
            Where-Object {$_.FullName -notmatch '\\__MACOSX\\' -and $_.Name -notlike '._*'} |
            Sort-Object Length -Descending | Select-Object -First 1

          if(-not $exe){throw "vendor EXE missing"}
          Copy-Item $exe.FullName "$root\vendor.exe" -Force

          $sha=(Get-FileHash "$root\vendor.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne $env:EXPECTED_VENDOR_SHA256){throw "vendor SHA changed: $sha"}

          @"
          VENDOR_SHA256=$sha
          ORIGINAL_BINARY_MODIFIED=NO
          "@ | Set-Content "$root\evidence\02_VENDOR_IDENTITY.txt"

      - name: Build x86 full parser replay harness
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v32"

          @'
          using System;
          using System.IO;
          using System.Linq;
          using System.Reflection;
          using System.Reflection.Emit;
          using System.Runtime.CompilerServices;
          using System.Collections.Generic;
          using System.Text;
          using System.Threading;

          public static class Sink
          {
              public static readonly List<byte[]> Writes=new List<byte[]>();
              public static void Clear(){lock(Writes){Writes.Clear();}}
              public static void Record(byte[] b){
                  lock(Writes){Writes.Add(b==null?null:(byte[])b.Clone());}
              }
              public static byte[][] Snapshot(){
                  lock(Writes){return Writes.Select(x=>x==null?null:(byte[])x.Clone()).ToArray();}
              }
          }

          public static class Replay
          {
              static string OutPath;
              static string OutDir;

              static void Log(string s){
                  File.AppendAllText(OutPath,s+Environment.NewLine);
              }

              static string Hex(byte[] b){
                  return b==null?"<NULL>":BitConverter.ToString(b).Replace("-","");
              }

              static byte[] FromHex(string s){
                  byte[] b=new byte[s.Length/2];
                  for(int i=0;i<b.Length;i++)b[i]=Convert.ToByte(s.Substring(i*2,2),16);
                  return b;
              }

              static object InvokeBounded(MethodInfo m,object target,object[] args,int ms,string label){
                  object result=null; Exception error=null;
                  Thread t=new Thread(delegate(){
                      try{result=m.Invoke(target,args);}catch(Exception ex){error=ex;}
                  });
                  t.IsBackground=true;t.Start();

                  if(!t.Join(ms)){
                      Log(label+"_TIMEOUT_MS="+ms);
                      try{t.Abort();}catch{}
                      return null;
                  }

                  if(error!=null)throw error;
                  return result;
              }

              static void DefaultRet(ILGenerator il,Type ret){
                  if(ret==typeof(void)){il.Emit(OpCodes.Ret);return;}
                  if(ret.IsValueType){
                      LocalBuilder l=il.DeclareLocal(ret);
                      il.Emit(OpCodes.Ldloca_S,l);il.Emit(OpCodes.Initobj,ret);
                      il.Emit(OpCodes.Ldloc,l);il.Emit(OpCodes.Ret);return;
                  }
                  il.Emit(OpCodes.Ldnull);il.Emit(OpCodes.Ret);
              }

              static MethodAttributes Vis(MethodInfo m){
                  MethodAttributes a=MethodAttributes.Virtual|MethodAttributes.HideBySig;
                  if(m.IsPublic)a|=MethodAttributes.Public;
                  else if(m.IsFamily)a|=MethodAttributes.Family;
                  else if(m.IsFamilyOrAssembly)a|=MethodAttributes.FamORAssem;
                  else if(m.IsAssembly)a|=MethodAttributes.Assembly;
                  else a|=MethodAttributes.Private;
                  if(m.IsSpecialName)a|=MethodAttributes.SpecialName;
                  return a;
              }

              static Type CaptureType(Type baseType){
                  AssemblyBuilder ab=AppDomain.CurrentDomain.DefineDynamicAssembly(
                      new AssemblyName("OKN_V32_CAPTURE"),AssemblyBuilderAccess.Run);

                  TypeBuilder tb=ab.DefineDynamicModule("main").DefineType(
                      "OKN.CaptureStream",TypeAttributes.Public|TypeAttributes.Class,baseType);

                  ConstructorInfo bc=baseType.GetConstructor(
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance,
                      null,Type.EmptyTypes,null);

                  if(bc==null)throw new Exception("parameterless stream ctor missing");

                  ConstructorBuilder cb=tb.DefineConstructor(
                      MethodAttributes.Public,CallingConventions.Standard,Type.EmptyTypes);

                  ILGenerator ci=cb.GetILGenerator();
                  ci.Emit(OpCodes.Ldarg_0);ci.Emit(OpCodes.Call,bc);ci.Emit(OpCodes.Ret);

                  foreach(MethodInfo m in baseType.GetMethods(
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance)
                      .Where(m=>m.IsVirtual&&!m.IsFinal&&
                          (m.IsAbstract||m.Name=="Write"||m.Name=="WriteLine"||
                           m.Name=="ReadBytes"||m.Name=="ReadLine"||
                           m.Name=="Connect"||m.Name=="Disconnect"))
                      .GroupBy(m=>m.ToString()).Select(g=>g.First()))
                  {
                      Type[] ps=m.GetParameters().Select(x=>x.ParameterType).ToArray();
                      MethodBuilder b=tb.DefineMethod(m.Name,Vis(m),m.ReturnType,ps);
                      ILGenerator il=b.GetILGenerator();

                      if(m.Name=="Write"&&ps.Length==1&&ps[0]==typeof(byte[])){
                          il.Emit(OpCodes.Ldarg_1);
                          il.Emit(OpCodes.Call,typeof(Sink).GetMethod("Record"));
                          DefaultRet(il,m.ReturnType);
                      }else{
                          DefaultRet(il,m.ReturnType);
                      }

                      tb.DefineMethodOverride(b,m);
                  }

                  return tb.CreateType();
              }

              static void SetConnected(object stream,Type baseType){
                  Type e=baseType.GetNestedType(
                      "ConnectionStatus",BindingFlags.Public|BindingFlags.NonPublic);
                  object v=Enum.Parse(e,"Connected");

                  FieldInfo f=baseType.GetFields(
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance)
                      .FirstOrDefault(x=>x.FieldType==e);

                  if(f!=null){f.SetValue(stream,v);return;}

                  MethodInfo m=baseType.GetMethod(
                      "UpdateDeviceConnStatus",
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance);

                  if(m==null)throw new Exception("connected-state setter missing");
                  m.Invoke(stream,new object[]{v});
              }

              static string ReadStatus(object bridge,Type t){
                  PropertyInfo p=t.GetProperty(
                      "StreamStatus",
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance);

                  if(p!=null){
                      try{
                          object v=p.GetValue(bridge,null);
                          if(v!=null)return v.ToString();
                      }catch{}
                  }

                  foreach(FieldInfo f in t.GetFields(
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance))
                  {
                      if(f.FieldType.IsEnum &&
                         f.FieldType.Name.IndexOf("UFEStreamStatus",
                         StringComparison.OrdinalIgnoreCase)>=0)
                      {
                          object v=f.GetValue(bridge);
                          if(v!=null)return v.ToString();
                      }
                  }

                  return "<UNKNOWN>";
              }

              static object GetFieldOrProp(object o,string name){
                  if(o==null)return null;
                  Type t=o.GetType();
                  BindingFlags bf=BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance;

                  FieldInfo f=t.GetField(name,bf);
                  if(f!=null){try{return f.GetValue(o);}catch{}}

                  PropertyInfo p=t.GetProperty(name,bf);
                  if(p!=null && p.GetIndexParameters().Length==0){
                      try{return p.GetValue(o,null);}catch{}
                  }

                  return null;
              }

              static int GetDevDescriptionLength(object bridge,Type t){
                  BindingFlags bf=BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance;
                  PropertyInfo p=t.GetProperty("DevDescriptionLength",bf);
                  if(p!=null){
                      try{return Convert.ToInt32(p.GetValue(bridge,null));}catch{}
                  }
                  return -1;
              }

              static byte[] GetDescriptionBytes(object bridge,Type t){
                  BindingFlags bf=BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance;
                  FieldInfo f=t.GetField("DeviceDescriptionStringByteArray",bf);
                  if(f!=null){
                      try{return f.GetValue(bridge) as byte[];}catch{}
                  }
                  return null;
              }

              static string GetDescriptionString(object bridge,Type t){
                  BindingFlags bf=BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance;
                  FieldInfo f=t.GetField("DeviceDescriptionString",bf);
                  if(f!=null){
                      try{return f.GetValue(bridge) as string;}catch{}
                  }
                  return null;
              }

              static void DumpObject(object o,string tag,int depth){
                  if(o==null){Log(tag+"=<NULL>");return;}
                  if(depth>1){Log(tag+"=<DEPTH_LIMIT>");return;}

                  Type t=o.GetType();
                  Log(tag+"_TYPE="+t.FullName);

                  BindingFlags bf=BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance;

                  foreach(FieldInfo f in t.GetFields(bf).OrderBy(x=>x.Name))
                  {
                      try{
                          object v=f.GetValue(o);
                          if(v==null)Log(tag+"_FIELD|"+f.Name+"|"+f.FieldType.FullName+"|<NULL>");
                          else if(v is byte[])Log(tag+"_FIELD|"+f.Name+"|System.Byte[]|"+Hex((byte[])v));
                          else if(f.FieldType.IsPrimitive || v is string || f.FieldType.IsEnum)
                              Log(tag+"_FIELD|"+f.Name+"|"+f.FieldType.FullName+"|"+v.ToString());
                          else
                              Log(tag+"_FIELD|"+f.Name+"|"+f.FieldType.FullName+"|"+v.ToString());
                      }catch(Exception ex){
                          Log(tag+"_FIELD_ERROR|"+f.Name+"|"+ex.GetBaseException().GetType().FullName);
                      }
                  }

                  foreach(PropertyInfo p in t.GetProperties(bf).OrderBy(x=>x.Name))
                  {
                      if(!p.CanRead || p.GetIndexParameters().Length!=0)continue;
                      try{
                          object v=p.GetValue(o,null);
                          if(v==null)Log(tag+"_PROP|"+p.Name+"|"+p.PropertyType.FullName+"|<NULL>");
                          else if(v is byte[])Log(tag+"_PROP|"+p.Name+"|System.Byte[]|"+Hex((byte[])v));
                          else if(p.PropertyType.IsPrimitive || v is string || p.PropertyType.IsEnum)
                              Log(tag+"_PROP|"+p.Name+"|"+p.PropertyType.FullName+"|"+v.ToString());
                      }catch(Exception ex){
                          Log(tag+"_PROP_ERROR|"+p.Name+"|"+ex.GetBaseException().GetType().FullName);
                      }
                  }
              }

              public static void Main(string[] a)
              {
                  if(a.Length<6)throw new Exception(
                      "args: vendor.exe output challenge expectedReply payloadFile outDir");

                  string exe=Path.GetFullPath(a[0]);
                  OutPath=Path.GetFullPath(a[1]);
                  string challengeHex=a[2];
                  string expectedReply=a[3];
                  string payloadFile=Path.GetFullPath(a[4]);
                  OutDir=Path.GetFullPath(a[5]);

                  File.WriteAllText(OutPath,"");
                  Directory.SetCurrentDirectory(Path.GetDirectoryName(exe));

                  Log("MODE=OFFLINE_FULL_V31_DEVICE_DESCRIPTION_REPLAY");
                  Log("REAL_HID_OBJECT_CREATED=NO");
                  Log("REAL_HID_CONNECT_INVOKED=NO");
                  Log("REAL_HID_SEND_INVOKED=NO");
                  Log("REAL_HID_READ_INVOKED=NO");
                  Log("REAL_HID_WRITE_INVOKED=NO");
                  Log("HOST_TO_DSP_IO=NO");
                  Log("FEATURE_REPORT_INVOKED=NO");
                  Log("FLASH_ALLOWED=NO");

                  var rows=File.ReadAllLines(payloadFile)
                      .Where(x=>!String.IsNullOrWhiteSpace(x))
                      .Select(x=>x.Split(new[]{':'},2))
                      .Select(x=>new{Index=Int32.Parse(x[0]),Data=FromHex(x[1].Trim())})
                      .OrderBy(x=>x.Index)
                      .ToList();

                  Log("INPUT_PAYLOAD_COUNT="+rows.Count);
                  Log("INPUT_PAYLOAD_TOTAL_BYTES="+rows.Sum(x=>x.Data.Length));

                  Assembly asm=Assembly.LoadFile(exe);
                  RuntimeHelpers.RunModuleConstructor(asm.ManifestModule.ModuleHandle);

                  Type baseType=asm.GetType(
                      "DSTech_AudioDSP_Client.DeviceCommunicationStream",true);

                  Type bridgeType=asm.GetType(
                      "DSTech_AudioDSP_Client.UFEcommandBridge",true);

                  Type cap=CaptureType(baseType);
                  object stream=Activator.CreateInstance(cap);
                  SetConnected(stream,baseType);

                  object bridge=bridgeType.GetConstructor(new[]{baseType})
                      .Invoke(new[]{stream});

                  MethodInfo req=bridgeType.GetMethod(
                      "SendDevTypeSwVersAuthenRequest",
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance);

                  MethodInfo fbl=bridgeType.GetMethod(
                      "FBL3HEmTva",
                      BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance);

                  if(req==null||fbl==null)throw new Exception("parser roots missing");

                  Sink.Clear();
                  InvokeBounded(req,bridge,null,1500,"STARTUP_HELPER");
                  Thread.Sleep(100);
                  Sink.Clear();

                  byte[] challenge=FromHex(challengeHex);

                  InvokeBounded(
                      fbl,bridge,new object[]{stream,challenge,EventArgs.Empty},
                      3000,"AUTH_CHALLENGE");

                  Thread.Sleep(150);

                  byte[][] authWrites=Sink.Snapshot();
                  Log("AUTH_WRITE_COUNT="+authWrites.Length);
                  for(int i=0;i<authWrites.Length;i++)
                      Log("AUTH_WRITE_"+i+"="+Hex(authWrites[i]));

                  string authReply=
                      authWrites.Length>0&&authWrites[0]!=null?Hex(authWrites[0]):"<NONE>";

                  Log("AUTH_REPLY_HEX="+authReply);
                  Log("EXPECTED_AUTH_REPLY_HEX="+expectedReply);
                  Log("AUTH_REPLY_MATCH="+String.Equals(
                      authReply,expectedReply,StringComparison.OrdinalIgnoreCase));

                  Log("STATE_AFTER_AUTH="+ReadStatus(bridge,bridgeType));
                  Sink.Clear();

                  foreach(var row in rows)
                  {
                      string tag="PAYLOAD_"+row.Index.ToString("D2");
                      try
                      {
                          InvokeBounded(
                              fbl,bridge,new object[]{stream,row.Data,EventArgs.Empty},
                              3000,tag+"_PARSE");

                          Log(tag+"_PARSE_RETURNED=true");
                      }
                      catch(Exception ex)
                      {
                          Exception b=ex.GetBaseException();
                          Log(tag+"_PARSE_EXCEPTION="+b.GetType().FullName+":"+b.Message);
                      }

                      if(row.Index==1 || row.Index%8==0 || row.Index>=68)
                      {
                          Log(tag+"_STATE="+ReadStatus(bridge,bridgeType));
                          Log(tag+"_DEV_DESCRIPTION_LENGTH="+
                              GetDevDescriptionLength(bridge,bridgeType));

                          byte[] acc=GetDescriptionBytes(bridge,bridgeType);
                          Log(tag+"_ACCUMULATED_BYTES="+(acc==null?-1:acc.Length));
                      }
                  }

                  Thread.Sleep(200);

                  string finalState=ReadStatus(bridge,bridgeType);
                  int declaredLen=GetDevDescriptionLength(bridge,bridgeType);
                  byte[] descBytes=GetDescriptionBytes(bridge,bridgeType);
                  string descString=GetDescriptionString(bridge,bridgeType);

                  Log("FINAL_STATE="+finalState);
                  Log("FINAL_DEV_DESCRIPTION_LENGTH="+declaredLen);
                  Log("FINAL_ACCUMULATED_BYTES="+(descBytes==null?-1:descBytes.Length));
                  Log("FINAL_DEVICE_DESCRIPTION_STRING_CHARS="+
                      (descString==null?-1:descString.Length));

                  if(descBytes!=null)
                  {
                      File.WriteAllBytes(
                          Path.Combine(OutDir,"DEVICE_DESCRIPTION_BYTES.bin"),descBytes);

                      try
                      {
                          string utf8=Encoding.UTF8.GetString(descBytes);
                          File.WriteAllText(
                              Path.Combine(OutDir,"DEVICE_DESCRIPTION_FROM_BYTES.txt"),
                              utf8,Encoding.UTF8);

                          Log("DEVICE_DESCRIPTION_BYTES_UTF8_CHARS="+utf8.Length);
                      }
                      catch(Exception ex)
                      {
                          Log("DEVICE_DESCRIPTION_BYTES_UTF8_EXCEPTION="+ex.GetType().FullName);
                      }
                  }

                  if(descString!=null)
                  {
                      File.WriteAllText(
                          Path.Combine(OutDir,"DEVICE_DESCRIPTION_STRING.txt"),
                          descString,Encoding.UTF8);
                  }

                  BindingFlags bf=BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance;

                  FieldInfo remoteField=bridgeType.GetField("RemoteDevice",bf);
                  object remote=remoteField==null?null:remoteField.GetValue(bridge);
                  DumpObject(remote,"REMOTE_DEVICE",0);

                  foreach(FieldInfo f in bridgeType.GetFields(bf))
                  {
                      string tn=f.FieldType.FullName??f.FieldType.Name;
                      if(tn.IndexOf("DeviceDescriptionDecoded",
                          StringComparison.OrdinalIgnoreCase)>=0)
                      {
                          object v=null;
                          try{v=f.GetValue(bridge);}catch{}
                          DumpObject(v,"DEVICE_DESCRIPTION_DECODED",0);
                      }
                  }

                  byte[][] finalWrites=Sink.Snapshot();
                  Log("POST_DESCRIPTION_FOLLOWUP_WRITE_COUNT="+finalWrites.Length);

                  for(int i=0;i<finalWrites.Length;i++)
                      Log("POST_DESCRIPTION_FOLLOWUP_WRITE_"+i+"="+Hex(finalWrites[i]));

                  Log("REPLAY_COMPLETE=true");
                  Environment.Exit(0);
              }
          }
          '@ | Set-Content "$root\harness\Replay.cs"

          $csc="$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          if(-not(Test-Path $csc)){throw "x86 csc missing"}

          & $csc /nologo /platform:x86 /target:exe `
            /out:"$root\harness\Replay.exe" `
            "$root\harness\Replay.cs"

          if($LASTEXITCODE -ne 0){throw "Replay compile failed"}

      - name: Static safety audit
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v32"
          $s=Get-Content "$root\harness\Replay.cs" -Raw

          foreach($bad in @(
            "HidD_SetOutputReport(","HidD_GetInputReport(",
            "HidD_SetFeature(","HidD_GetFeature(",
            "ReadFile(","WriteFile(","CreateFileW("
          )){
            if($s.Contains($bad)){throw "forbidden real HID primitive: $bad"}
          }

          foreach($need in @(
            "CaptureType",
            "SendDevTypeSwVersAuthenRequest",
            "FBL3HEmTva",
            "DEVICE_DESCRIPTION_BYTES.bin",
            "POST_DESCRIPTION_FOLLOWUP_WRITE_COUNT",
            "REAL_HID_OBJECT_CREATED=NO",
            "HOST_TO_DSP_IO=NO",
            "FLASH_ALLOWED=NO"
          )){
            if(-not $s.Contains($need)){throw "missing marker: $need"}
          }

          "STATIC_SAFETY_AUDIT=PASS" |
            Set-Content "$root\evidence\03_STATIC_SAFETY_AUDIT.txt"

      - name: Replay all 72 payloads
        shell: pwsh
        run: |
          $ErrorActionPreference="Continue"
          $root="C:\okn_v32"

          & "$root\harness\Replay.exe" `
            "$root\vendor.exe" `
            "$root\evidence\04_FULL_REPLAY.txt" `
            "$env:V31_CHALLENGE_HEX" `
            "$env:V31_EXPECTED_AUTH_REPLY_HEX" `
            "$root\payloads.txt" `
            "$root\evidence"

          $exit=$LASTEXITCODE
          "HARNESS_EXIT=$exit" | Set-Content "$root\evidence\04A_HARNESS_EXIT.txt"

          if(Test-Path "$root\evidence\04_FULL_REPLAY.txt"){
            Get-Content "$root\evidence\04_FULL_REPLAY.txt" |
              Select-String -Pattern `
              '^(AUTH_|STATE_|PAYLOAD_0?1_|PAYLOAD_08_|PAYLOAD_16_|PAYLOAD_24_|PAYLOAD_32_|PAYLOAD_40_|PAYLOAD_48_|PAYLOAD_56_|PAYLOAD_64_|PAYLOAD_6[8-9]_|PAYLOAD_7[0-2]_|FINAL_|DEVICE_DESCRIPTION_|REMOTE_DEVICE|POST_DESCRIPTION_|REPLAY_)'
          }

          exit 0

      - name: Parse recovered Device Description JSON
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v32"

          @'
          from pathlib import Path
          import json,re,hashlib

          ev=Path(r"C:\okn_v32\evidence")
          replay=(ev/"04_FULL_REPLAY.txt").read_text(errors="ignore")

          def one(pat,default=""):
              m=re.search(pat,replay,re.M)
              return m.group(1) if m else default

          candidates=[]
          for name in ["DEVICE_DESCRIPTION_STRING.txt",
                       "DEVICE_DESCRIPTION_FROM_BYTES.txt"]:
              p=ev/name
              if p.exists():
                  s=p.read_text(errors="ignore").strip("\x00\r\n ")
                  if s:
                      candidates.append((name,s))

          parsed=None
          parsed_name=None
          parse_error=None

          for name,s in candidates:
              # Prefer the first complete JSON object in the recovered text.
              left=s.find("{")
              right=s.rfind("}")
              if left>=0 and right>left:
                  candidate=s[left:right+1]
                  try:
                      parsed=json.loads(candidate)
                      parsed_name=name
                      (ev/"DEVICE_DESCRIPTION_PARSED.json").write_text(
                          json.dumps(parsed,indent=2,ensure_ascii=False)+"\n")
                      break
                  except Exception as e:
                      parse_error=f"{type(e).__name__}: {e}"

          def summary_value(v):
              if isinstance(v,(str,int,float,bool)) or v is None:
                  return v
              if isinstance(v,list):
                  return {"type":"list","count":len(v)}
              if isinstance(v,dict):
                  return {"type":"object","keys":sorted(v.keys())[:50]}
              return str(type(v))

          summary={
              "revision":"MASTER-V32",
              "classification":"OFFLINE_FULL_DEVICE_DESCRIPTION_PARSE_NOT_FOR_FLASH",
              "auth_reply_match":one(r'^AUTH_REPLY_MATCH=(True|False)$')=="True",
              "state_after_auth":one(r'^STATE_AFTER_AUTH=(.*)$'),
              "final_state":one(r'^FINAL_STATE=(.*)$'),
              "final_dev_description_length":int(one(r'^FINAL_DEV_DESCRIPTION_LENGTH=(-?\d+)$',"-1")),
              "final_accumulated_bytes":int(one(r'^FINAL_ACCUMULATED_BYTES=(-?\d+)$',"-1")),
              "post_description_followup_write_count":int(one(r'^POST_DESCRIPTION_FOLLOWUP_WRITE_COUNT=(\d+)$',"0")),
              "replay_complete":"REPLAY_COMPLETE=true" in replay,
              "json_parse_ok":parsed is not None,
              "json_source":parsed_name,
              "json_parse_error":parse_error,
              "real_hid_invoked":False,
              "host_to_dsp_io":False,
              "feature_report_invoked":False,
              "flash_allowed":False
          }

          if parsed is not None:
              summary["top_level_keys"]=sorted(parsed.keys())
              summary["top_level_summary"]={
                  k:summary_value(v) for k,v in parsed.items()
              }

              for key in ["sensors","actuators","parameters","params","controls",
                          "inputs","outputs","features","devices"]:
                  v=parsed.get(key)
                  if isinstance(v,list):
                      summary[key+"_count"]=len(v)

              # Emit a concise inventory for list-of-object top-level sections.
              inventory=[]
              for key,v in parsed.items():
                  if isinstance(v,list) and v and all(isinstance(x,dict) for x in v[:20]):
                      for idx,item in enumerate(v):
                          inventory.append({
                              "section":key,
                              "index":idx,
                              "ID":item.get("ID",item.get("id")),
                              "name":item.get("name",item.get("Name")),
                              "type":item.get("type",item.get("Type")),
                              "path":item.get("path",item.get("Path")),
                              "accs":item.get("accs",item.get("access"))
                          })
              (ev/"DEVICE_DESCRIPTION_INVENTORY.json").write_text(
                  json.dumps(inventory,indent=2,ensure_ascii=False)+"\n")

          (ev/"05_V32_DECISION.json").write_text(
              json.dumps(summary,indent=2,ensure_ascii=False)+"\n")

          if summary["json_parse_ok"] and summary["final_dev_description_length"]>0:
              status="FULL_DEVICE_DESCRIPTION_RECOVERED_AND_JSON_PARSED"
          elif summary["final_dev_description_length"]>0:
              status="FULL_STREAM_REPLAYED_DESCRIPTION_PRESENT_JSON_PARSE_NEEDS_REVIEW"
          else:
              status="FULL_STREAM_REPLAYED_BUT_DESCRIPTION_NOT_FINALIZED"

          summary["status"]=status
          (ev/"05_V32_DECISION.json").write_text(
              json.dumps(summary,indent=2,ensure_ascii=False)+"\n")

          md=f"""# MASTER V32 FINAL DECISION

          - V31 challenge/reply reproduced: **{summary['auth_reply_match']}**
          - State immediately after auth: **{summary['state_after_auth']}**
          - Final parser state: **{summary['final_state']}**
          - Final Device Description length: **{summary['final_dev_description_length']}**
          - Final accumulated description bytes: **{summary['final_accumulated_bytes']}**
          - Device Description JSON parsed: **{summary['json_parse_ok']}**
          - Post-description captured follow-up writes: **{summary['post_description_followup_write_count']}**
          - Real HID invoked: **NO**
          - Host-to-DSP I/O: **NO**
          - Flash/erase/write: **NO / NO / NO**

          Status: **{status}**

          This revision replays the complete 72-report V31 capture through the
          exact official vendor parser offline. Any follow-up vendor write is
          captured only in the fake stream and is never sent to hardware.

          Classification:
          **OFFLINE_FULL_DEVICE_DESCRIPTION_PARSE_NOT_FOR_FLASH**
          """

          (ev/"06_V32_FINAL_DECISION.md").write_text(md)
          print(md)
          '@ | Set-Content "$root\parse.py"

          python "$root\parse.py"
          if($LASTEXITCODE -ne 0){throw "V32 parse failed"}

          Get-Content "$root\evidence\06_V32_FINAL_DECISION.md" >> $env:GITHUB_STEP_SUMMARY

      - name: Package V32 evidence
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference="Continue"
          $root="C:\okn_v32"

          Copy-Item "$root\evidence\*" "$root\out\" -Force -ErrorAction SilentlyContinue

          foreach($bad in @("vendor.exe","Replay.exe")){
            if(Test-Path "$root\out\$bad"){Remove-Item -Force "$root\out\$bad"}
          }

          Get-ChildItem "$root\out" -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content "$root\out\SHA256SUMS.txt"

      - name: Upload V32 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OKN-BP1048P4-MASTER-V32-FULL-DEVICE-DESCRIPTION-PARSE-EVIDENCE
          path: C:\okn_v32\out\*
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed assertion
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"

          foreach($n in @(
            "LIVE_DSP_CONNECTED","USB_TARGET_ACCESS","HOST_TO_DSP_IO",
            "REAL_HID_OBJECT_ALLOWED","REAL_HID_CONNECT_ALLOWED",
            "REAL_HID_SEND_ALLOWED","REAL_HID_READ_ALLOWED","REAL_HID_WRITE_ALLOWED",
            "FEATURE_REPORT_ALLOWED","FLASH_ALLOWED","ERASE_ALLOWED","WRITE_ALLOWED"
          )){
            if((Get-Item "Env:$n").Value -ne "NO"){throw "$n changed"}
          }

          "MASTER_V32_FAIL_CLOSED=PASS"
          "REAL_HID_IO=NO"
          "HOST_TO_DSP_IO=NO"
          "FLASH_ALLOWED=NO"
