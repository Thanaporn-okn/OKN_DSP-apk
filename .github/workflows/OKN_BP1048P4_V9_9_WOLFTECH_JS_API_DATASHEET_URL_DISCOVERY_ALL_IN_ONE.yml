name: OKN BP1048P4 V9.9 WOLFTECH JS API DATASHEET URL DISCOVERY ALL IN ONE

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/OKN_BP1048P4_V9_9_WOLFTECH_JS_API_DATASHEET_URL_DISCOVERY_ALL_IN_ONE.yml'

permissions:
  contents: read

env:
  FLASH_ALLOWED: "NO"
  AICE_USB_ALLOWED: "NO"
  HARDWARE_PROBE_ALLOWED: "NO"
  PDF_BODY_DOWNLOAD_ALLOWED: "NO"
  WOLFTECH_PAGE: "https://www.wolftech-radio.com/jrwm"

jobs:
  static_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          test "$AICE_USB_ALLOWED" = "NO"
          test "$HARDWARE_PROBE_ALLOWED" = "NO"
          test "$PDF_BODY_DOWNLOAD_ALLOWED" = "NO"
          rm -rf /tmp/v99
          mkdir -p /tmp/v99/evidence /tmp/v99/js
          cat > /tmp/v99/evidence/SAFETY.txt <<'EOF'
          TARGET_BP1048_CONNECTED=NO
          AICE_CONNECTED=NO
          OPENOCD_EXECUTED=NO
          ICEMAN_EXECUTED=NO
          USB_COMMAND_SENT=NO
          JTAG_COMMAND_SENT=NO
          UNKNOWN_BOARD_PIN_PROBED=NO
          PDF_BODY_DOWNLOADED=NO
          FLASH_READ_EXECUTED=NO
          FLASH_ERASE_EXECUTED=NO
          FLASH_WRITE_EXECUTED=NO
          FLASH_ALLOWED=NO
          AICE_USB_ALLOWED=NO
          HARDWARE_PROBE_ALLOWED=NO
          PDF_BODY_DOWNLOAD_ALLOWED=NO
          EOF

      - name: Fetch Wolftech page and discover JavaScript assets
        shell: bash
        run: |
          set -euo pipefail
          E=/tmp/v99/evidence

          curl -L --compressed --max-time 30 --connect-timeout 10 \
            -A 'Mozilla/5.0' "$WOLFTECH_PAGE" \
            -o "$E/WOLFTECH_PAGE.html" -D "$E/WOLFTECH_HEADERS.txt"

          python3 - <<'PY'
          from pathlib import Path
          import re, json, html
          from urllib.parse import urljoin

          E=Path('/tmp/v99/evidence')
          txt=(E/'WOLFTECH_PAGE.html').read_text(errors='replace')
          base='https://www.wolftech-radio.com/jrwm'

          urls=[]
          seen=set()
          for m in re.finditer(r'''(?is)<script[^>]+src=["']([^"']+)["']''',txt):
              u=urljoin(base,html.unescape(m.group(1)))
              if u not in seen:
                  seen.add(u); urls.append(u)

          wan=[u for u in urls if 'wanwang.xin' in u.lower()]
          result={
              'script_urls':urls,
              'wanwang_script_urls':wan,
              'wanwang_script_count':len(wan)
          }
          (E/'V9_9_SCRIPT_URLS.json').write_text(json.dumps(result,indent=2,ensure_ascii=False)+'\n')

          with (E/'WANWANG_SCRIPT_URLS.txt').open('w') as f:
              for u in wan:
                  f.write(u+'\n')

          if not wan:
              raise RuntimeError('No Wanwang script URLs found')
          PY

      - name: Download public JavaScript assets only
        shell: bash
        run: |
          set -euo pipefail
          test "$PDF_BODY_DOWNLOAD_ALLOWED" = "NO"
          E=/tmp/v99/evidence
          mkdir -p /tmp/v99/js

          i=0
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            i=$((i+1))
            file="/tmp/v99/js/asset_${i}.js"
            curl -L --compressed --max-time 30 --connect-timeout 10 \
              -A 'Mozilla/5.0' "$url" -o "$file"
            printf '%s\t%s\n' "$file" "$url" >> "$E/JS_FETCH_MAP.tsv"
          done < "$E/WANWANG_SCRIPT_URLS.txt"

          test -s "$E/JS_FETCH_MAP.tsv"
          find /tmp/v99/js -type f -maxdepth 1 -printf '%f %s bytes\n' | sort \
            > "$E/JS_FILE_SIZES.txt"

      - name: Search JavaScript for BP1048P4 download data and API endpoints
        shell: bash
        run: |
          set -euo pipefail
          E=/tmp/v99/evidence

          grep -RInaE --binary-files=without-match \
            'BP1048P4|BP1048|数据手册|datasheet|\.pdf|download|DownLoad|ajax|api/|/api|ashx|handler|fileUrl|filePath|href|附件|下载' \
            /tmp/v99/js > "$E/JS_HIGH_SIGNAL.txt" || true

          python3 - <<'PY'
          from pathlib import Path
          import re, json, html
          from urllib.parse import urljoin

          E=Path('/tmp/v99/evidence')
          root=Path('/tmp/v99/js')
          base='https://www.wolftech-radio.com/'

          alltxt=''
          files={}
          for p in sorted(root.glob('*.js')):
              t=p.read_text(errors='replace')
              files[p.name]=t
              alltxt += '\n' + t

          # Contexts around BP1048P4
          contexts=[]
          for name,t in files.items():
              for m in re.finditer('BP1048P4',t,re.I):
                  contexts.append({
                      'file':name,
                      'context':t[max(0,m.start()-1200):min(len(t),m.end()+2400)]
                  })
          (E/'BP1048P4_JS_CONTEXT.json').write_text(json.dumps(contexts[:100],indent=2,ensure_ascii=False)+'\n')

          # URL-like strings and endpoint-like paths
          candidates=[]
          seen=set()

          url_re=re.compile(r'https?://[^\s"\'<>\\]+',re.I)
          for m in url_re.finditer(alltxt):
              u=html.unescape(m.group(0))
              if u not in seen:
                  seen.add(u); candidates.append(u)

          str_re=re.compile(r'''["']([^"']{3,500})["']''')
          for m in str_re.finditer(alltxt):
              s=html.unescape(m.group(1))
              sl=s.lower()
              if any(k in sl for k in ['bp1048','.pdf','download','ajax','api/','ashx','handler']):
                  if s.startswith('//'):
                      u='https:'+s
                  elif s.startswith('/'):
                      u=urljoin(base,s)
                  elif s.startswith('http'):
                      u=s
                  else:
                      u=s
                  if u not in seen:
                      seen.add(u); candidates.append(u)

          direct_pdf=[u for u in candidates if 'bp1048' in u.lower() and '.pdf' in u.lower()]
          api_like=[u for u in candidates if any(k in u.lower() for k in ['/api','ajax','ashx','handler','download'])]

          result={
              'bp1048p4_context_count':len(contexts),
              'all_candidate_count':len(candidates),
              'direct_bp1048p4_pdf_candidates':direct_pdf[:100],
              'api_or_download_candidates':api_like[:200],
              'pdf_body_download_attempted':False
          }
          (E/'V9_9_JS_DISCOVERY.json').write_text(json.dumps(result,indent=2,ensure_ascii=False)+'\n')
          PY

      - name: Extract obfuscated request and endpoint clues
        shell: bash
        run: |
          set -euo pipefail
          E=/tmp/v99/evidence

          grep -RInaE --binary-files=without-match \
            '\$\.ajax|fetch\(|axios|XMLHttpRequest|WebApi|Get[A-Za-z]+List|PageIndex|PageSize|CategoryId|Download|downLoad|fileUrl|FileUrl|FilePath|filepath|attach|Attachment' \
            /tmp/v99/js > "$E/JS_REQUEST_CLUES.txt" || true

          python3 - <<'PY'
          from pathlib import Path
          import json,re

          E=Path('/tmp/v99/evidence')
          txt='\n'.join(p.read_text(errors='replace') for p in Path('/tmp/v99/js').glob('*.js'))

          methods=[]
          for pat in [
              r'(?is)\$\.ajax\s*\(\s*\{.{0,4000}?\}',
              r'(?is)fetch\s*\(.{0,1500}?\)',
              r'(?is)new\s+XMLHttpRequest.{0,2000}',
          ]:
              methods += re.findall(pat,txt)[:100]

          (E/'JS_REQUEST_BLOCKS.txt').write_text('\n\n---\n\n'.join(methods[:100]))

          disc=json.loads((E/'V9_9_JS_DISCOVERY.json').read_text())
          result={
              'direct_pdf_candidate_count':len(disc['direct_bp1048p4_pdf_candidates']),
              'api_download_candidate_count':len(disc['api_or_download_candidates']),
              'bp1048p4_context_count':disc['bp1048p4_context_count'],
              'static_js_assets_reveal_direct_pdf':bool(disc['direct_bp1048p4_pdf_candidates']),
              'static_js_assets_reveal_bp1048p4_literal':disc['bp1048p4_context_count']>0,
              'next_classification':'If no literal or direct PDF exists, the page list is likely fetched at runtime from an API endpoint or rendered server-side per crawler/session.'
          }
          (E/'V9_9_RESULT.json').write_text(json.dumps(result,indent=2,ensure_ascii=False)+'\n')
          PY

      - name: Final fail-closed assertions
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          test "$AICE_USB_ALLOWED" = "NO"
          test "$HARDWARE_PROBE_ALLOWED" = "NO"
          test "$PDF_BODY_DOWNLOAD_ALLOWED" = "NO"

          python3 - <<'PY'
          from pathlib import Path
          import json

          E=Path('/tmp/v99/evidence')
          safety=(E/'SAFETY.txt').read_text()
          for x in [
              'TARGET_BP1048_CONNECTED=NO',
              'AICE_CONNECTED=NO',
              'OPENOCD_EXECUTED=NO',
              'ICEMAN_EXECUTED=NO',
              'USB_COMMAND_SENT=NO',
              'JTAG_COMMAND_SENT=NO',
              'UNKNOWN_BOARD_PIN_PROBED=NO',
              'PDF_BODY_DOWNLOADED=NO',
              'FLASH_READ_EXECUTED=NO',
              'FLASH_ERASE_EXECUTED=NO',
              'FLASH_WRITE_EXECUTED=NO',
              'FLASH_ALLOWED=NO',
              'AICE_USB_ALLOWED=NO',
              'HARDWARE_PROBE_ALLOWED=NO',
              'PDF_BODY_DOWNLOAD_ALLOWED=NO'
          ]:
              assert x in safety, x

          scripts=json.loads((E/'V9_9_SCRIPT_URLS.json').read_text())
          result=json.loads((E/'V9_9_RESULT.json').read_text())

          assert scripts['wanwang_script_count'] >= 1
          assert isinstance(result['direct_pdf_candidate_count'], int)
          assert isinstance(result['api_download_candidate_count'], int)

          print('V9_9_WOLFTECH_JS_API_DISCOVERY_COMPLETE=YES')
          print('FLASH_ALLOWED=NO')
          print('AICE_USB_ALLOWED=NO')
          print('HARDWARE_PROBE_ALLOWED=NO')
          print('PDF_BODY_DOWNLOAD_ALLOWED=NO')
          PY

      - name: Build report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E=/tmp/v99/evidence
          python3 - <<'PY'
          from pathlib import Path
          import json
          E=Path('/tmp/v99/evidence')
          r={}
          for n in ['V9_9_SCRIPT_URLS.json','V9_9_JS_DISCOVERY.json','V9_9_RESULT.json']:
              p=E/n
              if p.exists():
                  r[n]=json.loads(p.read_text())
          (E/'V9_9_REPORT.md').write_text(
              '# BP1048P4 V9.9 — Wolftech JS/API datasheet URL discovery\n\n'
              + '```json\n' + json.dumps(r,indent=2,ensure_ascii=False) + '\n```\n\n'
              + '- Public JavaScript assets only; no datasheet PDF body was downloaded.\n'
              + '- No BP1048 hardware/debug operation was performed.\n'
          )
          PY
          cat "$E/V9_9_REPORT.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Package V9.9 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v99/evidence
          zip -9 -r /tmp/OKN_BP1048P4_V9_9_WOLFTECH_JS_API_DISCOVERY_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/OKN_BP1048P4_V9_9_WOLFTECH_JS_API_DISCOVERY_EVIDENCE.zip \
            > /tmp/OKN_BP1048P4_V9_9_WOLFTECH_JS_API_DISCOVERY_EVIDENCE.zip.sha256

      - name: Upload V9.9 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OKN-BP1048P4-V9_9-WOLFTECH-JS-API-DISCOVERY-EVIDENCE
          path: |
            /tmp/OKN_BP1048P4_V9_9_WOLFTECH_JS_API_DISCOVERY_EVIDENCE.zip
            /tmp/OKN_BP1048P4_V9_9_WOLFTECH_JS_API_DISCOVERY_EVIDENCE.zip.sha256
            /tmp/v99/evidence/V9_9_REPORT.md
            /tmp/v99/evidence/V9_9_SCRIPT_URLS.json
            /tmp/v99/evidence/V9_9_JS_DISCOVERY.json
            /tmp/v99/evidence/V9_9_RESULT.json
            /tmp/v99/evidence/WANWANG_SCRIPT_URLS.txt
            /tmp/v99/evidence/JS_FETCH_MAP.tsv
            /tmp/v99/evidence/JS_FILE_SIZES.txt
            /tmp/v99/evidence/JS_HIGH_SIGNAL.txt
            /tmp/v99/evidence/BP1048P4_JS_CONTEXT.json
            /tmp/v99/evidence/JS_REQUEST_CLUES.txt
            /tmp/v99/evidence/JS_REQUEST_BLOCKS.txt
            /tmp/v99/evidence/WOLFTECH_HEADERS.txt
            /tmp/v99/evidence/SAFETY.txt
          if-no-files-found: warn
          retention-days: 90
