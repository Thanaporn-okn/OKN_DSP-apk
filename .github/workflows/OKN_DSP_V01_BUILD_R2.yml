        shell: bash
        run: |
          set -euo pipefail
          echo "FLASH_ALLOWED=NO"
          echo "BOARD_USB_ACCESS=NO"
          echo "NO_STOCK_USB_TX=YES"
          echo "NO_ERASE_PROGRAM_FLASH=YES"

