      - name: Firmware host build and tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S /tmp/okn/OKN-DSP/firmware -B /tmp/okn/OKN-DSP/firmware/build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build /tmp/okn/OKN-DSP/firmware/build
          ctest --test-dir /tmp/okn/OKN-DSP/firmware/build --output-on-failure

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android protocol/model host test
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/okn/OKN-DSP
          mkdir -p android-app/host-test/out
          javac -Xlint:all -Werror -d android-app/host-test/out             android-app/app/src/main/java/com/okn/dsp/DspModel.java             android-app/app/src/main/java/com/okn/dsp/OknPacket.java             android-app/host-test/OknPacketHostTest.java
          java -cp android-app/host-test/out com.okn.dsp.OknPacketHostTest

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER"
          "$SDKMANAGER" --version
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build OKN-DSP APK
        working-directory: /tmp/okn/OKN-DSP/android-app
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug

      - name: Verify build safety flags
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'OKN_RUNTIME_USB_TX_ENABLED", "false"' /tmp/okn/OKN-DSP/android-app/app/build.gradle.kts
          grep -F 'OKN_PRODUCTION_FLASH_ENABLED", "false"' /tmp/okn/OKN-DSP/android-app/app/build.gradle.kts

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          sha256sum /tmp/OKN-DSP-v0.1.0-source.zip > /tmp/OKN-DSP-v0.1.0-source.zip.sha256
          cp /tmp/okn/OKN-DSP/android-app/app/build/outputs/apk/debug/app-debug.apk /tmp/OKN-DSP-v0.1.0-debug.apk
          sha256sum /tmp/OKN-DSP-v0.1.0-debug.apk > /tmp/OKN-DSP-v0.1.0-debug.apk.sha256

      - name: Upload OKN-DSP package
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-v0.1.0-package
          path: |
            /tmp/OKN-DSP-v0.1.0-source.zip
            /tmp/OKN-DSP-v0.1.0-source.zip.sha256
            /tmp/OKN-DSP-v0.1.0-debug.apk
            /tmp/OKN-DSP-v0.1.0-debug.apk.sha256
          if-no-files-found: error
