name: OKN-DSP v0.1.0 package CI

on:
  push:
    branches:
      - main
      - 'okn-dsp-v0.1.0'
  workflow_dispatch:

permissions:
  contents: read

env:
  FLASH_ALLOWED: 'NO'
  BOARD_USB_ACCESS: 'NO'
  FINAL_INSTALL_PATH: 'SAMSUNG_S25_PLUS_USB_C_DIRECT_TO_DSP_USB_C_ONLY'
  HARDWARE_MODIFICATION: 'FORBIDDEN'
  ANDROID_HOME: '/usr/local/lib/android/sdk'
  ANDROID_SDK_ROOT: '/usr/local/lib/android/sdk'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

