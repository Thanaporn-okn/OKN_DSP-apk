name: R88 BP1048P4 official GoloPine Windows boot recovery closure

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r88-bp1048p4-golopine-windows-closure-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLOPINE_ZIP_URL: https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-08.exe_.zip
  EXPECTED_ZIP_SHA256: f14b0c4baad70a8b0d5dc3b2783819cc2ef6e1a9c6ec2adcf17f1557059edd2a
  EXPECTED_EXE_SHA256: 3ca54171c53f7badd963ffe6851b8b3e2faf8aee8ba2afcb7040990e22ae09b2
  FLASH_ALLOWED: 'NO'

jobs:
  static-closure:
    name: OFFLINE official Windows client boot/recovery closure - no execution/no USB/no board/no flash
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/R88_SAFETY.txt <<'EOF'
          R88_STATIC_ONLY=YES
          SOURCE=OFFICIAL_GOLOPINE_WINDOWS_2026-04-08
          VENDOR_BINARY_EXECUTION=NO
          BOARD_CONTACT=NO
          USB_DEVICE_ACCESS=NO
          ERASE_PROGRAM_FLASH=NO
          SEND_AA55=NO
          SEND_0X11=NO
          SEND_CHIPERAS_CODEDATA_BOOTDAT_CONSTDAT_CNFGDAT_BTUPDAT_UPINFO_CXXX=NO
          R79_PHYSICAL_REPLUG_AUTORUN=NO
          FLASH_ALLOWED=NO
          PURPOSE=CLOSE_HIDDEN_BOOT_RECOVERY_TRANSPORT_SURFACE_IN_OFFICIAL_WINDOWS_RUNTIME_CLIENT
          EOF
          cat /tmp/R88_SAFETY.txt

      - name: Install static-analysis prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/r88-venv
          /tmp/r88-venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir \
            pefile dnfile
          echo "/tmp/r88-venv/bin" >> "$GITHUB_PATH"

      - name: Acquire official package and enforce known SHA pins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r88/download /tmp/r88/unpacked /tmp/r88/evidence
          curl --fail --location --retry 4 --connect-timeout 20 \
            "$GOLOPINE_ZIP_URL" -o /tmp/r88/download/golopine_windows_20260408.zip

          ZIP_SHA="$(sha256sum /tmp/r88/download/golopine_windows_20260408.zip | awk '{print $1}')"
          test "$ZIP_SHA" = "$EXPECTED_ZIP_SHA256"

          unzip -q /tmp/r88/download/golopine_windows_20260408.zip -d /tmp/r88/unpacked
          EXE="$(find /tmp/r88/unpacked -type f -iname '*.exe' -print -quit)"
          test -n "$EXE"
          cp "$EXE" /tmp/r88/golopine_audio_turning_release_2026-04-08.exe

          EXE_SHA="$(sha256sum /tmp/r88/golopine_audio_turning_release_2026-04-08.exe | awk '{print $1}')"
          test "$EXE_SHA" = "$EXPECTED_EXE_SHA256"

          printf 'SHA_PIN_MATCH=YES\nZIP_SHA256=%s\nEXE_SHA256=%s\n' "$ZIP_SHA" "$EXE_SHA" \
            | tee /tmp/r88/evidence/R88_SHA_GATE.txt

      - name: PE imports CLR metadata and exact transport API audit
        shell: bash
        run: |
          set -euo pipefail
          /tmp/r88-venv/bin/python - <<'PY'
          from pathlib import Path
          import json, re, hashlib
          import pefile

          exe=Path('/tmp/r88/golopine_audio_turning_release_2026-04-08.exe')
          out=Path('/tmp/r88/evidence')
          pe=pefile.PE(str(exe), fast_load=False)
          base=pe.OPTIONAL_HEADER.ImageBase

          imports=[]
          for ent in getattr(pe,'DIRECTORY_ENTRY_IMPORT',[]):
              dll=ent.dll.decode(errors='ignore')
              for imp in ent.imports:
                  name=imp.name.decode(errors='ignore') if imp.name else f'ordinal_{imp.ordinal}'
                  imports.append({'dll':dll,'name':name,'iat_va':imp.address,'iat_rva':imp.address-base})

          transport_re=re.compile(
              r'HidD_|HidP_|SetupDi|CreateFile|ReadFile|WriteFile|DeviceIoControl|WinUsb|libusb|usb|hid',
              re.I
          )
          transport_imports=[x for x in imports if transport_re.search(x['dll']+'!'+x['name'])]

          clr_dir=pe.OPTIONAL_HEADER.DATA_DIRECTORY[14]
          meta={
              'machine':hex(pe.FILE_HEADER.Machine),
              'image_base':hex(base),
              'entry_rva':hex(pe.OPTIONAL_HEADER.AddressOfEntryPoint),
              'clr_directory_rva':clr_dir.VirtualAddress,
              'clr_directory_size':clr_dir.Size,
              'is_dotnet':bool(clr_dir.VirtualAddress and clr_dir.Size),
              'imports':imports,
              'transport_imports':transport_imports,
          }
          out.joinpath('R88_PE_METADATA_IMPORTS.json').write_text(json.dumps(meta,indent=2)+'\n')

          # Managed metadata audit, fail-open for parsing but fail-closed for conclusions.
          managed={
              'parse_ok':False,
              'assembly_refs':[],
              'type_refs':[],
              'method_defs':[],
              'pinvoke_impls':[],
              'interesting_names':[],
          }
          try:
              import dnfile
              dn=dnfile.dnPE(str(exe))
              managed['parse_ok']=bool(getattr(dn,'net',None))
              if getattr(dn,'net',None):
                  md=getattr(dn.net,'mdtables',None)
                  if md:
                      for tab,field,key in [
                          ('AssemblyRef','Name','assembly_refs'),
                          ('TypeRef','TypeName','type_refs'),
                          ('MethodDef','Name','method_defs'),
                      ]:
                          t=getattr(md,tab,None)
                          if t:
                              for row in t.rows:
                                  try:
                                      v=str(getattr(row,field,''))
                                  except:
                                      continue
                                  if v: managed[key].append(v)
                      # ImplMap holds P/Invoke mappings in .NET metadata.
                      t=getattr(md,'ImplMap',None)
                      if t:
                          for row in t.rows:
                              try:
                                  name=str(getattr(row,'ImportName',''))
                                  scope=str(getattr(getattr(row,'ImportScope',None),'row',None))
                                  managed['pinvoke_impls'].append({'name':name,'scope':scope})
                              except:
                                  pass

              needles=[
                  'usb','hid','winusb','setupdi','createfile','deviceiocontrol',
                  'boot','recovery','upgrade','firmware','flash',
                  'writeactuator','readactuator','ufe','device description'
              ]
              vals=managed['assembly_refs']+managed['type_refs']+managed['method_defs']+[x['name'] for x in managed['pinvoke_impls']]
              managed['interesting_names']=sorted({v for v in vals if any(n in v.lower() for n in needles)})
          except Exception as e:
              managed['error']=repr(e)

          out.joinpath('R88_DOTNET_METADATA.json').write_text(
              json.dumps(managed,indent=2,ensure_ascii=False)+'\n'
          )
          print(json.dumps({
              'IS_DOTNET':meta['is_dotnet'],
              'TRANSPORT_IMPORT_COUNT':len(transport_imports),
              'DOTNET_PARSE_OK':managed['parse_ok'],
              'DOTNET_INTERESTING_NAME_COUNT':len(managed['interesting_names']),
          },indent=2))
          PY

      - name: Exact ASCII UTF16 and binary constant scan
        shell: bash
        run: |
          set -euo pipefail
          /tmp/r88-venv/bin/python - <<'PY'
          from pathlib import Path
          import json,re

          exe=Path('/tmp/r88/golopine_audio_turning_release_2026-04-08.exe')
          b=exe.read_bytes()
          out=Path('/tmp/r88/evidence')

          terms=[
              'HidD_SetFeature','HidD_GetFeature','HidD_SetOutputReport','HidD_GetInputReport',
              'UsbManager','UsbDeviceConnection','WinUsb_ControlTransfer','WinUSB','libusb',
              'SetupDiEnumDeviceInterfaces','SetupDiGetDeviceInterfaceDetail',
              'DeviceIoControl','CreateFileW','CreateFileA',
              'AA55','55AA','6324','1719','2244','VID_','PID_',
              'BP1048P4','BP1048','BP10',
              'bootloader','boot loader','recovery','pc_upgrade','start_up_grate',
              'UsbLoadAudioMode','FLASH_BOOT_EN','PCTOOL',
              'firmware','upgrade','update','download','flash',
              'WriteActuator','ReadActuator','DeviceDescription','UFE',
              'chiperas','codedata','bootdat','constdat','cnfgdat','btupdat','upinfo','cxxx'
          ]

          hits=[]
          for m in re.finditer(rb'[\x20-\x7e]{4,}',b):
              s=m.group().decode('latin1','ignore')
              ms=[x for x in terms if x.lower() in s.lower()]
              if ms:
                  hits.append({'offset':m.start(),'encoding':'ascii','terms':ms,'text':s[:1200]})
          for m in re.finditer(rb'(?:[\x20-\x7e]\x00){4,}',b):
              s=m.group().decode('utf-16le','ignore')
              ms=[x for x in terms if x.lower() in s.lower()]
              if ms:
                  hits.append({'offset':m.start(),'encoding':'utf16le','terms':ms,'text':s[:1200]})

          # Exact byte-pattern census. These are clues only, never protocol proof.
          patterns={
              'AA55_BYTES':bytes.fromhex('aa55'),
              '55AA_BYTES':bytes.fromhex('55aa'),
              'RUNTIME_VID_PID_LE_CONTIG':bytes.fromhex('24631917'),
              'RUNTIME_VID_LE':bytes.fromhex('2463'),
              'RUNTIME_PID_LE':bytes.fromhex('1917'),
              'REFERENCE_PID2244_LE':bytes.fromhex('4422'),
              'WRITE_ACTUATOR_57':bytes([0x57]),
              'READ_ACTUATOR_58':bytes([0x58]),
          }
          census={}
          for name,p in patterns.items():
              offs=[]; start=0
              while True:
                  i=b.find(p,start)
                  if i<0: break
                  offs.append(i)
                  start=i+1
                  if len(offs)>=2000: break
              census[name]={'count':len(offs),'offsets':offs[:200]}

          out.joinpath('R88_STRING_HITS.json').write_text(
              json.dumps(hits,indent=2,ensure_ascii=False)+'\n'
          )
          out.joinpath('R88_BINARY_PATTERN_CENSUS.json').write_text(
              json.dumps(census,indent=2)+'\n'
          )
          print('STRING_HIT_COUNT',len(hits))
          print(json.dumps({k:v['count'] for k,v in census.items()},indent=2))
          PY

      - name: Build conservative closure decision
        shell: bash
        run: |
          set -euo pipefail
          /tmp/r88-venv/bin/python - <<'PY'
          from pathlib import Path
          import json,re

          p=Path('/tmp/r88/evidence')
          pe=json.loads((p/'R88_PE_METADATA_IMPORTS.json').read_text())
          dn=json.loads((p/'R88_DOTNET_METADATA.json').read_text())
          hits=json.loads((p/'R88_STRING_HITS.json').read_text())
          census=json.loads((p/'R88_BINARY_PATTERN_CENSUS.json').read_text())

          strings='\n'.join(x['text'].lower() for x in hits)
          import_text='\n'.join((x['dll']+'!'+x['name']).lower() for x in pe['transport_imports'])
          managed_text='\n'.join(x.lower() for x in dn.get('interesting_names',[]))
          all_api=import_text+'\n'+managed_text

          exact_hid_feature=any(x in all_api for x in [
              'hidd_setfeature','hidd_getfeature','hidd_setoutputreport','hidd_getinputreport'
          ])
          setupdi_or_raw_hid=any(x in all_api for x in ['setupdi','hid.dll','winusb','libusb'])

          boot_words=any(x in strings for x in ['bootloader','boot loader','recovery','pc_upgrade','start_up_grate','flash_boot_en'])
          forbidden_words=any(x in strings for x in [
              'chiperas','codedata','bootdat','constdat','cnfgdat','btupdat','upinfo','cxxx'
          ])

          # Existing project evidence established this EXE's active path as UFE WriteActuator/ReadActuator.
          # R88 only closes whether another hidden boot/recovery host transport is statically evident.
          dec={
              'SHA_PIN_MATCH':True,
              'PE_TRANSPORT_IMPORT_COUNT':len(pe['transport_imports']),
              'DOTNET_METADATA_PARSE_OK':dn.get('parse_ok',False),
              'EXACT_HID_FEATURE_API_EVIDENCE':exact_hid_feature,
              'SETUPDI_RAW_HID_WINUSB_API_EVIDENCE':setupdi_or_raw_hid,
              'BOOT_RECOVERY_CONTROL_WORD_EVIDENCE':boot_words,
              'FORBIDDEN_FLASH_COMMAND_STRING_EVIDENCE':forbidden_words,
              'AA55_BYTE_PATTERN_COUNT':census['AA55_BYTES']['count'],
              '55AA_BYTE_PATTERN_COUNT':census['55AA_BYTES']['count'],
              'RUNTIME_VID_PID_CONTIG_PATTERN_COUNT':census['RUNTIME_VID_PID_LE_CONTIG']['count'],
              'HIDDEN_OFFICIAL_CLIENT_BOOT_ENTRY_PROVEN':False,
              'HIDDEN_OFFICIAL_CLIENT_RECOVERY_TRANSPORT_PROVEN':False,
              'BP1048P4_PHONE_DIRECT_RECOVERY_IDENTITY_PROVEN':False,
              'READ_ONLY_PHONE_DIRECT_BACKUP_PROVEN':False,
              'LIVE_BOARD_TEST_ALLOWED_FROM_R88':False,
              'FLASH_ALLOWED':False,
          }
          p.joinpath('R88_DECISION.json').write_text(json.dumps(dec,indent=2)+'\n')
          print(json.dumps(dec,indent=2))

          lines=[
              '# R88 official GoloPine Windows client boot/recovery closure',
              '',
              'OFFLINE/STATIC ONLY. Official EXE was not executed. No board/USB access. FLASH_ALLOWED=NO.',
              '',
              '## Decision',
              '```json',json.dumps(dec,indent=2),'```','',
              '## Exact high-value string hits',
          ]
          priority=[
              'hidd_','winusb','setupdi','usbmanager','usbdeviceconnection',
              'bootloader','recovery','pc_upgrade','start_up_grate','flash_boot_en',
              'bp1048p4','writeactuator','readactuator','ufe',
              'chiperas','codedata','bootdat','constdat','cnfgdat','btupdat','upinfo','cxxx'
          ]
          n=0
          for h in hits:
              low=h['text'].lower()
              if any(x in low for x in priority):
                  lines.append(
                      f"- +0x{h['offset']:X} [{h['encoding']}] terms={h['terms']} :: `{h['text'][:600]}`"
                  )
                  n+=1
                  if n>=500: break

          lines += [
              '',
              '## Gate',
              '- String/byte hits alone are not accepted as a boot-entry protocol.',
              '- R88 does not execute the official client and sends no USB/control transfer.',
              '- Existing UFE runtime-tuning evidence is preserved; this workflow only checks for an additional hidden boot/recovery surface.',
              '- No R79 autorun and no repeated AA55 live test.',
              '- FLASH_ALLOWED=NO.',
          ]
          p.joinpath('R88_REPORT.md').write_text('\n'.join(lines)+'\n')
          PY
          sed -n '1,620p' /tmp/r88/evidence/R88_REPORT.md

      - name: Package evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/R88_SAFETY.txt /tmp/r88/evidence/ || true
          (cd /tmp/r88/evidence && zip -9 -r /tmp/R88_BP1048P4_OFFICIAL_GOLOPINE_WINDOWS_BOOT_RECOVERY_CLOSURE_EVIDENCE.zip .)
          sha256sum /tmp/R88_BP1048P4_OFFICIAL_GOLOPINE_WINDOWS_BOOT_RECOVERY_CLOSURE_EVIDENCE.zip \
            > /tmp/R88_BP1048P4_OFFICIAL_GOLOPINE_WINDOWS_BOOT_RECOVERY_CLOSURE_EVIDENCE.zip.sha256

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R88-BP1048P4-OFFICIAL-GOLOPINE-WINDOWS-BOOT-RECOVERY-CLOSURE-EVIDENCE
          path: |
            /tmp/R88_BP1048P4_OFFICIAL_GOLOPINE_WINDOWS_BOOT_RECOVERY_CLOSURE_EVIDENCE.zip
            /tmp/R88_BP1048P4_OFFICIAL_GOLOPINE_WINDOWS_BOOT_RECOVERY_CLOSURE_EVIDENCE.zip.sha256
          if-no-files-found: error
