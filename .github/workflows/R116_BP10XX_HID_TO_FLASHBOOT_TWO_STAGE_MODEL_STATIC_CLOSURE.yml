      - name: Record public-document facts already verified from source pages
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r116/evidence/R116_PUBLIC_DOC_FACTS.json <<'EOF'
          {
            "sources": [
              {
                "name": "MV_AP82xx_BP10xx_PCTools upgrade tool manual v0.0.8",
                "url": "https://www.scribd.com/document/990877502/",
                "facts": [
                  "Tool is for PC and communicates with the device through USB.",
                  "It upgrades MCU code from .MVA files.",
                  "The manual describes flashboot and states USB resets/reconnects after flashboot jumps.",
                  "Release note names the base tool MV_AP82xx_BP10xx_PC_Tools_V2.2.",
                  "V2.2.1 says Flashboot debugging was OK.",
                  "V2.2.8 adds SN read QR/barcode and ASCII custom-data sending."
                ]
              },
              {
                "name": "Firmware and user application communication protocol V3.15.1",
                "url": "https://www.scribd.com/document/1013263124/",
                "facts": [
                  "Generic protocol supports UART, IIC and USB; USB uses HID.",
                  "UART and USB follow the same A5 5A ... 16 framing.",
                  "Control 0x11 is a PCTools-specific programming-related control.",
                  "0x11 length 0x00 is documented as a firmware-version query.",
                  "0x11 also defines a custom programming write carrying Index, Offset, DataLength and Data.",
                  "Section 5.24 labels 0xFE firmware upgrade but explicitly says it is supported only by DU series."
                ]
              }
            ]
          }
          EOF

      - name: Verify R26 flashboot evidence markers
        shell: bash
        run: |
          set -euo pipefail
          R=/tmp/r116/evidence/R26_SOURCE_REPORT.md
          grep -F 'USB Mass Storage BOT' "$R"
          grep -F 'CBW signature `0x43425355`' "$R"
          grep -F '`chiperas`' "$R"
          grep -F '`upinfo`' "$R"
          grep -F '`btupdat`' "$R"
          grep -F '`cnfgdat`' "$R"
          grep -F '`constdat`' "$R"
          grep -F '`codedata`' "$R"
          grep -F '`bootdat`' "$R"
          grep -F '`cxxx`' "$R"
          grep -F '`0x55/0xAA -> GET_REPORT -> start_up_grate -> jump 0`' "$R"
          grep -F 'Safe live identity/version command: **NOT PROVEN**' "$R"

      - name: Build two-stage transport correlation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re,hashlib

          ev=Path("/tmp/r116/evidence")
          r26=(ev/"R26_SOURCE_REPORT.md").read_text(encoding="utf-8")
          pub=json.loads((ev/"R116_PUBLIC_DOC_FACTS.json").read_text())

          r26_sha=hashlib.sha256((ev/"R26_SOURCE_REPORT.md").read_bytes()).hexdigest()

          d={
            "R26_SHA256":r26_sha,
            "PUBLIC_BPXX_RUNTIME_USB_TRANSPORT":"HID",
            "PUBLIC_BPXX_RUNTIME_FRAME":"A5 5A + control + length + data + 16",
            "PCTOOLS_CONTROL_0X11_VERSION_QUERY_DOCUMENTED":True,
            "PCTOOLS_CONTROL_0X11_ALSO_HAS_PROGRAMMING_WRITE":True,
            "CONTROL_0X11_SAFE_FOR_PRODUCTION_LIVE_TEST":False,
            "CONTROL_0XFE_FIRMWARE_UPGRADE_DOCUMENTED":True,
            "CONTROL_0XFE_SCOPE_IN_V3_15_1":"DU_SERIES_ONLY",
            "CONTROL_0XFE_IS_BP10XX_BOOTSTRAP_CANDIDATE":False,
            "PCTOOLS_MANUAL_USES_MVA_OVER_USB":True,
            "PCTOOLS_MANUAL_MENTIONS_FLASHBOOT_USB_RESET":True,
            "REFERENCE_FLASHBOOT_POST_JUMP_TRANSPORT":"USB_MSC_BOT_CUSTOM_CDB",
            "REFERENCE_FLASHBOOT_HAS_USBC_CBW_EVIDENCE":True,
            "REFERENCE_FLASHBOOT_COMMANDS":[
              "chiperas","upinfo","btupdat","cnfgdat",
              "constdat","codedata","bootdat","cxxx"
            ],
            "REFERENCE_FLASHBOOT_COMMANDS_AUTHORIZED_FOR_PRODUCTION":False,
            "TWO_STAGE_MODEL":{
              "stage_1":"runtime/application firmware: USB HID generic/PCTools control protocol",
              "bridge":"UNKNOWN exact BP10xx production bootstrap/transition command",
              "stage_2":"flashboot: USB MSC BOT with custom vendor CDB command vocabulary"
            },
            "KEY_NEW_CONCLUSION":"0xFE must not be treated as the BP10xx bridge because V3.15.1 explicitly scopes 0xFE firmware upgrade to DU series. The missing BP10xx bridge remains unresolved.",
            "AA55_RETEST_REQUIRED":False,
            "PRODUCTION_FIRST_BOOTSTRAP_PROVEN":False,
            "PRODUCTION_RECOVERY_USB_IDENTITY_PROVEN":False,
            "SAFE_READ_ONLY_STOCK_BACKUP_PROVEN":False,
            "PRODUCTION_MVA_ACCEPTANCE_PROVEN":False,
            "ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD":False,
            "NEXT":"Acquire/reverse MV_AP82xx_BP10xx_PC_Tools V2.2.x or matching BP10xx SDK implementation offline to recover the exact runtime-HID to flashboot bridge. Focus on the 0x11 handler and transition code, but do not send 0x11 to the production board.",
            "FLASH_ALLOWED":False
          }

          (ev/"R116_TWO_STAGE_MODEL.json").write_text(
              json.dumps(d,indent=2,ensure_ascii=False)+"\n"
          )

          md=[
              "# R116 — BP10xx HID -> flashboot two-stage model",
              "",
              "## Result",
              "",
              "- Stage 1: runtime/application protocol is USB HID in the public BPxx protocol.",
              "- Stage 2: R26 reference flashboot is USB MSC BOT/custom CDB after jump-to-0.",
              "- The exact BP10xx bridge between those two stages is still missing.",
              "- Public protocol V3.15.1 does NOT make 0xFE a BP10xx upgrade path; section 5.24 scopes 0xFE to DU series only.",
              "- 0x11 is PCTools-specific and includes both a version query and programming write semantics, so production live probing remains blocked.",
              "- Do not repeat AA55 and do not transmit flashboot command vocabulary.",
              "",
              "## Next offline target",
              "",
              "Recover the exact BP10xx PCTools/runtime 0x11 handler and the code path that causes flashboot entry/re-enumeration.",
              "",
              "FLASH_ALLOWED=NO"
          ]
          (ev/"R116_REPORT_TH.md").write_text("\n".join(md)+"\n")
          print(json.dumps(d,indent=2,ensure_ascii=False))
          PY

      - name: Fail-closed consistency checks
        shell: bash
        run: |
          set -euo pipefail
          D=/tmp/r116/evidence/R116_TWO_STAGE_MODEL.json
          grep -F '"CONTROL_0XFE_SCOPE_IN_V3_15_1": "DU_SERIES_ONLY"' "$D"
          grep -F '"CONTROL_0XFE_IS_BP10XX_BOOTSTRAP_CANDIDATE": false' "$D"
          grep -F '"CONTROL_0X11_SAFE_FOR_PRODUCTION_LIVE_TEST": false' "$D"
          grep -F '"PRODUCTION_FIRST_BOOTSTRAP_PROVEN": false' "$D"
          grep -F '"FLASH_ALLOWED": false' "$D"

      - name: Package evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r116/evidence
          zip -9 -r /tmp/R116_BP10XX_TWO_STAGE_MODEL_EVIDENCE.zip .
          sha256sum /tmp/R116_BP10XX_TWO_STAGE_MODEL_EVIDENCE.zip             > /tmp/R116_BP10XX_TWO_STAGE_MODEL_EVIDENCE.zip.sha256

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: R116-BP10XX-TWO-STAGE-MODEL-EVIDENCE
          path: |
            /tmp/R116_BP10XX_TWO_STAGE_MODEL_EVIDENCE.zip
            /tmp/R116_BP10XX_TWO_STAGE_MODEL_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'R116_USB_DEVICE_ACCESS=NO' /tmp/r116/evidence/R116_SAFETY.txt
          grep -F 'R116_RUNTIME_0X11_SENT=NO' /tmp/r116/evidence/R116_SAFETY.txt
          grep -F 'R116_CONTROL_0XFE_SENT=NO' /tmp/r116/evidence/R116_SAFETY.txt
          grep -F 'R116_ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD=NO' /tmp/r116/evidence/R116_SAFETY.txt
          echo R116_STATIC_CLOSURE_COMPLETE=YES
          echo FLASH_ALLOWED=NO
