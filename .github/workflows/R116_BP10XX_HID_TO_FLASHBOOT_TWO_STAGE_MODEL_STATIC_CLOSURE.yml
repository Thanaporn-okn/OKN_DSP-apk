name: R116 BP10xx HID-to-flashboot two-stage model static closure

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R116_BP10XX_HID_TO_FLASHBOOT_TWO_STAGE_MODEL_STATIC_CLOSURE.yml"

permissions:
  contents: read

concurrency:
  group: r116-bp10xx-two-stage-${{ github.ref }}
  cancel-in-progress: true

env:
  FLASH_ALLOWED: "NO"
  R26_EXPECTED_SHA256: "7a0fd1b58f136cb1adb1978039a782dfc8161b3d1b3d362a03c91db164c0f80f"

jobs:
  static-closure:
    name: STATIC ONLY - correlate public BPxx protocol with R26 flashboot - no board
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r116/evidence
          cat > /tmp/r116/evidence/R116_SAFETY.txt <<'EOF'
          R116_MODE=STATIC_OFFLINE_CORRELATION_ONLY
          R116_USB_DEVICE_ACCESS=NO
          R116_BOARD_CONTACT=NO
          R116_AA55_SENT=NO
          R116_RUNTIME_0X11_SENT=NO
          R116_CONTROL_0XFE_SENT=NO
          R116_CHIPERAS_SENT=NO
          R116_UPINFO_SENT=NO
          R116_CXXX_SENT=NO
          R116_FLASH_READ_EXECUTED=NO
          R116_FLASH_ERASE_EXECUTED=NO
          R116_FLASH_WRITE_EXECUTED=NO
          R116_ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD=NO
          FINAL_REQUIRED_TRANSPORT=SAMSUNG_S25_PLUS_USB_C_DIRECT_TO_DSP_USB_C
          HARDWARE_MODIFICATION=FORBIDDEN
          FLASH_ALLOWED=NO
          EOF

