name: OKN BP1048P4 Flashboot Dispatcher Branch Map V6 - All In One

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: okn-bp1048p4-dispatcher-branch-map-v6-${{ github.ref }}
  cancel-in-progress: true

env:
  FLASH_ALLOWED: "NO"

jobs:
  branch_map:
    name: Map dispatcher branches to handlers - NO USB - NO FLASH
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          mkdir -p /tmp/v6/evidence
          cat > /tmp/v6/evidence/SAFETY.txt <<'EOF'
          MODE=OFFLINE_STATIC_DISPATCHER_BRANCH_MAPPING_ONLY
          TARGET=MVSilicon_BP1048P4
          USB_OR_BOARD_CONTACT=NO
          TARGET_FIRMWARE_EXECUTED=NO
          FEATURE_55_SENT=NO
          FEATURE_AA_SENT=NO
          FLASH_READ_EXECUTED=NO
          FLASH_ERASE_EXECUTED=NO
          FLASH_WRITE_EXECUTED=NO
          LIVE_BOOT_ENTRY_AUTHORIZED=NO
          LIVE_FLASH_AUTHORIZED=NO
          FLASH_ALLOWED=NO
          EOF

      - name: Checkout public BP1048 SDK
        uses: actions/checkout@v4
        with:
          repository: leadercxn/bp1048_sdk_v0.1.12
          ref: master
          path: bp1048-sdk
          fetch-depth: 1

      - name: Reconstruct exact image
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib,json,re,subprocess

          ROOT=Path("bp1048-sdk")
          OUT=Path("/tmp/v6/evidence")
          src=ROOT/"BT_Audio_APP/bt_audio_app_src/device/flash_boot.c"
          text=src.read_text(errors="replace")
          m=re.search(
              r"(?:static\s+|const\s+|unsigned\s+|signed\s+)*"
              r"(?:char|uint8_t|uint8|u8|BYTE)\s+flash_data\s*"
              r"\[\s*(?P<n>\d+)\s*\]\s*=\s*\{(?P<body>.*?)\};",
              text,re.I|re.S
          )
          assert m
          body=re.sub(r"/\*.*?\*/","",m.group("body"),flags=re.S)
          body=re.sub(r"//[^\r\n]*","",body)
          vals=[int(x,16) for x in re.findall(r"0[xX]([0-9A-Fa-f]{1,2})\b",body)]
          assert int(m.group("n"))==65536 and len(vals)==65520
          raw=bytes(vals)+bytes(65536-len(vals))
          (OUT/"flash_data_65536.bin").write_bytes(raw)
          meta={
              "commit":subprocess.check_output(
                  ["git","-C",str(ROOT),"rev-parse","HEAD"],text=True
              ).strip(),
              "sha256":hashlib.sha256(raw).hexdigest(),
              "runtime_gp":0x20026CB0,
              "runtime_base":0x2001A9A8,
              "USB_OR_BOARD_CONTACTED":False,
              "LIVE_FLASH_AUTHORIZED":False,
              "FLASH_ALLOWED":False
          }
          (OUT/"META.json").write_text(json.dumps(meta,indent=2)+"\n")
          PYCODE

      - name: Build GNU NDS32 objdump
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/v6/toolchain /tmp/v6/build
          cd /tmp/v6/toolchain
          URL="https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz"
          if curl -fL --retry 3 --connect-timeout 20 "$URL" -o binutils-2.44.tar.xz; then
            tar -xf binutils-2.44.tar.xz
            cd /tmp/v6/build
            if ../toolchain/binutils-2.44/configure \
                --target=nds32le-elf \
                --disable-nls --disable-werror --disable-gdb \
                --disable-gprofng --disable-gas --disable-ld --disable-gold \
                >/tmp/v6/evidence/NDS32_BUILD.log 2>&1 &&
               make -j2 all-binutils >>/tmp/v6/evidence/NDS32_BUILD.log 2>&1; then
              find /tmp/v6/build -type f -name '*objdump' -perm -111 -print \
                > /tmp/v6/evidence/OBJDUMP_CANDIDATES.txt
              echo BUILD_STATUS=SUCCESS > /tmp/v6/evidence/NDS32_BUILD_STATUS.txt
            else
              echo BUILD_STATUS=FAILED > /tmp/v6/evidence/NDS32_BUILD_STATUS.txt
            fi
          else
            echo BUILD_STATUS=DOWNLOAD_FAILED > /tmp/v6/evidence/NDS32_BUILD_STATUS.txt
          fi
          exit 0

      - name: Disassemble
        shell: bash
        run: |
          set -euo pipefail
          OBJDUMP="$(find /tmp/v6/build -type f -name '*objdump' -perm -111 | head -1 || true)"
          test -n "$OBJDUMP"
          "$OBJDUMP" -D -b binary -m nds32 --adjust-vma=0 \
            /tmp/v6/evidence/flash_data_65536.bin \
            > /tmp/v6/evidence/NDS32_DISASSEMBLY.txt \
            2>/tmp/v6/evidence/NDS32_DISASSEMBLY.stderr.txt

      - name: Recover dispatcher compare branches and handler regions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import collections,json,re

          OUT=Path("/tmp/v6/evidence")
          raw=(OUT/"flash_data_65536.bin").read_bytes()
          meta=json.loads((OUT/"META.json").read_text())
          BASE=meta["runtime_base"]
          GP=meta["runtime_gp"]
          dlines=(OUT/"NDS32_DISASSEMBLY.txt").read_text(errors="replace").splitlines()

          row_rx=re.compile(
              r"^\s*([0-9A-Fa-f]+):\s+(?:[0-9A-Fa-f]{2,8}\s+)+(.+?)\s*$"
          )
          ins=[]
          for line_no,line in enumerate(dlines,1):
              m=row_rx.match(line)
              if m:
                  ins.append({
                      "line":line_no,
                      "addr":int(m.group(1),16),
                      "text":m.group(2).strip(),
                      "raw":line,
                  })
          by_addr={x["addr"]:i for i,x in enumerate(ins)}

          # Exact strings.
          strings={}
          st=None
          for i,b in enumerate(raw+b"\x00"):
              if 32<=b<=126:
                  if st is None: st=i
              else:
                  if st is not None and i-st>=3:
                      strings[st]=raw[st:i].decode("ascii",errors="replace")
                  st=None

          names=["chiperas","upinfo","btupdat","cnfgdat","constdat","codedata","cxxx"]
          cmd_off={}
          for n in names:
              h=[o for o,s in strings.items() if s==n]
              assert len(h)==1,(n,h)
              cmd_off[n]=h[0]

          # Parse key instruction forms.
          addigp_rx=re.compile(
              r"\baddi\.gp\s+(\$[A-Za-z0-9]+)\s*,\s*#?"
              r"(-?0x[0-9A-Fa-f]+|-?\d+)",re.I
          )
          mov_rx=re.compile(
              r"\b(?:mov55|mov|movi55)\s+(\$[A-Za-z0-9]+)\s*,\s*(\$[A-Za-z0-9]+)\b",
              re.I
          )
          jal_rx=re.compile(r"\bjal\s+(?:0x)?([0-9A-Fa-f]+)\b",re.I)
          cond_rx=re.compile(
              r"\b(beq|bne|beqz|bnez|bgez|bltz|bgtz|blez)\b.*?"
              r"(?:0x)?([0-9A-Fa-f]+)\s*$",re.I
          )
          uncond_rx=re.compile(r"\bj\s+(?:0x)?([0-9A-Fa-f]+)\b",re.I)
          ret_rx=re.compile(r"\b(ret|ret5|jr\s+\$lp|pop25)\b",re.I)
          push_rx=re.compile(r"\b(push25|smw\.adm)\b",re.I)

          def pint(s):
              try: return int(s.replace("#",""),0)
              except: return None

          # Exact command-ref instructions using validated runtime mapping.
          refs=[]
          for idx,x in enumerate(ins):
              m=addigp_rx.search(x["text"])
              if not m: continue
              reg,imm_s=m.groups()
              imm=pint(imm_s)
              if imm is None: continue
              runtime=(GP+imm)&0xffffffff
              off=(runtime-BASE)&0xffffffff
              name=next((n for n,o in cmd_off.items() if o==off),None)
              if name:
                  refs.append({
                      "idx":idx,"addr":x["addr"],"reg":reg,
                      "imm":imm,"runtime":runtime,"file_offset":off,
                      "command":name,"text":x["text"]
                  })

          # Identify dispatcher window from the tight cluster of five refs around 4Cxx.
          parser_refs=[r for r in refs if 0x4B00<=r["addr"]<=0x4F80]
          assert len(parser_refs)>=5,parser_refs
          parser_lo=max(0,min(r["addr"] for r in parser_refs)-0x100)
          parser_hi=min(len(raw)-1,max(r["addr"] for r in parser_refs)+0x400)

          # Save complete parser disassembly.
          parser_rows=[x for x in ins if parser_lo<=x["addr"]<=parser_hi]
          (OUT/"DISPATCHER_4BXX_50XX.asm").write_text(
              "\n".join(x["raw"] for x in parser_rows)+"\n"
          )

          # List every call and conditional branch in parser region.
          parser_cf=[]
          for x in parser_rows:
              jm=jal_rx.search(x["text"])
              cm=cond_rx.search(x["text"])
              um=uncond_rx.search(x["text"])
              if jm:
                  parser_cf.append({
                      "addr":x["addr"],"kind":"jal",
                      "target":int(jm.group(1),16),"text":x["text"]
                  })
              elif cm:
                  parser_cf.append({
                      "addr":x["addr"],"kind":cm.group(1).lower(),
                      "target":int(cm.group(2),16),"text":x["text"]
                  })
              elif um:
                  parser_cf.append({
                      "addr":x["addr"],"kind":"j",
                      "target":int(um.group(1),16),"text":x["text"]
                  })

          # Candidate compare helper = direct JAL target called repeatedly in the
          # parser cluster.  This avoids naming it strcmp prematurely.
          call_counts=collections.Counter(
              x["target"] for x in parser_cf if x["kind"]=="jal"
          )
          repeated_helpers=[
              {"target":t,"count":c}
              for t,c in call_counts.most_common() if c>=2
          ]

          # For each compare-helper call, collect nearest preceding exact command
          # ref and the immediate following conditional branch.
          compare_sites=[]
          for helper in repeated_helpers:
              target=helper["target"]
              for x in parser_cf:
                  if x["kind"]!="jal" or x["target"]!=target:
                      continue
                  addr=x["addr"]
                  prior=[
                      r for r in parser_refs
                      if 0 <= addr-r["addr"] <= 0x100
                  ]
                  prior.sort(key=lambda r:addr-r["addr"])
                  nearest=prior[0] if prior else None

                  # First conditional branch within next 6 parsed instructions.
                  idx=by_addr.get(addr)
                  branch=None
                  if idx is not None:
                      for y in ins[idx+1:idx+7]:
                          cm=cond_rx.search(y["text"])
                          if cm:
                              branch={
                                  "addr":y["addr"],
                                  "kind":cm.group(1).lower(),
                                  "target":int(cm.group(2),16),
                                  "text":y["text"]
                              }
                              break
                  compare_sites.append({
                      "helper_target":target,
                      "call_addr":addr,
                      "nearest_command":nearest,
                      "following_branch":branch
                  })

          # Handler-focused anchors from validated xrefs outside parser:
          # upinfo 0x556A, chiperas 0x5730, plus cxxx diagnostic region.
          anchors=[]
          for r in refs:
              if r["addr"]>=0x5000:
                  anchors.append({
                      "label":r["command"],
                      "addr":r["addr"],
                      "source":"exact_command_xref"
                  })

          # cxxx diagnostic string xref from V5: recover independently.
          diag_terms=["cmd_cxxx :","cmd_cxxx ACK"]
          for off,s in strings.items():
              if any(t.lower() in s.lower() for t in diag_terms):
                  runtime=BASE+off
                  # Search addi.gp resolving exactly to this string.
                  for idx,x in enumerate(ins):
                      m=addigp_rx.search(x["text"])
                      if not m: continue
                      imm=pint(m.group(2))
                      if imm is None: continue
                      if ((GP+imm)&0xffffffff)==runtime:
                          anchors.append({
                              "label":"cxxx_diag",
                              "addr":x["addr"],
                              "source":s
                          })

          # Estimate local function region around each anchor using nearest prologue
          # before and return-like instruction after. Keep the raw region and direct
          # calls; do not merge with dispatcher just because of call graph reachability.
          handler_regions=[]
          for a in anchors:
              idx=by_addr.get(a["addr"])
              if idx is None: continue
              lo_idx=max(0,idx-180)
              hi_idx=min(len(ins),idx+220)

              starts=[
                  k for k in range(lo_idx,idx+1)
                  if push_rx.search(ins[k]["text"])
              ]
              start_i=starts[-1] if starts else max(lo_idx,idx-60)

              ends=[
                  k for k in range(idx,min(hi_idx,idx+180))
                  if ret_rx.search(ins[k]["text"])
              ]
              end_i=ends[0] if ends else min(hi_idx-1,idx+80)

              rows=ins[start_i:end_i+1]
              calls=[]
              branches=[]
              for y in rows:
                  jm=jal_rx.search(y["text"])
                  if jm:
                      calls.append({
                          "addr":y["addr"],
                          "target":int(jm.group(1),16),
                          "text":y["text"]
                      })
                  cm=cond_rx.search(y["text"])
                  if cm:
                      branches.append({
                          "addr":y["addr"],
                          "kind":cm.group(1).lower(),
                          "target":int(cm.group(2),16),
                          "text":y["text"]
                      })

              region={
                  **a,
                  "estimated_start":rows[0]["addr"] if rows else a["addr"],
                  "estimated_end":rows[-1]["addr"] if rows else a["addr"],
                  "calls":calls,
                  "branches":branches,
              }
              handler_regions.append(region)

              safe=re.sub(r"[^A-Za-z0-9_.-]+","_",a["label"])
              (OUT/f"HANDLER_{safe}_{a['addr']:04X}.asm").write_text(
                  "\n".join(y["raw"] for y in rows)+"\n"
              )

          # Destructive diagnostic xrefs under exact mapping.
          destructive_terms=[
              "UPGRADE:Flash data command,prepare to unlock & chip erase all",
              "pc upgrata code","pc upgrata const","pc upgrata config"
          ]
          destructive_xrefs=[]
          for off,s in strings.items():
              if not any(t.lower() in s.lower() for t in destructive_terms):
                  continue
              runtime=BASE+off
              for idx,x in enumerate(ins):
                  m=addigp_rx.search(x["text"])
                  if not m: continue
                  imm=pint(m.group(2))
                  if imm is None: continue
                  if ((GP+imm)&0xffffffff)==runtime:
                      destructive_xrefs.append({
                          "addr":x["addr"],"string_offset":off,
                          "string":s,"text":x["text"]
                      })

          # Check only direct JALs inside each isolated handler region against
          # exact destructive-xref neighborhoods (+/-0x100), not against the
          # shared dispatcher function.
          dangerous_neighborhoods=[]
          for d in destructive_xrefs:
              dangerous_neighborhoods.append((max(0,d["addr"]-0x100),d["addr"]+0x100))

          for h in handler_regions:
              h["direct_call_enters_destructive_neighborhood"]=False
              h["matching_dangerous_calls"]=[]
              for c in h["calls"]:
                  if any(lo<=c["target"]<=hi for lo,hi in dangerous_neighborhoods):
                      h["direct_call_enters_destructive_neighborhood"]=True
                      h["matching_dangerous_calls"].append(c)

          result={
              "revision":"DISPATCHER_BRANCH_MAP_V6",
              "runtime_gp":GP,
              "runtime_base":BASE,
              "command_refs":refs,
              "parser_window":[parser_lo,parser_hi],
              "parser_control_flow":parser_cf,
              "repeated_call_helpers":repeated_helpers,
              "compare_sites":compare_sites,
              "handler_anchors":anchors,
              "handler_regions":handler_regions,
              "destructive_string_xrefs":destructive_xrefs,
              "USB_OR_BOARD_CONTACTED":False,
              "LIVE_FLASH_AUTHORIZED":False,
              "FLASH_ALLOWED":False
          }
          (OUT/"DISPATCHER_BRANCH_MAP.json").write_text(
              json.dumps(result,indent=2,ensure_ascii=False)+"\n"
          )

          md=[
              "# BP1048P4 Dispatcher Branch Map V6",
              "",
              f"64 KiB SHA256: `{meta['sha256']}`",
              f"runtime `$gp`: `0x{GP:08X}`",
              f"runtime image base: `0x{BASE:08X}`",
              "",
              "## Parser-region exact command references",
          ]
          for r in parser_refs:
              md.append(
                  f"- `0x{r['addr']:04X}` **{r['command']}** "
                  f"via `{r['text']}`"
              )

          md+=["","## Repeated direct-call helpers in parser region"]
          for h in repeated_helpers[:20]:
              md.append(f"- `0x{h['target']:04X}` called **{h['count']}** times")
          if not repeated_helpers:
              md.append("- none")

          md+=["","## Compare/branch candidates"]
          for s in compare_sites[:120]:
              n=s["nearest_command"]
              b=s["following_branch"]
              cmd=n["command"] if n else "unknown"
              dist=(s["call_addr"]-n["addr"]) if n else None
              btxt=(f"`0x{b['addr']:04X}` `{b['text']}` → `0x{b['target']:04X}`"
                    if b else "no immediate conditional branch")
              md.append(
                  f"- helper `0x{s['helper_target']:04X}` call `0x{s['call_addr']:04X}`; "
                  f"nearest command **{cmd}**"
                  + (f" ({dist} bytes earlier)" if dist is not None else "")
                  + f"; {btxt}"
              )

          md+=["","## Isolated handler candidates"]
          for h in handler_regions:
              calls=", ".join(
                  f"`0x{c['addr']:04X}→0x{c['target']:04X}`" for c in h["calls"][:16]
              ) or "none"
              md.append(
                  f"- **{h['label']}** anchor `0x{h['addr']:04X}`, "
                  f"estimated region `0x{h['estimated_start']:04X}–0x{h['estimated_end']:04X}`; "
                  f"direct calls: {calls}"
              )

          md+=["","## Exact destructive diagnostic xrefs"]
          if destructive_xrefs:
              for d in destructive_xrefs:
                  md.append(
                      f"- code `0x{d['addr']:04X}` → `{d['string']}`"
                  )
          else:
              md.append("- none recovered")

          md+=["","## Handler-local destructive-path check"]
          for h in handler_regions:
              if h["direct_call_enters_destructive_neighborhood"]:
                  md.append(
                      f"- **{h['label']}**: direct call enters an exact destructive-xref neighborhood"
                  )
              else:
                  md.append(
                      f"- **{h['label']}**: no direct call into an exact destructive-xref neighborhood "
                      f"within the isolated estimated region"
                  )

          md+=["","## Decision"]
          md.append("- V5's `upinfo → destructive` result is not treated as command-specific evidence because V5 merged the shared parser/dispatcher region with the later upinfo xref.")
          md.append("- V6 separates the shared parser from later handler candidates and reports only handler-local direct-call evidence.")
          md.append("- Absence of a direct dangerous call is still not proof that a command is safe; indirect calls, callbacks and framing remain unresolved.")
          md.append("- No command is authorized for the production board yet.")
          md.append("- USB/board contacted: **NO**")
          md.append("- Flash read/erase/write: **NO**")
          md.append("- `FLASH_ALLOWED=NO`")

          (OUT/"DISPATCHER_BRANCH_MAP_SUMMARY.md").write_text("\n".join(md)+"\n")
          PYCODE

      - name: Publish summary
        shell: bash
        run: |
          set -euo pipefail
          cat /tmp/v6/evidence/DISPATCHER_BRANCH_MAP_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Package evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v6/evidence
          zip -9 -r /tmp/OKN_BP1048P4_DISPATCHER_BRANCH_MAP_V6_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/OKN_BP1048P4_DISPATCHER_BRANCH_MAP_V6_EVIDENCE.zip \
            > /tmp/OKN_BP1048P4_DISPATCHER_BRANCH_MAP_V6_EVIDENCE.zip.sha256

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: OKN-BP1048P4-DISPATCHER-BRANCH-MAP-V6-EVIDENCE
          path: |
            /tmp/OKN_BP1048P4_DISPATCHER_BRANCH_MAP_V6_EVIDENCE.zip
            /tmp/OKN_BP1048P4_DISPATCHER_BRANCH_MAP_V6_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/v6/evidence/DISPATCHER_BRANCH_MAP.json"))
          assert d["runtime_gp"] == 0x20026CB0
          assert d["runtime_base"] == 0x2001A9A8
          assert d["USB_OR_BOARD_CONTACTED"] is False
          assert d["LIVE_FLASH_AUTHORIZED"] is False
          assert d["FLASH_ALLOWED"] is False
          print("DISPATCHER_BRANCH_MAP_V6_GATE=PASS")
          PY
          echo FLASH_ALLOWED=NO
