          private fun calculateDesign(d: Driver, boxName: String, count: Int, targetHz: Double, thickness: Int): DesignResult {
              val totalVas = d.vasL * count
              val qtc = 0.707
              val sealedNet = (totalVas / ((qtc / d.qts).pow(2.0) - 1.0)).let { if (it.isFinite()) it else d.vasL * .5 * count }.coerceAtLeast(d.vasL * .32 * count)
              val isSealed = boxName.contains("ปิด") || boxName.contains("Sealed")
              val isBand = boxName.contains("แบนพาส") || boxName.contains("ออร์เดอร์")
              val isHornLike = boxName.contains("W-bin") || boxName.contains("เทอร์โบ") || boxName.contains("เจบิน") || boxName.contains("ฟาด") || boxName.contains("บังเกอร์")
              val net = when {
                  isSealed -> sealedNet
                  isBand -> sealedNet * 1.75
                  isHornLike -> (d.vasL * .85 * count).coerceAtLeast(55.0 * count)
                  else -> (15.0 * totalVas * d.qts.pow(2.87)).coerceIn(d.vasL * .45 * count, d.vasL * 1.15 * count)
              }
              val fb = if (isSealed) 0.0 else targetHz
              val f3 = when {
                  isSealed -> d.fs * (qtc / d.qts)
                  isBand -> targetHz * .90
                  isHornLike -> targetHz * .95
                  else -> targetHz * .92
              }
              val spl = d.sensitivityDb + 10.0 * log10((d.rmsW * count).toDouble().coerceAtLeast(1.0))
              val driverDisp = d.sizeInch * .55 * count
              val brace = net * .05
              val portArea = if (isSealed) 0 else (d.sdCm2 * count * .17).toInt().coerceAtLeast(80)
              val portLength = if (isSealed) 0 else ((23562.5 * portArea / (targetHz.pow(2.0) * net)).coerceIn(12.0, 70.0) * 10).toInt()
              val portVolume = if (isSealed) 0.0 else (portArea * (portLength / 10.0)) / 1000.0
              val gross = net + driverDisp + brace + portVolume

              val ratioW = if (d.sizeInch >= 18) 1.55 else 1.42
              val ratioH = 1.0
              val ratioD = 1.12
              val mm3 = gross * 1_000_000.0
              val base = (mm3 / (ratioW * ratioH * ratioD)).pow(1.0 / 3.0)
              val innerW = base * ratioW
              val innerH = base * ratioH
              val innerD = base * ratioD
              val w = (innerW + 2 * thickness).toInt()
              val h = (innerH + 2 * thickness).toInt()
              val dep = (innerD + 2 * thickness).toInt()

              val cuts = mutableListOf(
                  CutItem("ด้านบน", "$w × $dep mm", 1),
                  CutItem("ด้านล่าง", "$w × $dep mm", 1),
                  CutItem("ด้านหน้า", "$w × ${h - 2 * thickness} mm", 1),
                  CutItem("ด้านหลัง", "$w × ${h - 2 * thickness} mm", 1),
                  CutItem("ด้านซ้าย", "${h - 2 * thickness} × ${dep - 2 * thickness} mm", 1),
                  CutItem("ด้านขวา", "${h - 2 * thickness} × ${dep - 2 * thickness} mm", 1)
              )
              if (!isSealed) cuts += CutItem("แผ่นพอร์ต", "${(portArea / 10).coerceAtLeast(8) * 10} × $portLength mm", 1)
              cuts += CutItem("ค้ำตู้", "ปรับตามตำแหน่งดอก/พอร์ต", 2)

              val panelArea = (2.0 * w * dep + 2.0 * w * h + 2.0 * h * dep) / 1_000_000.0
              val sheetArea = 1.22 * 2.44
              val sheetCount = ceil(panelArea / sheetArea * 1.15).toInt().coerceAtLeast(1)

              return DesignResult(
                  netL = round(net * 10) / 10,
                  grossL = round(gross * 10) / 10,
                  fbHz = round(fb * 10) / 10,
                  f3Hz = round(f3 * 10) / 10,
                  splDb = round(spl * 10) / 10,
                  widthMm = w,
                  heightMm = h,
                  depthMm = dep,
                  portAreaCm2 = portArea,
                  portLengthMm = portLength,
                  sheetCount = sheetCount,
                  cutList = cuts
              )
          }

