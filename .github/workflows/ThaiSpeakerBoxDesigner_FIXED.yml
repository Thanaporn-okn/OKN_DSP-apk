          @Composable
          fun ResponseGraph(r: DesignResult) {
              Canvas(
                  Modifier.fillMaxWidth().height(240.dp).background(Color(0xFF080E14), RoundedCornerShape(12.dp)).padding(12.dp)
              ) {
                  val grid = Color.White.copy(alpha = .09f)
                  repeat(7) { i ->
                      val y = size.height * i / 6f
                      drawLine(grid, Offset(0f, y), Offset(size.width, y), 1f)
                  }
                  repeat(10) { i ->
                      val x = size.width * i / 9f
                      drawLine(grid, Offset(x, 0f), Offset(x, size.height), 1f)
                  }
                  fun curve(color: Color, shift: Float, height: Float) {
                      val p = Path()
                      p.moveTo(0f, size.height * .90f)
                      p.cubicTo(size.width * .12f, size.height * (.78f - shift), size.width * .20f, size.height * (.20f + shift), size.width * .37f, size.height * height)
                      p.cubicTo(size.width * .58f, size.height * (height - .03f), size.width * .78f, size.height * (height + .03f), size.width, size.height * (height + .05f))
                      drawPath(p, color, style = Stroke(width = 4f, cap = StrokeCap.Round))
                  }
                  curve(Color(0xFF1AB7FF), 0f, .22f)
                  curve(Color(0xFFFF4569), .03f, .24f)
                  curve(Color(0xFF4BE08C), -.02f, .27f)
                  val kneeX = ((r.f3Hz - 20.0) / 180.0).coerceIn(.08, .75).toFloat() * size.width
                  drawLine(Color(0xFFFFD15A), Offset(kneeX, 0f), Offset(kneeX, size.height), 2f)
              }
          }

