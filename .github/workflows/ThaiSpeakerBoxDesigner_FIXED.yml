      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle :app:assembleDebug --stacktrace

      - name: Copy APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/ThaiSpeakerBoxDesigner-v0.2-first-ui-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ThaiSpeakerBoxDesigner-v0.2-first-ui-debug
          path: out/ThaiSpeakerBoxDesigner-v0.2-first-ui-debug.apk
          if-no-files-found: error
          retention-days: 14
