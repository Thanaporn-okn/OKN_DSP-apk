          @Composable
          fun Cabinet3D(r: DesignResult, modifier: Modifier) {
              Canvas(modifier.padding(15.dp)) {
                  val x = size.width * .12f
                  val y = size.height * .20f
                  val w = size.width * .63f
                  val h = size.height * .58f
                  val dx = size.width * .14f
                  val dy = -size.height * .12f
                  val front = Path().apply {
                      moveTo(x, y); lineTo(x + w, y); lineTo(x + w, y + h); lineTo(x, y + h); close()
                  }
                  val side = Path().apply {
                      moveTo(x + w, y); lineTo(x + w + dx, y + dy); lineTo(x + w + dx, y + h + dy); lineTo(x + w, y + h); close()
                  }
                  val top = Path().apply {
                      moveTo(x, y); lineTo(x + dx, y + dy); lineTo(x + w + dx, y + dy); lineTo(x + w, y); close()
                  }
                  drawPath(front, Color(0xFFC9935B))
                  drawPath(side, Color(0xFF9A693F))
                  drawPath(top, Color(0xFFE0AE73))
                  val c = Offset(x + w * .48f, y + h * .51f)
                  val rr = h * .31f
                  drawCircle(Color(0xFF090B0E), rr, c)
                  drawCircle(Color(0xFF34414B), rr * .83f, c, style = Stroke(width = 6f))
                  drawCircle(Color(0xFF111820), rr * .56f, c)
                  drawLine(Color.White.copy(alpha = .75f), Offset(x, y + h + 16f), Offset(x + w, y + h + 16f), 2f)
                  drawLine(Color.White.copy(alpha = .75f), Offset(x - 15f, y), Offset(x - 15f, y + h), 2f)
              }
          }

