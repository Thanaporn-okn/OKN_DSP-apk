name: Build Thai Speaker Box Designer - First Mock UI

'on':
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf app settings.gradle.kts build.gradle.kts gradle.properties
          mkdir -p app/src/main/java/com/okn/speakerbox
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ThaiSpeakerBoxDesigner"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.okn.speakerbox"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.okn.speakerbox"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 2
                  versionName = "0.2.0-first-mock-ui"
              }

              buildFeatures { compose = true }

              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="Speaker Box Designer TH"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.SpeakerBox">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.SpeakerBox" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#05080D</item>
                  <item name="android:navigationBarColor">#05080D</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/okn/speakerbox/MainActivity.kt <<'EOF'
          package com.okn.speakerbox

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.LazyListScope
          import androidx.compose.foundation.lazy.LazyRow
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.rounded.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.geometry.Rect
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.Path
          import androidx.compose.ui.graphics.StrokeCap
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlin.math.ceil
          import kotlin.math.log10
          import kotlin.math.pow
          import kotlin.math.round

          data class Driver(
              val brand: String,
              val model: String,
              val sizeInch: Int,
              val ohm: Int,
              val rmsW: Int,
              val maxW: Int,
              val fs: Double,
              val qts: Double,
              val qes: Double,
              val vasL: Double,
              val sdCm2: Double,
              val xmaxMm: Double,
              val re: Double,
              val sensitivityDb: Double,
              val use: String
          )

          data class DesignResult(
              val netL: Double,
              val grossL: Double,
              val fbHz: Double,
              val f3Hz: Double,
              val splDb: Double,
              val widthMm: Int,
              val heightMm: Int,
              val depthMm: Int,
              val portAreaCm2: Int,
              val portLengthMm: Int,
              val sheetCount: Int,
              val cutList: List<CutItem>
          )

          data class CutItem(val part: String, val size: String, val qty: Int)

          enum class Screen {
              HOME, MODE, LIBRARY, DETAIL, DESIGN, RESULT, CUT, GRAPH, COMPARE, PROJECTS, MORE
          }

          private val drivers = listOf(
              Driver("P.Audio", "C18-650EL V4", 18, 8, 650, 1300, 34.0, 0.36, 0.38, 220.0, 1210.0, 8.0, 5.8, 96.0, "รถยนต์ / PA"),
              Driver("KANE", "LV-1580", 15, 8, 800, 1600, 32.0, 0.38, 0.41, 180.0, 855.0, 8.5, 5.6, 97.0, "รถยนต์ / PA"),
              Driver("Audio Device", "AD-1200S", 12, 4, 1200, 2400, 35.0, 0.41, 0.44, 85.0, 530.0, 10.0, 3.2, 95.0, "รถยนต์"),
              Driver("NPE", "LS-10M", 10, 8, 300, 600, 55.0, 0.47, 0.51, 32.0, 330.0, 4.0, 5.9, 94.0, "Midbass"),
              Driver("OBOM", "OB-654", 6, 4, 200, 400, 68.0, 0.52, 0.56, 12.0, 145.0, 3.0, 3.1, 92.0, "รถยนต์"),
              Driver("P.Audio", "BM-400", 4, 8, 100, 200, 82.0, 0.58, 0.62, 4.8, 78.0, 2.0, 6.1, 91.0, "Midrange")
          )

          private val enclosureNames = listOf(
              "ปิด (Sealed)", "เปิด (Bass Reflex)", "แบนพาส", "ตู้ฟาด",
              "บังเกอร์", "เจบิน", "เทอร์โบ", "W-bin", "ออร์เดอร์ 6"
          )

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { AppTheme { SpeakerDesignerApp() } }
              }
          }

          @Composable
          fun AppTheme(content: @Composable () -> Unit) {
              MaterialTheme(
                  colorScheme = darkColorScheme(
                      primary = Color(0xFF21B5FF),
                      secondary = Color(0xFF8259FF),
                      tertiary = Color(0xFF00E4C7),
                      background = Color(0xFF05080D),
                      surface = Color(0xFF0B121A),
                      surfaceVariant = Color(0xFF141E29),
                      onBackground = Color.White,
                      onSurface = Color.White,
                      onSurfaceVariant = Color(0xFFC5D1DD)
                  ),
                  content = content
              )
          }

          @Composable
          fun SpeakerDesignerApp() {
              var screen by remember { mutableStateOf(Screen.HOME) }
              var category by remember { mutableStateOf("รถยนต์") }
              var selected by remember { mutableStateOf(drivers.first()) }
              var selectedBox by remember { mutableStateOf("เปิด (Bass Reflex)") }
              var result by remember { mutableStateOf<DesignResult?>(null) }
              var lastCount by remember { mutableIntStateOf(1) }
              var lastTarget by remember { mutableDoubleStateOf(38.0) }
              var lastThickness by remember { mutableIntStateOf(18) }

              fun goBottom(index: Int) {
                  screen = when (index) {
                      0 -> Screen.HOME
                      1 -> Screen.LIBRARY
                      2 -> Screen.DESIGN
                      3 -> Screen.PROJECTS
                      else -> Screen.MORE
                  }
              }

              val bottomIndex = when (screen) {
                  Screen.HOME, Screen.MODE -> 0
                  Screen.LIBRARY, Screen.DETAIL, Screen.COMPARE -> 1
                  Screen.DESIGN, Screen.RESULT, Screen.CUT, Screen.GRAPH -> 2
                  Screen.PROJECTS -> 3
                  Screen.MORE -> 4
              }

              Scaffold(
                  containerColor = Color(0xFF05080D),
                  bottomBar = {
                      NavigationBar(containerColor = Color(0xFF081018), tonalElevation = 0.dp) {
                          val nav = listOf(
                              Triple("หน้าแรก", Icons.Rounded.Home, 0),
                              Triple("ค้นหาดอก", Icons.Rounded.Search, 1),
                              Triple("คำนวณ", Icons.Rounded.Calculate, 2),
                              Triple("โปรเจค", Icons.Rounded.Folder, 3),
                              Triple("อื่นๆ", Icons.Rounded.MoreHoriz, 4)
                          )
                          nav.forEach { (label, icon, index) ->
                              NavigationBarItem(
                                  selected = bottomIndex == index,
                                  onClick = { goBottom(index) },
                                  icon = { Icon(icon, null) },
                                  label = { Text(label, fontSize = 10.sp) },
                                  colors = NavigationBarItemDefaults.colors(
                                      indicatorColor = Color(0xFF123650),
                                      selectedIconColor = Color(0xFF25B8FF),
                                      selectedTextColor = Color(0xFF25B8FF),
                                      unselectedIconColor = Color(0xFF8192A2),
                                      unselectedTextColor = Color(0xFF8192A2)
                                  )
                              )
                          }
                      }
                  }
              ) { padding ->
                  Box(Modifier.padding(padding)) {
                      when (screen) {
                          Screen.HOME -> HomeScreen(
                              onCar = { category = "รถยนต์"; screen = Screen.MODE },
                              onPa = { category = "PA"; screen = Screen.MODE },
                              onLibrary = { screen = Screen.LIBRARY },
                              onCompare = { screen = Screen.COMPARE }
                          )
                          Screen.MODE -> ModeScreen(
                              category = category,
                              onBack = { screen = Screen.HOME },
                              onEnclosure = { name ->
                                  selectedBox = name
                                  screen = Screen.LIBRARY
                              }
                          )
                          Screen.LIBRARY -> LibraryScreen(
                              category = category,
                              selected = selected,
                              onDetail = { selected = it; screen = Screen.DETAIL },
                              onSelect = { selected = it; screen = Screen.DESIGN },
                              onCompare = { screen = Screen.COMPARE }
                          )
                          Screen.DETAIL -> DetailScreen(
                              driver = selected,
                              onBack = { screen = Screen.LIBRARY },
                              onGraph = { screen = Screen.GRAPH },
                              onUse = { screen = Screen.DESIGN }
                          )
                          Screen.DESIGN -> DesignScreen(
                              category = category,
                              driver = selected,
                              initialBox = selectedBox,
                              onChooseDriver = { screen = Screen.LIBRARY },
                              onCalculated = { box, count, target, thickness, r ->
                                  selectedBox = box
                                  lastCount = count
                                  lastTarget = target
                                  lastThickness = thickness
                                  result = r
                                  screen = Screen.RESULT
                              }
                          )
                          Screen.RESULT -> ResultScreen(
                              driver = selected,
                              boxName = selectedBox,
                              count = lastCount,
                              result = result ?: calculateDesign(selected, selectedBox, lastCount, lastTarget, lastThickness),
                              onCut = { screen = Screen.CUT },
                              onGraph = { screen = Screen.GRAPH },
                              onBack = { screen = Screen.DESIGN }
                          )
                          Screen.CUT -> CutScreen(
                              result = result ?: calculateDesign(selected, selectedBox, lastCount, lastTarget, lastThickness),
                              thickness = lastThickness,
                              onBack = { screen = Screen.RESULT }
                          )
                          Screen.GRAPH -> GraphScreen(
                              driver = selected,
                              result = result ?: calculateDesign(selected, selectedBox, lastCount, lastTarget, lastThickness),
                              onBack = { screen = if (result == null) Screen.DETAIL else Screen.RESULT }
                          )
                          Screen.COMPARE -> CompareScreen(
                              onBack = { screen = Screen.LIBRARY },
                              onSelect = { selected = it; screen = Screen.DETAIL }
                          )
                          Screen.PROJECTS -> ProjectScreen(
                              driver = selected,
                              boxName = selectedBox,
                              result = result,
                              onOpen = { if (result != null) screen = Screen.RESULT else screen = Screen.DESIGN }
                          )
                          Screen.MORE -> MoreScreen()
                      }
                  }
              }
          }

          @Composable
          fun Page(content: LazyListScope.() -> Unit) {
              LazyColumn(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(
                          Brush.verticalGradient(
                              listOf(Color(0xFF07111C), Color(0xFF05080D), Color(0xFF05080D))
                          )
                      ),
                  contentPadding = PaddingValues(start = 14.dp, end = 14.dp, top = 10.dp, bottom = 18.dp),
                  verticalArrangement = Arrangement.spacedBy(11.dp),
                  content = content
              )
          }

          @Composable
          fun TopTitle(title: String, onBack: (() -> Unit)? = null, action: (@Composable () -> Unit)? = null) {
              Row(
                  Modifier.fillMaxWidth().padding(vertical = 4.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  if (onBack != null) {
                      IconButton(onClick = onBack) { Icon(Icons.Rounded.ArrowBack, null) }
                  }
                  Text(title, Modifier.weight(1f), fontSize = 23.sp, fontWeight = FontWeight.Bold)
                  if (action != null) action()
              }
          }

          @Composable
          fun DarkCard(
              modifier: Modifier = Modifier,
              padding: PaddingValues = PaddingValues(14.dp),
              content: @Composable ColumnScope.() -> Unit
          ) {
              Card(
                  modifier = modifier,
                  shape = RoundedCornerShape(20.dp),
                  colors = CardDefaults.cardColors(containerColor = Color(0xFF101923)),
                  border = androidx.compose.foundation.BorderStroke(1.dp, Color.White.copy(alpha = 0.04f))
              ) {
                  Column(Modifier.padding(padding), verticalArrangement = Arrangement.spacedBy(8.dp), content = content)
              }
          }

          @Composable
          fun SpeakerArt(modifier: Modifier = Modifier, accent: Color = Color(0xFF22B8FF)) {
              Canvas(modifier = modifier) {
                  val c = Offset(size.width / 2f, size.height / 2f)
                  val r = size.minDimension / 2f
                  drawCircle(Color(0xFF06090D), r, c)
                  drawCircle(Color(0xFF243747), r * .90f, c, style = Stroke(width = r * .09f))
                  drawCircle(Color(0xFF0C141C), r * .76f, c)
                  drawCircle(Color(0xFF182631), r * .64f, c, style = Stroke(width = r * .08f))
                  drawCircle(Color(0xFF05070A), r * .52f, c)
                  drawCircle(accent.copy(alpha = .40f), r * .43f, c, style = Stroke(width = r * .025f))
                  drawCircle(Color(0xFF17242E), r * .30f, c)
                  drawCircle(Color(0xFF070A0D), r * .16f, c)
              }
          }

          @Composable
          fun HomeScreen(onCar: () -> Unit, onPa: () -> Unit, onLibrary: () -> Unit, onCompare: () -> Unit) {
              Page {
                  item {
                      DarkCard(
                          modifier = Modifier.fillMaxWidth(),
                          padding = PaddingValues(0.dp)
                      ) {
                          Box(
                              Modifier
                                  .fillMaxWidth()
                                  .height(260.dp)
                                  .background(
                                      Brush.linearGradient(
                                          listOf(Color(0xFF00142B), Color(0xFF08101D), Color(0xFF270740))
                                      )
                                  )
                          ) {
                              SpeakerArt(
                                  Modifier.size(205.dp).align(Alignment.TopCenter).offset(y = 8.dp),
                                  accent = Color(0xFF2B9CFF)
                              )
                              Column(
                                  Modifier.align(Alignment.BottomStart).padding(20.dp)
                              ) {
                                  Text("ออกแบบตู้ลำโพง", fontSize = 30.sp, fontWeight = FontWeight.ExtraBold)
                                  Text("รถยนต์ & PA", fontSize = 22.sp, color = Color(0xFF27B9FF), fontWeight = FontWeight.Bold)
                                  Text("คำนวณ • ออกแบบ • ตัดไม้ • ครบในแอปเดียว", color = Color(0xFFD1DFEA), fontSize = 13.sp)
                              }
                          }
                      }
                  }

                  item {
                      HomeBigButton(
                          title = "ตู้ลำโพงรถยนต์",
                          subtitle = "ซับวูฟเฟอร์ • ประตู • หลังเบาะ",
                          icon = Icons.Rounded.DirectionsCar,
                          colors = listOf(Color(0xFF087FE8), Color(0xFF00B8FF)),
                          onClick = onCar
                      )
                  }
                  item {
                      HomeBigButton(
                          title = "ตู้ลำโพง PA",
                          subtitle = "เบส • กลาง • แหลม • ฮอร์น",
                          icon = Icons.Rounded.SpeakerGroup,
                          colors = listOf(Color(0xFF6334EF), Color(0xFFC329F1)),
                          onClick = onPa
                      )
                  }
                  item {
                      Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                          SmallAction("ฐานข้อมูลดอก", "ดอกลำโพงในไทย", Icons.Rounded.Storage, Modifier.weight(1f), onLibrary)
                          SmallAction("สูตรตู้ลำโพง", "รวมสูตรยอดนิยม", Icons.Rounded.ViewInAr, Modifier.weight(1f), onCompare)
                      }
                  }
              }
          }

          @Composable
          fun HomeBigButton(title: String, subtitle: String, icon: ImageVector, colors: List<Color>, onClick: () -> Unit) {
              Card(
                  Modifier.fillMaxWidth().clickable(onClick = onClick),
                  shape = RoundedCornerShape(20.dp),
                  colors = CardDefaults.cardColors(containerColor = Color.Transparent)
              ) {
                  Row(
                      Modifier.background(Brush.horizontalGradient(colors)).padding(18.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Surface(shape = CircleShape, color = Color.White.copy(alpha = .16f)) {
                          Icon(icon, null, Modifier.padding(14.dp).size(30.dp), Color.White)
                      }
                      Spacer(Modifier.width(14.dp))
                      Column(Modifier.weight(1f)) {
                          Text(title, fontWeight = FontWeight.Bold, fontSize = 20.sp)
                          Text(subtitle, color = Color.White.copy(alpha = .84f), fontSize = 12.sp)
                      }
                      Icon(Icons.Rounded.ChevronRight, null)
                  }
              }
          }

          @Composable
          fun SmallAction(title: String, subtitle: String, icon: ImageVector, modifier: Modifier, onClick: () -> Unit) {
              DarkCard(modifier.clickable(onClick = onClick)) {
                  Icon(icon, null, tint = Color(0xFF26B8FF), modifier = Modifier.size(28.dp))
                  Text(title, fontWeight = FontWeight.Bold)
                  Text(subtitle, color = Color(0xFF8FA4B8), fontSize = 11.sp)
              }
          }

          @Composable
          fun ModeScreen(category: String, onBack: () -> Unit, onEnclosure: (String) -> Unit) {
              Page {
                  item { TopTitle("เลือกประเภทการใช้งาน", onBack) }
                  item {
                      Card(
                          shape = RoundedCornerShape(22.dp),
                          colors = CardDefaults.cardColors(containerColor = Color.Transparent)
                      ) {
                          Box(
                              Modifier.fillMaxWidth().height(118.dp).background(
                                  Brush.linearGradient(
                                      if (category == "รถยนต์") listOf(Color(0xFF0B91F2), Color(0xFF1549B6))
                                      else listOf(Color(0xFF7A2BE7), Color(0xFF3B1A8A))
                                  )
                              )
                          ) {
                              Icon(
                                  if (category == "รถยนต์") Icons.Rounded.DirectionsCar else Icons.Rounded.SpeakerGroup,
                                  null,
                                  Modifier.size(82.dp).align(Alignment.CenterEnd).padding(end = 18.dp),
                                  Color.White.copy(alpha = .75f)
                              )
                              Column(Modifier.align(Alignment.CenterStart).padding(18.dp)) {
                                  Text(category, fontSize = 28.sp, fontWeight = FontWeight.ExtraBold)
                                  Text(
                                      if (category == "รถยนต์") "ซับบ็อกซ์ / ประตู / หลังเบาะ / SPL" else "เบส / กลาง / แหลม / Line array / Horn",
                                      color = Color.White.copy(alpha = .85f), fontSize = 12.sp
                                  )
                              }
                          }
                      }
                  }
                  item { Text("รูปแบบตู้ยอดนิยม", fontWeight = FontWeight.Bold, fontSize = 18.sp) }
                  item {
                      Column(verticalArrangement = Arrangement.spacedBy(9.dp)) {
                          enclosureNames.chunked(3).forEach { row ->
                              Row(horizontalArrangement = Arrangement.spacedBy(9.dp)) {
                                  row.forEach { name ->
                                      EnclosureTile(name, Modifier.weight(1f)) { onEnclosure(name) }
                                  }
                                  repeat(3 - row.size) { Spacer(Modifier.weight(1f)) }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun EnclosureTile(name: String, modifier: Modifier = Modifier, onClick: () -> Unit) {
              DarkCard(modifier.clickable(onClick = onClick), PaddingValues(10.dp)) {
                  CabinetMini(Modifier.fillMaxWidth().height(62.dp), highlighted = name.contains("เปิด") || name.contains("Reflex"))
                  Text(name, fontSize = 11.sp, maxLines = 1, overflow = TextOverflow.Ellipsis, modifier = Modifier.align(Alignment.CenterHorizontally))
              }
          }

          @Composable
          fun CabinetMini(modifier: Modifier, highlighted: Boolean = false) {
              Canvas(modifier) {
                  val body = if (highlighted) Color(0xFF243E55) else Color(0xFF1A242E)
                  drawRoundRect(body, cornerRadius = androidx.compose.ui.geometry.CornerRadius(12f, 12f))
                  val r = size.minDimension * .30f
                  val c = Offset(size.width * .43f, size.height * .52f)
                  drawCircle(Color(0xFF05080B), r, c)
                  drawCircle(Color(0xFF455B6B), r * .82f, c, style = Stroke(width = 5f))
                  drawCircle(Color(0xFF101820), r * .58f, c)
                  if (highlighted) {
                      drawRoundRect(Color(0xFF111B24), topLeft = Offset(size.width * .78f, size.height * .18f), size = androidx.compose.ui.geometry.Size(size.width * .10f, size.height * .64f))
                  }
              }
          }

          @Composable
