name: Build OKN DSP V55 SaveParams Settle Recovery

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_ANDROID_V55_SAVEPARAMS_SETTLE_RECOVERY.zip'
      - '.github/workflows/build-okn-dsp-v55.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify V55 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/okn_v55
          mkdir -p /tmp/okn_v55
          unzip -q OKN_DSP_ANDROID_V55_SAVEPARAMS_SETTLE_RECOVERY.zip -d /tmp/okn_v55

          check_file() { test -f "$1" || { echo "ERROR missing $1"; exit 1; }; echo "OK file: $1"; }
          check_text() { grep -Fq "$1" "$2" || { echo "ERROR missing marker '$1' in $2"; exit 1; }; echo "OK marker: $1"; }

          ACT=/tmp/okn_v55/app/src/main/java/com/okn/dsp/SaveParamsProofActivity.kt
          POLICY=/tmp/okn_v55/app/src/main/java/com/okn/dsp/protocol/SaveParamsPolicy.kt
          GATE=/tmp/okn_v55/app/src/main/java/com/okn/dsp/protocol/WriteGate.kt
          LIVE=/tmp/okn_v55/app/src/main/java/com/okn/dsp/LiveEqActivity.kt
          MANIFEST=/tmp/okn_v55/app/src/main/AndroidManifest.xml
          GRADLE=/tmp/okn_v55/app/build.gradle.kts

          check_file "$ACT"
          check_file "$POLICY"
          check_file "$GATE"
          check_file "$LIVE"
          check_file "$MANIFEST"
          check_file "$GRADLE"
          check_file /tmp/okn_v55/README_V55.txt
          check_file /tmp/okn_v55/evidence/OKN_DSP_V51_LIVE_EQ_SUCCESS_CAPTURE.txt
          check_file /tmp/okn_v55/evidence/OKN_DSP_V55_SETTLE_HANG_RECOVERY_PLAN.txt
          check_file /tmp/okn_v55/evidence/OKN_DSP_V55_SETTLE_HANG_RECOVERY_PLAN.json

          check_text 'versionCode = 55' "$GRADLE"
          check_text '3.7.0-v55-saveparams-settle-recovery' "$GRADLE"
          check_text 'saveParamsPersistenceProofEnabled: Boolean = true' "$GATE"
          check_text 'const val ACTUATOR_ID = 7' "$POLICY"
          check_text 'const val TEST_ACTUATOR = 4' "$POLICY"
          check_text 'const val TEST_BAND = 4' "$POLICY"
          check_text 'const val TEST_OFFSET = 144' "$POLICY"
          check_text 'const val V51_LIVE_BOOST_DB = -0.2f' "$POLICY"
          check_text 'const val TEST_BOOST_DB = -0.1f' "$POLICY"
          check_text 'UfeCodec.encodeWrite(ACTUATOR_ID, 0, byteArrayOf())' "$POLICY"
          check_text '570000000700000000' "$POLICY"

          # V55 settle-hang recovery markers.
          check_text 'saveCommitSettleMs = 5000L' "$ACT"
          check_text 'V55_SAVE_PHASE_PERSISTED_IMMEDIATELY' "$ACT"
          check_text 'proofClaimed=false' "$ACT"
          check_text 'V55_SETTLE_WATCHDOG_FIRED' "$ACT"
          check_text 'V55_PENDING_TARGET_RECOVERY_DETECTED' "$ACT"
          check_text 'RESUME V54/V55 PENDING -0.1 dB SAVE ATTEMPT (NO WRITE)' "$ACT"
          check_text 'V55_RECOVER_V54_PENDING_TARGET_ARMED' "$ACT"
          check_text 'noWrite=true saveParamsResent=false' "$ACT"
          check_text 'phase = if (after == "TARGET") Phase.WAIT_TARGET_REBOOT else Phase.WAIT_RESTORE_REBOOT' "$ACT"
          check_text 'phaseRolledBack=' "$ACT"

          # Persistence proof markers remain intact.
          check_text 'V55_TARGET_DESCRIPTOR_VERIFY' "$ACT"
          check_text 'V55_SAVEPARAMS_TRIGGER_PLAIN=' "$ACT"
          check_text 'V55_TARGET_POWER_CYCLE_VERIFY' "$ACT"
          check_text 'V55_RESTORE_DESCRIPTOR_VERIFY' "$ACT"
          check_text 'V55_RESTORE_POWER_CYCLE_VERIFY' "$ACT"
          check_text 'V55_SAVEPARAMS_PERSISTENCE_PROOF_COMPLETE' "$ACT"
          check_text 'WAIT_TARGET_REBOOT' "$ACT"
          check_text 'WAIT_RESTORE_REBOOT' "$ACT"
          check_text '.SaveParamsProofActivity' "$MANIFEST"

          # No direct generic ID7 write is allowed outside SaveParamsPolicy.
          if grep -R -n -F 'UfeCodec.encodeWrite(7' /tmp/okn_v55/app/src/main/java/com/okn/dsp | grep -v 'SaveParamsPolicy.kt'; then
            echo 'ERROR: direct SaveParams ID7 write exists outside guarded SaveParamsPolicy'
            exit 1
          fi
          if grep -Fq 'SaveParamsPolicy.encodeTrigger' "$LIVE"; then
            echo 'ERROR: live EQ editor gained SaveParams trigger'
            exit 1
          fi
          echo 'OK: V55 settle-hang recovery is guarded; SaveParams remains confined to persistence proof'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/okn_v55
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and package artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn_v55/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          mkdir -p artifact
          cp "$APK" artifact/OKN_DSP_V55_SAVEPARAMS_SETTLE_RECOVERY-debug.apk
          cp /tmp/okn_v55/README_V55.txt artifact/
          cp /tmp/okn_v55/evidence/OKN_DSP_V55_SETTLE_HANG_RECOVERY_PLAN.txt artifact/
          cp /tmp/okn_v55/evidence/OKN_DSP_V55_SETTLE_HANG_RECOVERY_PLAN.json artifact/
          sha256sum artifact/OKN_DSP_V55_SAVEPARAMS_SETTLE_RECOVERY-debug.apk > artifact/OKN_DSP_V55_SAVEPARAMS_SETTLE_RECOVERY-debug.sha256
          ls -lh artifact

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-V55-SAVEPARAMS-SETTLE-RECOVERY-debug-apk
          path: artifact/
          if-no-files-found: error
          retention-days: 30
