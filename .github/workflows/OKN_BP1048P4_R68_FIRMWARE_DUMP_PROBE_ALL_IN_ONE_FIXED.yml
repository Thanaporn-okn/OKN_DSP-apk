                      + "generic recovery flash readback: NOT PROVEN\n";
          
                  try (OutputStream raw = getContentResolver().openOutputStream(uri);
                       ZipOutputStream zip = new ZipOutputStream(raw)) {
          
                      putText(zip, "meta.txt", meta);
                      putText(zip, "protocol-status.txt", protocol);
                      putText(zip, "capture-log.txt", store.logText());
          
                      for (Map.Entry<String, byte[]> e : blobs.entrySet()) {
                          ZipEntry ze = new ZipEntry(e.getKey());
