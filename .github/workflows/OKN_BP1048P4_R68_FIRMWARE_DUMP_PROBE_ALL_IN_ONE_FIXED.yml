          # OKN BP1048P4 R68 — Firmware Dump Probe
          
          แอป Android สำหรับ Samsung Galaxy S25+ ที่ต่อ **USB-C → USB-C → บอร์ด DSP BP1048P4 โดยตรงเท่านั้น**
          
          ## เป้าหมาย
          
          1. เก็บข้อมูล USB ของบอร์ดให้มากที่สุดโดยไม่แก้ไขฮาร์ดแวร์
          2. เก็บ raw USB descriptors และ HID report descriptors เป็นไฟล์ไบนารีจริง
          3. อ่าน vendor HID Input reports ของ runtime IF4 แบบ device → host
          4. อ่าน Input report แบบ passive ถ้าบอร์ดอยู่ใน FlashBoot recovery อยู่แล้ว
          5. Export หลักฐานทั้งหมดเป็น ZIP พร้อม SHA-256 เพื่อใช้ reverse engineer ต่อ
          6. เตรียม `FirmwareReadbackStrategy` สำหรับปลดล็อก full flash dump เมื่อพบคำสั่งอ่านแฟลชที่พิสูจน์แล้ว
          
          ## สิ่งที่แอป “ไม่ทำ” ในโหมด Snapshot
          
          - ไม่ส่ง Feature report
          - ไม่ส่ง `0x55` / `0xAA`
          - ไม่สั่งเข้า recovery
          - ไม่ส่ง recovery Output command
          - ไม่ erase
          - ไม่ write flash
          - ไม่เดา opcode full-flash readback
          
          ## USB ที่ใช้
          
          - Runtime: `6324:1719`
          - FlashBoot reference recovery: `0000:2244`
          - Runtime vendor HID: interface 4
          - HID Input GET_REPORT: `A1 01 0100`
          - HID Output SET_REPORT: `21 09 0200`
          
          ## Version query
          
          ปุ่ม Advanced สามารถส่งคำสั่งที่มี static proof แล้วเพียงครั้งเดียวต่อ app data:
          
          `A5 5A 00 00 16` + zero padding จนครบ 256 bytes
          
          จากนั้นอ่าน Input GET_REPORT 256 bytes
          
          ปุ่มนี้เป็น **host → device** จึงแยกจาก read-only Snapshot และมีหน้าต่างยืนยันก่อนส่ง
          
          ## เหตุผลที่ Full Firmware Dump ยังล็อก
          
          FlashBoot ที่แกะได้พิสูจน์ command dispatcher:
          
          `cxxx`, `chiperas`, `bootdat`, `codedata`, `constdat`, `cnfgdat`, `btupdat`, `upinfo`
          
          - `chiperas` = destructive erase
          - `btupdat` มี flash read ภายใน แต่เป็นส่วนของ read-modify-write
          - ยังไม่พบ generic command ที่ส่งเนื้อหา flash ทั้งชิปกลับ host
          
          ดังนั้น R68 ไม่สร้าง opcode ขึ้นเอง เพราะคำสั่งเดาผิดอาจชน erase/write.
          
          ## ไฟล์ใน Capture ZIP
          
          ตัวอย่าง:
          - `usb/raw-descriptors.bin`
          - `usb/if3-hid-report-descriptor.bin`
          - `usb/if4-hid-report-descriptor.bin`
          - `runtime/if4-input-12-r1.bin`
          - `runtime/if4-input-64-r1.bin`
          - `runtime/if4-input-256-r1.bin`
          - `runtime/version-query-response.bin` (ถ้ามี)
          - `capture-log.txt`
          - `meta.txt`
          - `protocol-status.txt`
          - SHA-256 sidecar ของทุก binary capture
          
          ## Build
          
          ใช้ Android Studio หรือ GitHub Actions workflow ที่ให้มา:
          
          `.github/workflows/build-r68-apk.yml`
          
          ผลลัพธ์: `app-debug.apk`
          OKN_R68_FILE_13_EOF
          cat > 'KNOWN_PROTOCOL.md' <<'OKN_R68_FILE_14_EOF'
          # BP1048P4 protocol facts used by R68
          
          ## Runtime USB
          - VID:PID: `6324:1719`
          - Runtime application frame: `A5 5A <control> <length> <payload...> 16`
          - IF4 HID Input report size: 256 bytes
          - IF4 HID Output report size: 256 bytes
          - IF4 Feature report size: 8 bytes
          - Feature SET_REPORT magic `0x55` / `0xAA` participates in upgrade-control path and is disabled in R68 snapshot mode.
          
          ### Proven version query
          Host Output payload start:
          `A5 5A 00 00 16`
          
          Control transfer:
          - Host → device: `bmRequestType=0x21`, `bRequest=0x09`, `wValue=0x0200`, `wIndex=IF4`
          - Device → host: `bmRequestType=0xA1`, `bRequest=0x01`, `wValue=0x0100`, `wIndex=IF4`
          
          Expected logical response:
          `A5 5A 00 07 <model> <effect major> <effect minor> <effect patch> <audio major> <audio minor> <audio patch> 16`
          
          ## FlashBoot recovery
          - Reference VID:PID: `0000:2244`
          - Control-endpoint HID
          - Input report: 256
          - Output report: 256
          - Feature report: 1
          - Output receive: 4 × 64-byte EP0 chunks
          - Firmware logical block: 4096 bytes = 16 × 256-byte reports
          
          Proven command dispatcher:
          `cxxx -> chiperas -> bootdat -> codedata -> constdat -> cnfgdat -> btupdat -> upinfo`
          
          Risk:
          - `chiperas` = destructive erase
          - boot/code/const/config paths are writer paths
          - `btupdat` uses internal flash read in a read-modify-write operation
          - no proven generic host flash readback command
          
          R68 therefore keeps recovery Output/Feature traffic disabled.
          OKN_R68_FILE_14_EOF
          cat > 'R68_STATUS.txt' <<'OKN_R68_FILE_15_EOF'
          OKN BP1048P4 R68 FIRMWARE DUMP PROBE
          ====================================
          
          TARGET=MVSilicon BP1048P4
          PHONE=Samsung Galaxy S25+
          PHYSICAL_PATH=Samsung Galaxy S25+ -> USB-C -> DSP board USB-C
          SOLDERING=NO
          BOARD_MODIFICATION=NO
          JTAG=NO
          SDP=NO
          AICE=NO
          EXTERNAL_PROGRAMMER=NO
          
          RUNTIME_USB=6324:1719
          REFERENCE_FLASHBOOT_USB=0000:2244
          
          READ_ONLY_CAPTURE=IMPLEMENTED
          RAW_DESCRIPTORS=IMPLEMENTED
          HID_REPORT_DESCRIPTORS=IMPLEMENTED
          RUNTIME_IF4_INPUT_GET_REPORT_12_64_256=IMPLEMENTED
          PASSIVE_RECOVERY_INPUT_GET_REPORT=IMPLEMENTED
          CAPTURE_ZIP_EXPORT=IMPLEMENTED
          SHA256_PER_CAPTURE=IMPLEMENTED
          EXACT_VERSION_QUERY_A55A000016=IMPLEMENTED_ADVANCED_USER_CONFIRMED_ONE_SHOT
          
          FEATURE_REPORT=DISABLED
          RECOVERY_OUTPUT_COMMANDS=DISABLED
          ERASE=DISABLED
          FLASH_WRITE=DISABLED
          FULL_FLASH_READBACK_PROVEN=NO
          
          FULL_FLASH_DUMP=LOCKED
          REASON=NO_PROVEN_HOST_VISIBLE_GENERIC_FLASH_READBACK_COMMAND
          NEXT_UNLOCK=PROVE_NON_DESTRUCTIVE_FLASH_READBACK_PRIMITIVE_THEN_IMPLEMENT_FirmwareReadbackStrategy
          OKN_R68_FILE_15_EOF

      - name: Static safety and completeness audit
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re, sys

          root = Path(".")
          java = "\n".join(
              p.read_text(encoding="utf-8")
              for p in sorted((root/"app/src/main/java").rglob("*.java"))
          )

          required = [
              "6324",
              "1719",
              "0000",
              "2244",
              "A5",
              "5A",
              "NoProvenReadbackStrategy",
              "FULL FIRMWARE DUMP",
              "captureReadOnlySnapshot",
              "ACTION_CREATE_DOCUMENT",
              "ZipOutputStream",
              "HID_INPUT_REPORT_WVALUE",
              "HID_OUTPUT_REPORT_WVALUE",
              "r68_version_query_used",
          ]
          missing = [x for x in required if x not in java]
          if missing:
              raise SystemExit("R68_FAIL missing required source token(s): " + repr(missing))

          # Full readback must remain fail-closed until a real non-destructive
          # host-visible flash read primitive has been proven for the target.
          np = (root/"app/src/main/java/com/okn/bp1048p4r68/NoProvenReadbackStrategy.java").read_text()
          if "return false;" not in np:
              raise SystemExit("R68_FAIL readback strategy unexpectedly unlocked")

          # Feature report path must not be implemented in live Java.
          forbidden_live = [
              "0x0300",
              "GET_REPORT_FEATURE",
              "SET_REPORT_FEATURE",
              "start_up_grate(",
              "SpiFlashErase(",
              "SpiFlashWrite(",
              "FlashChipErase(",
              "FlashSectorErase(",
              "bulkTransfer(",
              "UsbRequest",
          ]
          bad = [x for x in forbidden_live if x in java]
          if bad:
              raise SystemExit("R68_FAIL forbidden live USB/flash token(s): " + repr(bad))

          # Exactly one host->device HID SET_REPORT call is permitted:
          # the static-proof version query A5 5A 00 00 16.
          eng = (root/"app/src/main/java/com/okn/bp1048p4r68/UsbCaptureEngine.java").read_text()
          if eng.count("HID_OUTPUT_SET_REPORT_BM") != 1:
              # one constant reference in call plus potential source mention count is
              # intentionally bounded; fail if implementation grows unexpectedly.
              raise SystemExit("R68_FAIL unexpected HID output transfer surface")
          if "out[0] = (byte) 0xA5;" not in eng or "out[1] = (byte) 0x5A;" not in eng:
              raise SystemExit("R68_FAIL exact version query header missing")
          if "out[2] = 0x00;" not in eng or "out[3] = 0x00;" not in eng or "out[4] = 0x16;" not in eng:
              raise SystemExit("R68_FAIL exact version query body missing")

          # Build a source manifest for provenance.
          rows = []
          for p in sorted(root.rglob("*")):
              if p.is_file() and ".gradle/" not in str(p):
                  h = hashlib.sha256(p.read_bytes()).hexdigest()
                  rows.append(f"{h}  {p}")
          (root/"SOURCE_SHA256SUMS.txt").write_text("\n".join(rows)+"\n")
          print("R68_STATIC_SAFETY_AUDIT_PASS")
          PY

          grep -q -F 'Samsung Galaxy S25+' README_TH.md
          grep -q -F 'FULL_FLASH_READBACK_PROVEN=NO' R68_STATUS.txt
          grep -q -F 'generic recovery flash readback: NOT PROVEN' KNOWN_PROTOCOL.md
          echo "R68_PROJECT_GENERATION_PASS"

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 20 \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o /tmp/gradle-8.9-bin.zip
          rm -rf /tmp/gradle-8.9
          unzip -q /tmp/gradle-8.9-bin.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build R68 debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --version
          gradle --no-daemon :app:assembleDebug

          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk \
            out/OKN_BP1048P4_R68_FirmwareDumpProbe.apk

          sha256sum out/OKN_BP1048P4_R68_FirmwareDumpProbe.apk \
            | tee out/OKN_BP1048P4_R68_FirmwareDumpProbe.apk.sha256

          cp SAFETY_GATE.txt out/
          cp R68_STATUS.txt out/
          cp KNOWN_PROTOCOL.md out/
          cp SOURCE_SHA256SUMS.txt out/

      - name: Package generated source
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          zip -9 -r out/OKN_BP1048P4_R68_GENERATED_SOURCE.zip \
            settings.gradle build.gradle gradle.properties \
            app README_TH.md KNOWN_PROTOCOL.md R68_STATUS.txt SAFETY_GATE.txt \
            SOURCE_SHA256SUMS.txt >/dev/null

          sha256sum out/OKN_BP1048P4_R68_GENERATED_SOURCE.zip \
            | tee out/OKN_BP1048P4_R68_GENERATED_SOURCE.zip.sha256

          echo "### OKN BP1048P4 R68" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Android project generated entirely by this single .yml file." >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime USB: 6324:1719" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reference FlashBoot USB: 0000:2244" >> "$GITHUB_STEP_SUMMARY"
          echo "- Full flash dump: LOCKED until a proven host-visible readback primitive exists." >> "$GITHUB_STEP_SUMMARY"
          echo "- Erase/write/Feature/recovery Output: DISABLED." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat out/OKN_BP1048P4_R68_FirmwareDumpProbe.apk.sha256 >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK and generated source
        uses: actions/upload-artifact@v7
        with:
          name: OKN_BP1048P4_R68_ALL_IN_ONE
          path: |
            /tmp/okn-r68/out/OKN_BP1048P4_R68_FirmwareDumpProbe.apk
            /tmp/okn-r68/out/OKN_BP1048P4_R68_FirmwareDumpProbe.apk.sha256
            /tmp/okn-r68/out/OKN_BP1048P4_R68_GENERATED_SOURCE.zip
            /tmp/okn-r68/out/OKN_BP1048P4_R68_GENERATED_SOURCE.zip.sha256
            /tmp/okn-r68/out/SAFETY_GATE.txt
            /tmp/okn-r68/out/R68_STATUS.txt
            /tmp/okn-r68/out/KNOWN_PROTOCOL.md
            /tmp/okn-r68/out/SOURCE_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
