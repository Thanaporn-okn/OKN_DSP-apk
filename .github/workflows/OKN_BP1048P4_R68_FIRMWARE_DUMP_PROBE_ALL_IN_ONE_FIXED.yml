name: OKN BP1048P4 R68 Firmware Dump Probe ALL-IN-ONE

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_DIR: /tmp/okn-r68
  REQUIRED_PHONE: "Samsung Galaxy S25+"
  REQUIRED_PATH: "Samsung Galaxy S25+ -> USB-C -> DSP board USB-C"
  RUNTIME_VID_PID: "6324:1719"
  RECOVERY_VID_PID: "0000:2244"
  FULL_FLASH_READBACK_PROVEN: "NO"
  ERASE_ALLOWED: "NO"
  FLASH_WRITE_ALLOWED: "NO"
  FEATURE_REPORT_ALLOWED: "NO"
  RECOVERY_OUTPUT_ALLOWED: "NO"

jobs:
  build-r68:
    name: Generate source + safety audit + build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$REQUIRED_PHONE" = "Samsung Galaxy S25+"
          test "$REQUIRED_PATH" = "Samsung Galaxy S25+ -> USB-C -> DSP board USB-C"
          test "$FULL_FLASH_READBACK_PROVEN" = "NO"
          test "$ERASE_ALLOWED" = "NO"
          test "$FLASH_WRITE_ALLOWED" = "NO"
          test "$FEATURE_REPORT_ALLOWED" = "NO"
          test "$RECOVERY_OUTPUT_ALLOWED" = "NO"

          rm -rf "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR"
          cd "$PROJECT_DIR"

          cat > SAFETY_GATE.txt <<'OKN_SAFETY_EOF'
          TARGET=MVSilicon BP1048P4
          PHONE=Samsung Galaxy S25+
          PHYSICAL_PATH=Samsung Galaxy S25+ -> USB-C -> DSP board USB-C
          SOLDERING=NO
          BOARD_MODIFICATION=NO
          JTAG=NO
          SDP=NO
          AICE=NO
          EXTERNAL_PROGRAMMER=NO
          ERASE_ALLOWED=NO
          FLASH_WRITE_ALLOWED=NO
          FEATURE_REPORT_ALLOWED=NO
          RECOVERY_OUTPUT_ALLOWED=NO
          FULL_FLASH_READBACK_PROVEN=NO
          MODE=DESCRIPTOR_AND_DEVICE_TO_HOST_CAPTURE_PLUS_EXACT_USER_CONFIRMED_VERSION_QUERY
          OKN_SAFETY_EOF

      - name: Generate complete Android project from this one workflow file
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          cat > 'settings.gradle' <<'OKN_R68_FILE_01_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "OKN_BP1048P4_R68_FirmwareDumpProbe"
          include ":app"
          OKN_R68_FILE_01_EOF
          cat > 'build.gradle' <<'OKN_R68_FILE_02_EOF'
          plugins {
              id "com.android.application" version "8.7.3" apply false
          }
          OKN_R68_FILE_02_EOF
          cat > 'gradle.properties' <<'OKN_R68_FILE_03_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          OKN_R68_FILE_03_EOF
          mkdir -p 'app'
          cat > 'app/build.gradle' <<'OKN_R68_FILE_04_EOF'
          plugins {
              id "com.android.application"
          }
          
          android {
              namespace "com.okn.bp1048p4r68"
              compileSdk 35
          
              defaultConfig {
                  applicationId "com.okn.bp1048p4r68"
                  minSdk 29
                  targetSdk 35
                  versionCode 68
                  versionName "68.0"
              }
          
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          OKN_R68_FILE_04_EOF
          mkdir -p 'app/src/main'
          cat > 'app/src/main/AndroidManifest.xml' <<'OKN_R68_FILE_05_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature
                  android:name="android.hardware.usb.host"
                  android:required="true" />
          
              <application
                  android:allowBackup="false"
                  android:label="OKN BP1048P4 R68"
                  android:supportsRtl="true">
          
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop">
          
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
          
                      <intent-filter>
                          <action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED" />
                      </intent-filter>
          
                      <meta-data
                          android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED"
                          android:resource="@xml/device_filter" />
                  </activity>
              </application>
          </manifest>
          OKN_R68_FILE_05_EOF
          mkdir -p 'app/src/main/res/xml'
          cat > 'app/src/main/res/xml/device_filter.xml' <<'OKN_R68_FILE_06_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <!-- Exact runtime identity observed on target board: 0x6324:0x1719 -->
              <usb-device vendor-id="25380" product-id="5913" />
          
              <!-- BP1048P4 FlashBoot reference recovery identity: 0x0000:0x2244 -->
              <usb-device vendor-id="0" product-id="8772" />
          </resources>
          OKN_R68_FILE_06_EOF
          mkdir -p 'app/src/main/java/com/okn/bp1048p4r68'
          cat > 'app/src/main/java/com/okn/bp1048p4r68/ProtocolFacts.java' <<'OKN_R68_FILE_07_EOF'
          package com.okn.bp1048p4r68;
          
          public final class ProtocolFacts {
              private ProtocolFacts() {}
          
              public static final int RUNTIME_VID = 0x6324;
              public static final int RUNTIME_PID = 0x1719;
              public static final int RECOVERY_VID = 0x0000;
              public static final int RECOVERY_PID = 0x2244;
          
              public static final int HID_CLASS = 3;
              public static final int RUNTIME_VENDOR_IF = 4;
          
              public static final int HID_GET_DESCRIPTOR_BM = 0x81;
              public static final int HID_GET_DESCRIPTOR_REQ = 0x06;
              public static final int HID_REPORT_DESCRIPTOR_WVALUE = 0x2200;
          
              public static final int HID_INPUT_GET_REPORT_BM = 0xA1;
              public static final int HID_GET_REPORT_REQ = 0x01;
              public static final int HID_INPUT_REPORT_WVALUE = 0x0100;
          
              public static final int HID_OUTPUT_SET_REPORT_BM = 0x21;
              public static final int HID_SET_REPORT_REQ = 0x09;
              public static final int HID_OUTPUT_REPORT_WVALUE = 0x0200;
          
              public static final int REPORT_BYTES = 256;
              public static final int RECOVERY_FLASH_BLOCK_BYTES = 4096;
          
              public static final String EXPECTED_RAW_DESCRIPTOR_SHA256 =
                  "C7E861A6F28EB832E16450D3A35B64C557BEA4E0CC15FF1EB94C45E348C84001";
              public static final String EXPECTED_IF3_REPORT_SHA256 =
                  "BAFE7C0E6A251EB36B11362B18106DFF3DC0010A831A3B8B6CD49DBF4A9AE2C3";
              public static final String EXPECTED_IF4_REPORT_SHA256 =
                  "78510751B31DCC204CD6CA2FE023F05CF84B75227A279E8E1FBAF7D6C3A21B6F";
          
              public static boolean isRuntime(int vid, int pid) {
                  return vid == RUNTIME_VID && pid == RUNTIME_PID;
              }
          
              public static boolean isRecovery(int vid, int pid) {
                  return vid == RECOVERY_VID && pid == RECOVERY_PID;
              }
          }
          OKN_R68_FILE_07_EOF
          mkdir -p 'app/src/main/java/com/okn/bp1048p4r68'
          cat > 'app/src/main/java/com/okn/bp1048p4r68/FirmwareReadbackStrategy.java' <<'OKN_R68_FILE_08_EOF'
          package com.okn.bp1048p4r68;
          
          import android.hardware.usb.UsbDevice;
          import android.hardware.usb.UsbManager;
          
          import java.io.File;
          
          public interface FirmwareReadbackStrategy {
              String id();
              boolean isProven();
              String status();
          
              /**
               * A future implementation MUST be based on a proven, non-destructive
               * device-to-host flash read primitive for this exact target.
               *
               * Never implement this by guessing FlashBoot command names/opcodes.
               */
              ReadbackResult dump(UsbManager manager, UsbDevice device, File destination) throws Exception;
          
              final class ReadbackResult {
                  public final boolean success;
                  public final long bytes;
                  public final String sha256;
                  public final String message;
          
                  public ReadbackResult(boolean success, long bytes, String sha256, String message) {
                      this.success = success;
                      this.bytes = bytes;
                      this.sha256 = sha256;
                      this.message = message;
                  }
              }
          }
          OKN_R68_FILE_08_EOF
          mkdir -p 'app/src/main/java/com/okn/bp1048p4r68'
          cat > 'app/src/main/java/com/okn/bp1048p4r68/NoProvenReadbackStrategy.java' <<'OKN_R68_FILE_09_EOF'
          package com.okn.bp1048p4r68;
          
          import android.hardware.usb.UsbDevice;
          import android.hardware.usb.UsbManager;
          
          import java.io.File;
          
          public final class NoProvenReadbackStrategy implements FirmwareReadbackStrategy {
              @Override public String id() {
                  return "NO_PROVEN_FULL_FLASH_READBACK_R68";
              }
          
              @Override public boolean isProven() {
                  return false;
              }
          
              @Override public String status() {
                  return "LOCKED: ยังไม่มี host-visible generic full-flash readback command ที่พิสูจน์แล้ว "
                      + "ใน runtime HID หรือ FlashBoot dispatcher ของ BP1048P4. "
                      + "btupdat มี internal flash read แต่เป็น read-modify-write ไม่ใช่ host dump.";
              }
          
              @Override
              public ReadbackResult dump(UsbManager manager, UsbDevice device, File destination) {
                  return new ReadbackResult(false, 0, "", status());
              }
          }
          OKN_R68_FILE_09_EOF
          mkdir -p 'app/src/main/java/com/okn/bp1048p4r68'
          cat > 'app/src/main/java/com/okn/bp1048p4r68/CaptureStore.java' <<'OKN_R68_FILE_10_EOF'
          package com.okn.bp1048p4r68;
          
          import java.util.LinkedHashMap;
          import java.util.Map;
          
          public final class CaptureStore {
              private final LinkedHashMap<String, byte[]> blobs = new LinkedHashMap<>();
              private final StringBuilder log = new StringBuilder();
          
              public synchronized void put(String name, byte[] data) {
                  if (name == null || data == null) return;
                  blobs.put(name, data.clone());
              }
          
              public synchronized Map<String, byte[]> snapshot() {
                  LinkedHashMap<String, byte[]> out = new LinkedHashMap<>();
                  for (Map.Entry<String, byte[]> e : blobs.entrySet()) {
                      out.put(e.getKey(), e.getValue().clone());
                  }
                  return out;
              }
          
              public synchronized void append(String line) {
                  log.append(line).append('\n');
              }
          
              public synchronized String logText() {
                  return log.toString();
              }
          
              public synchronized void clear() {
                  blobs.clear();
                  log.setLength(0);
              }
          }
          OKN_R68_FILE_10_EOF
          mkdir -p 'app/src/main/java/com/okn/bp1048p4r68'
          cat > 'app/src/main/java/com/okn/bp1048p4r68/UsbCaptureEngine.java' <<'OKN_R68_FILE_11_EOF'
          package com.okn.bp1048p4r68;
          
          import android.hardware.usb.UsbDevice;
          import android.hardware.usb.UsbDeviceConnection;
          import android.hardware.usb.UsbEndpoint;
          import android.hardware.usb.UsbInterface;
          import android.hardware.usb.UsbManager;
          import android.os.SystemClock;
          
          import java.security.MessageDigest;
          import java.util.Arrays;
          import java.util.HashMap;
          import java.util.Locale;
          import java.util.Map;
          
          public final class UsbCaptureEngine {
              public interface Logger {
                  void line(String s);
              }
          
              private final UsbManager usb;
              private final CaptureStore store;
              private final Logger logger;
          
              public UsbCaptureEngine(UsbManager usb, CaptureStore store, Logger logger) {
                  this.usb = usb;
                  this.store = store;
                  this.logger = logger;
              }
          
              private void line(String s) {
                  store.append(s);
                  logger.line(s);
              }
          
              public static String hex(byte[] b) {
                  if (b == null) return "";
                  StringBuilder sb = new StringBuilder(b.length * 2);
                  for (byte x : b) sb.append(String.format(Locale.US, "%02X", x & 0xFF));
                  return sb.toString();
              }
          
              public static String sha256(byte[] b) {
                  if (b == null) return "";
                  try {
                      MessageDigest md = MessageDigest.getInstance("SHA-256");
                      byte[] d = md.digest(b);
                      StringBuilder sb = new StringBuilder(64);
                      for (byte x : d) sb.append(String.format(Locale.US, "%02X", x & 0xFF));
                      return sb.toString();
                  } catch (Exception e) {
                      return "SHA256_ERROR_" + e.getClass().getSimpleName();
                  }
              }
          
              public void inventory(UsbDevice d) {
                  if (d == null) {
                      line("INVENTORY_DEVICE_NULL=true");
                      return;
                  }
                  line(String.format(Locale.US,
                      "DEVICE vid=%04X pid=%04X id=%d name=%s interfaces=%d permission=%s",
                      d.getVendorId(), d.getProductId(), d.getDeviceId(),
                      d.getDeviceName(), d.getInterfaceCount(), usb.hasPermission(d)));
          
                  try { line("MANUFACTURER=" + String.valueOf(d.getManufacturerName())); }
                  catch (Throwable t) { line("MANUFACTURER_READ_ERROR=" + t.getClass().getSimpleName()); }
          
                  try { line("PRODUCT=" + String.valueOf(d.getProductName())); }
                  catch (Throwable t) { line("PRODUCT_READ_ERROR=" + t.getClass().getSimpleName()); }
          
                  try { line("VERSION=" + String.valueOf(d.getVersion())); }
                  catch (Throwable t) { line("VERSION_READ_ERROR=" + t.getClass().getSimpleName()); }
          
                  try { line("SERIAL=" + String.valueOf(d.getSerialNumber())); }
                  catch (Throwable t) { line("SERIAL_READ_ERROR=" + t.getClass().getSimpleName()); }
          
                  for (int n = 0; n < d.getInterfaceCount(); n++) {
                      UsbInterface x = d.getInterface(n);
                      line(String.format(Locale.US,
                          "IF index=%d id=%d alt=%d class=%d sub=%d proto=%d endpoints=%d",
                          n, x.getId(), x.getAlternateSetting(), x.getInterfaceClass(),
                          x.getInterfaceSubclass(), x.getInterfaceProtocol(), x.getEndpointCount()));
          
                      for (int k = 0; k < x.getEndpointCount(); k++) {
                          UsbEndpoint ep = x.getEndpoint(k);
                          line(String.format(Locale.US,
                              "EP if=%d index=%d addr=0x%02X dir=%d type=%d maxPacket=%d interval=%d",
                              x.getId(), k, ep.getAddress(), ep.getDirection(), ep.getType(),
                              ep.getMaxPacketSize(), ep.getInterval()));
                      }
                  }
              }
          
              public void captureReadOnlySnapshot(UsbDevice d) {
                  if (d == null) {
                      line("SNAPSHOT_DEVICE_NULL=true");
                      return;
                  }
                  if (!usb.hasPermission(d)) {
                      line("SNAPSHOT_NO_USB_PERMISSION=true");
                      return;
                  }
          
                  UsbDeviceConnection c = usb.openDevice(d);
                  if (c == null) {
                      line("SNAPSHOT_OPEN_DEVICE_NULL=true");
                      return;
                  }
          
                  try {
                      line("READ_ONLY_SNAPSHOT_BEGIN=true");
                      byte[] raw = c.getRawDescriptors();
                      if (raw != null && raw.length > 0) {
                          store.put("usb/raw-descriptors.bin", raw);
                          String sh = sha256(raw);
                          line("RAW_DESCRIPTOR_BYTES=" + raw.length);
                          line("RAW_DESCRIPTOR_SHA256=" + sh);
                          line("RAW_DESCRIPTOR_HEX=" + hex(raw));
                          line("RAW_DESCRIPTOR_EXPECTED_MATCH=" +
                              ProtocolFacts.EXPECTED_RAW_DESCRIPTOR_SHA256.equals(sh));
          
                          Map<Integer,Integer> reportLens = parseHidReportLengths(raw);
                          line("PARSED_HID_REPORT_LENGTHS=" + reportLens);
          
                          for (int n = 0; n < d.getInterfaceCount(); n++) {
                              UsbInterface x = d.getInterface(n);
                              if (x.getInterfaceClass() != ProtocolFacts.HID_CLASS) continue;
                              int expected = reportLens.containsKey(x.getId())
                                  ? reportLens.get(x.getId()) : 4096;
                              readHidDescriptor(c, x, expected);
                          }
                      } else {
                          line("RAW_DESCRIPTOR_BYTES=0");
                      }
          
                      // Runtime IF4 is the proven vendor HID input path.
                      if (ProtocolFacts.isRuntime(d.getVendorId(), d.getProductId())) {
                          UsbInterface if4 = findInterface(d, ProtocolFacts.RUNTIME_VENDOR_IF);
                          if (if4 == null || if4.getInterfaceClass() != ProtocolFacts.HID_CLASS) {
                              line("RUNTIME_IF4_HID_MISSING=true");
                          } else {
                              readRuntimeInputOnly(c, if4);
                          }
                      } else if (ProtocolFacts.isRecovery(d.getVendorId(), d.getProductId())) {
                          // Passive recovery capture only. No Output/Feature report is sent.
                          UsbInterface hid = findFirstHid(d);
                          if (hid != null) readRecoveryInputOnly(c, hid);
                          else line("RECOVERY_HID_INTERFACE_MISSING=true");
                      }
          
                      line("READ_ONLY_SNAPSHOT_END=true");
                  } finally {
                      c.close();
                  }
              }
          
              private void readHidDescriptor(UsbDeviceConnection c, UsbInterface x, int expected) {
                  int ask = expected > 0 && expected <= 4096 ? expected : 4096;
                  byte[] buf = new byte[ask];
          
                  int r = c.controlTransfer(
                      ProtocolFacts.HID_GET_DESCRIPTOR_BM,
                      ProtocolFacts.HID_GET_DESCRIPTOR_REQ,
                      ProtocolFacts.HID_REPORT_DESCRIPTOR_WVALUE,
                      x.getId(),
                      buf,
                      buf.length,
                      1500);
          
                  line("IF" + x.getId() + "_HID_REPORT_DESCRIPTOR_UNCLAIMED_RESULT=" + r);
          
                  boolean claimed = false;
                  boolean forceClaimed = false;
          
                  if (r <= 0) {
                      try {
                          claimed = c.claimInterface(x, false);
                          line("IF" + x.getId() + "_CLAIM_FORCE_FALSE=" + claimed);
                          if (claimed) {
                              r = c.controlTransfer(
                                  ProtocolFacts.HID_GET_DESCRIPTOR_BM,
                                  ProtocolFacts.HID_GET_DESCRIPTOR_REQ,
                                  ProtocolFacts.HID_REPORT_DESCRIPTOR_WVALUE,
                                  x.getId(),
                                  buf,
                                  buf.length,
                                  1500);
                              line("IF" + x.getId() + "_HID_REPORT_DESCRIPTOR_CLAIMED_RESULT=" + r);
                          } else if (x.getId() == 3 && expected == 33) {
                              // Existing physical evidence used this only as an IF3 fallback.
                              forceClaimed = c.claimInterface(x, true);
                              line("IF3_TEMP_FORCE_CLAIM=" + forceClaimed);
                              if (forceClaimed) {
                                  r = c.controlTransfer(
                                      ProtocolFacts.HID_GET_DESCRIPTOR_BM,
                                      ProtocolFacts.HID_GET_DESCRIPTOR_REQ,
                                      ProtocolFacts.HID_REPORT_DESCRIPTOR_WVALUE,
                                      x.getId(),
                                      buf,
                                      buf.length,
                                      1500);
                                  line("IF3_HID_REPORT_DESCRIPTOR_FORCE_CLAIM_RESULT=" + r);
                              }
                          }
                      } finally {
                          if (claimed || forceClaimed) {
                              boolean released = c.releaseInterface(x);
                              line("IF" + x.getId() + "_RELEASE=" + released);
                          }
                      }
                  }
          
                  if (r > 0) {
                      byte[] exact = Arrays.copyOf(buf, r);
                      store.put("usb/if" + x.getId() + "-hid-report-descriptor.bin", exact);
                      String sh = sha256(exact);
                      line("IF" + x.getId() + "_HID_REPORT_BYTES=" + r);
                      line("IF" + x.getId() + "_HID_REPORT_SHA256=" + sh);
                      line("IF" + x.getId() + "_HID_REPORT_HEX=" + hex(exact));
                      if (x.getId() == 3) {
                          line("IF3_EXPECTED_FINGERPRINT_MATCH=" +
                              ProtocolFacts.EXPECTED_IF3_REPORT_SHA256.equals(sh));
                      }
                      if (x.getId() == 4) {
                          line("IF4_EXPECTED_FINGERPRINT_MATCH=" +
                              ProtocolFacts.EXPECTED_IF4_REPORT_SHA256.equals(sh));
                      }
                  }
              }
          
              private void readRuntimeInputOnly(UsbDeviceConnection c, UsbInterface if4) {
                  boolean claimed = c.claimInterface(if4, false);
                  line("RUNTIME_IF4_CLAIM_FORCE_FALSE=" + claimed);
                  if (!claimed) {
                      line("RUNTIME_INPUT_CAPTURE_ABORT_NO_NONFORCED_CLAIM=true");
                      return;
                  }
          
                  try {
                      int[] sizes = new int[]{12, 64, 256};
                      for (int size : sizes) {
                          for (int round = 1; round <= 4; round++) {
                              byte[] b = new byte[size];
                              int r = c.controlTransfer(
                                  ProtocolFacts.HID_INPUT_GET_REPORT_BM,
                                  ProtocolFacts.HID_GET_REPORT_REQ,
                                  ProtocolFacts.HID_INPUT_REPORT_WVALUE,
                                  if4.getId(),
                                  b,
                                  b.length,
                                  1000);
                              line("IF4_INPUT_GET_REPORT size=" + size + " round=" + round + " result=" + r);
                              if (r > 0) {
                                  byte[] exact = Arrays.copyOf(b, r);
                                  String name = "runtime/if4-input-" + size + "-r" + round + ".bin";
                                  store.put(name, exact);
                                  line(name + "_SHA256=" + sha256(exact));
                                  line(name + "_HEX=" + hex(exact));
                              }
                              SystemClock.sleep(30);
                          }
                      }
                  } finally {
                      boolean released = c.releaseInterface(if4);
                      line("RUNTIME_IF4_RELEASE=" + released);
                  }
              }
          
              private void readRecoveryInputOnly(UsbDeviceConnection c, UsbInterface hid) {
                  boolean claimed = c.claimInterface(hid, false);
                  line("RECOVERY_HID_CLAIM_FORCE_FALSE=" + claimed);
                  if (!claimed) return;
          
                  try {
                      for (int round = 1; round <= 4; round++) {
                          byte[] b = new byte[256];
                          int r = c.controlTransfer(
                              ProtocolFacts.HID_INPUT_GET_REPORT_BM,
                              ProtocolFacts.HID_GET_REPORT_REQ,
                              ProtocolFacts.HID_INPUT_REPORT_WVALUE,
                              hid.getId(),
                              b,
                              b.length,
                              1000);
                          line("RECOVERY_INPUT_GET_REPORT round=" + round + " result=" + r);
                          if (r > 0) {
                              byte[] exact = Arrays.copyOf(b, r);
                              String name = "recovery/input-r" + round + ".bin";
                              store.put(name, exact);
                              line(name + "_SHA256=" + sha256(exact));
                              line(name + "_HEX=" + hex(exact));
                          }
                          SystemClock.sleep(30);
                      }
                  } finally {
                      boolean released = c.releaseInterface(hid);
                      line("RECOVERY_HID_RELEASE=" + released);
                  }
              }
          
              public void runExactVersionQueryOnce(UsbDevice d) {
                  if (d == null || !ProtocolFacts.isRuntime(d.getVendorId(), d.getProductId())) {
                      line("VERSION_QUERY_BLOCKED_NOT_RUNTIME=true");
                      return;
                  }
                  if (!usb.hasPermission(d)) {
                      line("VERSION_QUERY_BLOCKED_NO_PERMISSION=true");
                      return;
                  }
          
                  UsbDeviceConnection c = usb.openDevice(d);
                  if (c == null) {
                      line("VERSION_QUERY_OPEN_DEVICE_NULL=true");
                      return;
                  }
          
                  UsbInterface if4 = findInterface(d, ProtocolFacts.RUNTIME_VENDOR_IF);
                  if (if4 == null || if4.getInterfaceClass() != ProtocolFacts.HID_CLASS) {
                      line("VERSION_QUERY_IF4_MISSING=true");
                      c.close();
                      return;
                  }
          
                  boolean claimed = false;
                  try {
                      claimed = c.claimInterface(if4, false);
                      line("VERSION_QUERY_IF4_CLAIM_FORCE_FALSE=" + claimed);
                      if (!claimed) return;
          
                      byte[] out = new byte[256];
                      out[0] = (byte) 0xA5;
                      out[1] = (byte) 0x5A;
                      out[2] = 0x00;
                      out[3] = 0x00;
                      out[4] = 0x16;
                      store.put("runtime/version-query-output-256.bin", out);
                      line("VERSION_QUERY_FRAME=A55A000016_PLUS_ZERO_PADDING");
          
                      int wo = c.controlTransfer(
                          ProtocolFacts.HID_OUTPUT_SET_REPORT_BM,
                          ProtocolFacts.HID_SET_REPORT_REQ,
                          ProtocolFacts.HID_OUTPUT_REPORT_WVALUE,
                          if4.getId(),
                          out,
                          out.length,
                          1500);
                      line("VERSION_QUERY_SET_REPORT_RESULT=" + wo);
          
                      SystemClock.sleep(50);
          
                      byte[] input = new byte[256];
                      int ri = c.controlTransfer(
                          ProtocolFacts.HID_INPUT_GET_REPORT_BM,
                          ProtocolFacts.HID_GET_REPORT_REQ,
                          ProtocolFacts.HID_INPUT_REPORT_WVALUE,
                          if4.getId(),
                          input,
                          input.length,
                          1500);
                      line("VERSION_QUERY_GET_REPORT_RESULT=" + ri);
          
                      if (ri > 0) {
                          byte[] exact = Arrays.copyOf(input, ri);
                          store.put("runtime/version-query-response.bin", exact);
                          line("VERSION_QUERY_RESPONSE_SHA256=" + sha256(exact));
                          line("VERSION_QUERY_RESPONSE_HEX=" + hex(exact));
                          boolean frame = ri >= 12
                              && (input[0] & 255) == 0xA5
                              && (input[1] & 255) == 0x5A
                              && (input[2] & 255) == 0x00
                              && (input[3] & 255) == 0x07
                              && (input[11] & 255) == 0x16;
                          line("VERSION_RESPONSE_FRAME_VALID=" + frame);
                          if (frame) {
                              line(String.format(Locale.US, "VERSION_MODEL_TAG=0x%02X", input[4] & 255));
                              line(String.format(Locale.US, "EFFECT_VERSION=%d.%d.%d",
                                  input[5] & 255, input[6] & 255, input[7] & 255));
                              line(String.format(Locale.US, "AUDIO_LIB_VERSION=%d.%d.%d",
                                  input[8] & 255, input[9] & 255, input[10] & 255));
                          }
                      }
                  } finally {
                      if (claimed) c.releaseInterface(if4);
                      c.close();
                  }
              }
          
              private UsbInterface findInterface(UsbDevice d, int id) {
                  for (int i = 0; i < d.getInterfaceCount(); i++) {
                      UsbInterface x = d.getInterface(i);
                      if (x.getId() == id) return x;
                  }
                  return null;
              }
          
              private UsbInterface findFirstHid(UsbDevice d) {
                  for (int i = 0; i < d.getInterfaceCount(); i++) {
                      UsbInterface x = d.getInterface(i);
                      if (x.getInterfaceClass() == ProtocolFacts.HID_CLASS) return x;
                  }
                  return null;
              }
          
              private Map<Integer,Integer> parseHidReportLengths(byte[] raw) {
                  Map<Integer,Integer> out = new HashMap<>();
                  int p = 0;
                  int currentIf = -1;
                  int currentClass = -1;
          
                  while (raw != null && p + 2 <= raw.length) {
                      int len = raw[p] & 255;
                      int type = raw[p + 1] & 255;
                      if (len < 2 || p + len > raw.length) break;
          
                      if (type == 0x04 && len >= 9) {
                          currentIf = raw[p + 2] & 255;
                          currentClass = raw[p + 5] & 255;
                      } else if (type == 0x21 && currentClass == 3 && currentIf >= 0 && len >= 9) {
                          int num = raw[p + 5] & 255;
                          int q = p + 6;
                          for (int k = 0; k < num && q + 2 < p + len; k++, q += 3) {
                              int dtype = raw[q] & 255;
                              int dlen = (raw[q + 1] & 255) | ((raw[q + 2] & 255) << 8);
                              if (dtype == 0x22 && dlen > 0) {
                                  out.put(currentIf, dlen);
                                  break;
                              }
                          }
                      }
                      p += len;
                  }
                  return out;
              }
          }
