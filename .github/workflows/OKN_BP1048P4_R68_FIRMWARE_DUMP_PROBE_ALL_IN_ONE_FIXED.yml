              private String dev(UsbDevice d) {
                  if (d == null) return "";
                  return String.format(Locale.US, " [%04X:%04X id=%d name=%s]",
                      d.getVendorId(), d.getProductId(), d.getDeviceId(), d.getDeviceName());
              }
          
              private void scan(boolean requestPermission) {
                  Map<String, UsbDevice> map = usb.getDeviceList();
                  line("USB_DEVICE_COUNT=" + map.size());
          
                  UsbDevice runtime = null;
                  UsbDevice recovery = null;
          
                  for (UsbDevice d : map.values()) {
                      line("FOUND" + dev(d));
                      if (ProtocolFacts.isRuntime(d.getVendorId(), d.getProductId())) runtime = d;
                      if (ProtocolFacts.isRecovery(d.getVendorId(), d.getProductId())) recovery = d;
                  }
          
                  // Prefer recovery if the board is already enumerated there.
                  selected = recovery != null ? recovery : runtime;
          
                  if (selected == null) {
                      line("TARGET_NOT_FOUND=true");
                      return;
                  }
          
                  line("SELECTED" + dev(selected));
                  line("SELECTED_MODE=" + (
                      ProtocolFacts.isRuntime(selected.getVendorId(), selected.getProductId())
                          ? "RUNTIME" : "RECOVERY"));
          
                  engine.inventory(selected);
          
                  if (usb.hasPermission(selected)) {
                      line("USB_PERMISSION_ALREADY_GRANTED=true");
                  } else if (requestPermission) {
                      requestUsbPermission(selected);
                  }
              }
          
              private void requestPermission() {
                  scan(false);
                  if (selected == null) {
                      toast("ยังไม่พบบอร์ด BP1048P4");
                      return;
                  }
                  requestUsbPermission(selected);
              }
          
              private void requestUsbPermission(UsbDevice d) {
                  if (d == null || usb.hasPermission(d)) return;
                  if (permissionRequestedFor == d.getDeviceId()) {
                      line("USB_PERMISSION_ALREADY_REQUESTED=true");
                      return;
                  }
          
                  Intent callback = new Intent(ACTION_USB_PERMISSION).setPackage(getPackageName());
                  PendingIntent pi = PendingIntent.getBroadcast(
                      this,
                      d.getDeviceId(),
                      callback,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_MUTABLE);
          
                  permissionRequestedFor = d.getDeviceId();
                  line("USB_PERMISSION_REQUEST=true" + dev(d));
                  usb.requestPermission(d, pi);
              }
          
