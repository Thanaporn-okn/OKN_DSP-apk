                      + "READBACK_STRATEGY=" + readbackStrategy.id() + "\n"
                      + "READBACK_STATUS=" + readbackStrategy.status() + "\n"
                      + "FEATURE_REPORT_SENT=false\n"
                      + "RECOVERY_OUTPUT_REPORT_SENT=false\n"
                      + "ERASE_SENT=false\n"
                      + "FLASH_WRITE_SENT=false\n";
          
                  String protocol =
                      "R68_KNOWN_PROTOCOL\n"
                      + "runtime frame: A5 5A <control> <length> <payload> 16\n"
                      + "runtime IF4 Input: GET_REPORT 0xA1/0x01 wValue=0x0100\n"
                      + "runtime exact version query: A55A000016 as 256-byte Output report\n"
                      + "recovery proven command names: cxxx, chiperas, bootdat, codedata, constdat, cnfgdat, btupdat, upinfo\n"
                      + "chiperas: destructive erase\n"
