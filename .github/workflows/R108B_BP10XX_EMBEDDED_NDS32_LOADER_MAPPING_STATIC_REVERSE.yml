name: R108B BP10xx embedded NDS32 loader family mapping static reverse

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R108B_BP10XX_EMBEDDED_NDS32_LOADER_MAPPING_STATIC_REVERSE.yml"

permissions:
  contents: read

concurrency:
  group: r108b-bp10xx-embedded-nds32-loader-${{ github.ref }}
  cancel-in-progress: true

env:
  DRIVE_FILE_ID: 15hdF2vnnUMVtIFKhZPGLPwBSEZpyqP2H
  SOURCE_ZIP: MVAssistant_BP10xx_V1.8.11.zip
  EXPECTED_ZIP_SHA256: 8074b3488453e268dc755fa88b2d0bc8ef14fc8c51c3de4e3a783279c195878f
  EXPECTED_EXE_SHA256: a62a968f6e9dc06473390ec26d8e1a6ad70d88c242f05acb2463e5081ec12799
  NDS_MIRROR_REPO: xingrz/nds-builder
  NDS_MIRROR_COMMIT: 572969caccb1d0c576b2893c905fa7b3396815e4
  NDS_TARBALL_NAME: nds32le-elf-mculib-v3s.4.9.4.txz
  NDS_TARBALL_GIT_BLOB_SHA1: 04f39c878b1ac9eca7628e3c6170d4eb5eb58030
  NDS_TARBALL_SIZE: "20106212"
  FLASH_ALLOWED: "NO"

jobs:
  static-reverse:
    name: NDS32 loader reverse STATIC ONLY - NO USB - NO BOARD - NO FLASH
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r108/input /tmp/r108/extract /tmp/r108/blobs /tmp/r108/evidence
          cat > /tmp/r108/evidence/R108_SAFETY.txt <<'EOF'
          R108_MODE=STATIC_OFFLINE_ONLY
          R108_VENDOR_EXE_EXECUTED=NO
          R108_EMBEDDED_LOADER_EXECUTED=NO
          R108_USB_DEVICE_ACCESS=NO
          R108_BOARD_CONTACT=NO
          R108_AA55_SENT=NO
          R108_LINEIN_AA55_SENT=NO
          R108_RUNTIME_0X11_SENT=NO
          R108_SEND_CHIPERAS_CODEDATA_BOOTDAT_CONSTDAT_CNFGDAT_BTUPDAT_UPINFO_CXXX=NO
          R108_FLASH_READ_EXECUTED=NO
          R108_FLASH_ERASE_EXECUTED=NO
          R108_FLASH_WRITE_EXECUTED=NO
          R108_ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BP1048P4=NO
          FINAL_REQUIRED_TRANSPORT=SAMSUNG_S25_PLUS_USB_C_DIRECT_TO_DSP_USB_C
          HARDWARE_MODIFICATION=FORBIDDEN
          FLASH_ALLOWED=NO
          EOF

      - name: Install host static-analysis prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            git unzip file binutils libc6-i386 lib32z1 python3-pip jq >/dev/null
          python3 -m pip install --disable-pip-version-check --no-input gdown pefile capstone >/dev/null

      - name: Acquire exact pinned MVAssistant EXE
        shell: bash
        run: |
          set -euo pipefail
          ZIP="/tmp/r108/input/$SOURCE_ZIP"
          python3 -m gdown "$DRIVE_FILE_ID" -O "$ZIP" \
            > /tmp/r108/evidence/R108_GDOWN_STDOUT.txt \
            2> /tmp/r108/evidence/R108_GDOWN_STDERR.txt || true
          if [ ! -s "$ZIP" ]; then
            curl --fail --location --retry 3 --retry-all-errors \
              "https://drive.usercontent.google.com/download?id=$DRIVE_FILE_ID&export=download&confirm=t" \
              -o "$ZIP"
          fi
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = "$EXPECTED_ZIP_SHA256"
          unzip -q "$ZIP" -d /tmp/r108/extract
          EXE="$(find /tmp/r108/extract -type f -name 'MVAssistant_BP10xx_V1.8.11.exe' -print -quit)"
          test -n "$EXE" -a -f "$EXE"
          test "$(sha256sum "$EXE" | awk '{print $1}')" = "$EXPECTED_EXE_SHA256"
          chmod a-x "$EXE" || true
          cp "$EXE" /tmp/r108/input/MVAssistant.exe
          {
            echo "ZIP_SHA256=$EXPECTED_ZIP_SHA256"
            echo "EXE_SHA256=$EXPECTED_EXE_SHA256"
            echo "EXE_SIZE=$(stat -c '%s' "$EXE")"
            echo "PIN_MATCH=YES"
          } > /tmp/r108/evidence/R108_BINARY_PIN.txt

      - name: Fetch pinned public NDS32 toolchain mirror
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/andes_r108 /tmp/nds_mirror
          mkdir -p /tmp/andes_r108 /tmp/nds_mirror

          URL="https://raw.githubusercontent.com/${NDS_MIRROR_REPO}/${NDS_MIRROR_COMMIT}/${NDS_TARBALL_NAME}"
          TAR="/tmp/nds_mirror/${NDS_TARBALL_NAME}"

          curl --fail --location --retry 4 --retry-all-errors \
            "$URL" -o "$TAR"

          test "$(stat -c '%s' "$TAR")" = "$NDS_TARBALL_SIZE"

          # GitHub contents API pins this exact file as Git blob SHA1
          # 04f39c878b1ac9eca7628e3c6170d4eb5eb58030 at the pinned commit.
          ACTUAL_BLOB_SHA="$(git hash-object "$TAR")"
          test "$ACTUAL_BLOB_SHA" = "$NDS_TARBALL_GIT_BLOB_SHA1"

          sha256sum "$TAR" > /tmp/r108/evidence/R108_NDS_TOOLCHAIN_TARBALL_SHA256.txt
          tar -xJf "$TAR" -C /tmp/andes_r108

          TOOLROOT="$(find /tmp/andes_r108 -type d -name 'nds32le-elf-mculib-v3s' -print -quit)"
          test -n "$TOOLROOT" -a -d "$TOOLROOT"
          OBJDUMP="$TOOLROOT/bin/nds32le-elf-objdump"
          test -x "$OBJDUMP"

          "$OBJDUMP" --version | head -n 3 > /tmp/r108/evidence/R108_NDS32_OBJDUMP_VERSION.txt
          "$OBJDUMP" -i > /tmp/r108/evidence/R108_NDS32_TARGETS.txt
          grep -Eai 'nds32|binary' /tmp/r108/evidence/R108_NDS32_TARGETS.txt | head -n 100 \
            > /tmp/r108/evidence/R108_NDS32_TARGET_HITS.txt

          {
            echo "NDS_MIRROR_REPO=$NDS_MIRROR_REPO"
            echo "NDS_MIRROR_COMMIT=$NDS_MIRROR_COMMIT"
            echo "NDS_TARBALL_NAME=$NDS_TARBALL_NAME"
            echo "NDS_TARBALL_SIZE=$(stat -c '%s' "$TAR")"
            echo "NDS_TARBALL_GIT_BLOB_SHA1=$ACTUAL_BLOB_SHA"
            echo "NDS32_OBJDUMP=$OBJDUMP"
            echo "TOOLCHAIN_PIN_MATCH=YES"
          } > /tmp/r108/evidence/R108_ANDES_STATE.txt
          cat /tmp/r108/evidence/R108_ANDES_STATE.txt

      - name: Carve exact three embedded loader blobs and verify R107 hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import pefile, hashlib, json, math, re

          p=Path("/tmp/r108/input/MVAssistant.exe")
          b=p.read_bytes()
          pe=pefile.PE(str(p),fast_load=False)
          ib=pe.OPTIONAL_HEADER.ImageBase

          specs=[
            ("LDR_11_P2",0x00CC0BE0,0xC160,"615cc15a22ca98ae30e020b2cbc99ea903519bb0f507d6806ad71afcd471f4fb"),
            ("LDR_12_13_COMMON",0x00CCCD40,0x8C00,"6b309c8aa2fce3bd43c09b2f5768ff62a41d05f7a16ebbf5b9c92fa720586b9f"),
            ("LDR_14_B1X",0x00CD5940,0x7708,"24a2e822b4771589138314aa8fcdfb4bd1099f1e0e8841d903f31750f4e0bf55"),
          ]
          rows=[]
          for name,va,size,expected in specs:
              off=pe.get_offset_from_rva(va-ib)
              x=b[off:off+size]
              sha=hashlib.sha256(x).hexdigest()
              if len(x)!=size or sha!=expected:
                  raise SystemExit(f"blob pin mismatch: {name}")
              (Path("/tmp/r108/blobs")/(name+".bin")).write_bytes(x)
              counts=[0]*256
              for q in x: counts[q]+=1
              ent=0.0
              for c in counts:
                  if c:
                      p0=c/len(x); ent-=p0*math.log2(p0)
              ss=[s.decode("ascii","replace") for s in re.findall(rb'[\x20-\x7e]{5,}',x)]
              rows.append({
                "name":name,"source_va":f"0x{va:08X}","size":size,
                "sha256":sha,"entropy":round(ent,5),
                "interesting_strings":[s[:240] for s in ss if re.search(
                  r'BP10|B1X|p2 downloader|HandShake|Dongle|USB|HID|UART|Flash|CRC|upgrade|download|WriteOnePackage|sramdrive',
                  s,re.I)][:200]
              })
          Path("/tmp/r108/evidence/R108_BLOB_PINS_AND_STRINGS.json").write_text(
              json.dumps(rows,indent=2,ensure_ascii=False)+"\n"
          )
          PY

      - name: Disassemble all three raw blobs as NDS32 n1h_v3m
        shell: bash
        run: |
          set -euo pipefail
          TOOLROOT="$(find /tmp/andes_r108 -type d -name 'nds32le-elf-mculib-v3s' -print -quit)"
          test -n "$TOOLROOT" -a -d "$TOOLROOT"
          OBJDUMP="$TOOLROOT/bin/nds32le-elf-objdump"

          : > /tmp/r108/evidence/R108_DISASM_SUMMARY.txt
          for f in /tmp/r108/blobs/*.bin; do
            base="$(basename "$f" .bin)"
            out="/tmp/r108/${base}.disasm.txt"
            "$OBJDUMP" -D -b binary -m n1h_v3m "$f" > "$out"
            test -s "$out"
            {
              echo "===== $base ====="
              echo "BYTES=$(stat -c '%s' "$f")"
              echo "DISASM_LINES=$(wc -l < "$out")"
              echo "UNKNOWN_LINES=$(grep -Eci 'unknown|\\.word|\\.short' "$out" || true)"
              echo "BRANCH_CALL_LINES=$(grep -Eci '\\b(jal|jral|jr|beq|bne|bgez|bltz|bnez|beqz)\\b' "$out" || true)"
              echo "LOAD_STORE_LINES=$(grep -Eci '\\b(lw|lh|lb|sw|sh|sb|lwi|swi)\\b' "$out" || true)"
            } >> /tmp/r108/evidence/R108_DISASM_SUMMARY.txt
            cp "$out" "/tmp/r108/evidence/R108_${base}_NDS32_DISASM.txt"
          done
          cat /tmp/r108/evidence/R108_DISASM_SUMMARY.txt

      - name: Extract exact string offsets inside each loader
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,json

          rows={}
          for p in sorted(Path("/tmp/r108/blobs").glob("*.bin")):
              b=p.read_bytes()
              ss=[]
              for m in re.finditer(rb'[\x20-\x7e]{5,}',b):
                  text=m.group().decode("ascii","replace")
                  if re.search(
                    r'BP10|B1X|p2 downloader|HandShake|Dongle|USB|HID|UART|Flash|CRC|upgrade|download|WriteOnePackage|PackageInfo|sramdrive|RecvData|KeyId|CheckSum',
                    text,re.I
                  ):
                      ss.append({"offset":m.start(),"hex_offset":f"0x{m.start():X}","text":text[:400]})
              rows[p.stem]=ss
          Path("/tmp/r108/evidence/R108_LOADER_STRING_OFFSETS.json").write_text(
              json.dumps(rows,indent=2,ensure_ascii=False)+"\n"
          )
          PY

      - name: Find NDS32 disassembly references near loader string offsets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          ev=Path("/tmp/r108/evidence")
          strings=json.loads((ev/"R108_LOADER_STRING_OFFSETS.json").read_text())
          allrows=[]
          for name,items in strings.items():
              dp=ev/f"R108_{name}_NDS32_DISASM.txt"
              lines=dp.read_text(errors="replace").splitlines()
              parsed=[]
              for idx,line in enumerate(lines):
                  m=re.match(r'^\s*([0-9a-fA-F]+):\s+',line)
                  if m:
                      parsed.append((idx,int(m.group(1),16),line))
              for s in items:
                  off=s["offset"]
                  candidates=[]
                  forms={f"{off:x}",f"0x{off:x}",f"{off:08x}"}
                  for idx,addr,line in parsed:
                      low=line.lower()
                      if any(form in low for form in forms):
                          candidates.append({"line_index":idx,"insn_addr":addr,"line":line})
                  contexts=[]
                  for c in candidates[:30]:
                      a=max(0,c["line_index"]-8); z=min(len(lines),c["line_index"]+9)
                      contexts.append(lines[a:z])
                  allrows.append({
                    "loader":name,"string_offset":off,"string":s["text"],
                    "direct_textual_ref_count":len(candidates),
                    "contexts":contexts[:10]
                  })
          (ev/"R108_STRING_DISASM_XREFS.json").write_text(
              json.dumps(allrows,indent=2,ensure_ascii=False)+"\n"
          )
          PY

      - name: Capture all MCU family labels and static xrefs in MVAssistant
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import pefile,re,json
          from capstone import Cs,CS_ARCH_X86,CS_MODE_32
          from capstone.x86 import X86_OP_IMM,X86_OP_MEM

          p=Path("/tmp/r108/input/MVAssistant.exe")
          b=p.read_bytes(); pe=pefile.PE(str(p),fast_load=False); ib=pe.OPTIONAL_HEADER.ImageBase

          labels=[]
          seen=set()
          for m in re.finditer(rb'MCU-[\x20-\x7e]{1,40}',b):
              raw=m.group().split(b'\x00',1)[0]
              text=raw.decode("ascii","replace").strip()
              # Keep only compact label-looking strings.
              text=re.split(r'[^A-Za-z0-9_+./() -]',text)[0].strip()
              if not text.startswith("MCU-") or len(text)>48: continue
              key=(m.start(),text)
              if key in seen: continue
              seen.add(key)
              try:rva=pe.get_rva_from_offset(m.start())
              except:continue
              labels.append({"text":text,"raw":m.start(),"rva":rva,"va":ib+rva})

          s=next(x for x in pe.sections if x.Name.rstrip(b"\0")==b".text")
          md=Cs(CS_ARCH_X86,CS_MODE_32); md.detail=True
          ins=list(md.disasm(b[s.PointerToRawData:s.PointerToRawData+s.SizeOfRawData],ib+s.VirtualAddress))
          byva={x["va"]:x for x in labels}
          refs=[]
          for x in ins:
              vals=set()
              for op in x.operands:
                  if op.type==X86_OP_IMM:
                      vals.add(op.imm & 0xffffffff)
                  elif op.type==X86_OP_MEM and op.mem.base==0 and op.mem.index==0:
                      vals.add(op.mem.disp & 0xffffffff)
              for va in vals:
                  if va in byva:
                      refs.append({
                        "label":byva[va]["text"],"label_va":va,
                        "xref_va":x.address,"mnemonic":x.mnemonic,"op_str":x.op_str
                      })

          Path("/tmp/r108/evidence/R108_MCU_LABELS.json").write_text(
              json.dumps(labels,indent=2,ensure_ascii=False)+"\n")
          Path("/tmp/r108/evidence/R108_MCU_LABEL_XREFS.json").write_text(
              json.dumps(refs,indent=2,ensure_ascii=False)+"\n")
          print("MCU_LABEL_COUNT",len(labels))
          print("MCU_LABEL_XREF_COUNT",len(refs))
          for x in labels: print(x["text"])
          PY

      - name: Record exact MVAssistant branch-code to embedded-loader mapping
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r108/evidence/R108_STATIC_BRANCH_MAPPING.txt <<'EOF'
          SOURCE=MVAssistant_BP10xx_V1.8.11.exe pinned SHA256 a62a968f6e9dc06473390ec26d8e1a6ad70d88c242f05acb2463e5081ec12799
          EVIDENCE_FROM_R107_CONTROL_FLOW:
          LOADER_CODE_0x11 -> source VA 0x00CC0BE0, size 0xC160, SHA256 615cc15a22ca98ae30e020b2cbc99ea903519bb0f507d6806ad71afcd471f4fb
          LOADER_CODE_0x12 -> source VA 0x00CCCD40, size 0x8C00, SHA256 6b309c8aa2fce3bd43c09b2f5768ff62a41d05f7a16ebbf5b9c92fa720586b9f
          LOADER_CODE_0x13 -> source VA 0x00CCCD40, size 0x8C00, SHA256 6b309c8aa2fce3bd43c09b2f5768ff62a41d05f7a16ebbf5b9c92fa720586b9f
          LOADER_CODE_0x14 -> source VA 0x00CD5940, size 0x7708, SHA256 24a2e822b4771589138314aa8fcdfb4bd1099f1e0e8841d903f31750f4e0bf55
          IMPORTANT=These code values are MVAssistant internal loader-selection values, not USB command IDs and not authorized board packets.
          EOF

      - name: Classify target-side transport evidence conservatively
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          ev=Path("/tmp/r108/evidence")
          rows=json.loads((ev/"R108_BLOB_PINS_AND_STRINGS.json").read_text())
          out=[]
          for r in rows:
              t="\n".join(r["interesting_strings"])
              out.append({
                "loader":r["name"],
                "sha256":r["sha256"],
                "has_uart_literal":bool(re.search(r"\bUart[0-9]?|UART",t,re.I)),
                "has_usb_or_hid_literal":bool(re.search(r"\bUSB\b|\bHID\b|\bOTG\b",t,re.I)),
                "has_p2_downloader_literal":bool(re.search(r"p2 downloader",t,re.I)),
                "has_b1x_downloader_literal":bool(re.search(r"B1X",t,re.I)),
                "has_handshake2dongle_literal":bool(re.search(r"HandShake2Dongle",t,re.I)),
                "has_flash_write_literal":bool(re.search(r"WriteOnePackageDataToFlash",t,re.I)),
                "has_crc_literal":bool(re.search(r"CRC|CheckSum",t,re.I)),
              })
          (ev/"R108_LOADER_TRANSPORT_MARKERS.json").write_text(
              json.dumps(out,indent=2,ensure_ascii=False)+"\n")
          PY

      - name: Build fail-closed R108 decision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          ev=Path("/tmp/r108/evidence")
          blobs=json.loads((ev/"R108_BLOB_PINS_AND_STRINGS.json").read_text())
          labels=json.loads((ev/"R108_MCU_LABELS.json").read_text())
          refs=json.loads((ev/"R108_MCU_LABEL_XREFS.json").read_text())
          markers=json.loads((ev/"R108_LOADER_TRANSPORT_MARKERS.json").read_text())
          xs=json.loads((ev/"R108_STRING_DISASM_XREFS.json").read_text())

          d={
            "PINNED_MVASSISTANT_EXE":True,
            "PINNED_ANDES_NDS32_TOOLCHAIN":True,
            "NDS32_MACHINE":"n1h_v3m",
            "EMBEDDED_LOADER_COUNT":len(blobs),
            "LOADER_SELECTION_CODES":{
              "0x11":"LDR_11_P2",
              "0x12":"LDR_12_13_COMMON",
              "0x13":"LDR_12_13_COMMON",
              "0x14":"LDR_14_B1X"
            },
            "MCU_LABELS_FOUND":[x["text"] for x in labels],
            "MCU_LABEL_XREF_COUNT":len(refs),
            "LOADER_TRANSPORT_MARKERS":markers,
            "STRING_TO_NDS32_DIRECT_XREF_ROWS_WITH_HITS":sum(1 for x in xs if x["direct_textual_ref_count"]>0),
            "EXACT_MCU_BP10_TO_LOADER_CODE_MAPPING_PROVEN":False,
            "DONGLE_TO_TARGET_USB_PROTOCOL_PROVEN":False,
            "DONGLE_TO_TARGET_UART_PROTOCOL_PROVEN_FOR_BP10":False,
            "PRODUCTION_GOLOPINE_BP1048P4_BOOT_ENTRY_PROVEN":False,
            "PRODUCTION_RECOVERY_USB_IDENTITY_PROVEN":False,
            "SAFE_READ_ONLY_PRODUCTION_BACKUP_PROVEN":False,
            "ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD":False,
            "NEXT":"MAP_MCU_BP10_UI_SELECTION_TO_LOADER_CODE_AND_INTERPRET_NDS32_LOADER_IO_PATH_OFFLINE",
            "FLASH_ALLOWED":False
          }
          (ev/"R108_DECISION.json").write_text(
              json.dumps(d,indent=2,ensure_ascii=False)+"\n")
          report=[
            "# R108 BP10xx embedded NDS32 loader family mapping",
            "",
            "Static/offline only. Vendor EXE and embedded loaders are treated as data and never executed.",
            "",
            "```json",json.dumps(d,indent=2,ensure_ascii=False),"```",
            "",
            "Gate:",
            "- Internal loader code 0x11/0x12/0x13/0x14 is not a USB command ID.",
            "- UART/USB marker strings do not prove the physical production BP1048P4 transport until MCU-BP10 is mapped to the loader branch and code path.",
            "- No packet or loader is authorized for the board.",
            "- Final route remains Samsung S25+ -> USB-C -> DSP USB-C, no hardware modification.",
            "- No AA55 repeat, no runtime 0x11, no legacy flash commands.",
            "- FLASH_ALLOWED=NO."
          ]
          (ev/"R108_REPORT.md").write_text("\n".join(report)+"\n")
          print(json.dumps(d,indent=2,ensure_ascii=False))
          PY

      - name: Package evidence only - exclude EXE and raw loader blobs
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r108/evidence
          zip -9 -r /tmp/R108B_BP10XX_EMBEDDED_NDS32_LOADER_STATIC_EVIDENCE.zip .
          sha256sum /tmp/R108B_BP10XX_EMBEDDED_NDS32_LOADER_STATIC_EVIDENCE.zip \
            > /tmp/R108B_BP10XX_EMBEDDED_NDS32_LOADER_STATIC_EVIDENCE.zip.sha256

      - name: Upload R108 evidence
        uses: actions/upload-artifact@v4
        with:
          name: R108B-BP10XX-EMBEDDED-NDS32-LOADER-STATIC-EVIDENCE
          path: |
            /tmp/R108B_BP10XX_EMBEDDED_NDS32_LOADER_STATIC_EVIDENCE.zip
            /tmp/R108B_BP10XX_EMBEDDED_NDS32_LOADER_STATIC_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'R108_VENDOR_EXE_EXECUTED=NO' /tmp/r108/evidence/R108_SAFETY.txt
          grep -F 'R108_EMBEDDED_LOADER_EXECUTED=NO' /tmp/r108/evidence/R108_SAFETY.txt
          grep -F 'R108_USB_DEVICE_ACCESS=NO' /tmp/r108/evidence/R108_SAFETY.txt
          grep -F 'R108_ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BP1048P4=NO' /tmp/r108/evidence/R108_SAFETY.txt
          grep -F 'FLASH_ALLOWED=NO' /tmp/r108/evidence/R108_SAFETY.txt
          cat /tmp/r108/evidence/R108_DECISION.json
          echo R108B_STATIC_REVERSE_COMPLETE=YES
          echo FLASH_ALLOWED=NO
