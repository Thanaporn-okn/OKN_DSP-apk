name: OKN BP1048P4 MASTER V15 COMMAND CALLSITE + REPORT OBJECT PROOF

"on":
  workflow_dispatch:

permissions:
  contents: read

env:
  GOLOPINE_WINDOWS_URL: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-08.exe_.zip"
  LIVE_DSP_CONNECTED: "NO"
  USB_TARGET_ACCESS: "NO"
  HOST_TO_DSP_IO: "NO"
  HID_CONNECT_ALLOWED: "NO"
  HID_SEND_ALLOWED: "NO"
  HID_READ_ALLOWED: "NO"
  HID_WRITE_ALLOWED: "NO"
  FEATURE_REPORT_ALLOWED: "NO"
  FLASH_ALLOWED: "NO"
  ERASE_ALLOWED: "NO"
  WRITE_ALLOWED: "NO"

jobs:
  master-v15:
    name: MASTER V15 command callsite and report object proof offline
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Safety gate and workspace
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          foreach($n in @(
            "LIVE_DSP_CONNECTED","USB_TARGET_ACCESS","HOST_TO_DSP_IO",
            "HID_CONNECT_ALLOWED","HID_SEND_ALLOWED","HID_READ_ALLOWED","HID_WRITE_ALLOWED",
            "FEATURE_REPORT_ALLOWED","FLASH_ALLOWED","ERASE_ALLOWED","WRITE_ALLOWED"
          )){
            if((Get-Item "Env:$n").Value -ne "NO"){throw "$n must be NO"}
          }

          $root="C:\okn_v15"
          if(Test-Path $root){Remove-Item -Recurse -Force $root}
          New-Item -ItemType Directory -Force -Path `
            "$root\download","$root\pkg","$root\harness","$root\evidence","$root\out" | Out-Null

          @"
          MODE=OFFLINE_COMMAND_CALLSITE_AND_REPORT_OBJECT_PROOF
          LIVE_DSP_CONNECTED=NO
          USB_TARGET_ACCESS=NO
          HOST_TO_DSP_IO=NO
          FEATURE_REPORT_ALLOWED=NO
          FLASH_ALLOWED=NO
          "@ | Set-Content "$root\evidence\00_SAFETY.txt"

      - name: Download untouched official vendor EXE
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v15"

          curl.exe -fL --retry 6 --retry-all-errors --retry-delay 2 `
            --connect-timeout 20 --max-time 300 `
            $env:GOLOPINE_WINDOWS_URL -o "$root\download\vendor.zip"
          if($LASTEXITCODE -ne 0){throw "vendor download failed"}

          Expand-Archive -Force "$root\download\vendor.zip" "$root\pkg"

          $exe=Get-ChildItem "$root\pkg" -Recurse -File -Filter *.exe |
            Where-Object {$_.FullName -notmatch '\\__MACOSX\\' -and $_.Name -notlike '._*'} |
            Sort-Object Length -Descending | Select-Object -First 1

          if(-not $exe){throw "vendor EXE missing"}
          Copy-Item $exe.FullName "$root\vendor.exe" -Force

          $b=[IO.File]::ReadAllBytes("$root\vendor.exe")
          if($b.Length -lt 100000 -or $b[0] -ne 0x4D -or $b[1] -ne 0x5A){
            throw "bad PE"
          }

          @"
          BYTES=$($b.Length)
          SHA256=$((Get-FileHash "$root\vendor.exe" -Algorithm SHA256).Hash)
          ORIGINAL_BINARY_MODIFIED=NO
          "@ | Set-Content "$root\evidence\01_VENDOR_IDENTITY.txt"

      - name: Build x86 whole-assembly JIT metadata probe
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v15"

          @'
          using System;
          using System.IO;
          using System.Linq;
          using System.Reflection;
          using System.Runtime.CompilerServices;
          using System.Runtime.InteropServices;
          using System.Threading;
          using System.Collections.Generic;

          class Probe
          {
              static List<string> L=new List<string>();

              static bool Include(Type t)
              {
                  if(t==null)return false;
                  string n=t.FullName ?? "";
                  if(n.StartsWith("DSTech_AudioDSP_Client."))return true;
                  if(n.StartsWith("BHWnxZ6spmGFPV1vs95."))return true;
                  return false;
              }

              static void Meta(Type t)
              {
                  L.Add("TYPE|"+t.FullName+
                        "|BASE="+(t.BaseType==null?"":t.BaseType.FullName));

                  foreach(FieldInfo f in t.GetFields(
                      BindingFlags.Public|BindingFlags.NonPublic|
                      BindingFlags.Static|BindingFlags.Instance|
                      BindingFlags.DeclaredOnly))
                  {
                      L.Add("FIELD|"+t.FullName+"::"+f.Name+
                            "|TYPE="+f.FieldType.FullName+
                            "|STATIC="+f.IsStatic);
                  }

                  foreach(PropertyInfo p in t.GetProperties(
                      BindingFlags.Public|BindingFlags.NonPublic|
                      BindingFlags.Static|BindingFlags.Instance|
                      BindingFlags.DeclaredOnly))
                  {
                      L.Add("PROPERTY|"+t.FullName+"::"+p.Name+
                            "|TYPE="+p.PropertyType.FullName);
                  }

                  foreach(MethodBase mb in
                      t.GetConstructors(
                        BindingFlags.Public|BindingFlags.NonPublic|
                        BindingFlags.Static|BindingFlags.Instance
                      ).Cast<MethodBase>()
                      .Concat(t.GetMethods(
                        BindingFlags.Public|BindingFlags.NonPublic|
                        BindingFlags.Static|BindingFlags.Instance|
                        BindingFlags.DeclaredOnly
                      ).Cast<MethodBase>()))
                  {
                      MethodInfo mi=mb as MethodInfo;
                      if(mi!=null)
                      {
                          object[] a=mi.GetCustomAttributes(typeof(DllImportAttribute),false);
                          foreach(object o in a)
                          {
                              var d=(DllImportAttribute)o;
                              L.Add("DLLIMPORT|"+t.FullName+"::"+mi.Name+
                                    "|DLL="+d.Value+
                                    "|ENTRY="+(d.EntryPoint ?? "")+
                                    "|TOKEN="+mi.MetadataToken.ToString("X8")+
                                    "|SIG="+mi.ToString());
                          }
                      }

                      try
                      {
                          if(mb.ContainsGenericParameters)continue;
                          RuntimeHelpers.PrepareMethod(mb.MethodHandle);
                          IntPtr p=mb.MethodHandle.GetFunctionPointer();
                          L.Add("METHOD|"+t.FullName+"::"+mb.Name+
                                "|"+mb.MetadataToken.ToString("X8")+
                                "|0x"+p.ToInt64().ToString("X")+
                                "|"+mb.ToString());
                      }
                      catch(Exception ex)
                      {
                          L.Add("PREPARE_EXCEPTION|"+t.FullName+"::"+mb.Name+
                                "|"+mb.MetadataToken.ToString("X8")+
                                "|"+ex.GetBaseException().GetType().FullName+
                                "|"+ex.GetBaseException().Message);
                      }
                  }
              }

              static void Main(string[] a)
              {
                  string exe=Path.GetFullPath(a[0]);
                  string outp=Path.GetFullPath(a[1]);
                  Directory.SetCurrentDirectory(Path.GetDirectoryName(exe));

                  L.Add("PID|"+System.Diagnostics.Process.GetCurrentProcess().Id);
                  L.Add("REAL_HID_INVOKED|NO");
                  L.Add("HOST_TO_DSP_IO|NO");

                  Assembly asm=Assembly.LoadFile(exe);
                  RuntimeHelpers.RunModuleConstructor(asm.ManifestModule.ModuleHandle);
                  L.Add("MODULE_INITIALIZER|SUCCESS");

                  Type[] ts=asm.GetTypes().Where(Include).OrderBy(x=>x.FullName).ToArray();
                  L.Add("TYPE_COUNT|"+ts.Length);
                  foreach(Type t in ts)Meta(t);

                  File.WriteAllLines(outp,L.ToArray());
                  Console.WriteLine("READY");
                  Console.Out.Flush();
                  Thread.Sleep(25000);
              }
          }
          '@ | Set-Content "$root\harness\Probe.cs"

          $csc="$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          if(-not(Test-Path $csc)){throw "x86 compiler missing"}

          & $csc /nologo /platform:x86 /target:exe `
            /out:"$root\harness\Probe.exe" "$root\harness\Probe.cs"
          if($LASTEXITCODE -ne 0){throw "Probe compile failed"}

      - name: Static audit probe is metadata and JIT only
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $s=Get-Content "C:\okn_v15\harness\Probe.cs" -Raw
          if($s -match '\.Invoke\('){throw "reflection invocation forbidden"}
          if($s -match 'HidD_SetOutputReport\('){throw "native HID call forbidden"}
          if($s -match 'HidD_GetInputReport\('){throw "native HID call forbidden"}
          if($s -match 'ReadFile\(' -or $s -match 'WriteFile\('){throw "native file IO call forbidden"}
          "STATIC_AUDIT=PASS" |
            Set-Content "C:\okn_v15\evidence\02_STATIC_AUDIT.txt"

      - name: Range-bounded disassembly and reverse call graph
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v15"
          $map="$root\evidence\03_RUNTIME_MAP.txt"

          python -m pip install --disable-pip-version-check --quiet capstone

          @'
          from pathlib import Path
          import ctypes,json,struct,sys,re
          from capstone import Cs,CS_ARCH_X86,CS_MODE_32,CS_OP_IMM,CS_OP_MEM
          from capstone.x86_const import X86_REG_INVALID

          pid=int(sys.argv[1])
          mp=Path(sys.argv[2])
          ev=Path(sys.argv[3])
          lines=mp.read_text(errors="ignore").splitlines()

          methods=[]
          ptr_name={}
          fields=[]
          props=[]
          imports=[]

          for l in lines:
              if l.startswith("METHOD|"):
                  _,name,tok,phex,sig=l.split("|",4)
                  p=int(phex,16)
                  methods.append(dict(name=name,token=tok,ptr=p,sig=sig))
                  ptr_name[p]=name
              elif l.startswith("FIELD|"): fields.append(l)
              elif l.startswith("PROPERTY|"): props.append(l)
              elif l.startswith("DLLIMPORT|"): imports.append(l)

          k=ctypes.WinDLL("kernel32",use_last_error=True)
          k.OpenProcess.argtypes=[ctypes.c_uint32,ctypes.c_int,ctypes.c_uint32]
          k.OpenProcess.restype=ctypes.c_void_p
          k.ReadProcessMemory.argtypes=[
              ctypes.c_void_p,ctypes.c_void_p,ctypes.c_void_p,
              ctypes.c_size_t,ctypes.POINTER(ctypes.c_size_t)
          ]
          k.ReadProcessMemory.restype=ctypes.c_int
          k.CloseHandle.argtypes=[ctypes.c_void_p]

          h=k.OpenProcess(0x0010|0x0400,False,pid)
          if not h: raise SystemExit("OpenProcess failed "+str(ctypes.get_last_error()))

          def rpm(addr,n):
              b=(ctypes.c_ubyte*n)()
              got=ctypes.c_size_t()
              ok=k.ReadProcessMemory(h,ctypes.c_void_p(addr),ctypes.byref(b),n,ctypes.byref(got))
              return bool(ok),bytes(b[:got.value])

          def u32(addr):
              ok,b=rpm(addr,4)
              return struct.unpack("<I",b)[0] if ok and len(b)==4 else None

          def follow(cur):
              chain=[]
              for _ in range(12):
                  ok,b=rpm(cur,32)
                  if not ok or len(b)<2:break
                  chain.append({"addr":cur,"first16":b[:16].hex().upper()})
                  if b[0]==0xE9 and len(b)>=5:
                      cur=cur+5+struct.unpack_from("<i",b,1)[0];continue
                  if b[0]==0xEB and len(b)>=2:
                      cur=cur+2+struct.unpack_from("<b",b,1)[0];continue
                  if b[:2]==b"\xFF\x25" and len(b)>=6:
                      slot=struct.unpack_from("<I",b,2)[0]
                      nxt=u32(slot)
                      if nxt:cur=nxt;continue
                  if b[0]==0x68 and len(b)>=6 and b[5]==0xC3:
                      cur=struct.unpack_from("<I",b,1)[0];continue
                  if b[0]==0xB8 and len(b)>=7 and b[5:7]==b"\xFF\xE0":
                      cur=struct.unpack_from("<I",b,1)[0];continue
                  break
              return cur,chain

          resolved=[]
          for m in methods:
              r,ch=follow(m["ptr"])
              resolved.append({**m,"resolved":r,"chain":ch})

          # Build method bounds from the next distinct prepared entry.
          starts=sorted(set(x["resolved"] for x in resolved))
          next_start={}
          for i,a in enumerate(starts):
              next_start[a]=starts[i+1] if i+1<len(starts) else a+4096

          exact={}
          for x in resolved:
              exact.setdefault(x["resolved"],[]).append(x["name"])

          def sym(target):
              if target in exact:return exact[target][0]
              return None

          md=Cs(CS_ARCH_X86,CS_MODE_32)
          md.detail=True
          edges=[]
          dis={}

          for x in resolved:
              start=x["resolved"]
              stop=min(next_start[start],start+4096)
              size=max(1,stop-start)
              ok,b=rpm(start,size)
              if not ok or not b:continue
              out=[]
              for ins in md.disasm(b,start):
                  if ins.address>=stop:break
                  ann=""
                  if ins.mnemonic=="call" and ins.operands:
                      target=None; kind=None
                      op=ins.operands[0]
                      if op.type==CS_OP_IMM:
                          target=op.imm & 0xffffffff; kind="direct"
                      elif op.type==CS_OP_MEM:
                          mem=op.mem
                          if mem.base==X86_REG_INVALID and mem.index==X86_REG_INVALID:
                              slot=mem.disp & 0xffffffff
                              val=u32(slot)
                              if val:
                                  target=val & 0xffffffff
                                  kind=f"indirect@[0x{slot:X}]"
                      if target is not None:
                          s=sym(target)
                          edges.append({
                              "from":x["name"],"from_token":x["token"],
                              "at":f"0x{ins.address:X}",
                              "target":f"0x{target:X}",
                              "kind":kind,"symbol":s
                          })
                          if s: ann=f" ; CALL {kind} 0x{target:X} => {s}"
                  out.append(f"{ins.address:08X}: {ins.mnemonic} {ins.op_str}".rstrip()+ann)
              dis[x["name"]+"|"+x["token"]]=out

          k.CloseHandle(h)

          (ev/"04_FIELDS.txt").write_text("\n".join(fields)+"\n")
          (ev/"05_PROPERTIES.txt").write_text("\n".join(props)+"\n")
          (ev/"06_DLLIMPORTS.txt").write_text("\n".join(imports)+"\n")
          (ev/"07_BOUNDED_CALL_EDGES.json").write_text(json.dumps(edges,indent=2)+"\n")

          focus=[
              "BHWnxZ6spmGFPV1vs95.neOkHj6BdZDIamOJWhM::Write",
              "BHWnxZ6spmGFPV1vs95.neOkHj6BdZDIamOJWhM::Connect",
              "DSTech_AudioDSP_Client.HIDInterface::Send",
              "DSTech_AudioDSP_Client.HIDInterface::Connect",
              "DSTech_AudioDSP_Client.HIDInterface::AutoConnect",
              "DSTech_AudioDSP_Client.Hid::Write",
              "DSTech_AudioDSP_Client.Hid::Read",
              "DSTech_AudioDSP_Client.Hid::OpenDevice",
              "DSTech_AudioDSP_Client.report::.ctor",
              "DSTech_AudioDSP_Client.GetDevcieDescriptionCommand::ToByteArray",
              "DSTech_AudioDSP_Client.UFEcommandBridge::SendDeviceDescriptionRequest",
              "DSTech_AudioDSP_Client.UFEcommandBridge::sendCommandFromQueue"
          ]

          txt=[]
          for k2,v in dis.items():
              if any(k2.startswith(x+"|") for x in focus):
                  txt.append("\n===== "+k2+" =====\n"+"\n".join(v)+"\n")
          (ev/"08_FOCUSED_BOUNDED_DISASSEMBLY.txt").write_text("".join(txt))

          # Reverse call graph to prove whether Get Device Description is actually reachable.
          rev={}
          for e in edges:
              if e.get("symbol"):
                  rev.setdefault(e["symbol"],set()).add(e["from"])

          targets=[
              "DSTech_AudioDSP_Client.UFEcommandBridge::SendDeviceDescriptionRequest",
              "DSTech_AudioDSP_Client.GetDevcieDescriptionCommand::ToByteArray"
          ]

          callsites={}
          for target in targets:
              seen={target}
              frontier=[target]
              levels=[]
              for depth in range(6):
                  parents=set()
                  for cur in frontier:
                      parents.update(rev.get(cur,set()))
                  parents-=seen
                  levels.append(sorted(parents))
                  seen|=parents
                  frontier=list(parents)
                  if not frontier:break
              callsites[target]=levels

          (ev/"09_GET_DESCRIPTION_REVERSE_CALL_GRAPH.json").write_text(
              json.dumps(callsites,indent=2)+"\n"
          )

          # Record all direct callers and all methods whose names hint UI/startup/product paths.
          hints=[]
          for m in methods:
              n=m["name"].lower()
              if any(x in n for x in [
                  "main","window","form","view","page","device","connect",
                  "usb","hid","ufe","description","init","start","load"
              ]):
                  hints.append(m)
          (ev/"10_RELEVANT_METHOD_INVENTORY.json").write_text(
              json.dumps(hints,indent=2)+"\n"
          )

          print("METHODS",len(methods))
          print("BOUNDED_EDGES",len(edges))
          for t,lv in callsites.items():
              print("TARGET",t)
              for i,x in enumerate(lv,1):
                  print(" DEPTH",i,"COUNT",len(x))
                  for n in x[:40]:print("  ",n)
          '@ | Set-Content "$root\analyze.py"

          $p=Start-Process `
            -FilePath "$root\harness\Probe.exe" `
            -ArgumentList @("$root\vendor.exe",$map) `
            -WorkingDirectory $root `
            -RedirectStandardOutput "$root\evidence\03A_STDOUT.txt" `
            -RedirectStandardError "$root\evidence\03B_STDERR.txt" `
            -PassThru

          $ready=$false
          for($i=0;$i -lt 120;$i++){
            Start-Sleep -Milliseconds 100
            if(Test-Path $map){$ready=$true;break}
            if($p.HasExited){break}
          }
          if(-not $ready){
            if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
            throw "runtime map missing"
          }

          try{
            python "$root\analyze.py" $p.Id $map "$root\evidence"
            if($LASTEXITCODE -ne 0){throw "analyzer failed"}
          } finally {
            if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
          }

      - name: Derive exact report semantics and command reachability
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v15"

          @'
          from pathlib import Path
          import json,re

          ev=Path(r"C:\okn_v15\evidence")
          dis=(ev/"08_FOCUSED_BOUNDED_DISASSEMBLY.txt").read_text(errors="ignore")
          calls=json.loads((ev/"09_GET_DESCRIPTION_REVERSE_CALL_GRAPH.json").read_text())
          fields=(ev/"04_FIELDS.txt").read_text(errors="ignore")
          imports=(ev/"06_DLLIMPORTS.txt").read_text(errors="ignore")

          def section(name):
              m=re.search(
                  r"===== "+re.escape(name)+r"\|[0-9A-F]+ =====\n(.*?)(?=\n=====|\Z)",
                  dis,re.S
              )
              return m.group(1) if m else ""

          usbw=section("BHWnxZ6spmGFPV1vs95.neOkHj6BdZDIamOJWhM::Write")
          send=section("DSTech_AudioDSP_Client.HIDInterface::Send")
          hidw=section("DSTech_AudioDSP_Client.Hid::Write")
          ctor=section("DSTech_AudioDSP_Client.report::.ctor")

          # These are x86 .NET object-layout observations:
          # byte[] +4 = array Length; byte[] +8 = first data byte.
          usb_reads_array_length="+ 4]" in usbw and "HIDInterface::Send" in usbw
          send_reads_array_length="+ 4]" in send and "Hid::Write" in send
          hid_write_reads_report_data="+ 4]" in hidw
          hid_write_reads_report_id="+ 8]" in hidw
          report_ctor_present=bool(ctor)

          parents=calls.get(
              "DSTech_AudioDSP_Client.UFEcommandBridge::SendDeviceDescriptionRequest",[]
          )
          direct=parents[0] if parents else []
          upstream=sum((x for x in parents),[])

          facts={
              "revision":"MASTER-V15",
              "dotnet_x86_byte_array_length_offset":4,
              "dotnet_x86_byte_array_data_offset":8,

              "ufe_command_hex":"661C0624",
              "usbhid_write_expected_data_hex":"04661C0624",
              "hidinterface_send_expected_data_hex":"0504661C0624",
              "report_id_expected_hex":"00",
              "windows_hidd_setoutputreport_buffer_prefix_hex":"000504661C0624",
              "android_set_report_data_prefix_hex":"0504661C0624",

              "usb_write_reads_array_length":usb_reads_array_length,
              "hidinterface_send_reads_array_length":send_reads_array_length,
              "hid_write_reads_report_data_field":hid_write_reads_report_data,
              "hid_write_reads_report_id_field":hid_write_reads_report_id,
              "report_constructor_captured":report_ctor_present,

              "hidd_setoutputreport_import_present":"ENTRY=HidD_SetOutputReport" in imports,
              "hidd_getinputreport_import_present":"ENTRY=HidD_GetInputReport" in imports,

              "get_description_direct_callers":direct,
              "get_description_reverse_call_graph":parents,
              "get_description_upstream_unique":sorted(set(upstream)),

              "v12_physical_result":"WIRE_PREFIX_0504661C0624_SET_REPORT_256_BUT_NO_INPUT_RESPONSE",
              "v14_physical_result":"WIRE_PREFIX_0404661C0624_SET_REPORT_256_BUT_NO_INPUT_RESPONSE",

              "live_dsp_connected":False,
              "host_to_dsp_io":False,
              "feature_report_invoked":False,
              "flash_allowed":False
          }

          uiish=[
              n for n in facts["get_description_upstream_unique"]
              if any(x in n.lower() for x in [
                  "main","window","form","view","page","device","connect",
                  "init","start","load"
              ])
          ]
          facts["get_description_ui_or_startup_upstream"]=uiish

          if uiish:
              facts["status"]="GET_DESCRIPTION_REACHABLE_FROM_APPLICATION_PATH_REVIEW_EXACT_CALLER_CONTEXT"
          elif direct:
              facts["status"]="GET_DESCRIPTION_HAS_CALLERS_BUT_UI_STARTUP_REACHABILITY_NOT_YET_PROVEN"
          else:
              facts["status"]="GET_DESCRIPTION_NO_PREPARED_CALLER_PROVEN_POSSIBLY_LIBRARY_ONLY_OR_VIRTUAL_PATH"

          (ev/"11_V15_FINAL_DECISION.json").write_text(json.dumps(facts,indent=2)+"\n")

          md=f"""# MASTER V15 FINAL DECISION

          - Correct UFE command: **66 1C 06 24**
          - USBHID.Write data: **04 66 1C 06 24**
          - HIDInterface.Send data: **05 04 66 1C 06 24**
          - Windows HID API buffer prefix: **00 05 04 66 1C 06 24**
          - Android SET_REPORT data prefix equivalent: **05 04 66 1C 06 24**
          - HidD_SetOutputReport import present: **{facts['hidd_setoutputreport_import_present']}**
          - HidD_GetInputReport import present: **{facts['hidd_getinputreport_import_present']}**
          - Get-description direct callers recovered: **{len(direct)}**
          - UI/startup-like upstream callers recovered: **{len(uiish)}**
          - Real HID invoked: **NO**
          - Host-to-DSP I/O: **NO**
          - Feature report invoked: **NO**
          - Flash allowed: **NO**

          Status: **{facts['status']}**

          Important: V12 used the vendor-equivalent Android prefix 05 04 66 1C 06 24 and still received no input response.
          Therefore no new live command should be guessed from framing alone.

          Classification: **OFFLINE_COMMAND_REACHABILITY_AND_REPORT_OBJECT_PROOF_NOT_FOR_FLASH**
          """
          (ev/"12_V15_FINAL_DECISION.md").write_text(md)
          print(md)
          '@ | Set-Content "$root\derive.py"

          python "$root\derive.py"
          Get-Content "$root\evidence\12_V15_FINAL_DECISION.md" >> $env:GITHUB_STEP_SUMMARY

      - name: Package V15 evidence
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v15"
          Copy-Item "$root\evidence\*" "$root\out\" -Force

          if(Test-Path "$root\out\vendor.exe"){throw "vendor EXE leak"}
          if(Test-Path "$root\out\Probe.exe"){throw "probe EXE leak"}

          Get-ChildItem "$root\out" -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content "$root\out\SHA256SUMS.txt"

      - name: Upload V15 evidence
        uses: actions/upload-artifact@v7
        with:
          name: OKN-BP1048P4-MASTER-V15-COMMAND-CALLSITE-REPORT-OBJECT-EVIDENCE
          path: C:\okn_v15\out\*
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed assertion
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v15"

          foreach($n in @(
            "LIVE_DSP_CONNECTED","USB_TARGET_ACCESS","HOST_TO_DSP_IO",
            "HID_CONNECT_ALLOWED","HID_SEND_ALLOWED","HID_READ_ALLOWED","HID_WRITE_ALLOWED",
            "FEATURE_REPORT_ALLOWED","FLASH_ALLOWED","ERASE_ALLOWED","WRITE_ALLOWED"
          )){
            if((Get-Item "Env:$n").Value -ne "NO"){throw "$n changed"}
          }

          $d=Get-Content "$root\evidence\11_V15_FINAL_DECISION.json" -Raw | ConvertFrom-Json
          if($d.live_dsp_connected -ne $false){throw "bad live DSP state"}
          if($d.host_to_dsp_io -ne $false){throw "bad host I/O state"}
          if($d.feature_report_invoked -ne $false){throw "bad feature state"}
          if($d.flash_allowed -ne $false){throw "bad flash state"}

          if($d.android_set_report_data_prefix_hex -ne "0504661C0624"){
            throw "report transform proof changed unexpectedly"
          }

          "MASTER_V15=PASS"
          "ANDROID_VENDOR_EQUIVALENT_PREFIX=0504661C0624"
          "HOST_TO_DSP_IO=NO"
          "FEATURE_REPORT=NO"
          "FLASH_ALLOWED=NO"
