name: R154 N9 local80 h15 mod4 branch cluster static audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R154_N9_LOCAL80_H15_MOD4_BRANCH_CLUSTER_STATIC_AUDIT.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r154-n9-local80-mod4-${{ github.ref }}
  cancel-in-progress: true

env:
  FLASH_ALLOWED: "NO"
  R153_RUN_ID: "36022460346"
  R153_JOB_ID: "107710511792"
  R153_ARTIFACT_ID: "10816913219"
  R153_ARTIFACT_NAME: "R153-N9-STATE404-IV-XOR-LOOP-KEY-TRANSFORM-STATIC-EVIDENCE"
  R153_ARTIFACT_DIGEST: "sha256:bc8e1c24548096c32173b6d7a5f205724a9dda25a6f3691a020a28815333bac4"

jobs:
  static_audit:
    name: STATIC ONLY - local80 h15 mod4 branch cluster - no execution - no USB - no board
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r154/r153 /tmp/r154/evidence
          cat > /tmp/r154/evidence/R154_SAFETY.txt <<'EOF'
          R154_MODE=OFFLINE_STATIC_LOCAL80_H15_MOD4_BRANCH_CLUSTER_ONLY
          R154_VENDOR_BINARY_EXECUTED=NO
          R154_WINDOWS_EXE_EXECUTED=NO
          R154_DLL_EXECUTED=NO
          R154_APK_EXECUTED=NO
          R154_USB_DEVICE_ACCESS=NO
          R154_BOARD_CONTACT=NO
          R154_AA55_SENT=NO
          R154_LINEIN_AA55_SENT=NO
          R154_RUNTIME_0X11_SENT=NO
          R154_RUNTIME_0XFE_SENT=NO
          R154_FLASHBOOT_COMMAND_SENT=NO
          R154_FLASH_READ_EXECUTED=NO
          R154_FLASH_ERASE_EXECUTED=NO
          R154_FLASH_WRITE_EXECUTED=NO
          R154_OFFLINE_DECRYPT_EXECUTED=NO
          R154_ONE_BYTE_REPAIR_GUESS_ALLOWED=NO
          R154_ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD=NO
          HARDWARE_MODIFICATION=FORBIDDEN
          FLASH_ALLOWED=NO
          EOF

      - name: Download pinned R153 evidence
        uses: actions/download-artifact@v4
        with:
          name: R153-N9-STATE404-IV-XOR-LOOP-KEY-TRANSFORM-STATIC-EVIDENCE
          path: /tmp/r154/r153
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 36022460346

      - name: Verify and extract pinned R153 evidence
        shell: bash
        run: |
          set -euo pipefail
          OUTER="$(find /tmp/r154/r153 -maxdepth 2 -type f -name 'R153_N9_STATE404_IV_XOR_LOOP_KEY_TRANSFORM_STATIC_EVIDENCE.zip' -print -quit)"
          SUM="$(find /tmp/r154/r153 -maxdepth 2 -type f -name 'R153_N9_STATE404_IV_XOR_LOOP_KEY_TRANSFORM_STATIC_EVIDENCE.zip.sha256' -print -quit)"
          test -n "$OUTER"; test -n "$SUM"
          EXPECTED="$(awk '{print $1}' "$SUM")"
          ACTUAL="$(sha256sum "$OUTER" | awk '{print $1}')"
          test "$EXPECTED" = "$ACTUAL"
          unzip -q "$OUTER" -d /tmp/r154/evidence/r153
          test -s /tmp/r154/evidence/r153/R153_DECISION.json
          test -s /tmp/r154/evidence/r153/R153_STATE404_IV_XOR_LOOP_KEY_TRANSFORM.json
          test -s /tmp/r154/evidence/r153/r152/r151/r150/R150_DECISION.json
          test -s /tmp/r154/evidence/r153/r152/r151/r150/r149/r148/r147/r146/r145/r144/r143/R143_N9_METHOD.il
          grep -F '"UNACCOUNTED_CONDITIONAL_COUNT_AFTER_R153": 16' /tmp/r154/evidence/r153/R153_DECISION.json
          grep -F '"POST_LOOP_LOCAL47_KEY_CANDIDATE_HEX": "8e491ed108e5b47c8f39d70fd5c8342d8a42a068d0554a0ee526b8f7d6c844b3"' /tmp/r154/evidence/r153/R153_DECISION.json
          grep -F '"OFFLINE_DECRYPT_AUTHORIZED": false' /tmp/r154/evidence/r153/R153_DECISION.json
          grep -F '"FLASH_ALLOWED": false' /tmp/r154/evidence/r153/R153_DECISION.json

      - name: Prove local80 is immutable h15 length mod4 and resolve all local80 <= 0 sites
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,json,hashlib

          ev=Path('/tmp/r154/evidence')
          root=ev/'r153'
          n9=(root/'r152/r151/r150/r149/r148/r147/r146/r145/r144/r143/R143_N9_METHOD.il').read_text(errors='replace')
          r150=json.loads((root/'r152/r151/r150/R150_DECISION.json').read_text())
          r153=json.loads((root/'R153_DECISION.json').read_text())

          h15_len=r150['H15_LENGTH']
          h15_sha=r150['H15_SHA256']
          if h15_len != 607967:
              raise SystemExit(f'h15 length changed: {h15_len}')
          if not r150.get('LOCAL27_ALIAS_READ_ONLY'):
              raise SystemExit('local27 read-only alias proof missing')

          # Exact assignment: local80 = local27.Length % 4.
          assign_pat=(
            r'IL_19a4:\s*ldloc\.s 27\s*\n\s*'
            r'IL_19a6:\s*ldlen\s*\n\s*'
            r'IL_19a7:\s*conv\.i4\s*\n\s*'
            r'IL_19a8:\s*ldc\.i4\.4\s*\n\s*'
            r'IL_19a9:\s*rem\s*\n\s*'
            r'IL_19aa:\s*stloc\.s 80')
          assignment_exact=bool(re.search(assign_pat,n9))
          stores=re.findall(r'(?m)^\s*(IL_[0-9A-Fa-f]+):\s*stloc\.s 80\s*$',n9)
          loads=re.findall(r'(?m)^\s*(IL_[0-9A-Fa-f]+):\s*ldloc\.s 80\s*$',n9)
          if stores != ['IL_19aa']:
              raise SystemExit('local80 store set changed: '+repr(stores))
          if not assignment_exact:
              raise SystemExit('local80 exact mod4 assignment not proven')

          local80=h15_len % 4
          if local80 != 3:
              raise SystemExit(f'unexpected h15 mod4: {local80}')

          site_specs={
            436: ('IL_1c43','IL_1c46: ble IL_55e2'),
            338: ('IL_0c6d','IL_0c70: ble IL_5442'),
            387: ('IL_5131','IL_5134: ble IL_1172'),
          }
          old=r153['remaining_unaccounted_conditionals']
          by_state={x['state']:x for x in old}
          for st,(lab,line) in site_specs.items():
              x=by_state.get(st)
              if not x or x.get('label')!=lab or x.get('branch_line')!=line:
                  raise SystemExit(f'expected unresolved local80 site missing/changed: {st}: {x}')

          raw_checks={
            'state436_local80_le_zero': bool(re.search(r'IL_1c43:\s*ldloc\.s 80\s*\n\s*IL_1c45:\s*ldc\.i4\.0\s*\n\s*IL_1c46:\s*ble IL_55e2',n9)),
            'state338_local80_le_zero': bool(re.search(r'IL_0c6d:\s*ldloc\.s 80\s*\n\s*IL_0c6f:\s*ldc\.i4\.0\s*\n\s*IL_0c70:\s*ble IL_5442',n9)),
            'state387_local80_le_zero': bool(re.search(r'IL_5131:\s*ldloc\.s 80\s*\n\s*IL_5133:\s*ldc\.i4\.0\s*\n\s*IL_5134:\s*ble IL_1172',n9)),
          }
          if not all(raw_checks.values()):
              raise SystemExit('one or more local80 branch sites changed: '+repr(raw_checks))

          branch_taken=(local80 <= 0)
          if branch_taken:
              raise SystemExit('local80 <= 0 unexpectedly true')

          out={
            'H15_LENGTH':h15_len,
            'H15_SHA256':h15_sha,
            'LOCAL27_ALIAS_READ_ONLY_PROVEN':True,
            'LOCAL80_STORE_LABELS':stores,
            'LOCAL80_LOAD_LABELS':loads,
            'LOCAL80_SINGLE_ASSIGNMENT':len(stores)==1,
            'LOCAL80_EXACT_ASSIGNMENT_IS_LOCAL27_LENGTH_MOD4':assignment_exact,
            'LOCAL80_VALUE':local80,
            'LOCAL80_IS_POSITIVE':local80>0,
            'LOCAL80_BRANCH_SITE_RAW_IL_FACTS':raw_checks,
            'STATE436_BLE_ZERO_TAKEN':False,
            'STATE338_BLE_ZERO_TAKEN':False,
            'STATE387_BLE_ZERO_TAKEN':False,
            'RESOLVED_LOCAL80_CONDITIONAL_STATES':[436,338,387],
            'RESOLVED_LOCAL80_CONDITIONAL_COUNT':3,
            'POST_LOOP_LOCAL47_KEY_CANDIDATE_HEX':r153['POST_LOOP_LOCAL47_KEY_CANDIDATE_HEX'],
            'OFFLINE_DECRYPT_AUTHORIZED':False,
            'H15_PLAINTEXT_RECOVERED':False,
            'FLASH_ALLOWED':False,
            'interpretation':(
              'Raw IL assigns local80 exactly once as local27.Length % 4. R150 proves local27 is a read-only alias '
              'of the complete h15 byte array, whose length is 607967. Therefore local80 is statically 3 and remains '
              'positive. All three unresolved comparisons local80 <= 0 at states 436, 338, and 387 are therefore false. '
              'No decryption or byte repair is authorized by this result.'),
          }
          (ev/'R154_LOCAL80_H15_MOD4_BRANCH_CLUSTER.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - name: Rebase unresolved conditionals and build fail-closed R154 decision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          ev=Path('/tmp/r154/evidence')
          prev=json.loads((ev/'r153/R153_DECISION.json').read_text())
          proof=json.loads((ev/'R154_LOCAL80_H15_MOD4_BRANCH_CLUSTER.json').read_text())
          old=prev['remaining_unaccounted_conditionals']
          if len(old)!=16:
              raise SystemExit(f'expected 16 unresolved from R153, got {len(old)}')
          if (old[0].get('state'),old[0].get('branch_line')) != (436,'IL_1c46: ble IL_55e2'):
              raise SystemExit('next R153 conditional changed: '+repr(old[0]))

          resolved=set(proof['RESOLVED_LOCAL80_CONDITIONAL_STATES'])
          present={x['state'] for x in old if x['state'] in resolved}
          if present != resolved:
              raise SystemExit(f'not all local80 sites were present in unresolved set: {present} vs {resolved}')
          remaining=[x for x in old if x['state'] not in resolved]
          if len(remaining)!=13:
              raise SystemExit(f'expected 13 unresolved after local80 cluster, got {len(remaining)}')

          decision={
            'R153_UNACCOUNTED_CONDITIONAL_COUNT':len(old),
            'R154_RESOLVED_CONDITIONAL_COUNT':len(resolved),
            'R154_RESOLVED_CONDITIONAL_STATES':sorted(resolved),
            'UNACCOUNTED_CONDITIONAL_COUNT_AFTER_R154':len(remaining),
            'NEXT_UNACCOUNTED_CONDITIONAL':remaining[0] if remaining else None,
            'H15_LENGTH':proof['H15_LENGTH'],
            'LOCAL80_VALUE':proof['LOCAL80_VALUE'],
            'LOCAL80_IS_POSITIVE':proof['LOCAL80_IS_POSITIVE'],
            'POST_LOOP_LOCAL47_KEY_CANDIDATE_HEX':proof['POST_LOOP_LOCAL47_KEY_CANDIDATE_HEX'],
            'R145_KEY_VALUE_CAN_NO_LONGER_BE_TREATED_AS_FINAL_CREATEDECRYPTOR_KEY_WITHOUT_STATE404_TRANSFORM':True,
            'INDEPENDENT_FULL_PATH_BRANCH_COVERAGE_PROVEN':len(remaining)==0,
            'OFFLINE_DECRYPT_AUTHORIZED':False,
            'H15_PLAINTEXT_RECOVERED':False,
            'ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD':False,
            'AA55_LIVE_RETEST_ALLOWED':False,
            'RUNTIME_0X11_ALLOWED':False,
            'RUNTIME_0XFE_ALLOWED':False,
            'FLASH_ALLOWED':False,
            'remaining_unaccounted_conditionals':remaining,
            'NEXT':(
              'Resolve the next raw-IL conditional cluster beginning with state215 IL_354d '
              '(local38 != local98 - 1). Trace the exact initialization and update schedule of local38 and local98, '
              'including states 33 and 458, without assuming legacy fallthrough. Preserve h15 unchanged, carry the '
              'state404-corrected local47 key candidate, and do not decrypt or authorize any live frame.'),
          }
          (ev/'R154_DECISION.json').write_text(json.dumps(decision,indent=2)+'\n')
          (ev/'R154_REPORT_TH.md').write_text(
            '# R154 local80 h15-mod4 branch cluster static audit\n\n'
            f'- R153 unresolved conditionals: {decision["R153_UNACCOUNTED_CONDITIONAL_COUNT"]}\n'
            f'- resolved in R154: {decision["R154_RESOLVED_CONDITIONAL_COUNT"]} states {decision["R154_RESOLVED_CONDITIONAL_STATES"]}\n'
            f'- remaining: {decision["UNACCOUNTED_CONDITIONAL_COUNT_AFTER_R154"]}\n'
            f'- h15 length: {decision["H15_LENGTH"]}\n'
            f'- local80 = h15.Length % 4: {decision["LOCAL80_VALUE"]}\n'
            f'- local80 > 0: {decision["LOCAL80_IS_POSITIVE"]}\n'
            f'- post-state404 local47 key candidate: {decision["POST_LOOP_LOCAL47_KEY_CANDIDATE_HEX"]}\n'
            '- offline decrypt authorized: False\n- h15 plaintext recovered: False\n\n'
            f'NEXT: {decision["NEXT"]}\n\nFLASH_ALLOWED=NO\n')
          print(json.dumps(decision,indent=2))
          PY

      - name: Package R154 evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r154/evidence
          zip -9 -r /tmp/R154_N9_LOCAL80_H15_MOD4_BRANCH_CLUSTER_STATIC_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/R154_N9_LOCAL80_H15_MOD4_BRANCH_CLUSTER_STATIC_EVIDENCE.zip > /tmp/R154_N9_LOCAL80_H15_MOD4_BRANCH_CLUSTER_STATIC_EVIDENCE.zip.sha256

      - name: Upload R154 evidence
        uses: actions/upload-artifact@v4
        with:
          name: R154-N9-LOCAL80-H15-MOD4-BRANCH-CLUSTER-STATIC-EVIDENCE
          path: |
            /tmp/R154_N9_LOCAL80_H15_MOD4_BRANCH_CLUSTER_STATIC_EVIDENCE.zip
            /tmp/R154_N9_LOCAL80_H15_MOD4_BRANCH_CLUSTER_STATIC_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'R154_VENDOR_BINARY_EXECUTED=NO' /tmp/r154/evidence/R154_SAFETY.txt
          grep -F 'R154_USB_DEVICE_ACCESS=NO' /tmp/r154/evidence/R154_SAFETY.txt
          grep -F 'R154_BOARD_CONTACT=NO' /tmp/r154/evidence/R154_SAFETY.txt
          grep -F 'R154_OFFLINE_DECRYPT_EXECUTED=NO' /tmp/r154/evidence/R154_SAFETY.txt
          grep -F '"R154_RESOLVED_CONDITIONAL_COUNT": 3' /tmp/r154/evidence/R154_DECISION.json
          grep -F '"UNACCOUNTED_CONDITIONAL_COUNT_AFTER_R154": 13' /tmp/r154/evidence/R154_DECISION.json
          grep -F '"LOCAL80_VALUE": 3' /tmp/r154/evidence/R154_DECISION.json
          grep -F '"POST_LOOP_LOCAL47_KEY_CANDIDATE_HEX": "8e491ed108e5b47c8f39d70fd5c8342d8a42a068d0554a0ee526b8f7d6c844b3"' /tmp/r154/evidence/R154_DECISION.json
          grep -F '"OFFLINE_DECRYPT_AUTHORIZED": false' /tmp/r154/evidence/R154_DECISION.json
          grep -F '"H15_PLAINTEXT_RECOVERED": false' /tmp/r154/evidence/R154_DECISION.json
          grep -F '"FLASH_ALLOWED": false' /tmp/r154/evidence/R154_DECISION.json
          echo R154_N9_LOCAL80_H15_MOD4_BRANCH_CLUSTER_STATIC_AUDIT_COMPLETE=YES
          echo FLASH_ALLOWED=NO
