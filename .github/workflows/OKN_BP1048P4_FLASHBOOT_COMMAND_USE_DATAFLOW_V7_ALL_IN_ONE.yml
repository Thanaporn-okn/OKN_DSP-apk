name: OKN BP1048P4 Flashboot Command Use Dataflow V7 - All In One

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: okn-bp1048p4-command-use-dataflow-v7-${{ github.ref }}
  cancel-in-progress: true

env:
  FLASH_ALLOWED: "NO"

jobs:
  command_use:
    name: Trace each command pointer into calls/stores - NO USB - NO FLASH
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          mkdir -p /tmp/v7/evidence
          cat > /tmp/v7/evidence/SAFETY.txt <<'EOF'
          MODE=OFFLINE_STATIC_COMMAND_POINTER_DATAFLOW_ONLY
          TARGET=MVSilicon_BP1048P4
          USB_OR_BOARD_CONTACT=NO
          TARGET_FIRMWARE_EXECUTED=NO
          FLASH_READ_EXECUTED=NO
          FLASH_ERASE_EXECUTED=NO
          FLASH_WRITE_EXECUTED=NO
          LIVE_BOOT_ENTRY_AUTHORIZED=NO
          LIVE_FLASH_AUTHORIZED=NO
          FLASH_ALLOWED=NO
          EOF

      - name: Checkout public BP1048 SDK
        uses: actions/checkout@v4
        with:
          repository: leadercxn/bp1048_sdk_v0.1.12
          ref: master
          path: bp1048-sdk
          fetch-depth: 1

      - name: Reconstruct exact image
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib,json,re,subprocess

          ROOT=Path("bp1048-sdk")
          OUT=Path("/tmp/v7/evidence")
          src=ROOT/"BT_Audio_APP/bt_audio_app_src/device/flash_boot.c"
          text=src.read_text(errors="replace")

          m=re.search(
              r"(?:static\s+|const\s+|unsigned\s+|signed\s+)*"
              r"(?:char|uint8_t|uint8|u8|BYTE)\s+flash_data\s*"
              r"\[\s*(?P<n>\d+)\s*\]\s*=\s*\{(?P<body>.*?)\};",
              text,re.I|re.S
          )
          assert m
          body=re.sub(r"/\*.*?\*/","",m.group("body"),flags=re.S)
          body=re.sub(r"//[^\r\n]*","",body)
          vals=[int(x,16) for x in re.findall(
              r"0[xX]([0-9A-Fa-f]{1,2})\b",body
          )]
          assert int(m.group("n"))==65536 and len(vals)==65520

          raw=bytes(vals)+bytes(65536-len(vals))
          (OUT/"flash_data_65536.bin").write_bytes(raw)

          meta={
              "commit":subprocess.check_output(
                  ["git","-C",str(ROOT),"rev-parse","HEAD"],text=True
              ).strip(),
              "sha256":hashlib.sha256(raw).hexdigest(),
              "runtime_gp":0x20026CB0,
              "runtime_base":0x2001A9A8,
              "USB_OR_BOARD_CONTACTED":False,
              "LIVE_FLASH_AUTHORIZED":False,
              "FLASH_ALLOWED":False
          }
          (OUT/"META.json").write_text(json.dumps(meta,indent=2)+"\n")
          PYCODE

      - name: Build GNU NDS32 objdump
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/v7/toolchain /tmp/v7/build
          cd /tmp/v7/toolchain
          URL="https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz"
          if curl -fL --retry 3 --connect-timeout 20 "$URL" -o binutils-2.44.tar.xz; then
            tar -xf binutils-2.44.tar.xz
            cd /tmp/v7/build
            if ../toolchain/binutils-2.44/configure \
                --target=nds32le-elf \
                --disable-nls --disable-werror --disable-gdb \
                --disable-gprofng --disable-gas --disable-ld --disable-gold \
                >/tmp/v7/evidence/NDS32_BUILD.log 2>&1 &&
               make -j2 all-binutils >>/tmp/v7/evidence/NDS32_BUILD.log 2>&1; then
              find /tmp/v7/build -type f -name '*objdump' -perm -111 -print \
                > /tmp/v7/evidence/OBJDUMP_CANDIDATES.txt
              echo BUILD_STATUS=SUCCESS > /tmp/v7/evidence/NDS32_BUILD_STATUS.txt
            else
              echo BUILD_STATUS=FAILED > /tmp/v7/evidence/NDS32_BUILD_STATUS.txt
            fi
          else
            echo BUILD_STATUS=DOWNLOAD_FAILED > /tmp/v7/evidence/NDS32_BUILD_STATUS.txt
          fi
          exit 0

      - name: Disassemble
        shell: bash
        run: |
          set -euo pipefail
          OBJDUMP="$(find /tmp/v7/build -type f -name '*objdump' -perm -111 | head -1 || true)"
          test -n "$OBJDUMP"
          "$OBJDUMP" -D -b binary -m nds32 --adjust-vma=0 \
            /tmp/v7/evidence/flash_data_65536.bin \
            > /tmp/v7/evidence/NDS32_DISASSEMBLY.txt \
            2>/tmp/v7/evidence/NDS32_DISASSEMBLY.stderr.txt

      - name: Trace command pointer lifetime calls and stores
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import collections,json,re

          OUT=Path("/tmp/v7/evidence")
          raw=(OUT/"flash_data_65536.bin").read_bytes()
          meta=json.loads((OUT/"META.json").read_text())
          GP=meta["runtime_gp"]
          BASE=meta["runtime_base"]

          lines=(OUT/"NDS32_DISASSEMBLY.txt").read_text(errors="replace").splitlines()
          row_rx=re.compile(
              r"^\s*([0-9A-Fa-f]+):\s+(?:[0-9A-Fa-f]{2,8}\s+)+(.+?)\s*$"
          )
          ins=[]
          for line_no,line in enumerate(lines,1):
              m=row_rx.match(line)
              if m:
                  ins.append({
                      "line":line_no,
                      "addr":int(m.group(1),16),
                      "text":m.group(2).strip(),
                      "raw":line,
                  })

          # Printable string table.
          strings={}
          st=None
          for i,b in enumerate(raw+b"\x00"):
              if 32<=b<=126:
                  if st is None: st=i
              else:
                  if st is not None and i-st>=3:
                      strings[st]=raw[st:i].decode("ascii",errors="replace")
                  st=None

          names=["chiperas","upinfo","btupdat","cnfgdat","constdat","codedata","cxxx"]
          cmd_off={}
          for name in names:
              hits=[off for off,s in strings.items() if s==name]
              assert len(hits)==1,(name,hits)
              cmd_off[name]=hits[0]

          def pint(s):
              try:
                  return int(s.strip().replace("#",""),0)
              except Exception:
                  return None

          addigp_rx=re.compile(
              r"\baddi\.gp\s+(\$[A-Za-z0-9]+)\s*,\s*#?"
              r"(-?0x[0-9A-Fa-f]+|-?\d+)",re.I
          )
          jal_rx=re.compile(r"\bjal\s+(?:0x)?([0-9A-Fa-f]+)\b",re.I)
          jral_rx=re.compile(
              r"\bjral\s+(?:\$lp\s*,\s*)?(\$[A-Za-z0-9]+)\b",re.I
          )
          store_rx=re.compile(
              r"\b(?P<op>swi|shi|sbi)(?:\.[A-Za-z0-9]+)?\s+"
              r"(?P<src>\$[A-Za-z0-9]+)\s*,\s*"
              r"\[(?P<base>\$[A-Za-z0-9]+)"
              r"(?:\s*\+\s*#?(?P<off>-?0x[0-9A-Fa-f]+|-?\d+))?\]",
              re.I
          )
          mov_rx=re.compile(
              r"\b(?:mov55|mov|movi55)\s+"
              r"(\$[A-Za-z0-9]+)\s*,\s*(\$[A-Za-z0-9]+)\b",re.I
          )

          # Exact command refs under validated mapping.
          refs=[]
          for idx,x in enumerate(ins):
              m=addigp_rx.search(x["text"])
              if not m: continue
              reg,imm_s=m.groups()
              imm=pint(imm_s)
              if imm is None: continue
              runtime=(GP+imm)&0xffffffff
              off=(runtime-BASE)&0xffffffff
              cmd=next((n for n,o in cmd_off.items() if o==off),None)
              if cmd:
                  refs.append({
                      "idx":idx,"addr":x["addr"],"reg":reg,
                      "imm":imm,"runtime":runtime,"file_offset":off,
                      "command":cmd,"text":x["text"]
                  })

          ref_indices={r["idx"] for r in refs}

          # Conservative generic destination-register parser.
          # Stores/branches/calls do not overwrite their source register.
          no_dest_prefix=(
              "swi","shi","sbi","beq","bne","beqz","bnez","bgez","bltz",
              "bgtz","blez","j","jal","jr","jral","ret","ret5","push","pop",
              "smw","lmw"
          )
          first_reg_rx=re.compile(
              r"^[A-Za-z0-9_.]+\s+(\$[A-Za-z0-9]+)"
          )

          def destination_reg(text):
              mnemonic=text.strip().split(None,1)[0].lower() if text.strip() else ""
              if mnemonic.startswith(no_dest_prefix):
                  return None
              m=first_reg_rx.search(text)
              return m.group(1) if m else None

          traces=[]
          all_call_uses=[]
          all_store_uses=[]

          for r in refs:
              aliases={r["reg"]}
              events=[]
              stop_reason="window_limit"

              # Trace at most 36 following instructions or until another exact
              # command ref starts; this keeps command lifetimes separate.
              for j in range(r["idx"]+1,min(len(ins),r["idx"]+37)):
                  x=ins[j]
                  t=x["text"]

                  if j in ref_indices:
                      stop_reason="next_command_ref"
                      break

                  # Copy propagation.
                  mm=mov_rx.search(t)
                  if mm:
                      dst,src=mm.groups()
                      if src in aliases:
                          aliases.add(dst)
                          events.append({
                              "kind":"copy","addr":x["addr"],
                              "src":src,"dst":dst,"text":t
                          })
                      elif dst in aliases and src not in aliases:
                          aliases.discard(dst)

                  # Stores using a live alias.
                  sm=store_rx.search(t)
                  if sm and sm.group("src") in aliases:
                      ev={
                          "kind":"store",
                          "addr":x["addr"],
                          "source_reg":sm.group("src"),
                          "base_reg":sm.group("base"),
                          "offset":pint(sm.group("off") or "0"),
                          "op":sm.group("op").lower(),
                          "text":t
                      }
                      events.append(ev)
                      all_store_uses.append({**r,**ev})

                  # Direct / indirect calls while command pointer remains live.
                  jm=jal_rx.search(t)
                  if jm and aliases:
                      ev={
                          "kind":"direct_call",
                          "addr":x["addr"],
                          "target":int(jm.group(1),16),
                          "live_aliases":sorted(aliases),
                          "arg_aliases":sorted(
                              a for a in aliases
                              if a in {"$r0","$r1","$r2","$r3","$r4","$r5"}
                          ),
                          "text":t
                      }
                      events.append(ev)
                      all_call_uses.append({**r,**ev})

                  im=jral_rx.search(t)
                  if im and aliases:
                      ev={
                          "kind":"indirect_call",
                          "addr":x["addr"],
                          "target_reg":im.group(1),
                          "live_aliases":sorted(aliases),
                          "arg_aliases":sorted(
                              a for a in aliases
                              if a in {"$r0","$r1","$r2","$r3","$r4","$r5"}
                          ),
                          "text":t
                      }
                      events.append(ev)
                      all_call_uses.append({**r,**ev})

                  # Generic overwrite handling after reads/call/store are recorded.
                  dst=destination_reg(t)
                  if dst and dst in aliases:
                      # A recognized self-copy above retains the alias.
                      keep=False
                      mm2=mov_rx.search(t)
                      if mm2 and mm2.group(1)==dst and mm2.group(2) in aliases:
                          keep=True
                      # The original addi.gp is not inside this scan.
                      if not keep:
                          aliases.discard(dst)
                          events.append({
                              "kind":"alias_overwrite",
                              "addr":x["addr"],"reg":dst,"text":t
                          })

                  if not aliases:
                      stop_reason="all_aliases_overwritten"
                      break

              traces.append({
                  "ref":r,
                  "events":events,
                  "stop_reason":stop_reason
              })

          # Identify first direct call/store associated with each ref.
          associations=[]
          for tr in traces:
              calls=[e for e in tr["events"] if e["kind"] in ("direct_call","indirect_call")]
              stores=[e for e in tr["events"] if e["kind"]=="store"]
              associations.append({
                  "command":tr["ref"]["command"],
                  "ref_addr":tr["ref"]["addr"],
                  "ref_reg":tr["ref"]["reg"],
                  "first_call":calls[0] if calls else None,
                  "first_store":stores[0] if stores else None,
                  "stop_reason":tr["stop_reason"],
              })

          # Helper target usage: which commands reach each direct call while a
          # live alias still exists.
          helper_map=collections.defaultdict(lambda:{
              "commands":set(),"sites":[],"arg_alias_commands":set()
          })
          for x in all_call_uses:
              if x["kind"]!="direct_call":
                  continue
              h=helper_map[x["target"]]
              h["commands"].add(x["command"])
              if x["arg_aliases"]:
                  h["arg_alias_commands"].add(x["command"])
              h["sites"].append({
                  "command":x["command"],
                  "ref_addr":x["addr"],
                  "call_addr":x["addr"],
                  "arg_aliases":x["arg_aliases"],
              })

          helpers=[]
          for target,h in helper_map.items():
              helpers.append({
                  "target":target,
                  "commands":sorted(h["commands"]),
                  "commands_with_pointer_in_r0_r5":sorted(h["arg_alias_commands"]),
                  "site_count":len(h["sites"]),
                  "sites":h["sites"],
              })
          helpers.sort(key=lambda h:(-len(h["commands"]),-h["site_count"],h["target"]))

          # Dump bodies of direct-call helpers that appear while command pointer
          # is live, using a conservative prologue/return window.
          push_rx=re.compile(r"\b(push25|smw\.adm)\b",re.I)
          ret_rx=re.compile(r"\b(ret|ret5|jr\s+\$lp|pop25)\b",re.I)
          by_addr={x["addr"]:i for i,x in enumerate(ins)}
          helper_bodies=[]
          for h in helpers[:30]:
              target=h["target"]
              idx=by_addr.get(target)
              if idx is None:
                  continue
              lo=max(0,idx-8)
              starts=[k for k in range(lo,idx+1) if push_rx.search(ins[k]["text"])]
              si=starts[-1] if starts else idx
              ends=[k for k in range(idx,min(len(ins),idx+160)) if ret_rx.search(ins[k]["text"])]
              ei=ends[0] if ends else min(len(ins)-1,idx+100)
              rows=ins[si:ei+1]
              body="\n".join(x["raw"] for x in rows)
              helper_bodies.append({
                  "target":target,
                  "commands":h["commands"],
                  "start":rows[0]["addr"] if rows else target,
                  "end":rows[-1]["addr"] if rows else target,
                  "text":body,
              })
              (OUT/f"HELPER_{target:04X}.asm").write_text(body+"\n")

          # Always save exact snippets around each command reference.
          for i,tr in enumerate(traces):
              idx=tr["ref"]["idx"]
              rows=ins[max(0,idx-10):min(len(ins),idx+28)]
              (OUT/f"CMD_{i:02d}_{tr['ref']['command']}_{tr['ref']['addr']:04X}.asm").write_text(
                  "\n".join(x["raw"] for x in rows)+"\n"
              )

          result={
              "revision":"COMMAND_USE_DATAFLOW_V7",
              "runtime_gp":GP,
              "runtime_base":BASE,
              "command_offsets":cmd_off,
              "command_refs":refs,
              "traces":traces,
              "associations":associations,
              "helper_map":helpers,
              "helper_bodies":helper_bodies,
              "USB_OR_BOARD_CONTACTED":False,
              "LIVE_FLASH_AUTHORIZED":False,
              "FLASH_ALLOWED":False
          }
          (OUT/"COMMAND_USE_DATAFLOW.json").write_text(
              json.dumps(result,indent=2,ensure_ascii=False)+"\n"
          )

          md=[
              "# BP1048P4 Command Use Dataflow V7",
              "",
              f"64 KiB SHA256: `{meta['sha256']}`",
              f"runtime `$gp`: `0x{GP:08X}`",
              f"runtime image base: `0x{BASE:08X}`",
              "",
              "## Exact command references",
          ]
          for r in refs:
              md.append(
                  f"- **{r['command']}** @ code `0x{r['addr']:04X}` "
                  f"in `{r['reg']}` → runtime `0x{r['runtime']:08X}`"
              )

          md+=["","## First use after each command reference"]
          for a in associations:
              c=a["first_call"]
              s=a["first_store"]
              ctext="none"
              if c:
                  if c["kind"]=="direct_call":
                      ctext=(
                          f"`0x{c['addr']:04X} → 0x{c['target']:04X}` "
                          f"args holding pointer: {', '.join(c['arg_aliases']) or 'none in r0-r5'}"
                      )
                  else:
                      ctext=f"`0x{c['addr']:04X}` indirect via `{c['target_reg']}`"
              stext="none"
              if s:
                  stext=(
                      f"`0x{s['addr']:04X}` `{s['text']}` "
                      f"(source `{s['source_reg']}`)"
                  )
              md.append(
                  f"- **{a['command']}** ref `0x{a['ref_addr']:04X}`: "
                  f"first call {ctext}; first store {stext}; stop `{a['stop_reason']}`"
              )

          md+=["","## Helpers called while exact command pointer is still live"]
          if helpers:
              for h in helpers:
                  md.append(
                      f"- helper `0x{h['target']:04X}`: commands "
                      f"`{', '.join(h['commands'])}`; pointer in ABI arg r0-r5 for "
                      f"`{', '.join(h['commands_with_pointer_in_r0_r5']) or 'none'} `"
                  )
          else:
              md.append("- none")

          md+=["","## Command-pointer stores"]
          if all_store_uses:
              for x in all_store_uses[:100]:
                  md.append(
                      f"- **{x['command']}** ref `0x{x['addr']:04X}` → "
                      f"store @ `0x{x['addr']:04X}` `{x['text']}`"
                  )
          else:
              md.append("- none recovered before pointer overwrite")

          md+=["","## Interpretation"]
          md.append("- This run follows each exact command pointer only while that value remains live in a register or a recognized register copy.")
          md.append("- A helper association is strongest when the command pointer is still in ABI argument registers `$r0–$r5` at the call.")
          md.append("- This avoids the V5/V6 error of assigning a whole shared parser region to one command.")
          md.append("- No absence-of-call result is considered proof of safety.")
          md.append("- USB/board contacted: **NO**")
          md.append("- Flash read/erase/write: **NO**")
          md.append("- `FLASH_ALLOWED=NO`")

          (OUT/"COMMAND_USE_DATAFLOW_SUMMARY.md").write_text("\n".join(md)+"\n")
          PYCODE

      - name: Publish summary
        shell: bash
        run: |
          set -euo pipefail
          cat /tmp/v7/evidence/COMMAND_USE_DATAFLOW_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Package evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v7/evidence
          zip -9 -r /tmp/OKN_BP1048P4_COMMAND_USE_DATAFLOW_V7_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/OKN_BP1048P4_COMMAND_USE_DATAFLOW_V7_EVIDENCE.zip \
            > /tmp/OKN_BP1048P4_COMMAND_USE_DATAFLOW_V7_EVIDENCE.zip.sha256

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: OKN-BP1048P4-COMMAND-USE-DATAFLOW-V7-EVIDENCE
          path: |
            /tmp/OKN_BP1048P4_COMMAND_USE_DATAFLOW_V7_EVIDENCE.zip
            /tmp/OKN_BP1048P4_COMMAND_USE_DATAFLOW_V7_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/v7/evidence/COMMAND_USE_DATAFLOW.json"))
          assert d["runtime_gp"] == 0x20026CB0
          assert d["runtime_base"] == 0x2001A9A8
          assert d["USB_OR_BOARD_CONTACTED"] is False
          assert d["LIVE_FLASH_AUTHORIZED"] is False
          assert d["FLASH_ALLOWED"] is False
          print("COMMAND_USE_DATAFLOW_V7_GATE=PASS")
          PY
          echo FLASH_ALLOWED=NO
