name: R141 exact official Windows protector resource static reverse

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R141_EXACT_OFFICIAL_WINDOWS_PROTECTOR_RESOURCE_STATIC_REVERSE.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r141-official-windows-protector-resource-${{ github.ref }}
  cancel-in-progress: true

env:
  FLASH_ALLOWED: "NO"
  R140_FIXED_RUN_ID: "35944184192"
  R140_FIXED_JOB_ID: "107458374505"
  R140_FIXED_ARTIFACT_ID: "10785578683"
  R140_FIXED_ARTIFACT_NAME: "R140-FIXED-EXACT-OFFICIAL-WINDOWS-DOTNET-USBHID-IL-STATIC-EVIDENCE"
  R140_FIXED_ARTIFACT_DIGEST: "sha256:7a5baa680bd0e06d64191fdcbb142b258a77aa308821c03b9d938fbd27a0dcd8"
  R139_RUN_ID: "35942006697"
  R139_ACQUIRED_ARTIFACT_ID: "10785516143"
  R139_ACQUIRED_ARTIFACT_NAME: "R139-ACQUIRED-OFFICIAL-GOLOPINE-7CH-CLIENTS"
  R139_ACQUIRED_ARTIFACT_DIGEST: "sha256:94cf50b5d821e02f4303236fe42c5748434a70a1f914c91a6794d5c2d71097ab"
  R139_ACQUIRED_INNER_ZIP_SHA256: "47847664d699fc0fdd85a3861c438916524715803655dc25a23f1d34ee3bf375"
  WINDOWS_ZIP_SHA256: "f14b0c4baad70a8b0d5dc3b2783819cc2ef6e1a9c6ec2adcf17f1557059edd2a"
  WINDOWS_EXE_SHA256: "3ca54171c53f7badd963ffe6851b8b3e2faf8aee8ba2afcb7040990e22ae09b2"
  PROD_VID_DEC: "6324"
  PROD_PID_DEC: "1719"
  PROD_VID_HEX: "18B4"
  PROD_PID_HEX: "06B7"

jobs:
  static_reverse:
    name: STATIC ONLY - protector/resource reverse - no execution - no USB - no board
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r141/r140 /tmp/r141/r139 /tmp/r141/acquired /tmp/r141/windows /tmp/r141/evidence
          cat > /tmp/r141/evidence/R141_SAFETY.txt <<'EOF'
          R141_MODE=OFFLINE_STATIC_PROTECTOR_RESOURCE_REVERSE_ONLY
          R141_VENDOR_BINARY_EXECUTED=NO
          R141_WINDOWS_EXE_EXECUTED=NO
          R141_USB_DEVICE_ACCESS=NO
          R141_BOARD_CONTACT=NO
          R141_AA55_SENT=NO
          R141_RUNTIME_0X11_SENT=NO
          R141_RUNTIME_0XFE_SENT=NO
          R141_FLASHBOOT_COMMAND_SENT=NO
          R141_FLASH_READ_EXECUTED=NO
          R141_FLASH_ERASE_EXECUTED=NO
          R141_FLASH_WRITE_EXECUTED=NO
          R141_ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD=NO
          HARDWARE_MODIFICATION=FORBIDDEN
          REFERENCE_OR_TOOL_EVIDENCE_IS_NOT_PRODUCTION_SAFETY_PROOF=YES
          FLASH_ALLOWED=NO
          EOF

      - name: Download pinned R140 FIXED evidence
        uses: actions/download-artifact@v4
        with:
          name: R140-FIXED-EXACT-OFFICIAL-WINDOWS-DOTNET-USBHID-IL-STATIC-EVIDENCE
          path: /tmp/r141/r140
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 35944184192

      - name: Download pinned R139 official clients as inert data
        uses: actions/download-artifact@v4
        with:
          name: R139-ACQUIRED-OFFICIAL-GOLOPINE-7CH-CLIENTS
          path: /tmp/r141/r139
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 35942006697

      - name: Install static tooling only
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            file unzip mono-utils binutils python3-pip >/dev/null
          python3 -m pip install --disable-pip-version-check --no-input pefile >/dev/null
          monodis --version > /tmp/r141/evidence/R141_MONODIS_VERSION.txt 2>&1 || true

      - name: Verify pinned inputs and extract evidence plus official Windows client
        shell: bash
        run: |
          set -euo pipefail
          R140_OUTER="$(find /tmp/r141/r140 -maxdepth 2 -type f -name 'R140_FIXED_EXACT_OFFICIAL_WINDOWS_DOTNET_USBHID_IL_STATIC_EVIDENCE.zip' -print -quit)"
          test -n "$R140_OUTER"
          R140_SHA_FILE="$(find /tmp/r141/r140 -maxdepth 2 -type f -name 'R140_FIXED_EXACT_OFFICIAL_WINDOWS_DOTNET_USBHID_IL_STATIC_EVIDENCE.zip.sha256' -print -quit)"
          test -n "$R140_SHA_FILE"
          (cd "$(dirname "$R140_OUTER")" && sha256sum -c "$(basename "$R140_SHA_FILE")")
          unzip -q "$R140_OUTER" -d /tmp/r141/evidence/r140
          test -s /tmp/r141/evidence/r140/R140_FIXED_FULL.il

          ACQ="$(find /tmp/r141/r139 -maxdepth 2 -type f -name 'R139_ACQUIRED_OFFICIAL_GOLOPINE_7CH_CLIENTS.zip' -print -quit)"
          test -n "$ACQ"
          echo "${R139_ACQUIRED_INNER_ZIP_SHA256}  ${ACQ}" | sha256sum -c -
          unzip -q "$ACQ" -d /tmp/r141/acquired
          WINZIP=/tmp/r141/acquired/windows_2026-04-08.zip
          test -f "$WINZIP"
          echo "${WINDOWS_ZIP_SHA256}  ${WINZIP}" | sha256sum -c -
          unzip -q "$WINZIP" -d /tmp/r141/windows
          WINEXE="$(find /tmp/r141/windows -type f -name 'golopine_audio_turning_release_2026-04-08.exe' ! -path '*/__MACOSX/*' -print -quit)"
          test -n "$WINEXE"
          echo "${WINDOWS_EXE_SHA256}  ${WINEXE}" | sha256sum -c -
          printf '%s\n' "$WINEXE" > /tmp/r141/WINEXE_PATH
          file "$WINEXE" > /tmp/r141/evidence/R141_WINDOWS_FILE_TYPE.txt

      - name: Dump managed manifest and metadata tables without full monodis execution path
        shell: bash
        run: |
          set -euo pipefail
          WINEXE="$(cat /tmp/r141/WINEXE_PATH)"
          monodis --manifest "$WINEXE" > /tmp/r141/evidence/R141_MANIFEST.txt 2>&1 || true
          monodis --typedef "$WINEXE" > /tmp/r141/evidence/R141_TYPEDEF.txt 2>&1 || true
          monodis --method "$WINEXE" > /tmp/r141/evidence/R141_METHOD_TABLE.txt 2>&1 || true
          monodis --fields "$WINEXE" > /tmp/r141/evidence/R141_FIELDS.txt 2>&1 || true
          monodis --userstrings "$WINEXE" > /tmp/r141/evidence/R141_USERSTRINGS.txt 2>&1 || true
          strings -a -n 5 "$WINEXE" > /tmp/r141/evidence/R141_ASCII_STRINGS.txt
          strings -a -el -n 5 "$WINEXE" > /tmp/r141/evidence/R141_UTF16_STRINGS.txt

      - name: Static characterize protector resource CLI resources and HID stubs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import pefile,struct,hashlib,json,re,math,collections

          ev=Path('/tmp/r141/evidence')
          exe=Path(Path('/tmp/r141/WINEXE_PATH').read_text().strip())
          il=(ev/'r140/R140_FIXED_FULL.il').read_text(errors='replace')
          il_lines=il.splitlines()
          data=exe.read_bytes()
          pe=pefile.PE(str(exe),fast_load=False)

          def entropy(b):
              if not b: return 0.0
              c=collections.Counter(b); n=len(b)
              return -sum((v/n)*math.log2(v/n) for v in c.values())

          sections=[]
          for s in pe.sections:
              raw=s.get_data()
              sections.append({
                  'name':s.Name.rstrip(b'\0').decode('latin1','replace'),
                  'rva':hex(s.VirtualAddress),'raw_offset':hex(s.PointerToRawData),
                  'raw_size':len(raw),'virtual_size':int(s.Misc_VirtualSize),
                  'entropy':round(entropy(raw),4),'sha256':hashlib.sha256(raw).hexdigest(),
                  'characteristics':hex(s.Characteristics)
              })

          # IMAGE_COR20_HEADER and managed resource blob.
          cor=pe.OPTIONAL_HEADER.DATA_DIRECTORY[14]
          cor_info={'rva':hex(cor.VirtualAddress),'size':cor.Size}
          managed_resource=None
          if cor.VirtualAddress and cor.Size>=32:
              off=pe.get_offset_from_rva(cor.VirtualAddress)
              hdr=data[off:off+40]
              if len(hdr)>=32:
                  cb,maj,minr,md_rva,md_size,flags,entry,res_rva,res_size=struct.unpack_from('<IHHIIIIII',hdr,0)
                  cor_info.update({'cb':cb,'major':maj,'minor':minr,'metadata_rva':hex(md_rva),'metadata_size':md_size,
                                   'flags':hex(flags),'entrypoint_token_or_rva':hex(entry),'resources_rva':hex(res_rva),'resources_size':res_size})
                  if res_rva and res_size:
                      roff=pe.get_offset_from_rva(res_rva)
                      rb=data[roff:roff+res_size]
                      managed_resource={
                          'rva':hex(res_rva),'file_offset':hex(roff),'size':len(rb),
                          'sha256':hashlib.sha256(rb).hexdigest(),'entropy':round(entropy(rb),4),
                          'first64_hex':rb[:64].hex(),
                          'ascii_strings':[m.group().decode('latin1','replace')[:500] for m in re.finditer(rb'[\x20-\x7e]{5,}',rb)][:1000],
                          'utf16_strings':[m.group().decode('utf-16le','replace')[:500] for m in re.finditer(rb'(?:[\x20-\x7e]\x00){5,}',rb)][:1000],
                          'exact_ascii_18B4':rb.count(b'18B4')+rb.count(b'18b4'),
                          'exact_ascii_06B7':rb.count(b'06B7')+rb.count(b'06b7'),
                          'exact_ascii_6324':rb.count(b'6324'),'exact_ascii_1719':rb.count(b'1719'),
                          'le16_18B4':rb.count(struct.pack('<H',0x18B4)),'le16_06B7':rb.count(struct.pack('<H',0x06B7)),
                          'le32_6324':rb.count(struct.pack('<I',6324)),'le32_1719':rb.count(struct.pack('<I',1719)),
                      }
                      (ev/'R141_MANAGED_RESOURCE_BLOB.bin').write_bytes(rb)

          indicators={}
          terms=[
              'AesCryptoServiceProvider','RijndaelManaged','SHA1','MD5CryptoServiceProvider',
              'Debugger Detected','clrjit.dll','VirtualAlloc','WriteProcessMemory','GetDelegateForFunctionPointer',
              'ResourceA','DynamicMethod','ILGenerator','CreateDelegate','GetManifestResourceStream'
          ]
          for t in terms:
              indicators[t]=len(re.findall(re.escape(t),il,re.I))

          # Detect per-type runtime patch initializer pattern and stubbed HID-related methods.
          pst_count=len(re.findall(r"\.cctor\$PST[0-9A-Fa-f]+",il))
          patch_calls=len(re.findall(r'::yvgj74JvmW\(',il))
          protector_type_calls=len(re.findall(r'Q9Wet0jLP4YxXSyJBiC\.q71r2Rj8SiD9GF1BI50::',il))

          target_classes=['DSTech_AudioDSP_Client.UsbHidReporterDeviceInfo','DSTech_AudioDSP_Client.Hid','DSTech_AudioDSP_Client.HIDInterface']
          class_blocks=[]
          for cname in target_classes:
              start=next((i for i,l in enumerate(il_lines) if l.startswith('.class') and cname in l),None)
              if start is None:
                  # class declaration may wrap; match exact class simple name.
                  simple=cname.split('.')[-1]
                  start=next((i for i,l in enumerate(il_lines) if l.startswith('.class') and simple in l),None)
              if start is None: continue
              end=next((i for i in range(start+1,len(il_lines)) if il_lines[i].startswith('} // end of class') and cname.split('.')[-1] in il_lines[i]),min(len(il_lines),start+5000))
              block=il_lines[start:end+1]
              methods=[]
              i=0
              while i<len(block):
                  if block[i].lstrip().startswith('.method'):
                      hs=i; header=[]
                      while i<len(block) and '{' not in block[i]:
                          header.append(block[i].strip()); i+=1
                      if i<len(block): header.append(block[i].strip())
                      ms=i
                      # Find method end marker, easier than brace nesting in IL text.
                      j=i+1
                      while j<len(block) and '// end of method ' not in block[j]: j+=1
                      mb='\n'.join(block[hs:min(j+1,len(block))])
                      msize=re.search(r'Code size:\s*(\d+)',mb)
                      methods.append({
                          'header':' '.join(header)[:1600],
                          'code_size':int(msize.group(1)) if msize else None,
                          'has_patch_call':bool(re.search(r'::yvgj74JvmW\(',mb)),
                          'has_hid_read':bool(re.search(r'HidD_GetInputReport|HidRead|ReadFile',mb,re.I)),
                          'has_hid_write':bool(re.search(r'HidD_SetOutputReport|HidD_SetFeature|WriteFile|Send',mb,re.I)),
                          'excerpt':mb[:5000]
                      })
                      i=j
                  i+=1
              class_blocks.append({'class':cname,'method_count':len(methods),'methods':methods})

          hid_stub_methods=[]
          for cb in class_blocks:
              for m in cb['methods']:
                  h=m['header']
                  if re.search(r'VID|PID|GetHidDeviceList|HidRead|Connect|Send|ReadBytes|WriteBytes',h,re.I):
                      hid_stub_methods.append({'class':cb['class'],**m})
          tiny=[m for m in hid_stub_methods if m.get('code_size') is not None and m['code_size']<=8]

          # Search textual forms that would directly prove production identity, avoiding broad substring claims.
          exact_context=[]
          pair_re=re.compile(r'(?:VID[^\n]{0,60}(?:18B4|6324)[^\n]{0,120}PID[^\n]{0,60}(?:06B7|1719))|(?:18B4[^\n]{0,100}06B7)|(?:6324[^\n]{0,100}1719)',re.I)
          for srcname,txt in [('IL',il),( 'ASCII',(ev/'R141_ASCII_STRINGS.txt').read_text(errors='replace')),('UTF16',(ev/'R141_UTF16_STRINGS.txt').read_text(errors='replace')),('MANIFEST',(ev/'R141_MANIFEST.txt').read_text(errors='replace'))]:
              for m in pair_re.finditer(txt):
                  exact_context.append({'source':srcname,'text':m.group(0)[:1000]})

          out={
              'windows_exe_sha256':hashlib.sha256(data).hexdigest(),
              'pe_sections':sections,'cor20_header':cor_info,'managed_resource_blob':managed_resource,
              'protector_indicator_counts':indicators,
              'pst_static_initializer_count':pst_count,
              'runtime_patch_helper_call_count':patch_calls,
              'protector_type_call_count':protector_type_calls,
              'target_class_method_summaries':class_blocks,
              'hid_identity_transport_target_method_count':len(hid_stub_methods),
              'hid_identity_transport_tiny_stub_count':len(tiny),
              'hid_identity_transport_tiny_stubs':tiny,
              'exact_production_vidpid_textual_pair_contexts':exact_context,
          }
          (ev/'R141_PROTECTOR_RESOURCE_STATIC_ANALYSIS.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          PY

      - name: Build fail-closed R141 decision and report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          ev=Path('/tmp/r141/evidence')
          d=json.loads((ev/'R141_PROTECTOR_RESOURCE_STATIC_ANALYSIS.json').read_text())
          ind=d['protector_indicator_counts']
          prot=sum(1 for k in ['AesCryptoServiceProvider','Debugger Detected','clrjit.dll','VirtualAlloc','WriteProcessMemory','GetDelegateForFunctionPointer','DynamicMethod','CreateDelegate'] if ind.get(k,0)>0)
          rb=d.get('managed_resource_blob') or {}
          exact_pairs=d['exact_production_vidpid_textual_pair_contexts']
          tiny=d['hid_identity_transport_tiny_stub_count']; target=d['hid_identity_transport_target_method_count']
          protector=prot>=5 and d['runtime_patch_helper_call_count']>0
          stubbed=(target>0 and tiny>=max(3,target//3))
          resource_present=bool(rb and rb.get('size',0)>0)
          decision={
            'R140_FIXED_RUN_ID':35944184192,
            'R140_FIXED_JOB_ID':107458374505,
            'R140_FIXED_ARTIFACT_ID':10785578683,
            'R140_FIXED_ARTIFACT_DIGEST':'sha256:7a5baa680bd0e06d64191fdcbb142b258a77aa308821c03b9d938fbd27a0dcd8',
            'WINDOWS_EXE_SHA256':'3ca54171c53f7badd963ffe6851b8b3e2faf8aee8ba2afcb7040990e22ae09b2',
            'STATIC_PROTECTOR_INDICATOR_FAMILY_COUNT':prot,
            'PST_STATIC_INITIALIZER_COUNT':d['pst_static_initializer_count'],
            'RUNTIME_PATCH_HELPER_CALL_COUNT':d['runtime_patch_helper_call_count'],
            'HID_IDENTITY_TRANSPORT_TARGET_METHOD_COUNT':target,
            'HID_IDENTITY_TRANSPORT_TINY_STUB_COUNT':tiny,
            'MANAGED_RESOURCE_BLOB_PRESENT':resource_present,
            'MANAGED_RESOURCE_BLOB_SIZE':rb.get('size',0),
            'MANAGED_RESOURCE_BLOB_ENTROPY':rb.get('entropy'),
            'MANAGED_RESOURCE_EXACT_ASCII_18B4_COUNT':rb.get('exact_ascii_18B4',0),
            'MANAGED_RESOURCE_EXACT_ASCII_06B7_COUNT':rb.get('exact_ascii_06B7',0),
            'EXACT_PRODUCTION_VIDPID_TEXTUAL_PAIR_CONTEXT_COUNT':len(exact_pairs),
            'OFFICIAL_WINDOWS_ANTITAMPER_RUNTIME_PATCHING_STATICALLY_SUPPORTED':protector,
            'HID_TARGET_METHODS_APPEAR_PROTECTED_OR_RUNTIME_PATCHED':stubbed,
            'PRODUCTION_VIDPID_RECOVERED_FROM_STATIC_RESOURCE_OR_VISIBLE_IL':bool(exact_pairs),
            'IMPORTANT_INTERPRETATION':'The official Windows client contains anti-tamper/runtime method-patching machinery. Visible HID method stubs and generic HID APIs do not reveal the post-patch transport implementation. Resource/numeric coincidences are not production VID/PID proof without semantic pairing.',
            'OFFICIAL_WINDOWS_PRODUCTION_USBHID_LINKAGE_STATICALLY_PROVEN':False,
            'READ_ONLY_IDENTIFY_PATH_STATICALLY_PROVEN_FOR_PRODUCTION':False,
            'SAFE_READ_ONLY_STOCK_BACKUP_PROVEN':False,
            'PRODUCTION_BOOTSTRAP_BRIDGE_PROVEN':False,
            'PRODUCTION_RECOVERY_USB_IDENTITY_PROVEN':False,
            'ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD':False,
            'AA55_LIVE_RETEST_ALLOWED':False,
            'RUNTIME_0X11_ALLOWED':False,
            'RUNTIME_0XFE_ALLOWED':False,
            'VENDOR_BINARY_EXECUTED':False,
            'USB_DEVICE_ACCESSED':False,
            'BOARD_CONTACTED':False,
            'FLASH_ALLOWED':False,
            'NEXT':('If a managed resource blob and protector decrypt/patch routine are statically recoverable, trace only the resource format, key/IV derivation, method-token map, and reconstruct HID method bodies offline. Do not execute the protected client or transmit USB.' if resource_present and protector else 'Windows protected bodies are not statically exposed by current evidence; pivot to Android native transport/static resources while keeping all live traffic blocked.')
          }
          (ev/'R141_DECISION.json').write_text(json.dumps(decision,indent=2,ensure_ascii=False)+'\n')
          (ev/'R141_REPORT_TH.md').write_text(
            '# R141 official Windows protector/resource static reverse\n\n'
            f'- protector indicator families: {prot}\n'
            f'- PST initializers: {decision["PST_STATIC_INITIALIZER_COUNT"]}\n'
            f'- runtime patch helper calls: {decision["RUNTIME_PATCH_HELPER_CALL_COUNT"]}\n'
            f'- HID identity/transport targets: {target}\n'
            f'- tiny protected/stub targets: {tiny}\n'
            f'- managed resource blob: {resource_present}, size={decision["MANAGED_RESOURCE_BLOB_SIZE"]}\n'
            f'- exact semantic production VID/PID pair contexts: {len(exact_pairs)}\n\n'
            'FLASH_ALLOWED=NO\n')
          print(json.dumps(decision,indent=2,ensure_ascii=False))
          PY

      - name: Package R141 evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r141/evidence
          zip -9 -r /tmp/R141_EXACT_OFFICIAL_WINDOWS_PROTECTOR_RESOURCE_STATIC_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/R141_EXACT_OFFICIAL_WINDOWS_PROTECTOR_RESOURCE_STATIC_EVIDENCE.zip > /tmp/R141_EXACT_OFFICIAL_WINDOWS_PROTECTOR_RESOURCE_STATIC_EVIDENCE.zip.sha256

      - name: Upload R141 evidence
        uses: actions/upload-artifact@v4
        with:
          name: R141-EXACT-OFFICIAL-WINDOWS-PROTECTOR-RESOURCE-STATIC-EVIDENCE
          path: |
            /tmp/R141_EXACT_OFFICIAL_WINDOWS_PROTECTOR_RESOURCE_STATIC_EVIDENCE.zip
            /tmp/R141_EXACT_OFFICIAL_WINDOWS_PROTECTOR_RESOURCE_STATIC_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'R141_VENDOR_BINARY_EXECUTED=NO' /tmp/r141/evidence/R141_SAFETY.txt
          grep -F 'R141_WINDOWS_EXE_EXECUTED=NO' /tmp/r141/evidence/R141_SAFETY.txt
          grep -F 'R141_USB_DEVICE_ACCESS=NO' /tmp/r141/evidence/R141_SAFETY.txt
          grep -F 'R141_BOARD_CONTACT=NO' /tmp/r141/evidence/R141_SAFETY.txt
          grep -F 'R141_AA55_SENT=NO' /tmp/r141/evidence/R141_SAFETY.txt
          grep -F 'R141_RUNTIME_0X11_SENT=NO' /tmp/r141/evidence/R141_SAFETY.txt
          grep -F 'R141_RUNTIME_0XFE_SENT=NO' /tmp/r141/evidence/R141_SAFETY.txt
          grep -F '"FLASH_ALLOWED": false' /tmp/r141/evidence/R141_DECISION.json
          echo R141_STATIC_PROTECTOR_RESOURCE_REVERSE_COMPLETE=YES
          echo FLASH_ALLOWED=NO
