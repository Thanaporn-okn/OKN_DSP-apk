              private Map<Integer,Integer> parseHidReportLengths(byte[] raw){
                  Map<Integer,Integer> out=new java.util.HashMap<>();
                  if(raw==null)return out;
                  int p=0,currentIf=-1,currentClass=-1;
                  while(p+2<=raw.length){
                      int len=raw[p]&255;
                      int type=raw[p+1]&255;
                      if(len<2 || p+len>raw.length)break;
                      if(type==0x04 && len>=9){
                          currentIf=raw[p+2]&255;
                          currentClass=raw[p+5]&255;
                      }else if(type==0x21 && currentClass==3 && currentIf>=0 && len>=9){
                          int num=raw[p+5]&255;
                          int q=p+6;
                          for(int k=0;k<num && q+2<p+len;k++,q+=3){
                              int dtype=raw[q]&255;
                              int dlen=(raw[q+1]&255)|((raw[q+2]&255)<<8);
                              if(dtype==0x22 && dlen>0){
                                  out.put(currentIf,dlen);
                                  break;
                              }
                          }
                      }
                      p+=len;
                  }
                  return out;
              }

              private int readHidReportDescriptor(
                  UsbDeviceConnection c, UsbInterface x, int expectedLen, String phase){
                  int ask=expectedLen>0 ? expectedLen : 4096;
                  byte[] report=new byte[ask];
                  int r=c.controlTransfer(0x81,0x06,0x2200,x.getId(),report,report.length,1500);
                  line("IF"+x.getId()+" "+phase+"_HID_GET_DESCRIPTOR_RESULT="+r+
                      " requestedBytes="+ask);
                  if(r>0){
                      byte[] exact=new byte[r];
                      System.arraycopy(report,0,exact,0,r);
                      line("IF"+x.getId()+" reportExpectedBytes="+expectedLen);
                      line("IF"+x.getId()+" reportBytes="+r);
                      line("IF"+x.getId()+" reportSHA256="+sha256(exact));
                      line("IF"+x.getId()+" reportHex="+hex(exact));
                  }
                  return r;
              }

              private void readDescriptorsOnly(UsbDevice d){
                  descriptorEvidenceComplete=false;
                  if(!usb.hasPermission(d)){
                      line("READ_DESCRIPTOR_SKIPPED_NO_PERMISSION=true");
                      return;
                  }
                  UsbDeviceConnection c=usb.openDevice(d);
                  if(c==null){line("openDevice=null");return;}
                  try{
                      descriptorSessionCount++;
                      line("READ_ONLY_DESCRIPTOR_SESSION_BEGIN=true");
                      line("descriptorSessionCount="+descriptorSessionCount);
                      boolean rawOk=false;
                      byte[] raw=c.getRawDescriptors();
                      Map<Integer,Integer> hidLengths=new java.util.HashMap<>();
                      if(raw!=null && raw.length>0){
                          rawOk=true;
                          line("rawDescriptorBytes="+raw.length);
                          line("rawDescriptorSHA256="+sha256(raw));
                          line("rawDescriptorHex="+hex(raw));
                          hidLengths=parseHidReportLengths(raw);
                          line("parsedHidReportLengths="+hidLengths.toString());
                      }else{
                          line("rawDescriptorBytes=0");
                      }
                      int hidCount=0;
                      int hidOk=0;
                      for(int n=0;n<d.getInterfaceCount();n++){
                          UsbInterface x=d.getInterface(n);
                          if(x.getInterfaceClass()!=3)continue;
                          hidCount++;
                          int expectedLen=hidLengths.containsKey(x.getId())
                              ? hidLengths.get(x.getId()) : 0;
                          line("IF"+x.getId()+" HID_REPORT_DESCRIPTOR_EXPECTED_BYTES="+expectedLen);
                          int r=readHidReportDescriptor(c,x,expectedLen,"EXACT_UNCLAIMED");
                          if(r<=0){
                              boolean claimed=false;
                              try{
                                  claimed=c.claimInterface(x,false);
                                  line("IF"+x.getId()+" CLAIM_INTERFACE_FORCE_FALSE="+claimed);
                                  if(claimed){
                                      r=readHidReportDescriptor(c,x,expectedLen,"EXACT_CLAIMED");
                                  }
                              }finally{
                                  if(claimed){
                                      boolean released=c.releaseInterface(x);
                                      line("IF"+x.getId()+" RELEASE_INTERFACE="+released);
                                  }
                              }
                          }
                          if(r>0)hidOk++;
                      }
                      line("hidInterfaceCount="+hidCount);
                      line("hidDescriptorSuccessCount="+hidOk);
                      descriptorEvidenceComplete=rawOk && hidCount>0 && hidOk==hidCount;
                      line("DESCRIPTOR_EVIDENCE_COMPLETE="+descriptorEvidenceComplete);
                      line("READ_ONLY_DESCRIPTOR_SESSION_END=true");
                  }catch(Exception e){
                      descriptorEvidenceComplete=false;
                      line("DESCRIPTOR_EVIDENCE_COMPLETE=false");
                      line("descriptor error="+e);
                  }finally{
                      c.close();
                  }
              }

