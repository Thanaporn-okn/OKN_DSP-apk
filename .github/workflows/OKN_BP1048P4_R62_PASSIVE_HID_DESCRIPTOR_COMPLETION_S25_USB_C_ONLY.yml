      - name: Fetch pinned NDS32 toolchain archive and cross-compile R58 core
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y -qq libc6-i386 lib32z1 xz-utils >/dev/null

          rm -rf /tmp/r62/nds32-toolchain /tmp/r62/nds32-toolchain.txz
          mkdir -p /tmp/r62/nds32-toolchain

          # R62 FIXED V3: Ai-Thinker-Open/Andestech is no longer a reliable
          # public source. Use the exact toolchain archive published in the
          # public xingrz/nds-builder repository, pinned by commit and Git blob.
          NDS_BUILDER_COMMIT=572969caccb1d0c576b2893c905fa7b3396815e4
          NDS_TOOLCHAIN_BLOB=04f39c878b1ac9eca7628e3c6170d4eb5eb58030
          NDS_ARCHIVE=nds32le-elf-mculib-v3s.4.9.4.txz
          NDS_RAW="https://raw.githubusercontent.com/xingrz/nds-builder/${NDS_BUILDER_COMMIT}/${NDS_ARCHIVE}"
          NDS_FALLBACK="https://github.com/xingrz/nds-builder/raw/${NDS_BUILDER_COMMIT}/${NDS_ARCHIVE}"

          if ! curl -fL --retry 4 --retry-all-errors --connect-timeout 20 \
              "$NDS_RAW" -o /tmp/r62/nds32-toolchain.txz; then
            curl -fL --retry 4 --retry-all-errors --connect-timeout 20 \
              "$NDS_FALLBACK" -o /tmp/r62/nds32-toolchain.txz
          fi

          test -s /tmp/r62/nds32-toolchain.txz
          ACTUAL_BLOB="$(git hash-object /tmp/r62/nds32-toolchain.txz)"
          printf 'source_repo=xingrz/nds-builder\ncommit=%s\nexpected_git_blob=%s\nactual_git_blob=%s\n' \
            "$NDS_BUILDER_COMMIT" "$NDS_TOOLCHAIN_BLOB" "$ACTUAL_BLOB" \
            | tee /tmp/r62/evidence/R62_NDS32_SOURCE.txt
          test "$ACTUAL_BLOB" = "$NDS_TOOLCHAIN_BLOB"

          tar -xJf /tmp/r62/nds32-toolchain.txz -C /tmp/r62/nds32-toolchain

          # FIXED V3: do not require the compiler entry itself to be a regular file.
          # Some toolchain archives expose gcc through a symlink. Also avoid
          # `find | head` under `set -o pipefail`, which can fail on SIGPIPE.
          GCC_PATH="$(find /tmp/r62/nds32-toolchain \
            -name nds32le-elf-gcc -path '*/bin/*' -print -quit)"
          if [ -z "$GCC_PATH" ]; then
            echo 'R62_FAIL nds32le-elf-gcc not found after verified archive extraction' >&2
            find /tmp/r62/nds32-toolchain -maxdepth 5 -path '*/bin/*' -print | sed -n '1,200p' >&2
            exit 1
          fi
          TOOL="$(dirname "$GCC_PATH")"
          printf 'gcc_path=%s\ntool_dir=%s\n' "$GCC_PATH" "$TOOL" \
            | tee -a /tmp/r62/evidence/R62_NDS32_SOURCE.txt
          ls -l "$GCC_PATH" "$TOOL/nds32le-elf-nm" \
            | tee -a /tmp/r62/evidence/R62_NDS32_SOURCE.txt
          test -x "$GCC_PATH"
          test -x "$TOOL/nds32le-elf-nm"

          echo "$TOOL" >> "$GITHUB_PATH"
          export PATH="$TOOL:$PATH"

          # sed reads the full stream, avoiding the SIGPIPE behavior of head.
          nds32le-elf-gcc --version | sed -n '1p' | tee /tmp/r62/evidence/R62_NDS32_TOOLCHAIN.txt
          nds32le-elf-gcc -dumpmachine | tee -a /tmp/r62/evidence/R62_NDS32_TOOLCHAIN.txt

          cd "$R58_ROOT"
          make clean
          make nds32 2>&1 | tee /tmp/r62/evidence/R62_NDS32_BUILD.log
          grep -q 'R58_NDS32_LIBRARY_PASS' /tmp/r62/evidence/R62_NDS32_BUILD.log

          LIB=build_nds32/libokn_r58_true7ch.a
          test -s "$LIB"

          nds32le-elf-nm -g --defined-only "$LIB" > /tmp/r62/evidence/R62_NDS32_SYMBOLS.txt
          for sym in okn57_gain_process_lane okn57_vendor_comm_handle okn57_process_dac0 okn57_process_dacx okn57_process_i2s0 okn57_process_i2s1; do
            grep -q "$sym" /tmp/r62/evidence/R62_NDS32_SYMBOLS.txt
          done

          if grep -E 'GPIO_PortAModeSet|AudioI2S_Init|AudioDAC_Init|SpiFlashErase|SpiFlashWrite' /tmp/r62/evidence/R62_NDS32_SYMBOLS.txt; then
            echo 'R62_FAIL forbidden routing/flash symbol in custom library' >&2
            exit 1
          fi

          cp "$LIB" /tmp/r62/out/
          sha256sum "$LIB" > /tmp/r62/evidence/R62_NDS32_LIBRARY.sha256

      - name: Offline repository firmware and production-artifact discovery
        shell: bash
        env:
          CANDIDATE_PATH: ${{ github.event.inputs.candidate_path || '' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,hashlib,json,zipfile,re
          root=Path(os.environ['GITHUB_WORKSPACE']).resolve()
          preferred=(os.environ.get('CANDIDATE_PATH') or '').strip()
          exts={'.mva','.bin','.img','.fw','.rom','.ota','.dfu','.adx','.upd','.hex','.pack','.pkg','.zip'}
          skip_parts={'.git','node_modules','build','.gradle'}
          max_size=128*1024*1024
          def crc16(data):
            crc=0
            for q in data:
              crc ^= q<<8
              for _ in range(8): crc=((crc<<1)^0x1021)&0xffff if crc&0x8000 else (crc<<1)&0xffff
            return crc
          rows=[]
          for p in root.rglob('*'):
            if not p.is_file() or p.suffix.lower() not in exts: continue
            if any(x in skip_parts for x in p.parts): continue
            try: size=p.stat().st_size
            except: continue
            if size<=0 or size>max_size: continue
            data=p.read_bytes()
            low=data.lower()
            ascii_head=data[:2*1024*1024].decode('latin1','ignore').lower()
            rel=str(p.relative_to(root))
            rec={
              'path':rel,'size':size,'sha256':hashlib.sha256(data).hexdigest(),
              'crc16_xmodem':f'{crc16(data):04X}',
              'mva_magic':data[:4]==bytes([0x4d,0x56,0xb1,0x58]),
              'contains_runtime_vidpid_ascii':('6324' in ascii_head and '1719' in ascii_head),
              'contains_board_identity_ascii':('jmdstech' in ascii_head or 'dstech dsp' in ascii_head),
              'contains_bp1048_ascii':('bp1048' in ascii_head),
              'prioritized': bool(preferred and rel==preferred),
            }
            if p.suffix.lower()=='.zip':
              try:
                with zipfile.ZipFile(p) as z:
                  names=z.namelist()[:1000]
                joined='\n'.join(names).lower()
                rec['zip_entry_count']=len(names)
                rec['zip_has_firmware_like_name']=any(Path(n).suffix.lower() in exts-{'.zip'} for n in names)
                rec['zip_names_contain_target']=('bp1048' in joined or 'dstech' in joined or 'jmdstech' in joined)
              except Exception as e: rec['zip_error']=str(e)
            rows.append(rec)
          rows.sort(key=lambda x:(not x['prioritized'],not x['contains_board_identity_ascii'],not x['contains_bp1048_ascii'],x['path']))
          material=[r for r in rows if r['prioritized'] or r['contains_board_identity_ascii'] or (r['contains_bp1048_ascii'] and r.get('zip_has_firmware_like_name'))]
          report={
            'candidate_count':len(rows),
            'material_candidate_count':len(material),
            'preferred_path':preferred,
            'candidates':rows,
            'material_candidates':material,
            'exact_board_artifact_validated':False,
            'safe_stock_backup_validated':False,
            'rollback_validated':False,
            'flash_allowed':False,
            'note':'Filename/string/signature matches are discovery evidence only; they do not prove image acceptance or rollback.'
          }
          Path('/tmp/r62/evidence/R62_FIRMWARE_DISCOVERY.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n')
          md=['# R62 firmware/update artifact discovery','',f"- candidates: **{len(rows)}**",f"- material candidates needing offline review: **{len(material)}**",'- exact-board artifact validated: **NO**','- safe stock backup validated: **NO**','- rollback validated: **NO**','- `FLASH_ALLOWED=NO`','']
          for r in material[:20]: md += [f"## {r['path']}",f"- SHA256: `{r['sha256']}`",f"- size: {r['size']}",'']
          Path('/tmp/r62/evidence/R62_FIRMWARE_DISCOVERY.md').write_text('\n'.join(md))
          PY

      - name: R62 offline MVA/container structural audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,zipfile
          root=Path(__import__('os').environ['GITHUB_WORKSPACE']).resolve()
          exts={'.mva','.bin','.img','.fw','.rom','.ota','.dfu','.adx','.upd'}
          rows=[]
          def parse_mva(data):
            out={'magic_ok':data[:4]==bytes([0x4d,0x56,0xb1,0x58]),'complete':False,'records':[],'trailing_bytes':None}
            if not out['magic_ok'] or len(data)<5:return out
            count=data[4]; p=5
            out['record_count_declared']=count
            for n in range(count):
              if p+5>len(data): out['error']='record header truncated'; return out
              rid=data[p]; ln=int.from_bytes(data[p+1:p+5],'little'); p+=5
              if ln>len(data)-p: out['error']='record payload truncated'; return out
              payload=data[p:p+ln]
              out['records'].append({'index':n,'id':rid,'length':ln,'sha256':hashlib.sha256(payload).hexdigest()})
              p+=ln
            out['complete']=True; out['trailing_bytes']=len(data)-p
            return out
          for p in root.rglob('*'):
            if not p.is_file() or p.suffix.lower() not in exts: continue
            try:data=p.read_bytes()
            except Exception:continue
            if not data or len(data)>128*1024*1024: continue
            rec={'path':str(p.relative_to(root)),'size':len(data),'sha256':hashlib.sha256(data).hexdigest()}
            if p.suffix.lower()=='.mva' or data[:4]==bytes([0x4d,0x56,0xb1,0x58]): rec['mva']=parse_mva(data)
            rows.append(rec)
          valid=[r for r in rows if r.get('mva',{}).get('complete')]
          report={
            'revision':'R62',
            'artifact_count':len(rows),
            'structurally_complete_mva_count':len(valid),
            'artifacts':rows,
            'exact_board_acceptance_proven':False,
            'stock_backup_proven':False,
            'rollback_proven':False,
            'flash_allowed':False,
            'note':'Container structure and hashes are offline evidence only; they are not proof that the exact production board accepts an image.'
          }
          Path('/tmp/r62/evidence/R62_CONTAINER_AUDIT.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n')
          Path('/tmp/r62/evidence/R62_CONTAINER_AUDIT.md').write_text(
            '# R62 container audit\n\n'+
            f'- firmware-like artifacts: **{len(rows)}**\n'+
            f'- structurally complete MVA containers: **{len(valid)}**\n'+
            '- exact-board acceptance: **NOT PROVEN**\n'+
            '- rollback: **NOT PROVEN**\n'+
            '- `FLASH_ALLOWED=NO`\n')
          print('R62_OFFLINE_CONTAINER_AUDIT_PASS')
          PY

