name: OKN BP1048P4 R62 PASSIVE HID DESCRIPTOR COMPLETION S25 USB-C ONLY

"on":
  workflow_dispatch:
    inputs:
      candidate_path:
        description: "Optional repo-relative exact-board firmware/update artifact to prioritize for OFFLINE analysis"
        required: false
        default: ""
  push:
    paths:
      - '.github/workflows/OKN_BP1048P4_R62_PASSIVE_HID_DESCRIPTOR_COMPLETION_S25_USB_C_ONLY.yml'
      - 'firmware/**'
      - 'Firmware/**'
      - '**/*.mva'
      - '**/*.bin'
      - '**/*.img'
      - '**/*.fw'
      - '**/*.rom'
      - '**/*.ota'
      - '**/*.dfu'
      - '**/*.adx'
      - '**/*.upd'

permissions:
  contents: read

env:
  REQUIRED_PHONE: "Samsung Galaxy S25+"
  REQUIRED_PATH: "Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only"
  TARGET_SOC: "MVSilicon BP1048P4"
  TARGET_BOARD: "JMDSTECH DSTech DSP ComboDigitalArchitect"
  RUNTIME_VID_HEX: "6324"
  RUNTIME_PID_HEX: "1719"
  REFERENCE_RECOVERY_VID_HEX: "0000"
  REFERENCE_RECOVERY_PID_HEX: "2244"
  SDK_REPO: "https://github.com/leadercxn/bp1048_sdk_v0.1.12.git"
  SDK_COMMIT: "8105bd864b04995d81c9f9ae77cb158259f39015"
  R58_ZIP_SHA256: "30bf4d5e536b4b511cd24c934422f31288b60613fc70b8afaae48bc44e9f565a"
  FLASH_ALLOWED: "NO"
  HOST_TO_DEVICE_HID_ALLOWED: "NO"
  FLASHBOOT_AA_ALLOWED: "NO"
  RECOVERY_COMMAND_ALLOWED: "NO"
  ERASE_ALLOWED: "NO"
  WRITE_ALLOWED: "NO"

jobs:
  r61-evidence-gate:
    name: R62 passive HID descriptor completion + DSP build gate + S25 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - name: Checkout project repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Immutable deployment and safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$REQUIRED_PHONE" = "Samsung Galaxy S25+"
          test "$REQUIRED_PATH" = "Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only"
          test "$FLASH_ALLOWED" = "NO"
          test "$HOST_TO_DEVICE_HID_ALLOWED" = "NO"
          test "$FLASHBOOT_AA_ALLOWED" = "NO"
          test "$RECOVERY_COMMAND_ALLOWED" = "NO"
          test "$ERASE_ALLOWED" = "NO"
          test "$WRITE_ALLOWED" = "NO"

          rm -rf /tmp/r62
          mkdir -p /tmp/r62/{base,evidence,out,sdk,scan}

          cat > /tmp/r62/evidence/R62_SAFETY.txt <<'EOF'
          REQUIRED_PHONE=Samsung Galaxy S25+
          REQUIRED_PATH=Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only
          SOLDER_ALLOWED=NO
          BOARD_MOD_ALLOWED=NO
          EXTERNAL_PROGRAMMER_ALLOWED=NO
          JTAG_ALLOWED=NO
          SDP_ALLOWED=NO
          AICE_ALLOWED=NO
          HARDWARE_PROBE_ALLOWED=NO
          HOST_TO_DEVICE_HID_ALLOWED=NO
          AA55_LIVE_RETEST_ALLOWED=NO
          RECOVERY_COMMAND_ALLOWED=NO
          FLASH_ERASE_ALLOWED=NO
          FLASH_WRITE_ALLOWED=NO
          FLASH_ALLOWED=NO
          EOF

      - name: Restore exact R58 source package embedded in this workflow
        shell: bash
        run: |
