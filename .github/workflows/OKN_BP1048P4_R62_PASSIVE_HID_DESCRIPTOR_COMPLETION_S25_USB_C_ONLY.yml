      - name: Verify R58 source manifest and immutable TRUE7CH contract
        shell: bash
        run: |
          set -euo pipefail
          cd "$R58_ROOT"
          sha256sum -c R58_SHA256_MANIFEST.txt
          python3 - <<'PY'
          import json
          s=json.load(open('R58_STATUS.json',encoding='utf-8'))
          assert s['revision']=='R58'
          assert s['target'].startswith('MVSilicon BP1048P4')
          assert s['core_channels']==7
          assert s['dedicated_gain_ids']==[22,23,24,25,26,27,28]
          assert s['gain_range_db']==[-70.0,6.0]
          assert s['gain_step_db']==0.5
          assert s['first_flash_writer_enabled'] is False
          assert s['flash_allowed'] is False
          print('R62_R58_BASE_CONTRACT_PASS')
          PY

      - name: Build and test TRUE7CH 7x15 PEQ dedicated-gain core
        shell: bash
        run: |
          set -euo pipefail
          cd "$R58_ROOT"
          make clean
          make test 2>&1 | tee /tmp/r62/evidence/R62_HOST_TEST.log
          grep -q 'PASS R57: 7CH dedicated Q24 gain' /tmp/r62/evidence/R62_HOST_TEST.log
          grep -q 'R57_NO_EQ_AS_GAIN_PASS' /tmp/r62/evidence/R62_HOST_TEST.log
          grep -q 'R58_HID_256_SOURCE_BUFFER_PASS' /tmp/r62/evidence/R62_HOST_TEST.log
          grep -q 'R58_SAMPLE_RATE_FAIL_OPEN_PASS' /tmp/r62/evidence/R62_HOST_TEST.log
          grep -q 'R58_PRODUCTION_7CH_GATE_CLOSED_PASS' /tmp/r62/evidence/R62_HOST_TEST.log

      - name: ASAN and UBSAN regression gate
        shell: bash
        run: |
          set -euo pipefail
          cd "$R58_ROOT"
          make sanitize 2>&1 | tee /tmp/r62/evidence/R62_SANITIZE.log
          ! grep -E 'ERROR: AddressSanitizer|runtime error:' /tmp/r62/evidence/R62_SANITIZE.log

      - name: Pin exact public BP1048 SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone -q "$SDK_REPO" /tmp/r62/sdk/repo
          git -C /tmp/r62/sdk/repo checkout -q "$SDK_COMMIT"
          test "$(git -C /tmp/r62/sdk/repo rev-parse HEAD)" = "$SDK_COMMIT"
          git -C /tmp/r62/sdk/repo status --porcelain > /tmp/r62/evidence/R62_SDK_PREPATCH_STATUS.txt
          test ! -s /tmp/r62/evidence/R62_SDK_PREPATCH_STATUS.txt

      - name: Deep static topology audit of pinned SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re,hashlib
          root=Path('/tmp/r62/sdk/repo')
          needles={
            'i2s0':['I2S0','PERIPHERAL_ID_I2S0_TX','CFG_RES_I2S_PORT 0'],
            'i2s1':['I2S1','PERIPHERAL_ID_I2S1_TX','CFG_RES_I2S_PORT 1'],
            'i2sout':['AUDIO_I2SOUT_SINK','CFG_RES_AUDIO_I2SOUT_EN'],
            'dac0':['AUDIO_DAC0_SINK','AudioDAC_Init'],
            'dacx':['AUDIO_DACX_SINK','DACX'],
          }
          text_ext={'.c','.h','.s','.S','.mk','.txt','.ini','.cfg','.cmake','.py'}
          hits={k:[] for k in needles}
          dual_files=[]
          for p in root.rglob('*'):
            if not p.is_file() or p.suffix not in text_ext: continue
            try: t=p.read_text(errors='ignore')
            except: continue
            rel=str(p.relative_to(root))
            for k,ns in needles.items():
              if any(n in t for n in ns): hits[k].append(rel)
            if (('I2S0' in t or 'I2S_0' in t) and ('I2S1' in t or 'I2S_1' in t)):
              dual_files.append(rel)
          app=root/'BT_Audio_APP/bt_audio_app_src/inc/app_config.h'
          app_text=app.read_text(errors='ignore') if app.exists() else ''
          default_i2sout=bool(re.search(r'^\s*#define\s+CFG_RES_AUDIO_I2SOUT_EN\b',app_text,re.M))
          selected=None
          m=re.search(r'^\s*#define\s+CFG_RES_I2S_PORT\s+([01])\b',app_text,re.M)
          if m: selected=int(m.group(1))
          out={
            'sdk_commit':'8105bd864b04995d81c9f9ae77cb158259f39015',
            'logical_target_channels':7,
            'target_logical_lanes':['DAC0-L','DAC0-R','DACX','I2S0-L','I2S0-R','I2S1-L','I2S1-R'],
            'default_i2sout_enabled':default_i2sout,
            'selected_i2s_port':selected,
            'public_sample_default_simultaneous_physical_lanes':5 if default_i2sout else 3,
            'public_sample_max_proven_with_one_i2sout':5,
            'dual_i2s_textual_files':sorted(set(dual_files))[:200],
            'hits':{k:sorted(set(v))[:200] for k,v in hits.items()},
            'production_7ch_output_mapping_proven':False,
            'reason':'Public sample config exposes one compile-time I2SOUT sink; textual dual-I2S references are not production-board routing proof.'
          }
          Path('/tmp/r62/evidence/R62_TOPOLOGY_AUDIT.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          md=['# R62 topology audit','',f"- default I2SOUT enabled: **{default_i2sout}**",f"- selected public I2S port: **{selected}**",f"- sample max proven simultaneous lanes: **5**",f"- files mentioning both I2S0 and I2S1: **{len(dual_files)}**",'- production 7-output mapping proven: **NO**','']
          Path('/tmp/r62/evidence/R62_TOPOLOGY_AUDIT.md').write_text('\n'.join(md))
          PY

      - name: Build R62 read-only USB/HID protocol evidence map from pinned SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re,hashlib
          root=Path('/tmp/r62/sdk/repo')
          audio=root/'BT_Audio_APP/bt_audio_app_src/audio'
          comm=audio/'communication.h'
          appcfg=root/'BT_Audio_APP/bt_audio_app_src/inc/app_config.h'
          assert comm.exists(), 'communication.h missing'
          assert appcfg.exists(), 'app_config.h missing'
          ct=comm.read_text(errors='ignore')
          ac=appcfg.read_text(errors='ignore')
          assert 'HIDUsb_Tx' in ct and 'HIDUsb_Rx' in ct, 'SDK HID Tx/Rx declarations missing'
          ac_low=ac.lower()
          mva_upgrade_static=('mva' in ac_low and 'flash boot' in ac_low)
          usb_device_mva_static=('mva' in ac_low and 'usbdevice' in ac_low)
          communication_by_usb=bool(re.search(r'^\s*#define\s+CFG_COMMUNICATION_BY_USB\b',ac,re.M))

          frame_rows=[]
          controls={}
          byte_re=re.compile(r'0x([0-9A-Fa-f]{1,2})')
          for p in sorted(audio.rglob('*.c')):
            txt=p.read_text(errors='ignore')
            vals=[int(x,16) for x in byte_re.findall(txt)]
            # Discovery-only parser: locate SDK parameter blobs A5 5A <control> <len> ... 16.
            for i in range(max(0,len(vals)-4)):
              if vals[i:i+2] != [0xA5,0x5A]: continue
              control=vals[i+2]; declared=vals[i+3]
              end=i+4+declared
              tail_ok=end < len(vals) and vals[end]==0x16
              row={
                'file':str(p.relative_to(root)),
                'control_word':control,
                'declared_length':declared,
                'tail_16_at_declared_end':tail_ok,
              }
              frame_rows.append(row)
              controls.setdefault(f'{control:02X}',0); controls[f'{control:02X}']+=1

          flash_terms=['SpiFlashWrite','SpiFlashErase','FlashChipErase','FlashSectorErase','ObexUpgrade']
          flash_hits={k:[] for k in flash_terms}
          text_ext={'.c','.h','.s','.S','.py','.txt','.mk'}
          for p in root.rglob('*'):
            if not p.is_file() or p.suffix not in text_ext: continue
            try: t=p.read_text(errors='ignore')
            except Exception: continue
            rel=str(p.relative_to(root))
            for k in flash_terms:
              if k in t: flash_hits[k].append(rel)

          report={
            'revision':'R62',
            'sdk_commit':'8105bd864b04995d81c9f9ae77cb158259f39015',
            'hidusb_tx_declared':True,
            'hidusb_rx_declared':True,
            'communication_by_usb_enabled_in_sample':communication_by_usb,
            'flash_boot_mva_upgrade_static_evidence':mva_upgrade_static,
            'usb_device_mva_usercode_upgrade_static_evidence':usb_device_mva_static,
            'runtime_frame_signature':'A5 5A <control> <length> ... 16',
            'parameter_frame_candidates':len(frame_rows),
            'unique_control_words':sorted(controls),
            'control_occurrences':controls,
            'sample_frames':frame_rows[:200],
            'sdk_flash_or_upgrade_primitive_hits':flash_hits,
            'interpretation':'Static SDK evidence only. Presence of flash/update primitives does not prove this board production updater protocol.',
            'host_to_device_runtime_probe_enabled':False,
            'recovery_probe_enabled':False,
            'flash_allowed':False,
          }
          Path('/tmp/r62/evidence/R62_USB_PROTOCOL_EVIDENCE.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n')
          md=[
            '# R62 USB/HID protocol evidence', '',
            '- SDK declares `HIDUsb_Tx` and `HIDUsb_Rx`: **YES**',
            f'- sample config enables USB tuning transport: **{communication_by_usb}**',
            f'- static flash-boot MVA upgrade evidence: **{mva_upgrade_static}**',
            f'- static USB-device MVA usercode-upgrade evidence: **{usb_device_mva_static}**',
            f'- A5 5A parameter-frame candidates found: **{len(frame_rows)}**',
            f'- unique control words observed in static SDK blobs: **{len(controls)}**',
            '- host-to-device runtime probe: **DISABLED**',
            '- recovery probe: **DISABLED**',
            '- flash/write/erase: **DISABLED**', '',
            'This stage maps evidence only; it does not assume that any public-SDK updater primitive is valid for the exact production board.'
          ]
          Path('/tmp/r62/evidence/R62_USB_PROTOCOL_EVIDENCE.md').write_text('\n'.join(md)+'\n')
          assert communication_by_usb, 'public sample does not enable CFG_COMMUNICATION_BY_USB as expected'
          assert mva_upgrade_static and usb_device_mva_static, 'public sample MVA/USB-device upgrade evidence not found'
          assert frame_rows, 'no A5 5A parameter frames discovered in SDK audio sources'
          print('R62_USB_PROTOCOL_STATIC_EVIDENCE_PASS')
          PY

