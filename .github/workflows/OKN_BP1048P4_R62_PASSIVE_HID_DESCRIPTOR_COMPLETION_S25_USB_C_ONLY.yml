              private String fileName(Uri u){
                  String n="<unknown>";
                  try(Cursor c=getContentResolver().query(u,null,null,null,null)){
                      if(c!=null && c.moveToFirst()){
                          int i=c.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                          if(i>=0)n=c.getString(i);
                      }
                  }catch(Exception ignored){}
                  return n;
              }

              private byte[] readAll(Uri u)throws Exception{
                  try(InputStream in=getContentResolver().openInputStream(u);
                      ByteArrayOutputStream out=new ByteArrayOutputStream()){
                      if(in==null)throw new IllegalStateException("openInputStream=null");
                      byte[] buf=new byte[8192];
                      int total=0,r;
                      while((r=in.read(buf))!=-1){
                          total+=r;
                          if(total>MAX_FILE)throw new IllegalArgumentException("file > 64 MiB");
                          out.write(buf,0,r);
                      }
                      return out.toByteArray();
                  }
              }

              private static String hex(byte[] b){
                  StringBuilder s=new StringBuilder(b.length*2);
                  for(byte q:b) s.append(String.format(Locale.US,"%02X",q&255));
                  return s.toString();
              }

              private static int crc16(byte[] b){
                  int crc=0;
                  for(byte q:b){
                      crc^=(q&255)<<8;
                      for(int i=0;i<8;i++)
                          crc=(crc&0x8000)!=0 ? ((crc<<1)^0x1021)&0xffff : (crc<<1)&0xffff;
                  }
                  return crc;
              }

              private static String sha256(byte[] b){
                  try{
                      MessageDigest m=MessageDigest.getInstance("SHA-256");
                      StringBuilder s=new StringBuilder();
                      for(byte q:m.digest(b)) s.append(String.format(Locale.US,"%02X",q&255));
                      return s.toString();
                  }catch(Exception e){return "<sha-error>";}
              }

