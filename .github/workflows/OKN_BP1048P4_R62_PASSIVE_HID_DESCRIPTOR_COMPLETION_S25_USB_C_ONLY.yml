          git -C /tmp/r62/sdk/repo status --porcelain | tee /tmp/r62/evidence/R62_SDK_POSTPATCH_STATUS.txt
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root='/tmp/r62/sdk/repo'
          changed=subprocess.check_output(['git','-C',root,'status','--porcelain'],text=True).splitlines()
          allowed_prefix='BT_Audio_APP/bt_audio_app_src/audio/'
