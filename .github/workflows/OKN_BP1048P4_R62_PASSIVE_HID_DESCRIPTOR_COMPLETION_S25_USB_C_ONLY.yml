                  for(UsbDevice d:m.values()){
                      line("พบ"+dev(d));
                      if(runtime(d)){
                          rr=true;
                          runtimeObserved=true;
                          line("RUNTIME_PHYSICAL=true");
                          line("interfaces="+d.getInterfaceCount()+" permission="+usb.hasPermission(d));
                          for(int n=0;n<d.getInterfaceCount();n++){
                              UsbInterface x=d.getInterface(n);
                              line(String.format(Locale.US,
                                  "IF[%d] id=%d alt=%d class=%d sub=%d proto=%d eps=%d",
                                  n,x.getId(),x.getAlternateSetting(),x.getInterfaceClass(),
                                  x.getInterfaceSubclass(),x.getInterfaceProtocol(),x.getEndpointCount()));
                              for(int ep=0;ep<x.getEndpointCount();ep++){
                                  UsbEndpoint e=x.getEndpoint(ep);
                                  line(String.format(Locale.US,
                                      "EP[%d] addr=0x%02X dir=%d type=%d maxPacket=%d interval=%d",
                                      ep,e.getAddress(),e.getDirection(),e.getType(),e.getMaxPacketSize(),e.getInterval()));
