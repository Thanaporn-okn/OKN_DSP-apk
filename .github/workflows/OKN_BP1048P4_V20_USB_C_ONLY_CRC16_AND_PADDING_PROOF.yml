          assert r['complete_live_updater_ready'] is False
          assert r['live_usb_command_permitted'] is False
          assert r['flash_erase_write_permitted'] is False

          print('V20_CRC16_AND_PADDING_PROOF_COMPLETE=YES')
          print('CRC_ALGORITHM=CRC16_CCITT_POLY_1021_MSB')
          print('CRC_INIT=0000')
          print('CRC_COVERAGE_PROVEN=YES')
          print('PADDING_BYTE_PROVEN=NO')
