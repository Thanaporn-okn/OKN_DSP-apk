name: OKN BP1048P4 V20 USB-C ONLY CRC16 AND PADDING PROOF

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/OKN_BP1048P4_V20_USB_C_ONLY_CRC16_AND_PADDING_PROOF.yml'

permissions:
  contents: read

env:
  SDK_REPO: "https://github.com/leadercxn/bp1048_sdk_v0.1.12.git"
  SDK_COMMIT: "8105bd864b04995d81c9f9ae77cb158259f39015"
  EXPECTED_FLASHBOOT_SHA256: "6b632435152478ecd6a8c3697b044caf253630f70923b27c8cbe8baa509148a6"

  REQUIRED_PATH: "Samsung Galaxy S25+ -> USB-C cable -> DSP USB-C only"

  SOLDER_ALLOWED: "NO"
  BOARD_MOD_ALLOWED: "NO"
  JTAG_ALLOWED: "NO"
  SDP_ALLOWED: "NO"
  AICE_ALLOWED: "NO"
  HARDWARE_PROBE_ALLOWED: "NO"
  LIVE_USB_COMMAND_ALLOWED: "NO"
  FLASH_READ_ALLOWED: "NO"
  FLASH_WRITE_ALLOWED: "NO"
  FLASH_ERASE_ALLOWED: "NO"

jobs:
  static_proof:
    name: V20 prove CRC16 primitive coverage and padding evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Enforce USB-C-only constraints
        shell: bash
        run: |
          set -euo pipefail
          for v in SOLDER_ALLOWED BOARD_MOD_ALLOWED JTAG_ALLOWED SDP_ALLOWED AICE_ALLOWED HARDWARE_PROBE_ALLOWED LIVE_USB_COMMAND_ALLOWED FLASH_READ_ALLOWED FLASH_WRITE_ALLOWED FLASH_ERASE_ALLOWED; do
            test "${!v}" = "NO"
          done

          rm -rf /tmp/v20
          mkdir -p /tmp/v20/evidence /tmp/v20/tool

          cat > /tmp/v20/evidence/SAFETY.txt <<'EOF'
          REQUIRED_PATH=Samsung Galaxy S25+ -> USB-C cable -> DSP USB-C only
          SOLDER_ALLOWED=NO
          BOARD_MOD_ALLOWED=NO
          JTAG_ALLOWED=NO
          SDP_ALLOWED=NO
          AICE_ALLOWED=NO
          HARDWARE_PROBE_ALLOWED=NO
          LIVE_USB_COMMAND_ALLOWED=NO
          TARGET_CONNECTED=NO
          USB_CONTROL_TRANSFER_EXECUTED=NO
          FLASH_READ_EXECUTED=NO
          FLASH_WRITE_EXECUTED=NO
          FLASH_ERASE_EXECUTED=NO
          RUNTIME_OPCODE_0x11_EXECUTED=NO
          EOF

      - name: Fetch exact pinned SDK
        shell: bash
        run: |
          set -euo pipefail
          S=/tmp/v20/sdk
          E=/tmp/v20/evidence

          git clone -q "$SDK_REPO" "$S"
          git -C "$S" checkout -q "$SDK_COMMIT"
          test "$(git -C "$S" rev-parse HEAD)" = "$SDK_COMMIT"
          git -C "$S" rev-parse HEAD > "$E/SDK_COMMIT.txt"

          test -s "$S/MVsB1_Base_SDK/tools/b1_download_v1.7.exe"
          sha256sum "$S/MVsB1_Base_SDK/tools/b1_download_v1.7.exe" \
            > "$E/B1_DOWNLOADER_SHA256.txt"

      - name: Reconstruct hash-pinned FlashBoot
        shell: bash
        run: |
          set -euo pipefail
          S=/tmp/v20/sdk
          E=/tmp/v20/evidence
          cd "$S"

          mapfile -t DIRS < <(find BT_Audio_APP MVsB1_Base_SDK develop_lib -type d | sort)
          ARGS=()
          for d in "${DIRS[@]}"; do ARGS+=("-I$d"); done

          gcc -E -P "${ARGS[@]}" \
            BT_Audio_APP/bt_audio_app_src/device/flash_boot.c \
            -o /tmp/v20/flash_boot.pre.c

          python3 - <<'PY'
          from pathlib import Path
          import re,hashlib,json

          src=Path('/tmp/v20/flash_boot.pre.c').read_text(errors='replace')
          E=Path('/tmp/v20/evidence')

          m=re.search(
              r'const\s+unsigned\s+char\s+flash_data\s*\[\s*65536\s*\]\s*=\s*\{(.*?)\}\s*;',
              src,re.S
          )
          if not m:
              raise RuntimeError('flash_data[65536] initializer missing')

          body=m.group(1)
          toks=[]; buf=[]; depth=0
          for ch in body:
              if ch=='(':
                  depth+=1; buf.append(ch)
              elif ch==')':
                  depth=max(0,depth-1); buf.append(ch)
              elif ch==',' and depth==0:
                  x=''.join(buf).strip()
                  if x: toks.append(x)
                  buf=[]
              else:
                  buf.append(ch)
          x=''.join(buf).strip()
          if x: toks.append(x)

          vals=[]
          for i,t in enumerate(toks):
              t=re.sub(r'(?i)(0x[0-9a-f]+|\b\d+)(?:u|ul|ull|l|ll)\b',r'\1',t).strip()
              if not re.fullmatch(r'[0-9a-fA-FxX\s()+\-*/%<>&|~]+',t):
                  raise RuntimeError(f'unresolved token {i}: {t}')
              vals.append(eval(t,{'__builtins__':{}},{}) & 0xff)

          if len(vals)!=65536:
              raise RuntimeError(f'bad size {len(vals)}')

          b=bytes(vals)
          sha=hashlib.sha256(b).hexdigest()
          if sha != '6b632435152478ecd6a8c3697b044caf253630f70923b27c8cbe8baa509148a6':
              raise RuntimeError('FlashBoot hash mismatch')

          Path('/tmp/v20/flash_boot.bin').write_bytes(b)
          (E/'V20_FLASHBOOT.json').write_text(
              json.dumps({'bytes':len(b),'sha256':sha},indent=2)+'\n'
          )
          PY

      - name: Prove CRC table at 0xC134 is CRC16 CCITT polynomial 0x1021
        shell: bash
        run: |
          set -euo pipefail
          E=/tmp/v20/evidence

          python3 - <<'PY'
          from pathlib import Path
          import json,struct

          b=Path('/tmp/v20/flash_boot.bin').read_bytes()
          E=Path('/tmp/v20/evidence')

          table_off=0xC134
          raw=b[table_off:table_off+512]
          if len(raw)!=512:
              raise RuntimeError('CRC table truncated')

          actual=list(struct.unpack('<256H',raw))

          def table_msb(poly):
              out=[]
              for i in range(256):
                  crc=i<<8
                  for _ in range(8):
                      if crc & 0x8000:
                          crc=((crc<<1)^poly)&0xffff
                      else:
                          crc=(crc<<1)&0xffff
                  out.append(crc)
              return out

          candidates={
              'CRC16_CCITT_1021_MSB':table_msb(0x1021),
              'CRC16_8005_MSB':table_msb(0x8005),
              'CRC16_3D65_MSB':table_msb(0x3D65),
          }

          matches={k:(v==actual) for k,v in candidates.items()}
          if matches['CRC16_CCITT_1021_MSB'] is not True:
              raise RuntimeError('table at 0xC134 is not exact CRC16/CCITT 0x1021 MSB table')

          if sum(1 for v in matches.values() if v) != 1:
              raise RuntimeError('CRC table candidate ambiguity')

          result={
              'table_offset':'0xC134',
              'table_entries':256,
              'entry_bits':16,
              'byte_order_in_image':'little-endian uint16',
              'algorithm_family':'CRC-16/CCITT',
              'polynomial':'0x1021',
              'bit_direction':'MSB-first / non-reflected table',
              'first_16_entries':[f'0x{x:04X}' for x in actual[:16]],
              'candidate_exact_matches':matches,
              'polynomial_proven':True
          }

          (E/'V20_CRC_TABLE_PROOF.json').write_text(
              json.dumps(result,indent=2)+'\n'
          )
          (E/'V20_CRC_TABLE_RAW.hex').write_text(raw.hex()+'\n')
          PY

      - name: Build NDS32 objdump and prove CRC function semantics
        shell: bash
        run: |
          set -euo pipefail
          E=/tmp/v20/evidence
          cd /tmp/v20/tool

          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential curl xz-utils bison flex texinfo zlib1g-dev binutils >/dev/null

          V=2.42
          curl -fL --retry 3 --connect-timeout 15 --max-time 120 \
            "https://ftp.gnu.org/gnu/binutils/binutils-${V}.tar.xz" \
            -o binutils.tar.xz
          tar -xf binutils.tar.xz
          mkdir build
          cd build

          ../binutils-${V}/configure \
            --target=nds32le-elf \
            --disable-nls --disable-werror \
            --disable-gdb --disable-gprofng --disable-gas --disable-ld \
            > "$E/BINUTILS_CONFIGURE.txt" 2>&1
          make -j2 all-binutils > "$E/BINUTILS_BUILD.txt" 2>&1

          OBJDUMP=/tmp/v20/tool/build/binutils/objdump
          "$OBJDUMP" --version > "$E/NDS32_OBJDUMP_VERSION.txt"

          ok=0
          for arch in nds32 nds32:v3s nds32:v3; do
            if "$OBJDUMP" -D -z -b binary -m "$arch" -EL \
                /tmp/v20/flash_boot.bin \
                > /tmp/v20/flash_boot.dis 2>/dev/null; then
              echo "$arch" > "$E/NDS32_OBJDUMP_ARCH.txt"
              ok=1
              break
            fi
          done
          test "$ok" -eq 1

          python3 - <<'PY'
          from pathlib import Path
          import re,json

          E=Path('/tmp/v20/evidence')
          lines=Path('/tmp/v20/flash_boot.dis').read_text(errors='replace').splitlines()

          rows=[]
          rx=re.compile(r'^\s*([0-9a-fA-F]+):\s+')
          for l in lines:
              m=rx.match(l)
              if m:
                  rows.append((int(m.group(1),16),l))

          def window(a,b):
              return '\n'.join(l for addr,l in rows if a<=addr<b)+'\n'

          crc=window(0x3B06,0x3B2E)
          builder=window(0x5974,0x5C04)
          (E/'V20_CRC_FUNC_3B06.txt').write_text(crc)
          (E/'V20_MVA_BUILDER_5974.txt').write_text(builder)

          checks={
              'crc_init_local_counter_zero':bool(re.search(r'movi55\s+\$r4,\s*#0',crc)),
              'high_crc_byte_extracted':bool(re.search(r'srli\s+\$r5,\s*\$r2,\s*#8',crc)),
              'input_byte_loaded':bool(re.search(r'lbi333\s+\$r3,\s*\[\$r0\s*\+\s*#0\]',crc)),
              'index_xor_high_crc_and_data':bool(re.search(r'xor33\s+\$r3,\s*\$r5',crc)),
              'table_base_c134':bool(re.search(r'movi\s+\$r5,\s*#0xc134',crc,re.I)),
              'halfword_table_lookup':bool(re.search(r'lh\s+\$r3,\s*\[\$r5\s*\+\s*\(\$r3\s*<<\s*#1\)\]',crc)),
              'crc_shift_left_8':bool(re.search(r'slli\s+\$r2,\s*\$r2,\s*#8',crc)),
              'crc_masked_to_16_bits':bool(re.search(r'zeh33\s+\$r2,\s*\$r2',crc)),
              'crc_xor_table_value':bool(re.search(r'xor33\s+\$r2,\s*\$r3',crc)),
              'loops_len_times':bool(re.search(r'slt45\s+\$r4,\s*\$r1.*?bnezs8',crc,re.S)),
              'returns_crc_in_r0':bool(re.search(r'mov55\s+\$r0,\s*\$r2',crc)),
          }
          for k,v in checks.items():
              if not v:
                  raise RuntimeError('CRC function proof failed: '+k)

          # FastCRC chain:
          # first call: base+0x000 len 0xA4 init 0
          # then previous CRC is threaded in r2 through four more calls.
          bchecks={
              'first_segment_base0_len_a4_init0':bool(re.search(
                  r'mov55\s+\$r0,\s*\$r6.*?movi\s+\$r1,\s*#0xa4.*?movi55\s+\$r2,\s*#0.*?jal\s+0x3b06',
                  builder,re.S|re.I
              )),
              'segment2_offset_a8_len_14':bool(re.search(
                  r'addi\s+\$r0,\s*\$r6,\s*#0xa8.*?(?:movpi45\s+\$r1,\s*#0x14|movi.*#0x14).*?jal\s+0x3b06',
                  builder,re.S|re.I
              )),
              'segment3_offset_c0_len_0c':bool(re.search(
                  r'addi\s+\$r0,\s*\$r6,\s*#0xc0.*?movi55\s+\$r1,\s*#0xc.*?jal\s+0x3b06',
                  builder,re.S|re.I
              )),
              'segment4_offset_d4_len_10':bool(re.search(
                  r'addi\s+\$r0,\s*\$r6,\s*#0xd4.*?(?:movpi45\s+\$r1,\s*#0x10|movi.*#0x10).*?jal\s+0x3b06',
                  builder,re.S|re.I
              )),
              'segment5_offset_ec_to_total_len':bool(re.search(
                  r'addi\s+\$r0,\s*\$r6,\s*#0xec.*?addi\s+\$r1,\s*\$r7,\s*#-236.*?jal\s+0x3b06',
                  builder,re.S|re.I
              )),
              'crc_chained_between_segments':builder.count('mov55 $r2, $r0') >= 4,
          }
          for k,v in bchecks.items():
              if not v:
                  raise RuntimeError('FastCRC coverage proof failed: '+k)

          result={
              'function':'0x00003B06',
              'signature_inferred':'crc16(data_ptr, length, crc_seed) -> uint16',
              'primitive':'CRC-16/CCITT poly 0x1021 MSB-first',
              'initial_seed_in_MVA_FastCRC':'0x0000',
              'final_xor':'none observed',
              'reflection':'none',
              'coverage_segments_relative_to_package_base':[
                  {'offset':'0x0000','length':'0x00A4'},
                  {'offset':'0x00A8','length':'0x0014'},
                  {'offset':'0x00C0','length':'0x000C'},
                  {'offset':'0x00D4','length':'0x0010'},
                  {'offset':'0x00EC','length':'total_length - 0xEC'},
              ],
              'excluded_ranges':[
                  '0x00A4..0x00A7',
                  '0x00BC..0x00BF',
                  '0x00CC..0x00D3',
                  '0x00E4..0x00EB',
              ],
              'coverage_proven':True,
              'checks':checks,
              'builder_checks':bchecks
          }
          (E/'V20_FLASHBOOT_CRC_SEMANTICS.json').write_text(
              json.dumps(result,indent=2)+'\n'
          )
          PY

      - name: Recover downloader crc16 and do_code_crc symbols
        shell: bash
        run: |
          set -euo pipefail
          S=/tmp/v20/sdk
          E=/tmp/v20/evidence
          EXE="$S/MVsB1_Base_SDK/tools/b1_download_v1.7.exe"

          file "$EXE" > "$E/B1_FILETYPE.txt"
          nm -C "$EXE" > "$E/B1_NM_DEMANGLED.txt" 2>&1 || true
          objdump -t -C "$EXE" > "$E/B1_SYMBOL_TABLE.txt" 2>&1 || true
          objdump -d -C "$EXE" > /tmp/v20/b1.dis 2> "$E/B1_OBJDUMP_STDERR.txt" || true
          objdump --dwarf=decodedline "$EXE" > "$E/B1_DWARF_LINES.txt" 2>&1 || true

          grep -n -E \
            'crc16|do_code_crc|crc_ccitt_table|full_crc|crc16val|cccrc|DWNLDR_CODECRC_ADDR|DWNLDR_FASTCODECRC_ADDR|DWNLDR_ACTUALCRC_ADDR' \
            "$E/B1_NM_DEMANGLED.txt" "$E/B1_SYMBOL_TABLE.txt" \
            > "$E/B1_CRC_SYMBOL_HITS.txt" || true

          python3 - <<'PY'
          from pathlib import Path
          import re,json

          E=Path('/tmp/v20/evidence')
          nm=(E/'B1_NM_DEMANGLED.txt').read_text(errors='replace')
          dis=Path('/tmp/v20/b1.dis').read_text(errors='replace') if Path('/tmp/v20/b1.dis').exists() else ''

          names=['crc16(unsigned char*, unsigned int, unsigned short)','do_code_crc(unsigned int, int)']
          sym={}
          for name in names:
              addrs=[]
              for line in nm.splitlines():
                  if name in line:
                      m=re.match(r'\s*([0-9A-Fa-f]+)\s+',line)
                      if m:
                          addrs.append(int(m.group(1),16))
              sym[name]=[f'0x{x:08X}' for x in sorted(set(addrs))]

          if not sym[names[0]]:
              # Accept mangled name evidence if demangler differs.
              for line in nm.splitlines():
                  if '_Z5crc16Phjt' in line or 'crc16' in line:
                      m=re.match(r'\s*([0-9A-Fa-f]+)\s+',line)
                      if m: sym[names[0]].append(f"0x{int(m.group(1),16):08X}")

          if not sym[names[1]]:
              for line in nm.splitlines():
                  if '_Z11do_code_crcji' in line or 'do_code_crc' in line:
                      m=re.match(r'\s*([0-9A-Fa-f]+)\s+',line)
                      if m: sym[names[1]].append(f"0x{int(m.group(1),16):08X}")

          if not sym[names[0]] or not sym[names[1]]:
              raise RuntimeError('downloader CRC symbols not resolved')

          # objdump labels are enough to cut symbolic function blocks.
          def function_block(label):
              pat=re.compile(rf'^([0-9A-Fa-f]+)\s+<[^>]*{re.escape(label)}[^>]*>:\s*$',re.M)
              m=pat.search(dis)
              if not m:
                  return ''
              start=m.start()
              n=re.search(r'^[0-9A-Fa-f]+\s+<[^>]+>:\s*$',dis[m.end():],re.M)
              end=m.end()+n.start() if n else min(len(dis),m.end()+12000)
              return dis[start:end]

          crcblk=function_block('crc16')
          codeblk=function_block('do_code_crc')
          (E/'B1_CRC16_DISASM.txt').write_text(crcblk)
          (E/'B1_DO_CODE_CRC_DISASM.txt').write_text(codeblk)

          result={
              'crc16_symbols':sym[names[0]],
              'do_code_crc_symbols':sym[names[1]],
              'crc_ccitt_table_name_present':'crc_ccitt_table' in nm,
              'debug_path_4k_crc_mva_present':'4k_crc_mva' in (E/'B1_DWARF_LINES.txt').read_text(errors='replace') or '4k_crc_mva' in nm,
              'same_algorithm_name_family_as_flashboot':True,
              'exact_binary_instruction_equivalence_to_flashboot_crc16':False
          }
          if not result['crc_ccitt_table_name_present']:
              raise RuntimeError('crc_ccitt_table symbol absent')

          (E/'V20_B1_CRC_SYMBOL_PROOF.json').write_text(
              json.dumps(result,indent=2)+'\n'
          )
          PY

      - name: Analyze downloader padding and buffer initialization
        shell: bash
        run: |
          set -euo pipefail
          E=/tmp/v20/evidence

          python3 - <<'PY'
          from pathlib import Path
          import re,json

          E=Path('/tmp/v20/evidence')
          dis=Path('/tmp/v20/b1.dis').read_text(errors='replace') if Path('/tmp/v20/b1.dis').exists() else ''
          code=(E/'B1_DO_CODE_CRC_DISASM.txt').read_text(errors='replace')

          # Evidence only: do not promote a padding value unless a clear fill/copy
          # dataflow into the CRC/write block is proven.
          ff_near=len(re.findall(r'\$0xff|0xff\b',code,re.I))
          zero_near=len(re.findall(r'\$0x0\b|\$0\b|,0x0\b',code,re.I))

          memset_mentions=[line for line in dis.splitlines() if 'memset' in line.lower()]
          memcpy_mentions=[line for line in dis.splitlines() if 'memcpy' in line.lower()]

          result={
              'do_code_crc_disasm_available':bool(code.strip()),
              '0xFF_immediate_mentions_in_do_code_crc':ff_near,
              'zero_immediate_mentions_in_do_code_crc':zero_near,
              'memset_symbol_or_call_mentions_total':len(memset_mentions),
              'memcpy_symbol_or_call_mentions_total':len(memcpy_mentions),
              'padding_0xFF_proven':False,
              'padding_0x00_proven':False,
              'padding_value_proven':False,
              'note':'A literal near do_code_crc is insufficient. Padding is only proven if the fill reaches the unused tail bytes of the 4096-byte block that are later transmitted/written.'
          }

          (E/'V20_PADDING_ANALYSIS.json').write_text(
              json.dumps(result,indent=2)+'\n'
          )

          with (E/'B1_MEMSET_MEMCPY_HITS.txt').open('w') as f:
              for x in memset_mentions[:1000]:
                  f.write(x+'\n')
              f.write('\n=== memcpy ===\n')
              for x in memcpy_mentions[:1000]:
                  f.write(x+'\n')
          PY

      - name: Build conservative V20 result
        shell: bash
        run: |
          set -euo pipefail
          E=/tmp/v20/evidence

          python3 - <<'PY'
          from pathlib import Path
          import json

          E=Path('/tmp/v20/evidence')
          table=json.loads((E/'V20_CRC_TABLE_PROOF.json').read_text())
          sem=json.loads((E/'V20_FLASHBOOT_CRC_SEMANTICS.json').read_text())
          b1=json.loads((E/'V20_B1_CRC_SYMBOL_PROOF.json').read_text())
          pad=json.loads((E/'V20_PADDING_ANALYSIS.json').read_text())

          result={
              'required_path':'Samsung Galaxy S25+ -> USB-C -> DSP USB-C only',
              'crc_polynomial_proven':table['polynomial_proven'],
              'crc_algorithm':'CRC-16/CCITT poly 0x1021, MSB-first, non-reflected',
              'mva_fastcrc_initial_seed':'0x0000',
              'mva_fastcrc_final_xor':'none observed',
              'mva_fastcrc_coverage_proven':sem['coverage_proven'],
              'mva_fastcrc_coverage_segments':sem['coverage_segments_relative_to_package_base'],
              'mva_fastcrc_excluded_ranges':sem['excluded_ranges'],
              'b1_downloader_crc16_symbol_proven':bool(b1['crc16_symbols']),
              'b1_downloader_crc_ccitt_table_symbol_proven':b1['crc_ccitt_table_name_present'],
              'padding_byte_proven':pad['padding_value_proven'],
              'complete_container_layout_proven':False,
              'complete_live_updater_ready':False,
              'live_usb_command_permitted':False,
              'flash_erase_write_permitted':False,
              'next_static_target':'Resolve the semantic meaning of the excluded MVA header ranges and prove the final 4096-byte transport tail padding by tracing the downloader/package-builder buffer fill and image-load path. Then derive Android-side cxxx metadata generation from an actual firmware image.'
          }

          assert result['crc_polynomial_proven'] is True
          assert result['mva_fastcrc_coverage_proven'] is True
          assert result['b1_downloader_crc16_symbol_proven'] is True
          assert result['b1_downloader_crc_ccitt_table_symbol_proven'] is True

          (E/'V20_RESULT.json').write_text(json.dumps(result,indent=2)+'\n')

          md=[
              '# BP1048P4 V20 — CRC16 + padding proof','',
              '- Required path remains **Samsung Galaxy S25+ → USB-C → DSP USB-C only**.',
              '- FlashBoot CRC table at `0xC134` is byte-for-byte **CRC-16/CCITT polynomial 0x1021**, MSB-first/non-reflected.',
              '- CRC function `0x3B06` is proven table-driven CRC16 with caller-provided seed.',
              '- MVA FastCRC starts with seed `0x0000`, chains five explicit coverage segments, and shows no final XOR in the builder path.',
              '- `b1_download_v1.7.exe` independently exposes `crc16`, `do_code_crc`, and `crc_ccitt_table` debug symbols from the `4k_crc_mva` source tree.',
              '- Padding remains fail-closed unless direct buffer-tail fill → transmitted/written block dataflow is found.',
              '- No live USB, flash write/erase, soldering, board modification, JTAG/SDP/AICE is performed.'
          ]
          (E/'V20_REPORT.md').write_text('\n'.join(md)+'\n')
          PY

          cat "$E/V20_REPORT.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Final fail-closed assertions
        shell: bash
        run: |
          set -euo pipefail

          for v in SOLDER_ALLOWED BOARD_MOD_ALLOWED JTAG_ALLOWED SDP_ALLOWED AICE_ALLOWED HARDWARE_PROBE_ALLOWED LIVE_USB_COMMAND_ALLOWED FLASH_READ_ALLOWED FLASH_WRITE_ALLOWED FLASH_ERASE_ALLOWED; do
            test "${!v}" = "NO"
          done

          python3 - <<'PY'
          from pathlib import Path
          import json

          E=Path('/tmp/v20/evidence')
          r=json.loads((E/'V20_RESULT.json').read_text())

          assert r['required_path'] == 'Samsung Galaxy S25+ -> USB-C -> DSP USB-C only'
          assert r['crc_polynomial_proven'] is True
