name: Build APK from ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'facebook-product-tracker-source.zip'
      - '.github/workflows/Build_APK_From_ZIP.yml'

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ZIP: facebook-product-tracker-source.zip
  WEB_APP_URL: ${{ vars.WEB_APP_URL }}

jobs:
  build-apk:
    name: Unzip and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify project ZIP
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$GITHUB_WORKSPACE/$PROJECT_ZIP" ]; then
            echo "ERROR: $PROJECT_ZIP was not found in repository root: $GITHUB_WORKSPACE"
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" -maxdepth 2 -type f | sort | head -200
            exit 1
          fi
          unzip -t "$GITHUB_WORKSPACE/$PROJECT_ZIP"

      # IMPORTANT: Extract inside GITHUB_WORKSPACE so gradle/actions/setup-gradle@v6
      # can discover *.gradle* files while preparing its cache.
      - name: Extract project ZIP into workspace
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_DIR="$GITHUB_WORKSPACE/.build-src"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$GITHUB_WORKSPACE/$PROJECT_ZIP" -d "$EXTRACT_DIR"

          SETTINGS_FILE="$(find "$EXTRACT_DIR" -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -path '*/android/*' -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android settings.gradle/settings.gradle.kts was not found after extracting $PROJECT_ZIP"
            find "$EXTRACT_DIR" -maxdepth 6 -type f | sort | head -300
            exit 1
          fi

          ANDROID_DIR="$(dirname "$SETTINGS_FILE")"

          echo "android_dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found at: $ANDROID_DIR"
          echo "Gradle files visible in workspace:"
          find "$GITHUB_WORKSPACE" -type f \( -name '*.gradle' -o -name '*.gradle.kts' -o -name 'gradle-wrapper.properties' \) | sort | head -100

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_DIR="${{ steps.extract.outputs.android_dir }}"
          echo "Building Android project: $ANDROID_DIR"

          gradle \
            -p "$ANDROID_DIR" \
            --no-daemon \
            --stacktrace \
            clean assembleDebug

      - name: Prepare APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_DIR="${{ steps.extract.outputs.android_dir }}"

          APK_SOURCE="$(find "$ANDROID_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"

          if [ -z "$APK_SOURCE" ] || [ ! -f "$APK_SOURCE" ]; then
            echo "ERROR: Debug APK was not produced."
            echo "Build output files:"
            find "$ANDROID_DIR" -type f -path '*/build/outputs/*' | sort | head -300 || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK_SOURCE" "$GITHUB_WORKSPACE/dist/FacebookProductTracker.apk"

          sha256sum "$GITHUB_WORKSPACE/dist/FacebookProductTracker.apk" \
            | tee "$GITHUB_WORKSPACE/dist/FacebookProductTracker.apk.sha256"

          {
            echo '## APK build completed'
            echo ''
            echo '- Output: `FacebookProductTracker.apk`'
            echo "- Android project: \`$ANDROID_DIR\`"
            echo "- Source ZIP: \`$PROJECT_ZIP\`"
            if [ -n "${WEB_APP_URL:-}" ]; then
              echo "- WEB_APP_URL: \`$WEB_APP_URL\`"
            else
              echo '- WEB_APP_URL: not set; the app will ask for the URL on first launch.'
            fi
            echo '- SHA-256:'
            echo '```text'
            cat "$GITHUB_WORKSPACE/dist/FacebookProductTracker.apk.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: FacebookProductTracker-APK
          path: |
            dist/FacebookProductTracker.apk
            dist/FacebookProductTracker.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Clean extracted source
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/.build-src"
