name: Build OKN DSP V40 Auto RandKey Live ReadOnly

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_ANDROID_V40_AUTO_RANDKEY_LIVE_READONLY.zip'
      - '.github/workflows/build-okn-dsp-v40.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore V40 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/okn_v40
          mkdir -p /tmp/okn_v40
          unzip -q OKN_DSP_ANDROID_V40_AUTO_RANDKEY_LIVE_READONLY.zip -d /tmp/okn_v40
          test -f /tmp/okn_v40/app/src/main/java/com/okn/dsp/protocol/PreAuthRandKeyDecoder.kt
          test -f /tmp/okn_v40/evidence/OKN_DSP_V40_RANDKEY_AOT_PROOF.txt
          grep -q '2.2.0-v40-auto-randkey-live-readonly' /tmp/okn_v40/app/build.gradle.kts
          grep -q '2AAF948632A59FF8F2B23E6E4193FD21' /tmp/okn_v40/app/src/main/java/com/okn/dsp/protocol/PreAuthRandKeyDecoder.kt
          grep -q '10E7D2F443924938A28D759BAC0E9E22' /tmp/okn_v40/app/src/main/java/com/okn/dsp/protocol/PreAuthRandKeyDecoder.kt
          grep -q 'AUTH_RANDKEY_EXTRACTION_VERIFIED = true' /tmp/okn_v40/app/src/main/java/com/okn/dsp/protocol/SessionCrypto.kt
          grep -q 'LIVE READ-ONLY AUTH' /tmp/okn_v40/app/src/main/java/com/okn/dsp/EvidenceLabActivity.kt
          echo 'V40 source restored and verified'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/okn_v40
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn_v40/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          mkdir -p artifact
          cp "$APK" artifact/OKN_DSP_V40_AUTO_RANDKEY_LIVE_READONLY-debug.apk
          cp /tmp/okn_v40/evidence/OKN_DSP_V40_RANDKEY_AOT_PROOF.txt artifact/
          cp /tmp/okn_v40/evidence/OKN_DSP_V40_RANDKEY_AOT_PROOF.json artifact/
          sha256sum artifact/OKN_DSP_V40_AUTO_RANDKEY_LIVE_READONLY-debug.apk > artifact/OKN_DSP_V40_AUTO_RANDKEY_LIVE_READONLY-debug.sha256
          ls -lh artifact

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-V40-AUTO-RANDKEY-LIVE-READONLY-debug-apk
          path: artifact/
          if-no-files-found: error
          retention-days: 30
