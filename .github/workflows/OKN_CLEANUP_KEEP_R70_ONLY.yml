name: OKN Cleanup - Keep R70 Only

on:
  push:
    paths:
      - ".github/workflows/OKN_CLEANUP_KEEP_R70_ONLY.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove old workflow files and keep R70 only
        shell: bash
        run: |
          set -euo pipefail

          KEEP=".github/workflows/OKN_BP1048P4_R70_ALL_IN_ONE.yml"
          SELF=".github/workflows/OKN_CLEANUP_KEEP_R70_ONLY.yml"
          DIR=".github/workflows"

          if [[ ! -f "$KEEP" ]]; then
            echo "ERROR: Target workflow not found: $KEEP"
            exit 1
          fi

          echo "Keeping only:"
          echo "  $KEEP"

          find "$DIR" -maxdepth 1 -type f \( -name "*.yml" -o -name "*.yaml" \) -print0 |
          while IFS= read -r -d '' file; do
            if [[ "$file" != "$KEEP" && "$file" != "$SELF" ]]; then
              echo "Deleting: $file"
              rm -f "$file"
            fi
          done

          # Delete this cleanup workflow too, so only R70 remains.
          rm -f "$SELF"

          echo
          echo "Remaining workflow files:"
          find "$DIR" -maxdepth 1 -type f \( -name "*.yml" -o -name "*.yaml" \) -print

      - name: Commit and push cleanup
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A .github/workflows

          if git diff --cached --quiet; then
            echo "No workflow files changed."
            exit 0
          fi

          git commit -m "Cleanup workflows: keep R70 all-in-one only"
          git push origin HEAD:main
