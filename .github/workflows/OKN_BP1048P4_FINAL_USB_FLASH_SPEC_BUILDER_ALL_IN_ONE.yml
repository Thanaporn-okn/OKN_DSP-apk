name: OKN BP1048P4 Final USB Flash Spec Builder - All In One

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: okn-bp1048p4-final-usb-flash-spec-${{ github.ref }}
  cancel-in-progress: true

env:
  FLASH_ALLOWED: "NO"

jobs:
  final_static_spec:
    name: Final SDK cross-file protocol analysis - NO USB - NO FLASH
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          mkdir -p /tmp/okn-final/evidence
          cat > /tmp/okn-final/evidence/SAFETY.txt <<'EOF'
          MODE=PUBLIC_SDK_CROSS_FILE_STATIC_PROTOCOL_ANALYSIS_ONLY
          TARGET=MVSilicon_BP1048P4
          TARGET_PHONE=Samsung_S25_Plus
          TARGET_LINK=USB_C_DIRECT
          KNOWN_BOARD_VID=0x6324
          KNOWN_BOARD_PID=0x1719
          KNOWN_RUNTIME_INTERFACE=4
          KNOWN_RUNTIME_HID_IN_BYTES=256
          KNOWN_RUNTIME_HID_OUT_BYTES=256
          KNOWN_RUNTIME_FEATURE_BYTES=8
          USB_OR_BOARD_CONTACT=NO
          VENDOR_BINARY_EXECUTED=NO
          FLASH_READ_EXECUTED=NO
          FLASH_ERASE_EXECUTED=NO
          FLASH_WRITE_EXECUTED=NO
          DISCOVERED_FRAME_LIVE_AUTHORIZED=NO
          HARDWARE_MODIFICATION=FORBIDDEN
          FLASH_ALLOWED=NO
          EOF

      - name: Checkout public BP1048 SDK
        uses: actions/checkout@v4
        with:
          repository: leadercxn/bp1048_sdk_v0.1.12
          ref: master
          path: bp1048-sdk
          fetch-depth: 1

      - name: Build cross-file protocol model
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import collections, hashlib, json, math, re, shutil, subprocess

          ROOT = Path("bp1048-sdk")
          OUT = Path("/tmp/okn-final/evidence")
          OUT.mkdir(parents=True, exist_ok=True)

          commit = subprocess.check_output(
              ["git","-C",str(ROOT),"rev-parse","HEAD"], text=True
          ).strip()

          CODE_EXTS={".c",".h",".cpp",".hpp",".s",".S",".asm"}
          TEXT_EXTS=CODE_EXTS|{".ld",".lds",".mk",".mak",".txt",".md",".py",
                              ".sh",".bat",".cmd",".ini",".cfg",".xml",".project",
                              ".cproject",".properties"}

          docs=[]
          for p in ROOT.rglob("*"):
              if not p.is_file() or ".git" in p.parts or p.stat().st_size > 5_000_000:
                  continue
              if p.suffix in TEXT_EXTS or p.name.lower() in {"makefile","readme"}:
                  try:
                      docs.append((str(p.relative_to(ROOT)),p,p.read_text(errors="replace")))
                  except Exception:
                      pass

          hdr = re.compile(
              r"(?m)^[ \t]*(?:(?:static|inline|extern|const|volatile|__attribute__\s*\(\([^)]*\)\))\s+)*"
              r"(?:[A-Za-z_][\w\s\*\(\)]*?[ \t]+)?"
              r"([A-Za-z_]\w*)[ \t]*\(([^;{}]{0,500})\)[ \t]*\{"
          )
          funcs={}
          funcs_by_name=collections.defaultdict(list)
          keywords_exclude={"if","for","while","switch","sizeof","return"}

          for rel,p,text in docs:
              if p.suffix not in CODE_EXTS:
                  continue
              for m in hdr.finditer(text):
                  name=m.group(1)
                  if name in keywords_exclude:
                      continue
                  brace=text.find("{",m.start(),m.end()+2)
                  if brace<0:
                      continue
                  depth=0
                  end=None
                  for i in range(brace,len(text)):
                      c=text[i]
                      if c=="{":
                          depth+=1
                      elif c=="}":
                          depth-=1
                          if depth==0:
                              end=i+1
                              break
                  if end is None:
                      continue
                  body=text[m.start():end]
                  line=text.count("\n",0,m.start())+1
                  key=f"{rel}:{line}:{name}"
                  item={"key":key,"file":rel,"line":line,"name":name,
                        "args":m.group(2).strip(),"body":body}
                  funcs[key]=item
                  funcs_by_name[name].append(key)

          call_rx=re.compile(r"\b([A-Za-z_]\w*)\s*\(")
          for f in funcs.values():
              calls=[]
              for n in call_rx.findall(f["body"]):
                  if n in funcs_by_name and n!=f["name"]:
                      calls.append(n)
              f["calls"]=sorted(set(calls))

          name_rx={
              "update": re.compile(r"upgrade|update|ota|iap|dfu|firmware|fw_",re.I),
              "flash": re.compile(r"flash|burn|nor|spirom|spi_flash",re.I),
              "usb": re.compile(r"usb|hid|endpoint|ep\d|report",re.I),
              "boot": re.compile(r"boot|reboot|reset|jump.*app|jump.*loader",re.I),
              "crc": re.compile(r"crc|checksum|hash",re.I),
          }
          body_rx={
              "update": re.compile(r"\b(upgrade|firmware\s*update|ota|iap|dfu|update[_\s-]*flag)\b",re.I),
              "flash": re.compile(r"\b(flash[_\w]*(write|erase|read|program)|"
                                  r"(write|erase|read|program)[_\w]*flash|spi[_\w]*flash)\b",re.I),
              "usb": re.compile(r"\b(usb|hid|endpoint|bEndpointAddress|control\s*transfer|report)\b",re.I),
              "boot": re.compile(r"\b(bootloader|boot[_\s-]*mode|reboot|soft[_\s-]*reset|"
                                 r"system[_\s-]*reset|jump[_\s-]*(app|boot|loader))\b",re.I),
              "crc": re.compile(r"\b(crc16|crc32|checksum)\b",re.I),
          }

          cats={k:set() for k in name_rx}
          for key,f in funcs.items():
              for c in cats:
                  if name_rx[c].search(f["name"]) or body_rx[c].search(f["body"][:12000]):
                      cats[c].add(key)

          graph=collections.defaultdict(set)
          name_meta=collections.defaultdict(list)
          for key,f in funcs.items():
              name_meta[f["name"]].append(f)
              graph[f["name"]].update(f["calls"])

          seed_names={c:set(funcs[k]["name"] for k in ks) for c,ks in cats.items()}

          def shortest_paths(sources, targets, max_depth=6, limit=40):
              targets=set(targets)
              out=[]
              for s in sorted(sources):
                  q=collections.deque([(s,[s])])
                  seen={s}
                  while q and len(out)<limit:
                      n,path=q.popleft()
                      if len(path)>1 and n in targets:
                          out.append(path)
                          break
                      if len(path)-1>=max_depth:
                          continue
                      for nx in sorted(graph.get(n,())):
                          if nx not in seen:
                              seen.add(nx)
                              q.append((nx,path+[nx]))
              uniq=[]
              seenp=set()
              for p in out:
                  t=tuple(p)
                  if t not in seenp:
                      seenp.add(t)
                      uniq.append(p)
              return uniq[:limit]

          paths={
              "usb_to_update":shortest_paths(seed_names["usb"],seed_names["update"]),
              "usb_to_flash":shortest_paths(seed_names["usb"],seed_names["flash"]),
              "update_to_flash":shortest_paths(seed_names["update"],seed_names["flash"]),
              "boot_to_flash":shortest_paths(seed_names["boot"],seed_names["flash"]),
              "update_to_boot":shortest_paths(seed_names["update"],seed_names["boot"]),
          }

          constants=[]
          def_rx=re.compile(r"(?m)^\s*#\s*define\s+([A-Za-z_]\w*)\s+([^\r\n/]+)")
          enum_rx=re.compile(r"\b([A-Za-z_]\w*(?:CMD|COMMAND|UPGRADE|UPDATE|BOOT|FLASH|USB|HID|CRC)\w*)\s*=\s*([^,\r\n}]+)",re.I)
          interesting_name=re.compile(r"CMD|COMMAND|UPGRADE|UPDATE|BOOT|FLASH|USB|HID|CRC|VID|PID|VENDOR|PRODUCT",re.I)
          for rel,p,text in docs:
              for m in def_rx.finditer(text):
                  name,val=m.group(1),m.group(2).strip()
                  if interesting_name.search(name):
                      line=text.count("\n",0,m.start())+1
                      constants.append({"file":rel,"line":line,"kind":"define","name":name,"value":val[:250]})
              for m in enum_rx.finditer(text):
                  line=text.count("\n",0,m.start())+1
                  constants.append({"file":rel,"line":line,"kind":"enum","name":m.group(1),"value":m.group(2).strip()[:250]})

          exact_ids=[]
          for rel,p,text in docs:
              for i,line in enumerate(text.splitlines(),1):
                  if re.search(r"0x6324|0x1719|\b25380\b|\b5913\b",line,re.I):
                      exact_ids.append({"file":rel,"line":i,"text":line.strip()[:900]})

          frames=[]
          array_rx=re.compile(
              r"(?P<head>(?:static\s+)?(?:const\s+)?(?:unsigned\s+)?(?:char|uint8_t|u8|BYTE)\s+"
              r"(?P<name>[A-Za-z_]\w*)\s*\[[^\]]*\]\s*=\s*)"
              r"\{(?P<body>[^{}]{1,2500})\}",re.I|re.S)
          hex_rx=re.compile(r"0x([0-9A-Fa-f]{1,2})")
          for rel,p,text in docs:
              for m in array_rx.finditer(text):
                  vals=[int(x,16) for x in hex_rx.findall(m.group("body"))]
                  if not vals:
                      continue
                  has_a5=0xA5 in vals
                  has_5a=0x5A in vals
                  if has_a5 or has_5a:
                      line=text.count("\n",0,m.start())+1
                      frames.append({
                          "file":rel,"line":line,"array":m.group("name"),
                          "length":len(vals),"bytes_hex":" ".join(f"{x:02X}" for x in vals[:256]),
                          "has_A5":has_a5,"has_5A":has_5a,
                          "starts_A5_5A":len(vals)>=2 and vals[0]==0xA5 and vals[1]==0x5A,
                      })

          memory=[]
          addr_rx=re.compile(r"0x[0-9A-Fa-f]{5,8}")
          for rel,p,text in docs:
              if p.suffix.lower() not in {".ld",".lds"}:
                  continue
              for i,line in enumerate(text.splitlines(),1):
                  if re.search(r"MEMORY|SECTIONS|FLASH|ROM|spi_flash|EILM|DLM|ORIGIN|LENGTH|ENTRY",line,re.I):
                      memory.append({"file":rel,"line":i,"text":line.strip()[:900],
                                     "addresses":addr_rx.findall(line)})

          images=[]
          for p in ROOT.rglob("*"):
              if not p.is_file() or ".git" in p.parts:
                  continue
              ext=p.suffix.lower()
              if ext not in {".bin",".hex",".elf",".rom",".img",".fw",".mva"}:
                  continue
              data=p.read_bytes()
              rel=str(p.relative_to(ROOT))
              sample=data[:min(len(data),1_000_000)]
              ent=0.0
              if sample:
                  cnt=collections.Counter(sample)
                  for n in cnt.values():
                      q=n/len(sample)
                      ent-=q*math.log2(q)
              images.append({
                  "file":rel,"size":len(data),"sha256":hashlib.sha256(data).hexdigest(),
                  "magic16":data[:16].hex(),
                  "zero_ratio":round(data.count(0)/len(data),5) if data else 0,
                  "ff_ratio":round(data.count(0xff)/len(data),5) if data else 0,
                  "entropy_sample":round(ent,4),
                  "is_elf":data.startswith(b"\x7fELF"),
                  "looks_intel_hex":data[:1]==b":",
              })

          selected_names=set()
          for group in paths.values():
              for pth in group[:20]:
                  selected_names.update(pth)

          snippets=[]
          for name in sorted(selected_names):
              for f in name_meta.get(name,[])[:3]:
                  snippets.append({
                      "file":f["file"],"line":f["line"],"name":name,
                      "body_preview":f["body"][:5000]
                  })

          chosen=[]
          for x in snippets:
              if x["file"] not in chosen:
                  chosen.append(x["file"])
          for x in exact_ids:
              if x["file"] not in chosen:
                  chosen.append(x["file"])
          for x in frames:
              if x["file"] not in chosen:
                  chosen.append(x["file"])

          srcdir=OUT/"candidate_sources"
          srcdir.mkdir(exist_ok=True)
          copied=[]
          for n,rel in enumerate(chosen[:80]):
              p=ROOT/rel
              if p.exists() and p.stat().st_size<=800000:
                  dst=srcdir/f"{n:02d}_{p.name}"
                  shutil.copy2(p,dst)
                  copied.append({"source":rel,"copy":dst.name})

          decision={
              "revision":"FINAL_SDK_CROSS_FILE_SPEC_V1",
              "sdk_commit":commit,
              "known_board":{"vid":"0x6324","pid":"0x1719","interface":4,
                             "hid_in":256,"hid_out":256,"feature":8},
              "function_count":len(funcs),
              "category_function_counts":{k:len(v) for k,v in cats.items()},
              "call_paths":paths,
              "interesting_constants":constants[:500],
              "exact_vid_pid_hits":exact_ids[:200],
              "a5_5a_arrays":frames[:300],
              "memory_map_lines":memory[:400],
              "firmware_images":images[:300],
              "source_snippets":snippets[:150],
              "copied_sources":copied,
              "SDK_USB_TO_UPDATE_CALL_PATH_FOUND":bool(paths["usb_to_update"]),
              "SDK_USB_TO_FLASH_CALL_PATH_FOUND":bool(paths["usb_to_flash"]),
              "SDK_UPDATE_TO_FLASH_CALL_PATH_FOUND":bool(paths["update_to_flash"]),
              "SDK_UPDATE_TO_BOOT_CALL_PATH_FOUND":bool(paths["update_to_boot"]),
              "EXACT_KNOWN_VID_PID_LITERAL_FOUND":bool(exact_ids),
              "A5_5A_ARRAY_START_FOUND":any(x["starts_A5_5A"] for x in frames),
              "FIRMWARE_IMAGE_CANDIDATE_FOUND":bool(images),
              "PRODUCTION_BOARD_BOOTLOADER_PROTOCOL_PROVEN":False,
              "PRODUCTION_BOARD_RECOVERY_IDENTITY_PROVEN":False,
              "LIVE_FLASH_SEQUENCE_AUTHORIZED":False,
              "USB_OR_BOARD_CONTACTED":False,
              "FLASH_ALLOWED":False,
          }
          (OUT/"FINAL_PROTOCOL_SPEC_CANDIDATE.json").write_text(
              json.dumps(decision,indent=2,ensure_ascii=False)+"\n"
          )

          kt = '''package com.okn.bp1048

object Bp1048UsbCandidateSpec {
    const val VID = 0x6324
    const val PID = 0x1719
    const val RUNTIME_INTERFACE = 4
    const val HID_INPUT_BYTES = 256
    const val HID_OUTPUT_BYTES = 256
    const val FEATURE_BYTES = 8

    // Generated from public BP1048 SDK static analysis.
    // Mutating firmware operations stay disabled until the
    // production-board bootloader/recovery protocol is proven.
    const val FLASH_ALLOWED = false

    fun requireReadOnlyMode() {
        check(!FLASH_ALLOWED) { "Flash path is not authorized yet" }
    }

    fun firmwareWriteDisabled(): Nothing =
        error("BP1048P4 production USB flash sequence not proven")
}
'''
          (OUT/"Bp1048UsbCandidateSpec.kt").write_text(kt)

          md=[
              "# BP1048P4 Final USB Flash Spec Builder",
              "",
              f"SDK commit: `{commit}`",
              f"Functions parsed: **{len(funcs)}**",
              "",
              "## Cross-file call paths",
              f"- USB → update: `{bool(paths['usb_to_update'])}`",
              f"- USB → flash: `{bool(paths['usb_to_flash'])}`",
              f"- update → flash: `{bool(paths['update_to_flash'])}`",
              f"- update → boot/reset: `{bool(paths['update_to_boot'])}`",
          ]
          for label,key in [
              ("USB → update","usb_to_update"),
              ("USB → flash","usb_to_flash"),
              ("update → flash","update_to_flash"),
              ("update → boot/reset","update_to_boot"),
          ]:
              md+=["",f"### {label} paths"]
              if paths[key]:
                  for pth in paths[key][:10]:
                      md.append("- `"+" → ".join(pth)+"`")
              else:
                  md.append("- none found within call depth 6")

          md += ["","## Exact known board VID/PID hits"]
          if exact_ids:
              for x in exact_ids[:20]:
                  md.append(f"- `{x['file']}:{x['line']}` — `{x['text']}`")
          else:
              md.append("- none")

          md += ["","## A5/5A packet arrays"]
          starts=[x for x in frames if x["starts_A5_5A"]]
          if starts:
              for x in starts[:20]:
                  md.append(f"- `{x['file']}:{x['line']}` `{x['array']}` len={x['length']} — `{x['bytes_hex'][:180]}`")
          else:
              md.append("- no byte array beginning with A5 5A found; isolated literals may be unrelated")

          md += ["","## Firmware image candidates"]
          if images:
              for x in sorted(images,key=lambda z:(-z["size"],z["file"]))[:20]:
                  md.append(f"- `{x['file']}` — {x['size']} bytes — entropy {x['entropy_sample']} — `{x['sha256'][:20]}...`")
          else:
              md.append("- none")

          md += [
              "",
              "## Decision",
              "- Public SDK call paths are evidence about the SDK, not yet proof of the production GoloPine board updater protocol.",
              "- Android read-only candidate spec generated: `Bp1048UsbCandidateSpec.kt`",
              "- USB/board contact: **NO**",
              "- Flash write/erase: **NO**",
              "- `FLASH_ALLOWED=NO`",
          ]
          (OUT/"FINAL_SUMMARY.md").write_text("\n".join(md)+"\n")
          print("\n".join(md))
          PYCODE

      - name: Publish final summary
        shell: bash
        run: |
          set -euo pipefail
          cat /tmp/okn-final/evidence/FINAL_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Package final evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/okn-final/evidence
          zip -9 -r /tmp/OKN_BP1048P4_FINAL_USB_FLASH_SPEC_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/OKN_BP1048P4_FINAL_USB_FLASH_SPEC_EVIDENCE.zip \
            > /tmp/OKN_BP1048P4_FINAL_USB_FLASH_SPEC_EVIDENCE.zip.sha256

      - name: Upload final evidence
        uses: actions/upload-artifact@v4
        with:
          name: OKN-BP1048P4-FINAL-USB-FLASH-SPEC-EVIDENCE
          path: |
            /tmp/OKN_BP1048P4_FINAL_USB_FLASH_SPEC_EVIDENCE.zip
            /tmp/OKN_BP1048P4_FINAL_USB_FLASH_SPEC_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          grep -F '"LIVE_FLASH_SEQUENCE_AUTHORIZED": false' \
            /tmp/okn-final/evidence/FINAL_PROTOCOL_SPEC_CANDIDATE.json
          grep -F '"USB_OR_BOARD_CONTACTED": false' \
            /tmp/okn-final/evidence/FINAL_PROTOCOL_SPEC_CANDIDATE.json
          grep -F '"FLASH_ALLOWED": false' \
            /tmp/okn-final/evidence/FINAL_PROTOCOL_SPEC_CANDIDATE.json
          echo FINAL_USB_FLASH_SPEC_STATIC_ANALYSIS_COMPLETE=YES
          echo FLASH_ALLOWED=NO
