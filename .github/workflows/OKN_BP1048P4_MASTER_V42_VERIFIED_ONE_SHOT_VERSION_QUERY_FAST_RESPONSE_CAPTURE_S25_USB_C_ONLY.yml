name: OKN BP1048P4 MASTER V42 VERIFIED ONE-SHOT VERSION QUERY + FAST RESPONSE CAPTURE S25 USB-C ONLY

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/OKN_BP1048P4_MASTER_V42_VERIFIED_ONE_SHOT_VERSION_QUERY_FAST_RESPONSE_CAPTURE_S25_USB_C_ONLY.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  V41_ARTIFACT_ID: "11301140892"
  R66_ARTIFACT_ID: "11278218406"
  R67_ARTIFACT_ID: "11279761376"
  SDK_BOOT_USB_ARTIFACT_ID: "11045528884"

  FLASH_ALLOWED: "NO"
  ERASE_ALLOWED: "NO"
  FEATURE_REPORT_ALLOWED: "NO"
  AUTH_REPLY_ALLOWED: "NO"
  STARTUP_COMMAND_ALLOWED: "NO"
  NEW_LIVE_0X11_ALLOWED: "NO"

jobs:
  v42:
    name: Prove control-0x00 semantics, build one-shot query APK, keep flash closed
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Gate 0 - hard safety
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          test "$ERASE_ALLOWED" = "NO"
          test "$FEATURE_REPORT_ALLOWED" = "NO"
          test "$AUTH_REPLY_ALLOWED" = "NO"
          test "$STARTUP_COMMAND_ALLOWED" = "NO"
          test "$NEW_LIVE_0X11_ALLOWED" = "NO"

          rm -rf /tmp/v42
          mkdir -p /tmp/v42/{downloads,artifacts,evidence,out,app/app/src/main/java/com/okn/bp1048p4v42,app/app/src/main/res/xml}

          cat > /tmp/v42/evidence/00_SCOPE.txt <<'EOF'
          REVISION=MASTER-V42
          MODE=STATIC_PROOF_PLUS_ONE_SHOT_READ_SEMANTIC_VERSION_QUERY

          REQUIRED_PHONE=Samsung Galaxy S25+
          REQUIRED_PATH=Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only
          REQUIRED_RUNTIME_VID_PID=6324:1719

          LIVE ACTION BUILT BY THIS WORKFLOW:
          - exactly one IF4 HID Output report only after exact fingerprint and user confirmation
          - payload A5 5A 00 00 16 followed by 251 zero bytes
          - then fast IF4 Input GET_REPORT polling
          - no repeated Output report
          - no Feature report
          - no startup command
          - no auth reply
          - no byte 0x11 transmitted
          - no updater/recovery/erase/flash/write command

          IMPORTANT:
          Control 0x00 is treated as a version-query candidate only if the offline
          SDK/R66/R67 evidence gate proves the public SDK handler constructs a
          version response and contains no flash/update/recovery calls.

          FLASH_ALLOWED=NO
          EOF

      - name: Gate 1 - download exact proof artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          get_artifact() {
            local id="$1"
            local name="$2"
            mkdir -p "/tmp/v42/artifacts/$name"

            curl -fL --retry 5 --retry-all-errors \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              -o "/tmp/v42/downloads/${name}.zip"

            unzip -q "/tmp/v42/downloads/${name}.zip" \
              -d "/tmp/v42/artifacts/$name"
          }

          get_artifact "$V41_ARTIFACT_ID" v41
          get_artifact "$R66_ARTIFACT_ID" r66
          get_artifact "$R67_ARTIFACT_ID" r67
          get_artifact "$SDK_BOOT_USB_ARTIFACT_ID" sdk

          cat > /tmp/v42/unpack.py <<'PY'
          from pathlib import Path
          import zipfile

          root=Path("/tmp/v42/artifacts")
          seen=set()

          for _ in range(5):
              todo=[z for z in root.rglob("*.zip") if z not in seen]
              if not todo:
                  break

              for z in todo:
                  seen.add(z)
                  d=z.with_suffix(z.suffix+".unpacked")
                  d.mkdir(parents=True,exist_ok=True)
                  try:
                      with zipfile.ZipFile(z) as q:
                          q.extractall(d)
                  except Exception:
                      pass

          print("NESTED_ZIPS="+str(len(seen)))
          PY

          python3 /tmp/v42/unpack.py \
            | tee /tmp/v42/evidence/01_UNPACK.txt

          find /tmp/v42/artifacts -type f -printf '%P\n' | sort \
            > /tmp/v42/evidence/02_FILE_INVENTORY.txt

      - name: Gate 2 - independent static proof of control 0x00 version handler
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/v42/prove.py <<'PY'
          from pathlib import Path
          import json,re

          root=Path("/tmp/v42/artifacts")
          ev=Path("/tmp/v42/evidence")

          def one(name):
              xs=list(root.rglob(name))
              if not xs:
                  raise SystemExit("missing "+name)
              return xs[0]

          r66=json.loads(one("R66_VENDOR_HID_SAFETY_MAP.json").read_text())
          r67=json.loads(one("R67_VENDOR_HID_SAFETY_MAP.json").read_text())
          v41=json.loads(one("14_V41_FINAL_MATRIX.json").read_text())

          communication=list(root.rglob("*communication.c"))
          source=None

          for p in communication:
              t=p.read_text(errors="ignore")
              if "Communication_Effect_0x00" in t and "Communication_Effect_Config" in t:
                  source=p
                  break

          if source is None:
              raise SystemExit("public SDK communication.c with control 0x00 handler not found")

          text=source.read_text(errors="ignore")

          m=re.search(
              r'void\s+Communication_Effect_0x00\s*\([^)]*\)\s*\{(.*?)\n\}',
              text,
              re.S
          )

          if not m:
              raise SystemExit("Communication_Effect_0x00 body not recovered")

          body=m.group(1)

          dispatch=bool(re.search(
              r'case\s+0x00\s*:\s*Communication_Effect_0x00\s*\(\s*\)\s*;',
              text,
              re.S
          ))

          response_shape=all(x in body for x in [
              "tx_buf[0]  = 0xa5",
              "tx_buf[1]  = 0x5a",
              "tx_buf[2]  = 0x00",
              "tx_buf[3]  = 0x07",
              "tx_buf[11] = 0x16",
              "Communication_Effect_Send(tx_buf, 12)"
          ])

          version_fields=all(x in body for x in [
              "CFG_EFFECT_MAJOR_VERSION",
              "CFG_EFFECT_MINOR_VERSION",
              "CFG_EFFECT_USER_VERSION",
              "GetAudioLibVer"
          ])

          destructive_tokens=[
              "SpiFlashWrite","SpiFlashErase","FlashChipErase","FlashSectorErase",
              "start_up_grate","pc_upgrade","upgrade","bootloader",
              "chiperas","codedata","bootdat","constdat","cnfgdat",
              "btupdat","upinfo","cxxx"
          ]

          destructive_hits=[
              x for x in destructive_tokens
              if x.lower() in body.lower()
          ]

          r66_frame=r66.get("candidate_version_query_frame_hex")
          r66_no_flash=not bool(r66.get("candidate_version_query_static_function_has_flash_calls"))
          r66_allowed=bool(r66.get("candidate_version_query_live_send_enabled"))
          r67_same=r67.get("candidate_version_query_frame_hex")==r66_frame

          hard_no11=(r66_frame is not None and "11" not in [
              r66_frame[i:i+2] for i in range(0,len(r66_frame),2)
          ])

          proof=(
              dispatch and
              response_shape and
              version_fields and
              not destructive_hits and
              r66_frame=="A55A000016" and
              r66_no_flash and
              r66_allowed and
              r67_same and
              hard_no11 and
              not bool(v41["flash_allowed"])
          )

          result={
              "sdk_source":str(source),
              "control_0x00_dispatch_exact":dispatch,
              "response_shape_a55a_00_len7_tail16":response_shape,
              "version_fields_only":version_fields,
              "destructive_tokens_in_handler":destructive_hits,
              "r66_candidate_frame":r66_frame,
              "r66_static_function_has_flash_calls":
                  bool(r66.get("candidate_version_query_static_function_has_flash_calls")),
              "r66_live_version_query_allowed":
                  r66_allowed,
              "r67_same_candidate_frame":r67_same,
              "query_frame_contains_byte_0x11":not hard_no11,
              "v41_flash_allowed":bool(v41["flash_allowed"]),
              "version_query_static_safety_proof":proof,
              "classification":
                  "ONE_SHOT_VERSION_QUERY_STATICALLY_NONDESTRUCTIVE_PUBLIC_SDK"
                  if proof else
                  "VERSION_QUERY_NOT_AUTHORIZED"
          }

          (ev/"03_VERSION_QUERY_STATIC_PROOF.json").write_text(
              json.dumps(result,indent=2)+"\n"
          )

          (ev/"04_CONTROL_0X00_HANDLER.txt").write_text(
              "SOURCE="+str(source)+"\n\n"+
              "void Communication_Effect_0x00(void)\\n{"+
              body+"\\n}\\n"
          )

          print(json.dumps(result,indent=2))

          if not proof:
              raise SystemExit("STATIC SAFETY PROOF FAILED; APK MUST NOT BE BUILT")
          PY

          python3 /tmp/v42/prove.py \
            | tee /tmp/v42/evidence/05_STATIC_PROOF_SUMMARY.txt

      - name: Gate 3 - setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gate 4 - generate exact-fingerprint one-shot Android app
        shell: bash
        run: |
          set -euo pipefail
          A=/tmp/v42/app

          cat > "$A/settings.gradle" <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name='OKN_BP1048P4_V42_VERSION_QUERY'
          include ':app'
          EOF

          cat > "$A/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > "$A/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > "$A/app/build.gradle" <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.okn.bp1048p4v42'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.okn.bp1048p4v42'
                  minSdk 29
                  targetSdk 35
                  versionCode 42
                  versionName '42.0'
              }
          }
          EOF

          cat > "$A/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.usb.host" android:required="true"/>

              <application
                  android:allowBackup="false"
                  android:label="OKN BP1048P4 V42 Version Query">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED"/>
                      </intent-filter>

                      <meta-data
                          android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED"
                          android:resource="@xml/device_filter"/>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > "$A/app/src/main/res/xml/device_filter.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <usb-device vendor-id="25380" product-id="5913"/>
          </resources>
          EOF

          cat > "$A/app/src/main/java/com/okn/bp1048p4v42/MainActivity.java" <<'JAVA'
          package com.okn.bp1048p4v42;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.hardware.usb.UsbDevice;
          import android.hardware.usb.UsbDeviceConnection;
          import android.hardware.usb.UsbInterface;
          import android.hardware.usb.UsbManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.SystemClock;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import java.security.MessageDigest;
          import java.util.Arrays;
          import java.util.HashMap;
          import java.util.Locale;
          import java.util.Map;

          @SuppressWarnings("deprecation")
          public class MainActivity extends Activity {
              private static final int VID=0x6324;
              private static final int PID=0x1719;
              private static final int SAVE_EVIDENCE=142;
              private static final String USB_PERMISSION=
                  "com.okn.bp1048p4v42.USB_PERMISSION";

              private static final String RAW_SHA=
                  "C7E861A6F28EB832E16450D3A35B64C557BEA4E0CC15FF1EB94C45E348C84001";
              private static final String IF3_SHA=
                  "BAFE7C0E6A251EB36B11362B18106DFF3DC0010A831A3B8B6CD49DBF4A9AE2C3";
              private static final String IF4_SHA=
                  "78510751B31DCC204CD6CA2FE023F05CF84B75227A279E8E1FBAF7D6C3A21B6F";

              private UsbManager usb;
              private TextView log;
              private Button queryButton;
              private final StringBuilder evidence=new StringBuilder();
              private long t0;
              private boolean exactFingerprint=false;
              private boolean querySucceeded=false;
              private boolean queryRunning=false;
              private boolean queryAttempted=false;
              private int hostOutputCount=0;

              private final BroadcastReceiver permissionRx=new BroadcastReceiver() {
                  @Override public void onReceive(Context c,Intent i) {
                      if(!USB_PERMISSION.equals(i.getAction())) return;

                      UsbDevice d=getDevice(i);
                      boolean ok=i.getBooleanExtra(
                          UsbManager.EXTRA_PERMISSION_GRANTED,false);

                      line("USB_PERMISSION_RESULT="+ok+dev(d));

                      if(ok && runtime(d))
                          verify(d);
                  }
              };

              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);

                  getWindow().addFlags(
                      WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  t0=SystemClock.elapsedRealtime();
                  usb=(UsbManager)getSystemService(Context.USB_SERVICE);

                  queryAttempted=getPreferences(MODE_PRIVATE)
                      .getBoolean("v42_query_used",false);

                  evidence.append("EVIDENCE_FORMAT=OKN_BP1048P4_V42_VERIFIED_ONE_SHOT_VERSION_QUERY\n");
                  evidence.append("REQUIRED_PHONE=Samsung Galaxy S25+\n");
                  evidence.append("REQUIRED_PATH=Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only\n");
                  evidence.append("EXPECTED_RUNTIME_VID_PID=6324:1719\n");
                  evidence.append("QUERY_FRAME_HEX=A55A000016\n");
                  evidence.append("QUERY_FRAME_PADDED_BYTES=256\n");
                  evidence.append("QUERY_CONTROL=0x00\n");
                  evidence.append("QUERY_STATIC_SEMANTIC=VERSION_RESPONSE_ONLY_PUBLIC_SDK\n");
                  evidence.append("FEATURE_REPORT_USED=false\n");
                  evidence.append("STARTUP_COMMAND_SENT=false\n");
                  evidence.append("AUTH_REPLY_SENT=false\n");
                  evidence.append("FLASH_WRITE_ERASE_RECOVERY=false\n");
                  evidence.append("NEW_LIVE_0X11_SENT=false\n");

                  IntentFilter pf=new IntentFilter(USB_PERMISSION);

                  if(Build.VERSION.SDK_INT>=33)
                      registerReceiver(
                          permissionRx,pf,Context.RECEIVER_NOT_EXPORTED);
                  else
                      registerReceiver(permissionRx,pf);

                  LinearLayout root=new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(28,28,28,28);

                  TextView title=new TextView(this);
                  title.setText(
                      "OKN BP1048P4 V42 — Verified one-shot version query");
                  title.setTextSize(20);
                  root.addView(title);

                  TextView note=new TextView(this);
                  note.setText(
                      "\nขั้นนี้ไม่ใช่การ flash\n"+
                      "หลัง fingerprint ผ่าน แอปจะส่งเพียง 1 Output report:\n"+
                      "A5 5A 00 00 16 + zero padding\n"+
                      "จากนั้นอ่าน Input report แบบเร็วทันที\n\n"+
                      "ไม่มี Feature report / startup / auth / 0x11 / flash / erase\n");
                  root.addView(note);

                  add(
                      root,
                      "REQUEST USB PERMISSION + VERIFY EXACT BOARD",
                      v->scan(true));

                  queryButton=add(
                      root,
                      "ONE-SHOT VERSION QUERY + FAST CAPTURE",
                      v->confirmQuery());

                  queryButton.setEnabled(false);

                  add(
                      root,
                      "SAVE FULL EVIDENCE REPORT",
                      v->saveEvidence());

                  log=new TextView(this);
                  log.setTextIsSelectable(true);
                  log.setText("\nLog:\n");
                  root.addView(log);

                  ScrollView sv=new ScrollView(this);
                  sv.addView(root);
                  setContentView(sv);

                  scan(false);
              }

              private Button add(
                  LinearLayout root,
                  String text,
                  android.view.View.OnClickListener listener) {

                  Button b=new Button(this);
                  b.setAllCaps(false);
                  b.setText(text);
                  b.setOnClickListener(listener);
                  root.addView(b);
                  return b;
              }

              private void line(String s) {
                  long ms=SystemClock.elapsedRealtime()-t0;
                  String row=String.format(
                      Locale.US,"[%06dms] %s\n",ms,s);

                  evidence.append(row);

                  runOnUiThread(()->{
                      if(log!=null)log.append(row);
                  });
              }

              private UsbDevice getDevice(Intent i) {
                  if(Build.VERSION.SDK_INT>=33)
                      return i.getParcelableExtra(
                          UsbManager.EXTRA_DEVICE,UsbDevice.class);

                  return i.getParcelableExtra(
                      UsbManager.EXTRA_DEVICE);
              }

              private boolean runtime(UsbDevice d) {
                  return d!=null &&
                      d.getVendorId()==VID &&
                      d.getProductId()==PID;
              }

              private boolean recoveryReferencePresent() {
                  for(UsbDevice d:usb.getDeviceList().values()) {
                      if(d.getVendorId()==0x0000 &&
                         d.getProductId()==0x2244)
                          return true;
                  }
                  return false;
              }

              private String dev(UsbDevice d) {
                  if(d==null)return " device=<NULL>";

                  return String.format(
                      Locale.US,
                      " vid=%04X pid=%04X id=%d ifaces=%d",
                      d.getVendorId(),
                      d.getProductId(),
                      d.getDeviceId(),
                      d.getInterfaceCount());
              }

              private void scan(boolean requestPermission) {
                  UsbDevice target=null;

                  for(UsbDevice d:usb.getDeviceList().values()) {
                      line(
                          "USB_DEVICE="+dev(d)+
                          " permission="+usb.hasPermission(d));

                      if(runtime(d))
                          target=d;
                  }

                  if(recoveryReferencePresent()) {
                      exactFingerprint=false;
                      queryButton.setEnabled(false);
                      line("V42_BLOCKED_REFERENCE_RECOVERY_DEVICE_PRESENT=true");
                      return;
                  }

                  if(target==null) {
                      exactFingerprint=false;
                      queryButton.setEnabled(false);
                      line("RUNTIME_TARGET_FOUND=false");
                      return;
                  }

                  line("RUNTIME_TARGET_FOUND=true");

                  if(!usb.hasPermission(target)) {
                      line("USB_PERMISSION=false");

                      if(requestPermission) {
                          Intent intent=new Intent(USB_PERMISSION)
                              .setPackage(getPackageName());

                          PendingIntent pi=PendingIntent.getBroadcast(
                              this,
                              target.getDeviceId(),
                              intent,
                              PendingIntent.FLAG_UPDATE_CURRENT|
                              PendingIntent.FLAG_MUTABLE);

                          usb.requestPermission(target,pi);
                          line("USB_PERMISSION_REQUESTED=true");
                      }

                      return;
                  }

                  verify(target);
              }

              private Map<Integer,Integer> hidLengths(byte[] raw) {
                  Map<Integer,Integer> out=new HashMap<>();
                  int p=0,currentIf=-1,currentClass=-1;

                  while(raw!=null && p+2<=raw.length) {
                      int len=raw[p]&255;
                      int type=raw[p+1]&255;

                      if(len<2 || p+len>raw.length)
                          break;

                      if(type==0x04 && len>=9) {
                          currentIf=raw[p+2]&255;
                          currentClass=raw[p+5]&255;

                      } else if(
                          type==0x21 &&
                          currentClass==3 &&
                          currentIf>=0 &&
                          len>=9) {

                          int n=raw[p+5]&255;
                          int q=p+6;

                          for(
                              int k=0;
                              k<n && q+2<p+len;
                              k++,q+=3) {

                              int dtype=raw[q]&255;
                              int dlen=
                                  (raw[q+1]&255)|
                                  ((raw[q+2]&255)<<8);

                              if(dtype==0x22 && dlen>0) {
                                  out.put(currentIf,dlen);
                                  break;
                              }
                          }
                      }

                      p+=len;
                  }

                  return out;
              }

              private byte[] reportDescriptor(
                  UsbDeviceConnection c,
                  UsbInterface x,
                  int expected) {

                  byte[] b=new byte[expected];

                  int r=c.controlTransfer(
                      0x81,0x06,0x2200,x.getId(),
                      b,b.length,1200);

                  line(
                      "IF"+x.getId()+
                      "_REPORT_DESCRIPTOR_RESULT="+r);

                  if(r<=0)
                      return null;

                  byte[] exact=Arrays.copyOf(b,r);

                  line(
                      "IF"+x.getId()+
                      "_REPORT_DESCRIPTOR_SHA256="+sha256(exact));

                  return exact;
              }

              private byte[] recoverIf3(
                  UsbDeviceConnection c,
                  UsbInterface if3,
                  int expected) {

                  byte[] b=reportDescriptor(c,if3,expected);

                  if(b!=null && IF3_SHA.equals(sha256(b)))
                      return b;

                  boolean cl=c.claimInterface(if3,false);
                  line("IF3_TEMP_CLAIM_FORCE_FALSE="+cl);

                  if(cl) {
                      try {
                          b=reportDescriptor(c,if3,expected);
                      } finally {
                          line(
                              "IF3_TEMP_RELEASE_FORCE_FALSE="+
                              c.releaseInterface(if3));
                      }
                  }

                  if(b!=null && IF3_SHA.equals(sha256(b)))
                      return b;

                  boolean clf=c.claimInterface(if3,true);
                  line("IF3_TEMP_CLAIM_FORCE_TRUE="+clf);

                  if(clf) {
                      try {
                          b=reportDescriptor(c,if3,expected);
                      } finally {
                          line(
                              "IF3_TEMP_RELEASE_FORCE_TRUE="+
                              c.releaseInterface(if3));
                      }
                  }

                  return b;
              }

              private void verify(UsbDevice d) {
                  exactFingerprint=false;

                  UsbDeviceConnection c=usb.openDevice(d);

                  if(c==null) {
                      line("VERIFY_OPEN_NULL=true");
                      queryButton.setEnabled(false);
                      return;
                  }

                  try {
                      byte[] raw=c.getRawDescriptors();

                      if(raw==null || raw.length==0) {
                          line("RAW_DESCRIPTOR_EMPTY=true");
                          return;
                      }

                      String rawSha=sha256(raw);

                      line("RAW_DESCRIPTOR_BYTES="+raw.length);
                      line("RAW_DESCRIPTOR_SHA256="+rawSha);

                      Map<Integer,Integer> lens=hidLengths(raw);

                      UsbInterface if3=null;
                      UsbInterface if4=null;

                      for(int i=0;i<d.getInterfaceCount();i++) {
                          UsbInterface x=d.getInterface(i);

                          if(x.getInterfaceClass()==3 && x.getId()==3)
                              if3=x;

                          if(x.getInterfaceClass()==3 && x.getId()==4)
                              if4=x;
                      }

                      if(if3==null || if4==null) {
                          line("REQUIRED_HID_INTERFACES_MISSING=true");
                          return;
                      }

                      byte[] h4=reportDescriptor(
                          c,
                          if4,
                          lens.containsKey(4)?lens.get(4):36);

                      byte[] h3=recoverIf3(
                          c,
                          if3,
                          lens.containsKey(3)?lens.get(3):33);

                      boolean rawOk=RAW_SHA.equals(rawSha);
                      boolean if3Ok=
                          h3!=null &&
                          IF3_SHA.equals(sha256(h3));
                      boolean if4Ok=
                          h4!=null &&
                          IF4_SHA.equals(sha256(h4));

                      exactFingerprint=rawOk && if3Ok && if4Ok;

                      line("RAW_FINGERPRINT_OK="+rawOk);
                      line("IF3_FINGERPRINT_OK="+if3Ok);
                      line("IF4_FINGERPRINT_OK="+if4Ok);
                      line(
                          "V42_EXACT_RUNTIME_FINGERPRINT_OK="+
                          exactFingerprint);

                  } finally {
                      c.close();

                      queryButton.setEnabled(
                          exactFingerprint &&
                          !queryAttempted &&
                          !queryRunning);
                  }
              }

              private void confirmQuery() {
                  if(!exactFingerprint) {
                      line("V42_QUERY_BLOCKED_FINGERPRINT=false");
                      return;
                  }

                  if(queryAttempted || queryRunning) {
                      line("V42_QUERY_BLOCKED_ALREADY_USED=true");
                      return;
                  }

                  new AlertDialog.Builder(this)
                      .setTitle("V42 one-shot version query")
                      .setMessage(
                          "จะส่งเพียง 1 HID Output report: A5 5A 00 00 16 + zero padding\n"+
                          "จากนั้นอ่าน Input report แบบเร็ว 5 วินาที\n\n"+
                          "ไม่มี Feature report / auth / startup / 0x11 / flash / erase")
                      .setNegativeButton("CANCEL",null)
                      .setPositiveButton(
                          "SEND ONE-SHOT QUERY",
                          (d,w)->startQuery())
                      .show();
              }

              private void startQuery() {
                  if(!exactFingerprint || queryAttempted || queryRunning) {
                      line("V42_QUERY_START_BLOCKED=true");
                      return;
                  }

                  boolean persisted=getPreferences(MODE_PRIVATE)
                      .edit()
                      .putBoolean("v42_query_used",true)
                      .commit();

                  queryAttempted=true;

                  line("V42_QUERY_ATTEMPT_LATCHED=true");
                  line("V42_QUERY_ATTEMPT_PERSISTED="+persisted);

                  if(!persisted) {
                      line("V42_QUERY_ABORT_PERSISTENCE_FAILED=true");
                      return;
                  }

                  queryRunning=true;
                  queryButton.setEnabled(false);

                  new Thread(this::runQuery,"v42-query").start();
              }

              private void runQuery() {
                  UsbDevice target=null;

                  for(UsbDevice d:usb.getDeviceList().values())
                      if(runtime(d))
                          target=d;

                  if(target==null || !usb.hasPermission(target)) {
                      line("V42_QUERY_ABORT_TARGET_OR_PERMISSION=true");
                      finishQuery();
                      return;
                  }

                  if(recoveryReferencePresent()) {
                      line("V42_QUERY_ABORT_RECOVERY_REFERENCE_PRESENT=true");
                      finishQuery();
                      return;
                  }

                  UsbInterface if4=null;

                  for(int i=0;i<target.getInterfaceCount();i++) {
                      UsbInterface x=target.getInterface(i);

                      if(x.getInterfaceClass()==3 && x.getId()==4) {
                          if4=x;
                          break;
                      }
                  }

                  if(if4==null) {
                      line("V42_QUERY_ABORT_IF4_MISSING=true");
                      finishQuery();
                      return;
                  }

                  UsbDeviceConnection c=usb.openDevice(target);

                  if(c==null) {
                      line("V42_QUERY_ABORT_OPEN_NULL=true");
                      finishQuery();
                      return;
                  }

                  boolean claimed=false;

                  try {
                      claimed=c.claimInterface(if4,false);
                      line("V42_IF4_CLAIM_FORCE_FALSE="+claimed);

                      if(!claimed) {
                          line("V42_QUERY_ABORT_IF4_CLAIM=false");
                          return;
                      }

                      byte[] out=new byte[256];
                      out[0]=(byte)0xA5;
                      out[1]=(byte)0x5A;
                      out[2]=(byte)0x00;
                      out[3]=(byte)0x00;
                      out[4]=(byte)0x16;

                      line("V42_OUTPUT_FRAME_HEX=A55A000016");
                      line("V42_OUTPUT_ZERO_PAD_BYTES=251");

                      int wo=c.controlTransfer(
                          0x21,0x09,0x0200,if4.getId(),
                          out,out.length,1500);

                      line(
                          "V42_SET_REPORT_OUTPUT_RESULT="+wo+
                          " requestedBytes=256");

                      if(wo!=256) {
                          line("V42_OUTPUT_NOT_FULL=true");
                          return;
                      }

                      hostOutputCount=1;

                      long start=SystemClock.elapsedRealtime();
                      long deadline=start+5000;

                      int iterations=0;
                      int positive=0;
                      int zeros=0;
                      int negatives=0;

                      byte[] firstPositive=null;
                      int firstResult=0;
                      long firstElapsed=-1;

                      byte[] firstVersionFrame=null;
                      int versionResult=0;
                      long versionElapsed=-1;

                      while(
                          SystemClock.elapsedRealtime()<deadline &&
                          iterations<1200) {

                          byte[] input=new byte[256];

                          int ri=c.controlTransfer(
                              0xA1,0x01,0x0100,if4.getId(),
                              input,input.length,25);

                          iterations++;

                          if(ri<0) {
                              negatives++;
                              continue;
                          }

                          if(ri==0) {
                              zeros++;
                              continue;
                          }

                          positive++;

                          byte[] exact=Arrays.copyOf(input,ri);

                          if(firstPositive==null) {
                              firstPositive=exact;
                              firstResult=ri;
                              firstElapsed=
                                  SystemClock.elapsedRealtime()-start;
                          }

                          boolean signature=
                              ri>=12 &&
                              (input[0]&255)==0xA5 &&
                              (input[1]&255)==0x5A &&
                              (input[2]&255)==0x00 &&
                              (input[3]&255)==0x07 &&
                              (input[11]&255)==0x16;

                          if(signature) {
                              firstVersionFrame=exact;
                              versionResult=ri;
                              versionElapsed=
                                  SystemClock.elapsedRealtime()-start;
                              break;
                          }
                      }

                      long elapsed=
                          SystemClock.elapsedRealtime()-start;

                      line("V42_FAST_CAPTURE_ELAPSED_MS="+elapsed);
                      line("V42_FAST_CAPTURE_ITERATIONS="+iterations);
                      line("V42_FAST_CAPTURE_POSITIVE="+positive);
                      line("V42_FAST_CAPTURE_ZERO="+zeros);
                      line("V42_FAST_CAPTURE_NEGATIVE="+negatives);

                      if(firstPositive!=null) {
                          line(
                              "V42_FIRST_POSITIVE_ELAPSED_MS="+
                              firstElapsed);
                          line(
                              "V42_FIRST_POSITIVE_RESULT="+
                              firstResult);
                          line(
                              "V42_FIRST_POSITIVE_SHA256="+
                              sha256(firstPositive));
                          line(
                              "V42_FIRST_POSITIVE_HEX="+
                              hex(firstPositive));
                      } else {
                          line("V42_FIRST_POSITIVE_PRESENT=false");
                      }

                      if(firstVersionFrame!=null) {
                          querySucceeded=true;

                          line(
                              "V42_VERSION_FRAME_ELAPSED_MS="+
                              versionElapsed);
                          line(
                              "V42_VERSION_FRAME_RESULT="+
                              versionResult);
                          line(
                              "V42_VERSION_FRAME_SHA256="+
                              sha256(firstVersionFrame));
                          line(
                              "V42_VERSION_FRAME_HEX="+
                              hex(firstVersionFrame));

                          int family=firstVersionFrame[4]&255;
                          int major=firstVersionFrame[5]&255;
                          int minor=firstVersionFrame[6]&255;
                          int user=firstVersionFrame[7]&255;
                          int libA=firstVersionFrame[8]&255;
                          int libB=firstVersionFrame[9]&255;
                          int libC=firstVersionFrame[10]&255;

                          line("V42_VERSION_FAMILY="+family);
                          line(
                              "V42_EFFECT_VERSION="+
                              major+"."+minor+"."+user);
                          line(
                              "V42_AUDIO_LIB_VERSION="+
                              libA+"."+libB+"."+libC);
                          line("V42_VERSION_QUERY_SUCCEEDED=true");

                      } else {
                          line("V42_VERSION_QUERY_SUCCEEDED=false");
                      }

                      line(
                          "HOST_APPLICATION_OUTPUT_COUNT="+
                          hostOutputCount);
                      line("FEATURE_REPORT_USED=false");
                      line("STARTUP_COMMAND_SENT=false");
                      line("AUTH_REPLY_SENT=false");
                      line("FLASH_WRITE_ERASE_RECOVERY=false");
                      line("NEW_LIVE_0X11_SENT=false");
                      line("V42_QUERY_COMPLETE=true");

                  } catch(Exception ex) {
                      line(
                          "V42_QUERY_EXCEPTION="+
                          ex.getClass().getName()+":"+
                          ex.getMessage());

                  } finally {
                      if(claimed) {
                          try {
                              line(
                                  "V42_IF4_RELEASE="+
                                  c.releaseInterface(if4));
                          } catch(Exception ex) {
                              line(
                                  "V42_RELEASE_EXCEPTION="+
                                  ex.getClass().getName());
                          }
                      }

                      c.close();
                      finishQuery();
                  }
              }

              private void finishQuery() {
                  queryRunning=false;
                  runOnUiThread(()->queryButton.setEnabled(false));
              }

              private void saveEvidence() {
                  Intent i=new Intent(Intent.ACTION_CREATE_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("text/plain");

                  i.putExtra(
                      Intent.EXTRA_TITLE,
                      "OKN_BP1048P4_V42_VERIFIED_ONE_SHOT_VERSION_QUERY_EVIDENCE.txt");

                  startActivityForResult(i,SAVE_EVIDENCE);
              }

              @Override protected void onActivityResult(
                  int requestCode,
                  int resultCode,
                  Intent data) {

                  super.onActivityResult(
                      requestCode,resultCode,data);

                  if(
                      requestCode==SAVE_EVIDENCE &&
                      resultCode==RESULT_OK &&
                      data!=null) {

                      try(OutputStream os=
                          getContentResolver()
                          .openOutputStream(data.getData())) {

                          String footer=
                              "\nEXPORT_EXACT_RUNTIME_FINGERPRINT_OK="+
                              exactFingerprint+
                              "\nEXPORT_QUERY_ATTEMPTED="+
                              queryAttempted+
                              "\nEXPORT_QUERY_SUCCEEDED="+
                              querySucceeded+
                              "\nEXPORT_HOST_APPLICATION_OUTPUT_COUNT="+
                              hostOutputCount+
                              "\nEXPORT_FEATURE_REPORT_USED=false"+
                              "\nEXPORT_STARTUP_COMMAND_SENT=false"+
                              "\nEXPORT_AUTH_REPLY_SENT=false"+
                              "\nEXPORT_FLASH_WRITE_ERASE_RECOVERY=false"+
                              "\nEXPORT_NEW_LIVE_0X11_SENT=false"+
                              "\nEXPORT_FLASH_ALLOWED=NO\n";

                          os.write(
                              (evidence.toString()+footer)
                              .getBytes(StandardCharsets.UTF_8));

                          line("EVIDENCE_EXPORT_OK=true");

                      } catch(Exception ex) {
                          line(
                              "EVIDENCE_EXPORT_ERROR="+ex);
                      }
                  }
              }

              private static String hex(byte[] b) {
                  StringBuilder s=
                      new StringBuilder(b.length*2);

                  for(byte x:b)
                      s.append(
                          String.format(
                              Locale.US,"%02X",x&255));

                  return s.toString();
              }

              private static String sha256(byte[] b) {
                  try {
                      MessageDigest md=
                          MessageDigest.getInstance("SHA-256");
                      return hex(md.digest(b));
                  } catch(Exception e) {
                      return "SHA256_ERROR";
                  }
              }

              @Override protected void onDestroy() {
                  try {
                      unregisterReceiver(permissionRx);
                  } catch(Exception ignored) {}

                  super.onDestroy();
              }
