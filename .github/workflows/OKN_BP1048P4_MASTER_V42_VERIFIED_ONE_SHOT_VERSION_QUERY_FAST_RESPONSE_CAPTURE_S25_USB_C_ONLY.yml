      - name: Gate 5 - static APK source safety audit
        shell: bash
        run: |
          set -euo pipefail

          SRC=/tmp/v42/app/app/src/main/java/com/okn/bp1048p4v42/MainActivity.java

          python3 - <<'PY'
          from pathlib import Path
          import re

          t=Path(
              "/tmp/v42/app/app/src/main/java/com/okn/bp1048p4v42/MainActivity.java"
          ).read_text()

          required=[
              "A55A000016",
              "0x21,0x09,0x0200",
              "0xA1,0x01,0x0100",
              "V42_EXACT_RUNTIME_FINGERPRINT_OK=",
              "FEATURE_REPORT_USED=false",
              "AUTH_REPLY_SENT=false",
              "STARTUP_COMMAND_SENT=false",
              "FLASH_WRITE_ERASE_RECOVERY=false",
              "NEW_LIVE_0X11_SENT=false"
          ]

          missing=[x for x in required if x not in t]
          if missing:
              raise SystemExit("missing required safety token(s): "+repr(missing))

          forbidden=[
              "0xA1,0x01,0x0300",
              "0x21,0x09,0x0300",
              "HidD_SetFeature",
              "FLASH_BOOT_EN",
              "chiperas",
              "codedata",
              "bootdat",
              "constdat",
              "cnfgdat",
              "btupdat",
              "upinfo",
              "cxxx",
              "AUTH_ANDROID_WIRE",
              "SendDevTypeSwVersAuthenRequest"
          ]

          bad=[x for x in forbidden if x in t]
          if bad:
              raise SystemExit("forbidden token(s): "+repr(bad))

          # Exactly one Output-report controlTransfer call site.
          output_calls=len(re.findall(
              r'controlTransfer\(\s*0x21\s*,\s*0x09\s*,\s*0x0200',
              t
          ))

          if output_calls != 1:
              raise SystemExit(
                  "expected exactly one Output SET_REPORT call site, got "+
                  str(output_calls)
              )

          # Query bytes must be exactly A5 5A 00 00 16.
          assigns=[
              "out[0]=(byte)0xA5",
              "out[1]=(byte)0x5A",
              "out[2]=(byte)0x00",
              "out[3]=(byte)0x00",
              "out[4]=(byte)0x16"
          ]

          for a in assigns:
              if a not in t:
                  raise SystemExit("query byte assignment missing: "+a)

          # No literal byte assignment of 0x11 anywhere in the outgoing frame.
          if re.search(r'out\[[0-9]+\]\s*=\s*\(byte\)0x11\b',t):
              raise SystemExit("forbidden outgoing byte 0x11 found")

          print("V42_STATIC_LIVE_SAFETY_AUDIT=PASS")
          print("V42_OUTPUT_CALL_SITES=1")
          print("V42_FEATURE_REPORT_CALL_SITES=0")
          print("V42_AUTH_CALL_SITES=0")
          print("V42_FLASH_CALL_SITES=0")
          PY

          cp "$SRC" /tmp/v42/evidence/MainActivity.java
          sha256sum "$SRC" \
            > /tmp/v42/evidence/06_MAINACTIVITY_SHA256.txt

