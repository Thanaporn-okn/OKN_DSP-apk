name: Build OKN Peramp DSP

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create complete OKN Peramp DSP project
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          files = {
              'build.gradle.kts': 'cGx1Z2lucyB7CiAgICBpZCgiY29tLmFuZHJvaWQuYXBwbGljYXRpb24iKSB2ZXJzaW9uICI4LjcuMyIgYXBwbHkgZmFsc2UKICAgIGlkKCJvcmcuamV0YnJhaW5zLmtvdGxpbi5hbmRyb2lkIikgdmVyc2lvbiAiMi4wLjIxIiBhcHBseSBmYWxzZQogICAgaWQoIm9yZy5qZXRicmFpbnMua290bGluLnBsdWdpbi5jb21wb3NlIikgdmVyc2lvbiAiMi4wLjIxIiBhcHBseSBmYWxzZQp9Cg==',
              'settings.gradle.kts': '',
              'gradle.properties': 'b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgzZyAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCmtvdGxpbi5jb2RlLnN0eWxlPW9mZmljaWFsCmFuZHJvaWQubm9uVHJhbnNpdGl2ZVJDbGFzcz10cnVlCg==',
              'app/build.gradle.kts': '',
              'app/proguard-rules.pro': 'IyBPS04gUGVyYW1wIERTUCAtIG5vIGN1c3RvbSBrZWVwIHJ1bGVzIGFyZSByZXF1aXJlZCBmb3IgdGhlIGN1cnJlbnQgYWxwaGEgYnVpbGQuCg==',
              'app/src/main/AndroidManifest.xml': '',
              'app/src/main/res/xml/backup_rules.xml': 'PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPGRhdGEtZXh0cmFjdGlvbi1ydWxlcz4KICAgIDxjbG91ZC1iYWNrdXAgZGlzYWJsZUlmTm9FbmNyeXB0aW9uQ2FwYWJpbGl0aWVzPSJ0cnVlIiAvPgogICAgPGRldmljZS10cmFuc2ZlciAvPgo8L2RhdGEtZXh0cmFjdGlvbi1ydWxlcz4K',
              'app/src/main/res/values/themes.xml': '',
              'app/src/main/res/values/strings.xml': 'PHJlc291cmNlcz4KICAgIDxzdHJpbmcgbmFtZT0iYXBwX25hbWUiPk9LTiBQZXJhbXAgRFNQPC9zdHJpbmc+CjwvcmVzb3VyY2VzPgo=',
              'app/src/main/java/com/okn/perampdsp/MainActivity.kt': '',
              'app/src/main/java/com/okn/perampdsp/ble/BleTransport.kt': '',
              'app/src/main/java/com/okn/perampdsp/ble/BleUuids.kt': '',
              'app/src/main/java/com/okn/perampdsp/model/DspModels.kt': '',
              'app/src/main/java/com/okn/perampdsp/protocol/UfeProtocol.kt': '',
              'app/src/main/java/com/okn/perampdsp/repository/DspRepository.kt': '',
              'app/src/main/java/com/okn/perampdsp/ui/PerampApp.kt': '',
              'app/src/main/java/com/okn/perampdsp/ui/theme/Theme.kt': '',
          }

          for name, payload in files.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(payload))

          print(f"Created {len(files)} project files")
          PY

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        shell: bash
        run: cp app/build/outputs/apk/debug/app-debug.apk OKN-Peramp-DSP-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN-Peramp-DSP-debug
          path: OKN-Peramp-DSP-debug.apk
          if-no-files-found: error
          retention-days: 30
