name: OKN BP1048P4 Reactor VM Devirtualize V5

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLASH_ALLOWED: "NO"
  EXPECTED_CLIENT_ZIP_SHA256: "f14b0c4baad70a8b0d5dc3b2783819cc2ef6e1a9c6ec2adcf17f1557059edd2a"

jobs:
  devirtualize:
    name: Recover virtualized updater methods - OFFLINE TARGET - NO USB - NO FLASH
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Safety gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:FLASH_ALLOWED -ne "NO") { throw "FLASH_ALLOWED must remain NO" }

          New-Item -ItemType Directory -Force -Path `
            C:\v5\client, `
            C:\v5\tools, `
            C:\v5\krypton, `
            C:\v5\decompiled, `
            C:\v5\evidence | Out-Null

          @"
          TARGET=official GoloPine Windows client 08-Apr-2026
          MODE=WINDOWS_STATIC_PLUS_SANDBOXED_DEVIRTUALIZATION
          USER_BOARD_CONNECTED=NO
          USB_COMMAND_SENT=NO
          FEATURE_REPORT_SENT=NO
          BOOT_ENTRY_EXECUTED=NO
          FLASH_READ_EXECUTED=NO
          FLASH_ERASE_EXECUTED=NO
          FLASH_WRITE_EXECUTED=NO
          FLASH_ALLOWED=NO
          "@ | Set-Content C:\v5\evidence\SAFETY.txt

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download pinned official Windows client
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-08.exe_.zip"
          Invoke-WebRequest -Uri $url -OutFile C:\v5\client\client.zip

          $actual = (Get-FileHash C:\v5\client\client.zip -Algorithm SHA256).Hash.ToLower()
          "expected=$env:EXPECTED_CLIENT_ZIP_SHA256" | Set-Content C:\v5\evidence\CLIENT_PIN.txt
          "actual=$actual" | Add-Content C:\v5\evidence\CLIENT_PIN.txt
          if ($actual -ne $env:EXPECTED_CLIENT_ZIP_SHA256) {
            throw "Official client ZIP hash changed"
          }

          Expand-Archive -Force C:\v5\client\client.zip C:\v5\client\extracted
          $exe = Get-ChildItem C:\v5\client\extracted -Recurse -File -Filter *.exe |
            Where-Object { $_.FullName -notmatch "__MACOSX" } |
            Select-Object -First 1
          if (-not $exe) { throw "Client EXE not found" }

          Copy-Item $exe.FullName C:\v5\client\original.exe
          (Get-FileHash C:\v5\client\original.exe -Algorithm SHA256).Hash |
            Set-Content C:\v5\evidence\ORIGINAL_EXE_SHA256.txt
          $exe.FullName | Set-Content C:\v5\evidence\ORIGINAL_EXE_SOURCE_PATH.txt

      - name: Install ILSpy
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet tool install ilspycmd --tool-path C:\v5\tools\ilspy |
            Tee-Object -FilePath C:\v5\evidence\ILSPY_INSTALL.log

      - name: Clone and build Krypton Reactor devirtualizer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git clone --depth 1 https://github.com/dawwinci/krypton-devirtualizer.git C:\v5\krypton\src
          Push-Location C:\v5\krypton\src
          git rev-parse HEAD | Set-Content C:\v5\evidence\KRYPTON_COMMIT.txt

          dotnet restore .\Krypton.Core\Krypton.Core.csproj
          dotnet build .\Krypton.Core\Krypton.Core.csproj -c Release -t:Rebuild --no-restore

          dotnet restore .\Krypton.Pipeline\Krypton.Pipeline.csproj
          dotnet build .\Krypton.Pipeline\Krypton.Pipeline.csproj -c Release -t:Rebuild --no-restore

          dotnet restore .\Krypton\Krypton.csproj
          dotnet msbuild .\Krypton\Krypton.csproj /t:Rebuild /p:Configuration=Release /m:1

          if (Test-Path .\Krypton.Runner\Krypton.Runner.csproj) {
            dotnet build .\Krypton.Runner\Krypton.Runner.csproj -c Release |
              Tee-Object -FilePath C:\v5\evidence\KRYPTON_RUNNER_BUILD.log
          }

          Pop-Location

          $krypton = Get-ChildItem C:\v5\krypton\src\Krypton\bin\Release -Recurse -File -Filter Krypton.dll |
            Where-Object { $_.FullName -match "net8" } |
            Select-Object -First 1
          if (-not $krypton) { throw "Krypton.dll not found after build" }
          $krypton.FullName | Set-Content C:\v5\evidence\KRYPTON_DLL_PATH.txt

      - name: Baseline protected assembly
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          New-Item -ItemType Directory -Force -Path C:\v5\decompiled\original | Out-Null

          & C:\v5\tools\ilspy\ilspycmd.exe -p -o C:\v5\decompiled\original C:\v5\client\original.exe `
            *> C:\v5\evidence\ORIGINAL_ILSPY.log

          & C:\v5\tools\ilspy\ilspycmd.exe -il C:\v5\client\original.exe `
            *> C:\v5\evidence\ORIGINAL.il.txt

          Get-ChildItem C:\v5\decompiled\original -Recurse -File |
            Select-String -Pattern `
              'HidD_SetFeature','HidD_GetFeature','HidD_SetOutputReport','HidD_GetInputReport',`
              'SetFeature','getFeature','FlashId','Flash usb connected','Otp usb connected',`
              'actual_boot_lenth','exist flash boot','upgrade','firmware' |
            ForEach-Object {
              "{0}:{1}: {2}" -f $_.Path,$_.LineNumber,$_.Line
            } | Set-Content C:\v5\evidence\ORIGINAL_HITS.txt

      - name: Run Krypton strict VM reconstruction
        shell: pwsh
        env:
          KRYPTON_NO_PAUSE: "1"
          KRYPTON_LOG_VM_MAP: "1"
          KRYPTON_LOG_LOCAL_TYPES: "1"
          KRYPTON_LOG_EXCEPTIONS: "1"
          KRYPTON_STRICT_MAPPING: "1"
          KRYPTON_GLOBAL_STACK_SOLVER: "1"
          KRYPTON_TYPE_CONSTRAINTS: "1"
          KRYPTON_ENABLE_NECROBIT_BODY_RESTORE: "1"
          KRYPTON_STRING_DECRYPT: "1"
          KRYPTON_RESOURCE_DECRYPT: "1"
          KRYPTON_ALLOW_PARTIAL_OUTPUT: "1"
        run: |
          $ErrorActionPreference = "Continue"

          $krypton = Get-Content C:\v5\evidence\KRYPTON_DLL_PATH.txt | Select-Object -First 1
          Push-Location C:\v5\client

          dotnet $krypton C:\v5\client\original.exe --no-pause `
            *> C:\v5\evidence\KRYPTON_RUN.log
          $exit = $LASTEXITCODE
          "exit_code=$exit" | Set-Content C:\v5\evidence\KRYPTON_EXIT.txt

          Get-ChildItem C:\v5\client -File |
            Select-Object Name,Length,LastWriteTime |
            Format-Table -AutoSize |
            Out-String -Width 4096 |
            Set-Content C:\v5\evidence\KRYPTON_OUTPUT_FILES.txt

          Pop-Location

          # GitHub's pwsh wrapper propagates the last native process exit code.
          # Preserve Krypton's real exit code in KRYPTON_EXIT.txt, then clear
          # LASTEXITCODE so the remaining forensic/reporting steps still run.
          $global:LASTEXITCODE = 0
          exit 0

      - name: Locate reconstructed assembly
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $candidates = @(
            Get-ChildItem C:\v5\client -File -Filter "*Devirtualized*.exe" -ErrorAction SilentlyContinue
            Get-ChildItem C:\v5\client -File -Filter "*devirtualized*.exe" -ErrorAction SilentlyContinue
            Get-ChildItem C:\v5\client -File -Filter "*patched*.exe" -ErrorAction SilentlyContinue
          ) | Sort-Object LastWriteTime -Descending -Unique

          $picked = $candidates | Select-Object -First 1
          if ($picked) {
            Copy-Item $picked.FullName C:\v5\client\reconstructed.exe
            "FOUND" | Set-Content C:\v5\evidence\RECONSTRUCTED_STATUS.txt
            $picked.FullName | Add-Content C:\v5\evidence\RECONSTRUCTED_STATUS.txt
            (Get-FileHash C:\v5\client\reconstructed.exe -Algorithm SHA256).Hash |
              Set-Content C:\v5\evidence\RECONSTRUCTED_EXE_SHA256.txt
          }
          else {
            "NOT_FOUND" | Set-Content C:\v5\evidence\RECONSTRUCTED_STATUS.txt
            # Do not fail here: reports may still reveal unknown VM opcodes / blockers.
          }

          Get-ChildItem C:\v5\client -File -Filter "*report*.txt" -ErrorAction SilentlyContinue |
            ForEach-Object {
              Copy-Item $_.FullName ("C:\v5\evidence\" + $_.Name) -Force
            }

      - name: Decompile reconstructed assembly and recover exact HID calls
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          if (Test-Path C:\v5\client\reconstructed.exe) {
            New-Item -ItemType Directory -Force -Path C:\v5\decompiled\reconstructed | Out-Null

            & C:\v5\tools\ilspy\ilspycmd.exe -p `
              -o C:\v5\decompiled\reconstructed `
              C:\v5\client\reconstructed.exe `
              *> C:\v5\evidence\RECONSTRUCTED_ILSPY.log

            & C:\v5\tools\ilspy\ilspycmd.exe -il `
              C:\v5\client\reconstructed.exe `
              *> C:\v5\evidence\RECONSTRUCTED.il.txt
          }

      - name: Strict proof extractor
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path
          import json, re

          E=Path(r"C:\v5\evidence")
          roots=[
              Path(r"C:\v5\decompiled\original"),
              Path(r"C:\v5\decompiled\reconstructed"),
          ]

          texts={}
          for root in roots:
              if not root.exists():
                  continue
              for p in root.rglob("*"):
                  if not p.is_file():
                      continue
                  try:
                      if p.stat().st_size > 12_000_000:
                          continue
                      txt=p.read_text(errors="replace")
                  except Exception:
                      continue
                  texts[p]=txt

          # Also include IL dumps.
          for p in [E/"ORIGINAL.il.txt", E/"RECONSTRUCTED.il.txt"]:
              if p.exists():
                  try:
                      texts[p]=p.read_text(errors="replace")
                  except Exception:
                      pass

          APIs=[
              "HidD_SetFeature","HidD_GetFeature",
              "HidD_SetOutputReport","HidD_GetInputReport"
          ]

          # Discover wrapper method names from declarations.
          wrappers={}
          decl_blocks=[]
          for p,txt in texts.items():
              lines=txt.splitlines()
              for i,line in enumerate(lines):
                  if not any(api.lower() in line.lower() for api in APIs):
                      continue
                  lo=max(0,i-8); hi=min(len(lines),i+14)
                  block="\n".join(lines[lo:hi])
                  for api in APIs:
                      if api.lower() not in block.lower():
                          continue
                      # C# extern declaration.
                      m=re.search(
                          r'(?:extern\s+)?(?:bool|Boolean|int|Int32|void)\s+'
                          r'([A-Za-z_][A-Za-z0-9_]*)\s*\(',
                          block,re.I
                      )
                      if m:
                          wrappers.setdefault(m.group(1),set()).add(api)
                      # IL pinvoke method declaration.
                      m2=re.search(
                          r'\.method[^\n]*pinvokeimpl\("[^"]*"\s+as\s+"'+
                          re.escape(api)+
                          r'"[^\n]*\).*?\n(?:.*\n){0,4}?\s*([A-Za-z_][A-Za-z0-9_]*)\s*\(',
                          block,re.I|re.S
                      )
                      if m2:
                          wrappers.setdefault(m2.group(1),set()).add(api)

                      decl_blocks.append((str(p),i+1,api,block))

          # Known wrapper names from V3/V4 remain useful only as names, not evidence.
          wrappers.setdefault("getFeature",set()).add("HidD_GetFeature")

          real_calls=[]
          setfeature_candidates=[]
          for p,txt in texts.items():
              lines=txt.splitlines()
              for name,apis in wrappers.items():
                  rx=re.compile(r'\b'+re.escape(name)+r'\s*\(')
                  for i,line in enumerate(lines):
                      if not rx.search(line):
                          continue
                      nearby="\n".join(lines[max(0,i-4):min(len(lines),i+5)])
                      if re.search(r'extern\s|DllImport|pinvokeimpl',nearby,re.I):
                          continue
                      lo=max(0,i-55); hi=min(len(lines),i+70)
                      context="\n".join(f"{j+1:6d}: {lines[j]}" for j in range(lo,hi))
                      item={
                          "file":str(p),"line":i+1,
                          "wrapper":name,"apis":sorted(apis),
                          "context":context
                      }
                      real_calls.append(item)

                      if any("SetFeature" in a for a in apis):
                          before="\n".join(lines[max(0,i-60):i+1])
                          vals=[]
                          patterns=[
                              ("0x55",r'(?<![0-9A-Fa-f])0x55(?![0-9A-Fa-f])'),
                              ("0xAA",r'(?<![0-9A-Fa-f])0xAA(?![0-9A-Fa-f])'),
                              ("85",r'(?:\[[^\]]+\]\s*=|Add\(|ldc\.i4(?:\.s)?\s+)\s*85(?:\D|$)'),
                              ("170",r'(?:\[[^\]]+\]\s*=|Add\(|ldc\.i4(?:\.s)?\s+)\s*170(?:\D|$)'),
                          ]
                          for label,rxv in patterns:
                              if re.search(rxv,before,re.I):
                                  vals.append(label)
                          if vals:
                              setfeature_candidates.append({
                                  **item,"values":vals
                              })

          # Strict USB PID evidence: field/variable named PID/ProductID is mandatory.
          pid2244=[]
          pid1719=[]
          for p,txt in texts.items():
              lines=txt.splitlines()
              for i,line in enumerate(lines):
                  if not re.search(r'\b(?:pid|pID|ProductID|ProductId|productId)\b',line,re.I):
                      continue
                  if re.search(r'(?:0x2244|\b8772\b)',line,re.I):
                      pid2244.append({
                          "file":str(p),"line":i+1,
                          "context":"\n".join(f"{j+1:6d}: {lines[j]}" for j in range(max(0,i-20),min(len(lines),i+25)))
                      })
                  if re.search(r'(?:0x1719|\b5913\b)',line,re.I):
                      pid1719.append({
                          "file":str(p),"line":i+1,
                          "context":"\n".join(f"{j+1:6d}: {lines[j]}" for j in range(max(0,i-20),min(len(lines),i+25)))
                      })

          # Flash writer evidence requires an update/flash context AND real send/write call.
          writer=[]
          for p,txt in texts.items():
              lines=txt.splitlines()
              for i,line in enumerate(lines):
                  if not re.search(
                      r'FlashId|Flash usb connected|Otp usb connected|actual_boot_lenth|'
                      r'exist flash boot|firmware|upgrade|erase|codedata|constdat|cnfgdat',
                      line,re.I
                  ):
                      continue
                  block="\n".join(lines[max(0,i-45):min(len(lines),i+75)])
                  if re.search(
                      r'HidD_SetFeature|HidD_SetOutputReport|WriteFile|'
                      r'\.Write\s*\(|\bSend\s*\(|controlTransfer',
                      block,re.I
                  ):
                      writer.append({
                          "file":str(p),"line":i+1,
                          "context":"\n".join(f"{j+1:6d}: {lines[j]}" for j in range(max(0,i-45),min(len(lines),i+75)))
                      })

          reconstructed=(Path(r"C:\v5\client\reconstructed.exe").exists())
          status={
              "reconstructed_assembly_found": reconstructed,
              "wrapper_names": {k:sorted(v) for k,v in wrappers.items()},
              "real_hid_api_calls": len(real_calls),
              "strong_setfeature_payload_candidates": len(setfeature_candidates),
              "strict_runtime_pid_1719_refs": len(pid1719),
              "strict_recovery_pid_2244_refs": len(pid2244),
              "writer_contexts_with_real_io": len(writer),
              "boot_entry_proven": bool(setfeature_candidates),
              "recovery_pid_2244_proven": bool(pid2244),
              "flash_write_protocol_proven": False,
              "FLASH_ALLOWED": "NO"
          }

          (E/"V5_STATUS.json").write_text(json.dumps(status,indent=2)+"\n")

          def dump(name, items, title):
              parts=[]
              for x in items:
                  parts.append(
                      f"### {x['file']}:{x['line']} {title}\n{x['context']}"
                  )
              (E/name).write_text("\n\n".join(parts)+"\n")

          dump("REAL_HID_CALLS.txt",real_calls,"real HID wrapper call")
          dump("STRONG_SETFEATURE_CANDIDATES.txt",setfeature_candidates,"SetFeature payload candidate")
          dump("STRICT_PID_2244.txt",pid2244,"PID 2244")
          dump("STRICT_PID_1719.txt",pid1719,"PID 1719")
          dump("WRITER_WITH_IO_CONTEXTS.txt",writer[:200],"flash/update context with I/O")

          report_files=list(E.glob("*Devirtualized*report*.txt"))+list(E.glob("*report*.txt"))
          krypton_reports=[]
          for p in report_files:
              try:
                  t=p.read_text(errors="replace")
              except Exception:
                  continue
              if "Krypton" in t or "opcode" in t.lower() or "virtual" in t.lower():
                  krypton_reports.append((p.name,t[:120000]))
          (E/"KRYPTON_REPORT_EXCERPTS.txt").write_text(
              "\n\n".join(f"===== {n} =====\n{t}" for n,t in krypton_reports)+"\n"
          )

          md=[
              "# BP1048P4 Reactor VM Devirtualization V5",
              "",
              "## Core result",
              f"- reconstructed assembly found: **{status['reconstructed_assembly_found']}**",
              f"- real HID API calls recovered: **{status['real_hid_api_calls']}**",
              f"- strong SetFeature 0x55/0xAA candidates: **{status['strong_setfeature_payload_candidates']}**",
              f"- strict runtime PID 1719 refs: **{status['strict_runtime_pid_1719_refs']}**",
              f"- strict recovery PID 2244 refs: **{status['strict_recovery_pid_2244_refs']}**",
              f"- flash/update contexts with real I/O: **{status['writer_contexts_with_real_io']}**",
              "",
              "## Interpretation",
              "- V4 established that ordinary Reactor deobfuscation was insufficient.",
              "- V5 uses a VM devirtualizer plus NecroBit body restoration and hidden-call recovery.",
              "- 0x55/0xAA only count when tied to a recovered SetFeature call.",
              "- PID 2244 only counts when tied to a PID/ProductID variable or field.",
              "",
              "## Gate",
              "- live board contact: **NO**",
              "- firmware write authorization: **NO**",
              "- `FLASH_ALLOWED=NO`",
          ]
          (E/"V5_REPORT.md").write_text("\n".join(md)+"\n")
          '@ | Set-Content C:\v5\extract.py

          python C:\v5\extract.py

      - name: Publish decisive diagnostics to summary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          @"

          # V5 decisive diagnostics
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY

          "## Krypton exit" | Add-Content $env:GITHUB_STEP_SUMMARY
          if (Test-Path C:\v5\evidence\KRYPTON_EXIT.txt) {
            '```text' | Add-Content $env:GITHUB_STEP_SUMMARY
            Get-Content C:\v5\evidence\KRYPTON_EXIT.txt | Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          }

          "## Krypton run log - last 250 lines" | Add-Content $env:GITHUB_STEP_SUMMARY
          if (Test-Path C:\v5\evidence\KRYPTON_RUN.log) {
            '```text' | Add-Content $env:GITHUB_STEP_SUMMARY
            Get-Content C:\v5\evidence\KRYPTON_RUN.log -Tail 250 |
              ForEach-Object { $_ -replace '```','` ` `' } |
              Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          } else {
            "_KRYPTON_RUN.log missing_" | Add-Content $env:GITHUB_STEP_SUMMARY
          }

          "## Exact recovered HID call context" | Add-Content $env:GITHUB_STEP_SUMMARY
          if (Test-Path C:\v5\evidence\REAL_HID_CALLS.txt) {
            '```text' | Add-Content $env:GITHUB_STEP_SUMMARY
            Get-Content C:\v5\evidence\REAL_HID_CALLS.txt -TotalCount 350 |
              ForEach-Object { $_ -replace '```','` ` `' } |
              Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          } else {
            "_REAL_HID_CALLS.txt missing_" | Add-Content $env:GITHUB_STEP_SUMMARY
          }

          "## Krypton report excerpts" | Add-Content $env:GITHUB_STEP_SUMMARY
          if (Test-Path C:\v5\evidence\KRYPTON_REPORT_EXCERPTS.txt) {
            '```text' | Add-Content $env:GITHUB_STEP_SUMMARY
            Get-Content C:\v5\evidence\KRYPTON_REPORT_EXCERPTS.txt -TotalCount 350 |
              ForEach-Object { $_ -replace '```','` ` `' } |
              Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          } else {
            "_KRYPTON_REPORT_EXCERPTS.txt missing_" | Add-Content $env:GITHUB_STEP_SUMMARY
          }

          "## Reconstructed status" | Add-Content $env:GITHUB_STEP_SUMMARY
          if (Test-Path C:\v5\evidence\RECONSTRUCTED_STATUS.txt) {
            '```text' | Add-Content $env:GITHUB_STEP_SUMMARY
            Get-Content C:\v5\evidence\RECONSTRUCTED_STATUS.txt | Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          }

      - name: Package evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path C:\v5\client\reconstructed.exe) {
            Copy-Item C:\v5\client\reconstructed.exe C:\v5\evidence\reconstructed.exe
          }

          Compress-Archive -Force -CompressionLevel Optimal `
            -Path C:\v5\evidence\* `
            -DestinationPath C:\v5\OKN_BP1048P4_REACTOR_VM_DEVIRTUALIZE_V5_EVIDENCE.zip

          (Get-FileHash C:\v5\OKN_BP1048P4_REACTOR_VM_DEVIRTUALIZE_V5_EVIDENCE.zip -Algorithm SHA256).Hash |
            Set-Content C:\v5\OKN_BP1048P4_REACTOR_VM_DEVIRTUALIZE_V5_EVIDENCE.zip.sha256

      - name: Publish summary
        shell: pwsh
        run: |
          Get-Content C:\v5\evidence\V5_REPORT.md |
            Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: OKN-BP1048P4-REACTOR-VM-DEVIRTUALIZE-V5-EVIDENCE
          path: |
            C:\v5\OKN_BP1048P4_REACTOR_VM_DEVIRTUALIZE_V5_EVIDENCE.zip
            C:\v5\OKN_BP1048P4_REACTOR_VM_DEVIRTUALIZE_V5_EVIDENCE.zip.sha256
            C:\v5\evidence\V5_REPORT.md
            C:\v5\evidence\V5_STATUS.json
            C:\v5\evidence\STRONG_SETFEATURE_CANDIDATES.txt
            C:\v5\evidence\STRICT_PID_2244.txt
            C:\v5\evidence\REAL_HID_CALLS.txt
            C:\v5\evidence\WRITER_WITH_IO_CONTEXTS.txt
            C:\v5\evidence\KRYPTON_REPORT_EXCERPTS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:FLASH_ALLOWED -ne "NO") { throw "FLASH_ALLOWED changed" }
          $d = Get-Content C:\v5\evidence\V5_STATUS.json | ConvertFrom-Json
          if ($d.FLASH_ALLOWED -ne "NO") { throw "V5 status gate failed" }
          if ($d.flash_write_protocol_proven -ne $false) { throw "Unexpected writer authorization" }
          "V5_DEVIRTUALIZATION_COMPLETE=YES"
          "FLASH_ALLOWED=NO"
