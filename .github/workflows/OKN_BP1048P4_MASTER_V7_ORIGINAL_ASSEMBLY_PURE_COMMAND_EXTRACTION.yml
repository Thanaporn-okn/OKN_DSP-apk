name: OKN BP1048P4 MASTER V7 ORIGINAL-ASSEMBLY PURE COMMAND EXTRACTION

"on":
  workflow_dispatch:

permissions:
  contents: read

env:
  GOLOPINE_WINDOWS_URL: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-08.exe_.zip"
  LIVE_DSP_CONNECTED: "NO"
  USB_TARGET_ACCESS: "NO"
  HOST_TO_DSP_IO: "NO"
  HID_INTERFACE_INVOKED: "NO"
  HID_CONNECT_ALLOWED: "NO"
  HID_SEND_ALLOWED: "NO"
  HID_WRITE_ALLOWED: "NO"
  FLASH_ALLOWED: "NO"
  ERASE_ALLOWED: "NO"
  WRITE_ALLOWED: "NO"

jobs:
  master-v7:
    name: MASTER V7 original assembly pure command extraction
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Safety gate and workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($n in @(
            "LIVE_DSP_CONNECTED","USB_TARGET_ACCESS","HOST_TO_DSP_IO",
            "HID_INTERFACE_INVOKED","HID_CONNECT_ALLOWED","HID_SEND_ALLOWED",
            "HID_WRITE_ALLOWED","FLASH_ALLOWED","ERASE_ALLOWED","WRITE_ALLOWED"
          )) {
            if ((Get-Item "Env:$n").Value -ne "NO") { throw "$n must be NO" }
          }

          $root="C:\okn_v7"
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          New-Item -ItemType Directory -Force -Path `
            "$root\download","$root\pkg","$root\evidence","$root\out","$root\harness" | Out-Null

          @"
          MODE=ORIGINAL_VENDOR_ASSEMBLY_PURE_COMMAND_EXTRACTION
          ORIGINAL_BINARY_MODIFIED=NO
          LIVE_DSP_CONNECTED=NO
          USB_TARGET_ACCESS=NO
          HOST_TO_DSP_IO=NO
          HID_INTERFACE_INVOKED=NO
          HID_CONNECT_ALLOWED=NO
          HID_SEND_ALLOWED=NO
          HID_WRITE_ALLOWED=NO
          FLASH_ALLOWED=NO
          "@ | Set-Content "$root\evidence\00_SAFETY.txt"

      - name: Download and select untouched official vendor EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root="C:\okn_v7"

          curl.exe -fL --retry 6 --retry-all-errors --retry-delay 2 `
            --connect-timeout 20 --max-time 300 `
            $env:GOLOPINE_WINDOWS_URL -o "$root\download\vendor.zip"
          if ($LASTEXITCODE -ne 0) { throw "vendor download failed" }

          Expand-Archive -Force "$root\download\vendor.zip" "$root\pkg"

          $exe=Get-ChildItem "$root\pkg" -Recurse -File -Filter *.exe |
            Where-Object {
              $_.FullName -notmatch '\\__MACOSX\\' -and
              $_.Name -notlike '._*'
            } |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (-not $exe) { throw "vendor EXE not found" }
          if ($exe.Length -lt 100000) { throw "vendor EXE too small" }

          Copy-Item $exe.FullName "$root\vendor.exe" -Force

          $bytes=[IO.File]::ReadAllBytes("$root\vendor.exe")
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "not MZ" }

          @"
          SELECTED=$($exe.FullName)
          BYTES=$($exe.Length)
          SHA256=$((Get-FileHash "$root\vendor.exe" -Algorithm SHA256).Hash)
          ORIGINAL_BINARY_MODIFIED=NO
          "@ | Set-Content "$root\evidence\01_VENDOR_IDENTITY.txt"

      - name: Build x86 .NET Framework pure-command harness
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root="C:\okn_v7"

          @'
          using System;
          using System.IO;
          using System.Linq;
          using System.Reflection;
          using System.Runtime.CompilerServices;
          using System.Collections.Generic;

          class Program
          {
              static List<string> log = new List<string>();

              static string Hex(object o)
              {
                  if (o == null) return "<NULL>";
                  var b = o as byte[];
                  if (b != null) return BitConverter.ToString(b).Replace("-", "");
                  return Convert.ToString(o, System.Globalization.CultureInfo.InvariantCulture);
              }

              static MethodInfo FindMethod(Type t, string name, params Type[] args)
              {
                  return t.GetMethod(
                      name,
                      BindingFlags.Public | BindingFlags.NonPublic | BindingFlags.Static | BindingFlags.Instance,
                      null, args, null
                  );
              }

              static void Main(string[] args)
              {
                  string exe = Path.GetFullPath(args[0]);
                  string output = Path.GetFullPath(args[1]);
                  Directory.SetCurrentDirectory(Path.GetDirectoryName(exe));

                  log.Add("MODE=ORIGINAL_ASSEMBLY_PURE_METHODS_ONLY");
                  log.Add("ENTRYPOINT_INVOKED=NO");
                  log.Add("HID_INTERFACE_TYPE_INSTANTIATED=NO");
                  log.Add("HID_CONNECT_INVOKED=NO");
                  log.Add("HID_SEND_INVOKED=NO");
                  log.Add("HID_WRITE_INVOKED=NO");

                  try
                  {
                      AppDomain.CurrentDomain.AssemblyResolve += (s,e) => {
                          string simple = new AssemblyName(e.Name).Name + ".dll";
                          string path = Path.Combine(Path.GetDirectoryName(exe), simple);
                          if (File.Exists(path)) return Assembly.LoadFrom(path);
                          return null;
                      };

                      Assembly asm = Assembly.LoadFile(exe);
                      log.Add("ASSEMBLY=" + asm.FullName);
                      log.Add("ENTRYPOINT=" + (asm.EntryPoint == null ? "<NULL>" : asm.EntryPoint.ToString()));

                      // Explicitly initialize the original protected module in the same AppDomain.
                      try
                      {
                          RuntimeHelpers.RunModuleConstructor(asm.ManifestModule.ModuleHandle);
                          log.Add("MODULE_INITIALIZER=SUCCESS");
                      }
                      catch (Exception ex)
                      {
                          log.Add("MODULE_INITIALIZER=EXCEPTION:" + ex.GetBaseException().Message);
                      }

                      Type hc = asm.GetType("DSTech_AudioDSP_Client.HardwareCommandConverter", false);
                      if (hc == null)
                      {
                          log.Add("HardwareCommandConverter=NOT_FOUND");
                      }
                      else
                      {
                          log.Add("HardwareCommandConverter=FOUND");

                          MethodInfo conv = FindMethod(hc, "ConvertSigmaDSPCoefficient", typeof(double));
                          if (conv != null)
                          {
                              foreach (double v in new double[]{0,1,-1,0.5,2,-2,0.125,-0.125})
                              {
                                  try {
                                      object r=conv.Invoke(null,new object[]{v});
                                      log.Add("ConvertSigmaDSPCoefficient(" + v.ToString("R") + ")=" + Hex(r));
                                  } catch(Exception ex) {
                                      log.Add("ConvertSigmaDSPCoefficient(" + v.ToString("R") + ")=EXCEPTION:" + ex.GetBaseException().Message);
                                  }
                              }
                          }

                          MethodInfo spit = FindMethod(hc, "SpitToByte", typeof(int));
                          if (spit != null)
                          {
                              foreach (int v in new int[]{0,1,-1,0x1234,0x123456,0x7fffff,-8388608})
                              {
                                  try {
                                      object r=spit.Invoke(null,new object[]{v});
                                      log.Add("SpitToByte(" + v + ")=" + Hex(r));
                                  } catch(Exception ex) {
                                      log.Add("SpitToByte(" + v + ")=EXCEPTION:" + ex.GetBaseException().Message);
                                  }
                              }
                          }

                          MethodInfo one = FindMethod(
                              hc,
                              "CreateSigmaDSPsingleVariableUpdateCommand",
                              typeof(short), typeof(double)
                          );
                          if (one != null)
                          {
                              foreach (short addr in new short[]{0,1,2,16,256,0x1234})
                              foreach (double dat in new double[]{0,1,-1,0.5,0.25,-0.5})
                              {
                                  try {
                                      object r=one.Invoke(null,new object[]{addr,dat});
                                      log.Add(
                                          "CreateSigmaDSPsingleVariableUpdateCommand(" +
                                          addr + "," + dat.ToString("R") + ")=" + Hex(r)
                                      );
                                  } catch(Exception ex) {
                                      log.Add(
                                          "CreateSigmaDSPsingleVariableUpdateCommand(" +
                                          addr + "," + dat.ToString("R") + ")=EXCEPTION:" +
                                          ex.GetBaseException().Message
                                      );
                                  }
                              }
                          }
                      }

                      Type ct = asm.GetType("DSTech_AudioDSP_Client.DSTechAcutatorCommand", false);
                      if (ct == null)
                      {
                          log.Add("DSTechAcutatorCommand=NOT_FOUND");
                      }
                      else
                      {
                          log.Add("DSTechAcutatorCommand=FOUND");

                          FieldInfo addrField = ct.GetFields(BindingFlags.NonPublic|BindingFlags.Instance)
                              .FirstOrDefault(f => f.FieldType == typeof(int));
                          FieldInfo dataField = ct.GetFields(BindingFlags.NonPublic|BindingFlags.Instance)
                              .FirstOrDefault(f => f.FieldType == typeof(byte[]));
                          MethodInfo get = FindMethod(ct, "GetOutputData");

                          if (get != null)
                          {
                              foreach (int addr in new int[]{0,1,2,16,256,0x1234})
                              {
                                  byte[][] vectors = new byte[][] {
                                      new byte[0],
                                      new byte[]{0},
                                      new byte[]{1},
                                      new byte[]{1,2,3,4},
                                      new byte[]{0xA5,0x5A,0,0,0x16},
                                      new byte[]{0x00,0x00,0x00,0x00},
                                      new byte[]{0xFF,0xFF,0xFF,0xFF}
                                  };

                                  foreach (byte[] data in vectors)
                                  {
                                      try
                                      {
                                          object obj = Activator.CreateInstance(ct);

                                          // Prefer direct backing-field assignment so protected property setters
                                          // are not required for this experiment.
                                          if (addrField != null) addrField.SetValue(obj, addr);
                                          else {
                                              PropertyInfo ap=ct.GetProperty("Address");
                                              if (ap != null) ap.SetValue(obj,addr,null);
                                          }

                                          if (dataField != null) dataField.SetValue(obj,data);
                                          else {
                                              PropertyInfo dp=ct.GetProperty("Data");
                                              if (dp != null) dp.SetValue(obj,data,null);
                                          }

                                          object r=get.Invoke(obj,null);
                                          log.Add(
                                              "DSTechAcutatorCommand addr=" + addr +
                                              " data=" + Hex(data) +
                                              " output=" + Hex(r)
                                          );
                                      }
                                      catch(Exception ex)
                                      {
                                          log.Add(
                                              "DSTechAcutatorCommand addr=" + addr +
                                              " data=" + Hex(data) +
                                              "=EXCEPTION:" + ex.GetBaseException().Message
                                          );
                                      }
                                  }
                              }
                          }
                      }
                  }
                  catch(Exception ex)
                  {
                      log.Add("TOP_EXCEPTION=" + ex.GetBaseException().ToString());
                  }

                  File.WriteAllLines(output,log.ToArray());
              }
          }
          '@ | Set-Content "$root\harness\Program.cs"

          $csc="$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { throw "x86 .NET Framework csc not found" }

          & $csc /nologo /platform:x86 /target:exe `
            /out:"$root\harness\PureProbe.exe" "$root\harness\Program.cs"
          if ($LASTEXITCODE -ne 0) { throw "harness compile failed" }

          @"
          HARNESS_SHA256=$((Get-FileHash "$root\harness\PureProbe.exe" -Algorithm SHA256).Hash)
          PLATFORM=x86
          ENTRYPOINT_CALL_PRESENT=NO
          HID_INTERFACE_TYPE_INSTANTIATION_PRESENT=NO
          "@ | Set-Content "$root\evidence\02_HARNESS_BUILD.txt"

      - name: Static audit harness before execution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root="C:\okn_v7"
          $src=Get-Content "$root\harness\Program.cs" -Raw

          if ($src -match '\.EntryPoint\.Invoke|EntryPoint\.Invoke') { throw "entrypoint invocation forbidden" }
          if ($src -match 'GetType\("DSTech_AudioDSP_Client\.HIDInterface".*Activator') { throw "HIDInterface instantiation forbidden" }
          if ($src -match '\.Connect\(') { throw "Connect call forbidden" }
          if ($src -match '\.Send\(') { throw "Send call forbidden" }
          if ($src -match '\.HidRead\(') { throw "HidRead call forbidden" }
          if ($src -match 'HidD_SetOutputReport|HidD_SetFeature|WriteFile\(') { throw "native HID write call forbidden" }

          "HARNESS_STATIC_AUDIT=PASS" |
            Set-Content "$root\evidence\03_HARNESS_STATIC_AUDIT.txt"

      - name: Execute original assembly pure-command probe in x86 host
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root="C:\okn_v7"

          $p=Start-Process `
            -FilePath "$root\harness\PureProbe.exe" `
            -ArgumentList @("$root\vendor.exe","$root\evidence\04_PURE_COMMAND_OUTPUTS.txt") `
            -WorkingDirectory $root `
            -PassThru -Wait -NoNewWindow

          "HARNESS_EXIT_CODE=$($p.ExitCode)" |
            Set-Content "$root\evidence\04A_HARNESS_EXIT.txt"

          if (-not (Test-Path "$root\evidence\04_PURE_COMMAND_OUTPUTS.txt")) {
            throw "pure command output file missing"
          }

          Get-Content "$root\evidence\04_PURE_COMMAND_OUTPUTS.txt"

      - name: Analyze pure command outputs and derive candidate framing
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root="C:\okn_v7"

          @'
          from pathlib import Path
          import re,json
          from collections import defaultdict

          p=Path(r"C:\okn_v7\evidence\04_PURE_COMMAND_OUTPUTS.txt")
          lines=p.read_text(errors="ignore").splitlines()

          def is_hex(s):
              return bool(s) and len(s)%2==0 and re.fullmatch(r"[0-9A-Fa-f]+",s) is not None

          one=[]
          actuator=[]
          failures=[]
          sigma=[]
          spit=[]

          for l in lines:
              if "EXCEPTION:" in l or "TOP_EXCEPTION=" in l:
                  failures.append(l)
              m=re.match(r"ConvertSigmaDSPCoefficient\((.*?)\)=(.+)",l)
              if m:
                  sigma.append({"input":m.group(1),"output":m.group(2)})
              m=re.match(r"SpitToByte\((.*?)\)=(.+)",l)
              if m:
                  spit.append({"input":m.group(1),"output":m.group(2)})
              m=re.match(r"CreateSigmaDSPsingleVariableUpdateCommand\((.*?),(.*?)\)=(.+)",l)
              if m:
                  out=m.group(3)
                  one.append({
                    "addr":m.group(1),"data":m.group(2),"output":out,
                    "is_hex":is_hex(out),
                    "bytes":len(out)//2 if is_hex(out) else None
                  })
              m=re.match(r"DSTechAcutatorCommand addr=(\d+) data=([0-9A-F]*) output=(.+)",l)
              if m:
                  out=m.group(3)
                  actuator.append({
                    "addr":int(m.group(1)),
                    "data":m.group(2),
                    "output":out,
                    "is_hex":is_hex(out),
                    "bytes":len(out)//2 if is_hex(out) else None
                  })

          good_one=[x for x in one if x["is_hex"]]
          good_act=[x for x in actuator if x["is_hex"]]

          # Look for stable prefix/suffix and whether address/data appear in output.
          analysis={
              "module_initializer_success":any(x=="MODULE_INITIALIZER=SUCCESS" for x in lines),
              "tampered_exception_seen":any("tampered" in x.lower() for x in failures),
              "exception_count":len(failures),
              "sigma_outputs":sigma,
              "spit_outputs":spit,
              "single_variable_outputs":good_one,
              "actuator_outputs":good_act,
              "single_variable_hex_count":len(good_one),
              "actuator_hex_count":len(good_act),
              "candidate_exact_frame_proven":False,
              "host_to_dsp_io":False,
              "hid_invoked":False,
              "flash_allowed":False
          }

          if good_act:
              lens=sorted(set(x["bytes"] for x in good_act))
              analysis["actuator_output_lengths"]=lens
              prefixes=[x["output"][:8] for x in good_act if len(x["output"])>=8]
              suffixes=[x["output"][-8:] for x in good_act if len(x["output"])>=8]
              analysis["actuator_common_prefix_4B"]=prefixes[0] if prefixes and len(set(prefixes))==1 else None
              analysis["actuator_common_suffix_4B"]=suffixes[0] if suffixes and len(set(suffixes))==1 else None

          # Do not auto-promote to "proven exact HID frame"; command-object output still
          # needs linkage to the HID Send path.
          Path(r"C:\okn_v7\evidence\05_COMMAND_OUTPUT_ANALYSIS.json").write_text(
              json.dumps(analysis,indent=2)+"\n"
          )
          print(json.dumps(analysis,indent=2))
          '@ | Set-Content "$root\analyze.py"

          python "$root\analyze.py"

      - name: Build V7 final decision
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root="C:\okn_v7"

          @'
          from pathlib import Path
          import json

          ev=Path(r"C:\okn_v7\evidence")
          a=json.loads((ev/"05_COMMAND_OUTPUT_ANALYSIS.json").read_text())

          decision={
              "revision":"MASTER-V7",
              "mode":"ORIGINAL_ASSEMBLY_PURE_COMMAND_EXTRACTION",
              "module_initializer_success":a["module_initializer_success"],
              "tampered_exception_seen":a["tampered_exception_seen"],
              "single_variable_hex_count":a["single_variable_hex_count"],
              "actuator_hex_count":a["actuator_hex_count"],
              "actuator_output_lengths":a.get("actuator_output_lengths",[]),
              "exact_hid_transport_frame_proven":False,
              "live_dsp_connected":False,
              "usb_target_access":False,
              "host_to_dsp_io":False,
              "hid_interface_invoked":False,
              "hid_send_invoked":False,
              "flash_allowed":False
          }

          if a["actuator_hex_count"]>0:
              decision["status"]="PURE_VENDOR_COMMAND_BYTES_RECOVERED_LINK_TO_HID_SEND_PATH_STILL_REQUIRED"
          elif a["single_variable_hex_count"]>0:
              decision["status"]="PURE_SIGMADSP_COMMAND_BYTES_RECOVERED_ACTUATOR_FRAME_STILL_REQUIRED"
          elif a["tampered_exception_seen"]:
              decision["status"]="ORIGINAL_ASSEMBLY_STILL_REJECTS_EXTERNAL_HOST"
          else:
              decision["status"]="PURE_COMMAND_PROBE_INCONCLUSIVE"

          (ev/"06_V7_FINAL_DECISION.json").write_text(json.dumps(decision,indent=2)+"\n")

          md=f"""# MASTER V7 FINAL DECISION

          - Module initializer success: **{decision['module_initializer_success']}**
          - Tamper exception seen: **{decision['tampered_exception_seen']}**
          - Sigma single-variable byte outputs: **{decision['single_variable_hex_count']}**
          - DSTech actuator byte outputs: **{decision['actuator_hex_count']}**
          - Exact HID transport frame proven: **NO**
          - HIDInterface instantiated/invoked: **NO**
          - HID Send invoked: **NO**
          - DSP connected: **NO**
          - Host-to-DSP I/O: **NO**
          - Flash allowed: **NO**

          Status: **{decision['status']}**

          Classification: **OFFLINE_VENDOR_COMMAND_EXTRACTION_NOT_FOR_FLASH**
          """
          (ev/"07_V7_FINAL_DECISION.md").write_text(md)
          print(md)
          '@ | Set-Content "$root\decision.py"

          python "$root\decision.py"
          Get-Content "$root\evidence\07_V7_FINAL_DECISION.md" >> $env:GITHUB_STEP_SUMMARY

      - name: Package focused evidence only
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root="C:\okn_v7"
          Copy-Item "$root\evidence\*" "$root\out\" -Force

          if (Test-Path "$root\out\vendor.exe") { throw "vendor EXE leak" }
          if (Test-Path "$root\out\PureProbe.exe") { throw "harness binary leak" }

          Get-ChildItem "$root\out" -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content "$root\out\SHA256SUMS.txt"

      - name: Upload V7 evidence
        uses: actions/upload-artifact@v7
        with:
          name: OKN-BP1048P4-MASTER-V7-ORIGINAL-ASSEMBLY-PURE-COMMAND-EVIDENCE
          path: C:\okn_v7\out\*
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed assertion
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root="C:\okn_v7"

          foreach ($n in @(
            "LIVE_DSP_CONNECTED","USB_TARGET_ACCESS","HOST_TO_DSP_IO",
            "HID_INTERFACE_INVOKED","HID_CONNECT_ALLOWED","HID_SEND_ALLOWED",
            "HID_WRITE_ALLOWED","FLASH_ALLOWED","ERASE_ALLOWED","WRITE_ALLOWED"
          )) {
            if ((Get-Item "Env:$n").Value -ne "NO") { throw "$n changed" }
          }

          $d=Get-Content "$root\evidence\06_V7_FINAL_DECISION.json" -Raw | ConvertFrom-Json
          if ($d.live_dsp_connected -ne $false) { throw "bad DSP state" }
          if ($d.host_to_dsp_io -ne $false) { throw "bad host-to-DSP state" }
          if ($d.hid_interface_invoked -ne $false) { throw "bad HID state" }
          if ($d.hid_send_invoked -ne $false) { throw "bad HID send state" }
          if ($d.flash_allowed -ne $false) { throw "bad flash state" }

          "MASTER_V7=PASS"
          "HOST_TO_DSP_IO=NO"
          "HID_SEND=NO"
          "FLASH_ALLOWED=NO"
