      - name: Verify frozen real-board BLE and DSP core
        shell: bash
        run: |
          set -euo pipefail
          echo "8b1e30b525d5a2aad85a836ad43a20ed9416d121afb9bafef7e02b224380b45f  app/src/main/java/com/okn/dsp/DspProtocol.java" | sha256sum -c -
          echo "15cfc4bd64723e7508694d19ab271f173b91fc78acd5118ddcbbfae90e50bff9  app/src/main/java/com/okn/dsp/BleManager.java" | sha256sum -c -

      - name: Validate real 7CH Parametric EQ safety gates
        shell: bash
        run: |
          set -euo pipefail
          python3 Sources/validate_v38_gate.py
          python3 Sources/validate_v39_reset.py
          python3 Sources/validate_v50_real_ui.py

      - name: Build APKs
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle :app:assembleDebug :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk OKN-Peramp-REAL-7CH-PEQ-debug.apk
          cp app/build/outputs/apk/release/app-release.apk OKN-Peramp-REAL-7CH-PEQ-release.apk

      - name: Package generated source
        shell: bash
        run: |
          set -euo pipefail
          zip -r OKN-Peramp-REAL-7CH-PEQ-source.zip app Sources build.gradle settings.gradle gradle.properties -x "*/build/*"

      - name: Upload APK and source
        uses: actions/upload-artifact@v6
        with:
          name: OKN-Peramp-REAL-7CH-Parametric-EQ
          path: |
            OKN-Peramp-REAL-7CH-PEQ-debug.apk
            OKN-Peramp-REAL-7CH-PEQ-release.apk
            OKN-Peramp-REAL-7CH-PEQ-source.zip
          if-no-files-found: error
          retention-days: 30
