name: R143 exact official Windows h15 crypto key IV patchstream static reverse

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R143_EXACT_OFFICIAL_WINDOWS_H15_CRYPTO_KEYIV_PATCHSTREAM_STATIC_REVERSE.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r143-official-windows-h15-crypto-keyiv-${{ github.ref }}
  cancel-in-progress: true

env:
  FLASH_ALLOWED: "NO"
  R142_RUN_ID: "35955850453"
  R142_JOB_ID: "107493907364"
  R142_ARTIFACT_ID: "10789728932"
  R142_ARTIFACT_NAME: "R142-EXACT-OFFICIAL-WINDOWS-PROXY-MAP-PATCH-RESOURCE-STATIC-EVIDENCE"
  R142_ARTIFACT_DIGEST: "sha256:cae0eeea49fc51d7c06b78e6710191b06658fb96c6469ec1488efa89743e31ee"
  WINDOWS_EXE_SHA256: "3ca54171c53f7badd963ffe6851b8b3e2faf8aee8ba2afcb7040990e22ae09b2"
  H15_RESOURCE_NAME: "h15IL2i6yy2BZV8RqM.YuRwd1JALC4oy32W66"
  PROD_VID_DEC: "6324"
  PROD_PID_DEC: "1719"
  PROD_VID_HEX: "18B4"
  PROD_PID_HEX: "06B7"

jobs:
  static_reverse:
    name: STATIC ONLY - h15 crypto key IV patchstream - no execution - no USB - no board
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Immutable safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r143/r142 /tmp/r143/evidence
          cat > /tmp/r143/evidence/R143_SAFETY.txt <<'EOF'
          R143_MODE=OFFLINE_STATIC_H15_CRYPTO_KEYIV_PATCHSTREAM_REVERSE_ONLY
          R143_VENDOR_BINARY_EXECUTED=NO
          R143_WINDOWS_EXE_EXECUTED=NO
          R143_USB_DEVICE_ACCESS=NO
          R143_BOARD_CONTACT=NO
          R143_AA55_SENT=NO
          R143_RUNTIME_0X11_SENT=NO
          R143_RUNTIME_0XFE_SENT=NO
          R143_FLASHBOOT_COMMAND_SENT=NO
          R143_FLASH_READ_EXECUTED=NO
          R143_FLASH_ERASE_EXECUTED=NO
          R143_FLASH_WRITE_EXECUTED=NO
          R143_ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD=NO
          HARDWARE_MODIFICATION=FORBIDDEN
          REFERENCE_OR_TOOL_EVIDENCE_IS_NOT_PRODUCTION_SAFETY_PROOF=YES
          FLASH_ALLOWED=NO
          EOF

      - name: Download pinned R142 evidence
        uses: actions/download-artifact@v4
        with:
          name: R142-EXACT-OFFICIAL-WINDOWS-PROXY-MAP-PATCH-RESOURCE-STATIC-EVIDENCE
          path: /tmp/r143/r142
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thanaporn-okn/OKN_DSP-apk
          run-id: 35955850453

      - name: Install static analysis dependencies only
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq unzip python3-pip >/dev/null
          python3 -m pip install --disable-pip-version-check --no-input pycryptodome >/dev/null

      - name: Verify and extract pinned R142 evidence
        shell: bash
        run: |
          set -euo pipefail
          R142_OUTER="$(find /tmp/r143/r142 -maxdepth 2 -type f -name 'R142_EXACT_OFFICIAL_WINDOWS_PROXY_MAP_PATCH_RESOURCE_STATIC_EVIDENCE.zip' -print -quit)"
          test -n "$R142_OUTER"
          sha256sum "$R142_OUTER" > /tmp/r143/evidence/R143_R142_INNER_ZIP.sha256
          unzip -q "$R142_OUTER" -d /tmp/r143/evidence/r142
          test -s /tmp/r143/evidence/r142/R142_DECISION.json
          test -s /tmp/r143/evidence/r142/r141/r140/R140_FIXED_FULL.il
          test -s "/tmp/r143/evidence/r142/R142_EXTRACTED_MANAGED_RESOURCES/02_h15IL2i6yy2BZV8RqM.YuRwd1JALC4oy32W66.bin"
          grep -F '"FLASH_ALLOWED": false' /tmp/r143/evidence/r142/R142_DECISION.json

      - name: Resolve N9 crypto wrappers and recover constant byte arrays
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,json,hashlib,struct,math,collections

          ev=Path('/tmp/r143/evidence')
          ilp=ev/'r142/r141/r140/R140_FIXED_FULL.il'
          il=ilp.read_text(errors='replace')
          lines=il.splitlines()

          def method_block(name):
              # Match declaration containing exact method name, then through end-of-method marker.
              starts=[i for i,l in enumerate(lines) if re.search(r'\b'+re.escape(name)+r'\s*\(',l)]
              # Prefer actual declaration, not callsite.
              s=None
              for i in starts:
                  for j in range(max(0,i-4),i+1):
                      if '.method' in lines[j]:
                          s=j; break
                  if s is not None: break
              if s is None:
                  # N9 declaration has method line and name on next line.
                  for i,l in enumerate(lines):
                      if name in l and 'call ' not in l:
                          s=max(0,i-2); break
              if s is None: return None
              e=s+1
              while e<len(lines) and ('// end of method ' not in lines[e] or name not in lines[e]):
                  e+=1
              return {'start_line':s+1,'end_line':min(e+1,len(lines)),
                      'text':'\n'.join(lines[s:min(e+1,len(lines))])}

          target_helpers=[
            'N9jju8llVi','trEuKPNkgB3p5fLuROn','Q2CVcdNXO7dpP5ufbGy',
            'VnHlfpNorSGR6U9GUOp','gH6uphNOsYQyRXDZmHu','qfkv4ZNDynVciIciQy6',
            'KIoEb3NS3a1HTR21GpN','qWLJesKJ6PiuJOY9SUb'
          ]
          helper_blocks={}
          direct_api_re=re.compile(
              r'(RijndaelManaged|AesCryptoServiceProvider|AesManaged|CreateDecryptor|CreateEncryptor|'
              r'CipherMode|CryptoStream|MemoryStream|BinaryReader|BinaryWriter|ReadInt32|ReadBytes|'
              r'GetManifestResourceStream|PrepareMethod|WriteProcessMemory|Marshal::WriteIntPtr|'
              r'ProcessModule::get_BaseAddress|BitConverter|Array::Copy|BlockCopy)',re.I)
          for h in target_helpers:
              b=method_block(h)
              if b:
                  b['api_hits']=sorted(set(m.group(1) for m in direct_api_re.finditer(b['text'])))
                  b['calls']=[x.strip() for x in re.findall(r'^\s*IL_[0-9A-Fa-f]+:\s+call(?:virt)?\s+(.+)$',b['text'],re.M)][:500]
                  helper_blocks[h]=b

          n9=helper_blocks.get('N9jju8llVi')
          if not n9: raise SystemExit('N9 method block not recovered')
          nlines=n9['text'].splitlines()

          # Local types from N9 .locals declaration.
          locals_map={}
          loc_re=re.compile(r'\[(\d+)\]\s+([^,\n]+?)(?:,|\))')
          for m in loc_re.finditer(n9['text']):
              locals_map[int(m.group(1))]=m.group(2).strip()

          # Identify the exact crypto setup call around VnH helper and its argument locals.
          vnh_sites=[]
          for i,l in enumerate(nlines):
              if '::VnHlfpNorSGR6U9GUOp(' in l:
                  excerpt=nlines[max(0,i-14):min(len(nlines),i+10)]
                  vnh_sites.append({'index':i,'excerpt':'\n'.join(excerpt)})
          # Known visible setup uses ldloc.s 47 and ldloc.s 8; derive from callsite too.
          candidate_arg_locals=set()
          for site in vnh_sites:
              for m in re.finditer(r'ldloc(?:\.s)?\s+(\d+)',site['excerpt']):
                  candidate_arg_locals.add(int(m.group(1)))

          # Static constant evaluator for simple integer expressions immediately before stelem.i1.
          def eval_simple(seq):
              stack=[]
              for op,arg in seq:
                  if op=='const': stack.append(arg & 0xffffffff)
                  elif op in ('add','sub','xor','and','or'):
                      if len(stack)<2: return None
                      b=stack.pop(); a=stack.pop()
                      if op=='add': v=a+b
                      elif op=='sub': v=a-b
                      elif op=='xor': v=a^b
                      elif op=='and': v=a&b
                      else: v=a|b
                      stack.append(v & 0xffffffff)
                  elif op in ('shl','shr'):
                      if len(stack)<2: return None
                      b=stack.pop()&31; a=stack.pop()
                      stack.append(((a<<b) if op=='shl' else (a>>b)) & 0xffffffff)
                  elif op=='conv_u1':
                      if not stack: return None
                      stack[-1] &= 0xff
                  else: return None
              return stack[-1]&0xff if len(stack)==1 else None

          # Track arrays allocated to local slots and recover constant index/value assignments.
          arrays={}
          alloc_re=re.compile(r'newarr\s+\[mscorlib\]System\.Byte')
          for i,l in enumerate(nlines):
              if alloc_re.search(l):
                  # length should be recent constant; destination recent stloc.
                  length=None; dest=None
                  for j in range(max(0,i-5),i):
                      m=re.search(r'ldc\.i4(?:\.s)?\s+(-?\d+)',nlines[j])
                      if m: length=int(m.group(1))
                      short=re.search(r'ldc\.i4\.(\d)',nlines[j])
                      if short: length=int(short.group(1))
                  for j in range(i+1,min(len(nlines),i+5)):
                      m=re.search(r'stloc(?:\.s)?\s+(\d+)',nlines[j])
                      if m: dest=int(m.group(1)); break
                  if dest is not None and length is not None and 0<length<=4096:
                      arrays.setdefault(dest,{'length':length,'assignments':{},'allocation_line':n9['start_line']+i})

          # Recover straightforward "ldloc array; const index; expression; stelem.i1" stores.
          for i,l in enumerate(nlines):
              if 'stelem.i1' not in l: continue
              win=nlines[max(0,i-10):i]
              arr=None
              for x in reversed(win):
                  m=re.search(r'ldloc(?:\.s)?\s+(\d+)',x)
                  if m:
                      arr=int(m.group(1)); break
              if arr not in arrays: continue
              # Parse instructions after last ldloc of array.
              pos=max(k for k,x in enumerate(win) if re.search(r'ldloc(?:\.s)?\s+'+str(arr)+r'\b',x))
              ops=[]
              vals=[]
              for x in win[pos+1:]:
                  if re.search(r'ldc\.i4\.(\d)',x):
                      vals.append(('const',int(re.search(r'ldc\.i4\.(\d)',x).group(1))))
                  elif re.search(r'ldc\.i4(?:\.s)?\s+(-?\d+)',x):
                      vals.append(('const',int(re.search(r'ldc\.i4(?:\.s)?\s+(-?\d+)',x).group(1))))
                  elif re.search(r':\s+add$',x): vals.append(('add',None))
                  elif re.search(r':\s+sub$',x): vals.append(('sub',None))
                  elif re.search(r':\s+xor$',x): vals.append(('xor',None))
                  elif re.search(r':\s+and$',x): vals.append(('and',None))
                  elif re.search(r':\s+or$',x): vals.append(('or',None))
                  elif re.search(r':\s+shl$',x): vals.append(('shl',None))
                  elif re.search(r':\s+shr(?:\.un)?$',x): vals.append(('shr',None))
                  elif 'conv.u1' in x: vals.append(('conv_u1',None))
                  elif 'ldloc' in x or 'ldelem' in x:
                      vals.append(('unknown',None))
              # First resolved constant is index; remaining expression yields byte value.
              const_positions=[k for k,v in enumerate(vals) if v[0]=='const']
              if len(const_positions)>=2:
                  idx=vals[const_positions[0]][1]
                  expr=vals[const_positions[0]+1:]
                  if 0<=idx<arrays[arr]['length']:
                      value=eval_simple(expr)
                      if value is not None:
                          arrays[arr]['assignments'][idx]=value

          array_summary=[]
          reconstructed={}
          for loc,a in sorted(arrays.items()):
              complete=len(a['assignments'])==a['length']
              row={'local':loc,'local_type':locals_map.get(loc),'length':a['length'],
                   'constant_assignment_count':len(a['assignments']),
                   'complete':complete,
                   'hex':None}
              if complete:
                  b=bytes(a['assignments'][i] for i in range(a['length']))
                  row['hex']=b.hex()
                  reconstructed[loc]=b
              array_summary.append(row)

          out={
              'n9_method_start_line':n9['start_line'],'n9_method_end_line':n9['end_line'],
              'n9_sha256':hashlib.sha256(n9['text'].encode()).hexdigest(),
              'helper_blocks':helper_blocks,
              'vnh_crypto_setup_sites':vnh_sites,
              'candidate_crypto_argument_locals':sorted(candidate_arg_locals),
              'n9_local_types':{str(k):v for k,v in sorted(locals_map.items())},
              'byte_array_reconstruction':array_summary,
              'complete_array_locals':{str(k):v.hex() for k,v in reconstructed.items()},
              'important_interpretation':'Only statically reconstructible constant arrays are accepted. Dynamic/local-derived bytes are left unresolved; no guessed key/IV is used.'
          }
          (ev/'R143_N9_CRYPTO_DEFUSE_STATIC_ANALYSIS.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          (ev/'R143_N9_METHOD.il').write_text(n9['text'])
          PY

      - name: Offline test h15 decryption only with recovered valid key IV candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,math,collections,re,struct
          from Crypto.Cipher import AES

          ev=Path('/tmp/r143/evidence')
          h15=ev/'r142/R142_EXTRACTED_MANAGED_RESOURCES/02_h15IL2i6yy2BZV8RqM.YuRwd1JALC4oy32W66.bin'
          ct=h15.read_bytes()
          d=json.loads((ev/'R143_N9_CRYPTO_DEFUSE_STATIC_ANALYSIS.json').read_text())
          complete={int(k):bytes.fromhex(v) for k,v in d['complete_array_locals'].items()}

          def entropy(b):
              if not b:return 0
              c=collections.Counter(b);n=len(b)
              return -sum((v/n)*math.log2(v/n) for v in c.values())

          def score(pt):
              s=0
              # Evidence-oriented structure scoring only.
              if pt.startswith((b'MZ',b'PK\x03\x04',b'\x1f\x8b',b'\x78\x9c',b'\x78\xda')): s+=8
              ascii_ratio=sum(32<=x<127 or x in (9,10,13) for x in pt[:4096])/max(1,min(len(pt),4096))
              if ascii_ratio>0.6:s+=4
              # Metadata-token-like 0x06/0x04/0x0a high-byte words.
              words=[int.from_bytes(pt[i:i+4],'little') for i in range(0,min(len(pt),65536)-3,4)]
              toks=sum(1 for w in words if ((w>>24)&0xff) in (0x04,0x06,0x0a,0x2b))
              if toks>20:s+=3
              return s,ascii_ratio,toks

          candidates=[]
          keys=[(loc,b) for loc,b in complete.items() if len(b) in (16,24,32)]
          ivs=[(loc,b) for loc,b in complete.items() if len(b)==16]
          # Prefer locals named at VnH site if available, but test all statically complete valid-length combos.
          for kl,k in keys:
              for il,iv in ivs:
                  if len(ct)%16: continue
                  for mode_name,mode in [('CBC',AES.MODE_CBC),('CFB',AES.MODE_CFB),('OFB',AES.MODE_OFB)]:
                      try:
                          if mode_name=='CBC': pt=AES.new(k,mode,iv).decrypt(ct)
                          elif mode_name=='CFB': pt=AES.new(k,mode,iv,segment_size=128).decrypt(ct)
                          else: pt=AES.new(k,mode,iv).decrypt(ct)
                      except Exception:
                          continue
                      sc,ar,toks=score(pt)
                      candidates.append({
                          'key_local':kl,'iv_local':il,'mode':mode_name,'score':sc,
                          'plaintext_sha256':hashlib.sha256(pt).hexdigest(),
                          'plaintext_entropy':round(entropy(pt),4),
                          'ascii_ratio_first4k':round(ar,4),
                          'tokenlike_word_count_first64k':toks,
                          'first64_hex':pt[:64].hex()
                      })
          candidates.sort(key=lambda x:(x['score'],x['tokenlike_word_count_first64k'],x['ascii_ratio_first4k']),reverse=True)
          out={
              'h15_size':len(ct),
              'h15_sha256':hashlib.sha256(ct).hexdigest(),
              'h15_entropy':round(entropy(ct),4),
              'recovered_valid_key_candidate_count':len(keys),
              'recovered_valid_iv_candidate_count':len(ivs),
              'offline_decrypt_candidate_count':len(candidates),
              'top_candidates':candidates[:50],
              'plaintext_recovered_with_strong_structure':bool(candidates and candidates[0]['score']>=7),
              'important_interpretation':'A candidate is never treated as correct merely because decryption returns bytes. Only strong independent structure indicators qualify for follow-up.'
          }
          (ev/'R143_H15_OFFLINE_DECRYPT_TEST.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          PY

      - name: Build fail-closed R143 decision and report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          ev=Path('/tmp/r143/evidence')
          d=json.loads((ev/'R143_N9_CRYPTO_DEFUSE_STATIC_ANALYSIS.json').read_text())
          h=json.loads((ev/'R143_H15_OFFLINE_DECRYPT_TEST.json').read_text())

          arg=set(d['candidate_crypto_argument_locals'])
          complete={int(k):v for k,v in d['complete_array_locals'].items()}
          arg_complete=sorted(x for x in arg if x in complete)

          decision={
            'R142_RUN_ID':35955850453,
            'R142_JOB_ID':107493907364,
            'R142_ARTIFACT_ID':10789728932,
            'R142_ARTIFACT_DIGEST':'sha256:cae0eeea49fc51d7c06b78e6710191b06658fb96c6469ec1488efa89743e31ee',
            'WINDOWS_EXE_SHA256':'3ca54171c53f7badd963ffe6851b8b3e2faf8aee8ba2afcb7040990e22ae09b2',
            'N9_METHOD_STATICALLY_RECOVERED':True,
            'CRYPTO_SETUP_SITE_COUNT':len(d['vnh_crypto_setup_sites']),
            'CRYPTO_ARGUMENT_LOCAL_CANDIDATES':d['candidate_crypto_argument_locals'],
            'COMPLETE_CONSTANT_BYTE_ARRAY_COUNT':len(d['complete_array_locals']),
            'COMPLETE_CRYPTO_ARGUMENT_ARRAY_LOCALS':arg_complete,
            'H15_SIZE':h['h15_size'],
            'H15_ENTROPY':h['h15_entropy'],
            'VALID_AES_KEY_CANDIDATE_COUNT':h['recovered_valid_key_candidate_count'],
            'VALID_AES_IV_CANDIDATE_COUNT':h['recovered_valid_iv_candidate_count'],
            'OFFLINE_DECRYPT_CANDIDATE_COUNT':h['offline_decrypt_candidate_count'],
            'H15_STRONG_STRUCTURED_PLAINTEXT_RECOVERED':h['plaintext_recovered_with_strong_structure'],
            'IMPORTANT_INTERPRETATION':'R143 only uses byte arrays proven by static constant reconstruction. Dynamic values are not guessed. Successful AES API invocation is not assumed; plaintext must show independent structure before any method-body reconstruction claim.',
            'PROTECTED_HID_METHOD_BODIES_RECOVERED':False,
            'PRODUCTION_VIDPID_RECOVERED_FROM_PROTECTED_METHOD_BODIES':False,
            'OFFICIAL_WINDOWS_PRODUCTION_USBHID_LINKAGE_STATICALLY_PROVEN':False,
            'READ_ONLY_IDENTIFY_PATH_STATICALLY_PROVEN_FOR_PRODUCTION':False,
            'SAFE_READ_ONLY_STOCK_BACKUP_PROVEN':False,
            'PRODUCTION_BOOTSTRAP_BRIDGE_PROVEN':False,
            'PRODUCTION_RECOVERY_USB_IDENTITY_PROVEN':False,
            'ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD':False,
            'AA55_LIVE_RETEST_ALLOWED':False,
            'RUNTIME_0X11_ALLOWED':False,
            'RUNTIME_0XFE_ALLOWED':False,
            'VENDOR_BINARY_EXECUTED':False,
            'USB_DEVICE_ACCESSED':False,
            'BOARD_CONTACTED':False,
            'FLASH_ALLOWED':False,
            'NEXT':(
              'Parse the recovered structured h15 plaintext as the N9 patch record stream; map method tokens/RVAs and reconstruct only HID/USB-related protected bodies offline.'
              if h['plaintext_recovered_with_strong_structure'] else
              'Resolve remaining N9 helper wrappers and dynamic key/IV derivation statically; if still opaque, pivot to Android native transport evidence. No live transfer.'
            )
          }
          (ev/'R143_DECISION.json').write_text(json.dumps(decision,indent=2,ensure_ascii=False)+'\n')
          (ev/'R143_REPORT_TH.md').write_text(
            '# R143 official Windows h15 crypto/key-IV static reverse\n\n'
            f'- crypto setup sites: {decision["CRYPTO_SETUP_SITE_COUNT"]}\n'
            f'- crypto argument locals: {decision["CRYPTO_ARGUMENT_LOCAL_CANDIDATES"]}\n'
            f'- complete constant byte arrays: {decision["COMPLETE_CONSTANT_BYTE_ARRAY_COUNT"]}\n'
            f'- complete crypto-argument arrays: {decision["COMPLETE_CRYPTO_ARGUMENT_ARRAY_LOCALS"]}\n'
            f'- h15 size / entropy: {decision["H15_SIZE"]} / {decision["H15_ENTROPY"]}\n'
            f'- AES key candidates / IV candidates: {decision["VALID_AES_KEY_CANDIDATE_COUNT"]} / {decision["VALID_AES_IV_CANDIDATE_COUNT"]}\n'
            f'- offline decrypt candidates: {decision["OFFLINE_DECRYPT_CANDIDATE_COUNT"]}\n'
            f'- strong structured plaintext recovered: {decision["H15_STRONG_STRUCTURED_PLAINTEXT_RECOVERED"]}\n\n'
            'FLASH_ALLOWED=NO\n')
          print(json.dumps(decision,indent=2,ensure_ascii=False))
          PY

      - name: Package R143 evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r143/evidence
          zip -9 -r /tmp/R143_EXACT_OFFICIAL_WINDOWS_H15_CRYPTO_KEYIV_PATCHSTREAM_STATIC_EVIDENCE.zip . >/dev/null
          sha256sum /tmp/R143_EXACT_OFFICIAL_WINDOWS_H15_CRYPTO_KEYIV_PATCHSTREAM_STATIC_EVIDENCE.zip > /tmp/R143_EXACT_OFFICIAL_WINDOWS_H15_CRYPTO_KEYIV_PATCHSTREAM_STATIC_EVIDENCE.zip.sha256

      - name: Upload R143 evidence
        uses: actions/upload-artifact@v4
        with:
          name: R143-EXACT-OFFICIAL-WINDOWS-H15-CRYPTO-KEYIV-PATCHSTREAM-STATIC-EVIDENCE
          path: |
            /tmp/R143_EXACT_OFFICIAL_WINDOWS_H15_CRYPTO_KEYIV_PATCHSTREAM_STATIC_EVIDENCE.zip
            /tmp/R143_EXACT_OFFICIAL_WINDOWS_H15_CRYPTO_KEYIV_PATCHSTREAM_STATIC_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'R143_VENDOR_BINARY_EXECUTED=NO' /tmp/r143/evidence/R143_SAFETY.txt
          grep -F 'R143_WINDOWS_EXE_EXECUTED=NO' /tmp/r143/evidence/R143_SAFETY.txt
          grep -F 'R143_USB_DEVICE_ACCESS=NO' /tmp/r143/evidence/R143_SAFETY.txt
          grep -F 'R143_BOARD_CONTACT=NO' /tmp/r143/evidence/R143_SAFETY.txt
          grep -F 'R143_AA55_SENT=NO' /tmp/r143/evidence/R143_SAFETY.txt
          grep -F 'R143_RUNTIME_0X11_SENT=NO' /tmp/r143/evidence/R143_SAFETY.txt
          grep -F 'R143_RUNTIME_0XFE_SENT=NO' /tmp/r143/evidence/R143_SAFETY.txt
          grep -F '"FLASH_ALLOWED": false' /tmp/r143/evidence/R143_DECISION.json
          echo R143_H15_CRYPTO_KEYIV_PATCHSTREAM_STATIC_REVERSE_COMPLETE=YES
          echo FLASH_ALLOWED=NO
