          base64 -d "$RUNNER_TEMP/okn-v56-clone.tar.gz.b64" > "$RUNNER_TEMP/okn-v56-clone.tar.gz"
          tar -xzf "$RUNNER_TEMP/okn-v56-clone.tar.gz" -C "$WORK"
          cd "$WORK"
          grep -vE '(^|[[:space:]])\./?SOURCE_HASHES\.txt$' SOURCE_HASHES.txt | sha256sum -c -
          echo "SRC_DIR=$WORK" >> "$GITHUB_ENV"

      - name: Static V56 UI and fail-closed checks
        shell: bash
        run: |
          set -euo pipefail
          cd "$SRC_DIR"
          test "$(find app/src/main/assets/i18n -name '*.json' | wc -l)" -eq 17
          grep -q 'versionCode 1056' app/build.gradle
          grep -Fq '<string name="app_name">GoloPine DSP AudioTurning</string>' app/src/main/res/values/strings.xml
          grep -q 'ALL 15 BANDS' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -q 'setColumnCount(5)' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -q 'outputTrimRow(ch)' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -q 'LIVE_BOARD_USB' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -q 'HOST_TO_DEVICE_USB' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -q 'FLASH_ERASE_WRITE' app/src/main/java/com/okn/golopineclone/MainActivity.java
          grep -q 'FLASH_ALLOWED' app/src/main/java/com/okn/golopineclone/MainActivity.java
          ! grep -R -n '<uses-permission' app/src/main/AndroidManifest.xml
          ! grep -R -n 'android.bluetooth\|android.hardware.usb\|UsbManager\|BluetoothGatt\|HttpURLConnection\|java.net' app/src/main/java
          ! grep -R -n 'INTERNET\|BLUETOOTH_CONNECT\|BLUETOOTH_SCAN\|WRITE_EXTERNAL_STORAGE' app/src/main/AndroidManifest.xml
          echo 'V56 clone UI/fail-closed checks PASS'

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;${{ env.ANDROID_PLATFORM }}" "build-tools;${{ env.ANDROID_BUILD_TOOLS }}"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$SRC_DIR"
          for n in 1 2 3; do
            if gradle --no-daemon --stacktrace :app:assembleDebug; then exit 0; fi
            sleep $((n*20))
          done
          exit 1

      - name: Package APK and source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$SRC_DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/out/OKN_GoloPine_Clone_V56-debug.apk"
          cd "$SRC_DIR"
          zip -qr "$GITHUB_WORKSPACE/out/OKN_GoloPine_Clone_V56_Source.zip" . -x 'app/build/*' '.gradle/*'
          cd "$GITHUB_WORKSPACE/out"
          sha256sum OKN_GoloPine_Clone_V56-debug.apk OKN_GoloPine_Clone_V56_Source.zip > SHA256.txt
          cat > BUILD_SCOPE.txt <<'EOF'
          V56 GOLOPINE CLONE
          - Refined after real-device V55 video test
          - Compact header/navigation and denser HOME controls
          - PEQ: 10 groups, 15 bands in 5 columns / 3 rows, editor above grid
          - CH1..CH7 output trim compact rows, 0.5 dB steps, -70..+6 dB
          - APK-derived icon/background and 17 locale JSON files
          - Side-by-side package: com.okn.golopineclone
          - Fail-closed: LIVE_BOARD_USB=NO, HOST_TO_DEVICE_USB=NO
          - Fail-closed: FLASH_ERASE_WRITE=NO, FLASH_ALLOWED=NO
          - No Bluetooth/USB/network permission and no host-to-device transport
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: OKN_GOLOPINE_CLONE_V56
          path: out/*
          if-no-files-found: error
