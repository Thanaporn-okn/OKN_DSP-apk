name: Build OKN DSP V91 Reference Real-time UI Compile Fix

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKN_DSP_ANDROID_V91_REFERENCE_REALTIME_UI_COMPILE_FIX.zip'
      - 'OKN_DSP_V91_SHA256.txt'
      - '.github/workflows/build-okn-dsp-v91.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify V91 source
        shell: bash
        run: |
          set -euo pipefail
          echo '0d6e35e8fd9fdcd438e084af597c3db2093372cdd4534b76949bfce32f5f4241  OKN_DSP_ANDROID_V91_REFERENCE_REALTIME_UI_COMPILE_FIX.zip' | sha256sum -c -
          rm -rf /tmp/okn_v91
          mkdir -p /tmp/okn_v91
          unzip -q OKN_DSP_ANDROID_V91_REFERENCE_REALTIME_UI_COMPILE_FIX.zip -d /tmp/okn_v91

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run V91 preflight and verify stable signing certificate
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/okn_v91
          python3 preflight_v91.py
          echo 'ba1c52f2607c09953c52fdd79c5f72026aaf0adb8aa44bcba277f7d9b49d9511  app/okn_dsp_stable_debug.keystore' | sha256sum -c -
          CERT=$(keytool -list -v -keystore app/okn_dsp_stable_debug.keystore -storepass android -alias androiddebugkey | awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr 'A-F' 'a-f')
          test "$CERT" = 'c3da85af2e978dbd0ed9bb695e5c79a263189595c116ad93a1ded75a2eb98397'
          echo "Stable signing certificate SHA-256: $CERT"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build stable-signed V91 APK
        working-directory: /tmp/okn_v91
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK signing identity and package V91 artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/okn_v91/app/build/outputs/apk/debug/app-debug.apk
          ARTIFACT_DIR=/tmp/okn_v91/artifact
          test -f "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose "$APK"
          CERT=$($APKSIGNER verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' | tr 'A-F' 'a-f')
          test "$CERT" = 'c3da85af2e978dbd0ed9bb695e5c79a263189595c116ad93a1ded75a2eb98397'

          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"
          cp "$APK" "$ARTIFACT_DIR/OKN_DSP_V91_REFERENCE_REALTIME_UI_COMPILE_FIX-debug.apk"
          cp /tmp/okn_v91/README_V91.txt "$ARTIFACT_DIR/"
          cp /tmp/okn_v91/evidence/OKN_DSP_V91_REFERENCE_REALTIME_UI_COMPILE_FIX.txt "$ARTIFACT_DIR/"
          cp /tmp/okn_v91/evidence/OKN_DSP_V91_REFERENCE_REALTIME_UI_COMPILE_FIX.json "$ARTIFACT_DIR/"
          printf '%s\n' "$CERT" > "$ARTIFACT_DIR/OKN_DSP_V91_APK_CERT_SHA256.txt"
          sha256sum "$ARTIFACT_DIR/OKN_DSP_V91_REFERENCE_REALTIME_UI_COMPILE_FIX-debug.apk" > "$ARTIFACT_DIR/OKN_DSP_V91_REFERENCE_REALTIME_UI_COMPILE_FIX-debug.sha256"
          ls -lah "$ARTIFACT_DIR"

      - name: Upload V91 artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKN_DSP_V91_REFERENCE_REALTIME_UI_COMPILE_FIX
          path: /tmp/okn_v91/artifact/
          if-no-files-found: error
