name: R109 GoloPine official Windows updater static audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/R109_GOLOPINE_OFFICIAL_WINDOWS_UPDATER_STATIC_AUDIT.yml"

permissions:
  contents: read

concurrency:
  group: r109-golopine-official-updater-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLOPINE_PAGE: "https://golodsp.com/7%E9%80%9A%E9%81%93%E9%9F%B3%E9%A2%91%E5%89%8D%E7%BA%A7/"
  OLD_URL: "https://golodsp.com/wp-content/uploads/2026/02/4-27Nov2025_Windows-DSTech_AudioDSP_Client.zip"
  NEW_URL: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-08.exe_.zip"
  PRODUCTION_USB_VIDPID: "6324:1719"
  FLASH_ALLOWED: "NO"

jobs:
  static-audit:
    name: STATIC ONLY - official GoloPine packages - no execution - no USB - no board
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r109/input /tmp/r109/old /tmp/r109/new /tmp/r109/evidence
          cat > /tmp/r109/evidence/R109_SAFETY.txt <<'EOF'
          R109_MODE=STATIC_OFFLINE_ONLY
          R109_VENDOR_BINARY_EXECUTED=NO
          R109_INSTALLER_EXECUTED=NO
          R109_USB_DEVICE_ACCESS=NO
          R109_BOARD_CONTACT=NO
          R109_AA55_SENT=NO
          R109_LINEIN_AA55_SENT=NO
          R109_RUNTIME_0X11_SENT=NO
          R109_FLASH_READ_EXECUTED=NO
          R109_FLASH_ERASE_EXECUTED=NO
          R109_FLASH_WRITE_EXECUTED=NO
          R109_ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD=NO
          FINAL_REQUIRED_TRANSPORT=SAMSUNG_S25_PLUS_USB_C_DIRECT_TO_DSP_USB_C
          HARDWARE_MODIFICATION=FORBIDDEN
          FLASH_ALLOWED=NO
          EOF

      - name: Install static tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            file unzip p7zip-full binutils jq python3-pip >/dev/null
          python3 -m pip install --disable-pip-version-check --no-input pefile >/dev/null

      - name: Acquire official GoloPine Windows packages as data only
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            "$OLD_URL" -o /tmp/r109/input/old.zip
          curl --fail --location --retry 4 --retry-all-errors \
            "$NEW_URL" -o /tmp/r109/input/new.zip

          {
            echo "GOLOPINE_PAGE=$GOLOPINE_PAGE"
            echo "OLD_URL=$OLD_URL"
            echo "NEW_URL=$NEW_URL"
            echo "OLD_SHA256=$(sha256sum /tmp/r109/input/old.zip | awk '{print $1}')"
            echo "NEW_SHA256=$(sha256sum /tmp/r109/input/new.zip | awk '{print $1}')"
            echo "OLD_SIZE=$(stat -c '%s' /tmp/r109/input/old.zip)"
            echo "NEW_SIZE=$(stat -c '%s' /tmp/r109/input/new.zip)"
          } > /tmp/r109/evidence/R109_PACKAGE_PIN.txt

          7z x -y /tmp/r109/input/old.zip -o/tmp/r109/old >/dev/null
          7z x -y /tmp/r109/input/new.zip -o/tmp/r109/new >/dev/null

          find /tmp/r109/old -type f -exec chmod a-x {} + || true
          find /tmp/r109/new -type f -exec chmod a-x {} + || true

      - name: Inventory every extracted file
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess,os

          roots={"old":Path("/tmp/r109/old"),"new":Path("/tmp/r109/new")}
          rows=[]
          for label,root in roots.items():
              for p in sorted(root.rglob("*")):
                  if not p.is_file(): continue
                  b=p.read_bytes()
                  try:
                      typ=subprocess.check_output(["file","-b",str(p)],text=True).strip()
                  except Exception:
                      typ=""
                  rows.append({
                      "package":label,
                      "relative_path":str(p.relative_to(root)),
                      "size":len(b),
                      "sha256":hashlib.sha256(b).hexdigest(),
                      "file_type":typ,
                  })
          Path("/tmp/r109/evidence/R109_FILE_INVENTORY.json").write_text(
              json.dumps(rows,indent=2,ensure_ascii=False)+"\n"
          )
          PY

      - name: Static PE imports resources and strings audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import pefile,json,re,hashlib,subprocess

          roots={"old":Path("/tmp/r109/old"),"new":Path("/tmp/r109/new")}
          terms=[
              "boot","flash","upgrade","update","firmware","recovery","erase","program",
              "chiperas","codedata","bootdat","constdat","cnfgdat","btupdat","upinfo",
              "hid","winusb","setupapi","deviceiocontrol","createfile","readfile","writefile",
              "vid_","pid_","6324","1719","0633","5322","0288","7966",
              "bp1048","bp10","mvsilicon","usb","uart","crc","checksum","mva"
          ]
          out=[]
          for pkg,root in roots.items():
              for p in sorted(root.rglob("*")):
                  if not p.is_file(): continue
                  data=p.read_bytes()
                  is_pe=data[:2]==b"MZ"
                  row={
                      "package":pkg,
                      "relative_path":str(p.relative_to(root)),
                      "sha256":hashlib.sha256(data).hexdigest(),
                      "size":len(data),
                      "is_pe":is_pe,
                  }
                  ascii_strings=[x.decode("latin1","replace") for x in re.findall(rb"[\x20-\x7e]{5,}",data)]
                  u16_strings=[]
                  for m in re.finditer(rb"(?:[\x20-\x7e]\x00){5,}",data):
                      try:
                          u16_strings.append(m.group(0).decode("utf-16le","replace"))
                      except Exception:
                          pass
                  strings=ascii_strings+u16_strings
                  hits={}
                  for t in terms:
                      vals=[s[:300] for s in strings if t.lower() in s.lower()]
                      if vals: hits[t]=vals[:80]
                  row["string_hits"]=hits

                  if is_pe:
                      try:
                          pe=pefile.PE(data=data,fast_load=False)
                          imports=[]
                          for ent in getattr(pe,"DIRECTORY_ENTRY_IMPORT",[]):
                              dll=ent.dll.decode(errors="replace")
                              for imp in ent.imports:
                                  nm=imp.name.decode(errors="replace") if imp.name else f"ord:{imp.ordinal}"
                                  imports.append(f"{dll}!{nm}")
                          row["imports"]=imports
                          row["machine"]=hex(pe.FILE_HEADER.Machine)
                          row["entrypoint_rva"]=hex(pe.OPTIONAL_HEADER.AddressOfEntryPoint)
                          row["imagebase"]=hex(pe.OPTIONAL_HEADER.ImageBase)
                      except Exception as e:
                          row["pe_error"]=repr(e)
                  out.append(row)

          Path("/tmp/r109/evidence/R109_STATIC_PE_STRINGS.json").write_text(
              json.dumps(out,indent=2,ensure_ascii=False)+"\n"
          )
          PY

      - name: Search for production USB identity and updater evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          rows=json.loads(Path("/tmp/r109/evidence/R109_STATIC_PE_STRINGS.json").read_text())

          candidates=[]
          for r in rows:
              h=r.get("string_hits",{})
              score=0
              reasons=[]
              for term,w in [
                  ("6324",6),("1719",6),("bp1048",5),("mvsilicon",4),
                  ("firmware",4),("upgrade",4),("recovery",5),("boot",3),
                  ("hid",3),("winusb",3),("deviceiocontrol",3),("setupapi",2),
                  ("chiperas",6),("codedata",6),("bootdat",6),("mva",4)
              ]:
                  if term in h:
                      score+=w; reasons.append(term)
              imports=[x.lower() for x in r.get("imports",[])]
              for term,w in [
                  ("hid.dll",4),("setupapi.dll",3),("deviceiocontrol",4),
                  ("readfile",2),("writefile",2),("createfile",2)
              ]:
                  if any(term in x for x in imports):
                      score+=w
                      if term not in reasons: reasons.append(term)
              if score:
                  candidates.append({
                      "package":r["package"],
                      "relative_path":r["relative_path"],
                      "sha256":r["sha256"],
                      "score":score,
                      "reasons":reasons
                  })
          candidates.sort(key=lambda x:(-x["score"],x["package"],x["relative_path"]))
          Path("/tmp/r109/evidence/R109_UPDATER_CANDIDATES.json").write_text(
              json.dumps(candidates,indent=2,ensure_ascii=False)+"\n"
          )

          alltext=json.dumps(rows,ensure_ascii=False).lower()
          d={
              "OFFICIAL_VENDOR_SOURCE":True,
              "OLD_PACKAGE_ACQUIRED":True,
              "NEW_08APR2026_PACKAGE_ACQUIRED":True,
              "PRODUCTION_6324_LITERAL_SEEN_ANYWHERE":"6324" in alltext,
              "PRODUCTION_1719_LITERAL_SEEN_ANYWHERE":"1719" in alltext,
              "KNOWN_FLASH_COMMAND_VOCABULARY_SEEN":any(
                  x in alltext for x in ["chiperas","codedata","bootdat","constdat","cnfgdat","btupdat","upinfo"]
              ),
              "TOP_CANDIDATES":candidates[:20],
              "PRODUCTION_BOOT_ENTRY_PROVEN":False,
              "PRODUCTION_RECOVERY_USB_IDENTITY_PROVEN":False,
              "SAFE_READ_ONLY_STOCK_BACKUP_PROVEN":False,
              "ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD":False,
              "FLASH_ALLOWED":False
          }
          Path("/tmp/r109/evidence/R109_PRELIM_DECISION.json").write_text(
              json.dumps(d,indent=2,ensure_ascii=False)+"\n"
          )
          PY

      - name: Compare old vs new package binaries by hash and names
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,collections

          inv=json.loads(Path("/tmp/r109/evidence/R109_FILE_INVENTORY.json").read_text())
          old=[x for x in inv if x["package"]=="old"]
          new=[x for x in inv if x["package"]=="new"]

          old_by_name=collections.defaultdict(list)
          new_by_name=collections.defaultdict(list)
          for x in old: old_by_name[Path(x["relative_path"]).name.lower()].append(x)
          for x in new: new_by_name[Path(x["relative_path"]).name.lower()].append(x)

          names=sorted(set(old_by_name)|set(new_by_name))
          rows=[]
          for name in names:
              a=old_by_name.get(name,[])
              b=new_by_name.get(name,[])
              rows.append({
                  "basename":name,
                  "old":[{"path":x["relative_path"],"sha256":x["sha256"],"size":x["size"]} for x in a],
                  "new":[{"path":x["relative_path"],"sha256":x["sha256"],"size":x["size"]} for x in b],
                  "same_hash_any":bool({x["sha256"] for x in a}&{x["sha256"] for x in b}),
              })
          Path("/tmp/r109/evidence/R109_OLD_NEW_DIFF.json").write_text(
              json.dumps(rows,indent=2,ensure_ascii=False)+"\n"
          )
          PY

      - name: Build fail-closed R109 decision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          ev=Path("/tmp/r109/evidence")
          p=json.loads((ev/"R109_PRELIM_DECISION.json").read_text())
          candidates=json.loads((ev/"R109_UPDATER_CANDIDATES.json").read_text())

          d={
              "OFFICIAL_GOLOPINE_WINDOWS_PACKAGES_ANALYZED":True,
              "LATEST_VENDOR_PACKAGE_LABEL":"08Apr2026",
              "PRODUCTION_RUNTIME_USB_IDENTITY":"6324:1719",
              "PRODUCTION_6324_LITERAL_SEEN_ANYWHERE":p["PRODUCTION_6324_LITERAL_SEEN_ANYWHERE"],
              "PRODUCTION_1719_LITERAL_SEEN_ANYWHERE":p["PRODUCTION_1719_LITERAL_SEEN_ANYWHERE"],
              "KNOWN_FLASH_COMMAND_VOCABULARY_SEEN":p["KNOWN_FLASH_COMMAND_VOCABULARY_SEEN"],
              "TOP_STATIC_UPDATER_CANDIDATES":candidates[:12],
              "PRODUCTION_FIRST_BOOTSTRAP_PROVEN":False,
              "PRODUCTION_RECOVERY_USB_IDENTITY_PROVEN":False,
              "EXACT_PRODUCTION_UPDATER_TRANSPORT_PROVEN":False,
              "SAFE_READ_ONLY_STOCK_BACKUP_PROVEN":False,
              "IMAGE_LAYOUT_ACCEPTANCE_PROVEN":False,
              "ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD":False,
              "NEXT":"DEEP_STATIC_REVERSE_TOP_OFFICIAL_GOLOPINE_CANDIDATE(S): locate boot-entry, USB transport, identify/status/read-only backup, image/header/CRC/signature checks",
              "FLASH_ALLOWED":False
          }
          (ev/"R109_DECISION.json").write_text(json.dumps(d,indent=2,ensure_ascii=False)+"\n")
          report=[
              "# R109 official GoloPine Windows package static audit",
              "",
              "Source page: official GoloPine 7-channel product/download page.",
              "Static/offline analysis only; nothing is executed or sent to hardware.",
              "",
              "```json",
              json.dumps(d,indent=2,ensure_ascii=False),
              "```",
              "",
              "FLASH_ALLOWED=NO"
          ]
          (ev/"R109_REPORT.md").write_text("\n".join(report)+"\n")
          print(json.dumps(d,indent=2,ensure_ascii=False))
          PY

      - name: Package evidence only
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r109/evidence
          zip -9 -r /tmp/R109_GOLOPINE_OFFICIAL_WINDOWS_STATIC_EVIDENCE.zip .
          sha256sum /tmp/R109_GOLOPINE_OFFICIAL_WINDOWS_STATIC_EVIDENCE.zip \
            > /tmp/R109_GOLOPINE_OFFICIAL_WINDOWS_STATIC_EVIDENCE.zip.sha256

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: R109-GOLOPINE-OFFICIAL-WINDOWS-STATIC-EVIDENCE
          path: |
            /tmp/R109_GOLOPINE_OFFICIAL_WINDOWS_STATIC_EVIDENCE.zip
            /tmp/R109_GOLOPINE_OFFICIAL_WINDOWS_STATIC_EVIDENCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'R109_VENDOR_BINARY_EXECUTED=NO' /tmp/r109/evidence/R109_SAFETY.txt
          grep -F 'R109_USB_DEVICE_ACCESS=NO' /tmp/r109/evidence/R109_SAFETY.txt
          grep -F 'R109_ANY_DISCOVERED_FRAME_AUTHORIZED_FOR_BOARD=NO' /tmp/r109/evidence/R109_SAFETY.txt
          grep -F '"FLASH_ALLOWED": false' /tmp/r109/evidence/R109_DECISION.json
          cat /tmp/r109/evidence/R109_DECISION.json
          echo R109_STATIC_AUDIT_COMPLETE=YES
          echo FLASH_ALLOWED=NO
