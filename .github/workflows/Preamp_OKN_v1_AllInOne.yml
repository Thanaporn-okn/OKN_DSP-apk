# Preamp_OKN v1.0.0 - ALL IN ONE GitHub Actions workflow
# Put this single file at: .github/workflows/Preamp_OKN_v1_AllInOne.yml
# It reconstructs the full Android project, validates the verified DSP evidence,
# builds an installable APK, and uploads APK + reconstructed source as artifacts.
name: Preamp_OKN v1 All-In-One Build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/Preamp_OKN_v1_AllInOne.yml'

permissions:
  contents: read

concurrency:
  group: preamp-okn-v1-${{ github.ref }}
  cancel-in-progress: true

env:
