              'app/src/main/java/com/okn/preamp/MainActivity.java': '94fe26e393b0d85cc9d79a82cc19fbf0f04fe8423fbff3722c910a651a3ac128',
              'app/src/main/java/com/okn/preamp/Protocol.java': 'a233ecef5e76c92cdac389bda7d052b9980ecf163bd3ba5db74f991aec898a71',
              'app/src/main/res/drawable/ic_launcher.xml': 'a0419b41b00b4b4e60b21ca64b3a51e0f85daea0ba4983466a787e3a6ccbaaca',
              'app/src/main/res/values/strings.xml': 'a6123cf3f7dcfb203fcb47271ac622d43fd03b92c372e3207acacbb6206c3a64',
              'app/src/main/res/values/styles.xml': '14e6359c8c69f7c51d31770be0357a597bbab7ffb9522e2bf86e19095f3d7cf8',
              'evidence/APK_EXE_REPORT_TH.md': '96a62c7ed75a0f5e29e460e6c63a189fce31532fd542426d5bbd346dda527a11',
              'evidence/COMBINED_EVIDENCE.md': '4e0bade6126e40261bde136d24a0d26350c269a529ebe1ab373fea4b0f12b248',
              'evidence/GoloPine_DeviceDescription_REAL_20260906_204555.json': 'c4be7b923f14d59d9567d5586857a67c43334299edd51524fdcb8425934d2870',
              'evidence/OKN_DSP_V35_PROTOCOL_PROOF.txt': '8d75474e77e958e6815dba98199886ea91d1258aa4616ec51ee8ba09fcf73f93',
              'tools/validate_preamp_okn_v1.py': 'be6d4e696b77dde0146947dfd8e3634879708f9dc736ddd9ad5a52f66aa1eae6',
          }

          for rel, parts in files.items():
              data = base64.b64decode("".join(parts))
              target = root / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              got = hashlib.sha256(data).hexdigest()
              if got != expected[rel]:
                  raise SystemExit(f"SHA256 mismatch: {rel}: {got} != {expected[rel]}")
              print(f"OK {got}  {rel}")

          manifest = root / "ALL_IN_ONE_SHA256SUMS.txt"
          manifest.write_text("".join(f"{expected[p]}  {p}\n" for p in sorted(expected)), encoding="utf-8")
          print(f"Reconstructed {len(files)} verified files at {root}")
          PY
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Validate verified GoloPine DSP dataset and safety gate
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          sha256sum -c ALL_IN_ONE_SHA256SUMS.txt
          python3 tools/validate_preamp_okn_v1.py

      - name: Package reconstructed source
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          zip -qr "$RUNNER_TEMP/Preamp_OKN_v1_Source.zip" . -x ".gradle/*" "app/build/*"
          sha256sum "$RUNNER_TEMP/Preamp_OKN_v1_Source.zip" | tee "$RUNNER_TEMP/Preamp_OKN_v1_Source.zip.sha256"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android SDK 35 and Build Tools 35.0.0
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -path "*/bin/sdkmanager" 2>/dev/null | sort -V | tail -n1 || true)"
          fi
          test -x "$SDKMANAGER"
          echo "Using sdkmanager: $SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          set -o pipefail
          "$SDKMANAGER" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build Preamp_OKN release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" --no-daemon --stacktrace :app:assembleRelease

      - name: Verify and rename APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          OUT="$RUNNER_TEMP/Preamp_OKN_v1.0.0.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee "$RUNNER_TEMP/Preamp_OKN_v1.0.0.apk.sha256"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          AAPT="$SDK/build-tools/${ANDROID_BUILD_TOOLS}/aapt"
          if [[ -x "$AAPT" ]]; then
            "$AAPT" dump badging "$OUT" | head -20
          fi

      - name: Upload Preamp_OKN APK
        uses: actions/upload-artifact@v6
        with:
          name: Preamp_OKN-v1.0.0-APK
          path: |
            ${{ runner.temp }}/Preamp_OKN_v1.0.0.apk
            ${{ runner.temp }}/Preamp_OKN_v1.0.0.apk.sha256
          if-no-files-found: error

      - name: Upload reconstructed source
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Preamp_OKN-v1.0.0-Source
          path: |
            ${{ runner.temp }}/Preamp_OKN_v1_Source.zip
            ${{ runner.temp }}/Preamp_OKN_v1_Source.zip.sha256
          if-no-files-found: warn
