name: OKN BP1048P4 R63 ONE-FILE AUTO Image Metadata Gate

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/OKN_BP1048P4_R63_ONE_FILE_AUTORUN_IMAGE_METADATA.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  TARGET_SOC: "MVSilicon BP1048P4"
  REQUIRED_PHONE: "Samsung Galaxy S25+"
  REQUIRED_PATH: "Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only"
  R62_RUN_ID: "37207339833"
  R62_ARTIFACT_ID: "11305755848"
  R62_BIN_SHA256: "85960cc40a599e98fe754922aa75e62b75449e218667c9cc6caf3828709641f3"
  FLASH_ALLOWED: "NO"

jobs:
  r63-image-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Immutable deployment gate
        shell: bash
        run: |
          set -euo pipefail
          test "$TARGET_SOC" = "MVSilicon BP1048P4"
          test "$REQUIRED_PHONE" = "Samsung Galaxy S25+"
          test "$REQUIRED_PATH" = "Samsung Galaxy S25+ -> USB-C cable -> DSP board USB-C port only"
          test "$FLASH_ALLOWED" = "NO"
          rm -rf /tmp/r63
          mkdir -p /tmp/r63/{input,out,evidence}

      - name: Download exact successful R62 artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${R62_ARTIFACT_ID}/zip" \
            -o /tmp/r63/R62_ARTIFACT.zip

          unzip -q /tmp/r63/R62_ARTIFACT.zip -d /tmp/r63/input

          BIN=/tmp/r63/input/R62_BP1048P4_OKN_STANDALONE_NOT_FOR_FIRST_FLASH.bin
          test -s "$BIN"
          echo "${R62_BIN_SHA256}  ${BIN}" | sha256sum -c -

          printf 'R62_RUN_ID=%s\nR62_ARTIFACT_ID=%s\nR62_BIN_SHA256=%s\n' \
            "$R62_RUN_ID" "$R62_ARTIFACT_ID" "$R62_BIN_SHA256" \
            > /tmp/r63/evidence/00_INPUT_IDENTITY.txt

      - name: Inspect raw R62 BP1048P4 image layout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          p = Path("/tmp/r63/input/R62_BP1048P4_OKN_STANDALONE_NOT_FOR_FIRST_FLASH.bin")
          b = p.read_bytes()
          magic = bytes.fromhex("c9 bd be b0")

          offs = []
          i = 0
          while True:
              j = b.find(magic, i)
              if j < 0:
                  break
              offs.append(j)
              i = j + 1

          bases = sorted({x - 0xC0 for x in offs if x >= 0xC0})
          state = {
              "input_file": p.name,
              "size_bytes": len(b),
              "sha256": hashlib.sha256(b).hexdigest(),
              "magic_offsets_hex": [hex(x) for x in offs],
              "candidate_image_bases_hex": [hex(x) for x in bases],
              "boot_base_0_seen": 0 in bases,
              "app_base_0x10000_seen": 0x10000 in bases,
              "boot_A4_raw": b[0xA4:0xA8].hex(),
              "boot_BC_raw": b[0xBC:0xC0].hex(),
              "app_A4_raw": b[0x10000+0xA4:0x10000+0xA8].hex(),
              "app_BC_raw": b[0x10000+0xBC:0x10000+0xC0].hex(),
              "app_E0_E3_raw": b[0x10000+0xE0:0x10000+0xE4].hex(),
          }

          if not state["boot_base_0_seen"]:
              raise SystemExit("BP1048 boot image base 0 not found")
          if not state["app_base_0x10000_seen"]:
              raise SystemExit("BP1048 app image base 0x10000 not found")

          Path("/tmp/r63/evidence/01_R62_RAW_LAYOUT.json").write_text(
              json.dumps(state, indent=2) + "\n"
          )
          print(json.dumps(state, indent=2))
          PY

      - name: Synthesize proven BP1048 metadata offline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, struct

          src = Path("/tmp/r63/input/R62_BP1048P4_OKN_STANDALONE_NOT_FOR_FIRST_FLASH.bin")
          dst = Path("/tmp/r63/out/R63_BP1048P4_METADATA_CANDIDATE_DO_NOT_FLASH.bin")
          data = bytearray(src.read_bytes())
          before = bytes(data)

          APP_BASE = 0x10000
          MAGIC = bytes.fromhex("c9 bd be b0")
          BOOT_SIZE_FIELD = 0xA4
          BOOT_CRC_FIELD = 0xBC
          APP_CRC_FIELD = APP_BASE + 0xBC
          APP_MAGIC_FIELD = APP_BASE + 0xC0
          APP_LEN_FIELD = APP_BASE + 0xE0

          if data[0xC0:0xC4] != MAGIC:
              raise SystemExit("boot magic mismatch")
          if data[APP_MAGIC_FIELD:APP_MAGIC_FIELD+4] != MAGIC:
              raise SystemExit("app magic mismatch")

          candidate_len = len(data) - APP_BASE
          if not (0 < candidate_len <= 0xFFFFFF):
              raise SystemExit("app length does not fit 24-bit metadata")

          def crc16_xmodem_ranges(buf, ranges):
              crc = 0
              for a, z in ranges:
                  if not (0 <= a <= z <= len(buf)):
                      raise SystemExit(f"invalid CRC range {a:#x}..{z:#x}")
                  for byte in buf[a:z]:
                      crc ^= byte << 8
                      for _ in range(8):
                          crc = (((crc << 1) ^ 0x1021) & 0xFFFF) if (crc & 0x8000) else ((crc << 1) & 0xFFFF)
              return crc

          # Application length metadata:
          # 24-bit little-endian length + one-byte sum checksum.
          l0 = candidate_len & 0xFF
          l1 = (candidate_len >> 8) & 0xFF
          l2 = (candidate_len >> 16) & 0xFF
          chk = (l0 + l1 + l2) & 0xFF
          data[APP_LEN_FIELD:APP_LEN_FIELD+4] = bytes((l0, l1, l2, chk))

          # Proven BP1048 fastCRC coverage shape.
          boot_ranges = [
              (0x0000, 0x00A4),
              (0x00A8, 0x00BC),
              (0x00C0, 0x00CC),
              (0x00D4, 0x00E4),
              (0x00EC, 0x1000),
          ]
          boot_crc = crc16_xmodem_ranges(data, boot_ranges)

          # Address-zero downloader metadata writeback.
          data[BOOT_SIZE_FIELD:BOOT_SIZE_FIELD+4] = struct.pack("<I", 0x10001000)
          data[BOOT_CRC_FIELD:BOOT_CRC_FIELD+4] = struct.pack("<I", boot_crc)

          if crc16_xmodem_ranges(data, boot_ranges) != boot_crc:
              raise SystemExit("boot CRC not stable after excluded metadata writeback")

          app = data[APP_BASE:APP_BASE+candidate_len]
          app_ranges = [
              (0x0000, 0x00A4),
              (0x00A8, 0x00BC),
              (0x00C0, 0x00CC),
              (0x00D4, 0x00E4),
              (0x00EC, candidate_len),
          ]
          app_crc = crc16_xmodem_ranges(app, app_ranges)
          data[APP_CRC_FIELD:APP_CRC_FIELD+4] = struct.pack("<I", app_crc)

          app_after = data[APP_BASE:APP_BASE+candidate_len]
          if crc16_xmodem_ranges(app_after, app_ranges) != app_crc:
              raise SystemExit("app CRC not stable after excluded metadata writeback")

          changed = [i for i, (a, b) in enumerate(zip(before, data)) if a != b]
          allowed = set(
              range(BOOT_SIZE_FIELD, BOOT_SIZE_FIELD+4)
          ) | set(
              range(BOOT_CRC_FIELD, BOOT_CRC_FIELD+4)
          ) | set(
              range(APP_CRC_FIELD, APP_CRC_FIELD+4)
          ) | set(
              range(APP_LEN_FIELD, APP_LEN_FIELD+4)
          )
          unexpected = [x for x in changed if x not in allowed]
          if unexpected:
              raise SystemExit(f"unexpected modified offsets: {unexpected[:32]}")

          dst.write_bytes(data)

          state = {
              "revision": "R63",
              "input_sha256": hashlib.sha256(before).hexdigest(),
              "output_sha256": hashlib.sha256(data).hexdigest(),
              "image_bytes": len(data),
              "app_base_hex": "0x10000",
              "candidate_app_length": candidate_len,
              "candidate_app_length_hex": hex(candidate_len),
              "app_length_metadata_hex": data[APP_LEN_FIELD:APP_LEN_FIELD+4].hex(),
              "boot_fastcrc_algorithm": "CRC16/CCITT-XMODEM",
              "boot_fastcrc_hex": f"0x{boot_crc:04X}",
              "app_fastcrc_hex": f"0x{app_crc:04X}",
              "boot_A4_dword_hex": hex(struct.unpack("<I", data[BOOT_SIZE_FIELD:BOOT_SIZE_FIELD+4])[0]),
              "boot_BC_dword_hex": hex(struct.unpack("<I", data[BOOT_CRC_FIELD:BOOT_CRC_FIELD+4])[0]),
              "app_BC_dword_hex": hex(struct.unpack("<I", data[APP_CRC_FIELD:APP_CRC_FIELD+4])[0]),
              "changed_offsets_count": len(changed),
              "unexpected_changed_offsets": unexpected,
              "metadata_internal_consistency": True,
              "production_boot_entry_proven": False,
              "production_recovery_reenumeration_proven": False,
              "stock_readback_proven": False,
              "rollback_proven": False,
              "flash_allowed": False,
          }

          Path("/tmp/r63/evidence/02_R63_METADATA_STATE.json").write_text(
              json.dumps(state, indent=2) + "\n"
          )
          Path("/tmp/r63/evidence/03_R63_METADATA_STATE.txt").write_text(
              "\n".join([
                  "R63_METADATA_SYNTHESIS=PASS",
                  f"R63_IMAGE_BYTES={state['image_bytes']}",
                  f"R63_APP_LENGTH={state['candidate_app_length']}",
                  f"R63_APP_LENGTH_HEX={state['candidate_app_length_hex']}",
                  f"R63_APP_LENGTH_META={state['app_length_metadata_hex']}",
                  f"R63_BOOT_FASTCRC={state['boot_fastcrc_hex']}",
                  f"R63_APP_FASTCRC={state['app_fastcrc_hex']}",
                  f"R63_OUTPUT_SHA256={state['output_sha256']}",
                  "R63_METADATA_INTERNAL_CONSISTENCY=YES",
                  "FLASH_ALLOWED=NO",
              ]) + "\n"
          )
          print(Path("/tmp/r63/evidence/03_R63_METADATA_STATE.txt").read_text(), end="")
          PY

      - name: Independent expected-value gate for this exact R62 image
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^R63_APP_LENGTH=1415544$' /tmp/r63/evidence/03_R63_METADATA_STATE.txt
          grep -q '^R63_APP_LENGTH_HEX=0x159978$' /tmp/r63/evidence/03_R63_METADATA_STATE.txt
          grep -q '^R63_APP_LENGTH_META=78991526$' /tmp/r63/evidence/03_R63_METADATA_STATE.txt
          grep -q '^R63_BOOT_FASTCRC=0xE317$' /tmp/r63/evidence/03_R63_METADATA_STATE.txt
          grep -q '^R63_APP_FASTCRC=0x4A46$' /tmp/r63/evidence/03_R63_METADATA_STATE.txt
          grep -q '^R63_OUTPUT_SHA256=6218582ba618320e7a5367332e8abe34c6dfa354c783aafe6f1b1fa588bb42b9$' /tmp/r63/evidence/03_R63_METADATA_STATE.txt
          grep -q '^FLASH_ALLOWED=NO$' /tmp/r63/evidence/03_R63_METADATA_STATE.txt

      - name: Final R63 report
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r63/evidence/04_R63_FINAL_REPORT.md <<'EOF'
          # R63 BP1048P4 image metadata result

          Exact input:
          - R62 successful Actions run: 37207339833
          - R62 artifact: 11305755848
          - R62 firmware SHA256: 85960cc40a599e98fe754922aa75e62b75449e218667c9cc6caf3828709641f3

          Proven by this offline run:
          - BP1048 boot image magic at base 0.
          - BP1048 application image magic at base 0x10000.
          - Application length = 1,415,544 bytes (0x159978).
          - Length metadata = 78 99 15 26.
          - Boot fastCRC = CRC16/CCITT-XMODEM 0xE317.
          - Application fastCRC = CRC16/CCITT-XMODEM 0x4A46.
          - Boot metadata and application metadata are internally self-consistent.
          - Candidate SHA256 after metadata synthesis:
            6218582ba618320e7a5367332e8abe34c6dfa354c783aafe6f1b1fa588bb42b9

          This closes an image-metadata construction step. It does NOT prove that the
          production GoloPine/DSTech board will enter its updater, accept the image,
          provide stock readback, or provide rollback/recovery.

          FLASH_ALLOWED=NO
          EOF
          cat /tmp/r63/evidence/04_R63_FINAL_REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Package R63 evidence
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/r63/input/R62_BP1048P4_OKN_STANDALONE_NOT_FOR_FIRST_FLASH.bin \
            /tmp/r63/out/R62_ORIGINAL_NOT_FOR_FIRST_FLASH.bin
          cp /tmp/r63/evidence/* /tmp/r63/out/
          (cd /tmp/r63/out && sha256sum * > SHA256SUMS.txt)

      - name: Upload R63 metadata candidate and evidence
        uses: actions/upload-artifact@v4
        with:
          name: R63_BP1048P4_IMAGE_METADATA_OFFLINE
          path: /tmp/r63/out/*
          if-no-files-found: error
          retention-days: 90

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FLASH_ALLOWED" = "NO"
          test -s /tmp/r63/out/R63_BP1048P4_METADATA_CANDIDATE_DO_NOT_FLASH.bin
          grep -q '^R63_METADATA_SYNTHESIS=PASS$' /tmp/r63/evidence/03_R63_METADATA_STATE.txt
          grep -q '^R63_METADATA_INTERNAL_CONSISTENCY=YES$' /tmp/r63/evidence/03_R63_METADATA_STATE.txt
          echo "R63_OFFLINE_METADATA_GATE=PASS"
          echo "FLASH_ALLOWED=NO"
