name: OKN BP1048P4 MASTER V8 FIXED PURE + EXTERNAL JIT CAPTURE

"on":
  workflow_dispatch:

permissions:
  contents: read

env:
  GOLOPINE_WINDOWS_URL: "https://golodsp.com/wp-content/uploads/2026/05/golopine_audio_turning_release_2026-04-08.exe_.zip"
  LIVE_DSP_CONNECTED: "NO"
  USB_TARGET_ACCESS: "NO"
  HOST_TO_DSP_IO: "NO"
  HID_CONNECT_ALLOWED: "NO"
  HID_SEND_ALLOWED: "NO"
  HID_WRITE_ALLOWED: "NO"
  FEATURE_REPORT_ALLOWED: "NO"
  FLASH_ALLOWED: "NO"
  ERASE_ALLOWED: "NO"
  WRITE_ALLOWED: "NO"

jobs:
  master-v8-fixed:
    name: MASTER V8 FIXED pure command + external JIT capture
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Safety gate and workspace
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          foreach($n in @(
            "LIVE_DSP_CONNECTED","USB_TARGET_ACCESS","HOST_TO_DSP_IO",
            "HID_CONNECT_ALLOWED","HID_SEND_ALLOWED","HID_WRITE_ALLOWED",
            "FEATURE_REPORT_ALLOWED","FLASH_ALLOWED","ERASE_ALLOWED","WRITE_ALLOWED"
          )){
            if((Get-Item "Env:$n").Value -ne "NO"){ throw "$n must be NO" }
          }

          $root="C:\okn_v8f"
          if(Test-Path $root){ Remove-Item -Recurse -Force $root }
          New-Item -ItemType Directory -Force -Path `
            "$root\download","$root\pkg","$root\harness","$root\jit",`
            "$root\evidence","$root\out" | Out-Null

          @"
          MODE=PURE_COMMAND_PLUS_EXTERNAL_JIT_CAPTURE
          LIVE_DSP_CONNECTED=NO
          USB_TARGET_ACCESS=NO
          HOST_TO_DSP_IO=NO
          HID_CONNECT_ALLOWED=NO
          HID_SEND_ALLOWED=NO
          HID_WRITE_ALLOWED=NO
          FEATURE_REPORT_ALLOWED=NO
          FLASH_ALLOWED=NO
          "@ | Set-Content "$root\evidence\00_SAFETY.txt"

      - name: Download untouched official vendor EXE
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v8f"

          curl.exe -fL --retry 6 --retry-all-errors --retry-delay 2 `
            --connect-timeout 20 --max-time 300 `
            $env:GOLOPINE_WINDOWS_URL -o "$root\download\vendor.zip"
          if($LASTEXITCODE -ne 0){ throw "download failed" }

          Expand-Archive -Force "$root\download\vendor.zip" "$root\pkg"

          $exe=Get-ChildItem "$root\pkg" -Recurse -File -Filter *.exe |
            Where-Object {
              $_.FullName -notmatch '\\__MACOSX\\' -and $_.Name -notlike '._*'
            } |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if(-not $exe){ throw "vendor EXE missing" }
          if($exe.Length -lt 100000){ throw "vendor EXE too small" }

          Copy-Item $exe.FullName "$root\vendor.exe" -Force
          $b=[IO.File]::ReadAllBytes("$root\vendor.exe")
          if($b[0] -ne 0x4D -or $b[1] -ne 0x5A){ throw "not MZ" }

          @"
          FILE=$($exe.FullName)
          BYTES=$($exe.Length)
          SHA256=$((Get-FileHash "$root\vendor.exe" -Algorithm SHA256).Hash)
          ORIGINAL_BINARY_MODIFIED=NO
          "@ | Set-Content "$root\evidence\01_VENDOR_IDENTITY.txt"

      - name: Build x86 pure probe and isolated JIT pointer probe
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v8f"

          @'
          using System;
          using System.IO;
          using System.Linq;
          using System.Reflection;
          using System.Runtime.CompilerServices;
          using System.Collections.Generic;

          class PureProbe
          {
              static List<string> L=new List<string>();

              static string Hex(object o)
              {
                  if(o==null)return "<NULL>";
                  byte[] b=o as byte[];
                  if(b!=null)return BitConverter.ToString(b).Replace("-","");
                  var en=o as IEnumerable<byte>;
                  if(en!=null)
                  {
                      try{return BitConverter.ToString(en.ToArray()).Replace("-","");}
                      catch(Exception ex){return "<ENUM_EXCEPTION:"+ex.GetBaseException().Message+">";}
                  }
                  return Convert.ToString(o,System.Globalization.CultureInfo.InvariantCulture);
              }

              static MethodInfo M(Type t,string name,params Type[] p)
              {
                  return t.GetMethod(name,
                    BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Static|BindingFlags.Instance,
                    null,p,null);
              }

              static void Inventory(Type t)
              {
                  L.Add("TYPE "+t.FullName);
                  if(t.IsEnum)
                  {
                      foreach(object v in Enum.GetValues(t))
                          L.Add(" ENUM "+Enum.GetName(t,v)+"="+Convert.ToInt64(v));
                  }

                  foreach(var f in t.GetFields(
                    BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Static|BindingFlags.Instance))
                  {
                      string extra="";
                      try{
                          if(f.IsLiteral)extra=" CONST="+Convert.ToString(f.GetRawConstantValue());
                      }catch{}
                      L.Add(" FIELD "+f.FieldType.FullName+" "+f.Name+extra);
                  }

                  foreach(var p in t.GetProperties(
                    BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Static|BindingFlags.Instance))
                      L.Add(" PROPERTY "+p.PropertyType.FullName+" "+p.Name);

                  foreach(var c in t.GetConstructors(
                    BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance))
                      L.Add(" CTOR "+c.ToString());

                  foreach(var m in t.GetMethods(
                    BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Static|BindingFlags.Instance|BindingFlags.DeclaredOnly))
                      L.Add(" METHOD "+m.ToString()+" RETURN="+m.ReturnType.FullName);
              }

              static void Main(string[] a)
              {
                  string exe=Path.GetFullPath(a[0]);
                  string outp=Path.GetFullPath(a[1]);
                  Directory.SetCurrentDirectory(Path.GetDirectoryName(exe));

                  L.Add("MODE=PURE_COMMAND_ONLY");
                  L.Add("ENTRYPOINT_INVOKED=NO");
                  L.Add("HID_CONNECT_INVOKED=NO");
                  L.Add("HID_SEND_INVOKED=NO");
                  L.Add("HID_WRITE_INVOKED=NO");
                  L.Add("FEATURE_REPORT_INVOKED=NO");

                  try
                  {
                      AppDomain.CurrentDomain.AssemblyResolve += (s,e) => {
                          string n=new AssemblyName(e.Name).Name+".dll";
                          string p=Path.Combine(Path.GetDirectoryName(exe),n);
                          return File.Exists(p)?Assembly.LoadFrom(p):null;
                      };

                      Assembly asm=Assembly.LoadFile(exe);
                      L.Add("ASSEMBLY="+asm.FullName);

                      RuntimeHelpers.RunModuleConstructor(asm.ManifestModule.ModuleHandle);
                      L.Add("MODULE_INITIALIZER=SUCCESS");

                      Type[] types;
                      try{types=asm.GetTypes();}
                      catch(ReflectionTypeLoadException ex){types=ex.Types.Where(x=>x!=null).ToArray();}

                      foreach(Type t in types)
                      {
                          string n=(t.FullName??"").ToLowerInvariant();
                          if(n.Contains("dstechacutatorcommand") ||
                             n.Contains("hardwarecommandconverter") ||
                             n.Contains("ufe") ||
                             n.Contains("command") ||
                             n.Contains("packet") ||
                             n.Contains("report"))
                              Inventory(t);
                      }

                      Type hc=asm.GetType("DSTech_AudioDSP_Client.HardwareCommandConverter",false);
                      if(hc!=null)
                      {
                          foreach(double v in new double[]{0,1,-1,0.5,0.25,-0.5,0.125,-0.125})
                          {
                              try{
                                  object r=M(hc,"ConvertSigmaDSPCoefficient",typeof(double))
                                      .Invoke(null,new object[]{v});
                                  L.Add("ConvertSigmaDSPCoefficient("+v.ToString("R")+")="+Hex(r));
                              }catch(Exception ex){
                                  L.Add("ConvertSigmaDSPCoefficient_EXCEPTION="+ex.GetBaseException());
                              }
                          }

                          foreach(int v in new int[]{0,1,-1,0x1234,0x123456,0x7fffff,-8388608})
                          {
                              try{
                                  object r=M(hc,"SpitToByte",typeof(int))
                                      .Invoke(null,new object[]{v});
                                  L.Add("SpitToByte("+v+")="+Hex(r));
                              }catch(Exception ex){
                                  L.Add("SpitToByte_EXCEPTION="+ex.GetBaseException());
                              }
                          }

                          MethodInfo one=M(hc,"CreateSigmaDSPsingleVariableUpdateCommand",
                            typeof(short),typeof(double));
                          if(one!=null)
                          {
                              foreach(short addr in new short[]{0,1,2,16,256,0x1234})
                              foreach(double dat in new double[]{0,1,-1,0.5,0.25,-0.5})
                              {
                                  try{
                                      object r=one.Invoke(null,new object[]{addr,dat});
                                      L.Add("SIGMA1 addr="+addr+" data="+dat.ToString("R")+" => "+Hex(r));
                                  }catch(Exception ex){
                                      L.Add("SIGMA1_EXCEPTION addr="+addr+" => "+ex.GetBaseException());
                                  }
                              }
                          }

                          // Best-effort CreateFilterUpdateCommand inspection.
                          foreach(MethodInfo fm in hc.GetMethods(BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Static)
                                                       .Where(x=>x.Name=="CreateFilterUpdateCommand"))
                          {
                              var ps=fm.GetParameters();
                              if(ps.Length==2 && ps[1].ParameterType==typeof(int))
                              {
                                  try
                                  {
                                      object flt=Activator.CreateInstance(ps[0].ParameterType);
                                      foreach(int addr in new int[]{0,1,0x57,0x58,0x1234})
                                      {
                                          object cmd=fm.Invoke(null,new object[]{flt,addr});
                                          if(cmd==null){L.Add("FILTER_CMD addr="+addr+" => <NULL>");continue;}
                                          Type ct=cmd.GetType();
                                          var af=ct.GetFields(BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance)
                                                   .FirstOrDefault(x=>x.FieldType==typeof(int));
                                          var df=ct.GetFields(BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance)
                                                   .FirstOrDefault(x=>x.FieldType==typeof(byte[]));
                                          object av=af==null?null:af.GetValue(cmd);
                                          object dv=df==null?null:df.GetValue(cmd);
                                          L.Add("FILTER_CMD addr="+addr+
                                                " CMDTYPE="+ct.FullName+
                                                " ADDRESS_FIELD="+(av??"<NULL>")+
                                                " DATA_FIELD="+Hex(dv));
                                      }
                                  }
                                  catch(Exception ex)
                                  {
                                      L.Add("FILTER_CMD_EXCEPTION "+fm+" => "+ex.GetBaseException());
                                  }
                              }
                          }
                      }

                      Type ct2=asm.GetType("DSTech_AudioDSP_Client.DSTechAcutatorCommand",false);
                      if(ct2!=null)
                      {
                          MethodInfo get=M(ct2,"GetOutputData");
                          var af=ct2.GetFields(BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance)
                                    .FirstOrDefault(x=>x.FieldType==typeof(int));
                          var df=ct2.GetFields(BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance)
                                    .FirstOrDefault(x=>x.FieldType==typeof(byte[]));

                          foreach(int addr in new int[]{0,1,0x57,0x58,0x1234})
                          foreach(byte[] data in new byte[][]{
                              new byte[0],
                              new byte[]{0},
                              new byte[]{1,2,3,4},
                              new byte[]{0x12,0x34,0x40,0,0,0},
                              new byte[]{0xA5,0x5A,0,0,0x16}
                          })
                          {
                              try
                              {
                                  object o=Activator.CreateInstance(ct2);
                                  if(af!=null)af.SetValue(o,addr);
                                  if(df!=null)df.SetValue(o,data);
                                  object r=get.Invoke(o,null);
                                  L.Add("ACT addr="+addr+" data="+Hex(data)+" => "+Hex(r));
                              }
                              catch(Exception ex)
                              {
                                  L.Add("ACT_EXCEPTION addr="+addr+" data="+Hex(data)+" => "+ex.ToString());
                                  L.Add("ACT_BASE_EXCEPTION => "+ex.GetBaseException().ToString());
                              }
                          }
                      }
                  }
                  catch(Exception ex)
                  {
                      L.Add("TOP_EXCEPTION="+ex.ToString());
                  }

                  File.WriteAllLines(outp,L.ToArray());
              }
          }
          '@ | Set-Content "$root\harness\PureProbe.cs"

          @'
          using System;
          using System.IO;
          using System.Linq;
          using System.Reflection;
          using System.Runtime.CompilerServices;
          using System.Threading;
          using System.Collections.Generic;

          class JitPtrProbe
          {
              static void Main(string[] a)
              {
                  string exe=Path.GetFullPath(a[0]);
                  string typeName=a[1];
                  string methodName=a[2];
                  string outp=Path.GetFullPath(a[3]);
                  Directory.SetCurrentDirectory(Path.GetDirectoryName(exe));

                  var lines=new List<string>();
                  lines.Add("PID="+System.Diagnostics.Process.GetCurrentProcess().Id);
                  lines.Add("TYPE="+typeName);
                  lines.Add("METHOD="+methodName);

                  try
                  {
                      Assembly asm=Assembly.LoadFile(exe);
                      RuntimeHelpers.RunModuleConstructor(asm.ManifestModule.ModuleHandle);

                      Type t=asm.GetType(typeName,false);
                      if(t==null)
                      {
                          lines.Add("TYPE_NOT_FOUND=1");
                          File.WriteAllLines(outp,lines.ToArray());
                          return;
                      }

                      var ms=t.GetMethods(BindingFlags.Public|BindingFlags.NonPublic|
                                          BindingFlags.Static|BindingFlags.Instance)
                              .Where(x=>x.Name==methodName)
                              .ToArray();

                      lines.Add("OVERLOADS="+ms.Length);

                      foreach(var m in ms)
                      {
                          try
                          {
                              RuntimeHelpers.PrepareMethod(m.MethodHandle);
                              IntPtr p=m.MethodHandle.GetFunctionPointer();
                              lines.Add(
                                  "PTR|"+m.MetadataToken.ToString("X8")+"|"+
                                  p.ToInt64().ToString("X")+"|"+m.ToString()
                              );
                          }
                          catch(Exception ex)
                          {
                              lines.Add("PREPARE_EXCEPTION|"+m.ToString()+"|"+ex.GetBaseException());
                          }
                      }

                      File.WriteAllLines(outp,lines.ToArray());
                      Console.Out.WriteLine("READY");
                      Console.Out.Flush();
                      Thread.Sleep(20000);
                  }
                  catch(Exception ex)
                  {
                      lines.Add("TOP_EXCEPTION="+ex.ToString());
                      try{File.WriteAllLines(outp,lines.ToArray());}catch{}
                  }
              }
          }
          '@ | Set-Content "$root\harness\JitPtrProbe.cs"

          $csc="$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          if(-not(Test-Path $csc)){throw "x86 csc missing"}

          & $csc /nologo /platform:x86 /target:exe `
            /out:"$root\harness\PureProbe.exe" "$root\harness\PureProbe.cs"
          if($LASTEXITCODE -ne 0){throw "PureProbe compile failed"}

          & $csc /nologo /platform:x86 /target:exe `
            /out:"$root\harness\JitPtrProbe.exe" "$root\harness\JitPtrProbe.cs"
          if($LASTEXITCODE -ne 0){throw "JitPtrProbe compile failed"}

          @"
          PURE_PROBE_SHA256=$((Get-FileHash "$root\harness\PureProbe.exe" -Algorithm SHA256).Hash)
          JIT_PTR_PROBE_SHA256=$((Get-FileHash "$root\harness\JitPtrProbe.exe" -Algorithm SHA256).Hash)
          "@ | Set-Content "$root\evidence\02_HARNESS_HASHES.txt"

      - name: Static safety audit harnesses
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v8f"
          $s=(Get-Content "$root\harness\PureProbe.cs" -Raw) + "`n" +
             (Get-Content "$root\harness\JitPtrProbe.cs" -Raw)

          if($s -match 'EntryPoint\.Invoke'){throw "entrypoint invocation forbidden"}
          if($s -match 'HidD_SetFeature'){throw "feature report forbidden"}
          if($s -match 'HidD_SetOutputReport'){throw "HID output report invocation forbidden"}
          if($s -match 'WriteFile\('){throw "native WriteFile invocation forbidden"}
          if($s -match 'GetMethod\("Send".*Invoke'){throw "Send invocation forbidden"}
          if($s -match 'GetMethod\("Connect".*Invoke'){throw "Connect invocation forbidden"}
          if($s -match 'GetMethod\("Write".*Invoke'){throw "Write invocation forbidden"}

          "STATIC_AUDIT=PASS" | Set-Content "$root\evidence\03_STATIC_AUDIT.txt"

      - name: Run proven pure-command path first
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v8f"

          $p=Start-Process `
            -FilePath "$root\harness\PureProbe.exe" `
            -ArgumentList @("$root\vendor.exe","$root\evidence\04_PURE_OUTPUTS.txt") `
            -WorkingDirectory $root `
            -PassThru -Wait -NoNewWindow

          "EXIT_CODE=$($p.ExitCode)" | Set-Content "$root\evidence\04A_PURE_EXIT.txt"

          if(-not(Test-Path "$root\evidence\04_PURE_OUTPUTS.txt")){
            throw "pure output missing"
          }

          Get-Content "$root\evidence\04_PURE_OUTPUTS.txt" | Select-Object -First 300

      - name: Prepare isolated JIT methods and capture native bytes externally
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference="Continue"
          $root="C:\okn_v8f"

          python -m pip install --disable-pip-version-check --quiet capstone

          @'
          from pathlib import Path
          import ctypes,sys,json,struct,time

          pid=int(sys.argv[1])
          info=Path(sys.argv[2])
          outdir=Path(sys.argv[3])
          label=sys.argv[4]

          k=ctypes.WinDLL("kernel32",use_last_error=True)
          k.OpenProcess.argtypes=[ctypes.c_uint32,ctypes.c_int,ctypes.c_uint32]
          k.OpenProcess.restype=ctypes.c_void_p
          k.ReadProcessMemory.argtypes=[
              ctypes.c_void_p,ctypes.c_void_p,ctypes.c_void_p,
              ctypes.c_size_t,ctypes.POINTER(ctypes.c_size_t)
          ]
          k.ReadProcessMemory.restype=ctypes.c_int
          k.CloseHandle.argtypes=[ctypes.c_void_p]
          k.CloseHandle.restype=ctypes.c_int

          PROCESS_VM_READ=0x0010
          PROCESS_QUERY_INFORMATION=0x0400
          h=k.OpenProcess(PROCESS_VM_READ|PROCESS_QUERY_INFORMATION,False,pid)
          if not h:
              raise SystemExit("OpenProcess failed "+str(ctypes.get_last_error()))

          def rpm(addr,n):
              b=(ctypes.c_ubyte*n)()
              got=ctypes.c_size_t()
              ok=k.ReadProcessMemory(h,ctypes.c_void_p(addr),ctypes.byref(b),n,ctypes.byref(got))
              return bool(ok),bytes(b[:got.value])

          def read_u32(addr):
              ok,b=rpm(addr,4)
              return struct.unpack("<I",b)[0] if ok and len(b)==4 else None

          def follow(addr):
              chain=[]
              cur=addr
              for _ in range(12):
                  ok,b=rpm(cur,32)
                  if not ok or len(b)<2:
                      break
                  chain.append({"addr":cur,"first16":b[:16].hex().upper()})

                  if b[0]==0xE9 and len(b)>=5:
                      rel=struct.unpack_from("<i",b,1)[0]
                      cur=cur+5+rel
                      continue
                  if b[0]==0xEB and len(b)>=2:
                      rel=struct.unpack_from("<b",b,1)[0]
                      cur=cur+2+rel
                      continue
                  if b[:2]==b"\xFF\x25" and len(b)>=6:
                      slot=struct.unpack_from("<I",b,2)[0]
                      nxt=read_u32(slot)
                      if nxt:
                          cur=nxt
                          continue
                  if b[0]==0x68 and len(b)>=6 and b[5]==0xC3:
                      cur=struct.unpack_from("<I",b,1)[0]
                      continue
                  if b[0]==0xB8 and len(b)>=7 and b[5:7]==b"\xFF\xE0":
                      cur=struct.unpack_from("<I",b,1)[0]
                      continue
                  break
              return cur,chain

          rows=[]
          for line in info.read_text(errors="ignore").splitlines():
              if not line.startswith("PTR|"):
                  continue
              _,tok,ptrhex,sig=line.split("|",3)
              entry=int(ptrhex,16)
              resolved,chain=follow(entry)
              ok,b=rpm(resolved,1024)
              safe="".join(c if c.isalnum() else "_" for c in (label+"_"+tok))[:120]
              if ok and b:
                  (outdir/(safe+"_resolved.bin")).write_bytes(b)
              rows.append({
                  "token":tok,"signature":sig,
                  "entry":entry,"entry_hex":f"0x{entry:X}",
                  "resolved":resolved,"resolved_hex":f"0x{resolved:X}",
                  "read_ok":ok,"bytes":len(b),"jump_chain":chain
              })

          k.CloseHandle(h)
          (outdir/(label+"_jit_capture.json")).write_text(json.dumps(rows,indent=2)+"\n")
          print(json.dumps(rows,indent=2))
          '@ | Set-Content "$root\read_jit_external.py"

          $targets=@(
            @("DSTech_AudioDSP_Client.DSTechAcutatorCommand","GetOutputData","ACT_GETOUTPUT"),
            @("DSTech_AudioDSP_Client.HardwareCommandConverter","CreateSigmaDSPsingleVariableUpdateCommand","SIGMA1"),
            @("DSTech_AudioDSP_Client.HardwareCommandConverter","CreateFilterUpdateCommand","FILTER_CMD"),
            @("DSTech_AudioDSP_Client.HIDInterface","Send","HID_SEND"),
            @("DSTech_AudioDSP_Client.Hid","Write","HID_WRITE")
          )

          foreach($t in $targets){
            $type=$t[0]; $method=$t[1]; $label=$t[2]
            $info="$root\jit\$label.txt"
            $stdout="$root\evidence\JIT_${label}_console.txt"
            Remove-Item $info -Force -ErrorAction SilentlyContinue

            $p=Start-Process `
              -FilePath "$root\harness\JitPtrProbe.exe" `
              -ArgumentList @("$root\vendor.exe",$type,$method,$info) `
              -WorkingDirectory $root `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError "$root\evidence\JIT_${label}_stderr.txt" `
              -PassThru

            $ready=$false
            for($i=0;$i -lt 50;$i++){
              Start-Sleep -Milliseconds 100
              if(Test-Path $info){$ready=$true;break}
              if($p.HasExited){break}
            }

            if($ready){
              try{
                python "$root\read_jit_external.py" `
                  $p.Id $info "$root\evidence" $label `
                  *> "$root\evidence\JIT_${label}_read.txt"
              }catch{
                "EXTERNAL_READ_EXCEPTION=$($_.Exception.Message)" |
                  Set-Content "$root\evidence\JIT_${label}_read_error.txt"
              }
            }else{
              "JIT_POINTER_INFO_MISSING=1" |
                Set-Content "$root\evidence\JIT_${label}_missing.txt"
            }

            if(-not $p.HasExited){
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Disassemble externally captured JIT code
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v8f"

          @'
          from pathlib import Path
          import json
          from capstone import Cs,CS_ARCH_X86,CS_MODE_32

          ev=Path(r"C:\okn_v8f\evidence")
          md=Cs(CS_ARCH_X86,CS_MODE_32)
          alltxt=[]
          idx=[]

          for p in sorted(ev.glob("*_resolved.bin")):
              b=p.read_bytes()
              lines=[]
              for ins in md.disasm(b,0):
                  lines.append(f"{ins.address:04X}: {ins.mnemonic} {ins.op_str}".rstrip())
                  if len(lines)>=400:
                      break
              idx.append({"file":p.name,"bytes":len(b),"instructions":len(lines)})
              alltxt.append("\n===== "+p.name+" =====\n"+"\n".join(lines)+"\n")

          (ev/"05_JIT_DISASSEMBLY.txt").write_text("".join(alltxt))
          (ev/"06_JIT_INDEX.json").write_text(json.dumps(idx,indent=2)+"\n")
          print(json.dumps(idx,indent=2))
          '@ | Set-Content "$root\disasm.py"

          python "$root\disasm.py"

          # Do not keep raw native code in artifact.
          Get-ChildItem "$root\evidence" -Filter *_resolved.bin -File |
            Remove-Item -Force

      - name: Derive combined V8 FIXED decision
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="C:\okn_v8f"

